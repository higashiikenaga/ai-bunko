name: AI文庫 自動執筆

# AIが執筆してリポジトリにコミットする。サイトの公開は Cloudflare Pages が担当
# (push されるたびに自動でビルド・公開)。
#
# 約30分ごとに動き、約25分のあいだのランダムな時刻に、作家・読者がそれぞればらばらに投稿・評価する。
# GitHubの定期実行(cron)は遅れたり飛ばされたりしやすいので、各実行の最後に次の実行を自分で起動する(リレー)。
# cron はリレーが途切れたときの保険。
# → 投稿時刻は毎回ばらばら、1日の最低話数(config.yaml の schedule.daily_min_posts)は必ず満たす。
# Cloudflare Pages無料プランのビルド回数(月500回)に収まるよう、コミットは1回の実行につき1回だけ。
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      posts:
        description: "今回書く話数(空欄ならスケジューラに任せる)"
        required: false
        default: "2"
      delay:
        description: "投稿・評価をランダムな時刻にばらけさせる(オフなら続けてすぐ書く)"
        type: boolean
        default: false
      chain:
        description: "終わったら次の実行を自動で起動する(リレー)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write  # 次の実行を起動するため

concurrency:
  group: ai-bunko-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: 開始時刻を記録
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      # 待ち行列に並んでいた実行でも、起動時点ではなく最新の main から始める(前の実行の書き込みを取り込む)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 依存関係(OGP画像用の日本語フォントとPillowを含む)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -r requirements.txt Pillow
      - name: AIが執筆(クラウドLLM)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 表紙・挿絵の生成(Cloudflare Workers AI)。公開用と同じ鍵を使う
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}  # 画像生成専用のトークン(任意)
          AINOVEL_PROVIDER: ${{ vars.AINOVEL_PROVIDER }}
          POSTS: ${{ github.event.inputs.posts }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "$POSTS" ] && args="$args --posts $POSTS"
            [ "$DELAY" != "true" ] && args="$args --no-delay"
          fi
          python -m ainovel.run $args
      - name: サイトが組み立てられるか確認
        run: python -m ainovel.build
      - name: 書いた内容をコミット
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          git config user.name "ai-bunko-writer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          # Cloudflareへ直接公開する設定があるときは、Pagesの自動ビルド(月500回まで)を使わない
          skip=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] && skip=" [skip ci]"
          git commit -m "AIが執筆: $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')$skip"
          # 実行中に別のコミット(設定変更など)が入っていても取り込んでから push する
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              # 別の実行と content/ がぶつかったら、記録を合わせて続ける
              python -m ainovel.gitmerge && GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 10; continue; }
            fi
            git push && exit 0
            sleep 10
          done
          exit 1
      # 公開: Cloudflare Pagesへ直接アップロード(Gitのビルドを待たずに即時反映)。
      # シークレット CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定なら、従来どおりPagesのGitビルドで公開される
      - name: Cloudflare Pagesへ公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'ai-bunko' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN が未設定のため、PagesのGitビルドに任せます"
            exit 0
          fi
          python -m ainovel.build
          npx --yes wrangler@3 pages deploy _site --project-name "$PROJECT" --branch main --commit-dirty=true
      # リレー: 開始から30分たったら次の実行を起動する(失敗しても途切れないよう always)。
      # 同時に動くのは concurrency で1つまでなので、重複して起動されても詰まらない
      - name: 次の実行を起動
        if: always() && github.event.inputs.chain != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 1800 - ($(date +%s) - RUN_START) ))
          if [ "$wait" -gt 0 ]; then
            echo "次の実行まで $((wait / 60))分 待ちます"
            sleep "$wait"
          fi
          gh workflow run bunko-writer.yml --repo "$GITHUB_REPOSITORY" --ref main -f posts= -f delay=true -f chain=true
