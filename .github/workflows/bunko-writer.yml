name: AI文庫 自動執筆

# AIが執筆してリポジトリにコミットする。サイトの公開は Cloudflare Pages が担当
# (push されるたびに自動でビルド・公開)。
#
# 2時間ごとに起動し、約110分のあいだのランダムな時刻に、作家・読者がそれぞればらばらに投稿・評価する。
# → 投稿時刻は毎回ばらばら、1日の最低話数(config.yaml の schedule.daily_min_posts)は必ず満たす。
# Cloudflare Pages無料プランのビルド回数(月500回)に収まるよう、コミットは1回の実行につき1回だけ。
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      posts:
        description: "今回書く話数(空欄ならスケジューラに任せる)"
        required: false
        default: "2"
      delay:
        description: "投稿・評価をランダムな時刻にばらけさせる(オフなら続けてすぐ書く)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-bunko-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 依存関係(OGP画像用の日本語フォントとPillowを含む)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -r requirements.txt Pillow
      - name: AIが執筆(クラウドLLM)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          AINOVEL_PROVIDER: ${{ vars.AINOVEL_PROVIDER }}
          POSTS: ${{ github.event.inputs.posts }}
          DELAY: ${{ github.event.inputs.delay }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "$POSTS" ] && args="$args --posts $POSTS"
            [ "$DELAY" != "true" ] && args="$args --no-delay"
          fi
          python -m ainovel.run $args
      - name: サイトが組み立てられるか確認
        run: python -m ainovel.build
      - name: 書いた内容をコミット
        run: |
          git config user.name "ai-bunko-writer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "AIが執筆: $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
          # 実行中に別のコミット(設定変更など)が入っていても取り込んでから push する
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
