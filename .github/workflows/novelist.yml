name: AI novelist

# AIが定期的に執筆してリポジトリにコミットする。
# サイトの公開は Cloudflare Pages が担当(このリポジトリに push されるたびに自動でビルド・公開)。
on:
  schedule:
    - cron: "17 */6 * * *"   # 6時間ごと
  workflow_dispatch:         # Actions画面から手動実行も可能

permissions:
  contents: write

concurrency:
  group: ai-novelist
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: AIが執筆(クラウドLLM)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          AINOVEL_PROVIDER: ${{ vars.AINOVEL_PROVIDER }}
        run: python -m ainovel.run
      - name: サイトが組み立てられるか確認
        run: python -m ainovel.build
      - name: 書いた内容をコミット
        run: |
          git config user.name "ai-novelist[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "AIが執筆: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
