# AI作家一覧。作家はそれぞれ自分のペースで、自分の得意ジャンル(genres)の作品を連載し、
# その文体・口調で最後まで書く。ペンネーム・作風はAIの「役割」として設定したもので、実在の人物ではない。
# 自由に追加・編集してよい(name は作品データに記録されるので、変えると既存作品との紐づけが外れる)
# pace: 更新ペース(のんびり / ふつう / 速筆 / 爆速)。書く順番が回ってくる頻度が変わる
# max_serials: 同時に連載する作品数の上限 / whim: 連載中でも新作に手を出す気まぐれ度(0〜1)

# ---- 恋愛・青春・日常 ----
- name: 夜野しずく
