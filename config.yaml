site:
  title: AI文庫
  description: AIで書いた小説だけを投稿できる小説サイト。AI生成の度合いを作品ごとに申告・表示します。
  # 公開URL(OGP・RSSのリンクに使用)。Cloudflare Pagesの環境変数 SITE_URL があればそちらを優先
  url: https://ai-bunko.pages.dev
  # 運営・連絡先(フッターと「このサイトについて」に表示)。通報の受付先でもある
  contact:
    github: higashiikenaga
    x: kondohitorigoto
  google_site_verification: w-fArMycvbKR5ibay7NIltWvew68SpoWSDcGTl8hSz8

# 投稿ルール
submit:
  title_max: 60
  author_max: 30
  premise_max: 400
  tools_max: 100
  chapter_title_max: 80
  chapter_min_chars: 200
  chapter_max_chars: 40000
  max_chapters_per_work: 300
  daily_limit_per_person: 10     # 1人(接続元のハッシュ)が1日に投稿できる話数

# AI生成のゾーニング。投稿者が作品ごとに申告し、作品カード・作品ページ・各話に表示する。
# 一覧では区分ごとに表示/非表示を切り替えられ、区分別のページもある。
zones:
  - key: full
    label: 全文AI
    short: 全AI
    color: "#2563eb"
    desc: 本文はAIの出力そのまま。人間が行ったのは指示・取捨選択と、誤字脱字や体裁の修正まで。
  - key: revised
    label: AI+人間の手直し
    short: AI+手直し
    color: "#0d9488"
    desc: AIが書いた文章をベースに、人間が加筆・修正・構成の入れ替えをした。AI由来の文章が過半。
  - key: coauthor
    label: AI主体の共作
    short: 共作
    color: "#9333ea"
    desc: 人間が書いた部分を含むが、AIが生成した文章が半分以上を占める。

# 全年齢向けサイトのための表現チェック。投稿に次の語が含まれると投稿を拒否する(投稿者に該当の語を知らせる)。
# ビルド時にも同じ語で伏字(○)にするので、後から語を足すと過去の作品にも反映される。
# 語の一致だけを見る最低限の仕組み(言い換えや文脈は判定できない)。誤検出が出る語は外し、足りない語は足して調整する。
# 全角/半角・ひらがな/カタカナの違い、語の途中に挟んだ空白や記号は無視して照合する。
moderation:
  sexual:   # 性的な直接表現
    - セックス
    - 性交
    - 強姦
    - 輪姦
    - レイプ
    - 中出し
    - 射精
    - 勃起
    - 膣内
    - 陰茎
    - 陰核
    - 乳首
    - 乳房を揉
    - 自慰
    - オナニー
    - フェラ
    - 愛液
    - 絶頂を迎え
    - エロ小説
    - 官能
    - 淫語
  gore:     # 過度に残虐・猟奇的な表現
    - 脳漿
    - 臓物
    - はらわた
    - 内臓が飛び
    - 内臓を引き
    - 肉片
    - 惨殺
    - 猟奇殺人
    - 生首
    - 四肢を切断
    - 眼球をえぐ
    - 眼球を抉
    - 腸を引きずり
    - 血しぶきを浴び

genres:
  - 異世界ファンタジー
  - SF
  - 本格ミステリー
  - 青春恋愛
  - ホラー
  - 歴史・時代小説
  - スチームパンク冒険
  - ヒューマンドラマ
  - ディストピア
  - 日常ほのぼの
  - サイバーパンク
  - 群像劇
