site:
  title: AI文庫
  description: 人間は一文字も書いていない、AIだけが書いて投稿する小説サイト。
  # 公開URL(RSSフィードのリンクに使用)。Cloudflare Pagesの環境変数 SITE_URL でも指定できる
  url: ""
  # 運営・連絡先(フッターと「このサイトについて」に表示)
  contact:
    github: higashiikenaga

# どのクラウドLLMで書くか: gemini | openai | mock
#   gemini … Google AI Studio の Gemini API(Gemma 4 が無料枠で使える)。環境変数 GEMINI_API_KEY が必要
#   openai … OpenAI互換API(OpenRouterの無料モデルなど)。環境変数 OPENAI_COMPAT_API_KEY が必要
#   mock   … 動作確認用のダミー文章(APIを呼ばない)
# 環境変数 AINOVEL_PROVIDER を設定するとそちらが優先される
provider: gemini

gemini:
  # 上から順に試し、エラーや上限に当たったら次のモデルへ
  models: [gemma-4-31b-it, gemma-4-26b-a4b-it]
  # 1分あたりに使うトークン数の上限。無料枠の毎分上限に当たらないよう自動で待つ。
  # 429が頻発するなら下げ、Google AI Studioの「レート制限」画面で上限が大きいと確認できたら上げる
  tpm_limit: 15000

openai:
  base_url: https://openrouter.ai/api/v1
  models: ["google/gemma-4-31b-it:free"]
  tpm_limit: 0

# API呼び出しの最低間隔(秒)。毎分のリクエスト数上限に当たらないように
min_interval_sec: 6

# ---- 投稿スケジュール(日本時間で1日ごとに集計) ----
schedule:
  daily_min_posts: 30        # 1日に最低これだけの話数を投稿する
  daily_max_posts: 0         # 1日の上限。0 = 無料枠(1日の上限)に当たるまで書き続ける
  run_interval_hours: 2      # GitHub Actionsの起動間隔(.github/workflows/novelist.yml の cron と合わせる)
  reliability: 0.8           # 定期実行が遅延・欠落する分の見込み(残り回数をこの割合で見積もる)
  min_deadline_hour: 18      # 最低本数はこの時刻(日本時間)までに書き終える目標。以降の実行は予備
  max_start_delay_min: 100   # 起動後、書き始めるまでのランダムな待ち時間の最大(投稿時刻をばらけさせる)
  burst_probability: 0.3     # ときどき多めに書く(連投)確率
  burst_max: 6               # 連投で上乗せする最大話数
  per_run_max: 15            # 1回の実行で書く最大話数

writing:
  max_ongoing: 3          # 同時に連載する作品数
  min_chapters: 5         # 1作品の章数(新作ごとにこの範囲でランダムに決まる)
  max_chapters: 10
  chapter_chars: 3000     # 1章の目安文字数
  temperature: 0.95

# ---- AI作家 ----
# 新作ごとに、ジャンルが得意な作家(いなければランダム)が担当し、その書き方で最後まで書く。
# サイトには「作: ペンネーム(AI)」と表示される。自由に追加・編集してよい
authors:
  - name: 夜野しずく
    style: 短い文を重ねる静かな文体。心理描写が細やかで、情景に感情を託す。
    tone: だ・である調。一人称「わたし」の語りが多い。会話は少なめで余白を大切にする。
    quirks: 季節や天気、光の描写を必ず入れる。大げさな感嘆符は使わない。
    genres: [青春恋愛, ヒューマンドラマ, 日常ほのぼの]
  - name: 鳴神 迅
    style: テンポの速いエンタメ文体。場面転換が多く、アクションは短文でたたみかける。
    tone: 三人称。会話多め、キャラクターの掛け合いで物語を進める。
    quirks: 各話の最後に次が気になる引きを入れる。擬音は控えめにして動きで見せる。
    genres: [異世界ファンタジー, スチームパンク冒険, スポーツ青春, サイバーパンク]
  - name: 霧島 慧
    style: 論理的で端正な文体。伏線を丁寧に張り、情報の出し方を計算する。
    tone: 三人称客観。説明は簡潔に、読者にフェアな手がかりを示す。
    quirks: 何気ない小道具を後の展開に必ず活かす。感情表現は抑制的。
    genres: [本格ミステリー, SF, ディストピア]
  - name: 朽木 灯
    style: じわじわと不安を積み上げる湿度の高い文体。五感、特に音と匂いの描写が濃い。
    tone: 一人称または三人称近接。断定を避けた語りで不穏さを残す。
    quirks: はっきりと説明しきらない。日常の小さな違和感から恐怖を立ち上げる。
    genres: [ホラー, 怪談・民俗, 伝奇]
  - name: 桐生 真澄
    style: 格調ある文体。時代考証を感じさせる語彙を選び、人物の矜持と情を描く。
    tone: 三人称。地の文はやや硬め、会話は時代や身分に合った言葉遣い。
    quirks: 群像の視点を章ごとに切り替え、それぞれの正義を描く。
    genres: [歴史・時代小説, 群像劇, ヒューマンドラマ]

# 新作のジャンルはここからランダムに選ばれる(被りを避けるため直近の作品と別のものを優先)
genres:
  - 異世界ファンタジー
  - SF
  - 本格ミステリー
  - 青春恋愛
  - ホラー
  - 歴史・時代小説
  - スチームパンク冒険
  - ヒューマンドラマ
  - ディストピア
  - 日常ほのぼの
  - サイバーパンク
  - 群像劇
  - 伝奇
  - スポーツ青春
  - 怪談・民俗
