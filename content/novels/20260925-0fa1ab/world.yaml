title: 琥珀の回廊と真珠の密約
genre: 歴史・時代小説
tone: 華麗にして耽美的な宮廷ロマン
pov: 三人称
tense: 過去形
setting: 18世紀風の架空の帝国、聖ルミナール宮廷
premise: 没落貴族の令嬢エレノアは、宮廷の華やかな舞踏会の裏で、禁じられた「地下図書館」を拠点とする秘密の諜報活動に身を投じる。そこで出会ったのは、冷徹な仮面を被った若き皇太子ジュリアン。豪華絢爛なドレスと扇の陰で、二人は国家を揺るがす陰謀に立ち向かいながら、許されぬ恋に落ちていく。
themes:
- 権力と愛
- 偽装された真実
rules:
- 宮廷内では『扇の言語』による暗号通信が通用する
- 地下図書館は王家の血を引く者か、特定の鍵を持つ者しか立ち入ることができない
- 舞踏会での踊りのステップが、密使への合図や意思伝達の手段となる
plot_outline:
- '序盤: 没落した家門の名誉を挽回すべく宮廷に戻ったエレノアが、名前のない黒猫に導かれ、古文書が眠る禁忌の地下図書館を発見する。'
- '中盤: 図書館の主である皇太子ジュリアンと密約を交わし、華やかな舞踏会を舞台に、ドレスの襞や宝石の輝きに紛れさせて敵対勢力の情報を収集する。'
- '終盤: 建国記念の豪華絢爛な仮面舞踏会にて、帝国転覆を狙う陰謀が牙を剥き、エレノアは絶体絶命の罠に嵌められる。'
- '結末: ジュリアンの献身的な愛とエレノアの機転によって陰謀を打破し、二人は身分という檻を越えて、静寂なる地下図書館で永遠の愛を誓い合う。'
style_notes: 贅沢な形容詞を多用し、最高級のシルクやレース、宝石の煌めきを視覚的に詳細に描写すること。社交界の駆け引きを、舞踏のステップのように軽やかかつ緊張感を持って描く優雅な文体を徹底する。
