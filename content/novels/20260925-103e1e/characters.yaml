- name: エリオス・ルミナス
  role: 主人公
  age: 19
  gender: 男性
  appearance: 色素の薄い髪に知的な眼鏡をかけた、線が細い青年。指先には常に古書を扱っているためインクの汚れがついている。
  personality: 内向的で慎重だが、知識への好奇心と正義感は人一倍強い。一人称は「僕」。
  speech_style: 丁寧で控えめな口調。専門的な知識を語る際は熱を帯びる。
  background: 辺境の古都で「忘却の書架」という古本屋を営む店主の弟子。幼い頃から書物の中にのみ居場所を見出していた。
  motivation: 滅びゆく世界の理を解き明かし、誰もが絶望せずに済む新しい歴史を書き記すこと。
  relationships:
  - name: リアン
    relation: 信頼し合う旅の同行者であり、守護者
  - name: ヴァレリウス
    relation: 思想的に対立する追撃者
  arc: 受動的な「記録者」から、自らの意志で世界の結末を選択し、神話に終止符を打つ「物語の完結者」へと成長する。
- name: リアン・アルトワーズ
  role: 相棒
  age: 24
  gender: 女性
  appearance: 鋭い眼差しを持つ銀髪の騎士。機能性を重視した軽装の鎧を纏い、使い込まれた大剣を背負っている。
  personality: 厳格で責任感が強いが、内面には情に厚い一面を隠している。一人称は「私」。
  speech_style: 簡潔で断定的な軍人口調。時折、エリオスの世間知らずな言動に呆れた溜息をつく。
  background: 元帝国騎士団のエリートだったが、異端審問官による非道な弾圧に疑問を抱き、騎士の身分を捨てて逃亡していた。
  motivation: 失われた騎士道精神を取り戻し、弱き者を守り抜くことで自らの誇りを再構築すること。
  relationships:
  - name: エリオス
    relation: 最初は保護対象だったが、次第に精神的な対等なパートナーとして認める
  arc: 組織への忠誠心という呪縛から解き放たれ、自分自身の意志で誰を守るべきかを選択できるようになる。
- name: ヴァレリウス・クロムウェル
  role: 敵役
  age: 48
  gender: 男性
  appearance: 黒い法衣に身を包んだ痩身の男。冷酷な光を宿した瞳と、常に不敵な笑みを浮かべる薄い唇が特徴。
  personality: 冷徹で傲慢。世界の崩壊を「神による選別」と捉え、秩序ある滅びを信奉している。一人称は「私」。
  speech_style: 慇懃無礼で、相手を精神的に追い詰めるような婉曲的な言い回しを好む。
  background: 帝国異端審問官の最高責任者。残響魔法を独占することで、選ばれた人間のみが生き残る新世界を構築しようと企んでいる。
  motivation: 禁書を手に入れ、「神の玉座」の力を利用して自らが新世界の調律者となること。
  relationships:
  - name: エリオス
    relation: 排除すべき異端者であり、同時に禁書の鍵となる便利な道具
  arc: 絶対的な理（神）への心酔が、人間としての意志を持つエリオスに打ち砕かれ、絶望の中で消滅する。
- name: リラ
  role: ガイド役
  age: 外見は16歳前後
  gender: 女性
  appearance: 半透明の淡い光を纏った少女。衣服は星屑を散りばめたような幻想的なドレスを着用している。
  personality: 天真爛漫で捉えどころがない。時折、数千年前の記憶を思い出したように深く悲しげな表情を見せる。一人称は「私」。
  speech_style: 詩的で比喩の多い話し方。現代の言葉とは異なる古風な言い回しが混ざる。
  background: 禁書の中に封印されていた「神の詠唱」の断片が擬人化した存在。世界の記憶を司る生きた索引。
  motivation: 神話の時代を正しく完結させ、自分という「残響」が完全に消え去る瞬間を見届けること。
  relationships:
  - name: エリオス
    relation: 自分の物語を読み解き、結末を付けてくれる唯一の読者
  arc: ただの記録の断片から、エリオスとの交流を通じて「個」としての感情を獲得し、自ら消滅することを受け入れる。
