title: 神蝕の刻譜と忘却の書架
genre: 異世界ファンタジー
tone: 重厚、神話的、哀愁漂う王道ハイファンタジー
pov: 三人称
tense: 過去形
setting: 魔法の残響が枯渇しつつある黄昏の大陸、エルドリア。辺境の古都ルミナスにある、禁書を扱う古本屋「忘却の書架」。
premise: 万物が「神の詠唱」によって編まれた世界において、魔法は「残響」としてのみ存在する。辺境の古本屋で働く青年エリオスは、ある日、頁の余白に星図が隠された禁書を手にする。それは、失われた神の玉座へと至る「秘密の地図」であった。彼は、滅びゆく世界の理を書き換えるため、神話の終焉を巡る過酷な旅へと身を投じていく。
themes:
- 文明の終焉と継承
- 運命への抗い
- 物語が持つ力
rules:
- 魔法は世界の記憶の残滓であり、過剰な行使は術者の存在を歴史から抹消する
- 古書は概念を封じ込める器であり、特定の条件下で物理的な干渉力を持つ
- 「秘密の地図」は、星の配置と地上の理が一致する瞬間にのみ真実を映し出す
plot_outline:
- '序盤: 古本屋で働くエリオスが、星光を放つ禁書を発見。帝国異端審問官の追撃を受け、女騎士リアンと共に逃亡を開始する。'
- '中盤: 地図の解読のため、古代文明の遺跡や詩が刻まれた断崖を巡る旅。世界の理が崩壊する真の理由が、神々の沈黙に隠されていることを知る。'
- '終盤: 地図の終着点「天球の回廊」へ到達。世界の再構築には、神話の時代の終焉と、魔法の完全なる消滅が必要であることを突きつけられる。'
- '結末: エリオスは神の旋律を「語り継がれる物語」へと昇華させ、神話の時代を完結させる。魔法は消え去るが、人間が自らの意志で歩む、新たな歴史の幕が上がる。'
style_notes: 重厚な王道ハイファンタジーの文体。神話的で格調高い地の文を用い、地名や固有名詞には歴史的な響きを持たせる。章の冒頭には、その章のテーマを象徴する、作中伝承の詩や断片を引用すること。会話は、キャラクターの出自や教養に応じた独特の口調を徹底し、安易な現代語は一切排除する。
