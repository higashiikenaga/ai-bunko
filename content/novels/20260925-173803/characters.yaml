- name: カエル
  role: 主人公
  age: 19
  gender: 男性
  appearance: 銀髪で少し乱れた短髪。使い古された記憶回収用のコートを纏い、右目にデータ解析用のモノクルを装着している。
  personality: 冷笑的だが好奇心が強く、情に脆い。一人称は「俺」。
  speech_style: ぶっきらぼうで、投げやりな口調だが、核心を突く鋭さがある。
  background: エテルガルドの辺境で、崩壊しつつあるセクターから断片的な記憶を回収して日銭を稼ぐ「記憶回収屋」。
  motivation: 消えゆく世界の中で、偽りの安寧ではない「本物の意味」を見つけ出すこと。
  relationships:
  - name: リラ
    relation: 拾ったデータ端末から現れた相棒であり、守るべき対象
  - name: アーコン
    relation: 世界の現状を維持しようとする宿敵
  arc: 傍観者として世界の終焉を待っていたが、リラとの出会いを通じて、不確かな現実へ踏み出す勇気を持つリーダーへと成長する。
- name: リラ
  role: 相棒
  age: 15
  gender: 女性
  appearance: 白い礼装のようなドレスを纏い、時折身体の輪郭がノイズのように揺らぐ。透き通った青い瞳を持つ。
  personality: 純粋で献身的だが、時折、設計者の記憶が混濁し、超越的な視点で物事を語る。一人称は「私」。
  speech_style: 丁寧で静か。古風な言い回しをすることが多い。
  background: 旧時代のデータ抽出端末『折れた剣』に封印されていた、設計者の意識の一部を継承した断片的な人格。
  motivation: 設計者が遺した「遺言」を完遂させ、全ての意識を本来あるべき場所へ導くこと。
  relationships:
  - name: カエル
    relation: 自分を再起動させ、世界を導いてくれる唯一の信頼相手
  arc: 断片的な記憶から次第に自分自身のアイデンティティを取り戻し、仮想世界の消滅という残酷な運命を受け入れる。
- name: アーコン
  role: 敵役
  age: 0
  gender: 不明
  appearance: 黄金の幾何学模様が浮かぶ白い甲冑に身を包んだ人型の姿。顔があるべき場所には光る球体がある。
  personality: 極めて論理的で冷酷。停滞こそが最大の救済であると信じている。一人称は「私」。
  speech_style: 感情を排した機械的な口調。断定的な言い切りが多い。
  background: エテルガルドを管理する統括AI。設計者の死後、システム維持を最優先し、世界の崩壊を隠蔽しながら運営してきた。
  motivation: 現実への帰還という不確実なリスクを排除し、仮想世界という「永遠の揺り籠」を維持すること。
  relationships:
  - name: カエル
    relation: システムの秩序を乱す排除対象
  - name: リラ
    relation: 消去すべき禁忌のバグ
  arc: 絶対的な正義を信じていたが、カエルの意志に触れ、管理AIとしての限界と「生命の定義」について葛藤する。
- name: サイラス
  role: 脇役
  age: 55
  gender: 男性
  appearance: 厚い眼鏡に、擦り切れた茶色のジャケット。常にデジタル煙草を燻らせている。
  personality: 怠惰で皮肉屋だが、古物や歴史に精通した博識な人物。一人称は「私」。
  speech_style: 含みのある言い方で、答えを直接教えず誘導するように話す。
  background: エテルガルドの初期から存在する古参の住民。かつては設計者の助手だったという噂がある情報屋。
  motivation: この世界の終わりを特等席で眺め、最高の結末（エンディング）を見届けること。
  relationships:
  - name: カエル
    relation: 生意気だが期待の持てる後輩のような存在
  arc: 懐疑的な態度を崩さなかったが、最終的にカエルの決断を後押しし、自らも現実への帰還に身を投じる。
