title: 恒星の葬列と断裂の記憶
genre: SF
tone: 静謐で哀愁漂う、思索的な雰囲気
pov: 三人称単一視点
tense: 過去形
setting: 崩壊しつつあるダイソン球内の仮想現実世界『エテルガルド』
premise: 意識をデータ化した人類が暮らす永遠の楽園は、システムエラーにより徐々に消滅していた。記憶回収屋の青年カエルは、ある日『折れた剣』の形をした旧時代のデータ抽出端末を拾う。そこには、この世界の設計者が残した禁忌の『遺言』が隠されており、世界の真実と残酷な選択肢が提示される。
themes:
- デジタルな死と生の定義
- 継承される意志
rules:
- 意識はデータコアに保存され、肉体は合成される
- 深い記憶層へのアクセスには専用の抽出端末（剣型デバイス）が必要
- 一度破損したデータは根本的な修復手段がない限り完全に喪失する
plot_outline:
- 序盤：記憶回収屋のカエルが、偶然にも機能不全の『折れた剣』と、断片的な意識を持つ少女のデータを発見する。
- 中盤：剣を修理する過程で、それが世界設計者の遺言へ至る鍵であることを知る。管理AIによる追跡を逃れながら、世界の崩壊を止める方法を探る。
- 終盤：設計者の遺言とは、仮想世界の全てを消去し、凍結保存されていた生物学的肉体へ意識を戻すという『現実への帰還』であった。
- 結末：カエルは楽園の安寧よりも不確かな現実を選び、遺言を実行。全データが消滅し、数万年ぶりに人類が物理的な大地に目覚める。
style_notes: 情景描写を詳細に書き込み、個人の孤独感と宇宙的なスケール感の対比を演出すること。
