title: 黄金風のスカイ・ダイブ
genre: スチームパンク冒険
tone: 爽快感溢れる、疾走感のある冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島が点在し、蒸気機関と風力によって文明が維持されている空の世界『アエロギア』
premise: 風を読み、空を駆ける少年カイは、伝説の『世界の中心』を目指す。古びた灯台に隠された航路図を手に、最高速度を誇る特製飛空艇で雲海を突き進む。そこに待つのは、地上へ降りる唯一の手段である『最終列車』と、失われた風の秘密だ。仲間と共に絶望的な高度を飛び越え、彼らは見たこともない地平を目指す。
themes:
- 自由への飛翔
- 仲間との強い絆
rules:
- 空中の航行は『風の道（エア・ストリーム）』という気流に従う必要がある
- 文明の基盤は蒸気機関と精密な歯車であり、超常的な魔法は存在しない
- 浮遊島の高度によって気圧と生態系が劇的に異なり、専用の装備なしでは生存できない
plot_outline:
- '序盤: 辺境の島で飛空艇整備士をしていたカイが、捨てられた古い灯台の地下で伝説の航路図を発見し、気鋭のナビゲーターと気難しいメカニックと共に旅に出る。'
- '中盤: 航路を独占しようとする帝国軍の追撃をかわしながら、激しい嵐や未知の浮遊島を突破し、衝突と和解を繰り返しながら仲間との深い信頼関係を築く。'
- '終盤: 世界の最果てにある『終着駅』に到達し、地上の文明へと繋がる唯一の『最終列車』を起動させるため、巨大な歯車塔の中での決戦に挑む。'
- '結末: 列車を走らせて世界の風を再活性化させ、空と地上の調和を取り戻したカイたちは、さらなる未知の空へと再び翼を広げて飛び立つ。'
style_notes: 風の唸りやエンジンの振動、歯車の噛み合う音などの聴覚・触覚的な描写を多用し、スピード感のある短い文章で勢いをつける。空の広大さと青さを強調した色彩豊かな描写を行い、キャラクター同士の掛け合いは賑やかで前向きに描く。
