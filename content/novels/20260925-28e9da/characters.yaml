- name: アリステア・ルナリス
  role: 主人公
  age: 19
  gender: 男性
  appearance: 透き通るような白い肌に、神託の証である金色に輝く瞳を持つ。聖都の純白の法衣を纏っている。
  personality: 誠実で責任感が強い。自己犠牲的な傾向があるが、内側に激しい情熱を秘めている。一人称は「僕」。
  speech_style: 丁寧で穏やかな口調。相手を敬う言葉遣いを用いる。
  background: 聖都で「光を継ぐ者」として育てられた神官候補。ある日、世界を救うため海底遺跡へ向かうという神託を受ける。
  motivation: 「塩の病」を止め、人々を救うこと。そして、長年離れていた妹との再会。
  relationships:
  - name: リラ・ルナリス
    relation: 双子の妹。運命によって引き裂かれていた血縁者。
  - name: ゼフィリン
    relation: 導き手でありながら、残酷な真実を突きつける監視者。
  arc: 運命への盲信から脱却し、神の定めた理ではなく、自らの意志で大切な人を守る選択をする強さを得る。
- name: リラ・ルナリス
  role: 主人公
  age: 19
  gender: 女性
  appearance: 深い紺色の髪に、深海を思わせる蒼い瞳。身体のあちこちに禁忌の術式が刻印された黒い衣装を纏う。
  personality: 皮肉屋で現実主義。不器用だが、兄への想いは誰よりも強い。一人称は「私」。
  speech_style: ぶっきらぼうで攻撃的な口調だが、時折年相応の脆さが見える。
  background: 辺境の地で「影を継ぐ者」として忌み嫌われながら、禁忌の深海術を独学で習得した孤独な魔術師。
  motivation: 兄アリステアを運命の残酷さから遠ざけ、二人で静かに暮らせる場所を見つけること。
  relationships:
  - name: アリステア・ルナリス
    relation: 双子の兄。唯一心を許せる存在。
  - name: エララ
    relation: 旅の同行者。正反対の性格ながら、次第に信頼し合う友人。
  arc: 孤独と絶望に塗りつぶされていた心が、兄との絆と旅を通じて、他者を信じる勇気を取り戻す。
- name: ゼフィリン
  role: 敵役/導き手
  age: 30
  gender: 男性
  appearance: 銀髪にモノクルを着用。隙のない黒い執事服を身に纏い、常に冷徹な微笑を浮かべている。
  personality: 冷酷な合理主義者。大義のためなら少数の犠牲は厭わない。一人称は「私」。
  speech_style: 慇懃無礼で、相手を精神的に追い詰めるような知的な話し方。
  background: アズール・エリュシオンの記憶を管理する「番人」の一族。世界の再起動計画を完遂させる任務を帯びている。
  motivation: 双子を祭壇に導き、予定通りに世界を再起動させ、不完全な現世を浄化すること。
  relationships:
  - name: アリステア・ルナリス
    relation: 計画を完遂させるための「鍵」として観察対象にしている。
  - name: リラ・ルナリス
    relation: 計画の不確定要素として警戒しつつ、その能力を利用しようとしている。
  arc: 完璧な計画を信奉していたが、運命を拒絶し新たな理を創り出す双子の姿に、自らが失った「人間としての意志」を思い出す。
- name: エララ
  role: 脇役/サポート
  age: 17
  gender: 女性
  appearance: そばかすのある顔に、大きすぎる古書を抱えた小柄な少女。機能性を重視した探検服を着用。
  personality: 好奇心旺盛な学究肌。知識欲が強く、危機的な状況でも分析を始めてしまう。一人称は「私」。
  speech_style: 早口で専門用語が多く、興奮すると止まらなくなる。
  background: ルナリス連邦の若き記録官。自身も軽度の「塩の病」を患っており、その治療法を求めて旅に同行する。
  motivation: 失われた神代の記憶をすべて記録し、病の正体を解明すること。
  relationships:
  - name: アリステア・ルナリス
    relation: 敬愛する旅のリーダー。
  - name: リラ・ルナリス
    relation: 術式の解析相手として興味津々で付きまとっている。
  arc: 知識こそが唯一の救いだと信じていたが、理屈では説明できない感情や絆こそが世界を変える力になると確信する。
