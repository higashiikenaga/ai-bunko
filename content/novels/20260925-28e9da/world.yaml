title: 深海刻印の聖遺録
genre: 伝奇
tone: 重厚、神秘的、宿命論的
pov: 三人称
tense: 過去形
setting: 忘れ去られた神代の記憶が眠る、海に囲まれた島国「ルナリス連邦」と、海底に沈む禁忌の都「アズール・エリュシオン」。
premise: 神話の時代に分かたれた双子の血脈が、千年ぶりに再会する。世界を蝕む「塩の病」という不可解な現象を止める唯一の手段は、海底遺跡に眠る原初の記憶を書き換えることだった。光を継ぐ者と影を継ぐ者が、深淵の底で残酷な真実と対峙する。
themes:
- 宿命と選択
- 記憶の継承
rules:
- 「星の記憶」は物質化して刻印として体に宿り、特定の能力を付与する。
- 海底遺跡への進入には、対となる双子の血による共鳴（シンクロニシティ）が不可欠である。
- 深海に潜るほど、地上の記憶を喪失し、精神が「深海の声」に浸食されるリスクが高まる。
plot_outline:
- '序盤: 聖都で神託を授かる兄と、辺境で禁忌の術を操る妹。世界を蝕む「塩の病」の拡大に伴い、二人は運命に導かれ邂逅し、伝説の海底遺跡アズール・エリュシオンへの旅に出る。'
- '中盤: 遺跡の階層を下るごとに、かつての文明が滅んだ真の理由と、双子が単なる人間ではなく、世界を再起動させるための「鍵（器）」として設計された残酷な計画が明らかになる。'
- '終盤: 最深部の「記憶の祭壇」にて、世界の理を司る神性との対峙。世界を救うには、どちらか一方がすべての記憶を引き受け、存在ごと消滅しなければならないという究極の選択を迫られる。'
- '結末: 自己犠牲という運命を拒絶し、二人が互いの記憶を分かち合うことで新たな理を創造。不完全ながらも人間としての生を選び、静かに海へ帰還する。'
style_notes: 擬古文的な格調高い表現を用い、章の冒頭に架空の聖典『蒼穹の嘆き』からの一節を引用する。地名や術名にはラテン語や古語を想起させる響きを持たせ、情景描写は贅沢に、心理描写は抑制的に描くことで、世界の悠久の歴史と神話性を演出する。
