- name: アートラー・ハルバード
  role: 主人公
  age: 22(第1部)→ 25(第2部)→ 29(第3部)
  gender: 男性
  appearance: 黒髪に灰色の瞳。王族らしい端正な顔立ちだが、笑うと少年のような表情になる
  personality: 温厚で人を思いやる。一人称「僕」、公の場では「私」。自分の感情には不器用で、気持ちを言葉にするのが遅い
  speech_style: 穏やかで丁寧。迷うと言葉を選びすぎて黙り込む
  background: ハルバード王国の第一王子。政治的事情でファーバー家のルナと政略結婚する
  motivation: 国と、自分を想ってくれる人を守りたい
  relationships:
  - name: ルナ・フォン・ファーバー
    relation: 政略結婚の妻(第1部)。危うさに惹かれ、やがて止める側に立つ
  - name: セレスティア・フォン・アールト
    relation: 幼なじみで王宮の側近。第2部以降の伴侶
  arc: 「誰かに愛されること」と「誰かの人生を所有すること」は違うと、三部作を通して理解していく
- name: ルナ・フォン・ファーバー
  role: ヒロイン/第1部の黒幕
  age: 20(第1部)→ 23(第2部・目覚め)→ 28(第3部)
  gender: 女性
  appearance: 銀髪碧眼。華やかで気品があり、夜会では誰もが振り返る
  personality: 優雅で知的、外交に長ける。一人称「わたくし」。愛した相手への独占欲が極端に強い
  speech_style: 柔らかな敬語に、ときおり鋭い本音が混じる。第3部では港町の人々と気さくに話す
  background: 名門ファーバー家の令嬢。古代文明と魔導科学に通じ、宮廷魔導学者ヴィクトルと「黄昏計画」を進めていた
  motivation: 第1部「あなたのためなら世界を壊す」→ 第2部「あなたを愛している。でも、あなたの人生を奪わない」→ 第3部「あなたがいなくても、私は誰かを守って生きていける」
  relationships:
  - name: アートラー・ハルバード
    relation: 夫(第1部)。本当に愛している
  - name: セレスティア・フォン・アールト
    relation: 対照的な「愛」を持つ相手。互いを最も理解し、最も拒む
  - name: ルリ
    relation: 第3部で育てている娘(タインで引き取った孤児)
  arc: 「壊す女」→「償う女」→「護る女」。罪は消えないが、罪を背負ったまま誰かを守る生き方を選ぶ
- name: セレスティア・フォン・アールト
  role: ヒロイン
  age: 21(第1部)→ 24(第2部)→ 28(第3部)
  gender: 女性
  appearance: 金に近い亜麻色の髪をきっちり結い上げ、琥珀色の瞳。凛とした立ち姿
  personality: 清廉で理知的、責任感が強い。一人称「私」。「正しい愛」を重んじ、自分の弱さを認めるのが苦手
  speech_style: はっきりした敬語。感情が高ぶるほど言葉が短く硬くなる
  background: 王家に仕えるアールト侯爵家の令嬢。アートラーの幼なじみで、王宮の政務を補佐している
  motivation: 愛する人のために正しい未来を選ぶ
  relationships:
  - name: アートラー・ハルバード
    relation: 幼なじみ。長く想いを秘めていた。第2部以降の伴侶
  - name: ルナ・フォン・ファーバー
    relation: 「過去の罪を持つ人」として警戒し、遠ざけようとする
  arc: 「正しい愛を信じる女」→「正しさによってルナを排除する女」→「自分自身の執着に敗れる女」
- name: ヴィクトル・ケイン
  role: 第1部の協力者
  age: 45
  gender: 男性
  appearance: 白髪まじりの痩身。指先はいつもインクと魔素で汚れている
  personality: 冷静で学究肌。一人称「私」。人類は魔素を浪費して滅びへ向かうと信じ、「白紙に戻す」ことを救済と考える
  speech_style: 講義のように淡々と話す
  background: 宮廷魔導学者。古代文明の研究でルナと出会い、黄昏計画を共に進めた
  motivation: 世界を白紙に戻し、滅びの連鎖を断つ
  relationships:
  - name: ルナ・フォン・ファーバー
    relation: 計画の同志。記憶を失ったルナを「目覚めさせよう」とする
  arc: 第1部で捕らえられる。ルナとは違い、最後まで自分の思想を曲げない
- name: エドガー・ハルバード
  role: 国王
  age: 55
  gender: 男性
  appearance: 白い髭をたくわえた厳格な王
  personality: 国益を第一に考える現実主義者。一人称「余」
  speech_style: 重く短い言葉
  background: アートラーの父。ファーバー家との同盟のため政略結婚を決めた
  motivation: 王国の安定
  relationships:
  - name: アートラー・ハルバード
    relation: 父。王としての決断を息子に求める
  arc: 第1部の裁きを王として下す。第3部ではタインとの技術交流を認める
- name: ミナ・ホルスト
  role: 第3部の協力者
  age: 34
  gender: 女性
  appearance: 短い栗色の髪、眼鏡。白衣の袖をいつもまくっている
  personality: 率直で合理的、患者には誰よりやさしい。一人称「あたし」
  speech_style: 歯切れのいい話し方。専門用語をすぐ噛みくだく
  background: タイン共和国の医師。魔素と身体の関係を研究する「魔素医学」の第一人者。ルナの港町の診療所を任されている
  motivation: 治せる人を一人でも多く治す
  relationships:
  - name: ルナ・フォン・ファーバー
    relation: 友人であり、使節団の医師
  arc: セレスティアの不調(魔素循環症)を治療し、王国に新しい医学をもたらす
- name: ルリ
  role: 第3部・ルナの娘
  age: 7(第3部)
  gender: 女性
  appearance: 黒髪を二つに結った元気な少女。潮風で日に焼けている
  personality: 好奇心旺盛で物怖じしない。一人称「ルリ」
  speech_style: 元気で素直。大人の言葉をすぐまねする
  background: タインの港町で疫病により家族を失った孤児。ルナが引き取り、娘として育てている
  motivation: お母さまの役に立ちたい
  relationships:
  - name: ルナ・フォン・ファーバー
    relation: 母。血はつながらないが、誰よりも家族
  arc: ルナが「誰かを守って生きる」ことの象徴
