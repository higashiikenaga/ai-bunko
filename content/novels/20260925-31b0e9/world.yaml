genre: 特別企画
tone: 気品と陰りのある王宮ロマンス。静かな心理描写と、政治・魔導科学の緊張感
pov: 三人称。主にアートラーの視点、ときにルナ・セレスティアの視点に寄る
tense: 過去形
setting: 魔法と科学が共存する架空世界。大陸西方のハルバード王国は古い魔法の伝統を持つが、魔法と科学の融合(魔導科学)は発展途上。 海の向こうの島国タイン共和国は商業・航海・医療・工学が進み、分野によっては王国より先を行く。
  王国には、滅びた古代文明が遺した魔導遺構が点在している。
rules:
- 魔法は「魔素」を体内で編む技術。貴族ほど魔素が強い傾向がある。科学と組み合わせた魔導機関は研究途上で、暴走の危険がある
- 王都地下には古代文明の遺構「白の天蓋(しろのてんがい)」が眠る。起動すると大陸中の人々を魔素ごと眠りに沈め、世界を「白紙に戻す」と伝わる
- ルナの人類滅亡計画は「白の天蓋」を起動する計画(黄昏計画)。協力者は宮廷魔導学者ヴィクトル・ケイン
- ルナは結婚前、自分の手で計画の記憶を封じる魔法をかけた(罪の意識なくアートラーを愛するため)。計画自体は時限式で進み続けていた
- 処刑の瞬間、「白の天蓋」の残滓がルナに呪い「贖いの眠り」をかける。彼女は石の眠りの中で、自分が奪おうとした人々の生と痛みを長い年月をかけて見続け、三年後に目覚める
- 蘇ったルナは法の上ではすでに死者。名を伏せ、ファーバー家の縁者「ルーナ」として生きる
- 王国では王族・貴族の結婚は政治であり、家同士の同盟と外交を意味する
- タイン共和国は身分より契約と実績を重んじる。女性の商会長や医師も多い
premise: 政略結婚で結ばれた王子アートラーと、銀髪碧眼の令嬢ルナ。優雅な王妃として彼に寄り添うルナは、本当に彼を愛していた。 しかし王国では、古代遺構にまつわる不可解な事件が起き始める。すべての糸の先にいたのは、記憶を失ったルナ自身だった。
themes:
- 愛することと、相手の人生を所有することの違い
- 罪と贖罪。過去の罪を背負った人間に、やり直す権利はあるのか
- 正しさと執着
- 家族としての絆
- 魔法と科学、国と国の交流
style_notes: 抑制の効いた気品ある文体。感情は仕草・沈黙・視線で語らせる。王宮の儀礼や外交の言葉づかいに重みを持たせる。
title: 世界滅亡と魔法と科学的な恋
plot_outline:
- '第1話: 政略結婚の日。王都の大聖堂で、アートラーは初めて間近にルナと向き合う。儀礼どおりの誓いの中、ルナは誓いの言葉を一語だけ変える(「あなたの世界を、わたくしが守ります」)。祝宴の片隅でセレスティアが二人を見つめている。'
- '第2話: 新婚の日々。ルナは外交の場で才を見せ、隣国の大使を言葉ひとつで味方につける。完璧な王妃ぶりの裏で、夜ごと彼女は「思い出せない夢」にうなされる。アートラーは彼女の手の冷たさが気になり始める。'
- '第3話: 王都地下の魔導遺構で、調査中の学者が相次いで倒れる事件。アートラーが視察に行くと、なぜかルナが遺構の構造に詳しい。本人も「なぜ知っているのか分からない」と戸惑う(伏線)。'
- '第4話: ルナとアートラーが夜の庭園で初めて本音を話す。ルナは「あなたを誰にも渡したくない」と冗談めかして言い、アートラーはその言葉の重さに惹かれながらも少しだけ怖くなる。'
- '第5話: 宮廷魔導学者ヴィクトル・ケインが登場。魔導科学の研究会でルナと視線を交わす二人に、アートラーは説明のつかない違和感を覚える。セレスティアはヴィクトルの研究資金の流れを調べ始める。'
- '第6話: 王国北部で魔素の枯渇が起き、村の井戸と灯りが止まる。アートラーとルナは視察に赴き、ルナは村人の子どもに優しく魔法の灯をともす。その優しさは本物だと、アートラーは確信する。'
- '第7話: セレスティアがアートラーに、遺構事件の資料を差し出す。「殿下の奥方に、近づきすぎないでください」。幼なじみの忠告に、アートラーは初めて彼女の想いの深さに気づくが、言葉にできない。'
- '第8話: ルナの誕生日の夜会。二人が踊る最中、遺構の方角で空が白く光る。ルナは激しい頭痛に倒れ、うわごとで「まだ早い」とつぶやく。アートラーはその言葉を聞いてしまう。'
- '第9話: ヴィクトルがひそかにルナを訪ね、封じられた記憶の鍵となる古い手記を渡す。ルナは読むことを拒むが、手記の筆跡は自分のものだった。'
- '第10話: 【中盤の転換】ルナの記憶が戻る。自分が「黄昏計画」——白の天蓋で世界を白紙に戻す計画——の首謀者であり、結婚前に自ら記憶を封じたことを知る。彼女が最初に思ったのは、世界のことではなくアートラーのことだった。'
- '第11話: 記憶を取り戻したルナは、何事もなかったように王妃として振る舞う。けれど、アートラーへの愛情はかえって激しくなる。「あなたを苦しめるこの世界なんて、なくなればいい」。彼女の歪んだ愛の論理が初めて言葉になる。'
- '第12話: セレスティアとアートラーが遺構の最深部で、計画の全容と首謀者の名を見つける。アートラーは妻の名を前に立ち尽くす。セレスティアは彼の手を握り、「逃げないでください」と言う。'
- '第13話: 対決。白の天蓋の起動を目前に、アートラーはルナと向き合う。ルナは本心を隠さない。「愛しているから、壊すのです」。アートラーは彼女を憎みきれず、それでも止めると告げる。'
- '第14話: 天蓋は止められ、ルナとヴィクトルは捕らえられる。裁きの場で、ルナは自己弁護をせず、ただアートラーへの愛だけは偽りでなかったと言う。国王エドガーは王として極刑を宣告する。'
- '第15話: 【第1部 結末】処刑の前夜、牢の格子越しに最後の会話。二人は手を取り合うが、アートラーは許すとは言わない。「愛しているからこそ、許すことができない」。夜明け、鐘の音と白い光。直接の場面は描かず、残された者の沈黙と余韻で締める。'
