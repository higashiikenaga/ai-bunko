- name: エライアス・ソーン
  role: 主人公
  age: 34
  gender: 男性
  appearance: 青白い肌に痩身。常に古びた灰色の記録保管員コートを纏い、ポケットには回収した情報の破片が詰まっている。深い思索に耽る傾向があり、瞳にはブラックホールの光輪のような淡い光が宿っている。
  personality: 内向的で静謐。知的好奇心が強く、失われた言葉や記憶に対して深い慈しみを持つ。一人称は「私」。
  speech_style: 丁寧で控えめ。古書のような、少し古風で形式的な言い回しを好む。
  background: かつて故郷の惑星を時空崩壊で失い、唯一生き残った記録学者。現在はラグランジュ・エッジの辺境で、漂着する情報の結晶を整理する「古本屋」のような隠居生活を送っている。
  motivation: 断片化した宇宙の記憶を繋ぎ合わせ、失われた真実を復元すること。
  relationships:
  - name: ライラ
    relation: 信頼し合える協力者であり、唯一の友人
  - name: ヴァレリウス長官
    relation: 思想的に対立する管理権力者
  arc: 静かな観測者であったが、宇宙の運命を背負う責任に目覚め、最終的に自己を犠牲にして永遠の守護者となる道を選択する。
- name: ライラ・ゼノス
  role: 相棒
  age: 26
  gender: 女性
  appearance: 短く切り揃えた銀髪に、重力異常による事故で失った右腕を高性能な義手で補っている。機能性を重視したタイトなダイブスーツを着用。
  personality: 快活で現実主義。直感的で行動力が高い。エライアスの内省的な性格を補完する存在。一人称は「あたし」。
  speech_style: 砕けた口調で、専門的な技術用語やスラングを織り交ぜて話す。
  background: 高重力圏から物質を回収する「ダイバー」のスペシャリスト。金のためにエライアスの回収作業を手伝っていたが、次第に彼が追う「情報の真実」に惹かれていく。
  motivation: いつかステーションを離れ、重力に縛られない自由な旅をすること。
  relationships:
  - name: エライアス・ソーン
    relation: 危うい知識人に惹かれる保護者的親愛
  arc: 物質的な価値のみを信じていたが、エライアスを通じて「記憶」や「記録」という形のないものの価値を知り、精神的に成長する。
- name: ヴァレリウス長官
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない白い軍服に身を包み、冷徹な眼差しを持つ。常に完璧に整えられた身なりをしており、感情の起伏が外見に現れない。
  personality: 徹底した功利主義者。宇宙の熱的死という絶望を前に、選ばれた人間だけが生き残るための秩序を構築しようとする。一人称は「私」。
  speech_style: 断定的で威圧的。無駄を省いた効率的な話し方をする。
  background: ラグランジュ・エッジを統括する政府機関の責任者。ブラックホールの特異点を利用した時間操作技術により、人類の統治を永続させようと企んでいる。
  motivation: 失われた文明の記録を独占し、物理定数を操作して自らの権力基盤となる「永遠の帝国」を築くこと。
  relationships:
  - name: エライアス・ソーン
    relation: 利用価値のある道具、あるいは排除すべき障害
  arc: 絶対的な管理こそが救済だと信じているが、観測者の意思という量子力学的な不確定要素に敗北し、崩壊する時空に飲み込まれる。
- name: エーテル
  role: 脇役/導き手
  age: 0
  gender: 不詳
  appearance: 回収された「文明の全記録」から投影された、光の粒子で構成される半透明の人型。形状が常に揺らいでおり、時折幾何学的な模様に変化する。
  personality: 超越的で超越的。慈愛に満ちているが、人間的な時間感覚を持たないため、残酷なまでに客観的。一人称は「我」。
  speech_style: 詩的で抽象的。問いかけに問いで答えるような、神託に近い話し方をする。
  background: 滅び去った超高度文明が、後世の観測者に情報を継承させるために残した自律型インターフェース。
  motivation: 宇宙の全歴史を正しく観測し、固定できる「真の観測者」を見つけ出すこと。
  relationships:
  - name: エライアス・ソーン
    relation: 継承者としての適性を認めた対象
  arc: エライアスに宇宙の真理を伝え、彼が自らを事象地平に捧げる決断をするまでを導き、最後には彼と同化して情報の海へと還る。
