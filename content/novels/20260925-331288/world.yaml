title: 事象地平の古書録
genre: SF
tone: 硬質な科学的叙情性と、壮大な宇宙的孤独感
pov: 三人称
tense: 過去形
setting: 重力異常が発生し、時間軸が歪曲し始めた超巨大ブラックホール周辺の軌道ステーション「ラグランジュ・エッジ」
premise: ブラックホールの事象地平付近では、時間の進みが極端に遅滞し、過去から漂着した情報の断片が物理的な『物質』として定着する現象が確認されていた。古本屋を営む記録保管員のエライアスは、時空の歪みによって結晶化した『本』の破片を回収し、整理する特殊な職に就いている。ある日、彼は月食のような影を纏った異常な情報の塊を回収するが、それは失われた文明の演算記録であり、宇宙の熱的死を回避する鍵であった。エライアスは、情報の海から真実を掬い上げるべく、崩壊する時空の果てへと足を踏み入れる。
themes:
- 情報の保存とエントロピー
- 時間の相対性と記憶の不変性
rules:
- ブラックホールの近傍では、重力による時間の遅延が顕著であり、観測者によって時間の流れが異なる
- 時空の歪みによって、高度に秩序化された情報（データ）は物質的な結晶体として物質化する
- 月食現象は、ステーションの軌道計算ミスではなく、周囲の重力レンズ効果によって光が遮断されることで発生する
plot_outline:
- '序盤: 重力崩壊の予兆が迫るステーションで、エライアスが「情報の結晶」を回収する日常を描く。彼は、時空の揺らぎによって物理的な本として現れた、数千年前の技術論を拾い上げる。'
- '中盤: ステーションに巨大な影（重力レンズによる月食に似た現象）が訪れた際、エライアスは未曾有の質量の情報体、すなわち『失われた文明の全記録』を回収する。その記録には、宇宙の熱的死を止めるための物理定数の操作方法が記されていた。'
- '終末: 記録を解読しようとする政府機関の介入と、ブラックホールへの急接近による時間の極端な遅延。エライアスは、自身が情報の観測者である限り、その情報は確定しないという量子力学的なジレンマに直面する。'
- '結末: エライアスは、自らを事象地平の境界に置くことで、情報を永遠の「現在」に固定する決断を下す。ブラックホールに飲み込まれる直前、彼は宇宙の全歴史が書き込まれた光景を目撃し、永遠の静寂の中で情報の守護者となる。'
style_notes: ハードSFの文体を貫く。重力、エントロピー、事象地平といった物理学用語を、比喩ではなく厳密な定義に基づいて用いる。ただし、読者が置いてけぼりにならないよう、現象の視覚的な描写（光の屈曲や時間の引き伸ばし）を精緻に行い、センス・オブ・ワンダーを演出する。感情的な描写は抑制し、物理的な状況の変化を通じて登場人物の心理を暗示させる。
