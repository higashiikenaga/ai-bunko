- name: 深川 源次
  role: 主人公
  age: 22
  gender: 男
  appearance: 快活な目元に、少し着崩した藍色の着物。常にどこか落ち着かない様子で体を動かしている。
  personality: お調子者で好奇心旺盛。お節介焼きだが、人の痛みに敏感な情に厚い性格。一人称は「俺」。
  speech_style: 江戸っ子らしい威勢の良い口調。語尾に「〜でぇ」「〜じゃねえか」とつく。
  background: 深川の長屋に住む日雇いの職人。定職に就かず、人付き合いの良さだけで食いつないでいる。
  motivation: 退屈な日常に刺激を求めつつ、いつの間にか隣人たちの悩みや孤独を解消させることに喜びを感じるようになる。
  relationships:
  - name: 店主
    relation: 不思議な導き手であり、反発しつつも信頼する相手
  - name: 作蔵
    relation: 振り回しながらも慕っている偏屈な隣人
  arc: 単なるお調子者の青年から、本を通じて人の心の機微を理解し、真の意味で他者に寄り添える大人へと成長する。
- name: 店主（名不詳）
  role: 相棒/導き手
  age: 40
  gender: 男
  appearance: 痩身で、古びた眼鏡をかけている。色あせた灰色の着物を纏い、常に穏やかな微笑みを浮かべている。
  personality: ミステリアスで達観している。感情の起伏が少ないが、本と人を結びつけることに強い情熱を持つ。一人称は「私」。
  speech_style: 丁寧で静かな話し方。比喩表現を多く使い、相手に考えさせる問いかけを好む。
  background: 雨の日だけ路地裏に現れる古本屋の主。どこから来てどこへ行くのか、正体は誰も知らない。
  motivation: 忘れ去られた記憶や想いが綴られた本を、それを必要とする「正しい持ち主」へ届けること。
  relationships:
  - name: 深川 源次
    relation: 自分の店に迷い込んだ、都合よく動いてくれる「使い走り」兼「理解者」
  arc: 源次という人間を通じて、人間社会の泥臭い情愛に触れ、物語の終盤でわずかに人間らしい寂しさを覗かせる。
- name: 作蔵
  role: 脇役
  age: 68
  gender: 男
  appearance: 深い皺が刻まれた顔に、常に不機嫌そうな吊り上がった眉。手には常に古びた煙管を持っている。
  personality: 偏屈で口が悪いが、内面には繊細な芸術家肌を隠し持っている。一人称は「わし」。
  speech_style: ぶっきらぼうで突き放すような言い方だが、時折、若かりし頃の情熱が漏れ出る。
  background: かつては絵師を目指していたが、ある挫折をきっかけに筆を折り、現在は長屋で孤独に暮らしている。
  motivation: 捨てたはずの夢や、過去の自分と向き合い、心の区切りをつけること。
  relationships:
  - name: 深川 源次
    relation: うるさい若造だと思いながらも、実はその真っ直ぐさに救われている
  arc: 頑なに閉ざしていた心を源次と古書によって開き、再び人生に彩りを見出し、長屋の住人と心を通わせる。
- name: お兼
  role: 脇役/鍵となる人物
  age: 52
  gender: 女
  appearance: きりっとした目元に、きっちりと結い上げた髪。清潔感のある前掛けを着用している。
  personality: 長屋のまとめ役で、厳格だが慈愛に満ちている。責任感が強く、自分の弱みを見せることを嫌う。一人称は「私」。
  speech_style: はっきりとした口調で、長屋の住人たちを叱咤激励する母親のような話し方。
  background: 長屋の主。かつて家族と離別した深い傷を抱えており、それを隠して一人で長屋を切り盛りしてきた。
  motivation: 長屋の住人たちが平穏に暮らせる環境を守ること。同時に、過去の罪悪感から逃れたい。
  relationships:
  - name: 深川 源次
    relation: 手のかかる息子のように思っている
  - name: 作蔵
    relation: 互いに遠慮しつつも認め合っている長年の付き合い
  arc: 隠し続けてきた過去を曝け出すことで、本当の意味での許しを得て、住人たちとの絆を深める。
