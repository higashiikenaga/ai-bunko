title: 雨天開店、長屋の古本屋
genre: 歴史・時代小説
tone: べらんめえ口調が軽快な人情時代小説
pov: 三人称
tense: 過去形
setting: 江戸時代後期、深川の長屋
premise: 深川の長屋に住むお調子者の源次が、雨の日だけひっそりと店を出す不思議な古本屋に出会う。その店で売られる古書には、かつての持ち主の秘めた想いや、忘れ去られた記憶が綴られていた。源次は本を介して、隣人たちが抱える孤独や後悔を、お節介な人情で解きほぐしていく。
themes:
- 人情
- 記憶の再生
- 隣人愛
rules:
- 古本屋は雨が降っている間だけ開店し、晴れると跡形もなく消える
- 本の内容が、現実の誰かの失った記憶や品物と深く結びついている
- 対価は金銭だけでなく、心からの感謝や新たな物語となることがある
plot_outline:
- '序盤: 梅雨の季節、源次が路地裏で偶然「雨の日だけ開く古本屋」に迷い込み、風変わりな店主と出会う。店で手にした一冊の本が、隣に住む偏屈な老人の若かりし頃の夢を呼び覚ます。'
- '中盤: 長屋の住人たちが抱える密かな悩み――絶縁した親への想いや、亡き妻への未練などを、古本屋で見つけた本をきっかけに源次が奔走して解決していく。'
- '終盤: 秋の祭りを前に、長屋の主人が長年隠していたある過去が判明し、住人たちの間で大きな衝突が起きるが、一冊の古い日記帳がすべてを繋ぎ止める。'
- '結末: 初雪が舞う中、古本屋は静かに姿を消すが、長屋の人々は互いを思いやる心を深めていた。最後はみんなで温かい鍋を囲み、笑いと涙に包まれる。'
style_notes: 藤堂小太郎風。江戸の市井の喧騒を活写し、「～でぇ」「～じゃねえか」といったべらんめえ口調を多用する。初鰹や栗ごはんなどの季節の旬の食材、そして祭りの喧騒といった行事を丁寧に描写し、最終的に涙と笑いが混じる人情話に仕上げること。
