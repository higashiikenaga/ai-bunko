- name: 如月 春樹
  role: 主人公
  age: 17
  gender: 男性
  appearance: 細身でしなやかな肢体だが、現在は自信を失い、少し猫背気味。どこか遠くを見ているような寂しげな瞳。
  personality: 内向的で思慮深い。完璧主義ゆえに一度の挫折で深く落ち込む傾向がある。一人称は「僕」。
  speech_style: 丁寧だが距離感のある話し方。感情が高ぶると言葉に詰まることがある。
  background: 中学時代は全国レベルのエースだったが、高校進学後の過度なプレッシャーとスランプにより、走る意味を見失い、現在は部活動に籍を置きながらも練習に身が入っていない。
  motivation: 古本屋で見つけた日誌の走者に惹かれ、地図から消えたルートを完走することで、自分の中の「空白」を埋めたい。
  relationships:
  - name: 篠崎 澪
    relation: ルート探索の相棒であり、精神的な支え
  - name: 一ノ瀬 蓮
    relation: 対照的な価値観を持つライバル
  arc: 「勝利」という結果への執着から解放され、自然の中を走る純粋な快感と、自分自身の限界を認めた上での強さを取り戻す。
- name: 篠崎 澪
  role: 相棒
  age: 17
  gender: 女性
  appearance: ショートカットに丸眼鏡。常に地元の古地図やフィールドノートを携帯している。快活な印象。
  personality: 好奇心旺盛で行動力がある。郷土史や民俗学に強い関心を持つ。一人称は「私」。
  speech_style: ハキハキとしていて、早口。好きな話題になると専門用語が混じる。
  background: ダム建設で村を追われた家系であり、祖父から語り継がれた「消えた村」の記憶に強い愛着を持っている。
  motivation: 日誌の記述を頼りに、今は水底にある村の記憶を地図上に復元したい。
  relationships:
  - name: 如月 春樹
    relation: 不思議な共鳴を感じている協力者
  arc: 単なる知的好奇心から、春樹の走りに触れることで「誰かの想いを継承すること」の重みと喜びを知る。
- name: 一ノ瀬 蓮
  role: 敵役/ライバル
  age: 17
  gender: 男性
  appearance: 鋭い眼差しと整った顔立ち。無駄のない筋肉質な体型。常に最新のスポーツウェアを着用している。
  personality: 合理的でストイック。努力を数値化し、効率的に勝利を掴むことを至上とする。一人称は「俺」。
  speech_style: 断定的で合理的。回りくどい表現を嫌う。
  background: 現在の陸上部のエース。挫折した春樹を「精神的に弱い」と切り捨てているが、心の底ではかつての春樹の才能を認めていた。
  motivation: 圧倒的な実力で春樹を突き放し、同時に彼を再び競技の世界に引きずり戻して決着をつけたい。
  relationships:
  - name: 如月 春樹
    relation: かつての憧れであり、現在は超えるべき壁（あるいは情けない元エース）
  arc: 効率だけでは到達できない「情熱」や「精神的な強さ」があることを、春樹の変貌を通じて悟る。
- name: 佐東 謙三
  role: 脇役/導き手
  age: 68
  gender: 男性
  appearance: 白髪混じりの穏やかな顔立ち。古本屋の店主で、使い込まれたエプロンを着用している。
  personality: 達観しており、聞き上手。若者の迷いに寄り添う包容力がある。一人称は「私」。
  speech_style: ゆったりとした口調。比喩を用いた言い回しが多い。
  background: 40年前に日誌を綴った青年の親友であり、彼の走りと、ダムによって失われた風景を誰よりも知っている。
  motivation: 日誌が春樹の手に渡った運命を感じ、彼が「走る喜び」に辿り着くのを静かに見守りたい。
  relationships:
  - name: 如月 春樹
    relation: 亡き友の面影を重ねる教え子のような存在
  arc: 春樹がルートを完走することで、自分の中にあった過去への後悔に区切りをつけ、未来へ記憶を託す。
