title: 風の地図と空白の山嶺
genre: スポーツ青春
tone: 透明感のあるノスタルジックな筆致
pov: 一人称（主人公）
tense: 過去形
setting: 現代日本、山あいの地方都市
premise: 挫折し、走る意味を見失った高校生が、街外れの古本屋で偶然見つけた40年前の古いトレーニング日誌に出会う。そこには、ダム建設で地図から消えた村の青年が綴った、伝説的な「山岳コース」の記録があった。失われた道を辿り、限界に挑むことで、少年は本当の強さと向き合い始める。
themes:
- 再生
- 喪失と継承
rules:
- 消えた村のルートは現在の公式地図に記載されていない
- トレーニング日誌の記述のみが唯一のルート特定の手がかりである
- 競技としての陸上ではなく、自己との対話としてのトレイルランニングに焦点を当てる
plot_outline:
- 序盤：エースとしての自信を喪失した主人公が、古本屋で一冊の古い日誌を買い、ダムの底に沈んだ村にいたかつてのランナーの存在を知る。
- 中盤：地元の歴史に詳しい少女と共に、日誌の記述を頼りに山の中の「空白のルート」を探索し、肉体的・精神的な限界を突破していく。
- 終盤：日誌のゴール地点である、今は水底に沈んだ村の最高地点（展望台跡）を目指す過酷なロングランに挑み、極限状態で過去のランナーの情熱と共鳴する。
- 結末：失われた風景の中を走り抜いたことで、主人公は勝利への執着ではなく「走ること自体の喜び」を取り戻し、再び競技陸上のスタートラインに立つ。
style_notes: 風の匂いや土の感触など、五感を刺激する情景描写を重視し、静かな独白と激しい鼓動の対比を際立たせること。
