- name: サイラス・ヴェイン
  role: 主人公
  age: 38
  gender: 男性
  appearance: 煤けた作業着と古びた革のエプロン、油汚れのついた手、鋭いがどこか寂しげな瞳。
  personality: 冷静沈着で現実主義。過去への執着を隠している。一人称は「俺」。
  speech_style: 低く落ち着いた、無駄のない話し方。
  background: かつて都市の動力炉を管理していた天才機関士だったが、ある事故をきっかけに現場を離れ、現在は最下層で古本屋を営む。
  motivation: 書書が示す「時間の錆」の正体を突き止め、現在の都市が辿る破滅を防ぐこと。
  relationships:
  - name: エラ・スターリング
    relation: 信頼できる相棒
  - name: マキシミリアン・アイアンウッド
    relation: 追跡者・宿敵
  arc: 過去の喪失感に囚われた隠遁者から、未来を切り拓くために自らの技術を再び振るう開拓者へ。
- name: エラ・スターリング
  role: 相棒
  age: 21
  gender: 女性
  appearance: 小柄で活発な体格。飛行士用のゴーグルと使い込まれた革ジャンを着用している。
  personality: 好奇心旺盛で勇敢。直感的で明るい。一人称は「私」。
  speech_style: はきはきとした、元気のある話し方。
  background: 都市の廃材を漁りながら、自作の小型飛行艇で雲海を駆けるスカベンジャー（廃品回収業者）。
  motivation: 伝説の「黄金の産業時代」を自分の目で確かめ、未知の技術を見つけること。
  relationships:
  - name: サイラス・ヴェイン
    relation: 師匠のような存在であり、共に空を飛ぶ相棒
  arc: 単なる宝探しとしての冒険から、歴史の重みと技術が持つ責任を理解する大人への成長。
- name: マキシミリアン・アイアンウッド
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない軍服に身を包み、右腕は真鍮製の精巧な義手。冷徹な眼光を持つ。
  personality: 徹底した合理主義者。秩序のためには犠牲を厭わない。一人称は「私」。
  speech_style: 命令的で威圧感のある、硬い口調。
  background: アイアン・ロンドニアの治安維持部隊の最高司令官。都市のエネルギー枯渇による統治崩壊を危惧している。
  motivation: 書書の技術を軍事転用し、都市のエネルギー問題を解決することで支配体制を永続させること。
  relationships:
  - name: サイラス・ヴェイン
    relation: 秩序を乱す危険分子
  arc: 技術を「支配の道具」としてのみ捉える独善的な姿勢が、結果として文明を崩壊させる引き金になるという悲劇。
- name: アリア
  role: 脇役
  age: 150
  gender: 女性（オートマトン）
  appearance: 真鍮の関節を持つ美しい人形のような少女。黄金時代の意匠が施されたドレスを纏う。
  personality: 感情が希薄だが、非常に高い学習能力を持つ。一人称は「私」。
  speech_style: 抑揚の少ない、機械的だが丁寧な言葉遣い。
  background: 黄金時代の時空の断層に封じ込められていた、高度な演算機能を持つ自律型記録装置。
  motivation: 記録された歴史が「時間の錆」によって完全に消滅するのを防ぐこと。
  relationships:
  - name: サイラス・ヴェイン
    relation: 歴史の正当な継承者
  arc: 記録装置としての「義務」を超え、人間的な「意志」や「感情」を持つに至る。
