title: 煤煙の古書と螺旋の断層
genre: スチームパンク冒険
tone: 重厚で油の匂いが漂う、緻密かつ無骨な叙事詩
pov: 三人称
tense: 過去形
setting: 巨大な煙突が空を突き刺し、真鍮の歯車が絶え間なく軋む階層都市「アイアン・ロンドニア」
premise: 都市の最下層、煤に塗れた路地裏で、古本屋を営む元機関士の男は、ある日『過去の豊穣なる記憶』が封じ込められた奇妙なゼンマイ仕掛けの書物を手にする。その書物は、かつて空を覆い尽くすほどの繁栄を誇りながら、突如として大気中の蒸気圧失調により消滅したとされる『黄金の産業時代』へと、読者を時間軸の歪みへといざなう装置であった。失われた技術と、文明の熱狂を記録した頁を求めて、男は錆びついた蒸気飛行艇に乗り込み、歴史の断層へと漕ぎ出す。
themes:
- 技術の狂気と美学
- 失われた時代の残響
- 記憶の保存
rules:
- 蒸気機関の出力は、大気中の湿度と圧力に依存する
- 時間軸の歪みは『クロノ・ギア』と呼ばれる特異な歯車装置を通じてのみ観測・干渉が可能である
- 古書のページには、特定の振動数でしか解読できない真鍮のインクが刻まれている
plot_outline:
- '序盤: 煤けた街の古本屋で、主人公が動力源を内蔵した異常な古書を発見する。その書物が、かつての高度な文明が蒸気圧の暴走によって時空に沈んだことを示す記録であることを知る。'
- '中盤: 書書の秘密を狙う軍事組織の追撃を逃れ、主人公は廃材から組み上げた蒸気飛行艇で、雲海の上の「空白地帯」へ。時空の断層に漂う、かつての黄金時代の残骸と遭遇する。'
- '終盤: 巨大な歯車が組み合わさる時空の結節点にて、文明崩壊の真実――過剰なエネルギー抽出が招いた「時間の錆」の正体を知る。書書のゼンマイを巻き戻し、崩壊する時代の中で、失われた知恵を現代へ持ち帰るための決死の修理作業が始まる。'
- '結末: 激しい蒸気噴出と鐘の音の中、主人公は書書の一部を現代へと繋ぎ止めることに成功する。街には再び煤煙が舞うが、その手の中には、新しい時代を築くための真鍮の鍵が握られていた。'
style_notes: 蒸気、油、真鍮、錆、煤といった質感に徹底的にこだわる。ピストン運動や歯車の噛み合わせ、圧力計の針の動きを、まるで工学的な図解のように精密に描写すること。会話は簡潔で無骨、職人同士の信頼と技術への敬意を滲ませる。物語の転換点では、必ず巨大な鐘の音や、重厚な機械の稼働音を効果的に挿入すること。
