- name: エリオ・ヴァレンタイン
  role: 主人公
  age: 27
  gender: 男性
  appearance: 痩身で青白い肌。かつての栄光を物語る古びた指揮者のコートを纏い、虚ろだが鋭い眼差しを持つ。
  personality: 完璧主義で皮肉屋だが、根は情に厚い。一人称は「僕」。
  speech_style: 丁寧だが距離感のある話し方。音楽的な比喩を多用する。
  background: かつてアリア・ルナで最高の共鳴を引き出した天才指揮者だったが、消音症により「世界の音」を感じ取れなくなり、絶望して隠遁生活を送っていた。
  motivation: 失われた音楽を取り戻し、ルナという唯一の旋律を守り抜くこと。
  relationships:
  - name: ルナ
    relation: 導き手であり、守るべき少女
  - name: ゾラン
    relation: 思想的に対立する宿敵
  arc: 絶望による沈黙から脱却し、物理的な音ではなく心の共鳴で世界を導く真の指揮者へと成長する。
- name: ルナ
  role: 相棒
  age: 14
  gender: 女性
  appearance: 透き通るような銀髪と、夜空のような深い紺色の瞳を持つ。古風な白いワンピースを着用している。
  personality: 純真無垢で好奇心旺盛。孤独に強いが、誰かに必要とされることを切望している。一人称は「私」。
  speech_style: 穏やかで詩的な話し方。時折、無意識に古の旋律を口ずさむ。
  background: 太古の歌「最後の楽譜」を魂に宿して生まれた少女。その歌声だけが消音症を一時的に癒やす力を持つ。
  motivation: 自分の歌で世界に色彩を取り戻し、エリオと共に本当の「音楽」を知ること。
  relationships:
  - name: エリオ・ヴァレンタイン
    relation: 信頼し、慕っている師のような存在
  - name: ゾラン
    relation: 自分を「器」として利用しようとする恐怖の対象
  arc: 運命に翻弄されるだけの「器」から、自らの意志で声を捧げ世界を救う選択をする強い精神へと成長する。
- name: ゾラン
  role: 敵役
  age: 52
  gender: 男性
  appearance: 口元を銀のマスクで覆った、厳格な佇まいの男性。汚れ一つない純白の祭服を身に纏っている。
  personality: 冷酷で独善的。静寂こそが至高の救済であると信じている。一人称は「私」。
  speech_style: 威厳に満ちた、低く静かな語り口。相手を否定する言葉を静かに突きつける。
  background: 静寂を崇める教団の教皇。音があるからこそ争いと苦しみがあると考え、世界から全ての音を消し去る「完全なる静寂」を目論む。
  motivation: ルナの歌声を消し去ることで、世界を永遠の静寂（ニルヴァーナ）へと導くこと。
  relationships:
  - name: エリオ・ヴァレンタイン
    relation: かつての才能を惜しみつつも、排除すべき不純物と見なしている
  - name: ルナ
    relation: 静寂を完成させるための鍵（生贄）
  arc: 絶対的な正義を信じていたが、最後の一節に触れたとき、自分が恐れていたのは静寂ではなく、忘れ去られることへの孤独だったと気づく。
- name: リラ
  role: 脇役
  age: 22
  gender: 女性
  appearance: 快活な印象の短髪に、ゴーグルを装着。巨大な共鳴楽器を兼ねた機械仕掛けのリュックを背負っている。
  personality: 楽観的で行動的。金にがめつい面もあるが、正義感は強い。一人称は「あたし」。
  speech_style: ぶっきらぼうでテンポの速い口調。俗っぽい言い回しが多い。
  background: 浮遊島を巡る空の運び屋。共鳴石の収集に長けており、エリオたちに旅のガイドと輸送手段を提供する。
  motivation: 伝説の「約束の丘」に眠る最高級の共鳴石を手に入れ、一攫千金を狙う（が、次第に旅の目的が変わる）。
  relationships:
  - name: エリオ・ヴァレンタイン
    relation: 呆れつつも、その音楽的知識に敬意を払っている
  - name: ルナ
    relation: 年の離れた妹のように可愛がっている
  arc: 損得勘定だけで動いていた人生から、誰かのために自分の技術を使う喜びを知る。
