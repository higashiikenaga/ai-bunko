title: 月食のセレナーデと残響の旅路
genre: 異世界ファンタジー
tone: 幻想的でリズミカル。詩的な余韻がある。
pov: 三人称
tense: 過去形
setting: 音の共鳴によって空に浮遊する諸島世界「アリア・ルナ」。
premise: 音が万物の根源である世界で、あらゆる旋律を消し去る病「消音症」が蔓延していた。かつて天才と呼ばれながらも音を失った指揮者と、失われた太古の歌を口ずさむ少女が出会う。二人は世界の心臓を再起動させるため、伝説の「約束の丘」を目指す旅に出る。月食の夜、最後の一節が奏でられたとき、世界に再び色彩と音が戻るのか。
themes:
- 喪失と再生
- 調和と不協和音
rules:
- 魔法は特定の旋律（メロディ）を奏でることで発動し、音色によって物理的な干渉力が変わる
- 不協和音を奏でると物質的な崩壊や精神的な汚染を引き起こす
- 月食の間だけ、世界のすべての音が一時的に停止し、根源的な『静寂の歌』を書き換えることが可能になる
plot_outline:
- '序盤: 音を失った元指揮者のエリオが、不思議な歌を歌う少女ルナと出会い、彼女が世界を救う「最後の楽譜」を身体に宿していることを知る。'
- '中盤: 消音症によって崩壊していく街々を巡り、各地に散らばる『聖なる共鳴石』を集める旅。旅の中で二人は互いの孤独を音楽で埋め合い、信頼を深めていく。'
- '終盤: 静寂を崇める教団の妨害を乗り越え、月食の刻限に合わせて、空の最果てにある『約束の丘』へと辿り着く。'
- '結末: ルナの歌とエリオの指揮が完璧な調和（ハーモニー）を生み出し、世界に新たな旋律が満ちる。ルナは代償として声を失うが、世界は救われ、二人は新しい音楽を書き留める旅を再開する。'
style_notes: リズム感を重視した畳み掛けるような文章。音楽用語（クレッシェンド、スタッカート等）を比喩として多用し、各話に必ずその章の情景や心情を象徴する詩的な歌詞の一節を挿入すること。
