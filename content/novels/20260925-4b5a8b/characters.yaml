- name: 蓮 誠司
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの黒髪、左膝に古い手術痕がある。鋭いがどこか虚ろな瞳をしている。
  personality: 内向的で冷笑的な態度を取るが、根は情熱的。一人称は「俺」。
  speech_style: 短文でぶっきらぼう。必要最低限のことしか話さない。
  background: 中学時代は「天才ガード」として名を馳せたが、膝の重傷によりバスケットボールへの情熱を失い、無気力な生活を送っていた。
  motivation: バスケットボールへの情熱を完全に取り戻し、挫折した自分自身を肯定すること。
  relationships:
  - name: 佐藤 拓海
    relation: 共に泥臭い練習を積み重ねる相棒
  - name: 一条 零
    relation: 超えるべき壁としてのライバル
  arc: 挫折による逃避から、再びコートに立つ勇気を持ち、仲間と共に「自分たちのバスケ」を追求する姿へ。
- name: 佐藤 拓海
  role: 相棒
  age: 17
  gender: 男性
  appearance: 短髪で日焼けした肌、ガッシリとした体格。常に眩しい笑顔を浮かべている。
  personality: 猪突猛進でポジティブ、非常に仲間思い。一人称は「俺」。
  speech_style: 声が大きく、語尾に勢いがある。明るく親しみやすい話し方。
  background: バスケの技術は未熟だが、身体能力の高さと折れない心を持つ。廃部寸前の部を支える唯一のメンバーだった。
  motivation: 廃部寸前のチームを全国大会という「祭りの夜」へ連れて行くこと。
  relationships:
  - name: 蓮 誠司
    relation: 才能を信じ、共に高みを目指す親友
  arc: 単なる熱血漢から、蓮の技術と自分の身体能力を融合させる戦術的なプレーヤーへと成長する。
- name: 一条 零
  role: 敵役
  age: 17
  gender: 男性
  appearance: 整った顔立ち、無駄のない洗練された体つき。常に清潔感のあるユニフォームを纏う。
  personality: 冷静沈着で完璧主義。バスケを「最適解の追求」と考えている。一人称は「僕」。
  speech_style: 丁寧だが、相手のミスを的確に突く冷ややかな口調。
  background: 全国屈指の強豪校のエース。計算し尽くされたプレーで相手を圧倒する、現在の高校バスケ界の象徴。
  motivation: 圧倒的な実力差を見せつけ、バスケの「正解」が自分にあることを証明すること。
  relationships:
  - name: 蓮 誠司
    relation: かつての天才としての輝きを、再びコートで証明させたい対象
  arc: 計算外の「熱量」を持つ蓮たちのプレーに直面し、理論を超えた感情の爆発を経験する。
- name: 小野寺 結衣
  role: 脇役
  age: 16
  gender: 女性
  appearance: 眼鏡をかけた真面目そうな少女。常にチームの記録用ノートを持ち歩いている。
  personality: 控えめだが観察眼が鋭く、チームの精神的な支柱となる芯の強さを持つ。一人称は「私」。
  speech_style: 丁寧で落ち着いている。周囲を冷静に分析するような話し方。
  background: 地元の古い体育館の管理人である祖父を持ち、部活動の存続を願いながらマネージャーを務める。
  motivation: チームが再び輝きを取り戻し、この場所（体育館）に活気を取り戻すこと。
  relationships:
  - name: 蓮 誠司
    relation: 彼の挫折と再生を最も近くで見守る理解者
  arc: 単なる記録係から、チームの強みをデータと情熱の両面で支える不可欠なパートナーへ。
