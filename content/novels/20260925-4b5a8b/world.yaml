title: 熱砂の咆哮、限界の先へ
genre: スポーツ青春
tone: 熱血、泥臭い、臨場感
pov: 一人称（俺）
tense: 過去形
setting: 現代、地方都市の古い体育館と全国大会の舞台
premise: かつて天才と呼ばれた俺は、怪我によってバスケットボールへの情熱を失いかけていた。荒廃した街の片隅、古びた体育館だけが、俺たちにとっての「砂漠のオアシス」だった。廃部寸前のチームで出会った不器用な仲間たちと共に、地獄のような基礎練習を積み重ね、再びコートに立つことを決意する。全国大会という、まるで「祭りの夜」のような喧騒の舞台で、俺たちは積み上げた血と汗の結晶を爆発させる。
themes:
- 挫折からの再生
- 反復練習による超克
rules:
- バスケットボールの競技ルールに準拠
- 才能の差は練習の量と質で埋めることが可能だが、それには精神の限界を超える覚悟が必要である
plot_outline:
- '序盤: 怪我で挫折した主人公・蓮が、廃部寸前のバスケ部に入部し、仲間との出会いを通じて再び情熱を取り戻す。'
- '中盤: 基礎練習の過酷な日々。地味な反復練習が身体に刻まれていく過程と、強豪校との圧倒的な実力差に打ちのめされる葛藤を描く。'
- '終盤: 全国予選の決勝戦。試合中の極限状態を、鼓動や呼吸の音とともに、実況のような疾走感ある文体で描写。練習の成果が奇跡的なプレーとして結実する。'
- '結末: 頂点を目指す戦いの果てに、勝敗を超えた先にある「自分たちのバスケットボール」を見つけ出し、次なるステージへと走り出す。'
style_notes: 主人公「俺」の視点で、汗の匂い、筋肉の震え、バッシュが床を叩く音を徹底的に描写する。試合シーンは短文を多用し、心拍数の上昇に合わせて文章のテンポを速める。一方で、練習シーンは、一回一回の動作の重みを丁寧に記述し、試合での一瞬の輝きを裏付ける「説得力のある積み重ね」を重視する。
