- name: 氷室 凪 (ひむろ なぎ)
  role: 主人公
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と、感情を読み取らせない静かな瞳。長い黒髪を低めの位置で結んでいる。常にオーバーサイズの白いカーディガンを羽織っている。
  personality: 内向的で、他者との間に見えない壁を築く傾向がある。繊細で、孤独の中に安らぎを見出すタイプ。一人称は「私」。
  speech_style: 口数が少なく、控えめ。語尾を濁らせることが多いが、心の内の独白は非常に詩的で豊か。
  background: 過去に人間関係で深く傷ついた経験があり、自分を守るために心を閉ざした。海辺の静かな環境を好み、夜明け前の静寂だけを信じている。
  motivation: 誰にも侵されない安息の地を維持すること。しかし、心の底では誰かに理解されたいという矛盾した願いを抱いている。
  relationships:
  - name: 瀬戸 奏多
    relation: クラスメイトであり、憧れのラジオパーソナリティ
  - name: 陽葵 陽菜
    relation: 強引に距離を詰めようとするクラスメイト
  arc: 孤独という名の「氷の城」に閉じこもっていたが、奏多との交流を通じて、傷つくことを恐れず他者に心を開く勇気を得る。
- name: 瀬戸 奏多 (せと かなた)
  role: 相手役
  age: 17
  gender: 男性
  appearance: 少し癖のある茶髪に、穏やかで優しい目元。学校では地味な印象だが、首に常にヘッドホンをかけている。指先が細く、音楽を愛していることが伺える。
  personality: 対人関係に不器用で、現実の会話では言葉に詰まりやすい。しかし、ラジオというフィルターを通すと、包容力のある温かい言葉を紡げる。一人称は「僕」。
  speech_style: 日常会話ではたどたどしく、小声。ラジオでは低く心地よいトーンで、相手の心に寄り添うような話し方をする。
  background: 幼い頃から孤独を抱えており、自分の居場所を求めて深夜の小規模なネットラジオを始めた。凪が自分の放送を聴いていることに気づき、彼女に惹かれる。
  motivation: 声を通じて、誰かの孤独に光を灯したい。そして、自分自身も現実の世界で誰かと深く繋がりたい。
  relationships:
  - name: 氷室 凪
    relation: 静寂を共有できる唯一の理解者
  - name: 陽葵 陽菜
    relation: 幼馴染で、彼の内面をよく理解している親友
  arc: マイクの後ろに隠れていた臆病な自分を脱ぎ捨て、現実の言葉で自分の感情を伝える強さを身につける。
- name: 陽葵 陽菜 (ひまり ひな)
  role: 脇役
  age: 17
  gender: 女性
  appearance: 明るいオレンジ系のショートボブ。表情豊かで、いつもカラフルなアクセサリーを身につけている。太陽のような笑顔が特徴。
  personality: 天真爛漫で社交的。場の空気を読む能力に長けており、凪の孤独を察して、あえて明るく踏み込む強さを持つ。一人称は「私」。
  speech_style: 快活でテンポが速い。ため口が基本で、相手を盛り上げるような話し方をする。
  background: 奏多の幼馴染。彼のラジオ活動を誰よりも応援しており、彼が凪に惹かれていることにいち早く気づいて二人を後押ししようとする。
  motivation: クラスの誰もが心地よく過ごせる環境を作ること。特に、凪に笑ってほしいと願っている。
  relationships:
  - name: 氷室 凪
    relation: 心を溶かしたいと思っている気になる友人
  - name: 瀬戸 奏多
    relation: 信頼し合っている幼馴染
  arc: 一方的な明るさではなく、静かな時間や孤独の価値を理解し、相手に合わせた寄り添い方を学んでいく。
