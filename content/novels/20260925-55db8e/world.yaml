title: 零度の境界、夜明けの調べ
genre: 青春恋愛
tone: 静謐で透明感のある、淡い情緒
pov: 一人称（わたし）
tense: 過去形
setting: 冬から春へと移ろう、海辺の静かな町
premise: 誰にも触れさせない、自分だけの「氷の城」に閉じこもる少女。彼女の唯一の窓は、夜明けに流れる小さなラジオの音だった。ある朝、その声の主が隣の席の少年だと知る。凍てつく季節の中で、二人の距離はゆっくりと、光に溶けるように近づいていく。
themes:
- 孤独の受容
- 季節の移ろいと心の変化
rules:
- 感情の昂ぶりは直接的な言葉を避け、天気や光の描写に託す
- 会話は最小限に抑え、沈黙の時間を描写する
plot_outline:
- '序盤: 凍てつく冬。主人公は周囲との接触を拒み、冷たい静寂の中に身を置いている。午前四時、窓から差し込む青い月光の中で聴く「夜明けのラジオ」だけが、彼女の孤独を肯定してくれる唯一の存在だった。'
- '中盤: 学校で、ラジオのパーソナリティである少年と出会う。彼の声とは異なる、不器用で静かな佇まいに戸惑う主人公。雪が降り積もる中、二人は言葉ではなく、共に過ごす時間の温度を通じて、少しずつ心を通わせていく。'
- '終盤: 春の兆しと共に、主人公の心の氷が溶け始める。しかし、少年の抱える孤独や、それぞれの進路という現実が影を落とす。薄明かりの教室で、二人は初めて、言葉にならない感情を共有する。'
- '結末: 季節は春へ。氷の城は消え、柔らかな陽光が二人を包む。ラジオから流れる音楽が、新しい始まりを告げる。'
style_notes: 短い文を重ね、余白を意識したリズム。心理描写は、雪の質感、朝焼けのグラデーション、光の揺らぎなどの情景に託して描く。感嘆符は一切使わず、静かな情動を描写すること。
