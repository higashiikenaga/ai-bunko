- name: エリス
  role: 主人公
  age: 17
  gender: 女性
  appearance: 煤で汚れた頬に、サイズの合わない大きな飛行ゴーグルを装着している。使い古された革のオーバーコートを纏い、指先には常にオイルと錆が染み付いている。
  personality: 現実主義で皮肉屋だが、内側に強い好奇心と憧憬を秘めている。一人称は「あたし」。
  speech_style: ぶっきらぼうで、生存本能に基づいた効率的な話し方をする。
  background: 「錆びた底辺」の屑拾いとして孤独に生きてきた孤児。ガラクタの中から価値ある部品を見つけ出す天賦の才を持つ。
  motivation: 伝説の「古い灯台」に到達し、神話となった本物の空と星を見ることで、自分の人生に意味を与えたい。
  relationships:
  - name: ガンツ
    relation: 口喧嘩ばかりしているが、背中を預け合える信頼し合う相棒
  - name: ヴァレリウス
    relation: 自分たちの自由と空を奪い合う宿敵
  arc: ただ生き延びるためだけの「屑拾い」から、世界の真実を暴き、自らの意志で明日を掴み取る「開拓者」へと成長する。
- name: ガンツ
  role: 相棒
  age: 34
  gender: 男性
  appearance: 大柄で筋骨逞しい。右腕が肩から先まで真鍮製の義手になっており、状況に応じて工具に換装できる。常に不機嫌そうな吊り上がった眉が特徴。
  personality: 口が悪く粗野だが、機械に対する愛情は深く、情に脆い。一人称は「俺」。
  speech_style: 怒鳴り散らすような口調だが、重要な局面では短く的確な助言をくれる。
  background: かつて中層都市の優秀な整備士だったが、ある不祥事に巻き込まれ底辺へ落とされた。捨てられていた小型蒸気艇を修理してエリスに提供する。
  motivation: 壊れたものを直すことにのみ価値を見出しており、エリスの無謀な旅に付き合うことで、人生で最大の「修理（世界の修復）」に挑もうとする。
  relationships:
  - name: エリス
    relation: 手のかかるガキだと思いつつも、その真っ直ぐな瞳に救われている
  arc: 過去の挫折による諦念を捨て、再びエンジニアとしての誇りを取り戻し、エリスと共に未知の空を目指す勇気を持つ。
- name: ヴァレリウス
  role: 敵役
  age: 42
  gender: 男性
  appearance: 煤煙に汚れひとつない純白の軍服に身を包み、顔の上半分を精巧な銀のマスクで覆っている。冷徹な氷のような青い瞳を持つ。
  personality: 傲慢で選民意識が強く、秩序と管理こそが人類の救済であると信じている。一人称は「私」。
  speech_style: 極めて丁寧で優雅だが、言葉の端々に相手を見下す冷酷さが滲み出ている。
  background: 上層都市の管理塔を統括する高官。地上に煙を撒き散らすことで底辺の人間を家畜化し、反乱を抑え込む体制を維持している。
  motivation: 星図の断片を回収し、下層民が「空」という希望を持つことで生じる体制の崩壊を未然に防ぐこと。
  relationships:
  - name: エリス
    relation: 管理社会を乱す不純物であり、排除すべき害虫
  arc: 絶対的な管理体制こそが正義だと信じていたが、エリスたちの泥臭い生命力に突き動かされ、最後には自らが築いた偽りの秩序と共に崩壊する。
- name: ライラ
  role: 脇役
  age: 68
  gender: 女性
  appearance: 痩せこけた体躯に、継ぎ接ぎだらけの古書のようなローブを纏っている。視力はほとんど失われているが、鋭い聴覚を持つ。
  personality: 風変わりで浮世離れしており、時に謎掛けのような話し方をする。一人称は「私」。
  speech_style: おっとりとした、囁くような話し方。古風な言い回しを好む。
  background: 沈んだ図書館に一人で住み着いている「古の知識」の継承者。星図の断片が何を意味するのかを唯一理解している人物。
  motivation: 自分が死ぬ前に、誰かがこの絶望的な世界から脱出し、本物の星空を観測することを願っている。
  relationships:
  - name: エリス
    relation: 自分の知識を託すべき、希望の種となる少女
  arc: 知識の番人として静かに死を待っていたが、エリスとの出会いにより、知識を「記録」から「行動」へ変えるきっかけを与える。
