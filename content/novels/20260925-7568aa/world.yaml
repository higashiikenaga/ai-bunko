title: 真鍮の肺と錆びた天球儀
genre: スチームパンク冒険
tone: 乾いたユーモアと退廃的な美しさ
pov: 一人称（あたし）
tense: 過去形
setting: 永劫の煤煙に覆われ、太陽が神話となった廃墟世界「錆びた底辺」。蒸気機関と歯車が唯一の文明であり、人々は濾過器付きのマスクなしでは生きられない。
premise: 屑拾いで食いつなぐあたしは、ある日、空を指し示す「星図」の断片を拾う。それは、世界を覆う毒煙を払うという伝説の「古い灯台」へ導く地図だった。燃料切れのボロ船と口の悪い相棒と共に、あたしは絶望的な空を塗り替えるための、分不相応な旅に出る。
themes:
- 生存への執着
- 絶望の中に見出す美
rules:
- 呼吸には「濾過肺（フィルター）」が必須であり、フィルターの残量こそが文字通りの寿命となる。
- あらゆる動力は蒸気圧に依存しており、圧力計の針がレッドゾーンに入れば爆発の危険がある。
- 上層の浮遊都市は下層の資源を搾取しており、地上から空へ昇ることは重罪とされる。
plot_outline:
- '序盤: 廃墟のガラクタ山から星図の断片を発見し、それを狙う武装集団に追われる。逃走中に、捨てられていた小型蒸気艇を修理し、しぶしぶ旅に出る。'
- '中盤: 星図の欠片を集めるため、錆びついた工業都市や沈んだ図書館を巡る。濾過フィルターの予備が底をつきかけ、極限状態でこそ見える廃墟の静かな美しさに心を動かされる。'
- '終盤: 星図の目的地である「最果ての灯台」に到達するが、そこは上層都市が地上を監視し、煙を制御するための管理塔であったことが判明する。'
- '結末: 灯台の主制御装置を過負荷で爆破させ、一時的に空の雲を吹き飛ばす。一瞬だけ現れた本物の星空を眺め、あたしは「明日も生き延びてやる」と毒づきながら、また屑拾いの日常へ戻る。'
style_notes: 一人称「あたし」による皮肉たっぷりな語り口。フィルターの残量や石炭の消費量、ネジ一本の欠損など、物資の少なさを執拗に描写し、サバイバルの切迫感を出す。一方で、錆びた真鍮の光沢や、廃墟の隙間に咲く名もなき花など、退廃的な風景の中にある小さな美しさを詩的に描写する。
