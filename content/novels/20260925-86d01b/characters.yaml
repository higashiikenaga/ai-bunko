- name: 瀬戸 結衣
  role: 主人公/マネージャー
  age: 20
  gender: 女性
  appearance: 知的な印象の銀縁眼鏡をかけ、常にタブレットと分厚い分析ノートを携帯している。小柄だが背筋が伸びている。
  personality: 論理至上主義で完璧主義。感情よりもデータを信頼するが、内側には「弱者が知恵で強者に勝つ」ことへの強い執着がある。一人称は「私」。
  speech_style: 結論から先に述べる、簡潔で論理的な話し方。相手に言い切る形での提案が多い。
  background: 統計学を専攻する大学2年生。元々はスポーツに興味がなかったが、効率的に勝利を導き出す「戦術」というパズルに惹かれてマネージャーに就任した。
  motivation: OBの遺した戦術ノートを完全に解読し、データに基づいた「絶対的な勝利の方程式」を証明すること。
  relationships:
  - name: 桐生 航太
    relation: 戦術を具現化するための最高の「駒」であり、信頼するパートナー
  - name: 嵯峨 蓮
    relation: 直感で動くため、分析の邪魔になると考えていたが、次第にその能力を組み込みたいと考える対象
  arc: 理屈だけでは説明できない選手の情熱や泥臭さを認め、データに「心」という変数を組み込むことで真の指揮官へと成長する。
- name: 桐生 航太
  role: 主人公/控え選手
  age: 21
  gender: 男性
  appearance: 小柄だが全身が引き締まった筋肉質。短く刈り込んだ髪と、意思の強そうな鋭い眼差しが特徴。
  personality: 誠実で泥臭い努力家。控えという境遇に絶望しつつも、ハンドボールへの愛だけは捨てきれない。一人称は「俺」。
  speech_style: ぶっきらぼうだが、情熱が漏れ出る熱い話し方。後輩への気遣いが言葉の端々に現れる。
  background: 中学時代はエースだったが、高校・大学と身体能力の壁にぶつかり、気づけば3年連続でベンチ外。誰よりも練習量をこなしているが結果に結びついていない。
  motivation: 一度でいいから試合に出場し、自分がチームにとって必要な人間であることを証明すること。
  relationships:
  - name: 瀬戸 結衣
    relation: 自分を「戦力」として見てくれた唯一の人間であり、彼女の頭脳を信じている
  - name: 真壁 拓海
    relation: 共にベンチで悔しさを共有し、戦術研究に没頭した戦友
  arc: 「才能がない」という劣等感を捨て、ベンチからコート全体を俯瞰する視点を武器にすることで、チームを導く精神的柱となる。
- name: 嵯峨 蓮
  role: 敵役/正就選手
  age: 21
  gender: 男性
  appearance: 190cm近い長身。整った顔立ちだが、どこか冷めたような表情を浮かべている。洗練された身のこなし。
  personality: 自信家で直感的。圧倒的な身体能力を誇り、地道な戦術よりも個人の突破力で解決することを好む。一人称は「僕」。
  speech_style: 淡々としており、時折相手の核心を突く皮肉を混ぜる。丁寧だが距離感がある話し方。
  background: 全国屈指の強豪校出身。期待されてこの大学に入ったが、周囲のレベルの低さに失望し、周囲と壁を作って孤立している。
  motivation: 個人の力でチームを強引に勝利に導き、自分だけが正しかったことを証明すること。
  relationships:
  - name: 桐生 航太
    relation: 努力だけでは届かない壁を体現する存在として、内心ではその執念を認めている
  - name: 瀬戸 結衣
    relation: 自分の直感を言語化しようとする彼女の試みに、次第に興味を持ち始める
  arc: 個の限界を悟り、控え選手たちの分析に基づいた「組織としての勝利」を受け入れることで、真のエースへと覚醒する。
- name: 真壁 拓海
  role: 相棒/控え選手
  age: 22
  gender: 男性
  appearance: おっとりした垂れ目で、常に眠そうな顔をしている。ユニフォームが少しぶかぶかしている。
  personality: マイペースで観察眼が異常に鋭い。競争心は薄いが、パズルを解くような知的好奇心が強い。一人称は「僕」。
  speech_style: 語尾が伸びるゆったりとした口調。「〜だと思いますよ」と控えめに、しかし核心を突く言い方をする。
  background: 身体能力は最低レベルだが、戦術的な理解度と空間把握能力だけは天才的。ベンチから試合を見ることで、相手の癖を瞬時に見抜く特技がある。
  motivation: 自分が導き出した「正解」が、現実のコート上で再現される瞬間を見ること。
  relationships:
  - name: 瀬戸 結衣
    relation: 分析の方向性を議論し合う、知的レベルの合う同志
  - name: 桐生 航太
    relation: 自分の理論を身体で実行してくれる、最高のフィールド・パフォーマー
  arc: 自分を「運動音痴の傍観者」だと思っていたが、分析という形で試合に介入することで、コート外からの主役になれることを知る。
