title: 青い風と、止まった時計の戦術
genre: 群像劇
tone: 熱量のある青春群像劇。緻密な戦術描写と静かな心情吐露が共存する雰囲気
pov: 三人称
tense: 過去形
setting: 現代。地方の弱小大学ハンドボール部とその練習拠点である海沿いの体育館
premise: 三年間一度も勝てなかった大学ハンドボール部。主役はスター選手ではなく、試合に出られない控え選手たちと、データに没頭するマネージャーだった。彼らはOBが遺した「壊れた懐中時計」に刻まれた古い戦術メモを解読し、ベンチからの視点を最大限に活かした独自の戦略で強豪校に挑む。コート上の熱狂と、ベンチの冷徹な分析が交錯する逆転の物語。
themes:
- 役割の肯定
- 見えない貢献の価値
- 継承と革新
rules:
- ハンドボールの競技ルールを厳守しつつ、戦術的な駆け引きを物語の核とする
- 試合展開は、コート上の視点だけでなく、ベンチからの指示や観客の反応を交互に描写する
- 控え選手が分析した「相手の癖」が、試合中の具体的な得点シーンに結びつく構成にする
plot_outline:
- '序盤: 連敗続きのチーム。絶望的な状況の中、マネージャーが部室の奥から、かつての黄金時代を築いたOBの遺品である「壊れた懐中時計」と、そこに挟まった断片的な戦術ノートを発見する。'
- '中盤: 控え選手たちが中心となり、ノートの暗号のような図解を現代のルールに適合させる研究を始める。渡り鳥が季節ごとにルートを変えるように、相手の守備陣形に合わせて柔軟に役割を交代させる「流動的フォーメーション」を構築する。'
- '終盤: 地区予選。強豪校を相手に、ベンチの控え選手たちがリアルタイムで分析結果を伝え、試合中に戦術を書き換えていく。作戦ボードに描かれた矢印が、現実のコート上で鮮やかなパスワークとして再現される。'
- '結末: 結果として勝利を掴むが、それ以上に「自分たちがこのチームに必要だった」という確信を得る。止まっていた懐中時計は直らなかったが、彼らの時間は確実に動き出し、次の世代へバトンを繋ぐ準備が整う。'
style_notes: チームスポーツとしての群像劇を徹底する。作戦ボードの描写は「右サイドバックが斜めに切り込み、ディフェンスの意識を中央に集めてから、左翼へ鋭い低速パスを出す」といったように、視覚的な図解を言葉で再現すること。控え選手が抱く焦燥感や、マネージャーが記録するノートの筆致、観客席から聞こえるどよめきなど、周辺視点からの描写を多用し、チーム全体の立体感を出すこと。
