- name: カイ
  role: 主人公
  age: 28
  gender: 男性
  appearance: 痩身で色白。常に疲れたような眼差しをしており、機能性重視の地味な作業服を纏っている。
  personality: 内向的で几帳面。喪失感に囚われており、静寂を好む。一人称は「僕」。
  speech_style: 控えめで丁寧だが、どこか自信なげな話し方。言葉数が多い方ではない。
  background: 他人の断片的な記憶をデジタル的に整理・修復する「記憶修復士」として勤務。数年前に最愛の妻を亡くし、心の空白を埋めることができずにいる。
  motivation: 妻が遺した映像の謎を解き、彼女が最後に見た「本物の世界」に触れたい。
  relationships:
  - name: エナ
    relation: 亡き妻
  - name: リナ
    relation: 協力者・情報屋
  - name: 有沢
    relation: 管理システムの監督官
  arc: 完璧な記憶の復元という執着を捨て、欠落や痛みがあるからこそ尊い「不完全な現実」を受け入れ、前を向いて生きることを決意する。
- name: エナ
  role: 物語の鍵を握る人物
  age: 26
  gender: 女性
  appearance: 柔らかい笑顔と、好奇心に満ちた明るい瞳。システムが推奨しない、古びた手織りのストールを愛用していた。
  personality: 自由奔放で感受性が強く、管理された幸福よりも不便な真実を愛する。一人称は「私」。
  speech_style: 感情豊かで、比喩表現を多く用いた詩的な話し方。
  background: 元は環境制御システムの補助研究員だったが、システムの不完全さと、排除された自然の美しさに気づき、密かに「季節の境界線」を探索していた。
  motivation: いつか人々が、管理された空ではなく、本物の風と鳥の声を取り戻すこと。
  relationships:
  - name: カイ
    relation: 夫
  arc: （故人であるため変化はないが）カイの記憶の中で、単なる「懐かしき人」から「導き手」へと意味合いが変化していく。
- name: リナ
  role: 相棒
  age: 23
  gender: 女性
  appearance: ショートカットの髪に派手な色のアクセサリーをつけ、オーバーサイズのテックウェアを着用している。
  personality: 現実主義で皮肉屋。だが根は情に厚く、未知のものへの知的好奇心が強い。一人称は「私」。
  speech_style: ぶっきらぼうで速い口調。専門用語やネットスラングを混ぜて話す。
  background: システムの監視網の隙間を縫って移動する「シグナル・ハンター」。都市の管理外にある未開領域のデータを収集し、闇市場で売っている。
  motivation: システムが隠蔽している「世界の真の姿」を暴き、退屈な日常を破壊すること。
  relationships:
  - name: カイ
    relation: ビジネスパートナーから友人へ
  arc: 効率と合理性のみを信じていたが、カイと共に旅をすることで、効率では測れない「心の揺らぎ」や「情緒」の価値に気づく。
- name: 有沢
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない三つ揃えのスーツに身を包み、縁のない眼鏡をかけている。表情の変化が極めて少ない。
  personality: 極めて理性的で冷徹。不確定要素を排除することが最大の慈悲であると信じている。一人称は「私」。
  speech_style: 論理的で断定的。感情を排した、静かで威圧感のある話し方。
  background: 都市環境制御システムの最高責任者。かつての自然災害による悲劇を経験しており、「制御された幸福」こそが人類の正解だと確信している。
  motivation: 「季節の境界線」というノイズを完全に消去し、完璧に管理されたユートピアを完成させること。
  relationships:
  - name: カイ
    relation: 管理対象の市民
  - name: エナ
    relation: かつての部下であり、反逆者
  arc: カイの不屈の意志と、不完全な自然の美しさを突きつけられ、自らが切り捨てた「痛み」こそが人間らしさであったことに、わずかな後悔を抱く。
