- name: 葛城 櫂 (かつらぎ かい)
  role: 主人公
  age: 24
  gender: 男性
  appearance: 鋭い眼光と、無造作に結い上げた黒髪。右腕にはかつての戦いで負った古い傷跡があり、常に折れた剣の破片を懐に忍ばせている。
  personality: 苛烈で冷徹。復讐心のみを原動力として生きる荒ぶる魂。一人称は「俺」。
  speech_style: 短く、ぶっきらぼう。相手を威圧するような硬い口調。
  background: 没落した葛城家の長男。一族が滅ぼされた夜、銘刀の片割れを手に生き延び、仇を討つためだけに浪人の身として修羅の道を歩んできた。
  motivation: 一族を滅ぼした者への復讐と、折れた剣を完成させて一族の誇りを取り戻すこと。
  relationships:
  - name: 葛城 蓮
    relation: 双子の弟
  - name: 帝真
    relation: 宿敵
  arc: 復讐という単一の目的で動いていたが、弟との対峙を通じて「己の正義」と「血の因果」の狭間で激しく葛藤し、最後には自らの業を受け入れる。
- name: 葛城 蓮 (かつらぎ れん)
  role: 主人公
  age: 24
  gender: 男性
  appearance: 穏やかだが、意志の強さを感じさせる静かな瞳。灰色の僧衣を纏い、首からは数珠を下げている。櫂とは対照的に清潔感がある。
  personality: 慈悲深く、冷静沈着。争いを忌避するが、理不尽な暴力に対しては断固とした態度を取る。一人称は「私」。
  speech_style: 丁寧で静かな口調。相手の核心を突くような、落ち着いた話し方。
  relationships:
  - name: 葛城 櫂
    relation: 双子の兄
  - name: 帝真
    relation: 対峙すべき悪
  arc: 祈りによって戦乱を鎮めようとしてきたが、剣の真の力が持つ「破壊」の側面を知り、慈悲と断絶の矛盾に直面する。
- name: 帝真 (ていしん)
  role: 敵役
  age: 45
  gender: 男性
  appearance: 威厳のある風貌。豪華な装飾が施された黒漆の鎧を纏い、常に冷徹な笑みを浮かべている。
  personality: 野心家で極めて合理主義。力こそが秩序を生むと信じる支配者。一人称は「余」。
  speech_style: 高圧的で尊大。命令を下すような、人を跪かせる響きを持つ。
  background: 蒼天領の新興勢力を率いる覇者。葛城家を滅ぼした張本人であり、伝説の銘刀の力を手に入れ、天下を武力によって統一しようとしている。
  motivation: 折れた剣を完全なものとし、その超越的な力を手に入れて乱世を統治すること。
  relationships:
  - name: 葛城 櫂
    relation: 排除すべき生き残り
  - name: 葛城 蓮
    relation: 利用対象
  arc: 絶対的な力を求めて奔走するが、兄弟の絆と剣が呼び覚ます真の力の前に、自らの野望が空虚なものであることを突きつけられる。
- name: 雪代 志乃 (ゆきしろ しの)
  role: 脇役
  age: 22
  gender: 女性
  appearance: 雪のように白い肌と、切れ長の瞳。動きやすい着物姿で、忍びの装束を隠し持っている。
  personality: 現実主義で冷静。感情をあまり表に出さないが、内に秘めた情熱は強い。一人称は「私」。
  speech_style: 簡潔で無駄がない。情報の聞き出しや交渉において、相手を煙に巻くような話し方。
  background: かつて葛城家に仕えていた家臣の娘。現在は城下町で情報屋として生き、戦乱の動向を追っている。
  motivation: 葛城家の再興ではなく、生き残った人々が戦火に巻き込まれず、平穏に暮らせる世界を見ること。
  relationships:
  - name: 葛城 櫂
    relation: 密かに見守る対象
  - name: 葛城 蓮
    relation: 共鳴する者
  arc: 復讐と慈悲の間で揺れる兄弟の行く末を傍で見守り、彼らが破滅へ向かう運命の中で、一筋の人間としての光を見出そうとする。
