title: 双極の残照、断絶の刃
genre: 歴史・時代小説
tone: 荘厳かつ哀切、重厚な歴史のうねりを感じさせる文体
pov: 三人称多視点（群像劇）
tense: 過去形
setting: 架空の戦乱期、北方の峻険なる国「蒼天領」
premise: かつて一族の誇りを象徴した銘刀は、ある悲劇の夜に二つに折れ、双子の兄弟へと分かたれた。一人は復讐の炎に焼かれる剣客となり、一人は因果を断つ僧侶となった。乱世の覇権を巡る争いの渦中で、二つの欠片は再び惹かれ合い、運命の歯車を回し始める。血脈が求める宿命と、個の魂が求める正義が、折れた刃の上で激突する。
themes:
- 血脈と宿命
- 正義の相克
- 喪失による自己の確立
rules:
- 双子は魂の片割れであり、一方が死すとき他方は精神的な欠損を来す
- 折れた剣の破片は、持ち主の意志の強さに呼応して微かな共鳴を見せる
plot_outline:
- '序盤: 没落した葛城家の生き残りである双子の兄弟、櫂と蓮。浪人として生きる櫂は、折れた剣の破片を手に仇敵を追う日々を送り、出家した蓮は、戦火に沈む民を救うべく祈りを捧げていた。'
- '中盤: 新たな覇者が、葛城家の遺産である「折れた剣」の完全性を求めて動き出す。櫂は復讐のために、蓮は戦乱を鎮めるために、それぞれの目的を抱いて一つの城下町へと集い、互いの正義が衝突し始める。'
- '終盤: 剣の破片が揃う時、銘刀が持ち合わせていた真の力が覚醒する。しかし、それは一族の再興ではなく、血塗られた歴史を終わらせるための破壊の力であった。兄弟は戦場で対峙し、己の信じる義を刃に託す。'
- '結末: 激しい決闘の果て、兄弟は互いの矜持を認め合いながらも、決定的な訣別を迎える。残されたのは、修復された剣ではなく、ただ静かに降り積もる雪と、二人が歩んだ孤独な軌跡のみであった。'
style_notes: 格調高い語彙を厳選し、人物の矜持と静かな情念を描くこと。地の文は硬質かつ簡潔に保ち、感情を直接的に説明せず、自然の移ろいや物の質感、登場人物の微細な仕草に託して表現する。章ごとに視点を切り替え、各々の正義が持つ重みを等価に描く群像劇の構成を徹底すること。
