title: 絶滅言語的周波数に関する考察報告書
genre: 伝奇
tone: 学術的な冷徹さと、断片的な狂気が同居する報告書形式
pov: 一人称（研究者としての記述者）
tense: 現在形および過去形（論文形式の混在）
setting: 現代の地方都市および、その深層に存在する『記憶の沈殿層（地下図書館）』
premise: ある特定の時間帯にのみ受信可能な『夜明けのラジオ』。そこから流れるのは、現世では失われたはずの神代の言語と、聞き手の未来を予言する断片的な記述であった。研究者ヘルマンは、この周波数の正体を突き止めるため、都市の地下に眠る禁書庫へと足を踏み入れる。そこで彼は、世界が『巨大な録音装置』であるという戦慄の事実に直面する。
themes:
- 記録と忘却
- 言語の限界
rules:
- ラジオの放送は午前4時から4時15分までのみ受信可能である
- 地下図書館の蔵書は、所有者が死亡した瞬間に自動的に書き込まれる
- 特定の周波数を口唱することで、物質の『記憶』を物理的に回帰させることができる
plot_outline:
- 序盤：ある古書店で入手した『未完の周波数リスト』に基づき、夜明けのラジオの正体を探る記述が始まる。聞き手によって内容が異なるという特異性が報告される。
- 中盤：ラジオの信号源を追った結果、都市の地図にない地下図書館へと到達し、そこに記された自身の『未来の死因』を閲覧してしまい、記述の改変を試みる。
- 終盤：ラジオの正体が、世界を再構築しようとする絶滅言語の意志であることを突き止め、現実世界が徐々に音声データへと置換されていく現象に遭遇する。
- 結末：ヘルマンは自らを『最後の注釈者』として地下図書館に封印し、世界を完全な静寂から救うための永劫の記録作業に就く。
style_notes: 架空の論文形式。章立てを行い、本文中に【注1】【注2】などの脚注を挿入して設定を補足すること。証拠写真の記述や、他者の手記の引用を挟み、読者が提示された断片的な資料から真相を推測させる構成とする。
