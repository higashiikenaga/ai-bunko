title: お腹ぺこぺこ！異界渡り鳥の休憩所
genre: 日常ほのぼの
tone: 明るい、賑やか、コミカル
pov: 一人称（あたし）
tense: 現在形（軽快な語り口）
setting: 現代日本の路地裏にある、異世界の旅人が立ち寄る不思議なカフェ
premise: 街の片隅で、異世界を旅する「渡り鳥」たちの憩いの場を営むあたし。彼らにとってこの店は砂漠のオアシスのような場所で、お腹を空かせた迷い客が次々とやってくる。美味しいご飯と賑やかなお喋りで、疲れ切った旅人たちの心を解きほぐす、もぐもぐ快楽物語！
themes:
- 食の喜び
- 居場所としての心地よさ
rules:
- 客は異世界の住人（渡り鳥）であること
- 支払いは通貨ではなく、旅先で拾った不思議な種や思い出の品で行う
- 店内で喧嘩を始めた者は、罰として強制的に激辛の特製オムライスを食べさせられる
plot_outline:
- '序盤: 異世界の旅人たちが集まるカフェの日常と、あたしの賑やかな接客風景を描き、店独自のルールや賑やかさを提示する。'
- '中盤: 記憶を失った小鳥の姿をした旅人が現れ、彼に最高の料理を振る舞うことで、失った記憶や故郷への想いを取り戻させようと奮闘する。'
- '終盤: 旅人が故郷へ帰る準備を整え、店に集まった常連の旅人たちと共に、豪華食材を盛り込んだ盛大な「送別大食いパーティー」を開催する。'
- '結末: 旅人は去るが、また新しい「渡り鳥」が店を訪れ、あたしの賑やかで美味しい日常がこれからも続いていくことを確信する。'
style_notes: 「あたし」による軽快な一人称視点。ツッコミを多用したテンポの良い会話劇を展開し、キャラクターの可愛さを強調する。特に料理の香りや食感を詳細に、食欲をそそる表現で描写すること。毎話必ず、客の奇妙な行動やあたしの迷言など、クスッと笑えるポイントを盛り込む。
