- name: エリス・ルミエール
  role: 主人公
  age: 19
  gender: 男性
  appearance: 色素の薄いベージュの髪に、知的好奇心に満ちた碧い瞳。多くの手帳や記録道具を収納した大きな旅用コートを纏っている。
  personality: 穏やかで思慮深く、未知の知識と美味しい料理に目が無い。一人称は「僕」。
  speech_style: 丁寧で物腰柔らか。感銘を受けた際に「これは素晴らしい記憶だ」と独り言を言う癖がある。
  background: 浮遊島の小さな村で、代々受け継がれてきた「記憶の拾い人」の家系に生まれた。古い書物や断片的な言葉を集め、日記に綴ることを生業としている。
  motivation: 世界に散らばる失われた記憶を収集し、海底遺跡にあるという「地下図書館」で世界の成り立ちを知ること。
  relationships:
  - name: リィナ
    relation: 航海を共にする信頼できるパートナー
  - name: ソラリス
    relation: 知恵を授けてくれる導き手
  arc: 受動的に記録を集めるだけの存在から、自らの足で世界の真実に触れ、未来へ記憶を繋ぐ意志を持つ書き手へと成長する。
- name: リィナ・ノア
  role: 相棒
  age: 21
  gender: 女性
  appearance: 快活な印象の短めの銀髪。雲海潜水用の機能的なレザー衣装を身に纏い、腰には特製のコンパスを下げている。
  personality: 勝ち気で行動的。直感的で、エリスの慎重さを補う大胆さを持つ。一人称は「私」。
  speech_style: ハキハキとしていて快活。時折、ぶっきらぼうだが根は情に厚い。
  background: 雲海の下層を探索するダイバーの家系に生まれるが、現在はフリーのナビゲーターとして活動している。刺激的なスパイス料理をこよなく愛する。
  motivation: 誰も到達したことのない海底の最深部へ行き、伝説の景色をこの目で見るという冒険心。
  relationships:
  - name: エリス・ルミエール
    relation: 凸凹ながらも互いを認め合う旅の仲間
  arc: 目的のためだけの突き進む冒険から、エリスと共に旅することで、道中の小さな風景や記憶の価値に気づくようになる。
- name: ソラリス
  role: 守護者
  age: 不詳
  gender: 中性
  appearance: 透き通るような白い肌に、星屑を散りばめたような深い紺色のローブを纏っている。瞳には銀河のような光が宿っている。
  personality: 超然としており、静謐。寂しげな雰囲気を纏っているが、知識を求める者には寛容。一人称は「私」。
  speech_style: 詩的で緩やか。比喩表現が多く、相手に問いかけるような話し方をする。
  background: 海底の地下図書館に永い年月をかけて君臨し、世界の記憶を管理し続けてきた最後の守護者。
  motivation: 「最初の言葉」を正しく理解し、記録できる後継者（記憶の拾い人）が現れるのを待っていた。
  relationships:
  - name: エリス・ルミエール
    relation: 自身の役割を託すにふさわしい旅人
  arc: 永い孤独の中で記憶の檻に囚われていたが、エリスとの対話を通じて、記憶は留めるものではなく、誰かに伝え、更新していくものであると悟る。
