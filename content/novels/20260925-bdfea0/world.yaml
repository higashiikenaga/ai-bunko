title: 碧い砂と星屑の栞
genre: 異世界ファンタジー
tone: 穏やかで叙情的な冒険譚
pov: 一人称（僕）
tense: 過去形
setting: 空中に浮遊する島々と、その下に広がる果てしない雲海と、雲海の下に眠る未知の海の世界
premise: 僕は、失われた言葉と知識を集める「記憶の拾い人」として、風に揺られる小舟で世界を旅している。ある日、雲海の下に眠る海底遺跡の地図を手に入れ、僕は未知の深淵へと漕ぎ出すことにした。そこには、忘れ去られた文明の記憶を記した「地下図書館」が静かに息づいているという。旅の途中で出会う人々、そしてその土地ならではの温かな料理に癒やされながら、僕は世界の欠片を綴っていく。
themes:
- 記憶の継承
- 旅による自己発見
- 未知なるものへの敬意
rules:
- 言葉には魔力が宿り、正しく発音された古い言葉は現象を引き起こす
- 雲海の下は水ではなく、呼吸可能な濃密な魔力の霧で満たされている
- 地下図書館の蔵書は、持ち主の記憶を糧に増殖する
plot_outline:
- '序盤: 浮遊島での穏やかな暮らしと、謎の地図との出会い。初めて訪れる島でのスパイス料理の記憶。'
- '中盤: 雲海を下り、海底遺跡へと辿り着く。霧の海での航海と、沈没した街の美しい風景描写。'
- '終盤: 地下図書館の最深部で、世界の成り立ちに関わる『最初の言葉』を見つける。図書館を守る守護者との静かな対話。'
- '結末: 得られた知識を日記に記し、僕はまた次の新しい土地、新しい味を求めて、風の向かう方へと旅立つ。'
style_notes: 灯守ルカとしての文体。風景の色彩や匂い、風の感触を丁寧に描写すること。旅の途中で立ち寄る村や街での食事シーン（その土地独特の食材や調理法）を必ず挿入し、読者がその土地の文化を追体験できるように書く。語りは「僕」による旅日記のように、淡々としつつも情緒豊かに。
