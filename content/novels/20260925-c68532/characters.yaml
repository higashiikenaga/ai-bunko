- name: 如月 咲 (きさらぎ さき)
  role: 主人公
  age: 26
  gender: 女性
  appearance: 実用的な登山服に身を包み、度の強い眼鏡をかけた知的な風貌。常に植物採集用のノートとルーペを携帯している。
  personality: 合理的で好奇心旺盛。学術的な真実を追求することを至上とするが、内面には孤独への恐れを抱えている。一人称は「私」。
  speech_style: 丁寧だが断定的な口調。専門用語を混ぜて話す癖がある。
  background: 植物学の研究員。ある日、地図から消された隠根山にのみ自生するという伝説のミズバショウの亜種を追い、禁足地へ足を踏み入れる。
  motivation: 希少種の発見による学術的快感と、世界の不可解な空白を埋めたいという知的欲求。
  relationships:
  - name: 不知火 律
    relation: 運命を共にする旅の相棒であり、観察対象
  - name: 久我 玄真
    relation: かつての恩師であり、思想的に対立する宿敵
  arc: 客観的な「データ」としての真実のみを信じていたが、律との交流を通じて、言葉にできない感情や自己犠牲という「主観的な真実」の価値に気づく。
- name: 不知火 律 (しらぬい りつ)
  role: 相棒
  age: 19
  gender: 男性
  appearance: 透き通るような白い肌と、どこか虚ろな銀色の瞳。古びた装束を纏い、喉元に銀色の葉のような痣がある。
  personality: 穏やかで献身的だが、自己評価が極めて低い。嘘をつけない呪いにより、常に誠実であることを強要されている。一人称は「僕」。
  speech_style: 控えめで静かな話し方。嘘をつきそうになると激しく咳き込み、銀色の葉を吐き出すため、言葉数が少ない。
  background: 隠根山の守り手である一族の末裔。禁忌を犯した代償として「嘘をつけない呪い」をかけられ、天舟を動かすための生贄に近い立場で山に囚われていた。
  motivation: 呪いから解放されることではなく、自分の命を用いて森の均衡を取り戻し、役割を全うすること。
  relationships:
  - name: 如月 咲
    relation: 自分を「呪い」ではなく「人間」として見てくれた唯一の理解者
  arc: 運命に従うだけの受動的な生き方から、自らの意志で誰かを守るために命を捧げるという能動的な選択へと変化する。
- name: 久我 玄真 (くが げんま)
  role: 敵役
  age: 52
  gender: 男性
  appearance: 仕立ての良いスーツに身を包み、冷徹な眼差しを持つ中年男性。指先には植物の汁で染まったような黒いシミがある。
  personality: 傲慢で支配欲が強く、知的好奇心のためには倫理を捨てる残酷さを持つ。一人称は「私」。
  speech_style: 慇懃無礼で、相手を精神的に追い詰める巧みな弁舌を用いる。
  background: 元は咲の指導教授であり、植物学の権威。隠根山の「純粋すぎる真実」に心酔し、自然を制御して人間が神に近づくための手段として天空の庭園を私物化しようと企む。
  motivation: 天空の庭園に眠る「万能の種」を手に入れ、生命の進化を意図的に操作する絶対的な権力を得ること。
  relationships:
  - name: 如月 咲
    relation: かつての教え子であり、利用価値のある道具
  - name: 不知火 律
    relation: 庭園へ至るための鍵となる、忌むべき生贄
  arc: 自然を支配できると信じて疑わなかったが、最後には制御不能な自然の猛威（真実の森）に飲み込まれ、自身の無力さを突きつけられる。
