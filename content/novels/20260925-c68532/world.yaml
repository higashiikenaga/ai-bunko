title: 苔むす天舟と真実の森
genre: 伝奇
tone: 静謐で写実的な観察記録風
pov: 一人称（私）
tense: 過去形
setting: 近代日本、地図から消された深い山嶺「隠根山（くねやま）」とその上空
premise: 植物調査員である私は、伝説の希少種を求めて禁足地の森へ足を踏み入れる。そこで出会ったのは、嘘をつこうとすると喉から銀色の葉が溢れ出す「嘘をつけない呪い」を背負った青年だった。二人は古の巨樹を加工して作られた「天舟」に乗り、雲海の上に浮かぶ絶滅したはずの植物園を目指す。
themes:
- 自然の峻厳さと慈悲
- 真実という名の孤独
rules:
- 嘘をつけない呪い：嘘を口にしようとした瞬間、肺から銀色の植物の葉が逆流し、呼吸困難に陥る。真実のみが生存の条件となる。
- 天舟：数千年前の巨杉をくり抜き、風の精霊を宿らせた飛行船。燃料は特定の高山植物の蜜であり、高度が上がるほど森の記憶を呼び覚ます。
- 隠根山の生態系：高度によって時代が異なり、下層には現世の植物が、上層には太古の絶滅種が自生している。
plot_outline:
- 序盤：私は希少なミズバショウの亜種を求めて隠根山に入山し、そこで銀色の葉を吐き出しながらうずくまる青年・律と出会う。彼はこの山の守り手であり、同時に呪われた囚人であった。
- 中盤：律の案内で、私は雲上の植物園へと向かうための「天舟」に乗り込む。道中、私は彼がなぜ嘘をつけなくなったのか、そしてこの山が隠し持っていた「純粋すぎる真実」の正体を、植物たちの観察を通じて知ることになる。
- 終盤：天舟はついに天空の庭園に到達するが、そこには人間の欲望によって歪められた自然の成れの果てが待っていた。律は呪いを利用し、自身の命を触媒にして森の均衡を取り戻そうとする。
- 結末：天舟は土へと還り、律は静かに森の一部となる。私は彼が最後に残した「真実の言葉」を日記に記し、再び静寂に包まれた山を降りる。
style_notes: 徹底して自然描写に拘る。例えば単に「苔」とせず「ハイゴケ」や「ホソバミズゴケ」と具体的に記し、土の匂いや湿度の変化を丁寧に描写すること。感情を直接的に表現せず、風景の移ろいや植物の挙動に託して語る、静かな筆致を維持する。
