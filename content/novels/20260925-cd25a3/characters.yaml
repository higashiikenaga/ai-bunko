- name: 織部 紬
  role: 主人公
  age: 23
  gender: 女性
  appearance: 控えめで清潔感のある佇まい。祖父から譲り受けた古いフィルムカメラを大切に持ち歩いている。
  personality: 内向的で思慮深い。周囲に合わせすぎて自分を見失いがちな傾向がある。一人称は「私」。
  speech_style: 丁寧で静かな口調。言葉を選ぶため、間が空くことが多い。
  background: 都市部で就職したが、人間関係や仕事に馴染めず空虚感を抱えていた。祖父の死をきっかけに、彼が隠していた過去に興味を持つ。
  motivation: 祖父が遺した手紙の宛先である「藍色の村」の正体を知り、自分自身の心の拠り所を見つけたい。
  relationships:
  - name: 織部 誠二
    relation: 祖父
  - name: 佐々木 玄蔵
    relation: 導き手
  - name: 瀬戸 海斗
    relation: 案内役・友人
  arc: 過去の喪失を嘆く受動的な姿勢から、記憶を書き留め継承するという能動的な生き方へと変化する。
- name: 佐々木 玄蔵
  role: 相棒/導き手
  age: 82
  gender: 男性
  appearance: 深く刻まれた皺と、すべてを見透かすような穏やかな眼差し。色褪せた藍染めの作務衣を纏っている。
  personality: 達観しており、静かな慈愛に満ちている。一人称は「儂」。
  speech_style: ゆっくりとした、古風な山間の訛りが混じる話し方。
  background: 地図から消えた「藍色の村」の唯一の生き残り。村が廃墟となってからも、心の中で村の営みを守り続けてきた。
  motivation: 自分が死ぬ前に、村の記憶を誰か信頼できる者に託し、人々の生きた証を完結させたい。
  relationships:
  - name: 織部 紬
    relation: 聞き手
  - name: 織部 誠二
    relation: かつての親友
  arc: 孤独に抱えていた記憶を紬に開示することで、長年の孤独から解放され、穏やかな死への準備を整える。
- name: 織部 誠二
  role: 物語の起点
  age: 75
  gender: 男性
  appearance: （回想・写真の中）白髪に鋭い眼光を持つが、手紙を書くときだけは優しい表情をしていた。
  personality: 誠実で情熱的だが、それを表に出すのが苦手な不器用な性格。
  speech_style: （手紙の中で）簡潔ながらも、行間に深い情愛と後悔を滲ませる文体。
  background: かつて藍色の村の青年だったが、ある悲劇的な出来事を機に村を離れ、正体を隠して生きてきた。
  motivation: 離散した人々への贖罪として、記憶という形での「再会」を構築し、繋ぎ止めること。
  relationships:
  - name: 織部 紬
    relation: 孫
  - name: 佐々木 玄蔵
    relation: 親友
  arc: 生前、手紙を書き続けることで、絶望的な別れを「優しい記憶」へと昇華させた。
- name: 瀬戸 海斗
  role: 脇役
  age: 27
  gender: 男性
  appearance: 日焼けした肌に快活な笑顔。機能的なアウトドアウェアを着用し、常に身軽な格好をしている。
  personality: 明るく世話焼き。現実主義だが、根はロマンチストで未知のものへの好奇心が強い。一人称は「俺」。
  speech_style: 砕けた口調でテンポよく話し、重い空気感を和ませる。
  background: 町の役場に勤める職員。地域の歴史や地理に詳しく、地図にない場所や廃村の噂に強い関心を持っている。
  motivation: 紬の旅をサポートしながら、地域の忘れ去られた歴史を再発見し、記録に残したい。
  relationships:
  - name: 織部 紬
    relation: 友人・サポート役
  arc: 効率や利便性のみを重視する現代的な価値観から、目に見えない「記憶」や「約束」の価値を認めるようになる。
