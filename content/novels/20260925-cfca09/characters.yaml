- name: 九条 蓮
  role: 主人公
  age: 32
  gender: 男性
  appearance: 清潔感のある端正な顔立ちだが、目の下に深い隈があり、どこか虚ろな印象を与える。常にグレーのトレンチコートを着用している。
  personality: 理性的で謙虚。自分を「正義感のある人間」だと信じたい願望が強い。一人称は「私」。
  speech_style: 丁寧で控えめな口調。確信がないときは語尾を濁らす傾向がある。
  background: 元エリート会社員。数年前のある事件をきっかけに精神的なショックを受け、記憶の一部を喪失（解離性健忘）している。
  motivation: 買い戻した日記の記述を頼りに、過去に起きた失踪事件の真相を突き止め、犯人を特定すること。
  relationships:
  - name: 咲夜 恭
    relation: 記憶を取り戻すためのガイドとして信頼し、同時に違和感を抱く相手
  - name: 水城 遥
    relation: 日記の中で救おうとした（と思い込んでいる）被害者
  arc: 自らを「正義の目撃者」と定義して推理を展開するが、最終的に自分が「冷酷な加害者」であったという絶望的な真実に直面し、精神的に崩壊する。
- name: 咲夜 恭
  role: 敵役
  age: 45
  gender: 女性
  appearance: 黒い喪服のようなドレスを纏い、銀縁の眼鏡をかけている。感情の読めない静謐な微笑みを絶やさない。
  personality: 冷徹で計算高く、相手の心理的な隙を突くことに長けている。一人称は「私（わたくし）」。
  speech_style: 静かで理知的。相手を誘導するための問いかけが多く、断定を避ける話し方をする。
  background: 被害者である水城遥の姉。妹を殺害しながら記憶を消して逃げ切ろうとした九条に対し、法的な処罰ではなく、精神的な地獄を味わわせるための復讐を計画した。
  motivation: 九条に自白させ、彼が最も恐れていた「誠実ではない自分」を突きつけ、絶望させること。
  relationships:
  - name: 九条 蓮
    relation: 復讐の対象であり、心理的な実験動物
  - name: 水城 遥
    relation: 最愛の妹
  arc: 謎めいた古本屋の店主として九条を導くが、最終的に彼を破滅へと追い込む処刑人としての正体を現す。
- name: 水城 遥
  role: 脇役（回想・日記上の人物）
  age: 21
  gender: 女性
  appearance: 儚げで透明感のある容姿。雨に濡れた白いワンピースのイメージで記憶に現れる。
  personality: 心優しく献身的だが、どこか危うさを秘めていた。
  speech_style: 穏やかで、相手を肯定するような包容力のある話し方。
  background: 数年前に失踪し、その後遺体が発見された事件の被害者。九条が日記に記した「愛情」の裏側にある独占欲の犠牲となった。
  motivation: （物語上の役割として）九条の罪悪感を刺激し、真実へと引きずり出す触媒となること。
  relationships:
  - name: 九条 蓮
    relation: かつての恋人であり、殺害された被害者
  - name: 咲夜 恭
    relation: 実の姉
  arc: 序盤は「救われるべき被害者」として描かれるが、終盤に「九条の狂気によって奪われた命」としての凄惨な真実が明かされる。
