title: 模造された誠実
genre: 本格ミステリー
tone: 冷徹で静謐。徐々に不安が浸食する心理サスペンス
pov: 一人称
tense: 過去形
setting: 現代日本。地方都市の路地裏にある、雨の日だけ開店する古本屋
premise: 私は、雨の日だけ開くという奇妙な古本屋に、かつて自分が預けたはずの「記憶を書き留めた日記」を探しに行く。店主の不可解な誘導に従い、断片的に買い戻した日記のページには、私が忘れていた凄惨な殺人の記録が綴られていた。私は自らを「事件の目撃者」と定義して真相を追うが、次第に日記の筆致に、耐え難いほどの既視感と違和感を抱き始める。
themes:
- 記憶の改竄
- 自己欺瞞
rules:
- 雨の日以外は店に辿り着けない（物理的な構造と心理的な盲点による仕掛け）
- 日記の内容は店主の提示する順序でしか開示されない
- 語り手の認識は天候と精神状態に強く依存する
plot_outline:
- 序盤：雨の日にのみ現れる古本屋を訪れる「私」。店主から、数年前に預けたという日記の存在を告げられ、ページを一枚ずつ買い戻す。私は日記の内容から、過去に起きたある失踪事件の真相を追う決意をする。
- 中盤：日記の記述を頼りに当時の状況を再現するが、記憶にある光景と日記の記述に微妙なズレが生じ始める。私は自分が被害者を救おうとした「正義の目撃者」であると信じ込み、真犯人を特定するための推理を展開する。
- 終盤：日記の最終ページを買い戻した瞬間、記述が「目撃」ではなく「実行」の記録であったことが判明する。店主の正体は被害者の遺族であり、雨の日という限定的な状況で私の解離性健忘を誘発させ、自白へと導く心理的な罠を張り巡らせていたことが露呈する。
- 結末：全ての記憶が回帰し、自分が冷酷な犯人であったことを認める。冒頭の「雨の日は、世界がとても静かに見える」という一文が、実は罪悪感から逃れるための精神的な遮断（解離）であったことが明かされ、雨が止み、現実の喧騒と絶望が押し寄せる中で幕を閉じる。
style_notes: 語り手は極めて理性的で誠実な人物として振る舞うが、記述の端々に「不自然な記憶の飛躍」や「都合の良い主観」を混ぜ込む。読者に「この語り手の視界は歪んでいる」と思わせる不協和音を忍ばせ、結末でその歪みを反転させる。
