title: 瑠璃色の雨に溶ける、剥製された春
genre: ホラー
tone: 耽美、退廃的、静謐な狂気
pov: 一人称
tense: 過去形
setting: 現代、雨の日にしか現れない路地裏の骨董店『玻璃の温室』
premise: 雨の日だけ開く奇妙な店で、私は世界で最も美しい「ガラスの桜」に出会う。その花弁に触れた瞬間から、私の指先は透き通り、冷たい宝石へと変わり始めた。美しさへの執着が心身を浸食し、人間であることを捨てて結晶となる快楽に溺れていく。これは、永遠の静止を願った者の、残酷で贅沢な末路の記録である。
themes:
- 美への病的な執着
- 生と死の境界線
- 永遠という名の停滞
rules:
- 店は雨が降っている間のみ、特定の路地に現れる。
- 店で売られるガラス細工は、かつて人間だった者の『最も美しい瞬間』を抽出して結晶化させたものである。
- 商品を購入した者は、代価として身体の一部から徐々にガラス化が進行し、最終的には店の商品（剥製）となる。
plot_outline:
- '序盤: 激しい雨の中、主人公は偶然『玻璃の温室』に迷い込む。そこで、生きた桜よりも鮮やかなガラスの桜に心を奪われ、人生で初めての衝動でそれを購入する。'
- '中盤: 日々、身体の端から皮膚が乳白色のガラスに変わり始める。恐怖よりも、自らが宝石のように精緻な存在へ作り変えられる高揚感が勝り、主人公はさらに多くの「美」を求めて雨の日を待ちわび、店に通い詰める。'
- '終盤: 店主の正体が、かつての客たちが作り上げた「美の集合体」であることを知る。同時に、自分の意識が薄れ、心臓さえも硬いダイヤモンドのような結晶に変わりつつあることに気づく。'
- '結末: 全身が完全にガラス化した主人公は、店の中で最も美しい一本の桜の樹として完成される。次の雨の日、店を訪れた新たな客が、主人公の指先だった花弁に触れるところで幕を閉じる。'
style_notes: 皮膚を陶器やオパールに、涙を砕けた水晶に例えるなど、徹底して鉱物・植物的な比喩を用いる。恐怖を直接的に描かず、「壊れそうなほど美しい」という視点から、生理的な違和感や絶望を詩的に描写すること。
