- name: アリステア・クロムウェル
  role: 主人公
  age: 27
  gender: 男性
  appearance: 銀縁の眼鏡に黒い外套。指先が常に白く、記憶の結晶を扱うための白い手袋を着用している。痩身でどこか儚げな印象を与える。
  personality: 冷静沈着で観察者的。他者の感情に深く干渉することを避けるが、本質的には慈悲深い。一人称は「私」。
  speech_style: 丁寧で静かな口調。比喩表現を多用し、論理的に話す。
  background: かつて自らの記憶をすべて失い、他者の記憶を蒐集・結晶化させることで自己を定義しようとしている記憶の蒐集家。
  motivation: 双子の依頼を遂行しつつ、その過程で失われた自らの「核」となる記憶の断片を探すこと。
  relationships:
  - name: ノエル
    relation: 依頼人であり、守るべき対象
  - name: レオン
    relation: 不信感から始まり、次第に共感し合う協力者
  - name: セレスティア
    relation: 知的な遊戯を繰り広げる宿敵
  arc: 傍観者として記憶を蒐集していたが、双子の自己犠牲的な愛に触れ、自らの意志で「誰かのために」記憶を捧げるという能動的な選択をする。
- name: ノエル
  role: 相棒/依頼人
  age: 17
  gender: 男性
  appearance: 陶器のように白い肌と、光を失った灰色の瞳。感情の起伏が乏しく、生ける人形のような少年。
  personality: 受動的で静か。魂の欠落による深い虚無感を抱えている。一人称は「僕」。
  speech_style: ぽつりぽつりと短く、抑揚のない話し方。
  background: 禁忌の術による事故で魂を抜き取られ、身体だけの「殻」となった双子の弟。
  motivation: 止まった時間を動かし、もう一度「心」を取り戻して兄と共に生きたい。
  relationships:
  - name: レオン
    relation: 最愛の兄であり、自身の魂の保持者
  - name: アリステア
    relation: 自分を人間として扱う数少ない理解者
  arc: 虚無の中で生きていたが、レオンの献身的な想いを知り、消滅の恐怖を超えて「愛すること」を選択し、精神的な充足を得る。
- name: レオン
  role: 相棒/依頼人
  age: 17
  gender: 男性
  appearance: 身体の半分が透明なガラスのように透き通っており、光の屈折で虹色に輝く。鋭く強い意志を宿した瞳。
  personality: 情熱的で献身的。弟への執着が強く、目的のためなら手段を選ばない危うさがある。一人称は「私」。
  speech_style: 激情的で、切実な願いをぶつけるような強い口調。
  background: ノエルの魂を肩代わりして保持した代償に、実体を失い「透明な存在」へと変質した双子の兄。
  motivation: 懐中時計を直し、ノエルに魂を返して彼を完全な人間として復活させること。
  relationships:
  - name: ノエル
    relation: 命を懸けて守るべき唯一の存在
  - name: アリステア
    relation: 目的を果たすための道具として利用しようとするが、次第に信頼する
  arc: 「救うこと（復活）」に固執していたが、最終的に「共に壊れたままでいること」こそが真の救済であると悟り、執着を手放す。
- name: セレスティア
  role: 敵役/導き手
  age: 不明
  gender: 女性
  appearance: 鏡の破片を縫い合わせたドレスを纏い、顔の上半分を白いヴェールで隠している。常に白い百合の花を手に持っている。
  personality: 享楽的で残酷。美しき破滅と悲劇を至高の芸術として愛する。一人称は「私」。
  speech_style: 艶っぽく、相手を試すような挑発的な話し方。
  background: 白銀の揺り籠の元支配者であり、街に蓄積した記憶の澱を管理する番人。
  motivation: 完璧な悲劇（記憶の剥離）が完遂され、絶望に染まった至高の宝石が生まれる瞬間を鑑賞すること。
  relationships:
  - name: アリステア
    relation: 記憶の価値を解する稀有な対話相手
  - name: レオン
    relation: 絶望へと追い込むための玩具
  arc: 不可避な悲劇を期待していたが、彼らが選んだ「静かな眠り」という想定外の結末に、かつて自分が捨てた純粋な愛への羨望を抱く。
