- name: 乾 蓮（いぬい れん）
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常に眠たげな瞳、油汚れのついた作業用コート、細身でどこか影のある佇まい。
  personality: 冷静沈着で厭世的。物事を効率と論理で判断しようとするが、根底には強い好奇心を持つ。一人称は「僕」。
  speech_style: 低体温で淡々とした、感情の起伏の少ない話し方。
  background: アイギスの下層区で、雨の日にだけ開店するデータ修復屋を営む技術者。社会の義務である記憶のデータ化には懐疑的。
  motivation: 預かった未知の量子符号の遺言を解読し、その正体を知ること。
  relationships:
  - name: サイラス
    relation: 店主であり、知識の導き手
  - name: エラ
    relation: 不可解な依頼人
  arc: 世界の不完全さを否定していた者が、不完全さの中にこそ人間の尊厳があることを受け入れる。
- name: サイラス
  role: 相棒/導き手
  age: 50
  gender: 男性
  appearance: 銀髪で整えられた髭、古風な眼鏡、常に雨の匂いがするような落ち着いた雰囲気。
  personality: 達観しており、何が起きても動じない。ミステリアスで哲学的な思考を持つ。一人称は「私」。
  speech_style: 詩的で含みのある、教訓めいた言い回し。
  background: 雨の日にだけ開く店の店主。都市の『深層アーカイブ』の構造を熟知している謎の人物。
  motivation: 世界の真実が、適切なタイミングで、適切な者に届くように見守ること。
  relationships:
  - name: 乾 蓮
    relation: 店主であり、観察対象
  arc: 単なる観測者から、主人公が真実に到達するための最後の一押しをする協力者へ。
- name: エラ
  role: 重要脇役
  age: 24
  gender: 女性
  appearance: 透き通るような肌と、どこか現実味のない儚い美しさを持つ。瞳に深い哀しみがある。
  personality: 献身的で意志が強いが、存在自体が揺らいでいるような不安定さがある。一人称は「私」。
  speech_style: 祈るような、静かで透明感のある話し方。
  background: 身元不明の女性として蓮の元を訪れる。実は、遺言の主である科学者の「記憶の断片」が具現化した存在。
  motivation: 託された遺言を、未来へ確実に届けること。
  relationships:
  - name: 乾 蓮
    relation: 依頼人であり、真実を託す相手
  arc: 単なるデータの媒介者から、自らの存在の矛盾を受け入れ、蓮に「生きる意味」を伝える象徴へ。
- name: ヴァーン局長
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない軍服のようなスーツ、人工的に整えられた容姿、冷徹な眼差し。
  personality: 極端な合理主義者。都市の秩序とシミュレーションの安定を絶対視する。一人称は「私」。
  speech_style: 命令的で、感情を完全に排した、機械的な論理口調。
  background: アイギスの治安維持局を統括する高官。中央AIの意志を執行する人間としての役割を担う。
  motivation: システムの矛盾を隠蔽し、アイギスの管理体制を維持すること。
  relationships:
  - name: 乾 蓮
    relation: 排除すべき不確定要素
  arc: システムの守護者として絶対的な権威を振るうが、計算不可能な「人間の意志」に直面し、崩壊へ向かう。
