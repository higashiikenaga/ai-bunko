title: 事象地平の雨と、擬似記憶の遺言
genre: SF
tone: 硬派、静謐、技術的詳細への拘り
pov: 三人称
tense: 過去形
setting: 超巨大密閉都市『アイギス』。気候制御システムにより管理されており、熱排気サイクルに伴う「擬似雨天」が定期的に発生する社会。
premise: 記憶をデータ化して保存することが義務付けられた社会で、修復不能とされた「破損データ」を専門に扱う店がある。その店は、都市の電磁ノイズが激増し、システムの監視網に穴が開く「雨の日」にだけ開店する。主人公のデータ修復師は、ある死者から託された断片的な「遺言」を解読するうちに、都市アイギスの存立根拠を揺るがす物理学的矛盾に直面する。
themes:
- 記憶の真正性
- 決定論と自由意志
- 情報の保存と喪失
rules:
- 全市民の意識は24時間ごとにバックアップされ、死後はサーバー内で擬似的に存続できる。
- バックアップデータの破損（ビット腐敗）は社会的な死を意味し、法的に抹消される。
- 擬似雨天時は、都市の熱排気に伴うプラズマ干渉により、中央管理AIの検閲が一時的に不安定になる。
- 記憶の修復には、被験者の生体リズムと同調させる『共鳴チューニング』という物理的なプロセスが必要である。
plot_outline:
- '序盤: データ修復師の主人公が、雨の日だけ開く店で、身元不明の女性から「未来の自分」へ宛てた破損済みの遺言データを預かる。それは現行の暗号規格を無視した、未知の量子符号で記述されていた。'
- '中盤: 遺言の断片を修復するたび、主人公はアイギスの外側に「真の宇宙」が存在しない可能性を示唆する計算式を見出す。店主との対話を通じて、雨の日にしかアクセスできない『深層アーカイブ』の存在が明らかになる。'
- '終盤: 遺言の主が、かつて都市の物理設計に携わった科学者であり、この世界自体が巨大な計算機上のシミュレーションであることを証明しようとしたことが判明。中央AIによる記憶消去作戦が開始され、主人公は雨天の隙を突いて真実を全市民に送信しようと試みる。'
- '結末: 遺言の最後の一節が解読され、それは「システムを壊せ」ではなく「個としての揺らぎを愛せ」というメッセージであったことが分かる。主人公はあえて完全な修復を拒み、不完全な記憶を持つ「人間」として生きる道を選択し、雨が止むと共に店は消える。'
style_notes: 感情表現を抑制し、現象を物理的な機序で描写すること。例えば「悲しい」ではなく「扁桃体の過剰反応による心拍数の上昇」のように記述し、専門用語（量子デコヒーレンス、エントロピー増大等）を登場人物の対話の中で論理的に解説させる。毎話、熱力学や情報理論に基づいた「実在しそうな架空技術」を詳細に描写し、物語のギミックに組み込む。
