- name: 朝比奈 海 (あさひな かい)
  role: 主人公
  age: 23
  gender: 男性
  appearance: 若々しく、どこか不安げな表情を浮かべた青年。サイズの少し大きい標準支給の紺色ジャンプスーツを着用している。
  personality: 真面目で勤勉だが、実務経験がなく自信に欠けている。知的好奇心は強い。一人称は「僕」。
  speech_style: 丁寧語。緊張すると言葉に詰まったり、語尾が弱くなったりする傾向がある。
  background: 海洋学部を卒業したばかりの新卒調査員。理論的な知識は豊富だが、極限環境での現場作業は初めて。
  motivation: 深海の未知なる領域を記録し、自分の能力を証明してチームの一員として認められたい。
  relationships:
  - name: 九条 剛
    relation: 厳格な指導役であり、尊敬する対象
  - name: エレナ・ヴォルコフ
    relation: 技術的なサポートを受ける先輩
  - name: 猿飛 真司
    relation: 信頼を寄せている船長
  arc: 圧倒的な環境とベテランの矜持に打ちのめされながらも、「正確な記録」という孤独な作業の崇高さを理解し、一人の専門家として自立し始める。
- name: 九条 剛 (くじょう ごう)
  role: メンター/ベテラン技術者
  age: 52
  gender: 男性
  appearance: 日焼けし、深い皺が刻まれた顔。節くれだった大きな手と、鋭くも静かな眼光が特徴。
  personality: 寡黙で完璧主義。妥協を許さない職人気質で、データのわずかな誤差も逃さない。一人称は「俺」。
  speech_style: ぶっきらぼうで簡潔。専門用語を多用し、結論から話す話し方。
  background: 数多くの深海事故を生き延びてきた伝説的な調査員。後進の育成には不器用だが、誰よりも現場の安全と記録の正確性を重視している。
  motivation: 後世に嘘のない、完璧な海底遺跡の記録を残すこと。
  relationships:
  - name: 朝比奈 海
    relation: 未熟だが可能性を感じている教え子
  - name: エレナ・ヴォルコフ
    relation: 互いの技術を認め合う信頼し合った同僚
  arc: 新人の朝比奈に自分の仕事の意義を継承させようとし、彼が危機の中で成長した姿を見て、密かに次世代への信頼を寄せる。
- name: エレナ・ヴォルコフ
  role: スキャン専門技師
  age: 31
  gender: 女性
  appearance: 銀縁の眼鏡をかけ、髪をきっちりとまとめ上げた知的な外見。効率的な動作に無駄がない。
  personality: 冷静沈着で分析的。皮肉屋な一面があるが、根は情に厚く、新人をさりげなくフォローする。一人称は「私」。
  speech_style: 論理的で淡々としている。時折、相手を試すような問いかけを行う。
  background: 世界的な音響測量と3Dスキャンの権威。最新機器の性能を最大限に引き出す技術を持つ。
  motivation: 氷に覆われた遺跡の「完璧な造形」をデジタルデータとして完全に再現すること。
  relationships:
  - name: 朝比奈 海
    relation: 危なっかしい後輩として気にかけている
  - name: 九条 剛
    relation: 彼の経験則による判断を高く評価している
  arc: デジタルな数値こそが正解だと信じていたが、九条や朝比奈との交流を通じ、数値化できない「現場の感覚」や「情熱」の重要性に気づく。
- name: 猿飛 真司 (さるとび しんじ)
  role: 船長/指揮官
  age: 45
  gender: 男性
  appearance: がっしりとした体格で、包容力のある穏やかな笑顔を浮かべている。常にデジタルログブックを携帯している。
  personality: リーダーシップに溢れ、決断力がある。個々の能力を最大限に引き出すマネジメントに長けている。一人称は「私」。
  speech_style: 威厳があるが柔らかい口調。チームの士気を高める巧みな言い回しを使う。
  background: 元海軍将校。現在は民間調査船『アビス・レコーダー号』の指揮を執り、危険な海域での安全管理を徹底している。
  motivation: チーム全員を無事に帰還させつつ、歴史的発見を完遂させること。
  relationships:
  - name: 九条 剛
    relation: 長年の戦友であり、現場の全権を任せている相棒
  - name: 朝比奈 海
    relation: 期待を込めてチームに迎え入れた新人
  arc: 物語の結末までチームの精神的な支柱として機能し、危機の際、個々の専門性が結集して困難を乗り越える瞬間を導く。
