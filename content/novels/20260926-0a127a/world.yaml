title: 深海調査員のログ：静かなる海底遺跡の守り人
genre: 群像劇
tone: 真摯で丁寧な、職人たちの誇りが伝わる質感
pov: 一人称（新人調査員の僕）
tense: 過去形
setting: 近未来、海洋資源開発が進む深海調査基地および海底遺跡調査船
premise: 海洋探査技術が飛躍的に進歩した時代、深海の未知なる領域を調査するチームに新人の僕は配属される。僕たちの任務は、海底に眠る『海底遺跡』の構造を精密にスキャンし、その歴史的価値を記録することだ。高圧と暗闇が支配する極限環境の中で、ベテラン技術者たちが守り続けてきた「正確な記録」へのこだわりを知っていく。それは、目に見えない世界の欠片を掬い上げる、孤独で崇高な作業だった。
themes:
- 専門職の矜持
- 未知への敬意と記録の価値
rules:
- 深海での作業は高度な減圧プロセスを要し、一歩間違えれば命に関わる
- 海底遺跡の調査には、文化財保護法に基づく厳格なプロトコルが存在する
- 深海探査艇の通信は遅延が発生し、現場の判断力が極めて重要視される
plot_outline:
- '序盤: 新人調査員の僕が、深海調査船『アビス・レコーダー号』に乗り込み、過酷な現場での洗礼を受ける。専門用語である『バリアブル・ダイブ（可変潜航）』の手順に戸惑いながらも、先輩たちの正確な仕事ぶりに圧倒される。'
- '中盤: 調査チームは、巨大な氷の塊に覆われた海底遺跡を発見する。それはまるで『氷の城』のような造形美を持っていた。高度な技術者たちが、氷を溶かさずに遺跡の構造を読み取るための、ミリ単位の精密なスキャン作業に没頭する姿が描かれる。'
- '終末: 嵐による海流の変化で、調査艇が遺跡の崩落に巻き込まれそうになる。パニックに陥る一瞬の中で、ベテランたちは積み上げてきた知識と誇りを武器に、冷静に危機を回避するための手順を完遂する。'
- '結末: 遺跡の全容を記録し終えた僕たちは、静かな達成感とともに浮上する。記録されたデータは、誰にも知られずとも、確かに人類の歴史の一部として刻まれる。僕は、次の潜航に向けて、自分の役割を理解し始める。'
style_notes: 新人である「僕」の一人称視点で進行。海洋工学や考古学の専門用語（例：ROV、減圧症、音響測深機など）を登場させる際は、必ず文脈の中で丁寧に解説を入れる。仕事の些細な成功、例えば「ネジ一本の締め具合」や「データのノイズが消えた瞬間」といった小さな達成感を情緒的に描写し、働く人々の静かな熱量を表現する。
