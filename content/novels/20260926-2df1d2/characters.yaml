- name: 佐倉 湊 (さくら みなと)
  role: 主人公
  age: 17
  gender: 男性
  appearance: どこにでもいる平凡な風貌。少し猫背気味で、観察眼が鋭い瞳をしている。
  personality: 内向的で思慮深い。何者でもない自分に焦りを感じている。一人称は「俺」。
  speech_style: 落ち着いた丁寧な口調だが、感情が高ぶると言葉が熱を帯びる。
  background: 地方の工業都市の高校に通う二年生。目立った特技を持たず、周囲に馴染めない感覚を抱えていた。
  motivation: 海斗の情熱に触れることで、自分自身の「生」の感覚と熱量を見つけること。
  relationships:
  - name: 瀬戸 海斗
    relation: 幼馴染であり、かつての憧れ
  arc: 傍観者としての自分を脱却し、自らの意思で一歩を踏み出す表現者へと成長する。
- name: 瀬戸 海斗 (せと かいと)
  role: 相棒
  age: 17
  gender: 男性
  appearance: 端正な顔立ちだが、どこか影がある。練習後は常に汗と蒸気に包まれている。
  personality: 孤高でストイック。挫折を抱えながらも、内側に激しい熱を秘めている。一人称は「僕」。
  speech_style: 理論的で少し理屈っぽい。しかし、スケートの話になると熱狂的な口調になる。
  background: かつて「氷上の天才」と称された元フィギュアスケーター。怪我または精神的な挫折により、かつての輝きを失いかけていた。
  motivation: 独自の理論「蒸気のようなスケーティング」を証明し、氷の上で再び自分の存在を刻むこと。
  relationships:
  - name: 佐倉 湊
    relation: 理解者であり、共に歩むパートナー
  arc: 完璧主義による呪縛から解放され、欠落すらも熱量に変えて滑る術を学ぶ。
- name: 桐生 蓮 (きりゅう れん)
  role: 敵役
  age: 17
  gender: 男性
  appearance: 洗練された身のこなし。都会的な雰囲気を持つ、隙のない美男子。
  personality: 冷徹で合理主義。感情を排除した美しさを至上とする。一人称は「俺」。
  speech_style: 冷ややかで、相手の痛いところを突くような鋭い話し方。
  background: 名門クラブに所属する現役のトップスケーター。海斗の失墜を嘲笑し、効率的な美しさを追求している。
  motivation: 「熱量」や「泥臭さ」といった不確かな要素を排除し、氷上の秩序を守ること。
  relationships:
  - name: 瀬戸 海斗
    relation: かつてのライバルであり、現在の否定者
  arc: 湊たちの熱量に、計算では導き出せない「美」の可能性を見せつけられ、自らの価値観が揺らぐ。
- name: 志摩 先生 (しま せんせい)
  role: 脇役
  age: 45
  gender: 女性
  appearance: 使い込まれた作業着が似合う、ガッシリとした体格の女性。眼光が強い。
  personality: 現実的で厳格だが、一度認めた相手には深い情を見せる。一人称は「私」。
  speech_style: ぶっきらぼうで、職人気質。無駄な言葉を削ぎ落とした話し方。
  background: 旧校舎裏の廃部寸前のスケート部を管理する顧問。町の工業遺構に詳しい。
  motivation: 消えゆくもの、錆びついたものに再び命を吹き込む手助けをすること。
  relationships:
  - name: 佐倉 湊
    relation: 部活動を支える生徒としての指導対象
  - name: 瀬戸 海斗
    relation: その才能の再燃を静かに見守る立場
  arc: 停滞していた部活動に、二人の熱量が再び火を灯す様子を見守る。
