title: スチーム・スライド：僕らの熱量と、氷の城の残像
genre: スポーツ青春
tone: 瑞々しく、熱っぽく、切ない
pov: 一人称（俺）
tense: 現在形と過去形の混在
setting: 現代、地方の工業都市。坂道が多く、古い蒸気機関の遺構が点在する町。
premise: 放課後の部室、窓の外から聞こえる蒸気の音。俺は、かつて天才と呼ばれた元フィギュアスケーターの親友、海斗と再会する。彼は今、廃部寸前のスケート部で、氷のリンクを「熱」で支配しようともがいていた。かつての栄光を失った彼と、何者でもない俺が、錆びたブレードを研ぎ直していく物語。
themes:
- 挫折からの再起
- 熱量と冷却のコントラスト
rules:
- 部活動の描写は徹底的にリアルに行う
- SNS（InstagramやX）の反応は、登場人物の心理的距離感を示すデバイスとして使用する
plot_outline:
- '序盤: 閉鎖的な高校生活を送る俺が、放課後の旧校舎裏で、かつての天才・海斗が一人で氷の上を滑る姿を目撃する。'
- '中盤: 海斗が掲げる「蒸気のような熱いスケーティング」という独自の理論に惹かれ、俺も部活動に足を踏み入れる。SNSでの誹謗中傷や周囲の冷ややかな視線に晒されながらも、二人は練習を重ねる。'
- '終盤: 最後の大会。会場はまるで『氷の城』のように冷たく静まり返っているが、俺たちの心拍数とブレードが刻む音は、蒸気機関のように激しく燃え上がる。'
- '結末: 結果以上に、自分たちの熱を証明できたことに手応えを感じる。放課後の夕暮れ、少しだけ軽くなった足取りで、俺たちはまた明日へ向かう。'
style_notes: 一ノ瀬楓としての文体。一文を短くし、会話のテンポを重視する。部活の汗の匂いや、リンクの冷たい空気、スマホの通知音といった五感を刺激する描写を忘れない。各話の終わりに必ず、放課後の静かな、あるいは騒がしい情景を挿入すること。
