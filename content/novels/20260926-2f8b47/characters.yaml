- name: 一ノ瀬 蓮 (いちのせ れん)
  role: 主人公
  age: 16
  gender: 男性
  appearance: 少し長めの黒髪、鋭いがどこか寂しげな瞳。細身だが引き締まった筋肉を持つ。常に使い古したバスケットシューズを履いている。
  personality: 嘘がつけず、思ってもいないことを言えない「正直すぎる」性格。一人称は「俺」。内面は孤独を好むが、情に厚い。
  speech_style: ストレートで飾り気のない言葉。言葉足らずだが、核心を突く。
  background: 親の仕事の都合で転校を繰り返してきた「渡り鳥」。周囲の顔色を伺うことに疲れ、感情を隠せなくなる自分を呪っている。
  motivation: バスケットボールを通じて、自分がどこに属しているのか、本当の居場所を見つけること。
  relationships:
  - name: 火野 凱
    relation: チームのリーダーであり、蓮を強引に引き込んだ人物
  - name: 神代 零
    relation: 最大のライバルであり、圧倒的な壁となる存在
  arc: 孤独な逃避行を続けていた少年が、仲間とプレーで繋がり、自らの居場所を「言葉」と「プレー」で勝ち取る。
- name: 火野 凱 (ひの がい)
  role: 相棒（チームリーダー）
  age: 17
  gender: 男性
  appearance: ガタイが良く、日焼けした肌。短髪でワイルドな風貌。常に不敵な笑みを浮かべている。
  personality: 猪突猛進で豪快。直感で動くタイプ。一人称は「俺」。面倒見は良いが、強引すぎる一面がある。
  speech_style: 荒っぽいがリズムが良い。体育会系の熱い口調。
  background: かつては有望な選手だったが、型にはまるプレーを嫌い、ストリートの世界へ身を投じた。劣等生を集めてチームを作っている。
  motivation: 既存のバスケットボール界の常識を、ストリートのスタイルでぶち壊すこと。
  relationships:
  - name: 一ノ瀬 蓮
    relation: 才能を見出し、チームの核として迎え入れた弟分
  arc: 独りよがりな暴走から、蓮の「誠実なプレー」に触れることで、真のチームワークを理解する。
- name: 神代 零 (かみしろ れい)
  role: 敵役（絶対王者）
  age: 17
  gender: 男性
  appearance: 整った端正な顔立ち。無駄のない完璧なフォーム。洗練された高級ブランドのスポーツウェアを好む。
  personality: 冷徹で合理的。勝利こそがすべてと考えている。一人称は「僕」。感情を表に出さない。
  speech_style: 丁寧だが、相手を見下すような冷ややかな敬語。
  background: エリート街道を歩んできた天才プレイヤー。完璧な理論に基づくバスケットボールを体現しており、ストリートを「無秩序なゴミ溜め」と蔑んでいる。
  motivation: 完璧な勝利を維持し、バスケットボールの秩序を守ること。
  relationships:
  - name: 一ノ瀬 蓮
    relation: 自分の理論を狂わせる、理解不能で恐ろしい存在
  arc: 蓮の「嘘のないプレー」に触れ、計算では導き出せない熱量と、敗北への恐怖、そして純粋な憧憬を抱く。
- name: 佐伯 凪 (さえき なぎ)
  role: 脇役（チームメイト）
  age: 16
  gender: 男性
  appearance: 眼鏡をかけた小柄な少年。コート外では大人しそうに見えるが、プレー中は驚異的なスピードを見せる。
  personality: データ重視の慎重派。一人称は「僕」。皮肉屋だが、実は一番の努力家。
  speech_style: 論理的で、早口。数字や確率を多用する。
  background: 学校の部活動で挫折し、居場所を求めてストリートに流れ着いた元・戦術担当。
  motivation: 自分の知識と技術が、誰かのために役立つことを実感すること。
  relationships:
  - name: 一ノ瀬 蓮
    relation: 予測不能な動きをする、計算外の面白い存在
  - name: 火野 凱
    relation: 振り回される対象だが、信頼している兄貴分
  arc: 自分の知識を武器にすることに臆病だったが、蓮たちの熱量に感化され、攻めの戦術家へと成長する。
