title: 紅蓮のドリブル・フライト
genre: スポーツ青春
tone: 熱血、疾走感、泥臭い
pov: 三人称
tense: 基本過去形、試合描写のみ現在形
setting: 現代日本、ストリートバスケットボール（3x3）の界隈
premise: 嘘をつけない「呪い」のような正直さと、転校を繰り返す「渡り鳥」のような孤独を抱えた少年・蓮。彼が辿り着いたのは、掃き溜めの劣等生が集まるストリートバスケチームだった。コート上の激突、飛び散る汗、肺を焼く呼吸。言葉では拒絶し合っても、プレーでしか嘘をつけない彼らが、頂点を目指して駆け上がる。
themes:
- 真実の言葉と身体的対話
- 居場所の獲得
rules:
- 3x3の公式ルールを厳守しつつ、ストリート特有の非公式なプライドを賭けた勝負を重視する
- 主人公の『嘘をつけない』性質は、社会的状況だけでなく精神的な強迫観念として機能させる
plot_outline:
- '序盤: 転校を繰り返す「渡り鳥」の蓮が、本音をぶつけすぎる性格から孤立する中、型破りな3x3チームに強引に引き込まれる。'
- '中盤: 激しい衝突と衝突。しかし、蓮の「嘘のないプレー」がチームの欠落したピースを埋め、地方のストリート大会で快進撃を始める。'
- '終盤: 全国の頂点を決めるトーナメント決勝。絶対王者との対戦。ここで一度、対戦相手である王者の視点に切り替わり、蓮の純粋すぎるプレーが相手に与える絶望と恐怖、そして憧憬を描く。'
- '結末: 限界を超えた激闘の末に勝利。蓮は初めて「ここにいたい」という本心を口にし、渡り鳥としての彷徨に終止符を打つ。'
style_notes: 甲斐走スタイル。擬音を多用し、試合描写は「いま、ボールが跳ねる！」「右へ、さらに右へ！」といった実況風の現在形を用いる。汗の匂い、心拍数の上昇、喉の渇きなど、身体的な負荷を濃密に描写すること。敗者の視点では、静寂と喪失感を強調して対比させる。
