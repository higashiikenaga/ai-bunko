- name: ジュリアン・ヴェイン
  role: 主人公
  age: 27
  gender: 男性
  appearance: 痩身で神経質そうな佇まい。銀縁の眼鏡をかけ、常に手帳を携帯している。灰色のフロックコートを纏う。
  personality: 徹底した合理主義者で懐疑的。観察力に優れる。一人称は「私」。
  speech_style: 丁寧だが、相手の矛盾を鋭く突く論理的な話し方。
  background: 若き建築設計士。蒐集家の遠縁にあたり、建築学的な興味から遺言への招待に応じた。
  motivation: 銀翼館の奇形的な構造の謎を解明し、超常現象とされる事象の正体を暴くこと。
  relationships:
  - name: ベアトリス・ソーン
    relation: 親族（従姉）。彼女の傲慢さと隠し事に不信感を抱いている。
  - name: サイラス・グレイヴス
    relation: 案内人。館の秘密を握る彼から情報を引き出そうとしている。
  arc: 知的好奇心だけで動いていたが、死の恐怖に直面することで、論理だけでは制御できない人間の狂気と自然の猛威を悟る。
- name: ベアトリス・ソーン
  role: 敵役
  age: 41
  gender: 女性
  appearance: 蒼白な肌に鋭い眼差し。黒いレースの喪服に身を包み、常に扇子で口元を隠している。
  personality: 支配欲が強く冷酷。目的のためには手段を選ばない。一人称は「私」。
  speech_style: 尊大で威圧的。相手を見下すような含みのある言い回しを好む。
  background: 蒐集家の姪であり、親族の中で最も遺産への執着が強い。館の構造についてある程度の知識を持っていた。
  motivation: 他の親族を排除し、莫大な遺産と蒐集品の全てを独占すること。
  relationships:
  - name: ジュリアン・ヴェイン
    relation: 邪魔者。彼の知性が自分の計画を暴くことを恐れている。
  - name: アーサー・ソーン
    relation: 弟。無能な存在として軽蔑している。
  arc: 完璧に計算した「迷宮の惨劇」を演出し支配しようとするが、最後は自らが設計した罠と崩落する館に飲み込まれる。
- name: アーサー・ソーン
  role: 脇役（犠牲者）
  age: 34
  gender: 男性
  appearance: やつれた顔に不安げな眼差し。指先が常に震えており、服装は乱れている。
  personality: 臆病で迷信深く、精神的に脆い。一人称は「僕」。
  speech_style: たどたどしく、語尾が消え入りそうな不安げな話し方。
  background: ベアトリスの弟。借金に追われており、遺産による救済を切望して館を訪れた。
  motivation: 生きて遺産を手に入れ、現状から脱却すること。
  relationships:
  - name: ベアトリス・ソーン
    relation: 姉。幼少期から精神的に支配されており、強い恐怖心を抱いている。
  - name: ジュリアン・ヴェイン
    relation: 唯一頼りにしており、精神的な支えを求める。
  arc: 館の怪奇現象に精神を蝕まれ、恐怖の極致の中で「渡り鳥の間」の最初の犠牲者となる。
- name: サイラス・グレイヴス
  role: 相棒/案内人
  age: 58
  gender: 男性
  appearance: 鷹のような鋭い目を持つ老人。埃っぽい執事服を着用し、足音が全くしない。
  personality: 慇懃無礼で不可解。感情を表に出さず、常に中立を装う。一人称は「私」。
  speech_style: 極めて形式的な敬語。比喩や暗喩を多用し、核心をはぐらかす。
  background: 故・蒐集家の専属執事であり、遺言執行人。館の全ての隠し通路と仕掛けを熟知している。
  motivation: 主人が遺した「最後のゲーム」が、遺言通りに遂行されるかを見届けること。
  relationships:
  - name: ジュリアン・ヴェイン
    relation: 観察対象。彼がどこまで真実に近づけるか、愉悦を持って見守っている。
  - name: ベアトリス・ソーン
    relation: 共犯に近い関係だが、内心では彼女の浅ましさを嘲笑している。
  arc: 物語のガイド役として振る舞うが、最終的に館の崩壊と共に、主人の狂気の一部であったことを明かして消える。
