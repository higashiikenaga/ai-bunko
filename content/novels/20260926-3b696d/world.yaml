title: 銀翼の館：渡り鳥の亡霊と沈黙の遺言
genre: ホラー
tone: 幻想的で陰鬱なゴシック・ミステリ
pov: 三人称
tense: 過去形
setting: 19世紀末、霧深い断崖に建つ、巨大な鳥の骨格を模したような奇形的な建築物「銀翼館」。
premise: 莫大な遺産を遺した孤独な蒐集家の死。その遺言に従い集まった親族たちは、断崖に佇む「銀翼館」の異様な構造に迷い込む。夜な夜な壁の裏から聞こえる羽ばたき、そして密室での不可解な死。渡り鳥の季節が訪れる時、館は呪われた魔窟へと変貌する。果たしてこれらは怪奇現象か、それとも緻密に計算された狂気の迷宮か。
themes:
- 血族の業
- 合理性と狂気の境界
- 建築に宿る意志
rules:
- 館の内部構造は、特定の風向と音響によって幻覚を誘発するように設計されている
- 遺言の読み上げは、館内の機械仕掛けを起動させるトリガーとなる
- 密室現象は、建築的な死角と鏡の反射を組み合わせた物理的なトリックに依存する
plot_outline:
- '序盤: 蒐集家の死と、遺言を読み解くために集められた親族たち。館の複雑な回廊や、鳥の羽が舞い散る不気味な装飾が、言葉を尽くして描写される。'
- '中盤: 渡り鳥の渡りの時期が重なり、館内で怪奇現象が激化。施錠された「渡り鳥の間」で、最初の犠牲者が発見される。密室の謎と、館の構造が持つ不気味な意味が浮き彫りになる。'
- '終盤: 連続する死の真相を追う中で、主人公は館の設計図に隠された「音響的な罠」と、遺言に仕込まれた巧妙な物理トリックを見抜く。犯人は、建築の狂気を利用して超常現象を演出しようとした者であった。'
- '結末: 全ての怪異は論理的に解明されるが、館は渡り鳥の季節と共に崩落を始め、真の恐怖は自然の猛威と共に霧の中に消えていく。'
style_notes: 三人称の視点を用い、装飾的でやや古風な文体で綴ること。特に館の回廊、階段、密室の構造については、読者がその空間を歩いているかのように、設計図を言葉で描くような緻密な描写を徹底する。怪奇現象の描写は情緒的かつ幻想的に、その解決プロセスは冷徹な論理に基づいて記述せよ。
