- name: ザイド
  role: 主人公
  age: 19
  gender: 男性
  appearance: 日焼けした褐色の肌、無造作な黒髪、使い込まれた革の運び屋ベストと多機能なベルトを着用。瞳は砂漠の太陽を思わせる琥珀色。
  personality: 直感的で楽観的だが、一度決めたことは曲げない芯の強さを持つ。一人称は「俺」。
  speech_style: 砂漠の民らしい、ぶっきらぼうで飾らない、少し荒っぽい口調。
  background: 交易都市の片隅で孤児として育ち、持ち前の機動力と勘の良さで運び屋として生計を立てている。
  motivation: ラジオから聞こえる少女を救い、伝説の村の存在を証明することで、退屈な日常を打破すること。
  relationships:
  - name: リラ
    relation: ラジオを通じて繋がる、守るべき少女
  - name: カエル
    relation: 行く手を阻むライバル商人
  arc: 単なる利益追求の運び屋から、他者の運命を背負い、自らの大切なものさえも捧げる覚悟を持った真の冒険者へと成長する。
- name: リラ
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような銀髪と、深い霧のような青い瞳。数百年前に失われた古代の装飾を身に纏っている。
  personality: 穏やかで聡明だが、長い孤独ゆえにどこか儚げで現実離れした雰囲気を持つ。一人称は「私」。
  speech_style: 丁寧で詩的な表現を好む、静かで透き通った声。
  background: 次元の狭間に取り残された伝説の村「アズール」の住人。時間が止まった村で、唯一「外の世界」との繋がりを求めている。
  motivation: 村の人々を止まった時間から解放し、再び陽の当たる世界へ戻ること。
  relationships:
  - name: ザイド
    relation: 唯一の理解者であり、自分を外の世界へ導いてくれる希望
  arc: ただ待つだけの犠牲者から、自らの意志で運命に抗い、現実の世界へと帰還を望む強い精神を持つ存在へと変わる。
- name: カエル
  role: 敵役
  age: 32
  gender: 男性
  appearance: 贅沢な絹のローブと金色の装身具を身につけた、洗練された身なりの男。鋭く冷徹な目つきをしている。
  personality: 極めて計算高く、あらゆる事象を利益の観点からのみ捉える。一人称は「私」。
  speech_style: 慇懃無礼で、相手を見下すような知的な、しかし圧迫感のある話し方。
  background: 大規模な交易ギルドの幹部。伝説の村「アズール」が持つ秘宝が、世界の経済を揺るがす価値を持つと見抜いている。
  motivation: アズールの秘宝を独占し、砂漠の交易権を完全に支配すること。
  relationships:
  - name: ザイド
    relation: 目的を阻害する、不愉快な若造
  arc: 秘宝を手に入れようとする執着の果てに、ザイドが示した「目に見えない絆」の価値に直面し、自らの空虚さを知る。
- name: エララ
  role: 相棒
  age: 24
  gender: 女性
  appearance: 機能的な旅装束に身を包み、腰には巨大な砂漠用コンパスを下げている。顔には砂嵐を防ぐためのタトゥーがある。
  personality: 極めて現実主義で冷静沈着。ザイドの無鉄砲さに呆れつつも、その直感を信頼している。一人称は「私」。
  speech_style: 簡潔で無駄のない、指示系統の明確な話し方。
  background: 砂漠の地図を読み解く「星読み」の家系の末裔。禁忌とされる場所へ足を踏み入れることを忌み嫌っている。
  motivation: ザイドの暴走を監視しつつ、自らの家系が守り続けてきた「砂漠の真実」を確かめること。
  relationships:
  - name: ザイド
    relation: 危なっかしい相棒であり、信頼を寄せる同行者
  arc: 規律と伝統を守るだけの隠遁者から、未知の地平を自らの足で切り拓く開拓者へと意識が変化する。
