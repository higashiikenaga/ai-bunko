title: サフランの風と失われたオアシスの残響
genre: 異世界ファンタジー
tone: エキゾチックで幻想的な冒険譚
pov: 三人称
tense: 過去形
setting: 終わりなき黄金の砂海「ルルナ砂漠」と、そこに点在する交易都市。
premise: 砂漠の若き運び屋ザイドは、古物市場の喧騒の中で、夜明けの数分間だけ異世界の声を拾う「夜明けのラジオ」を手に入れる。聞こえてきたのは、数百年前に地図から消えた伝説の村「アズール」に囚われた少女の悲痛な叫びだった。失われた楽園の秘宝と、時を止めた村の人々を救うため、ザイドは未知の地平へと漕ぎ出す。
themes:
- 喪失と再生
- 未知への憧憬
rules:
- 砂漠の夜は極低温となり、魔導ランプによる熱源なしでは生存できない
- 夜明けのラジオは、太陽が地平線に接する瞬間のみ、次元の壁を越えて通信が可能となる
- 砂嵐の中では方位磁石が機能せず、古の航路歌のみが正しい道を示す
plot_outline:
- '序盤: 交易都市の喧騒の中、ザイドが偶然「夜明けのラジオ」を入手し、消えた村の少女との通信が始まる。'
- '中盤: 少女の導きに従い、禁忌とされる「沈黙の砂丘」へ向かう。道中、ライバルの商人との競い合いや、夜の砂漠が持つ絶対的な静寂と恐怖に直面する。'
- '終盤: ラジオが示した座標の先で、次元の狭間に隠された「消えた村」に到達。村が消えた理由と、ラジオが発していた信号の正体が明かされる。'
- '結末: 村の人々を現実の世界へ連れ戻すため、自らの大切な記憶を対価に捧げ、新たな交易路を開拓して帰還する。'
style_notes: 語り部が古き物語を読み聞かせるような、ゆったりとした三称視点。市場のスパイスの香りや人々の怒号といった喧騒を鮮やかに描き、それとは対照的に、夜の砂漠では耳が痛くなるほどの静寂と星空の冷徹さを強調して描写する。
