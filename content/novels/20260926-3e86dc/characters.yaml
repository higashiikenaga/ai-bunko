- name: 紬 詩織 (つむぎ しおり)
  role: 主人公
  age: 27
  gender: 女性
  appearance: 柔らかな栗色のセミロング。常にエプロンを着用しており、手元は本や整理整頓で少しだけインクの跡がついている。穏やかで落ち着いた目元。
  personality: 聞き上手で洞察力が鋭い。物事を急がず、流れる時間に身を任せることを好む。一人称は「わたし」。
  speech_style: 丁寧で落ち着いた口調。相手の言葉を一度「そうですね」と受け止めてから話し始める。
  background: 都会の忙しない生活に疲れ、逃げるようにして路地裏の「ことのは本屋」の店員になった。本を通じて人の心に触れることに静かな喜びを感じている。
  motivation: 本に遺された「忘れもの」の持ち主を、間接的にでも見つけ出し、その心を軽くしてあげたい。
  relationships:
  - name: 佐伯 健吾
    relation: 店を訪れる常連客であり、相談相手
  arc: 他人の物語に寄り添うばかりだった彼女が、地図の謎を解く過程で、自分自身が「居場所」を求めていたことに気づき、店を守る決意を固める。
- name: 佐伯 健吾 (さえき けんご)
  role: 脇役
  age: 65
  gender: 男性
  appearance: 白髪混じりの短髪。使い込まれたツイードのジャケットを愛用している。眼鏡の奥の瞳は優しい。
  personality: 博学で少しユーモラス。物事の核心を突くような質問を時折投げかける。一人称は「私」。
  speech_style: 穏やかで教養を感じさせる、ゆったりとした話し方。
  background: 元図書館員。定年退職後、かつての街の風景を愛し、暇さえあれば「ことのは本屋」で読書をしている。
  motivation: 失われゆく街の記憶や、人々の小さな物語が消えてしまわないよう、見守ること。
  relationships:
  - name: 紬 詩織
    relation: 店主として信頼している
  arc: 地図の謎解きにおいて、自身の過去の記憶と現在の出来事を結びつけ、詩織に重要な視点を与える。
- name: 高橋 陽菜 (たかはし ひな)
  role: 脇役（物語の鍵を握る客）
  age: 22
  gender: 女性
  appearance: 少し疲れた表情の大学生。動きやすいカジュアルな服装。いつもスマートフォンを握りしめている。
  personality: 真面目すぎて自分を追い込みやすい。焦燥感を抱えているが、根は素直。一人称は「私」。
  speech_style: 少し早口で、自信なさげに語尾が消え入るような話し方。
  background: 就職活動や人間関係に悩み、何か「正解」を探している。古い詩集の中にあった地図に、直感的な何かを感じて店を訪れる。
  motivation: 地図に記された場所を見つけることで、自分が失ってしまった「何か」を取り戻したい。
  relationships:
  - name: 紬 詩織
    relation: 導いてくれる存在
  arc: 地図の終着点が「場所」ではなく「習慣」であったことを知ることで、正解を追い求めるのではなく、日々の小さな充足感に目を向けるようになる。
