title: ことのは本屋の、忘れもの案内所
genre: 日常ほのぼの
tone: 軽やかで温かみのある、おっとりとした雰囲気
pov: 一人称（わたし）
tense: 現在形（回想を含む）
setting: 現代。路地裏にある、お茶を飲みながら本が読める小さな古本屋「ことのは本屋」
premise: 古本屋の店員である『わたし』のもとに、本に挟まった書き置きや古い地図をきっかけに、人生の小さな『忘れもの』を探しに来る人々が集まります。事件に起きるのは、誰かが誰かに向けた、ちょっとした誤解や優しい嘘だけ。夜明け前にひっそりと流れるラジオの言葉をヒントに、街の風景と人々の心をゆっくりと紐解いていきます。
themes:
- 善意の連鎖
- 記憶の再発見
rules:
- 殺人は一切起きない
- 謎解きは論理的な追及ではなく、相手への共感と対話によって行われる
- 解決することで誰かが救われるのではなく、『まあ、いいか』と思える心地よさを提供する
plot_outline:
- '序盤: 街外れの古本屋で、お茶を淹れながらのんびり過ごす『わたし』の日常。ある日、買い取った古い詩集の中から、数十年前の街の様子を記した『秘密の地図』が見つかる。'
- '中盤: 地図に記された「秘密の場所」を訪ねる客たちが現れ、それぞれが抱えていた小さな後悔や、昔の友人への届かなかった想いが明らかになる。その過程で、早朝にだけ放送される正体不明の『夜明けのラジオ』が、不思議と今の客たちの状況に寄り添う言葉を投げかける。'
- '終盤: 地図の終着点にあるはずの場所が、今は更地になっていることが判明し、客たちが落胆する。しかし、『わたし』はラジオの放送内容と地図の余白から、物理的な場所ではなく『ある習慣』のことだったことに気づく。'
- '結末: 過去の思い出を今の心地よさに変換し、人々は前を向く。誰も失わなかったけれど忘れていた『誰かの優しさ』に気づき、店にはまた新しい本と、穏やかな時間が流れる。'
style_notes: 一人称の『わたし』は少し天然で、状況を俯瞰しながらも、お茶の温度や本の紙の匂いといった感覚的な描写を大切にする。読者に語りかけるような軽やかな口調を用い、深刻な悩みも「まあ、そんなこともあるでしょう」と受け止める包容力のある文体で描く。
