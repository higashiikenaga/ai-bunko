- name: 藍沢 澪
  role: 主人公
  age: 19
  gender: 女性
  appearance: 落ち着いた黒髪のボブカット。少し寂しげだが、澄んだ瞳をしている。カフェのエプロンがよく似合う。
  personality: 穏やかで内省的。周囲の微かな変化に敏感な観察眼を持つ。一人称は「私」。
  speech_style: 丁寧で、言葉を選びながら静かに話すスタイル。
  background: 霧深い港町で、亡き祖父が営んでいた深夜の喫茶店を一人で守っている。静寂を愛している。
  motivation: 孤独な夜の中に、自分自身が本当に求めている「繋がり」を見つけること。
  relationships:
  - name: 凪野 朔
    relation: 運命的な出会いをした、謎めいた青年
  - name: 瀬戸 海斗
    relation: 幼馴染で、日常を繋ぎ止めてくれる存在
  arc: 孤独な日常に安住していた少女が、朔との出会いを通じて、形のない記憶や別れの美しさを受け入れる強さを得る。
- name: 凪野 朔
  role: 主人公/相手役
  age: 20
  gender: 男性
  appearance: どこか浮世離れした透明感のある容姿。古い星図を大切そうに抱え、サンダルウッドの香りを纏っている。
  personality: 物静かで思慮深いが、どこか掴みどころがない。一人称は「僕」。
  speech_style: 詩的で、断片的な言葉を紡ぐような独特の語り口。
  background: 現在の空には存在しない「失われた星々」の軌跡を辿る、正体不明の旅人。
  motivation: 星図が示す「最後の星」を観測し、不在の記憶を完成させること。
  relationships:
  - name: 藍沢 澪
    relation: 夜の静寂の中で心を分かち合う相手
  arc: 過去の記憶を追い求めるだけの彷徨う旅人から、誰かの心に消えない「残り香」を残す存在へと変化する。
- name: 瀬戸 海斗
  role: 脇役
  age: 20
  gender: 男性
  appearance: 日焼けした肌と快活な笑顔。港町で働く青年らしい、動きやすい服装。
  personality: 直情的で現実主義。情に厚く、澪のことが心配でならない。一人称は「俺」。
  speech_style: ぶっきらぼうだが、親しみやすさと温かみのある話し方。
  background: 澪の幼馴染。港の荷役作業に従事しており、町の日常を象徴する存在。
  motivation: 澪が不思議な現象や、朔のような危うい存在に飲み込まれないよう見守ること。
  relationships:
  - name: 藍沢 澪
    relation: 幼馴染であり、守りたい大切な友人
  - name: 凪野 朔
    relation: 澪の心を乱す、不穏な存在への警戒感
  arc: 目に見えないものに惹かれる澪の心情を理解し、彼女の成長を静かに認められるようになる。
- name: 織部 千代
  role: 脇役/導き手
  age: 75
  gender: 女性
  appearance: 銀髪を綺麗にまとめた、品格のある老婦人。常に穏やかな微笑を浮かべている。
  personality: すべてを見通しているような、慈愛に満ちた賢者。一人称は「私」。
  speech_style: ゆっくりとした、含みを持たせた教訓的な話し方。
  background: 喫茶店の常連。町の古い伝承や、かつて存在した星空の記憶を密かに保持している。
  motivation: 澪と朔の交流が、町の忘れ去られた記憶を呼び覚ますプロセスを見守ること。
  relationships:
  - name: 藍沢 澪
    relation: 記憶を継承していくべき次世代の主
  arc: 物語の鍵となる星図の真意を、間接的に澪へ伝える役割を果たす。
