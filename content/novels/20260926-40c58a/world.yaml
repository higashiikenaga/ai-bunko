title: 藍夜の星図と、終着の残り香
genre: 青春恋愛
tone: 憂いを含んだ、官能的で静謐な夜の空気
pov: 三人称
tense: 過去形
setting: 霧深い港町、深夜の喫茶店と終着駅
premise: 深夜の喫茶店を営む少女・澪は、ある夜、古びた星図を携えた青年・朔に出会う。彼が指し示す星図は、現在の空には存在しないはずの、かつての星々の軌跡を描いていた。珈琲の苦味と、雨上がりの夜の匂いの中で、二人は重なりそうで重ならない距離を保ちながら、失われた夜の記憶を辿っていく。最終列車が告げる別れの予感に、揺れる二人の心模様を描く物語。
themes:
- 失われた時間への憧憬
- 記憶を呼び覚ます香りの記憶
rules:
- 星図は特定の条件下で、過去の空の姿を投影する性質を持つ
- 最終列車は、一度乗り遅れると二度と同じ季節の夜には戻れない
plot_outline:
- '序盤: 深夜の喫茶店に現れた朔が、矛盾する星図を澪に見せる。珈琲の香りと共に、二人の間に言葉を超えた静かな交流が始まる。'
- '中盤: 星図の謎を解くため、夜の街を歩く二人。視線の交差や指先のわずかな動きを通して、言葉にできない思慕が募っていく。朔が「ある不在の記憶」を探していることが明らかになる。'
- '終盤: 星図が示す「最後の星」が観測される夜。最終列車の到着時刻が迫り、二人の感情は極限まで高まる。引き止めたい衝動と、彼を送り出さねばならない理性が衝突する。'
- '結末: 列車は去り、朔は姿を消すが、店には彼が纏っていたサンダルウッドの香りと、新しく書き換えられた星図だけが残される。澪は再び、夜の静寂の中で珈琲を淹れる。'
style_notes: 言葉による説明を極限まで削ぎ落とし、視線の動き、指先の震え、香水の移ろい、珈琲の湯気といった感覚的な描写によって登場人物の情動を表現する。台詞は最小限に留め、夜の静寂と行間の熱量を感じさせる、艶のある文体を徹底すること。
