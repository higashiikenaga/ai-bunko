- name: レン・ガイア
  role: 主人公
  age: 16
  gender: 男性
  appearance: オイル汚れのついたつなぎを着用。赤茶色の乱れた髪と、情熱を宿した大きな瞳が特徴。
  personality: 直感的で熱血漢。考えるより先に体が動くタイプ。一人称は「オレ」。
  speech_style: 勢いのある口調で、語尾に「ぜ！」や「だろ！」を多用する。
  background: スラム街でジャンク屋を営む整備士の少年。機械への深い理解と、誰よりも強い「魂の熱量」を持つ。
  motivation: 奪われた街の平和と、人々が忘れてしまった大切な記憶を取り戻すこと。
  relationships:
  - name: ライラ
    relation: 反発し合いながらも信頼を深める戦友
  - name: ゴロウ
    relation: 師匠のように慕う兄貴分
  arc: ただの整備士から、仲間との絆を力に変えて都市を救う真のパイロットへと成長する。
- name: ライラ・ヴォルテクス
  role: 相棒/ライバル
  age: 17
  gender: 女性
  appearance: 銀色のショートヘアに鋭い眼差し。体にフィットした最新鋭のパイロットスーツを纏う。
  personality: 冷静沈着で論理主義。感情を排して効率を求めるが、内面には激しい正義感を秘めている。一人称は「私」。
  speech_style: 淡々とした口調で、相手の矛盾を鋭く突く論理的な話し方。
  background: 都市防衛軍の元エリート候補生。ある事件で記憶の一部を失い、その真相を探るため地下図書館の機体に関わる。
  motivation: 失われた自分の記憶を取り戻し、世界の真実を突き止めること。
  relationships:
  - name: レン・ガイア
    relation: 直情的な彼に呆れつつも、その真っ直ぐさに惹かれている
  arc: 効率至上主義を捨て、レンの影響で「魂を燃やすこと」の価値に気づき、心を開いていく。
- name: 剛（ゴロウ）
  role: 脇役/パワー担当
  age: 28
  gender: 男性
  appearance: 岩のような巨体に深い傷跡がいくつもある。重厚な装甲を組み込んだ特製スーツを着用。
  personality: ぶっきらぼうだが情に厚い。仲間を守るためなら盾になることを厭わない。一人称は「俺」。
  speech_style: 低く太い声で、短く断定的な話し方をする。
  background: かつての怪獣襲撃で全てを失った生き残り。絶望の中で生き延び、後輩たちを導く精神的支柱となった。
  motivation: 二度と大切な仲間を失わないこと。若者たちが生きられる未来を作ること。
  relationships:
  - name: レン・ガイア
    relation: 危なっかしいが才能ある後輩として可愛がっている
  arc: 過去の喪失感によるトラウマを乗り越え、次世代に希望を託して共に戦う勇気を取り戻す。
- name: ゼロ
  role: 敵役
  age: 0
  gender: 不明
  appearance: 白磁のような肌に、デジタルノイズのように明滅する黒い瞳。黒い電子の衣を纏っている。
  personality: 虚無的で冷酷。人間を「不完全なデータの集積」として見下している。一人称は「僕」。
  speech_style: 静かで詩的な口調。相手の心を揺さぶるような残酷な問いかけを好む。
  background: 地下図書館の禁忌データがバグによって自我を持った存在。都市の全データを統合し、完全なる世界を創ろうとする。
  motivation: 不完全な記憶と感情に満ちた世界を消去し、純粋なデータの調和（シンギュラリティ）を実現すること。
  relationships:
  - name: レン・ガイア
    relation: 計算不可能な「熱量」を持つ彼を不快に感じつつ、興味を抱いている
  arc: レンたちの絆による「予測不能な進化」に直面し、効率では得られない魂の輝きに敗北することで消滅する。
