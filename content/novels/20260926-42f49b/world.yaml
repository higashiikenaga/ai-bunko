title: 電脳爆裂！ネオン・ガイアの咆哮
genre: サイバーパンク
tone: 熱血、爆発的、高揚感あふれる特撮風
pov: 三人称
tense: 過去形
setting: 24時間、電子の光が絶えることのない超巨大都市「ネオン・ガイア」。摩天楼が夜を拒み、ネオンサインが不夜城を形作る「眠らない街」。
premise: 摩天楼が夜を拒む「眠らない街」ネオン・ガイア。そこでは、人々の魂の記録が「地下図書館」に厳重に保管されていた。しかし、その膨大なデータがバグとなって具現化した巨大怪獣たちが、街を、そして人々の記憶を喰らい尽くそうと襲来する！立ち向かうのは、鋼鉄の機体に魂を燃やす熱血パイロットたち。合体、咆哮、そして魂を叩き込む必殺の一撃！失われた記憶と、燃え上がる明日を取り戻すため、鋼鉄の巨神たちが今、咆哮する！
themes:
- 魂の共鳴
- 記憶の価値
rules:
- 機体の出力はパイロットの精神的熱量（パッション）に比例する
- 怪獣は地下図書館の未整理データが物理化した存在である
- 合体には互いの魂を共鳴させる『シンクロ・コール』が必要
plot_outline:
- '序盤: 整備士の少年レンは、怪獣の襲撃で街が危機に陥った際、地下図書館に眠る伝説の機体「プロメテウス」を起動し、その熱き魂を機体に注ぎ込む。'
- '中盤: 仲間たちの機体と「超次元合体」を果たし、巨大怪獣を次々と撃破。しかし、怪獣の正体が地下図書館の禁忌のデータであることが判明する。'
- '終盤: 都市の全電力を吸収した最終形態の怪獣が登場。レンは仲間との絆を叫び、限界を超えた究極合体「ネオン・ガイア・マックス」を成し遂げる。'
- '結末: 全エネルギーを注いだ必殺技が炸裂し、怪獣は爆散！街に束の間の夜明けが訪れる中、レンは次なる戦いのため、熱き咆哮と共に戦場へ駆け抜ける！'
style_notes: 擬音語（ドドォォン！、ギガァァン！）を最大限に活用し、ロボットの駆動音や爆発の衝撃を読者の肌に伝えるように書くこと。合体シーンや必殺技発動時は、まるで特撮番組のクライマックスのような、誇張された、熱量全開の描写を徹底せよ。台詞は叫ぶように、そして魂を揺さぶるように！
