- name: 浅葱 栞
  role: 主人公
  age: 24
  gender: 女性
  appearance: 黒髪のボブカット。都会的な服装だが、どこか影があり、常に古い文庫本を携帯している。細身で儚げな印象。
  personality: 知的好奇心が強く、理性的。しかし、一度疑問を抱くと執着してしまう危うさを持つ。一人称は「私」。
  speech_style: 標準語。落ち着いた、論理的な話し方。動揺すると言葉が詰まる。
  background: 都会で司書を目指していたが、祖父の急死を機に数十年ぶりに神凪村へ帰郷する。祖父が遺した「自分の名前が記された本」を見つける。
  motivation: 祖父の死の真相と、古本屋に記された自分自身の「記録」の謎を解明すること。
  relationships:
  - name: 蔵守 燈
    relation: 古本屋の店主であり、真実を告げる導き手
  - name: 葛城 権蔵
    relation: 村の秩序を押し付ける敵対者
  arc: 真実を知るための「観察者」から、逃れられない運命を受け入れ、泥の中に沈む「記録者」へと変貌する。
- name: 蔵守 燈
  role: 導き手
  age: 68
  gender: 男性
  appearance: 痩身で、常に埃っぽい古書の匂いがする。眼鏡の奥の瞳は異様に深く、感情が読み取れない。
  personality: 厭世的で達観している。真実を教えるが、決して救済は与えない。一人称は「わし」。
  speech_style: 低く、抑揚の少ない、古風な語り口。時折、祝詞のような韻を踏むことがある。
  background: 村の禁忌である「帳簿」を管理し、記憶と人間を仕分ける一族の末裔。
  motivation: 帳簿の記録を正確に保ち、村の理（ことわり）を停滞させないこと。
  relationships:
  - name: 浅葱 栞
    relation: 運命の記録を読み解く観測対象
  arc: 栞に禁忌の存在を教え、彼女を「最終列車」へと導く装置としての役割を完遂する。
- name: 葛城 権蔵
  role: 敵役
  age: 72
  gender: 男性
  appearance: 恰幅の良い体格。村の祭祀服を纏い、常に威圧的な存在感を放っている。眼光が鋭い。
  personality: 伝統と秩序を絶対視する狂信者。村の繁栄のためには個人の犠牲を当然と考える。一人称は「俺」。
  speech_style: 荒々しく、独特の訛り（神凪村の方言）を交えた断定的な話し方。
  background: 神凪村の長であり、代々の「泥送り」の儀式を執行する責任者。
  motivation: 供犠を完遂し、村の繁栄と血筋の安寧を永遠に維持すること。
  relationships:
  - name: 浅葱 栞
    relation: 儀式のために捧げられるべき「次の供物」
  arc: 村の秩序を守る守護者として、栞の脱出をあらゆる手段で阻止しようとする。
- name: 凪沙
  role: 脇役
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌。常に湿ったような、薄暗い瞳をした少女。実体がないように見える。
  personality: 感情が欠落しており、虚ろ。自分が何者であるかさえ忘れている。一人称は「わたし」。
  speech_style: 囁くような、消え入りそうな声。断片的な言葉を繰り返す。
  background: 過去に儀式の際、記憶を消されて「記録」から抹消された、境界を彷徨う存在。
  motivation: 失われた自分自身の名前と、生きていた証を探すこと。
  relationships:
  - name: 浅葱 栞
    relation: 警告者であり、逃れられぬ未来の鏡像
  arc: 栞に村の恐ろしい真実を予感させ、彼女を「最終列車」へと向かわせるきっかけを作る。
