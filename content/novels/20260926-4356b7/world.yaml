title: 夜行の栞、泥の祝詞
genre: 怪談・民俗
tone: 静謐にして逃げ場のない、湿り気を帯びた土着的な恐怖
pov: 三人称
tense: 過去形
setting: 昭和末期、深い山々に囲まれ外界から隔絶された廃村に近い集落「神凪村（かんなぎむら）」
premise: 祖父の死により数十年ぶりに故郷へ戻った主人公は、村の外れに佇む奇妙な古本屋に導かれる。そこには村人の「人生」が記された帳簿が保管されており、特定の日にだけ現れる「最終列車」が、不要となった記憶や人間を冥界へと運んでいた。禁忌を破り、消し去られるべき過去を読み解いた主人公は、村が代々繰り返してきた残酷な供犠の儀式に巻き込まれていく。
themes:
- 血縁の呪縛
- 忘却と記録
- 土着信仰の狂気
rules:
- 最終列車は「月隠れの祭」の夜にしか現れず、乗車券の代わりに古本屋で管理される『個人の記録本』を提示しなければならない
- 記録本を紛失した者、あるいは内容を書き換えられた者は、村の人間から認識されなくなり、最終的に泥に溶けて消える
- 村独自の古語・方言で語られる禁忌の言葉を口にした者は、神の「呼び声」を聞くことができる
plot_outline:
- '序盤: 主人公が神凪村に帰郷し、親族たちの不自然な歓迎と、村全体に漂う死の気配に違和感を抱く。偶然迷い込んだ古本屋で、自分の名が記された古い本を見つける。'
- '中盤: 村に伝わる「泥送り」の祭りと、最終列車の正体を知る。古本屋の店主から、村の繁栄のために定期的に「記録」を消された人間が列車で運ばれていることを告げられる。'
- '終盤: 主人公自身が次の「供物」に選ばれたことを知り、脱出を試みるが、村人たちが方言で唱える祝詞によって精神的に追い詰められていく。列車の出発時刻が迫る中、古本屋の地下に隠された真の禁忌に触れる。'
- '結末: 列車に乗り込むことでしか村を逃れられない矛盾に直面し、最愛の者の記憶を代償に支払って列車に飛び込むが、辿り着いた先は現実ではなく、永遠に泥の中で本を読み続ける静寂の世界であった。'
style_notes: 湿った土や古い紙の匂いなど、嗅覚と触覚に訴える描写を多用する。会話文には重い訛りのある方言を混ぜ、外部の人間が介入できない閉鎖性を演出。急がず、じわじわと包囲網が狭まるような静かな筆致で描く。
