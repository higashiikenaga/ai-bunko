- name: 瀬戸 海斗 (せと かいと)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの前髪で瞳に陰がある。痩せ型で、常にどこか物憂げな表情を浮かべている。
  personality: 内向的で理性的。過去の挫折から勝負事に対して臆病になっている。一人称は「僕」。
  speech_style: 丁寧だが、必要最低限のことしか話さない。静かで落ち着いたトーン。
  background: かつて「若き天才」と称された囲碁棋士。しかし、ある大会での敗北を機に、勝負の重圧に耐えられなくなり、競技を辞めて地方の町で静かに暮らしている。
  motivation: 盤上の対局を通じて、失いかけた「勝負することの輝き」と、他者との繋がりを取り戻すこと。
  relationships:
  - name: 一ノ瀬 星奈
    relation: 盤上の対局相手であり、心を通わせる少女
  arc: 孤独に閉じこもっていた受動的な姿勢から、大切な人のために自ら一手を投じる能動的な生き方へと変化する。
- name: 一ノ瀬 星奈 (いちのせ せな)
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透明感のある肌と、どこか遠くを見つめるような瞳。雨の日に似合う、儚げで美しい容姿。
  personality: 穏やかで思慮深い。世界を諦観しつつも、美しさを愛する感受性を持つ。一人称は「私」。
  speech_style: 詩的で静か。言葉数は少ないが、一言一言に重みがある。
  background: 「雨宿りの書庫」の常連であり、店主の親族。進行性の眼疾患を抱えており、徐々に視力を失いつつある。言葉よりも盤上の筋に自身の感情を託している。
  motivation: 視力を失う前に、誰かと「完璧な景色（盤面）」を共有すること。
  relationships:
  - name: 瀬戸 海斗
    relation: 盤上の対局相手であり、唯一の理解者
  arc: 闇に沈んでいく恐怖を抱えながらも、海斗との交流を通じて、光が消えても消えない心の結びつきを見出す。
- name: 蔵前 宗助 (くらまえ そうすけ)
  role: 脇役
  age: 62
  gender: 男性
  appearance: 白髪混じりの柔らかな髪に、使い古されたエプロン。穏やかな笑みを絶やさない老人。
  personality: 包容力があり、観察眼に優れる。聞き上手で、二人を見守る守護者のような存在。一人称は「私」。
  speech_style: ゆっくりとした、包み込むような話し方。少し古風な言い回しを用いる。
  background: 「雨宿りの書庫」の店主。古書店街の住人で、海斗や星奈が傷ついた時に、言葉を交わさずとも居場所を与えてきた。
  motivation: 二人が「雨宿り」の場所を卒業し、現実の世界へと踏み出すことを見守ること。
  relationships:
  - name: 瀬戸 海斗
    relation: 居場所を貸す対象であり、成長を見守る人物
  - name: 一ノ瀬 星奈
    relation: 家族のように大切に思っている存在
  arc: 物語に安定感を与える役割。二人の変化を静かに肯定し、背中を押す。
