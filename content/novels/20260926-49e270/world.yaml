title: 星図を綴る指先と、雨の日の静寂
genre: 青春恋愛
tone: 知的な緊張感と静謐な叙情
pov: 三人称近接
tense: 過去形
setting: 現代。地方都市の古書店街にある、雨の日だけ営業する隠れ家カフェ「雨宿りの書庫」。
premise: 元天才棋士の少年・海斗は、雨の日だけ開く不思議な店で、誰かが残した盤上の「問い」に出会う。相手は正体不明の少女・星奈。言葉を交わさず、盤上の「一手」のみで心を通わせる二人は、次第に互いの孤独を読み解いていく。それは、勝敗を超えた、世界で二人だけの静かな対話だった。
themes:
- 孤独の共有
- 論理と感情の境界
rules:
- 架空の戦略ボードゲーム『アストラム』を用いる。盤面は星図となっており、駒を配置して星座を形成し、天球の支配権を競うルールである。
- 雨の日だけ開く店では、盤上の対局相手と直接会話してはならないという暗黙のルールが存在する。
plot_outline:
- '序盤: 過去の挫折から勝負事を避けていた海斗が、雨の日限定のカフェで謎の対局相手が残した絶妙な一手に出会い、抗えない知的好奇心に突き動かされる。'
- '中盤: 盤上の手を通じて、相手が自分と同じ深い孤独と、世界に対する諦念を抱えていることに気づく。読みの深さから相手の価値観を察し、次第に盤上の交流が唯一の救いとなっていく。'
- '終盤: 星奈が病により視力を失いつつあることを知り、海斗は彼女が完全に光を失う前に、人生で最も美しく完璧な「星図（盤面）」を贈るため、最後の一手に全てを懸ける。'
- '結末: 勝敗という概念を捨て、二人で一つの完成された星座を描き出したとき、彼らは盤上の外にある現実の世界で、初めて互いの名前を呼び合い、手を取り合う。'
style_notes: 対局シーンでは、一手の選択が持つ戦術的な意味と、それが相手にどのような心理的圧迫や救いを与えるかを詳細に解説する。思考の迷路を辿るような内省的な独白を多用し、高度な知的な駆け引きを恋愛の比喩として描く。
