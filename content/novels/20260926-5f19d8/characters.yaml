- name: 佐伯 航（さえき わたる）
  role: 主人公
  age: 29
  gender: 男性
  appearance: 痩身でどこか頼りなげな印象を与える青年。常に手帳とペンを持ち歩いている。目の下に薄い隈がある。
  personality: 内向的で観察眼が鋭いが、自身の空虚感に怯えている。一人称は「僕」。
  speech_style: 丁寧だが、どこか自信なさげに言葉を選ぶ。語り部としての落ち着いたトーン。
  background: フリーランスのライター。数年前に大切な何か（あるいは誰か）を喪失してから、現実世界に対して強い疎外感を抱いている。
  motivation: 人々の不可解な体験談を集め、その正体を突き止めようとする。同時に、自分の中の欠落を埋める手がかりを探している。
  relationships:
  - name: 瀬戸 結衣
    relation: 相談者であり、物語の鍵を握る人物
  arc: 客観的な観察者としての立場を維持しようとするが、次第に自身も「空白地帯」の引力に抗えなくなり、境界線を越えてしまう。
- name: 瀬戸 結衣（せと ゆい）
  role: 脇役（相談者）
  age: 24
  gender: 女性
  appearance: 透明感のある、実体の薄さを感じさせる容姿。常に薄いベージュのコートを羽織っている。
  personality: 穏やかだが、どこか現実味のない浮世離れした雰囲気を持つ。一人称は「私」。
  speech_style: 淡々としており、まるで遠い出来事を語るかのように、自身の体験を客観的に話す。
  background: 都会の路地裏で「砂漠のオアシス」を目撃した女性。彼女の言葉は、物語の異質さを読者に強く印象付ける。
  motivation: 自分が体験したことの真偽を確認したいという欲求よりも、ただその「場所」に再び触れたいという、抗いがたい衝動。
  relationships:
  - name: 佐伯 航
    relation: 自身の体験を記録してくれる聞き手
  arc: 佐伯に情報を与える役割を果たすが、物語の中盤以降、彼女の存在感は徐々に希薄になり、記録からも消えていく。
- name: 高城 慎一（たきぎ しんいち）
  role: 敵役（あるいは現象の媒介者）
  age: 52
  gender: 男性
  appearance: 整った身なりだが、瞳の奥に底知れない暗さを湛えた初老の男。古い地図学者を思わせる。
  personality: 冷徹で知的な探求心に突き動かされている。一人称は「私」。
  speech_style: 威厳があり、論理的。しかし、時折「空白地帯」を賛美するような狂気的な響きが混じる。
  background: かつて地図製作に携わっていたが、ある事件を境に表舞台から姿を消した。空白地帯の存在を確信しており、人々をそこへ誘い込む役割を担っている。
  motivation: 現実の綻び（空白地帯）を拡張し、世界そのものを「名もなき場所」へと変貌させること。
  relationships:
  - name: 佐伯 航
    relation: 間接的な導き手であり、破滅への誘い手
  arc: 物語の黒幕的な存在として、佐伯が「空白」へ足を踏み入れるための論理的な道筋を提示し、追い詰めていく。
