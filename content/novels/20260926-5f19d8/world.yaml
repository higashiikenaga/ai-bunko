title: 寄る辺なき地名録
genre: ホラー
tone: 淡々とした聞き書き、静かな恐怖
pov: 一人称（聞き書きを行う語り手）
tense: 過去形
setting: 現代日本、および地図にない「空白地帯」
premise: 語り手のもとに、不可解な場所を訪れた人々が集まり、その体験を語る。ある者は森の中に立つ古い灯台を、ある者は都会の路地裏に現れた砂漠のオアシスを見たという。断片的な話が積み重なるにつれ、それらの場所が「現実から零れ落ちた穴」であることが示唆される。しかし、語り手自身もまた、その穴に引き寄せられていることに気づき始める。
themes:
- 喪失
- 境界線
rules:
- 「空白地帯」は、強い孤独や絶望を抱いた者にのみ、日常の裂け目として現れる。
- 滞在時間が長いほど、現実世界での自身の記憶や記録が消去されていく。
- 一度完全に「消えた」者は、二度と元の世界に戻ることはできず、場所の一部となる。
plot_outline:
- '序盤: 奇妙な場所を訪れたという知人や見知らぬ人々から、断片的な体験談を聞き取る形式で物語が始まる。'
- '中盤: 記述される風景（海のない場所にある灯台や、コンクリートの隙間のオアシス等）の共通点と、語り手たちが共通して抱えていた「何かを失った感覚」が浮き彫りになる。'
- '終盤: 話を聞かせてくれた人々が、一人、また一人と現実世界から忽然と姿を消し、彼らの存在に関する記録までもが消滅し始める。'
- '結末: 語り手が最後に辿り着いた「名もなき場所」で、かつての相談者たちの残滓に出会うが、それが再会なのか、あるいは自分もまた飲み込まれたのかは曖昧なまま終わる。'
style_notes: 「〜という話だ」「〜らしい」といった伝聞形式を多用し、断定を避ける。情景描写は最小限に留め、語り手の冷徹なまでの客観性を維持し、読者に想像させる余白を作る。あえて明確な解決や救いを与えず、静かな不気味さを残す。
