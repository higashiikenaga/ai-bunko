- name: 旭 陽翔（あさひ はると）
  role: 主人公
  age: 17
  gender: 男性
  appearance: どこにでもいるような平凡な少年。少し猫背で、常にスマートフォンを手にしている。眼鏡をかけている。
  personality: 内向的だが、好きなものに対しては驚くほどの情熱を持つ。一人称は「ボク」。
  speech_style: 控えめで、少し自信なさげな話し方。ネット上では饒舌になる。
  background: 現実の人間関係に疲れ、匿名掲示板やメタバースの世界に居場所を求めている高校2年生。
  motivation: 画面越しの『サクラ』に救われた恩返しとして、彼女の真実を守りたい。
  relationships:
  - name: 一ノ瀬 汐里
    relation: クラスメイトであり、憧れの配信者
  - name: 高木 芽依
    relation: 現実世界での数少ない理解者
  arc: デジタルな繋がりを消費するだけの存在から、現実の人間と向き合い、言葉を届ける勇気を持つ人間へと成長する。
- name: 一ノ瀬 汐里（いちのせ しおり）
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 目立たない黒髪のロングヘアで、常に俯き加減の地味な少女。配信者『サクラ』の時は、透き通るような白いアバターを使用している。
  personality: 真面目で繊細。周囲の目を極端に気にするが、内面には強い表現欲求を秘めている。一人称は「私」。
  speech_style: 消え入りそうなほど小さな声。ネット上では『サクラ』として、包容力のある落ち着いた口調になる。
  background: 学校では「空気」のような存在だが、メタバース『氷の城』の管理人として、匿名の人々に癒やしを与えている。
  motivation: 誰にも傷つけられない自分だけの居場所（氷の城）を守ること。
  relationships:
  - name: 旭 陽翔
    relation: 正体を知られたクラスメイト
  - name: 九条 蓮
    relation: 正体を暴こうとする脅威
  arc: 「仮面」を被って自分を守る生き方から、傷つくことを恐れずに「本当の自分」をさらけ出す生き方へと変わる。
- name: 九条 蓮（くじょう れん）
  role: 敵役
  age: 17
  gender: 男性
  appearance: 整った顔立ちで、常に最新のデバイスを使いこなす、学校のインフルエンサー的存在。
  personality: 承認欲求の塊。他人の秘密や「嘘」を暴くことを、コンテンツとしてのエンターテインメントだと考えている。一人称は「俺」。
  speech_style: 軽薄で自信に満ちた、人を食ったような話し方。
  background: SNSのフォロワー数こそが正義だと信じており、バズるためなら手段を選ばない。
  motivation: 『サクラ』の正体を暴き、そのスキャンダルで爆発的な注目を集めること。
  relationships:
  - name: 一ノ瀬 汐里
    relation: ターゲット（晒し対象）
  arc: 数字に支配された虚無的な価値観を象徴する存在として、主人公たちの対照的な壁となる。
- name: 高木 芽依（たかぎ めい）
  role: 相棒/脇役
  age: 17
  gender: 女性
  appearance: 明るい茶髪のショートカット。流行に敏感で、常に活発な印象を与える。
  personality: サバサバしていて義理堅い。ネットリテラシーが高く、情報の拡散に警鐘を鳴らす。一人称は「私」。
  speech_style: ハキハキとした、テンポの良い話し方。
  background: 陽キャのグループに属しているが、実はネット社会の毒性を理解しており、陽翔の危うさを心配している。
  motivation: 陽翔がネットの荒波に飲み込まれず、現実を失わないように見守ること。
  relationships:
  - name: 旭 陽翔
    relation: 幼馴染に近い友人
  arc: 傍観者として見守るだけでなく、陽翔が現実へ踏み出すための後押しをする役割を担う。
