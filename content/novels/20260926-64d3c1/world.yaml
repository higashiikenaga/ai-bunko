title: バズりすぎて死にたい、僕らの氷点下ログイン
genre: 青春恋愛
tone: 軽快、スピード感、切実、メタ的
pov: 一人称（ボク）
tense: 現在形・過去形混在
setting: 現代、SNSが生活の全てである高校生活と、匿名掲示板内のメタバース空間
premise: ボクは、匿名の美少女配信者『サクラ』に恋をした。でも、彼女の正体は学校一の地味女子、シオリちゃんだ。彼女が運営する仮想空間『氷の城』は、誰にも言えない本音を吐き出すためのシェルター。桜が舞う季節、ボクたちは画面越しと現実の狭間で、バグだらけの恋に落ちていく。
themes:
- SNSの虚構とリアリティ
- 自己肯定感
- 言葉の温度
rules:
- 仮想空間『氷の城』では、現実の感情がエフェクトとして視覚化される
- SNSでの炎上は、現実の精神的ダメージに直結する
plot_outline:
- '序盤: 配信者サクラに夢中なボク。ある日、クラスの地味子・シオリが『氷の城』の管理人だと気づいてしまう。'
- '中盤: 二人は『氷の城』を通じて、現実では言えない「本当のボク」を共有し始める。しかし、サクラの正体を暴こうとするアンチの動きが加速する。'
- '終盤: 桜が舞う卒業式前、アンチによる大規模な晒し行為が発生。シオリは『氷の城』ごと姿を消そうとする。'
- '結末: ボクは画面越しではなく、現実の彼女を「見つける」ために走る。バズるためじゃない、たった一人のための言葉を叫んで。'
style_notes: '一人称「ボク」による、テンポの良いツッコミ混じりの語り。地の文の途中に【@user_name: 投稿内容】や、ライブ配信の【コメント：草、これマジ？】といったログを挿入し、視覚的なスピード感を出すこと。メタ発言（「ここで感動シーンかよ！」など）を積極的に使い、読者の共感を煽る。'
