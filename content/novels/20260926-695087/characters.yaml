- name: 葛城 湊
  role: 主人公
  age: 26
  gender: 男性
  appearance: 痩身で顔色が白く、常にどこか疲弊したような目つきをしている。都会での生活に馴染めず、少し猫背な立ち姿。
  personality: 内向的で論理的。物事を客観的に捉えようとするが、感覚が鋭敏すぎて周囲の刺激に疲れやすい。一人称は「僕」。
  speech_style: 丁寧で控えめだが、思考が先行して言葉が途切れることがある。
  background: 都市部で古書修復の仕事に従事していた。親族との交流は乏しかったが、突然の訃報と不可解な遺言によって村へと引き戻される。
  motivation: 遺言の真意を解明し、静かな生活を取り戻すこと。
  relationships:
  - name: 霧島 志乃
    relation: 屋敷の管理者であり、自分を導く者
  - name: 葛城 零
    relation: 亡くなった親族
  arc: 合理的な思考を持つ人間が、理不尽な伝奇的恐怖に直面し、精神を摩耗させながら最終的にそのシステムの一部へと変貌していく。
- name: 霧島 志乃
  role: 敵役
  age: 45
  gender: 女性
  appearance: 黒い着物を常に纏い、濡れたような黒髪が特徴。表情の変化が乏しく、瞳の奥が底知れない深淵を感じさせる。
  personality: 冷静沈着で慈愛に満ちた微笑を絶やさないが、その本質は村の掟と地下図書館の維持を絶対視する非情な執行者。一人称は「私」。
  speech_style: 緩やかで抑揚の少ない、祈祷のような独特のリズムを持つ話し方。
  background: 代々この村と屋敷を守ってきた一族の末裔。地下図書館の「声」を管理し、次なる「耳」を迎え入れる役割を担っている。
  motivation: 地下図書館の沈黙を守り、石板に新たな言葉（命）を刻み続けること。
  relationships:
  - name: 葛城 湊
    relation: 次なる管理候補（獲物）
  arc: 湊に対して親身な助言者として振る舞いながら、彼が精神的に追い詰められるよう、密かに「声」の増幅を促す。
- name: 柳 慎一
  role: 脇役
  age: 68
  gender: 男性
  appearance: 深く刻まれた皺と、常に怯えたように泳ぐ視線。常に雨に濡れたような質感の古い作業着を着ている。
  personality: 臆病で疑り深いが、村の因習に縛られ逆らえない。一度に多くのことを話せなくなる「沈黙の病」を恐れている。一人称は「俺」。
  speech_style: 早口で、何かを隠すように言葉を濁したり、咳き込んだりする。
  background: 村の古参の住人。かつて屋敷の管理に関わっていた者が「消えた」現場を目撃しており、その恐怖がトラウマとなっている。
  motivation: 湊に警告を与えたいという微かな良心と、巻き込まれたくないという自己保身の間で揺れている。
  relationships:
  - name: 葛城 湊
    relation: 哀れな犠牲者予備軍
  arc: 湊に真実に近づくためのヒントを与えるが、結局は恐怖に屈し、自身も静かに村の闇に沈んでいく。
- name: 葛城 零
  role: 象徴的な存在
  age: 32
  gender: 男性
  appearance: 実体としては現れず、石板から漏れ出す「声」や、霧の中に揺らめく影としてのみ描写される。
  personality: 絶望、懇願、そして狂気。生前の記憶が断片化され、ただ「助けてほしい」という感情だけが肥大化している。
  speech_style: 重なり合う複数の声。耳鳴りのように、意味を成さない断片的な言葉の羅列。
  background: 湊の親族であり、前任の図書館管理者。遺言を残して死んだと思われていたが、その実態は石板に封じ込められた存在であった。
  motivation: 自身の苦しみ（耳鳴り）を誰かに引き継がせ、解放されること。
  relationships:
  - name: 葛城 湊
    relation: 後継者（自分に代わる存在）
  arc: 物語の進行と共に、単なる「死者の声」から、湊を地下へと引きずり込む「意志を持った泥」のような存在へと変質していく。
