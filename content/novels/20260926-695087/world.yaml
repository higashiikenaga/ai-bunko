title: 耳鳴りの底、泥に眠る言葉
genre: 伝奇
tone: 湿度の高い不安感と、五感を刺激する不穏な静寂
pov: 一人称
tense: 過去形
setting: 常に霧と雨に包まれた、山間の閉鎖的な村。朽ちかけた旧家の地下にある、水浸りの書庫。
premise: 疎遠だった親族の死により、主人公は雨の降り止まない村へと呼び戻される。遺された遺言には、屋敷の地下にある「図書館」を管理せよという不可解な条件が記されていた。そこは本ではなく、死者の「最期の呟き」を封じ込めた石板が並ぶ場所だった。静寂に慣れ始めた頃、主人公は自分の耳の奥で、まだ見ぬ誰かの囁きが鳴り響いていることに気づく。
themes:
- 記憶の澱
- 継承される呪縛
rules:
- 地下図書館の石板に触れた者は、その死者の最期の記憶を音として共有する。
- 図書館内で発せられた言葉は壁に吸収され、外部へは一切漏れない。
- 『管理』とは、石板に溜まった死者の執念を、自身の肉体（聴覚）で肩代わりし、中和し続ける行為である。
plot_outline:
- '序盤: 主人公が村に到着し、湿り気を帯びた家屋と村人の不自然な沈黙に違和感を覚える。遺言に従い地下へと降りると、カビと古い鉄の匂いが充満する地下図書館を発見する。'
- '中盤: 石板から聞こえる断片的な音に魅了され、次第に日常の音が色褪せていく。自身の耳鳴りが、実は地下に眠る誰かの呼び声であることに気づき、精神的に追い詰められていく。'
- '終盤: 遺言の真の目的が、図書館の維持に必要な「新しい耳」を確保することだったと判明する。逃げ出そうとするが、足元の泥濘が彼を地下へと引きずり戻そうとする。'
- '結末: 主人公は完全に静寂に飲み込まれ、自らも一枚の石板となって書庫に並ぶ。後日、新たな親族が村を訪れ、雨音に混じって誰かの囁きを聞く場面で幕を閉じる。'
style_notes: 「じっとりとした」「粘つくような」といった湿度を感じさせる形容詞を多用する。水滴が落ちる音や、古い紙が湿気で崩れる匂いなど、聴覚と嗅覚の描写を執拗に重ねることで、読者の不安を煽る。結論を急がず、「〜だったのかもしれない」「〜のように感じられた」といった曖昧な語尾を用いることで、正体不明の恐怖を維持させる。
