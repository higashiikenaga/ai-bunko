- name: 真砂 弦之介
  role: 主人公
  age: 28
  gender: 男性
  appearance: 煤けた灰色の着物に、使い込まれた打刀を帯びている。鋭い眼光と、過去の戦いでついた頬の古傷が特徴。
  personality: 寡黙で情に厚い。武士としての誇りを捨てきれず、不器用ながらも正義感を抱いている。一人称は「俺」。
  speech_style: ぶっきらぼうだが礼節を忘れない、古風な武士言葉。
  background: 元は名門藩の剣客だったが、記憶市場の台頭と共に藩が崩壊し、浪人となった。親友との絆だけを心の支えに生きていた。
  motivation: 市場に売られた親友の記憶を取り戻し、彼を奪った権力者に報復すること。
  relationships:
  - name: 久礼波
    relation: 利害一致による協力者
  - name: 権蔵
    relation: 憎悪する仇敵
  - name: 志能
    relation: 唯一無二の親友
  arc: 喪失への執着に囚われていたが、残酷な真実を受け入れた上で、それでも前を向いて歩む強さを得る。
- name: 久礼波
  role: 相棒
  age: 21
  gender: 女性
  appearance: ゴーグルを頭に乗せ、記憶抽出用の小型蒸気装置を腰に下げた機能的な装束。指先には精密作業用の義指を装着している。
  personality: 現実主義で皮肉屋。大人の事情に精通しているが、根は情に脆い。一人称は「私」。
  speech_style: 早口で現代的な口調。相手を小馬鹿にするような傾向があるが、核心を突く。
  background: 記憶市場の元職員。システムの非道さに絶望し、機密データを盗み出して逃亡した潜伏中の情報屋。
  motivation: 記憶を商品化する体制を内部から崩壊させ、奪われた人々の尊厳を取り戻させること。
  relationships:
  - name: 真砂 弦之介
    relation: 危うい信頼を寄せる共闘相手
  arc: 他者を拒絶し孤独に戦っていたが、真砂の真っ直ぐな信念に触れ、再び誰かと共に歩む勇気を持つ。
- name: 権蔵
  role: 敵役
  age: 55
  gender: 男性
  appearance: 豪華な絹の着物に、生命維持装置を兼ねた巨大な蒸気外骨格を背負っている。目は機械的に改造されており、常に冷徹な光を放つ。
  personality: 傲慢で支配欲が強い。人間を「記憶の集積体」という部品としてしか見ていない。一人称は「私」。
  speech_style: 慇懃無礼。相手を精神的に追い詰める、余裕に満ちた話し方。
  background: 記憶市場の創設者であり、都市の政治・経済を裏から操る黒幕。自らも多くの記憶を統合し、超人的な知能を得ている。
  motivation: 全人類の記憶を統制し、争いのない「完璧な秩序」を持つ世界を構築すること。
  relationships:
  - name: 真砂 弦之介
    relation: 計算を乱す不純物として排除したい対象
  arc: 完璧な支配を確信していたが、数値化できない「魂の叫び」に敗北し、すべてを喪失する。
- name: 志能
  role: 物語の鍵となる人物
  age: 28
  gender: 男性
  appearance: 清廉な佇まいの若き武士。記憶の断片の中では、常に穏やかな微笑を浮かべている。
  personality: 高潔で理想主義。誰よりも優しく、真砂が最も尊敬し、信頼した人物。一人称は「僕」。
  speech_style: 柔らかく、相手を包み込むような穏やかな口調。
  background: 真砂と共に武士の誇りを追求したが、ある陰謀により記憶を奪われ、結果的に命を落とした。
  motivation: （故人のため）記憶を通じて真砂に真実を伝え、彼を呪縛から解き放つこと。
  relationships:
  - name: 真砂 弦之介
    relation: 魂の友
  arc: 物語を通じて、断片的な記憶から完全な姿へと再構成され、真砂の心の中で救いとなる。
