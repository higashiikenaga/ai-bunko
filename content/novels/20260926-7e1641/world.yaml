title: 鋼鉄の残響、忘却の記憶
genre: 歴史・時代小説
tone: 硬派で重厚、静寂と激動の対比
pov: 三人称
tense: 過去形
setting: 蒸気機関が文明を支配し、黒煙が空を覆う架空の幕末。
premise: 蒸気の煙が立ち込める巨大都市。人々は生活のために大切な記憶を切り売りする「記憶市場」に依存していた。かつて武士の誇りを共に守った友の記憶を奪われた浪人・真砂は、記憶を弄ぶ巨大な権力へと刃を向ける。彼は蒸気式の義肢を持つ刺客たちを斬り捨て、失われた真実と、己の魂の在処を求めて戦いの渦中へ踏み込んでいく。
themes:
- 記憶の価値と尊厳
- 技術革新と武士道の対立
rules:
- 記憶の売買は、その記憶に紐付く感情や剣術などの技能も対象とする
- 蒸気動力を用いた武具は強力だが、使用者の身体と神経を激しく消耗させる
- 記憶を失った者は、その記憶に関連する社会的繋がりや自己同一性を喪失する
plot_outline:
- '序盤: 蒸気の煙が漂う街で、真砂は友の記憶が市場で売買されたことを知り、記憶商人を追う。'
- '中盤: 記憶市場の核心部へ潜入。そこでは、高度な武技の記憶さえもが商品となっていた。真砂は蒸気義肢を纏う強化兵たちとの死闘を繰り抜ける。'
- '終盤: 記憶の保管庫にて、すべてを支配する黒幕と対峙。極限の静寂の中、真砂は己の魂を懸けた一撃を放つ。'
- '結末: 記憶を取り戻すが、それは友の死を再認識させる残酷な真実だった。真砂は再び、煙の向こうへと歩み出す。'
style_notes: 簡潔で力強い文体。剣戟の描写では、動きの激しさよりも「間」と「緊張」を重視する。抜き身の刀が空気を裂く音、蒸気の噴出、そして、一騎打ちの直前に訪れる、心臓の鼓動さえも凍りつくような静寂を克明に描くこと。
