- name: 如月 蓮 (きさらぎ れん)
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身でどこか頼りない印象。サイズが少し大きい防寒作業着に身を包んでいる。好奇心に満ちた大きな瞳が特徴。
  personality: 真面目で努力家だが、自信 lacking。理論には強いが経験が浅い。一人称は「僕」。
  speech_style: 丁寧語。緊張すると早口になり、専門用語を並べて説明する癖がある。
  background: 低温工学の成績優秀な卒業生。理論上の「正解」を信じていたが、現場の「感覚」という壁にぶつかり、保管センターに配属される。
  motivation: 完璧な温度管理を遂行し、師匠であるアイゼンに「調律師」として認められること。
  relationships:
  - name: アイゼン・ガルドス
    relation: 畏怖する師匠
  - name: エレナ・ヴォルコフ
    relation: 頼れる先輩
  arc: 理論のみの思考から脱却し、微細な変化を感じ取る「感性」を身につけ、最後には自らの判断で危機を救う技術者へと成長する。
- name: アイゼン・ガルドス
  role: 師匠/導き手
  age: 54
  gender: 男性
  appearance: 鋭い眼光と、冷気による凍傷の痕が残る無骨な手。常に隙のないグレーの制服を着用している。
  personality: 冷徹な完璧主義者。妥協を一切許さず、仕事に対しては宗教的なまでの敬意を持つ。一人称は「私」。
  speech_style: 簡潔で断定的。突き放すような言い方だが、言葉の端々に技術者としての誇りが滲む。
  background: センター創設期から勤務する伝説的な調律師。数々の危機を乗り越えてきたが、その過程で多くの同僚を失っている。
  motivation: 歴史的遺産を「永遠」に凍結させ、後世に完璧な状態で引き継ぐこと。
  relationships:
  - name: 如月 蓮
    relation: 未熟だが可能性を感じている弟子
  - name: エレナ・ヴォルコフ
    relation: 信頼しているが意見が衝突する同僚
  arc: 頑なな「保存」への執着から、蓮の成長を通じて、技術とは単なる固定ではなく「未来への橋渡し」であることに気づく。
- name: エレナ・ヴォルコフ
  role: 相棒/サポート
  age: 31
  gender: 女性
  appearance: ショートカットの金髪。作業着にカラフルなパッチを貼り付けてカスタマイズしている。快活な笑顔が印象的。
  personality: 楽観的で現実主義。アイゼンと蓮の間の緩衝材となるムードメーカー。一人称は「私」。
  speech_style: 砕けた口調。冗談を交えながら、核心を突くアドバイスをくれる。
  background: 有機化学のスペシャリスト。保存物の「化学的崩壊」を防ぐ専門知識を持ち、技術的なアプローチで保管庫を支える。
  motivation: 凍りついた遺物が持つ「かつての生きた記憶」に触れ、それを解明すること。
  relationships:
  - name: 如月 蓮
    relation: 可愛がっている後輩
  - name: アイゼン・ガルドス
    relation: 尊敬しつつも、その堅物ぶりに呆れている
  arc: 単なる好奇心から始まった仕事への関心が、遺物を守るという強い使命感へと変わり、技術的な限界に挑む勇気を得る。
- name: ジュリアン・ソーン
  role: 対立者/触媒
  age: 45
  gender: 男性
  appearance: 細身で眼鏡をかけた知的な風貌。技術者よりも学者に近い、清潔感のある白いコートを纏っている。
  personality: 野心的で知的好奇心が強い。現状維持よりも「進化」や「活用」を重視する。一人称は「私」。
  speech_style: 穏やかで説得力があるが、相手をコントロールしようとする傲慢さが潜んでいる。
  background: 外部から派遣された研究責任者。双子の科学者が遺した結晶体を「活用」し、歴史の空白を埋めることで名声を得ようとする。
  motivation: 結晶体に秘められた未知の情報を抽出し、現代の秩序を再定義すること。
  relationships:
  - name: アイゼン・ガルドス
    relation: 思想的に対立する宿敵
  - name: 如月 蓮
    relation: 利用価値のある若手として注目している
  arc: 効率と成果を追い求めるあまり、保存の真の意味を見失うが、最後には蓮たちが守り抜いた「静寂」の価値を認めざるを得なくなる。
