title: 氷結保管庫の調律師たち ―溶けない記憶と、二つの季節―
genre: 群像劇
tone: 真摯、静謐、プロフェッショナル
pov: 一人称（新人・僕）
tense: 過去形
setting: 近未来、極寒の北端に位置する「特殊温度管理型・歴史遺産保管センター'
premise: 極低温で保存しなければ崩壊してしまう『歴史的価値のある有機物』を管理する、特殊保冷技術者たちの物語。新人の僕は、凍りついた遺物を扱うプロたちの、妥協を許さない仕事の流儀を学んでいく。ある日、氷の城のように巨大なメイン冷凍庫の中で、双子の研究者が遺した未解明のサンプルが発見される。それは、歴史の空白を埋めるか、あるいは現在の秩序を凍らせるか、大きな問いを投げかけるものだった。
themes:
- 技術者の矜持
- 失われた記憶の継承
- プロフェッショナリズム
rules:
- 遺物の温度が1度でも変動すれば、保存対象は瞬時に分解・消失する
- 保冷材の組成は、対象物の材質に合わせて分子レベルで調整する必要がある
- 保管センター内では、極低温による事故を防ぐため、厳格な動作プロトコルが定められている
plot_outline:
- '序盤: 保管センターに配属された新人「僕」が、保冷技術の基礎と、温度管理の過酷さを学ぶ。師匠たちによる、一点の曇りもない「温度の調律」の美しさに圧倒される。'
- '中盤: 氷の城を思わせる巨大保管庫の深部で、かつてこの施設を設計した双子の科学者が残した「特殊な結晶体」が見つかる。その扱いに、現場の技術者たちの間で意見が割れる。'
- '終盤: 予期せぬシステムの熱暴走が発生し、結晶体が溶け出す危機に。僕は、現場で培った知識と、小さな調整の積み重ねによって、崩壊の危機を食い止めるための「極小の温度制御」に挑む。'
- '結末: 危機を脱し、結晶体は守られた。完璧な仕事とは何か、技術が何を繋いでいるのかを噛み締めながら、僕は再び、日々の微細な温度管理という戦場へと戻っていく。'
style_notes: 一人称「僕」の視点で、技術的な専門用語（例：熱伝導率、昇華点、熱容量など）を、新人が学んでいくプロセスを通じて丁寧かつ分かりやすく解説する。派手なアクションではなく、ネジ一本の締め具合や、温度計の針が指す数値へのこだわり、作業を終えた後の静かな達成感といった「仕事の細部」を、美しく、かつ誇り高く描く。
