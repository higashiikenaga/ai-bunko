- name: ハル
  role: 主人公
  age: 17
  gender: 男性
  appearance: どこにでもいる平凡な高校生。現実では疲れ気味の瞳で、地味な服装を好む。VR内では汎用性の高い軽装の冒険者姿。
  personality: 内向的で観察眼が鋭い。現実の人間関係に疲れ、仮想世界に居場所を求めている。一人称は「僕」。
  speech_style: 控えめで丁寧だが、どこか距離感を置いた話し方。
  background: 近未来の管理された社会で、静止したような日常を過ごしている。VRMMO『エリュシオン・ゲート』の境界線探索に没頭していた。
  motivation: リンという不可思議な存在への好奇心から、次第に彼女を消滅から救いたいという強い願いへ変わっていく。
  relationships:
  - name: リン
    relation: 運命的な出会いを果たしたパートナーであり、恋い慕う相手
  - name: カイト
    relation: 唯一本音を話せる親友であり、ゲーム上の相棒
  arc: 傍観者として世界を見ていた少年が、誰かのために喪失を恐れ、現実と仮想の境界を越えて行動する主体的な人間へと成長する。
- name: リン
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような白い肌と銀色の長い髪。輪郭に時折デジタルノイズのような揺らぎがある。白いワンピースに幾何学模様の装飾を纏っている。
  personality: 儚げで純粋だが、目的意識は強い。失われた記憶に切なさを抱えている。一人称は「私」。
  speech_style: どこか古風で詩的な表現を用いる。静かで穏やかな口調。
  background: かつてこのゲームを深く愛し、今は亡きあるプレイヤーの「記憶の残滓」がバグによって擬人化した存在。ログイン記録を持たないデータ上の幽霊。
  motivation: 自分が誰であったのかを知るため、そして誰に宛てられたのか分からない「失われた手紙」を届けること。
  relationships:
  - name: ハル
    relation: 自分を「データ」ではなく「一人の人間」として見てくれた特別な存在
  arc: 断片的な記憶に縛られた「残滓」としての存在から、ハルとの交流を通じて「今この瞬間」を生きる意志を持つに至る。
- name: カイト
  role: 相棒
  age: 17
  gender: 男性
  appearance: 快活な印象の少年。VR内では最高レアリティの派手な重装備に身を包み、常に最新のガジェットを装備している。
  personality: 自信家で社交的。効率とスペックを重視するゲーマー気質だが、情に厚い。一人称は「俺」。
  speech_style: カジュアルで早口。ネットスラングやゲーム用語を多用する。
  background: トッププレイヤーの一人であり、ゲームの内部構造や仕様に詳しい。ハルの地味な探索癖を面白がって付き合っている。
  motivation: 未知のバグ領域の解明という知的好奇心と、親友であるハルをサポートすること。
  relationships:
  - name: ハル
    relation: 対照的な性格ながら信頼し合っている親友
  - name: リン
    relation: システム上の不具合として興味を持つが、次第に一人の少女として尊重するようになる
  arc: 数値化された強さや効率こそが正義だと信じていたが、データでは測れない「想い」の価値を認めるようになる。
- name: 結衣
  role: 脇役（現実世界の鍵）
  age: 17
  gender: 女性
  appearance: 知的で清潔感のある外見。眼鏡をかけており、いつもノートやタブレットを持ち歩いている。
  personality: 現実主義で理知的。感情を表に出さないが、内面には深い喪失感を抱えている。一人称は「私」。
  speech_style: 簡潔で論理的。断定的な言い回しが多い。
  background: ハルのクラスメイト。かつてリンの元となったプレイヤーと親しく、彼女が遺した現実での痕跡を密かに守り続けている。
  motivation: 過去に決着をつけ、友人が本当に伝えたかった言葉を正しく受け取ること。
  relationships:
  - name: ハル
    relation: 最初は距離があったが、リンの件を通じて心を通わせるようになる
  - name: リン
    relation: かつての親友の面影を重ねる相手
  arc: 過去の思い出に固執し、現実を止めていた状態から、ハルの行動に触発されて前を向いて生きる決心をする。
