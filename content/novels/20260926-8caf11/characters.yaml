- name: ポテト
  role: 主人公
  age: 32
  gender: 男性
  appearance: ベージュの大きなエプロンを身に着けた、穏やかな顔立ちの青年。眼鏡の奥にすべてを見透かすような優しい瞳を持っている。
  personality: 聞き上手で包容力がある。物事に動じない性格。一人称は「私」。
  speech_style: 丁寧で柔らかい口調。相手の言葉を否定せず、ゆっくりと相槌を打つ。
  background: 町外れで小さな喫茶店を営む店主。彼自身もかつて何かを失った経験があり、その空白を埋めるようにしてこの店を切り盛りしている。
  motivation: 届けられた鍵の持ち主を探し、訪れる人々が心の平穏を取り戻す手助けをすること。
  relationships:
  - name: ハチ
    relation: 店を訪れる常連客であり、弟のような存在
  - name: リン
    relation: 信頼し合っている知人であり、相談相手
  arc: 傍観者として店を守っていたが、鍵の謎を追う中で、自分自身が封印していた過去の寂しさと向き合い、それを肯定できるようになる。
- name: ハチ
  role: 相棒
  age: 19
  gender: 男性
  appearance: 少し癖のある茶髪に、オーバーサイズのカーディガンを羽織った少年のような青年。
  personality: 好奇心旺盛で直感的。寂しがり屋で、心のどこかに埋められない穴を感じている。一人称は「俺」。
  speech_style: 快活だが、ふとした瞬間に弱々しくなる。語尾に「〜だし」と付けることが多い。
  background: この町で育ったが、幼少期の記憶が断片的にしかなく、常に「何か大切なものを忘れている」という感覚に苛まれている。
  motivation: 鍵に惹かれた理由を突き止め、自分の失った記憶の正体を知ること。
  relationships:
  - name: ポテト
    relation: 精神的な支えとなってくれる店主
  - name: リン
    relation: 口喧嘩をしながらも認め合っている友人
  arc: 辛い記憶を消して得た偽りの平穏よりも、痛みと共に誰かを想うことの尊さに気づき、精神的に成長する。
- name: リン
  role: 相棒
  age: 26
  gender: 女性
  appearance: 知的で端正な顔立ち。常にノートを携帯しており、服装はシンプルで機能的なシャツスタイル。
  personality: 論理的で慎重。感情に流されることを嫌うが、内面には強い情熱と孤独を抱えている。一人称は「私」。
  speech_style: 簡潔で明快な話し方。分析的な口調だが、親しい相手には皮肉混じりの優しさを見せる。
  background: 町の図書館に勤務する司書。地域の歴史や伝承に詳しく、地図から消えた「霧隠村」の存在に学術的な興味を持っていた。
  motivation: 霧隠村の謎を解明し、この町に隠された記憶のメカニズムを論理的に理解すること。
  relationships:
  - name: ポテト
    relation: 唯一、自分の弱音を吐ける相手
  - name: ハチ
    relation: 危なっかしい彼を放っておけない保護者的な友人
  arc: 正解や根拠ばかりを求めていたが、記憶とは不完全で曖昧だからこそ美しいものであることを受け入れる。
- name: シオン
  role: ガイド/市場の案内人
  age: 不詳（外見は20代）
  gender: 中性
  appearance: 琥珀色の長いコートを纏い、手には小さな天秤を持っている。瞳の色が左右でわずかに異なる。
  personality: 飄々としていて掴みどころがない。記憶の価値を定める冷徹さと、人間への深い慈しみを併せ持つ。一人称は「僕」。
  speech_style: 詩的で比喩が多い。相手に問いかけるような話し方をする。
  background: 『忘却の市場』の管理人の一人。人々が売った記憶を管理し、適切に処理する役割を担っている。
  motivation: 市場の秩序を守ること。しかし、鍵を持った彼らが市場に干渉することで、停滞していた記憶の循環が動くことに期待している。
  relationships:
  - name: ポテト
    relation: 互いの役割を理解し、静かに牽制し合う関係
  arc: 記憶を「売買される商品」としてのみ見ていたが、人々が記憶を取り戻そうとする意志に触れ、忘却の残酷さと記憶の救いに気づく。
