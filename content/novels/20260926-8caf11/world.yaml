title: 琥珀色の落とし物と、記憶の市場
genre: 群像劇
tone: 温かみのある、静謐なミステリー
pov: 三人称
tense: 過去形
setting: 現代、霧の深い海辺の町。その裏側には『忘却の市場』と呼ばれる、人の記憶を売買する不思議な空間が隠れている。
premise: 海辺の町にある小さな喫茶店を舞台に、持ち主不明の遺品や、ふとした違和感に直面する人々が集まってくる。ある日、かつて地図から消えたはずの『霧隠村』の古い鍵が店に届けられる。鍵の持ち主を探す過程で、人々は自分たちが売り払ってしまった大切な記憶の断片に気づいていく。それは誰かを責めるためのものではなく、失くした温もりを取り戻すための物語。
themes:
- 忘却と受容
- 記憶の価値
- 繋がりの再発見
rules:
- 記憶を売ると、その記憶に関する感情的な痛みは消えるが、その経験から得た教訓や温もりも同時に失われる
- 『消えた村』の住人は、記憶を売りすぎたために、現実の地図から存在が希薄になっている
- 謎解きの過程で、誰も損をしたり、誰かを糾弾したりすることはない
plot_outline:
- '序盤: 喫茶店の店主である「ポテト」のもとに、名前のない古い鍵が届く。常連客の「ハチ」や「リン」は、その鍵がどこから来たのか、なぜ自分たちの胸をざわつかせるのかを話し合う。'
- '中盤: 鍵の正体を探るうちに、町の人々が「記憶を売る市場」を利用していることが判明する。人々は辛い記憶を売ることで平穏を得ていたが、それと引き換えに、大切な誰かを想う心まで削り取られていた。'
- '終盤: 鍵は、かつて存在した「霧隠村」の集会場の鍵だった。村が消えたのは、村人全員が「村の存在」という記憶を市場に売ってしまったからだと判明する。ハチたちは、その鍵が「村を消した呪い」ではなく、「村を思い出すための招待状」であることを突き止める。'
- '結末: 誰も傷つくことなく、人々は失った記憶を無理に取り戻すのではなく、新しい記憶で古い記憶を優しく包み込むことを選ぶ。喫茶店には、少しだけ寂しくて、けれど温かい風が吹き抜ける。'
style_notes: 三人称視点を用い、登場人物は「ポテト」「ハチ」「リン」といった親しみを込めたあだ名で呼び合う。会話劇を主体とし、日常の些細な違和感から大きな謎へと繋げていく。ミステリーとしての解決は、犯人を追い詰めるのではなく、失われたものへの敬意を示す形で行う。文体は穏やかで、情景描写は色彩豊かに、読者の心に寄り添うようなやさしい筆致を心がける。
