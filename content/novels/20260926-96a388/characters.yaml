- name: 氷室 零
  role: 主人公
  age: 32
  gender: 男性
  appearance: 色白で線の細い、理知的な顔立ち。常に冷静で、感情を読み取らせない瞳をしている。
  personality: 極めて論理的で冷徹。事象の整合性を何よりも優先する。一人称は「僕」。
  speech_style: 簡潔で無駄がなく、常に断定的な口調。
  background: 元数学者。ある数学的矛盾の解明に没頭するあまり社会性を失い、現在は特殊事件専門の探偵として活動している。
  motivation: 目の前の「不可能な現象」を論理の力で解明し、矛盾を解消すること。
  relationships:
  - name: 霧島 奏
    relation: 協力者
  arc: 完璧な論理が人間の醜い欺瞞によって崩される様を目の当たりにし、真実がもたらす救いようのない孤独を理解していく。
- name: 霧島 奏
  role: 相棒
  age: 26
  gender: 女性
  appearance: 活動的なショートヘア。観測施設の作業着を着用しており、瞳には意志の強さが宿っている。
  personality: 直感的で情熱的。論理よりも現場の状況や人々の感情の変化に敏感。一人称は「私」。
  speech_style: 明るいが、緊迫した場面では芯の強さを感じさせる落ち着いた口調。
  background: 『氷の城』のシステムエンジニア。施設の構造と高度な計測機器の仕様に精通している。
  motivation: 閉鎖環境での混乱を収め、生存者たちの安全と、起きた出来事の真相を明らかにすること。
  relationships:
  - name: 氷室 零
    relation: 相棒
  arc: 氷室の冷徹な思考を補完する役割を担いながら、論理だけでは見えない「人間の真実」を理解する。
- name: 佐伯 誠一郎
  role: 敵役
  age: 54
  gender: 男性
  appearance: 厳格な風貌。白髪混じりの短髪で、常に背筋が伸びており威圧感がある。
  personality: 規律を重んじる完璧主義者。科学の純粋性を守るためなら手段を選ばない「冷徹な正義」を持つ。一人称は「私」。
  speech_style: 威厳があり、丁寧だがどこか突き放すような冷たさがある。
  background: 極地気象観測プロジェクトの総責任者。施設の絶対的な権威であり、科学者としての誇りが極めて高い。
  motivation: 観測データの改竄を完全に阻止し、科学的真実を汚されないこと。
  relationships:
  - name: 氷室 零
    relation: 対立者
  arc: 自身の犯行が論理的に暴かれ、守ろうとした「正義」が単なる独善的な孤独であったことを突きつけられる。
- name: 浅見 蓮
  role: 脇役（容疑者）
  age: 24
  gender: 男性
  appearance: 常に落ち着きがなく、視線が泳ぎがち。痩せ型で顔色が悪い。
  personality: 神経質で臆病。何か重大な秘密を隠しているような、不自然な挙動を見せる。一人称は「俺」。
  speech_style: 早口で、問い詰められると防衛的で混乱した口調になる。
  background: 観測施設の研究員助手。極限状態の中で、自身の私利私欲のためにデータの持ち出しを企てていた。
  motivation: 自身が行った不正行為を隠蔽し、社会的な破滅を免れること。
  relationships:
  - name: 佐伯 誠一郎
    relation: 上司
  arc: 殺人犯ではないことが判明するが、自身の罪と向き合い、真実がもたらす罰を受け入れる。
