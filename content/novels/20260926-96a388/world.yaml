title: 零度の論理学：蝕まれる月と氷の城
genre: 本格ミステリー
tone: 理知的、冷徹、静謐な緊張感
pov: 三人称（探偵の思考を括弧書きで挿入）
tense: 過去形
setting: 現代、標高3000メートルを超える極地にある、最新鋭の気象観測施設『氷の城』
premise: 月食が発生する極夜の夜、断絶された観測施設『氷の城』にて、唯一の生存者である研究員が密室状態で死亡した。現場に残されたのは、不自然なほど完璧な幾何学的形状の氷の結晶と、消失した研究データのみである。孤立無援の雪嵐の中、論理の欠片を拾い集める探偵は、物理法則を無視したかのような不可能犯罪の背後に潜む、あまりに人間的な欺瞞を暴き出すことになる。
themes:
- 閉鎖空間における論理の限界
- 観測という名の主観的暴力
rules:
- 施設の通信設備は月食中の磁気嵐により完全に遮断される
- 全ての部屋は電子錠で制御され、入退室ログが厳密に記録されている
- 現場の温度は常に一定に保たれており、自然な融解は起こり得ない
plot_outline:
- '序盤: 月食の夜、観測施設内で発生した密室殺人。探偵は生存者たちの矛盾した供述と、現場に残された『不自然な氷の破片』に注目する。'
- '中盤: 物理的なトリックが次々と論破される中、探偵はログの改竄ではなく『時間の認識のズレ』という概念的な隙間に気づく。被害者が遺した数式の断片が手がかりとなる。'
- '終盤: 犯人は、月食による暗闇を利用したのではなく、月食の『予測可能性』を利用してアリバイを構築していたことが判明する。氷の結晶は、犯行時刻を操作するための装置であった。'
- '結末: 犯人の動機は、観測データの改竄を阻止するための、極めて冷徹な『正義』であった。探偵は皮肉を交えつつ、真実がもたらす救いようのない孤独を突きつける。'
style_notes: 九条レイの文体を徹底すること。感情的な描写を排し、事象を解剖するように記述する。探偵の思考は（……いや、その仮説は論理的に破綻している）といった形で括弧書きで挿入し、読者に思考のプロセスを共有させる。会話は、相手の矛盾を突く鋭利な刃物のような、理詰めの応酬とする。
