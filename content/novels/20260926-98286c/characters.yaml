- name: 瀬戸 湊 (せと みなと)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 痩身だが引き締まった体躯。かつてのような爆発的な筋肉は減り、どこか影のある表情。短髪で清潔感はあるが、どこか虚脱感を漂わせている。
  personality: 完璧主義でストイック。自分に対して極めて厳しい。一人称は「僕」。
  speech_style: 丁寧だが、どこか自分を突き放すような冷めた口調。
  background: 県内屈指のスプリンターとして期待されていたが、予期せぬ肉離れにより、以前のような爆発的な加速力を失う。
  motivation: 失った感覚を取り戻すことではなく、今の不完全な身体で「納得できる走り」を見つけること。
  relationships:
  - name: 佐伯 律
    relation: かつてのライバルであり、再起のきっかけを与える存在
  - name: 日向 葵
    relation: 身体の感覚を言語化する手助けをする幼馴染
  arc: 0.01秒の記録に執着し、壊れた身体を呪う状態から、肉体の微細な感覚を受け入れ、自分だけの走りのリズムを肯定できるようになる。
- name: 佐伯 律 (さえき りつ)
  role: 敵役/ライバル
  age: 17
  gender: 男性
  appearance: ガッシリとした体格。眩しいほどの笑顔と、圧倒的な運動神経を感じさせる躍動的な佇まい。
  personality: 直感的でポジティブ。努力を努力と思わないタイプ。一人称は「俺」。
  speech_style: 快活で、相手の核心を突くような真っ直ぐな話し方。
  background: 湊のライバルとして常にトップを争っていた。湊の挫折を察しながらも、あえて以前と変わらぬ熱量で接する。
  motivation: 湊という壁を乗り越え、最高のレースをすること。
  relationships:
  - name: 瀬戸 湊
    relation: 超えるべき壁であり、尊敬するライバル
  arc: 湊の変容を間近で見守り、単なる「速さの競い合い」から「走ることの哲学」を共有する相手へと変化していく。
- name: 日向 葵 (ひなた あおい)
  role: 相棒/理解者
  age: 17
  gender: 女性
  appearance: 眼鏡をかけた知的な印象。常にノートを持ち歩いている。落ち着いた雰囲気。
  personality: 観察眼が鋭く、冷静沈着。感情に流されず、物事を構造的に捉える。一人称は「私」。
  speech_style: 論理的で落ち着いており、湊の混乱を鎮めるような穏やかな口調。
  background: 湊の幼馴染。陸上部ではないが、湊の走りを長年観察しており、バイオメカニクス的な視点から助言を与える。
  motivation: 湊が自分自身を見失わないよう、客観的な指標を提供し続けること。
  relationships:
  - name: 瀬戸 湊
    relation: 最も近い理解者であり、データの観測者
  arc: 湊の「痛み」に共感しすぎる危うさを持ちながらも、一人のランナーとしての彼の再生を論理と情熱の両面から支える。
