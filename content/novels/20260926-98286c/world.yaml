title: ゼロ・ディスタンスの残響
genre: スポーツ青春
tone: 内省的で孤独、静謐な熱量
pov: 一人称（私）
tense: 過去形
setting: 現代、地方都市の陸上競技場と、坂道の多い通学路
premise: 100メートル走のスター候補だった私は、予期せぬ肉離れによって、かつての爆発的な加速力を失った。精密な機械のように自分の体を制御しようとするほど、筋肉の微かな震えが「嘘をつけない呪い」のように、今の不完全さを突きつけてくる。折れた剣を握りしめるような無力感の中で、私は最短距離を駆け抜けることではなく、一歩一歩の重みを刻むための新しい走りを見つけ出していく。
themes:
- 挫折からの再構築
- 自己の身体への回帰
rules:
- 怪我による肉体的な制約が物語の物理的限界として機能する
- 記録（タイム）は絶対的な指標であり、感情とは切り離された冷徹な事実として扱われる
plot_outline:
- '序盤: 記録更新を目前にして走れなくなった「私」の絶望。0.01秒の差に執着し、壊れた身体を責める日々。'
- '中盤: 陸上部を退部し、孤独なトレーニングを開始。タイムではなく、一歩の接地時間や重心の移動に意識を集中させることで、身体との対話が始まる。'
- '終盤: 再起をかけた地方大会。かつての輝かしい自分ではなく、今の、不完全で、しかし確かな感触を持つ自分のための全力疾走。'
- '結末: 順位ではなく、自分の肉体が刻んだ新しいリズムの発見。走り終えた後の、静かな呼吸。'
style_notes: 「私」の独白を中心とした内省的な筆致。心拍数、接地時間、ストライドの長さ、秒単位のタイムといった数字を、感情の揺らぎや肉体の痛みを表現するためのメタファーとして効果的に用いる。装飾的な表現よりも、筋肉の緊張や呼吸の音といった生理的な感覚を重視した硬質な文体。
