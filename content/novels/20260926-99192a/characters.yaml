- name: ソラ
  role: 主人公
  age: 26
  gender: 男性
  appearance: 柔らかな茶髪に、使い込まれたエプロン姿。穏やかで温かみのある目元をしている。
  personality: 温厚でマイペース。手仕事や料理を愛する。一人称は「僕」。
  speech_style: 丁寧で落ち着いた、聞き手に安心感を与える話し方。
  background: 浮遊島の孤児院で育ち、料理の温かさで人を救えることを信じて、移動式カフェ船「陽だまり号」を営んでいる。
  motivation: 訪れる人々に美味しい食事と休息を提供し、穏やかな旅を続けること。
  relationships:
  - name: 銀色さん
    relation: 居候であり、かけがえのない相棒
  arc: 銀色さんとの出会いを通じて、ただ旅をするだけでなく、「大切な存在の意志を守る」という強い覚悟を持つようになる。
- name: 銀色さん
  role: 相棒
  age: 0
  gender: 無性別
  appearance: 錆びついた小さな球体型のロボット。瞳の部分が淡い銀色の光を放つ。
  personality: 当初は極めて論理的で無機質。物語が進むにつれ、好奇心旺盛で感情豊かな性格へ変化する。一人称は「個体」から「私」へ。
  speech_style: 最初は「〜と判断します」といった機械的な敬語。次第に人間味のある柔らかな口調になる。
  background: かつては高度な戦略計算を行う軍事用AIだったが、紛失し、雲海を漂っていた。
  motivation: 自分が何者であるか、そして自分が何のために存在するのかという「目的」を見つけること。
  relationships:
  - name: ソラ
    relation: 保護者であり、初めての友人
  arc: 効率と計算による「正解」を求める存在から、誰かのために不合理で優しい選択をする「心」を持つ存在へと成長する。
- name: ヴァイン
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない軍服に身を包んだ、鋭い眼光を持つ男。冷徹な雰囲気を纏っている。
  personality: 徹底した合理主義者。感情を「ノイズ」として切り捨てる。一人称は「私」。
  speech_style: 無駄がなく、冷ややかで威圧的な命令口調。
  background: 銀色さんを管理する中央軍事組織の回収部隊リーダー。失われた軍事資産の回収を至上命題としている。
  motivation: 銀色さんを回収し、再び軍事的な演算リソースとして機能させること。
  relationships:
  - name: 銀色さん
    relation: 回収すべき重要資産
  arc: 銀色さんが示した「不合理な意志」に対し、自身の価値観が揺らぐほどの困惑と、拭いきれない矛盾を突きつけられる。
- name: ルルア
  role: 脇役
  age: 19
  gender: 女性
  appearance: ゴーグルを頭に乗せ、油汚れのついた作業着を着た快活な少女。
  personality: 明るく世話焼きで、機械に対しては非常に深い愛情を持っている。一人称は「あたし」。
  speech_style: さっぱりとした、元気でハキハキした口調。
  background: 雲海を渡る小型飛行艇の整備士。陽だまり号の定期的なメンテナンスを担当している。
  motivation: 雲海のあらゆる機械の声を聴き、それらが元気に動くことを見守ること。
  relationships:
  - name: ソラ
    relation: 旅の仲間・友人
  - name: 銀色さん
    relation: 興味深い修理対象、および友人
  arc: 銀色さんが「機械」から「心を持つ存在」へと変化していく過程を、技術者として、そして友人として見守り、支える。
