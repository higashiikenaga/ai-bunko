- name: カイ
  role: 主人公
  age: 15
  gender: 男性
  appearance: 日に焼けた肌と跳ねた茶髪。額に使い古した飛行ゴーグルを掛け、油汚れのついた茶色のフライトジャケットを着用している。
  personality: 楽観的で好奇心旺盛。危うい状況でも笑っていられる強さを持つ。一人称は「俺」。
  speech_style: 快活で口調は粗いが、純粋で真っ直ぐな話し方。
  background: 空賊ギルドの末端で廃品回収を請け負う少年。親に捨てられた過去を持つが、空を飛ぶことだけが唯一の誇り。
  motivation: 懐中時計が導く「聖域」に辿り着き、誰もが自由に空を飛べる世界を見たい。
  relationships:
  - name: リン
    relation: 幼馴染であり、最高の相棒
  - name: ヴァレリウス将軍
    relation: 宿敵
  arc: ただの「拾い屋」だった少年が、世界を導く「鍵」を担う責任感に目覚め、真の空の旅人へと成長する。
- name: リン
  role: 相棒/メカニック
  age: 16
  gender: 女性
  appearance: 青い髪を高い位置でポニーテールに結んでいる。オーバーサイズの工具ベルトを腰に巻き、常に小さなレンチを携帯している。
  personality: 冷静沈着で現実主義。カイの無鉄砲さに呆れつつも、誰よりも彼を信頼している。一人称は「私」。
  speech_style: 論理的で淡々としているが、感情が高ぶると口調が早くなる。
  background: 元帝国技術アカデミーの特待生だったが、ある禁忌の研究に触れたことで追放され、カイの住む辺境の街に流れ着いた。
  motivation: 失われた古代の機械技術を解明し、完璧な飛行エンジンを完成させること。
  relationships:
  - name: カイ
    relation: 危なっかしいが放っておけない相棒
  - name: ヴァレリウス将軍
    relation: かつての師であり、憎むべき権力の象徴
  arc: 計算と理論のみを信じていたが、カイと共に旅をすることで、数値化できない「勇気」や「絆」という不確定要素の価値を認めるようになる。
- name: ヴァレリウス将軍
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない軍服に身を包み、左目に精巧な機械義眼を装着している。冷徹な眼差しと、軍人らしい厳格な佇まい。
  personality: 完璧主義で傲慢。秩序こそが正義であると信じ、効率的に世界を支配しようとする。一人称は「私」。
  speech_style: 威圧的で丁寧な敬語を使うが、言葉の端々に相手を見下す傾向がある。
  background: 帝国の空軍最高司令官。黄金の渡り鳥を軍事利用することで、全大陸を統制下に置く「絶対空域」の構築を企んでいる。
  motivation: 懐中時計を奪い、渡り鳥を制御して帝国の永遠の繁栄を確立すること。
  relationships:
  - name: カイ
    relation: 計画を乱す不快なノイズ
  - name: リン
    relation: 才能を認めていたが、裏切った元教え子
  arc: 絶対的な力による支配を追求するが、最後には自然と調和する機械生命体の意志に敗北し、己の傲慢さを思い知らされる。
- name: ゼノ
  role: 脇役/メンター
  age: 52
  gender: 男性
  appearance: 豊かな髭を蓄え、古びた船長帽を被っている。右手の指が一本欠けており、常に安い葉巻をくゆらせている。
  personality: 豪放磊落で食えない性格。金にうるさいが、義理人情に厚い一面を持つ。一人称は「わし」。
  speech_style: ガラガラとした低い声で、皮肉を交えながらも温かみのある話し方。
  background: かつて「空の覇者」と呼ばれた伝説の空賊。現在は隠居して小規模な回収ギルドを営んでいる。
  motivation: 若者たちが自分以上の地平線を見つけることを密かに願っている。
  relationships:
  - name: カイ
    relation: 生意気だが期待している後輩
  - name: リン
    relation: 腕の良いメカニックとして高く評価している
  arc: 過去の栄光にすがっていたが、カイたちの旅を支援することで、自分自身の人生の締めくくりとしての「最後の冒険」に情熱を取り戻す。
