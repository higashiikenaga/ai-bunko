title: クロノス・ウィング：鉄錆の空と黄金の渡り鳥
genre: スチームパンク冒険
tone: 疾走感溢れる、熱量のある冒険譚
pov: 三人称
tense: 過去形
setting: 巨大な浮遊大陸群が点在する空の世界。蒸気機関と機械翼が文明を支える時代。
premise: 空賊の少年カイは、廃品回収中に「時を刻まない壊れた懐中時計」を拾う。それは、季節ごとに大陸間を移動する伝説の機械生命体『黄金の渡り鳥』を導く鍵だった。時計が動き出した瞬間、帝国の追っ手が空を覆う。カイは相棒のメカニック少女と共に、空の果てにあるとされる失われた聖域を目指して、蒸気翼を全開にする。
themes:
- 失われた時間の奪還
- 自由への渇望
rules:
- 蒸気機関の出力は、浮遊石の熱量に依存する
- 機械生命体は、特定の周波数の音（時計の音など）に反応する
- 帝国の支配は、空の資源である浮遊石の独占によって成立している
plot_outline:
- '序盤: 廃品回収中に壊れた懐中時計を見つけたカイ。それが起動した瞬間、帝国のスカイ・ガーディアンに襲撃される。カイは相棒のリンと共に、旧式飛行艇で強引に離陸する。'
- '中盤: 懐中時計が示す座標へ向かう旅。途中で渡り鳥の群れを目撃し、彼らが機械生命体であることを知る。帝国の執拗な追跡と、空賊ギルドの罠がカイたちを追い詰める。'
- '終盤: 懐中時計が導いた先は、雲の上の巨大な機械の卵。そこには渡り鳥たちの母体があった。帝国軍の総攻撃を退けるため、カイは懐中時計を起動装置として使い、渡り鳥の群れと共に空を駆ける。'
- '結末: 聖域を守り抜いたカイたちは、新たな空の地図を手に、まだ見ぬ地平線へと蒸気翼を飛ばす。懐中時計は、今も規則正しく時を刻んでいる。'
style_notes: テンポを重視。短い文章を畳み掛け、アクションシーンでは視覚的な動き（「翼を叩く」「蒸気を噴き出す」等）で描写する。会話劇を多用し、キャラクターの掛け合いで状況を説明する。一話ごとに、次なる危機や謎を感じさせる引き（クリフハンガー）を配置すること。
