- name: 久瀬 湊 (くぜ みなと)
  role: 主人公
  age: 32
  gender: 男性
  appearance: 常に疲れ切った表情のスーツ姿。眼鏡の奥の瞳に光がなく、どこか実体のない印象を与える男。
  personality: 無気力で感情が希薄。効率を最優先するが、心の奥底に拭えない喪失感を抱えている。一人称は『僕』。
  speech_style: 淡々とした、抑揚の少ない丁寧な敬語。
  background: 凪ヶ浦の金融機関に勤めるサラリーマン。過重労働とストレスから、防衛本能的に感情を摩耗させてきた。
  motivation: 自分がなぜ「既視感」に苛まれるのか、その正体を知り、空虚な日常を埋めること。
  relationships:
  - name: 志乃
    relation: 逃走劇を通じて、共通の欠落を持つ同志となる
  - name: 櫂
    relation: 最初は不信感を抱くが、やがて運命を共にする協力者
  arc: 無味乾燥な日常を生きる「空っぽの器」から、他者の痛みを受け入れ、不完全な自分を肯定する人間へと成長する。
- name: 佐倉 志乃 (さくら しの)
  role: 主人公
  age: 20
  gender: 女性
  appearance: 活発だがどこか影のある女子大生。安価な中古の服を着ているが、身のこなしは軽い。
  personality: 現実主義で逞しいが、実は非常に繊細。学費のために大切な思い出を売るなど、苦労を厭わない。一人称は『私』。
  speech_style: はきはきとした、少しぶっきらぼうな口調。
  background: 海沿いの大学に通う学生。生活のために記憶市場へ頻繁に通い、自らの「幸福な記憶」を切り売りしてきた。
  motivation: 売ってしまった記憶を取り戻すこと。そして、自分が何者であるかを確認すること。
  relationships:
  - name: 久瀬 湊
    relation: 守るべき対象から、対等なパートナーへ
  - name: 櫂
    relation: 記憶市場の裏事情に通じている彼を頼りにする
  arc: 「記憶＝自分」という依存から脱却し、失った過去よりも、今ある痛みと共に生きる決意を固める。
- name: 櫂 煉 (かい れん)
  role: 主人公
  age: 45
  gender: 男性
  appearance: 使い古されたコートを羽織り、常に煙草の煙を燻らせている。顔に古い傷跡がある。
  personality: 皮肉屋で冷笑的だが、観察眼に優れる。裏社会のルールに精通している。一人称は『俺』。
  speech_style: 低く、含みを持たせた、投げやりな話し方。
  background: 記憶市場の管理運営に関わる、裏の仲介人。街の真実をある程度知っているが、関わらないようにしている。
  motivation: 平穏を望んでいたが、運命に巻き込まれ、かつて自分が守れなかった「ある約束」を果たすこと。
  relationships:
  - name: 久瀬 湊
    relation: 導き手であり、共に真実に立ち向かう戦友
  - name: 佐倉 志乃
    relation: 娘のように、あるいはかつての誰かの面影として目をかける
  arc: 傍観者として街を見守る立場から、自らも運命の当事者として、過去の贖罪に向き合う。
