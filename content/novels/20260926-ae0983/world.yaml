title: 潮騒のアーカイブと、空飛ぶ廃船の行方
genre: 群像劇
tone: 静謐ながら温度差のある、現代的で幻想的な空気感
pov: 三人称（視点人物ごとに文体を変化させる）
tense: 過去形
setting: 海沿いの近代都市『凪ヶ浦（なぎがうら）』。路地裏に記憶を売買する秘密市場が存在する世界
premise: 記憶を物質として売買できる街で、ある『失われた記憶』の断片をそれぞれに持つ見知らぬ人々が交錯する。空に浮かぶ伝説の廃船が、彼らの欠落した心を繋ぐ鍵となる。誰のものでもない記憶を繋ぎ合わせたとき、街に隠された残酷で美しい真実が明らかになる。
themes:
- 喪失と再生
- アイデンティティの所在
rules:
- 記憶は結晶化して抽出可能であり、売却すると本人の記憶から完全に消去される
- 購入した記憶は『他者の経験』として追体験できるが、自身の人生として定着させることはできない
- 特定の記憶の断片が揃い、共鳴したときのみ、次元の狭間に漂う『空飛ぶ船』が地上に降臨する
plot_outline:
- 序盤：感情を失ったサラリーマン、学費のために記憶を売った女子学生、記憶市場の皮肉屋な管理人の三人が、それぞれ異なる『誰かの記憶の欠片』を所有し、奇妙な既視感に苛まれる
- 中盤：記憶の断片を強制的に回収しようとする謎の組織が現れ、逃走の中で三人が出会う。彼らは自分たちが持つ記憶が、かつて街から消えた一人の女性の人生を分割したものだと気づく
- 終盤：全ての断片が集結し、街の上空に巨大な空飛ぶ廃船が姿を現す。船は記憶の持ち主が遺した『忘れられた約束』を果たすための唯一の場所であり、彼らを過去の真実へと誘う
- 結末：記憶を元の持ち主に返すのではなく、他者の痛みとして受け入れた彼らは、欠落を抱えたまま生きていく強さを得て、それぞれの日常へと帰還する
style_notes: 視点人物に合わせて文体を使い分ける。冷徹な大人は硬い漢語を多用した淡々とした記述に、不安げな若者は比喩表現を多用した情緒的な記述にする。物語の終盤に向けて、個別の文体が次第に調和し、一つの大きな流れに合流する構成とする
