- name: カイル・ヴァン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 煤けた革鎧と傷跡の絶えない顔。重厚な鉄の大剣を背負い、常に疲弊した瞳をしている。
  personality: 現実主義でぶっきらぼう。自己犠牲的で、自分の価値を「戦う道具」としてしか捉えていない。一人称は「俺」。
  speech_style: 短く、必要最低限のことしか口にしない。ルナに対してだけは僅かに語気が和らぐ。
  background: かつては帝国の騎士団に所属していたが、世界の崩壊と共に仲間を失い、記憶を失う病から逃れるために傭兵として生きている。
  motivation: ルナを「最終列車」に送り届け、世界の再起動を成し遂げること。
  relationships:
  - name: ルナ
    relation: 守るべき対象であり、唯一の希望
  - name: ヴァレリウス
    relation: かつての師であり、乗り越えるべき壁
  arc: 目的のために自分を削り続ける「道具」から、未来のために自分を捧げる「人間」へと精神的に昇華する。
- name: ルナ
  role: 相棒
  age: 13
  gender: 女性
  appearance: 透き通るような銀髪と、星屑を閉じ込めたような輝く瞳を持つ。質素だが清潔な白いドレスを着ている。
  personality: 穏やかで聡明。世界の終焉を前にしても、失われた記憶を慈しむ強さを持つ。一人称は「私」。
  speech_style: 丁寧で、どこか浮世離れした静かな話し方。
  background: 世界から失われゆく「意味」や「記憶」を物理的に保持できる、唯一の特異体質を持つ少女。
  motivation: 人々が再び思考を取り戻し、太陽の光が差す世界を再生させること。
  relationships:
  - name: カイル・ヴァン
    relation: 命を預ける信頼する守護者
  arc: 守られるだけの「鍵」としての存在から、世界の記憶を背負って未来へ進む「導き手」へと成長する。
- name: ヴァレリウス
  role: 敵役
  age: 150
  gender: 男性
  appearance: 汚れ一つない白銀の甲冑に身を包んだ、美しくも空虚な貌をした老人。瞳には感情が一切宿っていない。
  personality: 冷酷かつ合理的。変化を「崩壊」と断じ、永遠の停滞の中にこそ真の平和があると信じている。一人称は「私」。
  speech_style: 威厳に満ち、教え子を諭すような慈愛と残酷さが同居した口調。
  background: かつてカイルの師であり、世界を救うために自らの記憶と人間性を全て捧げ、不死の存在となった元英雄。
  motivation: 最終列車の発車を阻止し、世界が「静止した完成形」として永遠に留まるようにすること。
  relationships:
  - name: カイル・ヴァン
    relation: かつての弟子であり、自身の思想を否定する者
  arc: 世界の崩壊を止めるために「止まった世界」を選んだ結果、自身が世界の終わりそのものとなっていく。
