title: 骸鉄の軌跡：終焉を運ぶ列車
genre: 異世界ファンタジー
tone: 硬派、無骨、ストイック
pov: 一人称（俺）
tense: 現在形・過去形混在
setting: 錆びついた機械文明の残骸が散在する、黄昏の辺境世界。空には太陽がなく、巨大な歯車状の天体が鈍い光を放っている。
premise: 世界から「意味」が消え、人々が思考を失う病に侵された時代。俺は記憶を保持できる唯一の少女を連れ、世界の再起動を叶える「最終列車」を目指す。道中、忘れ去られた知識が眠る「地下図書館」を巡り、正気を失ったかつての戦友たちを斬り捨てて進む。これは、絶望の果てに希望を叩き込むための、血と鉄の旅路だ。
themes:
- 喪失と再生
- 不器用な信頼
rules:
- 魔法は『記憶の消費』によってのみ発動する。強力な術を使うほど、自身の過去を忘れる。
- 最終列車は特定の周期でしか現れず、乗車には地下図書館に隠された『黄金の切符』が必要である。
- この世界の住人は、ある日突然『意味』を失い、ただ呼吸するだけの肉塊（ハスク）へと成り果てる。
plot_outline:
- '序盤: 辺境の街で、記憶を操る能力を持つ少女・ルナと出会う。彼女を狙う帝国軍の残党を撃退し、彼女を目的地まで送り届ける契約を結ぶ。'
- '中盤: 砂漠に埋もれた地下図書館へ潜入。世界が滅びた真実と、最終列車の発着駅を突き止める。ルナとの絆が深まる一方、俺は彼女を守るための魔法を使い、次第に自分の名前すら忘れ始める。'
- '終盤: 最終列車の駅へと到達するが、そこには記憶をすべて捧げて不死となったかつての師が待ち構えていた。絶望的な戦いの中、俺はルナに未来を託し、最後の力を振り絞って師を討つ。'
- '結末: 列車が発車する。俺は切符をルナに譲り、一人駅に残り、押し寄せるハスクの群れを相手に、最期の戦いに身を投じる。'
style_notes: 一文を極限まで短く切り、リズムを作る。擬音（ドカン、ガシャン等）は一切禁止。代わりに「砕く」「裂く」「穿つ」などの動詞で衝撃を表現する。一人称は「俺」。感情を言葉にせず、行動と視線で示す。戦闘開始直前には、風の音や心拍などの静寂描写を挿入し、緩急をつけること。
