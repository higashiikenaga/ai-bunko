genre: 特別企画
tone: 気品と陰りのある王宮ロマンス。静かな心理描写と、政治・魔導科学の緊張感
pov: 三人称。主にアートラーの視点、ときにルナ・セレスティアの視点に寄る
tense: 過去形
setting: 魔法と科学が共存する架空世界。大陸西方のハルバード王国は古い魔法の伝統を持つが、魔法と科学の融合(魔導科学)は発展途上。 海の向こうの島国タイン共和国は商業・航海・医療・工学が進み、分野によっては王国より先を行く。
  王国には、滅びた古代文明が遺した魔導遺構が点在している。
rules:
- 魔法は「魔素」を体内で編む技術。貴族ほど魔素が強い傾向がある。科学と組み合わせた魔導機関は研究途上で、暴走の危険がある
- 王都地下には古代文明の遺構「白の天蓋(しろのてんがい)」が眠る。起動すると大陸中の人々を魔素ごと眠りに沈め、世界を「白紙に戻す」と伝わる
- ルナの人類滅亡計画は「白の天蓋」を起動する計画(黄昏計画)。協力者は宮廷魔導学者ヴィクトル・ケイン
- ルナは結婚前、自分の手で計画の記憶を封じる魔法をかけた(罪の意識なくアートラーを愛するため)。計画自体は時限式で進み続けていた
- 処刑の瞬間、「白の天蓋」の残滓がルナに呪い「贖いの眠り」をかける。彼女は石の眠りの中で、自分が奪おうとした人々の生と痛みを長い年月をかけて見続け、三年後に目覚める
- 蘇ったルナは法の上ではすでに死者。名を伏せ、ファーバー家の縁者「ルーナ」として生きる
- 王国では王族・貴族の結婚は政治であり、家同士の同盟と外交を意味する
- タイン共和国は身分より契約と実績を重んじる。女性の商会長や医師も多い
premise: 処刑から三年。石の眠りから目覚めたルナは、かつての彼女ではなかった。自分が奪おうとした人々の生と痛みを見続けた彼女の前に、 新しい人生を歩み始めたアートラーと、彼を守ろうとするセレスティアが現れる。悪人が改心すれば、すべて許されるのか。
themes:
- 愛することと、相手の人生を所有することの違い
- 罪と贖罪。過去の罪を背負った人間に、やり直す権利はあるのか
- 正しさと執着
- 家族としての絆
- 魔法と科学、国と国の交流
style_notes: 抑制の効いた気品ある文体。感情は仕草・沈黙・視線で語らせる。王宮の儀礼や外交の言葉づかいに重みを持たせる。
title: 世界滅亡と魔法と科学的な恋 II ―Rebirth―
plot_outline:
- '第1話: 処刑から三年。ファーバー家の古い霊廟で、ルナは石の眠りから目覚める。呪い「贖いの眠り」の中で見続けた、自分が奪おうとした人々の生活と痛みの記憶が、胸に残っている。鏡の中の自分を、彼女はまだ許せない。'
- '第2話: 名を伏せ「ルーナ」としてファーバー家の縁者を装い、王都の外れで暮らし始める。市場で見かける人々一人ひとりの顔が、眠りの中で見た顔と重なる。王太子アートラーとセレスティアの婚約の噂を耳にする。'
- '第3話: 王立施療院で、ルナは身分を隠して魔素治療の手伝いをする。そこへ視察に来たアートラーと再会する。アートラーは死んだはずの妻を前に言葉を失い、ルナは「人違いです」と微笑んで去ろうとする。'
- '第4話: アートラーはルナを追い、夜の川辺で向き合う。ルナは生きている理由を語り、かつてのように彼を求めない。「あなたの人生に、もう入り込みません」。その言葉が、かえってアートラーの心を揺らす。'
- '第5話: セレスティアがルナの正体に気づく。二人だけの対面。セレスティアは「あなたは過去の罪を持つ人です。殿下に近づかないで」と告げる。ルナは反発しながらも、その言葉の正しさを否定できない。'
- '第6話: アートラーはセレスティアとの婚約を守りながら、ルナへの感情を消せない。王宮の書庫で、かつてルナが好んだ魔導書を手に取ってしまう自分に気づく。セレスティアはそれを見て、何も言わない。'
- '第7話: 王国で魔導機関の事故が起き、施療院に負傷者が運び込まれる。ルナは黄昏計画で得た知識を、初めて人を救うために使う。助けた少女の母親が、ルナの素性を知らずに礼を言う。ルナは「感謝される資格はない」と一人泣く。'
- '第8話: ルナの生存が貴族たちに露見し、「処刑された大罪人を裁き直せ」という声が上がる。セレスティアは正しい手続きとして、ルナを王都から追放する案を議会に出す。正しさと私情の境目を、彼女自身も見失い始める。'
- '第9話: 議会の前夜、アートラーはルナのもとへ行く。二人は昔のように手を取りかけるが、ルナは自分から手を離す。「わたくしが欲しかったのは、あなたの人生ではなく、あなたでした。だから、あなたの人生は返します」。'
- '第10話: 【第2部 結末】ルナは議会の裁きを待たず、自らの意思で王国を去る。港の桟橋でアートラーに見送られ、タイン共和国行きの船に乗る。それは敗北ではなく、彼女が初めて選んだ「相手を自由にする愛」。アートラーはセレスティアの待つ王宮へ戻る。'
