- name: カイ・ヴェイン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で青白い肌。右目に安価な中古の解析用サイバネティック・アイを埋め込んでいる。油汚れのひどい灰色のテックコートを愛用。
  personality: 冷笑的で個人主義だが、知的好奇心に抗えない。一人称は「オレ」。
  speech_style: ぶっきらぼうで、下層街の粗野なスラングを混ぜて話す。
  background: 元は上層の技術学校の落ちこぼれ。現在は下層で死者の記憶チップを回収し、転売して食いつなぐメモリ・スカベンジャー。
  motivation: 最初は金目的だったが、次第に「本物の緑」という未知への渇望に突き動かされる。
  relationships:
  - name: ライラ・ノックス
    relation: ビジネスパートナー兼共犯者
  - name: サイラス
    relation: 執拗な追跡者
  arc: 生存のためだけに生きていた虚無的な青年が、地球の最後の希望を守るために自己犠牲を受け入れる守護者へと成長する。
- name: ライラ・ノックス
  role: 相棒
  age: 28
  gender: 女性
  appearance: ネオンピンクに染めたショートヘア。首筋に多数のデータポートが埋め込まれており、常にホログラムディスプレイを周囲に展開している。
  personality: 計算高く強欲に見えるが、根は情に厚い。一人称は「私」。
  speech_style: 知的で皮肉屋。相手を食ったような話し方をする。
  background: 元・企業所属のデータアナリスト。機密情報を横流しして追放され、現在は闇のメモリ・ディーラーとして下層で君臨している。
  motivation: 企業の支配体制を内部から崩壊させるための決定的な「切り札」を探している。
  relationships:
  - name: カイ・ヴェイン
    relation: 利用価値のある相棒（次第に信頼を寄せる）
  arc: 利益至上主義を捨て、データよりも確かな「現実の価値」を信じるようになる。
- name: サイラス
  role: 敵役
  age: 35
  gender: 男性
  appearance: 汚れひとつない純白の企業制服。感情を排した無機質な仮面のような強化外骨格を顔に装着している。
  personality: 冷酷非情な完璧主義者。効率と規律を至上とする。一人称は「私」。
  speech_style: 極めて丁寧だが、温度感のない事務的な口調。
  background: 企業の掃除屋（クリーナー）のリーダー。脳の感情領域を一部切除し、最適化された追跡・抹殺マシンへと改造された元精鋭兵。
  motivation: 「オアシス」の座標データを回収し、不確定要素（カイたち）を完全に排除すること。
  relationships:
  - name: カイ・ヴェイン
    relation: 抹殺対象の獲物
  arc: 絶対的な正義（企業の論理）を信じていたが、カイが辿り着いた光景を目の当たりにし、自身の人間性にわずかな揺らぎが生じる。
- name: エレーナ・ソーン
  role: キーパーソン（記憶の主）
  age: 52
  gender: 女性
  appearance: 記憶の中で登場。疲れ切っているが慈愛に満ちた瞳を持つ。土に汚れた白い白衣を着ている。
  personality: 献身的で強い意志を持つ。一人称は「私」。
  speech_style: 穏やかで、語りかけるような優しい口調。
  background: 企業の元首席生物学者。極秘裏にオアシスの存在を発見し、それを企業の管理から守るために自身の記憶に座標を暗号化して封印した。
  motivation: 人類が自然と共に生きる可能性を、次世代に託すこと。
  relationships:
  - name: カイ・ヴェイン
    relation: 記憶を通じて導く先導者
  arc: 死してなお、記憶という形でカイに影響を与え、彼を真の人間へと導く。
