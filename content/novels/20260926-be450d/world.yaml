title: デッド・データ・オアシス
genre: ディストピア
tone: ハードボイルド、冷徹、ネオン色の疾走感
pov: 一人称（オレ）
tense: 現在形混じりの過去形
setting: 階層都市『鉄雲（アイアン・クラウド）』。上層は企業が支配する永遠の白夜、下層は酸性雨とネオンが支配するスラム街。
premise: 記憶の売買が日常となった世界で、記憶の屑拾い（メモリ・スカベンジャー）を営むオレは、ある死体から「本物の緑」が眠る砂漠のオアシスの記憶を拾う。それは企業が隠蔽し続けた地球最後の聖域への座標だった。追手である企業の掃除屋（クリーナー）から逃れながら、オレは脳を焼き切るリスクを背負って禁忌のデータへダイブする。
themes:
- 人間性の定義
- 支配への抵抗
rules:
- 全市民は脳内に『ニューロ・リンク』を埋め込まれ、行動と記憶を企業に管理されている
- リンクを拒絶した者は『ゴースト』と呼ばれ、法的権利を剥奪される
- 記憶データは『シャード』として物理的に抽出・移植可能だが、不適合な記憶の移植は精神崩壊（ブレイン・クラッシュ）を招く
plot_outline:
- '序盤: 下層のゴミ溜めで、オレは正体不明の高純度シャードを回収。そこに記録されていたのは、都市の外にあるはずのない「砂漠のオアシス」の光景だった。'
- '中盤: 記憶の解析を試みるが、強力な暗号化（クリプト・ウォール）に阻まれる。闇のディーラーと協力し、脳に過負荷をかける『オーバードライブ・シンナプス』を敢行して座標を特定。同時に企業の追手による激しい掃討作戦に巻き込まれる。'
- '終盤: 運命の月食の日。軌道上の遮光シールドが一時的にバグを起こし、都市のセキュリティに穴が開く。オレはその隙に、物理的な壁を突破して都市の外へと脱出を図る。'
- '結末: 辿り着いたオアシスは、想像以上に脆く美しい場所だった。オレはそこを企業の管理下に置かせないため、座標データを自身の脳と共に永久消去（ワイプ）し、孤独な守護者となることを選ぶ。'
style_notes: 短文を畳み掛ける。体言止めを多用し、スピード感を演出。ハッキング描写は「パケットの奔流」「論理爆弾の起爆」など、具体的かつ感覚的な造語で表現。企業側の清潔で冷酷な白と、路地裏の汚れたネオンカラーの対比を強調する。
