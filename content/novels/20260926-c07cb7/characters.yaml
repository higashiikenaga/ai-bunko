- name: カイ
  role: 主人公
  age: 17
  gender: 男性
  appearance: 砂漠の色に馴染む灰色の外套を纏い、夜空のような深い紺色の瞳を持つ、痩身で静かな佇まいの少年。
  personality: 内向的で孤独を好むが、心の中には強い情熱と深い慈愛を秘めている。一人称は「僕」。
  speech_style: 控えめで静か。相手を慮るため、言葉を慎重に選んで話す傾向がある。
  background: 家族を亡くし、記憶の断片だけを頼りに砂漠で一人、星の導きを信じて生きてきた孤独な漂流者。
  motivation: 消えゆくノアを救い、彼女を本来あるべき夜空へと帰すこと。
  relationships:
  - name: ノア
    relation: 運命的な絆で結ばれたパートナー
  - name: アルヴィス
    relation: 旅の案内人であり、知識の提供者
  arc: 孤独に絶望していたが、ノアとの旅を通じて「誰かのために大切なものを捧げる」という無償の愛を知り、精神的に強く成長する。
- name: ノア
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 銀河を溶かし込んだような淡い青色の長い髪と、星の瞬きを宿した金色の瞳を持つ少女。身体がわずかに発光している。
  personality: 天真爛漫で好奇心旺盛。人間界の常識に疎く、純粋すぎる面がある。一人称は「私」。
  speech_style: 詩的で幻想的。時折、星々の囁きのような独り言を漏らす。
  background: 空から零れ落ちた星座の欠片であり、不思議な古書のページの中に封じ込められていた存在。
  motivation: 自分の光が完全に消える前に、元の星座へと戻り、夜空の一部になること。
  relationships:
  - name: カイ
    relation: 自分を救い出し、心を通わせた唯一の人間
  - name: アルヴィス
    relation: 自分を管理していた司書
  arc: 消滅という運命に怯えていたが、カイとの時間を通じて「形を変えても記憶として残ること」の価値に気づき、迷いなく昇華を受け入れる。
- name: アルヴィス
  role: 脇役/導き手
  age: 45
  gender: 男性
  appearance: 星座図が描かれた巨大なローブを纏い、片眼鏡をかけた長身の男性。常に分厚い古書を抱えている。
  personality: 皮肉屋でミステリアスだが、根は情に厚く、星々の運命を誰よりも愛している。一人称は「私」。
  speech_style: 慇懃無礼。比喩表現を多用し、あえて核心をぼかして語る傾向がある。
  background: 「星降る古本屋」の店主であり、宇宙のあらゆる記憶を司る司書。
  motivation: 星座の欠片であるノアを適切に夜空へ戻し、世界の星の均衡を保つこと。
  relationships:
  - name: カイ
    relation: 旅のガイド役であり、試練を与える観察者
  - name: ノア
    relation: かつて保護していた希少な蔵書の一部
  arc: 運命にのみ従う冷徹な司書として振る舞っていたが、カイの献身的な姿に心を打たれ、彼らの旅を密かに後押しする協力者へと変化する。
- name: エレボス
  role: 敵役
  age: 0
  gender: 不明
  appearance: 形を持たない漆黒の霧のような存在。周囲の光を吸収し、時折、絶望した者の顔が浮かび上がる。
  personality: 虚無的。あらゆる光と記憶を飲み込み、完全な静寂（闇）をもたらそうとする。一人称は「我」。
  speech_style: 重厚で圧迫感のある響き。絶望を突きつけるような断定的な口調。
  background: 宇宙から零れ落ち、誰にも思い出されなくなった「忘れ去られた記憶」が集積して生まれた漆黒の嵐の化身。
  motivation: 全ての星の光を消し去り、世界を永遠の虚無に帰すこと。
  relationships:
  - name: ノア
    relation: 飲み込もうとしている最大の光の標的
  - name: カイ
    relation: 光を繋ぎ止めようとする不快な障害
  arc: 圧倒的な絶望の象徴として君臨するが、カイが捧げた「最も大切な記憶」という純粋な光の力によって、その闇を切り裂かれ消滅する。
