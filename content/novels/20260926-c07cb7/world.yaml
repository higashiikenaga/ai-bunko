title: 銀河の砂丘に眠る、星屑の古書架
genre: 青春恋愛
tone: 幻想的で静謐、色彩豊かな叙情性
pov: 三人称
tense: 過去形
setting: 永遠の夜が続き、光る星砂が流れる果てしない砂漠の世界
premise: 星の砂が静かに流れる、永遠の夜に包まれた砂漠の世界。孤独な少年カイは、星座の導きによって、時折姿を現す不思議な古本屋へと辿り着く。そこで彼は、本の中から溢れ出した光の粒子の中に、一人の少女ノアを見出す。彼女は空から零れ落ちた星座の欠片であり、その光が尽きる前に、カイは彼女を夜空へと帰すための旅へと身を投じることになる。
themes:
- 失われゆく美への愛惜
- 記憶と再生の物語
rules:
- 魔法は特定の星座の名前を詠唱（アストラ・カントス）することで発動する
- 古本屋は特定の星の配置が重なる夜にのみ、砂漠のどこかに姿を現す
- 砂漠のオアシスは、星の涙が結晶化した水で満たされた聖域であり、魔法の源となる
plot_outline:
- '序盤: 砂漠を彷徨う少年カイが、北極星の導きにより「星降る古本屋」を発見し、そこで本の世界から溢れ出した少女ノアと運命的な出会いを果たす。'
- '中盤: ノアが消えゆく星座の欠片であることを知り、二人は彼女の光を繋ぎ止めるために、砂漠に点在する「星のオアシス」を巡る旅に出る。'
- '終盤: 旅の果て、二人は夜空を覆い尽くそうとする漆黒の嵐に遭遇する。カイは、自らの最も大切な記憶を詠唱の代償として捧げる決意をし、ノアを星座へと昇華させる魔法を放つ。'
- '結末: ノアは美しい星座となって夜空へ帰り、カイは再び孤独な砂漠へ戻る。しかし、彼が手にした古本には、彼女と共に過ごした時間が銀河の輝きとして永遠に刻まれていた。'
style_notes: 星の瞬き、砂の煌めき、夜空の色彩を、宝石や光の粒子を用いて極めて美しく描写すること。魔法の詠唱には、星の名前を織り交ぜた詩的な言葉を用い、全体としておとぎ話を読み聞かせるような、ゆったりとした叙情的なリズムを保つこと。
