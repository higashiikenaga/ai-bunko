- name: エリス・ヴァン・クロムウェル
  role: 主人公
  age: 26
  gender: 女性
  appearance: 短く切り揃えられた銀髪と、鋭いがどこか憂いを含んだ碧眼。帝国軍の標準的な制服を隙なく着こなしている。
  personality: 冷静沈着で理性的。規律を重んじるが、根底には人道主義的な優しさを持つ。一人称は「私」。
  speech_style: 簡潔で軍人らしい丁寧な口調。感情が高ぶると、論理的な説明を優先しようとする癖がある。
  background: 帝国軍第7艦隊の若き偵察艦長。名門貴族の家系に生まれるが、政治的な駆け引きを嫌い、現場での任務を志した。
  motivation: 消えた入植村の真実を突き止め、無実の犠牲者を出さずに紛争を収束させること。
  relationships:
  - name: カイル・レノックス
    relation: 宿敵であり、理解者でもある連合軍の指揮官
  - name: ゼノス・ヴォルガ
    relation: 上官であり、自身の信念と対立する強硬派将軍
  arc: 秩序を守るための兵士から、真実を守るために既存の体制に抗うリーダーへと成長する。
- name: カイル・レノックス
  role: ライバル/相棒的側面
  age: 29
  gender: 男性
  appearance: 無精髭が少し生えた、精悍な顔立ち。連合軍の使い古された航海服を纏い、常に使い込まれたデータ端末を手にしている。
  personality: 自由奔放で楽観主義を装っているが、内面は非常に現実的で計算高い。一人称は「俺」。
  speech_style: 軽妙で少し皮肉めいた話し方。相手の核心を突くような問いかけを好む。
  background: 自由連合軍の潜伏艦隊を率いる戦術家。辺境の過酷な環境で育ち、中央政府の腐敗を嫌悪している。
  motivation: 銀河の独占を防ぎ、情報の自由を確保すること。氷の城の技術を連合の手に収めること。
  relationships:
  - name: エリス・ヴァン・クロムウェル
    relation: 戦場でのライバル。彼女の決断力を高く評価している
  arc: 個人の自由のために戦っていたが、装置の真の目的を知ることで、銀河全体の未来を背負う責任感を受け入れる。
- name: ゼノス・ヴォルガ
  role: 敵役
  age: 52
  gender: 男性
  appearance: 数々の戦傷が刻まれた顔と、威圧的な巨躯。常に重厚な装飾が施された帝国の将官服を着用している。
  personality: 冷酷非道なリアリスト。目的のためには手段を選ばない。「帝国こそが銀河の秩序である」という信念を持つ。一人称は「我」。
  speech_style: 重々しく、威圧感のある命令口調。部下に対しても妥協を許さない。
  background: 帝国軍の強硬派を代表する将軍。過去の紛争で多くの戦果を挙げた英雄だが、その手法は極めて過激である。
  motivation: 氷の城の技術を究極の兵器として転用し、連合軍を完全に殲滅して帝国の覇権を確立すること。
  relationships:
  - name: エリス・ヴァン・クロムウェル
    relation: 有能な部下として期待しているが、その甘さを疎ましく思っている
  arc: 絶対的な権力を手に入れようとするが、装置の起動により自らの欺瞞が暴かれ、権威を失墜させる。
- name: リナ・セレス
  role: 脇役/キーパーソン
  age: 21
  gender: 女性
  appearance: 小柄で華奢。古い研究用スーツを着用し、常に周囲の電子機器を解析している。
  personality: 内向的で、人間よりも機械やデータとの対話を好む。好奇心が非常に強い。一人称は「ボク」。
  speech_style: 早口で専門用語を多用する。思考が言葉を追い越しているような話し方。
  background: 消えた入植村の生存者の一人であり、古代技術の解析に特化した天才的な技術者。氷の城の深部で発見される。
  motivation: 村の住人たちを「時間停止」から解放し、平穏な日常を取り戻すこと。
  relationships:
  - name: エリス・ヴァン・クロムウェル
    relation: 保護対象であり、真実を伝えるための唯一の窓口
  arc: 過去の遺物としての存在から、未来を繋ぐための情報の媒介者へと役割を変える。
