title: 星辰の歯車：氷の要塞と消えた入植地
genre: SF
tone: 重厚な軍事政治劇、硬質なスペースオペラ
pov: 三人称（艦船・陣営ごとの視点切り替え）
tense: 過去形
setting: 辺境星系「エリュシオン」を巡り、帝国軍と自由連合軍が対峙する冷戦時代の銀河系
premise: かつて高度な文明が遺した「空間転移装置」を巡り、帝国と連合の二大勢力が激突する。物語は、100年前に忽然と消えたはずの入植村から届いた謎の生存信号を、帝国の偵察艦が受信したことから始まる。極寒の惑星にそびえる「氷の城」と呼ばれる古代遺跡に、銀河の勢力図を塗り替える究極の兵器が眠っていた。政治的な策謀と、数千隻の艦隊がぶつかり合う絶望的な戦場の中で、兵士たちは己の信条と生存を賭けて戦う。
themes:
- 権力と個人の葛藤
- 失われた文明への憧憬と恐怖
rules:
- 超光速通信は中継基地を介してのみ可能であり、戦域内では短距離量子通信に限定される
- 艦隊指揮は階級制度に基づいた厳格な命令系統（チェーン・オブ・コマンド）に従い、独断専行は軍法会議の対象となる
- ワープ航法は特定の「航路（レーン）」のみに制限されており、航路外への脱出は極めて困難でリスクが高い
plot_outline:
- '序盤: 帝国の辺境哨戒艦が、歴史から消えたはずの入植村からの不規則な通信を受信。調査に向かった第7艦隊は、そこが未知の重力異常地帯であることを突き止め、同時に自由連合軍の潜伏艦隊と接触し、小規模な衝突戦へと発展する。'
- '中盤: 異常地帯の深部、氷の惑星に建つ巨大構造体「氷の城」が発見される。帝国軍と自由連合軍が同時に全戦力を投入して進出し、星系のラグランジュ点を巡る大規模な艦隊戦が展開。戦術的な陣形変更と通信の錯綜による混乱が描かれる。'
- '終盤: 氷の城の内部で、消失した村の住人たちが「時間停止状態」で保存されていたことが判明。装置の起動を巡り、帝国の強硬派将軍と連合の政治工作員、そして現場の若き艦長たちの間で、裏切りと密約が飛び交う政治劇が激化する。'
- '結末: 装置の正体が兵器ではなく、銀河全域を繋ぐ超空間通信網の再構築装置であったことが判明。激戦の末に装置が起動し、全勢力の通信ログが強制的に共有されることで、戦争の虚飾が暴かれ、新たな共存の時代への一歩が刻まれる。'
style_notes: 階級呼称（提督、艦長、少尉など）を厳格に使い分け、通信ログ形式の描写を挿入して臨場感を出す。星系図を俯瞰した戦術的な位置関係を詳細に記述し、艦隊の陣形（楔形、円環陣など）や相対速度、ベクトルを具体的に描写すること。
