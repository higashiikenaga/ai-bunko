- name: 瀬戸 遥
  role: 主人公
  age: 24
  gender: 女性
  appearance: 清潔感のある都会的な装い。少し疲れ気味の瞳と、知的な印象を与える眼鏡が特徴。
  personality: 真面目で論理的。未知の事象に対しては慎重だが、一度興味を持つと突き詰める性質。一人称は「私」。
  speech_style: 丁寧で落ち着いた標準語。感情が昂ると少し早口になる。
  background: 都内の図書館で司書として働く。祖父の急逝を機に、疎遠だった故郷の山あいの町へ戻る。
  motivation: 祖父の遺品から見つかった写真の謎を解き、祖父が隠していた真実を知ること。
  relationships:
  - name: 瀬戸 昭造
    relation: 祖父
  - name: 霧島 誠
    relation: 協力者
  arc: 理屈で説明できない現象を否定していたが、物語を通じて目に見えない感情や記憶の重みを受け入れるようになる。
- name: 浅葱 志乃
  role: 謎の女性 / 霊的存在
  age: 20
  gender: 女性
  appearance: 昭和初期の袴姿。霧の中に佇むような、透き通るほど白く儚げな容姿。
  personality: 献身的で情愛深い。どこか寂しげな微笑みを絶やさない。一人称は「私」。
  speech_style: 古風で柔らかい、時代を感じさせる言葉遣い。
  background: 地図から消された村の娘。村の禁忌により、愛した者から忘れ去られる運命を背負わされた。
  motivation: 時を超えて、自分を忘れてしまった昭造へ想いを届けること。
  relationships:
  - name: 瀬戸 昭造
    relation: かつての恋人
  arc: 未練としてこの世に留まっていたが、遥の手によって想いが解放され、安らかな眠りにつく。
- name: 霧島 誠
  role: 脇役 / 案内役
  age: 58
  gender: 男性
  appearance: 使い古されたエプロンを身につけた、頑固そうな中年の男。常に煙草の匂いが漂う。
  personality: 無愛想でぶっきらぼうだが、非常に博識で、困っている者を放っておけない。一人称は「俺」。
  speech_style: 荒っぽいが温かみのある、強い地方訛り。
  background: 町の片隅で古書店を営む。地元の伝承や、かつて存在した村の歴史に詳しい隠れた知識人。
  motivation: 遥が真実に辿り着けるよう、適切な助言を与えながら見守ること。
  relationships:
  - name: 瀬戸 遥
    relation: 相談相手
  arc: 街の忌むべき過去を語り継ぐ役割を担いながら、自分自身も町の歴史との向き合い方を再確認する。
- name: 瀬戸 昭造
  role: 鍵となる人物
  age: 25
  gender: 男性
  appearance: （写真の中）精悍で意志の強そうな青年。鉄道制服を纏っている。
  personality: 誠実で責任感が強い。愛と掟の間で苦悩する、情熱的な一面を持つ。一人称は「僕」。
  speech_style: 丁寧で、迷いのない話し方。
  background: かつてこの地方の鉄道に従事していた。志乃と出会い、村の禁忌に触れたことで、彼女を忘れる決断を強いられた。
  motivation: 志乃への愛を守ることと、社会的な責任の間での葛藤。
  relationships:
  - name: 浅葱 志乃
    relation: 最愛の女性
  - name: 瀬戸 遥
    relation: 孫
  arc: 過去の罪悪感と未練を、遺品を通じて孫に託すことで、魂の解放へと導く。
