title: 煤煙の記憶と、地図から消えた駅
genre: 怪談・民俗
tone: 懐古的で静謐、寂寥感のある文体
pov: 一人称（わたし）
tense: 過去形（回想形式）
setting: 昭和中期の面影が残る山深い地方都市と、記録から抹消された廃村
premise: 祖父の遺品整理中に見つかったのは、見覚えのない駅に立つ自分と、正体不明の女が写った古ぼけた写真だった。その駅は国の記録からも、地元の記憶からも完全に消し去られていた。わたしは写真に添えられていた一通の古い手紙に導かれ、霧に包まれた山奥へと足を踏み入れる。そこには、止まったはずの蒸気機関車が、今も誰かを待ち続けていた。
themes:
- 喪失と受容
- 忘れられた記憶の浄化
rules:
- 消えた村『霧隠村』は、特定の深い霧が出た夜にのみ、古い蒸気機関車の汽笛が聞こえる場所から辿り着ける。
- 村に迷い込んだ者は、自身の心にある『消えない未練』を写真に写し出すことでしか、現実世界へ帰還できない。
- 村を走る蒸気機関車は、人の情念を燃料として走り、行き先のない魂を彼岸へと運ぶ役割を持つ。
plot_outline:
- '序盤: 祖父の死後、遺品の中からセピア色の古い写真と、宛名のない手紙を発見する。写真には存在しないはずの『霞ヶ原駅』という看板と、若き日の祖父と見知らぬ女が写っていた。'
- '中盤: 地元の古書店主から、かつてある村が一夜にして地図から消えたという民俗的な伝承を聞かされる。わたしは手紙の記述に従い山深くへ入り、深い霧の中で幽霊のような蒸気機関車と遭遇し、消えた村へと連れ去られる。'
- '終盤: 村で、祖父がかつて愛しながらも、村の禁忌によって忘れ去ることを強要された女性の霊と再会する。写真と手紙は、彼女が祖父に宛てて書き溜めていた、届くはずのない想いの断片であったことを知る。'
- '結末: 祖父の未練が詰まった写真を機関車の火炉に投げ入れ、その魂を解放する。わたしは現実に戻るが、手元には、かつての写真とは違う、穏やかに微笑む二人が写った新しい一枚だけが残されていた。'
style_notes: 昭和の商店街を歩くような、ゆっくりとした時間の流れを感じさせる描写を重視する。「〜でした」「〜だったのでしょう」といった、独り言のような回想口調を用い、古びた紙の匂いや鉄錆の香りなど、五感を刺激する哀愁漂う表現を散りばめる。
