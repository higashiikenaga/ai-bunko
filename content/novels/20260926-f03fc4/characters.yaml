- name: 凪原 ハル
  role: 主人公
  age: 22
  gender: 男性
  appearance: 細身で少し眠そうな目をした青年。常に清潔感のある灯台守の制服を着ているが、拾った懐中時計を大切そうに胸ポケットに入れている。
  personality: 真面目すぎるがゆえに想像力が暴走しやすい。ファンタジー小説を愛読しており、日常にドラマを求める傾向がある。一人称は「僕」。
  speech_style: 丁寧な口調だが、内心で「運命」や「使命」を感じると、独り言が途端に芝居がかった大げさな表現になる。
  background: 大学卒業後、静かな環境を求めて凪ヶ浦の灯台管理人に就任。人生の転機を期待していたタイミングで懐中時計を拾い、自分を物語の主人公だと思い込む。
  motivation: 壊れた懐中時計の謎を解き、伝説の守護者として町と世界を守り抜くこと。
  relationships:
  - name: 海咲 ミオ
    relation: 監視役兼ツッコミ役の同僚
  - name: 権田 権三郎
    relation: 自分を聖者として崇める（と思っている）雇い主
  arc: 自分が特別な存在ではないと知り絶望するが、結果として町の人々に愛されていることに気づき、ありのままの自分（掃除好きの青年）として居場所を見つける。
- name: 海咲 ミオ
  role: 相棒/常識人
  age: 21
  gender: 女性
  appearance: 快活なボブカットに、動きやすいサロペット姿。常に町おこしの企画書が入ったクリップボードを抱えている。
  personality: 現実主義で効率重視。ハルの妄想に呆れつつも、彼のひたむきな掃除ぶりには密かに感心している。一人称は「私」。
  speech_style: サバサバとした口調で、ハルの勘違いに対して鋭いツッコミを入れる。
  background: 凪ヶ浦出身。町おこし資料館の運営を手伝っており、ハルを「効率的な清掃員」として期待して雇ったが、町中の勘違いに巻き込まれていく。
  motivation: 資料館を盛り上げ、町を活性化させること。および、ハルの暴走を止めること。
  relationships:
  - name: 凪原 ハル
    relation: 危なっかしくて放っておけない同僚
  - name: 権田 権三郎
    relation: アイデアを盛り盛りにして方向性を間違える町長
  arc: 効率ばかりを追い求めていたが、ハルが巻き起こす「心地よい混乱」に触れるうちに、余裕を持って日常を楽しむ心を取り戻す。
- name: 権田 権三郎
  role: 脇役/勘違いの加速装置
  age: 62
  gender: 男性
  appearance: 恰幅の良い体型に、派手なアロハシャツを愛用。常に満面の笑みを浮かべている。
  personality: 超ポジティブで Opportunist（機会主義者）。面白いことには飛びつき、都合よく解釈して拡大解釈する天才。一人称は「私」。
  speech_style: 豪快で朗々とした話し方。「おお！これこそが聖なる兆しですな！」など、大げさな肯定を多用する。
  background: 凪ヶ浦の町長。町を観光地化させるために必死で、ハルの奇妙な行動をすべて「伝説の守護者の振る舞い」として宣伝し、観光客を呼び込もうとする。
  motivation: 凪ヶ浦を日本一有名な「伝説の町」にすること。
  relationships:
  - name: 凪原 ハル
    relation: 最高の観光資源（聖者）
  - name: 海咲 ミオ
    relation: 優秀だが堅実すぎる部下
  arc: 嘘を塗り重ねていたが、最終的にその「嘘」が町の人々を本当に幸せにするという結果を導き出し、正真正銘のリーダーとして認められる。
