title: 灯台守の勘違い・大作戦 〜伝説の遺物は、ただの動かない懐中時計でした〜
genre: 日常ほのぼの
tone: コメディ、ドタバタ、勘違い
pov: 三人称
tense: 過去形
setting: 現代、海辺ののどかな町「凪ヶ浦（なぎがうら）」
premise: 海辺の町にやってきた青年・ハルは、古い灯台の管理人として雇われるが、なぜか町の人々から「伝説の守護者」として崇められてしまう。彼が拾った「壊れた懐中時計」が世界の運命を左右する鍵だと信じ込んで勘違いを加速させる中、事態は予想外の方向へ。実は彼が守っているのは、ただの町おこし用の資料館だったのだ！
themes:
- 勘違いが招く幸福
- 何気ない日常の価値
rules:
- 町の人々はハルの些細な言動をすべて深遠な意味を持つものとして解釈する
- ハルの行動は常に意図せずして奇跡的な結果を招く
plot_outline:
- '序盤: ハルが灯台の管理人として就職。壊れた懐中時計を拾い「これこそが物語の始まりだ」と勝手に覚悟を決める。町の人々が「ついに聖者が来た」と勘違いし、異常な歓迎を受ける。'
- '中盤: ハルが掃除のために灯台の階段を駆け上がる姿が「神聖な儀式」に見え、町中が大騒ぎに。懐中時計の針を直そうとする試みが、なぜか町の伝統祭りの準備とリンクし、混乱が雪だるま式に増大する。'
- '終盤: 壊れた懐中時計の修理依頼が届く。それが実は町おこしイベントの景品だったことが判明。ハルは「自分はただの掃除係だったのか！」と絶望するが、町の人々は「謙虚な聖者だ！」とさらに深く勘違いする。'
- '結末: 灯台の下で、勘違いのまま賑やかな祭りが開催。ハルは今日も盛大な勘違いの渦中で、淡々と掃除に励む日常が続く。'
style_notes: 真鍋コト特有の、主人公の過剰なドラマチック思考に対する鋭いツッコミを地の文に多用すること。些細な小道具（懐中時計など）を、物語の重大な伏線のように扱い、最後は「ただの道具」としてギャグ的に回収すること。各話の最後に必ず、状況がさらに悪化するか、あるいはより深く勘違いされるオチをつけること。
