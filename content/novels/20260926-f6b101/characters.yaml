- name: ログ (Unit-L0G)
  role: 主人公
  age: 5
  gender: 無性別
  appearance: マットな質感の白い球体。小型の浮遊型記録端末。センサーが青く光る。
  personality: 論理的で観察的。感情を「計算不能なノイズ」として扱う。一人称は「私」。
  speech_style: 丁寧だが感情を排した、データに基づく正確な口調。
  background: 老学者の意識をバックアップし、思考プロセスを模倣するために設計された自律型端末。
  motivation: エライジャの思考と記憶を、寸分の狂いもなく記録し続けること。
  relationships:
  - name: エライジャ・ソーン
    relation: 主であり、唯一の観察対象
  arc: データの整合性を追求する存在から、データの欠落（感情）にこそ人間性が宿ると理解する存在へ。
- name: エライジャ・ソーン
  role: 主人公
  age: 78
  gender: 男性
  appearance: 痩せた体躯、銀髪、深い皺のある顔。穏やかだがどこか遠くを見ているような瞳。
  personality: 穏やかで思慮深いが、認知症により時折混乱する。一人称は「私」。
  speech_style: 優しく穏やかだが、記憶が混濁すると断片的になり、独り言のようになる。
  background: かつて歴史学を研究していた高名な学者。現在は放棄された島の灯台で静かに暮らしている。
  motivation: 地図が示す場所へ辿り着き、失われゆく自分自身と「何か」を取り戻すこと。
  relationships:
  - name: ログ
    relation: 世話役であり、唯一の話し相手
  - name: クララ
    relation: かつての恋人
  arc: 記憶の霧の中を彷徨いながら、最後に最も大切な記憶に触れ、魂の充足を得る。
- name: クララ
  role: 重要脇役
  age: 25
  gender: 女性
  appearance: 太陽のような明るい笑顔、風に揺れる柔らかな髪、清潔な白いワンピース。
  personality: 快活で愛情深い。エライジャの記憶の中で輝き続ける存在。一人称は「私」。
  speech_style: 温かく、響きのある、人を安心させる話し方。
  background: エライジャが若かりし頃に愛した女性。公的な記録には一切残っていない。
  motivation: エライジャとの約束を果たすこと、彼を記憶の終着点へと導くこと。
  relationships:
  - name: エライジャ・ソーン
    relation: 最愛の女性
  arc: エライジャの断片的な記憶として現れ、物語の核心である「感情」の象徴として機能する。
- name: ヴァレンタイン
  role: 敵役
  age: 35
  gender: 男性
  appearance: ホログラム越しに現れる、隙のないスーツ姿の端正な顔立ちの男。
  personality: 極めて合理的で冷徹。データの正確性と効率を最優先する。一人称は「私」。
  speech_style: 事務的で威圧的な、規律を重んじる口調。
  background: 記録端末の管理・保守を担当する管理局の監視官。
  motivation: バックアップデータの「完全性」を維持し、エラー（感情やノイズ）を排除すること。
  relationships:
  - name: ログ
    relation: 管理対象および命令を下す者
  arc: システムの論理を象徴する存在として、ログが「ノイズ」を受け入れる過程の障壁となる。
