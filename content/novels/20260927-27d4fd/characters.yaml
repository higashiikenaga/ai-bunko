- name: 九条 蓮
  role: 主人公（自称・名探偵）
  age: 27
  gender: 男性
  appearance: サイズの合っていない三つ揃えのスーツに、度のない伊達眼鏡。常に手帳と万年筆を携帯している。
  personality: 極度の自信家で、あらゆる事象を「緻密な計画に基づいた犯罪」として解釈しようとする。一人称は「僕」。
  speech_style: 芝居がかった大げさな口調。「なるほど、ここですべてのパズルが組み合わさった！」が口癖。
  background: 法学部を中退し、ミステリー小説の読みすぎで独自の「推理理論」を構築した無職。商店街の古道具屋の常連。
  motivation: 世間を震撼させる歴史的な大事件を解決し、名声を得ること。
  relationships:
  - name: ルナ
    relation: 論理を無視する不快なライバル
  - name: 一ノ瀬 すみれ
    relation: 自分の推理を適切に賞賛しない不愛想な店員
  arc: 絶対的な自信を持って暴走し、最後は電波干渉というあまりに俗っぽい真実の前に完敗し、脱力する。
- name: ルナ
  role: 主人公（自称・霊能者）
  age: 24
  gender: 女性
  appearance: ゴシックロリータ風の衣装に、大ぶりの水晶ペンダント。常に不思議な香香を漂わせている。
  personality: 直感的でドラマチック。あらゆる現象を「霊的な予兆」や「運命」として捉える。一人称は「私」。
  speech_style: たどたどしく、予言のような含みを持たせた話し方。「星々が囁いています……」など。
  background: 演劇大学で演技を学んでいたが、中退後に「スピリチュアル・コンサルタント」として独立。実際はただの想像力が豊かな青年。
  motivation: 異界の門を閉じ、世界を破滅から救う聖女としての地位を確立すること。
  relationships:
  - name: 九条 蓮
    relation: 物質的な視点しか持たない浅はかな男
  - name: 一ノ瀬 すみれ
    relation: 霊的な感性が欠如している可哀想な人間
  arc: 神託を信じて聖戦に身を投じるが、正体がただのノイズだったことを知り、一気に現実に引き戻される。
- name: 一ノ瀬 すみれ
  role: 主人公（常識人・ツッコミ役）
  age: 22
  gender: 女性
  appearance: 地味なエプロン姿。目の下に深い隈があり、常に胃薬の錠剤を口に含んでいる。
  personality: 極めて現実的で冷笑的。周囲の騒動に呆れているが、責任感から放置できない。一人称は「私」。
  speech_style: 低体温で淡々とした口調。鋭いツッコミを入れるが、相手に届いていないことが多い。
  background: 地元の大学に通う学生で、家業に近い古道具屋でアルバイトをしている。唯一の正気。
  motivation: 店内の備品を壊されずに、平和にシフトを終えること。
  relationships:
  - name: 九条 蓮
    relation: 店に居座る厄介な客A
  - name: ルナ
    relation: 店に居座る厄介な客B
  arc: 二人の暴走に翻弄され精神的に限界を迎えるが、結果的に万引き犯を捕まえたことで、最低限の達成感を得る。
