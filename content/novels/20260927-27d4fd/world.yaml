title: 鏡の向こうは勘違いだらけ：夜明けのラジオが鳴り止まない街にて
genre: 群像劇
tone: 爆走する勘違いコメディ
pov: 三人称
tense: 過去形
setting: 現代、迷路のような路地裏が続く古びた商店街
premise: 古道具屋に持ち込まれた「ただの歪んだ鏡」を巡り、自称・名探偵と自称・霊能者の解釈が最悪の形で衝突する。そこに、夜明けにだけ流れる謎のラジオ放送が「神託」や「暗号」として誤認され、事態は宇宙規模の陰謀へと勝手に膨れ上がっていく。勘違いが雪だるま式に膨れ上がり、誰も真実を見ようとしない、騒がしくも空虚な大騒動の記録。
themes:
- 主観という名のフィルター
- 些細なことの重大化
rules:
- 登場人物は自分の妄想を、客観的な事実として脳内で補完する
- 全ての伏線は、ギャグとして、あるいは無意味な小道具として機能する
plot_outline:
- '序盤: 古道具屋に「鏡」が入荷。探偵はそこに「犯罪の証拠」を、霊能者は「異界への門」を読み取り、勝手に調査を開始する。'
- '中盤: 夜明けのラジオが不気味なノイズを発信。探偵はそれを「暗号」と、霊能者は「神託」と受け取り、二人の暴走が商店街を巻き込む大騒動へと発展。店員は胃薬を片手に板挟みになる。'
- '終盤: 鏡を巡って店内で「聖戦」が勃発。クライマックスの緊張感の中で、ラジオの正体が単なる電波干渉であることが判明し、全員が脱力する。'
- '結末: 全てはただの勘違いだったが、騒ぎの最中に鏡が反射した光が、偶然にも隠れていた万引き犯を照らし出し、事件が解決してしまう。'
style_notes: 三人称による、登場人物たちの痛々しいまでの「勘違い」を容赦なく突っ込む文体。地の文では、彼らの勘違いをあえて高尚な悲劇のように大袈裟に描写しつつ、即座に冷ややかなツッコミを入れること。ギャグとして提示した小道具は、必ず結末で「その用途では全く役に立たないが、状況をさらにややこしくする」形で再登場させる。
