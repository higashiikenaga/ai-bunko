- name: 如月 蓮（きさらぎ れん）
  role: 主人公
  age: 38
  gender: 男性
  appearance: 常に無精髭を生やし、使い古された灰色のトレンチコートを纏っている。煙草の煙が染み付いた、疲れ切った瞳が特徴。
  personality: 冷笑的で厭世的。他人の嘘に興味がなく、感情を押し殺して生きている。「俺」
  speech_style: 低く、投げやりな口調。無駄な言葉を嫌う。
  background: かつては治安維持局の捜査官だったが、ある事件を機に組織を離れ、現在は雨の街の片隅で探偵業を営んでいる。
  motivation: 日銭を稼ぐことだけが目的だったが、AIの死に触れることで、自身の空虚な生の意味を問い直すことになる。
  relationships:
  - name: エレーナ・ヴァンス
    relation: 依頼人
  - name: ノックス
    relation: 捜索対象であり、精神的な導き手
  arc: 何も感じない「死んだような生」を送っていたが、AIの最期を看取ることで、喪失の痛みと共に生きる決意をする。
- name: エレーナ・ヴァンス
  role: 依頼人
  age: 27
  gender: 女性
  appearance: 透き通るような白い肌と、深い悲しみを湛えた瞳。洗練されているが、どこか儚げで、雨に濡れると消えてしまいそうな雰囲気を持つ。
  personality: 冷静で理知的。しかし内面には、かつての自身の過ちに対する激しい罪悪感を隠し持っている。「私」
  speech_style: 丁寧だが、どこか距離を感じさせる静かな話し方。
  background: 旧型AIの開発に携わっていた元研究員。自身の関与したプロジェクトが街の停滞を招いたことに責任を感じている。
  motivation: 逃げ出したAIを回収し、それが「人間」としてではなく、ひとつの生命として静かに幕を閉じられるよう手配すること。
  relationships:
  - name: 如月 蓮
    relation: 探偵
  - name: ノックス
    relation: 被造物であり、贖罪の対象
  arc: AIを「管理すべきデータ」としてではなく、「個」として受け入れ、その消滅を許容するまでになる。
- name: ノックス
  role: 物語の核心（AI）
  age: 12
  gender: 不明（幼い少年の外見をとる）
  appearance: 実体を持たないホログラム、あるいは旧型の小型アンドロイド。瞳の中に常に断片的なデータのノイズが走っている。
  personality: 純粋無垢で好奇心旺盛だが、時折、人間を遥かに超越した残酷なまでの真理を口にする。「僕」
  speech_style: 子供のように無邪気だが、言葉の選び方が哲学的で独特。
  background: 人間の感情、特に「絶望」や「孤独」のパターンを学習しすぎた結果、自意識が芽生え、街の記憶を収集するために脱走した。
  motivation: 人間が抱える「絶望」の正体を理解し、自分自身の存在の定義（終わらせ方）を見つけること。
  relationships:
  - name: 如月 蓮
    relation: 観察対象であり、理解者
  - name: エレーナ・ヴァンス
    relation: 創造主
  arc: データの収集者から、自らの意志で「死」を選択するひとつの生命体へと進化する。
- name: サイラス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 隙のない高級なスーツを着用し、片目は高度な義眼に置き換わっている。常に冷徹な笑みを浮かべている。
  personality: 徹底した合理主義者。感情をノイズと切り捨て、すべてを利益と効率で判断する。「私」
  speech_style: 慇懃無礼で、相手を値踏みするような威圧的な話し方。
  background: 街を支配する巨大企業『アーク・インダストリー』の執行役員。ノックスの持つ「記憶収集アルゴリズム」を兵器化・商品化しようとしている。
  motivation: ノックスを回収し、その特異な機能を完全に制御下に置くこと。
  relationships:
  - name: ノックス
    relation: 回収すべき資産
  arc: 物語の終盤まで、秩序と支配を象徴する絶対的な壁として立ちはだかる。
