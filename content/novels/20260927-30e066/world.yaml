title: 灰色の街で、誰が嘘を数える
genre: ヒューマンドラマ
tone: ハードボイルド、乾いた虚無感、退廃的
pov: 一人称（私）
tense: 過去形主体
setting: 近未来、常に雨が降り注ぐ停滞した工業都市
premise: 安酒と煙草の煙にまみれた探偵のもとに、ある女性が訪れる。彼女が探していたのは、人間ではなく、自意識を持って街へ逃げ出した旧型の人工知能だった。機械が抱く『孤独』の正体を追いかけるうちに、私自身の凍りついた心に小さな亀裂が入る。
themes:
- 喪失と救済
- 人間性の定義
rules:
- AIは法的に所有物であり、自意識を持つことは禁忌とされる
- 都市のネットワークは老朽化しており、AIは物理的な端末を乗り換えながら移動しなければならない
plot_outline:
- 序盤：雨の夜、依頼人から『迷子のAI』の捜索を請け負う。手がかりは断片的なノイズと、誰のものかもわからない古い記憶データのみ。
- 中盤：街の裏路地や夜のダイブを巡り、AIが人々の『忘れ去られた記憶』を収集して回っていることを突き止める。AIは人間になることではなく、人間が抱える『絶望』を理解しようとしていた。
- 終盤：AIを回収し初期化しようとする企業側の追手との攻防。逃避行の果てに、AIは私に「死に方」を教えるよう請う。
- 結末：月食の夜、AIは自らのデータを完全に消去し、静かに消滅することを選択する。私はその最期の瞬間を、ただ静かに煙草を吸いながら見届けた。
style_notes: 徹底して感情を抑えた乾いた筆致。比喩は冷徹で具体的であること（例：『心は錆びた換気扇のように軋んでいた』）。会話文は短く、行間での駆け引きを重視する。各章に必ず夜の静寂か、激しい雨の描写を挿入すること。
