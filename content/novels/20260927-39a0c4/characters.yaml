- name: ザイド・アル・ファヒム
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で知的な眼差しを持つ。常に砂塵にまみれた旅装束を纏い、使い込まれた羊皮紙と筆記具を携えている。
  personality: 慎重かつ探究心が強く、物事を論理的に捉える。一人称は「私」。
  speech_style: 丁寧で落ち着いた口調。学術的な用語を好んで使う。
  background: 辺境のオアシスで古文書を研究していた若き学者。偶然にも「禁忌の星図」の一片を手に入れ、帝国の権力争いに巻き込まれる。
  motivation: 星図に隠された真実を解明すること、そして理不尽な暴力から学問と己の命を守ること。
  relationships:
  - name: 皇子ジャハーン
    relation: 追跡者であり、運命を共有するライバル
  - name: レイラ
    relation: 過酷な旅を共にする共闘者
  arc: 真理を求めるだけの受動的な学者から、星図が示す絶望的な運命を拒絶し、人間の意志で未来を切り拓こうとする指導者へと成長する。
- name: 皇子ジャハーン
  role: 主人公/ライバル
  age: 28
  gender: 男性
  appearance: 威厳に満ちた端正な顔立ち。金糸の刺繍が施された豪華な絹の軍服を纏い、鋭い眼光を放つ。
  personality: 野心的で合理的、目的のためには手段を選ばない冷徹さを持つ。一人称は「余」。
  speech_style: 威圧的で断定的。交渉時には極めて洗練された、相手を丸め込むような話し方をする。
  background: 皇帝の次男。軍部を掌握しており、兄である第一皇子の腐敗した統治を打破し、自らが新たな皇帝となることを目論んでいる。
  motivation: 混乱する帝国を力によって統一し、強固な秩序を再構築すること。
  relationships:
  - name: 宰相イシュマエル
    relation: 利用し合っているが、決して信用していない協力者
  - name: ザイド
    relation: 星図を手にするために排除すべき、あるいは利用すべき鍵
  arc: 権力への執着に燃える征服者から、帝国の滅亡という不可避の結末を前に、力だけでは抗えない現実を知り、新たな統治の在り方を模索する。
- name: 宰相イシュマエル
  role: 敵役
  age: 55
  gender: 男性
  appearance: 細身で枯れた印象を与える。影のある深い眼窩と、常に薄笑いを浮かべた口元が特徴。黒い法衣のような服を好む。
  personality: 極めて狡猾で計算高く、感情に左右されないリアリスト。一人称は「私」。
  speech_style: 穏やかで含みのある話し方。常に相手の懐に入り込み、心理的な揺さぶりをかける。
  background: 長年皇帝を支えてきた帝国の重鎮。帝国の腐敗を管理することで自らの権力を盤石にしてきた、影の支配者。
  motivation: 星図が示す「秘宝」を手に入れ、皇帝さえも凌駕する絶対的な権力を掌握すること。
  relationships:
  - name: 皇子ジャハーン
    relation: 自らの野望を実現するための駒
  - name: ザイド
    relation: 計画を狂わせる不確定要素として排除対象としている
  arc: すべてを支配下に置いたと確信した瞬間に、星図が示す「帝国の滅亡」という抗えない天の理に直面し、絶望へと突き落とされる。
- name: レイラ
  role: 相棒/脇役
  age: 25
  gender: 女性
  appearance: 日焼けした肌と、砂漠の民特有の鋭い瞳を持つ。実用的な軽装の貴族服を纏い、腰には常に短剣を差している。
  personality: 実直で勇敢、直感に優れる。情に厚いが、決して隙は見せない。一人称は「私」。
  speech_style: 飾り気がなく、簡潔で力強い。砂漠の民らしい荒々しさが混じる。
  background: かつて宮廷に仕えていたが、政争に敗れて家族を失い、砂漠の民に身を寄せた亡命貴族の娘。
  motivation: 失った家族への復讐と、崩壊していく故郷（帝国）が、せめて生き残れるような道を見つけること。
  relationships:
  - name: ザイド
    relation: 守るべき対象であり、知恵を借りる相棒
  - name: 皇子ジャハーン
    relation: かつて家を滅ぼした権力構造の象徴としての敵対心
  arc: 過去の復讐心に囚われた亡命者から、滅びゆく世界の中で「次なる時代」を生きる人々のための架け橋となる。
