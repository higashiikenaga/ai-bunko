title: 砂塵の帝国、星の遺言
genre: 歴史・時代小説
tone: 重厚、荘厳、政治的駆け引きに満ちた大河調
pov: 三人称多視点（章ごとに切り替え）
tense: 過去形
setting: 架空の12世紀中央アジアを彷彿とさせる広大な砂漠帝国「カシム・ハーン国」
premise: 皇帝の急死により、帝国の継承権を巡る血で血を洗う権力争いが勃発する。鍵を握るのは、古の天文学者が遺した、領土の真の境界と秘宝の在処を示す「禁忌の星図」。砂漠のオアシスに潜む亡命貴族と、宮廷の権力者たちが、国家の運命を賭けた知略の盤面で激突する。
themes:
- 権力の虚妄
- 宿命と自由
- 知の継承
rules:
- 星図の解読には三つの断片が必要であり、それぞれ異なる勢力が保有している
- 砂漠のオアシスは中立地帯とされ、そこでの殺生は禁忌とされる
- 帝国の正統性は天文学的な運行と一致している必要があるという宗教的信念が存在する
plot_outline:
- '序盤: 皇帝の崩御と同時に、三人の皇子による内乱が始まる。同時に、辺境のオアシスで古の星図の一片を持つ青年学者が、宮廷の刺客に追われる。'
- '中盤: 各勢力が星図の断片を集めるため、外交的駆け引きと軍事衝突を繰り返す。視点は皇子、宰相、学者の間を往来し、帝国の腐敗と構造的な矛盾が浮き彫りになる。'
- '終盤: 全ての断片が揃い、真の星図が完成。それが指し示したのは富ではなく、帝国の滅亡を予言する天体の配列であった。絶望の中、誰が次なる時代の舵を取るかが問われる。'
- '結末: 血塗られた権力争いの果てに、一人の人間が星図を焼き捨て、天の運命ではなく人間の意志で国を治める道を選択する。帝国は形を変え、新たな時代へと移行する。'
style_notes: 一文を長く、修飾語を重ねた重厚な文体。漢語を多用し、格調高さを出す。各章の冒頭には『〇〇年、砂の嵐が都を飲み込んだ年。』のような年代記風の記述を挿入し、歴史の俯瞰的な視点を提示すること。
