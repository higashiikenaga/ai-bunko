title: 薄紅の灯台と、偽りの遺言
genre: 本格ミステリー
tone: 典雅で静謐な古典的推理小説調
pov: 一人称（ワトソン役の語り）
tense: 過去形
setting: 昭和中期、絶海の孤島にある旧家とその領地に立つ古い灯台
premise: 莫大な遺産を巡り、親族が集まった孤島。満開の遅咲きの桜が舞う中、旧い灯台の密室で次期当主が遺体となって発見される。外界から遮断された状況下で、名探偵・神楽坂が論理の刃を用いて不可能犯罪の正体を暴き出す。
themes:
- 血縁の呪縛
- 論理的帰結
rules:
- 犯行時刻は潮の満ち引きにより外部からの侵入が不可能な時間帯であること
- 密室の証明は物理的な鍵と扉の構造に基づき、読者に提示されること
- 超常現象は一切排除し、すべて物理的なトリックで説明すること
plot_outline:
- '序盤: 語り手である『私』が探偵の神楽坂と共に孤島へ赴き、遺産相続を巡る親族の確執と、島に佇む古い灯台の異様な佇まいが描写される。'
- '中盤: 遅咲きの桜が舞う夜、灯台の最上階で密室殺人が発生。現場に残された不可解な遺留品と、容疑者たちの矛盾するアリバイが提示される。'
- '終盤: 神楽坂が現場の物理的矛盾を指摘し、読者へ挑戦状を叩きつける。灯台の構造と桜の花びらが鍵となったトリックが論理的に解明される。'
- '結末: 犯人が自白し、遺産に隠された悲劇的な家族の真実が明らかになる。神楽坂は静かに島を後にする。'
style_notes: 形式美を重視した古典的な本格推理。探偵の超人的な洞察力を、傍観者である『私』の視点から敬意と驚きを持って描写する。伏線はすべて明示し、飛躍のない演繹法による解決を目指す。
