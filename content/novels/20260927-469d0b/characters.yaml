- name: 千代
  role: 主人公
  age: 18
  gender: 女性
  appearance: 透き通るような白い肌に、深い紺色の巫女装束を纏う。瞳は雨上がりの空のように澄んでいる。
  personality: 慈愛に満ちているが、嘘をつけないため不器用。誠実すぎるゆえに孤独を抱えている。一人称は「私」。
  speech_style: 静かで丁寧な口調。嘘がつけないため、回り道せず核心を突く断定的な言い回しになる。
  background: 代々「真実の呪い」を継ぐ巫女の家系に生まれ、世俗から切り離されて育った。雨の日だけ現れる「雨音庵」の店主として、訪れる者の心を癒やしている。
  motivation: 訪れる人々の心の澱を取り除き、いつか自分自身の呪いという孤独から解放されること。
  relationships:
  - name: 景久
    relation: 運命を共にする旅人
  - name: 玄月
    relation: 師であり精神的な保護者
  arc: 受動的に真実を告げるだけだったが、自らの意志で「言葉（和歌）」を紡ぎ、残酷な運命を書き換える強さを得る。
- name: 景久
  role: 相棒/もう一人の主人公
  age: 27
  gender: 男性
  appearance: 使い込まれた黒い甲冑と刀を携える。鋭い眼光を持つが、その奥に深い疲弊と悲しみを湛えている。
  personality: 冷徹に振る舞い、他人を遠ざける傾向があるが、内面は激しい罪悪感に苛まれている。一人称は「俺」。
  speech_style: ぶっきらぼうで、本心を隠すためにあえて突き放したような言い方をする。
  background: かつて神と交わした禁忌の約束を破った一族の末裔。記憶喪失を装って村を訪れるが、実際には村を救うための「生贄」となる運命を背負っている。
  motivation: 自身の罪を完遂し、誰にも知られずに静かに消え去ること。
  relationships:
  - name: 千代
    relation: 唯一、嘘が通用せず、ありのままの自分を晒される女性
  arc: 絶望の中で孤独な死を受け入れようとしていたが、千代の純粋な誠実さに触れ、罪を背負ったまま生き抜く勇気を持つ。
- name: 玄月
  role: 脇役/導き手
  age: 65
  gender: 男性
  appearance: 長く白い髭を蓄えた老人。常に古ぼけた経典を携え、穏やかな笑みを浮かべているが、目は鋭い。
  personality: 達観しており、運命を静観する傾向がある。知識欲が強く、村の禁忌に詳しい。一人称は「わし」。
  speech_style: 悠々とした口調。比喩や問いかけを多用し、相手に気づきを与える話し方を好む。
  background: 村の長であり、神との古い約束の内容を唯一詳細に把握している伝承者。千代の教育係でもある。
  motivation: 村の均衡を保ち、千代が巫女として正しく成長し、神との約束を完遂させること。
  relationships:
  - name: 千代
    relation: 教え子であり、孫のように慈しんでいる相手
  - name: 景久
    relation: 監視対象であり、同時に同情を寄せる罪人
  arc: 伝統と掟を守ることこそが正義だと信じていたが、千代の行動を通じて、時代と共に変わる「誠」の形を認めるようになる。
