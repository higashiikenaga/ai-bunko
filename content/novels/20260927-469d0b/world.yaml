title: 雨雫の言の葉、嘘なき誠の道
genre: 歴史・時代小説
tone: 情緒豊かで、しっとりと静謐な和風ファンタジー
pov: 三人称
tense: 過去形
setting: 架空の平安時代を模した、霧深い山間の里
premise: 神の恩寵と呪いが交錯する時代、ある村には「真実のみを口にし、嘘をつけぬ呪い」を背負った若き巫女がいた。彼女は雨の日、霧の奥にのみ現れる不思議な茶屋「雨音庵」を訪れ、訪れる人々の心の澱を癒していく。しかし、ある雨の日に現れた、自らの罪を隠し通そうとする旅人との出会いが、村に伝わる神との古い約束を揺るがし始める。
themes:
- 誠実さと罪の在り方
- 雨と再生の物語
rules:
- 呪いを受けた者は、意図的な嘘をつこうとすると喉が焼け付くような痛みに襲われる
- 「雨音庵」は、空から雨が降り注ぐ刻（とき）にしか、現世と神域の狭間に姿を現さない
- 和歌に込められた真実の情念は、時として神への供物となる
plot_outline:
- '序盤: 嘘をつけぬ呪いにより、世俗から離れて暮らす巫女・千代の日常。雨の日だけ開く「雨音庵」にて、彼女は訪れる者の言葉を真実のみで受け止めていく。'
- '中盤: 記憶を失ったふりをする謎の武士が店を訪れる。彼が紡ぐ言葉は、千代の呪いによって「嘘」として弾かれ、店内に静かな緊張が走る。武士の正体が、かつて神と交わした禁忌の約束に関わる者だと判明する。'
- '終盤: 武士が隠していたのは、村を救うために自ら犠牲となるという残酷な真実だった。千代は、言葉にできない真実を和歌に託し、神の怒りを鎮めようと試みる。'
- '結末: 激しい雨の中、和歌が空へと昇り、神との約束は新たな形へと書き換えられる。武士は罪を背負いながらも生きる道を見出し、雨音庵は再び霧の向こうへと消えていく。'
style_notes: 和語の響きを重んじ、風の音や雨の匂い、季節の移ろいを五感に訴えるように描く。物語の節目には、登場人物の心情を象徴する和歌を添え、静謐ながらも芯の強い筆致を貫くこと。
