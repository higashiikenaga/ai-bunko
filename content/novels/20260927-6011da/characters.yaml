- name: カイ・レンフィールド
  role: 主人公
  age: 27
  gender: 男性
  appearance: 日に焼けてひび割れた肌、虚ろな瞳。砂に汚れた長いコートを纏い、首から古い天球儀の破片を下げている。
  personality: 内向的で執着心が強い。知的好奇心よりも「欠落感」に突き動かされる傾向がある。一人称は「私」。
  speech_style: 静かで理屈っぽい。極限状態になると独り言が増える。
  background: かつて天文学を専攻していたが、ある事件で記憶の一部を喪失。失った記憶の断片を追い求め、砂漠を彷徨っていた。
  motivation: 鏡の街に映る「ありえない星図」の中に、自分の失った過去の座標があるのではないかと信じている。
  relationships:
  - name: シエラ
    relation: 唯一の信頼を寄せる案内人だが、正体に懐疑的
  - name: 鏡像のアルカディア
    relation: 自分を模した残酷な鏡合わせの存在
  arc: 論理的な思考を喪失し、自己の同一性を崩壊させながら、最終的に人間であることを捨てて「扉」へと変貌する。
- name: シエラ
  role: 相棒/案内人
  age: 外見は20代前半（実年齢不明）
  gender: 女性
  appearance: 銀色の長い髪。瞳の中には常に小さな砂時計が回っており、服装は液状の鏡のように光を反射して揺らめいている。
  personality: 儚げで慈悲深いが、決定的な場面で残酷な真実を告げる。一人称は「私」。
  speech_style: 詩的で曖昧。答えを直接的に教えず、問いかけるような話し方。
  background: 街に囚われて久しい住人の一人。かつてはカイと同様に外の世界から来たが、すでに「正しい姿」を鏡に奪われている。
  motivation: 自分に代わってこの街の理（ことわり）を完結させ、鏡の向こう側へ消え去ること。
  relationships:
  - name: カイ・レンフィールド
    relation: 救いたいという情愛と、利用したいという打算が混在している
  arc: カイを導きながら、彼が自分と同じ絶望に辿り着くことを確信し、最後には静かに霧のように消滅する。
- name: 鏡像のアルカディア
  role: 敵役
  age: カイと同等
  gender: 男性（カイの鏡像）
  appearance: カイと全く同じ容姿だが、左右が反転している。常に不自然なほど口角が上がっており、瞳にハイライトがない。
  personality: 享楽的で支配欲が強い。カイの劣等感や恐怖を的確に突き刺す。一人称は「僕」。
  speech_style: 挑発的で饒舌。相手を嘲笑うような高いトーンの声。
  background: 鏡の街が作り出した「理想的な自己」の成れの果て。実体を持ちたいという欲望から、本物のカイを精神的に追い詰める。
  motivation: カイを鏡の中に引きずり込み、自分が「本物」として砂漠の外の世界へ出ること。
  relationships:
  - name: カイ・レンフィールド
    relation: 奪い合うべき唯一の肉体を持つ半身
  arc: カイの精神を崩壊させ、入れ替わりを試みるが、最終的にカイが「扉」となることで共に虚無へと飲み込まれる。
- name: 時計師の老人
  role: 脇役
  age: 80
  gender: 男性
  appearance: 指先が時計の針のように細長く金属化している。白濁した瞳に砂が入り込んでおり、常に咳き込んでいる。
  personality: 強迫観念に囚われており、時間に異常に執着している。一人称は「わし」。
  speech_style: しわがれた声で、絶えず秒針のようなリズムで言葉を区切る。
  background: 街の時計塔を管理し続けてきた住人。鏡に映る「正しい時間」を取り戻そうとして、精神が摩耗している。
  motivation: 時計の針を逆回転させ、街が鏡に溶け出す前の「始まりの瞬間」へ戻ること。
  relationships:
  - name: カイ・レンフィールド
    relation: 外の世界から来た稀有な存在として、淡い期待を寄せる
  arc: 絶望的な時間のループに絶望し、最後には自らが巨大な砂時計の部品となって静止する。
