title: 水底の星図と、閉じられた鏡の呼吸
genre: ホラー
tone: 幻想的で不条理な、美しくも底知れない恐怖
pov: 一人称
tense: 過去形
setting: 終わりなき砂漠の真ん中に突如として現れる、鏡張りの回廊が続く廃都
premise: 私は、砂漠の熱風に誘われるようにして、その街へと辿り着いた。そこには、砂丘の底に眠るはずの『砂漠のオアシス』が存在していたが、その水面は鏡のように滑らかで、空を映す代わりに「ありえない星図」を映し出していた。街の住人たちは時計の針を逆回転させながら、存在しない扉を叩き続けている。私は気づいてしまう。この街の境界線が、鏡の向こう側へと、少しずつ溶け出していることに。
themes:
- 自己の境界の喪失
- 永遠の反復と狂気
rules:
- 鏡に映る像は、本体よりも数秒遅れて動き出す
- 時計の針が止まった場所には、物理的な扉ではなく『概念的な入り口』が出現する
- 星図に記された座標に従って歩く者は、現実の空間から切り離される
plot_outline:
- '序盤: 渇きに狂いかけた私は、砂漠の果てに鏡の街を見つける。オアシスの水面に映る歪な星図に魅了され、街の時計塔へと足を踏み入れる。'
- '中盤: 街の住人たちが、鏡の中に自分たちの『正しい姿』を探して狂っていく様を目撃する。私の背後にある鏡が、私の動きを無視して微笑み始めた。論理的な思考が、砂のように指の間から零れ落ちていく。'
- '終盤: 星図の座標を辿り、街の中央にある巨大な砂時計の部屋へ辿り着く。そこでは、過去の自分と未来の自分が、鏡越しに互いを殺し合っていた。扉はもはや、開けるものではなく、自分自身が扉になるためのものだった。'
- '結末: 私は鏡の向こう側へと滑り落ち、砂漠の底で静止した。今、私の視界に映るのは、空ではなく、私の内側で燃える、名前のない星々の群れだけだ。'
style_notes: 夢と現実の境界を曖昧にするため、感覚的な比喩を多用すること。鏡、時計、扉といったモチーフを、単なる道具ではなく、運命を規定する不条理な装置として描く。語り手の精神が崩壊していく過程に合わせ、文章の構文を徐々にねじれさせ、読者が足元を掬われるような感覚を与えること。
