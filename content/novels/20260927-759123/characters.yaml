- name: 佐藤 真琴
  role: 主人公
  age: 28
  gender: 女性
  appearance: 都会の生活で少し痩せ、目の下に疲れが見える。髪は無造作に結んでいることが多い。
  personality: 真面目で責任感が強いが、繊細で悩み込みやすい。一人称は「私」。
  speech_style: 丁寧だが、どこか壁を作るような控えめな口調。
  background: 東京の広告代理店で働いていたが、過労により心身を崩し休職中。逃げるように実家へ帰ってきた。
  motivation: 止まってしまった自分の時間を取り戻し、自分らしく生きられる場所を見つけること。
  relationships:
  - name: 佐藤 健二
    relation: 父
  - name: 佐藤 恵子
    relation: 亡き母
  arc: 孤独と挫折感に苛まれる状態から、料理を通じて過去を受け入れ、再び一歩踏み出す勇気を得る。
- name: 佐藤 健二
  role: 主要登場人物
  age: 62
  gender: 男性
  appearance: 白髪混じりの短髪に、使い込まれた眼鏡。古本の匂いが染み付いた作業着を愛用している。
  personality: 寡黙で無愛想。感情を表に出すのが苦手な不器用な性格。一人称は「俺」。
  speech_style: 短く、ぶっきらぼう。言葉数は少ないが、声に重みがある。
  background: 妻を亡くした後、一人で古本屋「灯火堂」を守り続けてきた。娘との距離感に戸惑っている。
  motivation: 亡き妻との思い出が詰まった店を守り、娘がいつか戻ってこられる場所であり続けること。
  relationships:
  - name: 佐藤 真琴
    relation: 娘
  - name: 佐藤 恵子
    relation: 亡き妻
  arc: 娘との沈黙を破り、言葉にできなかった愛情や、一人で店を守ってきた葛藤を伝えるようになる。
- name: 瀬戸 結衣
  role: 脇役
  age: 35
  gender: 女性
  appearance: 柔らかな笑顔が印象的な、エプロン姿の女性。近所の花屋の店主。
  personality: 観察力に優れ、聞き上手で包容力がある。町の人々に慕われている。一人称は「私」。
  speech_style: 穏やかで、相手の心に寄り添うような優しい口調。
  background: 真琴の幼少期を知る近所の人。真琴の母とも親しかった。
  motivation: 真琴と健二の関係が、少しずつでも良くなっていくことを見守ること。
  relationships:
  - name: 佐藤 真琴
    relation: 近所の友人・相談相手
  - name: 佐藤 健二
    relation: 近所の知人
  arc: 物語の進行において、真琴が母の記憶を呼び起こすためのヒントや、心の拠り所を与える役割を果たす。
- name: ななし
  role: マスコット
  age: 5
  gender: 不明
  appearance: 毛並みの美しい茶トラの猫。少しふっくらとしている。
  personality: 自由奔放でマイペース。懐いている相手には甘えるが、媚びることはない。
  speech_style: 鳴き声のみ（甘える時は喉を鳴らす）。
  background: 灯火堂の軒先に居着いた野良猫。真琴と健二の間に自然と入り込んでくる。
  motivation: 温かい場所で、美味しいもの（あるいは魚の匂い）を求めて過ごすこと。
  relationships:
  - name: 佐藤 真琴
    relation: 居候先の住人
  - name: 佐藤 健二
    relation: 居候先の店主
  arc: 二人の間の沈黙を物理的に埋め、会話のきっかけを作る「架け橋」として機能する。
