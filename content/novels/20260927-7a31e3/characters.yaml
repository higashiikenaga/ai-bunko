- name: 栞 (しおり)
  role: 主人公
  age: 24
  gender: 女性
  appearance: 緩くウェーブした茶色の髪を低めの位置で結んでいる。大きな眼鏡をかけ、常に機能的な白いエプロンを身に着けている。
  personality: 穏やかで聞き上手。他人の感情に共感しやすいが、自分のことになると少し不器用。一人称は「わたし」。
  speech_style: 丁寧で柔らかい口調。相手を急かさず、間を大切にした話し方をする。
  background: 記憶の市場の片隅にある調律店で働く「記憶の調律師」。バラバラになった記憶の断片を整理し、持ち主が心地よく思い出せるよう調整する仕事に従事している。
  motivation: 誰かの大切な記憶が、正しく、美しく保存されることを願っている。
  relationships:
  - name: ハル
    relation: 依頼人であり、次第に心を許し合う存在
  - name: ルナ
    relation: 店主であり、人生の師のような存在
  arc: 他人の記憶を整えるだけの「観測者」から、自分自身の人生に新しい記憶を刻もうとする「当事者」へと変化する。
- name: ハル
  role: 相棒/キーパーソン
  age: 22
  gender: 男性
  appearance: 白に近い淡い色の髪に、どこか遠くを見つめているような寂しげな瞳。使い込まれた古い星図を大切に抱えている。
  personality: 内向的で物静か。誠実だが、過去への執着が強く、どこか危うい雰囲気を纏っている。一人称は「僕」。
  speech_style: 控えめで、言葉を選ぶようにゆっくりと話す。時折、感情が高ぶると幼い口調が混じる。
  background: 幼少期に誰かと一緒に見た「今はもう存在しない星座」の記憶を追い求めている。その記憶だけが彼にとって唯一の心の拠り所となっている。
  motivation: 失われたはずの星座の記憶を取り戻し、その記憶にまつわる「誰か」への想いに区切りをつけたい。
  relationships:
  - name: 栞
    relation: 自分の記憶に寄り添ってくれた、唯一の理解者
  arc: 過去の記憶に囚われていた状態から、思い出を「抱えたまま」明日へ進む勇気を持つ。
- name: ルナ
  role: 脇役/導き手
  age: 30
  gender: 女性
  appearance: 夜空のような深い紺色のドレスを纏い、耳には星の形をしたピアスをしている。年齢不詳で、ミステリアスな微笑みを絶やさない。
  personality: 奔放で茶目っ気があるが、記憶の本質を見抜く鋭い洞察力を持つ。一人称は「私」。
  speech_style: 芝居がかった大げさな言い回しを好むが、核心を突くときは静かで説得力のある話し方になる。
  background: 記憶の市場全体を管理する店主。多くの記憶を扱ってきたため、人間の心の機微に精通している。栞を調律師として育てた。
  motivation: 記憶の市場に訪れる人々が、納得して記憶を手放したり、あるいは抱え直したりする様子を眺めること。
  relationships:
  - name: 栞
    relation: 弟子であり、娘のように可愛がっている
  - name: ハル
    relation: 興味深い客として観察している
  arc: 大きな変化はないが、栞とハルの関係を通じて、記憶の「不完全さ」こそが美しさであるという答えを提示する。
- name: 間田 (まんだ)
  role: 脇役
  age: 65
  gender: 男性
  appearance: 丸い眼鏡に、使い古されたツイードのジャケット。いつも懐中時計を持ち歩いている温和な老人。
  personality: 楽観的で懐が深く、若者の悩みを聞くのが好き。一人称は「私」。
  speech_style: ゆっくりとした、包容力のある語り口。時折、クスリと笑いながら話す。
  background: 記憶の市場の常連客。亡き妻との思い出を「劣化させないため」ではなく、「時々新鮮に思い出すため」に調律に訪れる。
  motivation: 過去を懐かしむことで、現在の自分を肯定して生きること。
  relationships:
  - name: 栞
    relation: 信頼している腕の良い調律師
  arc: 彼自身の在り方が、ハルにとっての「記憶との正しい付き合い方」のヒントとなり、物語のテーマを補完する。
