title: 星屑の記憶と、銀色の図鑑
genre: 日常ほのぼの
tone: 甘くて切なく、心がじんわり温まるような雰囲気
pov: 一人称（わたし）
tense: 過去形
setting: 現代の片隅にある、夜になるとひっそりと開く不思議な街の路地裏
premise: 大切な思い出を「記憶の結晶」として売り買いできる、不思議な市場。わたしはそこで、誰かの忘れ去られた記憶を整理する「記憶の調律師」として働いています。ある日、一人の青年が、色あせた古い星図だけを持って店を訪れました。彼の瞳に映るのは、失ったはずの、けれど忘れられない夜空の輝きでした。
themes:
- 忘れたくない記憶
- 失ったあとの新しい愛し方
rules:
- 記憶を売ると、その出来事に関する感情だけが完全に消失する
- 記憶は星図のような美しい模様を持つ結晶として可視化される
- 市場は特定の月の満ち欠けの夜にしか現れない
plot_outline:
- '序盤: 記憶の市場で調律師として働く「わたし」の穏やかな日常と、星図を持った青年・ハルとの出会い。'
- '中盤: ハルが探しているのは、かつて二人で見上げた、今はもう存在しない星座の記憶。少しずつ距離を縮める二人。'
- '終盤: ハルの記憶を辿る中で、彼が一番大切だった記憶を、あえて「売らずに」抱え続けてきた理由が明らかになる。'
- '結末: 記憶は消えても、心に残る温度があること。星図を頼りに、新しい思い出を刻み始める二人の姿。'
style_notes: 一人称「わたし」を用い、心の揺れ動く描写を丁寧に。甘くて切ない恋愛のニュアンスを大切にし、語尾はやわらかく。読者の心に余韻を残すよう、各場面の締めくくりは叙情的な表現を心がける。
