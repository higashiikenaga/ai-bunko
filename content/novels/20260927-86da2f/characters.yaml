- name: 湊（みなと）
  role: 主人公
  age: 19
  gender: 男性
  appearance: 痩身で青白い顔立ち。常にどこか心ここにあらずな、空虚な瞳をしている。
  personality: 内向的で思慮深い。喪失感に苛まれている。一人称は「僕」。
  speech_style: 控えめで丁寧だが、切実さが滲み出る話し方。
  background: 烏隠里の若者。数年前の事故で妹を亡くしたはずだが、その記憶だけが抜け落ちており、生活の中で言いようのない違和感と孤独を抱えていた。
  motivation: 欠落した妹の記憶を取り戻し、自分が失った「正体」を突き止めること。
  relationships:
  - name: 鏡の商人
    relation: 記憶を取引する契約相手であり、運命を弄ぶ天敵
  - name: 源蔵
    relation: 村の長老であり、禁忌の情報を教えた導き手
  - name: 栞
    relation: 忘却したはずの最愛の妹
  arc: 記憶を取り戻したいという純粋な願いから、代償として自分という存在を削り取り、最終的に自我を失った「器」へと堕ちる。
- name: 鏡の商人
  role: 敵役/案内人
  age: 不詳（外見は40代前後）
  gender: 不詳（男性的な口調）
  appearance: 古びた着物を纏い、常に大きな手鏡を携えている。口角が不自然に吊り上がった笑みを浮かべている。
  personality: 慇懃無礼で狡猾。人間の絶望を娯楽として楽しむ。一人称は「私」。
  speech_style: 芝居がかった、なよなよとした丁寧語。
  background: 鏡市を管理する怪異。村人が切り捨てた記憶を収集し、それを餌に鏡の世界を維持している。
  motivation: 湊から「自分自身」という最も価値のある記憶を奪い、完璧なコレクションに加えること。
  relationships:
  - name: 湊
    relation: 最高の獲物であり、弄ぶ対象
  arc: 物語を通じて湊を精神的に追い詰め、彼を人間から「鏡の住人（道具）」へと変貌させる。
- name: 源蔵（げんぞう）
  role: 脇役/黒幕
  age: 74
  gender: 男性
  appearance: 深く刻まれた皺と、濁った片目を持つ老人。村の伝統的な装束を着用している。
  personality: 厳格で現実主義。村の平穏を何よりも優先する冷徹さを持つ。一人称は「わし」。
  speech_style: 古風で威圧的な、村の権力者としての口調。
  background: 烏隠里の長老。鏡市に記憶を捧げることで村に災厄が起きないよう管理する儀式の執行者。
  motivation: 村の因習を維持し、次世代の「犠牲者（器）」を鏡市へ送り込むこと。
  relationships:
  - name: 湊
    relation: 村の平穏のために生贄として捧げる対象
  arc: 湊に親切な助言を装いながら、彼を逃げられない破滅へと誘導する。
- name: 栞（しおり）
  role: 物語の鍵/動機
  age: 14（事故当時の年齢）
  gender: 女性
  appearance: 白いワンピースを纏い、髪を長く伸ばした少女。鏡の中では輪郭がぼやけている。
  personality: 献身的で寂しがり屋。湊への深い愛情を持つ。
  speech_style: 囁くような、儚く断片的な話し方。
  background: 湊の妹。過去の事故で命を落としたが、その記憶が鏡市に囚われており、湊を呼び寄せようとしていた。
  motivation: 兄に自分を思い出してもらい、共に消滅すること。
  relationships:
  - name: 湊
    relation: 最愛の兄
  arc: 記憶としてのみ存在していたが、湊が記憶を取り戻すことで一時的に顕現し、彼を絶望的な結末へと導く。
