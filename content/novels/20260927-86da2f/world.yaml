title: 殯の鏡市（もがりのかがみいち）
genre: ホラー
tone: 静謐で湿り気を帯びた、逃げ場のない土着的な恐怖
pov: 三人称
tense: 過去形
setting: 現代、地図に載らない山間の集落「烏隠里（からすびさと）」
premise: 山に囲まれた烏隠里には、数年に一度、霧の夜にだけ開く「記憶を売る市場」の伝承がある。村の若者たちは、不吉な出来事を忘れるために、あるいは大切な記憶を糧にするために、その市場へと足を運ぶ。しかし、鏡を媒介にして記憶を取引する代償は、己の魂の輪郭を少しずつ削り取っていくことだった。村に伝わる禁忌を破り、鏡の市場へ迷い込んだ主人公は、そこに蠢く「何か」の正体に直面する。
themes:
- 忘却による救済と代償
- 因習という名の呪い
- 自己の消失
rules:
- 記憶を売る際は、鏡に映った自分の顔を直視しながら、売る記憶を言葉にしなければならない
- 市場で取引された記憶は、物理的な形を持たないが、所有者の精神に直接的な欠落を生む
- 村の境界にある古い鏡を割ることは、村の守護神（あるいは災厄）を解き放つ禁忌とされる
plot_outline:
- '序盤: 村の若者・湊は、事故で妹の存在を忘れてしまった自分に違和感を抱き、村の長老から「鏡市」の噂を聞かされる。不吉な予感に震えながらも、彼は妹を取り戻すために、霧の夜に禁じられた山道へと足を踏み入れる。'
- '中盤: 霧の向こうに現れたのは、無数の鏡が立ち並ぶ異様な市場だった。湊は記憶を扱う商人たちと出会い、妹の記憶を買い戻そうとするが、商人は「代わりの記憶」を提示する。湊は鏡の中に、自分とは異なる歪んだ貌をした「何か」が潜んでいることに気づき始める。'
- '終盤: 記憶を買い戻そうとするたびに、湊の身体は透け始め、現実との繋がりが希薄になっていく。彼は、村の祭りが実は「記憶を捧げて村の平穏を保つ儀式」であったこと、そして鏡市は村の因習が生んだ怪異であることを知る。'
- '結末: 湊は妹の記憶を取り戻すが、引き換えに「自分自身」という概念を鏡の中に置いてきてしまう。霧が晴れた後、村には以前と変わらぬ平穏が戻るが、湊の瞳からは光が消え、彼はただの「器」として村の祭りの道具へと成り果てる。'
style_notes: 湿った土の匂いや、霧の冷たさを感じさせる描写を重視する。方言（「〜じゃろう」「〜しとる」等）を混ぜ、村の閉鎖性を強調する。恐怖を直接的に描くのではなく、静かな日常がじわじわと侵食されていく様子を、鏡の反射や影の動きを通して叙情的に、かつ不気味に描写すること。
