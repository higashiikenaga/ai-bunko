- name: 海乃（うみの）
  role: 主人公
  age: 19
  gender: 女性
  appearance: 栗色のショートボブに、お菓子の袋がたくさんついた大きなエプロンを着用。いつも好奇心いっぱいに目を輝かせている。
  personality: 天真爛漫で前向き。甘いものに目がなく、人の幸せを願う優しい心を持つ。一人称は「あたし」。
  speech_style: 元気で快活な口調。語尾に「〜だよ！」「〜かな？」とつく、弾むような話し方。
  background: 都会での生活に疲れ、導かれるようにこの海辺の町へやってきた。時計修理の知識はまだ浅いが、味覚と嗅覚に非常に鋭い才能がある。
  motivation: 止まった時計を動かすための「最高の味」を見つけ出し、店を訪れる人々の心を癒やすこと。
  relationships:
  - name: 静久
    relation: 雇い主であり、師匠のような存在
  - name: 美奈
    relation: お菓子作りの助っ人で、親友のようなライバル
  arc: 単なる助手から、相手の心に寄り添うことで「思い出の味」を導き出せる真の時計屋助手へと成長する。
- name: 静久（しずく）
  role: 相棒/導き手
  age: 42
  gender: 男性
  appearance: 銀縁の眼鏡をかけ、常に清潔感のあるベストを着用。細い指先が特徴的な、物静かな佇まいの男性。
  personality: 冷静沈着でミステリアス。一見冷たく見えるが、実は情に厚く、時計と持ち主の絆を誰よりも大切にしている。一人称は「私」。
  speech_style: 丁寧で静かな口調。含みを持たせた言い回しをすることが多い。
  background: 代々灯台と共に時計店を営む一族の継承者。時計が「感情」で止まる現象を修理できる特殊な技術を持つ。
  motivation: 町の記憶を司る時計たちを適切に管理し、人々の時間が心地よく流れるようにすること。
  relationships:
  - name: 海乃
    relation: 賑やかすぎるが、信頼している助手
  - name: 一ノ瀬
    relation: 長年の付き合いがある顧客
  arc: 海乃の天真爛漫さに触れ、効率や技術だけでなく、感情に寄り添うことの温かさを再確認する。
- name: 一ノ瀬（いちのせ）
  role: 脇役/ゲスト
  age: 76
  gender: 男性
  appearance: 使い込まれたベージュのカーディガンを羽織った、背中の少し丸まった穏やかな老人。
  personality: 控えめで心優しい。亡き妻への深い愛情を抱え続けており、思い出を大切にしている。一人称は「私」。
  speech_style: ゆっくりとした、たどたどしくも温かみのある話し方。
  background: かつてこの町で妻と幸せに暮らしていた。ある日、妻と交わした「ある約束」を機に止まってしまった懐中時計を大切に持っている。
  motivation: 妻との約束の味を思い出し、止まったままの懐中時計を再び動かして、心の区切りをつけること。
  relationships:
  - name: 静久
    relation: 信頼して時計を預けている修理師
  - name: 海乃
    relation: 自分の思い出に親身になってくれる娘のような存在
  arc: 止まった時計が動き出すことで、過去への執着から解放され、前向きに明日へ歩き出す勇気を得る。
- name: 美奈（みな）
  role: 脇役/サポート
  age: 25
  gender: 女性
  appearance: 明るい茶髪を高くまとめ、小麦色の肌をした快活な女性。常にバニラの甘い香りを纏っている。
  personality: 完璧主義で自信家だが、実は非常に面倒見が良い。お菓子作りに関しては妥協を許さない職人気質。一人称は「私」。
  speech_style: ハキハキとした自信満々な口調。「あんた、もっとこうしなさいよ！」と指導しがち。
  background: 町で評判のパティスリーを営む若き店主。海乃の「味への嗅覚」を認めており、時に厳しく、時に優しく指導する。
  motivation: 誰の心にも届く「究極のスイーツ」を完成させること。
  relationships:
  - name: 海乃
    relation: 弟子のような、あるいは可愛い後輩のような存在
  - name: 静久
    relation: 互いの専門領域を尊重し合う知人
  arc: レシピ通りではない「記憶を呼び覚ます味」という概念に触れ、お菓子作りの新たな地平を見つける。
