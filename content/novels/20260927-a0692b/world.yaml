title: おかしな灯台の時計屋さん：止まった時を、甘い香りで動かす話
genre: 日常ほのぼの
tone: 明るく軽快で、どこか温かい雰囲気
pov: 一人称（あたし）
tense: 現在形・過去形混在
setting: 現代の日本の片隅、海沿いにある小さな町と、古い灯台に併設された不思議な時計修理店
premise: あたしは、海辺の古い灯台の麓で、壊れた懐中時計を直す「おかしな時計屋さん」の助手！ 持ち込まれるのは、持ち主の思い出が詰まった不思議な時計ばかり。修理のコツは、時計の傷を癒やすための「美味しいお菓子」を用意すること。今日も今日とて、止まった時間を動かすために、甘い香りに包まれながら奮闘中！
themes:
- 大切な思い出との再会
- 日常の中の小さな幸せ
rules:
- 時計を直すには、持ち主が一番幸せだった瞬間の味を再現したお菓子が必要
- 古い灯台は、街の記憶を灯す役割を持っており、時折不思議な現象を引き起こす
plot_outline:
- '序盤: 灯台の麓の時計屋で、助手として働くあたしの賑やかな日常。壊れた懐中時計を持った、少し寂しげなおじいさんが訪れる。'
- '中盤: 懐中時計が止まった理由が、亡き妻との約束だったと判明。約束の味を再現するために、町中のスイーツを巡る大騒動が始まる。'
- '終盤: 完璧な味の焼き菓子を作り上げ、懐中時計を修理。時計が動き出すと同時に、灯台の光が優しく街を照らす。'
- '結末: おじいさんは笑顔で去り、あたしはまた新しい「美味しい問題」に挑むべく、おやつを頬張る。'
style_notes: 一人称「あたし」による、テンポのよいツッコミ混じりの語り。食べ物の描写（焼き立てのクッキーの香りや、チョコの口溶けなど）は、読者の食欲をそそるほど美味しそうに書くこと。毎話、キャラクターのちょっとしたドジや食いしん坊な一面を描き、クスッと笑えるポイントを必ず入れる。
