- name: 蓮崎 蓮（れんざき れん）
  role: 主人公
  age: 25
  gender: 男性
  appearance: 色白で整った顔立ちだが、生気が乏しい。常に隙のない管理官の制服を着用している。
  personality: 冷静沈着で論理的。感情を「不純物」として忌避してきたが、内側に強い好奇心を秘めている。一人称は「僕」。
  speech_style: 事務的で抑揚のない、正確な敬語。
  background: 都市エイドスの心拍管理官。市民のバイタルデータを監視し、異常値を検知して排除するエリート職に就いている。
  motivation: 折れた剣に触れて覚醒した「未知の衝動」の正体を突き止め、数値化できない自分自身を取り戻すこと。
  relationships:
  - name: セラ
    relation: 上司・監視対象
  - name: 海斗
    relation: 同僚・親友
  - name: ライラ
    relation: 運命を共にする導き手
  arc: 管理システムの完璧な歯車から、不完全で、しかし強烈な生を求める「人間」へと変貌する。
- name: セラ
  role: 敵役
  age: 45
  gender: 女性
  appearance: 銀髪を完璧にまとめ上げ、一切の乱れがない制服を纏う。瞳はデータスキャナーのように鋭い。
  personality: 徹底した合理主義者。秩序こそが人類の生存条件だと信じ、感情を生物学的なエラーと断じる。一人称は「私」。
  speech_style: 断定的で、慈悲の欠片もない冷徹な口調。
  background: エイドスの心拍管理システムの設計責任者であり、都市の治安維持における最高権力者。
  motivation: 社会の「不純物」を完全に排除し、計算可能な完璧な静寂を維持すること。
  relationships:
  - name: 蓮崎 蓮
    relation: 逸脱者・排除対象
  arc: 揺るぎない秩序の象徴として、主人公の自由を阻む絶対的な壁として立ちはだかる。
- name: ライラ
  role: 相棒
  age: 19
  gender: 女性
  appearance: 廃棄区画の汚れが染み付いた衣服。瞳には管理社会には存在しない、野生的な輝きが宿る。
  personality: 直感的で奔放。規律よりも生命の躍動を尊ぶ、自由な精神の持ち主。一人称は「あたし」。
  speech_style: 抑揚が激しく、リズム感のある、生々しい言葉遣い。
  background: 廃棄区画で古の遺物を回収して暮らす、社会の枠外に生きる少女。
  motivation: かつての文明が遺した「叫び」の真実を探り当て、世界が隠している真実を暴くこと。
  relationships:
  - name: 蓮崎 蓮
    relation: 共鳴者・導き手
  arc: 主人公に「数値化できない価値」を教え、彼を管理社会の最果てへと突き動かす。
- name: 海斗（かいと）
  role: 脇役
  age: 25
  gender: 男性
  appearance: 極めて平均的で、目立たない外見。常に安定した心拍数を示すデバイスを装着している。
  personality: 保守的で、システムの安定に依存している。変化を極端に恐れる。一人称は「俺」。
  speech_style: 標準的で、波風を立てない穏やかで安全な話し方。
  background: 蓮崎の同僚。管理社会の恩恵を享受し、平穏な生活を送ることに満足している。
  motivation: 管理階級を昇り詰め、より安定した、数値化された幸福を享受すること。
  relationships:
  - name: 蓮崎 蓮
    relation: かつての親友
  arc: システムに順応し続けることで、逸脱していく主人公の孤独と決意を際立たせる対照的な存在。
