title: 規格外の呼吸
genre: SF
tone: 静謐な絶望と、無機質な管理社会の不気味さ
pov: 三人称
tense: 過去形
setting: 全ての生理機能が数値化され、管理される都市「エイドス」
premise: 呼吸数と心拍数によって市民の「価値」が決定される世界。感情の昂ぶりは「不純物」として処罰の対象となり、最適化された静寂が強制される。心拍管理官の青年は、廃棄区画で一本の「折れた剣」を拾い、数値化できない衝動に目覚めていく。彼は管理社会の最果てへ向かう「最終列車」に乗り込み、禁じられた呼吸を追い求める。
themes:
- 個の尊厳
- 管理への静かな抵抗
rules:
- 呼吸回数と心拍数は常に監視され、規定値を超えると鎮静剤が自動投与される
- 感情の表出は『機能不全』と定義され、矯正施設への送致対象となる
- 都市の外縁へ向かう列車は、処刑または廃棄済みの人間のみが利用できる
plot_outline:
- '序盤: 主人公が心拍管理官として淡々と市民を監視する日常と、廃棄物の中から古の遺物である『折れた剣』を発見し、心拍数が微増し始める様子を描く。'
- '中盤: 剣に触れることで得られる『怒り』や『悲しみ』という未知の感覚に耽溺し、管理システムの監視を潜り抜けるための小さな嘘と偽装を繰り返す。'
- '終盤: 自身の逸脱が発覚し、社会的な死を宣告される。彼は抵抗の意志を込めて、都市から追放される者が乗る『最終列車』に自ら乗り込むことを選択する。'
- '結末: 列車の終着駅で、かつての文明が遺した『叫び』の跡を見つける。彼は折れた剣を握りしめ、管理されない最初の一呼吸を深く吸い込む。'
style_notes: 感情的な形容詞を極力排除し、事務的な報告書のような淡々とした記述を徹底する。「効率こそが至上の愛である」などの標語を挿入し、個人の感情がシステムに塗り潰される様子を冷徹に描く。
