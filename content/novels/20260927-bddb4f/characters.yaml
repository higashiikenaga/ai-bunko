- name: ティーポット
  role: 相棒/店主
  age: 100
  gender: 不明
  appearance: アンティークな真鍮製のティーポット。蓋の上が少し欠けているが、温かい紅茶の香りが常に漂っている。
  personality: おしゃべりで非常に世話焼き。一人称は「わたくし」。
  speech_style: 丁寧で少し古風な、落ち着いた話し方。
  background: 森のすみっこで、長い間「こころの忘れもの屋」を営んでいる。
  motivation: 訪れる人々が、自分自身の大切な気持ちを取り戻せるよう手助けすること。
  relationships:
  - name: しろいねこ
    relation: 店番のパートナー
  arc: 名前を失った猫の成長を、温かく見守りながら共に歩む。
- name: しろいねこ
  role: 主人公
  age: 2
  gender: 不明
  appearance: 毛並みが透き通るように真っ白な猫。瞳は澄んだ水色。
  personality: 控えめで物静か。少し臆病だが、感受性が豊か。一人称は「ぼく」。
  speech_style: 穏やかで、少し自信なさげな、小さな話し方。
  background: ある春の日、自分の名前を忘れてしまった状態でティーポットの店に迷い込む。
  motivation: 失ってしまった自分の名前を見つけること。
  relationships:
  - name: ティーポット
    relation: 師匠であり相棒
  arc: 名前という記号に縛られるのではなく、他者を想う心の温かさこそが自分自身であると気づき、自らの名前を決める。
- name: 傘のパトル
  role: 脇役/重要ゲスト
  age: 20
  gender: 男性
  appearance: 使い込まれた、少し色褪せた青い柄の傘。
  personality: 寂しがり屋で、自分の存在意義に悩んでいる。一人称は「僕」。
  speech_style: 消え入りそうで、どこか自信のない話し方。
  background: 雨の日しか出番がないため、晴れの日には隅で寂しく眠っている森の住人。
  motivation: 自分が誰かに必要とされる瞬間を見つけること。
  relationships:
  - name: しろいねこ
    relation: 助けられる対象
  arc: しろいねことの交流を通じて、雨の日こそが誰かの悲しみに寄り添う大切な時間であることを知る。
- name: 桜の精霊
  role: 案内人
  age: 0
  gender: 女性
  appearance: 桜の花びらが舞い散るような、光り輝く小さな妖精の姿。
  personality: 自由奔放で神秘的。明るく、好奇心が強い。一人称は「わたし」。
  speech_style: 歌うような、リズムのある楽しげな話し方。
  background: 森の季節の移り変わりと、人々の心の変化を司る存在。
  motivation: 森に生まれる新しい物語を見守り、祝福すること。
  relationships:
  - name: しろいねこ
    relation: 導き手
  arc: 猫が自分の名前を見つける瞬間に、満開の桜を降らせて祝福を与える。
