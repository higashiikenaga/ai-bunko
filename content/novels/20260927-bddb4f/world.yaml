title: おはなと、なまえのないねこと、おしゃべりなティーポット
genre: 日常ほのぼの
tone: ぽかぽかとした、優しい語り口
pov: 三人称
tense: 過去形
setting: 森のすみっこにある「こころの忘れもの屋」
premise: 森のすみっこで、おしゃべりなティーポットさんが「こころの忘れもの屋」を開いています。ある春の日、自分の名前を忘れてしまった、真っ白な猫さんがやってきました。二人は、森の仲間たちがなくした「大切な気持ち」を一緒に探しに行きます。桜の花びらが舞うなかで、ゆっくりと自分だけの名前を見つける物語です。
themes:
- 自分らしさ
- 小さな親切
rules:
- 道具や動物はすべて言葉を話すことができる
- 「こころの忘れもの」が見つかると、どこからか桜の花びらが一枚舞い降りる
- 急がず、ゆっくりと時間を過ごすことが美徳とされる世界
plot_outline:
- '序盤: ティーポットさんが営む店に、自分の名前を忘れてしまった真っ白な猫が迷い込んでくる。猫は名前がないことに少し寂しさを感じていた。'
- '中盤: 二人は、自信をなくしたリスさんや、雨の日以外は出番がない寂しがり屋の傘さんなど、心をどこかに置き忘れた森の住人たちを助けて回る。'
- '終盤: 他の人を幸せにするお手伝いをするうちに、猫さんは自分の内側にある「誰かを想う温かさ」に気づき、名前よりも大切なものがあることを知る。'
- '結末: 桜が満開になる頃、猫さんは自分にぴったりの名前を自分で決め、ティーポットさんと共に「忘れもの屋」の店番として楽しく暮らすことになる。'
style_notes: 児童文学のような、ひらがなを多めに使ったやわらかい文体。読者に語りかけるような「〜ですね」「〜ですよ」という丁寧な口調を徹底してください。難しい言葉は使わず、日常の小さな幸せを丁寧に描写し、毎話「相手を思いやること」などの小さな教訓をさりげなく添えてください。
