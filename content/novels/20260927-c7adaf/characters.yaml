- name: 瀬戸 遥希
  role: 主人公
  age: 24
  gender: 男性
  appearance: 都会的な身なりだが、疲れ切った表情。色白で線が細く、神経質な印象を与える。
  personality: 理性的で懐疑的だが、内面に強い孤独感を抱えている。一人称は「僕」。
  speech_style: 丁寧だがどこか距離を置いた話し方。困惑すると言葉に詰まる癖がある。
  background: 大学卒業後、東京で就職したが心身を病み休職中。祖母の訃報を受け、数年ぶりに故郷の村へ戻る。
  motivation: 祖母が隠していた秘密を解き明かし、自分自身の心の空白を埋めたい。
  relationships:
  - name: 瀬戸 徳三
    relation: 大叔父。村の禁忌を説く警告者。
  - name: 霧島 澪
    relation: 幼馴染。唯一、村の中で気兼ねなく話せる相手。
  - name: 瀬戸 志津
    relation: 亡き祖母。鏡の中に姿を現す。
  arc: 理性的な不信感から、次第に不可解な現象に飲み込まれ、最終的に鏡の向こう側の理（ことわり）に囚われる。
- name: 瀬戸 徳三
  role: 脇役/警告者
  age: 78
  gender: 男性
  appearance: 深く刻まれた皺と、濁った瞳。常に古い煙草の匂いと線香の香りを纏っている。
  personality: 頑固で厳格。村の伝統を絶対視しており、外からの影響を極端に嫌う。一人称は「わし」。
  speech_style: ぶっきらぼうな北国の訛り。断定的な口調で相手を威圧する。
  background: 村の長老の一人であり、「渡り鳥の凪」の儀式的な管理を担ってきた人物。
  motivation: 遥希に鏡を触らせず、村の平穏（あるいは均衡）を維持すること。
  relationships:
  - name: 瀬戸 遥希
    relation: 血縁だが、都会の価値観を持つ彼を危うい存在と考えている。
  arc: 遥希を止めようと奔走するが、結局は抗えない運命の連鎖を目の当たりにし、絶望する。
- name: 霧島 澪
  role: 相棒/目撃者
  age: 24
  gender: 女性
  appearance: 実用的で地味な作業着。日に焼けた肌と、意志の強そうな鋭い眼差し。
  personality: 現実主義でサバサバしているが、情に厚い。村の閉鎖性に疑問を抱いている。一人称は「私」。
  speech_style: 率直で飾り気のない話し方。時折、都会へ出た遥希への羨望が混じる。
  background: 村に残り、家業の農作業を手伝っている。子供の頃に鏡にまつわる不可解な事件を目撃した経験がある。
  motivation: 遥希を村の異常な風習から救い出し、一緒に外の世界へ出ること。
  relationships:
  - name: 瀬戸 遥希
    relation: 幼馴染。再会して、彼の中に潜む危うさに惹かれている。
  arc: 迷信だと思っていた村の伝承が現実となる恐怖を体験し、生き残った者としての喪失感を背負う。
- name: 瀬戸 志津
  role: 敵役/触媒
  age: 72
  gender: 女性
  appearance: 生前は穏やかな老婆だったが、鏡の中では肌が濡れた土のように黒ずみ、指先が鳥の爪のように鋭くなっている。
  personality: 慈愛に満ちた祖母の面と、獲物を誘い込む捕食者の面を併せ持つ。
  speech_style: 囁くような、耳元で羽ばたく音に混じる静かな話し方。
  background: かつて鏡の管理者に選ばれ、その代償として「鏡の向こう側」に魂を半分奪われた人物。
  motivation: 鏡の向こう側の世界へ、自分の身代わりとなる血縁者（遥希）を引き込むこと。
  relationships:
  - name: 瀬戸 遥希
    relation: 最愛の孫であり、同時に絶好の生贄。
  arc: 遥希の記憶と情愛を利用して、彼を精神的に追い詰め、物理的に鏡の中へ誘い出す。
