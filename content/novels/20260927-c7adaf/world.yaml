title: 鴉渡しの鏡窓
genre: 怪談・民俗
tone: 湿り気を帯びた、静謐で不吉な和風ホラー
pov: 三人称
tense: 過去形
setting: 現代、北国の山間の廃村に近い集落。常に霧が立ち込め、湿った土と古い木材の匂いが漂う。
premise: 山間の集落に伝わる「渡り鳥の凪」と呼ばれる奇妙な風習。年に一度、渡り鳥が渡る季節になると、村の者は鏡をすべて布で覆い、家の戸を固く閉ざす。都会から帰郷した青年は、亡き祖母の遺品の中に、歪な形状をした古い手鏡を見つける。鏡を拭いた瞬間、彼は聞こえてはならない「羽ばたき」の音と、濡れた土の匂いに包まれる。鏡の向こう側に潜む「何か」が、鳥の群れと共に、静かに村を侵食し始める。
themes:
- 血縁の呪縛
- 境界線の消失
rules:
- 鏡は「異界との窓」であり、映るものは実体ではなく、そこに潜む存在の依代となる
- 渡り鳥の渡りの時期、鏡の面が湿り気を帯びたとき、境界が薄れる
- 音を立てれば、視覚ではなく聴覚を通じて怪異が接近する
plot_outline:
- '序盤: 祖母の葬儀を終え、帰郷した主人公。村の異様な静けさと、鏡を隠す風習に違和感を覚える。蔵で見つけた古い鏡を手に取ったとき、耳の奥で微かな羽音が響く。'
- '中盤: 鏡を拭くたびに、部屋に濡れた泥の匂いが立ち込め、鏡の表面に「鳥の足跡」のようなものが浮かび上がる。村の老人たちは、渡り鳥が来る日は決して鏡を見てはならんと警告するが、主人公は鏡の中に、死んだはずの祖母の影を見る。'
- '終末: 渡りの夜、空を覆い尽くすほどの大群れが飛来し、村は鳥の羽ばたきと鳴き声に包まれる。鏡の中から、湿った何かが這い出してくる音が響き、主人公は鏡の中に吸い込まれるかのような感覚に陥る。'
- '結末: 翌朝、村は静まり返り、霧だけが立ち込めている。鏡は元の場所にあり、何も映していない。しかし、鏡の表面には、拭っても取れない「濡れた羽」が一つだけ、静かに張り付いていた。'
style_notes: 湿り気のある、重苦しい文体。恐怖の対象を直接描かず、濡れた土の匂い、羽が擦れる音、衣擦れの音、そして鏡の表面が曇っていく様を描写することで、読者の想像力を煽る。会話には山間の訛りを混ぜ、日常の裏側に潜む異質さを演出する。
