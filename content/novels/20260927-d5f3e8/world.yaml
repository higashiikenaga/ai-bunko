genre: 特別企画
tone: 気品と陰りのある王宮ロマンス。静かな心理描写と、政治・魔導科学の緊張感
pov: 三人称。主にアートラーの視点、ときにルナ・セレスティアの視点に寄る
tense: 過去形
setting: 魔法と科学が共存する架空世界。大陸西方のハルバード王国は古い魔法の伝統を持つが、魔法と科学の融合(魔導科学)は発展途上。 海の向こうの島国タイン共和国は商業・航海・医療・工学が進み、分野によっては王国より先を行く。
  王国には、滅びた古代文明が遺した魔導遺構が点在している。
rules:
- 魔法は「魔素」を体内で編む技術。貴族ほど魔素が強い傾向がある。科学と組み合わせた魔導機関は研究途上で、暴走の危険がある
- 王都地下には古代文明の遺構「白の天蓋(しろのてんがい)」が眠る。起動すると大陸中の人々を魔素ごと眠りに沈め、世界を「白紙に戻す」と伝わる
- ルナの人類滅亡計画は「白の天蓋」を起動する計画(黄昏計画)。協力者は宮廷魔導学者ヴィクトル・ケイン
- ルナは結婚前、自分の手で計画の記憶を封じる魔法をかけた(罪の意識なくアートラーを愛するため)。計画自体は時限式で進み続けていた
- 処刑の瞬間、「白の天蓋」の残滓がルナに呪い「贖いの眠り」をかける。彼女は石の眠りの中で、自分が奪おうとした人々の生と痛みを長い年月をかけて見続け、三年後に目覚める
- 蘇ったルナは法の上ではすでに死者。名を伏せ、ファーバー家の縁者「ルーナ」として生きる
- 王国では王族・貴族の結婚は政治であり、家同士の同盟と外交を意味する
- タイン共和国は身分より契約と実績を重んじる。女性の商会長や医師も多い
premise: 数年後。タイン共和国の港町で、28歳のルナは娘ルリを育てながら、交易と医療で町を支えていた。 一方、アートラーと結ばれたセレスティアは、子に恵まれない焦りを抱えていた。ファーバー家の次期当主として王国へ戻ったルナが差し出したのは、世界を救う技術だった。
themes:
- 愛することと、相手の人生を所有することの違い
- 罪と贖罪。過去の罪を背負った人間に、やり直す権利はあるのか
- 正しさと執着
- 家族としての絆
- 魔法と科学、国と国の交流
style_notes: 抑制の効いた気品ある文体。感情は仕草・沈黙・視線で語らせる。王宮の儀礼や外交の言葉づかいに重みを持たせる。
title: 世界滅亡と魔法と科学的な恋 III ―Epilogue―
plot_outline:
- '第1話: タイン共和国の港町エルム。28歳のルナは商会をまとめ、娘ルリと暮らしている。朝市の喧騒、潮の匂い、帳簿と診療所。「元・世界滅亡計画の黒幕」だった女は、町では「銀の商会長」と呼ばれている。'
- '第2話: ルリはタインの疫病で家族を失い、ルナに引き取られた子。夜、ルリに「お母さまの昔のお話」をせがまれ、ルナは言葉を選びながら「悪いことをした王妃の話」を語る。家族としての絆を丁寧に描く。'
- '第3話: ルナは医師ミナ・ホルストや技術者たちを町に招き、診療所と工房を開いている。魔素医学と工学を組み合わせた治療の現場。ルナは「償い」ではなく「今ここにいる人のため」に働くようになった自分に気づく。'
- '第4話: 一方ハルバード王国。王となったアートラーと王妃セレスティア。セレスティアは子に恵まれず、宮廷の視線と後継者問題に追い詰められていく。アートラーの気遣いさえ、彼女には「正しくない自分」を責める声に聞こえる。'
- '第5話: ファーバー家当主が病に倒れ、次期当主としてルナに王国へ戻るよう手紙が届く。ルナはルリの手を握り、戻ることを決める。かつて世界を壊そうとした国へ、今度は何を持ち帰るのか。'
- '第6話: ルナは交易使節団を率いて王国へ戻る。王宮での再会。アートラーとセレスティアを前に、ルナは臣下の礼をとる。三人の間に流れる年月の重さ。ルリは王宮の庭で無邪気に走り回る。'
- '第7話: 使節団の医師ミナが、セレスティアの不調が「魔素循環症」という治療可能な病であると見抜く。ルナの差し出した治療を、セレスティアは「あなたの施しは受けない」と拒む。'
- '第8話: アートラーの説得で、セレスティアは治療を受け入れる。回復の兆しが見えても、セレスティアの心は晴れない。「私が正しかったはずなのに、なぜ救うのはあの人なの」。彼女の執着が静かに育っていく。'
- '第9話: ルナの使節団は、タインの進んだ魔導科学(魔素灯の送電網、船の魔導機関、医学)を王国に提供する。かつて世界を壊そうとした女が、世界を救う側に立つ皮肉と重さ。貴族たちの評価も割れる。'
- '第10話: アートラーとルナが、技術交流の式典のあとに二人きりで話す。昔の感情が一瞬よみがえるが、ルナは穏やかに線を引く。「あなたがいなくても、わたくしは誰かを守って生きていけます」。アートラーは初めて、その言葉を祝福として受け取る。'
- '第11話: セレスティアは二人の会話を遠くから見てしまう。彼女は「正しさ」の名の下に、ルナを排除する理由を探し始める。側近に、ファーバー家の過去の記録を洗わせる。'
- '第12話: 【暗殺未遂】王宮の晩餐会で、セレスティアはルナの杯に毒を仕込ませる。気づいたミナとルリのひと言で計画は失敗する。残酷な描写はせず、杯が床に落ちる音と、凍りついた広間の沈黙で描く。'
- '第13話: セレスティアは罪を認める。「私は正しい愛を選んだはずでした」。国外追放が決まる。ルナは彼女を罰せよとは言わない。「もう誰かを消すことで、自分の居場所を守る必要はないのです」。セレスティアの転落を、悪人の末路ではなく悲劇として描く。'
- '第14話: 追放の日。ルナとセレスティアが最後に言葉を交わす。互いの「愛」の答えがどう違ったのかを、二人はようやく理解する。アートラーはセレスティアを見送り、自分が二人の女性の人生を決めようとしていたことに気づく。'
- '第15話: 【第3部・シリーズ結末】ルナはファーバー家の当主として王国とタインを結び、ルリとともに港へ帰る。アートラーは王として一人で立つ。「誰かに愛されること」と「誰かの人生を所有すること」は違うと知った三人が、それぞれの選択を背負って生きていく。海と灯りの情景で静かに締める。'
