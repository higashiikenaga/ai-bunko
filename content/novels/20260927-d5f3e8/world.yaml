policy: '- 全年齢向け。露骨な性的描写は書かない。恋愛は会話・視線・距離感・手を取る・抱擁・別れで表す。

  - 残虐な場面は直接描かず、結果・心理・余韻で表す。流血や拷問の細部は書かない。

  - 原作(架空の美少女ゲーム三部作)のダークな雰囲気は残す。軽いコメディにしない。

  - 政治・魔法・科学・恋愛を同じ世界の中で自然に混ぜる。設定を地の文でまとめて説明しない。

  - ルナを「ツンデレ」「ヤンデレ」「悪役令嬢」の型にしない。悪いことをした事実ははっきり書き、彼女の感情そのものは否定しない。

  - セレスティアも単純な善人・悪人にしない。二人は「愛すること」に異なる答えを持つ人物として描く。

  - アートラーは軽薄にしない。その時々で本当に相手を想っているが、自分の気持ちを理解するのに時間がかかる人物。

  - 作品全体の問い: 愛とは、相手を自分のものにすることではなく、相手が自分の意思で生きることを認めることなのか。

  '
part_ending: 三人それぞれが、自分の選択の結果を背負って生きていく
series: 全3部作の第3部
previous_parts: '【世界滅亡と魔法と科学的な恋】

  - 第1話: ハルバード王国の王太子アートラーは、大陸の均衡を保つためファーバー家のルナと政略結婚を果たす。ルナは誓いの言葉を「世界を守る」と書き換え、卓越した外交能力で周囲を魅了するが、どこか底知れない冷たさを纏っていた。幼なじみの側近セレスティアは、ルナがアートラーに向ける感情に激しい執着を感じ取る。祝宴の最中、ルナが王都の地下遺構に視線を向けたことで、物語に不穏な影が差す。

  - 第2話: 王都で新婚生活を送るアートラーは、完璧な王妃としての資質を持つ妻ルナに惹かれつつも、そのあまりに合理的な人間操作術に違和感を抱く。ある夜、ルナは記憶の空白にうなされ、正体不明の孤独と絶望に震える姿をアートラーに見せる。彼女の身体に宿る根源的な冷たさと、失われた記憶の謎が浮き彫りとなる。

  - 第3話: 王太子アートラーは、魔導学者が次々と昏睡状態に陥る魔導遺構の調査に赴く。同行した王妃ルナは、専門家ですら解読困難な古代の魔導回路の異常を直感的に見抜いてしまう。調査の結果、遺構内では何者かによって意図的に魔素の暴走が誘発されている疑いが浮上する。ルナは自身の内に溢れ出す未知の知識に恐怖を感じ、アートラーは彼女の抱える謎に予感を得る。

  - 第4話: 魔導遺構での出来事に悩むアートラーは、夜の庭園でルナと再会する。ルナは自分自身の正体への不安と、アートラーへの歪んだ独占欲を吐露する。アートラーは彼女の脆さと狂気に触れ、救いたいという願いと飲み込まれたい誘惑に揺れる。最後にはルナが再び完璧な王妃の仮面を被り、日常へと戻っていく。

  - 第5話: アートラーは遺構の魔導回路の異常を調査し、ヴィクトル博士の講義に出席する。側近のセレスティアから博士の不透明な資金源について警告を受ける中、アートラーは妻ルナと博士の間に不可解な共鳴があることに気づく。完璧な王妃を演じるルナの裏側に潜む正体と、博士との関係に強い不安を抱く。

  - 第6話: 魔素の枯渇に苦しむ北端の村を視察したアートラーとルナは、絶望的な状況にある村人たちと対面する。ルナは自身の魂を分け与えるような特異な魔法で少女に灯火を灯し、それを見たアートラーは彼女への疑念を捨て、愛を深める。しかし、側近のセレスティアはルナの魔法が未来の魔素を前借りする危ういものであることに気づいていた。ルナはアートラーへの愛ゆえに、自らの封印された記憶と残酷な運命を隠し続ける。

  - 第7話: アートラーは側近のセレスティアから、遺構で発生している調査員の昏睡事件と不自然な術式変異に関する報告を受ける。その変異はヴィクトル・ケイン博士の理論と符合しており、王国全体の魔素循環を歪める危険性が示唆されていた。セレスティアは、妻であるルナが持つ危うい光とそれに伴う影を警告し、彼女に近づかないようアートラーに切実に訴える。アートラーはルナへの愛と、世界を壊しかねない予兆の間で激しく葛藤する。

  - 第8話: ルナの誕生日を祝う王宮の祝宴で、王太子妃ルナは夫アートラーに対し強い独占欲を見せる。しかし、王都の地下から天を突く謎の純白の光が放たれた直後、ルナは激しい苦痛に襲われ、不可解な言葉を呟く。意識を取り戻した彼女は再び完璧な淑女を演じるが、アートラーは彼女の内に潜む異質な存在に戦慄する。

  - 第9話: 祝宴での謎の光の後、王妃ルナは宮廷魔導学者ヴィクトルから、自ら記憶を封印したという衝撃的な事実を告げられる。ヴィクトルが残したかつて自身の研究を記した手記を読み、ルナは世界を白紙に戻そうとした狂気的な意志の断片を思い出し始める。混乱するルナのもとに、夫であるアートラーが駆けつけるが、彼女は自らの罪の意識から彼を直視できずにいた。

  - 第10話: ヴィクトルの手記により、ルナはかつて「黄昏計画」を主導していた記憶を取り戻す。その計画は、世界を白紙に戻すことで愛する男を独占しようとする、歪んだ所有欲に基づいたものだった。記憶を封印して「罪なき妻」を演じていたルナだったが、目覚めた彼女の心には、世界を敵に回してでも彼を繋ぎ止めようとする冷徹な決意が宿る。アートラーは彼女の真の姿を知らぬまま、変わらぬ愛を向けている。

  - 第11話: 記憶を取り戻した王太子妃ルナは、かつて世界を破滅させようとした自身の狂気を誇らしく感じていた。彼女は夫アートラーを独占するため、彼を縛る責任や世界そのものを消し去ることを望む。完璧な王太子妃を演じつつも、その内面では「白の天蓋」による世界の再構築を画策している。セレスティアはルナの変貌に疑念を抱き、二人の間に緊張が走る。

  - 第12話: アートラーとセレスティアは王都地下の遺構最深部で、世界を白紙に戻そうとする「黄昏計画」の全容を知る。計画の首謀者がアートラーの妻であるルナ・フォン・ファーバーであるという衝撃の真実が判明し、彼は絶望に打ちひしがれる。しかし、セレスティアの支えにより、アートラーは逃げずにルナと向き合う決意を固める。一方、遺構の装置が作動し始め、王都の空に不吉な閃光が走り出す。

  - 第13話: アートラーとセレスティアは、地下最深部の核でルナと対峙する。ルナは世界を白紙に戻しアートラーを独占しようとする「黄昏計画」を完遂させようとしていた。アートラーは説得を試みるが、ルナはそれを拒絶し、白の天蓋を起動させる。凄まじい閃光がすべてを飲み込み、物語は急展開を迎える。

  - 第14話: 「白の天蓋」の起動は失敗に終わり、ヴィクトルとルナは王宮騎士団に拘束された。数日後、中央法廷にてルナは自らの罪を認め、アートラーへの愛だけが真実であったと告白する。国王エドガーは二人に極刑を宣告し、ルナはアートラーに別れを告げる口の動きを見せて連行された。法廷の外では、すべてを覆い隠すような雪が降り始めていた。

  - 第15話: 王太子アートラーは、世界を破滅させようとしたルナを牢獄で訪ねる。ルナは自らの罪を認め、許しを請うのではなく、許されないことで永遠にアートラーの記憶に刻まれたいという狂気的な愛を告げる。二人は決定的な断絶を抱えたまま別れ、ルナは消滅へと向かう。降りしきる雪が、すべてを覆い隠していく。

  【世界滅亡と魔法と科学的な恋 II ―Rebirth―】

  - 第1話: ファーバー家の霊廟にて、かつて「白の天蓋」を起動させようとしたルナが三年の眠りから目覚める。彼女は眠りの中で、自らの狂気によって踏みにじった人々の痛みと命の輝きを魂に刻み込まれていた。罪の意識に苛まれながらも、彼女は自らを亡霊のように感じつつ、贖いのために霧の森へと歩み出す。

  - 第2話: 処刑から三年の時を経て、偽名「ルーナ」として静かに生きる元貴族の女の姿が描かれる。彼女は市場の喧騒の中で、かつて自分が奪おうとした人々の営みを追体験し、深い罪悪感に苛まれる。王太子の婚約の噂を聞き、かつての愛する人の幸せを願いながらも、自らはその幸福の圏外にいることを受け入れる。彼女は自らの禁忌の知識を、誰かを救うために使う道を探り始める。

  - 第3話: かつて世界を滅ぼそうとした罪を背負い、身分を隠して施療院で働くルナ。視察に訪れた王太子アートラーと再会し、正体が露見しそうになるが、ルナは冷徹にそれを否定して彼を突き放す。アートラーの動揺と伴侶セレスティアの警戒が交錯する中、ルナは孤独な贖罪の道を歩み続けることを決意する。

  - 第4話: 三年前、世界を白紙に戻す装置「白の天蓋」を起動させようとした罪で処刑されたルナは、「贖いの眠り」を経て王都に姿を現す。彼女は罪悪感から、かつて愛した王太子アートラーとの再会を拒み、彼を突き放す。アートラーは変わり果てた彼女の姿に困惑し、拒絶された痛みと執着の間で揺れ動く。

  - 第5話: 王立施療院で助手として贖罪の生活を送るルナは、かつての宿敵セレスティアに見つかり、対峙する。セレスティアはルナの正体を見抜き、アートラー殿下への接近を厳しく禁じる警告を与える。ルナは自らの罪を認め、セレスティアの言葉に深い納得と安堵を覚えながらも、その場を去ることができない。

  - 第6話: 王太子アートラーは、完璧な婚約者セレスティアとの平穏な日々に息苦しさを感じている。彼は逃げるように訪れた書庫で、三年前に処刑されたかつての恋人ルナが愛した魔導書を見つけ、彼女への執着を再確認する。そこへセレスティアが現れ、彼の動揺を察しながらも、完璧な振る舞いでその場を支配し、彼を再び「正しい」日常へと連れ戻す。

  - 第7話: 王立施療院で助手として働くルーナは、魔導機関の暴走事故で運ばれてきた負傷者たちに直面する。彼女はかつての禁忌の知識を用い、絶望的な状況にあった少女を救い出すが、その力は同時に彼女に過去の罪を思い出させる。救ったことによる感謝に耐えきれず、ルーナは一人孤独に涙を流す。

  - 第8話: 施療院での救命術式が、三年前の「黄昏計画」でルナが用いた禁忌の理論と酷似していることが判明し、彼女の生存が噂される。王宮では貴族たちがルナの再審を求めるが、セレスティアは混乱を避けるための「追放」を提案する。王太子アートラーは、ルナへの愛と王太子としての責務の間で激しく葛藤する。一方、ルナは自らが追われる身になることを予感しながら、静かな決意を固めていた。

  - 第9話: 生存が露見したルーナに対し、セレスティアは「追放」という妥協案を議会に提案している。アートラーはルーナを連れ去りたいと願うが、彼女は自らの罪を認め、彼を縛らないために追放を受け入れる決意を固める。二人はかつての愛を確かめ合いながらも、決定的な距離を置いたまま別れを選んだ。アートラーは王太子としての責任を取り、彼女の追放に賛成することを決める。

  - 第10話: 元王妃ルナは、セレスティアによる政治的解決としての「追放」を受け入れ、名もなき旅人として王都を去る決意をする。港でアートラーと再会し、愛と所有の違いを告げて決別した彼女は、タイン共和国行きの船へと乗り込む。一方、王宮に戻ったアートラーはセレスティアと手を取り合い、喪失感を抱えながらも新たな歩みを始める。'
