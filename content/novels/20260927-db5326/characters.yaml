- name: 凪 (なぎ)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの前髪に、どこか寂しげな瞳をした痩身の少年。白いリネンシャツを好んで着ている。
  personality: 内向的で思慮深く、周囲に馴染めない孤独感を抱えている。一人称は「僕」。
  speech_style: 丁寧だが自信なさげで、言葉を選ぶようにゆっくりと話す。
  background: 海辺の町で静かに暮らす高校生。幼い頃に家族との大切な記憶を一部失っており、その欠落感を埋めるために星や灯台に惹かれている。
  motivation: ルナの記憶を取り戻し、彼女がどこから来たのかを突き止めること。
  relationships:
  - name: ルナ
    relation: 運命的に惹かれ合うパートナー
  - name: 記憶の店主
    relation: 取引相手であり、危うい導き手
  arc: 受動的な人生から脱却し、ルナという存在のために「自分の最も大切なもの」を捨てるという能動的な選択をする強さを得る。
- name: ルナ
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 星屑を散りばめたような銀白色の長い髪と、深い群青色の瞳を持つ。夜空を模したような不思議なドレスを纏っている。
  personality: 純粋で好奇心旺盛だが、時折、宇宙の深淵を見たような深い悲しみを湛える。一人称は「私」。
  speech_style: 幻想的でどこか浮世離れしており、比喩表現を多く用いる。
  background: かつて地球に降り注いだ超新星爆発の記憶が集積して形を成した存在。自らの正体を忘れ、灯台の光に導かれて凪の前に現れた。
  motivation: 自分が何者であるかを知り、自分という存在の「意味」を見つけること。
  relationships:
  - name: 凪
    relation: 記憶を共有し、心を寄せる唯一の人間
  arc: 断片的な記憶の収集に執着していたが、凪との時間を通じて「記憶」よりも「今ここにある感情」の方が大切であることに気づく。
- name: 記憶の店主
  role: ガイド兼トリックスター
  age: 30
  gender: 男性
  appearance: ベルベットのフロックコートにシルクハットを被った紳士。瞳の中に小さな銀河が回転している。
  personality: 享楽的で皮肉屋。人間の感情を観察することを娯楽としているが、真実の愛には密かな敬意を払っている。一人称は「私」。
  speech_style: 芝居がかった大げさな口調で、相手を揺さぶるような問いかけが多い。
  background: 霧の向こうにある『記憶の露店街』の管理人。人々が捨てた記憶を収集・管理し、それを対価に偽りの平穏を提供している。
  motivation: 誰にも売られたことのない「究極の自己犠牲による記憶」を手に入れること。
  relationships:
  - name: 凪
    relation: 興味深いサンプルとして扱う取引相手
  - name: ルナ
    relation: 回収すべき貴重な記憶の塊
  arc: 凪の決断を目の当たりにし、効率や対価のみで動く市場の論理では到達できない感情の価値を認め、二人を解放する。
