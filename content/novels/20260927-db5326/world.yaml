title: 銀河の鱗を拾う少女と、忘却を照らす灯台
genre: 青春恋愛
tone: 静謐で幻想的な、星降る夜の夜想曲
pov: 三人称
tense: 過去形
setting: 現代、断崖に面した静かな海辺の町と、霧の向こうに存在する『記憶の露店街』
premise: 海沿いの町に住む少年・凪は、失った思い出を買い取る『記憶を売る市場』の噂を知る。ある夜、彼は古い灯台の灯火が、星の瞬きと同期して揺れるのを目撃し、そこで記憶を失った少女・ルナと出会う。二人は灯台に隠された、宇宙の記憶を保存する装置の秘密を紐解いていくが、それは大切な誰かを忘れることと引き換えの真実だった。
themes:
- 忘却と再生
- 不完全な記憶の価値
- 孤独な魂の共鳴
rules:
- 記憶を売る市場では、金銭ではなく『感情の輝き』が通貨として扱われる
- 古い灯台は、特定の天体現象が起こる時だけ、異界の市場への入り口を開く
- 記憶を売却すると、その出来事に関する感情だけが完全に消滅し、事実としての記録のみが残る
plot_outline:
- '序盤: 凪は海岸沿いを散歩中、古い灯台の光が『はくちょう座』の形を描くのを見つけ、そこで記憶を失い漂うルナと出会う。'
- '中盤: 二人はルナの記憶を取り戻すため、霧に包まれた夜にだけ現れる『記憶を売る市場』へと足を踏み入れる。そこでは人々が美しい思い出を売り払い、空虚な平穏を買っていた。'
- '終盤: 灯台の最上階で、ルナの記憶が『超新星爆発』のように激しく燃え上がる真実を知る。彼女の記憶は、かつてこの星に降り注いだ星屑そのものだった。'
- '結末: 凪はルナの記憶を救うため、自分自身の最も大切な記憶を市場に差し出す決断をする。二人の記憶は欠落するが、星空の下で再び手を取り合う温もりだけは、消えることなく残った。'
style_notes: 星の名前や天体現象（シリウスの瞬き、流星群の軌跡など）を、登場人物の心情や季節の移ろいに重ね合わせて比喩表現として多用すること。静かな夜の対話を中心に据え、言葉の端々に宇宙の広大さと、それに対比させる人間の心の繊細さを滲ませる。毎話、必ず一つの星座または天体現象を物語の重要な象徴として登場させること。
