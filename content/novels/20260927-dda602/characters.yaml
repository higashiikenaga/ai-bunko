- name: カイ
  role: 主人公
  age: 26
  gender: 男性
  appearance: 使い古された黒いロングコート。右眼にデータ解析用のサイバーアイを埋め込んでいる。常に疲れた表情をしている。
  personality: 冷笑的で現実主義だが、根底に強い正義感を隠している。一人称は「オレ」。
  speech_style: ぶっきらぼうで、裏社会の俗語を混ぜた話し方。
  background: 元は企業の末端職員だったが、ある不祥事に巻き込まれ記憶の一部を消去され、スラムの運び屋として生きている。
  motivation: 日々の生活費を稼ぐこと。しかし、チップに触れたことで失った自身の記憶と世界の真実を取り戻そうとする。
  relationships:
  - name: リア
    relation: ビジネスパートナー兼、唯一信頼できる相棒
  - name: ヴァレリウス
    relation: 宿敵。人生を狂わされた元雇い主
  arc: ただ生き延びるためだけに動いていた傍観者から、世界を変えるためにリスクを背負う当事者へと成長する。
- name: リア（電脳の幽霊）
  role: 相棒
  age: 19
  gender: 女性
  appearance: 常にホログラムの衣装を纏い、実体を持たないアバター状態で現れる。青白い肌にデジタルノイズが走っている。
  personality: 好奇心旺盛で奔放。皮肉屋だが寂しがり屋。一人称は「アタシ」。
  speech_style: 早口で専門用語が多く、相手を小馬鹿にしたような挑発的な口調。
  background: 企業の最高機密プロジェクトの過程で意識をデジタル化した、肉体を失った天才ハッカー。
  motivation: ネットワークの最深部にある「禁忌のプロトコル」を起動させ、自分が何者であったかを知ること。
  relationships:
  - name: カイ
    relation: 唯一自分を「人間」として扱う理解者
  - name: ヴァレリウス
    relation: 自分をデータに閉じ込めた憎き創造主
  arc: 情報の海に逃避していたところから、カイとの交流を通じて「痛み」を伴う現実の価値を再認識する。
- name: ヴァレリウス
  role: 敵役
  age: 52
  gender: 男性
  appearance: 一点の曇りもない純白のスーツ。感情を読み取らせない冷徹な銀色の義眼を持つ。
  personality: 完璧主義で傲慢。人類の進化には個人の記憶や感情という「ノイズ」の排除が不可欠だと信じている。一人称は「私」。
  speech_style: 極めて丁寧で静かだが、拒絶を許さない威圧感のある話し方。
  background: ネオ・エデンを支配する超巨大企業の執行責任者。記憶市場のシステム構築を主導した。
  motivation: 全市民の意識を統合し、争いのない「完全なる調和（ディストピア）」を完成させること。
  relationships:
  - name: カイ
    relation: 排除すべき不純物、あるいは興味深いサンプル
  - name: リア
    relation: 最高の傑作であり、同時に最大の失敗作
  arc: 絶対的な支配を確信していたが、予測不能な「人間の意志」というノイズによって築き上げた秩序を崩壊させられる。
