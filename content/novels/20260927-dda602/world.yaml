title: 電脳桜のノイズ、記憶市場の残響
genre: SF
tone: ネオンと雨、ハードボイルドなサイバーパンク
pov: 一人称（オレ）
tense: 過去形
setting: 超高層企業都市「ネオ・エデン」と、その足元に広がるスラム「廃液層（スリップ・ゾーン）」
premise: 降り止まない酸性雨。ネオンが溶ける路地裏で、オレは『記憶』を買い叩く運び屋だ。ある日、オレの前に持ち込まれたのは、かつて都市を支配した企業が抹殺したはずの『純白の桜』の記憶。そのデータには、都市のシステムを根底から覆すウイルスが潜んでいた。追っ手のドローンを潜り抜け、オレは情報の真実へとダイブする。
themes:
- 情報の不平等
- 失われた人間性の再定義
rules:
- 記憶はデータ化され、暗市場で売買可能である
- 企業の神経接続（ニューラル・リンク）は、外部からのハッキングに対して極めて高い拒絶反応を示す
- スラムの住人は、違法な記憶チップの過負荷により『記憶汚染（メモリー・レイズ）』を起こすリスクを常に抱えている
plot_outline:
- '序盤: スラムの安酒場で、オレは正体不明のクライアントから、ノイズ混じりの「桜の映像」が記録された極秘チップを受け取る。直後、企業の執行官（クリーナー）による襲撃が始まる。'
- '中盤: チップの解析を開始。ハッキングのプロフェッショナル、通称『電脳の幽霊』と協力し、企業の暗号壁を突破する。解析を進めるにつれ、その桜の記憶が、かつての地球の美しい自然をシミュレートした「禁忌のプロトコル」であることを知る。'
- '終盤: 企業の最上階、雲を突き抜けるスカイ・タワーへ侵入。記憶市場を支配する黒幕が、このチップを使って全市民の意識を強制書き換えようとしていることが判明する。'
- '結末: 企業の防壁を強制突破（オーバーライド）し、チップのデータを全世界のネットワークへ放出。偽りの記憶ではなく、痛みすら伴う「真実」を人々に突きつける。雨は降り続き、オレは再び路地裏の闇へと消える。'
style_notes: 短いセンテンス。断続的な独白。ネオンの反射、雨の質感、電子回路の熱を強調する。ハッキングシーンは、コードの奔流と神経への電気刺激を具体的な感覚として描写。スラングを交え、常に焦燥感とハードボイルドな空気感を維持すること。
