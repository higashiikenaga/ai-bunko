- name: 久遠寺 朔介
  role: 主人公
  age: 21
  gender: 男性
  appearance: 青白い肌に、度の強い眼鏡をかけた痩身の青年。常に大きなヘッドフォンを首にかけ、古い録音機を大切に持ち歩いている。
  personality: 内向的で繊細。他者の感情に共鳴しやすい。一人称は「僕」。
  speech_style: 丁寧で控えめだが、音に関する話題になると熱っぽく、早口になる。
  background: 人ならざる者の最期の声を記録する「耳掃除」の家系に生まれた末裔。都会の大学で音響学を学んでいたが、家業を継ぐため山小屋へ戻った。
  motivation: 消えゆく怪異たちが遺した「人生の集大成」とも言える音を完璧に記録し、彼らの生きた証を保存すること。
  relationships:
  - name: 白夜
    relation: 導き手であり、記録対象
  - name: 小夜
    relation: 案内役の友人
  arc: 単なる記録者という傍観者の立場から、彼らの情念に深く寄り添い、共に喪失を乗り越える能動的な理解者へと成長する。
- name: 白夜
  role: 物語の鍵となる大妖怪
  age: 数百年（外見は30代後半）
  gender: 男性
  appearance: 白い着物を纏い、輪郭が霧のように曖昧な、透き通るような美貌を持つ。声だけが無線機を通じて届くことが多い。
  personality: 気高く、孤独を愛する。諦念を抱えつつも、心の底では誰かに思い出してほしいと願っている。一人称は「我」。
  speech_style: 古風で格調高く、静謐。時折、ノイズが混じったような震えがある。
  background: かつて霧深い里を治めていた大妖怪。時代の変化と共に信仰を失い、存在が希薄になり、完全に消滅する直前の状態にある。
  motivation: かつて愛した人間へ、時を超えて伝えたい最後の言葉を、誰かに託して届けること。
  relationships:
  - name: 久遠寺 朔介
    relation: 自分の最期を聴いてくれる唯一の人間
  - name: 小夜
    relation: かつての臣下であり、娘のような存在
  arc: 孤独な消滅を待つ絶望から、朔介という理解者を得ることで、自身の生を肯定して静かに眠りにつく。
- name: 小夜
  role: 相棒・ガイド役
  age: 外見は12歳程度
  gender: 女性
  appearance: ボロボロの振袖に赤いたすき掛けをした、小さな角を持つ少女。手には古びた提灯を持っている。
  personality: お調子者で好奇心旺盛だが、実は寂しがり屋。人間に疎まれた経験から、最初は人間を警戒している。一人称は「私」。
  speech_style: 快活で幼い口調。「～だよ」「～じゃん」など、少し砕けた話し方をする。
  background: 里に住み着いている小妖怪。白夜に心酔しており、彼が消えゆくことを何よりも悲しんでいる。
  motivation: 白夜の願いを叶えるため、朔介をサポートし、里の妖怪たちの想いを伝えること。
  relationships:
  - name: 久遠寺 朔介
    relation: 最初は不信感を持っていたが、次第に信頼する友人
  - name: 白夜
    relation: 絶対的な忠誠を誓う主
  arc: 人間への不信感を捨て、種族を超えた絆を信じられるようになる。
- name: 源蔵
  role: 脇役・助言者
  age: 68
  gender: 男性
  appearance: 深い皺が刻まれた顔に、常にキセルをくゆらせている。厚手の羽織を羽織った、厳格そうな老人。
  personality: 現実主義で口は悪いが、情に厚い。里の均衡を保つことに責任感を持っている。一人称は「ワシ」。
  speech_style: ぶっきらぼうな老人口調。「～じゃ」「～しおれ」など。
  background: 里の長であり、久遠寺家と代々付き合いがある。妖怪と人間の境界線を管理する役割を担っている。
  motivation: 里の平穏を守ること。同時に、時代の波に消える妖怪たちへの密かな哀悼。
  relationships:
  - name: 久遠寺 朔介
    relation: 危なっかしい孫のような存在
  - name: 白夜
    relation: 古くからの知人であり、敬意を払う相手
  arc: 伝統としての「記録」だけでなく、個人の「記憶」として遺すことの意味を、朔介を通じて再認識する。
