title: 月下の言の葉、黎明の電波
genre: 伝奇
tone: 幽玄、哀切、美しき怪異
pov: 三人称
tense: 過去形
setting: 昭和初期、霧深い山あいの隠れ里と、旧式の無線機が響く山小屋
premise: 人ならざる者たちの最期を、音として記録する「耳掃除」の家系がいた。ある冬の夜、死にゆく妖怪が遺した最後の言葉を、古びたラジオのノイズに託す。若き記録者の青年は、夜明けのラジオから流れる謎の声に導かれ、忘れ去られた怪異たちの情念と、人間に愛された記憶を辿ることになる。それは、消えゆくものたちが最後に残した、祈りにも似た遺言の物語である。
themes:
- 存在の忘却
- 情けと慈しみ
- 継承される記憶
rules:
- 妖怪は人間に忘れ去られると、その形を保てず霧となって消える
- 『音』には霊力が宿り、特定の周波数では異界との境界が揺らぐ
- 死に際の強い情念は、電磁波に乗って地上に漏れ出すことがある
plot_outline:
- '序盤: 記録者の青年・朔介は、冬の訪れと共に、山小屋で妖怪の『最期の声』を拾い集める日々を送っていた。ある晩、古い無線機から、かつてこの地を治めていた大妖怪の、震えるような遺言が流れ出す。'
- '中盤: 朔介は声の主を探して山深くへと足を踏み入れる。道中、季節の行事である小正月を控えた里で、人間に疎まれながらも守り続けてきた小さな妖怪たちと出会い、彼らが抱く悲しみと美しさに触れる。'
- '終盤: ラジオの音声の正体は、消えゆく妖怪が、いつか自分を思い出してくれる人間へ宛てた、時空を超えた通信であった。朔介は、妖怪の魂が霧散する直前の、最も美しい音を記録するために、命を削るような「聞き取り」に挑む。'
- '結末: 夜明けの光が差し込む頃、ラジオのノイズは静まり、妖怪たちは静かに消えていった。しかし、朔介の手元には、彼らが確かに生きた証としての、温かな音の記憶が刻まれていた。'
style_notes: 和の情緒を重んじ、季節の移ろい（霜、灯火、風の音など）を情景描写に深く絡めること。妖怪の描写は、単なる怪物としてではなく、四季の美しさを体現したような、儚くも尊いものとして描く。語彙には『幽玄』『寂寥』『情緒』を感じさせる言葉を選び、読者の胸に静かな哀しみと、救いを感じさせる筆致を心がける。
