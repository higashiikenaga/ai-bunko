- name: カイル・ヴァン・クロムウェル
  role: 主人公
  age: 19
  gender: 男性
  appearance: 灰色の瞳と、常にどこか疲れを帯びた表情。黒い使い古された外套を纏い、腰には壊れた懐中時計を下げている。
  personality: 冷静沈着で現実主義。しかし、内面には強い正義感と、自分を削ってでも守りたいという献身性を秘めている。一人称は「僕」。
  speech_style: 淡々としており、無駄な言葉を好まない。相手を突き放すような響きがあるが、根底には優しさがある。
  background: 禁忌の術式を継承する没落貴族の生き残り。術の代償として常に寿命を削りながら、「刻の欠片」を狩って日銭を稼いでいた。
  motivation: 止まった世界を動かし、自らの命のカウントダウンに終止符を打つこと。
  relationships:
  - name: リナ
    relation: 守るべき対象であり、唯一心を許せるパートナー
  - name: ゼノス
    relation: 思想的に相反する宿敵
  arc: 孤独な生存者として生きる日々から、世界全体の未来を背負い、自己犠牲を超えた「生」を見出す英雄へと変化する。
- name: リナ・エテルナ
  role: 相棒
  age: 16
  gender: 女性
  appearance: 透き通るような銀髪と、星空を映したような深い青の瞳。どこか浮世離れした神秘的な美しさを持つ。
  personality: 純粋で好奇心旺盛。記憶を失っているため、世界のあらゆる事象に新鮮な驚きを示す。一人称は「わたし」。
  speech_style: 柔らかく、丁寧な言葉遣い。時折、世界の真理を突くような鋭い言葉を、無自覚に放つ。
  background: 廃都の遺跡でカイルに救出された記憶喪失の少女。彼女自身が、世界を再始動させるための「天球の時計」の核である。
  motivation: 自分が何者であるかを知り、止まってしまった世界の時間を再び流すこと。
  relationships:
  - name: カイル
    relation: 自分を救ってくれた恩人であり、最も信頼する存在
  arc: 守られるだけの「鍵」という役割から、自らの意志でカイルに新たな時間を与える「救済者」へと成長する。
- name: ゼノス・ヴァルガリス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 威厳のある長身と、冷徹な金色の瞳。帝国の豪華な軍服を完璧に着こなし、常に隙がない。
  personality: 極めて合理的かつ傲慢。人類を「選ばれた者」と「それ以外」に分ける選民思想の持ち主。一人称は「我」。
  speech_style: 高圧的で優雅。相手を対等な人間として見なさず、常に教え諭すような、あるいは裁くような口調。
  background: 時間の帝国を統べる宰相。全人類の時間を統合することで、選ばれた者だけが永遠を得る「完璧な秩序」を構築しようとしている。
  motivation: 時間の独占による、不変で完璧な世界の完成。
  relationships:
  - name: カイル
    relation: 計画を阻む、排除すべき不確定要素
  arc: 絶対的な秩序の守護者としての自負が、カイルの予測不能な自己犠牲によって崩れ去る。
- name: シオン
  role: 脇役
  age: 32
  gender: 男性
  appearance: 顔に古い傷跡があり、片目を眼帯で隠している。使い込まれた重装甲を身に着けた屈強な戦士。
  personality: 厭世的で口が悪いが、一度引き受けた依頼や義理は最後まで果たす義理堅い性格。一人称は「俺」。
  speech_style: ぶっきらぼうで荒っぽい。必要最小限の言葉しか使わない。
  background: 元帝国の精鋭騎士団長。帝国の非道な計画を知り、離反してからは「刻の欠片」を追う放浪の狩人となった。
  motivation: 帝国の暴走を阻止し、自らがかつて守れなかった者たちへの贖罪を果たすこと。
  relationships:
  - name: カイル
    relation: 技術を教え、背中を預ける協力者
  - name: リナ
    relation: 世界を救う希望として守るべき対象
  arc: 過去の罪に囚われ、死に場所を探していた男が、次世代へ未来を託すための戦いを見出す。
