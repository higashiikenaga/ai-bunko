title: 刻限の葬列と断絶の呪剣
genre: 異世界ファンタジー
tone: 重厚かつ峻烈。呪術的な緊張感漂う伝奇調
pov: 三人称
tense: 過去形
setting: 天球の時計が停止し、時間が断片化した世界「クロノス・アビス」。人々は残された「刻」を貨幣として消費して生きている。
premise: 止まった時を強引に動かす禁忌の術式を操る青年が、記憶を失った少女と共に世界を再始動させる旅に出る。彼は壊れた懐中時計を触媒に時間を停止させるが、その代償として自らの寿命を削り続けていた。彼らが手にしたのは、あらゆる因果と術式を切り裂く「折れた剣」。時間を喰らう帝国との、絶望的な生存闘争が始まる。
themes:
- 等価交換の残酷さ
- 運命への抗い
rules:
- 【等価交換の原則】時間を操作する術式には必ず相応の代償が必要。1秒の停止に1日の寿命を、1分の加速に1年の記憶を捧げる。
- 【術式の発動条件】古語による正確な詠唱と、触媒となる遺物（懐中時計等）への魔力注入が必須。
- 【断絶の理】折れた剣は物理的な肉体は斬れないが、展開された術式の「理（数式）」のみを物理的に切断できる。
plot_outline:
- '序盤: 辺境の廃都で「刻の欠片」を狩る主人公が、帝国の追手から逃れる記憶喪失の少女を救出する。彼女が世界を再始動させる鍵であることに気づく。'
- '中盤: 帝国が掲げる「全人類の時間を統合し、選民のみが永遠を得る」計画を阻止するため、失われた古の術式を求めて各地の聖域を巡る。道中で術の代償により主人公の身体が限界に近づく。'
- '終盤: 帝都の頂点にある「永劫の歯車」へ潜入。最強の術式使いである帝国宰相と対峙し、折れた剣で因果を断ち切り、懐中時計に全寿命を賭した最終術式を込める。'
- '結末: 懐中時計を完全に破壊することで、固定されていた世界の時間を解放する。異能は消滅し、主人公は死の淵に立つが、少女の手によって新たな「時間」を与えられ、静かに目を覚ます。'
style_notes: 三人称視点。緊迫した戦闘シーンでは「走る。跳ぶ。斬る。」のように短文を畳み掛け、速度感を出す。術式発動時は「其の身を捧げ、刻を止めん」といった古風な文体を用い、儀式的な厳格さを演出する。特に代償として肉体や精神が削られる描写を詳細に書き込み、能力使用の危うさを強調すること。
