- name: レン・アルト
  role: 主人公
  age: 26
  gender: 男性
  appearance: 無機質な灰色の制服に身を包み、感情を読み取らせない冷徹な瞳を持つ。常に最新の音響監査用デバイスを装着している。
  personality: 効率主義で冷淡。一人称は「僕」。内心に埋められない空虚感を抱えており、無意識に「正解のない音」を渇望している。
  speech_style: 簡潔で事務的な口調。感情の起伏が極めて少ない。
  background: 音響監査官としてエリートコースを歩み、数多くの「ノイズ」を抹消してきた。ある日、偶然聴いた『夜明けのラジオ』の声に、人生で初めての魂の震えを経験する。
  motivation: 管理された静寂の裏に隠された「生の響き」の正体を突き止め、失われた人間性を取り戻すこと。
  relationships:
  - name: エラ・ルミナス
    relation: 禁じられた音の導き手であり、共犯者
  - name: ディレクター・ヴェイン
    relation: 絶対的な忠誠を誓っていた元上司であり、思想的な敵
  - name: カイル・ゼノ
    relation: 同期の親友であり、自分を正気に戻そうとする対立者
  arc: システムの忠実な歯車から、自らを最大のノイズとして捧げることで世界を覚醒させる反逆者へと変貌する。
- name: エラ・ルミナス
  role: 相棒
  age: 22
  gender: 女性
  appearance: 古時代のゆったりとした衣服を纏う。デバイスを強制的に除去したため、耳元に小さな手術痕がある。
  personality: 情熱的で慈愛に満ちている。一人称は「私」。不完全であることの美しさを信じている。
  speech_style: 詩的で、音楽的なリズムを持つ話し方。相手の心に語りかけるような口調。
  background: 地下で自然の音や音楽を保存する抵抗組織のメンバー。『夜明けのラジオ』のDJとして、市民の意識に潜む「音への飢え」を呼び覚まそうとしている。
  motivation: 全ての市民から聴覚の支配を解き放ち、誰もが自分の心で音を聴ける世界を取り戻すこと。
  relationships:
  - name: レン・アルト
    relation: 自分たちの理念を理解し、実行に移してくれた唯一の監査官
  - name: ディレクター・ヴェイン
    relation: 静寂という名の牢獄を作る、排除すべき権力者
  arc: 孤独な放送を続けていた絶望感から、レンという理解者を得たことで、最後の大規模配信という賭けに出る勇気を持つ。
- name: ディレクター・ヴェイン
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない黒いスーツに、完璧に調律された特製耳栓を着用。眼鏡の奥の目は冷酷で鋭い。
  personality: 極端な完璧主義者。一人称は「私」。不協和音こそが争いと悲劇の根源であると信じている。
  speech_style: 威圧的で論理的。相手の矛盾を突き、精神的に追い詰める理詰めの話し方。
  background: 音響管理法の制定に深く関わった最高責任者。かつて「感情的なノイズ」によって最愛の家族を失った過去があり、そのトラウマから静寂による完全統制を追求している。
  motivation: 全市民の聴覚を再プログラムし、永遠に争いのない「完全なる調和（静寂）」を実現すること。
  relationships:
  - name: レン・アルト
    relation: 期待していた後継者であり、最大の裏切り者
  - name: エラ・ルミナス
    relation: 社会の秩序を乱す、駆除すべき不純物
  arc: 絶対的な管理を完遂しようとするが、計算外の「人の意志」というノイズに敗北し、崩壊する。
- name: カイル・ゼノ
  role: 脇役
  age: 26
  gender: 男性
  appearance: レンと同じ監査官の制服。常に神経質そうに周囲を警戒し、指先をいじる癖がある。
  personality: 真面目で忠実。一人称は「俺」。正義感は強いが、権威に弱い。
  speech_style: ぶっきらぼうだが、レンに対しては親愛の情が滲む話し方。
  background: レンの同期であり、唯一の親友。システムの正しさを盲信して生きてきたが、変化していくレンの様子に激しく動揺し、彼を救おうと奔走する。
  motivation: レンを「正常な状態」に戻し、共に監査官として平穏な生活を送ること。
  relationships:
  - name: レン・アルト
    relation: 唯一心を許した親友であり、同時に監視対象
  - name: ディレクター・ヴェイン
    relation: 絶対的な正義として心酔している上司
  arc: 盲目的な忠誠心とレンへの友情の間で激しく葛藤し、最終的にレンが選んだ「ノイズ」としての生き方を静かに受け入れる。
