- name: 湊 凪
  role: 主人公
  age: 22
  gender: 男性
  appearance: 色白でどこか儚げな印象。感情が読みにくい無表情な顔立ち。海の色を思わせる深い瞳。
  personality: 内向的で慎重。嘘をつけない自分を「呪い」だと感じ、人間関係を避けて生きている。一人称：僕。
  speech_style: 端的で飾り気がなく、時に残酷な真実を淡々と述べてしまう。
  background: 幼少期から嘘をつけない体質で、言葉の真実さが周囲を傷つけてきた経験から、海辺の町で隠遁生活を送っている。
  motivation: 自分の言葉が誰かを傷つけない方法を見つけ、平穏に生きること。
  relationships:
  - name: 瀬戸 栞
    relation: 自身の真実を突きつけ、心を揺さぶる出会い
  arc: 孤独に閉じこもる生き方から、たとえ傷つけても真実を伝える勇気と、言葉の重みを抱えて生きる覚悟を持つ。
- name: 瀬戸 栞
  role: 主人公
  age: 19
  gender: 女性
  appearance: 海風に吹かれたような少し癖のある髪。瞳には強い意志と、隠しきれない深い悲哀が宿る。
  personality: 情熱的で真っ直ぐだが、内面は喪失感に脆い。一人称：私。
  speech_style: 感情が乗りやすく、時に縋るような、あるいは強い執着を感じさせる響きを持つ。
  background: 海底遺跡の中に、病で亡くした母の面影や記憶を探し続けている。遺跡の発見に強く執着している。
  motivation: 遺跡を通じて母との繋がりを再確認し、心の欠落を埋めること。
  relationships:
  - name: 湊 凪
    relation: 自身の痛みに向き合わせてくれる存在
  arc: 過去への執着と否定から脱却し、残酷な現実と別れを受け入れ、前を向いて歩き出す。
- name: 浅海 海斗
  role: 脇役
  age: 22
  gender: 男性
  appearance: 明るく整った容姿。誰からも好かれるような、親しみやすい笑顔。
  personality: 社交的で器用。嘘を「優しさ」として使いこなし、場の空気を読むことに長けている。一人称：俺。
  speech_style: 相手の気分を害さないよう、言葉を慎重に選び、柔らかなトーンで話す。
  background: 湊の幼馴染。湊の「呪い」とは対照的に、嘘で場を和ませることで町の人々に溶け込んでいる。
  motivation: 湊が真実の重さに押し潰されないよう、彼が社会と繋がっていられるよう見守ること。
  relationships:
  - name: 湊 凪
    relation: 幼馴染であり、自分とは正反対の価値観を持つ友人
  arc: 嘘による調和の限界を知り、真実が持つ痛みを伴う価値を湊と共に再認識する。
