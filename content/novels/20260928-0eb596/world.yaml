title: 凪の底、嘘の重さ
genre: ヒューマンドラマ
tone: 静謐で慈悲深く、どこか切ない
pov: 三人称近接視点
tense: 過去形
setting: 現代、海沿いの静かな療養町と、伝説が残る海底遺跡の周辺
premise: 生まれつき「嘘をつけない呪い」を背負った青年・湊は、言葉の真実さが周囲を傷つけることを恐れ、海辺の町で静かに暮らしていた。ある日、彼は海中で発見された古代の海底遺跡に、亡き母の面影を追う少女・栞と出会う。遺跡に眠る記憶と、剥き出しの言葉が交差するとき、二人は避けられない喪失と向き合い始める。
themes:
- 真実の残酷さと優しさ
- 喪失の受容
- 言葉による救い
rules:
- 主人公は意図的か無意識かを問わず、嘘をつこうとすると激しい喉の痛みと身体的な拒絶反応が生じる
- 海底遺跡は潮汐の影響で特定の時間帯にのみ姿を現す
plot_outline:
- '序盤: 嘘がつけないゆえに人間関係を避けて生きる湊の孤独な日常と、海辺で出会った栞との交流を描く。'
- '中盤: 栞が海底遺跡に執着する理由が、病を患う家族との別れに関連していることが判明する。湊は彼女の痛みに寄り添いたいが、自分の真実が彼女を追い詰めるのではないかと葛藤する。'
- '終盤: 嵐の夜、遺跡が一時的に姿を現す。湊は栞の願いを叶えるため、呪いによって引き出された「最も残酷で、最も優しい真実」を彼女に伝える決意をする。'
- '結末: 栞は大切な存在との別れを受け入れ、湊もまた、言葉の重みを抱えたまま生きていく力を得る。海は静かに凪いでいる。'
style_notes: 感情を直接的な形容詞で説明せず、微かな体温の変化や、波の音、光の揺らぎといった情景描写に託して表現する。読者がキャラクターの痛みを感じ取れるよう、余白を大切にした静かな筆致を貫くこと。結末は、悲しみの中に小さな光が見えるような、穏やかな希望を感じさせる終わり方にする。
