- name: カイ・エアロ
  role: 主人公
  age: 16
  gender: 男性
  appearance: 茶髪の無造作な髪、風よけのゴーグル、動きやすい革製の飛行服を着用。
  personality: 好奇心旺盛で真っ直ぐ、少しお調子者な性格。一人称は「僕」。
  speech_style: 活発で感情豊かな話し方。語尾は「〜だよ」「〜かな？」が多い。
  background: 浮遊都市の片隅で古物商の手伝いをして育った、空への憧れが人一倍強い少年。
  motivation: 地図の謎を解き明かし、伝説の島を見つけること。
  relationships:
  - name: リナ
    relation: 信頼できるパートナー
  - name: ゼノス
    relation: 命を狙う追っ手
  arc: 受動的な少年から、世界の運命を背負い風の旋律を操る真のスカイ・レンジャーへと成長する。
- name: リナ・ヴァレンタイン
  role: 相棒
  age: 22
  gender: 女性
  appearance: 銀髪のショートカット、油汚れのついた整備服、鋭く知的な瞳。
  personality: 冷静沈着で現実主義だが、内面には熱い情熱を秘めている。一人称は「私」。
  speech_style: 理知的で無駄のない、簡潔な話し方。
  background: 腕利きのフリーランス整備士。組織の規律を嫌い、自由な空を求めて旅をしている。
  motivation: 愛機『ウィンド・ランナー号』の性能を極限まで引き出し、未知の旋律の正体を知ること。
  relationships:
  - name: カイ
    relation: 守るべき大切な相棒
  arc: 孤独な技術者から、仲間と共に未知の領域へ踏み出す勇気を持つ冒険者へと変化する。
- name: ゼノス・ヴォルガード
  role: 敵役
  age: 45
  gender: 男性
  appearance: 威厳のある軍服、片目に魔導回路が組み込まれたモノクル、冷徹な表情。
  personality: 厳格で冷酷。秩序こそが世界の安定をもたらすと信じる支配主義者。一人称は「私」。
  speech_style: 重厚で威圧的な、命令口調の話し方。
  background: 強大な軍事組織の司令官。古代技術による絶対的統治を目論んでいる。
  motivation: 地図が示すエネルギーを独占し、世界を再構築（支配）すること。
  relationships:
  - name: カイ
    relation: 計画を阻害する排除対象
  arc: 秩序による支配の象徴として君臨するが、自由な風（カイ）の力によってその信念が打ち砕かれる。
- name: セレス
  role: 脇役
  age: 15
  gender: 女性
  appearance: 透き通るような銀髪、星屑のような模様が浮かぶ神秘的な瞳。
  personality: 穏やかで浮世離れしており、どこか儚げな雰囲気を持つ。一人称は「私」。
  speech_style: 詩的で、時折予言めいた抽象的な言い回しをする。
  background: 地図の旋律が具現化した存在であり、古代文明の記憶を宿している。
  motivation: 旋律が本来あるべき場所「天空の揺り籠」へ帰ること。
  relationships:
  - name: カイ
    relation: 運命を共にする導き手
  arc: 自身の使命を果たすことで、個としての存在を超え、世界を再生させるエネルギーへと昇華する。
