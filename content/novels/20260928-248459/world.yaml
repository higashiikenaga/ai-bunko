title: スカイハイ・レゾナンス ―風を刻む銀翼の航路―
genre: SF
tone: 爽快でエネルギッシュ、空への憧憬と高揚感
pov: 三人称
tense: 過去形
setting: 浮遊大陸群が点在する、大気中にエネルギーが満ちた未来の世界。高度な蒸気機関と魔導回路を組み合わせた飛空艇が主要な移動手段となっている。
premise: 雲海を渡るスカイ・レンジャーの少年カイは、ある祭りの夜、古代文明が残したという『秘密の地図』を偶然手にする。その地図は、失われた伝説の浮遊島への航路を示しており、地図に記された旋律は世界を変えるほどのエネルギーを秘めていた。カイは気鋭の女性整備士リナや相棒の小型飛行艇と共に、地図の謎を解き明かすため、未知の嵐と追手から逃れながら空の果てを目指す。
themes:
- 未知への挑戦
- 仲間との絆
- 失われた文明の再生
rules:
- 風のエネルギー（エア・レゾナンス）が全ての動力源であり、飛空艇の性能は風をいかに捉えるかに依存する
- 地図は音波によって解読される特殊なクリスタルで構成されている
- 高度が上がるほど大気密度が下がり、特殊な防護翼を持つ機体のみが生存可能である
plot_outline:
- '序盤: 浮遊都市の賑やかな祭りの夜、カイは古物商から奇妙な輝きを放つ『秘密の地図』を手に入れ、謎の追っ手に襲撃される。'
- '中盤: 整備士リナの駆る超高速飛空艇『ウィンド・ランナー号』に救われたカイは、地図が示す旋律を追い、各地の浮遊大陸を駆け巡る。仲間との絆を深めながら、地図が単なる場所ではなく、世界を再構築する鍵であることを知る。'
- '終盤: 地図の終着点である『天空の揺り籠』にて、強大な軍事組織との決戦が繰り広げられる。カイは機体の限界を超えた飛行を行い、風の旋律と一体化する。'
- '結末: 伝説の島を見つけ出し、世界に新たな風を吹き込んだカイたちは、次なる冒険の空へと再び飛び立っていく。'
style_notes: 機械の駆動音、風が翼を撫でる感触、雲を突き抜ける疾走感を、擬音や鮮やかな色彩語を用いてダイナミックに描写すること。キャラクターの会話は明るく、困難に立ち向かう際の熱量を重視する。
