- name: 如月 蓮（きさらぎ れん）
  role: 主人公
  age: 20
  gender: 男性
  appearance: 切れ長の瞳と、どこか虚ろな眼差しを持つ黒髪の青年。大正浪漫を感じさせる厚手の外套を纏っている。
  personality: 冷静沈着で現実主義。記憶を売る代償として感情の起伏が乏しくなっている。「僕」
  speech_style: 淡々と事実のみを述べる、飾り気のない話し方。
  background: 卓越した術式操作能力を持つが、その能力を維持するために幼少期からの大切な記憶を次々と『記憶市場』へ売り払ってきた遺失師。
  motivation: 目の前の依頼を完遂すること。そして、失いすぎた自分自身への微かな渇望。
  relationships:
  - name: 一ノ瀬 汐里
    relation: 相棒・守るべき存在
  - name: 九条 宗厳
    relation: 宿敵
  arc: 記憶を「道具」として扱っていた男が、最後には世界を守るために「自分自身」という最大の記憶を代償に捧げる決断を下す。
- name: 一ノ瀬 汐里（いちのせ しおり）
  role: 相棒
  age: 18
  gender: 女性
  appearance: 和洋折衷の装束に身を包んだ、凛とした佇まいの少女。記憶の残香を感知する術式を用いるための提灯を携えている。
  personality: 芯が強く、情に厚い。記憶を売る遺失師たちを憐れみつつも、その生き様を肯定しようとする。「私」
  speech_style: 丁寧だが、芯の通ったはっきりとした口調。
  background: 記憶を巡る呪いを祓う家系の末裔。記憶を売らず、むしろ『失われた記憶の行方』を追うために術式を研鑽している。
  motivation: 記憶市場の暴走を止め、人々が自分自身の物語を失わずに済む世界を取り戻すこと。
  relationships:
  - name: 如月 蓮
    relation: 信頼するパートナー
  - name: 九条 宗厳
    relation: 排除すべき敵対者
  arc: 蓮の孤独を理解し、彼がすべてを忘却した後に、その存在を世界に繋ぎ止める「記憶の継承者」へと成長する。
- name: 九条 宗厳（くじょう むねよし）
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない黒い背広を着こなす、銀髪の紳士。常に穏やかな微笑を浮かべているが、瞳の奥には底知れぬ虚無がある。
  personality: 極めて理知的で冷酷。人間を「記憶という情報の集合体」としか見ていない。「私」
  speech_style: 慇懃無礼で、相手を諭すような高圧的な敬語。
  background: 記憶市場を実質的に支配する巨大呪術組織の総帥。人類の全記憶を集積することで、個を越えた『神』へ至ることを企む。
  motivation: 『大儀』を完遂し、人類の記憶を統合して、混沌とした世界を完璧な理（ことわり）で再構築すること。
  relationships:
  - name: 如月 蓮
    relation: 計画に必要な鍵となる存在
  - name: 一ノ瀬 汐里
    relation: 計画の障害
  arc: 絶対的な支配者として君臨し続けるが、蓮の「自己を捨てて理を拒絶する」という非論理的な行動によって、計画の破綻を経験する。
- name: 竜崎 朱音（りゅうざき あかね）
  role: ライバル
  age: 22
  gender: 女性
  appearance: 真紅の髪を短く切り揃えた、戦闘的な装いの女性。呪符を埋め込んだ刀を振るう。
  personality: 好戦的で享楽的。記憶を売ることで得た圧倒的な破壊衝動に身を任せている。「あたし」
  speech_style: 荒々しく、相手を挑発するような物言い。
  background: 記憶市場の「執行官」の一人。強大な力を得るために、生存に必要な記憶すらも惜しみなく売り払った狂戦士。
  motivation: 強者との死闘を通じて、記憶を失うことで得られる刹那的な高揚感を味わい続けること。
  relationships:
  - name: 如月 蓮
    relation: 喰らうべき対象・好敵手
  arc: 蓮との戦いを通じて、何もかも失った先に残る「空虚」に直面し、自身の存在意義を揺さぶられる。
