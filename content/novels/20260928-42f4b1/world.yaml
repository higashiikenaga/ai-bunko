title: 忘却の刻印、冥府の書簡
genre: 伝奇
tone: 重厚で陰鬱、緊迫感のある硬質な文体
pov: 三人称
tense: 過去形
setting: 現代、神隠しと術式が潜む大正情緒の残る架空の帝都
premise: 術式を操る「遺失師」たちは、代償として自らの記憶を「記憶市場」へ売り払い、その糧に異能を得る。主人公の蓮は、主を失った『失われた手紙』を回収する任務に就くが、その手紙には封印された禁忌の術式が記されていた。手紙を紐解くことは、世界の理を書き換える呪いを解き放つことと同義であった。追っ手となる呪術組織と、記憶を糧に喰らう異能者たちの血戦が幕を開ける。
themes:
- 記憶と自己の同一性
- 代償の重み
rules:
- 術式の行使には必ず『記憶』の断片を燃料として消費しなければならない
- 記憶市場では、重要度の高い記憶ほど高価な術式と交換可能である
- 『失われた手紙』は、一度開封されると送り主と受け取り手の因果を強制的に結びつける
plot_outline:
- '序盤: 記憶を売って生きる遺失師・蓮が、差出人不明の古い手紙を回収する依頼を受ける。依頼の裏には、記憶市場を支配する巨大な呪術組織の影があった。'
- '中盤: 手紙の中に隠されていたのは、かつて世界を滅ぼしかけた『忘却の術式』の設計図であった。蓮は仲間と共に、記憶を掠め取ろうとする異能者たちとの激しい戦闘に身を投じる。'
- '終盤: 敵の目的が、全人類の記憶を市場へ流し込み、神の領域に至るための『大儀』であることを知る。蓮は自らの最も大切な記憶を代償に、禁忌の術式を起動させる決断を迫られる。'
- '結末: 術式は発動し、敵は退けられるが、蓮は自分自身の名前すら忘却の彼方へと失い、ただ『手紙』を守る守護者として静かに歩み始める。'
style_notes: 三人称視点。戦闘描写では、呪文や術式の起動を古語を用いた重々しい表現（例：『言霊の楔、其の理を穿て』）で記述すること。緊迫した局面では極端に短い一文を畳み掛け、読者の呼吸を乱すようなリズムを刻む。術の代償が支払われる瞬間は、精神的な喪失感を冷徹かつ詩的に描写せよ。
