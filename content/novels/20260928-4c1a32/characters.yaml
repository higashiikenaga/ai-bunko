- name: カイル・ヴァン・クロムウェル
  role: 主人公
  age: 27
  gender: 男性
  appearance: 灰色の瞳と、使い古された銀の甲冑を纏った青年。記憶を失っているため、どこか虚空を見つめるような空虚な表情をしている。
  personality: 冷静で実直。過酷な状況でも目的を見失わない強靭な精神を持つが、内面には自分自身への不信感を抱えている。一人称：俺
  speech_style: 無駄がなく、淡々とした口調。感情の起伏が少ない。
  background: かつては騎士団の精鋭として名を馳せたが、ある戦いで魔法の代償として自身の過去を全て失った。名前以外の記憶を持たず、廃都で『遺言書』を見つけたことで旅に出る。
  motivation: 世界の色彩を取り戻し、失った「自分自身」の正体を知ること。
  relationships:
  - name: エルナ・ルミエール
    relation: 旅の相棒であり、唯一の心の拠り所
  - name: セレスティア・ヴァルガ
    relation: 思想の対極に位置する宿敵
  arc: 魔法を使うたびに人間性を削り、記憶を失う恐怖に直面するが、最終的には「個」の存続よりも「世界」の再生を選択し、歴史から消える自己犠牲の英雄へと至る。
- name: エルナ・ルミエール
  role: 相棒
  age: 19
  gender: 女性
  appearance: 灰色の世界で唯一、淡い金色の髪を持つ少女。光を蓄えた特殊な杖を携えている。
  personality: 明るく献身的だが、カイルが記憶を失っていく姿を目の当たりにし、深い絶望と恐怖を内に秘めている。一人称：私
  speech_style: 丁寧で穏やかだが、緊迫した場面では芯の強い話し方をする。
  background: 光を資源として管理する一族の生き残り。魔法の代償として記憶を失うことなく、光を「保存」する技術を持っている。
  motivation: カイルと共に、色彩に満ちた世界を再び見ること。
  relationships:
  - name: カイル・ヴァン・クロムウェル
    relation: 守りたいと願う大切なパートナー
  arc: カイルの摩耗していく精神を支え続ける中で、救済の残酷な条件を知る。最終的に、カイルが消えた後の世界で、彼が遺した「光」を繋ぐ役割を担う。
- name: セレスティア・ヴァルガ
  role: 敵役
  age: 32
  gender: 女性
  appearance: 漆黒のドレスに身を包み、瞳には凍てつくような理知が宿る美しい女性。聖都の支配者。
  personality: 冷酷かつ合理的。苦痛に満ちた現状を打破するには、全人類の記憶を消去し「無」に帰すことが唯一の救済だと信じている。一人称：私
  speech_style: 威厳に満ち、相手を諭すような、あるいは断罪するような高圧的な話し方。
  background: かつて『原初の鏡』を守護していた一族の末裔。灰域の過酷な真実を知り、記憶という呪いから人類を解放するために鏡の起動を目論む。
  motivation: 全生命の記憶を消去し、苦痛のない停滞した「完全な世界」を完成させること。
  relationships:
  - name: カイル・ヴァン・クロムウェル
    relation: 自身の計画を阻む、不確定で危険な存在
  arc: カイルの自己犠牲的な決意に触れ、自らの「救済」が単なる逃避であったのではないかと揺らぐが、最終的には自らの信念を貫こうとして敗北する。
- name: レオン
  role: 脇役/導き手
  age: 55
  gender: 男性
  appearance: 半透明の影のような姿をした、古びた記録媒体を抱えた老人。実体を持たない。
  personality: 厭世的で皮肉屋だが、どこか慈愛に満ちている。世界の行く末を静観している。一人称：私
  speech_style: 謎めいた比喩を多用し、直接的な答えを避けるような話し方。
  background: 前代の執行者。鏡の真実に近づきすぎたため、自身の存在そのものが記憶の代償として摩耗し、幽霊のような状態となっている。
  motivation: カイルに『遺言』の真意を伝え、鏡の正しい使い手を選別すること。
  relationships:
  - name: カイル・ヴァン・クロムウェル
    relation: 次代の執行者としての期待と、哀れみ
  arc: カイルの旅の指針となるが、彼が真実に辿り着く直前、自らの最後の記憶を使い果たして完全に消滅する。
