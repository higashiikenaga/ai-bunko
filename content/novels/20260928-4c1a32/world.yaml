title: 骸の聖都と忘却の鏡
genre: 異世界ファンタジー
tone: 硬質で冷徹なダークファンタジー
pov: 三人称
tense: 過去形
setting: 色彩を失い、永劫の黄昏に閉ざされた世界『灰域』。光を資源として奪い合う都市国家群。
premise: 記憶を代価に魔法を操る世界で、全てを失った元騎士カイルは、世界を再構築するとされる『原初の鏡』を探し求める。鏡に辿り着くには、かつての英雄たちが遺した血塗られた『遺言』を解き明かし、自身の存在を削り続けなければならない。救済の果てに待つのは、全人類の忘却か、それとも残酷な再生か。
themes:
- 救済の代償
- 個の喪失と意志
rules:
- 魔法の使用には『大切な記憶』を永続的に消費する必要がある。消費した記憶は二度と戻らず、精神的な欠損を招く。
- 鏡に映る姿は『理想の自分』であり、現実の自分と接触させることで能力を得られるが、その分だけ現実の肉体が崩壊する。
- この世界の光は有限であり、誰かが光を得ることは、別の誰かが絶対的な闇に突き落とされることを意味する。
plot_outline:
- '序盤: 記憶をほぼ全て失い、名前以外の自分を忘れたカイルが、廃都で前代の執行者が遺した『遺言書』を発見し、鏡への旅を始める。'
- '中盤: 鏡の破片を集める過程で、かつての戦友や家族の記憶を魔法の代償として捧げ、精神的に摩耗しながらも、鏡がもたらす偽りの全能感に依存していく。'
- '終盤: 聖都の最深部で『原初の鏡』と対面する。世界を元に戻す条件は、現存する全生命の記憶を消去し、白紙の状態からやり直すことだと判明する。'
- '結末: カイルは世界を救う道を選択するが、その代償として自分という存在が歴史から完全に抹消される。光り輝く新世界に、誰にも知られず、名もなき影として消えていく。'
style_notes: 地の文は装飾を排し、冷徹に状況を描写すること。台詞は最小限に留め、感情を切り捨てた鋭い言葉選びを行う。白と黒、光と闇の視覚的対比を強調し、勝利の瞬間に必ずそれに釣り合う残酷な喪失を描くこと。
