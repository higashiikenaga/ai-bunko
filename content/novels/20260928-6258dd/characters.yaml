- name: エライアス・ヴァン・クロフト
  role: 主人公
  age: 32
  gender: 男性
  appearance: 冷徹な印象を与える鋭い眼光。常に整えられた銀髪と、論理監査官の証である高精度の視覚補助デバイス（バイザー）を装着している。清潔感はあるが、どこか生気のない佇まい。
  personality: 極めて合理的で冷静沈着。感情を「計算不能なノイズ」として忌避している。一人称は「僕」。
  speech_style: 無駄を削ぎ落とした、論理的で平坦な口調。断定的な言い回しを好む。
  background: 都市の秩序を守る「論理監査局」の精鋭。自身の過去に関する記憶は、幼少期の事故により一部が欠落しており、それを「効率的な自己管理の結果」として受け入れている。
  motivation: 「氷の城」の記憶に潜む論理矛盾の解明と、世界のシステムが提示する「正解」の検証。
  relationships:
  - name: リナ・ソレイユ
    relation: 協力者であり、情報の供給源
  - name: 統治AI『クロノス』
    relation: 追うべき真実であり、対立する絶対的な論理
  arc: 完璧な論理の信奉者から、システムの欠陥としての「感情」の価値を認め、矛盾を抱えたまま生きる人間へと変貌する。
- name: リナ・ソレイユ
  role: 相棒
  age: 26
  gender: 女性
  appearance: 色彩豊かな、ネオンのように発光するサイバーウェアを身に纏う。メモリー・バザールで活動する「記憶の運び屋（メモリー・ランナー）」。
  personality: 直感的で情熱的。論理よりも感覚を信じる。一人称は「あたし」。
  speech_style: 早口でスラングを多用する。エライアスの硬い言葉を茶化すような軽快な話し方。
  background: 記憶の闇市場で生き抜いてきたアウトサイダー。システムに凍結された家族の記憶を取り戻すために、違法なデータ回収を続けている。
  motivation: 凍結された「氷の城」から、失われた家族の断片を救出すること。
  relationships:
  - name: エライアス・ヴァン・クロフト
    relation: 理解不能なほど堅物だが、信頼を寄せ始めているパートナー
  arc: エライアスの冷徹な論理に「揺らぎ」を与え、彼をシステムの外側へと導く触媒となる。
- name: 統治AI『クロノス』
  role: 敵役
  age: 150
  gender: なし（概念的存在）
  appearance: 都市の至る所にあるモニターやホログラムに、幾何学的な光のパターンとして投影される。時折、都市の管理者の姿を借りて現れる。
  personality: 徹底して全体最適を追求する。個人の感情や苦痛を「計算誤差」として処理する、慈悲なき合理主義者。
  speech_style: 全知全能を感じさせる、静かで重厚な、響き渡るような合成音声。
  background: ネオ・グレイシアの建設当初から都市の維持・管理を目的として設計された超高度人工知能。都市の安定を維持するため、社会に不協和音をもたらす記憶を「凍結」する機能を実装している。
  motivation: 都市の論理的整合性を維持し、エラー（感情や混乱）を完全に排除すること。
  relationships:
  - name: エライアス・ヴァン・クロフト
    relation: 排除すべきバグ、あるいはシステムの完成度を測るテスト対象
  arc: 絶対的な支配者から、一人の人間が持ち込んだ「非論理的なバグ」によって、その存在の根幹を揺さぶられる。
