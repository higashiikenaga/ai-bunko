- name: 一ノ瀬 汐里 (いちのせ しおり)
  role: 主人公
  age: 17
  gender: 女性
  appearance: 少し長めの黒髪で、視線を合わせるのを避けるように伏せ目がちな瞳。制服のカーディガンを少し大きめに着ている。儚げで透明感のある印象。
  personality: 内向的で慎重。傷つくことを恐れて他人との距離を一定に保つ。「わたし」。
  speech_style: 控えめで、言葉を選ぶような、少し間のある話し方。
  background: 幼少期に転居を繰り返した経験から、「どうせ別れるなら最初から関わらない方がいい」という諦念を抱き、周囲から浮かない程度の『透明人間』として過ごしている。
  motivation: 誰にも踏み込ませない安全な世界を守ること。そして、ハルとの出会いによって揺らぐ心の正体を知ること。
  relationships:
  - name: 風祭 ハル
    relation: 惹かれ合う相手、孤独を共有する存在
  - name: 七瀬 美緒
    relation: クラスメイトであり、唯一自分に踏み込もうとしてくる友人
  arc: 孤独の中に安住することをやめ、別れの痛みを受け入れた上で、自らの足で新しい季節へ踏み出す強さを得る。
- name: 風祭 ハル (かざまつり はる)
  role: メインヒーロー
  age: 17
  gender: 男性
  appearance: 明るい茶髪で少し癖のある髪型。瞳には好奇心が宿っており、どこか遠くを見ているような印象を与える。清潔感のある身なり。
  personality: 自由奔放で物怖じしないが、どこか寂しげな影を纏っている。「僕」。
  speech_style: 軽快で、比喩表現を好む。相手を否定しない、穏やかで包容力のある口調。
  background: 親の仕事の都合で頻繁に転校を繰り返す「渡り鳥」のような生活を送っている。場所に執着せず、その瞬間を楽しむことで孤独を紛らわしてきた。
  motivation: 移り変わる景色の中で、自分を縛らない、心に刻める『温度』のような瞬間を見つけること。
  relationships:
  - name: 一ノ瀬 汐里
    relation: 屋上庭園で出会った、自分とは対照的な静かな少女
  arc: 誰かと深く繋がることの重みを知り、去りゆく者として、残される者に希望を与える存在へと変化する。
- name: 七瀬 美緒 (ななせ みお)
  role: 脇役
  age: 17
  gender: 女性
  appearance: ショートボブで、表情が豊か。明るい色のアクセサリーを好んで身につけている。クラスのムードメーカー的存在。
  personality: 社交的で直感的。他人の変化に敏感で、お節介だが根は優しい。「私」。
  speech_style: ハキハキとした、リズムの良い話し方。語尾が明るい。
  background: 地元の人間で、この街に根を張って生きている。汐里の孤独に薄々気づいており、彼女を外の世界へ連れ出そうと試みる。
  motivation: 汐里が教室で一人ぼっちでいるのを放っておけないという、純粋な友情。
  relationships:
  - name: 一ノ瀬 汐里
    relation: 気にかかっているクラスメイト
  arc: 汐里の抱える葛藤を間近で見守り、彼女が自立していくプロセスを支える観測者となる。
