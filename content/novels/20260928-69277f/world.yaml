title: 空色の境界線、きみの温度
genre: 青春恋愛
tone: 甘くて切ない、内省的で柔らかな雰囲気
pov: 一人称（わたし）
tense: 過去形（回想形式）
setting: 現代の地方都市。放課後の旧校舎にある、忘れ去られた屋上庭園。
premise: 誰とも深く関わらずに過ごしてきた「わたし」は、転校を繰り返す少年・ハルと出会う。彼はまるで渡り鳥のように、いつかはこの街を去る運命にある。孤独という砂漠の中で、彼と過ごす時間だけが唯一のオアシスのように心地よく、けれど終わりが来ることが怖くてたまらない。静かな恋と、避けられない別れの物語。
themes:
- 喪失への恐怖
- 刹那的な幸福
rules:
- ハルは親の仕事の関係で、必ず半年から一年で転校する運命にあること
- 屋上庭園は二人だけの秘密の場所であり、他者に知られてはいけないこと
- 物語の中で『渡り鳥』と『砂漠のオアシス』を、心の拠り所と旅立ちの象徴として対比させること
plot_outline:
- '序盤: 教室の隅で透明人間のように過ごしていた「わたし」が、転校生のハルに秘密の屋上庭園を見つけられ、不器用な交流が始まる。'
- '中盤: 二人はお互いの孤独を共有し、次第に惹かれ合う。ハルが語る「旅する人生」に憧れつつも、彼がいつか去るという事実に、「わたし」は激しい不安と切なさを抱く。'
- '終盤: ハルの次の転校先が決まり、期限が迫る。行かないでほしいというエゴと、彼の自由な翼を奪いたくないという願いの間で、「わたし」の心は激しく揺れ動く。'
- '結末: ハルは旅立つが、彼は「わたし」に、一人で歩き出すための勇気と温かな言葉を残していく。彼が去った後の世界で、「わたし」はもう孤独を怖がらず、次の季節を待てるようになる。'
style_notes: 「わたし」の心の声を多用し、「〜かな」「〜だと思う」といった柔らかい語尾で、繊細な感情の揺れを表現する。風景描写に切なさを滲ませ、読者の心に寄り添うような文体にする。また、各話のラストには必ず、次話への期待や不安を誘う「気になる一言」を添えて締めくくること。
