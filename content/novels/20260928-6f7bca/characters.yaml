- name: カイエン
  role: 主人公
  age: 26
  gender: 男性
  appearance: 痩身で青白い肌。疲労の色が濃い瞳をしており、使い込まれた深海潜水服を纏っている。
  personality: 内省的で慎重。現状に諦めを抱きつつも、知的好奇心と責任感が強い。一人称は「僕」。
  speech_style: 静かで淡々としているが、独白の際は感情が漏れ出す。丁寧語が混じる話し方。
  background: 浮遊都市の深海調査員。過去に事故でパートナーを失ったトラウマがあり、孤独を好む傾向がある。
  motivation: 繰り返される絶望的なループを脱し、不確かながらも「明日」という時間を取り戻すこと。
  relationships:
  - name: アルキオーネ
    relation: 導き手であり、唯一の理解者
  - name: ジュリアン・ソーン
    relation: 思想的に対立する監視者
  - name: ミア
    relation: ループの中で失い続ける大切な同僚
  arc: 運命に翻弄される受動的な人間から、滅亡の可能性を受け入れてでも未来を選択する能動的な人間へと変化する。
- name: アルキオーネ
  role: 相棒/ガイド
  age: 0
  gender: 不詳
  appearance: 普段は真鍮製の機械鳥の姿。ホログラム展開時は、肌に時計の文字盤のような紋様を持つ少年の姿となる。
  personality: 超然としており、どこか突き放したような態度を取るが、根底には深い慈愛を持つ。一人称は「私」。
  speech_style: 古風で詩的な言い回しを好む。比喩表現が多く、答えを直接教えない。
  background: 古代文明が遺した「巨大な時計」の管理端末の一端。記憶の断片が散逸し、不完全な状態で起動していた。
  motivation: 時計の継承者となる人物を見極め、世界の時間を正しく前進させること。
  relationships:
  - name: カイエン
    relation: 観測対象であり、親友に近い存在
  arc: プログラムとしての役割を超え、カイエンとの交流を通じて「今この瞬間」という時間の儚さと美しさを理解する。
- name: ジュリアン・ソーン
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない軍服風の衣装に身を包み、鋭い眼光を持つ。常に冷徹な微笑を浮かべている。
  personality: 極端な功利主義者。少数の犠牲や停滞よりも、種としての生存（安定）を最優先する。一人称は「私」。
  speech_style: 論理的で断定的な口調。相手の精神的な弱点を突くような話し方。
  background: 浮遊都市の最高評議会議員。ループの正体を知っており、世界が崩壊しないよう意図的に再演を維持させようとしている。
  motivation: 不確実な未来を排除し、管理された永遠の停滞によって文明の存続を確実なものにすること。
  relationships:
  - name: カイエン
    relation: 計画を乱す不確定要素（ノイズ）
  arc: 絶対的な正義を信じていたが、カイエンの意志に触れ、自らが恐れていた「死ある生」の価値に気づかされる。
- name: ミア
  role: 脇役/精神的支柱
  age: 24
  gender: 女性
  appearance: 短く切り揃えた赤髪に、大きなゴーグルを首にかけている。快活な笑顔が特徴。
  personality: 直感的で楽観的。技術的な才覚に溢れ、カイエンの心を解きほぐすムードメーカー。一人称は「私」。
  speech_style: 快活でカジュアルな口調。擬音を多用する賑やかな話し方。
  background: 潜水艇のエンジニア。カイエンの良きパートナーであり、彼が唯一心を開いている人物。
  motivation: 深海の謎を解き明かし、人類が再び地に足をつけて暮らせる世界を夢見ている。
  relationships:
  - name: カイエン
    relation: 信頼し合う最高の相棒
  arc: ループのたびに死を迎える悲劇的な役回りだが、その純粋な生への渇望が、カイエンにループを断つ決意をさせる。
