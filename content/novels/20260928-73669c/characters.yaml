- name: 湊（みなと）
  role: 主人公
  age: 22
  gender: 男性
  appearance: 潮風に焼けた浅黒い肌と、少し伸びた黒髪。灯台守の作業着を常に着用している。瞳にはどこか深い喪失感を湛えている。
  personality: 真面目で頑固、やや内向的。大切なものを守ろうとする意志が強い。一人称：僕
  speech_style: 丁寧だが、感情が昂ると少し早口になる。静かな話し方。
  background: 幼い頃に母を海で亡くして以来、潮凪村の灯台を守り続けてきた。母の死に関する記憶が断片的であることに、常に心の穴を感じている。
  motivation: 『記憶を売る市場』に流出した母の記憶を買い戻し、彼女の死の真相を知ること。
  relationships:
  - name: 汐里
    relation: 導き手であり、謎めいた少女
  - name: 源蔵
    relation: 村の長であり、因習を守る障壁
  arc: 記憶への執着が引き起こす悲劇を知り、最終的には「忘れること」ではなく「大切なものを捧げて救済すること」の尊さを学ぶ。
- name: 汐里（しおり）
  role: 相棒/導き手
  age: 18
  gender: 女性
  appearance: 透き通るような白い肌と、濡れたように艶のある黒髪。どこか実体がないような、儚く美しい佇まい。
  personality: ミステリアスで浮世離れしている。慈悲深いようでいて、時に残酷なほど冷静。一人称：私
  speech_style: 囁くような、詩的で含みのある話し方。語尾が消え入るように終わる。
  background: 『記憶を売る市場』の周辺を徘徊する謎の少女。実は、かつて海に沈んだ村の記憶が形を成した「幻影」の断片である。
  motivation: 湊に真実を伝え、繰り返される村の呪縛（記憶の供出）を終わらせること。
  relationships:
  - name: 湊
    relation: 関心を寄せる対象であり、運命を共にする者
  arc: 湊の決断を通じて、自分がただの幻影であることを受け入れ、安らかな消滅（あるいは救済）を願うようになる。
- name: 源蔵（げんぞう）
  role: 敵役
  age: 75
  gender: 男性
  appearance: 深く刻まれた皺と、光を失った濁った瞳。常に海を睨みつけるような鋭い眼光を持つ老人。
  personality: 伝統と風習を絶対視する、冷酷なまでの合理主義者。一人称：儂（わし）
  speech_style: 重々しく、威圧感のある老人特有の話し方。断定的な口調。
  background: 潮凪村の長。村が海に飲み込まれずに済むよう、代々「記憶を海へ返す」という因習を厳格に守り続けてきた。
  motivation: 村の存続のために、新たな記憶を絶えず海へ捧げ続け、因習の連鎖を維持すること。
  relationships:
  - name: 湊
    relation: 伝統を乱す、危険な存在
  arc: 湊の行動によって自らが信じてきた因習が、単なる亡霊たちの幻影に過ぎなかったことを突きつけられ、崩壊していく。
