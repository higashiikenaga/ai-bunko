title: 凪の底に沈む記憶、潮満ちて蘇る約束
genre: 怪談・民俗
tone: 幻想的で哀愁漂う、静謐な恐怖
pov: 三人称
tense: 過去形
setting: 現代、地図から消えかかった断崖の漁村・潮凪村
premise: 潮の満ち引きとともに、忘れ去られたはずの「記憶」が漂着する古い港町。そこでは、失いたくない思い出を対価に、別の記憶を差し出す『記憶を売る市場』が密かに開かれている。灯台守の青年は、死んだはずの母の記憶を探して、禁じられた『約束の丘』へと足を踏み入れる。しかし、潮が満ちるたびに、村の人々は正体不明の「何か」へと変貌していく。
themes:
- 忘却と再生
- 海に捧げる供物
- 血縁の呪縛
rules:
- 記憶を売った者は、その経験を伴う感情も失う
- 潮が満ちる夜、海から這い上がる者は、かつて海に還った者の『なり損ない』である
- 約束の丘に立つ者は、決して背後を振り返ってはならない
plot_outline:
- '序盤: 灯台守の湊は、市場で売られている「懐かしい潮の香り」が、亡き母の記憶の一部であることに気づき、記憶を買い戻そうと試みる。'
- '中盤: 記憶を追い求めるうちに、湊は村の風習が「海への記憶の返済」であることを知る。市場で記憶を売った老人たちが、次第に瞳から光を失い、海へと向かう姿に恐怖を抱く。'
- '終盤: 湊は母の記憶の断片を求めて、霧に包まれた『約束の丘』へ登る。そこで彼は、記憶を売る市場の正体が、海に飲み込まれた村の亡霊たちが営む幻影であることを突き止める。'
- '結末: 満潮の刻、湊は自らの最も大切な記憶を海に捧げることで、母の魂を安らぎへと導く。灯台の灯りは静かに揺れ、湊はただ、寄せては返す波の音だけを聴き続ける。'
style_notes: 潮騒の音、波が礫を洗う音、灯台の回転する光の断続的なリズムを文章に組み込む。形容詞は湿り気を帯びたものを選び、読者の肌に潮の匂いが届くような、緩やかで重厚な筆致を用いること。
