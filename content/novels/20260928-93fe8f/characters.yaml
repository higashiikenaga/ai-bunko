- name: 清次
  role: 主人公
  age: 22
  gender: 男性
  appearance: 少し癖のある黒髪に、常に薬売りの背負い袋を背負っている。真面目そうだが、どこか落ち着きのない風貌。
  personality: 誠実すぎて嘘をつけない呪いを持つ、不器用で真っ直ぐな男。一人称は「俺」。
  speech_style: べらんめえ口調。真実を突くときは、意図せずとも言葉に鋭い重みが宿る。
  background: 幼い頃から何を言っても本心が口に出てしまう体質で、周囲に疎まれながらも薬売りとして独立して暮らしている。
  motivation: 嘘をつけない自分に折り合いをつけつつ、長屋の住人たちの平穏を守りたい。
  relationships:
  - name: お凛
    relation: 世話を焼いてくれる近所の少女
  - name: 源蔵
    relation: 街の不穏な空気の元凶として疑う相手
  arc: 自分の性質を「忌むべき呪い」と考えていたが、真実を語ることの強さを知り、己を受け入れていく。
- name: お凛
  role: 相棒・ヒロイン
  age: 17
  gender: 女性
  appearance: 快活な瞳と、いつも手際よく長屋の掃除をしている、活発で清潔感のある少女。
  personality: 明るく人懐っこいが、実は家族を大切にする芯の強さを持つ。一人称は「あたし」。
  speech_style: 威勢の良い江戸娘らしい、明るくテンポの良い話し方。
  background: 長屋の大家である善兵衛の孫娘。長屋のまとめ役として、住人たちから愛されている。
  motivation: 街に蔓延る不穏な影から、長屋の仲間や家族を守ること。
  relationships:
  - name: 清次
    relation: 不器用だが信頼している隣人
  - name: 善兵衛
    relation: 祖父
  arc: 街の異変に怯える弱さを見せるが、清次の真っ直ぐな言葉に触れ、勇気を持って立ち向かう。
- name: 源蔵
  role: 敵役
  age: 38
  gender: 男性
  appearance: 端正な顔立ちだが、瞳の奥が常に冷たく、夜の闇に馴染むような黒い着物を纏っている。
  personality: 計算高く、言葉巧みに人を操る。嘘を武器にして人心を惑わす男。一人称は「私」。
  speech_style: 丁寧で穏やかだが、どこか人を食ったような、含みのある話し方。
  background: 深川の「眠らない街」の噂を広め、人々の不安を煽ることで、街の裏側を支配しようとしている謎の男。
  motivation: 人々の迷妄をコントロールし、街の秩序を自身の意のままに作り変えること。
  relationships:
  - name: 清次
    relation: 自らの嘘を暴こうとする最大の障壁
  arc: 完璧な嘘で築いた支配が、清次の「剥き出しの真実」によって瓦解していく恐怖を味わう。
- name: 善兵衛
  role: 脇役・メンター
  age: 58
  gender: 男性
  appearance: 恰幅の良い体型で、いつも温和な笑みを浮かべている、長屋の大家。
  personality: おおらかで包容力があるが、街の変調には鋭い勘を持つ。一人称は「わし」。
  speech_style: 落ち着いた、深みのある江戸っ子口調。
  background: 長年、深川の長屋を守り続けてきた人物。街の歴史と人々の機微を熟知している。
  motivation: 長屋の住人たちが、季節の移ろいと共に健やかに暮らしていくこと。
  relationships:
  - name: お凛
    relation: 孫娘
  - name: 清次
    relation: 少し厄介だが、放っておけない住人
  arc: 街の異変を察知し、清次たちが真実に向き合うための精神的な支柱として振る舞う。
