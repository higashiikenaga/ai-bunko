title: 江戸・千代田長屋の嘘つき、宵闇に笑う
genre: 歴史・時代小説
tone: 賑やかで温かみのある人情もの
pov: 三人称
tense: 過去形
setting: 江戸、深川あたりの長屋。季節は秋から冬にかけて。
premise: 神隠しが多発する「眠らない街」と呼ばれた深川の片隅で、嘘をつけない呪いを持つ奇妙な薬売りの青年・清次が暮らしている。清次はどんなに繕おうとしても、本心を口走ってしまう不器用な男だった。ある晩、長屋の住人が大切なものを失い、街を彷徨う怪しい影に怯える中、清次は自身の呪いと向き合いながら、人々の隠した真実を紐解いていく。季節が冬へと移ろう頃、冷え切った心に灯る火のような、人情の物語。
themes:
- 真実と誠実さ
- 人々の繋がりと赦し
rules:
- 清次は如何なる状況下でも、自身の本音を隠すことができず、言葉として漏れ出してしまう。
- 深川の一角には、夜通し灯りが消えず、人々が奇妙な高揚感と共に眠れなくなる『眠らない街』と呼ばれるエリアが存在する。
plot_outline:
- '序盤: 秋の味覚、焼き茄子の香りが漂う長屋の日常。嘘をつけない清次が、長屋の住人たちの些細な隠し事（隠れて食べた菓子や、こっそりした遊び）を暴いては、べらんめえ口調でやり過ごす様子を描く。'
- '中盤: 冬の足音が近づき、街に冷たい風が吹く頃、不眠に悩む者が増える。清次は、自分が「嘘をつけない呪い」のせいで、街の不穏な動き（眠らない街の正体）に気づいてしまう。ある夜、長屋の娘が、街の影に飲み込まれそうになる。'
- '終盤: 清次は、嘘をつけない自分の性質を逆手に取り、真実を突きつけることで、街を覆う迷妄を打ち破る。寒空の下、人々の偽りの心を剥ぎ取り、剥き出しの言葉をぶつけ合う。'
- '結末: 騒動が落ち着き、長屋には冬の訪れを告げる煮込み料理の湯気が立ち上る。清次は相変わらず嘘をつけないが、それゆえに真っ直ぐな言葉で隣人を励まし、人情に満ちた冬の夜を迎える。'
style_notes: 三人称視点。江戸っ子らしいべらんめえ口調の会話を軽快に、かつリズム良く展開すること。季節の移ろいに合わせ、秋の味覚（焼き茄子、松茸）から冬の味覚（大根の煮物、鰤の刺身）への変化を情緒豊かに描写せよ。単なる事件解決ではなく、長屋の人々の温かなやり取りと、最後は人情で心が温まる結末を徹底すること。
