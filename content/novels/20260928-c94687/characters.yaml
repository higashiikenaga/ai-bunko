- name: ハル・セリザワ
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの黒髪で、常にどこか虚ろな瞳をしている。デバイス故障後は、清潔感はあるが色彩を失ったような淡い服装を好む。
  personality: 思慮深く内向的。システムが提供する「正解の感情」に依存していたが、孤独を知ることで独自の感性を持ち始める。一人称は「僕」。
  speech_style: 静かで丁寧。感情の起伏が少ないが、猫と接する時やルナと対峙する時だけ、言葉に熱が宿る。
  background: 感情同期システム『アンサンブル』に最適化された市民として育つ。双子の妹・ルナとは常に感情を共有し、衝突のない穏やかな生活を送ってきた。
  motivation: システムが押し付ける「完全な幸福」ではなく、自分自身の寂しさや痛みを含めた「個」としての実感を取り戻すこと。
  relationships:
  - name: ルナ・セリザワ
    relation: 双子の妹
  - name: 名もなき猫
    relation: 唯一の理解者であり、生の手触りを教えてくれる存在
  arc: システムの調和の中にいた受動的な少年から、孤独を引き受けてでも自らの意志で生きる能動的な個人へと成長する。
- name: ルナ・セリザワ
  role: 相棒
  age: 17
  gender: 女性
  appearance: ハルと対照的に、明るい色彩の服を着こなし、常に表情が豊か。システムによって最適化された「完璧な笑顔」を纏っている。
  personality: 社交的で協調性が高い。システムが提供する心地よさを愛しているが、変化していく兄に対して不安と強い好奇心を抱く。一人称は「私」。
  speech_style: 明るく、リズムの良い話し方。周囲の感情に同調しているため、常に調和のとれたトーンを維持している。
  background: ハルと共に『アンサンブル』の恩恵を最大限に受けて育った。兄との同期が途切れたことに戸惑い、システムへの不信感と兄への愛着の間で揺れる。
  motivation: 兄との繋がりを取り戻したいという願いから、次第にシステムが隠蔽しようとしている「個の真実」へと踏み出していく。
  relationships:
  - name: ハル・セリザワ
    relation: 双子の兄
  arc: システムの管理された幸福に安住する立場から、兄と共に不完全で予測不能な「真の共感」を選択する立場へと変わる。
- name: 管理者エリス
  role: 敵役
  age: 45
  gender: 女性
  appearance: 隙のないスーツに身を包み、瞳には常に淡い光のデバイスが埋め込まれている。感情の揺らぎを一切感じさせない無機質な美しさを持つ。
  personality: 冷徹で合理的。個人の感情の揺らぎを「社会のノイズ」と見なし、完全同期による秩序の維持を絶対的な善と考えている。一人称は「私」。
  speech_style: 事務的で淀みがなく、説得力のある、しかし血の通わない論理的な話し方。
  background: 感情同期システムの運用・管理を行う中央局の幹部。システムのアップデートによる「完全同期」の導入を主導している。
  motivation: 争いや孤独のない、完全に予測可能な「静寂な社会」を完成させること。
  relationships:
  - name: ハル・セリザワ
    relation: 排除すべきエラー（ノイズ）
  arc: 秩序を維持する完璧な管理者としての役割を全うしようとするが、ハルとルナの「非合理な絆」に直面し、システムの限界を突きつけられる。
