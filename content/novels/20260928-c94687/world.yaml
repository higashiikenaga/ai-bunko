title: 同期しない午後の、微熱な静寂
genre: SF
tone: 静謐でノスタルジックな近未来
pov: 三人称近接
tense: 過去形
setting: 2070年代、感情同期システム『アンサンブル』が普及した地方都市
premise: 他者の感情をゆるやかに共有し、孤独を解消するデバイスが当たり前となった世界。同期し合うことで「正解の心地よさ」を享受する双子の兄妹だが、兄のデバイスがある日故障し、世界から切り離された「個」の寂しさを知る。そんな彼が路地裏で出会ったのは、システムに登録されていない、名前のない一匹の本物の猫だった。
themes:
- 個の孤独と充足
- 不完全であることの愛おしさ
rules:
- 『アンサンブル』はウェアラブル端末を通じて周囲の平均的な感情を同期させ、精神的な不協和音（ストレスや悲しみ）を自動的に軽減する。
- ペットの多くはホログラムやバイオ擬似体であり、個体識別IDによる管理が義務付けられている。
- 同期から外れた状態（オフライン）は、現代社会において精神的な疾患か、社会的な逸脱と見なされる。
plot_outline:
- '序盤: 感情同期システムの中で調和して生きる双子の兄妹。しかし兄・ハルはデバイスの故障により、周囲が感じている「幸福感」と同調できなくなり、言いようのない孤独と、世界が灰色に見える感覚に陥る。'
- '中盤: 街の隅で、IDタグを持たない本物の猫を拾ったハル。誰とも同期せず、ただそこに存在する猫の予測不能な動きや体温に、彼はシステム上の心地よさとは違う「生」の手触りを感じ始める。妹のルナもまた、兄の変化に戸惑いながらも、同期しない彼が持つ独特の色彩に惹かれていく。'
- '終盤: システムのアップデートにより、個人の感情の揺らぎを完全に排除する「完全同期」が導入されようとする。ハルは猫と共に、自分の「寂しさ」という個性を守るため、そしてルナに本当の意味での共感（同期ではなく、理解）を伝えるために、あえてシステムを拒絶する選択をする。'
- '結末: 二人は完全同期から外れ、社会的な不便さと小さな孤独を引き受ける。けれど、名前のない猫を囲んで過ごす午後の静寂の中で、彼らはデジタルな幸福よりもずっと深い、不完全で温かい絆を見つける。'
style_notes: ホログラムの揺らぎや空調の作動音など、近未来の生活音を背景に配置し、便利さによって削ぎ落とされた「不便な感情」を丁寧に描写する。専門用語を説明的に書かず、日常会話の文脈に溶け込ませ、読者に感覚的に理解させる構成とする。
