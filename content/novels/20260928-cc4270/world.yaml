title: 潮汐の特異点と静止した波形
genre: SF
tone: 硬質で理知的。知的好奇心を刺激する静謐なトーン
pov: 三人称
tense: 過去形
setting: 24世紀、土星の衛星エンケラドゥスの氷殻下海洋
premise: 氷の殻に覆われた衛星エンケラドゥスで、ある日、物理的に不可能なはずの電波信号『夜明けのラジオ』が受信される。信号の発信源は、数万年の時を経て沈没した海底遺跡であった。主人公の物理学者は深海へと潜行し、その信号が宇宙の物理定数を局所的に維持するための『調律装置』であることに気づく。
themes:
- 文明の継承
- エントロピーへの抗い
rules:
- 深海での通信はニュートリノ通信が主であり、電磁波（ラジオ）は気泡内など極めて限定的な環境でしか伝播しない
- 海底遺跡の動力源は土星の重力による潮汐加熱（タイダルヒーティング）を利用した熱電発電である
- 物理法則（一般相対性理論および量子力学）に厳格に従い、超光速通信や魔法的な能力は排除する
plot_outline:
- 序盤：氷殻上の観測基地にて、地球の古い形式を模した謎のラジオ放送を受信。その信号が海底の特定座標から発せられていることを突き止める。
- 中盤：潜水艇で深海へ降下し、超高圧環境に耐えうる未知の素材で造られた海底遺跡を発見。そこがかつての先駆文明による重力制御施設であったことを知る。
- 終盤：土星の軌道変動により遺跡の重力均衡が崩れ、衛星全体が崩壊する危機に直面。ラジオ信号の周波数を鍵として、特異点制御システムを再起動させる。
- 結末：衛星の崩壊は免れたが、装置の再起動に伴い信号は永久に途絶える。主人公は土星の巨大な環が空を埋め尽くす光景を眺め、文明の孤独なバトンを受け継ぐ。
style_notes: ハードSFとして、潮汐加熱やニュートリノ振動などの科学的根拠を物語の推進力にする。専門用語を用いる際は、比喩や補足説明を加え、読者のセンス・オブ・ワンダーを喚起する。土星の環という天体規模の視覚的スケール感を強調して描写する。
