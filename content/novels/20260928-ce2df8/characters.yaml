- name: ミミ
  role: 主人公
  age: 12
  gender: 女性
  appearance: 白くてふわふわした長い耳と、小さな青い郵便鞄がトレードマークのうさぎ。
  personality: 真面目で好奇心旺盛、困っている人を放っておけない優しさを持つ。一人称は「わたし」。
  speech_style: 「〜です」「〜ます」といった、丁寧で一生懸命な話し方。
  background: 雲の上のおとしもの街で、おてがみ便りの新米社員として働いている。
  motivation: 宛先が消えてしまった古い手紙を、どうしても届けたい。
  relationships:
  - name: 灯台の番人・トト
    relation: 相談相手
  - name: クジラのルル
    relation: 手紙の主
  arc: 失敗を恐れる新米から、想いを届けることの尊さを知る誇り高い郵便屋さんへ。
- name: 灯台の番人・トト
  role: 導き手
  age: 150
  gender: 男性
  appearance: 大きな丸眼鏡をかけた、知的な雰囲気のフクロウ。星空のような模様のローブを着ている。
  personality: 穏やかで包容力があり、全てを見通しているような賢者。一人称は「私（わたくし）」。
  speech_style: ゆっくりとした、落ち着いたリズムの話し方。
  background: 雲の果ての「空の灯台」を長年守り続けている番人。
  motivation: ミミの旅が正しい道を進めるよう、見守り助言を与えること。
  relationships:
  - name: ミミ
    relation: 旅の助言者
  arc: 変化なし（ミミの成長を見守る役割）
- name: リスのアピ
  role: 相棒
  age: 8
  gender: 女性
  appearance: 大きな尻尾と、空飛ぶためのゴーグルを頭に載せた元気なリス。
  personality: 明るく前向きで、少しおっちょこちょいな性格。一人称は「あぴ」。
  speech_style: 「〜だよ！」「〜だもん！」といった、弾むような明るい話し方。
  background: 空飛ぶ船の整備と操縦を手伝う、ミミの旅の同行者。
  motivation: ミミと一緒に新しい世界を見て、冒険を楽しむこと。
  relationships:
  - name: ミミ
    relation: 旅の仲間
  arc: ミミの真剣な姿に触れ、自分の役割（船の操縦）に自信と誇りを持つようになる。
- name: クジラのルル
  role: 重要な受取人
  age: 500
  gender: 性別不詳
  appearance: 夜空を泳ぐように空を漂う、巨大で透き通った青いクジラ。体に星屑のような模様がある。
  personality: 非常に穏やかだが、長い間独りだったため少し寂しがり屋。一人称は「僕」。
  speech_style: 深い海の底から響くような、ゆったりとした優しい話し方。
  background: ずっと昔から空の果てで、誰かが自分を思い出してくれるのを待っていた。
  motivation: 誰かと心を通わせ、孤独を癒やすこと。
  relationships:
  - name: ミミ
    relation: 新しい友人
  arc: 孤独の中で待ち続けていた手紙を受け取ることで、世界との繋がりを取り戻す。
