title: ふわふわうさぎの おてがみ便りと 空の灯台さん
genre: 日常ほのぼの
tone: 温かくて優しい、読み聞かせのような雰囲気
pov: 三人称
tense: 過去形
setting: 空に浮かぶ島々が集まる「雲の上のおとしもの街」
premise: おてがみを届けるお仕事をしている、うさぎのミミさん。ある日、宛先が消えてしまった不思議な古い手紙を拾います。ミミさんは空飛ぶ船に乗って、忘れられた想いが集まる「空の灯台」を目指して旅に出ます。途中で出会う動物さんたちと心を通わせながら、手紙の主を探す優しい物語です。
themes:
- 思いやり
- 小さな勇気
rules:
- 動物や道具が人間と同じように話し、生活している。
- 空飛ぶ船は、乗っている人の「わくわくする気持ち」を燃料にして動く。
- 空の灯台は、手紙に込められた『気持ちの香り』を嗅ぎ分けることができる。
plot_outline:
- '序盤: おてがみ便りの新米社員であるうさぎのミミが、宛先のない古ぼけた手紙を拾い、灯台の番人さんに相談しに行くことに決める。'
- '中盤: 空飛ぶ船で旅をしながら、困っているリスさんや眠れない雲さんなど、さまざまな住民を助け、少しずつ手紙の主の手がかりを集める。'
- '終盤: ついに最果ての古い灯台に到着し、灯台さんの助けを借りて、手紙がずっと昔に生きる寂しがり屋のクジラさんへ向けられたものであると突き止める。'
- '結末: 手紙が無事に届けられ、クジラさんとミミは友達になります。ミミは「誰かを想う気持ち」が一番大切な宝物であることに気づき、誇りを持って郵便屋さんを続けます。'
style_notes: ひらがなを多めに使い、小さなお子様にも伝わるやわらかい表現を徹底します。「〜ですね」「〜でしょう」といった、読者に語りかけるような優しい口調を用い、難しい漢字や言葉は避けます。毎話、おやつの時間や昼寝のような、ささやかな幸せの描写を入れ、さりげなく「相手の気持ちを考えることの大切さ」を伝えます。
