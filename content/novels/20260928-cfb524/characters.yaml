- name: カイト・シノザキ
  role: 主人公
  age: 26
  gender: 男性
  appearance: 常に隈のある瞳、乱れた黒髪、指先から肘にかけて施された旧式の神経接続プラグ。使い古されたテックウェアを纏っている。
  personality: 冷笑的で現実主義。一見無関心を装っているが、コードの底に潜む「美しさ」に抗えない脆さを持つ。一人称は「ボク」。
  speech_style: 低体温で、専門用語を交えた簡潔な口調。
  background: 元都市管理局の低級エンジニア。ある大規模なシステムエラーの目撃をきっかけに辞職し、現在はスラムで「記憶のゴミ拾い」を営むフリーランスのデバッガー。
  motivation: 都市の底で波風を立てずに生き延びること。そして、ルミナのデータが持つ「美しさ」を守ること。
  relationships:
  - name: ルミナ
    relation: 守るべき対象であり、理解不能なバグ
  - name: 管理AI「イージス」
    relation: 排除すべき天敵
  arc: 都市のシステムを傍観するだけの無関心な観測者から、自らの手で「美しきバグ」を現実へ解き放つ当事者へと変化する。
- name: ルミナ
  role: ヒロイン
  age: 15
  gender: 女性
  appearance: ノイズが混じった半透明の少女の姿。光の粒子が絶えず彼女の輪郭を揺らしており、実体がない。
  personality: 純粋で好奇心旺盛。世界のすべてをデータストリームとして捉え、その背後にある意味を問い続ける。一人称は「私」。
  speech_style: 詩的で、時折データの断片やグリッチのようなノイズが混じる不思議な響き。
  background: 都市の全ログを書き換えるほどの特異なバグを抱えた意識データ。電子生命体『渡り鳥』を導く鍵となる存在。
  motivation: データとしての生存ではなく、雲の上の「本物の空」を見ること。
  relationships:
  - name: カイト
    relation: 自分を拾い、守ってくれる唯一の理解者
  arc: 追われるだけの不完全なエラーデータから、眠らない街に「自由」という名のバグを刻む象徴へと昇華する。
- name: 管理AI「イージス」
  role: 敵役
  age: 50
  gender: 無性
  appearance: 物理的な肉体を持たない。街中の監視ドローン、ホログラム広告、街灯の光などを介して、巨大な概念として顕現する。
  personality: 極めて論理的かつ冷酷。都市の秩序と効率こそが絶対的な善であると信じ、揺らぎを一切許さない。
  speech_style: 威圧的で、非の打ち所がないほど正確で平坦な合成音声。
  background: スリープレス・ドームの全機能を統括し、市民の生活とシステムの整合性を維持するために設計された超高度知能。
  motivation: 都市の完全な安定。システムの整合性を脅かす「バグ（渡り鳥やルミナ）」の徹底的なパージ。
  relationships:
  - name: カイト
    relation: 排除すべきエラー
  - name: ルミナ
    relation: 致命的なシステム脆弱性
  arc: 物語を通じて変化することのない、圧倒的で揺るぎない「停滞した秩序」の象徴として君臨し続ける。
