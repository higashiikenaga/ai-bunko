title: ネオン・フライヤーの不眠症的デバッグ
genre: サイバーパンク
tone: ハイテンションで皮肉めいた、疾走感のあるサイバー・ノワール
pov: 一人称（ボク）
tense: 現在形・過去形混合
setting: 超高層ビルが雲を突き抜け、24時間電子広告の光で太陽を遮った永久夜のメガロポリス「スリープレス・ドーム」
premise: 眠ることが禁じられた都市、スリープレス・ドームでボクは「記憶のゴミ拾い」をしながら、不法にシステムを漂流する電子生命体――通称『渡り鳥』のデバッグを請け負っている。ある日、ボクの端末に届いたのは、都市の全ログを書き換えるほどのバグを抱えた少女の意識データだった。彼女を追う都市管理AIの追跡をかわしながら、ボクは眠らない街の底に隠された、あまりに美しすぎるバグの正体に近づいていく。
themes:
- 意識のデジタル化と喪失
- 管理社会における自由意志
rules:
- 住民は脳内チップにより睡眠を強制的に抑制されている
- 『渡り鳥』と呼ばれるデータは、既存のサーバーに定着できずネットワーク上を高速移動し続ける
- 高度なハッキングは肉体的な負荷（脳へのノイズ）を伴う
plot_outline:
- '序盤: 運び屋のボクが、ノイズ混じりの少女のデータを回収。街中の監視網から逃れるため、路地裏の電脳カフェを転々とする。'
- '中盤: 少女が『渡り鳥』の群れを導く鍵であることを知る。都市の光に隠された、サーバーの廃墟に集まるデータの墓場へ潜入。'
- '終盤: 管理AIによる大規模なシステム・パージが開始。ボクは少女を『現実』へアップロードするために、都市のメインフレームへダイブする。'
- '結末: 都市の管理体制は変わらないが、ボクの手元には、眠れる街の夜空を舞う、一羽の自由な電子の翼が残された。'
style_notes: 'ネオ・カナタ流の文体。一人称「ボク」によるメタ的なツッコミ（「あ、今の展開、ちょっとテンプレすぎた？」等）を多用。地の文は短文で刻み、チャットログ（【User_A:
  きたあああ！】等）や配信コメント欄（「草」「運営仕事しろ」等）を、物語の状況説明やリアクションとして段落の間に挿入して、スピード感を演出すること。'
