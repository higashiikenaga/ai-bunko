- name: ノア
  role: 主人公
  age: 14
  gender: 女性
  appearance: 藍色の瞳と、霜の降りたような白い肌を持つ少女。厚手の旅人のケープを纏っている。
  personality: 臆病だが、一度決めたことは曲げない芯の強さを持つ。一人称は「私」。
  speech_style: 穏やかで、少し控えめな話し方。
  background: 星の見える世界から、霧の深いこの村へ迷い込んだ少女。自身の過去の記憶に、説明のつかない欠落を感じている。
  motivation: 空に星を取り戻し、霧に覆われた世界の理を正すこと。
  relationships:
  - name: 銀月
    relation: 旅の相棒
  arc: 未知への恐怖を克服し、世界を救うために「最も大切な記憶」を捧げる決断をする。
- name: 銀月
  role: 相棒
  age: 0
  gender: 性別不明
  appearance: 星図が刻まれた古びた布を背負った、美しい銀色の毛並みの狐。瞳は夜空のような深い青。
  personality: 冷静沈着で厭世的。しかし、時折深い哀愁を見せる。一人称は「我」。
  speech_style: 達観した、古風で重みのある話し方。
  background: かつて星々の運行を記録し、神に仕えたとされる伝説の獣の末裔。
  motivation: 星の破片（神々の魂）を空へと還し、失われた星空を再生させること。
  relationships:
  - name: ノア
    relation: 導くべき旅人
  arc: 孤独な観測者として生き続けてきたが、少女との交流を通じて「喪失」の痛みを知る。
- name: 氷の揺籃
  role: 敵役
  age: 5000
  gender: 無性
  appearance: 氷の結晶が渦巻く、不定形の巨大な影。中心部には凍りついた無数の瞳が浮かんでいる。
  personality: 感情を持たず、ただ「記憶を食らう」という摂理に従う怪異。
  speech_style: 言葉を発さず、冷たい風の音や脳内への直接的な共鳴として伝わる。
  background: 神が作り損ねた「氷の城」そのものの意志であり、城を守る防衛機構。
  motivation: 訪れる者の記憶を喰らい、城の永遠の静寂を維持すること。
  relationships:
  - name: ノア
    relation: 捕食対象
  - name: 銀月
    relation: かつての監視対象
  arc: 少女が捧げた「温かな記憶」という異質な輝きに直面し、静寂を乱される。
