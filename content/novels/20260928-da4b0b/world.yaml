title: 星図を綴る銀狐と、凍てつく祈りの城
genre: 怪談・民俗
tone: 幻想的でどこか寒々しい、静謐な童話調
pov: 三人称
tense: 現在形（進行中の出来事を描くような躍動感のある文体）
setting: 常夜の霧が立ち込める、北端の断崖に位置する忘れ去られた村
premise: 空には星がなく、ただ冷たい霧だけが流れる村に、一人の少女が迷い込みます。彼女が出会ったのは、古びた星図を背負った一匹の銀色の狐でした。二人は、かつて神が作り損ねたとされる「氷の城」に眠る、星の破片を探す旅に出ます。しかし、その城は訪れた者の「最も大切な記憶」を氷に変えて喰らう、恐ろしい場所だったのです。
themes:
- 記憶の代償
- 孤独と共生
- 失われた神話
rules:
- 星図に描かれた星座が消えるたび、その星に関連する人々の記憶が世界から消える
- 氷の城の結界は、温かな感情を持つ者ほど深く凍てつく
plot_outline:
- '序盤: 霧の村に辿り着いた少女が、言葉を解する銀狐と出会い、空に星が消えていく現象の異常さに気づく。'
- '中盤: 星図を頼りに、氷の城へと続く険しい道を歩む二人。道中、狐が語る「かつて空に星が溢れていた時代」の怪談を聞きながら、少女は少しずつ自分自身の記憶が凍りつく恐怖を味わう。'
- '終末: 氷の城の最深部で、星の破片が実は「かつて死んだ神々の魂」であることを知る。城を守る怪異との対峙。'
- '結末: 少女は自らの最も温かな記憶を捧げることで星を空に戻すが、その代償として、狐との出会いさえも忘れてしまう。ただ、空には新しい星座が輝き始める。'
style_notes: 「いまここで」起きている出来事を、まるで夜の帳が下りる瞬間の静けさを写し取るように描写する。残酷な現象であっても、美しく、どこか懐かしい童話のような語り口を用いること。銀狐の毛並みの白さや、氷の城の冷たさを、触覚に訴える言葉で綴る。
