- name: ヘルマン・フォン・ベルン
  role: 主人公
  age: 42
  gender: 男性
  appearance: 痩身で神経質そうな面持ち。度の強い眼鏡をかけ、常に厚手の防寒コートを纏っている。指先にインクの汚れが絶えない。
  personality: 徹底した合理主義者で、感情よりも論理的整合性を優先する。一人称は「私」。
  speech_style: 淡々としており、断定的な口調。専門用語を多用し、相手に説明を強いる傾向がある。
  background: 元・物理学教授であり、現在は政府系の特例調査員として「解決不能な物理的矛盾を伴う事件」の事後分析を請け負っている。
  motivation: 氷の城で起きた「熱力学的矛盾」という知的なパズルを解き明かし、物理法則の正しさを証明すること。
  relationships:
  - name: カイル
    relation: 助手。能力は認めているが、その楽観的な性格を疎ましく思っている。
  - name: エリアス・ソーン
    relation: かつての学問的ライバルであり、本件の元責任者。不信感を抱いている。
  arc: 純粋な論理の追求者が、記録の隙間に潜む人間の醜悪なエゴと、計算不可能な「情念」という変数に直面し、思考を揺さぶられる。
- name: カイル・リード
  role: 相棒
  age: 26
  gender: 男性
  appearance: 丸顔で快活。オーバーサイズの防寒着に身を包み、常に最新型の解析タブレットを携帯している。
  personality: 好奇心旺盛で適応能力が高い。緊迫した状況でも冗談を忘れないムードメーカー。一人称は「僕」。
  speech_style: 口調は軽く、若者らしい砕けた話し方。感嘆符を多用する。
  background: 通信工学の天才的な才能を持つエンジニア。灯台の不規則な光信号をデジタルデータに変換する解析を担当している。
  motivation: ヘルマンのもとで未知の現象に触れることに興奮しており、この不可解な事件の「正体」を突き止めたい。
  relationships:
  - name: ヘルマン・フォン・ベルン
    relation: 師のような存在。彼の偏屈さを理解し、サポートすることに充足感を得ている。
  arc: 単なる技術的サポートから、灯台の信号に隠された「人間的なメッセージ」に気づくことで、事件の感情的な側面にアプローチする役割へと成長する。
- name: エリアス・ソーン
  role: 敵役
  age: 58
  gender: 男性
  appearance: 白髪混じりの整った髪型に、冷徹な青い瞳。極北の環境に不似合いなほど隙のない身なりをしている。
  personality: 傲慢で完璧主義。自らの名声と理論の正当性を何よりも重視する。一人称は「私」。
  speech_style: 慇懃無礼で、相手を静かに見下すような話し方。比喩表現を好む。
  background: 「氷の城」計画の主導者であり、元・首席研究員。消失事件の際、唯一「不在」であったことが証明されているが、そのアリバイは完璧すぎる。
  motivation: 自身の理論を否定する「ありえない観測結果」を抹消し、歴史上の正解を書き換えること。
  relationships:
  - name: ヘルマン・フォン・ベルン
    relation: 知的な競争相手。ヘルマンが真実に辿り着くことを期待しつつ、同時に阻止しようとしている。
  - name: 消失した研究員たち
    relation: 使い捨ての駒として利用し、不要になったため排除した対象。
  arc: 完璧な論理的迷宮を構築したと自負していたが、自身が軽視していた「微細な物理的痕跡（ノイズ）」によって、その傲慢さが暴かれる。
- name: サラ・リンチ
  role: 脇役（記録上の人物）
  age: 31
  gender: 女性
  appearance: （遺された写真にて）鋭い眼差しと、結い上げた髪が特徴的な、知的な雰囲気を持つ女性。
  personality: 誠実で責任感が強く、妥協を許さない。直感に優れた鋭い洞察力を持つ。一人称は「私」。
  speech_style: 簡潔で論理的だが、日記などの私的な記録には激しい焦燥感と恐怖が滲んでいる。
  background: 消失した研究員の一人。熱力学の専門家であり、基地内で最初に「時間のズレ」と「データの改ざん」に気づいた人物。
  motivation: （生前）観測された真実を後世に伝えるため、物理的なトリックを用いた「死後のメッセージ」を残すこと。
  relationships:
  - name: エリアス・ソーン
    relation: かつての信頼していた上司。彼が真実を隠蔽しようとしていることに気づき、激しく対立した。
  - name: ヘルマン・フォン・ベルン
    relation: 時空を超えて対話する相手。記録を通じて彼に真相を託した。
  arc: 物語の序盤から中盤にかけて、残された記録を通じてその人物像が浮かび上がり、最終的にヘルマンに決定的なヒントを与える「不在の導き手」となる。
