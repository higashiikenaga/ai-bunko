title: 凍結層における非可逆的な時間変位、あるいは極北の隔離環境における消失事件に関する考察
genre: 本格ミステリー
tone: 学術的、乾いた、断片的、冷徹な観察
pov: 一人称（調査記録者）および、複数の資料（手記、検死報告書、通信ログ）の混淆
tense: 現在形および過去形（報告の性質による）
setting: 現代、北極圏に位置する、かつて観測基地であった廃墟「氷の城（アイス・キャッスル）」および、その隣接地に佇む旧式の自動点灯式灯台。
premise: 極北の観測基地「アイス・キャッスル」において、閉鎖環境下で研究員3名が忽然と姿を消した。発見されたのは、凍結した室内における不自然な配置の遺留品と、物理法則を無視した熱力学的矛盾を示す記録のみであった。本報告書は、断片的な観測ログと現地の微細な物理的痕跡を再構成し、犯行の成立可能性を検討するものである。不可解なのは、生存者が存在し得ない環境下で、いかにして「痕跡」が書き換えられたのかという点である。
themes:
- 観測による現実の確定
- 閉鎖環境における心理的崩壊
- 因果律の逆転
rules:
- 極北の基地内では、特定の波長を用いることで外部との通信が完全に遮断される
- 氷の城内部の温度管理システムは、特定のパターンで誤作動を起こす性質を持つ
- 物理的な接触痕跡は、気温の変化によって数時間で消失・変質する
plot_outline:
- '序盤: 調査員ヘルマンによる、放棄された観測基地の現地調査記録。灯台から送られてくる不規則な光信号の解析と、基地内に残された「空白の記録」の提示。'
- '中盤: 現場に残された日記や音声データから、研究員たちが「時間的なズレ」を感じ始めていたことが判明。氷の城の構造自体が、ある種の物理的トリックを隠蔽するための装置であった可能性の浮上。'
- '終盤: 消失した研究員の足跡が、なぜ「過去から未来へ向かう方向」で凍結していたのかという矛盾の解明。灯台の回転周期と、基地内の気圧変化を用いた、密室におけるアリバイ工作の特定。'
- '結末: 犯行の動機は、観測データに現れた「存在しないはずの観測結果」を隠蔽するためであった。真犯人が残した、物理学的に不可能なはずの「最後の一筆」が、調査記録の脚注に密かに混入される。'
style_notes: 物語は一貫して、学術的な「報告書」や「調査メモ」の形式をとる。地の文は客観的で感情を排した論文調とし、読者が解くべき謎（トリック）は、脚注（Footnote）や図表の記述、あるいは「引用文献の齟齬」として断片的に配置すること。叙述トリックを用いる際は、学術用語の定義や、前提条件となる観測データの「誤認」を突く手法を用いる。
