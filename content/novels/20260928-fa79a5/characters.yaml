- name: 天宮 陽葵
  role: 主人公
  age: 22
  gender: 女性
  appearance: 明るい茶髪のポニーテール。常にエプロンを着用し、ポケットには常にスパイスやメモ帳が入っている。表情が豊かで、目がキラキラしている。
  personality: 天真爛漫で食いしん坊。困っている人（あるいは生き物）を見捨てられないお節介焼き。一人称は「あたし」。
  speech_style: 「お腹空いてるなら、これ食べなよ！」といった、元気で親しみやすい、語尾が跳ねるような話し方。
  background: 代々「境界のカフェ」を守ってきた祖母から店を継いだ。異世界の存在に対しても物怖じせず、料理の力で心を通わせる術を心得ている。
  motivation: 訪れる旅人たちに最高の「美味しい」を届け、彼らの疲れを癒やすこと。
  relationships:
  - name: ルル
    relation: お世話している迷い客
  - name: ゼノ
    relation: 頼りになる常連客
  arc: ただ「美味しいものを作る」だけでなく、旅人が去っていく寂しさと、また出会える希望の両方を受け入れ、店主としての精神的な成長を遂げる。
- name: ルル
  role: 重要キャラクター
  age: 0
  gender: 不明
  appearance: 普段は青く輝く小さな小鳥の姿。人間の姿に化けた時は、透き通るような銀髪を持つ、どこか儚げな少年。
  personality: 臆病で内向的だが、美味しいものを食べると少しずつ表情が明るくなる。一人称は「僕」。
  speech_style: 「……これは、なあに？」といった、消え入りそうな、静かで丁寧な話し方。
  background: 異界の渡り鳥の一種だが、激しい次元の嵐に巻き込まれ、故郷への帰り道と自分自身の記憶を失ってしまった。
  motivation: 失った記憶を取り戻し、再び仲間たちの待つ空へと帰ること。
  relationships:
  - name: 天宮 陽葵
    relation: 自分を救ってくれた恩人
  - name: ゼノ
    relation: 異界の知識を教えてくれる年上の友人
  arc: 陽葵の料理を通じて「自分が何者か」を思い出し、孤独な迷子から、再び空を飛ぶ勇気を持った旅人へと変わる。
- name: ゼノ
  role: 脇役/常連客
  age: 35
  gender: 男性
  appearance: 銀髪の長髪を後ろで緩く結んでいる。旅慣れた雰囲気のコートを羽織り、常に落ち着いた眼差しをしている。
  personality: 冷静沈着で博識。陽葵の賑やかさを微笑ましく見守る、大人な余裕がある。一人称は「私」。
  speech_style: 「おや、また賑やかになりましたね」といった、落ち着いた、少し古風で知的な話し方。
  background: 数多の異世界を渡り歩いてきたベテランの旅人。このカフェのルールや、異界の地理に詳しい。
  motivation: 旅の合間に、陽葵の作る料理で束の間の休息を得ること。
  relationships:
  - name: 天宮 陽葵
    relation: 店主であり、元気をもらう存在
  - name: ルル
    relation: 放っておけない後輩
  arc: 物語の中盤ではルルの記憶を取り戻すための助言者となり、終盤ではパーティーを盛り上げる立役者となる。
- name: 結衣
  role: 脇役
  age: 17
  gender: 女性
  appearance: 現代的な制服姿の女子高生。カフェの裏口からよく食材の配達に現れる。
  personality: 現実主義だが、カフェの不思議な現象を「面白い」と受け入れる好奇心旺盛な性格。一人称は「私」。
  speech_style: 「また変な客が来たんですか？」といった、少しぶっきらぼうだが世話焼きな話し方。
  background: 近所の商店街の娘。偶然このカフェの秘密を知ってしまい、時々手伝いや食材の調達を手伝っている。
  motivation: 日常の中に潜む非日常を楽しみ、陽葵たちの活動をサポートすること。
  relationships:
  - name: 天宮 陽葵
    relation: 憧れのお姉さん兼、バイト仲間
  arc: 異世界の住人と日常の人間との境界線を感じながら、自分の世界が広がっていく喜びを知る。
