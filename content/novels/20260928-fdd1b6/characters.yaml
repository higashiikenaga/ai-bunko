- name: 瀬戸 凪（せと なぎ）
  role: 主人公
  age: 18
  gender: 男性
  appearance: 少し長めの黒髪で、どこか寂しげな瞳をしている。制服の着こなしは丁寧だが、全体的に影がある印象。
  personality: 内向的で思慮深い。自分の感情を言葉にするのが苦手。一人称は「僕」。
  speech_style: 静かで控えめ。相手の言葉をよく聞き、一拍置いてから答えるような慎重な話し方。
  background: 閉鎖的な寄宿学校に通う高校3年生。両親の転勤が重なり、海辺の町で孤独を感じながら過ごしている。
  motivation: 自分の中にある空虚感を埋められる何かを探している。汐里との交流を通じて、自分の声を見つけようとする。
  relationships:
  - name: 白石 汐里
    relation: 手紙を通じて心を通わせる相手、憧憬の対象
  - name: 佐伯 蓮
    relation: 唯一の友人
  arc: 孤独を「諦め」として受け入れていた状態から、痛みを知った上で「言葉」を紡ごうとする意志を持つようになる。
- name: 白石 汐里（しらいし しおり）
  role: ヒロイン
  age: 18
  gender: 女性
  appearance: 透き通るような肌と、雨に濡れたような質感の長い髪。どこか浮世離れした儚い雰囲気を持つ。
  personality: 繊細で感受性が強い。表面的には穏やかだが、内側に激しい葛藤を秘めている。一人称は「私」。
  speech_style: 丁寧だが、どこか諦念を含んだ響きがある。詩的な表現を好む。
  background: 名家の令嬢として厳格な教育を受けており、寄宿学校でも周囲から一線を画して扱われている。言葉による表現を日記や手紙に託している。
  motivation: 誰にも理解されない「本当の自分」を、せめて誰かの記憶にだけは刻みたいと願っている。
  relationships:
  - name: 瀬戸 凪
    relation: 手紙のやり取りを通じて魂の理解者となる相手
  arc: 自分を閉じ込めていた「沈黙」から一歩踏み出し、たとえ届かなくても伝えることの尊さを、凪に（無意識に）示す。
- name: 佐伯 蓮（さえき れん）
  role: 脇役
  age: 18
  gender: 男性
  appearance: 快活な印象を与える短髪。制服を少し崩して着こなしている。表情が豊か。
  personality: 社交的で明るいが、凪の孤独を察してさりげなく距離を保つ優しさを持つ。一人称は「俺」。
  speech_style: 等身大の高校生らしい、率直でくだけた話し方。
  background: 凪の数少ない友人。海辺の町の出身で、凪がこの町に馴染めるよう気を配っている。
  motivation: 凪が卒業を前に、少しでも前向きな思い出を作れるようにと願っている。
  relationships:
  - name: 瀬戸 凪
    relation: 親友
  arc: 凪の変容を傍で見守り、彼が最後に手紙を書く決意をしたとき、その背中を静かに肯定する存在となる。
