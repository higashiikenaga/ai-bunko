- name: エリアン・ソリス
  role: 主人公
  age: 22
  gender: 男性
  appearance: 透き通るような白い肌に、銀縁の眼鏡をかけている。常にインクの染みた指先と、深い紺色の司書服を纏った、静謐な佇まいの青年。
  personality: 内向的で思慮深い。他者の記憶という「他人の人生」を愛でることに安らぎを感じている。一人称は「私」。
  speech_style: 丁寧で控えめな口調。古風な言い回しを好む。
  background: 蒐集船の書庫に生まれ育った世襲の守り手。現実の世界よりも、書物の中に封じ込められた結晶化した記憶の世界に心地よさを感じている。
  motivation: 失われた記憶の断片を修復し、この世界の成り立ちという「究極の真実」を解き明かすこと。
  relationships:
  - name: ヴァレリウス
    relation: 信頼しているが、価値観の異なる船長
  - name: リリア
    relation: 禁忌の書を通じて惹かれ合った運命の相手
  - name: テオ
    relation: 目をかける後輩であり、唯一の友人
  arc: 静かな傍観者であったが、リリアとの出会いを通じて「誰かを救いたい」という烈しい情熱を獲得し、最終的に自らを犠牲にして世界に記憶を還す決断をする。
- name: ヴァレリウス
  role: 相棒/船長
  age: 38
  gender: 男性
  appearance: 使い込まれた軍服風のコートを羽織り、右目に記憶の潮流を読み取る特殊な単眼鏡（モノクル）を装着している。日に焼けた肌と鋭い眼光が特徴。
  personality: 現実主義で厳格。船と乗組員の安全を最優先とするが、根は情に厚く、脆いエリアンを密かに保護している。一人称は「俺」。
  speech_style: ぶっきらぼうで断定的。命令口調に近いが、端々に配慮が滲む。
  background: かつて「記憶の都」への遠征に失敗し、多くの仲間を失った過去を持つ。そのため、禁忌の記憶に触れることに強い忌避感を持っている。
  motivation: 蒐集船を安全に航行させ、乗組員を一人も欠かさずに生かし続けること。
  relationships:
  - name: エリアン・ソリス
    relation: 危うさを感じつつも、その純粋さを認めている保護対象
  arc: 過去のトラウマから記憶の追求を禁じていたが、エリアンの覚悟に触れ、最後には彼が選んだ運命を静かに受け入れ、その記憶を運ぶ責任を引き受ける。
- name: リリア
  role: 敵役/導き手
  age: 不詳（外見は17歳前後）
  gender: 女性
  appearance: 真紅の結晶で構成された幽玄な少女。髪はルビーのように砕け散りながら揺らめき、瞳には絶望と渇望が混在している。
  personality: 物憂げで残酷な一面を持つ。愛されたいという強烈な執着心を持っており、相手を自分と同じ結晶の世界へ引き込もうとする。一人称は「私」。
  speech_style: 囁くような、詩的で曖昧な話し方。問いかけに問いで返すことが多い。
  background: かつて「記憶の都」で最も愛された女性だったが、永遠の美を求めて自らを結晶化させた。現在は禁忌の書に封印されていた記憶の残滓。
  motivation: 自分を完全に理解し、結晶の檻から解放してくれる（あるいは共に堕ちてくれる）魂を見つけること。
  relationships:
  - name: エリアン・ソリス
    relation: 自らの孤独を埋めてくれる唯一の理解者として執着する
  arc: エリアンを破滅へ導こうとするが、彼の無償の愛と自己犠牲に触れ、最後には彼に「もっとも美しい記憶」を託して消滅する。
- name: テオ
  role: 脇役
  age: 15
  gender: 男性
  appearance: サイズの合わない大きな眼鏡をかけ、常にメモ帳を抱えている。そばかすのある、好奇心に満ちた少年。
  personality: 天真爛漫で楽観的。知識欲が旺盛で、危ない橋を渡ることを厭わない。一人称は「僕」。
  speech_style: 早口で熱量が高い。感嘆符を多用する話し方。
  background: もともとは雲海の浮遊島で孤児だったが、蒐集船に拾われ、エリアンの弟子として書庫の手伝いをしている。
  motivation: 伝説の宝石（記憶）を見つけ出し、世界で一番の記憶蒐集家になること。
  relationships:
  - name: エリアン・ソリス
    relation: 心から尊敬する師であり、兄のような存在
  arc: 記憶の美しさと、それに伴う残酷さを学び、精神的に成長する。結末では、エリアンが残した「硝子の花」を世に伝え続ける語り手となる。
