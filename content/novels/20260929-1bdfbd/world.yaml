title: 銀華の柩と、星屑を掬う空飛ぶ蒐集船
genre: 伝奇
tone: 耽美で退廃的、静謐な狂気
pov: 一人称
tense: 過去形
setting: 雲海に浮かぶ浮遊島群と、失われた記憶を運び続ける巨大な空飛ぶ蒐集船。
premise: 世界は、零れ落ちた記憶が宝石となって漂う、永遠の薄明に包まれた硝子の檻であった。私は、雲海を渡る巨大な蒐集船の片隅、古びた書物の香りに満ちた書庫の守り手である。ある夜、私は頁から溢れ出す真紅の雫——それは、かつて誰かが愛し、そして壊してしまった情熱の結晶だった。その美しさに触れた瞬間、私の魂は微かな亀裂を刻み、星屑の如き忘却へと引き寄せられていく。私は、砕け散る前に、この世界の真実という名の、もっとも脆い宝石を手にしなければならない。
themes:
- 記憶の不変性と忘却の美学
- 自己の崩壊と永遠の美
rules:
- 記憶は宝石の形をとり、その輝きは持ち主の感情の純度に依存する
- 記憶を過剰に消費すると、魂は硝子のように透明化し、やがて風に溶けて消える
- 空飛ぶ船は、失われた記憶が放つ微かな引力を糧に、雲海を航行する
plot_outline:
- '序盤: 雲海を渡る蒐集船での静かな日常。古本屋の主として、結晶化した記憶を綴った書物を修復し、その輝きを愛でる日々を描く。'
- '中盤: 真紅の結晶を持つ禁忌の書を手にしたことで、船の航路が狂い始める。船は、かつて美しさを求めすぎて自らを結晶化させた「記憶の都」へと吸い寄せられていく。'
- '終盤: 都の正体が、生ける屍となった宝石の庭園であることを知る。主人公は、自らの魂を最後の供物として捧げ、船を救うための「もっとも美しい記憶」を紡ぎ出す決意をする。'
- '結末: 船は新たな空へと旅立つが、主人公の姿はもうどこにもない。ただ、古本屋の棚に、透き通った硝子の花が一輪、静かに、永遠に咲き続けている。'
style_notes: 言葉のひとつひとつを、磨き上げられた宝石や、薄氷のように繊細な花弁として扱うこと。感情の揺らぎは、光の屈折や、硝子が砕け散る瞬間の煌めきに託して描写せよ。読者の視界が、常に美しさと脆さの狭間で震えるような、装飾的で詩的な語り口を貫くこと。
