- name: 陽葵（ひまり）
  role: 主人公
  age: 26
  gender: 女性
  appearance: 都会的な清潔感はあるが、どこか疲れを感じさせる表情。作業時は使い込まれたエプロンを着用。
  personality: 真面目で責任感が強いが、自分に自信が持てない。一人称は「私」。
  speech_style: 丁寧で少し控えめな話し方。
  background: 都会の広告代理店で働いていたが、人間関係と仕事のプレッシャーに疲れ、逃げるように故郷へ戻る。
  motivation: 祖父の遺した店を守りながら、自分自身の居場所と生き方を見つけること。
  relationships:
  - name: 佐伯 誠一
    relation: 町の相談役・メンター
  - name: 織田 芳江
    relation: 修理依頼の客
  arc: 壊れたものを直す過程で人々の記憶に触れ、他者の温かさを知ることで、自分自身の欠落していた自信を取り戻していく。
- name: 佐伯 誠一（さえき せいち）
  role: メンター
  age: 72
  gender: 男性
  appearance: 白髪混じりの短髪に、常に穏やかな微笑みを浮かべている。古本屋の店主。
  personality: 博学で包容力があり、町の歴史に詳しい。一人称は「わし」。
  speech_style: ゆったりとしていて、聞き手に安心感を与える落ち着いた口調。
  background: 陽葵の祖父の親友。町のあらゆる出来事を知る、町の生き字引のような存在。
  motivation: 陽葵が祖父の意志（町の人々との絆）を正しく受け継げるよう、遠くから導くこと。
  relationships:
  - name: 陽葵
    relation: 見守る存在
  arc: 陽葵の成長を通じて、自身の人生の歩みと、かつての友との思い出を改めて肯定する。
- name: 織田 芳江（おだ よしえ）
  role: 脇役
  age: 75
  gender: 女性
  appearance: 背筋が伸びた、上品で少し厳格な印象を与える老婦人。常に身なりを整えている。
  personality: プライドが高く、感情を表に出すのが苦手な不器用な性格。一人称は「私」。
  speech_style: 凛とした、少し硬い言葉遣い。
  background: 町の名士の家系。夫との長年の不和により、心を閉ざして孤独に暮らしている。
  motivation: 過去のわだかまりを解消し、再び誰かと心を通わせること。
  relationships:
  - name: 陽葵
    relation: 修理依頼の客
  - name: 織田 茂
    relation: 夫
  arc: 鏡が映し出す幸福な記憶と地図の導きにより、忘れていた夫への愛を思い出し、和解へと歩み出す。
- name: 蓮見 拓海（はすみ たくみ）
  role: 相棒
  age: 24
  gender: 男性
  appearance: 日焼けした肌と、活動的な服装が似合う快活な青年。地元の郵便局員。
  personality: 明るく世話焼きで、困っている人を放っておけない。一人称は「僕」。
  speech_style: 威勢が良く、親しみやすいフレンドリーな話し方。
  background: 町で生まれ育った青年。町の地理や人情に非常に明るい。
  motivation: 活気のない町を盛り上げ、自分たちの居場所をより良くしていくこと。
  relationships:
  - name: 陽葵
    relation: 協力者・友人
  arc: 陽葵の活動をサポートする中で、町の人々が持つ物語の価値を再発見し、町への誇りを深める。
