- name: 如月 栞
  role: 主人公
  age: 27
  gender: 女性
  appearance: 眼鏡をかけ、常に控えめな色のカーディガンを羽織っている。指先にはいつもかすかにインクの跡がある。
  personality: 静かで内省的。本の中に答えを求める傾向がある。一人称は「わたし」。
  speech_style: 丁寧で控えめ。相手の言葉を慎重に選んで受け止める話し方。
  background: 都会での生活に疲れ、祖父が遺した私設図書館「月読書房」を引き継いで運営している。
  motivation: 持ち込まれた図鑑の謎を解き、本来の持ち主へ届けることで、本の持つ「繋ぐ力」を信じたい。
  relationships:
  - name: 成瀬 海
    relation: 天文知識を頼る協力者であり、気安い友人
  - name: 一ノ瀬 源蔵
    relation: 謎の図鑑を持ち込んだ依頼人
  arc: 受動的な管理人から、誰かの想いを能動的に繋ごうとする人間へと変化する。
- name: 成瀬 海
  role: 相棒
  age: 21
  gender: 男性
  appearance: 寝癖のある髪にオーバーサイズのパーカー。常に小型の双眼鏡を首から下げている。
  personality: 好奇心旺盛で直感的。天文学のことになると早口になるオタク気質。一人称は「俺」。
  speech_style: カジュアルで快活。専門用語を混ぜながら熱っぽく語る。
  background: 地元の大学で物理学を専攻する学生。「月読書房」の天体観測コーナーの常連。
  motivation: 図鑑に記された「存在しない星座」という知的パズルを解き明かしたい。
  relationships:
  - name: 如月 栞
    relation: 静かな彼女のペースに心地よさを感じている
  arc: 理論やデータだけでなく、星に込められた「人の感情」という不確定な要素の価値に気づく。
- name: 一ノ瀬 源蔵
  role: キーマン
  age: 74
  gender: 男性
  appearance: 銀髪に整えられた口髭。仕立ての良い古風な三つ揃えのスーツを纏い、品格がある。
  personality: 穏やかだが、どこか寂しげな影を持つ。礼儀正しく、秘密主義な一面がある。一人称は「私」。
  speech_style: 古風で落ち着いた口調。含みを持たせた言い回しを好む。
  background: かつてこの街で教師をしていた。数十年前にある女性と交わした「約束」を、不器用な勘違いで果たせなかった後悔を抱えている。
  motivation: 自分の人生の最後に、誤解を解き、図鑑をあるべき場所へ戻したい。
  relationships:
  - name: 高瀬 すみれ
    relation: かつての親友であり、密かに想いを寄せていた相手
  - name: 如月 栞
    relation: 信頼して大切な遺物を託した相手
  arc: 過去の罪悪感から解放され、穏やかな気持ちで人生の幕を閉じようとする。
- name: 高瀬 すみれ
  role: 脇役
  age: 72
  gender: 女性
  appearance: 柔和な表情を浮かべ、淡い色のストールを巻いている。星のような輝きを持つ瞳が印象的。
  personality: 楽観的で包容力がある。物事を寛容に捉えるが、星のことだけは譲れない情熱を持つ。一人称は「私」。
  speech_style: ゆったりとした、リズムのある優しい話し方。
  background: 若き日に天文学を志したが、家庭の事情で街を離れた。現在は遠方で小さな花屋を営んでいる。
  motivation: かつて誰かが自分に贈ろうとした「星のメッセージ」に、今さらながら気づきたい。
  relationships:
  - name: 一ノ瀬 源蔵
    relation: 青春時代を共に過ごした、かけがえのない友人
  arc: 忘れかけていた若き日の夢と、自分に向けられていた深い善意を再確認し、心が満たされる。
