title: 星降る夜の図書室と、欠けた月の落としもの
genre: 本格ミステリー
tone: 穏やかで温かい、日常の微かな違和感を解く物語
pov: 一人称（わたし）
tense: 過去形
setting: 現代、地方都市の片隅にある、古本と天体観測が趣味の人々が集まる小さな私設図書館「月読書房'
premise: 古本屋兼図書館を営む「わたし」のもとに、ある夜、一冊の古い天体図鑑が持ち込まれます。その図鑑のページには、なぜか見たこともない星座の星図が書き込まれており、さらに、次の月食の夜に待ち合わせをするという不思議なメモが挟まっていました。持ち主を探す過程で、図鑑に隠された「誰かの善意」と、かつて起きた小さな勘違いの物語が、星の動きとともに紐解かれていきます。
themes:
- 世代を超えて受け継がれる善意
- 言葉にできなかった想いの再発見
rules:
- 事件はあくまで日常の範囲内であり、死者や犯罪者は登場しない
- 謎解きの鍵は、図鑑に記された星図の整合性と、月食という自然現象のタイミングにある
plot_outline:
- '序盤: 閉店間際の「月読書房」に、一人の老紳士が古い天体図鑑を預けに来る。図鑑には奇妙な星図と、月食の夜を指すメモが残されていた。'
- '中盤: 「わたし」はメモの主を探すため、図鑑の持ち主の足跡を辿る。星図の配置が、ある特定の場所からしか見えない星座であることを突き止め、街の天文ファンたちに聞き込みを行う。'
- '終盤: 月食の夜、図鑑のメモが指し示す場所へ向かうと、そこにはかつての持ち主が残した「ある約束」と、星図に込められた本当の意味が明らかになる。'
- '結末: 誤解されていた過去の出来事が、星の巡りのように自然に解消され、図鑑は本来あるべき場所へと戻っていく。夜空を見上げながら、人はまた新しい物語を始める。'
style_notes: 一人称「わたし」による、軽やかで少しとぼけた語り口。難解な専門用語は避け、星や月の美しさを日常の風景に溶け込ませるように描写する。論理的な謎解きを行いながらも、読後感は温かいティータイムのような優しさを保つこと。
