- name: 鏡崎 海斗
  role: 主人公
  age: 24
  gender: 男性
  appearance: 都会での生活に疲れた疲れ気味の表情。眼鏡をかけており、痩せ型。祖母の形見である古びた懐中時計を身につけている。
  personality: 合理的で懐疑的だが、情に脆い。一人称は「僕」。
  speech_style: 丁寧だが、どこか距離を置いた淡々とした話し方。
  background: 大学卒業後、市役所に勤める。幼少期に村を離れ、記憶の中の故郷は断片的なものとなっている。
  motivation: 祖母の死の真相を突き止め、村の不気味な風習から脱出すること。
  relationships:
  - name: 金村 宗久
    relation: 村の権力者として警戒し、利用される対象
  - name: 鏡崎 紗夜
    relation: 唯一信頼を寄せる親族であり、警告をくれる導き手
  arc: 都会的な合理主義で事象を捉えようとするが、次第に逃れられない血の宿命と狂気に飲み込まれ、最後には自己を喪失する。
- name: 金村 宗久
  role: 敵役
  age: 72
  gender: 男性
  appearance: 実年齢より遥かに若く見える、不自然に張り詰めた肌。常に隙のない和装に身を包み、視線が鋭い。
  personality: 冷酷で支配的。村の伝統を絶対視している。一人称は「私」。
  speech_style: 古風で威厳があり、相手を威圧するような緩慢な口調。
  background: 隠れ鏡村の村長であり、『鏡合わせの儀』を司る祭祀責任者。代々、鏡の力を用いて若さと権力を維持してきた。
  motivation: 村の存続と自身の若さを維持するため、最適な『器』となる海斗を儀式に捧げること。
  relationships:
  - name: 鏡崎 海斗
    relation: 獲物として、また次代の器として目を付けている
  arc: 海斗を精神的に追い詰め、完璧なタイミングで鏡の世界へと突き落とすことで、自身の支配体制を盤石にする。
- name: 鏡崎 紗夜
  role: 相棒/ガイド
  age: 19
  gender: 女性
  appearance: 透き通るように白い肌と、どこか焦点の合わない瞳。常に鏡を覆うための白い布を肩にかけている。
  personality: 内向的で悲観的。常に何かに怯えているが、海斗に対しては強い親近感を抱く。一人称は「私」。
  speech_style: 消え入りそうなほど小さな声で、断片的に重要な情報を伝える。
  background: 海斗の遠い親戚。かつての儀式で「不完全な器」となり、半分だけ鏡の世界に魂を奪われたため、村人から忌み嫌われている。
  motivation: 海斗にだけは自分と同じ絶望を味わわせたくないという切なる願い。
  relationships:
  - name: 鏡崎 海斗
    relation: 唯一の理解者であり、救いたいと願う相手
  - name: 金村 宗久
    relation: 恐怖の対象であり、憎悪している
  arc: 海斗に警告し続け、彼を逃がそうと奔走するが、最終的に彼が鏡に飲まれるのを目の当たりにし、絶望の中で彼と共に沈んでいく。
