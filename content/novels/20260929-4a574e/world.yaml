title: 鏡痣の村
genre: 怪談・民俗
tone: 静謐で息苦しい土着ホラー
pov: 三人称
tense: 過去形
setting: 昭和末期、深い山々に囲まれた閉鎖的な村「隠れ鏡村」
premise: 祖母の死を受けて故郷の村に戻った主人公は、床下に隠されていた一通の古い手紙を見つける。そこには「祭りの間、決して鏡を覗いてはならない」という切実な警告が記されていた。しかし、村人が信仰する『鏡合わせの儀』の正体を知ったとき、彼は自分自身の姿が鏡の中で静かに変貌していることに気づく。
themes:
- 継承される罪
- 身体の喪失と代替
rules:
- 村にある『聖鏡』を覗き、特定の儀式を行うことで、自身の老いや病を鏡の中の分身に肩代わりさせることができる
- 肩代わりさせた者は若さを保つが、次第に味覚や触覚などの感覚を失い、精神が鏡の側へ引き寄せられる
- 鏡に閉じ込められた『泥（泥身）』たちは、祭りの夜に元の肉体を取り戻そうと境界を越えて現れる
plot_outline:
- '序盤: 主人公が村に帰省し、祖母の遺品から宛先のない失われた手紙を発見する。村では鏡を布で覆い隠す奇妙な風習があり、住民たちは不自然なほど若々しく、どこか空虚な表情をしている。'
- '中盤: 村の祭りが近づくにつれ、主人公は鏡に映る自分の顔が、自分ではない誰かに似てきていることに気づく。手紙の正体が、かつて鏡に身を捧げた親族からの警告であったことを知る。'
- '終盤: 祭りの最高潮、禁忌を破り聖鏡に触れた主人公は、鏡の向こう側に積み重なった無数の『泥』たちの絶望を目撃する。同時に、村人たちが彼を新しい『器』として捧げようとする計画が明らかになる。'
- '結末: 鏡の世界と現実の境界が崩壊し、村全体が鏡の迷宮へと変貌する。主人公は脱出を試みるが、鏡の中にいた『もう一人の自分』に身体を乗っ取られ、静かに鏡の底へと沈んでいく。'
style_notes: 湿り気を帯びた静かな描写を徹底し、逃げ場のない閉塞感を演出する。村人の会話には鈍い響きの地方方言を交え、よそ者を拒絶する土着的な不気味さを強調すること。
