- name: カイ・ヴェイン
  role: 主人公
  age: 17
  gender: 男性
  appearance: 額に使い古したゴーグルをかけ、油汚れのついたオーバーオールを着用。好奇心に満ちた明るい琥珀色の瞳を持つ。
  personality: 楽観的で行動力がある。諦めの悪い性格。一人称は「俺」。
  speech_style: 真っ直ぐで情熱的。年上に対しても物怖じせず、率直な物言いをする。
  background: 辺境の島で飛空艇の整備士として働いていた少年。幼い頃から「雲の下に何があるか」に強い憧れを抱いていた。
  motivation: 伝説の航路図を辿り、世界の中心にある『最終列車』に乗って地上へ降り立つこと。
  relationships:
  - name: ライラ
    relation: 信頼し合う旅の相棒
  - name: ガーム
    relation: 師弟のような関係であり、喧嘩仲間
  - name: ヴァレリウス将軍
    relation: 追跡してくる宿敵
  arc: 単なる好奇心からの旅だったが、旅を通じて世界の歪みを知り、空と地上の調和を取り戻すという大きな使命感を持つリーダーへと成長する。
- name: ライラ・ウィンドランナー
  role: 相棒（ナビゲーター）
  age: 18
  gender: 女性
  appearance: 風になびく長い青色の髪。真鍮製の高度なアストロラーベを常に持ち歩いている。理知的な印象を与える眼鏡をかけている。
  personality: 冷静沈着で完璧主義。計算に基づいた行動を好むが、内面には激しい冒険心を秘めている。一人称は「私」。
  speech_style: 論理的で丁寧だが、カイの無鉄砲さに対しては皮肉を交えた口調になる。
  background: 帝国の天文航海学院を首席で卒業したが、教科書通りの空に疑問を持ち、真実の航路を求めて飛び出した脱落者。
  motivation: 既存の地図を書き換え、失われた『世界の中心』を証明すること。
  relationships:
  - name: カイ
    relation: 直感的に動く彼に呆れつつも、その純粋さに惹かれている
  - name: ガーム
    relation: 効率を重視する自分と職人気質の彼の間で衝突が絶えない
  arc: 数値と計算だけが正解だと信じていたが、カイと共に旅をすることで、計算不可能な「風の意志」や「絆」という直感的な価値を認めるようになる。
- name: ガーム・アイアンハート
  role: 相棒（メカニック）
  age: 45
  gender: 男性
  appearance: がっしりとした体格に、火傷の痕がある太い腕。重厚な革のエプロンを身に纏い、常に葉巻をくゆらせている。
  personality: 気難しく口が悪いが、機械への愛は誰よりも深い。情に脆い不器用な性格。一人称は「俺」。
  speech_style: ぶっきらぼうで粗野。口調は激しいが、要所で的確な助言を与える。
  background: 元帝国軍の首席技師。軍の非道な兵器開発に嫌気がさして脱走し、辺境の島で隠居生活を送っていた。
  motivation: 帝国に利用されない、純粋に空を飛ぶための究極の機体を完成させること。
  relationships:
  - name: カイ
    relation: 若さゆえの無謀さを叱りつつ、その才能を高く評価している
  - name: ヴァレリウス将軍
    relation: かつての同僚であり、最も軽蔑している相手
  arc: 過去の罪悪感から逃げていたが、カイたちの純粋な目標に触れ、再び自分の技術を「誰かを救うため」に使う誇りを取り戻す。
- name: ヴァレリウス将軍
  role: 敵役
  age: 52
  gender: 男性
  appearance: 汚れ一つない純白の軍服に、銀色のモノクルを装着。冷徹で鋭い眼差しを持つ。
  personality: 傲慢で支配欲が強く、秩序こそが正義だと信じている。一人称は「私」。
  speech_style: 極めて優雅で慇懃無礼。相手を精神的に追い詰める話し方をする。
  background: 帝国軍の最高司令官。浮遊島の資源を独占し、地上のコントロール権を得ることで、空の世界の絶対的な支配者になろうと画策している。
  motivation: 『最終列車』を奪取し、地上へ降りて新世界の神として君臨すること。
  relationships:
  - name: カイ
    relation: 計画を乱す不愉快な小蝿として排除しようとしている
  - name: ガーム
    relation: 裏切り者として憎みつつ、その技術力だけは惜しんでいる
  arc: 絶対的な権力と計算で全てを支配できると信じていたが、予測不能な若者たちの絆と、自然の猛威（風）によって全てを失う。
