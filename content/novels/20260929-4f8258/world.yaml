title: 黄金風のスカイ・ダイブ：氷晶の翼と鏡の迷宮
genre: スチームパンク冒険
tone: 爽快で疾走感あふれる冒険活劇
pov: 三人称
tense: 過去形
setting: 地上と空が調和し始めた新時代のアエロギア。雲海の上空に突如出現した、極低温の気流が支配する「氷晶空域」。
premise: 地上の原生林に辿り着いたカイたちは、空の浄化と共に新たな空の秩序を築こうとしていた。しかし、北方の高高度に「氷の城」と称される、空を凍てつかせる巨大な氷の浮遊島が出現する。そこから放たれる異常な寒気は、せっかく再生した風の流れを止めてしまい、世界は再び静止へと向かっていた。カイ、ガーム、ライラは、凍てつく空の真実を解き明かすため、新造された超高速翼型飛空艇『スカイ・レガシー』と共に、鏡のように輝く氷の迷宮へとダイブする。
themes:
- 再生と停滞の対立
- 未知なるフロンティアへの挑戦
- 絆による困難の突破
rules:
- 気流は世界の血液であり、その流れが止まると生命活動が鈍る
- 立体地図は風の意志を可視化する唯一のデバイスである
- 極低温の領域では、通常の蒸気機関は凍結するため、特殊な熱源が必要となる
plot_outline:
- '序盤: 地上での平穏な生活も束の間、空から降り注ぐ氷の礫が世界を脅かす。カイたちは、氷の城が放つ「凍結気流」が世界の循環を止めていることを突き止める。ガームが開発した、氷の抵抗を切り裂く新機軸の翼型飛空艇『スカイ・レガシー』が、凍てつく空へと出撃する。'
- '中盤: 氷晶空域へ突入した一行は、空中に浮かぶ巨大な氷の結晶に囲まれる。そこは、光を乱反射させる「鏡の回廊」となっており、視界を狂わせる罠が待ち受けていた。航路を見失いかけた時、ライラのナビゲートと、カイの直感による「風の読み」が、鏡の反射に隠された真の風の道筋を見つけ出す。'
- '終盤: 氷の城の中心部へ到達したカイたちは、そこが古代の気象制御装置の暴走によるものだと知る。城の心臓部は巨大な鏡の構造体となっており、太陽光を一点に集中させて空を焼き切ろうとしていた。ヴァレリウスの残党がその力を利用しようと画策するが、カイたちはゼファー・ウィングの魂を受け継いだスカイ・レガシーの全出力を使い、氷の壁を突破する。'
- '結末: カイは、立体地図と機体のコアを同期させ、黄金の風を氷の城へと送り込む。激しい蒸気と風の衝突により氷の城は砕け散り、凍てついていた空に再び暖かな風が吹き抜ける。一行は、砕けた氷の欠片が星のように輝く美しい空を背景に、次なる冒険の風を感じながら、新たな航路へと舵を切る。'
style_notes: 風を切る音、蒸気が噴き出す音、機械の駆動音をダイナミックに描写すること。空の青さと氷の白、そして黄金の風の色彩対比を強調し、読み手がまるで高度数千メートルを一緒に飛んでいるような、スピード感と爽快感のある筆致で書く。
