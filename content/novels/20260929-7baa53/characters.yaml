- name: ヘルマン
  role: 主人公
  age: 34
  gender: 男性
  appearance: 痩身で青白い顔。度の強い眼鏡をかけ、常にベージュのトレンチコートを纏っている。目の下に深い隈がある。
  personality: 知的好奇心が異常に強く、一度執着した謎を解明するまで止まれない。内向的で孤独を好む。一人称は『私』。
  speech_style: 論理的で分析的な口調。専門用語を多用し、結論を急ぐ傾向がある。
  background: 絶滅言語を専門とする言語学者だったが、非科学的な周波数研究に没頭したため大学を追われた。現在は地方都市でフリーの研究者として活動している。
  motivation: 夜明けのラジオの正体を突き止め、失われた神代の言語を完全に解読すること。
  relationships:
  - name: 栞
    relation: 協力者であり、唯一心を許した友人
  - name: 司書
    relation: 真理を巡る対立者
  arc: 真理への渇望から始まり、自らの死という運命に抗おうとするが、最終的には世界を守るために自らを記録の一部として捧げる自己犠牲へと至る。
- name: 栞 (しおり)
  role: 相棒
  age: 21
  gender: 女性
  appearance: 短いボブカットにオーバーサイズのニットを着用。常に古いアナログラジオを肩に下げている。
  personality: 直感的で天真爛漫だが、時折ひどく虚無的な表情を見せる。共感能力が高い。一人称は『私』。
  speech_style: 柔らかく、比喩的な表現を好む。独り言のように呟くことが多い。
  background: ヘルマンが『未完の周波数リスト』を入手した古書店の娘。生まれつき特定の周波数を「色」として知覚できる特異体質を持つ。
  motivation: 地下図書館に消えた父の行方を突き止め、家族を取り戻すこと。
  relationships:
  - name: ヘルマン
    relation: 知的な導き手として信頼し、密かに慕っている
  arc: 運命を「書き換えられるもの」と信じていたが、世界の残酷な仕組みを知り、それでもヘルマンと共に歩む強さを得る。
- name: 司書
  role: 敵役
  age: 不詳（外見は40代）
  gender: 男性
  appearance: 擦り切れた黒いタキシードを着用。瞳の中にノイズのような砂嵐が走っており、肌は古い羊皮紙のように乾燥している。
  personality: 冷徹で超越的。人間を個体ではなく、単なる『音声データの一片』として扱う。一人称は『我』。
  speech_style: 古風で荘厳。エコーがかかったような、複数の声が重なった不思議な響きを持つ。
  background: かつて地下図書館に到達し、世界の正体に触れた人間。肉体を捨て、図書館の管理システムの一部となった存在。
  motivation: 不完全な現実世界をすべて音声データへと還元し、絶滅言語による『完全なる世界の再構築』を完遂させること。
  relationships:
  - name: ヘルマン
    relation: 後継者候補として、あるいは最高の記録素材として興味を持っている
  arc: ヘルマンというイレギュラーな存在によって、完璧な計画に「注釈（ノイズ）」を入れられ、最終的に静寂へと回帰させられる。
