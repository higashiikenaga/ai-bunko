title: 物語モデルにおける意味論的漂流と、非定常的な空飛ぶ船の航跡に関する記述報告書
genre: 伝奇
tone: 学術的な観察記録、知的で静謐な恐怖、断片的な情報の集積
pov: 一人称（後世の調査員による研究記録形式）
tense: 現在形および過去形（論文形式のため混在）
setting: 前作の結末後、物理法則が「物語の文法」に置き換わった不安定な世界。意味が質量を持つ、浮遊する断片的な領域。
premise: 世界が物理定数ではなく記述論的な「物語モデル」へと遷移した後、概念は実体化し、意味の欠落した空白地帯が拡大している。かつて注釈者となったヘルマンの関数が維持する世界の境界線上で、物理的実体を持たない「概念の渡り鳥」が異常な回遊を開始した。調査員である『私』は、未完の物語を繋ぎ止めるべく、意味論的な嵐の中を漂う「空飛ぶ船」と呼ばれる記述の残骸に乗り、世界の記述ミス（エラー）を追跡する。
themes:
- 存在の定義と解釈
- 未完であることの肯定
- 観測による世界の確定
rules:
- 事象は物理法則ではなく、因果関係の『文脈』によって決定される。
- 感情や概念は『意味論的物質』として実体化し、重力や熱量に代わる物理量となる。
- 記述（テキスト）が存在しない領域は、存在しないものとして宇宙から抹消される（空白の侵食）。
- 観測者（読者）の解釈によって、同一の事象が異なる物理的形状を取り得る。
plot_outline:
- '序盤: 意味論的物質化が進む世界において、特定の『意味の欠落』を運ぶ渡り鳥の群れが、世界の記述構造を破壊していることが判明する。調査員である『私』は、失われた記述を回収する装置として機能する『空飛ぶ船（意味論的航行体）』を起動し、ヘルマンが残した関数領域へと向かう。'
- '中盤: 航行中、船は「栞」の残響が作り出した、過去の記憶が層を成す雲海へと突入する。そこで『私』は、世界が完全に記述されることを拒絶し、あえて『未完』であり続けることでシステムの崩壊を防いでいるヘルマンの、関数としての孤独な活動を観測する。同時に、世界を強引に完結させようとする「終止符の残滓」が、渡り鳥を捕食しながら迫る。'
- '終盤: 渡り鳥の群れが向かっていた先は、世界が書き換えられるための「新章の起点」であった。船は嵐の中で記述の矛盾に晒され、解体寸前となるが、『私』はヘルマンがかつて行なったように、事象に対して『意図的な誤字（ノイズ）』を混入させることで、終止符の侵食を回避する。'
- '結末: 渡り鳥は新たな意味の種を撒き、世界は再び『書き換え可能な物語』としての流動性を獲得する。ヘルマンの関数は、世界の深淵に刻まれた『注釈』として、なおも不変の揺らぎを維持し続ける。調査員は、自身の観測記録が、いつか誰かの『読書体験』となることを確信しながら、新たな記述の海へと船を向ける。'
style_notes: 学術的な調査報告書の体裁を徹底すること。客観的な事実の記述の合間に、[注1]、[注2]といった形式の脚注を挿入し、そこに情緒的、あるいは不条理な補足情報を記述して、読者に情報の欠落を補完させる。文体は硬質で、感情を直接的に語らず、現象の記述を通じてその深刻さや美しさを暗示させること。
