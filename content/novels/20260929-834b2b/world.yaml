title: 拡散する桜、あるいは死の座標
genre: ホラー
tone: 現代的、焦燥感、ネット怪談的、不穏
pov: 三人称近接視点
tense: 過去形
setting: 現代日本、SNSが普及した都市部と、地図に載らない廃村
premise: ネット上に流出した「見つけると死ぬ」と噂される不可解な秘密の地図。それは、特定の場所に桜が舞い散る瞬間、そこに存在しないはずの『何か』が顕現する座標を示していた。投稿された画像がバズるたびに、怪異は現実の境界を侵食し、拡散の速度に比例して死者の数は増えていく。スマホの画面越しに、逃げ場のない恐怖が加速していく。
themes:
- 情報拡散の加害性
- デジタルと怪異の融合
- 不可逆な狂気
rules:
- 怪異の強度は、その情報（画像、動画、テキスト）へのインプレッション数に比例する
- 地図に示された座標に到達した者は、桜が散る前に脱出しない限り、存在そのものがデジタルデータとして消失する
- 特定のハッシュタグを使用することで、怪異を意図的に召喚できるが、その代償は自身の存在の希薄化である
plot_outline:
- '序盤: 匿名の投稿者がアップした『死の地図』。桜の画像と共に投稿されたその座標には、誰もいないはずの廃村が写っていた。都市伝説としてSNSで拡散され始める。'
- '中盤: 地図を追い、動画投稿を繰り返すインフルエンサーたち。彼らが桜の舞う廃村に足を踏み入れるたび、画面の向こう側で不可解な現象が起きる。投稿が拡散されるほど、スマートフォンの画面に映る『桜の影』は、現実の風景へと侵食し始める。'
- '終盤: 主人公は、拡散の連鎖を止めるために地図の正体を追うが、すでに怪異は『検索ワード』として人々の意識に定着していた。情報の爆発と共に、都市そのものが桜の吹雪に包まれていく。'
- '結末: 全ての投稿が消えた後、ネット上には『地図を完成させた』という最後の一文だけが残る。空からは、血のような色の桜が降り注ぎ続けている。'
style_notes: 短文を多用し、スピード感を重視する。登場人物の心理描写に加え、Twitter（X）風の書き込み、掲示板のログ、通知音、スマートフォンの画面表示を随所に挿入し、読者が画面越しに怪異に触れているような感覚を与える。噂が広まるにつれて、地の文の文章自体がノイズ混じりになり、崩壊していく演出を加える。
