- name: ジン・レイド
  role: 主人公
  age: 28
  gender: 男性
  appearance: 黒いロングコートに使い古された書記用の革手袋を着用。鋭い眼光と無精髭が特徴的な、擦り切れた男の風貌。
  personality: 冷笑的で現実主義。無駄を嫌い、常に最悪の事態を想定している。一人称は「俺」。
  speech_style: ぶっきらぼうで簡潔。必要最低限の言葉しか発さない。
  background: 元・魔導騎士団の書記官。ある「記述の矛盾」に巻き込まれ、騎士団を追放された。現在は都市ルムの裏通りで、禁忌文字を処理する掃除屋として生きている。
  motivation: 抗争に巻き込まれた不運を終わらせ、ただ静かに、誰にも邪魔されずに生きること。
  relationships:
  - name: リノ・エルミナ
    relation: 共闘者であり、世界の真実を教える者
  - name: ゼノス・ヴァルガ
    relation: 排除すべき体制の象徴
  arc: 運命に従うだけの掃除屋から、用意された脚本を破壊し、自らの足で歩む者へと変貌する。
- name: リノ・エルミナ
  role: 相棒
  age: 17
  gender: 女性
  appearance: 透き通るような銀髪と、雨粒を宿したような深い青の瞳。古風で清潔感のある司書風のドレスを纏っている。
  personality: 穏やかで慈愛に満ちているが、真実に対しては一切の妥協を許さない強靭な精神を持つ。一人称は「私」。
  speech_style: 丁寧で落ち着いた物腰。しかし、核心を突く時は断定的で重みがある。
  background: 雨の日だけ現れる奇妙な店「霧雨書房」の店主。地下図書館の守護者の末裔であり、世界の記述が改竄されている事実を知る数少ない存在。
  motivation: 偽りの完璧な世界ではなく、たとえ苦しくても、人々が自らの言葉で生きられる世界を守ること。
  relationships:
  - name: ジン・レイド
    relation: 運命を共に戦うパートナー
  arc: 知識を隠し守るだけの存在から、真実を世界に突きつける導き手へと成長する。
- name: ゼノス・ヴァルガ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 汚れ一つない白銀の儀礼服に身を包んだ、冷徹な美貌を持つ男。常に威厳に満ちた立ち姿。
  personality: 極めて高い知性と完璧主義を持つ支配者。人類の苦痛を「記述の誤り」と断じ、管理しようとする。一人称は「私」。
  speech_style: 優雅で理知的だが、相手を格下と見なした高圧的な響きが含まれる。
  background: 都市ルムの最高執行官。地下図書館の力を利用し、世界を矛盾のない「完璧な物語」へと再記述（リライト）しようと画策している。
  motivation: 争いも欠乏もない、完璧に制御された理想郷の構築。
  relationships:
  - name: ジン・レイド
    relation: 計画を乱す不確定要素（イレギュラー）
  arc: 秩序の守護者としての仮面が、世界の崩壊と共に剥がれ落ち、独善的な狂気を露わにする。
- name: カイト・フェンリス
  role: 脇役
  age: 25
  gender: 男性
  appearance: 魔導騎士団の制服を隙なく着こなす、引き締まった体躯の青年。鋭い身のこなしを見せる。
  personality: 実直で規律を重んじる軍人。正義感が強いが、組織の命令を絶対とする。一人称は「僕」。
  speech_style: 礼儀正しく、軍人らしい規律正しい話し方。
  background: ゼノス直属の筆跡騎士団隊長。かつてジンと同じ騎士団に所属していたが、現在は彼を「法の敵」として追う立場にある。
  motivation: 都市の秩序を維持し、任務を完璧に遂行すること。
  relationships:
  - name: ゼノス・ヴァルガ
    relation: 絶対的な主君
  - name: ジン・レイド
    relation: かつての同僚であり、超えるべき壁
  arc: 組織への盲目的な忠誠と、目の当たりにする真実との間で葛藤し、自らの意志で剣の向きを決める。
