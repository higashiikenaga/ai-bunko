title: 絶筆の鉄牙
genre: 異世界ファンタジー
tone: 硬派・速いテンポのハードボイルド
pov: 一人称（俺）
tense: 過去形
setting: 記述した文字が物理的な力を持つ魔導工業都市ルム
premise: 書いた言葉が武器となる世界で、禁忌の文字を狩る掃除屋の『俺』。ある日、世界を書き換える力を持つ『地下図書館』の鍵を巡る抗争に巻き込まれる。雨の日だけ開く店で出会った少女と共に、俺は運命という名の脚本を叩き斬る。
themes:
- 運命への抗い
- 不器用な信頼
rules:
- 紙に記述した文章は物理的な現象として具現化する
- 文章が複雑であるほど威力は増すが、記述に時間を要する
- 雨はインクを溶かすため、雨天時はあらゆる文字魔法が無効化される
plot_outline:
- 序盤：禁忌の書を保持していた標的を始末したが、その遺品から地下図書館への鍵となる地図が見つかり、都市の権力者に狙われる。
- 中盤：追手から逃れる中、雨の日だけ現れる奇妙な店に逃げ込み、店主の少女からこの世界の文字魔法が偽りの歴史に基づいていることを知る。
- 終盤：都市の支配者が企む『世界の再記述（リライト）』を止めるため、武装した騎士団を突破し、地下図書館の最深部へ殴り込む。
- 結末：究極の書を破壊し、完璧な世界ではなく不自由で汚い真実の日常を取り戻す。俺は再び雨の中を歩き出す。
style_notes: 短文を重ねて速度感を出す。擬音を完全に排除し、『斬る』『砕く』『抉る』などの動詞で衝撃を表現する。戦闘開始直前には必ず、煙草を吸う、雨音を聞くなどの静寂な描写を挿入し、動と静の対比を強調すること。
