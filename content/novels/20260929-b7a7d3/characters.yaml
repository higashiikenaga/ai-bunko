- name: カイ・レン
  role: 主人公
  age: 16
  gender: 男性
  appearance: 整った顔立ちだが、常に思考に没入しているため目の下に薄い隈がある。計算尺を常に持ち歩き、清潔感はあるがどこか無機質な佇まい。
  personality: 極度の理論至上主義者。物事を数式や確率で理解しようとする完璧主義者。一人称は「僕」。
  speech_style: 論理的で無駄がなく、丁寧だが感情の起伏が乏しい。結論から話す癖がある。
  background: 数学の天才として幼少期から周囲に期待されてきた。スチーム・ビリヤードにおいても、完璧な物理計算に基づいたショットを武器に無敗を誇っていたが、予測不能な「揺らぎ」に直面し、挫折を経験する。
  motivation: 自身の理論の限界を突破し、計算不可能な事象さえも支配する「完璧な一手」を見出すこと。
  relationships:
  - name: ゼノス・ヴァルカ
    relation: 師匠
  - name: リアン・フェリス
    relation: ライバル
  arc: 数式による「支配」を目指す段階から、盤面や相手との「対話」を通じて、理屈を超えた感覚を統合する段階へと進化する。
- name: ゼノス・ヴァルカ
  role: 師匠
  age: 68
  gender: 男性
  appearance: 白髪混じりの長い髭と、油汚れのついた作業着。使い込まれた道具を愛用しており、眼光だけは鋭く、蒸気機関の熱気のような力強さを持つ。
  personality: 飄々としていて掴みどころがないが、競技の本質を見抜く鋭い洞察力を持つ。一人称は「俺」。
  speech_style: 古風で、比喩や哲学的な表現を好む。教え諭すときは、夜明けのラジオのような落ち着いたトーンになる。
  background: かつて「蒸気の魔術師」と称えられた伝説の王者。現在は旧時代の蒸気プラントの整備士として隠遁生活を送っているが、夜明けのラジオを通じて古の戦術論を密かに語り続けている。
  motivation: かつての競技が失った「熱」を、次世代の若者に受け継がせること。
  relationships:
  - name: カイ・レン
    relation: 弟子
  arc: 孤独な隠遁者から、再び競技の熱狂の渦へと精神的に関わり、自らの遺志をカイへと託していく。
- name: リアン・フェリス
  role: 敵役
  age: 17
  gender: 女性
  appearance: 動きやすさを重視したスポーティな服装。跳ねた髪と、自信に満ちた挑戦的な瞳が特徴。常に軽やかな身のこなしを見せる。
  personality: 直感的で大胆不敵。計算よりも「感覚」と「リズム」を信じる野生児的な気質。一人称は「私」。
  speech_style: 明るく快活だが、相手の計算を嘲笑うような挑発的な響きが含まれることもある。
  background: 理論を無視した不規則なショットで、カイを完敗させた無名の天才。既存の競技体系やマニュアルを破壊するようなプレイスタイルで、急速に注目を集めている。
  motivation: 予測可能な退屈な試合を壊し、自身の直感がどこまで通用するかを証明すること。
  relationships:
  - name: カイ・レン
    relation: 超えるべき壁
  arc: 単なる「予測不能な撹乱者」から、カイの理論と感覚の融合を目の当たりにし、真の競技者として認め合う存在へと変わる。
- name: ミナ・サトウ
  role: 脇役
  age: 19
  gender: 女性
  appearance: ラジオ局のエンジニア風の服装。ヘッドフォンを首にかけ、常に機材のメンテナンスをしている。
  personality: 世話焼きで現実主義。カイの理論的な暴走を冷静にたしなめる良き理解者。一人称は「私」。
  speech_style: はきはきとしており、技術的な用語を交えた効率的な話し方をする。
  background: 夜明けのラジオの放送を支える技術者。ゼノスの正体を知る数少ない人物であり、カイが古の戦術論に触れる際の媒介となる。
  motivation: 正確な音と情報を都市に届けること、そしてカイが正しい道を見出す手助けをすること。
  relationships:
  - name: カイ・レン
    relation: 友人・情報提供者
  - name: ゼノス・ヴァルカ
    relation: 仕事上の協力者
  arc: カイの変革を傍で見守り、彼が「理論」から「感覚」へ移行する過程を技術的な側面からサポートする。
