title: 盤上の蒸気、静寂の弾道
genre: スポーツ青春
tone: 静謐かつ熱狂的。緻密な計算と直感の衝突を描く。
pov: 三人称近接視点
tense: 過去形
setting: 蒸気機関の遺構が都市設計に組み込まれた架空の近代都市。人々は物理計算と技巧を競う競技『スチーム・ビリヤード』に熱狂している。
premise: 物理計算に特化した少年・カイは、完璧な理論を追求するあまり、試合中の「揺らぎ」に対応できず敗北し続けていた。そんな彼が、かつて「蒸気の魔術師」と呼ばれた孤独な老人と出会い、理屈を超えた「一手の意味」を学ぶ。夜明けのラジオから流れる古の戦術論を道標に、カイは絶望的な状況から盤面をひっくり返す究極の弾道を模索する。
themes:
- 理論と直感の調和
- 挫折からの再生
rules:
- 競技名は『スチーム・ビリヤード』。蒸気圧で球を弾く特殊な圧力キューを使用する。
- 球の軌道は物理法則に準ずるが、キューの蒸気圧調整により微細なカーブ（曲球）を自在に操ることが可能。
- 単に球を入れることではなく、次の一手を制限する「配置（ポジショニング）」の妙が勝敗を分ける頭脳戦である。
plot_outline:
- 序盤：理論至上主義のカイが、計算外の不規則なショットを放つ無名選手に完敗し、自らの理論の限界に絶望する。
- 中盤：旧時代の蒸気プラントに住む元王者と出会い、夜明けのラジオで流れる古の講義を聴きながら、数式では記述できない「感覚的な読み」の訓練に励む。
- 終盤：全国大会に出場。かつてのライバルと対峙し、蒸気機関の心臓部のような激しい圧力の中で、盤面全体を支配し相手を詰ませる究極の一手を構築する。
- 結末：勝利という結果を超え、球を通じた相手との「対話」に到達したカイが、新たな競技の地平を切り拓く。
style_notes: ショットの瞬間、時間が停止したかのような静寂を描く。球の回転、摩擦、加速を将棋の指し手のように分析的に記述し、その一手がもたらす戦術的な意味（相手への詰みや誘い）を内面描写で丁寧に解説すること。
