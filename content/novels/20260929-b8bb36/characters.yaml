- name: エライアス・ヴォーン
  role: 主人公
  age: 27
  gender: 男性
  appearance: 油に汚れた灰色の作業服を纏い、常に真鍮製の精密圧力計を首から下げている。細い指先と、常に何かを計算しているような鋭い眼差しが特徴。
  personality: 几帳面で潔癖。真理への好奇心が強く、妥協を許さない。一人称は「私」。
  speech_style: 論理的で淡々としているが、数値や法則に関する話になると早口になる傾向がある。
  background: コキュートス熱管理局の若手保守点検技師。周囲からは「数字の幽霊」と呼ばれるほど、微細な不整合に執着する傾向がある。
  motivation: 計算上の熱配分と実測値の間に存在する「0.004%の誤差」の正体を突き止めること。
  relationships:
  - name: リラ
    relation: 氷の城で出会った導き手であり、共犯者
  - name: ヴァレリウス
    relation: かつての師であり、現在は思想的に対立する管理責任者
  arc: 絶対的な正解（真理）を求める純粋な技術者から、破綻を孕んだ均衡を維持するという「残酷な嘘」を背負う大人へと変化する。
- name: リラ
  role: 相棒
  age: 不詳（外見は20代前半）
  gender: 女性
  appearance: 透き通るように白い肌と、氷の結晶のような淡い青色の瞳を持つ。古びた白い毛皮のコートに、演算装置の端子のような装飾品を身に着けている。
  personality: 静謐で虚無的だが、時折残酷なまでの客観性を見せる。一人称は「私」。
  speech_style: 詩的で比喩が多く、問いかけに対して問いで返すような、捉えどころのない話し方。
  background: 氷の城にある「熱吸収式演算装置」のインターフェースとして機能していた元人間。システムのバグにより自我を取り戻し、城から脱出した。
  motivation: 自分を消費し尽くしたシステムの外側に、熱力学の法則を超えた「意味」があるかを確認すること。
  relationships:
  - name: エライアス・ヴォーン
    relation: 自分を「部品」ではなく「個」として認識してくれた唯一の人間
  arc: システムの一部としての絶望から、エライアスと共に「不完全な生存」を選択することで、人間としての熱（感情）を取り戻す。
- name: ヴァレリウス・クロムウェル
  role: 敵役
  age: 62
  gender: 男性
  appearance: 隙のない白い軍服に身を包み、金縁のモノクルを着用している。常に背筋が伸びており、威圧的な佇まい。
  personality: 極端な功利主義者。全体の存続のためには少数の犠牲は不可避であると信じて疑わない。一人称は「私」。
  speech_style: 威厳に満ちた断定的な口調。相手を諭すような、傲慢なまでの余裕がある。
  background: コキュートス熱管理局の局長。氷の城の正体と、それがもたらす「搾取による安定」の仕組みを完全に把握し、維持してきた責任者。
  motivation: いかなる犠牲を払っても、人工惑星コキュートスの熱暴走を防ぎ、文明を存続させること。
  relationships:
  - name: エライアス・ヴォーン
    relation: 才能を認めているが、危うい好奇心を持つ危険分子として警戒している
  arc: 完璧な管理こそが正義だと信じていたが、エライアスが提示した「破綻した均衡」という不確定要素に、管理者の限界と恐怖を感じる。
