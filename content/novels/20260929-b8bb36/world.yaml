title: 氷晶回廊における熱力学的な整合性
genre: SF
tone: 静謐で冷徹な緊張感
pov: 三人称客観
tense: 過去形
setting: 恒星間航行用人工惑星「コキュートス」。巨大な蒸気機関が惑星全体の熱循環を管理する社会。
premise: 熱がすべてを支配する人工惑星コキュートス。技術者のエライアスは、愛用の真鍮製圧力計が示す、計算上の熱配分と実際の圧力の間に存在する「0.004%の誤差」に気づく。その矛盾を追うことは、禁忌とされる極北の「氷の城」への侵入を意味していた。そこで彼は、熱力学の法則を根底から覆す、美しくも残酷なシステムの正体を目撃することになる。
themes:
- 秩序とエントロピー
- 生存のための欺瞞
rules:
- 熱は有限の資源であり、中央演算によって厳格に配分される
- 蒸気機関の圧力低下は、即座に居住区の凍結を招く
- 氷の城の内部は、熱が完全に奪われた「絶対零度」の領域であるとされている
plot_outline:
- '序盤: 蒸気機関の保守点検中、エライアスは精密な真鍮製圧力計に記録された、計算値と乖離する微小な熱損失を発見する。彼はその誤差が機器の故障ではなく、物理的な熱の移動であることを確信する。'
- '中盤: 誤差の行き先を追うエライアスは、廃棄された蒸気配管の迷路を抜け、地図にない「氷の城」へと辿り着く。そこで彼は、熱が直接吸い込まれていく未知の構造体を目撃する。'
- '終盤: 氷の城の正体は、惑星の熱暴走を防ぐための「熱吸収式演算装置」であった。システムは、惑星の熱力学的安定を維持するために、住民の生存に必要な熱の一部を、計算資源として意図的に消費していた。'
- '結末: エライアスは、システムを修正すれば惑星全体が熱暴走し、放置すれば搾取が続くという二律背反に直面する。彼は、圧力計の針を物理的に固定することで、破綻を孕んだままの「新たな均衡」を定義し、沈黙を守る道を選ぶ。'
style_notes: 感情的な形容詞を排除し、事象の描写、数値、物質の質感（金属の冷たさ、蒸気の湿度など）に徹する。伏線となる小道具（圧力計の摩耗、特定の潤滑油の匂い）は、後の論理的帰結に不可欠な要素として、慎重に配置すること。
