- name: 久代 蓮造 (くじろ れんぞう)
  role: 主人公
  age: 38
  gender: 男性
  appearance: 痩身で、常にインクの汚れが指先に残っている。細い銀縁の眼鏡をかけ、古びた書肆の主らしい落ち着いた装い。
  personality: 冷静沈着で知識欲が旺盛。真実を求めるあまり、時に周囲の危うさを忘れる探求者。一人称は「私」。
  speech_style: 丁寧で理知的だが、学術的な話題になると早口になる傾向がある。
  background: 海鳴国の辺境の街で、古書を扱う小さな店を営む。かつては宮廷図書館の司書であったが、ある禁忌の文献に触れたことで職を追われた過去を持つ。
  motivation: 古書に記された「失われた文明」の真実を解明し、歴史の空白を埋めること。
  relationships:
  - name: 海凪 櫂夜
    relation: 不可解な力を持つ巫女として、敬意と警戒を抱いている
  - name: 金継 愁羅
    relation: 実力主義的な武官に対し、当初は強い不信感を抱く
  arc: 単なる知識の収集家から、知識が引き起こす現実の責任を引き受ける「生きた歴史の証言者」へと変貌する。
- name: 海凪 櫂夜 (かいなぎ かいや)
  role: 主人公
  age: 21
  gender: 女性
  appearance: 透き通るような白い肌と、深い海の色をした瞳を持つ。海鳴りの儀式で用いる、藍色の装飾が施された白い装束を纏う。
  personality: 静謐で浮世離れしているが、芯は非常に強く、自然の摂理に対して絶対的な信念を持つ。一人称は「私」。
  speech_style: 抑揚が少なく、祈りのような、どこか遠くを見つめているような独特の話し方。
  background: 海鳴りの声を聴くことができるとされる、代々続く巫女の末裔。海底遺跡の存在を「海からの警告」として、守るべきものと考えている。
  motivation: 海の均衡を守り、古代の力が現代の人間によって暴かれるのを阻止すること。
  relationships:
  - name: 久代 蓮造
    relation: 真実を暴こうとする者として、対立しながらも運命共同体となる
  - name: 金継 愁羅
    relation: 破壊の象徴に見えるが、その内に秘めた孤独を察する
  arc: 神の声を聴く「器」としての役割を超え、一人の人間として自らの意志で運命を選択するようになる。
- name: 金継 愁羅 (かねつぐ しゅうら)
  role: 主人公
  age: 34
  gender: 男性
  appearance: 顔に古い戦傷があり、鋭い眼光を持つ。使い古された武官の甲冑を身につけ、常に周囲を警戒している。
  personality: 現実主義的で皮肉屋。過去の失敗から、理想よりも生存と実利を重んじる。一人称は「俺」。
  speech_style: ぶっきらぼうで、結論を急ぐような荒々しい口調。
  background: かつては国を支える精鋭の武官であったが、政争に敗れ、地位も名誉も失った。現在は没落した身として、遺跡調査の任務に駆り出されている。
  motivation: 遺跡から得られる富や技術を用いて、失った地位を取り戻し、自らの汚名を雪ぐこと。
  relationships:
  - name: 久代 蓮造
    relation: 鼻持ちならない学者として扱うが、その知識に助けられる
  - name: 玄都卿
    relation: かつての主君であり、現在は自身の野心を煽る利用対象
  arc: 個人的な名誉回復という私欲から、守るべきもののために己を捧げる「真の武人」へと成長する。
- name: 玄都卿 (げんとけい)
  role: 敵役
  age: 52
  gender: 男性
  appearance: 贅を尽くした絹の衣服を纏い、整えられた髭と威圧的な佇まいを持つ。冷徹な瞳をしている。
  personality: 極めて野心的で、目的のためには手段を選ばない。秩序を重んじるが、それは自身の支配を維持するためのもの。一人称は「我」。
  speech_style: 高圧的で、相手を見下すような優雅かつ冷酷な話し方。
  background: 海鳴国の中枢を担う高官。衰退しつつある国家を再興させるため、海底遺跡に眠る古代の兵器や技術を独占しようと企んでいる。
  motivation: 古代の力を手にし、海鳴国を再び大陸に揺るがす大国へと再興させること。
  relationships:
  - name: 金継 愁羅
    relation: 使い捨ての駒として、彼を利用している
  - name: 久代 蓮造
    relation: 知識を絞り出すための道具として見なしている
  arc: 絶対的な権力者として君臨しようとするが、制御不能となった古代の力によって、自らが望んだ「秩序」の崩壊を目の当たりにする。
