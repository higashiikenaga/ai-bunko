title: 蒼溟の遺言、古書に眠る沈黙の都
genre: 歴史・時代小説
tone: 荘厳かつ哀愁を帯びた、静謐な文体
pov: 三人称（群像劇）
tense: 過去形
setting: 架空の沿岸国家「海鳴国」における、文明の黄昏時
premise: 海辺の街の古本屋に、失われた古代文明の地図が記された禁忌の書が流れ着く。海鳴りを聴く巫女、過去を捨てた没落武官、そして知識の守護者たる書肆。三つの異なる「正義」を持つ者たちが、異例の干潮により姿を現した海底遺跡を巡り、運命の渦に飲み込まれていく。深淵に沈んだ真実が、人々の矜持を試していく物語。
themes:
- 記憶の継承と忘却
- 個の正義と全体の秩序
rules:
- 海底遺跡は数世紀に一度の天体配置の際のみ、海面下に姿を現す
- 古書に記された記述は、単なる地図ではなく、海流を制御する術の鍵となる
plot_outline:
- '序盤: 古本屋の店主が、ある古書の中に海底遺跡への道筋を見出す。同時に、海辺の国では異様な天変地異の予兆が始まっていた。'
- '中盤: 没落した武官が遺跡の調査任務に就き、地元の巫女と邂逅する。大規模な干潮が発生し、伝説の海底遺跡がその威容を現す。遺跡の富を求める勢力と、その神秘を守ろうとする者たちの衝突が描かれる。'
- '終盤: 遺跡の最深部で、古代の文明が滅びた真の理由が判明する。個々の正義が真っ向から衝突し、遺跡の崩壊と共に、海が再び全てを飲み込もうとする。'
- '結末: 嵐が去り、海は元の静寂を取り戻す。遺跡は再び深淵へと消えたが、生き残った者たちの心には、消えることのない真実の刻印が刻まれていた。'
style_notes: 格調高い語彙を厳選し、人物の心理は直接的な言葉を避け、情景描写や所作の端々に滲ませること。群像劇として、各登場人物が抱く譲れぬ矜持を、それぞれの視点から重厚に描き出す。文体は硬めに保ち、時代背景を感じさせる言葉選びを徹底する。
