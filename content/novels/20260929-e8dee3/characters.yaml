- name: エララ・フォン・ノルドランド
  role: 主人公
  age: 19
  gender: 女性
  appearance: 北方の雪のように白い肌と、深海を思わせる紺碧の瞳。銀糸のようなプラチナブロンドの髪を、旅の際は編み込み、舞踏会では華やかな夜会巻きにする。
  personality: 芯が強く、観察眼に優れた聡明な女性。異国の地特有の清廉さと、運命に抗う情熱を併せ持つ。「私」
  speech_style: 丁寧だが、宮廷の虚飾に媚びない凛とした話し方。
  background: 北方の小国ノルドランドの王女。外交使節としてルミナリス帝国へ訪れるが、帝国の歪んだ時間と権力構造に直面する。
  motivation: 自国の存続を守ると同時に、止まった時間が支配する帝国の真実を解き明かすこと。
  relationships:
  - name: アラリック・ド・ヴァロワ
    relation: 共鳴し合う恋人
  - name: イザベラ・ド・モンフォール
    relation: 対立する宿敵
  arc: 孤独な訪問者から、帝国の歴史を動かす「変革の旗手」へと成長する。
- name: アラリック・ド・ヴァロワ
  role: 主人公
  age: 23
  gender: 男性
  appearance: 憂いを帯びた灰色の瞳と、手入れの行き届いていない漆黒の髪。没落した貴族らしく、質素ながらも品格のある服装を好む。
  personality: 冷静沈着でどこか諦観的な性格。しかし内面には、かつての栄光を取り戻そうとする静かな怒りを秘めている。「僕」
  speech_style: 穏やかで控えめだが、核心を突く際には鋭い響きを持つ。
  background: かつて帝国の重鎮であったヴァロワ家の生き残り。亡き父が遺した「壊れた懐中時計」を唯一の拠り所として生きている。
  motivation: 懐中時計に隠された父の遺志を継ぎ、一族の名誉を回復すること。
  relationships:
  - name: エララ・フォン・ノルドランド
    relation: 心を許した唯一の理解者
  - name: イザベラ・ド・モンフォール
    relation: 家門を破滅させた仇敵
  arc: 過去の亡霊に囚われた青年から、未来を切り拓く真の指導者へと脱皮する。
- name: イザベラ・ド・モンフォール
  role: 敵役
  age: 34
  gender: 女性
  appearance: 彫りの深い美貌と、常に不敵な笑みを浮かべる赤い唇。重厚なベルベットのドレスと、権威を象徴する大粒の宝石を纏う。
  personality: 極めて野心的で狡猾。目的のためには愛も倫理も切り捨てる冷徹なリアリスト。「わたくし」
  speech_style: 優雅で甘美だが、相手を威圧し、心理的に追い詰めるような計算された物言い。
  background: 政略結婚を重ねて宮廷の頂点へと登り詰めた公爵夫人。懐中時計が持つ「歴史を書き換える力」を掌握し、帝国の支配者となることを目論む。
  motivation: 懐中時計を手に入れ、帝国の権力構造を完全に支配下に置くこと。
  relationships:
  - name: アラリック・ド・ヴァロワ
    relation: 利用対象であり、排除すべき障害
  - name: エララ・フォン・ノルドランド
    relation: 自身の野心を脅かす邪魔者
  arc: 権力の頂点を目指す野心家が、自身の過信によって築き上げた虚構の城と共に崩壊していく。
- name: ジュリアン
  role: 脇役
  age: 28
  gender: 男性
  appearance: 常に眼鏡をかけ、細身でどこか影のある風貌。職人のような汚れの目立たない手をしている。
  personality: 合理的で感情に流されないが、真実を求める者に対しては深い敬意を払う。「俺」
  speech_style: 簡潔で事務的。時計の機構に関する専門用語を好んで使う。
  background: 宮廷御用達の時計職人であり、裏では帝国の機密に精通する情報屋。懐中時計の真の仕組みを知る数少ない人物。
  motivation: 歪められた歴史（時間）を正し、時計が本来刻むべき正しい時を世界に取り戻すこと。
  relationships:
  - name: アラリック・ド・ヴァロワ
    relation: 懐中時計のメンテナンスを通じて協力する関係
  - name: エララ・フォン・ノルドランド
    relation: 運命を共にする協力者
  arc: 傍観者として真実を記録する立場から、歴史の転換点に介入する当事者へと変わる。
