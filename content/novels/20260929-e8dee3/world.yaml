title: 紺碧の渡り鳥と、壊れた秒針のワルツ
genre: 群像劇
tone: 豪華絢爛にして耽美的な歴史ロマン
pov: 三人称
tense: 過去形
setting: 18世紀欧州を彷彿とさせる架空の帝国「ルミナリス」。贅を尽くした宮廷と、冬の訪れとともに開かれる仮面舞踏会が舞台。
premise: 止まった時計が支配する帝国の宮廷で、運命に翻弄される貴族たちの愛と憎しみを描く。亡国の王子が持つ「壊れた懐中時計」が、帝国の権力構造を揺るがす鍵となる。北方の地から舞い降りた「渡り鳥」のような異国の王女が、冷徹な宮廷に情熱の火を灯していく。贅沢なドレスの裾が舞う舞踏会の裏側で、密やかな陰謀が交錯する。
themes:
- 運命と時間の不可逆性
- 偽装された愛と真実
rules:
- 宮廷内の階級制度は絶対であり、服装の素材や色によって厳格に区別される。
- 「時の聖遺物」と呼ばれる懐中時計を所有し、それを修理させた者が次代の帝位継承権を得るという古き伝承が存在する。
- 仮面舞踏会の中では、仮面を付けている限り身分を隠した状態での会話と交渉が法的に認められている。
plot_outline:
- '序盤: 冬の到来と共に、北方の小国から美しき王女がルミナリス帝国へ訪れる。彼女は宮廷の権力争いに巻き込まれながらも、没落した貴族である青年王子と出会い、彼が密かに所持している「壊れた懐中時計」の秘密を知る。'
- '中盤: 豪華絢爛な舞踏会が連夜開催され、最高級のシルクやベルベットに身を包んだ貴族たちが密約を交わす。王女と王子は互いに惹かれ合うが、野心的な公爵夫人が懐中時計を奪い、帝国を掌握しようと巧妙な罠を仕掛ける。'
- '終盤: 帝国の建国記念祭。最大の仮面舞踏会にて、懐中時計の真の機能が発動し、かつての政変によって塗り替えられた歴史の真実が白日の下に晒される。愛と裏切りが激しく交錯し、宮廷は未曾有の混乱に陥る。'
- '結末: 陰謀の果てに王子は名誉を取り戻し、王女は「渡り鳥」として再び旅立つか、この地に留まるかの選択を迫られる。止まっていた時間が再び動き出し、新しい時代の夜明けと共に、二人の真実の恋が成就する。'
style_notes: 宝石や生地（シルク、ベルベット、レース）の質感、シャンデリアの光、香水の香りを執拗なまでに美しく描写すること。比喩表現を多用し、緩やかに流れるような優雅な文体で、人物の直接的な台詞よりも「情景に滲み出る感情」や「装飾的な所作」を優先して描く。
