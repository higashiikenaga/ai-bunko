- name: 如月 蓮
  role: 主人公
  age: 38
  gender: 男性
  appearance: 常に疲労感を漂わせた鋭い眼差し。使い古されたトレンチコートを愛用し、デジタルデバイスを嫌ってアナログな手帳にメモを取る。
  personality: 執念深く、懐疑的。データよりも物理的な証拠と人間の直感を信じる。一人称は「俺」。
  speech_style: 簡潔で突き放したような言い方だが、核心を突く問いかけが多い。
  background: 警視庁捜査一課の刑事。かつて記憶技術による冤罪事件に関わった経験があり、神経接続技術に対して強い不信感を抱いている。
  motivation: チップが破壊された遺体の「声なき真実」を物理的な証拠から導き出すこと。
  relationships:
  - name: 相馬 魁
    relation: 反発しつつも信頼を寄せる後輩
  - name: 九条 源蔵
    relation: 対立する上司
  arc: デジタルな記憶の正当性に懐疑的だったが、記憶の「不一致」という矛盾を突き止めることで、自分なりの正義を完結させる。
- name: 相馬 魁
  role: 相棒
  age: 24
  gender: 男性
  appearance: 清潔感のある短髪にスマートグラスを装着。最新のガジェットを身にまとい、常に効率的な動きをする。
  personality: 合理的で好奇心旺盛。技術の進歩が正義を実現すると信じている。一人称は「僕」。
  speech_style: 丁寧語だが、技術的な議論になると早口になり、自信に満ちた口調になる。
  background: 捜査一課に配属されたばかりの若手刑事。記憶抽出技術の認定資格を持つスペシャリストであり、捜査の効率化を推進している。
  motivation: 最新技術を用いて未解決事件を次々と解決し、組織内での地位を確立すること。
  relationships:
  - name: 如月 蓮
    relation: 時代遅れだと思いつつも、その洞察力に憧れている先輩
  arc: データの絶対性を信じていたが、記憶の書き換えという残酷な真実に触れ、技術の危うさと人間性の重要性を学ぶ。
- name: 九条 源蔵
  role: 敵役
  age: 56
  gender: 男性
  appearance: 恰幅が良く、威圧感のある風貌。常に仕立ての良いスーツを着用し、威厳のある佇まいを見せる。
  personality: 保守的で権力志向。組織の秩序と体面を最優先し、不都合な真実は切り捨てる冷徹さを持つ。一人称は「私」。
  speech_style: 重々しく、相手を威圧するような低音の声。断定的な言い回しを好む。
  background: 捜査一課の管理職。記憶技術の導入初期から、その政治的利用や隠蔽工作に深く関わってきた。組織の闇を管理する実権を握っている。
  motivation: 「約束の丘」に隠された組織的な不正を隠蔽し、現在の権力構造を維持すること。
  relationships:
  - name: 如月 蓮
    relation: 組織の調和を乱す危険分子として排除したい部下
  arc: 完璧な記憶操作による隠蔽を確信していたが、如月の執拗な物理捜査によって、逃れられない現実を突きつけられる。
- name: ミオ
  role: 脇役（情報屋）
  age: 22
  gender: 女性
  appearance: オーバーサイズのストリートウェアに、色鮮やかな派手な髪色。常に複数の小型通信機を耳に付けている。
  personality: 飄々としていて掴みどころがない。損得勘定で動くが、独自の倫理観を持っている。一人称は「あたし」。
  speech_style: 若者言葉を多用し、冗談を交えながら重要な情報を小出しにする話し方。
  background: 違法な記憶市場で「記憶の調律師」として活動するブローカー。記憶の抽出だけでなく、断片の繋ぎ合わせや微調整を得意とする。
  motivation: 市場の均衡を保つことと、自分にとって面白い展開を追い求めること。
  relationships:
  - name: 如月 蓮
    relation: 利用価値のある、面白い「化石」のような刑事
  arc: 中立的な立場を装っていたが、記憶の書き換えによる犠牲者の数を知り、決定的な証拠を如月に提供して裏切る。
