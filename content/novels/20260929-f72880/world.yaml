title: 忘却の取引記録
genre: 本格ミステリー
tone: 乾いた硬質なリアリズム
pov: 三人称
tense: 過去形
setting: 近未来の地方都市。神経接続技術により個人の記憶をデータ化・売買することが可能な社会。技術の普及に伴い、違法な記憶の抽出・売買が深刻な社会問題となっている。
premise: 203X年、神経接続技術の副産物として、個人の経験を不正に抽出・売買する「記憶を売る市場」が都市の影に形成されていた。警視庁捜査一課の如月刑事は、脳内の記憶チップが物理的に損壊した遺体を発見する。遺体の記憶は断片化しており、捜査が進むにつれ、如月は捜査組織内部の隠蔽工作と、記憶の最終取引地とされる「約束の丘」に隠された真実に直面する。
themes:
- 記憶の所有権と倫理
- 技術革新と腐敗する組織
rules:
- 記憶の抽出には高精度の神経接続デバイスが必要である
- 抽出された記憶は断片化し、完全な再現は困難である
- 警察内部には記憶技術の利用を巡って、積極派と慎重派の深刻な対立が存在する
plot_outline:
- '序盤: 11月12日、午前2時15分。臨海地区の廃棄区画にて、記憶チップが物理的に粉砕された男性の遺体が発見される。如月刑事は現場の状況から、被害者が違法な「記憶を売る市場」を利用していた形跡を特定する。'
- '中盤: 複数の取引業者への聞き込みを実施。しかし、捜査一課内部では、記憶技術を捜査に活用しようとする若手と、それを禁ずるベテランとの間で組織的な軋轢が生じ、如月の捜査は停滞する。聞き込みの結果、被害者の記憶が「約束の丘」という地点に強く紐付いていることが判明する。'
- '終盤: 「約束の丘」での現場検証中、如月は記憶の売買プロセスにおける決定的な矛盾を発見。記憶が「売られていた」のではなく、特定の目的のために「書き換えられていた」可能性に辿り着く。'
- '結末: デジタルデータに残らない「感覚の不一致」と、現場に残された微細な物理的証拠を突き合わせ、犯人のアリバイを崩す。組織の圧力に屈することなく、如月は記憶の改ざんによって隠蔽された殺人事件の全容を暴く。'
style_notes: 警察小説のリアリズムを徹底する。捜査手順（現場検証、聞き込み、供述採取）を詳細に描き、時刻と場所を厳格に記す。会話は短く、実務的で感情を排したトーンを維持する。三人称を用い、乾いた硬質な文体で組織内の軋轢と捜査の機微を描写する。
