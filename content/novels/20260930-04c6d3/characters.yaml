- name: 如月 蓮 (キサラギ レン)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無造作な黒髪に、どこか疲れを感じさせる鋭い瞳。痩身だが、格闘球技で鍛え上げたしなやかな筋肉を持つ。
  personality: 極めて誠実で不器用。嘘をつけない性質を「呪い」と感じている。一人称は「俺」。
  speech_style: 単刀直入で飾り気がない。相手の言葉に対して、常に真実のみを返そうとする。
  background: 元々はエリート育成組織の有望株だったが、チームの不正を「嘘をつけない」ために告発してしまい、業界から追放された。
  motivation: 自分の特性が弱点ではなく、武器になる場所を見つけること。
  relationships:
  - name: 竜崎 海
    relation: チームメイトであり、最も信頼する相棒
  - name: ヴィクター・ヴェイン
    relation: 宿敵
  arc: 孤独な逃亡者から、仲間を守るために「真実」を力に変えるリーダーへと成長する。
- name: 竜崎 海 (リュウザキ カイ)
  role: 相棒
  age: 18
  gender: 男性
  appearance: 銀髪の短髪に、左頬に古い傷跡。耳には多数のピアス。派手なストリートウェアを好む。
  personality: 享楽的で計算高いが、一度認めた相手には異常なまでの忠誠心を見せる。一人称は「俺」。
  speech_style: 軽薄で挑発的な口調。相手を食ったような物言いで場をかき乱す。
  background: 路地裏の孤児。生き残るために嘘と策略を武器にグラットボールを続けてきた。
  motivation: この腐った街の頂点に立ち、自分の存在を証明すること。
  relationships:
  - name: 如月 蓮
    relation: 理解不能だが目が離せないチームメイト
  arc: 打算的な生き方から、嘘のない信頼に基づく「繋がり」の価値を知る。
- name: ヴィクター・ヴェイン
  role: 敵役
  age: 25
  gender: 男性
  appearance: 非の打ち所がない端正な顔立ち。常に高級なスーツを纏い、冷徹な青い瞳を持つ。
  personality: 極めて冷酷で計算高い。人間を駒としてしか見ていない。一人称は「私」。
  speech_style: 丁寧で洗練されているが、相手を見下すような冷たさが常に漂う。
  background: 街を支配する巨大組織の幹部であり、最強のグラットボールチームを率いる絶対王者。
  motivation: グラットボールを通じて街の権力構造を盤石なものにすること。
  relationships:
  - name: 如月 蓮
    relation: 秩序を乱す不純物
  arc: 揺るぎない支配者として、主人公たちの「嘘のない情熱」という異物を排除しようとする。
- name: 佐藤 美緒 (サトウ ミオ)
  role: 脇役
  age: 19
  gender: 女性
  appearance: 短い髪に、油汚れのついた作業着。常に大型のレンチを腰に下げている。
  personality: 現実主義でサバサバしているが、根は情に厚い。一人称は「あたし」。
  speech_style: ぶっきらぼうで、効率を重視した短い言葉遣い。
  background: 廃街のジャンク屋を営むメカニック。プレイヤーたちの消耗したギアの修理を請け負っている。
  motivation: 路地裏の居場所を守り、はみ出し者たちが潰されないようにすること。
  relationships:
  - name: 如月 蓮
    relation: ギアのメンテナンス担当兼、チームの精神的支柱
  - name: 竜崎 海
    relation: 手のかかる修理依頼人
  arc: 傍観者としてチームを見守る立場から、彼らの夢を支える「居場所の守護者」へと自覚を深める。
