title: 泥と鉄のパスライン
genre: スポーツ青春
tone: 硬派、無骨、疾走感
pov: 一人称（俺）
tense: 現在形
setting: 工業地帯の廃街。路地裏で行われる違法格闘球技『グラットボール』の世界
premise: 嘘をつけない呪いを背負った俺は、裏切りが常習の路地裏スポーツ『グラットボール』で孤立していた。だが、泥にまみれたはみ出し者たちと出会い、不器用な信頼で結ばれたチームを組む。嘘という武器を持たない俺たちが、暴力的なまでの正直さで頂点を目指す物語だ。
themes:
- 誠実さの暴力
- 居場所の獲得
rules:
- グラットボールはボールを奪い合いゴールに叩き込む球技だが、反則の概念がなく肉弾戦が主体となる
- 主人公は精神的な呪いにより、意識的に嘘をつこうとしても言葉が出ないか、激痛が走る
plot_outline:
- '序盤: 嘘をつけないことでチームを追われ、孤独に生きる俺。練習場に居座る名前のない猫だけが唯一の話し相手となる。'
- '中盤: 腕はいいが性格に難のある連中と出会い、暫定的なチームを結成。相手の狡猾な罠を、俺の『嘘をつけない』という特性が逆に突破口となり、勝ち上がり始める。'
- '終盤: 街の権力者が支配する最強チームとの決勝戦。仲間が次々と倒れる中、俺は呪いさえも力に変えて、真っ直ぐにゴールへ突き進む。'
- '結末: 勝利し、街に認められた俺たち。名前のない猫に名前をつけ、仲間と共に新しいチームの旗を掲げる。'
style_notes: 一文を短く切り、名詞と動詞でリズムを作る。擬音を一切排除し、『地面を蹴る』『骨を砕く』など具体的な動作で衝撃を表現する。試合開始直前には必ず周囲の静寂や呼吸、視覚的な細部を丁寧に描写し、静と動の対比を強調する。
