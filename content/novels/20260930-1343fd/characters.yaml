- name: 夏目 陽葵（なつめ ひまり）
  role: 主人公
  age: 26
  gender: 女性
  appearance: 明るい茶髪のポニーテール。常にエプロン姿で、少し粉がついていることが多い。屈託のない笑顔が特徴。
  personality: お節介で世話焼き、考えるより先に体が動くタイプ。一人称は「あたし」。
  speech_style: 「〜だよ！」「〜じゃない！？」など、元気でハキハキとした、少しお調子者な口調。
  background: 都会での生活に疲れ、祖母が遺した灯台カフェを継ぐために海辺の町へ移住してきた。
  motivation: 美味しい料理でお客さんを笑顔にすること。そして、預かった剣の謎を解き明かすこと。
  relationships:
  - name: 源蔵
    relation: 常連客であり、剣を預けてきた恩人
  - name: 織部 凛
    relation: 町の歴史について相談できる友人
  arc: 自分のペースで生きることに不安を感じていたが、町の人々と関わる中で、自分の居場所と役割を確信していく。
- name: 源蔵（げんぞう）
  role: 脇役（きっかけを与える人物）
  age: 78
  gender: 男性
  appearance: 日焼けした深い皺のある顔。使い込まれた漁師のベストを愛用している。穏やかな目つき。
  personality: 寡黙だが包容力があり、どこか神秘的な雰囲気を持つ。一人称は「わし」。
  speech_style: ゆっくりとした、落ち着いた語り口。時折、古い言い回しが混ざる。
  background: 町の長老的存在。かつて灯台の守り手の一族であったことを示唆する。
  motivation: 町の伝統と、かつての「守り」の精神を次の世代へ繋ぐこと。
  relationships:
  - name: 夏目 陽葵
    relation: カフェの店主。彼女の明るさに救われている
  arc: 役割を終えてきた自負と寂しさの間で揺れていたが、陽葵に剣を託すことで、過去を未来へ手渡す決意をする。
- name: 瀬戸 蓮（せと れん）
  role: 脇役（町の住人・客）
  age: 22
  gender: 男性
  appearance: 少し長めの黒髪で、常にどこか眠たげな瞳。スケッチブックを常に持ち歩いている。
  personality: 内向的で繊細。周囲に馴染めず、自分の表現することに自信を失っている。一人称は「僕」。
  speech_style: 消え入りそうなほど小さな声で、丁寧だが距離を感じさせる話し方。
  relationships:
  - name: 夏目 陽葵
    relation: カフェの常連。彼女の作る温かい食事に救われている
  arc: 剣の修復と灯台の明かりが象徴する「再生」の物語に触れ、止まっていた自分の時間を再び動かし始める。
- name: 織部 凛（おりべ りん）
  role: 相棒的役割
  age: 25
  gender: 女性
  appearance: 眼鏡をかけた知的な印象の女性。常に整理整頓された服装をしている。
  personality: 冷静沈着で論理的。陽葵の突拍子もない行動にツッコミを入れる苦労人。一人称は「私」。
  speech_style: 簡潔で明瞭。感情に流されず、事実に基づいた話し方をする。
  background: 町の小さな図書館の司書。町の古い文献や伝承に詳しい。
  motivation: 町の歴史や文化が忘れ去られていくことを防ぎたい。
  relationships:
  - name: 夏目 陽葵
    relation: 友人であり、情報提供者
  arc: データや知識としてしか町を見ていなかったが、陽葵の熱意に触れ、町の人々の「心」に寄り添う大切さを知る。
