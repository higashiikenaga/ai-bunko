title: 海風と焦げたパンと、忘れ物の灯台
genre: 日常ほのぼの
tone: 明るくテンポがよく、温かな雰囲気
pov: 一人称（あたし）
tense: 現在形と過去形の混合（軽快な語り）
setting: 現代、海辺の小さな町にある、古びた灯台を改装したカフェ「ライトハウス・キッチン」
premise: あたしは、海辺の町で灯台を改装したカフェを営む、ちょっとお節介な店主。ある日、常連のおじいさんが「使い物にならなくなった」と、錆びついた折れた剣を置いていった。それは、かつてこの町の守り神として語り継がれたものらしい。剣の修復をきっかけに、町の人たちの「心の中の折れたもの」が少しずつ動き出し、美味しい料理と共に物語が動き出す。
themes:
- 修復と再生
- 日常の愛おしさ
rules:
- 剣は魔法の道具ではなく、あくまで歴史的な遺物として扱う
- カフェのメニューは、訪れる客の心情に合わせて店主が即興で出す
plot_outline:
- '序盤: 灯台カフェでの賑やかな日常。おじいさんから「折れた剣」を預かり、あたしは「これ、どうやって掃除すればいいのよ！」と大慌て。'
- '中盤: 剣を磨く過程で、町の古い伝承や、かつて灯台が果たしていた役割が判明していく。訪れる客たちが、それぞれ「折れた心」や「忘れ物」を抱えていることが描かれる。'
- '終盤: 剣を綺麗に磨き上げた夜、古い灯台に明かりが灯り、町の人たちが集まってくる。美味しいホットケーキと温かい紅茶を囲みながら、みんなが少しだけ前向きになる。'
- '結末: 剣は町の小さな記念品として飾られ、あたしは今日もまた、今日のお客さんにぴったりのメニューを考えて厨房に立つ。'
style_notes: 一人称「あたし」による軽快でツッコミの多い語り。会話劇を多用し、キャラクターの可愛げを強調する。食べ物の描写は「湯気がふわっと立ち上る」「サクッとした食感」など、五感を刺激するように美味しそうに書く。各エピソードの終わりに、クスッと笑える日常の失敗談や掛け合いを必ず入れる。
