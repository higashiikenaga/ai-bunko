- name: レオン・ヴァン・クロフト
  role: 主人公
  age: 17
  gender: 男性
  appearance: 風に跳ねた栗色の髪に、常に首に巻いた赤い飛行スカーフが特徴。瞳は好奇心に満ちた琥珀色。
  personality: 前向きで勇敢だが、時折無鉄砲。情に厚く、仲間を信じて突き進むタイプ。一人称は「俺」。
  speech_style: 快活で真っ直ぐな口調。「行くぞ！この空の先にあるはずだ！」
  background: 伝説的な空士だった父を幼くして亡くし、遺品である改造飛空艇『ゼフィール号』と共に静かな港町で暮らしていた。
  motivation: 父の遺言に従い、雲海の果てにある「古い灯台」に到達し、父が本当に伝えたかった真実を知ること。
  relationships:
  - name: クララ・メイソン
    relation: 信頼し合う最高のパートナー兼機関士
  - name: サイラス・ヴォーン
    relation: 不器用ながらも慕っている導き手
  arc: 父の影を追う少年から、自らの意志で空を切り拓き、仲間を率いる真の船長へと成長する。
- name: クララ・メイソン
  role: 相棒（機関士）
  age: 18
  gender: 女性
  appearance: 油汚れのついたオーバーオールを着用。もじゃもじゃの金髪を雑に結び、常に大きなレンチを携帯している。
  personality: 現実主義で毒舌だが、機械への愛は誰よりも強い。面倒見の良い姉御肌。一人称は「私」。
  speech_style: ぶっきらぼうだが愛情が滲む口調。「ったく、また無理させたわね！このエンジンが悲鳴を上げてるわよ！」
  background: 元は帝国の軍事工場で天才的な才能を発揮していたが、組織の非道な開発方針に反発して脱走した逃亡エンジニア。
  motivation: 『ゼフィール号』に搭載された未知の蒸気機関の構造を解明し、究極の飛行機械を完成させること。
  relationships:
  - name: レオン・ヴァン・クロフト
    relation: 危なっかしいが、その純粋さに惹かれている
  - name: サイラス・ヴォーン
    relation: 価値観は合わないが技術的な信頼を置いている
  arc: 効率や理論だけを信じていたが、レオンたちとの旅を通じて、計算不可能な「絆」や「情熱」の価値に気づく。
- name: サイラス・ヴォーン
  role: 導き手（元空賊）
  age: 34
  gender: 男性
  appearance: 古びたロングコートを羽織り、左頬に深い切り傷がある。常に葉巻を燻らせている鋭い眼差しの男。
  personality: 冷徹で皮肉屋に見えるが、内には強い正義感と後悔を秘めている。経験豊富で冷静。一人称は「私」。
  speech_style: 低く落ち着いた、含みのある話し方。「坊主、空は甘くない。風を読む前に、まず己の弱さを読め。」
  background: かつて雲海を震撼させた空賊団の幹部だったが、ある事件をきっかけに組織を離れ、正体を隠して流れ者となっていた。
  motivation: 過去に失った仲間への贖罪として、レオンを灯台へと導き、世界の均衡を取り戻すこと。
  relationships:
  - name: レオン・ヴァン・クロフト
    relation: かつての自分に似た危うさを感じ、密かに見守っている
  - name: クララ・メイソン
    relation: 口喧嘩の絶えない腐れ縁のような関係
  arc: 孤独に生きることを選んでいたが、再び誰かと共に飛ぶ喜びを取り戻し、自らの過去と向き合い許しを得る。
