title: 風を継ぐ翼と雲海の羅針盤
genre: スチームパンク冒険
tone: 空と風を愛する爽快な冒険活劇。機械と疾走感あふれる描写
pov: 三人称
tense: 過去形
setting: 蒸気機関とプロペラ機が空を支配する、無限の雲海が広がる世界
premise: 亡き父が遺した改造飛空艇『ゼフィール号』を駆る若き空士レオンは、遺言に従い、雲の切れ間に佇む古い灯台を目指していた。道中で出会った腕利きの機関士や仲間たちと共に、嵐を切り裂き、未知なる空域へと飛び出していく。風を読み、機械の鼓動と共に仲間との絆を深めながら、世界の果てに隠された最大の秘宝を追う。
themes:
- 仲間との固い絆
- 大空へのロマンと冒険
rules:
- 飛空艇は気流と蒸気機関の出力が命であり、燃料切れや暴風は致命傷になる
- 古い灯台の光は、雲海に潜む未知の航路を示す唯一の目印である
plot_outline:
- '序盤: 亡き父の遺言と古い灯台の存在を知ったレオンが、愛機『ゼフィール号』で仲間を集めて旅立つ。'
- '中盤: 荒れ狂う雲海や、空賊たちとの激しい空中戦を、機転と仲間とのチームワークで突破していく。'
- '終盤: 遺言の示す古い灯台に到達し、そこに隠された驚愕の真実と、次なる空への扉を発見する。'
- '結末: 新たな仲間と共に、風を背受けてさらに広大な大空へ向けて力強く飛び立つ。'
style_notes: 空と飛行を愛する爽快な冒険活劇。歯車が噛み合う音や風圧を感じさせる機械と風の描写に優れ、明るく勢いのある三人称で仲間との絆を描く。
