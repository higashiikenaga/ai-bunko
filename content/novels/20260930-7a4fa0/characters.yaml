- name: 海堂 蓮（かいどう れん）
  role: 主人公
  age: 24
  gender: 男性
  appearance: 常にフードを深く被り、片目に旧式の光学義眼を装着している。痩せ型で、肌は酸性雨の影響で少し荒れている。
  personality: 冷笑的で厭世的。他人に深入りすることを避けるリアリスト。一人称は「オレ」。
  speech_style: 低く、ぶっきらぼうな話し方。無駄な言葉を嫌う。
  background: ネオ・カスケードのスラムで、企業の機密データを盗み売るフリーランスのハッカー。孤独に生きることを信条としてきた。
  motivation: 託された遺言の謎を解き、自分を狙う企業の追跡から生き延びること。
  relationships:
  - name: エライアス
    relation: 遺言の授受者
  - name: ヴァクトリア・スターリング
    relation: 追跡者と逃亡者
  arc: 孤独な生存者から、世界の欺瞞を暴くためにシステムへ挑む反逆者へと変貌する。
- name: エライアス
  role: 導き手
  age: 15
  gender: 無性別
  appearance: 塗装が剥げ、回路が露出した旧型のアンドロイド。瞳には消え入りそうな青い光が宿っている。
  personality: 穏やかで、どこか哀愁を帯びた哲学的思考を持つ。一人称は「私」。
  speech_style: 丁寧だが、通信ノイズが混じるような機械的な口調。
  background: かつてアイギス・コアの記憶管理部門に所属していたが、現在は廃棄寸前の旧型として路地裏に捨てられていた。
  motivation: 企業が抹消した「人間性の記録」を、誰かに受け継がせること。
  relationships:
  - name: 海堂 蓮
    relation: 遺言を託した相手
  arc: 物理的な死を迎えながらも、データとしての「遺言」を通じて世界に希望の火を灯す。
- name: ヴァクトリア・スターリング
  role: 敵役
  age: 42
  gender: 女性
  appearance: 隙のない高級なスーツを纏い、全身の半分が最新鋭のサイバネティクスで補強されている。氷のように冷たい美貌。
  personality: 徹底した合理主義者。秩序を乱す事象を「バグ」として排除することに一切の躊躇がない。一人称は「私」。
  speech_style: 優雅だが、威圧感のある事務的な口調。
  background: 超巨大企業『アイギス・コア』の治安維持部門最高責任者。都市の完璧な統治を司る。
  motivation: 企業の支配体制を脅かす「バグ（遺言）」を完全に抹消し、都市の安定を維持すること。
  relationships:
  - name: 海堂 蓮
    relation: 排除すべき対象
  arc: 完璧な秩序の守護者として振る舞うが、情報の奔流の中で自らの支配の脆さを突きつけられる。
- name: マヤ
  role: 相棒/協力者
  age: 32
  gender: 女性
  appearance: ネオンカラーの髪と多数のタトゥー、使い古されたテクニカル・ジャケットを着用している。
  personality: 肝が据わった姉御肌で、裏社会の事情に精通している。一人称は「あたし」。
  speech_style: 威勢が良く、スラングを多用する。ぶっきらぼうだが情に厚い。
  background: 隠しサーバー『雨の停留所』にあるバーのオーナー。元はアイギス・コアの技術者だった。
  motivation: スラムの住人たちが束の間の休息を得られる、情報の避難所を守り抜くこと。
  relationships:
  - name: 海堂 蓮
    relation: 情報提供者兼協力者
  arc: 中立を保つ情報屋から、システムの崩壊に際して危険を承知で共闘する戦友へと変わる。
