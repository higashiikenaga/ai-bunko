title: クロムの雨と、亡霊の遺言
genre: SF
tone: ネオンと雨、ハードボイルド、サイバーパンク
pov: 一人称（オレ）
tense: 過去形
setting: 超巨大企業『アイギス・コア』が統治する、酸性雨の降り止まない垂直都市・ネオ・カスケード
premise: 降り止まぬ酸性雨が、街のネオンをぼやかす夜。オレは情報のゴミ捨て場、路地裏のハッカーだ。ある日、死に際のアンドロイドから『遺言』を託される。それは、雨の日だけ開く、存在しないはずのバーの場所だった。解析を進めるほど、企業の深淵と、消されたはずの記憶が濁流のように流れ込んでくる。
themes:
- デジタルな死と魂の在り処
- 支配層の欺瞞と路地裏の真実
rules:
- 酸性雨の強度は企業の排出する廃液に依存する
- 記憶データは『魂』として取引されるが、物理的な脳への書き換えには高いリスクが伴う
- 『雨の日だけ開く店』は、特定の気象条件下でのみ通信ノイズが収束して現れる仮想の接点である
plot_outline:
- '序盤: 錆びた路地裏で、瀕死の旧型機から暗号化された『遺言』を奪い取る。解析を開始すると、街のシステムに致命的なバグが走る。'
- '中盤: データの断片を追ううち、雨の日にしかアクセスできない隠しサーバー『雨の停留所』の存在を知る。そこには、企業が抹消した『失われた人間性』のログが眠っていた。'
- '終盤: アイギス・コアの追跡部隊が路地裏を焼き払う。オレは脳をオーバークロックし、企業のセントラル・コアへダイブを試みる。'
- '結末: 企業の大規模な隠蔽工作を暴き、データの奔流の中で『遺言』の真意を知る。雨は止まないが、オレの視界は少しだけクリアになった。'
style_notes: 短いセンテンスで畳みかける。形容詞より動詞と名詞。ハッキングシーンは、バイナリの奔流、神経接続の熱、プロトコルの衝突など、生理的な感覚を伴う擬似的な手順で描写する。常に『雨』と『ネオン』の色彩を背景に置くこと。
