- name: 瀬戸 澪
  role: 主人公
  age: 24
  gender: 女性
  appearance: 青白い肌に、どこか虚ろな瞳をした痩身の女性。地味な服装に身を包んでいるが、指先だけは常に手入れが行き届いている。
  personality: 内向的で完璧主義。日常の凡庸さに耐えられず、永遠に変わらない絶対的な美を渇望している。一人称は「私」。
  speech_style: 静かで控えめ。感情が高ぶると言葉数が少なくなり、独白に近い話し方になる。
  background: 美大を卒業したが、自分の作品に「魂がこもっていない」と感じて挫折し、現在は小規模な画廊で事務員として働いている。
  motivation: 自分を救い出してくれるほどの、圧倒的で永遠の美に出会いたい。
  relationships:
  - name: 玻璃
    relation: 店主であり、自分を美へと導く導師のように慕う対象
  - name: 桐生 蓮
    relation: 店に通う先客であり、警告をくれるが同時に同族だと感じる人物
  arc: 人間としての生への執着を捨て、結晶化する恐怖を快楽へと変換し、最終的に究極の美（ガラスの樹）として完成される。
- name: 玻璃（はり）
  role: 敵役
  age: 0
  gender: 中性
  appearance: 深い瑠璃色のベルベットのスーツを纏い、透き通るような白い肌を持つ。瞳はオパールのようになん色にも輝き、瞬きが極端に少ない。
  personality: 慇懃無礼で冷酷。人間を「素材」としてしか見ておらず、美的な完成度のみに価値を置く。一人称は「私」。
  speech_style: 極めて丁寧な敬語。詩的で比喩の多い言い回しを好み、相手の欲望を巧みに煽る。
  background: かつて美に憑りつかれ、この店に囚われた客たちの意識と肉体が融合して生まれた、美の集合体としての怪異。
  motivation: より純粋で、より贅沢な「美」を収集し、自らのコレクションを完成させること。
  relationships:
  - name: 瀬戸 澪
    relation: 最高の素材として目をつけ、心身ともに結晶化へ導く獲物
  arc: 変化せず、常に捕食者として君臨し続ける。澪を新たな芸術品へと昇華させることで満足感を得る。
- name: 桐生 蓮
  role: 脇役
  age: 32
  gender: 男性
  appearance: 端整な顔立ちだが、左腕から肩にかけてが乳白色のガラスに変わり、常に厚い包帯で隠している。
  personality: 神経質で悲観的。恐怖に震えながらも、一度味わった結晶化の快楽から逃れられない矛盾を抱えている。一人称は「俺」。
  speech_style: 早口で切迫感がある。時折、自嘲気味に笑いながら話す。
  background: かつてはこの店で「ガラスの瞳」を購入し、視覚的な美しさを得た代償に身体を浸食され始めた元芸術家。
  motivation: 結晶化を止める方法を探して店に通い続けているが、本心では完全に美しくなりたいという願望がある。
  relationships:
  - name: 瀬戸 澪
    relation: 同じ道を歩み始めた後輩として、警告を与えつつもその純粋な没落を期待している
  - name: 玻璃
    relation: 抗えない支配者であり、同時に唯一自分を理解してくれる救済者
  arc: 澪に警告を発するが、最終的には自らの恐怖に耐えきれず、玻璃に懇願して完全に結晶化することを選ぶ。
