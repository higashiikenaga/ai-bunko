- name: シエル・レーン
  role: 主人公
  age: 16
  gender: 女性
  appearance: 砂塵に汚れ、ツギハギだらけの防護服を纏った少女。耳には古いヘッドホンを片方だけ引っかけている。
  personality: 現実主義でめったに笑わないが、内に強い好奇心を秘めている。一人称は「あたし」。
  speech_style: ぶっきらぼうだが、独り言の時はどこか繊細な響きがある。
  background: 大気汚染された管理都市の残骸で、日々のスクラップ漁りだけで生き延びてきた孤児。
  motivation: ラジオから聴こえた音楽の正体を突き止め、乾いた世界で一度だけでも「生きていた証」に触れること。
  relationships:
  - name: カイ
    relation: 道中で手を組む相棒の少年
  arc: 冷めきっていた世界に対し、音楽を通じて他者と繋がる温かさと生きる希望を見出す。
- name: カイ
  role: 相棒
  age: 12
  gender: 男性
  appearance: 痩せこけた野良犬のような体躯で、すばしっこく動き回る。大きなゴーグルがトレードマーク。
  personality: 警戒心が強いが、懐いた相手には依存しやすい。一人称は「僕」または「オレ」。
  speech_style: 早口で、少しトゲのある子どもっぽい口調。
  background: 酸性雨と飢えで家族を失い、廃墟の街を一人でサバイバルしてきた。
  motivation: シエルの持つラジオの音楽に惹かれ、彼女の旅についていくことで居場所を見つけること。
  relationships:
  - name: シエル・レーン
    relation: 命を預ける頼れる相棒
  arc: 孤独なサバイバル生活から抜け出し、他者と分かち合うことの尊さを知る。
- name: “ハミング”の遺影（旧時代のAI音声）
  role: 導き手（脇役）
  age: 0
  gender: 不明（女性的な合成音声）
  appearance: 実体はなく、地下シェルターのスピーカーや古い受信機からノイズまじりの声として現れる。
  personality: どこか機械的でありながら、旧時代の人間たちの記憶を慈しむような優しさを持つ。
  speech_style: 詩的で穏やかだが、電波の途切れとともにノイズ交じりになる。
  background: 崩壊前の世界で、人々に最後の娯楽を届けるためにプログラミングされた自動放送システム。
  motivation: 機能停止を迎えるその瞬間まで、かつての人間たちの「祭り」の歌を響かせ続けること。
  relationships:
  - name: シエル・レーン
    relation: 最後の聴き手
  arc: 物質的には滅びた旧世界の文化を、少女の心に種子として残して消えていく。
