title: 錆びた弦のハミング
genre: ディストピア
tone: 乾いたユーモアと荒涼感が入り交じるポストアポカリプス
pov: 一人称「あたし」
tense: 過去形
setting: 大気汚染と酸性雨で文明が崩壊し、管理都市の残骸が眠る砂塵の大地
premise: ガラクタ拾いのあたしが手に入れたのは、とっくに死んだ世界から届く「夜明けのラジオ」の電波だった。わずかに残った乾電池の残量を気にしながら、そのノイズまじりの音楽を追って、あたしは首都跡の廃墟へと足を踏み入れる。そこで待ち受けていたのは、絶望の底でかつて人間たちが開いた「祭りの夜」の幻影だった。物資も希望もない世界で、壊れかけた機械と人間の意地が、最後の音を奏でる。
themes:
- 過去の文化の残響
- 限られた物資と生存のリアリティ
- 荒廃した世界での人間的な温もり
rules:
- 電子機器の駆動には旧世紀の乾電池や手回し発電が必須であり、残量は常に有限である
- 屋外での酸性雨対策として、防護ポンチョと中和剤の所持が生死を分ける
- 管理都市の残骸には自動防衛機能が一部残っており、無謀な侵入は即座の死を意味する
plot_outline:
- '序盤: ガラクタ漁りの最中、手に入れた古い受信機から奇妙な音楽と声が流れる。物資の乏しさに舌打ちしつつ、あたしはその発信源を探す旅を決意する。'
- '中盤: 酸性雨をやり過ごしながら廃墟の高速道路を進む。道中で出会った野良犬のような少年と手を組み、互いの貴重な水とレーションを分け合う。'
- '終盤: 電波の源である地下シェルターに到着。そこには旧時代の遺物を使った、電飾とガラクタだらけの「祭りの夜」を模した空間が広がっていた。'
- '結末: 電池が完全に尽きるその瞬間、ラジオから最後の曲が流れる。乾いた世界に響いた短いハミングを胸に、あたしらはまた明日を生きるため歩き出す。'
style_notes: 皮肉屋で口が悪いが情に厚い一人称「あたし」による語り。乾いたユーモアを交えつつ、バッテリー残量やレーションの数といった物資の具体的な数字を細かく気にし、廃墟のコンクリートの隙間に咲く名もなき花のような、小さな美しさを丁寧に描写する。
