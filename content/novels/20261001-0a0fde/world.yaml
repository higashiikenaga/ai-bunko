title: 骸鉄の航路：蒼穹を裂く沈黙の残響
genre: 異世界ファンタジー
tone: 無骨で硬派、血と鉄の匂いが漂う重厚なアクション
pov: 一人称（俺）
tense: 過去形
setting: 最終列車が走り去った後の、断片化した世界。空に浮遊する島々と、かつて文明が沈んだ海底遺跡が点在する時代。
premise: 最終列車にルナを託し、記憶を失ったカイルは廃墟で剣を振るい続けていた。だが、世界は再起動したのではない。むしろ、記憶の奔流によって空と海が混ざり合う「混濁の時代」へと変貌していた。空飛ぶ船を操る新たな勢力と、海底に眠る旧世界の遺物。カイルは、失った自分自身とルナの行方を探すため、再び鉄の意思を抱いて戦場へと身を投じる。
themes:
- 喪失と再構築
- アイデンティティの証明
rules:
- 魔力は個人の『記憶』を燃料として変換・行使される
- 記憶を失いすぎた者は、自我を喪失した『ハスク』へと変異する
- 空飛ぶ船の動力源は、高密度の記憶結晶である
plot_outline:
- '序盤: 記憶の大部分を失ったカイルは、空飛ぶ船を拠点とする交易団に拾われる。彼は己の剣技だけを頼りに、空中の漂流物から記憶結晶を回収する傭兵として生きる。ある日、彼は海底遺跡から引き揚げられた「ルナの形見」を見つけ、彼女がまだ生きている可能性に気づく。'
- '中盤: カイルは海底遺跡の調査任務中に、かつての戦友の成れの果てと遭遇する。深海に沈んだ旧文明の都市に、世界の再起動を歪めた「記憶の澱」が溜まっていることを知る。カイルは空飛ぶ船を駆り、雲海を越え、深海へと続く垂直の航路へと進む。'
- '終盤: 海底遺跡の最深部で、カイルはルナが「世界の記憶の管理者」として、新たな秩序の核となっている姿を目撃する。しかし、それは彼女の自我を押し殺した、機械的な再起動に過ぎなかった。カイルは、世界を正しい形に戻すためではなく、ただ一人の少女を取り戻すために、神格化した秩序へと剣を向ける。'
- '結末: 激闘の末、カイルは『忘却の楔』を極限まで研ぎ澄まし、世界のシステムを一時的に破壊する。秩序は崩壊し、世界は再び不確かな混沌へと戻るが、そこには「意味」を持った個人の意志が宿る。カイルは記憶をほぼ全て失いながらも、ルナの手を握り、名もなき旅人として新しい空へと漕ぎ出す。'
style_notes: 短文で畳みかける硬派な文体。擬音語を排除し、動詞を駆使して衝撃や動きを表現する。戦闘シーンの前には必ず、風の音や静寂、あるいは己の鼓動だけが聞こえるような静謐な描写を挟む。一人称は「俺」を用い、無骨だが内面に熱い情熱を秘めた語り口とする。
