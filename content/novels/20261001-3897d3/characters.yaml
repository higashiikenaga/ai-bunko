- name: 奏（かなで）
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの黒髪と、常に眠たげで影のある瞳。音楽を扱うための細く繊細な指先が特徴。
  personality: 内向的で感受性が強く、他者の痛みに対して敏感。一人称は「僕」。
  speech_style: 静かで、囁くような落ち着いた口調。言葉数は多くない。
  background: 眠らない街の片隅で、親から受け継いだ禁忌の「眠りの曲」を密かに奏で続けている少年。
  motivation: 音楽を「覚醒」のためではなく、人々が安らぐための「子守歌」として取り戻すこと。
  relationships:
  - name: ルナ
    relation: 音楽的な欠落を埋め合い、魂を共鳴させるパートナー
  - name: ゼノス
    relation: 世界の秩序を巡る対立者
  arc: 自分の音楽に責任を持ち、世界を変えるための巨大な旋律を奏でる勇気ある表現者へと成長する。
- name: ルナ
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような銀髪と、意志の強さを秘めた澄んだ瞳。どこか浮世離れした儚い雰囲気を持つ。
  personality: 真っ直ぐで情熱的。故郷を失った孤独を抱えているが、それを力に変える強さを持つ。一人称は「私」。
  speech_style: 明るく、旋律を口ずさむようなリズム感のある話し方。
  background: 地図から消された「消えた村」の末裔。断片的な歌の記憶だけを頼りに、失われた旋律の復元を目指している。
  motivation: 自分のルーツである故郷の旋律を完全に復元し、失われた記憶を世界に繋ぎ止めること。
  relationships:
  - name: 奏
    relation: 旋律を形にしてくれる唯一の伴奏者
  arc: 過去の断片を追い求める旅人から、奏と共に新しい時代の旋律を創り出す創造者へと変化する。
- name: ゼノス
  role: 敵役
  age: 42
  gender: 男性
  appearance: 隙のない指揮官服を纏い、鋭い眼光を放つ。常に黄金のタクトを手にしている。
  personality: 徹底した合理主義者。効率と覚醒こそが人類の進化だと信じる冷酷な支配者。一人称は「私」。
  speech_style: 命令的で、メトロノームのように正確で威圧的な話し方。
  background: 眠らない街の最高統治者。音楽を社会の生産性を最大化するための「動力」として管理している。
  motivation: 街の完全な覚醒状態を維持し、不純な「眠り」や「夢」を一切排除すること。
  relationships:
  - name: 奏
    relation: 秩序を乱す排除すべき不協和音
  - name: ルナ
    relation: 失われた旋律を解明するための利用対象
  arc: 完璧な支配を誇っていたが、二人が奏でる予測不能な「調和」によって、自身の築いた秩序を崩壊させられる。
