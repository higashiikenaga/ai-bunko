title: 月光のタクトと、眠らぬ街の子守歌
genre: 青春恋愛
tone: 詩的でリズミカル、幻想的な夜の雰囲気
pov: 三人称
tense: 過去形
setting: 音楽が法であり動力である世界。不眠の旋律が街を支配する「眠らない街」と、地図から抹消された「消えた村」
premise: 効率と覚醒を追求し、音楽によって睡眠を禁じられた「眠らない街」。そこで禁忌とされる『眠りの曲』を奏でる少年と、失われた故郷の旋律を探して街を彷徨う少女が出会う。二人が奏でる不協和音は、やがて世界を心地よいまどろみへと誘う最高の調和へと変わっていく。音楽が心と体を縛る世界で、彼らが勝ち取るのは静かな夜と、たった一人のための愛の歌だった。
themes:
- 喪失と再生
- 管理社会への抵抗
- 純粋な共鳴
rules:
- この世界では特定の周波数の音楽が物理的な力（覚醒、睡眠、感情操作）を持つ
- 街の統治者は『覚醒歌』を24時間放送し、市民から睡眠と夢を奪うことで労働効率を最大化させている
- 『眠りの曲』を奏でることは重罪であり、発覚した者は記憶を消去され、音楽的な才能を奪われる
- 『消えた村』は、かつて夢を肯定した音楽家たちが集った場所であり、現在は特定の共鳴周波数を持つ者にしか視えない次元に隠れている
plot_outline:
- '序盤: 眠らない街で、密かに禁じられた子守歌を奏でる少年・奏（かなで）は、街の喧騒の中で唯一「眠そうな目」をした少女・ルナと出会う。ルナは、かつて音楽と共に消えたとされる故郷の村の旋律を復元しようとしていた。'
- '中盤: 二人は互いの音楽的な欠落を埋め合わせるように、秘密の合奏を始める。ルナが記憶の断片を歌い、奏がそれを伴奏で形にするたび、街の至る所に『消えた村』の幻影が重なり始める。二人の距離は、音楽のシンクロ率と共に急速に縮まっていく。'
- '終盤: 統治者が二人の共鳴に気づき、街全体を強制的に覚醒させる『絶頂の狂詩曲』を演奏して、ルナの精神を破壊しようとする。奏はルナを救うため、自らの音楽的生命を賭けて、街全体の覚醒旋律を打ち消す巨大な子守歌を書き上げる。'
- '結末: 街の人々は数十年ぶりに深い眠りと夢を取り戻し、その意識の中で『消えた村』の記憶が共有される。統治体制は崩壊し、街には心地よい夜が訪れる。奏とルナは、静寂の中で互いの鼓動という最高のリズムを聴きながら、新しい曲を書き始める。'
style_notes: 文章に三拍子や四拍子のリズム感を意識し、音楽用語（スタッカート、クレッシェンド等）を比喩として多用する。各章の転換点や感情の高まりに合わせて、物語の情景を象徴する短い歌詞を挿入し、読者が耳で聴いているかのような没入感を演出する。
