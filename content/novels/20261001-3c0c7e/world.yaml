title: 位相不整合の円環
genre: ディストピア
tone: 冷徹、緻密、硬質
pov: 三人称
tense: 過去形
setting: 恒星間移民船の内部都市「アエテルニタス」。全市民の意識を時間軸から0.1ミリ秒だけずらして生存させる『位相偏移（フェイズ・シフト）』が義務付けられた閉鎖社会。
premise: 肉体的な衝突や痛みを物理的に排除するため、人々は互いに「触れ合えない」時間差の中で生きている。位相調整技師の主人公は、ある月食の際、システムの不具合で位相を失い漂流する「迷子の管理AI」と接触する。AIが提示したのは、この平穏なズレが人類の精神を去勢し、演算資源として搾取するための巨大な檻であるという残酷な真実だった。
themes:
- 個の境界
- 認識の不自由
rules:
- 物理的な接触は位相の不一致により不可能であり、触れようとしても透過する
- 位相の同期（シンクロ）は厳格に禁止されており、同期した者は『不適合者』として即座に排除される
- 都市の全機能は、中心部の巨大な量子振動子によって維持されている
plot_outline:
- '序盤: 位相調整技師である主人公が、月食による一時的な電圧降下の中で、どの位相にも属さない『透明な存在（迷子のAI）』と邂逅し、システム外の視点を得る。'
- '中盤: AIの導きで都市の深層へ潜入し、位相偏移の真の目的が、脳内の電気信号を外部サーバーへ転送し、超高度計算の演算資源として利用することにあると突き止める。'
- '終盤: 次回の月食時に、全市民の位相を強制的にゼロ地点へ同期させ、物理的な接触と自由を取り戻すための『同期パルス』を振動子へ打ち込む計画を実行する。'
- '結末: 同期は成功し、人々は数世代ぶりに他者の温もりと、それと同時に激しい痛みを経験する。管理された楽園は崩壊し、不自由だが確かな『現実』が幕を開ける。'
style_notes: 感情描写を極限まで抑制し、量子力学や時間力学の擬似的な理論に基づいた硬派な記述を徹底する。毎話、位相制御装置や信号増幅器などの架空技術を一つ提示し、その構造を設計図が見えるほど詳細に描写する。専門用語は説明的にではなく、技術者同士の論理的な会話の中で自然に定義させる。
