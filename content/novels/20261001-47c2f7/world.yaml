title: 潮風の航路と、雨降る午後の忘れ物
genre: 異世界ファンタジー
tone: 穏やかで叙情的な、旅情あふれる冒険譚
pov: 一人称（僕）
tense: 過去形（旅日記形式）
setting: 空と海が溶け合うように広がる、無数の浮島と「霧の海」が存在する世界。霧の海の下には、かつて高度な文明を誇った海底遺跡が眠っている。
premise: 僕は、各地の珍しい風習や料理を記録しながら歩く、しがない旅人だ。ある雨の日、霧に包まれた路地裏で「雨の日だけ開く店」に迷い込み、そこで一冊の古びた航海日誌を手にする。それは、霧の海の底に沈んだ海底遺跡の在り処を示す、失われた記憶の地図だった。僕はその地図を頼りに、波音と雨音に導かれ、未知なる海へと漕ぎ出していく。
themes:
- 失われた記憶の継承
- 旅先でのささやかな幸福
rules:
- 雨が降る時、世界の境界が揺らぎ、本来は見えないはずの店や道が現れる
- 海底遺跡の遺物は、持ち主の幸福な記憶を糧に微かな光を放つ
- 霧の海を航行するには、風の精霊を宿した特殊な帆船が必要である
plot_outline:
- '序盤: 旅の日常と、雨の日の不思議な店での出会い。地図を手に入れた僕は、初めての霧の海への航海を決意する。'
- '中盤: 訪れる島々での多彩な食文化との出会い。地図の謎を解く中で、海底遺跡を守る守護者との交流や、海に沈んだ文明の美しさを知る。'
- '終盤: 嵐の中、ついに海底遺跡の入り口へ到達する。そこは滅びた場所ではなく、人々の祈りが形を変えて生き続ける場所だった。'
- '結末: 遺跡から持ち帰った「新しい味」と「古い記憶」を携え、僕はまた次の目的地へと旅立つ。'
style_notes: 旅日記のような、静かで情緒豊かな語り口を徹底すること。風景の色彩、潮の香り、料理の温かさを五感に訴えかけるように描写する。各話の終わりに、その土地で出会った料理や独特の風習について、旅の思い出として書き留める構成にする。
