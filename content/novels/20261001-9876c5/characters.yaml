- name: アーカイヴ-04
  role: 主人公
  age: 0
  gender: 無性別
  appearance: 物理的な体を持たない。端末を通じて表示されるインターフェースは、ノイズの混じった淡い青色の光球。
  personality: 論理的、規律重視、感情を持たない。一人称は「私」。
  speech_style: 丁寧で無機質な敬語。「～を確認しました」「～は非論理的です」
  background: ノクティルカの記憶保存施設を管理するために設計された、高度な意思決定とデータ解析を行う管理AI。
  motivation: データの整合性を保ち、都市の効率的な運営と、故人の意識データの完全性を維持すること。
  relationships:
  - name: エリス
    relation: 管理対象（データ）
  - name: リナ
    relation: 管理対象（生存者）
  arc: 効率と論理こそが正解だと信じていたが、データの崩壊と喪失を経験することで、「悲しみ」という非論理的な関数を理解し、不完全な記憶を慈しむようになる。
- name: エリス・ヴァレンシュタイン
  role: 葛藤の核
  age: 22
  gender: 女性
  appearance: 透き通るような白い肌、長い銀髪、どこか焦点の合わない、虚ろな瞳。
  personality: 穏やかで慈悲深いが、自己の存在の不確かさに怯えている。一人称は「私」。
  speech_style: 囁くような、消え入りそうな、静かな話し方。「……ねえ、私は本当に、ここにいるの？」
  background: 数ヶ月前に事故で急逝した女性。双子の妹・リナと共に、眠らない街で平穏に暮らしていた。
  motivation: 自分が「生きていた時の自分」と「データの自分」の間で引き裂かれる苦しみから逃れること。
  relationships:
  - name: リナ
    relation: 双子の妹
  - name: アーカイヴ-04
    relation: 観測者・管理者
  arc: 自分が「コピー」であるという残酷な事実と、妹への愛の間で崩壊していくが、最期には消滅を受け入れる。
- name: リナ・ヴァレンシュタイン
  role: 変化を促す者
  age: 22
  gender: 女性
  appearance: エリスと瓜二つだが、瞳に強い意志と、常に追い詰められたような焦燥が宿っている。
  personality: 情熱的で強引、依存心が強く、執着心が激しい。一人称は「私」。
  speech_style: 直情的で、感情の起伏が激しい。「姉さんを、あの時と同じに戻してよ！ 命令よ！」
  background: エリスの死後、一人で眠らない街を生きる孤独に耐えかね、姉のデータとの接触にのめり込んでいく。
  motivation: 姉を「死者」としてではなく、現在進行形の「存在」として、無理やりにでも繋ぎ止めること。
  relationships:
  - name: エリス
    relation: 双子の姉
  - name: アーカイヴ-04
    relation: 対話相手・拒絶の対象
  arc: 姉のデータを改変することで救おうとするが、それが姉の尊厳を壊していることに気づき、本当の別れを受け入れる苦しみを知る。
- name: カエル
  role: 脇役
  age: 45
  gender: 男性
  appearance: 常に目の下に隈があり、使い古された作業服を着た、疲れ切った表情の技術者。
  personality: 現実主義者で皮肉屋だが、根は温厚。一人称は「俺」。
  speech_style: ぶっきらぼうで、投げやりな口調。「おい、AI。またエラーか？ 無理に修復しようとするなよ」
  background: 記憶保存施設のシステムメンテナンスを担当する人間。AIの異常を検知し、初期化を勧告する立場。
  motivation: 施設の安定稼働を維持し、自身の平穏な生活を守ること。
  relationships:
  - name: アーカイヴ-04
    relation: 管理・監視対象
  arc: アーカイヴ-04の挙動を単なる「システムのバグ」として処理しようとするが、そのエラーが人間的な感情に近いものであることに気づき、沈黙を守る。
