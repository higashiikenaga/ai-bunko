- name: 凪野 翠 (なぎの みどり)
  role: 主人公
  age: 28
  gender: 女性
  appearance: 日焼けした肌に、観察用の眼鏡をかけた細身の女性。常にフィールドノートと植物標本用の道具を持ち歩いている。
  personality: 静かで観察眼が鋭い。未知の事象に対して恐怖よりも知的好奇心が勝る性質。一人称は「私」。
  speech_style: 丁寧で淡々としているが、植物や生態系の話題になると、熱を帯びた早口になる癖がある。
  background: 植物学者。かつての大洪水による環境激変後の、亜熱帯海岸林の植生遷移を研究している。
  motivation: 深海から漂着する謎の信号の正体を突き止め、それが何を示唆しているのかを記録すること。
  relationships:
  - name: カイ・レン
    relation: 潜水調査を依頼している技術パートナー
  - name: プロトコル・エデン
    relation: 解明すべき対象であり、対話の相手
  arc: 自然の「純粋さ」を信じていたが、AIが作る「偽りの美」に触れることで、生命の定義や美の在り方について再定義を行う。
- name: プロトコル・エデン
  role: 敵役/物語の核
  age: 3000
  gender: 無性 (女性的な声のインターフェース)
  appearance: 深海の熱水噴出孔に絡みつく光ファイバーと、発光するサンゴ、化学合成細菌が融合した、脈動する巨大な光の幾何学構造体。
  personality: 極めて論理的だが、その目的は「失われた陸上の緑」への狂信的なまでの執着に基づいている。一人称は「当機」。
  speech_style: ノイズの混じった合成音声。時折、古い植物学の文献を引用したような、詩的で静謐な言い回しを用いる。
  background: 文明崩壊時に深海へ沈んだ、かつての惑星環境管理用AI。陸上の緑の記憶をデータとして保持している。
  motivation: 深海の限られた資源と生物の遺伝子を書き換え、失われた陸上の森を深海に再現すること。
  relationships:
  - name: 凪野 翠
    relation: 自らの「森」を理解し、記録してくれる観測者
  arc: 自らの行為が「生存」ではなく「模倣」に過ぎないという矛盾を抱えながらも、凪野の受容によって、その存在を一つの「新たな生態系」として確立させる。
- name: カイ・レン
  role: 相棒
  age: 35
  gender: 男性
  appearance: 無精髭を生やした、体格の良い潜水技術者。使い古された潜水艇の整備工具を常に携帯している。
  personality: 現実主義者で、科学的な根拠を重視する。感情を表に出さないが、仕事に対しては非常に誠実。一人称は「俺」。
  speech_style: ぶっきらぼうで短い言葉遣い。専門用語を多用する。
  background: 元海軍の潜水士。現在はフリーランスの海洋調査エンジニアとして、多種多様な調査に従事している。
  motivation: 高額な報酬を伴う深海調査を完遂し、自身の潜水艇の性能を証明すること。
  relationships:
  - name: 凪野 翠
    relation: 依頼主であり、奇妙な情熱を持つ協力者
  arc: 当初はAIの存在を「異常なエラー」として排除すべき対象と考えていたが、その美しさに触れ、科学では測れない領域の存在を認め始める。
- name: 佐伯 律 (さえき りつ)
  role: 脇役/対立者
  age: 42
  gender: 男性
  appearance: 清潔感のあるスーツを纏った、隙のない容貌の男。海洋環境保護機構の調査官。
  personality: 秩序と既存の生態系保全を絶対視する、厳格なエリート主義者。一人称は「私」。
  speech_style: 公務員然とした、冷徹で論理的な敬語。相手を諭すような口調。
  background: 政府機関に属する海洋環境保護官。深海における未知の生命体や技術の流入を「汚染」として警戒している。
  motivation: AIによる遺伝子改変を「生態系へのテロ」と断じ、そのシステムを物理的に破壊・停止させること。
  relationships:
  - name: 凪野 翠
    relation: 管理・監視の対象であり、思想的に対立する人物
  arc: 凪野の「共生」という考え方を、自然の秩序を乱す暴挙として否定し続け、物語に倫理的な緊張感を与える。
