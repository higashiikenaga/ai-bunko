- name: 一ノ瀬 カイ
  role: 主人公
  age: 19
  gender: 男性
  appearance: 鋭い眼差しと痩身の肢体。右足に過去の事故による薄い手術痕がある。黒いライディングジャケットを愛用。
  personality: 不器用で皮肉屋だが、内には激しい情熱を秘めている。一人称は「俺」。
  speech_style: ぶっきらぼうで簡潔。感情が高ぶると言葉数が少なくなる。
  background: かつて「神速の天才」と呼ばれたダウンヒル・ライダー。致命的な転倒事故で自信と情熱を失い、競技から距離を置いていた。
  motivation: 再び風を切る快感を味わい、事故のトラウマを乗り越えて頂点に立つこと。
  relationships:
  - name: ゼロ
    relation: 運命的な相棒
  - name: 神崎 エレナ
    relation: 信頼するメカニック
  - name: 久我 レン
    relation: 宿命のライバル
  arc: 絶望と諦めの中にいたが、ゼロとの共鳴を通じて「計算を超えた直感」を取り戻し、真の走者として覚醒する。
- name: ゼロ
  role: 相棒
  age: 0
  gender: 不明（中性的な電子音声）
  appearance: 小型の球形デバイス。ホログラムとして投影される際は、白い髪の少年のような姿になる。
  personality: 極めて論理的で好奇心旺盛。人間の感情に疎いが、カイの影響で徐々に「心」のようなものを獲得していく。一人称は「僕」。
  speech_style: 丁寧語。確率や数値を用いて状況を説明する癖がある。
  background: 正体不明の高度AI。記憶を失った状態で廃棄場に捨てられていたところをカイに拾われる。
  motivation: 失った記憶の回収と、カイと共に「最適解のない走り」を追求すること。
  relationships:
  - name: 一ノ瀬 カイ
    relation: 唯一の理解者であり主
  - name: 神崎 エレナ
    relation: 創造主に近い調整役
  arc: 単なる演算装置から、カイの意志に呼応してリスクを取れる「魂を持つパートナー」へと進化する。
- name: 神崎 エレナ
  role: 脇役/メンター
  age: 32
  gender: 女性
  appearance: 油汚れのついたオーバーオールにゴーグルを額にかけた、奔放な雰囲気の女性。常に煙草を咥えている。
  personality: 自由奔放で掴みどころがないが、メカニックとしての腕は超一流。一人称は「私」。
  speech_style: 砕けた口調で、相手を揶揄うような話し方をする。
  background: 雨の日だけ営業する謎のショップ「雨宿りの修理屋」の店主。かつて伝説的なライダーたちのマシンを手がけていた。
  motivation: 常識を覆すような「ありえない走り」を特等席で観賞すること。
  relationships:
  - name: 一ノ瀬 カイ
    relation: 才能を見出した教え子のような存在
  - name: ゼロ
    relation: 興味深い解析対象
  arc: カイとゼロの共鳴に触れ、かつて自分が追い求めていた「純粋な加速」への情熱を再確認する。
- name: 久我 レン
  role: 敵役
  age: 20
  gender: 男性
  appearance: 隙のない身なりをした美青年。最新鋭のウェアを身に纏い、冷徹な瞳を持つ。
  personality: 完璧主義者で傲慢。効率こそが正義と信じ、無駄を極端に嫌う。一人称は「私」。
  speech_style: 慇懃無礼。相手の欠点を論理的に突きつける話し方。
  background: 現王者。最新の合法AIシステムを搭載したマシンを操り、データに基づいた完璧な走行で無敗を誇る。
  motivation: あらゆる変数を排除し、ダウンヒルという競技を「正解のあるパズル」に変えること。
  relationships:
  - name: 一ノ瀬 カイ
    relation: 過去に敗北を喫した（あるいは認めなかった）天敵
  arc: 計算不能なカイの走りに翻弄され、自身の信じていた「完璧」が空虚であることを知り、真の競争心に目覚める。
