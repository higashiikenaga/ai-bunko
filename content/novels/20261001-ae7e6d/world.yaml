title: 閃光のドライブ・レゾナンス
genre: スポーツ青春
tone: 高速、熱狂的、エモーショナル
pov: 三人称
tense: 過去形
setting: 近未来、急峻な峠道と霧深い山岳地帯を持つ地方都市
premise: かつて天才と呼ばれたダウンヒル・ライダーのカイは、怪我による挫折から競技を離れていた。ある雨の日、彼は路地裏で記憶を失った「迷子の人工知能」を拾う。そのAIを修復すべく、カイは雨の日だけ開く謎のメカニックショップを訪れる。AIの超精密な演算と、カイの野生的な直感。二つの異なる「加速」が共鳴したとき、不可能を可能にする伝説の走りが幕を開ける。
themes:
- 挫折からの再起
- 技術と魂の共鳴
rules:
- AIの演算は完璧なラインを示すが、路面の微細な変化やライダーの恐怖心までは予測できない
- 雨の日だけ開く店は、特定の気象条件下の磁場変動によって物理的な入り口が出現する
plot_outline:
- '序盤: 競技を捨てたカイが、廃材置き場で機能不全に陥ったAIデバイス「ゼロ」を拾う。雨の夜、導かれるように路地裏の「雨宿りの修理屋」を見つけ、ゼロの修復を依頼する。'
- '中盤: ゼロの演算データをバイクに実装し、カイは再びレース界へ。AIの完璧な理論と、カイの身体感覚が衝突を繰り返しながら、未知のスピードへと到達していく。'
- '終盤: 最大の頂上を決める選手権。記録的な豪雨の中、ゼロの演算能力が限界に達する。カイはデータを超えた「感覚」を信じ、死線を越えるラインを刻む。'
- '結末: 勝利。ゼロは単なる道具ではなく、カイの魂の相棒となる。雨上がりの光の中、二人は次の高みを見据えて加速する。'
style_notes: 短文を畳みかけるテンポ重視の文体。アクションシーンでは擬音を廃し、視覚的な動きと速度の変化のみで躍動感を出すこと。キャラクターの掛け合いを多用して物語を動かし、各話の末尾には必ず「次を読まずにはいられない」強烈な引きを用意する。
