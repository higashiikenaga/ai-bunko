- name: 雨宮 雫
  role: 主人公
  age: 24
  gender: 女性
  appearance: 少し癖のあるセミロングの黒髪、落ち着いた色合いのカーディガンとエプロン。雨の日の湿り気を感じさせる、しっとりとした瞳。
  personality: 内向的で観察力が鋭い。静かな時間を好むが、困っている人を見捨てられない優しさを持つ。一人称は「私」。
  speech_style: 丁寧で穏やかな口調。相手の言葉を一度受け止めてから話す。
  background: 都会での忙しない生活に疲れ、逃げるようにこの街へやってきた。古書店『雨宿り堂』の店番として働きながら、自分の居場所を探している。
  motivation: 星図の謎を解き明かすことで、自分自身がなぜこの店に惹かれたのかを知ること。
  relationships:
  - name: 蓮見 晴
    relation: 店主であり、生活の導き手
  - name: 星野 奏
    relation: 星図の謎を共に追う友人
  arc: 周囲との関わりを避けていた孤独な観察者から、人々の物語に深く関わり、自らも誰かのための場所を作る表現者へと変化する。
- name: 蓮見 晴
  role: 脇役（メンター）
  age: 65
  gender: 男性
  appearance: 白髪混じりの短髪に眼鏡。常に古い本とコーヒーの香りを纏っている。使い込まれた木のカウンターが似合う佇まい。
  personality: 達観しており、ミステリアスな部分もあるが、根は非常に温厚。一人称は「私」。
  speech_style: ゆったりとしたリズムで、時折、比喩を用いた詩的な言い回しをする。
  background: 『雨宿り堂』の店主。街の歴史や人々の事情に詳しく、店がなぜ雨の日だけ開くのかという秘密を握っている。
  motivation: 店に訪れる人々が、雨とともに心の澱を洗い流せるよう、静かに見守ること。
  relationships:
  - name: 雨宮 雫
    relation: 店員であり、大切に見守る後継者候補
  arc: 隠し続けてきた過去の記憶や星図の真意を、雫に託していく過程で、自身の過去とも和解していく。
- name: 星野 奏
  role: 相棒
  age: 17
  gender: 女性
  appearance: 活発な印象のショートヘア。天文学の図鑑を常に持ち歩いている。制服の上に大きなパーカーを羽織っている。
  personality: 好奇心旺盛で真っ直ぐ。少し寂しがり屋な一面もある。一人称は「私」。
  speech_style: 明るくハキハキとしているが、星の話になると早口になる癖がある。
  background: 地元の高校に通う学生。亡くなった祖父が遺した古い天文学書に、何か大切なメッセージが隠されていると信じている。
  motivation: 星図に記された座標を辿り、祖父が残した『約束』の正体を見つけること。
  relationships:
  - name: 雨宮 雫
    relation: 秘密を共有する大切な友人
  arc: 祖父への執着や喪失感から、星図を通じて「受け継がれる記憶」の温かさに気づき、前を向いて歩き出す。
- name: 佐伯 航
  role: 脇役（物語の鍵）
  age: 32
  gender: 男性
  appearance: 整った身なりだが、どこか疲れを感じさせるビジネスマン風の男性。鋭いが、どこか悲しげな眼差し。
  personality: 合理的で現実主義。感情を表に出すのが苦手。一人称は「僕」。
  speech_style: 簡潔で無駄のない話し方。しかし、感情が昂ると言葉が詰まることがある。
  background: かつてこの街に住んでいたが、現在は都会で働く会社員。ある「後悔」を抱えたまま、雨の日に偶然『雨宿り堂』に迷い込む。
  motivation: かつて自分が置き去りにしてきた、大切な言葉や約束の欠片を探し戻すこと。
  relationships:
  - name: 雨宮 雫
    relation: 店で言葉の欠片を受け取る客
  arc: 効率や正解ばかりを求めていた生活の中で、不条理で非効率な「思い出」や「約束」の価値を再発見し、人間らしさを取り戻す。
