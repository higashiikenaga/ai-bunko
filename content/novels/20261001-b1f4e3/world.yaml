title: 雨宿り書店の星屑ノート
genre: 日常ほのぼの
tone: 軽やかで温かみのある、心地よい日常ミステリー
pov: 一人称（わたし）
tense: 現在形
setting: 地方の静かな街にある、雨の日だけ営業する不思議な古書店兼喫茶店
premise: 雨が降った日だけ看板を出す古書店『雨宿り堂』。そこで働くわたしは、訪れる客が抱える小さな悩みや、本に挟まった不思議な書き置きを紐解くのが日課です。ある日、一冊の古い天文学書から、誰かが書き加えた奇妙な『星図』が見つかりました。それは、かつての街の住人たちが交わした、ささやかで優しい約束の地図だったのかもしれません。
themes:
- すれ違いの解消
- 静かな時間への愛着
rules:
- 殺人は絶対に起きない
- 謎はすべて善意や勘違いに起因する
- 晴れた日は店を閉め、店主とわたしだけの読書時間とする
plot_outline:
- '序盤: 雨の日だけ開く店で働くわたしの日常と、古本に挟まっていた手書きの星図との出会い。'
- '中盤: 星図に記された座標を頼りに、街のあちこちに隠された『言葉の欠片』を探して店を訪れる人々との交流。'
- '終盤: 星図の主が誰だったのか、そしてなぜこの店が雨の日だけに開くのかという理由が、過去の淡い思い出と共に明らかになる。'
- '結末: 長年の誤解がほどけ、心地よい雨音が響く店内で、人々が新しい明日への小さな希望を見つける。'
style_notes: 一人称『わたし』による軽快で少しとぼけた語り。難しい言葉は避け、お茶の香りや雨の匂いを感じさせる柔らかな描写を重視する。謎解きは論理的な追い詰めではなく、相手の気持ちに寄り添うことで自然と正解に辿り着く形式とする。
