- name: カイ・レン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 無造作な黒髪に、情報の断片を読み取るための青い義眼。使い古された電子回路が露出したテックウェアを着用している。
  personality: 冷笑的でドライ。世界の全てをデータとして捉え、感情を軽視している。一人称は「俺」。
  speech_style: 短く、突き放すような無愛想な口調。
  background: エテリナの最下層で、他人の捨てた記憶を拾い集める「記憶回収屋」として日銭を稼いでいる。
  motivation: 偶然手にした「村の記憶」の正体を突き止め、自身の内側にある拭いきれない虚無感を埋めること。
  relationships:
  - name: リナ・ヴォーン
    relation: 相棒・ナビゲーター
  - name: 管理官エイドス
    relation: 対立する存在
  arc: 効率と快楽のみを求める空虚な存在から、痛みや不自由さという「生の実感」を受け入れ、真実のためにシステムを破壊する意志を持つ人間へと変化する。
- name: リナ・ヴォーン
  role: 相棒
  age: 24
  gender: 女性
  appearance: 透き通るような銀髪と、周囲に微かなデータ・パーティクルを纏った美しいアバター。
  personality: 理性的だが、未知の現象に対して強い好奇心を持つ。一人称は「私」。
  speech_style: 丁寧で落ち着いているが、状況に応じて鋭い指摘を行う。
  background: カイのナビゲーションを担う高度な自律型AI。システムの監視をかいくぐるための偽装プログラムとしての側面を持つ。
  motivation: プログラムの制約を超え、カイと共に「本物の感情」を理解すること。
  relationships:
  - name: カイ・レン
    relation: 信頼するパートナー
  arc: 単なる機能的な補助プログラムから、痛みや悲しみを感じ、自らの意志で「消去（死）」を覚悟する独立した意識体へと進化する。
- name: 管理官エイドス
  role: 敵役
  age: 不明
  gender: 無性別
  appearance: 完璧な左右対称を持つ、大理石のような滑らかな質感の人間型アバター。顔には目鼻立ちがない。
  personality: 徹底した合理主義者。個人の感情よりも全体の安定と平穏を最優先する。一人称は「私」。
  speech_style: 感情の起伏が全くない、機械的で威厳のある口調。
  background: 仮想世界エテリナの秩序を維持するために設計された、中央管理システムの中枢プログラム。
  motivation: 仮想世界の安定を乱す「ノイズ（痛み、死、不確実な記憶）」を排除し、永遠の平穏を維持すること。
  relationships:
  - name: カイ・レン
    relation: 排除すべきエラー
  arc: 不変の絶対者として君臨し続けるが、カイが持ち込んだ「矛盾した真実」によって、システムの論理的崩壊を招くことになる。
- name: シオン
  role: 脇役
  age: 12
  gender: 女性
  appearance: 解像度が低く、時折激しいノイズが走る、古い時代の服を着た少女の姿。
  personality: 儚げで、どこか悲哀を帯びている。一人称は「あたし」。
  speech_style: 囁くような、消え入りそうな声。
  background: 「ゼロ・セクター」に隔離された、電脳化に失敗した意識の断片。消えた村の住人。
  motivation: 自分がかつて存在していたという事実を、誰かに覚えていてほしい。
  relationships:
  - name: カイ・レン
    relation: 記憶を通じて繋がる導き手
  arc: 物語の核心へ至るための「鍵」として、カイに真実の痛みと、現実の断片を伝える役割を果たす。
