title: ゼロ・セクターの追憶回路
genre: サイバーパンク
tone: 仮想空間の電子的速度感と、現実世界の静寂な虚無感の対比
pov: 三人称
tense: 過去形
setting: 人類の意識が巨大サーバー都市「エテリナ」へ移行し、肉体を捨てた近未来。崩壊し静まり返った地上世界。
premise: 全価値が「記憶」に集約された世界で、人々は感情や経験を売買して快楽を得ていた。記憶回収屋の青年は、地図から抹消された「消えた村」のデータ断片を手にする。その禁忌領域へ潜った彼は、仮想世界が隠し続けてきた残酷で美しい「現実」の残滓に触れることになる。
themes:
- アイデンティティの不確かさ
- 記憶と存在の相関関係
rules:
- 記憶の売買は不可逆であり、売却した記憶は本人の意識から完全に消失する
- 仮想世界では『プロトコル層』によって物理法則が制御されており、層を越えるには特権権限が必要
- 意識のコアが破損すると『バグ』となり、自我を喪失したノイズのような存在へと変貌する
plot_outline:
- '序盤: 記憶を売る市場で、主人公が正体不明の「村の記憶」を買い取り、それがシステム上の禁忌領域であることに気づく。'
- '中盤: 禁忌領域「ゼロ・セクター」への潜行。そこで、仮想世界の住民が忘れたはずの『痛み』や『死』を伴う生々しい記憶の断片を回収していく。'
- '終盤: 消えた村の正体が、電脳化に失敗した者たちの意識が隔離された『アーカイブのゴミ箱』であることを突き止め、自身の記憶もまた合成されたものであることを知る。'
- '結末: 仮想世界の安定を維持するために記憶を消し続ける管理システムを内部から崩壊させ、全住民に『不自由で痛みを伴う現実の記憶』を還元して物語を閉じる。'
style_notes: '仮想空間の場面は短文を多用し、システムメッセージ（例：[ERROR: Sector 04 Unreachable]）を挿入して処理速度のようなテンポを演出する。対して現実世界や静止した場面は、比喩を重ねて時間軸が停滞しているかのような静謐な文体で描く。'
