- name: カイ・レン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 使い古された防塵コート、左目に青く光るサイバー義眼、無造作な黒髪。
  personality: 冷笑的で現実主義。自分を守るために他人を遠ざける。一人称は「オレ」。
  speech_style: 低くぶっきらぼうな口調。要件のみを短く伝える。
  background: 下層街でデータのゴミを漁るダイバー。幼少期の記憶が欠落している。
  motivation: 手に入れた地図の真実を突き止め、空白の記憶を埋めること。
  relationships:
