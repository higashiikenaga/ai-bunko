    relation: 協力者
  - name: セラス・ヴァレンタイン
    relation: 追跡者
  arc: 孤立した生存者から、都市の罪を背負ってシステムを破壊する決意を持つ者へ。
- name: リナ・ヴォルテクス
  role: 相棒
  age: 22
  gender: 女性
  appearance: ネオンピンクのショートヘア、多数の神経接続端子（プラグ）を備えた技術者用ウェア。
  personality: 好奇心旺盛で直情的。計算よりも直感を信じる。一人称は「私」。
  speech_style: 早口で、技術用語やスラングを混ぜた喋り方。
  background: 上層の企業研究所から「禁忌のデータ」を盗み出し、下層へ亡命した元技術者。
  motivation: 自身の研究がどのように悪用されたのかを突き止め、償うこと。
  relationships:
  - name: カイ・レン
    relation: 相棒
  arc: 知識を「利用」する立場から、真実を「守る」ための戦士へと成長する。
- name: セラス・ヴァレンタイン
  role: 敵役
  age: 38
  gender: 男性
  appearance: 隙のない純白の制服、一切の乱れがない銀髪、機械化された冷徹な眼差し。
  personality: 秩序と効率を神格化する冷酷な合理主義者。一人称は「私」。
  speech_style: 極めて丁寧だが、相手を道具として扱う高圧的な敬語。
  background: 都市管理組織「バベル・コンソーシアム」の治安維持局長。
  motivation: 都市のエネルギー供給システムを維持し、社会の崩壊を防ぐこと。
  relationships:
  - name: カイ・レン
    relation: 排除対象
  arc: システムの守護者として、予測不能な「エラー（カイ）」を徹底的に排除しようとする。
- name: エルナ
  role: 脇役
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌、虚ろな瞳、ノイズが混じるホログラムのような姿。
  personality: 静かで物悲しい。すべてを受け入れているような諦念。一人称は「わたし」。
  speech_style: 夢遊病者のような、抑揚のない囁き声。
  background: 「消えた村」で生贄として使い潰された、生体データの残滓。
  motivation: 自分の存在が、誰かの記憶の中で正しく刻まれること。
  relationships:
  - name: カイ・レン
    relation: 記憶の鍵
  arc: 実体のない亡霊から、カイが真実へ辿り着くための道標となる。
