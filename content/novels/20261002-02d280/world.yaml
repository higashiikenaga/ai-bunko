title: ネオン・ダスト：抹消された地平
genre: ディストピア
tone: ハードボイルド、退廃的、高速サイバーパンク
pov: 一人称（オレ）
tense: 現在形
setting: 階層都市「バベル・コア」。上層は純白の企業特区、下層は酸性雨とネオンが混ざり合うスラム街。
premise: オレは路地裏でデータのゴミを漁るダイバーだ。ある日、企業の管理ログから完全に抹消された「存在しないはずの村」へと導く秘密の地図を手に入れる。そこには都市の繁栄を維持するための残酷な生贄のシステムが隠されていた。絶望の雨に打たれながら、オレは禁忌の座標へと潜る。
themes:
- 記憶の抹消
- 支配への抵抗
rules:
- 全市民の記憶と位置情報は「コア・リンク」で一括管理され、登録外の場所は物理的に存在しても認識できない
- 下層住民は「ノイズ」と呼ばれ、企業による定期的なデータ・パージ（物理的排除）の対象となる
- ハッキングは脳内チップを介した神経同期で行い、過負荷（オーバークロック）は脳死を招く
plot_outline:
- '序盤: 廃棄ストレージを解析中、暗号化された「秘密の地図」を発見。それが都市から消されたはずの「旧世代の村」を指していることに気づく。'
- '中盤: 地図の断片を揃えるため、企業のスパイや裏社会の情報屋と衝突しながら、都市の最下層である廃棄区域へ潜入する。'
- '終盤: 「消えた村」に到達。そこが都市の全電力を供給するための人間電池の収容所であり、自分自身の失われた記憶がそこに繋がっていることを知る。'
- '結末: コア・リンクの基幹システムを内部から崩壊させ、都市の偽りの平和を終わらせる。降りしきる雨の中、オレは自由という名の孤独を選択する。'
style_notes: 短文を積み重ね、体言止めを多用してスピード感を出す。「電子滓（デジ・スクラップ）」や「神経同期（シンクロ）」などの造語を挿入。一人称「オレ」による突き放したハードボイルドな独白形式。ハッキングシーンはコマンド入力のような具体的かつ断片的な描写で構成する。
