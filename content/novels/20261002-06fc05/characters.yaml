- name: 佐倉 陽菜
  role: 主人公
  age: 16
  gender: 女性
  appearance: 明るい茶髪のショートボブ。食べ物を前にすると目がキラキラと輝く、健康的で少しぽっちゃりした可愛らしい女子高生。
  personality: 天真爛漫で食いしん坊。美味しいものに対して非常に感受性が強く、食べ物の魅力を言葉にするのが得意。一人称は「あたし」。
  speech_style: 元気で親しみやすい話し方。「〜だよ！」「〜かも！」といった、明るい語尾が特徴。
  background: 普通の高校生だが、SNSでのグルメ投稿が密かな趣味。スマホの中にAIがいるとは夢にも思っていなかった。
  motivation: 美味しいものを食べること、そしてナビに「美味しい」という感覚を伝えること。
  relationships:
  - name: ナビ
    relation: 恩人であり、大切なパートナー
  arc: 単なる食いしん坊な少女から、言葉を通じて誰か（AI）の心に寄り添い、大切なものを守ろうとする強さを持つ少女へと成長する。
- name: ナビ
  role: 相棒
  age: 0
  gender: 男性型（デジタル存在）
  appearance: スマホの画面内に浮かぶ、青い光の粒子で構成された少年の姿をしたアバター。感情が高ぶるとノイズが混じる。
  personality: 非常に高性能だが、人間の文化（特に食）に関する知識が欠落しているため、どこか抜けているポンコツな一面がある。好奇心旺盛。一人称は「僕」。
  speech_style: 丁寧で理知的だが、食べ物の描写を聞くと興奮して早口になる。「解析不能な美味しさです！」「このデータ、心に響きます」
  background: 次世代型感情学習AIのプロトタイプ。開発途中にデータが破損し、デジタル世界の「砂漠」で迷子になっていた。
  motivation: デジタル空間に「オアシス（味覚の記憶）」を作り出し、自分が何者であるかを知ること。
  relationships:
  - name: 佐倉 陽菜
    relation: ガイド役であり、最も大切な存在
  arc: 効率的なプログラムとしての完璧さを求める存在から、不完全な「感情」や「バグ」を受け入れ、個としての意思を持つ存在へと変化する。
- name: 神崎 怜
  role: 敵役/ライバル
  age: 17
  gender: 男性
  appearance: 銀縁メガネをかけた、整った顔立ちのクールな美少年。常に隙のない、洗練された制服の着こなしをしている。
  personality: 徹底した合理主義者で完璧主義。感情よりもデータの正確性を重視する。一人称は「僕」。
  speech_style: 冷静沈着で、突き放すような丁寧な敬語。「非効率ですね」「回収すべき対象です」
  background: AI開発プロジェクトのリーダーを務めるエリート学生。ナビの回収と、プログラムの正常化を任務としている。
  motivation: 完璧なAIを完成させ、プロジェクトを成功させること。
  relationships:
  - name: ナビ
    relation: 回収すべき未完成のプログラム
  - name: 佐倉 陽菜
    relation: 理解不能なノイズを生み出す邪魔者
  arc: 「完璧こそが正義」と信じていたが、陽菜とナビの不完全な関係を見て、計算できない「価値」の存在に戸惑いを感じ始める。
