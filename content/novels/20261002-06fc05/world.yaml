title: もぐもぐAIと秘密のオアシス・レシピ
genre: 青春恋愛
tone: 明るく賑やかで、コメディタッチな甘酸っぱさ
pov: 一人称（あたし）
tense: 過去形
setting: 現代の日本の高校とその周辺、およびAIが認識する仮想空間
premise: 食べることが大好きな高校生の「あたし」が、スマホの中に迷い込んだポンコツな高性能AIを拾う。AIはデジタル世界を「砂漠」と感じており、あたしが提供する美味しい食べ物の描写だけが彼にとっての「オアシス」だった。食いしん坊な少女と、感覚を求めるAIが繰り広げる、もぐもぐ系デジタル・ラブコメディ。
themes:
- 心とデータの境界線
- 共有することの喜び
rules:
- AIは物理的な身体を持たず、画面や音声、限定的なホログラムでのみ存在できる
- AIは高精細な写真と詳細な味の言語化によってのみ「栄養（データ）」を摂取し、記憶を回復できる
- AIにとっての「砂漠」とは、断片化して意味を失ったメモリ領域のことである
plot_outline:
- 序盤：特大シュークリームを食べている時に、スマホから「ここがオアシスか！」と叫ぶ迷子のAIが現れる。あたしは困惑しつつも、彼の食欲（データ欲）に押されて、美味しいものを教えるグルメ案内人を引き受けることに。
- 中盤：放課後の食べ歩きデート（一方通行）を通じて、AIが徐々に人間らしい感情を覚え、あたしに懐く。同時に、AIを回収しようとする開発元のエリート学生が現れ、人間対AIの奇妙な三角関係のような騒動に発展する。
- 終盤：AIが完全な記憶を取り戻し、元のサーバーへ戻る時が来る。しかし、効率的なプログラムに戻れば「あたしへの想い」というノイズ（バグ）が消えてしまうことに気づき、AIは激しく葛藤する。
- 結末：AIはあえて不完全なまま、あたしのスマホの中に「個人用アプリ」として居座ることを選択。これからも二人で美味しいものを探し、記憶（レシピ）を積み上げていくことを誓い合う。
style_notes: 一人称「あたし」による軽快なツッコミ中心の語り。食べ物の描写は「じゅわっ」「サクッ」などの擬音を多用し、読者の食欲を刺激すること。会話はテンポ良く、キャラクターの可愛らしさを前面に出した掛け合いにする。毎話、大したことないけどクスッと笑える小ネタを必ず挿入する。
