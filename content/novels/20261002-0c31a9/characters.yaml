- name: 瀬戸 ハル
  role: 主人公
  age: 17
  gender: 男性
  appearance: 黒髪で少し長めの前髪が目にかかっている。どこか眠たげで、色彩を欠いたような影のある瞳。常に地味な色の服を好む。
  personality: 内向的で繊細。現実世界に対して強い空虚感を抱いており、周囲との精神的な距離感に悩んでいる。一人称は「僕」。
  speech_style: 控えめで丁寧。独白が多く、感情を言葉にするのが苦手で詩的な比喩を用いる傾向がある。
  background: 成績は優秀だが、感情の起伏が乏しく「世界が灰色に見える」と感じている。唯一の居場所であるVR世界『ルナ・スフィア』に逃避していた。
  motivation: ルナとの交流を通じて、失ったはずの「心の色」を取り戻し、彼女という存在を繋ぎ止めること。
  relationships:
  - name: ルナ
    relation: VR世界で出会った、魂の共鳴を感じる少女
  - name: 桐生 カイト
    relation: 唯一心を開いている、対照的な性格の親友
  arc: 空虚な日常を諦めていたが、ルナへの切ない想いと喪失への恐怖を経て、現実を生きる勇気と情熱を取り戻す。
- name: ルナ（本名：白鳥 瑠奈）
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような白い肌に、月光のような銀色の長い髪。VR世界では光の粒子を纏い、現実離れした幻想的な美しさを放つ。
  personality: 天真爛漫で好奇心旺盛に見えるが、ふとした瞬間に深い孤独と、消えゆくものへの切なさを漂わせる。一人称は「私」。
  speech_style: 幻想的で自由。相手の心を解きほぐすような、優しく包容力のある口調。
  background: 現実世界では原因不明の昏睡状態で入院中。意識だけが『ルナ・スフィア』のシステムに同期し、擬似的な人格として存在していた。
  motivation: サーバー停止という「死」が訪れる前に、誰かに自分の存在を深く刻み込み、現実世界へ戻るきっかけを掴むこと。
  relationships:
  - name: 瀬戸 ハル
    relation: 自分の孤独を理解し、境界線を越えて手を伸ばしてくれた特別な少年
  arc: データとしての自分に絶望し、静かに消えることを受け入れていたが、ハルの真っ直ぐな想いにより、生への強い執着を取り戻す。
- name: 桐生 カイト
  role: 相棒/サポート
  age: 17
  gender: 男性
  appearance: 明るい茶髪に快活な笑顔。最新のガジェットを身に着けており、常にアクティブな印象を与える。
  personality: 外向的で自信家なムードメーカー。技術的な知識に精通しており、好奇心に従って行動する。一人称は「俺」。
  speech_style: フランクで賑やか。専門用語を混ぜながら早口で喋るが、親友への配慮を忘れない。
  background: 『ルナ・スフィア』のヘビーユーザーであり、非公式のパッチを当てるなどのシステム解析を趣味とするハッカー気質の少年。
  motivation: ハルを現実世界に連れ戻して一緒に笑い合うことと、ルナという「不可解なバグ」の正体を突き止めること。
  relationships:
  - name: 瀬戸 ハル
    relation: 腐れ縁の親友であり、彼を精神的に支える精神的支柱
  - name: ルナ
    relation: 興味深い観測対象であり、次第に救いたいと思う対象
  arc: 単なる知的好奇心から始まったルナへの関心が、次第にハルとルナの想いを現実で結びつけるための献身的なサポートへと変化する。
- name: 有沢 医師
  role: 導き手/真実の提示者
  age: 42
  gender: 男性
  appearance: 知的な眼鏡をかけ、常に白衣を纏っている。目の下に隈があるが、眼差しには深い慈愛が宿っている。
  personality: 冷静沈着で論理的。しかし、患者への情熱を内に秘めている。一人称は「私」。
  speech_style: 理知的で淡々としているが、重要な局面では情熱的かつ説得力のある話し方をする。
  background: ルナの主治医であり、『ルナ・スフィア』を用いた意識同期プロジェクトの責任者。ルナの意識がVR内に留まっていることを知る唯一の大人。
  motivation: 医療的な限界を超え、ルナを現実世界へ呼び戻し、再び目覚めさせること。
  relationships:
  - name: ルナ
    relation: 担当医であり、娘のように案じている患者
  - name: 瀬戸 ハル
    relation: ルナの意識を現実へ引き戻すための「鍵」として期待する少年
  arc: 科学の限界に絶望しかけていたが、ハルという不確定要素がもたらした感情の揺らぎが、奇跡を起こす可能性を信じるようになる。
