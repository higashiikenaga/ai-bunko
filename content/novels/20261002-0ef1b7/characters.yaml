- name: 佐伯 蓮
  role: 主人公
  age: 24
  gender: 女性
  appearance: 疲れ気味の淡い表情。都会的なシンプルな服装だが、次第にゆったりとした古着やエプロンを身につけるようになる。
  personality: 内向的で責任感が強く、自分を追い込みやすい。一人称は「私」。
  speech_style: 丁寧だが距離感のある話し方。心を開くにつれ、独り言や素直な感情が漏れるようになる。
  background: 東京の広告代理店で働いていたが、激務による心身の疲弊から休職し、唯一の親族である祖父の元へ逃げるように戻ってきた。
  motivation: 静かな環境で心を癒やし、自分が本当に大切にしたいものを見つけ出すこと。
  relationships:
  - name: 佐伯 宗一郎
    relation: 祖父
  - name: メイ
    relation: 友人
  arc: 孤独と喪失感に苛まれていたが、祖父との共同生活と料理を通じて、不完全な自分を受け入れ、この町で生きる勇気を得る。
- name: 佐伯 宗一郎
  role: 相棒/導き手
  age: 72
  gender: 男性
  appearance: 白髪に度の強い眼鏡。インクで汚れた指先と、使い込まれた革のエプロンがトレードマーク。
  personality: 不器用で口数が少なく、ぶっきらぼう。しかし根は深く優しい。一人称は「儂」。
  speech_style: 短文で突き放すような言い方だが、語尾にわずかな温かみが宿る。
  background: 古本屋「潮騒堂」の店主。かつては活版印刷の職人でもあった。亡き息子夫婦（蓮の両親）への後悔を胸に抱えている。
  motivation: 蓮に心地よい居場所を提供し、彼女が再び前を向いて歩き出せるよう静かに見守ること。
  relationships:
  - name: 佐伯 蓮
    relation: 孫娘
  - name: メイ
    relation: 近所の世話焼きな若者
  arc: 孫娘との交流を通じて、自身の過去のわだかまりを解消し、家族の記憶を次世代へ繋ぐ喜びを再確認する。
- name: メイ
  role: 脇役/ムードメーカー
  age: 21
  gender: 女性
  appearance: 快活な笑顔。蒸気機関の整備士で、つなぎを着こなし、頬にいつもオイルの汚れがついている。
  personality: 天真爛漫で好奇心旺盛。町中の誰とでも仲良くなれる社交性の塊。一人称は「私」。
  speech_style: ハキハキとした快活な口調。相手の懐に飛び込むのが上手い。
  background: 港町の蒸気機関メンテナンス事務所に勤務。幼い頃から宗一郎に懐いており、潮騒堂に頻繁に遊びに来る。
  motivation: 蓮を町に馴染ませ、彼女が笑顔を取り戻すお手伝いをすること。
  relationships:
  - name: 佐伯 蓮
    relation: 友人（自称・親友）
  - name: 佐伯 宗一郎
    relation: 親戚のような付き合いの店主
  arc: 蓮という外部の視点が入ることで、自分が愛するこの町の日常がどれほど贅沢で尊いものか、改めて気づかされる。
