- name: エリアナ・フォン・ローゼンタール
  role: 主人公
  age: 17
  gender: 女性
  appearance: 透き通るような銀髪と、宝石のように輝くサファイア色の瞳。常に完璧な姿勢で、最高級のシルクドレスを纏っている。
  personality: 社交界では完璧な淑女を演じているが、内面は知的好奇心が強く、正義感に溢れている。一人称は「私」。
  speech_style: 優雅で丁寧な貴族言葉。感情が高ぶるとわずかに声が震える。
  background: 帝国の有力貴族の令嬢。周囲の期待に応えるため、自身の感情を押し殺して「理想の令嬢」を演じ続けてきた。
  motivation: 鏡で見てしまった帝国の嘘を暴き、偽りのない真実の世界を手にすること。
  relationships:
  - name: ジュリアン
    relation: 共謀者であり、運命の恋人
  - name: クララ
    relation: 唯一本音を話せる親友
  arc: 受動的な「人形」のような存在から、自らの意志で運命を切り拓く「革命の主役」へと成長する。
- name: ジュリアン・ド・ヴァロワ
  role: 主人公/相棒
  age: 19
  gender: 男性
  appearance: 漆黒の髪に、鋭いがどこか哀しげな灰色の瞳。没落したため身なりは質素だが、立ち居振る舞いにはかつての貴族の品格が漂う。
  personality: 冷静沈着で皮肉屋。しかし、一度信じた相手には深い献身を見せる。一人称は「僕」。
  speech_style: 簡潔で淡々としているが、エリアナに対してだけは時折、年相応の柔らかさを見せる。
  background: かつては名門貴族の嫡男だったが、皇帝の陰謀により家名を剥奪され、禁域の鏡の守護者として孤独に生きてきた。
  motivation: 家族の汚名をそそぎ、帝国を支配する偽りの光を打ち砕くこと。
  relationships:
  - name: エリアナ
    relation: 守るべき対象であり、心を通わせる女性
  - name: ヴァレリウス
    relation: 家族を破滅させた仇敵
  arc: 復讐心のみで生きていた孤独な青年が、エリアナとの出会いを通じて、誰かのために未来を創る喜びを知る。
- name: ヴァレリウス・グランツ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 整った容姿だが、眼光が鋭く、常に冷徹な笑みを浮かべている。黒と金の豪華な軍服を愛用している。
  personality: 極めて合理的かつ冷酷。秩序を維持するためには少数の犠牲は厭わない、支配者としての傲慢さを持つ。一人称は「私」。
  speech_style: 慇懃無礼。相手を敬っているようでいて、常に心理的な優位に立とうとする話し方。
  background: 現皇帝の側近であり、帝国の「不夜」という偽りの秩序を維持する黒幕。鏡の力を利用して権力を掌握してきた。
  motivation: 帝国の体制を永続させ、自らの権力を盤石なものにすること。
  relationships:
  - name: エリアナ
    relation: 体制を脅かす不確定要素
  - name: ジュリアン
    relation: 排除すべき過去の残滓
  arc: 完璧な支配者として君臨していたが、自らが築き上げた嘘が鏡によって暴かれ、権威を失墜させる。
- name: クララ
  role: 脇役
  age: 17
  gender: 女性
  appearance: 明るい栗色の髪を後ろで束ねた、活発な印象の少女。エリアナの侍女として働く。
  personality: 明るく快活で、観察力が鋭い。エリアナの精神的な支えとなる。一人称は「私」。
  speech_style: 親しみやすく、少し砕けた口調。エリアナをリラックスさせるための言葉選びをする。
  background: エリアナとは幼少期からの付き合いであり、彼女の「仮面」の下にある本当の姿を知る数少ない人物。
  motivation: エリアナが自分らしく、幸せに笑える場所を見つけること。
  relationships:
  - name: エリアナ
    relation: 主君であり、かけがえのない親友
  arc: 単なる侍女という立場を超え、エリアナの計画を支えるための情報収集や手助けを行う協力者となる。
