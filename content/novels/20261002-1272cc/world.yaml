title: 常夜の街と白銀の鏡舞曲
genre: 青春恋愛
tone: 華麗で装飾的、耽美的な歴史ロマン
pov: 三人称
tense: 過去形
setting: 仮想の18世紀欧州風帝国、不夜城と称される首都「ルミナリス」。
premise: 永遠に陽が昇らぬ魔法の灯火に照らされた眠らない街ルミナリス。社交界の華として完璧な仮面を被る令嬢エリアナは、禁域に安置された「真実を映す鏡」に触れ、帝国の残酷な秘密を視てしまう。そこで出会ったのは、名誉を剥奪された没落貴族の青年ジュリアン。絹のドレスが擦れる音と薔薇の香りに包まれた豪華絢爛な舞踏会の裏側で、二人は運命を賭けた危険な恋に落ちていく。
themes:
- 偽りと真実
- 運命への抗い
rules:
- 首都ルミナリスは魔法の灯火により昼夜の区別がなく、貴族たちは終わりのない舞踏会と社交に耽溺している。
- 『真実の鏡』は、対峙した者の外見ではなく、心に秘めた欲望や罪を映像として映し出す禁忌の遺物である。
- 身分制度が絶対であり、衣装の豪華さと装飾の緻密さがそのまま権力の象徴として機能している。
plot_outline:
- '序盤: エリアナは宮廷の舞踏会で完璧な淑女を演じているが、好奇心から迷い込んだ禁域で『真実の鏡』に触れ、現皇帝が成り上がった血塗られた過去を視てしまう。同時に、鏡の守護を任されていた孤独な青年ジュリアンと出会う。'
- '中盤: ジュリアンはかつて鏡によって冤罪をかけられ没落した家系の生き残りだった。二人は鏡の力を利用して帝国の嘘を暴くため、密かに共謀する。豪華な夜会や仮面舞踏会を舞台に、視線と指先の触れ合いだけで愛を育む、危うくも甘美な時間が流れる。'
- '終盤: 皇帝の側近による陰謀が激化し、エリアナは政略結婚という檻に閉じ込められそうになる。彼女とジュリアンは、帝国最大の祭典である『白銀の舞踏会』にて、全貴族の前で鏡を起動させ、真実を白日の下にさらすという最大の賭けに出る。'
- '結末: 鏡が映し出した真実により体制は崩壊し、街に初めて本物の「夜」と「夜明け」が訪れる。身分という枷から解放された二人は、静寂に包まれた街で、誰にも邪魔されない真実の口づけを交わす。'
style_notes: 最高級のシルクや繊細なアランソンレース、ダイヤモンドの煌めきなど、衣装と調度品に徹底的にこだわり、色彩豊かに描写すること。比喩表現を多用し、溜息が出るほど優雅で装飾的な文体を維持し、情熱的な恋心と冷徹な宮廷陰謀の対比を鮮明に描く。
