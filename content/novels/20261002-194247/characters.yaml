- name: エリス・ヴァルディス
  role: 主人公
  age: 24
  gender: 女性
  appearance: 青白い肌に、重力波の干渉を防ぐ銀縁の特製ゴーグルを着用。地下図書館の深い紺色の記録官ローブを纏っている。
  personality: 内向的で執拗な探究心を持つ。静寂を好み、失われたデータにのみ心を開く。一人称は「私」。
  speech_style: 丁寧だが、専門用語が多く、論理的な構成で話す傾向がある。
  background: 強重力圏の居住区で生まれ育った記録官。幼少期に親を時間遅延による「実質的な喪失（相手だけが超高速で年老いた）」で失い、不変の記録に固執するようになった。
  motivation: 断片的な信号の正体を突き止め、宇宙から消えゆく「記憶」の完全な復元をすること。
  relationships:
  - name: ゼノ
    relation: 導き手であり、唯一の理解者
  - name: ルト
    relation: 異なる時間軸から届いた切実な呼びかけの主
  - name: 総監アルカディア
    relation: 管理社会の象徴であり、対立する価値観を持つ上司
  arc: 記録を保存するだけの「傍観者」から、自らが情報の破片となって宇宙を書き換える「当事者」へと変化する。
- name: ゼノ
  role: 相棒/ガイド
  age: 不明（外見は40代）
  gender: 男性
  appearance: 左右で色の異なる瞳を持つ。冷却水の雨を弾く特殊な撥水コートを着用し、常に古い懐中時計をいじっている。
  personality: 飄々としており、運命論的な諦観を持つ。皮肉屋だが情に厚い。一人称は「僕」。
  speech_style: 比喩表現が多く、核心をはぐらかすような言い回しを好む。
  background: 時間軸の交差点にある店「降水譜」の店主。かつては物理学者だったが、ある実験で時間軸から切り離され、「どこにも属さない観測者」となった。
  motivation: 宇宙が記憶を消去する前に、誰か一人にでも「真実の記述」を託すこと。
  relationships:
  - name: エリス・ヴァルディス
    relation: 才能ある後継者として期待し、密かに導いている
  arc: 絶望的な物理法則に身を任せていたが、エリスの意志に触れ、最後にもう一度だけ未来に賭ける。
- name: ルト
  role: 鍵を握る人物
  age: '19'
  gender: 中性
  appearance: 半透明に近い肌に、発光する回路のようなタトゥーが全身に走っている。実体を持たず、雨の期間だけホログラムのように現れる。
  personality: 焦燥感に駆られており、ひたむき。純粋で、エリスに対して強い信頼を寄せる。一人称は「俺」。
  speech_style: 断片的で、感情が高ぶると言葉がノイズのように混ざる。
  background: エリスより数百年先の未来、あるいは並行する時間軸で、既に「情報の特異点」に飲み込まれつつある文明の生き残り。
  motivation: 自らの文明が消滅した事実をエリスに伝え、特異点の発生を阻止するためのコードを託すこと。
  relationships:
  - name: エリス・ヴァルディス
    relation: 時空を超えて繋がった唯一の希望
  arc: 消えゆく運命を受け入れながらも、エリスを通じて「記憶」が継承されることで精神的な救済を得る。
- name: 総監アルカディア
  role: 敵役/障壁
  age: 110
  gender: 女性
  appearance: 厳格な立ち姿。金糸の刺繍が入った白い軍服を着用し、右目は重力演算用の機械義眼に置き換わっている。
  personality: 極めて合理的で冷徹。全体の生存のためには個の記憶や過去の抹消も厭わない。一人称は「私」。
  speech_style: 断定的で威圧的な口調。効率と秩序を重視した話し方。
  background: 居住区の最高責任者。ブラックホールの回転による記憶消去を「宇宙の最適化」と捉え、それを加速させることで現在の居住区の安定を図ろうとしている。
  motivation: ノイズ（過去の記憶）を完全に排除し、純粋な現在のみで構成される完璧な秩序社会を築くこと。
  relationships:
  - name: エリス・ヴァルディス
    relation: 秩序を乱す危険な好奇心を持つ部下
  arc: 不変の秩序こそが正義だと信じていたが、エリスがもたらした「混沌とした記憶」の美しさに触れ、一瞬の迷いを抱く。
