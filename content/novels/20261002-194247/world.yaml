title: 事象の地平線の降水譜
genre: SF
tone: 荘厳かつ理性的、静謐なハードSF
pov: 三人称
tense: 過去形
setting: 回転するブラックホール（カー・ブラックホール）の強重力圏に形成された、極端な時間遅延を伴う居住区および惑星状小天体
premise: 重力による時間の乖離が生活のすべてを規定する時代。記録官のエリスは、極限の重力下で情報を保存する「地下図書館」の管理を通じて、失われた文明の断片を追っていた。彼女が辿り着いたのは、冷却水の凝縮による「雨」が降る時だけ、異なる時間軸の観測者とのデータ交換を可能にする、特殊な通信拠点としての店だった。そこでの出会いが、ブラックホールの回転が宇宙の記憶を物理的に書き換えているという、物理法則の根幹に関わる異変を暴いていく。
themes:
- 時間の相対性と情報の保存
- 宇宙のエントロピーと秩序
rules:
- 重力による時間の遅延は、回転するブラックホールの時空の歪みに従い厳密に計算される
- 「雨」は居住区の熱交換システムが放出する凝縮水であり、特定の通信環境を作り出す物理現象である
- 情報は光速を超えて伝達できないため、通信は常に時間遅延の計算に基づく
plot_outline:
- '序盤: 記録官エリスが、重力波のゆらぎに紛れた不規則な信号を解析し、時間の流れが極端に異なる領域からの「遺言」の存在に気づく。'
- '中盤: 信号の源を求めて、極低温の物質媒体を保管する「地下図書館」へ。そこで彼女は、冷却水の雨が降る一瞬だけ、異なる時間軸の住人が物理的な記録を交換できる、特殊な停留所としての店を知る。'
- '終盤: ブラックホールの角運動量が、周囲の時空に蓄積された情報のエントロピーを強制的に整理（消去）している事実が判明。宇宙の記憶が消失する「情報の特異点」が迫る。'
- '結末: エリスは自らの存在を時間的なノイズとしてブラックホールへ投入し、情報の再構築を試みる。事象の地平線の境界で、宇宙が新たな法則を記述する瞬間の、光り輝く情報の奔流を目撃する。'
style_notes: 事象の地平線、フレーム・ドラッギング、角運動量といった物理学的概念を、視覚的な美しさと共に描写する。読者が宇宙のスケール感に圧倒されるよう、微視的な計算と巨視的な光景を対比させる。専門用語には必ず、その現象がもたらす視覚的・物理的変化の補足を加える。
