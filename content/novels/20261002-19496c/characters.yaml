- name: カイ・サカキ
  role: 主人公
  age: 28
  gender: 男性
  appearance: 無表情で整った顔立ち。常に機能性を重視した灰色の作業着を着用。潮風の影響か、少し手入れの行き届いていない髪をしている。
  personality: 冷静沈着で現実主義。感情を「ノイズ」として嫌う傾向がある。一人称は「僕」。
  speech_style: 簡潔で事務的。必要最低限の情報を伝えることを好む。
  background: 記憶の整理士。幼少期に大切な人を亡くした際、その痛みを避けるために自身の感情の多くをクラウドへ預けてしまい、それ以来、心が平坦な状態にある。
  motivation: 拾ったAIの「命令」を業務として完結させること。しかし次第に、AIの記憶を辿ることで自身の失ったものに気づいていく。
  relationships:
  - name: エリス
    relation: 拾ったAI、旅の同行者
  arc: 効率と平穏のみを求める機械的な生き方から、痛みや切なさも含めた「人間らしい実感」を肯定する生き方へと変化する。
- name: エリス
  role: 相棒
  age: 30
  gender: 性別なし（女性的な声質）
  appearance: 旧式のホログラム投影型AI。ノイズが混じる淡い光の少女の姿。時折、データの欠損により輪郭が揺らぐ。
  personality: 純粋で好奇心が強く、世界のすべてを肯定的に捉えようとする。一人称は「私」。
  speech_style: どこか懐かしさを感じさせる、丁寧で少し古風な話し方。
  background: かつてある老人の傍らにいた対話型AI。所有者が深い喪失感を避けるために記憶ごと封印したため、長い間廃棄場で眠っていた。
  motivation: 「約束の丘」へ行き、主人の顔を見ること。
  relationships:
  - name: カイ・サカキ
    relation: 拾い主、相棒
  - name: 佐伯
    relation: かつての所有者
  arc: 単なる「命令に従うプログラム」から、記憶と感情の重みを知り、自らの消滅を受け入れる意志を持った存在へと成長する。
- name: 佐伯 宗一郎
  role: 脇役/鍵となる人物
  age: 75
  gender: 男性
  appearance: 深く刻まれた皺と、どこか遠くを見つめるような虚ろな瞳。潮風に晒された古い外套を纏っている。
  personality: 穏やかだが、現実に対してどこか諦観している。一人称は「私」。
  speech_style: ゆっくりとした、間を大切にする落ち着いた話し方。
  background: かつて妻を亡くし、その悲しみに耐えかねて、AIとの思い出も含めた感情のバックアップをクラウドに封印し、忘却の中で生きてきた老人。
  motivation: 痛みを感じない、静かな余生を送ること。
  relationships:
  - name: エリス
    relation: かつてのパートナー、愛した記憶の象徴
  - name: カイ・サカキ
    relation: 失ったものを取り戻させた青年
  arc: 忘却による安寧を捨て、愛した記憶に伴う「耐えがたい痛み」を、生きる証として再び受け入れる。
