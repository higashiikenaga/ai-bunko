- name: エレノア・フォン・アスター
  role: 主人公
  age: 19
  gender: 女性
  appearance: 夜の闇を思わせる艶やかな黒髪と、意志の強さを感じさせる琥珀色の瞳。没落したとはいえ、立ち居振る舞いにはかつての気品が漂う。
  personality: 聡明で冷静沈着。困難な状況でも決して折れない芯の強さを持つ。一人称は「私」。
  speech_style: 宮廷に相応しい優雅な言葉遣いだが、真実を追う際は鋭く的確な言い回しを用いる。
  background: かつて帝国で名を馳せたアスター家の令嬢。父の失脚により没落し、家門の名誉を挽回するために潜入捜査を兼ねて宮廷へと戻る。
  motivation: 没落した家門の再興と、帝国の裏に潜む真実の解明。
  relationships:
  - name: ジュリアン・ド・ルミナール
    relation: 協力者であり、許されぬ恋人
  - name: ヴァレリウス公爵
    relation: 宿敵
  arc: 家門への執着という個人的な目的から、愛する人と国を守るという崇高な使命へと成長していく。
- name: ジュリアン・ド・ルミナール
  role: 相棒/ヒーロー
  age: 23
  gender: 男性
  appearance: 冷徹な美貌を持つ銀髪の青年。感情を読み取らせない仮面のような表情が特徴。帝国の象徴として完璧な装い。
  personality: 極めて合理的で冷徹な判断を下すが、内面には深い孤独を抱えている。一人称は「私」。
  speech_style: 簡潔で威厳があり、有無を言わせぬ重みがある。
  background: 聖ルミナール帝国の次期皇太子。表向きは華やかな宮廷生活を送る皇太子だが、裏では「地下図書館」を拠点に帝国の秩序を守る諜報活動を行っている。
  motivation: 帝国の安定維持と、自身が背負う宿命からの解放。
  relationships:
  - name: エレノア・フォン・アスター
    relation: 唯一、素顔を見せられる信頼するパートナー
  arc: 仮面の下に隠していた人間らしい感情と、エレノアへの愛を認め、運命に抗う強さを得る。
- name: ヴァレリウス公爵
  role: 敵役
  age: 48
  gender: 男性
  appearance: 威圧感のある大柄な体躯。常に不敵な笑みを浮かべ、豪華な装飾を身に纏っている。
  personality: 野心的で冷酷非道。目的のためには手段を選ばず、周囲を巧妙に操る策士。一人称は「余」。
  speech_style: 尊大で傲慢。相手を見下すような、余裕を感じさせる話し方。
  background: 帝国最古の血筋を持つ有力貴族。現体制を打破し、自らが絶対的な権力者となるための陰謀を画策している。
  motivation: 帝国転覆と、自らの血統による絶対支配の確立。
  relationships:
  - name: エレノア・フォン・アスター
    relation: 利用すべき駒
  - name: ジュリアン・ド・ルミナール
    relation: 排除すべき最大の障害
  arc: 盤石と思われた権力への野望が、エレノアとジュリアンの絆によって崩壊していく。
- name: クララ
  role: 脇役/協力者
  age: 18
  gender: 女性
  appearance: 小柄で機敏な動き。常に控えめなメイド服を着ているが、瞳には好奇心が溢れている。
  personality: 明るく献身的。持ち前の観察眼で周囲の変化にいち早く気づく。一人称は「私」。
  speech_style: 丁寧で愛嬌のある話し方だが、情報交換の際は非常に迅速。
  background: エレノアに仕える侍女。実は地下図書館の連絡員の一人であり、宮廷内の噂話を集める情報屋としての顔も持つ。
  motivation: エレノアの安全を守ることと、地下図書館の秘密を守ること。
  relationships:
  - name: エレノア・フォン・アスター
    relation: 主であり、心から信頼する友人
  arc: 単なる使用人から、エレノアを支える影の諜報員として自覚を持つようになる。
