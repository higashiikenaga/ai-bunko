title: 紺青の迷宮と黄金の遺言
genre: 歴史・時代小説
tone: 華麗にして装飾的な宮廷ロマン
pov: 三人称
tense: 過去形
setting: 聖ルミナール帝国、アスター家旧領および宮廷
premise: 名誉を回復し、皇太子ジュリアンとの絆を深めたエレノア。しかし、亡き父が遺した一通の「遺言」と「秘密の地図」が、帝国の根源に潜むさらなる禁忌へと彼女を誘う。豪華絢爛な舞踏会の社交戦と、歴史の闇に消えた迷宮の謎。愛と陰謀が交錯する、運命の第二幕が幕を開ける。
themes:
- 血統と宿命
- 真実への渇望
rules:
- アスター家は帝国の禁忌を封印する守護者の血を引く
- 琥珀の鍵は特定の封印を解く唯一の手段である
- 宮廷の作法と衣装は階級と権威を象徴する絶対的な規範である
plot_outline:
- 序盤：アスター家の名誉回復後、エレノアのもとに父の隠し遺言が届く。そこには帝国全土の禁忌が記された『紺青の迷宮』への秘密の地図が添えられていた。
- 中盤：ジュリアンと共に旧領へ向かったエレノアは、地図の導きにより、かつての守護者が遺した試練に直面する。同時に、宮廷では新たな権力闘争が激化し、彼女たちの帰還を阻もうとする陰謀が渦巻く。
- 終盤：帝都で開催される仮面舞踏会にて、迷宮の鍵を狙う敵対勢力との最終的な社交戦が繰り広げられる。エレノアは豪華なドレスに身を包み、扇の陰で情報を操りながら、帝国の存亡を賭けた最後の賭けに出る。
- 結末：迷宮の奥底で父の真意と帝国の真の歴史を解き明かしたエレノアは、過去の呪縛を完全に断ち切る。ジュリアンとの永遠の愛を誓い、二人は光に満ちた新時代の統治者として君臨する。
style_notes: 絹やレース、宝石の輝きなど、視覚的・触覚的な装飾表現を多用すること。宮廷の緊張感を、優雅な語り口と対比させて描く。舞踏会の喧騒と密やかな囁きを情熱的に描写し、耽美的な世界観を構築すること。
