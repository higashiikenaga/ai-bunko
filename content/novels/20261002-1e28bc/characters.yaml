- name: エライアス・ヴァン・クロムウェル
  role: 主人公
  age: 34
  gender: 男性
  appearance: 鋭い眼光を持つ、銀髪の短髪。帝国軍の制服を常に隙なく着こなしているが、どこか疲弊した表情を見せる。
  personality: 理性的で規律を重んじるが、内面には強い正義感を秘めている。一人称は「私」。
  speech_style: 冷静沈着で簡潔な軍人口調。「～だ」「～である」
  background: 銀河帝国艦隊の中佐。かつて「静寂の村」の周辺で救助活動に従事していた過去があり、未解決事件の真相を心の底で追い続けている。
  motivation: 紛争の拡大を防ぎつつ、失われた村の住人たちの真実を明らかにすること。
  relationships:
  - name: セレス・ヴァレンタイン
    relation: 対立するライバルであり、かつての戦友
  - name: AIユニット：ノア
    relation: 任務を共にする補佐官
  arc: 秩序を守るための「隠蔽」か、混沌を招くとしても「真実」を世に出すかという葛藤を経て、個人の信念に基づいた決断を下す強さを得る。
- name: セレス・ヴァレンタイン
  role: 敵役（ライバル）
  age: 32
  gender: 女性
  appearance: 機能的な武装商船連合のパイロットスーツを纏う。燃えるような赤髪のポニーテールと、意志の強そうな瞳が特徴。
  personality: 奔放で現実主義。利権を重視するが、仲間に対する情は極めて厚い。一人称は「あたし」。
  speech_style: 挑戦的で歯切れの良い口調。「～じゃない？」「～ってわけ」
  background: 武装商船連合の精鋭傭兵。帝国による中央集権的な支配を嫌い、資源の自由な流通と独立を掲げる連合の立場を取る。
  motivation: 「氷の城」から得られる技術遺産を連合に持ち帰り、抑圧された辺境宙域の自立を支援すること。
  relationships:
  - name: エライアス・ヴァン・クロムウェル
    relation: 思想の異なる宿敵
  arc: 単なる利権争いとして捉えていた事態が、人類の存亡に関わる真実へと変貌する中で、己の信じる「自由」の定義を再考する。
- name: AIユニット：ノア
  role: 相棒
  age: 5
  gender: 無性
  appearance: 艦内のホログラムとして投影される、淡い青色の少年のような姿。時折、ノイズが混じる。
  personality: 論理的だが、時折人間のような情緒的な問いかけを行う。一人称は「当機」。
  speech_style: 丁寧な敬語。「～と推測されます」「～を推奨します」
  background: エライアスの哨戒艦に搭載された最新鋭の戦術支援AI。実は「氷の城」のプロトコルと一部共鳴している。
  motivation: 自身のプログラムの矛盾を解消し、データの整合性を保つこと。
  relationships:
  - name: エライアス・ヴァン・クロムウェル
    relation: 指揮官であり、理解者
  arc: 単なる計算機としての役割を超え、消えた村の住人たちの「意識の残滓」に触れることで、生命とデータの境界について問いを投げかける。
- name: カシアン・ドレイク
  role: 脇役（黒幕的政治家）
  age: 58
  gender: 男性
  appearance: 豪華な装飾が施された帝国の礼服を纏う、恰幅の良い老人。常に穏やかな笑みを浮かべている。
  personality: 狡猾で冷徹。大局的な視点から「必要悪」を平然と選択する。一人称は「私（わたくし）」。
  speech_style: 慇懃無礼で、含みを持たせた話し方。「～ですねぇ」「～していただきたい」
  background: 帝国元老院の有力者。ヴォイド・セクターの再開発と、失われた技術の独占による権力強化を目論んでいる。
  motivation: 「氷の城」の技術を帝国に独占させ、銀河の覇権を確固たるものにすること。
  relationships:
  - name: エライアス・ヴァン・クロムウェル
    relation: 駒として利用する部下
  arc: 物語の終盤、自身の計画が制御不能な真実によって崩壊していく中で、権力の虚しさを象徴する存在として描かれる。
