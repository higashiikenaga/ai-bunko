title: 星冠の灰と零度の境界
genre: SF
tone: 重厚、冷徹、壮大な叙事詩
pov: 三人称多視点（艦隊・陣営別）
tense: 過去形
setting: 第34世紀、崩壊した星系群「ヴォイド・セクター」周辺
premise: 数十年前、入植地「静寂の村」の全住民が忽然と姿を消した未解決事件。その場所から、失われたはずの通信プロトコルが再び発信された。信号を追う銀河帝国艦隊と、利権を狙う武装商船連合の衝突は、極低温の小惑星帯に眠る巨大人工構造物「氷の城」へと導かれる。宇宙の深淵に隠された文明の遺産を巡り、艦隊の指揮官と政治家たちの命を懸けた謀略が幕を開ける。
themes:
- 失われた文明の継承
- 軍事的な義務と個人の良心
rules:
- 超光速通信には星間物質の密度による遅延が発生する
- 超光速航行にはジャンプゲートの確保が必須である
- 艦隊間通信は階級に基づいた厳格なプロトコルに従う必要がある
plot_outline:
- '序盤: 辺境の哨戒艦が、消えた村の残滓である信号を受信。帝国と連合の小規模な接触戦が発生し、事態は大規模な紛争へと発展する。'
- '中盤: 両陣営の主力艦隊が交錯する中、信号の源流が「氷の城」と呼ばれる極寒の人工要塞であることが判明。政治的駆け引きを交えつつ、要塞への進出が試みられる。'
- '終盤: 要塞内部での激戦。消失した村の住人たちが、構造物の管理AIとして「データ上の存在」に変換されていた事実が明かされる。'
- '結末: 秩序を求める帝国と自由を求める連合、それぞれの旗艦が交錯する中、主人公の指揮官は情報の隠蔽か、真実の公開かという究極の決断を下す。'
style_notes: 艦橋における戦術ディスプレイの数値、通信における階級と敬称の厳格な運用、星系座標に基づいた艦隊の陣形移動を詳細に描く。視点は艦隊の主要ユニットごとに切り替え、大規模な艦隊戦の熱量と、政治劇の静謐な緊張感を対比させる。
