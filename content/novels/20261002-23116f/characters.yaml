- name: 八兵衛
  role: 主人公
  age: 28
  gender: 男性
  appearance: どこか品はあるが、着古した着物を着て少しやつれた風貌。鋭いが温かみのある眼差しを持つ。
  personality: 義理堅いが過去の挫折から自信を失っている。一人称は「拙者」から、物語が進むにつれ「俺」へと変化する。
  speech_style: 丁寧だが、どこか寂しげな武士言葉。馴染みの仲間とはべらんめえ調も混じる。
  background: 藩の不祥事を被せられ、家禄を剥奪されて深川の長屋へ流れ着いた元下級武士。
  motivation: 地図を辿る過程で、失った自尊心と「自分が本当に守るべきもの」を見つけ出すこと。
  relationships:
  - name: お凛
    relation: 長屋の仲間・世話役
  - name: 源蔵
    relation: 長屋の仲間・師のような存在
  - name: 新之助
    relation: 因縁の相手
  arc: 過去の悔恨に縛られ逃避する日々から、人々の想いに触れることで、自らの過ちと向き合い、未来へ踏み出す強さを得る。
- name: お凛
  role: 相棒
  age: 22
  gender: 女性
  appearance: 活発な瞳と、いつもさっと結い上げられた髪。動きやすい着こなしの煮売屋の娘。
  personality: 明るく世話焼きで、細かい変化にすぐ気づく。一人称は「あたし」。
  speech_style: 威勢の良い、典型的な江戸っ子のべらんめえ口調。
  background: 長屋の煮売屋を切り盛りし、長屋の住人たちの面倒をよく見ているムードメーカー。
  motivation: 長屋の仲間たちが、明日も笑って過ごせるようにすること。
  relationships:
  - name: 八兵衛
    relation: 放っておけない兄貴分
  - name: 源蔵
    relation: 親代わりのような存在
  arc: 単なる「世話焼きの娘」から、八兵衛の抱える深い孤独を理解し、精神的な支えとなる女性へと成長する。
- name: 源蔵
  role: 脇役
  age: 62
  gender: 男性
  appearance: 深い皺と節くれ立った手を持つ。常に古道具を丁寧に手入れしている。
  personality: 飄々としていて食えない性格だが、洞察力が鋭い。一人称は「わし」。
  speech_style: ゆっくりとした、含みのある江戸言葉。
  background: 長屋の古道具屋を営む職人。かつては腕利きの職人として名を馳せていた。
  motivation: 壊れた道具だけでなく、人々の「壊れた心」も修復する手助けをすること。
  relationships:
  - name: 八兵衛
    relation: 気にかける若者
  - name: お凛
    relation: 娘のように可愛がっている
  arc: 隠居生活に退屈していたが、八兵衛と共に街を歩くことで、再び世の中の繋がりへの興味を取り戻す。
- name: 新之助
  role: 敵役
  age: 29
  gender: 男性
  appearance: 隙のない身なりと、冷徹な目つき。高級な着物を着こなし、常に威圧感を放つ。
  personality: 冷酷で野心的。秩序を重んじるが、それは己の権力のため。一人称は「私」。
  speech_style: 慇懃無礼で、相手を心理的に追い詰めるような硬い言葉遣い。
  background: 八兵衛と同じ藩の出身で、かつての同期。八兵衛の失脚を裏で画策した男。
  motivation: 江戸の裏社会の秩序を完全に掌握し、自らの地位を不動のものにすること。
  relationships:
  - name: 八兵衛
    relation: かつての友であり、排除すべき対象
  arc: 力と秩序の象徴として立ちはだかるが、八兵衛が体現する「人情」という予測不能な力に翻弄される。
