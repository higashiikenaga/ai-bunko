title: 江戸不夜城の迷い地図
genre: 歴史・時代小説
tone: 軽妙かつ温かい、下町人情味あふれる雰囲気
pov: 三人称
tense: 過去形
setting: 江戸時代後期、深川の長屋とその周辺
premise: 落ちぶれた元侍の八兵衛が、偶然手に入れた「夜の江戸」を記した秘密の地図。そこには公には存在しない、夜な夜なひっそりと開かれる闇市や隠れ家など、眠らない街の裏側が記されていた。八兵衛は長屋の仲間たちと共に地図を辿り、人々の秘めた悩みや失くした想いを取り戻す旅に出る。笑いと涙が交錯する、江戸の夜の人間模様を描く物語。
themes:
- 隣人愛
- 過去との和解
rules:
- 地図に記された場所は、特定の時間と合言葉がなければ辿り着けない
- 長屋の住人は互いに干渉し合うが、根本では深く信頼し合っている
plot_outline:
- '序盤: 冬の冷え込みが厳しい中、八兵衛が長屋の古道具屋で不思議な「秘密の地図」を拾う。そこにはお役所が禁じた『眠らない街』の案内が記されていた。'
- '中盤: 地図を頼りに、八兵衛と長屋の面々は、夜の街で孤独に生きる人々や、忘れられた約束を抱える老人たちに出会う。冬の締め切り蕎麦や正月料理を囲みながら、彼らの人生相談に乗るうちに、次第に街の絆が深まっていく。'
- '終盤: 地図の最後に記された場所で、八兵衛自身の過去にまつわる因縁の相手と再会する。長屋の仲間たちがべらんめえ口調で彼を鼓舞し、過去の過ちを許し合う騒動に発展する。'
- '結末: 春の訪れとともに、桜餅を囲んで長屋の宴会が開かれる。地図は役目を終えて消えるが、人々の心には消えない温かな人情が残り、明日への活力が湧いてくる。'
style_notes: べらんめえ口調の軽快な会話文を多用し、江戸の市井の活気を出す。冬の土手や春の桜など、季節の情景描写と、旬の食べ物（締め切り蕎麦、お節料理、桜餅など）を具体的に描き、最後は泣ける人情劇として締めくくる。
