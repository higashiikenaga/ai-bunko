- name: 久我 蓮
  role: 主人公
  age: 21
  gender: 男性
  appearance: 端正だがどこか影のある顔立ち。都会的な装いだが、黒神村の濃い霧には馴染めず浮いている。
  personality: 冷静沈着で理性的。観察眼が鋭い。一人称は「僕」。
  speech_style: 丁寧だが、真実を求める際には相手の矛盾を突くような鋭さを持つ。
  background: 東京で学問に励んでいたが、父の急死を受けて数年ぶりに黒神村へ帰郷した。
  motivation: 父がなぜ「空っぽ」になって死んだのか、その真相を突き止めること。
  relationships:
  - name: 西園寺 源蔵
    relation: 対立する村の権力者
  - name: 如月 澪
    relation: 協力者
  arc: 理屈で世界を捉えようとする青年が、記憶の残酷さと痛みを受け入れ、運命を壊す決意をする。
- name: 西園寺 源蔵
  role: 敵役
  age: 68
  gender: 男性
  appearance: 枯れ木のように痩せこけた体躯。常に重厚な真鍮の鍵を帯び、威圧的な佇まいをしている。
  personality: 徹底した合理主義者。村の安寧のためなら犠牲を厭わない。一人称は「私」。
  speech_style: 低く、有無を言わせぬ、儀式的な重みのある口調。
  background: 黒神村の長であり、蒸気機関の管理と「忘却の市」を司る一族の現当主。
  motivation: 蒸気機関を維持し、村の繁栄と長寿という偽りの秩序を守り抜くこと。
  relationships:
  - name: 久我 蓮
    relation: 機関を動かすための新鮮な燃料（生贄）として狙う対象
  arc: 秩序の守護者から、破滅を目前にして狂信的な犠牲を強要する怪物へと変貌する。
- name: 栞
  role: 脇役
  age: 18
  gender: 女性
  appearance: 陶器の人形のように白く、表情に乏しい。瞳に光がなく、どこか虚ろ。
  personality: 感情の起伏が乏しく、浮世離れしている。一人称は「私」。
  speech_style: 淡々としており、時折、忘れてしまった大切な言葉を呟くように話す。
  background: 幼少期に「市」で大切な記憶を売り払い、自我の核を失った村の娘。
  motivation: 自分がかつて何を愛していたのか、その欠落した感覚を探すこと。
  relationships:
  - name: 久我 蓮
    relation: 彼に村の異常性を伝える導き手
  arc: 虚無の中で生きる器から、蓮の行動によって「失った痛み」を想起させられる象徴的存在へ。
- name: 如月 澪
  role: 相棒
  age: 24
  gender: 女性
  appearance: 鋭い眼光を持つ。使い古された、しかし手入れの行き届いた巫女装束を纏っている。
  personality: 気が強く、正義感に燃えるが、村の仕組みに対する強い罪悪感を抱えている。一人称は「私」。
  speech_style: ぶっきらぼうで、感情が乗りやすい話し方。
  background: 村の祭祀を司る家系だが、機関の真実を知ってしまい、密かに調査を進めていた。
  motivation: 記憶を糧にする忌まわしい循環を断ち切ること。
  relationships:
  - name: 久我 蓮
    relation: 共に機関の破壊を試みる同志
  - name: 西園寺 源蔵
    relation: 忌むべき支配者
  arc: 諦観の中にいた巫女から、蓮と共に運命を打破しようとする闘士へ。
