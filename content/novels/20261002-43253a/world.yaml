title: 錆鉄の祝詞と忘却の市
genre: 怪談・民俗
tone: 静謐で重苦しく、逃げ場のない土着的な恐怖
pov: 三人称
tense: 過去形
setting: 明治中期、深い霧に包まれた山奥の閉鎖集落『黒神村』
premise: 村の最深部には、古の神を鎮めるために絶えず蒸気を吐き出し続ける巨大な錆びた蒸気機関がある。十年に一度、村人たちは「忘却の市」へと赴き、己の忌まわしい記憶を代価として差し出すことで、村の安寧と長寿を買い取る。しかし、売られた記憶は蒸気機関の燃料となり、その燃え殻として「記憶の澱」が村の境界に積み上がり始めていた。
themes:
- 喪失と代償
- 因習の呪縛
rules:
- 蒸気機関の燃料は人間から切り離された『生きた記憶』のみである
- 市で記憶を売った者は、その出来事に関する一切の感情と記憶を完全に喪失する
- 記憶の澱（燃え殻）が実体化したものは、元の持ち主の声を模倣して誘い出す
- 禁忌を破り、売った記憶を思い出そうとした者は、全身が錆び付いたように硬直して死に至る
plot_outline:
- '序盤: 主人公の青年が、父の訃報を受けて久年ぶりに黒神村へ帰郷する。村の中央で不気味な音を立てて稼働し続ける巨大な蒸気機関と、どこか虚ろな表情をした村人たちの違和感に気づく。'
- '中盤: 「忘却の市」が開かれる夜、青年は村の禁忌に触れ、記憶を売買する市場の実態を目撃する。父が死の直前まで、家族への愛情さえも燃料として売り払い、空っぽの器になっていたことを知る。'
- '終盤: 蒸気機関の老朽化により、蓄積された「記憶の澱」が溢れ出し、村中に死者の声を模した怪異が蔓延する。村の長たちは、機関を再起動させるための「新鮮な記憶」として、外から来た青年の意識を捧げようと画策する。'
- '結末: 青年は記憶を奪われそうになるが、父が最後に残した「売らなかった唯一の記憶」に導かれ、機関を破壊する。記憶の奔流が村人に逆流し、取り戻した絶望と罪悪感に耐えきれなくなった村人たちが、霧と共に静かに消えていく。'
style_notes: 硫黄と錆の匂いが漂うような触覚的な描写を重視する。会話文には、閉鎖的な共同体特有の、突き放すような冷たい山間部の方言を混ぜる。蒸気機関の駆動音を、生物の喘ぎや呻きとして表現し、静寂と騒音の対比で精神的な圧迫感を演出する。
