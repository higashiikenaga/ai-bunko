- name: カイ・ルミナス
  role: 主人公
  age: 17
  gender: 男性
  appearance: オイル汚れのついた作業服に身を包み、跳ねた茶髪が特徴。好奇心に満ちた大きな瞳をしている。
  personality: 不器用だが情熱的な努力家。機械いじりに没頭すると周囲が見えなくなる。一人称は「俺」。
  speech_style: 元気で真っ直ぐな話し方。機械の構造について語る時だけ早口になる。
  background: 飛空艇整備士の卵だが、既存の理論に囚われない改造を好むため「落ちこぼれ」と呼ばれていた。幼い頃に行方不明になった父をずっと探している。
  motivation: 父の遺言に従い氷の城へ到達し、父が何を目指し、なぜ消えたのかという真実を突き止めること。
  relationships:
  - name: リナ
    relation: 最高の航海士であり、互いを信頼し合う相棒
  - name: ガロ
    relation: 不器用ながらも慕っている精神的支柱であり用心棒
  arc: 自分を「落ちこぼれ」だと卑下していたが、旅を通じて自分の創造性が唯一無二の武器であることに気づき、自信に満ちたエンジニアへと成長する。
- name: リナ・スカイウォーカー
  role: 相棒（航海士）
  age: 18
  gender: 女性
  appearance: ショートカットの金髪に、大きな飛行ゴーグルを額にかけている。赤いマフラーがトレードマーク。
  personality: 自由奔放で楽観的。直感に優れた天才的な操舵技術を持つ。一人称は「あたし」。
  speech_style: 快活でいたずらっぽい口調。カイを「カイ君」と呼んでよくからかう。
  background: もともとは正規の航海士だったが、型に嵌まった飛行ルートに飽きて脱走。未知の空を飛ぶことを人生の至上命題としている。
  motivation: 誰も到達したことのない「世界の頂点」をこの目で見ることで、最高の航海記録を刻むこと。
  relationships:
  - name: カイ
    relation: 彼の純粋さと技術力に惹かれており、最高のパートナーだと思っている
  - name: ガロ
    relation: 口うるさいおじさん扱いしつつも、その実力を深く信頼している
  arc: 単なる好奇心による旅だったが、仲間との絆を通じて「誰かと共に目的地へ向かう喜び」を知り、責任感を持つようになる。
- name: ガロ・ヴォルガ
  role: 用心棒
  age: 34
  gender: 男性
  appearance: 長身で筋骨逞しく、顔に一本の深い傷跡がある。重厚なエーテル装甲を身に纏っている。
  personality: 寡黙で現実主義。情に厚いことを隠そうとするツンデレ気質。一人称は「俺」。
  speech_style: 短くぶっきらぼうな言い方。しかし、言葉の端々に相手への気遣いが滲む。
  background: 元・帝国軍の精鋭騎士だったが、ある作戦で部下を失った過去を持つ。その後、傭兵として空を彷徨っていた。
  motivation: カイの真っ直ぐな瞳に、かつての自分や失った部下の面影を重ね、彼を目的地まで送り届けることで自らの罪を贖いたい。
  relationships:
  - name: カイ
    relation: 守るべき対象であり、人生に光を取り戻させてくれた少年
  - name: リナ
    relation: 賑やかな彼女に振り回されつつも、その直感に救われている
  arc: 過去の喪失感に囚われ、心を閉ざしていたが、カイたちのひたむきさに触れることで再び「誰かのために剣を振るう」誇りを取り戻す。
- name: バロン・ヴォルガリス
  role: 敵役（空賊団首領）
  age: 42
  gender: 男性
  appearance: 黒いロングコートを纏い、片目にエーテル結晶の義眼を装着している。常に不敵な笑みを浮かべている。
  personality: 冷酷かつ傲慢。強者が弱者を支配するのが世界の理だと信じている。一人称は「私」。
  speech_style: 慇懃無礼で、相手を精神的に追い詰めるような話し方をする。
  background: 古の技術に執着する空賊団の首領。世界各地の古飛空艇を収集しており、伝説の『シルヴァーゲイル号』を長年追っていた。
  motivation: 氷の城に眠る究極のエンジンを手に入れ、世界の空を完全に支配する絶対的な力を得ること。
  relationships:
  - name: カイ
    relation: 自分の目的を邪魔する小癪なガキだと思っているが、その才能だけは認めている
  arc: 力こそが全てだと信じていたが、最後は個々の能力ではなく「絆」で繋がったカイたちの連携に敗北し、真の強さの意味を悟る。
