title: ハルシオン・ウィングス：雲上の遺言を追いかけて
genre: 異世界ファンタジー
tone: 爽快感あふれる冒険活劇、機械と風の躍動感
pov: 三人称
tense: 過去形
setting: 浮遊島々が点在し、エーテル結晶で飛空艇が飛び交う世界「アイテリウム」
premise: 落ちこぼれの若き整備士カイは、偶然にも伝説の古飛空艇『シルヴァーゲイル号』を掘り起こす。そこに遺されていたのは、行方不明の父が残した「世界の頂にある氷の城へ向かえ」という謎めいた遺言だった。最高の仲間と共に、風を切り裂き、雲海の果てにある真実を目指して突き進む。
themes:
- 自由と冒険
- 絆と継承
rules:
- 飛空艇の動力はエーテル結晶の純度に依存し、高純度ほど高高度への飛行が可能
- 上空には「風の街道」と呼ばれる高速気流が存在し、これを乗りこなす技術が航海の中核となる
- 高度1万メートル以上の極寒地帯には特殊な耐寒装甲が必要
plot_outline:
- '序盤: カイが古飛空艇を発見し、父の遺言を見つける。奔放な航海士リナと寡黙な用心棒ガロを仲間に加え、未知なる空へ出航する。'
- '中盤: 空賊団との激しい空中戦を繰り広げながら、遺言に記された座標を辿る。道中で機体を改造し、風を自在に操る新機能を実装して絆を深めていく。'
- '終盤: 世界の最頂点にそびえる絶景の「氷の城」に到達。そこには父が遺した究極の飛行エンジンと、世界を維持する秘密が眠っていた。'
- '結末: 城の守護者を仲間との連携で打ち破り、父の真意を理解したカイは、さらに広い世界へ旅立つため再び翼を広げて飛び立つ。'
style_notes: 風を切る音、エンジンの振動、雲の白さを鮮やかに描写し、物語のテンポを速める。台詞は勢いよく、キャラクター同士の賑やかな掛け合いを重視し、空を飛ぶ高揚感を演出すること。
