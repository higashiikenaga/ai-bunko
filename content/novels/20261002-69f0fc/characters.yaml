- name: 枢木 怜
  role: 主人公
  age: 32
  gender: 男性
  appearance: 常に隙のない黒いスリーピーススーツを着用。細いフレームの銀縁眼鏡をかけ、感情の読めない無機質な瞳をしている。
  personality: 極めて冷徹で超合理的。人間的な感情や道徳よりも、論理的な整合性を最優先する。一人称は「私」。
  speech_style: 丁寧だが突き放すような冷たい敬語。「～に過ぎない」「～という結論になる」といった断定的な言い回しが多い。
  background: 元数学教授。論理の不整合を「ノイズ」として嫌悪する性質から、特殊なコンサルタントとして事件解決の依頼を受けるようになる。
  motivation: 世界に存在する論理的な矛盾や欠落を、解明によって排除すること。
  relationships:
  - name: 瀬戸 結衣
    relation: 唯一の協力者であり、感情面での対比となる相棒
  arc: 完璧な論理を信奉していたが、犯人の「論理的な空白」という高度な虚構に直面し、人間の認知の歪みそのものを論理の範疇として組み込むようになる。
- name: 瀬戸 結衣
  role: 相棒
  age: 26
  gender: 女性
  appearance: 動きやすさを重視したカジュアルなジャケットスタイル。表情豊かで、観察力に優れた明るい瞳を持つ。
  personality: 直感的で情熱的。人間の感情や動機を読み解くことに長けており、枢木の冷酷さに辟易しつつも信頼している。一人称は「私」。
  speech_style: ハキハキとした話し方。枢木に対しては遠慮なく意見を述べ、時に「もっと人間らしく考えなさいよ」と諫める。
  background: 元警視庁の刑事。現場検証と聞き込みのプロ。論理だけでは辿り着けない「人間の心理的隙」を枢木に教える役割を担う。
  motivation: 事件の真相を突き止め、被害者の無念を晴らすこと。
  relationships:
  - name: 枢木 怜
    relation: 論理と感情のバランスを取るパートナー
  arc: 枢木の異常な思考プロセスに慣れ、論理と直感の両面から事件にアプローチできる捜査官へと成長する。
- name: 九条 彰人
  role: 敵役
  age: 45
  gender: 男性
  appearance: 高級な仕立てのスーツに身を包み、常に余裕を感じさせる優雅な微笑を浮かべている。洗練された貴族的な佇まい。
  personality: 傲慢で知的なナルシスト。自身の知能を神格化しており、他人をチェスの駒のように操ることを好む。一人称は「僕」。
  speech_style: 非常に理知的で穏やかな口調。相手の矛盾を優しく、しかし残酷に指摘するような話し方をする。
  background: 被害者のビジネスパートナーであり、金融界の寵児。自らの地位を盤石にするため、完璧な論理に基づく犯罪を計画した。
  motivation: 自らの完璧な犯罪を完成させ、論理の力で社会のルールさえも支配すること。
  relationships:
  - name: 織田 誠一
    relation: 利用対象の駒
  arc: 自身の構築した完璧な論理の城が、枢木によって「空白」という一点から崩壊していく過程で、初めて敗北の屈辱を知る。
- name: 織田 誠一
  role: 脇役（容疑者）
  age: 29
  gender: 男性
  appearance: 高級な服を着ているが、どこか着崩れており、常に落ち着きがなく視線が泳いでいる。
  personality: 野心的だが臆病。強欲さと恐怖心の板挟みになりやすい性格。一人称は「僕」。
  speech_style: 早口で、焦燥感や動揺が隠せない話し方。尋問されるとすぐに言い訳を重ねる。
  background: 被害者の甥。多額の借金を抱えており、遺言書の内容次第で人生が左右される立場にある。
  motivation: 遺言書を手に入れ、あるいは隠蔽することで、自身の経済的困窮を回避すること。
  relationships:
  - name: 九条 彰人
    relation: 心理的にコントロールされている対象
  arc: 事件の真相が明らかになるにつれ、自らの過ちと九条の罠の間で追い詰められ、自滅的な告白へと至る。
