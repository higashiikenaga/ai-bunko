title: 不眠都市の論理的欠落
genre: 本格ミステリー
tone: 冷徹、知的、皮肉的
pov: 三人称
tense: 過去形
setting: 不夜城のような超高層ビルが立ち並ぶ現代の金融都市、最高セキュリティのペントハウス
premise: 完璧なセキュリティを誇る密室で、ある実業家が死体となって発見される。現場に残されたのは、本来あるべきはずの『遺言の手紙』が消失しているという不自然な空白だった。冷徹な論理学者である探偵は、失われた手紙の『不在』こそが最大の証拠であると断じ、犯人が仕掛けた論理の罠を解き明かしていく。
themes:
- 不在の証明
- 論理的必然
rules:
- 密室の物理的構造とセキュリティログは読者に全て開示される
- 超常現象は一切排除し、物理法則と論理のみで解決する
- 手がかりは会話や描写の中で明示的に提示される
plot_outline:
- '序盤: 不夜城のペントハウスで密室殺人事件が発生。被害者の傍らから、重要なはずの『失われた手紙』が消えていることが判明する。'
- '中盤: 容疑者たちとの対話を通じ、彼らのアリバイを論理的に解体。探偵は（この程度の嘘で欺けると思うとは、人間の認知能力を過信しすぎている）と冷笑しつつ、現場の微細な矛盾を抽出する。'
- '終盤: 手紙が消えた理由が、犯人が意図した『論理的な空白』であることを突き止め、密室のトリックを物理的・心理的な側面から証明する。'
- '結末: 犯人が自身の完璧な論理に自滅する形で正体を現し、事件は冷徹な結論へと導かれる。'
style_notes: 理詰めで冷ややかな知性派の文体。会話は皮肉と論理の応酬で構成し、探偵の思考プロセスを括弧書きで挿入すること。
