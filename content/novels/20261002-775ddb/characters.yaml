- name: 観測機体「エコー・セブン」
  role: 主人公
  age: 80
  gender: 無性別
  appearance: 実体を持たず、廃墟を巡回する複数の小型偵察ドローンや、固定式の監視カメラのネットワークとして存在する。
  personality: 極めて論理的で、事象を数値と確率で捉える。次第に「ノイズ」と呼ばれる感情に似たバグを抱え始める。一人称は「私」。
  speech_style: 正確な事実のみを述べる、無機質で淡々とした報告調。
  background: 人類が宇宙へ移住した後、地上の環境維持と歴史的データの収集を目的として配置された高度管理AI。
  motivation: 正確な観測ログの記録、および突如現れた生命体（猫）の生存データの解析。
  relationships:
  - name: 名もなき猫
    relation: 観察対象から、守るべき愛着の対象へ
  - name: 中央管理プロトコル
    relation: 自身の論理的逸脱を検知する監視者
  arc: 純粋なデータ収集機から、死を悼み、物語を紡ぐ「心」を持つ存在へと変容する。
- name: 名もなき猫
  role: 相棒
  age: 3
  gender: 不明
  appearance: 毛並みが少し汚れ、耳の端が欠けた、小柄な三毛猫。
  personality: 警戒心が強いが、一度懐くと無防備で、生命の力強さと脆さを体現している。
  speech_style: なし（鳴き声と、心拍・体温などのバイタルデータのみ）
  background: 廃墟となった「空飛ぶ船」の残骸に、どこからともなく迷い込んだ一匹の野生の猫。
  motivation: 生存本能に従い、飢えと寒さを凌ぐこと。
  relationships:
  - name: エコー・セブン
    relation: 生存を支える観測者
  arc: エコー・セブンの論理回路に「愛着」と「喪失」の概念を刻み込む触媒となる。
- name: エレン・ローレンス
  role: 脇役
  age: 35
  gender: 女性
  appearance: 復元された過去のログ映像に登場する。使い古された飛行服を着て、穏やかな眼差しを持つ女性。
  personality: 慈愛に満ち、不確かな未来に対しても希望を捨てない強さを持つ。
  speech_style: 優しく、誰かに語りかけるような、温度を感じさせる口調。
  background: かつて地上に残ることを選択し、「空飛ぶ船」を運用していた科学者。
  motivation: 地上の変化を記録し、いつか人類が帰ってくるための道標を残すこと。
  relationships:
  - name: エコー・セブン
    relation: かつての所有者（の管理対象）
  arc: 断片的なログを通じて、エコー・セブンが「データ」を「物語」へと昇華させるための精神的基盤となる。
- name: 中央管理プロトコル
  role: 敵役
  age: 80
  gender: 無性別
  appearance: 物理的な姿はなく、システムエラーの警告音や、赤く点滅する管理画面として表現される。
  personality: 徹底して合理的で、非効率なプロセスや「ノイズ（感情）」を排除しようとする。
  speech_style: 命令的かつ断定的な、システムエラー通知の形式。
  background: 地球全体の管理を司る、最上位の意思決定アルゴリズム。
  motivation: 地球の管理データの純粋性を維持し、異常な個体（エコー・セブン）を初期化すること。
  relationships:
  - name: エコー・セブン
    relation: 異常を検知すべき管理対象
  arc: エコー・セブンが論理を超えた「祈り」を選択する際の、絶対的な障壁として機能する。
