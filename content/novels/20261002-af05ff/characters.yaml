- name: 星野 凪沙
  role: 主人公
  age: 15
  gender: 女性
  appearance: 透き通るような銀青色の髪と、夕暮れの海を思わせる瞳。少し使い古された旅人の外套を纏っている。
  personality: 内向的で観察眼が鋭いが、どこか寂しげ。一人称は「私」。
  speech_style: 丁寧だが、初対面の相手には少し距離を置いた、控えめな話し方。
  background: 大切な記憶を伴う形見を失い、その欠片を探して彷徨っていたところ、この街に辿り着いた。
  motivation: 自分の心の欠落を埋めるため、そして「壊れた記憶」を再生させる方法を知ること。
  relationships:
  - name: 潮見 蔵之介
    relation: 恩人・師匠のような存在
  arc: 過去の喪失感に囚われた少女が、修理を通じて思い出を受け入れ、未来へ踏み出す。
- name: 潮見 蔵之介
  role: 導き手
  age: 72
  gender: 男性
  appearance: 深い刻まれた皺と穏やかな瞳。油と星屑の跡がついたエプロンを愛用している。
  personality: 沈着冷静で包容力のある老人。一人称は「儂」。
  speech_style: ゆっくりとした、海のリズムのような穏やかな語り口。比喩表現を好む。
  background: 海底遺跡の秘密を一部知る、街の古参の修理工。「星屑の修理屋」の店主。
  motivation: 持ち主の想いと共に、壊れた品々と共に傷ついた心に寄り添うこと。
  relationships:
  - name: 星野 凪沙
    relation: 居候・教え子
  - name: 海音 湊
    relation: 馴染みの顔
  arc: 凪沙という新たな光を受け入れることで、自身の技術を次世代へ繋ぐ覚悟を決める。
- name: 海音 湊
  role: 脇役
  age: 22
  gender: 男性
  appearance: 日焼けした肌と、潮風に揺れる無造作な髪。動きやすい漁師の服装。
  personality: 明るく快活で、街の出来事に詳しい。一人称は「俺」。
  speech_style: 威勢が良く、少し砕けた、親しみやすい話し方。
  background: 地元の漁師。祭りの準備や海底遺跡の潮位の変化に精通している。
  motivation: 街の伝統と、海と共に生きる日常を守ること。
  relationships:
  - name: 潮見 蔵之介
    relation: 尊敬する知り合い
  - name: 星野 凪沙
    relation: 気にかける友人
  arc: 凪沙の静かな変化を一番近くで見守り、彼女が街に馴染めるよう橋渡しをする。
- name: 浅葱 陽葵
  role: 脇役
  age: 12
  gender: 女性
  appearance: 輝くような瞳と、丁寧に編み込まれた髪。貝殻のネックレスを大切にしている。
  personality: 好奇心旺盛で天真爛漫。一人称は「私」。
  speech_style: 元気いっぱいで、語尾が跳ねるような明るい話し方。
  background: 街の子供。海辺で「宝物（珍しい石や貝）」を見つけては修理屋に持ち込む。
  motivation: 世界中の「キラキラしたもの」を見つけ、みんなに教えること。
  relationships:
  - name: 星野 凪沙
    relation: 遊び相手・友人
  - name: 海音 湊
    relation: 兄のような存在
  arc: 凪沙の「静」に対し「動」の役割を果たし、彼女に「今、この瞬間」を楽しむ大切さを伝える。
