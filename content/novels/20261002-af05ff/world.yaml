title: 水底の星屑と、宵闇の灯火
genre: 日常ほのぼの
tone: 静謐でロマンチック、星空と潮騒の旋律
pov: 三人称
tense: 過去形
setting: 海底遺跡が透けて見える、星降る夜の美しい港町
premise: 海底に沈む古代の遺跡が、満ち引きによってその姿を覗かせる静かな港町。そこには、持ち主の思い出を修復する「星屑の修理屋」がありました。迷い込んだ少女が、星を愛する老店主と共に、壊れた品々に宿る物語を紐解いていきます。祭りの夜、流星群が海底の遺跡を照らし出すとき、止まっていた時間が再び動き始めます。
themes:
- 記憶の再生
- 孤独と繋がり
- 天体と時間の巡り
rules:
- 海底遺跡は特定の月齢の時にのみ、その神秘的な輝きを増す
- 修理される品物は、持ち主の心の欠片を象徴している
- 町の暦は星の運行に従って定められている
plot_outline:
- '序盤: 流れ星のように街へ辿り着いた少女が、海辺の修理屋で老店主と出会い、静かな日常が始まる。'
- '中盤: 様々な持ち主が、海底遺跡にまつわる品々を持ち込み、店主との夜の会話を通じて少女の心が解けていく。'
- '終盤: 祭りの夜、流星群が海底の遺跡を照らし、少女が大切にしていた「壊れた記憶」が光を放つ。'
- '結末: 潮が満ち、遺跡が再び眠りにつく頃、少女は自分の歩むべき道を見つけ、新しい星座を心に刻む。'
style_notes: 夜の静寂を、銀河の微かな囁きのように描き出すこと。会話は、まるで双子座の星々が寄り添うように、静かで温かな余韻を残すものにする。比喩には常に星々の名前を添え、読者の視線を、地上のささやかな営みから、永遠に続く夜空へと誘うように綴る。
