- name: 結城 栞 (ゆうき しおり)
  role: 主人公
  age: 28
  gender: 女性
  appearance: 眼鏡をかけ、機能的なアウトドアウェアを纏っている。常にフィールドノートとルーペを持ち歩いている。清潔感はあるが、少しやつれた印象。
  personality: 冷静で論理的、観察眼に優れる。感情を抑えがちだが、内面には情熱を秘めている。一人称は「私」。
  speech_style: 丁寧で落ち着いた敬語。事実に基づいた客観的な話し方。
  background: 植物学者。没後十年になる祖父・結城正造の未完の植物相調査を完遂させるため、北アルプスの山村を訪れる。
  motivation: 祖父の足跡を辿り、未完の調査を終わらせることで、彼との精神的な繋がりを確認すること。
  relationships:
  - name: 結城 正造
    relation: 亡くなった祖父
  - name: 源蔵
    relation: 村で出会う老人であり、精神的な導き手
  arc: 学問的な探究心のみで動いていた状態から、自然の循環と人間の記憶の在り方を理解し、生と死を受け入れる心の深まりを見せる。
- name: 佐伯 源蔵 (さえき げんぞう)
  role: 主要登場人物（導き手）
  age: 76
  gender: 男性
  appearance: 深く刻まれた皺と、日焼けした肌。使い込まれた作業着を着ており、手は節くれ立っている。眼光は鋭いが、どこか寂しげ。
  personality: 寡黙で頑固。自然に対して畏敬の念を抱いている。一人称は「俺」。
  speech_style: ぶっきらぼうだが、言葉の端々に慈しみを感じさせる山村の老人らしい訛り。
  background: かつて森林鉄道の保守作業に携わっていた元作業員。廃村となった村の近くで、今は朽ちゆく蒸気機関車を一人で見守り続けている。
  motivation: かつて自分が切り拓いた山と、その象徴である機関車が、完全に自然の一部となるまでを見届けること。
  relationships:
  - name: 結城 栞
    relation: 祖父の孫であり、自らの記憶を託す相手
  arc: 過去の後悔に囚われながらも、栞との交流を通じて、自らの人生と鉄の記憶が自然に還っていく過程を肯定できるようになる。
- name: 結城 正造 (ゆうき しょうぞう)
  role: 脇役（回想/動機付け）
  age: 65
  gender: 男性
  appearance: 物語中では写真やノートの記述のみ。穏やかな表情の老人。
  personality: 探究心旺盛で、自然の微細な変化を愛した博愛主義者。
  speech_style: 記述によれば、温厚で教え諭すような口調。
  background: 植物学者。この地の植物相調査を行っていた最中に急逝した。栞の人生の指針となっている人物。
  motivation: （生前）この地の生命の営みを、詳細な記録として後世に残すこと。
  relationships:
  - name: 結城 栞
    relation: 孫
  arc: 死者として物語の背景に存在し、栞が真理に到達するための「問い」として機能する。
