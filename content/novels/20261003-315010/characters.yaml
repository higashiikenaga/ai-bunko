- name: カイト
  role: 主人公
  age: 16
  gender: 男性
  appearance: 痩身ながらしなやかな筋肉を持つ。鋭い眼差しと、常に深く被った黒いフーディーが特徴。
  personality: 内向的で完璧主義。他者を寄せ付けない孤独な天才肌。一人称は「僕」。
  speech_style: 簡潔で淡々としている。感情が高ぶると言葉数が少なくなる。
  background: かつて名門校で期待されていたが、周囲との温度差と孤独感からバスケを捨て、街の路地裏で一人練習に没頭していた。
  motivation: 失われた手紙に記された「バスケットボールの真髄」に到達し、自分の居場所を見つけること。
  relationships:
  - name: レン
    relation: 最大のライバルであり、互いの欠落を埋め合う鏡のような存在
  - name: ミオ
    relation: 唯一心を開き始めた、ストリートの案内人
  arc: 個人の技術への執着を捨て、他者と繋がることで得られる真の強さと情熱に目覚める。
- name: レン
  role: 敵役/ライバル
  age: 17
  gender: 男性
  appearance: 日に焼けた肌と鍛え上げられた体格。派手なネオンカラーのスニーカーとピアスがトレードマーク。
  personality: 自信家で攻撃的。負けず嫌いであり、強さこそが全てだと信じている。一人称は「俺」。
  speech_style: ぶっきらぼうで威圧的。相手を挑発するような口調だが、芯には純粋な情熱がある。
  background: ストリートの底辺から実力のみで現在の地位を築き上げた。誰にも頼らず頂点に君臨することに執着している。
  motivation: ストリートリーグの絶対王者として君臨し続け、誰にも屈しない証明をすること。
  relationships:
  - name: カイト
    relation: 自分に敗北の味を教えた憎き天才であり、唯一認めた好敵手
  arc: 圧倒的な敗北を経て、プライドを捨てて「もう一度挑戦する」という泥臭い再起の喜びを知る。
- name: ミオ
  role: 相棒/ガイド
  age: 16
  gender: 女性
  appearance: ベリーショートの髪に快活な笑顔。常にデータ端末を持ち歩き、スポーティな服装に身を包んでいる。
  personality: 好奇心旺盛で分析的。街のあらゆるコートの情報を把握している情報通。一人称は「私」。
  speech_style: 早口で賑やか。ストリートの専門用語や戦術的な分析を混ぜて話す。
  background: 元コート管理人の娘。伝説のプレイヤーたちの記録を収集しており、ストリートバスケの文化を誰よりも愛している。
  motivation: 手紙の主である伝説のプレイヤーの正体を突き止め、新たな伝説が生まれる瞬間を記録すること。
  relationships:
  - name: カイト
    relation: 才能を見出した原石としてサポートし、精神的な支えとなる
  - name: レン
    relation: 喧嘩友達のような関係だが、その実力を高く評価している
  arc: 観測者としての立場を脱し、チームの一員として勝利への渇望を共有する当事者へと変化する。
- name: レオン
  role: 伝説のプレイヤー/メンター
  age: 35
  gender: 男性
  appearance: 大人の余裕を感じさせる佇まい。コートに立つと、かつての王者の風格が滲み出る。
  personality: 達観しており、哲学的な思考を持つ。孤独の価値を知っている。一人称は「私」。
  speech_style: 穏やかで比喩表現を多用する。相手に答えを教えず、気づきを与える話し方。
  background: かつて街の全てのコートを支配したが、頂点の孤独に絶望し、ある目的のために手紙を残して姿を消した。
  motivation: 自分の後継者ではなく、孤独を乗り越えて「誰かと繋がれる」次世代のプレイヤーを育てること。
  relationships:
  - name: カイト
    relation: 手紙を通じて導いた、魂の継承先
  arc: 自身の過去の孤独を肯定し、バトンを繋ぐことで精神的な救済を得る。
