title: 残響のコート ―眠らない街の咆哮―
genre: スポーツ青春
tone: 泥臭く、熱狂的で、心拍数が跳ね上がるような文体
pov: 三人称
tense: 基本は過去形、試合のクライマックスでは現在形
setting: 24時間ネオンが輝き続け、喧騒が止まない巨大都市のストリートコート
premise: 眠らない街の路地裏で、一通の「失われた手紙」が発見される。それは、かつてこの街のコートを支配した伝説のプレイヤーが、未来の挑戦者へ宛てた挑戦状だった。手紙を頼りにストリートの頂点を目指す少年は、汗と熱気に満ちた過酷なトーナメントへと身を投じる。敗北の味を知る者たちの執念が、夜のコートを熱く焦がしていく。
themes:
- 継承される情熱
- 孤独からの脱却
rules:
- ストリートバスケットボールの掟に従う
- 深夜のコートでは、審判ではなくプレイヤー同士のプライドがルールとなる
plot_outline:
- '序盤: 孤独な天才・カイトが、路地裏で古びた『失われた手紙』を見つける。そこにはかつての王者が残した、バスケットボールの真髄が記されていた。'
- '中盤: 手紙の導きに従い、カイトは深夜のストリートリーグへ。激しい肉弾戦の中、圧倒的な力で敗北を喫したライバルの視点を通じ、負けることの痛みとそこからの再起を描く。'
- '終盤: トーナメント決勝。眠らない街の喧騒を切り裂くような、極限の攻防。一瞬の呼吸、一滴の汗、すべてが現在形の猛烈な描写で綴られる。'
- '結末: 勝利の瞬間、カイトは手紙の真の目的が、単なる挑戦状ではなく『孤独な魂を繋ぐためのバトン』であったことを悟る。'
style_notes: 甲斐走のスタイルを徹底。試合描写では「心臓が、早鐘を打つ。視界が、狭まる。一歩、踏み出す。その瞬間、世界が止まる――」といった、現在形を用いた短文の連打により、実況さながらの臨場感と、読み手の鼓動を速める熱血感を演出すること。
