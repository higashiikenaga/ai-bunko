- name: 烈（レツ）
  role: 主人公
  age: 15
  gender: 男性
  appearance: 無造作な黒髪に、瞳には強い意志が宿っている。常に作業着を着ており、顔には油汚れがついていることが多い。
  personality: 熱血漢で直情的。一度決めたら曲げない芯の強さを持つ。一人称は「俺」。
  speech_style: 声が大きく、語尾が強く跳ねるような、エネルギーに満ちた話し方。
  background: メトロ・ギアの廃棄場で、亡き父の形見である『ガオ・ストライカー』と共に、不器用ながらもギガ・ボールに情熱を注いできた少年。
  motivation: 父が遺した手紙の謎を解き明かし、海底遺跡に眠る真実を知ること。
  relationships:
  - name: 凛
    relation: チームの作戦参謀であり、最も信頼するパートナー
  - name: 海斗
    relation: いつか超えたい壁として意識しているライバル
  arc: 未熟な落ちこぼれから、仲間を率い、魂の叫びを機体に込める真のリーダーへと成長する。
- name: 凛（リン）
  role: 相棒/作戦参謀
  age: 16
  gender: 女性
  appearance: 知的な印象を与えるショートカット。常に最新式のデータ分析用ヘッドセットを装着している。
  personality: 冷静沈着で論理的。感情に流されず常に最適解を求める。一人称は「私」。
  speech_style: 落ち着いたトーンで、無駄がなく明晰な話し方。
  background: かつては天才プレイヤーとして名を馳せたが、競技の機械化に疑問を感じ、現在はデータ解析の道を選んでいた。
  motivation: 烈の熱意に触れることで、自分自身が忘れていた「競技の本当の楽しさ」を取り戻すこと。
  relationships:
  - name: 烈
    relation: 予測不能だが、その情熱に突き動かされる操縦士
  arc: データのみを信じる冷徹な観測者から、勝利のために共に熱狂する情熱的な戦友へと変わる。
- name: 海斗（カイト）
  role: ライバル
  age: 17
  gender: 男性
  appearance: 銀髪の端正な顔立ち。洗練された高級感のあるプロ用パイロットスーツを纏っている。
  personality: プライドが高く完璧主義者。弱さを嫌う孤高の存在。一人称は「俺」。
  speech_style: 尊大で、相手を見下すような、どこか余裕を感じさせる話し方。
  background: 絶対王者チームの次期エース候補。幼少期からエリート教育を受け、完璧な技術を叩き込まれてきた。
  motivation: 自身の完璧さを証明し、誰も到達できない頂点に君臨し続けること。
  relationships:
  - name: 烈
    relation: 理解不能だが、目が離せない強敵
  arc: 孤独な絶対王者から、敗北と熱意を知り、仲間と共に高みを目指す真のスポーツマンへと進化する。
- name: ヴィクター
  role: 敵役
  age: 35
  gender: 男性
  appearance: 威圧感のある大柄な体躯。鋭い眼光と、左頬に古い傷跡がある。
  personality: 冷酷非道で、勝利のためには手段を選ばない。合理主義の塊。一人称は「私」。
  speech_style: 威厳に満ち、命令を下すような、重みのある低音の話し方。
  background: 絶対王者チームのリーダー。海底遺跡のエネルギーを競技の興行だけでなく、政治的な力として利用しようと企んでいる。
  motivation: 遺跡のコアを手中に収め、ギガ・ボールを通じて世界を支配すること。
  relationships:
  - name: 海斗
    relation: 優れた駒（プレイヤー）として利用している部下
  - name: 烈
    relation: 秩序を乱す不確定要素としての敵対者
  arc: 圧倒的な力で全てを支配しようとする独裁者として、烈たちの「魂の合体」によって挫折する。
