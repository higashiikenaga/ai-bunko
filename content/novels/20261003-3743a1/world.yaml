title: 鋼鉄の咆哮！ギガ・ストライカーズ ―魂の超合体ゴール―
genre: スポーツ青春
tone: 熱血・特撮風・爆発的
pov: 三人称
tense: 過去形
setting: 近未来の都市『メトロ・ギア』。巨大ロボットによる超高速球技競技『ギガ・ボール』が世界的な熱狂を巻き起こしている時代。
premise: 落ちこぼれの少年・烈が、廃棄場から古びた機体『ガオ・ストライカー』を掘り起こすところから物語は始まる。父が遺した『失われた手紙』に導かれ、彼は伝説の力が眠る『海底遺跡』の謎と、競技の真の目的に辿り着こうとする。個性豊かな仲間と共に、絶望的な実力差を誇る王者たちに、魂の叫びを乗せた超弩級のシュートを叩き込め！
themes:
- 不屈の闘志
- 絆による進化
rules:
- 機体の出力はパイロットの『情熱（パッション・エネルギー）』に比例し、精神的に昂ぶるほど機体性能が跳ね上がる
- 一定以上のシンクロ率に達した機体同士は、物理的な結合を伴う『超合体』が可能となる
- 海底遺跡に眠る『原初のコア』を装着した機体のみが、次元を切り裂く必殺技を放てる
plot_outline:
- '序盤: ギガ・ボールに憧れながらも不器用な烈が、ボロボロの機体で地域予選に参戦。父の遺品である手紙の断片から、海底遺跡に眠る最強のコアの存在を知る。'
- '中盤: ぶつかり合いながらも、熱い心を持つ仲間たちが集結。特訓の末に、個々の機体が組み合わさる合体攻撃を編み出し、強豪チームを次々と撃破していく。'
- '終盤: 全日本選手権決勝。絶対王者チームの圧倒的な力の前に機体は大破寸前となるが、手紙の全貌が明らかになり、烈は真の情熱を覚醒させる。'
- '結末: チーム全員の魂が一つに重なり、究極合体形態『ギガ・レガシー』へと進化。宇宙まで届く咆哮と共に、全エネルギーを注いだ超次元シュートを決め込み、頂点に立つ。'
style_notes: 台詞は叫ぶように激しく書き、感嘆符を多用すること。特に合体シーンや必殺技の描写では、『ガガガッ！』『ドゴォォォン！』といった特撮的な擬音を盛り込み、世界が震えるほどの過剰な演出で盛り上げる。
