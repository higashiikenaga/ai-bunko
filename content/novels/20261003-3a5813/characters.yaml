- name: カイ・エデルワイス
  role: 主人公
  age: 19
  gender: 男性
  appearance: 柔らかな茶髪に、旅慣れた様子を感じさせる大きなゴーグル。使い込まれた革の飛行服を着用している。
  personality: 穏やかで好奇心旺盛。少し内向的だが、人の想いに敏感。一人称は「僕」。
  speech_style: 丁寧で落ち着いた口調。相手の話を最後までよく聞く。
  background: 浮遊島の片隅にある古い時計店の手伝いをしていた青年。亡くなった祖父の遺品から手紙の束を見つける。
  motivation: 届かなかった手紙の宛先を辿り、手紙に込められた想いを完遂させること。
  relationships:
  - name: ルナ
    relation: 旅の相棒・ナビゲーター
  - name: 祖父（故人）
    relation: 手紙の持ち主（推定）
  arc: 受動的な日常から抜け出し、自らの足で世界を歩き、人々の記憶を繋ぐ「語り部」へと成長する。
- name: ルナ・スカイウォーカー
  role: 相棒
  age: 17
  gender: 女性
  appearance: ショートカットの銀髪。活動的なショートパンツ姿。常に小さなレシピノートを持ち歩いている。
  personality: 明るく快活で、食べることが大好き。直感で動くタイプ。一人称は「私」。
  speech_style: 語尾が跳ねるような、元気でハキハキとした話し方。
  background: 各地の島を巡る「味覚の探求者」を自称する少女。カイの気球に相乗りすることになる。
  motivation: 世界中の美味しい料理を記録し、失われた「喜びの味」を再発見すること。
  relationships:
  - name: カイ・エデルワイス
    relation: 旅の仲間・友人
  arc: ただの食いしん坊な旅人から、料理を通じて人々の心の傷を癒やす術を知る料理研究家へと深化する。
- name: セレス・メイソン
  role: 脇役（キーパーソン）
  age: 72
  gender: 女性
  appearance: 深い藍色のドレスを纏った、気品のある老婦人。瞳には知性が宿っている。
  personality: 慈愛に満ちているが、どこか神秘的で掴みどころがない。一人称は「わたくし」。
  speech_style: 古風で優雅な言葉遣い。教え諭すような穏やかな響き。
  background: 霧の境界線近くの島に住む、かつての「忘れられた村」の記憶を微かに保持している生き残り。
  motivation: 村の記憶が完全に消え去る前に、誰かにその価値を伝えること。
  relationships:
  - name: カイ・エデルワイス
    relation: 記憶を託すべき後継者
  arc: 過去の遺物として静かに朽ちていく運命を受け入れつつ、新しい時代へと記憶をバトンタッチする。
