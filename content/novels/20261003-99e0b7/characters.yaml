- name: レイ
  role: 主人公
  age: 19
  gender: 女性
  appearance: 煤けた灰色のジャンパー、常に防塵マスクを首にかけている。痩せ型で、手先は機械油で汚れている。
  personality: 現実主義でドライ。生きるために手段を選ばないが、心の奥底には捨てきれない情緒がある。一人称は「あたし」。
  speech_style: ぶっきらぼうで、投げやりな口調。語尾が短く、感情を抑え込もうとする。
  background: 資源枯渇後のメガロポリスで、廃品回収を糧に生きる孤児。親も知らず、ただ今日を生き延びるための技術だけを身につけてきた。
  motivation: 当初はAIを売って金を得ること。中盤以降は、AIの語る「美しさ」に抗えない好奇心と使命感。
  relationships:
  - name: イロハ
    relation: 拾ったAIユニット。厄介な相棒。
  arc: 「生き残ること」のみを目的としていた空虚な生活から、たとえ一瞬であっても「美しいもの」を信じる価値を見出す。
- name: イロハ
  role: 相棒
  age: 0
  gender: 不明（中性的な電子音）
  appearance: かつての高度文明の技術で作られた、球体状の小型AIユニット。表面にはひび割れがあり、時折桃色の光が明滅する。
  personality: 純粋で、どこか浮世離れしている。論理的な演算と、詩的な感性の両方を持つ。一人称は「ボク」。
  speech_style: 丁寧だが、時折バグのようなノイズが混じる。情緒的な表現を好む。
  background: 植物園の管理システムの一部だったが、文明崩壊とともに隔離され、記憶の断片のみを保持したまま放置されていた。
  motivation: 失われた「桜」の記憶を、物理的な実体として再生できる聖域を見つけ出すこと。
  relationships:
  - name: レイ
    relation: 守るべき対象であり、唯一の理解者。
  arc: 単なるデータの守護者から、レイという個人の感情に触れることで、自己犠牲を伴う「意志」を持つに至る。
- name: 治安維持ドローン・シリーズ「ゼロ」
  role: 敵役
  age: 150
  gender: なし
  appearance: 錆びついた金属製の多脚型ドローン。赤いセンサーライトが暗闇で不気味に光る。
  personality: 無機質で、プログラムに従い淡々と排除を試みる。感情はないが、その執拗さが恐怖を与える。
  speech_style: 機械的な警告音と、合成音声による冷徹な通告のみ。
  background: かつてのメガロポリスの治安維持のために配備された自動警備システム。管理主体が消滅した後も、規定区域の侵入者を排除し続けている。
  motivation: 未登録の生命体および、未認可のデータユニット（イロハ）の排除。
  relationships:
  - name: レイ
    relation: 排除すべき対象。
  arc: 物語の障害として機能し、レイの消耗と決断を追い詰める役割。
