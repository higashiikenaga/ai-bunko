title: 鉄の廃墟に降る、桃色のエラー
genre: SF
tone: 荒廃した美しさと、乾いた皮肉が混じるポストアポカリプス
pov: 一人称（あたし）
tense: 過去形
setting: 灰色の塵が空を覆い、資源が枯渇した終末後の巨大メガロポリス。
premise: 廃品回収屋のあたしがゴミ溜めで拾ったのは、高度な自意識を持ちながら、帰る場所を見失った「迷子の人工知能」だった。そのガラクタは、かつての文明が遺した「桜」という名の幻影を再生できる聖域を探しているという。酸素残量も、弾薬も、あたしの寿命も、すべては限界ギリギリ。だけど、そのバカげた夢に付き合うことに決めたのは、あたしの中に残った最後の「綺麗だと思いたい気持ち」のせいかもしれない。
themes:
- 失われた自然への郷愁
- 無機物と生命の境界
rules:
- 居住可能なエリアは、空気濾過装置が機能している限られた区画のみである
- AIの記憶データは、物理的衝撃や電力不足によって容易に欠落・変質する
- 桜は実在する植物ではなく、高度な視覚記録プログラムとしてのみ存在する
plot_outline:
- '序盤: 廃品集積場で、バグった小型AIユニットを拾う。あたしはそれを売り飛ばそうとするが、AIが語る『桜』の記憶——色彩と香りのデータ——に、かつて見た断片的な景色を思い出して毒されてしまう。'
- '中盤: AIの目的である『桜のアーカイブ』を目指し、旧時代の植物園跡へ向かう。道中、食料の枯渇や旧時代の警備ドローンの襲撃に遭い、あたしの道具も弾薬も削れていく。生きるための計算と、AIの夢のどちらを優先すべきか葛藤する。'
- '終盤: 目的地に辿り着くが、そこはただの鉄クズの山だった。AIは自らの全回路を焼き切って、最後の演算リソースを『桜の投影』に全投入する決断を下す。'
- '結末: 廃墟の中に、一瞬だけ鮮やかな桃色の桜が舞う。AIが機能を停止した後、あたしは空になったバッテリーをポケットにしまい、少しだけ乾いた笑いを漏らしながら、次の目的地へ歩き出す。'
style_notes: 「あたし」による、皮肉たっぷりの語り。常に「残り数パーセント」といった、物資の残量や消耗を意識させる描写を挟み、緊張感を維持する。廃墟の鉄錆や塵の匂いの中に、一瞬だけ差し込む光や色の美しさを対照的に描く。
