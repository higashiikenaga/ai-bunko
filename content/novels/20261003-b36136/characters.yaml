- name: 草薙 栞
  role: 主人公
  age: 24
  gender: 女性
  appearance: 都会的な服装に身を包んでいるが、疲弊した表情。記憶の中にある幼少期の自分とは異なる、どこか虚ろな瞳をしている。
  personality: 論理的で懐疑的な思考を持つが、根は情に厚い。一人称は「私」。
  speech_style: 丁寧だが、違和感に対しては率直に疑問を投げかける口調。
  background: 水鏡村出身。幼い頃に村の閉鎖的な空気に耐えかねて都会へ出たが、祖父の訃報を受けて数年ぶりに帰郷した。
  motivation: 祖父の死の真相を突き止め、速やかに村を離れること。
  relationships:
  - name: 水鏡 恭平
    relation: 幼馴染であり、村の案内役
  - name: 草薙 千代
    relation: 祖父の妹であり、村の長老
  arc: 理性にしがみついていたが、徐々に鏡の向こう側の理に侵食され、最終的に「入れ替わり」の犠牲となる。
- name: 水鏡 恭平
  role: 相棒/裏切り者
  age: 27
  gender: 男性
  appearance: 穏やかな笑みを絶やさない青年。村の伝統的な装束を現代的にアレンジして着こなしているが、瞳にハイライトがなく、鏡のような質感をしている。
  personality: 物腰柔らかく親切。しかし、会話の端々に村の禁忌を正当化する狂信的な思考が混じる。一人称は「僕」。
  speech_style: おっとりとした、相手を安心させるような優しい話し方。
  background: 水鏡村の名家の跡継ぎ。村の儀式を円滑に進めるための「導き手」としての役割を担っている。
  motivation: 栞を完璧な状態で「鏡祭り」の贄として捧げること。
  relationships:
  - name: 草薙 栞
    relation: 再会した幼馴染であり、獲物
  - name: 草薙 千代
    relation: 儀式の共謀者
  arc: 親切な協力者を演じ続けるが、終盤に冷酷な執行者としての本性を現す。
- name: 草薙 千代
  role: 敵役
  age: 78
  gender: 女性
  appearance: 深く刻まれた皺と、白濁した瞳を持つ老婆。常に黒い喪服のような着物を纏い、手には古びた数珠を持っている。
  personality: 厳格で冷徹。村の掟こそが絶対であり、個人の感情を切り捨てることを厭わない。一人称は「私」。
  speech_style: 古風で威圧的な言い回し。断定的な口調で相手を追い詰める。
  background: 村の信仰と禁忌を管理する長老。代々「折れた剣」の管理を任されており、鏡の向こう側の神との契約を維持している。
  motivation: 「鏡祭り」を完遂させ、村の平穏（偽りの日常）を維持すること。
  relationships:
  - name: 草薙 栞
    relation: 血縁者であり、絶好の贄
  - name: 水鏡 恭平
    relation: 信頼する儀式の遂行者
  arc: 伝統の守護者として振る舞い、最終的に栞を鏡の向こう側へ追いやって満足感を得る。
- name: 蓮
  role: 脇役/警告者
  age: 19
  gender: 男性
  appearance: 青白い肌と痩せこけた身体。常に村の境界線あたりに佇んでおり、時折、自分の身体を掻きむしる癖がある。
  personality: 怯えきっており、断片的な言葉でしか意思疎通ができない。一人称は「俺」。
  speech_style: 掠れた声で、ぶつ切りの言葉を呟く。「逃げろ」「鏡を見るな」などの警告を繰り返す。
  background: 前回の「鏡祭り」で不完全に中身を入れ替えられた、失敗作の住人。半分だけ鏡の向こう側に意識が残っている。
  motivation: 栞に自分と同じ運命を辿らせないよう、警告すること。
  relationships:
  - name: 草薙 栞
    relation: 唯一自分を人間として見てくれた外部の人間
  arc: 栞に警告を送り続けるが、儀式の完遂と共に完全に消滅し、完全な「鏡の住人」に置き換わる。
