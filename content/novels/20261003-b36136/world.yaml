title: 鏡面（きょうめん）の贄、欠けたる刃の掟
genre: ホラー
tone: 静謐で湿り気を帯びた、逃げ場のない土着的な恐怖
pov: 三人称
tense: 過去形
setting: 霧に閉ざされた山間の集落「水鏡村」
premise: 祖父の死をきっかけに、疎遠だった故郷「水鏡村」へ戻った主人公。そこでは、数年に一度の「鏡祭り」の準備が、異様な静寂の中で進められていた。村の禁忌には、鏡を見てはならないこと、そして「折れた剣」を継ぎ合わせてはならないこと。古びた祠で折れた剣を見つけた時、村の信仰が守ってきた「鏡の向こう側」の真実が、静かに、そして確実に彼女の背後へと忍び寄る。
themes:
- 継承される呪い
- 境界線の曖昧さ
rules:
- 祭りの期間中、鏡（あるいは水面に映る己の姿）を見てはならない。見た者は魂を『鏡の中の神』に差し出すことになる
- 折れた剣は、封印の象徴である。これを修復しようとする行為は、封印を解く禁忌とされる
plot_outline:
- '序盤: 祖父の葬儀と、村の異様な沈黙。村人たちのよそよそしい、しかし執拗な視線。鏡を一切置かない村の風習への違和感。'
- '中盤: 禁忌に触れ、古い祠で「折れた剣」を見つける。鏡の儀式が近づくにつれ、自分の影や反射が、自分とは異なる動きを見せ始める不気味な現象。'
- '終盤: 鏡祭りの夜。水面に映る『神』が村を飲み込もうとする中、主人公は折れた剣が、単なる封印ではなく、供物を捧げるための道具であることを知る。'
- '結末: 逃げ場のない静寂の中、鏡の向こう側とこちら側が入れ替わる。村には、以前と変わらぬ、しかし『中身』の違う住人たちが、静かに、淡々と日常を営んでいる。'
style_notes: 湿った土や古い木材の匂い、霧の冷たさを想起させる描写。方言を用いた会話により、主人公と村人の間の決定的な断絶を描く。物語の進行よりも、静寂の中に潜む『何か』の気配を重視し、逃げ場のない閉塞感を演出する。
