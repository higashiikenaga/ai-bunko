- name: 源次
  role: 主人公
  age: 26
  gender: 男性
  appearance: 日焼けした逞しい体躯、常に職人の法被を羽織っている。目は爛々としていて活気がある。
  personality: お節介で情に厚く、困っている者を見過ごせない。一人称は「俺」。
  speech_style: 威勢の良い江戸っ子口調。「〜じゃねえか」「〜だろ」といったべらんめえ調。
  background: 深川の長屋に住む腕の良い大工。長屋の住人たちからは頼りにされているが、口うるさすぎると言われることもある。
  motivation: 騒動に巻き込まれた双子の兄弟と、平穏な長屋の日常を守ること。
  relationships:
  - name: 清次
    relation: 友人
  - name: 慎次
    relation: 友人
  arc: 単なる騒ぎ好きのお節介焼きから、大切な人の絆を命懸けで守る真の仲間へと成長する。
- name: 清次
  role: 主要人物（双子の兄）
  age: 20
  gender: 男性
  appearance: 整った顔立ちで、常に人当たりの良い笑みを浮かべている。身なりは清潔感がある。
  personality: 陽気で口達者、世渡り上手。商売上手だが、どこか寂しげな瞳をしている。一人称は「私」。
  speech_style: 流暢で軽快な話し方。相手を煙に巻くような、巧みな言葉選びをする。
  background: 町外れで古本屋を営む。幼い頃に離れ離れになった弟・慎次との再会を、本を通じて果たした。
  motivation: 古本屋を守り抜き、弟との平穏な日々を維持すること。
  relationships:
  - name: 慎次
    relation: 弟
  - name: 源次
    relation: 友人
  arc: 言葉で全てを解決しようとする虚勢を捨て、仲間を信じて素直に助けを求めるようになる。
- name: 慎次
  role: 主要人物（双子の弟）
  age: 20
  gender: 男性
  appearance: 色白で細身。常に古書を抱えているか、読んでいる。静かな佇まい。
  personality: 寡黙で理知的。書物への情熱が人一倍強く、一度集中すると周りが見えなくなる。一人称は「私」。
  speech_style: 短く、的確で落ち着いた話し方。感情の起伏が言葉に出にくい。
  background: 清次と共に古本屋を切り盛りする。知識担当として、古書の鑑定や解読を担っている。
  motivation: 本に刻まれた真実を守ること、そして兄との絆を証明すること。
  relationships:
  - name: 清次
    relation: 兄
  - name: 源次
    relation: 友人
  arc: 書物の中の知識だけでなく、生身の人間が持つ「情」の尊さを理解し、心を開いていく。
- name: 蔵田 宗次郎
  role: 敵役
  age: 42
  gender: 男性
  appearance: 鋭い眼光と、隙のない身なり。常に冷徹な空気を纏っている。
  personality: 冷酷で目的のためには手段を選ばない。権力への忠誠心が極めて高い。一人称は「私」。
  speech_style: 威圧的で、尊大な武士の言葉遣い。有無を言わせぬ重みがある。
  background: 大名家の機密を守るために送り込まれた、幕府の密偵に近い立場にある役人。
  motivation: 大名の不名誉を記した「禁書」を回収し、証拠を完全に抹消すること。
  relationships:
  - name: 清次
    relation: 追跡対象
  - name: 慎次
    relation: 追跡対象
  arc: 理屈と権力で全てを抑え込もうとするが、長屋の人々の理屈を超えた絆に敗北する。
