title: 江戸長屋・古書屋双子伝
genre: 歴史・時代小説
tone: 軽快で賑やかな江戸の市井情緒。べらんめえ口調が飛び交う人情味溢れる雰囲気。
pov: 三人称
tense: 過去形
setting: 江戸時代後期、深川の長屋界隈。
premise: 深川の長屋に住むお節介焼きの職人・源次。ある日、町外れに店を構えた風変わりな双子の古本屋兄弟が、ある「禁書」を巡って厄介事に巻き込まれる。源次は長屋の仲間と共に、不器用な兄弟を助けるために奔走する。本への情熱と、血縁を超えた人情が交錯する賑やかな物語。
themes:
- 家族の絆
- 本の魅力
- 江戸の共同体意識
rules:
- 身分制度が存在するが、長屋の中では平等に近い付き合いであること
- 古本屋の双子は片方が店番、片方が蔵書管理という役割分担を徹底していること
- 季節の行事と食文化を物語の転換点に配置すること
plot_outline:
- '序盤: 深川の長屋に住む源次が、町に現れた双子の古本屋兄弟と知り合う。一人は陽気で口達者に、もう一人は寡黙な書い虫という対照的な二人だった。'
- '中盤: 兄弟が扱う一冊の古書に、ある大名家の隠し事に関する記述があることが判明し、刺客や役人が店に押し寄せる。源次と長屋の連中が、機転と喧嘩腰の度胸で彼らを追い払う。'
- '終盤: 双子の兄弟が実は幼い頃に離れ離れになっていた過去があり、本を通じて再会したという切ない事情が明かされる。彼らが本当に守りたかったのは本ではなく、互いの絆であったことが分かる。'
- '結末: 騒動が収まり、長屋の皆で初夏の冷やし蕎麦と天ぷらを囲んで祝杯を挙げる。双子の店は地域に愛される名店となり、源次の口うるさいお節介が今日も店に響き渡る。'
style_notes: べらんめえ口調の会話文を多用し、テンポ良く展開させる。長屋の喧騒や、季節の食材（冷やし蕎麦など）の描写にこだわり、江戸の空気感を再現。最後は涙を誘う人情話で締めくくる。
