- name: 一ノ瀬 遥希
  role: 主人公
  age: 17
  gender: 男性
  appearance: 平凡な外見だが、配信中はヘッドセットを着用し、少しだけ自信ありげな表情になる。目の下に軽い隈がある。
  personality: 誠実で思慮深い。現実の世界では控えめだが、ネット上では聞き上手な配信者として信頼されている。一人称は「僕」。
  speech_style: 丁寧だが親しみやすい口調。リアルでは少し言葉に詰まる癖がある。
  background: 地方都市の高校生。退屈な日常を埋めるためにゲーム実況と雑談配信を始めており、画面越しの繋がりを心地よく感じている。
  motivation: ナギが残す「デジタル遺言」の謎を解き、彼女が消えてしまう前に、画面の外側にいる彼女を繋ぎ止めたい。
  relationships:
  - name: 白崎 ナギ
    relation: 憧憬と救済の対象
  - name: 神崎 空
    relation: 幼馴染で配信活動の協力者
  arc: 画面越しの安全な関係に甘んじていたが、ナギへの想いを通じて、傷つくリスクがあっても現実で行動する強さを得る。
- name: 白崎 ナギ
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 儚げで透明感のある美少女。季節ごとに髪型や服装を微調整し、異なるアイデンティティを演出している。
  personality: 内向的で寂しがり屋だが、それを隠すために冷淡に振る舞う。詩的な感性を持ち、完璧な「終わり」に美学を感じている。一人称は「私」。
  speech_style: 簡潔で比喩表現が多い。SNSでは情緒的な文章を書くが、口数は少ない。
  background: 親の転勤で数年おきに住む街を変えてきた。どこにも居場所がない絶望から、ネット上でもアカウントを捨てて自分をリセットし続ける習慣がついた。
  motivation: 誰にも見つからずに消えることで、自分という存在の純粋さを保ちたい。同時に、誰か一人にだけは「本当の自分」を見つけてほしいと願っている。
  relationships:
  - name: 一ノ瀬 遥希
    relation: 自分の正体に近づこうとする唯一の観測者
  arc: 「消えること」で自分を守っていたが、遥希の執念に触れ、不完全なままでも誰かと繋がって生きていく勇気を持つ。
- name: 神崎 空
  role: 相棒/脇役
  age: 17
  gender: 女性
  appearance: 明るい茶髪のショートボブ。流行のファッションに敏感で、常に最新のスマートフォンを手にしている。
  personality: 快活で現実主義。社交的で、ネットの盛り上がりを「数字」として冷静に分析できる。一人称は「あたし」。
  speech_style: テンポが速く、現代的な若者言葉を多用する。遠慮のない直球な物言い。
  background: 遥希の幼馴染。地元の小規模なインフルエンサーであり、遥希の配信の機材設定やトレンド分析などをサポートしている。
  motivation: 遥希がネットの世界に没入しすぎて現実を疎かにすることを危惧し、彼を現実の世界へ引き戻そうとする。
  relationships:
  - name: 一ノ瀬 遥希
    relation: 世話を焼きたくなる親友
  - name: 白崎 ナギ
    relation: 興味深いネット上の謎人物
  arc: 効率や数字を重視する価値観から、理屈では説明できない「情熱」や「執着」の価値を認めるようになる。
