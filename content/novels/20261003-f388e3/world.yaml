title: スクリーン越し、君は渡り鳥のように
genre: 青春恋愛
tone: 軽快かつ切ない、デジタル・ノスタルジー
pov: 一人称（ボク）
tense: 現在形と過去形の混在
setting: 現代、地方都市とSNS空間
premise: ネット上に「消える直前のメッセージ」を遺す少女・ナギと、配信者のボクの物語。彼女は季節とともに居場所を変える渡り鳥のように、アカウントを捨てては新しい自分へと「リセット」を繰り返す。ある日、彼女が残した「デジタル遺言」を巡って、ボクは画面の向こう側にいる彼女の、たった一つの「真実」を追い始める。
themes:
- デジタルとリアルの境界
- 孤独な移動者
- 通信の残響
rules:
- ナギは定期的にSNSアカウントを削除し、新しいアイデンティティへ移行する
- 彼女の「遺言」は、特定の場所とハッシュタグが組み合わさった時のみ閲覧可能になる
- 物語の感情の変化は、SNSのトレンドやコメント欄の反応として同期される
plot_outline:
- '序盤: 配信中のボクの前に、謎のユーザー『Nagi』が現れる。彼女の投稿はどれも美しく、どこか『終わり』を予感させるものばかりだった。'
- '中盤: 彼女が残す『遺言』の断片を辿るうちに、ボクは彼女が渡り鳥のように各地を転々とする少女だと知る。SNSでの盛り上がりと、ボクが感じるリアルな喪失感のギャップ。'
- '終盤: ナギがネットから完全に消えるという『最終遺言』を投稿。ボクは画面越しではなく、彼女が次に降り立つはずの場所へ、現実の足を動かして走り出す。'
- '結末: 物理的な再会。デジタルなログは消えても、二人の間に刻まれた『熱』は消えない。新しいアカウントではなく、新しい関係を築くための第一歩。'
style_notes: 「ボク」による、スピード感あふれる軽快な一人称。メタ的なツッコミ（「はい、ここでフラグ回収」等）を多用し、チャットログ、SNSのタイムライン、ライブ配信のコメント欄を地の文にシームレスに組み込むことで、情報の断片から物語を体験させる構成。
