- name: エリアン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 使い古された旅人の外套を纏い、常に分厚い記録帳を携帯している。穏やかな垂れ目の青年。
  personality: 好奇心旺盛で、日常の些細な美しさを愛する。慎重だが、未知の味や文化への探究心に抗えない。一人称は「僕」。
  speech_style: 丁寧で物静か。感嘆詞が多く、相手への敬意を忘れない話し方。
  background: 特定の国に属さず、各地の風習や料理を記録して回る放浪の記録術師。孤独を好むが、人への信頼は厚い。
  motivation: 古びた航海日誌の謎を解き、失われた文明の記憶と、そこに眠る「究極の味」を見つけること。
  relationships:
  - name: ライラ
    relation: 航海を共にする信頼できるパートナー
  - name: サイラス
    relation: 運命的な地図を譲り受けた恩人であり導き手
  arc: ただの記録者として世界を眺めていたところから、自らが歴史の断片を繋ぎ合わせ、記憶を継承する当事者へと成長する。
- name: ライラ
  role: 相棒
  age: 19
  gender: 女性
  appearance: 短く切り揃えた青い髪に、飛行ゴーグルを額にかけている。機能的なパイロットスーツを着用。
  personality: 快活で現実主義。直感的で行動力が高いが、実は寂しがり屋な一面がある。一人称は「私」。
  speech_style: ハキハキとしていて快調。時折、航海士特有の専門用語やスラングが混じる。
  background: 霧の海を自在に操る小型艇の操縦士。最高の風を追い求める自由人だが、ある目的で海底遺跡の情報を探していた。
  motivation: 霧の海の果てにあるという伝説の「静止した風」を見つけ、自分の操縦技術を証明すること。
  relationships:
  - name: エリアン
    relation: 正反対な性格ながら、価値観を認め合う旅の仲間
  arc: 効率と目的のみを重視していたが、エリアンと共に旅をすることで、寄り道や「無駄な時間」に宿る豊かさに気づく。
- name: サイラス
  role: 脇役
  age: 55
  gender: 男性
  appearance: モノクルを着用し、ベルベットのベストを纏った細身の男性。常に不思議な香りの茶を飲んでいる。
  personality: 飄々としており、掴みどころがない。博識で、世界の裏側にある真実を多く知っている。一人称は「私」。
  speech_style: 優雅で比喩表現が多く、答えを直接的に教えない謎めいた言い回し。
  background: 雨の日だけ開く不思議な店の店主。「忘れ物」を管理し、それを必要とする人物へ届ける役割を担っている。
  motivation: 海底遺跡に眠る記憶を適切に引き継げる「器」となる旅人を導き出すこと。
  relationships:
  - name: エリアン
    relation: 導いた弟子のような存在
  arc: 静かに店を切り盛りしていたが、エリアンの旅を通じて、自らが封印していた過去の記憶と向き合い、次世代へ託す決心をする。
- name: タラッサ
  role: 守護者
  age: 1000
  gender: 女性
  appearance: 真珠のような白い肌に、水のように揺らめく半透明の衣を纏った神秘的な女性。瞳に星のような光が宿っている。
  personality: 慈愛に満ちており、静謐。長い年月を孤独に過ごしたため、純粋に外の世界への憧れを抱いている。一人称は「我」。
  speech_style: 古風で詩的な口調。ゆっくりとしたテンポで、響きの心地よい言葉を選ぶ。
  background: 海底遺跡の守護者であり、滅びた文明の人々が遺した「祈り」と「記憶」を形にして管理し続けている存在。
  motivation: 誰かに思い出してもらうことで、記憶を風化させずに未来へ繋げること。
  relationships:
  - name: エリアン
    relation: 記憶の継承者として受け入れる相手
  arc: 永遠の孤独の中で役割を果たすだけだったが、エリアンとの交流により、記憶を「保持」するのではなく「共有」することの喜びを知る。
