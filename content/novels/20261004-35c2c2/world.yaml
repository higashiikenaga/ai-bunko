title: 星霜の航路と、鏡に映る約束の丘
genre: 異世界ファンタジー
tone: 穏やかで叙情的、色彩豊かな冒険譚
pov: 一人称（僕）
tense: 過去形
setting: 前作の航海を経て、空と海が溶け合うように広がる「浮遊大陸と群島の世界」
premise: 砕け散った真珠の結晶の代わりに、僕の胸には「明日への予感」が灯っている。アステリア号を駆る僕とライラの旅は、海底の記憶を超え、今度は星々が地上に降り注ぐという伝説の地へと向かう。道中、僕たちは世界の境界を映し出すという不思議な「鏡の湖」に辿り着き、そこでかつて交わしたはずのない、ある大切な約束の記憶に触れることになる。失われた文明の残滓ではなく、今を生きる人々が紡ぐ、新しい物語を探す旅だ。
themes:
- 記憶の再構築と再生
- 約束の重みと自由
rules:
- 天候の変化が世界の境界（レイヤー）の重なり具合を左右する
- 鏡面は、見る者の心の純度によって映し出す景色を変える
- 料理には、その土地の「気候の記憶」が味として宿る
plot_outline:
- '序盤: アステリア号は穏やかな海を越え、雲海の上に浮かぶ「星降る島々」へと到達する。そこで僕たちは、雲の切れ間に見える「約束の丘」の噂を聞き、新しい土地の風習である『星屑の祝祭』と、その土地特有の甘い果実を使った蒸し菓子を味わう。'
- '中盤: 航海の途上、巨大な鏡のような水面を持つ「鏡の湖」に遭遇する。そこでは空の星々が水面に反射し、現実と鏡像が入り混じっていた。ライラは鏡の中に、かつてタラッサが守ろうとした「静止した時間」の断片を見てしまい、僕たちは鏡の迷宮へと足を踏み入れる。'
- '終盤: 鏡の迷宮の最深部で、僕たちは「約束の丘」が単なる伝説ではなく、過去の旅人たちが未来へ託した想いの集積地であることを知る。鏡に映る自分自身の影と対峙し、過去の執着を捨て、不確実な未来を共に歩む決意を新たにする。'
- '結末: 丘から眺める景色は、鏡のように澄み渡っていた。僕たちは新たな航海図を書き加え、ライラと一緒に、まだ見ぬ味と風景を求めて、地平線の向こうへと帆を上げる。'
style_notes: 「僕」の一人称による旅日記形式。風景描写は、光の粒子や風の匂い、波の音を丁寧に綴るように。各章の冒頭や道中で、その土地の料理（食感や香り）や、人々のささやかな習慣を、旅の思い出として慈しむように描写すること。
