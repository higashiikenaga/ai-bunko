- name: エリオス・ヴァレンタイン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 灰色の髪に意志の強い碧眼。使い込まれた聖騎士の軽装鎧を纏い、背には折れた聖剣の破片を刻んだ鞘を背負っている。
  personality: 真面目で責任感が強く、自己犠牲的な側面を持つ。正義感に突き動かされるタイプ。一人称は「僕」。
  speech_style: 丁寧だが、決意を語る際は力強く、迷いのない口調になる。
  background: 聖騎士の血を引く末裔として、砂漠の廃墟で眠っていたところを予言の書と共に目覚めた。
  motivation: 崩壊しつつある世界の理を再起動させ、人々の生存の基盤を取り戻すこと。
  relationships:
  - name: セレスティア
    relation: 旅の同行者であり、世界の真実を教える導き手
  - name: ゼロス・ヴォイド
    relation: 世界の在り方を巡って対立する宿敵
  arc: 運命に翻弄される一人の青年から、自らの記憶という最大の代償を払って新しい世界の夜明けを切り拓く英雄へと成長する。
- name: セレスティア
  role: 相棒
  age: 不詳（外見は20代前半）
  gender: 女性
  appearance: 月光のように輝く銀髪と、神秘的な淡い紫の瞳。かつての神の代行者の名残を感じさせる、透き通るような装束を纏う。
  personality: 冷静沈着で知性的。世界の理に詳しいが、時折、過ぎ去った時代への深い孤独を覗かせる。一人称は「私」。
  speech_style: 優雅で落ち着いた、どこか古風な敬語を用いる。
  background: かつて神の意志を伝達していた没落した精霊。世界の摩耗と共に力を失い、記憶も断片化している。
  motivation: エリオスを儀式へと導き、世界の理を再構築させ、自らも存在の終焉を見届けること。
  relationships:
  - name: エリオス
    relation: 守るべき対象であり、新たな世界の希望を見出す存在
  arc: 過去の栄光と失われた神々の時代に縛られた存在から、魔法の消えた新しい世界の価値を肯定する存在へと変化する。
- name: ゼロス・ヴォイド
  role: 敵役
  age: 45
  gender: 男性
  appearance: 虚無を象徴するような漆黒の法衣。顔の半分は影に覆われており、瞳には一切の光が宿っていない。
  personality: 徹底した虚無主義者。世界の苦しみは存在そのものが原因であると考え、消滅を究極の救済と捉えている。一人称は「我」。
  speech_style: 低く、地響きのように重々しく、相手を威圧するような話し方。
  background: 神の死後、理の崩壊によって大切なもの全てを失った元聖職者。虚無の教団を率い、世界の消滅を目論む。
  motivation: 全ての存在を無に帰し、苦痛も変化も存在しない完全なる静寂をもたらすこと。
  relationships:
  - name: エリオス
    relation: 世界の存続を阻み、不条理な希望を掲げる排除すべき対象
  arc: 破壊による救済という歪んだ信念を貫こうとするが、エリオスの自己犠牲的な意志に触れ、世界の新たな理の到来を突きつけられる。
