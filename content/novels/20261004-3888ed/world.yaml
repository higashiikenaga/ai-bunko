title: 星葬の挽歌と、黄金の静寂なる揺籃
genre: 異世界ファンタジー
tone: 荘厳かつ重厚。神話的な叙事詩の雰囲気
pov: 三人称
tense: 過去形
setting: 神々がとうの昔に死に絶え、世界の理が摩耗しつつある黄昏の大陸「エリュシオン」。空には砕けた月が浮かび、地上にはかつての聖域が砂に呑まれた広大な黄金の砂漠が広がっている。
premise: 神の死によって魔法と秩序が失われた世界で、かつての聖騎士の末裔である青年が、折れた聖剣の破片を携えて旅に出る。彼の目的は、砂漠の最果てにある伝説のオアシス「静寂なる揺籃」にて、世界の時間を巻き戻す禁忌の儀式を行うこと。しかし、その旅路には神の死骸から生まれた異形の怪物と、世界を完全に消滅させようとする虚無の教団が立ちはだかる。
themes:
- 喪失と再生
- 運命への抗い
rules:
- 魔法は「古神の詠唱」を再現することで発動するが、使用するたびに術者の記憶が代償として消えていく
- 折れた聖剣は、特定の聖域で「神の涙」を捧げることで一時的に元の姿を取り戻し、概念的な破壊力を得る
- 世界の崩壊速度は、生きている人間の「信仰心」の総量に反比例する
plot_outline:
- '序盤: 聖都の廃墟で眠っていた青年エリオスが、先祖から受け継いだ折れた聖剣と共に、世界を再起動させる予言の書を見つけ、旅立つ。'
- '中盤: 黄金の砂漠を横断し、記憶を失いながら魔法を駆使して数々の試練を乗り越える。道中で、かつての神の代行者であった没落した精霊と出会い、世界の真実を知る。'
- '終盤: 砂漠の最果てにあるオアシス「静寂なる揺籃」に到達するが、そこには世界を無に帰そうとする虚無の教団が待ち構えていた。エリオスは自らの全記憶を代償に聖剣を完全修復させ、絶望的な戦いに挑む。'
- '結末: 儀式は成功し、世界に新たな理がもたらされる。神々は戻らず、魔法も消え去ったが、人間が自らの足で歩む「真の夜明け」が訪れる。記憶を失ったエリオスが、名もなき旅人として新しい世界を歩き出すシーンで幕を閉じる。'
style_notes: 古風で格調高い語彙を選択し、地の文に重厚感を持たせる。特に風景描写や歴史的背景の説明においては、あたかも古文書を読み解くかのような叙事詩的表現を用いること。物語の節目に、作中に登場する架空の聖典や民謡の一節を引用し、世界観の奥行きを演出する。キャラクターの台詞は、身分や種族に応じて厳格に書き分け、特に高位の存在には古風な敬語や傲岸な口調を徹底させる。
