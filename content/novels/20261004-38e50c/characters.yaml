- name: 瀬戸 陽葵
  role: 主人公
  age: 24
  gender: 女性
  appearance: 色白で華奢な体格。冬の街に馴染むオーバーサイズのニットと長いマフラーを身に纏っている。どこか心ここにあらずといった、儚げな瞳が特徴。
  personality: 内向的で思慮深く、変化を恐れる傾向がある。一人称は「わたし」。喪失感の中にあり、自分の人生の方向性を見失っている。
  speech_style: 丁寧で控えめ。言葉を慎重に選んで話すため、間が空きやすい。
  background: 都会の大学を卒業後、就職したが人間関係に疲れ、祖父の死を機に故郷の海辺の街に戻ってきた。幼い頃、自由奔放だった祖父に憧れていた。
  motivation: 祖父が遺した地図の謎を解き明かすことで、止まってしまった自分の時間を動かし、生きる意味を見つけ出したい。
  relationships:
  - name: 瀬戸 耕造
    relation: 祖父。精神的な導き手
  - name: 凪原 湊
    relation: 地元の協力者。次第に信頼を寄せる相手
  arc: 静止した絶望と孤独の中にいたが、祖父の足跡を辿る旅を通じて、不完全な人生を受け入れ、自らの足で未来へ歩き出す勇気を得る。
- name: 凪原 湊
  role: 相棒
  age: 26
  gender: 男性
  appearance: 日焼けした肌に快活な笑顔。機能的なアウトドアウェアや漁師風の服装が多く、常に使い古した双眼鏡を首から下げている。
  personality: 直感的で楽観的。世話焼きで正義感が強い。一人称は「俺」。自然を愛し、今この瞬間を生きることを大切にしている。
  speech_style: 飾らない口調。北国の訛りが少し混じる、明るく快活な話し方。
  background: 地元の漁師でありながら、地域の自然ガイドとしても活動している。学生時代、変わり者として知られた耕造に自然観察を教わった弟子のような関係。
  motivation: 恩師である耕造が最後に見た景色を、陽葵と共に分かち合いたい。また、街の静止した空気に新しい風を吹き込みたい。
  relationships:
  - name: 瀬戸 陽葵
    relation: 旅の同行者。危なっかしい彼女を放っておけない
  - name: 瀬戸 耕造
    relation: かつての師であり、尊敬する大人
  arc: 単なる「親切なガイド」から、陽葵の痛みに共感し、共に喪失を乗り越えるパートナーへと成長する。
- name: 瀬戸 耕造
  role: 物語の核（故人）
  age: 78
  gender: 男性
  appearance: 深く刻まれた笑い皺と、好奇心に満ちた鋭い眼光。いつも使い込まれたフィールドジャケットを着ていた。
  personality: 風変わりで自由奔放。自然への深い敬意と愛情を持つ。一人称は「私」。表向きは気さくだが、心の一角に誰にも言えない孤独と願いを秘めていた。
  speech_style: 朗らかで説教臭くない、物語を語るような心地よい話し方。
  background: 元小学校教師。定年後、渡り鳥の生態調査に没頭し、地図に載っていない小さな聖域を探索し続けた。陽葵にとって唯一、自分を肯定してくれた大人だった。
  motivation: 自分が愛した自然の美しさと、ある「秘密の場所」の記憶を、次世代に引き継がせること。
  relationships:
  - name: 瀬戸 陽葵
    relation: 最愛の孫娘
  - name: 凪原 湊
    relation: 教え子であり、気心の知れた友人
  arc: 物語を通じて、彼が隠していた「本当の願い」と、人生における後悔と救済が明かされていく。
- name: 志乃
  role: 脇役/鍵を握る人物
  age: 72
  gender: 女性
  appearance: 銀色の髪を低く結い、シンプルなリネンのエプロンを身に着けている。静謐な佇まいで、見る者に安心感を与える。
  personality: 穏やかで忍耐強い。洞察力に優れ、相手の心の機微を敏感に察する。一人称は「私」。
  speech_style: ゆっくりとした口調。比喩表現を多く使い、詩的な言い回しを好む。
  background: 街の片隅で小さな古本屋兼カフェを営む。耕造とは若かりし頃、ある共通の目的で行動を共にした過去があるが、ある事情で道を分かれた。
  motivation: 耕造が陽葵に伝えたかったメッセージを、適切なタイミングで彼女に伝え、物語を完結させること。
  relationships:
  - name: 瀬戸 耕造
    relation: かつての同志であり、人生の忘れ物のような存在
  - name: 瀬戸 陽葵
    relation: 耕造に似た面を持つ、導くべき若者
  arc: 陽葵が旅を完遂する姿を見ることで、自分自身が長年抱えていた耕造への複雑な想いに区切りをつけ、心の平安を得る。
