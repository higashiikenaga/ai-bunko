title: 冬の渡り鳥、地図なき空をゆく
genre: ヒューマンドラマ
tone: 静謐、繊細、哀愁
pov: 一人称（わたし）
tense: 過去形
setting: 現代、北国の海辺にある古い灯台の街
premise: 祖父の遺品の中から、見慣れない海岸線が描かれた「秘密の地図」を見つける。それは、かつて祖父が渡り鳥を追って旅した、地図には載っていない場所へと続くものだった。わたしは、止まったままの時間を動かすように、地図の行方を辿り始める。冷たい海風と、冬の淡い光に導かれ、失われた記憶の断片を拾い集めていく。
themes:
- 継承
- 喪失と再生
- 目に見えない繋がり
rules:
- 地図の場所は物理的な地理ではなく、個人の記憶と結びついた特定の情景を指す
- 渡り鳥の飛来は、季節の移ろいと人の心の変化を象徴する
plot_outline:
- '序盤: 祖父の四十九日を終え、静かな海辺の家で一人過ごすわたし。埃の舞う書斎で、手書きの奇妙な地図を見つける。そこには、渡り鳥の移動経路のような曲線が描かれていた。'
- '中盤: 地図を頼りに、祖父が愛した古い場所を訪ね歩く。冬の低い陽光が照らす廃校、波音だけが響く岬。各地で、祖父がかつて誰かと交わした言葉の断片に触れていく。'
- '終盤: 地図の終着点は、地図には書かれていない、ある小さな入り江だった。そこには、渡り鳥が羽を休める静かな水辺があった。祖父が隠し続けていた、本当の願いを知る。'
- '結末: 春の気配が混じる風が吹く。わたしは地図を閉じ、新しい季節へと歩き出す。空には、次の旅路へ向かう鳥たちの影が揺れていた。'
style_notes: 短い文章を積み重ね、余白を意識すること。情景描写には必ず光の加減や季節の空気感を含める。感情を直接的な言葉で説明せず、例えば「雨の匂い」や「窓に映る影」に託して表現する。感嘆符は避け、静かな独白のような語り口を維持する。
