- name: 如月 蓮（きさらぎ れん）
  role: 主人公
  age: 27
  gender: 男性
  appearance: 常に薄汚れた調律師用の作業着を纏い、気象観測用の多機能ゴーグルを首にかけている。無精髭があり、常に睡眠不足を感じさせる隈のある瞳をしている。
  personality: 冷静沈着で論理的だが、内面には世界の不条理に対する静かな憤りを持つ。一人称は「僕」。
  speech_style: 簡潔で事務的な口調。感情の起伏が乏しい。
  background: 海面上昇後の浮遊都市で、気象制御システム「アトモス・シェル」の微細な不具合を修正する技術者として育った。規則に従うことに慣れきった生活を送っていた。
  motivation: 当初はシステムの正常稼働という職務のためだったが、次第に世界の真実と「予測不可能な生」を取り戻すことに変わる。
  relationships:
  - name: エララ・ヴェイン
    relation: 謎の案内人
  - name: サトウ・マヤ
    relation: 潜航任務の相棒
  - name: サイラス・ソーン
    relation: 対立する管理者
  arc: システムの「エラー」を排除するだけの存在から、自らがシステムの「特異点」となり、予測不能な未来を肯定する存在へと変貌する。
- name: エララ・ヴェイン
  role: 脇役（導き手）
  age: 35
  gender: 女性
  appearance: 雨の日にだけ現れる古書店の店主。現代の合成繊維とは異なる、古い時代の天然素材で作られたドレスを纏っている。透き通るような白い肌を持つ。
  personality: 穏やかで達観しており、どこか浮世離れしている。一人称は「私」。
  speech_style: 丁寧で古風な言い回し。予言めいた抽象的な表現を好む。
  background: 特定の降雨条件下でのみ空間位相が重なる「古書店」の主。彼女の正体は、演算都市から送られてくる過去の記憶の断片、あるいはその投影体である可能性がある。
  motivation: 失われた人類の意志を、適切なタイミングで「鍵」となる人物へ託すこと。
  relationships:
  - name: 如月 蓮
    relation: 運命の継承者
  arc: 物語の導入部において、主人公を日常から非日常（深海）へと誘う触媒としての役割を果たす。
- name: サイラス・ソーン
  role: 敵役
  age: 55
  gender: 男性
  appearance: 非の打ち所がないほど整えられた白の管理官制服を着用。鋭い眼光と、一切の無駄がない立ち居振る舞い。
  personality: 徹底した功利主義者。秩序と安定こそが人類の生存条件であると信じている。一人称は「私（わたくし）」。
  speech_style: 威圧的で冷徹。論理の隙を与えない完璧な敬語を使用する。
  background: アトモス・シェル管理局の最高責任者。システムの崩壊を防ぐためなら、個人の犠牲や歴史の改竄も厭わない。
  motivation: 演算都市の力を利用して、個人の意志を排除した「完璧に管理された停滞した世界」を構築すること。
  relationships:
  - name: 如月 蓮
    relation: 秩序を乱す危険因子
  arc: システムの維持という名目のもと、主人公の「自由な未来」への渇望と真っ向から衝突する。
- name: サトウ・マヤ
  role: 相棒
  age: 24
  gender: 女性
  appearance: 短髪で、首筋や腕に神経接続用のインターフェース・ポートが並んでいる。動きやすさを重視した潜水用スーツを着用。
  personality: 直感的で勇敢。理論よりも感覚を信じるタイプ。一人称は「私」。
  speech_style: 快活で砕けた話し方。専門用語を交えつつも、感情表現が豊か。
  background: 超高圧環境下での潜航技術に長けたプロのパイロット。かつて海に沈んだ文明への憧憬を抱いている。
  motivation: 未知の領域である「演算都市」を自分の目で確かめること。そして、蓮の決断を支えること。
  relationships:
  - name: 如月 蓮
    relation: 信頼するパートナー
  arc: 単なる技術的なサポート役から、蓮が自己を犠牲にする決断を下した際、その意志を世界へと繋ぐ「目撃者」となる。
