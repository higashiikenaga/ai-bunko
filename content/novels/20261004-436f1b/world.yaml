title: 浸食される座標と降雨の特異点
genre: SF
tone: 硬派、緻密、理知的
pov: 三人称
tense: 過去形
setting: 海面上昇により陸地の大部分が水没し、巨大な気象制御システム「アトモス・シェル」による環境維持に依存して生存している近未来の地球。
premise: 気象制御の不具合を修正する調律師の主人公は、特定の降雨条件下でのみ空間位相が重なり出現する謎の古書店に出会う。店主から渡された古びた座標は、超深海に沈む「演算都市」への入り口を示していた。そこは人類がかつて捨てた、物理法則を再定義するための巨大な生体計算機であった。
themes:
- 記憶の継承
- エントロピーと秩序
rules:
- 気象制御システム『アトモス・シェル』が停止すれば、大気組成の変化により人類は数時間以内に絶滅する
- 特定の降雨周波数と電離層の干渉が起こった瞬間のみ、隠蔽された空間（位相ズレ領域）へのアクセスが可能になる
- 海底遺跡内の演算装置は周囲の熱量を吸収して駆動するため、その周辺海域は恒久的な極低温状態にある
plot_outline:
- '序盤: 調律師の主人公が、雨の日だけ現れる店で『深海座標』を記した物理ログを入手し、その正体が失われた古代技術の鍵であることを突き止める。'
- '中盤: 超高圧耐性潜水艇を用いて海底遺跡へ潜航。そこがかつての文明が全人類の意識をバックアップし、最適解を演算し続けていた「演算都市」であることを知る。'
- '終盤: アトモス・シェルの根本的な設計寿命が尽きかけ、世界規模の気象崩壊が始まる。遺跡の演算能力を用いてシステムを再構築しようとするが、そのためには演算資源として個人の意識（記憶）を完全に統合させる必要がある。'
- '結末: 主人公は自らの個としての意識を代償にシステムにダイブし、世界に安定した気候と「予測不可能な未来」を取り戻す。'
style_notes: 物理学的・工学的考証に基づいた硬い文体。専門用語（例：カシミール効果、超臨界流体など）を、登場人物の会話や作業描写の中で具体的に定義し、読者に提示する。毎話、実在しそうな架空技術（例：量子位相同期アンカー、高密度プラズマ遮蔽膜など）を一つ設定し、その構造と動作原理を緻密に描写すること。
