- name: 佐伯 紬
  role: 主人公
  age: 16
  gender: 女性
  appearance: 華奢でどこか儚げな印象を与える少女。長く黒い髪を低めに結んでいる。瞳は観察力が高く、物事を深く見つめるような強さがある。
  personality: 内向的で思慮深く、感情をあまり表に出さない。周囲の変化に敏感。一人称は「私」。
  speech_style: 控えめで穏やかな口調。言葉を選びながら、静かに話す。
  background: 難病を抱える双子の妹・凪と共に、静かな日常を送ってきた。凪の病状悪化を目の当たりにし、言葉にできない焦燥感を抱えている。
  motivation: 失われていく凪との繋がりを、言葉以外の方法で繋ぎ止めたいと願う。
  relationships:
  - name: 佐伯 凪
    relation: 双子の妹
  - name: 佐伯 雫
    relation: 母
  - name: 佐伯 和真
    relation: 父
  arc: 凪の喪失という避けられない現実に対し、絶望の中で立ち止まるのではなく、猫という小さな存在を通じて、記憶と共生しながら生きていく強さを獲得していく。
- name: 佐伯 凪
  role: 重要人物
  age: 16
  gender: 女性
  appearance: 紬と瓜二つだが、病の影響で肌は透き通るように白く、体温を感じさせないほどに細い。瞳には常に澄んだ光が宿っている。
  personality: 天真爛漫で感受性が豊か。身体の自由を失いつつある中でも、心の輝きを失わない。一人称は「私」。
  speech_style: 病の進行と共に言葉が少なくなっていくが、声が出る時は詩的で優しい。
  background: 紬の双子の妹。進行性の難病により、身体の自由と発話能力を少しずつ失っている。
  motivation: 自分が消えていく恐怖よりも、家族や紬が自分を忘れてしまうこと、あるいは悲しみ続けることを恐れている。
  relationships:
  - name: 佐伯 紬
    relation: 双子の姉
  - name: 佐伯 雫
    relation: 母
  - name: 佐伯 和真
    relation: 父
  arc: 肉体的な衰えを受け入れ、言葉を失う代わりに「存在の温もり」を伝えることで、家族との精神的な別れを完成させていく。
- name: 佐伯 雫
  role: 脇役
  age: 42
  gender: 女性
  appearance: 疲れを隠すように常に穏やかな微笑みを浮かべている。清潔感のある、落ち着いた色の服を好む。
  personality: 献身的で忍耐強い。家族の平穏を守ることを最優先する、強さと脆さを併せ持つ女性。一人称は「私」。
  speech_style: 聞き手に安心感を与える、柔らかく包み込むような話し方。
  background: 二人の娘と夫を支える、家庭の精神的支柱。娘たちの介護と、崩れそうな家族の空気を繋ぎ止めることに全力を注いでいる。
  motivation: 娘たちが苦しみを感じることなく、穏やかな時間を過ごせるようにすること。
  relationships:
  - name: 佐伯 紬
    relation: 娘
  - name: 佐伯 凪
    relation: 娘
  - name: 佐伯 和真
    relation: 夫
  arc: 「母親として強くあらねばならない」という強迫観念から解放され、娘の死という喪失を、一人の人間として深く悼むことを許されるようになる。
- name: 佐伯 和真
  role: 脇役
  age: 45
  gender: 男性
  appearance: 仕事で使い込まれた、少し無骨な風貌。寡黙だが、その手は非常に温かく、力強い。
  personality: 現実主義者で、感情を表に出すのが苦手。言葉よりも行動で示そうとするタイプ。一人称は「俺」。
  speech_style: 短く、ぶっきらぼうだが、家族への慈しみを感じさせるトーン。
  background: 地方都市の会社に勤める。家族の経済と生活の基盤を支えるため、日々働き続けている。
  motivation: 家族が経済的な不安なく、最期まで穏やかに過ごせる環境を整えること。
  relationships:
  - name: 佐伯 紬
    relation: 娘
  - name: 佐伯 凪
    relation: 娘
  - name: 佐伯 雫
    relation: 妻
  arc: 逃避するように仕事に没頭していたが、凪の死をきっかけに、言葉にできなかった自身の深い悲しみと向き合い、家族の痛みを共有する道を見出す。
