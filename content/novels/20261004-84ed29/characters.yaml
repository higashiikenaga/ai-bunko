- name: 慎之助
  role: 主人公
  age: 28
  gender: 男性
  appearance: 痩身で鋭い眼差しを持つ浪人。使い古された藍色の着物を纏い、質素ながら手入れの行き届いた一振りの打刀を帯びている。
  personality: 寡黙で忠義心が強い。自分を律することに長けているが、内面には激しい情熱を秘めている。一人称は「俺」。
  speech_style: 簡潔でぶっきらぼうだが、礼節を忘れない武士言葉。
  background: かつてある藩の精鋭剣客であったが、主君の失脚と共に浪人となった。主君から託された不可解な遺言状を解くため、「忘却の市」へ足を踏み入れる。
  motivation: 主君の記憶を取り戻し、遺言状に込められた真意を完遂すること。
  relationships:
  - name: 狂乱
    relation: 宿敵
  - name: 市街の主
    relation: 取引相手
  - name: 紗代
    relation: 案内人
  arc: 主君への忠誠という「縛り」に生きる男が、記憶を失い空虚になる過程で、肩書きや過去に依存しない「個」としての意志に目覚める。
- name: 狂乱
  role: 敵役
  age: 不詳（外見は30代）
  gender: 男性
  appearance: 時代や流派が混在した贅沢な装束を身に纏う。瞳の色が時折変化し、複数の剣術の癖が混ざり合った異様な構えを持つ。
  personality: 傲慢で虚無的。強さへの飽くなき執着を持つが、同時に全てを手に入れた絶望感に苛まれている。一人称は「私」。
  speech_style: 優雅で詩的だが、相手を見下す冷酷な口調。
  background: かつては凡庸な剣客だったが、「忘却の市」で他者の剣技の記憶を買い集め、喰らうことで無敵の力を得た怪物的な剣客。
  motivation: 世界中のあらゆる剣技を蒐集し、究極の一撃を完成させること。
  relationships:
  - name: 慎之助
    relation: 興味深い獲物
  - name: 市街の主
    relation: 最大の顧客
  arc: 数千の記憶という「偽物の積み重ね」で得た強さが、記憶を捨てて一点に集中した慎之助の「純粋な意志」に敗北し、自身の空虚さを悟る。
- name: 市街の主
  role: 脇役（中立）
  age: 不詳
  gender: 中性
  appearance: 顔の上半分を透ける薄布で覆い、目のような模様が散りばめられた豪奢な着物を着ている。常に煙管をくゆらせている。
  personality: 計算高く、快楽主義的。人間が絶望して記憶を切り売りする様を娯楽として楽しんでいる。一人称は「わらわ」。
  speech_style: なぞなぞのような言い回しが多く、相手を翻弄する話し方。
  background: 異界「忘却の市」を統べる管理者。記憶を貨幣として扱い、現世と異界の均衡を保っている。
  motivation: 市場の繁栄と、予測不能な人間ドラマを特等席で観劇すること。
  relationships:
  - name: 慎之助
    relation: 面白い取引相手
  - name: 狂乱
    relation: 便利な道具」
  arc: 慎之助が代価として差し出した「大切な記憶」の価値に触れ、効率や取引では測れない人間の情愛というものにわずかな関心を抱く。
- name: 紗代
  role: 相棒
  age: 20歳前後
  gender: 女性
  appearance: 白い小袖に身を包んだ、儚げな印象の少女。記憶の断片を灯す不思議な提灯を常に持ち歩いている。
  personality: 穏やかで献身的だが、どこか諦念を漂わせている。一人称は「私」。
  speech_style: 静かで控えめな口調。
  background: かつて市に記憶を売りすぎたため、名前以外のほとんどの自己を失った「記憶の抜け殻」。現在は市の案内人として働いている。
  motivation: いつか自分自身の本当の記憶を見つけ、人間として消滅すること。
  relationships:
  - name: 慎之助
    relation: 共感し合う旅の同行者
  - name: 市街の主
    relation: 雇い主
  arc: 慎之助が記憶を失いながらも前へ進む姿に心を打たれ、失った記憶への執着を捨て、現在の自分として生きる勇気を得る。
