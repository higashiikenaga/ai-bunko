title: 絶影の太刀、記憶の果て
genre: 伝奇
tone: 骨太で張り詰めた、静謐かつ激しい時代劇調
pov: 三人称
tense: 過去形
setting: 江戸時代、表向きは太平の世だが、裏側には死者の記憶が取引される「忘却の市」が存在する異界混在の世界
premise: 主君の遺言状を託された浪人・慎之助は、その書状を解く鍵が「忘却の市」に売られた主君の記憶にあることを知る。記憶を貨幣として取引する異形の市場で、慎之助は自らの誇りと記憶を賭けて、数多の剣豪の記憶を喰らった怪物のような剣客に挑む。失うことでしか得られない真実と、一振りの太刀に込めた武士の意地を描く。
themes:
- 武士道と自己犠牲
- 記憶とアイデンティティの相克
rules:
- 忘却の市では、特定の記憶を売ることで金銭や異能、他者の経験を得ることができる
- 記憶を売った者は、その出来事に関する一切の感情と知識を完全に喪失する
- 他者の剣術の記憶を移植した者は、その技を再現できるが、同時に元持ち主の執念や業に精神を侵食される
plot_outline:
- '序盤: 主君の死後、不可解な暗号が記された遺言状を受け取った慎之助。それを解読するには、主君が死の間際に「忘却の市」へ売却したある記憶が必要であることを突き止める。'
- '中盤: 異界の市場へ潜入した慎之助は、記憶の取引によって人心を操る市場の主と、他者の剣技を買い集めて無敵を誇る剣客・狂乱と出会う。慎之助は主君の記憶を取り戻すため、自らの大切な思い出を代価として差し出しながら、狂乱の懐へと近づく。'
- '終盤: 記憶を失い、空虚な器となった慎之助と、数千の記憶で肥大化した狂乱による一騎打ち。静寂が支配する月下の竹林で、技の数ではなく、ただ一点の意志を込めた純粋な太刀筋が激突する。'
- '結末: 狂乱を斬り伏せ、主君の記憶を回収した慎之助。遺言状に記されていたのは、権力への執着を捨て、一人の人間として生きろという主君の最後の願いだった。慎之助は刀を置き、静かに旅立つ。'
style_notes: 簡潔で力強い短文を重ねる。立ち合いの場面では、風の音、心拍、刀身の震えといった五感に訴える静寂を丁寧に描写し、一撃の瞬間に爆発的な速度感と重量感を込める。形容詞を排し、動詞の力強さで武士の矜持を表現すること。
