- name: アリステア・ソーン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 錆びついた銀色の甲冑を纏い、腰には折れた大剣を差している。疲弊した眼差しだが、芯の強さを感じさせる鋭い瞳を持つ。
  personality: 寡黙でストイック。過去の失敗に囚われており、自己犠牲的な傾向がある。一人称は「私」。
  speech_style: 丁寧だが距離感のある、簡潔で硬い話し方。
  background: かつて聖歌の守護騎士団に属し、大蒸気機関を守っていたが、ある不協和音の発生時に仲間と剣を失い、騎士としての名誉を剥奪された放浪者。
  motivation: 街の墜落を止めることで、かつての過ちを償い、自分を許すこと。
  relationships:
  - name: ニクス・ギアハート
    relation: 反発しつつも信頼を寄せる協力者
  - name: エリアナ・ソラーリ
    relation: 守るべき対象であり、救済を求める相手
  arc: 絶望と停滞の中にいたが、不完全な者同士の繋がりを知り、「折れた剣」のままでも戦える強さを取り戻す。
- name: ニクス・ギアハート
  role: 相棒
  age: 19
  gender: 男性
  appearance: オイル汚れのゴーグルを額にかけ、オーバーサイズの工具ベルトを装着している。赤茶色の乱れた短髪。
  personality: 好奇心旺盛で直感的。機械の音を「音楽」として聴き取る特異体質。一人称は「オレ」。
  speech_style: 早口で賑やか。機械工学の専門用語を混ぜて喋る癖がある。
  background: 地下街のジャンク屋で育った天才修理工。正規の教育は受けていないが、蒸気機関の「心拍」を読み取ることができる。
  motivation: 街の心臓である大蒸気機関を完全に修理し、その構造の真実を解き明かすこと。
  relationships:
  - name: アリステア・ソーン
    relation: 古臭い考え方に呆れつつも、その実力を認める兄貴分
  - name: エリアナ・ソラーリ
    relation: 憧れと、彼女が抱える矛盾への疑問
  arc: 個人の好奇心のみで動いていたが、街の人々の生活と旋律の繋がりを理解し、責任感を持つ技術者へと成長する。
- name: エリアナ・ソラーリ
  role: 主人公
  age: 24
  gender: 女性
  appearance: 純白のドレスに身を包み、透き通るような白い肌と金色の髪を持つ。常にどこか遠くを見つめているような儚い表情。
  personality: 穏やかで慈愛に満ちているが、内面には強い知的好奇心と現状への閉塞感を抱えている。一人称は「私」。
  speech_style: 優雅で詩的な言い回しを用いるが、真実を求める時は毅然とした口調になる。
  background: アリア・ノヴァの「生ける楽器」として育てられた至高の歌姫。彼女の歌唱が街のエネルギー源となっているが、それが街を蝕んでいることに気づき始めている。
  motivation: 犠牲の上に成り立つ偽りの調和を捨て、誰もが自由に歌える「真実の旋律」を見つけること。
  relationships:
  - name: アリステア・ソーン
    relation: 自分を記号ではなく一人の人間として扱う騎士
  - name: ニクス・ギアハート
    relation: 外の世界の雑音と生命力を教えてくれる友人
  arc: 完璧であることを強要される人形のような人生から脱却し、不完全で歪な「生の歌」を歌う表現者へと変わる。
- name: マエストロ・ヴァレリウス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 鋭い眼光のモノクルをかけ、隙のない黒い燕尾服を纏っている。指揮棒のような形状の特殊デバイスを携行している。
  personality: 極端な完璧主義者で冷酷。音楽による完全支配こそが秩序であると信じている。一人称は「私」。
  speech_style: 傲慢で演劇的な話し方。相手を見下す皮肉を好む。
  background: 元・街の最高音楽理論家。エネルギー枯渇の真実を知ったが、それを解決するのではなく、一度全てを破壊して「究極の静寂」から再構築しようと企む。
  motivation: 不協和音を加速させ、アリア・ノヴァを完結（崩壊）させることによる、新たな世界の創造。
  relationships:
  - name: エリアナ・ソラーリ
    relation: 最高の素材（楽器）として執着している対象
  - name: アリステア・ソーン
    relation: 切り捨てたはずの過去の遺物として軽蔑している
  arc: 自身の構築した完璧な理論が、泥臭い人間たちの不協和音（生の歌）に塗り替えられ、敗北することで完結する。
