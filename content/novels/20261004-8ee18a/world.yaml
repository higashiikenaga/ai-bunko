title: 奏鳴の蒸気、断罪の旋律
genre: 群像劇
tone: 幻想的でリズミカル、哀愁漂うスチームパンク
pov: 三人称
tense: 過去形
setting: 蒸気機関が空を覆い、旋律が物理的な力を持つ浮遊都市「アリア・ノヴァ」
premise: 空に浮かぶ歯車の街では、歌声が魔法となり、音楽が文明を動かしている。しかし、かつて世界を救った聖歌の残響が、今や街の歯車を狂わせる災厄へと変貌していた。折れた剣を抱く騎士、蒸気機関の音に狂う修理工、そして真実の旋律を求める歌姫。交錯する者たちの運命が、止まりかけた街の時計を再び動かし始める。
themes:
- 再生と破壊の調べ
- 欠落した者たちの連帯
rules:
- 音楽の強弱や音色が物理的な圧力や熱量に変換される
- 旋律を失った者は自我を失い、静寂の影へと変わる
- 蒸気機関の駆動には、一定のリズムを持つ歌唱が必要である
plot_outline:
- '序盤: 街の心臓部である大蒸気機関が、未知の不協和音によって停止し、浮遊都市が高度を下げ始める。折れた剣を持つ放浪の騎士が、不協和音の正体を探るため、地下街の修理工と出会う。'
- '中盤: 各々の視点から、音楽がどのように街を支え、同時に人々を蝕んでいるかが描かれる。歌姫が奏でる完璧な旋律が、実は街のエネルギーを枯渇させているという残酷な真実が明らかになる。'
- '終盤: 崩壊の危機に瀕したアリア・ノヴァ。騎士、修理工、歌姫の三人は、壊れた旋律を繋ぎ合わせるために、嵐のような音の奔流の中へと飛び込む。'
- '結末: 完璧な調和ではなく、不完全で歪な、しかし力強い「生の歌」が奏でられ、街は新しいリズムと共に空へと舞い戻る。'
style_notes: 文章は打楽器のビートのように、あるいは弦楽器の流麗な旋律のようにリズミカルに構成すること。各話の冒頭や転換点には、物語の情景を象徴する一節の歌詞を必ず挿入し、地の文と音楽が一体となったような詩的な表現を心がける。
