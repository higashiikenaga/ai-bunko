- name: カイ・ヴァレンタイン
  role: 主人公
  age: 15
  gender: 男性
  appearance: 油汚れのついた作業着、頭に乗せた革製のゴーグル、茶髪で好奇心に満ちた瞳。
  personality: 機械に対して異常なまでの情熱を持つ、直情的で真っ直ぐな少年。一人称は「僕」。
  speech_style: 「～だよ！」「～なんだ！」といった、勢いのある明るい口調。
  background: 伝説の整備士だった父を亡くし、廃材置き場で独り、父の遺した古いコンパスを手に空を夢見ていた。
  motivation: 父の遺したコンパスが指し示す「約束の丘」へ辿り着き、父の真意を知ること。
  relationships:
  - name: リア・ウィンドスカー
    relation: 共に空を駆ける大切な相棒
  - name: カイの父
    relation: 尊敬する対象であり、謎を解くべき鍵
  arc: 機械を直すことだけに没頭していた少年が、仲間を守り、世界の運命を背負う覚悟を持つリーダーへと成長する。
- name: リア・ウィンドスカー
  role: 相棒
  age: 14
  gender: 女性
  appearance: 銀色の翼を持つ、風になびく長い青髪。軽装の飛行服を纏った神秘的な少女。
  personality: 自由奔放で直感的な性格。どこか浮世離れしており、風の声を聴くことができる。一人称は「私」。
  speech_style: 「～ね」「～かしら」といった、穏やかだが芯の強さを感じさせる言葉遣い。
  background: 雲海の下に眠る未知の文明の末裔であり、風を操る特殊な能力を宿している。
  motivation: 自分の翼が導く「風の歌」の真実を解き明かし、世界の空の自由を取り戻すこと。
  relationships:
  - name: カイ・ヴァレンタイン
    relation: 魂の共鳴を感じるパートナー
  - name: バルトロメウス
    relation: 空の心得を教えてくれる保護者的な存在
  arc: 孤独な逃亡者として生きてきた彼女が、カイとの旅を通じて「空の巫女」としての使命を受け入れる。
- name: ゼノス・ド・グラード
  role: 敵役
  age: 42
  gender: 男性
  appearance: 隙のない帝国軍将校の制服、鋭い眼光、左目に装着された蒸気駆動式の義眼。
  personality: 冷徹かつ徹底した合理主義者。秩序こそが世界を救うと信じて疑わない。一人称は「私」。
  speech_style: 丁寧だが威圧的で、一切の妥協を許さない軍人的な口調。
  background: 帝国の空軍司令官。浮遊大陸の資源を独占し、空を完全に管理・支配することを使命としている。
  motivation: 伝説の技術（遺言）を帝国の管理下に置き、空の秩序を永遠のものにすること。
  relationships:
  - name: カイ・ヴァレンタイン
    relation: 秩序を乱す排除すべき不確定要素
  arc: 絶対的な支配者として君臨しようとするが、少年たちの「自由への意志」によって、自らの信念の脆さを突きつけられる。
- name: バルトロメウス
  role: 脇役
  age: 55
  gender: 男性
  appearance: 豊かに蓄えた髭、使い込まれた航海士の帽子、蒸気式の機械義手を持つ大柄な老人。
  personality: 豪放磊落で、経験に基づいた冷静な判断力を持つ。時に厳しく、時に優しい。一人称は「俺」。
  speech_style: 「～じゃ」「～なのだよ」といった、年長者らしい重みのある話し方。
  background: かつて帝国に反旗を翻した元空賊。現在はスカイ・ランナー号の船長として、次世代の空の旅人を導いている。
  motivation: かつての仲間たちが夢見た「真に自由な空」を、若者たちの手で見届けること。
  relationships:
  - name: カイ・ヴァレンタイン
    relation: 見守るべき息子のような存在
  - name: リア・ウィンドスカー
    relation: 守るべき世界の希望
  arc: 隠居の身として静かに過ごそうとしていたが、少年たちの情熱に触れ、最後の一戦に賭ける決意を固める。
