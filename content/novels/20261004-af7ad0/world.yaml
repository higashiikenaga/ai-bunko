title: 蒼穹の旋律と銀翼の遺言
genre: スチームパンク冒険
tone: 爽快、疾走感、冒険心に満ちた熱い空気感
pov: 三人称
tense: 過去形
setting: 浮遊大陸が点在する蒸気機関文明の時代。雲海の下に未知の文明が眠るとされる世界。
premise: 天才整備士の少年カイと、風を操る翼を持つ少女リアは、伝説の飛空艇『スカイ・ランナー号』と共に空の果てを目指す。彼らの目的は、亡き父が遺した「約束の丘」への航路を辿ること。そこには、世界の空を再び自由にするための、ある重大な『遺言』が隠されていた。雲を裂き、嵐を駆け抜け、機械の鼓動と風の歌を信じて、少年たちは空の真実へと突き進む！
themes:
- 仲間との絆
- 自由への渇望
- 技術と自然の調和
rules:
- 蒸気機関の出力は高度による気圧の変化に影響を受ける
- 翼を持つ者は『風の導き』と呼ばれる特殊な感覚を持つ
- 空の果てには『大嵐の壁』が存在し、物理的な破壊を防ぐ
plot_outline:
- '序盤: 整備士カイは父の遺品である古いコンパスを手に入れ、空賊に追われながらもリアと出会い、スクラップ寸前の飛空艇を再起動させる。'
- '中盤: 仲間を集め、各地の浮遊島を巡りながら、父の遺言に記された座標を解読していく。激しい空中戦や巨大な機械怪獣との遭遇を経て、彼らの絆は強固になっていく。'
- '終盤: 伝説の『約束の丘』に到達するが、そこは巨大な浮遊要塞だった。世界の空を支配しようとする帝国軍との、雲海を舞台にした総力戦が勃発する。'
- '結末: 飛空艇の限界を超えた加速で帝国軍を突破し、父の遺言である『真の空の解放』を成し遂げる。一行は新たな風を感じながら、さらなる未知の空へと旅立つ。'
style_notes: 機械の油の匂い、蒸気の噴出する音、風が翼を叩く感覚を、躍動感のある言葉で描写すること。感情が高ぶる場面では、空の広大さとキャラクターの熱量をシンクロさせ、読者が共に空を飛んでいるような疾走感を演出する。
