- name: 久瀬 慎一郎
  role: 主人公
  age: 38
  gender: 男性
  appearance: 無精髭が薄く残る、鋭い眼光の持ち主。常に使い古されたトレンチコートを羽織っている。
  personality: 冷静沈着で執念深い。正義感よりも真実への好奇心が勝るタイプ。一人称は「俺」。
  speech_style: 簡潔で無駄がなく、相手の核心を突くような問いかけを行う。
  background: かつては捜査一課のエースだったが、ある未解決事件の捜査で組織の決定に異を唱えたことで、現在は閑職に近い現場を回っている。
  motivation: 事件の背後にある隠蔽工作を暴き、失われた真実を白日の下にさらすこと。
  relationships:
  - name: 佐伯 栞
    relation: 事件の重要な手がかりを与える協力者
  - name: 黒岩 宗介
    relation: 捜査を阻む壁となる宿敵
  arc: 組織の圧力に屈することなく、孤独な戦いの中で自身の信念を再確認する。
- name: 佐伯 栞
  role: 相棒（情報提供者）
  age: 29
  gender: 女性
  appearance: 細縁の眼鏡をかけた、清楚で知的な佇まい。古書店「藍色堂」の店主。
  personality: 物静かで思慮深く、古書に関する知識は専門家レベル。一人称は「私」。
  speech_style: 丁寧な敬語を用い、穏やかだが断定を避ける知的な話し方。
  background: 亡き父が営んでいた古書店を継いだ。稀覯本（きこうぼん）の鑑定に長けており、街の裏側の歴史にも詳しい。
  motivation: 亡き父が大切にしていた店と、そこに並ぶ本たちの価値を守ること。
  relationships:
  - name: 久瀬 慎一郎
    relation: 事件を通じて奇妙な信頼関係を築く刑事
  arc: 静かな日常が事件に飲み込まれる恐怖を乗り越え、真実を知るための強さを得る。
- name: 黒岩 宗介
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない高級スーツを着こなす、威圧感のある壮年男性。常に冷静な笑みを浮かべている。
  personality: 徹底した合理主義者であり、目的のためには手段を選ばない。一人称は「私」。
  speech_style: 慇懃無礼。言葉の端々に相手をコントロールしようとする圧力を込める。
  background: 警察庁の幹部候補であり、政界と警察の不都合な関係を調整する「掃除屋」としての側面を持つ。
  motivation: 被害者の死を単なる事故として処理し、組織の権威と政界との繋がりを守ること。
  relationships:
  - name: 久瀬 慎一郎
    relation: 排除すべき不確定要素
  arc: 完璧な隠蔽工作を企てるが、久瀬の執念によって自らが築いた権力の城を崩される。
- name: 霧島 誠
  role: 脇役（重要参考人）
  age: 45
  gender: 男性
  appearance: 常に周囲を伺うような、怯えた表情の男。被害者の秘書。
  personality: 臆病で保身に走りやすいが、内面に強い葛藤を抱えている。一人称は「私」。
  speech_style: 言葉が詰まりやすく、視線を泳がせながら話す。
  background: 被害者の実業家として長年仕えてきたが、被害者が関わっていた「ある禁忌」を偶然知ってしまった。
  motivation: 事件の真相が露呈することによる、自身の社会的破滅を回避すること。
  relationships:
  - name: 久瀬 慎一郎
    relation: 追い詰められる対象
  arc: 保身のための沈黙と、良心の呵責の間で揺れ動き、最終的にある決断を下す。
