title: 藍色の残滓
genre: 本格ミステリー
tone: 硬質で乾いたリアリズム
pov: 三人称
tense: 過去形
setting: 現代、不夜城と化した繁華街と、その裏に潜む古書店街
premise: 午前3時12分、眠らない街の片隅にある古書店で、一人の男が遺体で発見された。被害者は政界に強い影響力を持つ実業家であり、現場には不可解に「欠落したページ」を持つ古書が残されていた。捜査一課の刑事・久瀬は、組織による隠蔽の予兆を感じながら、緻密な聞き込みと証拠の積み上げを開始する。街の喧騒と静寂の狭間で、隠蔽された過去が暴かれようとしていた。
themes:
- 組織の隠蔽と正義
- 記録の断絶
rules:
- 捜査手順は規定に従うこと
- 現場の状況は時間と場所を明記して記録すること
- 組織の上下関係は絶対であること
plot_outline:
- '序盤: 深夜、古書店での殺人事件発生。久瀬による現場検証と、被害者の社会的地位の判明。組織内での迅速な幕引きを図る動きの露呈。'
- '中盤: 周辺の24時間営業店舗や住人への聞き込み。被害者が追っていた稀覯本の謎。過去の未解決事件との関連性の浮上。上層部からの捜査介入と圧力。'
- '終盤: 物理的な証拠と、古書の記述に隠された時間差トリックの解明。容疑者のアリバイ崩し。組織の軋轢の中での決着。'
- '結末: 真犯人の特定と逮捕。事件の真相は一部が闇に葬られるが、久瀬は冷徹に次の任務へと戻る。'
style_notes: 感情を排し、事実と動作を淡々と描写する。会話は短く実務的、警察組織内の階級による摩擦をリアルに描く。時刻、場所、周囲の環境を正確に記す。
