- name: 佐藤 健二
  role: 主人公
  age: 24
  gender: 男性
  appearance: 度の強い眼鏡をかけ、常にタブレットとノートを携帯している。痩せ型で目立たない風貌。
  personality: 分析的で慎重。自分を「舞台に立つ人間ではない」と定義している。一人称は「僕」。
  speech_style: 丁寧だが自信なげ。データや確率に基づいた論理的な話し方を好む。
  background: 大学までバスケットボール部に所属していたが、身体能力の限界でベンチを温める日々を過ごした。現在はIT企業の分析担当。
  motivation: コート上の主役ではなく、自分の分析によってチームを勝利に導くことで、自分の存在価値を証明したい。
  relationships:
  - name: 貴島 亮太
    relation: 信頼するチームリーダーであり、分析結果を唯一信じて実行してくれるパートナー
  - name: 篠崎 麻耶
    relation: 正反対の性質を持つが、互いの欠けている部分を補い合う戦友
  arc: 「観測者」でいることに安住していたが、作戦を遂行させるために自らコートへ踏み出す勇気を得る。
- name: 貴島 亮太
  role: 相棒/チームリーダー
  age: 28
  gender: 男性
  appearance: 日焼けした肌に鋭い眼光。右足首に古傷のサポーターを巻いている。
  personality: 情熱的で責任感が強い。責任を一人で背負い込む傾向がある。一人称は「俺」。
  speech_style: ぶっきらぼうだが温かみがある。鼓舞するような力強い口調。
  background: かつては地域で名を馳せたエースだったが、怪我により全盛期のパフォーマンスを失い、現在は配送業に従事。
  motivation: 崩壊しかけている『ナイト・レジェンド』を再建し、もう一度だけ最高潮の熱狂の中で勝ちたい。
  relationships:
  - name: 佐藤 健二
    relation: 健二の知性を高く評価しており、彼をチームの「脳」として信頼している
  - name: 長谷川 恵理子
    relation: 街の喧騒の中で、互いの孤独を理解し合う年上の友人
  arc: 個人の能力で突破しようとする執着を捨て、チームの絆と戦略を信じる真のリーダーへと成長する。
- name: 篠崎 麻耶
  role: 切り札/ムードメーカー
  age: 22
  gender: 女性
  appearance: ベリーショートの髪にストリート系の服装。小柄だが瞬発力に優れた筋肉質な体格。
  personality: 直感的で自由奔放。退屈を何よりも嫌い、刺激を求める。一人称は「あたし」。
  speech_style: ハキハキとしており、ためらいがない。相手を挑発するような茶目っ気のある話し方。
  background: 元々は独学でストリートバスケを嗜んでいたが、チームの主力離脱に伴い急遽加入した特待的な存在。
  motivation: 日常の閉塞感を打ち破るような、心震える「最高のプレー」を追求すること。
  relationships:
  - name: 佐藤 健二
    relation: 堅苦しい健二をからかいながらも、彼の描く緻密な作戦に快感を覚えている
  - name: 貴島 亮太
    relation: 尊敬する年上のプレーヤーであり、彼の不器用な情熱に惹かれている
  arc: 単なる個人の快楽としてのプレーから、チームという共同体の中で役割を果たす喜びを知る。
- name: 長谷川 恵理子
  role: 観察者/精神的支柱
  age: 31
  gender: 女性
  appearance: 落ち着いた大人の雰囲気。スポーツセンター近くのバーを経営しており、常に静かな微笑を浮かべている。
  personality: 包容力があり、洞察力が鋭い。街の光と影を冷徹に見つつも、情熱に弱い。一人称は「私」。
  speech_style: 穏やかでゆったりとした口調。核心を突く問いかけをすることが多い。
  background: かつては別のスポーツに打ち込んでいたが、挫折して街に根を張った。現在はチームの非公式なスポンサー兼相談役。
  motivation: 純粋に何かに打ち込む人々を応援することで、自分の中の失われた情熱を取り戻したい。
  relationships:
  - name: 貴島 亮太
    relation: 行きつけの店に来る常連客であり、兄のような存在
  - name: 佐藤 健二
    relation: 彼の静かな努力を誰よりも早く見抜き、背中を押す理解者
  arc: 観客として彼らを見守ることで、自分自身もまた人生というコートに再び立ち上がる決意を固める。
