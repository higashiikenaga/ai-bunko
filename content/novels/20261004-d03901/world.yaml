title: 不眠のコート、熱狂の残響
genre: スポーツ青春
tone: 熱を帯びた群像劇、泥臭くも美しい躍動感
pov: 三人称（選手、ベンチ、観客席を交えた多角的視点）
tense: 過去形
setting: 現代、深夜まで明かりが消えない都市部のスポーツセンターと、その周辺の歓楽街
premise: 深夜のスポーツセンターを拠点に活動する、社会人混合の街頭バスケットボールチーム『ナイト・レジェンド』。主力不在の逆境の中、ベンチでデータを取り続ける控え選手と、熱狂を求める観客たちの視点が交差する。眠らない街の喧騒を背景に、彼らは地域最大の祭りの夜に開催されるトーナメントへと挑む。一瞬のプレーに全てを賭ける者たちの、光と影の物語。
themes:
- 挫折からの再起
- 役割の肯定
- 集団における個の輝き
rules:
- 深夜のストリートコートで行われる非公式トーナメントであること
- 公式戦ではなく、地域のコミュニティと信頼に基づくルール運用がなされること
- 試合の勝敗以上に、その場に集う者たちの熱量が重視される文化があること
plot_outline:
- '序盤: 主力選手の離脱によりチームが崩壊の危機に瀕する。控え選手やマネージャーが、コートの外からチームを支える重要性を再認識し始める。'
- '中盤: 祭りの夜が近づく中、チームは戦術を練り直す。作戦ボードに描かれる複雑なスクリーンプレーの図解と、それに応えようとする控え選手の葛藤が描かれる。'
- '終盤: 眠らない街の祭りの夜、決勝戦が開催される。観客席の視点を通じ、チームが築いてきた絆が街全体の熱狂へと変わっていく様子が描かれる。'
- '結末: 結果の如何に関わらず、彼らはそれぞれの役割を果たし、また次の夜へと向かっていく。ベンチの静寂とコートの喧騒が混ざり合う。'
style_notes: チームスポーツの群像劇として、スター選手だけでなく、ベンチで見守る者や観客の心理描写を厚くする。作戦会議のシーンでは、指先で描かれる戦術の動き（ピック・アンド・ロールの軌道や、スクリーンをかける位置関係）を、まるで幾何学的な図解を描くように精密な言葉で描写すること。
