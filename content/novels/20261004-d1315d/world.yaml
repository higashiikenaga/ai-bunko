title: バズりすぎて死にたい、僕らの高解像度リブート・サマー
genre: 青春恋愛
tone: 軽快かつエモーショナル、メタ的な疾走感
pov: 一人称（ボク）
tense: 過去形（モノローグは現在形）
setting: 現代日本、高校、及び新仮想空間『オアシス』
premise: 仮想空間の崩壊を乗り越え、現実で結ばれた旭陽翔と一ノ瀬汐里。しかし、前作の「感情同期」の後遺症で、二人は嘘をつくと視界にノイズが走るという奇妙な呪いに見舞われていた。そこに、真実を娯楽として消費させる新アプリを携えた九条蓮が再び現れ、彼らの「本当の気持ち」を世界に晒そうと画策する。嘘がつけない不自由な世界で、二人が辿り着く唯一の聖域とは。
themes:
- 誠実さの痛み
- デジタル時代の真実と虚構
rules:
- 同期後遺症：旭と汐里が互いに、あるいは他者に嘘をつこうとすると、視界に激しいデジタルノイズ（グリッチ）が発生し、心拍数が急上昇する。
- 仮想空間『オアシス』：ネットの最果てに存在する、誰にも見つからない個人サーバー。ここでは社会的属性を完全に捨てて対話できる。
- 九条の真実解析アプリ：AIを用いて発言の矛盾を検出し、その人物の「嘘つきスコア」を可視化してSNSで拡散するシステム。
plot_outline:
- 序盤：現実世界で不器用な交際を始めた旭と汐里。しかし「嘘をつけない呪い」のせいで、気遣いの嘘すらつけず、些細な本音のぶつかり合いで大喧嘩を繰り返す日々。そこに九条蓮が、嘘を数値化する新アプリと共に再登場し、汐里を再び「晒し」の標的にする。
- 中盤：九条のアプリによって、汐里の隠していた弱みが次々と暴かれ、学校中から好奇の目に晒される。精神的に追い詰められた二人は、ネットの深層に隠された静寂の空間『砂漠のオアシス』へと逃げ込む。そこで彼らは、呪いがあるからこそ伝えられる「純度の高い言葉」を交換し、絆を深めていく。
- 終盤：九条が『オアシス』の座標を特定し、ライブ配信形式で二人の「究極の真実」を暴露するイベントを強行。しかし、旭は「嘘をついてもノイズが出る」という呪いを逆手に取り、九条が作り上げた「完璧なインフルエンサー」という最大の虚構を、全世界の前で論理的に解体する。
- 結末：デジタル上の名声や注目をすべて捨て、アカウントを削除した二人。呪いは完全には消えなかったが、「嘘をつかなくてもいい関係」を築けたことに気づく。低解像度で不便な、けれど温かい現実世界で、二人は静かに手を繋いで歩き出す。
style_notes: SNS世代のスピード感ある文体。一人称「ボク」による激しいツッコミとメタ発言を多用。「（いや、今の展開盛りすぎだろ）」「（ここでBGMが変わる演出、見えそう）」といった心の声を挿入する。また、章の合間に「X（旧Twitter）」風のポストや、配信のコメント欄（草、w、！？など）を配置し、物語の客観的な盛り上がりと主観的な混乱を対比させる。
