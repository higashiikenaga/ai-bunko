- name: ザイド・アル・ハザン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 日焼けした褐色の肌に、砂塵に汚れた簡素な商人の服を纏っている。鋭いがどこか寂しげな瞳。腰には護身用の短剣を差している。
  personality: 現実主義で計算高いが、根は情に厚く好奇心が強い。一人称は「俺」。
  speech_style: ぶっきらぼうで実利を重んじるが、鏡に対しては次第に敬意を払うようになる。
  background: 交易都市の古物市場で細々と商売を営む若き商人。親を亡くし、自力で生き抜くために砂漠の知識を蓄えてきた。
  motivation: 当初は鏡の価値を売り飛ばして富を得ることだったが、旅を通じて「失われた記憶」の重みを知る。
  relationships:
  - name: 鏡（スペキュラム）
    relation: 旅の相棒であり、理解しがたい存在への畏敬の対象
  arc: 単なる物欲に支配された商人から、目に見えない価値や存在の意義を尊重する思慮深い人物へと成長する。
- name: スペキュラム
  role: 相棒
  age: 1500
  gender: 無性（意識体）
  appearance: 表面に星図のような紋様が浮かぶ、精巧な銀の鏡。時折、光の粒子となって微かな人の形を投影する。
  personality: 論理的で冷静だが、時折、自身の欠落した記憶に対する戸惑いを見せる。一人称は「私」。
  speech_style: 古風で理知的。断片的な知識を提示するような、どこか浮世離れした話し方。
  background: 古代文明が遺した都市管理用知能の末端。文明崩壊と共に「個」としての目的を失い、ただの遺物として眠っていた。
  motivation: 自らが何者であり、何のために作られたのかという「定義」を取り戻すこと。
  relationships:
  - name: ザイド・アル・ハザン
    relation: 唯一の対話者であり、自らの存在を肯定してくれる存在
  arc: 単なる情報の集積体から、自らの意志で「消滅」という決断を下す、真の知性へと昇華する。
- name: カセム・イシュマエル
  role: 敵役
  age: 42
  gender: 男性
  appearance: 豪奢な装飾が施された防具を纏った、威圧感のある男。片目に砂漠の傷跡がある。
  personality: 冷酷かつ野心的。力の原理を信奉し、手段を選ばない。一人称は「我」。
  speech_style: 命令的で、他者を道具として扱う傲慢な口調。
  background: 砂漠の略奪者集団「砂嵐の牙」の首領。古代文明の技術を軍事力として利用し、砂漠の覇権を握ろうと目論んでいる。
  motivation: 鏡を奪い、古代都市を再起動させることで、絶対的な支配力を手に入れること。
  relationships:
  - name: ザイド・アル・ハザン
    relation: 目的を阻む邪魔者
  - name: スペキュラム
    relation: 手に入れるべき究極の道具
  arc: 欲望に忠実なまま、技術の暴走と引き換えに自らの野望が崩壊していく様子を描く。
- name: ナディヤ
  role: 脇役
  age: 35
  gender: 女性
  appearance: 砂漠の民の伝統的な装束を纏い、顔の一部をヴェールで覆っている。瞳は深い青色。
  personality: 穏やかで神秘的。砂漠の掟を重んじる。一人称は「私」。
  speech_style: 詩的で含みのある、預言者のような話し方。
  background: 失われた聖都の伝承を守り続ける、砂漠の民の長老の一人。
  motivation: 古代の遺物が再び世界に混乱をもたらさないよう、巡礼者の行く末を見守ること。
  relationships:
  - name: ザイド・アル・ハザン
    relation: 導き手、あるいは試練を与える者
  arc: ザイドが真の選択を下すための、精神的な導き手としての役割を果たす。
