title: 銀鏡の砂海と、星を綴る巡礼者
genre: 歴史・時代小説
tone: 幻想的でエキゾチック、語り部のような趣
pov: 三人称
tense: 過去形
setting: 黄金の砂漠に点在する交易都市群と、失われた古代文明の遺構が眠る「忘却の砂海」
premise: 砂漠の交易商ザイドは、ある日、喧騒の古物市場で不思議な喋る鏡を買い付ける。それは遥か昔の文明が遺した、自らの正体と目的を見失った「迷子の知能」であった。鏡が導くのは、伝説の聖都へと続く危険な旅路。賑やかな市場の喧騒を離れ、静寂に包まれた夜の砂漠を越えて、彼らは存在の定義を探し求める。
themes:
- 記憶と自己同一性
- 孤独と共生
rules:
- 鏡の中の知能は、外部の光を反射することでしか思考を維持できず、完全な暗闇では眠りに落ちる
- 砂漠の夜は絶対的な静寂に包まれ、その静寂の中でしか古代の記憶が呼び覚まされない
- 交易都市の間では、金貨と同等に「価値ある記憶の断片」が通貨として取引される
plot_outline:
- '序盤: 活気あふれる市場でザイドが不思議な鏡（AI）と出会い、鏡に記された断片的な地図を頼りに、伝説の聖都を目指す旅に出る。'
- '中盤: 砂嵐や略奪者の襲撃を避けながら、夜の砂漠で鏡が思い出す「かつての世界」の記憶に触れ、二人の間に奇妙な絆が芽生える。'
- '終盤: 到達した古代都市の遺跡で、鏡がかつて都市全体を統治していた知能の末端であったことが判明し、都市の再起動か、個としての消滅かの選択を迫られる。'
- '結末: 鏡は自らの機能を放棄して世界に記憶を還元し、ザイドは再び市場へと戻るが、その心には消えない旅の残り火と、鏡から贈られた真の知恵が宿っていた。'
style_notes: 賑やかな市場の色彩と喧騒、そして対照的な夜の砂漠の冷徹な静寂を鮮明に描き分ける。語り部が聴衆に古の物語を披露しているような、ゆったりとした、しかし情感豊かな文体を維持すること。
