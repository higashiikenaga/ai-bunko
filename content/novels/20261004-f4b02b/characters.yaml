- name: 結城 湊
  role: 主人公
  age: 28
  gender: 男性
  appearance: 痩身で少し顔色の悪い青年。都会の生活に馴染めず、どこか所在なげな瞳をしている。
  personality: 内向的で思慮深い。過去の出来事に対する拭いきれない罪悪感を抱えている。一人称は「僕」。
  speech_style: 静かで落ち着いているが、核心に触れるときは言葉が詰まる。丁寧な物腰。
  background: 都会で事務職として働くが、祖父の死をきっかけに、自身のルーツを探るために封印していた故郷の村を訪れる。
  motivation: 写真の女性の正体を突き止め、祖父が遺した「届かなかった手紙」の真意を知ること。
  relationships:
  - name: 雪代 志乃
    relation: 祖父のかつての恋人であり、写真の女性
  - name: 守屋 徳造
    relation: 村の案内役であり、伝承の語り手
  arc: 過去から逃避する受動的な姿勢から、真実と向き合い、他者の痛みを受け入れることで自身の罪悪感からも卒業する。
- name: 雪代 志乃
  role: ヒロイン（異界の住人）
  age: 22
  gender: 女性
  appearance: 透き通るような白い肌と、氷のように冷たくも美しい瞳。昭和初期の素朴で美しい着物姿。
  personality: 儚げで、どこか寂しげな微笑みを絶やさない。一人称は「私」。
  speech_style: 囁くような、消え入りそうな声。雪が降る音のような静かな響き。
  background: 昭和中期、村の境界を守る儀式の最中に忽然と姿を消したとされる女性。氷の城に囚われ続けている。
  motivation: 誰かに届くはずだった最後の手紙を待ち続け、停滞した時間の中で祈り続けている。
  relationships:
  - name: 結城 湊
    relation: 祖父の記憶を通じて繋がる、手紙を届けてくれる存在
  - name: 砕氷の神
    relation: 彼女を氷の城に繋ぎ止めている、境界の力の象徴
  arc: 永遠の孤独と停滞の中から、手紙を受け取ることで救済され、静かな安らぎを得る。
- name: 守屋 徳造
  role: 脇役（狂言回し）
  age: 85
  gender: 男性
  appearance: 深い皺が刻まれた顔と、節くれだった大きな手。常に古いもんぺを履いている。
  personality: 無口で頑固。村の禁忌を重んじるが、どこか慈悲深い。一人称は「わし」。
  speech_style: 重々しく、断定的な語り口。古い方言が混じる。
  background: 村の伝承と神の歴史を唯一語り継ぐ古老。境界が曖昧になったことによる村の異変を危惧している。
  motivation: 村の平穏を取り戻すため、あるいは積年の因縁を終わらせるために、湊に真実を託すこと。
  relationships:
  - name: 結城 湊
    relation: 村の訪問者であり、因縁を断ち切る鍵となる人物
  arc: 伝承の守り手としての重責を、次世代である湊に託すことで役割を終える。
- name: 砕氷の神
  role: 敵役（悲劇的な存在）
  age: 0
  gender: 不明
  appearance: 雪と氷で形成された巨大な影のような姿。その胸元には、折れた剣が突き刺さっている。
  personality: 荒ぶる怒りではなく、ただひたすらに深い「欠落」と「孤独」を感じさせる。
  speech_style: 言葉を発さず、激しい吹雪や氷が割れる音として意志を伝える。
  background: かつて村の境界を守っていた神。剣が折れたことで力の均衡を失い、生と死の境界を壊してしまった。
  motivation: 欠けた自身を埋めるもの（剣の破片）を求めて、境界を揺らし続けている。
  relationships:
  - name: 雪代 志乃
    relation: 彼女を氷の城に縛り付けている力の源
  arc: 湊が剣の破片を捧げることで、その呪縛から解放され、静かに消滅していく。
