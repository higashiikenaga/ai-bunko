title: 氷霜の郵便局と、忘れられた神の祈り
genre: 怪談・民俗
tone: 懐古的で静謐な哀愁
pov: 一人称（わたし）
tense: 過去形（回想形式）
setting: 昭和中期から現代にかけての、雪深い山村
premise: わたしは、亡き祖父が遺した一枚の古ぼけた写真に導かれ、記憶から消し去っていた故郷の村を訪れる。そこには、冬の間だけ現れるという「氷の城」と、境界を守るために折れた剣を抱いて眠る神の伝承があった。届かなかったはずの手紙たちが雪の中に埋もれ、死者たちの囁きがわたしの耳に届き始める。
themes:
- 記憶の継承
- 喪失と受容
rules:
- 氷の城は、冬至の夜にだけ特定の場所に出現し、未練のある死者が集う浄化の場である
- 折れた剣の破片を身体に持っている者は、生者でありながら死者の声を聞き、彼らの記憶を追体験できる
- 届かなかった手紙を正しい宛先へ届けたときのみ、魂は氷の城から解放され、次なる生へ旅立つことができる
plot_outline:
- '序盤: 祖父の遺品整理中に、見知らぬ女性と撮った古い写真と、宛先不明の黄ばんだ封書を見つけ、導かれるように故郷の村へ戻る。'
- '中盤: 村の古老から、かつて村の境界を守っていた神の剣が折れたことで、生と死の狭間が曖昧になり、「氷の城」という異界が生まれた伝承を聞かされる。'
- '終盤: 写真の女性がかつて村で消えた恋人であったことを悟り、折れた剣の破片を手に、雪深い夜の氷の城へと足を踏み入れる。'
- '結末: 届かなかった最後の手紙を彼女に手渡し、互いの後悔を分かち合うことで、彼女を氷の城から解放し、わたし自身も過去の罪悪感から卒業する。'
style_notes: 昭和の商店街のような温もりと寂しさが同居した文体。比喩に「使い古された文房具」や「冬の陽だまり」など、生活感のある懐かしい表現を多用し、一人称の静かな独白形式で綴る。
