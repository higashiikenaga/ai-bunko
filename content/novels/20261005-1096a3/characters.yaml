- name: 瀬戸 航平
  role: 主人公
  age: 28
  gender: 男性
  appearance: 清潔感はあるがどこか疲れが見える、細身で眼鏡をかけている。都会的な雰囲気だが、地方の空気に馴染めずにいる。
  personality: 理詰めで論理的。正義感は強いが、法律の条文を信じすぎるあまり、人間の感情や町の慣習を軽視する傾向がある。一人称は「僕」。
  speech_style: 丁寧で理知的。詰問する際は冷静かつ無駄のない口調になる。
  background: 都内の大手法律事務所に勤務していたが、理想と現実の乖離に悩み、地方での国選弁護人の任務を機に赴任してきた。
  motivation: 被告である老人の無実を証明し、法的な正しさを確立すること。
  relationships:
  - name: 守屋 源三
    relation: 被告人と弁護人
  - name: 佐伯 健一
    relation: 対立する検察官
  arc: 形式的な法の適用者から、法の背後にある「人間の尊厳」と「真実の重み」を理解する弁護士へと成長する。
- name: 守屋 源三
  role: 被告人
  age: 78
  gender: 男性
  appearance: 深く刻まれた皺と、潮風に焼けた肌。認知症の影響で焦点の定まらない瞳をしているが、時折、驚くほど鋭い眼差しを見せる。
  personality: 言葉による意思疎通は困難だが、かつては真面目な地籍調査員だった。記憶の断片の中に、町の罪を抱え続けている。一人称は「俺」。
  speech_style: 支離滅裂な呟き、あるいは意味を持たない単語の羅列。
  background: かつて町の地籍調査に従事し、土地の細かな変化を記録し続けてきた。現在は認知症を患い、社会的に「存在しないもの」として扱われている。
  motivation: （意識下において）自分が守ろうとした土地の記憶を、誰かに繋ぐこと。
  relationships:
  - name: 瀬戸 航平
    relation: 弁護を受ける立場
  arc: 社会から棄てられた「狂人」というレッテルから、真実を繋ぎ止める「最後の証言者」へとその存在意義を変える。
- name: 佐伯 健一
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のないスーツ姿、整った容姿。威圧感を与えるような立ち居振る舞い。町の有力者たちの間でも信頼が厚い。
  personality: 冷徹で徹底した現実主義者。町の秩序と経済を維持することを最優先し、過去の過ちを「鎮火させるべき火種」と捉えている。一人称は「私」。
  speech_style: 淀みのない論理的な口調。相手を追い詰める際も、怒るのではなく淡々と事実を突きつける。
  background: 検察官として、町の平穏を守るために「必要な隠蔽」を黙認してきた町の秩序の守護者。
  motivation: 町の平穏を乱す不都合な真実を封じ込め、現在の社会構造を維持すること。
  relationships:
  - name: 瀬戸 航平
    relation: 法廷における敵対者
  - name: 守屋 源三
    relation: 排除すべき脅威
  arc: 完璧だと思っていた自らの論理と「秩序」が、実は腐敗の上に成り立つ砂上の楼閣であったことを突きつけられる。
- name: 望月 栞
  role: 脇役/協力者
  age: 32
  gender: 女性
  appearance: 古本屋の店主。作業着にエプロン、落ち着いた雰囲気の女性。町の歴史に詳しい。
  personality: 穏やかで思慮深い。町の人々が避ける「過去の話」を、記録として大切に扱う。一人称は「私」。
  speech_style: 柔らかいが、事実を伝えるときは迷いのない、落ち着いた話し方。
  background: 亡き父から町の古い記録や古本を扱う店を引き継いだ。守屋が遺した断片的な記録を保管していた。
  motivation: 記録された事実を、正しく後世に伝えること。
  relationships:
  - name: 瀬戸 航平
    relation: 調査における協力者
  - name: 守屋 源三
    relation: かつての知人・記録の守り手
  arc: 町の闇を知る恐怖に直面しながらも、記録を信じることで真実の解明に貢献する。
