title: 海岸線の空白
genre: ヒューマンドラマ
tone: 冷静、社会批判的、静謐
pov: 三人称
tense: 過去形
setting: 現代日本。産業の衰退により過疎化が進む地方の港町。
premise: 認知症を患い、意思疎通が困難な老人が、地域の福祉施設を焼いた容疑で起訴される。若き国選弁護人は、老人の断片的な言動と検察側が提示する「完璧な証言」の間に、わずかな論理的矛盾を発見する。それは、町が数十年にわたって隠蔽し続けてきた不法投棄事件という、社会的な闇へと繋がっていた。誰にも顧みられなかった「弱者の記憶」を、法廷という冷徹な場所でいかに証明するかを問う物語。
themes:
- 制度的疎外
- 記憶の継承
- 真実の所在
rules:
- 法廷手続きは日本の刑事訴訟法に厳格に準拠させる
- 証拠は物理的な物証と、証言の論理的矛盾のみで構成し、直感や霊感は排除する
- 社会福祉制度の不備という構造的問題を物語の根幹に置く
plot_outline:
- '序盤: 施設放火事件の被告となった老人の弁護を引き受けた主人公が、被告の沈黙と、あまりに整合性の取れた目撃証言に違和感を抱く。'
- '中盤: 町の古本屋で、被告がかつて収集していた古い地籍図と日記を発見。そこから、30年前に起きた企業の産業廃棄物不法投棄と、それを黙認した行政の癒着の痕跡を辿る。'
- '終盤: かつて監視塔として機能していた古い灯台の基礎部分に、当時の隠蔽工作の決定的な物証が埋設されていることを突き止め、法廷で目撃者の偽証を論理的に追い詰める。'
- '結末: 被告の無実が証明されるが、同時に町の有力者の罪が露呈。法的な勝利の後に残ったのは、失われた時間への哀悼と、記録されることで初めて救われる弱者の尊厳であった。'
style_notes: 感情的な形容詞を極力排除し、事実の積み上げによる論理的な叙述を徹底する。特に法廷シーンでは、証言の食い違いをパズルのように組み合わせて真相に迫る構成とし、弱者の視点を客観的に描くことで、かえって社会の不条理を際立たせる。
