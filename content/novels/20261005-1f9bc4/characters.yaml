- name: 清次（せいじ）
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で指先が太く、常に彫刻刀の手入れ道具を携帯している。伏し目がちで不愛想に見えるが、目は澄んでいる。
  personality: 職人気質で真面目。極度の人見知りで、自分の感情を言葉にするのが苦手。一人称は「俺」。
  speech_style: 口数が少なく、ぶっきらぼう。しかし、芸術的な話題になると早口になる傾向がある。
  background: 若くして彫り物師としての腕を認められたが、師匠との考え方の違いから独立し、江戸の下町にある長屋に転がり込んできた。
  motivation: 誰にも認められずとも、心から納得できる究極の造形美を追求すること。
  relationships:
  - name: 紬
    relation: 心を許せる理解者であり、精神的な支え
  - name: 源さん
    relation: 強引に輪に入れようとしてくる騒がしい隣人
  - name: お凛
    relation: 好奇心旺盛に懐いてくる近所の少女
  arc: 孤独に完璧を求める姿勢から、不完全であっても他者と分かち合う喜びと、絆の温かさを知る。
- name: 紬（つむぎ）
  role: 導き手
  age: 27
  gender: 女性
  appearance: 淡い水色の着物を纏い、しっとりとした佇まい。微笑むと三日月のような目になる。どこか浮世離れした雰囲気を持つ。
  personality: 穏やかで包容力があり、相手の心の機微を察するのが得意。一人称は「私」。
  speech_style: 静かでゆったりとした口調。比喩表現を用いた詩的な話し方をすることが多い。
  background: 雨の日だけ路地の突き当たりに現れる「雨降茶屋」の店主。茶屋の由来や正体は謎に包まれている。
  motivation: 訪れる人々に心安らぐ時間を提供し、彼らが自分自身の本当の気持ちに気づく手助けをすること。
  relationships:
  - name: 清次
    relation: 彼の不器用な優しさと才能を認め、静かに見守る存在
  arc: 清次が他人への心を開く過程を見守り、彼を通じて人間界の賑やかな情愛に触れる。
- name: 源さん（げんさん）
  role: ムードメーカー
  age: 45
  gender: 男性
  appearance: 恰幅が良く、常に汗をかいた快活な顔。手ぬぐいを頭に巻いている。
  personality: お節介で情に厚い。長屋のまとめ役であり、賑やかなことが大好き。一人称は「俺」。
  speech_style: 江戸っ子らしい威勢の良い口調。大声で笑い、相手の肩を叩くなどのスキンシップが多い。
  background: 長屋の住人たちに慕われる八百屋。もともと寂しがり屋で、新入りの清次を放っておけず懐に飛び込もうとする。
  motivation: 長屋の全員が家族のように仲良く、楽しく暮らすこと。
  relationships:
  - name: 清次
    relation: 不器用な青年を可愛がり、無理やり外に連れ出そうとする兄貴分
  - name: お凛
    relation: 近所の賑やかな孫のような関係
  arc: 清次の繊細な才能を正しく理解し、彼が心地よくいられるための「緩衝材」としての役割を担うようになる。
- name: お凛（おりん）
  role: 触媒
  age: 12
  gender: 女性
  appearance: ポニーテールに結んだ髪と、好奇心に満ちた大きな瞳。動きが機敏でいつも走り回っている。
  personality: 天真爛漫で裏表がない。大人の事情に縛られず、直感的に物事を判断する。一人称は「あたし」。
  speech_style: 快活でハキハキとした話し方。ときどき大人びた鋭い指摘をする。
  background: 近所の呉服屋の娘。美しいものに目がなく、清次の彫刻作品に強い興味を持つ。
  motivation: 祭りで世界一綺麗な「氷の城」を見ること。
  relationships:
  - name: 清次
    relation: 憧れの芸術家であり、ちょっかいを出す対象
  - name: 源さん
    relation: 一緒に騒いで遊ぶ愉快な近所のおじさん
  arc: 清次を外の世界（長屋のコミュニティ）へ引き出すきっかけとなり、純粋な称賛で彼の自信を回復させる。
