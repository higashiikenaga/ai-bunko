title: 五月雨の茶屋と、氷細工の涼
genre: 日常ほのぼの
tone: 江戸の粋と人情が漂う、温かく賑やかな雰囲気
pov: 三人称
tense: 過去形
setting: 江戸、下町の長屋
premise: 江戸の隅っこ、長屋の住人たちは今日も賑やかだ。腕は良いが不器用な彫り物師の清次は、雨が降る日だけ路地の突き当たりに現れる不思議な茶屋の存在を知る。そこでは、雨音とともに季節の移ろいを感じさせる珍しい菓子や茶が振る舞われていた。夏の祭りで人々が憧れる氷細工の「氷の城」を巡る騒動を経て、清次は長屋の人々と共に、雨の日の静寂と、人々の温かな絆を見出していく。
themes:
- 人々の繋がり
- 季節の移ろいと恵み
rules:
- 茶屋は雨の日、長屋の裏通りの特定の場所にだけ現れる
- 茶屋の主は、客の心持ちに合わせてその時一番美味しい季節の品を出す
plot_outline:
- '序盤: 彫り物師の清次が長屋へ越してくる。雨の日に、長屋の住人が「雨降茶屋」で賑わっているのを目撃し、不思議に思う。'
- '中盤: 季節は夏。祭りの目玉である氷の彫刻「氷の城」の制作を依頼されるが、清次は人付き合いが苦手で苦戦する。茶屋の主と過ごす雨の日のひと時が、彼の心を解きほぐしていく。'
- '終盤: 祭りの当日、予期せぬ天候の変化に見舞われるが、長屋の連中が協力して清次の作り上げた「氷の城」を守り抜く。'
- '結末: 祭りが終わり、清次は長屋の仲間たちと、雨上がりの澄んだ空気の中で、季節の甘味を分かち合い、笑い合う。'
style_notes: 江戸のべらんめえ口調を活かした軽快な会話劇を展開すること。水菓子、団子、煮物といった季節の食べ物の描写を五感に訴えるように丁寧に描き、最後は長屋の連中が一つにまとまる人情味あふれる結末で締める。
