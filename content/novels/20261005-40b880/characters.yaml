- name: リク・カイト
  role: 主人公
  age: 27
  gender: 男性
  appearance: 無造作な黒髪に、常に油汚れのついた作業着を纏っている。鋭いが、どこか遠くを見つめるような寂しげな瞳が特徴。
  personality: 内向的で職人気質。効率化された社会に馴染めず、古い機械の持つ「不完全な美しさ」に安らぎを感じる。一人称は「僕」。
  speech_style: 淡々としていて言葉数は少ないが、修理中の機械に対しては慈しむような独り言を漏らす。
  background: 浮遊居住区の片隅で、廃棄されたデバイスの修理屋を営む。高度に自動化された都市において、手作業による修理は時代遅れの技術とされている。
  motivation: 依頼された『古い灯台』のホログラムを完璧に復元し、そのデータの中に隠された真実を解明すること。
  relationships:
  - name: セナ・ヴァレンティン
    relation: 依頼人
  - name: ビット
    relation: 相棒
  arc: 無機質な世界に慣れきっていたが、灯台の光を修復する過程で、失われた「祈り」や「迷い」といった人間らしい感情の価値を再発見する。
- name: セナ・ヴァレンティン
  role: 鍵を握る依頼人
  age: 72
  gender: 女性
  appearance: 白髪混じりの端正な髪、かつての空飛ぶ船の乗組員が着ていたような、古風で質の良いロングコートを愛用している。
  personality: 穏やかで思慮深く、ミステリアスな雰囲気を持つ。過去の記憶を大切に守り続けている。一人称は「私」。
  speech_style: 非常に丁寧で、時折、現代の住人には理解できない古い時代の比喩を用いる。
  background: かつて空飛ぶ船が物流の主役だった時代の、航路管理に関わっていた世代の生き残り。灯台のデータの真の所有者。
  motivation: 消えゆく『光の記憶』を、単なるデータとしてではなく、誰かの心に届く『道標』として再生させること。
  relationships:
  - name: リク・カイト
    relation: 技術者（信頼を寄せている）
  arc: 自身の記憶が風化していくことに孤独を感じていたが、リクの仕事を通じて、想いが次世代へ継承されることを確信する。
- name: アリス・ヴォーン
  role: 対立者
  age: 45
  gender: 女性
  appearance: 完璧に整えられた銀髪、無機質な銀色の管理官スーツ。表情の変化が極めて乏しく、瞳には冷徹な合理性が宿る。
  personality: 徹底した合理主義者。不確実性やエラーを「排除すべきノイズ」と断じる。一人称は「私」。
  speech_style: 淀みがなく、論理的で、相手の感情を一切考慮しない効率重視の話し方。
  background: 都市の自動化管理システムを統括する、中央管理局の最高責任者。都市の完全な最適化を任務としている。
  motivation: 都市の航路や物流から、予測不能な要素（不確実な光や古いナビゲーション）を完全に排除し、エラーゼロの社会を実現すること。
  relationships:
  - name: リク・カイト
    relation: 排除すべき非効率な存在
  arc: リクが復元した灯台の光が、都市の秩序を乱すエラーではなく、人々が目的地へ向かうための「心の羅針盤」であったことを突きつけられる。
- name: ビット
  role: 相棒
  age: 35
  gender: 無性別
  appearance: 塗装が剥げ、あちこちに継ぎ接ぎだらけの小型清掃・修理用ドローン。レンズが片方少し欠けている。
  personality: 献身的でユーモラス。時折、古いデータベースから詩的なフレーズを引用する癖がある。一人称は「当機」。
  speech_style: 機械的な電子音を伴う合成音声だが、リクの感情に同調するように抑揚が変化する。
  background: リクの作業場に放置されていた旧式のメンテナンスドローン。リクによって修理され、以来、作業の補助を行っている。
  motivation: リクの作業をサポートし、捨てられた機械たちが再び機能を取り戻す手助けをすること。
  relationships:
  - name: リク・カイト
    relation: 主人であり親友
  arc: 単なる道具としてのプログラムを超え、リクと共に「光の記憶」を保存する、意志を持った存在としての自覚を持つ。
