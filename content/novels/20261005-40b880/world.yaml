title: 残照のホログラム、波止場の灯火
genre: SF
tone: 静謐でノスタルジックな近未来
pov: 三人称近接
tense: 過去形
setting: 高度な自動化が進み、人の営みが希薄になった22世紀後半の沿岸都市
premise: 海面の上昇により、かつての港湾都市は浮遊型居住区へと姿を変えていた。清掃ドローンが静かに波を叩く街で、遺物修理工のリクは、機能を持たない『古い灯台』のホログラムを修復する依頼を受ける。その灯台は、かつて空を泳いでいた『空飛ぶ船』が、迷わぬよう導くための道標だった。デジタル化された記憶が溢れる世界で、リクは物理的な光が失われた理由と、そこに込められた誰かの願いに触れていく。
themes:
- 技術の進歩と喪失感
- 記憶の質感
rules:
- 実体のある光源は極めて希少であり、現在はほぼ全てが高精細なホログラムで代用されている
- 空飛ぶ船は、現在は航行可能な船体はほぼ存在せず、観光用のホログラム投影機としてのみ機能している
plot_outline:
- '序盤: 自動化された無機質な都市で、リクは古いデバイスの修復を淡々とこなす日々を送っている。ある日、正体不明の依頼人から、廃棄予定の古い灯台のデータを復元してほしいという奇妙な依頼を受ける。'
- '中盤: データの断片を繋ぎ合わせる中で、リクはかつて空飛ぶ船が物流の主役だった時代の記録を見つける。最新のナビゲーション技術が、なぜこれほどまでに『不確実な光』を排除したのか、その過程で人々が何を捨ててきたのかを実感する。'
- '終盤: 復元された灯台の光は、かつての空飛ぶ船たちが辿った航路を、淡い光の帯として描き出す。それは便利さのために忘れ去られた、目的地へと向かうための『迷い』と『祈り』の軌跡だった。'
- '結末: 灯台のホログラムは、リクの作業場の一角で静かに灯り続ける。効率化された街の片隅で、彼はその頼りない光に、かつての人間らしい体温のようなものを感じる。'
style_notes: 三人称近接視点で、主人公の五感（機械の駆動音、合成食料の味、湿った空気感）を丁寧に描写する。便利すぎる生活の中で、あえて「手触りのある不便さ」や「消えゆくものの寂しさ」を、技術用語を日常の言葉として混ぜ込みながら叙情的に綴る。
