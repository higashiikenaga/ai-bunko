- name: 九条 蓮二
  role: 主人公
  age: 34
  gender: 男性
  appearance: 常に隙のない仕立てのスーツを着用。眼鏡の奥の瞳は冷徹なまでに鋭く、感情の起伏が読み取れない。指先が常に清潔に保たれている。
  personality: 極めて論理的かつ冷徹。美的な秩序を重んじ、矛盾を嫌う。一人称は「僕」。
  speech_style: 丁寧だが、どこか突き放すような冷淡な敬語。論理的な矛盾を指摘する際は、静かに、しかし逃げ場を奪うように話す。
  background: 元数学教授。ある事件で「論理が通用しない事象」に直面し、その欠落を埋めるために探偵となった。数理的な思考を事件解決に用いる。
  motivation: 散乱した矛盾（ガラス片と温度変化）を、一つの完璧な論理へと統合すること。
  relationships:
  - name: 氷霜館の住人たち
    relation: 観察対象および容疑者
  arc: 冷徹な論理の追求者が、犯人の犯した「あまりにも人間的な誤り」に触れることで、人間性の不条理を再認識する。
- name: 如月 冴子
  role: 相棒（協力者）
  age: 28
  gender: 女性
  appearance: 動きやすさを重視した落ち着いた服装。観察力に優れた瞳を持ち、現場の微細な変化に気づく。
  personality: 直感的で共感性が高い。九条の冷徹さを補完する、人間的な温かみを持つ。一人称は「私」。
  speech_style: 穏やかで聞き取りやすい口調。九条に対しては、敬意を払いつつも、時に彼の無機質さをたしなめる。
  background: フリーランスのジャーナリスト。偶然、氷霜館の招待客として居合わせ、九条の助手的な役割を担うことになる。
  motivation: 事件の真相を突き止め、被害者の無念を晴らすこと。
  relationships:
  - name: 九条 蓮二
    relation: 論理と直感の補完関係
  arc: 九条の冷徹な論理に触れる中で、真実が時に残酷なものであることを学び、プロとしての覚悟を固める。
- name: 神宮寺 宗一郎
  role: 敵役（犯人）
  age: 52
  gender: 男性
  appearance: 威厳のある老紳士。白髪を完璧に整え、常に穏やかな微笑を浮かべているが、瞳の奥に深い孤独を感じさせる。
  personality: 完璧主義者で、潔癖。一切の汚れを嫌い、自らの論理が完璧であると信じて疑わない。一人称は「私」。
  speech_style: 教養を感じさせる、落ち着いた、重みのある話し方。常に相手を尊重しているような態度を取る。
  background: 被害者の親友であり、氷霜館の管理を任されていた人物。被害者の資産と、氷霜館の「美学」を守ることに執着している。
  motivation: 自らの完璧なトリックによって、不浄な現実（被害者の罪や醜聞）を「氷」の中に封じ込めること。
  relationships:
  - name: 九条 蓮二
    relation: 論理の対決相手
  - name: 被害者
    relation: 親友であり、排除すべき対象
  arc: 完璧なアリバイとトリックを構築した自信が、九条によって「人間的な誤り」として暴かれた際、そのプライドが崩壊していく。
- name: 白鳥 玲奈
  role: 脇役（容疑者）
  age: 22
  gender: 女性
  appearance: 華やかなドレスに身を包んでいるが、どこか怯えたような表情を見せる。常に猫の形をしたアクセサリーを身につけている。
  personality: 情緒不安定で、周囲の空気に敏感。被害者の遺産を狙っているのではないかと疑われる。一人称は「私」。
  speech_style: 早口で、時に感情が昂ると言葉が詰まる。不安を隠すために虚勢を張るような話し方。
  background: 被害者の遠戚。亡き愛猫「名前のない猫」を非常に可愛がっていたとされる。
  motivation: 事件の恐怖から逃れ、自身の潔白を証明すること。
  relationships:
  - name: 神宮寺 宗一郎
    relation: 守られるべき対象（と見せかけて疑念の対象）
  arc: 事件の渦中で、自身の抱える秘密と向き合わざるを得なくなる。
