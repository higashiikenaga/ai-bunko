title: 無垢なる氷の城の不在証明
genre: 本格ミステリー
tone: 冷徹、論理的、硬質な緊張感
pov: 三人称（探偵の思考を括弧書きで挿入）
tense: 過去形
setting: 現代、積雪に閉ざされた北陸の孤立した洋館「氷霜館」
premise: 吹雪によって外部から遮断された洋館「氷霜館」で、資産家が密室内で遺体となって発見された。現場には、主人の愛猫であったはずの「名前のない猫」の形跡すら残っていない。被害者は完璧な物理的密室の中で、氷のように冷たい沈黙を守っている。探偵・九条は、散乱したガラス片と不自然な温度変化という、矛盾する二つの論理的断片を手に、不可解な消失を解き明かしていく。
themes:
- 論理の整合性
- 不在による証明
rules:
- 密室は物理的に外部からの侵入が不可能な構造であること
- 犯行時刻は吹雪が激しくなった特定の時間帯に限定されること
- 提示された手がかり（温度、物質の相転移、遺留品）のみで解決すること
plot_outline:
- '序盤: 吹雪の夜、洋館の主人が書斎の密室で死亡しているのが発見される。現場には不自然な水溜まりと、割れた氷の彫刻が残されていた。探偵は現場の温度変化に注目する。'
- '中盤: 容疑者たちは互いに完璧なアリバイを主張し、論理的な矛盾を突こうと試みる。探偵は、現場から「名前のない猫」の毛が一本も見当たらないこと、そして氷の彫刻の形状が不自然であることを、冷徹な観察眼で指摘していく。'
- '終盤: 探偵は、犯人が「氷の城」に見立てた精巧な氷の仕掛けを用いて、密室の鍵を物理的に操作したトリックを暴く。矛盾する温度計の数値と、物理的な質量保存の法則を用いて、犯人の論理的陥穽を突く。'
- '結末: 犯人は、最も論理的で「潔白」に見えた人物であった。探偵は皮肉を交えながら、犯人が犯した、あまりにも人間的な、そして論理的な誤りを告発する。'
style_notes: 九条レイの文体として、感情を排した硬質な描写を徹底する。探偵の思考プロセスは「（……いや、この温度低下は熱力学的に説明がつかない）」といった形で括弧書きで挿入し、読者が推理のステップを追えるようフェアに構成する。登場人物の会話は、情緒的な叫びではなく、相手の論理的欠陥を突く皮肉な応酬とする。
