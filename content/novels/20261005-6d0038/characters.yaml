- name: カイ・ヴァン・クロムウェル
  role: 主人公
  age: 16
  gender: 男性
  appearance: 無造作な茶髪に、常にゴーグルを額にかけている。油汚れのついた整備服を纏い、快活な瞳をしている。
  personality: 直感的で熱血漢。機械いじりが大好きで、未知の空に対する好奇心が強い。一人称は「俺」。
  speech_style: 元気よく、語尾が跳ねるような快活な話し方。
  background: 浮遊島のスクラップ街で育った孤児。天才的な整備技術を持ち、廃材を集めて自作の高速艇『ゼフィロス号』を組み上げた。
  motivation: 世界で一番速い飛空艇乗りになり、誰も見たことのない空の果てを見ること。
  relationships:
  - name: リリア・エインズワース
    relation: 運命的な相棒
  - name: ピップ
    relation: 弟分のような整備助手
  arc: 単なる個人の野心やスピードへの渇望から、世界の再生という大きな責任を引き受け、仲間を守るために戦う真のリーダーへと成長する。
- name: リリア・エインズワース
  role: 相棒
  age: 18
  gender: 女性
  appearance: 透き通るような銀髪と、どこか遠くを見つめるような神秘的な瞳。上品だが動きやすい旅装束を着ている。
  personality: 冷静沈着で聡明。しかし「嘘をつけない呪い」のせいで、意図せず核心を突きすぎてしまう不器用さがある。一人称は「私」。
  speech_style: 丁寧で穏やかだが、真実を述べる際は一切の迷いがない。
  background: 古代文明の末裔を自称する謎の航海士。ある遺跡で呪いを受け、真実しか口にできなくなったことで帝国から追われる身となった。
  motivation: 自身の呪いを解く手がかりを探し、世界の真実を知るために「銀桜の島」を目指す。
  relationships:
  - name: カイ・ヴァン・クロムウェル
    relation: 信頼するパートナー
  arc: 呪いを「自分を縛る枷」として忌避していたが、カイとの旅を通じて、真実を伝えることの強さと、ありのままの自分を受け入れる勇気を得る。
- name: ヴァルカス・ド・グレイ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 鋭い眼光と深い傷跡のある顔立ち。帝国軍の重厚な黒い軍服に身を包み、威圧感を放っている。
  personality: 冷徹で合理的。秩序こそが世界の安定をもたらすと信じて疑わない徹底した軍人。一人称は「私」。
  speech_style: 低く、命令を下すような威圧的な口調。
  background: 帝国軍の空軍司令官。銀桜の島が持つテラフォーミング能力を、帝国の覇権を絶対的なものにするための兵器として利用しようとしている。
  motivation: 銀桜の島を制圧し、世界を帝国の管理下に置くことで「永遠の秩序」を確立すること。
  relationships:
  - name: カイ・ヴァン・クロムウェル
    relation: 秩序を乱す不届き者
  arc: 絶対的な支配者として君臨しようとするが、カイたちの自由な意志と「予測不能な風」によって、自らの秩序が崩壊していく様を見せつけられる。
- name: ピップ
  role: 脇役
  age: 12
  gender: 男性
  appearance: 小柄で身軽。大きなスパナを腰に下げており、常に動き回っている。
  personality: 明るくお調子者だが、観察力が鋭い。カイを心から尊敬している。一人称は「僕」。
  speech_style: 早口で、驚いたときなどは少し高い声になる。
  background: カイの整備工場で世話になっていた少年。カイの旅に同行することを許され、ゼフィロス号の食料管理や雑用をこなす。
  motivation: カイと一緒に冒険し、いつか自分も立派な整備士として認められること。
  relationships:
  - name: カイ・ヴァン・クロムウェル
    relation: 師匠であり兄のような存在
  arc: 単なる「ついていく少年」から、緊迫した空中戦の中でも冷静に機械の異常を察知し、チームを支える一員へと成長する。
