title: 碧風のスカイ・ランナーと銀桜の彼方
genre: SF
tone: 爽快、エネルギッシュ、躍動感溢れる冒険譚
pov: 三人称
tense: 過去形
setting: 浮遊島々が点在する雲海世界「エテリア」。人々は気流（エアロ・ストリーム）を航路として飛空艇で移動している。
premise: 雲の上の世界で、最速の飛空艇乗りを目指す少年カイは、ある日「嘘をつけない呪い」をかけられた謎の航海士リリアと出会う。二人は伝説の聖地であり、世界を再起動させる力を持つという「銀桜の島」を目指して旅に出る。帝国軍の追撃を振り切り、風を切って突き進む彼らの、絆と自由を求める大冒険が始まる。
themes:
- 自由への渇望
- 不器用な者同士の信頼
rules:
- 飛空艇は『風の結晶』を燃料とし、気流から外れると高度を維持できず墜落する。
- 『嘘をつけない呪い』は古代のナノマシンによる精神干渉であり、本心に反する言葉を発しようとすると激しい衝撃が走る。
- 銀桜の島は100年に一度だけ開花し、その期間だけは世界のどこからでも到達可能な特異点となる。
plot_outline:
- '序盤: 飛空艇整備士のカイが、正体不明の航海士リリアを拾い、自作の超高速艇『ゼフィロス号』で伝説の銀桜の島を目指す旅をスタートさせる。'
- '中盤: 帝国の軍艦隊による執拗な追跡が行われる中、リリアの『嘘をつけない』性質が原因で何度も騒動が起きるが、それが結果的にチームの結束を強めていく。'
- '終盤: ついに到達した銀桜の島で、島の正体がかつての地球を復元するためのテラフォーミング装置であることを知る。帝国はそれを軍事利用しようと襲来し、激しい空中戦が繰り広げられる。'
- '結末: カイと仲間たちは最高の連携で帝国軍を撃退し、銀桜の種を世界中に散布させることで、新たな時代の風を巻き起こす。彼らは再び自由な空へと旅立つ。'
style_notes: エンジンの爆音、風を切る快感、雲海の色彩を鮮やかに描写すること。台詞はテンポ良く、キャラクター同士の掛け合いに勢いを持たせる。飛空艇の構造や飛行メカニズムへのこだわりを細かく書き込み、読者が一緒に空を飛んでいるかのような没入感を演出する。
