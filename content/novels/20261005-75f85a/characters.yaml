- name: エリアス・ノヴァク
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で青白い肌、知的な鋭さを持つがどこか頼りなげな瞳。古文書のインクで汚れた指先と、常に持ち歩いている分厚い手帳が特徴。
  personality: 冷静沈着で分析的な学者肌。知的好奇心が強く、真実のためなら危険を顧みない危うさを持つ。「僕」
  speech_style: 論理的で丁寧な敬語。動揺すると早口になり、専門用語を多用する傾向がある。
  background: 辺境の都市にある歴史図書館の管理人。偶然、古文書の修復中に「秘密の地図」の断片を発見したことで、世界の運命に巻き込まれていく。
  motivation: 地図が示す「原初の熱源」の存在を証明し、歴史の真実を解明すること。
  relationships:
  - name: カイル・ヴァン・クロムウェル
    relation: 護衛兼、信頼を寄せる友人
  - name: イゾルデ・フォン・アイゼンベルク
    relation: 世界の秩序を脅かす敵対者
  arc: 受動的な知識の収集者から、自らの知識を武器に世界の理（ことわり）を変える決断を下す指導者へと成長する。
- name: カイル・ヴァン・クロムウェル
  role: 主人公/相棒
  age: 28
  gender: 男性
  appearance: 鍛え上げられた逞しい体躯と、数々の戦いを潜り抜けてきた深い傷跡。使い込まれた銀の甲冑を纏っている。
  personality: 実直で義理堅い。情熱的だが、感情を表に出すのは苦手な不器用な性格。「俺」
  speech_style: 短く断定的で、武人らしい潔い口調。無駄な言葉を嫌う。
  background: かつて「氷の城」の精鋭騎士団に所属していたが、城の隠蔽工作に抗い、追放された元騎士。現在は傭兵として各地を渡り歩いている。
  motivation: 凍てついた大地で苦しむ民を救い、奪われた祖国の誇りを取り戻すこと。
  relationships:
  - name: エリアス・ノヴァク
    relation: 命を守るべき対象であり、最も信頼するパートナー
  - name: イゾルデ・フォン・アイゼンベルク
    relation: かつての主君であり、打倒すべき宿敵
  arc: 国家への忠誠心という古い価値観から脱却し、真に守るべき「人々」のために戦う個人の意志を確立する。
- name: イゾルデ・フォン・アイゼンベルク
  role: 敵役
  age: 34
  gender: 女性
  appearance: 氷細工のように冷たく美しい容姿。純白のドレスと、絶対的な権威を象徴する氷晶の冠を戴いている。
  personality: 冷酷無比で完璧主義。秩序のためには犠牲を厭わない、圧倒的なカリスマを持つ。「私」
  speech_style: 優雅で静かながら、有無を言わせぬ威圧感を放つ、高圧的な命令口調。
  background: 「氷の城」の現支配者。地熱源を独占することで、数千年にわたりアイゼンガルドの政治的均衡を保ってきた。
  motivation: 熱源の拡散による社会の混乱を防ぎ、氷の支配による現在の「静止した秩序」を維持すること。
  relationships:
  - name: エリアス・ノヴァク
    relation: 秩序を破壊しかねない危険な攪乱者
  - name: カイル・ヴァン・クロムウェル
    relation: 秩序を乱す裏切り者
  arc: 秩序の守護者としての絶対的な確信が、世界の真実によって崩壊し、支配者としての孤独と狂気に陥っていく。
- name: ゼノ
  role: 脇役/トリックスター
  age: 25
  gender: 不明
  appearance: 性別を感じさせない中性的な顔立ち。動きやすさを重視した暗色の革装束に身を包み、常にフードを深く被っている。
  personality: 享楽的で掴みどころがない。利己的で、常に自分に最も利益がある方へと動く。「自分」
  speech_style: 軽薄で冗談めかした、含みのある話し方。相手を煙に巻くのが得意。
  background: 各国の諜報機関から情報を運ぶ「運び屋」。地図の断片を巡る争いに、高額な報酬を求めて介入する。
  motivation: 莫大な富の獲得と、退屈な日常から抜け出すための刺激。
  relationships:
  - name: エリアス・ノヴァク
    relation: 利用価値のある情報の源
  - name: カイル・ヴァン・クロムウェル
    relation: 邪魔な正義漢
  arc: 金銭のみを目的としていたが、世界の変革を目の当たりにし、初めて自身の意志で「誰かのために」動く瞬間を迎える。
