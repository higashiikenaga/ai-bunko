title: 極北の天秤と氷晶の玉座
genre: 群像劇
tone: 重厚、荘厳、政治的
pov: 三人称多視点
tense: 過去形
setting: 永劫の冬に閉ざされた架空の大陸「アイゼンガルド」。地熱源（ヒートコア）を巡る都市国家群。
premise: 全人類が地熱源のみに依存して生きる極寒の世界。絶対的な権力を握る「氷の城」の支配が揺らぎ始めたとき、失われた熱源の在処を示す「秘密の地図」が世に現れる。富と権力を求める野心家たち、祖国の再興を願う騎士、真理を追う学者。それぞれの思惑が交錯し、凍てついた大地で血塗られた覇権争いが幕を開ける。
themes:
- 権力と犠牲
- 生存への渇望
- 歴史の再定義
rules:
- 全ての都市は「ヒートコア」という地熱抽出装置に依存しており、停止すれば数時間で住民は凍死する。
- 氷の城は大陸最大のコアを独占し、他都市へ熱を供給する権利を管理することで政治的支配を行っている。
- 秘密の地図は複数の断片に分かれており、全てを揃えなければ正確な座標は判明しない。
plot_outline:
- '序盤: 図書管理人の青年が古文書の中に「秘密の地図」の断片を発見し、それが各国の諜報機関に知れ渡ることで、静止していた政治状況が急激に流動し始める。'
- '中盤: 各都市国家が同盟と裏切りを繰り返し、地図の断片を奪い合う。氷の城の主は、自らの独占的権威を守るため、地図の存在を抹消しようと大規模な粛清と外交的圧力を仕掛ける。'
- '終盤: 地図が示す「原初の熱源」を目指し、氷の城に反旗を翻した連合軍と城の軍勢が激突する。その過程で、氷の城が実は世界を凍らせていた元凶であるという衝撃の真実が明らかになる。'
- '結末: 氷の城の崩壊とともに、数千年の冬が終わりを告げる。しかし、それは同時に、熱の独占による旧秩序の消滅と、未知の環境での新たな生存競争の始まりを意味していた。'
style_notes: 大河小説のような重厚な語り口を用い、個人の情念よりも組織や国家の力学、権力の遷移を優先して描写する。各章の冒頭には必ず「〇〇年、〇〇の戦いにて～」といった年代記的な記述を挿入し、歴史的俯瞰視点を持たせること。
