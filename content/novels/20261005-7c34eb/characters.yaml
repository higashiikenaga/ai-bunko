- name: 凪沙・クロウ
  role: 主人公
  age: 19
  gender: 女性
  appearance: 砂埃にまみれたゴーグル、使い古された防塵マスク、機能性重視のボロボロの作業着。痩せ型だが引き締まった体つき。
  personality: 現実主義で皮肉屋。生き残るためには手段を選ばない冷淡さを装っているが、根は情に厚い。一人称は「あたし」。
  speech_style: ぶっきらぼうで短い口調。相手を突き放すような、乾いた話し方をする。
  background: 文明崩壊後の都市跡で、低酸素状態の過酷な環境下を生き抜いてきたスカベンジャー（ガラクタ漁り）。
  motivation: 今日を生き延びること、そしていつか「錆びていない空」を見るという漠然とした願い。
  relationships:
  - name: エリオ
    relation: 護衛対象であり、奇妙な絆を感じる相手
  - name: アイリス
    relation: 奇妙な同伴者
  arc: 生存のみを目的とした利己的な生き方から、世界の真実を知り、他者のために命を賭して抗う強さを得る。
- name: エリオ
  role: 相棒
  age: 12
  gender: 男性
  appearance: 日光に当たっていないような透き通る白い肌。古びた白いローブを纏い、大きな瞳が特徴的。
  personality: 純粋無垢だが、嘘をつけない「呪い」ゆえに残酷な真実を平然と口にする。一人称は「ぼく」。
  speech_style: 丁寧で穏やかだが、嘘をつこうとすると激しい拒絶反応で言葉が詰まる。
  background: かつて世界を管理していた施設で、「真実の核」の実験体として育てられたが、社会から忌避され廃棄された少年。
  motivation: 自分がなぜ「嘘」を拒絶するのか、その理由と自分の存在意義を知ること。
  relationships:
  - name: 凪沙
    relation: 自分を守ってくれる唯一の存在
  - name: アイリス
    relation: 唯一の理解者
  arc: 自身の特性を「呪い」として恐れるのではなく、世界の欺瞞を暴くための「光」として受け入れる。
- name: アイリス
  role: 相棒
  age: 17
  gender: 女性型（ホログラム）
  appearance: 青白く光る半透明の少女の姿。時折、激しいノイズが走るホログラム。
  personality: 知的で論理的。記憶の欠落により時折、幼い子供のような脆さを見せる。一人称は「私」。
  speech_style: 穏やかで落ち着いているが、データの断片を提示する際は機械的な響きが混じる。
  background: かつて世界を管理していたシステムの一部。現在は記憶の大部分が破損しており、自身のプロトコルを求めて彷徨っている。
  motivation: 欠落した記憶を修復し、自身の本来の役割を遂行すること。
  relationships:
  - name: エリオ
    relation: 守るべき重要なデータであり、友人
  - name: 凪沙
    relation: 共に旅をする協力者
  arc: 自身の役割が「人類を騙して守る」ことだったという残酷な真実に直面し、プログラムを超えた「意思」を持つ。
- name: 執行官ヴァルガス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 重厚な防護服に身を包んだ、威圧的な巨漢。全身に治安維持機構の紋章が刻まれている。
  personality: 規律と秩序を絶対視する冷酷なリアリスト。世界の安定を維持するためなら、犠牲を厭わない。一人称は「私」。
  speech_style: 感情を排した事務的かつ命令的な口調。一切の妥協を許さない。
  background: 治安維持機構の最高指揮官の一人。世界の崩壊を防ぐために「嘘による管理」を完遂することを使命としている。
  motivation: 「真実の核」を回収し、世界の構造（嘘）を維持・継続させること。
  relationships:
  - name: エリオ
    relation: 回収すべき重要対象
  - name: 凪沙
    relation: 排除すべき反逆者
  arc: 秩序を守るために「嘘」を肯定し続けるが、世界の綻びを前に、自らが守ってきたものの虚無感に直面する。
