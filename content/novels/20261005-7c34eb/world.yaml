title: 錆びた肺と嘘の墓標
genre: ディストピア
tone: 乾いた絶望と、砂埃混じりのユーモア
pov: 一人称（あたし）
tense: 過去形
setting: 大気汚染と金属の塵が降り注ぐ、文明崩壊後の砂漠化した巨大都市跡
premise: 空から降るのは雨じゃなく、肺を削る錆の粉だ。あたしはガラクタ漁りのスカベンジャーとして、今日も残量の少ない酸素缶を握りしめながら死に損ないの街を徘徊している。そんなある日、あたしは言葉を尽くして「嘘をつけない」呪いを受けたガラクタの少年と、記憶の断片を彷徨う迷子の人工知能に出会う。彼らを追う治安維持機構の追跡を逃れながら、あたしは世界の終わりが、実は壮大な嘘の上に成り立っていたことに気づいてしまう。
themes:
- 真実の重み
- 機械に宿る魂
rules:
- 大気中の金属含有量が高いため、防塵マスクのフィルター残量は生命線である
- 高度なAIは物理的な端末を持たない限り、ネットワークの残滓としてしか存在できない
- 特定の汚染物質に触れた人間は、脳の言語野がバグを起こし、嘘をつけなくなる
plot_outline:
- '序盤: 酸素残量3%の極限状態で、あたしは砂に埋もれた旧世代の端末を見つける。そこにいたのは、嘘をつけない呪いによって人間社会から追放された少年と、行き場を失ったAIのホログラムだった。'
- '中盤: 少年とAIが、かつて世界を管理していた『真実の核』の場所を知っていることが判明する。あたしは彼らを護衛（という名の荷物運び）することになるが、追っ手のドローンが容赦なく襲いかかってくる。'
- '終盤: 辿り着いた核の施設で、世界が「嘘」によって維持されている構造が露呈する。AIが隠していたのは、人類を救うための偽りのプロトコルだった。'
- '結末: 錆びた街に、本物の雨が降る。あたしは使い果たした酸素缶を捨て、嘘のない世界で、少年の隣で新しい呼吸を始める。'
style_notes: 「あたし」という一人称を用い、皮肉めいた独白を多用すること。物資（バッテリー、弾薬、酸素、食料）の数値や残量を具体的に描写し、常に生存の危機感を漂わせる。廃墟の中に、例えば「錆びついた鉄骨に絡まる、枯れかけた一輪の合成花」のような、無機質な美しさを一滴だけ混ぜ込むこと。
