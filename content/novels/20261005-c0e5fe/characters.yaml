- name: 九条 蓮一郎
  role: 主人公
  age: 38
  gender: 男性
  appearance: 痩身で目つきが鋭い。常に仕立ての良いが古びた三つ揃えのスーツを着用。指先が常に清潔に保たれている。
  personality: 極めて合理的で冷徹。感情に流されず、物事をパズルとして捉える。一人称は「僕」。
  speech_style: 丁寧だが、相手の矛盾を突く際は容赦のない、淡々とした論理的な口調。
  background: かつては高名な法医学者であったが、ある事件を機に学界を去り、現在は独自の論理体系で事件を解決する探偵として活動している。
  motivation: 混沌とした事象の中から、唯一の真実を論理的に抽出すること。
  relationships:
  - name: 佐伯 結衣
    relation: 助手であり、物語の語り手
  arc: 完璧な論理のみを信奉していたが、被害者が「忘却」を選んだという人間の非合理な意志に、一瞬の敬意を抱くようになる。
- name: 佐伯 結衣
  role: 相棒/語り手
  age: 24
  gender: 女性
  appearance: おっとりとした顔立ちだが、観察眼が鋭い。動きやすい活動的な服装を好む。
  personality: 共感的で人間味にあふれる。九条の理屈っぽさに困惑しつつも、彼の知性を信頼している。一人称は「私」。
  speech_style: 標準的な丁寧語。九条に対しては、敬意を払いつつも時折鋭いツッコミを入れる。
  background: ジャーナリスト志望のフリーライター。村に伝わる「記憶売買」の噂を追って九条の助手として同行する。
  motivation: 村の奇習の真相を暴き、記事として書き上げること。
  relationships:
  - name: 九条 蓮一郎
    relation: 依頼主兼、師のような存在
  arc: ただの好奇心による取材から、事件の残酷さと記憶の重みを知ることで、真実を伝えることの責任を学ぶ。
- name: 神代 宗次郎
  role: 敵役
  age: 52
  gender: 男性
  appearance: 恰幅が良く、威厳を感じさせる風貌。村の有力者であり、売買所の運営を支える実力者。
  personality: 支配欲が強く、計算高い。村の秩序を乱すものを極端に嫌う。一人称は「私」。
  speech_style: 重厚で、相手を威圧するような落ち着いた話し方。
  background: 忘却村の伝統を守ることを至上命題とする村の重鎮。被害者である売買所の主とは長年の協力関係にあった。
  motivation: 売却された記憶の中に隠された「村の存続に関わる秘密」を隠蔽、あるいは独占すること。
  relationships:
  - name: 九条 蓮一郎
    relation: 論理によって自らの欺瞞を暴こうとする宿敵
  arc: 完璧な隠蔽工作を完遂しようとするが、九条の論理によって、自らが守ろうとした「秩序」そのものが崩壊していく様を見せつけられる。
- name: 織部 志乃
  role: 脇役/容疑者
  age: 31
  gender: 女性
  appearance: 常に何かを隠しているような、伏せ目がちな表情。華奢な体つき。
  personality: 臆病で、常に何かに怯えている。感情の起伏が激しい。一人称は「私」。
  speech_style: 小声で、言葉を濁しがちな、自信なさげな話し方。
  background: 売買所の常連客。過去の忌まわしい記憶を消すために、何度も売買所を訪れている。
  motivation: 過去の罪の意識から逃れ、完全に自分を空っぽにすること。
  relationships:
  - name: 神代 宗次郎
    relation: 村の支配に怯える対象
  arc: 事件の真相に触れることで、忘却することだけが救いではないという残酷な事実に直面する。
