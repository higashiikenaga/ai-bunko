title: 記憶売買所の不可解な沈黙
genre: 本格ミステリー
tone: 典雅で静謐、論理的な厳格さを備えた古典的文体
pov: 一人称（探偵を観察する助手視点）
tense: 過去形
setting: 山間部にひっそりと佇む、記憶を取引するという奇習を持つ閉鎖的な村「忘却村」
premise: 記憶を金銭や心の平穏と交換するという奇妙な儀式を行う「記憶売買所」。その主が、完全に密室となった書斎で遺体となって発見される。被害者が死の直前に売却し、自ら忘却したはずの「ある記憶」が、事件解決の唯一の手がかりとなっていた。探偵・九条はこの不可解な密室と、季節外れに飛来した渡り鳥の謎を論理的に解き明かす。
themes:
- 忘却と救済
- 論理による真実の追求
rules:
- 記憶の売買は、精神的な暗示と詳細な記録書への転記によって行われる擬似的な儀式であり、超常現象ではない
- 密室の構造は物理的なトリックに基づき、読者が推測可能な状態で提示される
- 渡り鳥の飛来時期は、地域的な気候変動と連動しており、アリバイ崩しの客観的な指標となる
plot_outline:
- '序盤: 語り手である『私』は、奇人探偵の九条と共に、記憶を売買するという噂のある村を訪れる。そこで、村の権力者である売買所の主が、内側から鍵のかかった部屋で絶命しているのが発見される。'
- '中盤: 現場には季節外れの渡り鳥の羽が落ちており、主が最近「ある重要な記憶」を売却して忘却していたことが判明する。容疑者は売買所に集まっていた数名の客。九条は彼らの証言と、売買所の帳簿に記された矛盾を鋭く指摘する。'
- '終盤: 九条は、被害者が売った記憶が実は「物理的な証拠の隠し場所」に関する記憶であったことを見抜く。また、渡り鳥の飛来を利用した巧妙な時間トリックを論理的に解体し、密室の正体を暴く。'
- '結末: 犯人は、売却された記憶の内容を奪取しようとした人物であった。すべての手がかりを統合し、九条は犯人を追い詰め、純粋な論理的帰結として事件を完結させる。'
style_notes: 19世紀から20世紀初頭の本格推理小説のような格調高い文章。探偵の超人的な洞察力を、助手の驚嘆混じりの視点から描写する。伏線はすべて本文中に淡々と提示し、解決編では数式を解くように鮮やかに論理を展開させる。
