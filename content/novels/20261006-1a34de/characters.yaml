- name: ガルド・ヴォルフ
  role: 主人公
  age: 58
  gender: 男性
  appearance: 銀色の毛並みが混じり始めた老いた狼獣人。深い皺が刻まれた顔に、片目はかつての戦傷で濁っている。使い古された車掌制服を纏っている。
  personality: 寡黙で冷静沈着。酸いも甘いも噛み分けた達観した雰囲気を持つが、内には熱い正義感を秘めている。一人称は「俺」。
  speech_style: 低く落ち着いた声。言葉数は少ないが、一つ一つの言葉に重みがある。
  background: かつて種族間戦争に従軍していた元軍人。戦いの虚しさを悟り、現在は辺境鉄道の車掌として、平和な運行を続けている。
  motivation: 列車に乗る乗客の安全を守り、分断された世界に鉄道という名の繋がりを維持すること。
  relationships:
  - name: リオ・シルヴェスタ
    relation: 目をかけている護衛対象
  - name: ルゥ
    relation: 守るべき子供
  arc: 過去の罪悪感から逃れ、古い秩序を守ることではなく、新しい時代を切り拓くために戦う決意を固める。
- name: リオ・シルヴェスタ
  role: 主人公
  age: 19
  gender: 女性
  appearance: 小柄でしなやかな体躯を持つ猫耳亜人。黒い髪に跳ねるような耳が特徴。機能性を重視した革製の運び屋服と、多くの小道具を収めるポーチを身につけている。
  personality: 現実主義で皮肉屋。他人を簡単には信じないが、一度懐に入れた相手には非常に義理堅い。一人称は「あたし」。
  speech_style: 早口で、少し投げやりな口調。街の隠語を交えた話し方をする。
  background: 種族差別が激しい都市から、禁忌とされる魔導遺物を運び出すために逃亡中。常に追手に追われている。
  motivation: 大陸の終着点にあるとされる「自由な地」に辿り着き、追っ手から解放されること。
  relationships:
  - name: ガルド・ヴォルフ
    relation: 頼りになる（が、口うるさい）大人
  - name: ルゥ
    relation: 放っておけない危うい存在
  arc: 一人の生存を目的とした「逃亡者」から、他者と共に歩むことを選ぶ「仲間」へと成長する。
- name: ルゥ
  role: 主人公
  age: 8
  gender: 不明
  appearance: 透き通るような銀髪を持つ幼い子供。頭部には小さな角があり、瞳は魔導エネルギーが宿っているかのように淡く光る。どこか浮世離れした美しさを持つ。
  personality: 純粋無垢で好奇心旺盛。感情表現は乏しいが、本能的な鋭さを持つ。一人称は「ボク」。
  speech_style: たどたどしく、直接的な言葉を使う。時折、予言のような不可解な言葉を口にする。
  background: 廃墟となった魔導研究所の残骸の中で発見された、記憶喪失の竜の仔。強大な魔力を持つが、その制御方法は不明。
  motivation: 自分が何者であるかを知り、自分を受け入れてくれる場所を見つけること。
  relationships:
  - name: ガルド・ヴォルフ
    relation: 父親のような存在
  - name: リオ・シルヴェスタ
    relation: 姉のような存在
  arc: 自身の持つ強大な力が破壊のためではなく、未来を作るための力であることを理解していく。
- name: ゼノス・ヴァルガス
  role: 敵役
  age: 42
  gender: 男性
  appearance: 隙のない仕立ての人間用スーツを着こなす、鋭い眼光の男。蒸気駆動の杖を携え、常に冷徹な威圧感を放っている。
  personality: 徹底した種族至上主義者。論理的で冷酷。秩序のためには犠牲を厭わない。一人称は「私」。
  speech_style: 丁寧で理知的だが、相手を見下すような響きが含まれる。
  background: 大陸の純血主義団体「アイアン・ピュリティ」の指導者。鉄道網を種族の境界を管理するための道具として再定義しようとしている。
  motivation: 混在する種族を排除し、人間による絶対的な支配体制を構築すること。
  relationships:
  - name: ガルド・ヴォルフ
    relation: 排除すべき旧時代の遺物
  arc: 自らの理想が崩壊していく中で、狂信的な執着を強め、最終的に破滅へと向かう。
