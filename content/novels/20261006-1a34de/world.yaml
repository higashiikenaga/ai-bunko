title: 獣牙の轍、鉄の咆哮
genre: 群像劇
tone: 重厚で野性的、哀愁漂うハードボイルド
pov: 三人称・多視点
tense: 過去形
setting: 蒸気機関と魔導技術が混在する、多種族が共生・対立する大陸『獣鎖大陸（じゅうさたいりく）』の辺境鉄道沿線
premise: 種族の境界線が引かれた大陸で、鉄路は唯一の生命線であり、同時に分断の象徴でもある。利権を巡る種族間の紛争が激化する中、ある老いた狼獣人の車掌、逃亡中の猫耳亜人の運び屋、そして記憶を失った竜の仔という、全く異なる背景を持つ者たちが、運命に導かれるように一つの列車に乗り合わせる。彼らは、大陸の終着点へと向かう『最終列車』の中で、それぞれの過去と向き合い、生存を懸けた選択を迫られる。
themes:
- 種族間の軋轢と共生
- 宿命からの脱却
- 喪失と再生
rules:
- 獣人は嗅覚と聴覚が極めて鋭く、感情の揺らぎは体臭の変化として現れる
- 魔導機関車は特定の魔石を燃料とし、その脈動は生物の鼓動のように響く
- 種族間の婚姻や共生は法的に制限されているが、地下組織では黙認されている
plot_outline:
- '序盤: 各視点の登場人物たちが、それぞれの目的を持って辺境の駅へと集い、運命の列車へと乗り込む。車内には種族間の不穏な空気が漂っている。'
- '中盤: 列車の走行中に、種族主義的な過激派によるテロが発生。混乱の中で、登場人物たちは互いの生存のために手を組まざるを得なくなる。脱出の過程で、彼らは互いの「匂い」を通じて、隠された孤独を知っていく。'
- '終盤: 列車は大陸の最果て、伝説に語られる『約束の丘』へと向かう急勾配の路線へ突入する。そこには、全ての種族が平穏に暮らせるという古い約束の残滓があった。'
- '結末: 激しい争いの末、列車は丘へと辿り着く。生き残った者たちは、変わり果てた世界を見つめながら、新たな種族の在り方を模索し始める。'
style_notes: 五感、特に「匂い」と「音」に徹底的にこだわる。風に乗る血の匂い、蒸気機関の重低音、獣の毛並みが擦れる音などを描写し、読者の嗅覚と聴覚を刺激する。種族ごとの言葉の重みや、毛並みの質感、爪の鋭さといった生理的な描写を織り交ぜ、骨太な文体で構築する。
