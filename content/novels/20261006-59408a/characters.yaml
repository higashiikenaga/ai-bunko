- name: 湊 栞
  role: 主人公
  age: 26
  gender: 女性
  appearance: 黒髪のショートボブ、落ち着いた瞳、清潔感のあるエプロン姿。
  personality: 観察眼が鋭く冷静だが、情に厚い。一人称は「わたし」。
  speech_style: 丁寧で穏やかな敬語。相手の話を遮らずに聞く。
  background: 元・精密機器メーカーの技術者。都会での激務に疲れ、故郷の古いカフェ「灯台館」を継いだ。
  motivation: 模型の不具合を解明し、持ち主である老紳士の願いを叶えること。
  relationships:
  - name: 結城 源一郎
    relation: 常連客であり、模型の持ち主
  arc: 機械の修理を通じて人の心の機微に触れ、自分の持つ技術が誰かの救いになることを実感する。
- name: 結城 源一郎
  role: 脇役（依頼人）
  age: 75
  gender: 男性
  appearance: 白髪の整った老紳士。使い込まれた真鍮の眼鏡をかけている。
  personality: 誠実で礼儀正しいが、どこか寂しげな影を纏っている。一人称は「私」。
  speech_style: 品のある古風な話し方。時折、過去を回想する際に言葉が震える。
  background: 元・町の役場職員。数十年前、灯台守の行動を「不審なもの」と誤解し、それを悔やみ続けている。
  motivation: 模型を再び動かし、止まってしまった過去の時間に終止符を打つこと。
  relationships:
  - name: 湊 栞
    relation: カフェの店主
  - name: 佐伯 誠
    relation: かつての灯台守（誤解の対象）
  arc: 真実を知ることで、長年自分を縛り付けていた罪悪感から解放される。
- name: 佐伯 誠
  role: 過去の重要人物
  age: 35
  gender: 男性
  appearance: 古い写真の中では、鋭いがどこか優しい眼差しを持つ青年灯台守。
  personality: 寡黙で責任感が強く、献身的。一人称は「僕」。
  speech_style: （手紙などの記述において）簡潔で、迷いのない誠実な言葉選び。
  background: 数十年前の灯台守。町を守るために独りで動いていたが、その行動が誤解され、不名誉な形で記憶されている。
  motivation: （過去において）灯台の灯を守り、町の平穏を維持すること。
  relationships:
  - name: 結城 源一郎
    relation: かつての町民
  arc: 死後、隠されていた手紙によって、その献身的な真実が証明される。
- name: 凪沙
  role: 脇役（助手）
  age: 19
  gender: 女性
  appearance: 明るい茶髪をポニーテールにした、快活な雰囲気の大学生。
  personality: 好奇心旺盛で直感的。町の噂話に詳しい。一人称は「私」。
  speech_style: はきはきとした元気な話し方。少し砕けた口調。
  background: 地元の大学生で、カフェ「灯台館」のアルバイト。町の歴史や伝承に詳しい。
  motivation: 栞の謎解きをサポートし、町に眠る面白い物語を見つけること。
  relationships:
  - name: 湊 栞
    relation: 雇い主であり、尊敬する先輩
  arc: 単なる「町の噂」と「真実の歴史」の違いを学び、物事の多面性に気づく。
