title: 潮騒の灯台と、小さな蒸気仕掛けの約束
genre: 本格ミステリー
tone: 穏やかで温かみのある、少し不思議な日常
pov: 一人称（わたし）
tense: 過去形と現在形の混在
setting: 現代、古い灯台が残る静かな海辺の町。海が見える古民家カフェ「灯台館」
premise: 岬の端にある古い灯台を見下ろすカフェで、わたしは日々、コーヒーを淹れながらお客さんのささやかな悩みを聞いています。ある日、常連の老紳士が「動かなくなった小さな蒸気機関の模型」を修理してほしいと持ち込んできました。その模型の不具合を紐解いていくうちに、灯台にまつわる数十年前の、ある優しさと誤解の物語が浮かび上がってきます。
themes:
- 世代を超えた善意の継承
- 誤解が解ける瞬間の温かさ
rules:
- 物語の中で殺人は一切発生しない
- 謎の解明は、物体の構造や人々の言葉の端々に隠された「真の意図」から導き出される
plot_outline:
- '序盤: カフェ「灯台館」ののんびりとした日常。常連の老紳士が、真鍮製の小さな蒸気機関模型を「どうしても動かしたい」と持ち込む。'
- '中盤: 模型を観察するうちに、内部に不自然な隙間があることに気づく。その隙間は、かつて灯台守が愛用していた古い鍵と呼応していることが判明する。'
- '終盤: 鍵を使って模型の隠し機構を動かすと、中から数十年前の「ある手紙の断片」が現れる。それは、町の人々が誤解していた、ある人物の献身的な行動の証拠だった。'
- '結末: 誤解が解け、老紳士の心に長年のわだかまりが消える。わたしは、晴れやかな気持ちで新しいコーヒーを淹れる。'
style_notes: 「わたし」の視点で、まるで隣で喋っているような軽やかで少しとぼけた語り口。難しい言葉は避け、コーヒーの香りや潮の匂い、真鍮の質感など、五感に訴える描写を大切にする。謎解きのプロセスは論理的でありつつも、読後感は常に「人の善意」に触れたような温かいものにする。
