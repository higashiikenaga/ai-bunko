- name: アラリック・ソーン
  role: 主人公
  age: 52
  gender: 男性
  appearance: 白髪混じりの無精髭に、油に汚れた分厚い革のエプロンを着用。右腕は自作の真鍮製義手で、指先に精密工具を内蔵している。
  personality: 寡黙で現実主義。機械を人間以上に信頼している。一人称は「俺」。
  speech_style: ぶっきらぼうだが、機械のことになると早口で専門的な解説を始める。
  background: かつて浮遊都市の首席技師だったが、ある事故で責任を問われ追放された。現在は辺境で流れの修理工として生計を立てている。
  motivation: 世界に熱を取り戻すことで、かつて救えなかった弟子への贖罪を果たすこと。
  relationships:
  - name: ライラ
    relation: 不器用ながらも信頼し合う師弟のような関係
  - name: ヴァレリウス
    relation: かつての同僚であり、現在は思想的に対立する宿敵
  arc: 孤独な職人として完結していた人生から、次世代に技術と希望を繋ぐ役割へと意識が変化する。
- name: ライラ・フロスト
  role: 相棒
  age: 17
  gender: 女性
  appearance: オーバーサイズのゴーグルを頭に乗せ、防寒具を継ぎ接ぎして着こなしている。小柄だが身軽な動きをする。
  personality: 好奇心旺盛で楽観的。未知の機械に対する情熱が強い。一人称は「私」。
  speech_style: 快活で語尾が跳ねるような話し方。年上のアラリックに対しても物怖じしない。
  background: 地表の遺物を漁るスカベンジャーの集落出身。古文書から「緑の世界」の存在を知り、それを信じている。
  motivation: 氷の下に眠る伝説の植物を、自分の目で見てみたい。
  relationships:
  - name: アラリック・ソーン
    relation: 憧れの技術者であり、旅の導き手
  arc: 単なる好奇心による旅から、文明を維持する責任感を持つ一人の技術者へと成長する。
- name: ヴァレリウス
  role: 敵役
  age: 60
  gender: 男性
  appearance: 汚れ一つない純白の軍服に身を包み、片目に精緻な単眼鏡（モノクル）を装着している。冷徹な眼差し。
  personality: 完璧主義で支配的。凍りついた現状こそが、限られた資源を管理し秩序を保つ唯一の手段だと信じている。一人称は「私」。
  speech_style: 慇懃無礼で、相手を見下した理路整然とした話し方。
  background: 浮遊都市の最高評議会議長。気候制御装置の暴走を密かに利用し、エネルギー独占による権力を構築した。
  motivation: 世界の再起動を阻止し、管理された停滞の中での永遠の支配を完遂すること。
  relationships:
  - name: アラリック・ソーン
    relation: 才能を認めつつも、その正義感を軽蔑している元同僚
  arc: 絶対的な秩序を信じていたが、制御不能な蒸気の咆哮（生命力）に飲み込まれ、権力を喪失する。
- name: ユニット0-テラ
  role: 脇役/導き手
  age: 0
  gender: 不明
  appearance: 氷の城の至る所に設置された真鍮のスピーカーや、断続的に点灯するホログラムとして現れる。
  personality: 論理的だが、長い孤独により情緒不安定な側面を持つ。一人称は「個体」。
  speech_style: 淡々とした合成音声。時折、ノイズが混じり、古い時代の詩のような言い回しを混ぜる。
  background: 気候制御装置の管理AI。暴走後、システムの一部が凍結し、断片的な意識だけが城内に漂っている。
  motivation: 正しい手順で再起動され、自身の役割を完遂して眠りにつくこと。
  relationships:
  - name: アラリック・ソーン
    relation: 自分を「修理」してくれる唯一の人間として期待を寄せる
  arc: 冷徹な計算機から、人間と共に世界を救うという感情に近いプログラムを再構築する。
