title: 真鍮の鼓動と、零下の心臓
genre: SF
tone: 煤けた真鍮の重厚さと、凍てつく静寂の対比
pov: 三人称
tense: 過去形
setting: 大気蒸気機動時代。巨大な蒸気浮遊都市が唯一の生存圏であり、地表はかつての気候制御装置の暴走により、永遠の氷に閉ざされた世界。
premise: かつて世界を暖めていた巨大気候制御装置が暴走し、その姿は今や巨大な氷の城と化している。老練な修理工は、止まった世界の熱を取り戻すため、壊れた熱切断剣を手に、凍りついた機械の心臓部へと潜入する。真鍮の歯車が軋み、蒸気が咆哮する中、彼は文明の遺産を繋ぎ止めるための、命懸けの修理作業を開始する。
themes:
- 失われた技術の継承
- 職人の矜持
rules:
- すべての動力は蒸気圧に依存し、圧力が一定以下になると機械は即座に凍結・停止する
- 氷の城の正体は、制御を失いナノマシン化が進んだ超低温冷却機構である
- 真鍮と銅の合金のみが、極低温下での金属脆化を防ぐことができる
plot_outline:
- '序盤: 蒸気船で各地を巡る修理工の日常。ある依頼により、伝説の熱切断剣の破片を回収し、氷の城への旅が始まる。'
- '中盤: 氷の城の入り口である巨大排気口の閉塞を、高圧蒸気と真鍮の工具を用いて突破する。内部の複雑な機械迷宮を進み、ナノマシンによる凍結攻撃を回避する。'
- '終盤: 制御装置の心臓部へ到達。折れた剣を現場の部品で一時的に再構築し、凍りついたメイン・バルブを切り裂いて蒸気の循環を再開させる。'
- '結末: 蒸気の咆哮と共に世界に熱が戻り、街に鐘の音が響き渡る。修理工は煤けた煙突の煙を見つめながら、次なる修理の地へと向かう。'
style_notes: 蒸気、真鍮、油、煤の匂いを想起させる、硬質で緻密な文体。ピストン、バルブ、歯車の噛み合わせといった機械の構造を、設計図を描くかのように具体的に描写すること。職人たちの会話は無骨で、感情よりも技術への敬意を優先させる。物語の節目には、必ず煙突から立ち昇る煙や重厚な鐘の音を配置し、音と匂いで世界を構築する。
