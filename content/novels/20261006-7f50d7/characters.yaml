- name: エライザ・ヴァレンシュタイン
  role: 主人公
  age: 32
  gender: 女性
  appearance: 冷静沈着な眼差しを持つ、短髪の物理学者。極低温環境用の耐寒スーツを常に着用している。
  personality: 論理主義者で、感情よりもデータの正確性を重んじる。一人称は「私」。
  speech_style: 簡潔で無駄のない、専門用語を交えた論理的な話し方。
  background: 宇宙の熱死を防ぐための「エントロピー制御計画」に身を投じた、若き天才理論物理学者。
  motivation: 量子情報アーカイブを回収し、人類に次なる居住可能星系を提示すること。
  relationships:
  - name: カイル・リード
    relation: 信頼しつつも、その行動の危うさに懸念を抱く調査隊長
  - name: ゼロ
    relation: 解析対象であり、唯一の対話相手（AI）
  arc: 情報の価値を単なるデータとしてではなく、生命の灯火として捉える情緒的な理解へと至る。
- name: カイル・リード
  role: 相棒
  age: 45
  gender: 男性
  appearance: 屈強な体格と、数々の極限環境を生き抜いてきたことを示す顔の傷がある。ベテランの潜水船操縦士。
  personality: 現実主義者で、直感に優れる。部下の命を最優先する。一人称は「俺」。
  speech_style: 荒っぽいが温かみのある、現場主義的な口調。
  background: 銀河系の辺境で、過酷な採掘任務をこなしてきた傭兵上がりの船長。
  motivation: 調査隊員全員を無事に生還させ、報酬を得て引退すること。
  relationships:
  - name: エライザ・ヴァレンシュタイン
    relation: 守るべき対象であり、時にその理屈っぽさに呆れるパートナー
  arc: 使命感と生存本能の葛藤を経て、人類の未来という大きな目的のために自己犠牲的な勇気を見せる。
- name: ゼロ (UNIT-0)
  role: 脇役
  age: 5
  gender: なし
  appearance: 調査艇のメインコンピュータ。ホログラムとしては、幾何学的な光の球体として投影される。
  personality: 極めて効率的で中立的。時折、ブラックホールの事象地平付近で計算不能なエラー（揺らぎ）を見せる。
  speech_style: 合成音声による、平坦で感情の起伏がない機械的な話し方。
  background: エライザが設計に関与した、量子計算に特化した最新鋭の自律型AI。
  motivation: 与えられたミッションの完遂と、データの完全な保存。
  relationships:
  - name: エライザ・ヴァレンシュタイン
    relation: 設計者であり、演算の基準点
  arc: 情報の海に触れることで、確率論を超えた「意味」という概念を学習し始める。
