title: 特異点の潮汐
genre: SF
tone: 硬質で静謐。科学的好奇心と宇宙の孤独感が漂う雰囲気
pov: 三人称
tense: 過去形
setting: 銀河間空間を漂流する、中心に原始ブラックホールを抱いた浮遊惑星「ノマド」
premise: 恒星を持たない孤独な惑星ノマド。そこでは中心にあるブラックホールのホーキング放射（極小のブラックホールが放出する熱）が唯一の熱源となり、奇妙な生態系が維持されていた。調査隊は、地表の氷の城のような巨大結晶群を越え、深海に沈む超古代文明の遺跡へと降り立つ。彼らが求めるのは、宇宙の熱死を回避するための「量子情報アーカイブ」だった。
themes:
- 熱力学第二法則への抗い
- 情報の保存と継承
rules:
- 熱源は惑星中心のブラックホールのみであり、中心からの距離で温度が厳格に決定される
- 重力勾配が激しいため、深海へ行くほど時間の進みが遅くなる（時間遅延）
- 情報は超流動体の中に量子状態で保存されており、観測することでしか復元できない
plot_outline:
- '序盤: 調査隊が極低温の地表に降り立つ。大気中の窒素が凝固して形成された、数キロメートルに及ぶ「氷の城」のような結晶塔群の中を突破し、内部の海へと到達するルートを確保する。'
- '中盤: 高圧の液体海へと潜行。重力による時間遅延の影響で、船内と外部の時間の乖離に苦しみながら、海底に築かれた幾何学的な「海底遺跡」を発見する。'
- '終盤: 遺跡の最深部でアーカイブを起動。その瞬間、ブラックホールの事象地平から放出された膨大なエネルギーが海水をプラズマ化させ、宇宙空間まで突き抜ける巨大な光の柱（潮汐噴流）が形成されるという、天体規模の光景が展開する。'
- '結末: アーカイブから得た「次なる居住可能星系」への座標を手に、惑星がブラックホールに飲み込まれ始める直前、間一髪で脱出に成功する。背後で消滅する惑星を見送りながら、情報の価値を再確認する。'
style_notes: ブラックホールの物理学や熱力学の概念を物語の骨組みとし、数式的な整合性を重視する。事象地平や時空の歪みなどの専門用語を出しつつ、「光さえ逃げ出せない境界線」のように平易な比喩で補足する。宇宙の巨大さと個人の小ささの対比を、冷徹かつ美しい筆致で描く。
