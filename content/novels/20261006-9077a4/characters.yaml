- name: 潮崎 凪
  role: 主人公
  age: 23
  gender: 女性
  appearance: 都会的な服装だが、疲れ切った表情。祖父譲りの淡い灰色の瞳を持っている。
  personality: 合理的で懐疑的。一方で情に弱く、捨てられたものへの同情心が強い。一人称は「私」。
  speech_style: 標準語。丁寧だが、核心を突くときはぶっきらぼうになる。
  background: 幼少期に村を離れ、東京で美大生として過ごしていた。祖父の急死により、数十年ぶりに影浦村へ帰郷する。
  motivation: 祖父の死の真相を突き止め、この村に漂う不気味な違和感の正体を解明すること。
  relationships:
  - name: 影浦 静馬
    relation: 村の権力者であり、監視役
  - name: 澪
    relation: 唯一心を開いてくれる年下の友人
  arc: 村の外れ者として冷遇されるが、次第に血脈に刻まれた「影」の宿命を受け入れ、因習を断ち切る覚悟を決める。
- name: 影浦 静馬
  role: 敵役
  age: 68
  gender: 男性
  appearance: 常に糊のきいた古風な着物を纏い、背筋が不自然に伸びている。瞳の光が乏しく、底が見えない。
  personality: 静謐で威圧的。村の存続こそが絶対正義であり、個人の犠牲を厭わない冷酷な合理主義者。一人称は「私」。
  speech_style: 穏やかな口調だが、断定的な言い回しが多く、相手を精神的に追い詰める話し方をする。
  background: 影浦村の名家であり、灯台の管理と「潮祭り」の執行を司る村長。代々、海との契約を維持してきた。
  motivation: 「影」の供物を捧げ続けることで、村の繁栄と自身の権威を維持すること。
  relationships:
  - name: 潮崎 凪
    relation: 利用価値のある「血筋」の帰還者
  arc: 凪を儀式の中心に据えようと画策するが、想定外の事態により、自らが守ってきた「掟」の残酷さに飲み込まれていく。
- name: 澪
  role: 相棒
  age: 19
  gender: 女性
  appearance: 日に焼けた肌と短い髪。首に古びたお守りを巻き付けている。常にどこか怯えた様子で周囲を窺っている。
  personality: 気が強く皮肉屋だが、根は臆病。村の因習に絶望しており、外の世界への憧れが強い。一人称は「うち」。
  speech_style: 強い方言が混じる。ぶっきらぼうに突き放すが、言葉の端々に気遣いが滲む。
  background: 村の端でひっそりと暮らす漁師の娘。過去に親しい友人を「潮祭り」で失い、村の正体に気づいている。
  motivation: 凪と共にこの村から脱出すること。そして、失われた「影」を取り戻す方法を探すこと。
  relationships:
  - name: 潮崎 凪
    relation: 共犯者であり、希望の象徴
  arc: 絶望に浸っていたが、凪の行動に感化され、自らの意志で禁忌を破り、灯台の真実を暴く手助けをする。
