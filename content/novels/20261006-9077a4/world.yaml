title: 影を還す、潮の掟
genre: 伝奇
tone: 静謐で、湿り気を帯びた、逃げ場のない恐怖
pov: 三人称
tense: 過去形
setting: 現代、地図から消えかけた沿岸の集落「影浦村」
premise: 祖父の死を機に帰郷した凪を待っていたのは、湿った潮風と、不気味に繰り返される「潮祭り」の儀式だった。村の端に佇む古い灯台は、船を導くためのものではなく、海に潜む「何か」の視線を逸らすための、逃げ場のない目隠しであった。祭りの夜、灯台の光が禁忌の方向へと揺らめいたとき、凪は村が守り続けてきた、血塗られた因習の深淵を覗き込むことになる。
themes:
- 血縁と因習
- 自然への畏怖と報い
rules:
- 祭りの夜、灯台の光が直接目に触れた者は、その者の『影』が海に引きずり込まれる
- 村人は祭りの間、海に関する特定の言葉を口にしてはならない
- 灯台の光は、海神の視線を逸らすための目隠しとして機能する
plot_outline:
- '序盤: 祖父の葬儀を終えた凪は、村の閉鎖的な空気と、古い灯台を崇める奇妙な風習に違和感を覚える。'
- '中盤: 祭りの準備が進む中、凪は祖父の遺品から『光を見てはならぬ』という警告を見つける。村の老婆たちは、方言を交えた意味深な言葉で凪を遠ざけようとする。'
- '終盤: 祭りの夜。狂乱の囃子の中、突如として灯台の光が村の居住区へと向けられる。人々が次々と『影』を失い、生ける屍のようになっていく。'
- '結末: 凪は灯台へ駆け込むが、そこで見たのは、光を灯していたのが人間ではなく、海から這い上がった『何か』であった。村の繁栄は、定期的な『影』の供物によって成り立っていたのだ。'
style_notes: 潮の香りと腐敗の臭いが漂うような、五感に訴えかける描写を重視する。会話には地方特有の訛りを多用し、不気味な距離感を演出すること。恐怖を直接的に描くのではなく、静寂や視線の動き、予兆によって「逃げ場のなさ」を表現する。
