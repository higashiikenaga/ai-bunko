- name: 佐藤 早耶
  role: 主人公
  age: 28
  gender: 女性
  appearance: 都会的な洗練された服装だが、どこか疲れが見える。料理をするときは髪をきっちりとまとめ、真剣な表情を見せる。
  personality: 責任感が強く真面目だが、内面に孤独を抱えている。一度決めたら曲げない頑固さがある。一人称は「私」。
  speech_style: 丁寧で落ち着いているが、母に対してはどこか壁を感じさせる、少し硬い話し方。
  background: 東京の広告代理店で働いていたが、父の訃報をきっかけに10年ぶりに故郷へ戻る。10年前、家族との衝突から家を飛び出した過去を持つ。
  motivation: 父の死の真相（感情的な意味での未練）を整理し、母との断絶された関係を修復すること。
  relationships:
  - name: 佐藤 芳江
    relation: 母
  - name: 佐藤 健一
    relation: 父
  - name: 渡辺 拓海
    relation: 幼馴染
  arc: 都会での空虚な生活から、故郷の味と家族の絆の重要性に気づき、自分の「居場所」を再定義して新しい人生を歩み始める。
- name: 佐藤 芳江
  role: 主要人物
  age: 56
  gender: 女性
  appearance: 小柄で、長年の立ち仕事によって少し節くれだった手。常に使い込まれたエプロンを身に着けている。
  personality: 寡黙で感情を表に出さない。言葉よりも料理や手つきで意思を伝えるタイプ。一人称は「私」。
  speech_style: 短く、静かな話し方。多くを語らず、沈黙の中に深い感情を込める。
  background: 定食屋「さとう」を夫と共に切り盛りしてきた。夫の死後、娘との溝を抱えたまま一人で店を守り続けてきた。
  motivation: 言葉にできない寂しさや、娘への複雑な思いを、料理を通じて伝えようとする。
  relationships:
  - name: 佐藤 早耶
    relation: 娘
  - name: 佐藤 健一
    relation: 夫
  arc: 娘に対して閉ざしていた心を少しずつ開き、レシピノートを託すことで、家族の歴史を次世代へと繋ぐ決意をする。
- name: 佐藤 健一
  role: 鍵となる人物
  age: 62
  gender: 男性
  appearance: 温厚そうな目尻の下げた顔立ち。常にラジオのそばにいた、包容力のある佇まい。
  personality: 穏やかで家族想い。争いを好まず、料理とラジオを愛する静かな人物。一人称は「俺」。
  speech_style: 低く落ち着いた、聞き手に安心感を与える優しい話し方。
  background: 定食屋「さとう」の店主。早耶の家出後も、彼女がいつか戻ってくることを信じて店を守り続けていた。
  motivation: （死後）遺した料理とラジオを通じて、バラバラになった家族を再び結びつけること。
  relationships:
  - name: 佐藤 早耶
    relation: 娘
  - name: 佐藤 芳江
    relation: 妻
  arc: 物語の回想や遺された品を通じて、早耶と芳江の心の氷を溶かす触媒としての役割を果たす。
- name: 渡辺 拓海
  role: 脇役
  age: 30
  gender: 男性
  appearance: 明るい表情の、健康的で親しみやすい青年。地元の商店街で働いている。
  personality: お節介だが、観察眼が鋭く、さりげない気遣いができる。一人称は「僕」。
  speech_style: 飾らない、少し地元の訛りが混じった親しみやすい話し方。
  background: 早耶の幼馴染で、定食屋の常連。早耶が家を飛び出した経緯も、家族の雰囲気もよく知っている。
  motivation: 早耶が故郷の空気感に馴染み、再びこの街で前を向けるよう、遠回しにサポートすること。
  relationships:
  - name: 佐藤 早耶
    relation: 幼馴染
  arc: 早耶が過去のわだかまりを乗り越え、店を継ぐ決意をする過程を、外部の視点から見守り支える。
