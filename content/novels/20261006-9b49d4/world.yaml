title: 雨上がりの金木犀と、母の煮物
genre: ヒューマンドラマ
tone: 静謐で温かい、歳月の積み重なりを感じさせる日常描写
pov: 三人称
tense: 過去形
setting: 現代、地方都市の古い住宅街にある小さな定食屋
premise: 父の死をきっかけに、10年ぶりに故郷へ戻った娘の早耶。口を閉ざした母と、古びた店に漂う懐かしい匂い。父が愛した「夜明けのラジオ」と、代々受け継がれてきた煮物の味を通じて、バラバラになった家族が失った時間を取り戻していく物語。
themes:
- 家族の再生
- 食による記憶の継承
rules:
- 料理の工程に家族の思い出を重ねて描写する
- 会話は最小限にし、行間に感情と歳月を込める
plot_outline:
- '序盤: 父の葬儀後、早耶は実家の定食屋の片付けを始める。母との間に流れる重い沈黙の中で、父が毎朝聴いていた古いラジオを見つけ、深夜から夜明けにかけて流れる静かな番組に耳を傾ける。'
- '中盤: 母が作る煮物の味が、幼い頃の記憶と少しずつ重なり合う。料理の手つきや出汁の香りに導かれ、早耶は母が言葉にできなかった寂しさと、父が店に込めた愛情を時間をかけて理解していく。'
- '終盤: 10年前、激しい喧嘩の末に最終列車で家を飛び出した日の記憶と向き合う。共に台所に立ち、父の好物だった料理を完成させる過程で、親子は長年のわだかまりを静かに溶かしていく。'
- '結末: 母から店とレシピノートを譲り受けた早耶は、再びこの街で料理を始める。夜明けのラジオを聴きながら、新しい朝を迎える家族の静かな食卓で物語は幕を閉じる。'
style_notes: 久我山灯子のスタイルを徹底し、何気ない会話の中に長い歳月を滲ませること。特に料理の場面では、素材を扱う手つきや音、香りに家族の歴史を投影させ、静かで温かい語り口で綴る。
