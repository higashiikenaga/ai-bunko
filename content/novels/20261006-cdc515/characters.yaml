- name: ルナ・アスター
  role: 主人公
  age: 19
  gender: 女性
  appearance: 星型のヘアクリップでまとめた明るい茶髪。カラフルなエプロンを身に纏い、瞳は好奇心でキラキラしている。
  personality: 天真爛漫で共感力が高い。お菓子作りへの情熱が強く、誰かを笑顔にすることに喜びを感じる。一人称は「あたし」。
  speech_style: 快活で親しみやすい。「〜だよ！」「〜だね！」と語尾が跳ねるような話し方。
  background: 「世界一幸せな味」を探してルミナス・シティにやってきた。現在は深夜営業のダイナーで店員として働きながら、独学でパフェの研究に励んでいる。
  motivation: 訪れる客にぴったりの「記憶の味」を再現したパフェを提供し、彼らの心を癒やすこと。
  relationships:
  - name: セオドア・クロックウェル
    relation: 不思議な常連客であり、導き手
  - name: エリアス・ナイトシェイド
    relation: 疲弊した常連客であり、パフェで癒やす対象
  arc: ただ甘いものを届けるだけでなく、悲しみや寂しさも含めた「記憶」の価値に気づき、精神的に成長する。
- name: セオドア・クロックウェル
  role: 相棒/導き手
  age: 75
  gender: 男性
  appearance: 古風なツイードジャケットにモノクルを着用。穏やかな微笑みを浮かべ、常に止まったままの金色の懐中時計を携えている。
  personality: 知的で紳士的。世俗に執着せず、どこか浮世離れした雰囲気を持つ。一人称は「私」。
  speech_style: 丁寧でゆったりとした口調。「〜ですな」「〜でしょう」など、古風な言い回しを好む。
  background: かつてルミナス・シティの「時の番人」だったが、ある出来事で記憶の一部と時計の針を失い、街を彷徨っていた。
  motivation: 自分の時計を再び動かし、街に失われた「穏やかな眠り」を取り戻すこと。
  relationships:
  - name: ルナ・アスター
    relation: 才能あるパティシエとして信頼し、見守っている
  arc: ルナの作るパフェを通じて自身の失った記憶を辿り、番人としての使命を完遂して安らかな眠りにつく準備を整える。
- name: エリアス・ナイトシェイド
  role: 脇役/視点キャラクター
  age: 28
  gender: 男性
  appearance: 目の下に深い隈がある。仕立ての良い黒いスーツを着ているが、ネクタイは緩み、常にひどく疲れた表情をしている。
  personality: 皮肉屋で現実主義。しかし根は優しく、不器用な一面がある。一人称は「俺」。
  speech_style: ぶっきらぼうで短い言葉が多い。「別に」「まあいいさ」など、感情を抑えた話し方。
  background: 街の巨大企業の若手エリート。競争社会の中で「眠ること」を効率の悪い行為として切り捨て、心身ともに限界を迎えている。
  motivation: 静寂と、自分が本当に欲していた「心の安らぎ」を見つけること。
  relationships:
  - name: ルナ・アスター
    relation: 最初は賑やかすぎる彼女を敬遠していたが、次第に唯一心を許せる相手になる
  arc: パフェを通じて子供時代の純粋な夢を思い出し、競争から降りて「自分のための時間」を持つ勇気を得る。
