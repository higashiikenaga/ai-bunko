title: 真夜中のダイナー・パフェと、止まった秒針のゆらぎ
genre: 日常ほのぼの
tone: 明るく軽快、心温まる、少し不思議
pov: 一人称（あたし）
tense: 現在・過去混合
setting: ネオンが煌々と輝き続け、人々が眠ることを忘れたかのように賑わう「眠らない街」、ルミナス・シティの片隅にある小さなダイナー
premise: 眠らない街の片隅で、あたしは深夜だけ営業するダイナーの店員をやってる。看板メニューは、星屑みたいにキラキラした特製パフェ！ある日、お客さんが持ち込んだのは、針が止まったままの「壊れた懐中時計」。その時計が動き出すとき、街の魔法が少しだけ解けて、忘れかけていた大切な記憶が甘いデザートになって溶け出すんだ。賑やかな夜と、美味しいお菓子に囲まれた、ちょっと不思議な日常の物語。
themes:
- 忘れ物を取り戻すこと
- 夜の静寂と温もり
rules:
- 懐中時計の針が動く瞬間、持ち主の最も幸せだった記憶が具現化する
- 街の灯りが消えない限り、ダイナーの料理は食べた者の心を一時的に癒やす力を持つ
plot_outline:
- '序盤: 眠らない街の賑やかな夜と、あたしの賑やかなダイナーの日常を描く。壊れた懐中時計を持つ不思議なおじいさんと出会う。'
- '中盤: 時計が動くたびに、お客さんたちが「忘れかけていた大切な味」や「思い出の風景」をパフェを通して思い出すエピソードが続く。'
- '終盤: 街全体の灯りが消えそうになる危機が訪れるが、懐中時計が奇跡的に動き出し、街に穏やかな眠りが訪れる。'
- '結末: 街は相変わらず眠らないけれど、少しだけ優しい夜になった。あたしは今日も、新作パフェを作りながらお客さんを待ってる。'
style_notes: 一人称「あたし」による、テンポが良くツッコミの多い軽快な語り。キャラクター同士の掛け合いは可愛げを重視する。スイーツや料理の描写は、読者が今すぐ食べたくなってしまうほど、質感や味、香りを詳細かつ美味しそうに書く。各エピソードの終わりに、クスッと笑える小さなオチを必ず入れること。
