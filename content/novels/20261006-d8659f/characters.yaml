- name: 湊 蓮
  role: 主人公
  age: 20
  gender: 男性
  appearance: 痩せ型で青白い肌。常にスマートフォンを握りしめ、視線が定まらない。疲れ切った大学生の風貌。
  personality: 内向的で好奇心が強く、孤独を好む。一人称は「僕」。ネットの深淵に惹かれる傾向がある。
  speech_style: 控えめで、語尾が消え入りそうな話し方。独り言が多い。
  background: 都市部の大学に通う学生。現実の人間関係に馴染めず、匿名掲示板での交流だけが唯一の精神的支えとなっている。
  motivation: 不可解なスレッドの謎を解明することで、日常にない刺激と「特別な自分」を証明したい。
  relationships:
  - name: 佐伯 莉佳
    relation: 大学の先輩であり、唯一の現実的な相談相手
  - name: 管理人
    relation: デジタル上の支配者であり、逃れられない運命の主
  arc: ネット上の好奇心が物理的な死へ直結することに気づき、絶望的な状況の中で抗おうとするが、最終的にシステムの一部として取り込まれる。
- name: 佐伯 莉佳
  role: 相棒/警告者
  age: 21
  gender: 女性
  appearance: ショートカットで快活な印象だが、目の下に消えない深い隈がある。常に雨除けの傘を携帯している。
  personality: 現実主義で責任感が強い。一人称は「私」。湊を危なっかしいと感じて世話を焼く。
  speech_style: ハキハキとした口調だが、怪異に触れる話題になると急に早口になり、怯えが見える。
  background: 湊の大学の先輩。以前、別のルートで「店」の噂を検証しようとし、ある「代償」を支払わされた経験を持つ。
  motivation: 湊を「店」に近づかせないようにし、彼が自分と同じ末路を辿るのを防ぎたい。
  relationships:
  - name: 湊 蓮
    relation: 危なっかしい後輩
  arc: 湊を救おうと奔走するが、自身の支払った代償（遺言）の執行期限が到来し、彼を逃がすための囮となって消滅する。
- name: 管理人
  role: 敵役
  age: 0
  gender: 不明
  appearance: ネット上では不気味なアスキーアートやノイズとして表現される。実体化すると、雨に濡れた黒いコートを纏い、顔がノイズで塗り潰された人影。
  personality: 冷酷で計算高い。人間を「欲望という名のデータ」としてしか見ていない。一人称は「私」。
  speech_style: 極めて丁寧だが、感情が一切排除された機械的な話し方。
  background: ネット上の集合無意識と人々の絶望から生まれたデジタル怪異。拡散されることでその質量と権能を増す。
  motivation: スレッドを限界まで拡散させ、都市全体を物理的な「店」へと書き換えることで、完全なる実在を手に入れること。
  relationships:
  - name: 湊 蓮
    relation: 物語を完結させるための「最後の書き込み主（生贄）」
  arc: 湊を巧妙に誘導し、絶望を最大化させたタイミングで彼自身の『遺言』を投稿させ、都市の完全な侵食を完了させる。
