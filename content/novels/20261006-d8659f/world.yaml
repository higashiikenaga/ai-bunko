title: 雨滴のデッドリンク
genre: ホラー
tone: デジタルな焦燥感と湿り気を帯びた不気味さ
pov: 三人称近接視点
tense: 過去形
setting: 現代の都市部、SNSと匿名掲示板が日常を侵食している社会
premise: 「雨の日だけ開く店」という奇妙なスレッドが、匿名掲示板からネット全体へと拡散されていく。利用者は、自身の真実の『遺言』を対価に、あらゆる欲望を満たす品を手に入れられるという。しかし、噂が拡散されるほどに怪異の質量は増し、デジタルの情報は物理的な死へと変貌を遂げていく。一人の大学生が、そのスレッドの『次の書き込み』に選ばれたことで、逃げ場のない雨の夜が始まる。
themes:
- 情報の拡散による怪異の増幅
- デジタルにおける自己の消失
rules:
- 噂の拡散数（リポスト・インプレッション）が、怪異が現実世界に干渉できる物理的な強さに比例する
- 店での取引に必要な通貨は、本人が死の間際に発するであろう真実の『遺言』である
- 雨の日にその情報を閲覧した者は、怪異による『収穫対象』として自動的にリストアップされる
plot_outline:
- '序盤: 匿名掲示板で見つけた「雨の日だけ開く店」のスレッド。大学生の湊は、その不可解な体験談に惹かれ、スレッドをフォローしてしまう。'
- '中盤: スレッドはSNSで爆発的にバズり、実写の「店」の画像が投稿され始める。湊は、自分が歩いている路地裏に、その店が物理的に出現しているのを目撃する。'
- '終盤: 記録的な豪雨の日、スレッドの拡散数は限界に達し、怪異は都市全体を覆う「店」へと膨張する。湊は、スレッドの書き込み主が、拡散を加速させるために『死の予兆』を投稿していることに気づく。'
- '結末: 湊のスマホに、彼自身の名前を冠した『遺言』の投稿通知が届く。逃げようとする彼の足元から、雨水が店へと続く入り口へと姿を変えていく。'
style_notes: 三人称近接視点を用いつつ、物語の合間にスマホの通知画面、SNSのタイムライン、掲示板のレスポンス（「>>1」「拡散希望」等）を挿入する。噂の拡散とともに文章のテンポを加速させ、読者に「通知が止まらない恐怖」を追体験させる。文体は短文を多用し、スピード感と現代的な不気味さを強調する。
