title: 銀河の郵便局と、空飛ぶ船が運ぶ書き置き
genre: 本格ミステリー
tone: 優しく、どこか懐かしい、星降る夜の調べ
pov: 一人称（わたし）
tense: 現在形・過去形混在
setting: 現代、星見ヶ丘の麓にある私設図書館「月読書房」と、その周辺の街並み
premise: 前作の騒動から数ヶ月。月読書房には、不思議な「空飛ぶ船」の模型が飾られるようになりました。ある日、その模型の隠し扉から、宛名のない古い地図と一通の手紙が見つかります。それは、かつて星見ヶ丘の空を舞っていた伝説の飛行船が遺した「秘密の地図」なのかもしれません。地図の行方を追ううちに、わたしは、ある忘れられた約束と、街の人々がそっと隠していた優しい嘘の正体に触れていくことになります。
themes:
- 受け継がれる想い
- 誤解が生む優しさ
- 失われた約束の再発見
rules:
- 殺人は決して起きない
- 謎の解決は、人々の善意や小さな勘違いを紐解くことで行われる
- 前作の登場人物（栞、海、一ノ瀬、麗子など）は、それぞれの生活を送りながら物語に緩やかに関わる
plot_outline:
- '序盤: 月読書房を訪れた常連客から、古びた模型の空飛ぶ船を預かる。その模型の中に、奇妙な模様が描かれた「秘密の地図」が隠されているのを見つける。海と一緒に地図を読み解くと、それは街の古い地図と重なる座標を示していた。'
- '中盤: 地図が指し示す場所を巡るうちに、かつてこの街で「空飛ぶ船」を夢見た人々の物語が浮かび上がる。一見、不審な動きをする人物が現れるが、それは誰かを傷つけるためではなく、ある「届かなかった手紙」を届けようとする善意の試みであることが判明していく。'
- '終盤: 地図の終着点は、かつての天文台近くの古い時計塔だった。そこには、前作で一ノ瀬たちが手放した「想い」の続きが、形を変えて保管されていた。地図が示したのは、物理的な宝ではなく、ある人物が人生の最後に残した、未来へのメッセージだった。'
- '結末: すべての誤解が解け、地図の主の願いが静かに果たされる。空飛ぶ船の模型は、新たな物語を運ぶための象徴として、月読書房の棚に大切に置かれる。わたしは、また新しい一冊の物語が届くのを待ちながら、温かい紅茶を淹れる。'
style_notes: 「わたし」による、軽やかで少しとぼけた語り口。日常の風景を丁寧に描き、読者がふっと肩の力を抜けるような、やさしく透明感のある文体。ミステリーとしての論理性を保ちつつも、結末は必ず読者の心が温かくなるような、人の善意に焦点を当てた叙情的な描写を心がける。
