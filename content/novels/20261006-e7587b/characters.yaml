- name: 如月 暁人
  role: 主人公
  age: 17
  gender: 男性
  appearance: 鋭い眼差しだがどこか虚ろな瞳。細身だが、かつての鍛錬を感じさせるしなやかな筋肉を持つ。常にパーカーのフードを深く被っている。
  personality: 内向的で冷笑的。自分自身の才能を呪っている。一人称は「俺」。
  speech_style: 短文でぶっきらぼう。必要最低限のことしか話さない。
  background: 中学時代は「神童」と呼ばれた陸上選手だったが、中3の大会で極度のプレッシャーから足が動かなくなり、以降走ることを拒絶している。
  motivation: 走る恐怖を克服し、自分の本当の速さを取り戻すこと。
  relationships:
  - name: 工藤 凌牙
    relation: 強引に部活へ連れ戻した厄介な友人
  - name: 一ノ瀬 汐恩
    relation: 技術的な理解者
  - name: 西園寺 蓮
    relation: 超えるべき絶対的な壁
  arc: 走ることへの恐怖と向き合い、自分のためではなく「繋ぐため」に走る喜びを知る。
- name: 工藤 凌牙
  role: 相棒（第1走者）
  age: 17
  gender: 男性
  appearance: 日焼けした肌、短く刈り込んだ髪。常にエネルギーに満ち溢れた快活な風貌。
  personality: 猪突猛進で直感的。理論よりも「感覚」を信じる熱血漢。一人称は「俺」。
  speech_style: 声が大きく、語尾が強め。「行くぞ！」「面白そうじゃねえか！」といった勢いのある口調。
  background: 元野球部。爆発的な瞬発力を持つが、細かい技術や戦術を嫌い、部を去った。暁人の才能を誰よりも信じている。
  motivation: 寄せ集めの仲間たちで、理詰めのエリート集団をぶち抜くこと。
  relationships:
  - name: 如月 暁人
    relation: 再起させたい親友
  - name: 一ノ瀬 汐恩
    relation: 小言の多い司令塔
  arc: 野生的な本能を、チームの「シンクロ」へと昇華させる方法を学ぶ。
- name: 一ノ瀬 汐恩
  role: 脇役（第2・3走者）
  age: 16
  gender: 男性
  appearance: 眼鏡をかけた知的な風貌。線の細い、静かな佇まい。常にノートを携帯している。
  personality: 冷静沈着で分析的。感情を表に出すのが苦手な理論派。一人称は「僕」。
  speech_style: 丁寧だが、どこか突き放したような理屈っぽい話し方。「計算上はこうなります」「非効率的です」が口癖。
  background: データ分析が趣味の元数学部員。陸上の動きを物理学として捉えており、効率的なバトンパスの理論を構築しようとしている。
  motivation: 自身の理論「シンクロ・パス」が、予測不能な人間の「熱量」によって証明されるのを見ること。
  relationships:
  - name: 如月 暁人
    relation: 走りのメカニズムを解明したい対象
  - name: 工藤 凌牙
    relation: 予測不能で計算を狂わせる存在
  arc: データでは測れない「信頼」という不確定要素を、チームの武器として受け入れる。
- name: 西園寺 蓮
  role: 敵役
  age: 17
  gender: 男性
  appearance: 整った容姿と、一切の無駄がない完璧なフォーム。威圧感を与えるオーラを纏っている。
  personality: 完璧主義者で傲慢。勝利は「正しい準備」の帰結であると信じている。一人称は「私」。
  speech_style: 上品で落ち着いているが、相手を見下すような冷徹さが漂う。
  background: 全国屈指の私立強豪校の絶対的エース。最新の科学的トレーニングと徹底したデータ管理のもとで育てられた「走る精密機械」。
  motivation: 完璧な勝利を維持し、陸上競技における「正解」を示し続けること。
  relationships:
  - name: 如月 暁人
    relation: かつての天才であり、自身の理論を揺るがす脅威
  arc: 計算を超えた「本能」による敗北を味わい、競技の残酷さと向き合う。
