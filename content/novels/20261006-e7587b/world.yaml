title: 紅蓮のストライド
genre: スポーツ青春
tone: 熱血、疾走感、泥臭い
pov: 三人称
tense: 基本過去形（試合中のみ現在形）
setting: 地方の公立高校・陸上競技場
premise: 挫折し、走ることを恐れた元天才少年が、寄せ集めの部員たちと4x100mリレーに挑む。計算し尽くされたエリート集団に対し、彼らが武器にするのは限界まで追い込んだ「本能」と「信頼」。バトンを繋ぐたびに加速する、魂の全力疾走が始まる。
themes:
- 信頼と継承
- 限界突破
rules:
- 4x100mリレーの競技規則を厳格に適用し、バトンパスのミス（ゾーン外での受け渡し）は即失格とする
plot_outline:
- '序盤: トラウマで走る速度を失った主人公が、廃部寸前の陸上部で、個性的だが不器用な3人の仲間と出会い、強引にリレーチームを結成させられる。'
- '中盤: 互いのエゴをぶつけ合う激しい特訓。鏡に映る己の弱さと向き合い、渡り鳥がV字編隊で風を切るように、4人の呼吸を完全に同期させる「シンクロ・パス」を追求する。'
- '終盤: 全国大会決勝。理論とデータで武装した絶対王者・私立強豪校と対峙。第3走者まで追い詰められるが、アンカーの主人公が限界を超えたラストスパートをかける。'
- '結末: 0.01秒の差で競り勝ち、頂点に立つ。同時に、敗れた王者が味わう絶望と、それを乗り越えて再び走り出す決意を描き、スポーツの残酷さと美しさを完結させる。'
style_notes: 汗の飛沫や激しい心拍音を擬音と共に生々しく描写。試合シーンは短文を畳み掛け、現在形で実況するように書く。必ず一度は敗者の視点に切り替え、彼らの視点から見た主人公たちの「熱」を際立たせること。
