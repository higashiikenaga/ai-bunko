- name: カイト・レン
  role: 主人公
  age: 27
  gender: 男性
  appearance: 擦り切れたテックジャケット、左目に青く光るサイバネティック・アイ、無精髭と鋭い眼光。
  personality: 冷笑的で現実主義。他人を信用しないが、一度決めたことは曲げない。一人称は「オレ」。
  speech_style: ぶっきらぼうで短文が多く、ネットスラングを混ぜた荒っぽい口調。
  background: かつては上層企業の技術者だったが、ある機密データの漏洩に関わったことで追放され、現在はスラムで死者の記憶を拾うスカベンジャーとして生きている。
  motivation: 日々の生存、そして偶然手に入れた記憶パルスが示す「真実」の確認。
  relationships:
  - name: エコー
    relation: 唯一信頼している相棒
  - name: セドリック・ヴァーン
    relation: 命を狙われる宿敵
  arc: 自分のためだけに生きる孤独なスカベンジャーから、都市の構造を壊し、人々に真実を届ける革命の旗手へと変化する。
- name: エコー
  role: 相棒
  age: 21
  gender: 女性
  appearance: ネオンピンクの短髪、オーバーサイズのヘッドフォン、常に複数のホログラムディスプレイを操る指先。
  personality: 好奇心旺盛でハイテンション。デジタルな世界を現実より好む。一人称は「あたし」。
  speech_style: 非常に早口で、専門用語や技術的な比喩を多用するエネルギッシュな話し方。
  background: スラムのジャンク屋の娘。幼い頃からネットワークにダイブし続け、都市の裏側に張り巡らされたコードの隙間に精通している。
  motivation: 禁忌のコードがもたらす、未知のデータへの純粋な好奇心。
  relationships:
  - name: カイト・レン
    relation: 退屈な世界を共に駆け抜ける相棒
  arc: 画面の向こう側の情報としてしか世界を見ていなかった少女が、現実の痛みと変革の重みを理解していく。
- name: セドリック・ヴァーン
  role: 敵役
  age: 46
  gender: 男性
  appearance: 非の打ち所のない銀色のスーツ、冷徹な眼差し、高度な整形によって作られた完璧な顔立ち。
  personality: 冷酷で極めて論理的。秩序こそが人類の生存条件だと信じている。一人称は「私」。
  speech_style: 極めて丁寧で理知的な口調だが、その言葉には相手を威圧し、支配する響きがある。
  background: ネオ・キシンを支配する巨大企業「アトラス」の治安維持部門最高責任者。都市の安定を乱す要素を徹底的に排除する。
  motivation: 禁忌のコードを回収し、都市の管理体制（秩序）を維持・強化すること。
  relationships:
  - name: カイト・レン
    relation: 排除すべき不確定要素（バグ）
  arc: 完璧だと信じて疑わなかった自身の管理構造が、情報の奔流によって崩壊していく過程で、狂気的な執着を見せる。
- name: サイラス
  role: 脇役
  age: 68
  gender: 男性
  appearance: 油汚れのついた古い作業着、使い込まれたアナログな通信機器、深い皺が刻まれた顔。
  personality: 穏やかで達観しているが、技術に対しては異常なまでの情熱を持つ。一人称は「ワシ」。
  speech_style: ゆったりとした、古風で落ち着いた話し方。
  background: かつて都市のインフラ設計に携わった元エンジニア。現在は最下層の廃墟にある『古い灯台』を守る隠者として静かに暮らしている。
  motivation: 忘れ去られたアナログな技術を使い、都市が本来持っていた「繋がり」を再起動させること。
  relationships:
  - name: カイト・レン
    relation: 未来を託す導き手
  arc: 時代の遺物として隠居していた老技術者が、最後にして最大の「パルス」を放つための鍵となる。
