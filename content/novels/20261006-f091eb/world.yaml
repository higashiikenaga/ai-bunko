title: ネオン・ゴースト・パルス
genre: サイバーパンク
tone: ハードボイルド、高速、退廃的
pov: 一人称（オレ）
tense: 現在形
setting: 垂直都市「ネオ・キシン」。雲上の上層階は超企業が支配し、水没した最下層のスラムに路地裏の住人がひしめく世界。
premise: 脳に直接データを書き込む「ダイブ」が日常となった世界。オレは路地裏で死者の記憶を拾うデータ・スカベンジャーだ。ある雨の日、偶然手に入れた「消去済みの記憶」が、都市の根源を揺るがす禁忌のコードだった。企業に追われ、最下層の果てにある古い灯台へと逃げ込むオレの、最悪で最高の逃避行。
themes:
- 記憶の真正性
- システムへの反逆
rules:
- データ・ダイブには神経負荷（シンクロ・ショック）があり、限界を超えると脳が物理的に焼ける
- 酸性雨が降る日だけ、企業の監視網に干渉ノイズが走り、特定の闇店『雨天ロジック』のデジタル storefront が開く
- 記憶は『パルス』という単位で断片化され売買されるが、違法なパルスは人格を汚染し、精神的なバグを誘発する
plot_outline:
- '序盤: 雨の日だけ開く店『雨天ロジック』で、出所不明の記憶パルスを買い取る。そのパルスには、現体制を崩壊させる「都市の消去キー」が隠されており、オレは企業の抹殺部隊に目をつけられる。'
- '中盤: 街の至る所に張り巡らされた監視カメラとセキュリティ・ドローンを、即興のハッキングで突破しながら逃走。記憶の断片が指し示す、地図から消された最下層の座標へ向かう。'
- '終盤: 水没した廃墟の果てに立つ『古い灯台』に到達。そこはアナログ信号でしか通信できない唯一の聖域だった。灯台のビーコンを使い、都市全体の記憶を全市民に強制同期させる「パルス・ブロードキャスト」を仕掛ける。'
- '結末: 企業の中枢をハックし、支配構造を根底から破壊する。オレは記憶パルスの過負荷で意識を失いかけるが、雨の降る街に自由なノイズが響き渡るのを聞き、不敵に笑って意識を飛ばす。'
style_notes: 短いセンテンスで畳み掛ける。一人称「オレ」によるハードボイルドな独白。サイバーパンク特有の造語を多用し、スピード感を出す。ハッキング描写は「ポート開放→プロトコル偽装→パケット注入」のように、擬似的な手順を具体的に記述してリアリティを演出する。
