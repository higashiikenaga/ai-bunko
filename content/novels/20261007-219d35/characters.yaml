- name: ルカ・アステリア
  role: 主人公
  age: 19
  gender: 男性
  appearance: 油汚れのついた作業着に、使い古された魔導工具のベルトを巻いている。鋭いが、どこか深い喪失感を湛えた瞳をしている。
  personality: 真面目で執念深く、目的のためには手段を選ばない危うさを持つ。一人称は「僕」。
  speech_style: 丁寧だが、技術的な議論になると早口で熱を帯びる。
  background: アステリアの街で、亡き妹の形見である魔導時計の修理に没頭していた青年魔導技師。妹の死を「技術の欠如」のせいだと悔いている。
  motivation: 『アメダマの商館』を利用して妹の魂を買い戻し、彼女のいない不条理な世界を否定すること。
  relationships:
  - name: エリン
    relation: 亡き妹
  - name: サイラス
    relation: 契約相手・謎の老人
  arc: 妹への個人的な執着（過去への執着）から、世界の理を書き換えて新たな時代を切り拓く決意（未来への意志）へと成長する。
- name: サイラス
  role: 謎の店主（導き手）
  age: 65
  gender: 男性
  appearance: 銀髪の長い髪を後ろで束ね、星屑が混じったような模様の外套を纏っている。掴みどころのない微笑を絶やさない。
  personality: 飄々としており、善悪の概念を持たず、ただ「世界の理」の観測者として振る舞う。一人称は「私」。
  speech_style: 詩的で含みのある言い回しを好み、相手の核心を突くような問いを投げかける。
  background: 数百年ごとに現れる『アメダマの商館』の主。人々の願いを対価に、時空の理を無視した奇跡を売り渡す存在。
  motivation: 世界の終焉と、その後に訪れる変化を特等席で見届けること。
  relationships:
  - name: ルカ
    relation: 契約者
  - name: イリス
    relation: 対立する秩序の象徴
  arc: 物語の進行に影響を与えない不変の存在として描かれるが、ルカの選択によって「予定された終焉」が狂わされる様子を愉しむ。
- name: リネット・ヴァンス
  role: 相棒
  age: 20
  gender: 女性
  appearance: 動きやすさを重視した革製の飛行服を着用。額には常にゴーグルを乗せ、活発な印象を与える短髪の少女。
  personality: 現実主義者で勝ち気。ルカの暴走を止めるブレーキ役でありつつ、技術的なサポートに長けている。一人称は「あたし」。
  speech_style: ぶっきらぼうで勢いがあるが、仲間を思いやる優しさが言葉の端々に滲む。
  background: アステリアの辺境で廃品回収業を営む元・軍用魔導機の整備士。ルカの禁忌の機関車造りに協力することになる。
  motivation: 壊れゆく世界の中で、自分の技術がどこまで通用するかを証明すること。
  relationships:
  - name: ルカ
    relation: 共同作業者・友人
  arc: 当初はルカの目的を「ただの個人的な執着」と冷ややかに見ていたが、共に境界を越える中で、世界の変革に寄り添う意志を持つようになる。
- name: イリス
  role: 敵役（最終列車の車掌）
  age: 18
  gender: 女性
  appearance: 神話時代の意匠を取り入れた、純白の制服に身を包む。感情の読めない、無機質な美しさを持つ少女。
  personality: 冷徹かつ規律を重んじる。個人の感情よりも「世界の回帰」という摂理を優先する。一人称は「私」。
  speech_style: 事務的で抑揚がなく、拒絶を許さない絶対的な響きを持つ。
  background: 神々の遺骸が成す世界の理を維持するための執行者。最終列車を終着駅（虚無）へと導く役割を担う。
  motivation: 世界を神話の時代へと回帰させ、現在の黄昏の文明を完全に終わらせること。
  relationships:
  - name: サイラス
    relation: 観測者としての対峙
  - name: ルカ
    relation: 秩序を乱す侵入者
  arc: 理に従うだけの存在であったが、ルカの「全てを失ってもなお進む意志」に触れ、初めて自身の役割に対する「迷い」というバグを抱く。
