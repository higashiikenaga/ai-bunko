title: 星霜の雫と、終焉を駆ける銀の軌跡
genre: 伝奇
tone: 重厚で荘厳、叙事詩的な雰囲気
pov: 三人称
tense: 過去形
setting: 神々の遺骸が大地を成し、魔導蒸気機関が文明を支える、黄昏の時代。霧深い辺境の街『アステリア』。
premise: 天から零れ落ちた星の涙が、数百年ごとに大雨となって大地を濡らす。その雨の日だけ、時空の狭間に『雨滴の店（アメダマの商館）』が現れ、人々の失われた記憶や願いを対価に、奇跡を売り渡すという。青年魔導技師のルカは、亡き妹の魂を求めてその店を訪れるが、そこで世界の理を覆す「最終列車」の運行を知ることになる。それは、神話の時代へと回帰するための、一度きりの脱出路であった。
themes:
- 忘却と再生
- 運命への抗い
- 信仰と科学の相克
rules:
- 雨の日のみ、現世と隠り世の境界が曖昧になり『アメダマの商館』が実体化する。
- 商館での取引は金銭ではなく、対象者の『最も輝かしい記憶』を媒体とする。
- 最終列車は、星の涙が止む瞬間にのみ、断絶された神話時代へと接続される。
plot_outline:
- '序盤: 技師ルカは、妹の形見である壊れた魔導時計を修理する中で、雨の日にだけ現れる怪しげな店『アメダマの商館』の噂を聞く。彼は妹の魂を買い戻すため、店主である謎の老人と契約を交わす。'
- '中盤: 商館の主から、妹の魂は「終焉の地」へ向かう最終列車の乗客として扱われていることを告げられる。ルカは列車の運行を阻止、あるいは追跡するため、古の伝承に基づき、雨の境界線を突破する禁忌の術式を組み上げた蒸気機関車を造り上げる。'
- '終盤: 激しい豪雨の中、霧の向こうから銀色の軌跡を描いて「最終列車」が出現する。ルカの機関車は列車との激しい追跡劇を繰り広げ、神々の残滓が渦巻く境界領域へと突入していく。'
- '結末: 列車の終着駅は、神話が始まる前の虚無の地であった。ルカは妹の魂と再会するが、それは世界の理を書き換える代償を伴う選択を迫るものであった。彼は全てを失う覚悟で、新たな時代の夜明けを告げる汽笛を鳴らす。'
style_notes: 竜胆 アルトとしての文体を徹底する。地の文は「古の詩編」を引用するように格調高く、地名はラテン語や古語の響きを意識した造語を用いる。会話劇では、商館主には古風で含みのある口調を、ルカには理知的だが情熱を秘めた若者の口調を使い分け、物語全体に神話的な重みを持たせること。
