- name: お節（おせつ）
  role: 主人公
  age: 22
  gender: 女性
  appearance: 活発そうな瞳、清潔な割烹着、後ろでまとめられた髪
  personality: 明るく世話焼き、芯が強い。「私」
  speech_style: 「〜だねぇ」「〜ですよ」と、丁寧ながらも親しみやすい江戸弁
  background: 亡き父が営んでいた小さな惣菜屋を引き継いだばかりの娘。季節の食材を大切にする。
  motivation: 季節の味を絶やさず、長屋の人々に元気を届けること
  relationships:
  - name: 権造
    relation: 頼れる近所のおじさん
  - name: 辰吉
    relation: 弟のように可愛がっている
  - name: お菊
    relation: 相談に乗ってもらう恩人
  arc: 物価高騰で料理を出すのが苦しくなり自信を失いかけるが、祭りの炊き出しを通じて「分かち合う喜び」を再確認し、強く成長する。
- name: 権造（ごんぞう）
  role: 脇役
  age: 45
  gender: 男性
  appearance: 日焼けした肌、がっしりとした体格、道具の使い込まれた手
  personality: 無口でぶっきらぼうだが、情に厚い。「俺」
  speech_style: 「〜じゃねぇ」「〜だ」といった、低く威厳のある江戸っ子口調
  background: 長屋に住む腕の良い大工。寡黙に仕事に打ち込む職人。
  motivation: 職人としての誇りを守り、長屋の秩序を保つこと
  relationships:
  - name: お節
    relation: 店を支える大切な隣人
  - name: 辰吉
    relation: 厳しくも温かく見守る弟子のような存在
  arc: 猛暑と不況で余裕を失い、周囲に対して刺々しくなってしまうが、祭りの準備を通じて人との繋がりを思い出し、再び笑顔を取り戻す。
- name: 辰吉（たつきち）
  role: 脇役
  age: 17
  gender: 男性
  appearance: 細身で動きやすい着物姿、輝くような瞳
  personality: 元気いっぱいで少しお調子者。「俺」
  speech_style: 「〜っす！」「〜だぜ！」と、勢いのある若者言葉
  background: 長屋の住人の息子で、見習い職人として修行中。いつも長屋を走り回っている。
  motivation: 早く一人前になって、長屋のみんなを楽にさせること
  relationships:
  - name: お節
    relation: 美味しい料理をくれる姉貴分
  - name: 権造
    relation: 憧れの師匠的存在
  arc: 経済的な不安に怯え、焦りを感じるようになるが、祭りの賑わいの中で「今、ここにある幸せ」に気づき、精神的に成熟していく。
- name: お菊（おきく）
  role: 脇役
  age: 62
  gender: 女性
  appearance: 落ち着いた着こなし、すべてを見透かすような穏やかな目元
  personality: 冷静沈着で思慮深い。長屋のまとめ役。「わし」
  speech_style: 「〜じゃな」「〜のう」といった、ゆったりとした年配の女性の口調
  background: 長年長屋に住み続けている、地域の知恵袋的な存在。
  motivation: 長屋がバラバラにならないよう、静かに見守ること
  relationships:
  - name: お節
    relation: 迷った時に助言を求める相手
  arc: 困難な時期に長屋の空気が荒れるのを察知し、さりげない言葉や行動で、人々が再び団結するためのきっかけを作る。
