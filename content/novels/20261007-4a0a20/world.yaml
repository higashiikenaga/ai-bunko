title: 江戸長屋・月下の贈り物 ―嘘がつけぬ夜の食卓―
genre: 日常ほのぼの
tone: 人情味あふれる江戸の情緒と、季節の香りが漂う温かな雰囲気
pov: 三人称
tense: 過去形
setting: 江戸、隅田川沿いの活気ある長屋。秋から冬にかけての季節。
premise: 米価高騰の嵐が去り、ようやく平穏を取り戻した長屋に、秋の夜長を彩る月食の夜がやってくる。その夜、長屋の住人たちは不思議な「嘘をつけない呪い」にかかり、隠していた本音が次々と飛び出してしまう。騒動の中で、お節は旬の秋刀魚と里芋を使った料理を振る舞い、人々の剥き出しの心を温める。月食が明け、嘘が消えた後に残ったのは、より深い信頼と人情だった。
themes:
- 真実の言葉と心の繋がり
- 季節の恵みによる再生
rules:
- 長屋の住人は前作の経済的困難を乗り越え、互いに助け合う関係にある
- 月食の最中、特定の条件下にある者は、口にしようとした嘘が喉に詰まり、真実しか語れなくなる
plot_outline:
- '序盤: 秋の気配が深まり、長屋では秋刀魚の塩焼きや里芋の煮炊きが食欲をそそる。そんな中、不気味な月食の予報が流れる。お節は住人たちのために、秋の味覚をふんだんに使った準備を始める。'
- '中盤: 月食が始まると同時に、長屋に奇妙な静寂が訪れ、住人たちが「嘘をつけない呪い」に陥る。隠していた借金の話、小さな誤解、お互いへの不満が、べらんめえ口調の軽快な会話の中で次々と暴かれていく。長屋は一時的な混乱に陥る。'
- '終盤: 混乱する住人たちを前に、お節は月食の真っ只中に、熱々の里芋と秋刀魚の炊き込みご飯を大皿に盛り付けて振る舞う。「理屈じゃねえ、食って忘れちまいな！」と叫ぶお節の言葉と料理の香りに、人々は毒気を抜かれていく。'
- '結末: 月食が終わり、呪いが解けると、人々は照れくさそうに、しかし以前よりも晴れやかな顔で向き合う。冬の訪れを前に、長屋には温かな団欒が戻り、季節の移ろいを感じながら人情で結ばれていく。'
style_notes: 江戸の市井を生きる人々の息遣いを、べらんめえ口調の軽快な会話劇で描く。季節の食べ物（秋刀魚、里芋、栗など）の描写には徹底的にこだわり、食欲をそそる表現を用いること。三人称視点ながら、長屋の賑やかさが目に浮かぶような、温かくも活気のある筆致を心がける。
