- name: 新田 拓海
  role: 主人公
  age: 22
  gender: 男性
  appearance: 無造作に伸びた黒髪、作業着に油汚れがついている。鋭いがどこか哀愁を帯びた瞳。
  personality: 寡黙で真面目。一度決めたら曲げない芯の強さがある。一人称は「俺」。
  speech_style: 短く、要点を突いたぶっきらぼうな話し方。
  background: 父を亡くし、遺された動かない旧車を前に立ち尽くしていた青年。父の言葉の意味を探している。
  motivation: 父の遺した旧車を走らせ、その遺言である「風を掴む」ことを成し遂げるため。
  relationships:
  - name: 神崎 蓮
    relation: かつてのライバルであり、現在は整備の協力者
  - name: 進藤 海斗
    relation: 峠の頂点に君臨する壁となる存在
  - name: 榊 源蔵
    relation: 父の旧友であり、技術的な助言をくれる師のような存在
  arc: 父の死による喪失感と停滞から脱却し、走ることで自分の生きる意味と父の意志を見出す。
- name: 神崎 蓮
  role: 相棒
  age: 22
  gender: 男性
  appearance: 細身で整った顔立ち。常にレンチや工具を携え、清潔感のあるメカニックウェアを着ている。
  personality: 皮肉屋だが腕は超一流。技術へのプライドが極めて高い。一人称は「俺」。
  speech_style: 論理的で少し突き放したような、理屈っぽい話し方。
  background: 廃材集積場を拠点とする天才的なメカニック。かつて拓海と峠で競い合った過去を持つ。
  motivation: 錆びついた鉄の塊に再び命を吹き込み、技術の限界に挑むこと。
  relationships:
  - name: 新田 拓海
    relation: 腐れ縁のライバル兼、最高のドライバー
  arc: 拓海との競争心を、共に高みを目指す信頼へと変えていく。
- name: 進藤 海斗
  role: 敵役
  age: 19
  gender: 男性
  appearance: 最新のレーシングスーツに身を包んだ、モデルのような端正な容姿。常に最新鋭のスポーツカーに乗る。
  personality: 自信家で傲慢。データとスペックこそが全てだと信じている。一人称は「俺」。
  speech_style: 相手を見下すような、余裕を感じさせる軽薄な話し方。
  background: 最新の電子制御と高性能エンジンを武器に、峠の若き帝王として君臨する新鋭。
  motivation: 旧世代の「感情的な走り」を否定し、完璧な理論による勝利を証明すること。
  relationships:
  - name: 新田 拓海
    relation: 旧時代の遺物を引きずる、排除すべき対象
  arc: スペックを超えた「魂の走り」を目の当たりにし、自身の価値観が揺らぐ。
- name: 榊 源蔵
  role: 脇役
  age: 65
  gender: 男性
  appearance: 深く刻まれた皺と日焼けした肌。頑強な体格をした、集積場の主。
  personality: 豪放磊落。経験に基づいた重みのある言葉を放つ。一人称は「わし」。
  speech_style: 野太い声で、笑い飛ばしながらも核心を突く江戸っ子風の話し方。
  background: 拓海の父と共に峠を駆け抜けた時代の伝説的ドライバーの一人。
  motivation: かつての仲間が遺した情熱が、次世代に受け継がれるのを見届けること。
  relationships:
  - name: 新田 拓海
    relation: 亡き友の息子であり、見守るべき若者
  arc: 過去の栄光に浸るのではなく、新たな風が吹くのを静かに、かつ力強く後押しする。
