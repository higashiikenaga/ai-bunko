title: 鉄錆の轍、風を裂け
genre: スポーツ青春
tone: 硬派、熱量、荒々しさ
pov: 一人称（俺）
tense: 過去形
setting: 現代、海沿いの廃材集積場と起伏の激しい峠道
premise: かつて伝説と呼ばれた廃車寸前の旧車で、峠の最速を目指す男たちがいる。俺は亡き父が遺した、動かぬ旧車を走らせるために再びハンドルを握る。目指すは、断崖に立つ古い灯台をゴールとする、命を削るようなヒルクライムレースだ。父の遺言は、ただ一言「風を掴め」だった。錆びついたエンジンに火を灯し、俺は限界の先へ加速する。
themes:
- 継承
- 限界への挑戦
rules:
- レースは公道ではなく、厳格に管理された廃道と峠の特別区間で行われる
- 使用車両は改造を最小限に留めた旧式車のみに制限される
plot_outline:
- '序盤: 父の死。遺されたのは、動かない鉄の塊と一通の遺言。俺は廃材集積場で、かつてのライバルと再会する。'
- '中盤: 仲間を集め、錆びたエンジンを叩き起こす。整備、試走、そして次々と現れる若き新鋭たちとの衝突。'
- '終盤: 古い灯台をゴールとする、死線を越えるヒルクライム。悪天候の中、極限の加速が始まる。'
- '結末: 灯台の光の下、俺は父の意志を掴む。勝利の先に、新しい風が吹く。'
style_notes: 短文で畳みかける。擬音を排除し、動詞のみで速度と衝撃を表現する。戦闘（レース）の直前には、静寂と呼吸の描写を必ず挟む。一人称は「俺」。無骨で、感情を直接語らず、行動で示す。
