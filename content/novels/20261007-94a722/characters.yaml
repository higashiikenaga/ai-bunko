- name: 佐藤 蓮
  role: 主人公
  age: 28
  gender: 男性
  appearance: 痩身で眼鏡をかけた、どこか神経質な印象の青年。常に手帳を持ち歩いている。
  personality: 理性的で懐疑的だが、一度興味を持つと執着してしまう性質。一人称は「僕」。
  speech_style: 丁寧で落ち着いた、分析的な口調。
  background: フリーランスのライター。不可解な伝承や怪異を記録することに価値を置いている。
  motivation: 知人の高木が持ち帰った、説明のつかない記憶と現象の真相を解明すること。
  relationships:
  - name: 高木 海斗
    relation: 友人・情報提供者
  arc: 論理と理性で世界を理解しようとする人間から、説明不能な不条理をそのまま受け入れる存在へ。
- name: 高木 海斗
  role: 重要人物
  age: 29
  gender: 男性
  appearance: 顔色が悪く、常に周囲を警戒しているような怯えた瞳を持つ。どこか虚ろな雰囲気。
  personality: 臆病で神経質。村での体験により精神が摩耗している。一人称は「僕」。
  speech_style: 言葉が途切れがちで、小声で囁くような、落ち着きのない話し方。
  background: かつてその山間の村に住んでいたが、ある夜を境に逃げ出すように村を離れた。
  motivation: 自分に付きまとう「時計の音」と、背後に感じる「影」から逃れること。
  relationships:
  - name: 佐藤 蓮
    relation: 友人
  - name: 静江
    relation: かつての隣人
  arc: 恐怖から逃れようと足掻き続けるが、最終的には現象の一部として取り込まれていく。
- name: 静江
  role: 脇役
  age: 75
  gender: 女性
  appearance: 古びた着物を纏い、深い皺の刻まれた、全てを見透かすような鋭い瞳を持つ老人。
  personality: 冷淡で、村の因習や境界の掟を絶対的なものとして受け入れている。一人称は「わし」。
  speech_style: 強い訛りのある、重々しく、含みを持たせた話し方。
  background: 村の境界を守るための「習わし」を代々守ってきた一族の末裔。
  motivation: 村の秩序と、現世と異界の境界を維持すること。
  relationships:
  - name: 高木 海斗
    relation: かつての村人
  arc: 物語を通じて変化することなく、不変の恐怖と伝統の象徴として存在し続ける。
- name: 名もなき影
  role: 敵役
  age: 0
  gender: 不明
  appearance: 輪郭が常に泥濘のように揺らぎ、人の形をしているが、顔や細部が判然としない黒いシルエット。
  personality: 意志や感情を持たず、ただそこに「在る」ことのみを目的とする不条理な存在。
  speech_style: 言葉を発さず、代わりに壊れた懐中時計のチクタクという音を伴う。
  background: 猫が境界を越えた際に連れてきてしまった、世界の「外側」の断片。
  motivation: 現実と境界の区別を消滅させ、全てを泥濘の底へ沈めること。
  relationships:
  - name: 高木 海斗
    relation: 彼を追い詰め、侵食するもの
  arc: 最初は断片的な影として現れるが、次第に村全体を侵食する巨大な現象へと拡大する。
