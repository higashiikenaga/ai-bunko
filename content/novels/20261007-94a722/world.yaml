title: 泥濘の底に眠る、名もなき揺らぎ
genre: 怪談・民俗
tone: 淡々と、湿り気を帯びた静かな恐怖
pov: 一人称（語り手による聞き書き）
tense: 過去形
setting: 現代、山間の閉鎖的な集落と、その周辺の深い森
premise: これは、ある知人が村を離れる際に持ち帰った、奇妙な断片的な記憶についての話だ。村では、特定の時刻に壊れた懐中時計の音が聞こえると、境界が曖昧になると言い伝えられている。ある夜、その村で迷い込んだ名前のない猫が、消えてはならないはずの「何か」を連れてきてしまった。語られるのは、明確な正体を持たない、ただそこに在る不条理な現象の記録である。
themes:
- 境界の曖昧さ
- 忘却と残滓
- 民俗的な因習
rules:
- 一度失われた名前は、二度と呼び戻すことができない
- 壊れた懐中時計が刻む音は、現世と異界の時間のずれを示す
- 名前のない存在は、人の関心を引くことでその場に留まろうとする
plot_outline:
- '序盤: 知人が語った、村の奇妙な習わし。壊れた懐中時計を大切に保管する家々の話。'
- '中盤: 村の入り口で出会った、白黒の模様もない名前のない猫。猫が通った跡に、妙な足跡が残る様子。'
- '終盤: 時計の音が鳴り響く夜、猫が連れてきた「影」が、村の境界を侵食していく断片的な出来事。'
- '結末: 結局、何が起きたのかは誰も断言できない。ただ、知人の手元には、動かないはずの時計が時折、微かな音を立てるという。'
style_notes: 白石夜話としての文体。過剰な修辞を避け、起きた事象を淡々と記述する。読者に「何かがいた」という感覚だけを残し、論理的な解決やカタルシスを排除する。短いエピソードを積み重ねるような構成を意識すること。
