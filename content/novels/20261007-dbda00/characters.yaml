- name: 瀬戸 悠真（せと ゆうま）
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの前髪で、常に視線を伏せがち。スマートフォンの青白い光に照らされた顔立ち。どこか頼りなげだが、芯の強さを感じさせる瞳。
  personality: 内向的で観察眼が鋭い。ネット上の繋がりには慣れているが、対面でのコミュニケーションには臆病。一人称は「ボク」。
  speech_style: 控えめで丁寧だが、思考が整理されると早口になる傾向がある。
  background: 周囲との摩擦を避けるため、デジタルな世界に居場所を求めている高校生。雨の日のGPSバグをきっかけに、現実とデジタルの狭間に引き込まれる。
  motivation: 消えゆくミオの存在を確定させ、彼女をこの世界に繋ぎ止めること。
  relationships:
  - name: 星野 ミオ
    relation: 運命的な出会いを果たした少女
  arc: 画面越しに世界を観測するだけの受動的な存在から、自らの足で現実へ踏み出し、大切な人を守るために行動する能動的な存在へと成長する。
- name: 星野 ミオ（ほしの みお）
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 雨の日だけ実体化する、透き通るような肌を持つ少女。古い天体図を常に携えており、どこか浮世離れした儚い雰囲気がある。
  personality: 好奇心旺盛で、世界の理（ことわり）に対して純粋な疑問を持つ。自分が「バグ」であることを受け入れつつも、どこか孤独を抱えている。一人称は「わたし」。
  speech_style: 穏やかで、時折星やデータに関する独特な比喩を用いる。
  background: 雨の日にのみ現れるカフェ『レイン・ログ』の常連。自身の存在が世界のバグ（座標の欠損）であることを自覚しており、星図を使って存在の維持を試みている。
  motivation: 自分の存在が消去されることを防ぎ、誰かに「観測」され続けること。
  relationships:
  - name: 瀬戸 悠真
    relation: 自分を観測し、繋ぎ止めてくれる唯一の理解者
  arc: 世界のバグとして消去される運命に抗い、不確かなデータから「一人の人間」としての実在を獲得していく。
- name: カイ（KAI）
  role: 相棒・ナビゲーター
  age: 18
  gender: 男性
  appearance: パーカーを深く被り、常にタブレット端末を操作している。少しニヒルな笑みを浮かべた、情報の扱いに長けた少年。
  personality: 合理的でドライ。情報の真偽を重視するリアリスト。しかし、悠真たちの無謀な行動を密かにサポートする面倒見の良さがある。一人称は「俺」。
  speech_style: ぶっきらぼうで、効率を重視した短い言葉選び。
  background: ネット上の都市伝説やシステムの脆弱性を探るハッカー気質の少年。カフェ『レイン・ログ』の存在をデジタル的に解析しようとして悠真と接触する。
  motivation: 世界のシステムに潜む「エラー」の正体を解明し、自らの知的好奇心を満たすこと。
  relationships:
  - name: 瀬戸 悠真
    relation: 協力関係にある仲間
  - name: 星野 ミオ
    relation: 解析対象であり、守るべきイレギュラー
  arc: データとして世界を切り捨てていた価値観が、悠真たちの熱量によって揺らぎ、計算不可能な「感情」の価値を認めるようになる。
