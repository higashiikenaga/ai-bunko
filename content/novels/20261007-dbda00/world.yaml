title: 雨音のアップデートと、ボクらの星図デバッグ
genre: 青春恋愛
tone: 軽快でスピード感のある、切なくもエモーショナルな文体
pov: 一人称（ボク）
tense: 過去形と現在形の混在
setting: 現代の地方都市。雨の日だけナビアプリのGPSがバグり、路地裏に現れる謎のカフェ。
premise: 「雨の日だけ、あのお店が出る」――スマホの地図アプリに突如現れる謎のカフェ。そこで出会ったのは、古い星図を手に「世界のバグ」を探す不思議な少女だった。雨が止むたびに彼女の存在がログのように消えてしまう恐怖と、SNS越しにしか繋がれないもどかしさ。デジタルとリアルの境界がバグり出す中、ボクたちは自分たちの居場所をデバッグしていく。
themes:
- デジタル時代の孤独とリアルな繋がり
- 運命という名の不確実なバグ
rules:
- 店は雨天時のみ、特定のアプリのGPSエラーによってのみ出現する
- 少女との接触は、雨が止むとSNSのキャッシュのように一時的に消滅する
- 星図は現実世界の物理法則が歪む『エラー箇所』を正確に指し示している
plot_outline:
- '序盤: ネットの海で息を潜めて生きるボクは、雨の日にだけ現れるカフェ『レイン・ログ』に迷い込む。そこで星図を読み解く少女・ミオと出会い、彼女が「雨が降っていない間は、存在の座標が確定しない」というバグを抱えていることを知る。'
- '中盤: SNSを通じてミオと密なやり取りを始めるが、晴れた日の彼女はまるでデータの欠損のように不安定になり、ボクの記憶からも消えそうになる。星図が指し示す『特異点』が、彼女の存在を完全に消去しようとしていることに気づく。'
- '終盤: 記録的な豪雨の夜、星図が示す特異点が現実を書き換えるほどの現象を引き起こす。ミオがデータとして世界から削除されるのを防ぐため、ボクはデジタルの座標ではなく、自分の肉体を使って彼女の元へと走り出す。'
- '結末: 世界の再起動（アップデート）が完了し、すべてが元通りになったかに見えた。しかし、雨上がりの澄んだ空の下、ボクはスマホの画面越しではない、本当の彼女の体温を感じる。それはバグではなく、ボクたちが勝ち取った新しい仕様だった。'
style_notes: 「ボク」視点の一人称。文章のテンポを重視した短文構成。会話文にはチャット形式（『＠ユーザー名：メッセージ』）を多用。各話の合間に、Twitter風のタイムラインや、ライブ配信のコメント欄（「草」「尊い」「これ実話？」「！？！？！」など）を挿入し、物語のメタ的な熱量を表現する。ボクによるメタ的なツッコミ（「いや、ここで急に泣かせるとか、展開がテンプレすぎて草」など）を積極的に入れ、読者との距離を縮める。
