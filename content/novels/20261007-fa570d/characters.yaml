- name: 九条 蓮
  role: 主人公
  age: 32
  gender: 男性
  appearance: 痩身で青白い肌。度の強い眼鏡をかけ、常に皺のない白シャツを着用している。神経質そうな指先が特徴。
  personality: 極めて論理的で潔癖。感情よりも整合性を重視する。一人称は「私」。
  speech_style: 断定的で淡々とした口調。結論から話す傾向があり、相手の論理的矛盾を即座に指摘する。
  background: 国立公文書館の若き主任研究員。古文書の解読と記録の整合性検証における第一人者であり、学界では「記録の猟犬」と呼ばれている。
  motivation: 世界から「正しくない記録（矛盾）」を排除し、完璧な歴史的整合性を証明すること。
  relationships:
  - name: 沢田 真夜
    relation: 調査の同行者であり、唯一信頼する現場能力者
  - name: 白洲 源一
    relation: かつての恩師であり、思想的な対立相手
  arc: 客観的な真実のみを信じていたが、記録から抹消された「人間の感情」という不整合な要素を受け入れ、真の正義を定義し直す。
- name: 沢田 真夜
  role: 相棒
  age: 27
  gender: 女性
  appearance: ショートカットで活動的な服装。登山靴と多機能ジャケットを愛用し、常にメモ帳と計測器を携帯している。
  personality: 直感的で行動的。九条の冷徹さを補う人間味を持つ。一人称は「私」。
  speech_style: 快活で率直。専門用語を嫌い、噛み砕いた表現で話す。
  background: 元・山岳救助隊員。地図製作の専門知識を持ち、行政の不透明な土地管理に疑問を持って九条の調査に協力する。
  motivation: 地図から消された村にいたはずの人々の「生きた証」を物理的に見つけ出すこと。
  relationships:
  - name: 九条 蓮
    relation: 理屈っぽいが尊敬できるパートナー
  arc: 単なる同行者から、記録という概念を超えた「記憶」の重要性に気づき、主体的に事件の核心へ踏み込む。
- name: 白洲 源一
  role: 敵役
  age: 64
  gender: 男性
  appearance: 品格のある老紳士。仕立ての良い三つ揃えのスーツを纏い、常に穏やかな微笑を浮かべている。
  personality: 冷酷なまでの功利主義者。社会全体の調和のためには少数の犠牲と記録の改竄は不可避だと信じている。一人称は「私」。
  speech_style: 極めて丁寧な敬語。相手を懐に抱え込むような、包容力のある話し方をする。
  background: 元・内閣府記録管理局長。国家規模の「記録抹消計画」の設計者であり、不都合な真実を論理的に消し去るシステムを構築した。
  motivation: 社会的な混乱を避け、国家の論理的整合性を完璧に保つことで、擬似的な平和を維持すること。
  relationships:
  - name: 九条 蓮
    relation: 自分の後継者として期待していた教え子
  arc: 完璧に構築した「空白の論理」が、九条という不確定要素によって崩壊していく過程で、自身の孤独と直面する。
