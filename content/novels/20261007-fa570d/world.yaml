title: 第四次未定義領域における空間消失事象に関する考察 ―記録遺失村落の存在証明を巡って―
genre: 本格ミステリー
tone: 冷徹かつ学術的、断片的な記録による不穏な雰囲気
pov: 調査員による報告書および資料断片（一人称的な客観視点）
tense: 過去形および現在形
setting: 近現代の架空の研究機関、および地図から抹消された未踏の山岳地帯
premise: 廃棄された公文書館から、地図上にのみ記述された「存在しない村」を示す秘密の地図が発見される。その地図は、地理的座標ではなく、歴史的な矛盾点を示す符牒によって描かれていた。調査員が符牒を解読し、地図上の「消えた村」へと辿り着いたとき、そこには超常現象ではなく、行政的に「抹殺」された痕跡が残されていた。記録の空白に隠された、論理的な犯罪の全貌を解明する。
themes:
- 記録と真実の乖離
- 社会的な存在の抹消
- 情報の非対称性による隠蔽
rules:
- 村の消失は超常現象ではなく、高度な行政操作と物理的遮断によるものである
- 地図の解読には、特定の歴史的文献との照合が不可欠である
- 全ての謎は、残された公的記録の論理的な矛盾点から導き出される
plot_outline:
- '序盤: 廃棄された公文書館にて、地図上にのみ存在する「存在しない村」の断片が発見される。調査員は、地図の記述が特定の歴史的事象や気象条件と連動した暗号であることを突き止める。'
- '中盤: 調査員が座標を特定し、現地へ向かう。そこには村の遺構のみが存在し、住民に関する全ての公的記録が、まるで最初から存在しなかったかのように、極めて高い整合性を持って改竄されていることが判明する。'
- '終盤: 地図の隠された層を解析した結果、村は「ある重大な犯罪」を隠蔽するために、国家規模の記録抹消計画によって物理的・社会的に隔離されていたことが判明する。犯人の動機は、社会の論理的整合性を保つための「排除」であった。'
- '結末: 調査報告書の最終章において、矛盾する資料をパズルのように組み合わせることで、村で起きた事件の真相と、記録を操作した実行犯の正体が、学術的な帰結として提示される。'
style_notes: 物語は単一のナラティブではなく、調査報告書、聞き取り調査、地図の注釈、剥落した手記などの断片で構成する。感情的な修辞を極力排除し、徹底して乾燥した観測者の視点を維持すること。脚注（footnote）を多用し、本文に書かれていない「矛盾する事実」や「隠された背景」を読者に示唆することで、読者自身が断片的な資料から全体像を組み立てるような体験を提供する。
