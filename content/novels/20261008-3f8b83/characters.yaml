- name: 有栖川 海斗
  role: 主人公
  age: 28
  gender: 男性
  appearance: 端正だがどこか疲れを感じさせる顔立ち。効率化された都市に馴染む、清潔感のあるミニマルな服装。
  personality: 冷静沈着で論理的。感情の起伏が乏しく、物事をデータとして捉える傾向がある。「私」
  speech_style: 丁寧で無駄のない、事務的な口調。
  background: 記憶調律師として、人々の不快な記憶をクラウドへ切り離す「最適化（プランニング）」業務に従事している。
  motivation: 老人の不可解な依頼を完遂することで、自身の仕事の定義と、失われた感情の所在を確認すること。
  relationships:
  - name: 篠崎 源蔵
    relation: 依頼人
  - name: エレナ・ヴァンス
    relation: 上司
  arc: データを処理するだけの機械的な存在から、痛みを抱えて生きる人間としての手触りを取り戻していく。
- name: 篠崎 源蔵
  role: 重要人物
  age: 78
  gender: 男性
  appearance: 深い皺と日焼けした肌。潮風に晒されたような、古びているが芯の強さを感じさせる老人。
  personality: 頑固で情熱的。効率よりも記憶の重みを重んじる。「わし」
  speech_style: ぶっきらぼうだが、どこか慈愛に満ちた、独特の間がある話し方。
  background: かつて旧市街の灯台で通信技術に従事していた元技術者。最適化の波に抗い続けている。
  motivation: 愛した女性との「痛み」を伴う約束を、記憶のバックアップと共に守り抜くこと。
  relationships:
  - name: 有栖川 海斗
    relation: 依頼人
  - name: 天沢 美緒
    relation: かつての恋人
  arc: 自身の人生の終焉とともに、大切な記憶の価値を次の世代へと託す。
- name: エレナ・ヴァンス
  role: 敵役
  age: 45
  gender: 女性
  appearance: 完璧に整えられた容姿。一点の曇りもない、未来的で無機質な装い。
  personality: 極めて合理的で冷徹。社会のノイズを排除することに一切の躊躇がない。「わたくし」
  speech_style: 優雅だが、一切の感情の揺らぎがない、完璧な敬語。
  background: 記憶最適化局（プランニング局）の高官。社会の精神的安定を管理する立場にある。
  motivation: 社会の不確実性を排除し、精神的な最適化を完成させること。
  relationships:
  - name: 有栖川 海斗
    relation: 部下
  arc: 変化のない最適化された世界の象徴として、主人公の「非効率な選択」と対峙する。
- name: 天沢 美緒
  role: 脇役
  age: 25
  gender: 女性
  appearance: 琥珀色の夕日に溶け込むような、温かく輝かしい佇まい（回想の中での姿）。
  personality: 芯が強く、献身的。悲劇的な状況でも希望を見出そうとする。「私」
  speech_style: 優しく、穏やかな語り口。
  background: 源蔵と共に灯台の近くで過ごした女性。最適化が普及する前の時代を象徴する存在。
  motivation: 源蔵が「忘れること」で楽になるのではなく、「忘れられないこと」で自分と繋がり続けることを望む。
  relationships:
  - name: 篠崎 源蔵
    relation: 最愛のパートナー
  arc: 源蔵の記憶を通じて、主人公に「痛み」の真の意味を突きつける導き手となる。
