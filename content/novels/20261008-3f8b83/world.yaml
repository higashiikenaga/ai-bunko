title: 錆びた信号と、琥珀色のさよなら
genre: SF
tone: 静謐でノスタルジックな近未来の空気感
pov: 三人称近接
tense: 過去形
setting: 21世紀後半。感情の不要な部分を切り離し、精神的な最適化（プランニング）が普及した海沿いの地方都市。
premise: 人々が「不快な記憶」をクラウドへ切り離して生きる時代。記憶調律師の主人公は、あえて「最悪の記憶」を保持し続け、精神的な不協和音に苦しむ老人と出会う。老人が守ろうとするのは、今はもう使われていない古い灯台と、そこで交わされたある約束だった。便利さと引き換えに失った「痛み」という手触りを取り戻す物語。
themes:
- 喪失の肯定
- 記憶とアイデンティティ
rules:
- 『プランニング』という処置により、特定の記憶に伴う感情的な苦痛だけを分離して外部ストレージに保存できる。
- 分離された記憶は、物理的なレガシーサーバー（旧時代の通信施設など）に紐付けられている場合がある。
- 完全にプランニングされた人間は効率的に生きられるが、深い共感能力や創造性が緩やかに減退する傾向にある。
plot_outline:
- '序盤: 記憶調律師として働く主人公が、プランニングを拒否し、あえてノイズだらけの記憶を抱えて生きる老人から、記憶の『修復』ではなく『維持』の依頼を受ける。'
- '中盤: 老人の記憶を辿るうち、かつて通信拠点だった古い灯台が、彼の大切な記憶の物理的バックアップ先であることを突き止める。主人公は効率的な都市を離れ、潮風と錆に塗れた旧市街へと向かう。'
- '終盤: 灯台の麓にある『約束の丘』で、老人がかつて愛した女性と交わした、残酷で、けれどかけがえのない約束の内容が明らかになる。それは、忘れることで救われるのではなく、忘れられないことで相手を繋ぎ止めるという祈りだった。'
- '結末: 老人は静かに人生を終えるが、主人公は彼から引き継いだ『痛みのある記憶』を消さずに抱えることを決める。最適化された世界の中で、心地よい寂しさを噛み締めながら日常に戻る。'
style_notes: デバイスの動作音や空気の温度など、五感に触れる描写を重視する。「同期率」や「感情バッファ」などの専門用語を、説明的にではなく、日常会話の端々に自然に混ぜ込むことで、技術が生活に溶け込んでいる様子を表現する。便利さによって消し去られた『不便な感情』への慈しみを、淡々とした筆致で描く。
