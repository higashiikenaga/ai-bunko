- name: エルヴィン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 透き通るような白い肌と、感情の読み取れない灰色の瞳。常に装飾の少ない黒い司書服を纏っている。
  personality: 冷静沈着で厭世的。他人の記憶には深い関心を持つが、自分自身の感情には蓋をしている。一人称は「私」。
  speech_style: 丁寧で抑揚の少ない、静かで淡々とした話し方。
  background: 幼い頃に自身の記憶を失い、その空虚を埋めるように地下図書館の司書として静かに暮らしている。
  motivation: 少女の願いを叶える過程で、自分の中に残る「欠落」の正体を見つけ出すこと。
  relationships:
  - name: ノア
    relation: 保護対象であり、魂の共鳴者
  - name: シラス
    relation: 規律を強いる上司・監視者
  arc: 感情を排除した「観測者」から、喪失の痛みと美しさを引き受ける「人間」へと変化する。
- name: ノア
  role: 相棒
  age: 13
  gender: 女性
  appearance: 陽光を吸い込んだような淡い銀髪。存在が薄く、時折身体の輪郭が霞んで見えるほど儚い。
  personality: 穏やかで、どこか達観したような瞳を持つ。純粋だが、自身の空虚さを静かに受け入れている。一人称は「私」。
  speech_style: 囁くような、消え入りそうなほど柔らかな声。
  background: 誰にも顧みられなかった捨てられた記憶の断片から、偶然にも形を成した擬似的な存在。
  motivation: 自分が何者であるか、その「不在の証明」を突き止めること。
  relationships:
  - name: エルヴィン
    relation: 自分を導き、記憶を紡いでくれる存在
  - name: 名もなき猫
    relation: 唯一の理解者であり、導き手
  arc: 自分が偽物であるという残酷な真実に直面しながらも、エルヴィンが贈る「偽りの記憶」を通じて、幸福な終焉を受け入れる。
- name: 名もなき猫
  role: 脇役
  age: 不明
  gender: 不明
  appearance: 影のように黒く、瞳だけが琥珀色に妖しく輝く。実体があるのかさえ怪しい不定形な姿。
  personality: 饒舌ではないが、強い意志を持って行動する。神秘的で、時に予言的な雰囲気を持つ。
  speech_style: 言葉は発さないが、視線や仕草で明確な意思を伝える。
  background: 地下図書館の深層に棲まう、迷い子の魂を真実へと導く守護的存在。
  motivation: ノアを彼女の運命（消滅）へと導くこと。
  relationships:
  - name: ノア
    relation: 伴侶のような存在
  arc: 物語の導き手として、変化することなく運命を完遂させる。
- name: シラス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 厳格な規律を感じさせる、隙のない司書服。銀髪をきっちりと整え、冷徹な眼差しを持つ。
  personality: 秩序を絶対視する冷酷な合理主義者。個人の感情よりも、図書館の管理体制を優先する。一人称は「私」。
  speech_style: 命令的で、論理の破綻を一切許さない峻烈な口調。
  background: 記憶の結晶を「管理・廃棄」し、街の秩序を維持するために図書館に人生を捧げてきた。
  motivation: 禁忌（記憶の再構成）を犯そうとするエルヴィンを阻止し、図書館の秩序を守ること。
  relationships:
  - name: エルヴィン
    relation: 管理対象であり、規律を乱す異分子
  arc: エルヴィンの情緒的な決断を阻む「論理の壁」として立ち塞がるが、最終的に物語の悲劇性を際立たせる役割を果たす。
