title: 水晶の棺に眠る、名前のない喪失について
genre: ヒューマンドラマ
tone: 耽美、静謐、退廃的
pov: 一人称
tense: 現在形
setting: 常に淡い薄明に包まれた街の、最下層に位置する「忘却の地下図書館」
premise: 私は、人々が捨て去った記憶を結晶として保存する地下図書館の司書である。ある日、記憶の欠片を求める名もなき少女が、一匹の名前のない猫に導かれて私の元を訪れる。触れれば砕け散るほどに脆い彼女の願いを叶えるため、私は禁忌の書庫へと足を踏み入れる。それは、美しき絶望を愛した私たちが、互いの欠落を埋め合うための残酷で優しい物語。
themes:
- 喪失と受容
- 不完全なものの美しさ
rules:
- 記憶は物理的な結晶（宝石状の破片）として保存されており、触れることで当時の感情と情景を追体験できる
- 地下図書館に足を踏み入れた者は、代償として自分自身の幸福な記憶を一つ、蔵書として寄贈しなければならない
- 名前のない猫は、迷える魂を記憶の断片へと導く唯一の案内人である
plot_outline:
- '序盤: 静寂に支配された地下図書館で、孤独に記憶の結晶を整理する日々。そこに、記憶を失った少女と、影のように寄り添う名前のない猫が現れる。'
- '中盤: 少女の失った記憶を探して、私は彼女と共に色鮮やかな感情の結晶が眠る深層へと潜る。彼女の記憶の断片に触れるたび、私は自分の中にある空虚さと、彼女の抱える透明な悲しみに共鳴していく。'
- '終盤: 少女が探していた記憶の正体は、誰にも愛されず、誰にも思い出されなかったという「不在の証明」であった。彼女自身が、誰かが捨てた記憶から生まれた擬似的な存在であることが判明する。'
- '結末: 彼女が消えゆく運命にあることを知りながら、私は彼女のために最高に美しい「偽りの記憶」を紡ぎ出す。最後の一片が砕け散る瞬間、私は初めて、壊れゆくものの真の美しさに涙し、彼女を静かに見送る。'
style_notes: 語り手である『硝子 シオン』の個性を反映し、比喩表現を極限まで装飾すること。例えば、涙を『零れ落ちたサファイアの雫』、絶望を『霜が降りた冬の薔薇』、孤独を『薄氷の上の舞踏』のように描写する。静謐で、どこか死の香りが漂うような、繊細で脆い文体を維持し、視覚的な色彩（瑠璃色、琥珀色、白銀など）を多用して情景を塗りつぶすこと。
