- name: レン・カンザキ
  role: 主人公
  age: 26
  gender: 男性
  appearance: 常に眠たげな瞳と、情報のノイズを視覚化する義眼を持つ。機能性を重視した黒いテックウェアを纏っている。
  personality: 冷笑的で現実主義。効率を最優先するが、根底には強い倫理観を隠し持っている。一人称は「俺」。
  speech_style: 簡潔で無駄がなく、時折専門用語を交えたドライな口調。
  background: かつて管理センターのシステムエンジニアだったが、ある「不都合な真実」に触れたことで追放され、現在はフリーランスのデバッガーとして路地裏で生きている。
  motivation: 偶然手に入れた禁忌のコードの正体を突き止め、都市の嘘を暴くこと。
  relationships:
  - name: ライラ
    relation: 協力者・情報源
  - name: ディレクター・ヴェイン
    relation: 宿敵
  arc: システムの一部として「修正」することに慣れていた受動的な生き方から、自らの意志で世界の「バグ」を引き起こす能動的な革命家へと変貌する。
- name: ライラ
  role: 相棒
  age: 24
  gender: 女性
  appearance: ネオンブルーに染めたショートヘア。サイバーウェアで拡張された四肢を、オーバーサイズのコートで隠している。
  personality: ミステリアスで掴みどころがない。享楽的な態度をとるが、鋭い洞察力を持つ。一人称は「私」。
  speech_style: 音楽の拍動やリズムに例えた、比喩表現の多い軽快な話し方。
  background: 地下店『パルスの隠れ家』の店主。過去に都市の意識統合実験の被験者だった痕跡があり、個人の自我を極めて重んじている。
  motivation: 都市による個人の意識の統合を阻止し、誰もが「自分」であり続けられる世界を守ること。
  relationships:
  - name: レン・カンザキ
    relation: 信頼できるパートナー
  arc: 過去の実験による喪失感から、レンと共に戦うことで、他者との繋がりを再び信じるようになる。
- name: ディレクター・ヴェイン
  role: 敵役
  age: 55
  gender: 男性
  appearance: 汚れ一つない純白のスーツ。顔の半分は高度な銀色のインプラントで覆われ、人間離れした静謐さを漂わせる。
  personality: 徹底した秩序主義者。争いのない世界を作るためなら個人の犠牲は厭わない。一人称は「私」。
  speech_style: 極めて丁寧で理知的だが、感情の起伏が全く感じられない威圧的な口調。
  background: ネオ・エデンの管理センター最高責任者。人類を一つの巨大なネットワークへ統合することで、紛争と欠乏を根絶しようとしている。
  motivation: 『グランド・インテグレーション（大統合）』を完遂し、完璧な管理社会を実現すること。
  relationships:
  - name: レン・カンザキ
    relation: 排除すべきエラー
  arc: 完璧なシステムを構築しようとする執着が、予測不能な「バグ（人間性）」によって崩れ去る恐怖を知る。
- name: カイ
  role: 脇役
  age: 19
  gender: ノンバイナリー
  appearance: 小柄で、全身に高速演算用の小型デバイスを埋め込んでいる。常にフードを深く被っている。
  personality: 直感的で衝動的。都市のルールをゲームのように楽しむ危うさがある。一人称は「僕」。
  speech_style: スラングを多用した、マシンガンのように速いテンポの話し方。
  background: スラム街出身の天才ハッカー。レンに拾われ、デバッグの技術を叩き込まれた。
  motivation: 酸性雨の降らない、伝説の「青い空」をこの目で見るためのリソースを集めること。
  relationships:
  - name: レン・カンザキ
    relation: 師匠のような存在
  arc: 単なる情報の運び屋から、自らのハッキングが世界の形を変える責任を負う、一人の戦士へと成長する。
