title: クロックワーク・レジスタンス ―雨の街のデバッグ・ログ―
genre: サイバーパンク
tone: 硬質でスピーディー、戦略的な緊張感
pov: 一人称（俺）
tense: 現在形・過去形混合
setting: 超高層ビル群が雲を突き抜け、常に酸性雨が降り注ぐメガロポリス「ネオ・エデン」
premise: 高度なAI管理社会において、データの矛盾を修正する「デバッガー」として生きる俺。ある日、システム上の不可解な『バグ』を追っていた俺は、雨の日だけ開く謎の地下店『パルスの隠れ家』に辿り着く。そこで手に入れたデータは、都市の基盤そのものを書き換える禁忌のコードだった。都市の秩序を守る管理者か、それとも全てを破壊するバグか。俺は、約束の丘に隠された真実を求めて、電子の戦場を駆け抜ける。
themes:
- 決定論への反逆
- データの真実性と偽造
rules:
- 電子脳の同期率（シンクロ率）が一定を超えると、脳への過負荷による『思考停止（フリーズ）』が発生する。
- 戦闘における『権限（アクセス権）』は、物理的なデバイスやコードの奪取によってのみ拡張可能。
- 都市の監視AIは『論理的矛盾』を検知すると、即座に抹殺ユニットを派遣する。
plot_outline:
- '序盤: データのバグを処理する日常。謎の地下店『パルスの隠れ家』で、都市の根幹に関わる重要コードを偶然拾ってしまう。追手の介入に対し、限られたリソースと知略で切り抜ける。'
- '中盤: コードの正体が、都市の住民の意識を統合しようとする計画だと判明。仲間との出会いと、権限（アクセス権）を巡る高度なハッキング・バトル。戦術的な駆け引きが激化する。'
- '終盤: 都市の最上層、管理センターへの強襲。雨が止まない中、約束の丘にある旧時代の通信塔を目指し、全リソースを投入した最終デバッグを開始する。'
- '結末: システムの書き換えに成功するが、それは既存の秩序の崩壊を意味した。崩壊する都市の中で、俺は新しい『不確定要素』として生きることを決意する。'
style_notes: 一人称「俺」による、ドライで冷静な語り。戦闘シーンでは、単なる力押しではなく、使用可能なスキル、通信遅延、メモリ容量、アクセス権限といった具体的なリソース管理と、相手のロジックを突くカウンター戦略を緻密に描写すること。感情的な描写は最小限に抑え、状況の推移と最適解の導出を優先する文体。
