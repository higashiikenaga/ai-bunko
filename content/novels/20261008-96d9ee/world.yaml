title: 蒼氷回廊の共鳴師たち ―綴られる記憶と、静寂の対話―
genre: 群像劇
tone: 静謐で誠実。専門職への敬意が込められた温かい筆致
pov: 一人称（僕＝如月蓮）
tense: 過去形
setting: 前作から一年後。情報の繭を安定的に管理・抽出するために拡張された『極低温情報アーカイブ・蒼氷回廊』
premise: 物質から情報へと相転移した『繭』は、人類が失った過去の記憶を保存する巨大な図書館となった。僕たちは、その記憶を安全に読み出す『共鳴師（レゾナンス・チューナー）』として、極低温の静寂の中で情報の断片を紡ぎ出す日々を送っている。しかし、共鳴の副作用で『嘘をつけなくなる』という奇妙な症状が職員たちを襲い始め、職場の人間関係に綻びが生じ始める。そんな中、施設内を徘徊する名前のない猫が、繭の最深部に隠された「ある個人の切実な願い」へと僕たちを導いていく。
themes:
- 誠実であることの痛みと救い
- 技術者の誇りと倫理
rules:
- 共鳴率（レゾナンス・レート）：繭の情報に同期する指標。数値が高いほど詳細な記憶を抽出できるが、精神的な負荷が増大する。
- 認知的透明化（コグニティブ・トランスペアレンシー）：高すぎる共鳴率を維持した結果、脳内の情報整理機能が変質し、意図的に嘘をつくことができなくなる不可逆的な精神状態。
- 熱雑音（サーマル・ノイズ）：共鳴師の感情の乱れが物理的な熱として繭に伝わり、情報の破損を招く現象。そのため、共鳴師には極めて冷静な精神状態が求められる。
plot_outline:
- 序盤：新任の共鳴師として後輩の指導にあたる僕。繭から記憶を抽出する『セマンティック・クーリング（意味論的冷却）』という高度な技術を解説しつつ、日々の地道なメンテナンスの達成感を描く。ある日、施設内に迷い込んだ『名前のない猫』が、特定の共鳴周波数に反応することを発見する。
- 中盤：繭の深層探索が進むにつれ、チームメンバーに『認知的透明化』の症状が現れ始める。隠していた不満や秘密が白日の下に晒され、職場の調和が乱れる。僕は、技術者として彼らの精神的負荷を軽減させるための新しい調律法を模索し、小さな改善を積み重ねて信頼を取り戻していく。
- 終盤：繭の最深部で、前作の双子の科学者が遺した『本当の遺言』が見つかる。それは情報を保存することではなく、適切な時に忘却させるためのプログラムだった。外部組織が再びこの『忘却の権能』を奪おうと介入し、施設に深刻な熱暴走の危機が訪れる。
- 結末：僕と仲間たちは、個々の欠点さえも共鳴の一部として取り込む『多声的調律（ポリフォニック・チューニング）』を完遂し、危機を回避する。嘘をつけない呪いさえも、互いを深く理解するための鍵となった。名前のない猫に名前を付け、僕たちはこれからも静かに記憶の守り手として生きることを誓う。
style_notes: 『セマンティック・クーリング』や『多声的調律』などの専門用語が登場する際、必ず「つまり、〇〇ということだ」という形で、新人時代を思い出す僕の視点から丁寧に解説を入れる。大きな事件よりも、バルブ一つの調整や、数値が0.1%安定した時の静かな喜びなど、職人的な達成感を詳細に描写する。
