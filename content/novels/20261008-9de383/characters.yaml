- name: ゼノ・ヴァルカス
  role: 主人公
  age: 28
  gender: 男性
  appearance: 黒い外套を纏い、鋭い眼光を持つ。全身に古い傷跡があり、星の欠片を組み込んだ高速の剣を使用する。
  personality: 冷徹で現実主義。かつて守るべきものを見失った自分を嫌っている。一人称は「俺」。
  speech_style: 短く、ぶっきらぼう。必要最低限のことしか話さない。
  background: 元・聖騎士団の精鋭。帝国の腐敗を知り、禁忌に触れたとして追放され、現在は始末屋として生きている。
  motivation: 当初は報酬のための仕事だが、次第にルナの生存と世界の真実を守ることに変わる。
  relationships:
  - name: ルナ
    relation: 保護対象であり、唯一の相棒
  - name: ヴァレリウス
    relation: かつての師であり、現在は宿敵
  arc: 孤独な生存者から、他者のために剣を振るう真の英雄へと成長する。
- name: ルナ・エトワール
  role: 相棒
  age: 14
  gender: 女性
  appearance: 透き通るような銀髪と、星空を映したような碧い瞳。小柄でどこか儚げな印象を与える。
  personality: 生意気で好奇心旺盛。記憶がない不安を隠すように、明るく振る舞う。一人称は「私」。
  speech_style: 語尾が跳ねるような、活発で少し生意気な口調。
  background: 記憶を失った謎の少女。実は「禁忌の星図」を起動させるための生体鍵としての役割を持つ。
  motivation: 自分の正体を知ること、そしてゼノと共に新しい世界を見ること。
  relationships:
  - name: ゼノ
    relation: 信頼する相棒
  arc: 運命に翻弄される「道具」としての自分を受け入れ、自らの意志で未来を選択する。
- name: ヴァレリウス・グランツ
  role: 敵役
  age: 52
  gender: 男性
  appearance: 威厳のある白銀の軍服を纏い、常に冷静沈着な表情を崩さない。
  personality: 極めて合理的で、大義のためには少数の犠牲を厭わない。一人称は「私」。
  speech_style: 優雅で落ち着いているが、有無を言わせぬ威圧感がある。
  background: 帝国の最高顧問。星のエネルギーを完全に制御し、人類を「死と飢えのない完璧な楽園」へ導こうとしている。
  motivation: 星図を用いた全人類の統合と、偽りの楽園の完成。
  relationships:
  - name: ゼノ
    relation: かつての教え子であり、排除すべきイレギュラー
  - name: ルナ
    relation: 計画に不可欠な鍵
  arc: 秩序を守るための独善が、世界の崩壊を招く破滅へと至る。
- name: エララ・クロムウェル
  role: 脇役
  age: 25
  gender: 女性
  appearance: 帝国の騎士団制服を完璧に着こなし、凛とした佇まいを持つ。
  personality: 規律を重んじる真面目な性格。正義感が強く、任務遂行のためなら手段を選ばない。一人称は「私」。
  speech_style: 丁寧だが、隙のない軍人的な話し方。
  background: 帝国騎士団の若き指揮官。ゼノの追放に立ち会っており、彼を「裏切り者」として追う。
  motivation: 帝国の秩序を守り、星図とルナを確保すること。
  relationships:
  - name: ゼノ
    relation: 追うべき犯罪者
  - name: ヴァレリウス
    relation: 忠誠を誓う主君
  arc: 任務遂行の中で帝国の非道に直面し、自身の信じる正義と帝国の狂気の狭間で葛藤する。
