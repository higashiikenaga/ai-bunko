title: 星断の傭兵：アステリズム・ゼロ
genre: 異世界ファンタジー
tone: ハードボイルドかつ軽妙。疾走感のあるアクションエンタメ。
pov: 三人称
tense: 過去形
setting: 星の欠片（スターシャード）が動力源として利用される浮遊島群の世界「セレスティア」。
premise: 元・聖騎士の始末屋ゼノは、世界を崩壊させる「特異点」を狩る旅に出る。相棒は記憶を失った生意気な少女ルナ。禁忌の星図を巡り、空を埋め尽くす桜の嵐と帝国の追撃を突破するハイテンポな逃走劇が始まる。
themes:
- 運命への反逆
- 喪失と再生
rules:
- 星図（アストロラーベ）を持つ者だけが、次元の裂け目である「特異点」を検知し、到達できる。
- 魔法や兵装の動力は「星の欠片」を消費して行使する。使い切ると身体が結晶化し、消滅する。
- 世界の境界に存在する「桜の森」に足を踏み入れた者は、精神を星図に書き換えられ、自我を喪失する。
plot_outline:
- '序盤: 始末屋ゼノが廃都での依頼中に、謎の少女ルナと禁忌の星図を回収。直後に帝国騎士団に包囲されるが、圧倒的な速度の剣撃で突破し、ルナを連れて逃走する。'
- '中盤: ルナが星図を起動させる「鍵」であることが判明。世界各地の特異点を潰して回る中で、ゼノがかつて聖騎士を追放された理由と、帝国の「星の消費」による残酷な計画が明かされる。'
- '終盤: 帝国が全人類を星図に統合し、偽りの楽園を作る計画を始動。空一面に死の桜が舞い散る中、ゼノとルナは単身で帝国の中枢へと殴り込む。'
- '結末: 究極の特異点を破壊し、星図そのものを消去することで、人々は不自由だが自由な「地上」への帰還権を得る。ゼノとルナは新たな目的地を探して旅立つ。'
style_notes: 短文を積み重ねるスピード感重視。会話のテンポを最優先し、状況説明はキャラの掛け合いの中で処理する。アクションシーンは「斬る」「跳ぶ」「弾く」などの動詞でたたみかけ、擬音に頼らず視覚的な動きで速度感を演出。各話のラストには必ず絶望的な状況か衝撃の事実を提示し、強い引きを作る。
