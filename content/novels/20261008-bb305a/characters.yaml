- name: 鴉丸 骸
  role: 主人公
  age: 28
  gender: 男性
  appearance: 黒い着流しに、汚れの目立つ旅装束。鋭い眼光と、左頬に古い傷跡がある。腰には主の形見である折れた刀を帯びている。
  personality: 寡黙で冷静。失った記憶への焦燥感を内に秘めている。一人称：俺
  speech_style: 無駄を削ぎ落とした、低く硬い口調。
  background: かつてある戦いで凄惨な役割を担い、その罪の記憶を海底の神に奪われた浪人。
  motivation: 失った記憶を取り戻し、己が犯した過去の罪を直視すること。
  relationships:
  - name: 凪
    relation: 導き手
  - name: 海鳴
    relation: 宿敵
  arc: 記憶を追うだけの亡者から、過去の罪を受け入れ、自らの意志で未来を切り拓く剣士へ。
- name: 海鳴
  role: 敵役
  age: 不明
  gender: 男性
  appearance: 深海の底のような青白い肌。瞳には奪った他者の記憶が万華鏡のように揺らめいている。神々しくも禍々しい装束を纏う。
  personality: 傲慢で虚無的。他者の生きた証である記憶を弄ぶことを至上の悦びとする。一人称：私
  speech_style: 優雅で理知的だが、相手を突き放すような冷徹な響き。
  background: かつては村の守護者であったが、海底の遺跡に触れたことで、奪った記憶を糧とする古の神の化身へと変貌した。
  motivation: 全人類の記憶を海底へと沈め、感情のない永遠の静寂の世を築くこと。
  relationships:
  - name: 鴉丸 骸
    relation: 対極の存在
  arc: 記憶の集合体として無敵を誇るが、骸の「断絶」の一撃によって、その虚構の存在意義を失う。
- name: 凪
  role: 相棒
  age: 16
  gender: 女性
  appearance: 儚げな美少女。記憶を売った代償として、声と名前、そして瞳の輝きを失っている。
  personality: 献身的で、言葉を超えた共感能力を持つ。一人称：私（心の中）
  speech_style: 声が出せないため、筆談や視線、あるいは微かな手振りのみ。
  background: 村の市場で生き延びるために、大切な家族との記憶を売ってしまった少女。
  motivation: 骸と共に村の呪縛を解き、奪われた自分自身を取り戻すこと。
  relationships:
  - name: 鴉丸 骸
    relation: 信頼する共闘者
  arc: 記憶を失った「空っぽの器」から、自らの痛みと意志を持つ一人の人間へ。
- name: 蔵渡
  role: 脇役
  age: 52
  gender: 男性
  appearance: 肥満体の商人。豪華な絹の着物に、数多の記憶が封じられた小瓶を腰に下げている。
  personality: 強欲で狡猾。利益のためなら手段を選ばない。一人称：儂
  speech_style: 下卑た笑いを含んだ、慇懃無礼な商売人風の口調。
  background: 記憶市場の差配役。海底の神に記憶を捧げることで、村での絶対的な権力を維持している。
  motivation: より多くの記憶を収集し、永遠の富と権力を手に入れること。
  relationships:
  - name: 海鳴
    relation: 崇拝対象
  arc: 骸によって、自らが貪り続けた記憶の濁流に飲み込まれ、その欲望の果てに消える。
