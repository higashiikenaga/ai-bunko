title: 冥海断絶の太刀
genre: 伝奇
tone: 剛毅、静謐、殺伐とした時代劇
pov: 三人称
tense: 過去形
setting: 江戸末期、禁足地とされる寂れた漁村と、その海底に眠る太古の都
premise: 記憶を失い、主の形見である折れた刀のみを持つ浪人が、ある禁足の村に辿り着く。そこは人々の記憶が貨幣として取引される異様な市場が存在し、その記憶はすべて海底の遺跡へと流れ込んでいた。己の失われた過去を取り戻すため、浪人は深海に潜む古の神と、その守護者たちとの死闘に身を投じる。
themes:
- 武士の矜持
- 喪失と再生
rules:
- 記憶は『珠』として抽出し、市場で売買することが可能である
- 海底遺跡へ至る道は、自らの重要な記憶を一つ差し出した者しか通れない
- 人ならざる怪異を斬るには、記憶の残滓を鍛え上げた『忘却鋼』の刃が必要である
plot_outline:
- '序盤: 名もなき浪人が記憶を売る市場を持つ村に漂着し、自らの記憶が海底遺跡に奪われていることを知る'
- '中盤: 村の闇を支配する記憶の商人たちを斬り伏せ、海底遺跡へと降りる唯一の儀式に挑む'
- '終盤: 海底遺跡の最深部にて、奪われた記憶を糧に化身となった宿敵と、静寂の中での一騎打ちに臨む'
- '結末: 全ての記憶を取り戻し、己の罪と向き合った浪人が、最後の一撃で遺跡ごと深海の闇を断ち切り、再び地上へと戻る'
style_notes: 簡潔で力強い短文を重ねる。立ち合い前の張り詰めた静寂と、一瞬の斬撃による爆発的な動的描写を鋭く対比させる。情念を排し、武士道に基づいた精神的な葛藤を削ぎ落とした言葉で表現する。
