- name: エリス・ヴァン・クロムウェル
  role: 主人公
  age: 20
  gender: 女性
  appearance: 瑠璃色の瞳と、没落しても隠しきれない気品漂う端正な顔立ち。質素だが清潔感のあるドレスを纏う。
  personality: 芯が強く聡明。逆境に屈しない強靭な精神を持つ。一人称：私
  speech_style: 丁寧で落ち着いているが、意志を伝えるときは毅然としている。
  background: かつての名門クロムウェル家の令嬢。父の死後、辺境で静かに暮らしていたが、遺品の謎を追って社交界へ戻る。
  motivation: 父の遺した懐中時計と遺言書の謎を解き、一族の汚名を雪ぐこと。
  relationships:
  - name: カイル・ド・ラ・メール
    relation: 惹かれ合うライバル
  - name: エリスの父
    relation: 亡き父
  arc: 孤独な隠遁生活を送る少女から、運命に立ち向かい真実を掴み取る勇敢な女性へと成長する。
- name: カイル・ド・ラ・メール
  role: 相棒/ヒーロー
  age: 26
  gender: 男性
  appearance: 黒髪に鋭い灰色の瞳。冷徹な美貌を持ち、常に隙のない公爵服を完璧に着こなしている。
  personality: 冷酷で合理的。感情を排して行動するが、内面に深い孤独を抱える。一人称：私
  speech_style: 短く、隙のない洗練された、威圧感のある話し方。
  background: 王国で最も若く強力な権力を持つ公爵。宮廷の腐敗を監視し、独自の秩序を守ろうとしている。
  motivation: 王国の秩序を守ること、そして自身の孤独を埋める真実を見つけること。
  relationships:
  - name: エリス・ヴァン・クロムウェル
    relation: 運命の相手
  arc: 感情を殺して生きてきた孤独な権力者が、エリスとの出会いを通じて信頼と愛を知り、人間性を取り戻していく。
- name: セラフィナ・ヴォルテックス
  role: 敵役
  age: 38
  gender: 女性
  appearance: 派手で豪華な装飾を好み、妖艶な美しさを持つ。常に計算高い微笑を浮かべている。
  personality: 野心的で冷酷。目的のためには手段を選ばず、他人を駒として扱う。一人称：わたくし
  speech_style: 優雅で甘い響きだが、言葉の端々に相手を射抜くような威圧感が含まれる。
  background: 王宮の権力中枢に食い込む伯爵夫人。王位継承の混乱を利用して自らの地位を盤石にしようとしている。
  motivation: 遺言書に記された秘密を奪い、王国を裏から支配すること。
  relationships:
  - name: エリス・ヴァン・クロムウェル
    relation: 排除すべき障害
  - name: カイル・ド・ラ・メール
    relation: 政敵
  arc: 陰謀の主導者として君臨するが、真実の露呈と共に、自らが作り上げた嘘の罠に嵌まり破滅する。
- name: ジュリアン
  role: 脇役/協力者
  age: 22
  gender: 男性
  appearance: 軽やかな身のこなしと、好奇心に満ちた瞳を持つ。指先が器用で、常に道具を持ち歩いている。
  personality: 明るく機転が利く。エリスの良き理解者であり、技術的なサポート役。一人称：僕
  speech_style: 親しみやすく、少し砕けた口調だが、礼儀は失わない。
  background: 王宮の時計工房に勤める若き職人。エリスの父の教え子であり、彼女の帰還を待っていた。
  motivation: エリスを助け、止まったままの懐中時計を再び動かすこと。
  relationships:
  - name: エリス・ヴァン・クロムウェル
    relation: 友人・協力者
  arc: 単なる技術者から、エリスの決死の賭けを技術と勇気で支える、信頼に値する相棒へと成長する。
