title: 瑠璃色の夜会と忘却の遺言
genre: 歴史・時代小説
tone: 優雅、絢爛、耽美的
pov: 三人称
tense: 過去形
setting: 18世紀風の架空の王国「ルナリス」。豪華絢爛な宮廷社会。
premise: 没落した名家の令嬢エリスは、亡き父が遺した「壊れた懐中時計」と「謎の遺言書」を手に、再び王宮の舞踏会へと舞い戻る。そこには、冷徹な若き公爵カイルと、国を揺るがす残酷な陰謀が待ち受けていた。舞い踊るドレスの裾に秘められた嘘と、止まったままの時間が動き出すとき、真実の恋が花開く。
themes:
- 運命の再会
- 階級社会の愛憎
rules:
- 王宮の社交界では、扇の使い方やドレスの色彩が厳格な身分象徴として機能している。
- 王家の遺言書は、特定の鍵（懐中時計の欠片）が揃わない限り、物理的に開封できない封印が施されている。
plot_outline:
- '序盤: 辺境で静かに暮らしていたエリスが、父の遺品である壊れた懐中時計と、不完全な遺言書の存在を知り、その謎を解くために華やかな社交界へ復帰する。'
- '中盤: 豪華な舞踏会で冷徹な公爵カイルと出会い、激しく反発し合いながらも、互いの孤独に惹かれ合う。同時に、遺言書に記された秘密を狙う権力者たちの陰謀に巻き込まれ、宮廷内で孤立していく。'
- '終盤: 懐中時計を修理することで遺言書の封印が解かれ、王国を揺るがす王位継承の真実が明らかになる。エリスとカイルは、舞踏会の喧騒の中で敵対勢力を追い詰める危険な賭けに出る。'
- '結末: 陰謀を打ち破ったエリスは正当な名誉を取り戻し、カイルとの愛を誓い合う。止まっていた懐中時計が再び時を刻み始め、二人の新しい人生が幕を開ける。'
style_notes: 西洋宮廷の贅を尽くした衣装（シルクの光沢、繊細なレース、大粒の宝石）の色彩を詳細に描き、舞踏会の情景を華やかに装飾すること。語り口は格調高く、情緒的な形容詞を多用して、秘められた情熱と切なさを演出する三人称視点の優雅な文体を徹底する。
