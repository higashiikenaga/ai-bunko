- name: エレーヌ・ド・ラ・メール
  role: 主人公
  age: 18
  gender: 女性
  appearance: 琥珀色の瞳と、少し癖のある栗色の長い髪。没落したとはいえ、育ちの良さが感じられる清楚な佇まい。
  personality: 芯が強く、困難に直面しても気品を失わない。孤独を抱えつつも他者への慈しみを持つ。一人称：私
  speech_style: 丁寧で落ち着いた、教養を感じさせる話し方。
  background: かつて帝国の名門貴族だったが、数年前の政変により家名と財産を失った。亡き父の形見である「壊れた懐中時計」だけを心の支えに生きている。
  motivation: 父の遺品を守ること、そして自分に優しくしてくれたジュリアンを救い出すこと。
  relationships:
  - name: ジュリアン
    relation: 運命の恋人
  - name: ヴィクター
    relation: 家族を破滅させた宿敵
  arc: 孤独に耐えるだけの受動的な少女から、愛する人を守るために自ら運命を切り拓く強い女性へと成長する。
- name: ジュリアン・フォン・アストレア
  role: 主人公
  age: 20
  gender: 男性
  appearance: 月の光を反射したような銀髪と、深い海の底を思わせる青い瞳。どこか浮世離れした美しさを持つ。
  personality: 穏やかで神秘的。記憶を失っているが、本質的には正義感が強く、情熱を内に秘めている。一人称：僕
  speech_style: 優しく、相手を包み込むような柔らかい口調。
  background: 雨の日だけ現れる不思議な店の店主としてエレーヌの前に現れる。その正体は、記憶を封じられた帝国の第一王子。
  motivation: 失われた記憶の断片を探すこと、そしてエレーヌの笑顔を守ること。
  relationships:
  - name: エレーヌ
    relation: 最愛の人
  - name: ヴィクター
    relation: 政治的な対立相手
  arc: 自分は何者でもないという不安を抱えた青年から、自らの血筋と責任を受け入れ、愛のために戦う王へと覚醒する。
- name: ヴィクター・ヴァレンシュタイン
  role: 敵役
  age: 29
  gender: 男性
  appearance: 隙のない黒髪を整え、常に冷徹な光を宿した鋭い眼差しを持つ。威圧感のある端正な容姿。
  personality: 冷酷非道で野心的。目的のためには手段を選ばず、感情を論理で支配しようとする。一人称：私
  speech_style: 高圧的で、相手を支配下に置こうとするような威厳に満ちた話し方。
  background: 帝国の権力を掌握しようと画策する野心的な大貴族。エレーヌの家を没落させた黒幕であり、ジュリアンの帰還を阻止しようとしている。
  motivation: 帝国の実権を完全に掌握し、自らの理想とする秩序を作り上げること。
  relationships:
  - name: ジュリアン
    relation: 排除すべき王位継承者
  - name: エレーヌ
    relation: 過去の政変における駒
  arc: 完璧な支配者として君臨しようとするが、エレーヌとジュリアンの絆という「計算外の要素」によって、自らが築いた陰謀の罠に沈んでいく。
- name: クララ
  role: 脇役
  age: 18
  gender: 女性
  appearance: 陽光のような明るい金髪をポニーテールに結んでいる。活発で健康的な街娘の装い。
  personality: 明るく快活で、裏表のない性格。エレーヌの良き理解者であり、精神的な支え。一人称：あたし
  speech_style: 元気で、少し砕けた親しみやすい話し方。
  background: エレーヌが没落した後、同じ地区で共に生活を送る幼馴染の少女。帝都の裏事情や情報の集まりに詳しい。
  motivation: エレーヌが再び笑える日々を取り戻すこと。
  relationships:
  - name: エレーヌ
    relation: 親友
  arc: ただの友人として見守る立場から、エレーヌに重要な情報を伝えるなど、物語の転換点における重要な協力者へと役割を広げていく。
