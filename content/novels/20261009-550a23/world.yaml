title: 琥珀色の旋律と銀の舞踏会
genre: 青春恋愛
tone: 華麗で哀愁漂うロマンティシズム
pov: 三人称
tense: 過去形
setting: 架空の帝都。四季が美しく、宝石のような装飾が施された宮廷文化が栄える時代。
premise: 没落貴族の令嬢エレーヌは、運命の歯車が止まった「壊れた懐中時計」を手に、孤独な日々を過ごしていた。ある雨の日、彼女は路地の奥に突如現れる「雨の日だけ開く店」へと迷い込み、そこで謎めいた青年・ジュリアンと運命的な出会いを果たす。しかし、その店が秘める魔法と、華やかな舞踏会の裏で蠢く宮廷の陰謀が、二人の純真な恋を激しく揺さぶり始める。
themes:
- 運命の再始動
- 喪失からの再生
- 階級を超えた愛
rules:
- 『雨の日だけ開く店』は、特定の魔力を帯びた雨が降る時のみ、現世と境界の隙間に姿を現す。
- 懐中時計の針が動き出す時、持ち主の失われた記憶や時間が一時的に取り戻される。
- 宮廷の舞踏会におけるダンスの形式は、社会的な地位と政治的な結びつきを象徴する厳格な儀礼である。
plot_outline:
- '序盤: 没落したエレーヌが、亡き父の遺品である壊れた懐中時計を大切に抱えながら、孤独に生きる日常。雨の夜、偶然見つけた不思議な店で、記憶を失った青年ジュリアンと出会い、惹かれ合う。'
- '中盤: ジュリアンが帝国の第一王子であることを知り、エレーヌは動揺する。二人は華やかな舞踏会で再会するが、そこにはエレーヌの家を没落させた黒幕の影があった。懐中時計の修理を巡り、店が持つ秘密が明らかになっていく。'
- '終盤: 陰謀によってジュリアンが陥れられ、エレーヌは彼を救うために命懸けの舞踏会での賭けに挑む。壊れた懐中時計が、奇跡的な音を立てて再び時を刻み始める。'
- '結末: 陰謀は晴れ、二人は身分の壁を乗り越え、再び雨の降る日にあの店で再会することを誓い合う。時計の針が示すのは、二人で歩む新しい未来の刻。'
style_notes: 絹の擦れる音や、シャンデリアの輝き、ドレスの刺繍の細部までを贅沢に描写すること。比喩表現は宝石や花々に例え、優雅で装飾的な語り口を貫く。登場人物の心情は、舞踏会の喧騒と対比させるように、繊細かつ劇的に綴ること。
