- name: 瀬戸 透 (せと とおる)
  role: 主人公
  age: 21
  gender: 男性
  appearance: 痩せ型で少し神経質な印象を与える青年。眼鏡をかけており、リュックサックを背負っている。
  personality: 理性的で好奇心が強い。未知の事象に対しても、まずは論理的な解釈を試みようとする。一人称は「僕」。
  speech_style: 丁寧だが、困惑や恐怖が混じると早口になる。
  background: 民俗学を専攻する大学生。地方の廃村や伝承を調査するためのフィールドワーク中に遭難する。
  motivation: 村の不可解な儀式の正体を突き止め、安全に村から脱出すること。
  relationships:
  - name: 隠里の長老
    relation: 恐怖と疑念の対象
  arc: 知的好奇心に基づいた客観的な観察者から、生存を懸けた極限状態の逃亡者、そして最終的には運命を受け入れる犠牲者へと変貌する。
- name: 隠里の長老 (かくり の ちょうろう)
  role: 敵役
  age: 75
  gender: 男性
  appearance: 深く刻まれた皺と、濁った瞳を持つ老人。常に黒い作務衣を纏っている。
  personality: 冷酷で、村の伝統と儀式を絶対視する。慈悲の裏に、村を維持するための非情さを隠し持っている。一人称は「わし」。
  speech_style: 重々しく、断定的な言い回し。警告を与える際は威圧的。
  background: 隠里の掟を守り続けてきた現当主。列車の運行（身代わり）を司る儀式の執行者。
  motivation: 村の存在を維持するために、新たな「身代わり」を列車の運行に捧げること。
  relationships:
  - name: 瀬戸 透
    relation: 捧げるべき生贄
  arc: 透の抵抗を冷徹に退け、儀式を完遂させるべく、村の霧を操り彼を追い詰める。
- name: 志乃 (しの)
  role: 脇役
  age: 19
  gender: 女性
  appearance: 古風な着物に身を包んだ、どこか儚げな雰囲気の女性。肌が透けるように白い。
  personality: 物静かで、悲哀を帯びている。よそ者である透に対して、唯一同情的な態度を見せる。一人称は「私」。
  speech_style: 消え入りそうなほど静かな話し方。言葉少な。
  background: 村の祭りに従事する娘だが、実は数年前に「列車」に乗ってしまった村人の霊的な残滓、あるいはその再来。
  motivation: 透に警告を与え、彼が自分と同じ運命を辿らないよう願っている（が、結局は抗えない）。
  relationships:
  - name: 瀬戸 透
    relation: 哀れみを感じる対象
  - name: 隠里の長老
    relation: 儀式の管理下にある存在
  arc: 透に真実を伝えるヒントを与えるが、最後には彼と共に霧の中に消えていく運命を受け入れる。
