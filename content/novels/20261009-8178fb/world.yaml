title: 噤みの岳と、戻らぬ終電
genre: ホラー
tone: 静謐で湿り気を帯びた、逃げ場のない土着的な恐怖
pov: 三人称
tense: 過去形
setting: 現代、山間の霧深い村「隠里（かくり）」と、その廃線となった旧線跡
premise: 山あいの廃村、地図から消えたはずの「隠里」に迷い込んだ青年が、村で執り行われる異形の祭りを目撃する。村人たちは「あの列車に乗ってはならぬ」と口を揃え、夜の闇に響くレールの音を忌み嫌う。しかし、彼は村の禁忌を破り、霧の向こうから音もなく滑り込んできた「最終列車」へと足を踏み入れてしまう。そこは、かつて村と共に消えたはずの、死者のための停留所だった。
themes:
- 血縁と呪い
- 忘れ去られた神への供物
- 境界線における消失
rules:
- 『隠里』に足を踏み入れた者は、現世の理（ことわり）が通用しなくなる
- 夜の霧が深まると、実体のない『最終列車』が廃線跡を走る
- 村の神への供物（生贄）を捧げない限り、村人は現世へ帰ることができない
- 特定の禁忌（名前を呼ぶ、特定の方向に視線を向ける）を犯すと、神の依代にされる
plot_outline:
- '序盤: 大学の研究のために旧街道を辿っていた青年・透は、濃霧の中で地図にない集落『隠里』に辿り着く。村人たちはよそ者である彼を冷たく、しかしどこか憐れむような目で見つめ、夜の外出を厳しく禁じる。'
- '中盤: 村の古い言い伝えに触れた透は、村がかつて「ある列車」の事故と共に地図から消されたことを知る。夜、霧の中から響く鈍い走行音。村人たちが震えながら拝む中、透は幻聴に導かれ、霧の中に浮かび上がる「最終列車」を目撃してしまう。'
- '終盤: 列車から降りてきたのは、数十年前に死んだはずの村の住人たちだった。透は村の祭りが、列車の運行を維持するための「身代わり」を求めている儀式であることを悟り、村の長老から逃げ出すが、村全体が霧に呑まれ、逃げ道が消失していく。'
- '結末: 逃げ惑う透の前に、再びあの最終列車が静かに停車する。逃げ場のない恐怖の中で、彼は自らも「消えた村」の一部となるべく、列車の扉へと吸い寄せられていく。翌朝、霧が晴れた跡には、ただ錆びた線路と、誰もいない廃村だけが残されていた。'
style_notes: 湿った土の匂いや、腐敗した植物の感覚を強調する。会話には「〜じょ」「〜わい」といった地方特有の訛りを混ぜ、よそ者の視点との断絶を表現する。直接的なグロテスクさよりも、影の動きや、静寂の中に混じる「音」によって、読者の生理的な嫌悪感と恐怖を煽る。
