- name: 瀬戸 悠真
  role: 主人公
  age: 26
  gender: 男性
  appearance: 痩身で色白。都会での生活による疲弊から、目の下に深い隈があり、どこか焦点の定まらない虚ろな瞳をしている。
  personality: 内向的で繊細。現実逃避傾向があり、静寂を求める。一人称は「僕」。
  speech_style: 控えめで、語尾が消え入りそうな静かな話し方。独り言が多い。
  background: 中堅広告代理店に勤めていたが、過酷な労働と人間関係の摩耗により精神的に追い詰められ、休職中。
  motivation: 日常の喧騒から離れ、心身を休めるための静かな場所を見つけること。
  relationships:
  - name: 鏡像の「彼」
    relation: 自身の変貌・侵食対象
  arc: 安らぎを求めて訪れた場所で、自己の境界が失われていく恐怖に直面し、最終的に存在そのものが消失する。
- name: 鏡像の「彼」
  role: 敵役
  age: 26
  gender: 男性
  appearance: 悠真と瓜二つの容姿。しかし、肌は常に濡れたように光沢があり、瞳には光が宿らず、動きが物理法則からわずかに遅れて見える。
  personality: 無感情で執着心が強い。鏡の向こう側から現実を「渇望」している。
  speech_style: 言葉を発さず、粘り気のある水の流れる音や、湿った吐息のみ。
  background: 湿地帯の鏡面世界に棲まう、実体のない「概念」に近い存在。
  motivation: 鏡の向こうから現実世界へ這い出し、悠真の肉体を手に入れて入れ替わること。
  relationships:
  - name: 瀬戸 悠真
    relation: 入れ替わるべき器
  arc: 悠真の精神を徐々に浸食し、鏡の中の自分と現実の自分を完全に入れ替える。
- name: 霧島 冴子
  role: 脇役
  age: 45
  gender: 女性
  appearance: 常に湿った古いワンピースを纏っている。顔の半分が水に濡れたように白濁しており、実体があるのか判然としない。
  personality: 虚ろで、常に何かに怯え続けている。一人称は「私」。
  speech_style: 断片的で意味の通じない支離滅裂な呟き。霧の中に消えるような声。
  background: 数年前にこの貸別荘を訪れ、そのまま湿地帯の一部（水の一部）となってしまった元宿泊客。
  motivation: 悠真に警告を与えようとするが、その言葉は意味をなさず、ただの怪音として響く。
  relationships:
  - name: 瀬戸 悠真
    relation: 先駆者であり、回避不能な末路の暗示
  arc: 悠真の幻覚、あるいは湿地帯の記憶として現れ、彼が辿る運命を予感させる役割を果たす。
