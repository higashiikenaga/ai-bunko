title: 忘却の渇き、水鏡の檻
genre: ホラー
tone: 湿り気を帯びた、粘りつくような不穏さ
pov: 三人称近接（主人公の感覚に寄り添う）
tense: 過去形
setting: 現代、霧の立ち込める辺境の湿地帯と、古びた貸別荘
premise: 日々の生活に微かな摩耗を感じていた青年が、地図にない湿地帯にある古い貸別荘へと迷い込む。そこでは、常に噎せ返るような土の匂いと、どこからか聞こえる湿った足音が彼を追い詰めていく。砂漠のオアシスのように、ふと現れる美しい水溜りが彼に安らぎを与えるが、その水面に映る自身の姿は、少しずつ「別の何か」へと変貌していた。鏡の向こう側と現実の境界が、音もなく、確実に溶け始めていく。
themes:
- 自己の喪失
- 認識の歪み
rules:
- 水溜まりに映る像は、現実の肉体よりも数秒遅れて動く
- 湿度の高い場所ほど、音の輪郭が曖昧になり、実体のないものが干渉しやすくなる
- 鏡に映る自分と目が合った瞬間、記憶の一部が強制的に剥落する
plot_outline:
- '序盤: 都会の喧騒に疲れ果てた主人公が、霧深い山間の湿地帯を訪れる。貸別荘に到着した彼を、腐敗した植物のような、どこか甘ったるい異質な匂いが包み込む。'
- '中盤: 部屋の隅に置かれた古い鏡や、床に溜まった水溜まりに、自分の動きとわずかにズレた「何か」が映っていることに気づき始める。耳鳴りのような、粘り気のある水の流れる音が止まらない。'
- '終盤: 渇きに似た衝動に駆られ、彼は水溜まりに手を伸ばす。それはまるで砂漠のオアシスを見つけた旅人のように、彼を狂わせる。鏡の中の自分は、もはや彼自身の顔をしていなかった。'
- '結末: 主人公の意識は、水溜まりの底へと沈んでいく。現実の肉体は、鏡の向こう側で「何か」と入れ替わり、湿った音を立てながら、ただの無機質な物質へと変質していく。'
style_notes: 五感を執拗に描写すること。特に、湿った土の匂い、肌にまとわりつく空気の重さ、滴り落ちる水の音の残響に焦点を当てる。恐怖を直接的な言葉で語らず、風景の微かな歪みや、視界の端をかすめる不自然な影を通じて、読者の不安をじわじわと増幅させる。
