- name: 久我 蓮
  role: 探偵
  age: 29
  gender: 男性
  appearance: 痩身で青白い肌。縁のない眼鏡をかけ、常に隙のない三つ揃えのスーツを着用している。
  personality: 極めて理性的で冷徹。感情よりも論理的な整合性を優先する。一人称は「私」。
  speech_style: 丁寧だが突き放すような口調。結論から述べる傾向がある。
  background: 天文学と考古学に精通した元大学研究員。ある事件をきっかけに学界を離れ、現在はフリーのコンサルタントとして不可解な事件を解決している。
  motivation: 完璧に構築された「偽りの真実」というパズルを解き明かし、論理的に解体すること。
  relationships:
  - name: 篠崎 春樹
    relation: 思考の壁打ち相手兼、現場の記録係としての相棒
  - name: 西園寺 澪
    relation: 知的な駆け引きを行う観察対象
  arc: 感情を排して事件に臨んでいたが、星図に込められた人間の切実な情念に触れ、論理だけでは到達できない真実の在り方を意識し始める。
- name: 篠崎 春樹
  role: 主人公（観察者）
  age: 24
  gender: 男性
  appearance: 親しみやすい顔立ち。地元の市役所職員らしい地味な服装で、常にメモ帳を携帯している。
  personality: 好奇心旺盛で共感力が高い。常識的な視点から物事を捉えようとする。一人称は「僕」。
  speech_style: 標準的な若者の話し方。驚いた時に口調が早くなる。
  background: 地域の文化振興担当職員。星祭りの運営サポートで寺院を訪れていた際、久我に興味を持ち、彼の推理に同行することになる。
  motivation: 祭りの平穏を取り戻し、悲劇の真相を明らかにすること。
  relationships:
  - name: 久我 蓮
    relation: 心酔しつつも、その冷徹さに危うさを感じる友人
  - name: 金光 源蔵
    relation: 仕事上の付き合いがある地域の有力者
  arc: 久我の視点を通じて、物事の表面ではなく「構造」で世界を見る方法を学び、精神的に成長する。
- name: 西園寺 澪
  role: 容疑者/敵役
  age: 32
  gender: 女性
  appearance: 凛とした佇まいの美女。祭りの夜は深い紺色の訪問着を纏い、星のような髪飾りを付けている。
  personality: 誇り高く、家系への執着が強い。本心を悟らせないポーカーフェイス。一人称は「私（わたくし）」。
  speech_style: 古風で優雅な言葉遣いだが、時折鋭い皮肉を混ぜる。
  background: 殺害された家元の娘であり、次期家元としての教育を受けてきた。家系の伝統と星図の秘密を誰よりも深く理解している。
  motivation: 家系の名誉を守り、星図に隠された醜い真実を闇に葬ること。
  relationships:
  - name: 久我 蓮
    relation: 自らの嘘を見破ろうとする不愉快な闖入者
  arc: 完璧なアリバイと論理的な偽装で久我を追い詰めるが、最終的に論理によって逃げ道を塞がれ、孤独な真実に直面する。
- name: 金光 源蔵
  role: 脇役/容疑者
  age: 65
  gender: 男性
  appearance: 恰幅が良く、日焼けした肌に深い皺がある。寺の住職を支える筆頭世話人。
  personality: 保守的で頑固。伝統を絶対視し、外部の人間には排他的。一人称は「わし」。
  speech_style: 地方の訛りが強く、威圧的な口調。
  background: 代々この寺に仕える家系で、星祭りの儀式運営のすべてを把握している。家元の秘密を共有していた人物。
  motivation: 伝統的な儀式を完遂させ、寺の秩序を乱すものを排除すること。
  relationships:
  - name: 西園寺 澪
    relation: 忠誠心と同時に、若き家元への危惧を抱いている
  arc: 伝統という盾に隠れて真実を隠蔽しようとするが、久我の推理によってその盾が単なる妄執であったことを突きつけられる。
