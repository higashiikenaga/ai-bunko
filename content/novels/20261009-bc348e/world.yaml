title: 星図の迷宮、あるいは祭りの夜の凶刃
genre: 本格ミステリー
tone: 端正で論理的な、静謐な緊張感
pov: 一人称（観察者としてのワトソン役）
tense: 過去形
setting: 現代、地方の山間に位置する古刹と、その周辺で開催される伝統的な星祭りの夜
premise: 一年に一度、満天の星々を仰ぐ「星祭」の夜、隔離された寺院の奥座敷にて、家元が密室内で遺体となって発見される。現場に残されていたのは、不自然に書き換えられた古い星図と、季節外れの供物だけだった。不可解な状況に、理詰めの探偵と私――観察者たる私は、祭りの喧騒に紛れた死の真実を追い始める。提示される全ての物証は、夜空に描かれた星座の配置と密接に関係していた。
themes:
- 論理的帰結
- 伝統と虚飾
- 天文学的配置による暗号
rules:
- 密室の形成条件は物理的な鍵と閂に限定される
- 犯人は提示されたアリバイの矛盾を、星図の読み替えによって隠蔽している
- 凶器は現場にあるもの、あるいは犯人が事前に持ち込んだものに限られる
plot_outline:
- '序盤: 賑やかな祭りの夜、静寂に包まれた寺院で家元が死んでいるのが見つかる。入り口は内側から施錠された密室であり、周囲には目撃者もいない。'
- '中盤: 私と探偵は、現場に残された「狂った星図」と、被害者が最期に指し示した星の位置に注目する。容疑者たちは皆、祭りの行事に参加していたという完璧なアリバイを持っていた。'
- '終盤: 探偵が、星図の模様が示す「座標」と、寺院の建築構造、そして祭りの灯火の配置が一致することを見抜く。物理的な密室のトリックと、視覚的な誤認を利用したアリバイ工作が暴かれる。'
- '結末: 探偵が全ての矛盾を論理的に繋ぎ合わせ、犯人を指名する。犯行の動機は、星図に隠された家系の秘密にあり、論理によってその虚構が完全に解体される。'
style_notes: 古典的な本格推理の文体。探偵の鮮やかな思考プロセスを、語り手である「私」の驚きと観察を通じて記述する。読者が思考を放棄せぬよう、手がかり（星図の歪み、供物の種類、音の伝わり方など）は全て文章の中に公平に配置し、最後にそれらが一本の線に繋がる快感を与えること。
