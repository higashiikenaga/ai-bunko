- name: エリオス
  role: 主人公
  age: 17
  gender: 男性
  appearance: 色素の薄い髪に、どこか遠くを見つめるような儚げな瞳。首から古びた金色の懐中時計を下げている。
  personality: 穏やかで内省的。世界への好奇心はあるが、自分を欠落した人間だと感じている。一人称は「僕」。
  speech_style: 丁寧で控えめ。言葉を選ぶようにゆっくりと話す。
  background: 幼い頃に「世界の音と味」を失い、色彩だけが鮮やかな世界で生きている。唯一反応を示す懐中時計だけを頼りに、失われた感覚を取り戻す旅を続けている。
  motivation: 懐中時計が指し示す場所を訪れ、本当の「音」と「味」を取り戻すこと。
  relationships:
  - name: マリーナ
    relation: 旅を共にする信頼できる航海士
  - name: カエル
    relation: 食の価値観をぶつけ合う友人
  arc: 喪失感に囚われていた受動的な旅人から、大切なものを手放して世界を再生させる能動的な意志を持つ青年へと成長する。
- name: マリーナ
  role: 相棒
  age: 21
  gender: 女性
  appearance: 日焼けした肌に快活な笑顔。機能的な航海服に身を包み、大きなコンパスを腰に下げている。
  personality: 快活で現実主義。面倒見が良く、情に厚い。一人称は「あたし」。
  speech_style: ハキハキとした口調で、時折ぶっきらぼうだが温かみが含まれている。
  background: 雲海を渡る小型艇の船長。伝説の「空の底」に強い憧れを抱いており、エリオスの持つ時計が遺跡への鍵になると確信して彼をサポートする。
  motivation: 誰も到達したことのない「空の底」に辿り着き、世界の真実を目撃すること。
  relationships:
  - name: エリオス
    relation: 守るべき対象であり、共に真実を探す相棒
  arc: 目的達成への執着だけでなく、旅の途中で出会う人々や料理を通じて、今ここにある幸せに気づくようになる。
- name: カエル
  role: 脇役/ライバル
  age: 24
  gender: 男性
  appearance: 整った容姿に、旅先でも崩さない清潔なエプロンを着用。鋭い眼差しをしている。
  personality: 完璧主義で自信家。料理に関しては妥協を許さないが、実は寂しがり屋。一人称は「俺」。
  speech_style: 自信に満ち溢れた言い回し。料理の評価をするときは非常に厳格。
  background: 上層の浮遊島で名声を馳せていた料理人だったが、禁忌とされる「古代の味」を追求したため追放された。現在は失われたレシピを求めて放浪している。
  motivation: 世界を震撼させる究極の一皿を完成させ、自分の正しさを証明すること。
  relationships:
  - name: エリオス
    relation: 味覚を失った彼に「最高の味」を教え込みたいという奇妙な執着を持つ
  arc: 技術的な完璧さだけを求めていたが、エリオスと共に旅をすることで、料理の本質は「誰と食べるか」という記憶にあることを悟る。
