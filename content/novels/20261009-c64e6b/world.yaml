title: 凪の底の秒針、空の果てのレシピ
genre: 異世界ファンタジー
tone: 穏やかで抒情的、ノスタルジックな冒険譚
pov: 一人称（僕）
tense: 過去形
setting: 浮遊島と広大な雲海に覆われた世界。かつて海が存在していたとされる伝説の「空の底」が舞台。
premise: 壊れた懐中時計を首に下げた僕は、失われた「音」と「味」を探して雲海を渡る旅をしています。ある日、雲の切れ間に現れた海底遺跡のような巨大な構造物で、僕はかつて世界を繋いでいた「潮騒の記憶」に触れることになります。旅の中で出会う人々、土地ごとの温かな料理、そして止まったままの時計が刻む、静かな再生の物語です。
themes:
- 記憶の再生
- 旅と食の喜び
- 失われたものへの慈しみ
rules:
- この世界では、強い感情は『香りの粒子』として空に漂う
- 懐中時計の針が進むとき、その土地の失われた記憶が一時的に具現化する
- 浮遊島間の移動は、風の精霊を介した帆船によって行われる
plot_outline:
- '序盤: 旅人である僕が、壊れた懐中時計を手に新しい浮遊島へ到着する。そこで島の伝統料理である『雲綿の蒸しパン』を味わい、土地の人々と交流しながら、時計が微かに震える感覚を覚える。'
- '中盤: 時計の反応を追い、雲海の底に沈むとされる「海底遺跡」への航海に出る。霧深い海域で嵐に見舞われるが、現地の船乗りが作る『潮風のスープ』に救われ、仲間を得る。'
- '終盤: 海底遺跡の最深部で、かつて世界を覆っていた海がなぜ雲へと変わったのかという真実に辿り着く。遺跡に眠る巨大な機構を動かすため、僕は懐中時計を捧げる決意をする。'
- '結末: 時計の針が再び動き出し、世界に穏やかな潮騒が戻る。僕は再び、次の土地の料理と新しい出会いを求めて、風に乗って旅立つ。'
style_notes: 灯守ルカとしての文体を徹底する。風景描写は色彩豊かに、風の匂いや料理の湯気、旅の疲れを癒やす感覚を丁寧に描く。「僕は～した」「～だった」という日記調の語りを用い、読者が隣で一緒に旅をしているような、穏やかで心地よいリズムを維持すること。
