- name: 蓮見 湊
  role: 主人公
  age: 34
  gender: 男性
  appearance: 常に煙草の煙が似合う、疲れを隠さない鋭い眼差し。着古した灰色のトレンチコート。
  personality: 冷笑的で現実主義。物事の裏側を疑う癖がある。一人称は「僕」。
  speech_style: 低いトーンで、無駄を削ぎ落とした淡々とした話し方。
  background: 元刑事。ある未解決事件の捜査中に組織の闇に触れ、辞職して灰鳴市で探偵を営む。
  motivation: 依頼の完遂と、霧の中に隠された真実の断片を掴むこと。
  relationships:
  - name: 雨宮 栞
    relation: 依頼人
  arc: 依頼人の嘘を暴く過程で、自分自身が目を逸らしてきた「過去の罪」と向き合わざるを得なくなる。
- name: 雨宮 栞
  role: 依頼人
  age: 28
  gender: 女性
  appearance: 透き通るような白い肌と、雨に濡れると細く震える睫毛。どこか浮世離れした美しさ。
  personality: 静かで思慮深いが、内面に激しい情念を秘めている。一人称は「私」。
  speech_style: 丁寧で落ち着いているが、時折、自分自身を疑うような揺らぎが見える。
  background: 灰鳴市の片隅で静かに暮らす女性。戸籍上は一人だが、死んだはずの双子の姉の存在を追い続けている。
  motivation: 「自分」がどちらの人間であるのか、その境界線を確認すること。
  relationships:
  - name: 蓮見 湊
    relation: 依頼人
  - name: 雨宮 結衣
    relation: 死んだとされる双子の姉
  arc: 調査が進むにつれ、自分が守ってきた「偽りの肖像」が崩壊していく恐怖と対峙する。
- name: 霧島 誠一郎
  role: 敵役
  age: 55
  gender: 男性
  appearance: 恰幅のいい、威厳を感じさせる老紳士。常に完璧に整えられたスーツを纏う。
  personality: 支配的で、秩序と保身を何よりも重んじる。一人称は「私」。
  speech_style: 慇懃無礼。相手を敬いながらも、言葉の端々に圧力をかける。
  background: 灰鳴市の経済を牛耳る実業家。20年前の「約束の丘」の事件に関与している疑いがある。
  motivation: 過去の凄惨な真実が露呈し、現在の地位が脅かされるのを防ぐこと。
  relationships:
  - name: 雨宮 栞
    relation: 過去の因縁を持つ対象
  arc: 巧妙に隠蔽してきた嘘が剥がれ落ち、自らが作り上げた秩序に飲み込まれていく。
- name: 橘 玲子
  role: 脇役
  age: 30
  gender: 女性
  appearance: 眼鏡をかけた、事務的な印象を与える落ち着いた女性。市立図書館の司書。
  personality: 冷静沈着で、情報の整理に長けている。感情を表に出さない。一人称は「私」。
  speech_style: 事務的で、事実のみを淡々と述べる。
  background: 街の古びた記録や戸籍、過去の新聞記事に詳しい、灰鳴市の歴史の守り手。
  motivation: 記録の正確性を守ること。
  relationships:
  - name: 蓮見 湊
    relation: 情報提供者
  arc: 事件を通じて、記録に残らない「人間の感情」というノイズに翻弄される。
