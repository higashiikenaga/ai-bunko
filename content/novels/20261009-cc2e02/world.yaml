title: 夜を啜る雨と、偽りの肖像
genre: 本格ミステリー
tone: ハードボイルド、乾いた虚無感、雨と煙草の香り
pov: 一人称（私）
tense: 過去形
setting: 現代、常に雨が降りしきる寂れた港湾都市「灰鳴市」
premise: 降りしきる雨の中、私の事務所を訪れた女は、死んだはずの「もう一人の自分」を捜してほしいと依頼した。戸籍上は一人しか存在しないはずの彼女と、その鏡合わせの双子の謎。二十年前に「約束の丘」で交わされた残酷な誓いが、密室の死体という形で牙を剥く。
themes:
- アイデンティティの喪失
- 逃れられない過去の約束
rules:
- 物理的な証拠と論理的な推論のみで解決する本格ミステリーの形式を維持する
- 登場人物の嘘は、矛盾する証言や物証によってのみ暴かれる
plot_outline:
- '序盤: 雨の夜、謎の女が訪れ、公的には存在しないはずの双子の姉の死についての調査を依頼する。'
- '中盤: 街の古びた記録と聞き込みから、幼少期に『約束の丘』で二人で一人として生きる誓いを立てた双子の歪な過去が浮上する。'
- '終盤: 密室状態で発見された遺体の正体を巡り、巧妙な入れ替わりトリックと、どちらが『本物』として生きるはずだったかという残酷な真実が明かされる。'
- '結末: 事件は解決するが、生き残った女は再び雨の中に消え、私は煙草の煙と共に彼女の嘘を記憶に刻む。'
style_notes: ハードボイルドな一人称。感情を排した乾いた比喩を用い、突き放した視点で描く。会話は簡潔に。各話に必ず「雨」または「夜」の情景描写を挿入し、都市の孤独感を強調すること。
