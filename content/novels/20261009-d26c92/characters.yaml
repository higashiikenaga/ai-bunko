- name: サラ・ヴァレンシュタイン
  role: 主人公
  age: 28
  gender: 女性
  appearance: 鋭い眼差しを持つ、ダイブスーツの傷跡が残る身体。短髪で実用的な身なり。
  personality: 冷静沈着で行動派。理論よりも直感を信じる局面がある。一人称は「私」。
  speech_style: 簡潔で論理的な口調。極限状態でも動揺を隠そうとする。
  background: 極限環境における物理学のスペシャリスト。兄と共にペンローズ過程の検証任務に従事していたが、特異点近傍へのダイブを敢行した。
  motivation: 時間遅延によって失われた兄との時間を埋め合わせ、滅びゆくステーションを救うこと。
  relationships:
  - name: エリス・ヴァレンシュタイン
    relation: 双子の兄であり、唯一無二の理解者
  arc: 時間の残酷さに絶望しながらも、物理法則の向こう側にある「絆」を信じ、宇宙の真理を受け入れる強さを得る。
- name: エリス・ヴァレンシュタイン
  role: 主人公（精神的支柱）
  age: 350
  gender: 男性
  appearance: 衰弱した老人の姿。しかし、瞳の奥には数世紀分の知性が宿っている。
  personality: 思慮深く、忍耐強い。数世紀の孤独を学術的探究心で乗り越えてきた。一人称は「僕」。
  speech_style: 穏やかで慈愛に満ちた語り口。知識の重みを感じさせる丁寧な言葉遣い。
  background: ステーションの観測主任。サラのダイブ後、数世紀にわたりアケロンのデータを蓄積し続け、人類の希望となるための準備を一人で行ってきた。
  motivation: サラが帰還した後の世界を守ること、そして彼女と共に宇宙の真理に到達すること。
  relationships:
  - name: サラ・ヴァレンシュタイン
    relation: 双子の妹であり、生存の目的
  arc: 孤独な観測者から、妹の意識と融合することで宇宙の巨大な一部へと昇華する。
- name: カイル・レナード
  role: 脇役
  age: 45
  gender: 男性
  appearance: 使い込まれた作業服を着た、無精髭のステーション管理官。
  personality: 現実主義者で、科学的な理論よりもステーションの維持と生存を優先する。一人称は「俺」。
  speech_style: 現場叩き上げの、ぶっきらぼうだが信頼のおける口調。
  background: エネルギー抽出プラントの運用責任者。エリスが数世紀かけて築いた研究成果を、現実的な運用に落とし込む役割を担う。
  motivation: ステーションの崩壊を防ぎ、植民惑星へのエネルギー供給を維持すること。
  relationships:
  - name: サラ・ヴァレンシュタイン
    relation: 現場での協力者であり、危うい実験を危惧する監視役
  - name: エリス・ヴァレンシュタイン
    relation: 長年の知己であり、その老いと狂気的なまでの執念を理解する者
  arc: 科学的な奇跡（量子同期）を、生存のための手段として受け入れ、現場を指揮する。
