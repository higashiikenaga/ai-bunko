title: 事象地平の対称性 ―エルゴ球に眠る双星の記憶―
genre: SF
tone: 硬質で理知的、かつ崇高な孤独感を漂わせる
pov: 三人称
tense: 過去形
setting: 遠い未来。回転する巨大ブラックホール「アケロン」のエルゴ球（回転する時空が物質を引きずる領域）に建設されたエネルギー抽出ステーション
premise: 絶滅に瀕した人類を救うため、回転ブラックホールの回転エネルギーを抽出する「ペンローズ過程」を用いた大規模計画が実行された。双子の科学者、エリスとサラは役割を分かち、一方はステーションに残り、もう一方は超高重力下へのダイブを敢行する。一般相対性理論による極端な時間遅延の結果、数時間しか経過していないと感じるサラが帰還したとき、地上に残ったエリスは数世紀の時を経て老人となっていた。二人は、滅びゆくステーションを救うため、天文学的な確率で起こる「月食」による重力波の干渉を利用し、量子もつれによる意識の同期を試みる。
themes:
- 時間の非対称性
- 家族の絆と喪失
- 宇宙の摂理への畏怖
rules:
- 物理法則は一般相対性理論および量子力学に準拠する
- エルゴ球内では時空の引きずり（フレーム・ドラッギング）が発生し、通常の慣性系とは異なる挙動を示す
- 量子もつれによる通信は可能だが、物質の転送は不可能である
- 時間遅延（タイムダイレーション）は不可逆的であり、失われた時間は取り戻せない
plot_outline:
- '序盤: エルゴ球へのダイブから生還したサラが、極端な時間遅延により、かつて同いだった双子の兄エリスが死の間際にある老人となっている残酷な現実に向き合う。'
- '中盤: ステーションのエネルギー抽出プラントに致命的な欠陥が発覚し、このままではアケロンに飲み込まれ、後方に位置する植民惑星の全エネルギー供給が停止することが判明する。解決には、エリスが数世紀かけて蓄積した観測データと、サラがダイブ中に得た特異点近傍の物理量が必要となる。'
- '終盤: ステーションの衛星がアケロンの光を遮る「月食」の瞬間、重力レンズ効果による特異な干渉が発生し、一時的に超高帯域の量子同期が可能になる。二人は意識を融合させ、宇宙の巨大なスケール――銀河が渦巻き、時間が歪む光景――を共有しながら、プラントの再起動シークエンスを完遂させる。'
- '結末: ステーションは救われたが、同期の代償としてエリスの意識は完全に消滅し、サラの記憶の中にだけ生き続けることになる。サラは一人、永遠に変わらぬブラックホールの深淵を見つめながら、兄と共に見た宇宙の真理を記録し続ける。'
style_notes: 「カー解」や「フレーム・ドラッギング」などの専門用語を導入しつつ、「時空が渦を巻く川のように物質を飲み込む」といった平易な比喩で補足する。ブラックホールの降着円盤が放つ圧倒的な光量や、事象地平線の向こう側に消えゆく光の歪みなど、視覚的にスケールの大きな描写に注力する。
