- name: 星守 ソラ
  role: 主人公
  age: 17
  gender: 女性
  appearance: 星屑のような輝きを宿した瞳と、夜空を溶かし込んだような深い紺色の長い髪。アンティークな天球儀を常に携えている。
  personality: 感受性が強く、少し内向的だが、一度決めたことは曲げない芯の強さを持つ。一人称は「私」。
  speech_style: 穏やかで丁寧。時折、星の導きを口にするような詩的な言い回しを用いる。
  background: 海辺の街アステリアで、幼い頃から「星の声」を聞く不思議な力を持って育った。孤独を感じつつも、星との対話に安らぎを見出していた。
  motivation: 浜辺にいたカイの記憶を取り戻し、彼が失った故郷の謎を解き明かすこと。
  relationships:
  - name: カイ
    relation: 運命的な出会いをした、守りたいと願う少年
  arc: 星の声を聞くだけの受動的な少女から、自らの意志で新たな星座を空に刻む、運命を切り拓く表現者へと成長する。
- name: 海星 カイ
  role: 主人公
  age: 17
  gender: 男性
  appearance: 透き通るような白い肌と、深い海の底を思わせる静かな瞳。どこか儚げで、浮世離れした美少年。
  personality: 記憶喪失のため当初は無口で感情が乏しいが、ソラとの旅を通じて優しさと情熱を取り戻していく。一人称は「僕」。
  speech_style: 短く、静かな話し方。感情が昂ると少し言葉が途切れる癖がある。
  background: 数百年前、忽然と姿を消した「星降る村」の生き残り。記憶を失った状態でアステリアの浜辺に打ち上げられていた。
  motivation: 自分が何者であるかを知り、失われた故郷の真実と向き合うこと。
  relationships:
  - name: 星守 ソラ
    relation: 失われた記憶と未来を繋ぎ止めてくれる、かけがえのない存在
  arc: 過去の影に怯える漂流者から、大切な記憶と未来のために自らの選択を引き受ける一人の青年へと変化する。
- name: 鏡夜 ナイト
  role: 敵役/導き手
  age: 20
  gender: 男性
  appearance: 銀髪に鋭い銀眼。鏡のような質感を持つ漆黒の法衣を纏い、常に冷徹な空気を纏っている。
  personality: 冷徹で合理主義。星の理（ことわり）を絶対とし、感情による秩序の乱れを嫌う。一人称は「僕」。
  speech_style: 慇懃無礼で淡々としている。相手を突き放すような、突き放すような理屈っぽい話し方。
  background: 海底の鏡像遺跡を守護する「星の審判者」。かつて村が消えた際、世界の均衡を守るために介入した過去を持つ。
  motivation: 遺跡の均衡を保ち、人間が星の力に触れることで世界の秩序が乱れるのを防ぐこと。
  relationships:
  - name: カイ
    relation: 世界の均衡を揺るがす、過去の遺物
  - name: 星守 ソラ
    relation: 秩序を乱す、異端の力を持つ少女
  arc: 掟を守るだけの絶対的な傍観者から、二人の絆がもたらす「新たな理」を認め、変化を受け入れる存在へと変わる。
