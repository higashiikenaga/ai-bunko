title: 星屑の天球儀と、深海に眠る約束
genre: 青春恋愛
tone: 幻想的で静謐。夜空と深海の色彩が交錯するおとぎ話のような雰囲気。
pov: 三人称
tense: 過去形
setting: 星が降る海辺の街「アステリア」と、地図から消えた幻の村、そして海底に沈む星の鏡像遺跡。
premise: 星の声を聴くことができる少女・ソラは、ある夜、浜辺に打ち上げられていた記憶喪失の少年・カイと出会う。カイの正体は、数百年前にある日忽然と消えた「星降る村」の生き残りだった。二人は失われた記憶と故郷を取り戻すため、夜空の星座を鍵にして、深い海の底に眠る鏡像の遺跡へと旅立つ。
themes:
- 喪失と再生
- 時を超えた約束
rules:
- 魔法は星座の真名を詠唱することで発動し、光の粒子となって現象化する
- 消えた村は特定の星回りの夜にのみ、現実世界と境界が曖昧になる
- 海底遺跡に足を踏み入れた者は、星の欠片を持っていない限り、地上の記憶を次第に失っていく
plot_outline:
- '序盤: 星の声を聴く少女ソラが、言葉を失った少年カイを救い、彼がかつて消えた村の住人であったことを知る。'
- '中盤: 二人が星座の導きに従い、海底遺跡へと向かう旅路の中で、星の魔法を通じて心を通わせ、淡く切ない恋心に落ちる。'
- '終盤: 遺跡の最深部で、村が消えた理由とカイの記憶が明らかになる。彼が村を復元させるには、地上での記憶を代償にする必要があった。'
- '結末: ソラは自らの魔法で新たな星座を空に刻み、記憶を消さずに村と街を繋ぐ「星の橋」を架ける。二人は季節が変わるたびに巡り会える、永遠の約束を交わす。'
style_notes: 瑠璃色、銀色、琥珀色といった色彩表現を多用し、光の屈折や星の瞬きを丁寧に描写する。魔法の詠唱は詩的な形式で挿入し、ゆったりとした呼吸を感じさせるおとぎ話のような物語運びを徹底する。
