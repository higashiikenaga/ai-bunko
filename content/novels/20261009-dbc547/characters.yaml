- name: アルヴィス・ローレンス
  role: 主人公
  age: 19
  gender: 男性
  appearance: 細身で知的な印象を与える青年。眼鏡をかけ、古びた記録官のローブを纏っている。常に一冊の手帳を携帯している。
  personality: 冷静沈着で分析的だが、内には強い好奇心と正義感を秘めている。一人称は「僕」。
  speech_style: 丁寧で論理的。感情に流されず、事実に基づいた話し方をする。
  background: 辺境の禁書庫で働く平穏な記録官。歴史の真実を解明することに情熱を注いでいたが、ある詩篇を発見したことで運命が激変する。
  motivation: 失われた神話の真実を解き明かし、世界の終焉を阻止すること。
  relationships:
  - name: エリュシア・ヴァルガリス
    relation: 旅の同行者であり、守るべき相棒
  - name: ゼノス・ニヒリス
    relation: 思想的に対立する宿敵
  arc: 知識を蓄えるだけの傍観者から、自らの意志で歴史を動かし、新しい時代を切り拓く決断を下す主体者へと成長する。
- name: エリュシア・ヴァルガリス
  role: 相棒
  age: 23
  gender: 女性
  appearance: 銀髪のショートヘアに、意志の強そうな碧眼を持つ。使い込まれた銀の軽装鎧を身に着けている。胸元には剣の破片が埋め込まれている。
  personality: 寡黙でストイック。記憶を失っている不安を強さで覆い隠している。一人称は「私」。
  speech_style: 簡潔で無駄がない。軍人らしい規律を感じさせる口調。
  background: 戦場に突如として現れた記憶喪失の女騎士。身に宿す破片と呼応するように、断罪の剣の力を一部引き出すことができる。
  motivation: 失った記憶を取り戻し、自分自身が何者であるのかを知ること。
  relationships:
  - name: アルヴィス・ローレンス
    relation: 守るべき対象であり、心を許せる唯一の理解者
  arc: 過去の使命に縛られた「道具」としての自分から、自らの意志で未来を選択する「人間」としての自分を取り戻す。
- name: ゼノス・ニヒリス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 不自然なほど青白い肌と、底の見えない虚無を感じさせる漆黒の瞳を持つ。教団の祭服を纏っている。
  personality: 極めて静謐で、慈悲深いと言えるほど穏やかだが、その根底には徹底した虚無主義がある。一人称は「我」。
  speech_style: 荘厳で説教臭い。相手の存在意義を問うような、哲学的で重々しい語り口。
  background: 虚無を崇める教団の指導者。神々の死によって生じた世界の歪みを「苦しみ」と定義し、すべてを無に帰すことこそが究極の救済だと信じている。
  motivation: 「約束の丘」を顕現させ、世界を原初の混沌へと回帰させること。
  relationships:
  - name: アルヴィス・ローレンス
    relation: 世界の存続を願う、理解しがたい存在
  arc: 世界の破壊を完遂しようとする絶対的な障壁として、物語の終盤まで揺るぎない信念を貫く。
- name: カイザル・ドレイク
  role: 脇役/ライバル
  age: 35
  gender: 男性
  appearance: 屈強な体躯と、顔に走る古い傷跡が特徴的な傭兵団長。重厚な黒鉄の鎧を纏っている。
  personality: 現実主義者で野心家。力こそがすべてだと信じている。一人称は「俺」。
  speech_style: 荒々しく、威圧的。常に力による解決を優先する。
  background: 衰退する国家の再興を狙う軍事勢力の指揮官。断罪の剣の力を、国家の軍事力として利用しようと画策する。
  motivation: 剣の破片を回収し、自国に圧倒的な霊力をもたらすこと。
  relationships:
  - name: アルヴィス・ローレンス
    relation: 目的のために排除すべき邪魔者
  - name: エリュシア・ヴァルガリス
    relation: 手中に収めるべき強力な戦力
  arc: 剣の力を巡る争いの中で、魔法が失われる結末を前に、武力だけでは抗えない時代の変遷を突きつけられる。
