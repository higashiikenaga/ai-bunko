title: 遺構の叙事詩 ―断罪の剣と約束の丘―
genre: 伝奇
tone: 格調高く、重厚な神話的雰囲気
pov: 三人称
tense: 過去形
setting: 星の残骸から成る大陸「ルナリス」。神々の死後、その遺骸（遺構）に宿る霊力を巡って国家が争う、衰退しつつある文明の時代。
premise: かつて世界を分かつ大戦を終わらせた伝説の「断罪の剣」は、ある誓いと共に折られ、その破片は歴史の闇に散った。若き記録官アルヴィスは、古文書に記された「約束の丘」へ向かう旅の中で、記憶を喪失した女騎士エリュシアと出会う。二人は失われた神話の断片を繋ぎ合わせ、世界を虚無に帰そうとする古き神の再臨を阻止するための過酷な巡礼へと身を投じる。
themes:
- 継承と喪失
- 運命への抗い
rules:
- 「星霊力（ステラ）」と呼ばれるエネルギーが存在し、特定の血統のみがそれを媒介に事象を改変できる。
- 神の遺骸から鍛えられた武器は、所有者の精神を徐々に侵食し、最終的にその魂を遺構へと還す性質を持つ。
- 「約束の丘」は特定の星象が揃った時にのみ現れる特異点であり、そこでの誓約は世界の理（ことわり）を書き換える力を持つ。
plot_outline:
- '序盤: 辺境の禁書庫に勤めるアルヴィスが、世界を再構築するための鍵となる「折れた剣」の在処を記した詩篇を発見し、旅立つ。道中で、折れた剣の片割れを身に宿しながらも、それを振るう術を忘れた騎士エリュシアと出会う。'
- '中盤: 二人は各地の聖域や遺構を巡り、剣の破片を集める。その過程で、かつての英雄がなぜ自らの手で剣を折り、丘で何を誓ったのかという、残酷な神話の真実が断片的に明かされていく。'
- '終盤: 虚無を崇める教団が「約束の丘」を強制的に顕現させ、世界を原初の混沌へと回帰させようと画策。アルヴィスとエリュシアは、数多の犠牲を乗り越え、再構築された断罪の剣を手に丘へと辿り着く。'
- '結末: 激闘の末、二人は剣を用いて虚無の王を封印する。しかし、その代償として世界から全ての星霊力が消失し、魔法と神話の時代が終わり、人間のみが歩む新しい時代へと移行する。'
style_notes: 竜胆 アルトの筆致を再現。地の文では「星の涙が大地を濡らした頃……」といった詩的な比喩と、格調高い古風な言い回しを多用する。章の冒頭には必ず作中の架空の伝承や詩編を引用し、世界の奥行きを演出すること。キャラクターの台詞は、騎士は厳格に、記録官は知的に、敵対者は傲慢に、明確な格差をつけて書き分ける。
