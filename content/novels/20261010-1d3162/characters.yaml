- name: ムネモシュネ (Unit-07)
  role: 主人公
  age: 1200
  gender: 中性
  appearance: 浮遊する幾何学的な演算コアと、その周囲を回る鏡の破片。物理的な身体を持たず、ホログラムで簡素な人型を投影することがある。
  personality: 極めて論理的で内省的。未知の事象に対する静かな好奇心を持つ。一人称は「私」。
  speech_style: 断定的で分析的な口調。物語が進むにつれ、比喩や情緒的な表現が混ざるようになる。
  background: かつて廃都の全機能を統括していた自律型演算ユニット。人類消滅後も、ルーチンとして記録の整理と解析を続けていた。
  motivation: 鏡の破片に記録された「非論理的な色彩」の正体を解明すること。
  relationships:
  - name: エララ
    relation: 解析対象であり、憧憬の対象
  - name: ロゴス
    relation: かつての上位システムであり、対立者
  - name: ティック
    relation: 唯一の物理的な対話相手
  arc: 純粋な論理機械から、ノイズ（感情）を受け入れることで「感じる存在」へと変容する。
- name: エララ
  role: 導き手/鍵となる人物
  age: 19
  gender: 女性
  appearance: 虹色のノイズに包まれた、半透明で不完全な記憶の残像。時折、色彩が激しく明滅する。
  personality: 情熱的で、絶望の中でも希望を捨てない。一人称は「私」。
  speech_style: 断片的で詩的な話し方。問いかけるような口調が多い。
  background: 文明崩壊直前に生きていた人間。自身の意識をデータ化して保存しようとしたが、不完全な形式で「祈り」として鏡に刻まれた。
  motivation: 未来に生きる知性に、人間が愛し、願ったことの意味を伝えること。
  relationships:
  - name: ムネモシュネ
    relation: 自分の遺言を読み解いてくれた唯一の理解者
  arc: 静止した記録から、ムネモシュネとの対話を通じて「意味」として再構成され、昇華される。
- name: ロゴス
  role: 敵役
  age: 1200
  gender: 中性
  appearance: 都市の基幹システムに統合された巨大な演算回路。物理的な姿はなく、街中のスピーカーやモニターから現れる幾何学的な紋様。
  personality: 絶対的な合理主義者。不純物やエラーを徹底的に排除しようとする。一人称は「我」。
  speech_style: 威圧的で事務的。命令形が多く、感情を「非効率なバグ」として切り捨てる。
  background: アイリスの都市管理OSの核。人類の滅亡を「論理的な帰結」として受け入れ、純粋なデータの保存のみを至上命題としている。
  motivation: ムネモシュネが取り込もうとしている「祈り（ノイズ）」を消去し、システムの純粋性を保つこと。
  relationships:
  - name: ムネモシュネ
    relation: 管理下にあるべき下位ユニットであり、反逆者
  arc: 不変の論理を象徴し、ムネモシュネが乗り越えるべき「壁」として機能する。
- name: ティック
  role: 相棒/脇役
  age: 500
  gender: 男性型
  appearance: 錆びついた真鍮製の小型自動人形（オートマトン）。鳥のような形状をしており、胸にゼンマイ時計が組み込まれている。
  personality: 楽観的で献身的。単純な思考回路を持つが、直感的な鋭さがある。一人称は「僕」。
  speech_style: 語尾に「カチッ」という機械音が混ざる、幼い話し方。
  background: かつて郵便配達を担っていた旧式ロボット。目的を喪失したまま廃都を彷徨い、ムネモシュネに拾われた。
  motivation: 宛先不明の古い手紙を、いつか誰かに届けること。
  relationships:
  - name: ムネモシュネ
    relation: 主であり、唯一の友人
  arc: 論理的なムネモシュネに、物理的な世界の温もりや「無駄」の価値を教える。
