- name: 氷室 透
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で色白。知的な印象を与える眼鏡を着用。どこか浮世離れした、静かな佇まい。
  personality: 冷静沈着で探究心が強い。論理的な思考を好むが、内面には孤独感を抱えている。一人称は「僕」。
  speech_style: 丁寧で落ち着いた話し方。感情が高ぶると、独り言のように早口になる癖がある。
  background: 民俗学を専攻する大学院生。亡き祖父が調査していた「霜降り村」の謎を解明するため、遺品を手に村を訪れる。
  motivation: 祖父が遺した研究ノートの真実を突き止め、自身のルーツを確認すること。
  relationships:
  - name: 氷室 宗助
    relation: 祖父（故人）
  - name: 凍川 志乃
    relation: 協力者であり、警告者
  - name: 霜降り 源蔵
    relation: 対立する運命の先導者
  arc: 未知の事象を「解明すべき対象」として見ていた学者が、自身が「儀式の対象」であることを知り、逃れられない運命を受け入れ、自らを記録へと変えていく過程を描く。
- name: 凍川 志乃
  role: 脇役（導き手）
  age: 22
  gender: 女性
  appearance: 厚手の防寒着に身を包んだ、意志の強そうな瞳を持つ女性。地元の生活感がある。
  personality: 現実主義で、村の掟を絶対として守る。不器用だが情に厚い。一人称は「私」。
  speech_style: ぶっきらぼうで短文が多い。透に対しては、突き放すような、しかしどこか案じるような口調。
  background: 霜降り村の現役の住人。村の祭事や伝統を守る役割を担っており、外から来た透を警戒している。
  motivation: 村の静寂と平穏を維持すること。透が禁忌を犯して村が呪われるのを防ぐこと。
  relationships:
  - name: 氷室 透
    relation: 警戒対象であり、同情の対象
  - name: 霜降り 源蔵
    relation: 村の指導者としての敬意と、手法への疑念
  arc: 透を拒絶していたが、彼が背負う血筋の残酷さを知り、彼を救えない無力感と、村の掟の間で葛藤する。
- name: 霜降り 源蔵
  role: 敵役
  age: 78
  gender: 男性
  appearance: 深い皺が刻まれた顔と、氷のように冷たく、全てを見透かすような鋭い眼光を持つ老人。
  personality: 伝統と儀式を絶対視する狂信的な性格。私情を一切挟まない。一人称は「わし」。
  speech_style: 威圧的で、古風で重々しい言葉遣い。断定的な物言いをする。
  background: 霜降り村の長。地下図書館の存在を知り、その維持のために代々の「管理人」を確保してきた一族の末裔。
  motivation: 儀式を完遂させ、新たな「記憶」を地下図書館へ供給し続けることで、村の存続を図ること。
  relationships:
  - name: 氷室 透
    relation: 次世代の管理人（供物）
  arc: 透を「救済」の名の下に地下書庫へと追い詰め、村の因習を完遂させるべく、冷徹な執行者として立ち振る舞う。
- name: 霧島 結衣
  role: 脇役（亡霊的象徴）
  age: 19
  gender: 女性
  appearance: 凍りついたような青白い肌。薄い雪のような衣を纏い、書物の中から現れる幻影のような少女。
  personality: 虚ろで、深い悲しみに沈んでいる。言葉よりも感情を伝える存在。一人称は「私」。
  speech_style: 囁くような、風の音のように途切れがちな話し方。
  background: かつて書庫の禁忌に触れ、自らの記憶をすべて奪われ、書物の一部となってしまった村の元住人。
  motivation: 自分と同じ運命を辿ろうとする透に、警告を与えること。あるいは、誰かに記憶を読み取ってもらうこと。
  relationships:
  - name: 氷室 透
    relation: 警告者であり、鏡のような存在
  arc: 透の前に現れることで、書庫の真の恐怖を視覚的に示し、物語のホラー的緊張感を高める役割を果たす。
