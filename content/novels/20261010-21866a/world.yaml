title: 凍土の蔵と、忘却の書庫
genre: ホラー
tone: 静謐で湿り気を帯びた、逃げ場のない民俗的恐怖
pov: 三人称
tense: 過去形
setting: 現代、北国の山間にある廃村に近い集落「霜降り村」
premise: 数十年前に廃村となったはずの霜降り村を訪れた民俗学者の青年は、村の禁忌である「冬の蔵」の存在を知る。そこには、村の記憶を封じ込めた地下図書館が存在しており、氷に閉ざされた静寂の中で禁じられた書物が蠢いている。村の古い言い伝えに従い、一度読み始めた言葉は、命を差し出さねば終わることがない。
themes:
- 血脈と因習
- 記憶の呪縛
- 忘却の代償
rules:
- 地下図書館にある書物は、読み手の記憶を燃料として物語を綴り続ける。
- 氷の城と呼ばれる神域に足を踏み入れるには、村の祭りで捧げられる「名もなき供物」の儀式を経ていなければならない。
- 禁忌の書を読み終える前に外へ出ようとすれば、その者の存在自体が村の歴史から抹消される。
plot_outline:
- '序盤: 民俗学者の青年・透が、亡き祖父の遺品を頼りに霜降り村を訪れる。村の老人たちは彼をよそよそしく迎え、山の向こうにある「氷の城」へ近づくことを厳しく禁じる。'
- '中盤: 村の古い祭りの夜、透は村の地下に広がる、氷に閉ざされた巨大な地下図書館を見つけてしまう。そこには、村の人間が代々、自らの記憶を書き残し、あるいは奪われてきた記録が山積みにされていた。'
- '終盤: 透は、自身の血筋がこの図書館の「管理人」として選ばれていたことを知る。凍てつく書庫の中で、彼は止まっていた村の時間を動かすため、自らの記憶を紙へと変える儀式に巻き込まれていく。'
- '結末: 翌朝、村には何事もなかったかのように静寂が戻る。青年が訪れた形跡すら消え、ただ地下の氷の城の中には、一冊の新しい、瑞々しい記憶を綴った書物が静かに増えていた。'
style_notes: 湿った土の匂いや、凍てつく空気の質感、言葉にできない不気味な静寂を重視する。会話には東北地方を彷彿とさせる重たい方言を混ぜ、村の共同体が持つ、個人の意思を圧殺するような閉鎖性を描く。情緒的な語りの中に、生理的な嫌悪感を伴う描写を織り交ぜる。
