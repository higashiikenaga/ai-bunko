- name: 瀬戸 陽葵
  role: 主人公
  age: 17
  gender: 男性
  appearance: どこにでもいる平凡な外見。少し猫背で、常にスマートフォンを手に持っている。度の強い眼鏡をかけている。
  personality: 内向的で観察眼が鋭い。現実の人間関係に疲れ、ネットの世界に居心地の良さを感じている。一人称は「ボク」。
  speech_style: 控えめで丁寧だが、心中では皮肉屋な一面がある。独白が多い。
  background: 進学校に通う高校2年生。親の期待に応えるための受験勉強に倦怠感を感じており、精神的な逃げ道をSNSに求めていた。
  motivation: ユウナが残そうとしている「最高のログ」を完成させ、彼女にとっての意味のある存在になりたい。
  relationships:
  - name: 如月 ユウナ
    relation: SNSで繋がり、現実でも惹かれ合う運命的な相手
  - name: 一ノ瀬 蓮
    relation: 価値観が対極にあり、衝突するクラスメイト
  arc: 受動的な傍観者から、誰かのために全力で走り、現実の体温を求める能動的な人間へと成長する。
- name: 如月 ユウナ
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と儚げな雰囲気。古びた懐中時計を大切に持ち歩いている。制服の上にオーバーサイズのカーディガンを羽織っている。
  personality: いたずらっぽくミステリアス。死を目前にしながらも、それを「コンテンツ」として客観視しようとする強がりな性格。一人称は「わたし」。
  speech_style: ネットスラングと詩的な表現が混ざった独特な話し方。時折、残酷なほど率直なことを言う。
  background: 不治の病を患っており、命の期限が迫っている。SNSで「死ぬ直前のログ」を公開することで、自分の生きた証を刻もうとしている。
  motivation: 孤独に死ぬのではなく、誰にも真似できない「最高に幸せな瞬間」を記録し、人生を完結させること。
  relationships:
  - name: 瀬戸 陽葵
    relation: 自分の孤独を理解し、ログの共犯者となってくれた唯一の少年
  - name: 一ノ瀬 蓮
    relation: 自分を「消費されるコンテンツ」として扱う不快な存在
  arc: 「誰かに見られるための幸せ」を追い求めていたが、最後には「誰にも見せない二人だけの時間」に真の価値を見出す。
- name: 一ノ瀬 蓮
  role: 敵役/対比構造のキャラクター
  age: 17
  gender: 男性
  appearance: 華やかな容姿で、常に最新のトレンドファッションに身を包んでいる。高価なスマートフォンと自撮り棒を愛用。
  personality: 自信家で承認欲求が極めて強い。世界を「バズるか、バズらないか」で判断する。一人称は「俺」。
  speech_style: 早口で軽快。流行語を多用し、相手をコントロールしようとする話し方。
  background: 地元で影響力を持つ高校生インフルエンサー。ユウナの「死のログ」というコンセプトに商機と話題性を見出し、彼女を追い詰める。
  motivation: ユウナと陽葵の恋愛をコンテンツ化し、自身のフォロワー数を最大化させること。
  relationships:
  - name: 瀬戸 陽葵
    relation: 凡庸で退屈だと思っており、弄ぶ対象として見ている
  - name: 如月 ユウナ
    relation: 最高の素材（コンテンツ）として執着している
  arc: 数字上の称賛に固執していたが、陽葵とユウナの「バズらない時間」の強さを目の当たりにし、自身の空虚さに気づく。
