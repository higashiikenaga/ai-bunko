title: 秒針が止まるまで、キミの通知を切らないで
genre: 青春恋愛
tone: 軽快、エモーショナル、SNS的スピード感
pov: 一人称（ボク）
tense: 現在形と過去形の混在
setting: 現代、地方都市の高校と、放課後の屋上およびSNS上のコミュニティ
premise: ボクは、死ぬ間際に「一番幸せな瞬間のログ」を残すという奇妙なルールを持つ少女、ユウナと出会う。彼女が抱える「壊れた懐中時計」は、彼女の命のカウントダウンだった。二人は『約束の丘』で再会することを誓い、画面越しと現実を駆け巡る。ただし、ボクたちの恋がバズった瞬間、その幸せは偽物として切り捨てられる。
themes:
- デジタルな繋がりと肉体的な温度
- 永遠への抵抗
- 記録されることの意味
rules:
- ユウナの懐中時計が止まると、彼女のSNSアカウントは削除され、周囲の記憶からも彼女が薄れる
- 二人の感情が高ぶると、現実世界のノイズ（バグ）として周囲に電子音が鳴り響く
plot_outline:
- '序盤: 受験勉強に飽きたボクは、SNSで話題の『死ぬ直前に最高のログを残す』というアカウントの主、ユウナとDMで繋がる。彼女の正体を探るうちに、学校の屋上で「壊れた懐中時計」を弄ぶ彼女と遭遇する。'
- '中盤: ユウナとの距離が縮まるにつれ、ボクたちは「約束の丘」でまた会おうと約束する。しかし、二人の交流がSNSで拡散され、「リアコ勢」や「アンチ」の騒ぎに巻き込まれる。ユウナの命の猶予は、時計の針が止まるごとに短くなっていく。'
- '終盤: 懐中時計の針が動きを止めようとする中、ボクはユウナの命を繋ぎ止めるためではなく、彼女の「最高に幸せなログ」を完成させるために、丘へと走る。ネットの炎上と現実の孤独が交差する中、ボクは画面越しではない、彼女の体温を探す。'
- '結末: 丘の頂上で、ボクたちは時計の針が止まる瞬間に、最高に「バズらない」二人だけの時間を共有する。ユウナは消えないが、ボクのスマホには、誰にも見せない真っ黒な画面と、確かな鼓動のログだけが残る。'
style_notes: ネオ・カナタによる執筆。一人称「ボク」によるメタ的なツッコミを多用し、「っていうか、マジで意味不明なんだけど」といった独白を挟む。物語の転換点や感情のピークでは、必ず『【コメント欄】』や『【SNSのタイムライン】』を挿入し、読者が物語を「ウォッチしている」感覚を演出すること。文体は短文を積み重ね、リズム感を重視する。
