- name: エリオット・ヴァレンタイン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で顔色は青白く、常に神経質そうな瞳をしている。常に古い地図や天球儀を携えている。
  personality: 独占欲が強く、極端に潔癖。愛と狂気の境界が曖昧。「僕」
  speech_style: 丁寧だが、どこか突き放したような、あるいは自分に言い聞かせるような独白調。
  background: 先代から屋敷と「守護」の義務を受け継いだ。妹を外界の汚れから守ることが自身の存在意義だと信じ込んでいる。
  motivation: 妹を『怪異』や『汚染』から隔離し、永遠に純粋な状態で守り抜くこと。
  relationships:
  - name: リアン
    relation: 最愛の妹であり、守るべき対象
  arc: 守護者としての自負から、妹を物理的に固定（殺害・保存）することでしか愛を完結できない狂信者へと変貌する。
- name: リアン・ヴァレンタイン
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 病弱で華奢、透き通るような肌を持つ。屋敷の窓から見える霧の色に似た瞳をしている。
  personality: 従順に見えるが、内側に強い好奇心と生への渇望を秘めている。「私」
  speech_style: 穏やかで控えめだが、時折、兄の支配を揺るがすような鋭い問いを投げかける。
  background: 幼い頃から屋敷に閉じ込められ、兄によって「外界は危険な場所」だと教え込まれて育った。
  motivation: 霧の向こう側にある「本当の世界」を見ること、兄の管理から逃れること。
  relationships:
  - name: エリオット
    relation: 兄。自分を愛してくれていると信じていたが、次第に恐怖の対象となる
  arc: 兄の庇護下にある「安寧」から、未知の「自由」へと踏み出そうとし、最終的にその意志を断たれる。
- name: カイル・ミラー
  role: 敵役（読者視点での救済者）
  age: 32
  gender: 男性
  appearance: 泥に汚れ、使い古された登山装備を身につけた捜索隊員。逞しいが疲弊している。
  personality: 現実主義的で責任感が強い。理性的。「俺」
  speech_style: 荒っぽいが、困っている者を放っておけない、直球で力強い口調。
  background: 数年前に行方不明になった一族の捜索、あるいは近隣の失踪事件の調査のために霧の山へ足を踏み入れる。
  motivation: 行方不明者の手がかりを見つけ、屋敷に潜む異変を解明すること。
  relationships:
  - name: エリオット
    relation: 排除すべき『侵入者』
  - name: リアン
    relation: 救出すべき生存者
  arc: 屋敷の真実（エリオットの狂気）に辿り着くが、彼が「排除」してきた犠牲者の一人として物語の結末に飲み込まれる。
