title: 盲目の地図と、嘘つきな天球
genre: ホラー
tone: 静謐で抑圧的、徐々に狂気が露呈する冷徹な空気感
pov: 一人称
tense: 過去形
setting: 深い霧に包まれた山奥の、古びた洋館
premise: 「僕は世界で唯一、妹を正しく愛し、守ることができる」。病弱な妹を外界から隔離して介護する語り手は、屋敷に潜む『名もなき侵入者』を退けるため、先代から受け継いだ秘密の地図と星図を頼りに、屋敷内の安全圏を管理していた。しかし、妹が次第に「外」への渇望を見せ始め、地図にない通路を見つけたとき、語り手が構築していた「守護」という名の地獄が崩れ始める。
themes:
- 共依存と支配
- 認識の乖離
- 愛の形をした暴力
rules:
- 屋敷の構造は星図と連動しており、特定の星の位置にある部屋だけが『安全』とされる。実際には、それは語り手が妹を監視・拘束しやすくするための管理図である。
- 侵入者は語り手の主観では怪物に見えるが、客観的には救助者や警察である。
- 語り手は自分の記憶を都合よく書き換えるため、読者に提示される状況証拠と語り手の説明に常に乖離がある。
plot_outline:
- '序盤: 語り手が妹への深い愛情と、屋敷に潜む怪異から彼女を守る日常を淡々と綴る。秘密の地図と星図を用いて、怪異が侵入できない『聖域』を維持している様子を描く。'
- '中盤: 妹が語り手の指示に背き、屋敷の隠し通路を探索し始める。語り手は彼女を『汚染された』と判断し、より厳格な管理（監禁）へと移行する。その過程で、地図に記された座標が、天体ではなく屋敷の地下室の構造を示していることが示唆される。'
- '終盤: 妹が外部からの救助者に接触し、脱出を試みる。語り手はそれを『怪異による誘惑』と捉え、激しいパニックに陥る。読者は語り手の視点を通じて、彼がこれまで「排除」してきた人々が、実は行方不明になっていた家族や捜索隊であったことを知る。'
- '結末: 妹を完全に「保存」した（殺害し、剥製にするか地下に埋めた）語り手が、静まり返った部屋で微笑む。冒頭の「僕は世界で唯一、妹を正しく愛し、守ることができる」という一文が、物理的に二度と誰も彼女に触れられない状況にしたという意味への反転として機能し、幕を閉じる。'
style_notes: 理知的で丁寧な口調を維持しつつ、形容詞の選択にわずかな違和感を混ぜる（例：血の赤を『熟した果実のような心地よい色』と表現する）。読者が「この語り手は何かを隠している」と感じさせる伏線を散りばめ、情景描写と心理描写の食い合わせを意図的に悪くすることで、認識の歪みを演出する。
