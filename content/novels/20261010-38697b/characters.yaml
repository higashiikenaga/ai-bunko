- name: 蓮（れん）
  role: 主人公
  age: 21
  gender: 男性
  appearance: 少し長めの黒髪に、眠たげな伏せ目がちな瞳。着物に洋風のベストを合わせた、和洋折衷の装い。常に銀の懐中時計を携えている。
  personality: 冷静沈着でどこか浮世離れしているが、内面には深い慈愛を持つ。一人称は「私」。
  speech_style: 丁寧で落ち着いた口調。時代に流されない古風な言い回しを時折混ぜる。
  background: 代々、文明の音に紛れて消えゆく怪異を鎮めてきた『刻の鎮守』の一族の末裔。機械の音に惑わされず、止まった時の中に潜む声を聞くことができる。
  motivation: 自身の使命を果たすこと、そして氷華の抱える孤独を救うこと。
  relationships:
  - name: 氷華
    relation: 運命に惹かれ合う、救うべき対象
  - name: 櫂
    relation: 幼馴染であり、対照的な価値観を持つ友人
  arc: 使命としての「鎮魂」から、個の魂に寄り添う「救済」へと、自身の在り方が変化していく。
- name: 氷華（ひょうか）
  role: ヒロイン/敵役
  age: 20
  gender: 女性
  appearance: 透き通るような銀髪と、凍てつくような美貌。雪のように白い装束を纏い、周囲の温度をわずかに下げる。
  personality: 孤独で、人間への深い不信感と怒りを抱えている。しかしその本質は、忘れ去られることを恐れる儚い存在。一人称は「私」。
  speech_style: 詩的で、どこか寂寥感の漂う、静かな話し方。
  background: 蒸気機関が導入された黎明期、開発のために森を焼き払われた際に、人間に裏切られた記憶を持つ古き物の怪。
  motivation: 文明の喧騒をかき消し、自分たちの存在を忘れさせないための騒乱を起こすこと。
  relationships:
  - name: 蓮
    relation: 唯一、自分の悲鳴を聞き取ってくれた者
  arc: 復讐に燃える怪異から、蓮との触れ合いを通じて、消えゆく運命を受け入れ平穏を得る存在へと変わる。
- name: 櫂（かい）
  role: 相棒/脇役
  age: 22
  gender: 男性
  appearance: 短髪で快活な印象。常に油汚れのついた作業着か、仕立ての良い洋服を着ている。工具箱を持ち歩いている。
  personality: 合理的で情熱的。新しい技術が世界を良くすると信じて疑わない。一人称は「俺」。
  speech_style: 早口で活気があり、新しい文明用語を積極的に使う。
  background: 帝都の鉄道開発に携わる若き技師。蓮の幼馴染であり、怪異の存在を「非効率な旧弊」として捉えている。
  motivation: 蒸気機関の完成と、技術による帝都の発展。
  relationships:
  - name: 蓮
    relation: 理解し合えない部分もあるが、心から信頼する幼馴染
  - name: 葛城
    relation: 尊敬する雇い主であり、野心的な指導者
  arc: 技術の進歩がもたらす光だけでなく、その影に落ちるものへの想像力を獲得していく。
- name: 葛城（かつらぎ）
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない燕尾服に身を包み、片目にモノクルを嵌めている。威圧的な風格を持つ。
  personality: 冷酷で野心的。目的のためには手段を選ばず、情を一切排除した合理主義者。一人称は「私（わたくし）」。
  speech_style: 高圧的で、相手を見下すような、淀みのない理路整然とした話し方。
  background: 巨大な蒸気機関プロジェクトを主導する実業家。怪異の情念をエネルギー資源として利用しようと企んでいる。
  motivation: 怪異の力を利用し、帝都のエネルギー革命を完成させること。
  relationships:
  - name: 櫂
    relation: 自身の野心を体現させるための優秀な道具
  arc: 文明の進歩という大義名分を掲げながらも、その本質がただの強欲であることを露呈させる。
