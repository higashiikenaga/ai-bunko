title: 煤煙の刻、朧月夜に鳴る
genre: 歴史・時代小説
tone: 哀切、耽美、幻想的な伝奇譚
pov: 三人称
tense: 過去形
setting: 明治中期、文明開化の音が響きつつも、古き怪異が影を落とす帝都・東京
premise: 蒸気機関の煙が空を覆い、神仏の座が失われゆく時代。壊れた懐中時計を手に、人ならざる者の未練を鎮める『刻の鎮守』と呼ばれる一族の青年がいた。彼は、機械の音にかき消されそうになる妖怪たちの嘆きを、その時計の針が止まった一瞬に聞き取る。ある冬の夜、雪に紛れて現れた美しき物の怪が、止まった時を動かそうと彼に接触する。
themes:
- 文明開化と旧習の衝突
- 失われゆくものの美学
- 情けと執着
rules:
- 蒸気機関の煤は、妖怪の姿を希薄にするが、同時に彼らの怨念を濃く凝縮させる性質を持つ
- 壊れた懐中時計は、特定の『止まった時間』に宿る妖怪の記憶を呼び起こす依代となる
- 季節の行事（節分や端午の節句など）の夜には、現世と隠世の境界が極端に薄くなる
plot_outline:
- '序盤: 蒸気機関車が街を駆ける喧騒の中、主人公・蓮は壊れた懐中時計を用いて、機械の音に怯える小妖怪たちの成仏を助けている。ある雪の夜、彼は銀色の髪を持つ美しい女の妖怪と出会う。'
- '中盤: 女の妖怪は、かつて蒸気機関の黎明期に人間に裏切られた記憶を持っていた。彼女の存在が、街に大規模な怪異を引き起こしていることが判明する。蓮は彼女の悲しみを知り、単なる退治ではなく、彼女の心に寄り添うことを決意する。'
- '終盤: 文明の象徴である巨大な蒸気機関が、妖怪の情念を燃料として暴走を始める。蓮は懐中時計の針を動かすため、自身の命を削る儀式に挑む。'
- '結末: 騒乱は鎮まるが、女の妖怪は春の訪れと共に消えていく。蓮の手元には、再び時を刻み始めた懐中時計と、雪解けの季節の香りが残される。'
style_notes: 和の語彙を重んじ、情緒的な情景描写に注力すること。例えば「煙」を「煤煙」や「龍の吐息」と表現し、「月」を「朧月」や「銀盤」と呼ぶなど。妖怪を描く際は、単なる怪物としてではなく、季節の移ろいや人情の機微を背負った、美しくも儚い存在として、哀しみと敬意を持って綴ること。
