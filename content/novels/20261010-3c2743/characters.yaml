- name: カイト・レイルズ
  role: 主人公
  age: 28
  gender: 男性
  appearance: 煤けた革ジャンと使い古された作業着。右腕は巨大な蒸気駆動式の義手で、常に蒸気を噴き出している。鋭い眼光を持つが、どこか哀愁を漂わせている。
  personality: 寡黙で現実主義。生き残るためには手段を選ばないが、根底には強い正義感を持つ。一人称は「俺」。
  speech_style: 短く、ぶっきらぼう。必要最低限のことしか喋らない。
  background: 元・装甲列車の整備士。霧の事故で右腕を失い、それ以降は廃駅を渡り歩くスカベンジャー（廃品回収屋）として孤独に生きてきた。
  motivation: 目の前の少女を守り抜き、種を伝説の地へと届けること。
  relationships:
  - name: リナ
    relation: 守るべき対象であり、共に歩む相棒
  arc: 孤独な生存主義者から、世界の変革を信じて命を懸ける開拓者へと変化する。
- name: リナ
  role: 相棒
  age: 12
  gender: 女性
  appearance: 透き通るような白い肌と、霧の中でも輝くような瞳を持つ少女。古い銀のペンダントに桜の種を大切に持っている。
  personality: 純粋で芯が強く、絶望的な世界でも希望を捨てない。一人称は「私」。
  speech_style: 丁寧だが、迷いのない意志を感じさせる話し方。
  background: 霧の向こう側、伝説の『最終列車』の物語を知る一族の生き残り。彼女自身が種を浄化する鍵となる力を持っている。
  motivation: 種を正しい場所に植え、霧のない空の下で花を咲かせること。
  relationships:
  - name: カイト
    relation: 命を預けるほど信頼する守護者
  arc: 守られるだけの子供から、自らの意志で世界に希望を提示する象徴へと成長する。
- name: ヴォルガン将軍
  role: 敵役
  age: 52
  gender: 男性
  appearance: 全身を重厚な黒鉄の甲冑で覆い、背中には巨大な蒸気機関を背負ったような外装を持つ。威圧的な巨躯。
  personality: 冷酷非道で、秩序と規律を絶対視する。弱者を切り捨てることを厭わない。一人称は「余」。
  speech_style: 高圧的で威厳に満ちた、命令口調。
  background: 鉄路皇帝の直属部隊を率いる最高司令官。鉄の秩序こそが人類の生存条件だと信じ、世界の変革を「混乱」として排除しようとする。
  motivation: 種を回収し、鉄の支配体制を永遠のものにすること。
  relationships:
  - name: カイト
    relation: 秩序を乱す排除すべき反逆者
  arc: 鉄の支配という揺るぎない壁として、カイトの前に絶望的な力として立ちふさがる。
- name: ゼノ・クロウ
  role: 脇役
  age: 32
  gender: 男性
  appearance: 軽装の飛行服に身を包み、二丁の蒸気式拳銃を携えている。常に不敵な笑みを浮かべている。
  personality: 享楽的で計算高い賞金稼ぎ。金とスリルを愛するが、義理堅い一面もある。一人称は「俺様」。
  speech_style: 軽快で挑発的。冗談を好む。
  background: 軌道ジャンクションを拠点とするフリーランスの傭兵。偶然カイトたちの旅に巻き込まれ、種を巡る争いに参戦する。
  motivation: 種を巡る混乱を楽しみ、最高の報酬を得ること。
  relationships:
  - name: カイト
    relation: 競い合うライバル
  arc: 打算的な賞金稼ぎから、カイトの生き様に共鳴し、最後の戦いで道を切り開く協力者へと変化する。
