title: 鉄路の果て、桜の地
genre: スチームパンク冒険
tone: 硬派、無骨、速度感
pov: 一人称（俺）
tense: 過去形（一部現在形による強調）
setting: 猛毒の霧が地表を覆い、人類が巨大な装甲列車で移動しながら生き延びる世界
premise: 錆びついた世界で、俺は一粒の種を運ぶ。目的地は伝説の『最終列車』が待つ最果ての駅。追手は止まらない。蒸気を吐き、鉄を砕き、俺は絶望の果てに桜を咲かせる。
themes:
- 再生
- 不器用な絆
rules:
- 動力源は高圧蒸気コアのみ。コアの喪失は死を意味する
- 地表の霧は強酸性であり、特殊な防護服なしでは数分で皮膚が溶ける
- 最終列車は一定期間に一度だけ現れ、選ばれた者だけを浄化された地上の楽園へ運ぶ
plot_outline:
- 序盤：廃駅で潜伏していた俺が、桜の種を持つ少女と出会う。追っ手の装甲列車を蒸気義手で叩き潰し、彼女を連れて逃走を開始する。
- 中盤：複数の軌道ジャンクションを巡る旅。ライバル傭兵や列車略奪者との死闘を経て、種が地上の霧を晴らす唯一の鍵であることを知る。
- 終盤：最終列車の発車時刻が迫る中、世界を支配する鉄路皇帝の軍勢が立ちはだかる。絶望的な物量差の中、俺は全蒸気を解放し、肉体を限界まで酷使して道を切り開く。
- 結末：最終列車に乗り込み、霧の晴れた地表へ到達。そこで少女と共に、世界で最初の桜を植え、鉄の時代の終わりを見届ける。
style_notes: 短文で畳み掛ける。擬音（ドカン、ガガーン等）を一切排除し、『砕く』『裂く』『叩き潰す』などの動詞で衝撃を表現する。戦闘直前には必ず静寂の描写を挿入し、緊張感を高める。一人称は『俺』。無骨な男の視点から、情を排したようでいて仲間を想う内面を描く。
