- name: 蓮 司（れん つかさ）
  role: 主人公
  age: 68
  gender: 男性
  appearance: 白髪混じりの短髪、深い皺が刻まれた穏やかな目元。常に使い古された、機能性のみを重視したグレーの作業服を着ている。
  personality: 内向的で思慮深い。感情を抑制するデバイスを使いこなしているが、心の奥底に熱い情熱を秘めている。一人称は「私」。
  speech_style: 丁寧で落ち着いた物腰。無駄な言葉を削ぎ落とした、静かな口調。
  background: 都市の気候制御システムの構築に携わった元主任エンジニア。妻の死後、管理された完璧な日常に虚無感を感じている。
  motivation: 制御不能な風が吹く『約束の丘』で、亡き妻の声を聴き、失われた感情を取り戻すこと。
  relationships:
  - name: 美咲
    relation: 亡き妻
  - name: カイ
    relation: 旅の協力者
  arc: 完璧な管理社会の受容から、不完全で予測不能な「生」の肯定へと変化する。
- name: カイ
  role: 相棒
  age: 22
  gender: 女性
  appearance: ネオンカラーの髪の一部が入ったショートヘア。動きやすいオーバーサイズのジャケットを羽織り、常に小型の修理キットを携帯している。
  personality: 好奇心旺盛で型破り。効率よりも「面白さ」を優先する。一人称は「アタシ」。
  speech_style: 語尾が跳ねるような、活発で少しぶっきらぼうな話し方。
  background: 都市の物流網の影で、古い機材を修理して生計を立てる非公式のメカニック。管理区域の外側に興味を持っている。
  motivation: 蓮の依頼を受け、古い型式の『空飛ぶ船』を操縦して目的地へ送り届けること。そして、自分自身の閉塞感から脱出すること。
  relationships:
  - name: 蓮 司
    relation: 依頼主であり、尊敬する技術者
  arc: 効率一辺倒な若者から、数値化できない「記憶」や「思い出」の価値を理解する存在へ。
- name: エリカ
  role: 敵役（対立者）
  age: 45
  gender: 女性
  appearance: 隙のない完璧な身なり。白を基調とした、汚れ一つない管理局の制服を着用している。冷徹な印象を与える。
  personality: 合理的で規律を重んじる。個人の感情は社会の安定を乱すノイズであると考えている。一人称は「私」。
  speech_style: 感情の起伏が全くない、機械的な敬語。論理的で有無を言わせぬ口調。
  background: 都市環境管理局の治安維持部門の責任者。最適化された気候と社会秩序を守ることを至上命題としている。
  motivation: 管理区域への不法侵入を阻止し、社会の安定を脅かす『不確定要素（未整備の自然や古い記憶）』を排除すること。
  relationships:
  - name: 蓮 司
    relation: 秩序を乱す監視対象
  arc: 完璧な管理がもたらす「静かなる死」を象徴する存在として、蓮の旅の障壁となる。
