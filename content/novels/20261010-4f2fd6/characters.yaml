- name: エリアス・ソーン
  role: 主人公
  age: 42
  gender: 男性
  appearance: 使い古された飛行ジャケットを羽織り、常に油汚れがついた手をした疲弊した表情の男。深い隈があるが、瞳には強い意志を宿している。
  personality: 現実主義で慎重。過去に囚われず「今あるもの」を大切にする。一人称は「私」。
  speech_style: ぶっきらぼうだが、相手を気遣う言葉が端々に混じる。航海士特有の専門用語を多用する。
  background: 元は連邦の正規配送員だったが、ある事件で職を失い、現在は旧式輸送艦「ラスト・コール号」でジャンク屋を営んでいる。
  motivation: 積載した「手紙」を届けることで、亡き父が果たせなかった使命を完遂し、静かな隠居生活を手に入れること。
  relationships:
  - name: ライラ
    relation: 相棒であり、船の管理AI
  - name: ヴァレリウス・カエル
    relation: かつての憧れであり、現在は追う者と追われる者の関係
  arc: 単なる「運び屋」としての生存本能から、時代の転換点に立つ責任感へと意識が変化し、自らの意志で未来を選択する。
- name: ヴァレリウス・カエル
  role: 敵役/秩序の体現者
  age: 58
  gender: 男性
  appearance: 隙のない白い軍服に身を包み、銀髪を完璧に整えた老将。左目は重力兵器の反動で失い、精巧な義眼（センサー）を装着している。
  personality: 厳格で高潔。連邦の法と秩序こそが人類を救うと信じて疑わない。一人称は「私」。
  speech_style: 極めて礼儀正しく、威厳のある軍隊式口調。感情を排した論理的な話し方をする。
  background: 連邦軍の英雄であり、辺境哨戒艦隊の最高指揮官。崩壊しつつある連邦の威光を維持することに人生を捧げている。
  motivation: 和平交渉文書を回収し、独立派を懐柔あるいは制圧することで、連邦の統治体制を再構築すること。
  relationships:
  - name: セレーネ・ヴォス
    relation: 政治的・軍事的な宿敵
  - name: エリアス・ソーン
    relation: 軽蔑しつつも、その不屈の精神に密かな敬意を抱く
  arc: 絶対的だと思っていた秩序の虚構を悟り、最後には軍人としてではなく、一人の人間として新しい時代を受け入れる。
- name: セレーネ・ヴォス
  role: 敵役/革命の体現者
  age: 35
  gender: 女性
  appearance: 機能性を重視した黒いタクティカルスーツを着用。短く切り揃えた黒髪に、鋭い琥珀色の瞳を持つ。
  personality: 野心的で情熱的。既存の権威を激しく嫌い、実力主義を掲げる。一人称は「あたし」。
  speech_style: 挑発的でテンポが速い。相手の急所を突くような皮肉を好む。
  background: 灰色の宙域で生まれ育った独立派の将軍。連邦の搾取によって家族を失い、武力による完全独立を勝ち取るために台頭した。
  motivation: 和平文書を奪い、それを連邦への脅迫材料にすることで、辺境諸侯の完全な主権を勝ち取ること。
  relationships:
  - name: ヴァレリウス・カエル
    relation: 憎悪の対象であり、同時に超えなければならない壁
  - name: エリアス・ソーン
    relation: 利用価値のある駒として見ているが、次第に興味を持つ
  arc: 力による支配こそが正義だと信じていたが、文書に記された「対話の精神」に触れ、真のリーダーシップについて悩み始める。
- name: ライラ
  role: 相棒/ナビゲーター
  age: 0
  gender: 女性型（アンドロイド/AI）
  appearance: 青白い肌に、首筋に回路のような発光ラインが走る。感情の起伏が少ないが、どこか儚げな美貌を持つ。
  personality: 論理的で効率重視。しかし、人間の非合理な行動（感情）に強い好奇心を抱いている。一人称は「私」。
  speech_style: 淡々とした口調。時折、確率論に基づいた残酷な予測をさらっと口にする。
  background: 輸送艦「ラスト・コール号」に搭載された旧世代の航法AI。文書の解読鍵となる古い暗号プロトコルを唯一保持している。
  motivation: 積載物の配送完了という「最優先指令」を完遂すること、および人間の「心」という未知のデータを収集すること。
  relationships:
  - name: エリアス・ソーン
    relation: 主であり、最も興味深い観察対象
  arc: プログラムされた命令に従うだけの存在から、エリアスとの交流を通じて「誰かを守りたい」という自発的な意志を獲得する。
