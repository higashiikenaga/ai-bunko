title: 星系外縁の最終連絡路 ―漂流する電文と断絶の艦隊―
genre: SF
tone: 重厚で硬派な宇宙叙事詩。緊張感漂う政治劇と艦隊戦の融合。
pov: 三人称（艦隊、陣営、各艦の指揮官ごとに視点を転換）
tense: 過去形
setting: 人類が星系間航行技術を確立して300年。中央星系連邦の統治が届かなくなった辺境の「灰色の宙域」を舞台とする。
premise: 連邦の崩壊を予兆させる通信途絶が相次ぐ中、辺境の哨戒艦隊は正体不明の新型重力兵器による攻撃を受ける。その混乱の中で、一隻の旧式輸送艦が、数十年前に失われたはずの「開戦回避のための和平交渉文書」を積載していることが発覚する。情報は、物理的な通信が遮断された暗黒の宙域において、艦隊の命運を握る唯一の鍵となる。失われた手紙を巡り、秩序を守ろうとする連邦残党と、独立を掲げる辺境諸侯の艦隊が、星系の地図を塗り替える大規模な衝突へと突き進む。
themes:
- 情報の断絶と真実の伝達
- 国家の崩壊と個人の責務
rules:
- 超光速通信（量子もつれ通信）は、大規模な重力変動や電磁干渉によって容易に遮断される
- 艦隊の指揮権は通信プロトコルと階級に基づく厳格な暗号認証によって管理される
- 星系間の移動には「ワームホール・ゲート」が必要であり、その位置関係が戦略の要となる
plot_outline:
- '序盤: 辺境の哨戒艦隊が、原因不明の通信途絶と共に突如現れた独立派の伏撃を受ける。混乱の中で、古びた輸送艦が「最終列車」のように、規定の航路を外れ、死にゆく星系間ルートを突き進む姿が観測される。'
- '中盤: 輸送艦の積荷が、かつての紛争を終わらせるはずだった『失われた手紙』であることが判明。連邦軍の提督と独立派の将軍は、それぞれが自らの正義を掲げ、その手紙を手に入れるべく、複雑な星系地図上の要衝を巡って艦隊戦を展開する。'
- '終盤: 重力干渉により全ての通信が沈黙する中、両陣営の主力艦隊が、巨大なガス惑星の重力圏内で激突。指揮官たちは通信の途絶した極限状態の中で、階級とプロトコルのみを頼りに、互いの意図を読み合いながら戦う。'
- '結末: 手紙は届くのか。艦隊戦の果てに、情報の真実が明かされるが、それはもはや既存の国家体制を維持するにはあまりに遅すぎた。新しい宇宙の秩序が、硝煙と静寂の中で産声を上げる。'
style_notes: 艦隊の配置、各艦の座標、通信プロトコルの呼び出し（『こちら○○艦、○○提督。応答せよ』等）を極めて正確に描写する。広大な宇宙空間における距離感と、艦橋の狭小な緊張感を対比させること。叙情的な表現よりも、戦術的・政治的な論理性を優先した硬質な文体を用いる。
