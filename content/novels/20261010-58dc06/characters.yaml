- name: 日向 凪（ひなた なぎ）／愛称：ねこ
  role: 主人公
  age: 26
  gender: 女性
  appearance: 少し癖のある茶髪を後ろで緩く結んでいる。常に使い込まれたリネンのエプロンを着用。穏やかで、すべてを見透かすような優しい瞳をしている。
  personality: 穏やかで聞き上手。物静かだが、持ち主のいない品々に寄り添う芯の強さを持つ。一人称は「私」。
  speech_style: 丁寧で落ち着いた、ゆったりとした話し方。相手を否定しない言葉選びをする。
  background: 亡くなった祖父が営んでいた古道具店『ひだまり堂』を継いだ。機械の修理よりも、その物にまつわる記憶を辿ることに長けている。
  motivation: 持ち主不明の品々に宿る「物語」を大切に守り、必要とする人の元へ戻すこと。
  relationships:
  - name: 佐藤 奏太
    relation: アルバイト兼、年の離れた弟のような友人
  - name: 風間 銀次郎
    relation: 懐中時計の持ち主であり、物語のきっかけを与える客
  arc: 単に「物を直す」こと以上に、人の「止まった時間」を動かすことの重要性に気づき、町の歴史を受け継ぐ覚悟を決める。
- name: 佐藤 奏太（さとう そうた）／愛称：ぽてと
  role: 相棒
  age: 21
  gender: 男性
  appearance: 短髪で快活な印象。動きやすいカジュアルな服装。少し大きめのリュックを常に背負っている。
  personality: 明るく行動的。論理的で現実主義的な側面もあるが、困っている人を放っておけないお節介焼き。一人称は「僕」。
  speech_style: ハキハキとしていて、少し語尾が跳ねるような若々しい話し方。
  background: 近隣の大学に通う大学生。夏休みを利用して『ひだまり堂』でアルバイトをしている。古いものが苦手だったが、凪の影響で興味を持ち始めている。
  motivation: 凪の仕事を手伝いながら、この町での夏休みを特別なものにすること。
  relationships:
  - name: 日向 凪
    relation: 雇い主であり、尊敬する師のような存在
  arc: 効率や便利さだけでは測れない「思い出の価値」を理解し、目に見えない優しさに気づけるようになる。
- name: 風間 銀次郎（かざま ぎんじろう）
  role: 鍵を握る人物
  age: 75
  gender: 男性
  appearance: 深い皺が刻まれた、慈愛に満ちた顔立ち。使い込まれた古いスーツを端正に着こなしている。常に大切そうに懐中時計を手にしている。
  personality: 威厳があるが、どこか懐かしげで寂しげな雰囲気を持つ。非常に礼儀正しい。一人称は「私」。
  speech_style: ゆっくりとした、情緒を感じさせる丁寧な話し方。時折、遠い記憶を辿るような間を置く。
  background: かつて町で小さな商店を営んでいた元店主。数十年前に交わした「ある約束」を胸に、ずっと時計の針が動く時を待っていた。
  motivation: 止まったままの懐中時計を修理し、止まったままの自分の心に区切りをつけること。
  relationships:
  - name: 日向 凪
    relation: 修理を依頼する大切な依頼人
  arc: 過去の未練や恩返しへの思いを、凪たちの助けを借りて昇華させ、穏やかな笑顔で未来へ踏み出す。
- name: 潮見 静（しおみ しずく）
  role: 脇役（町の語り部）
  age: 68
  gender: 女性
  appearance: 粋な浴衣や着物を着こなす、凛とした佇まいの女性。常に扇子を携えている。
  personality: 知性的で少しミステリアス。町のことなら何でも知っている、町の生き字引のような存在。一人称は「私」。
  speech_style: 上品で、どこか物語を語るような、リズムのある話し方。
  background: 地元の神社に縁があり、町の祭りの伝統を守り続けている。凪が町の謎を解く際の重要なヒントをくれる。
  motivation: 町に伝わる小さな物語や優しさが、新しい世代に忘れ去られないようにすること。
  relationships:
  - name: 日向 凪
    relation: 町の歴史を託せる相手として、相談に乗る関係
  arc: 自分の守ってきた伝統や記憶が、凪たちの手によって正しく受け継がれていく様子を見届け、安心を得る。
