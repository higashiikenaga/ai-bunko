- name: 瀬戸 陽菜
  role: 主人公
  age: 17
  gender: 女性
  appearance: 長い黒髪を低めの位置で結んでいる。色白で儚げな印象だが、どこか拒絶的な冷たさを纏った瞳をしている。
  personality: 感情の起伏が乏しく、周囲から「氷の少女」と思われている。孤独に慣れきっているが、心の奥底では激しい渇きを感じている。一人称は「私」。
  speech_style: 抑揚の少ない淡々とした口調。言葉数が少なく、結論だけを述べる傾向がある。
  background: 幼少期の家庭環境により、感情を表に出すことを封印してきた。現在は海辺の静かな街で、誰にも期待せず、誰からも期待されない生活を送っている。
  motivation: 透真が提示した「オアシス」に惹かれ、自分の中に欠落している「感情」という正体を探りたい。
  relationships:
  - name: 佐倉 透真
    relation: 運命を変えてくれた少年であり、初めて心を許した相手
  - name: 佐伯 澪
    relation: 唯一、彼女の沈黙を許容してくれる幼馴染
  arc: 感情の欠落による孤独から脱し、喪失という最大の痛みを経て、他者を愛し、自らも生きようとする意志を持つまで成長する。
- name: 佐倉 透真
  role: 相棒
  age: 17
  gender: 男性
  appearance: 病身のため痩せぎみで肌は青白いが、瞳だけは強い光を宿している。常に薄いカーディガンを羽織っている。
  personality: 達観しており、茶目っ気がある。死を目前にしながらも、世界への好奇心に溢れ、他者の心の機微に敏感。一人称は「僕」。
  speech_style: 穏やかでリズム感のある話し方。比喩表現を好んで使い、相手を導くような口調。
  background: 不治の病を患い、人生の残り時間が少ないことを悟っている。入院と退院を繰り返しながら、街の誰も気づかない美しい景色を記録することに情熱を注いできた。
  motivation: 自分が消えた後も、陽菜の心の中に「色」と「熱」を遺し、彼女を孤独から救い出したい。
  relationships:
  - name: 瀬戸 陽菜
    relation: 自分の人生の最後に、最も深く心を共有したいと願った少女
  arc: 死への恐怖や諦めを超え、誰かの記憶に刻まれることで「永遠」を得ることを選び、静かに人生を完結させる。
- name: 佐伯 澪
  role: 脇役
  age: 17
  gender: 女性
  appearance: ショートボブに快活な笑顔。カラフルなヘアピンやアクセサリーを身に着けており、陽菜とは対照的な色彩感を持つ。
  personality: 明るく社交的で、クラスのムードメーカー。直感的で共感能力が高く、陽菜の隠れた寂しさを誰よりも理解している。一人称は「私」。
  speech_style: 早口でエネルギッシュ。若者らしい崩した口調で、陽菜を強引に巻き込むことがある。
  background: 陽菜の幼馴染。陽菜が感情を閉ざす前から彼女を知っており、変わらずに隣に居続けることを決めている。
  motivation: 陽菜が心から笑える日が来ることを願い、彼女の人間関係の橋渡し役になろうとする。
  relationships:
  - name: 瀬戸 陽菜
    relation: 親友。彼女の孤独を埋めたいと願う理解者
  - name: 佐倉 透真
    relation: 陽菜に変化をもたらした彼に対し、感謝と切なさを抱く友人
  arc: 陽菜を支える側から、彼女が自立して歩き出す姿を見守る側へと変化し、友情の形を深化させる。
- name: 木島 先生
  role: 脇役
  age: 52
  gender: 男性
  appearance: 銀縁の眼鏡をかけ、常に古い本の匂いをさせている。穏やかな目尻のシワが特徴的な司書教師。
  personality: 静謐で思慮深く、生徒たちの悩みに対して答えを出すのではなく、考えるヒントを与えるタイプ。一人称は「私」。
  speech_style: ゆっくりとした丁寧な口調。哲学的な言い回しをすることが多い。
  background: 図書室を「避難所」として開放しており、透真が陽菜を誘ったきっかけとなる場所を提供していた。
  motivation: 若者たちが葛藤し、成長する過程を静かに見守り、必要な時にだけそっと背中を押したい。
  relationships:
  - name: 佐倉 透真
    relation: 彼の孤独な戦いと、遺したい想いを密かに共有していた理解者
  - name: 瀬戸 陽菜
    relation: 彼女の心の氷が溶けるのを静かに待っていた教師
  arc: 大きな変化はないが、物語の重要な局面で透真の遺したメッセージを陽菜に繋ぐ、静かな導き手として機能する。
