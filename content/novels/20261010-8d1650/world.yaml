title: 砂の海に、一滴の祈りを
genre: 青春恋愛
tone: 静謐で切なく、それでいて淡い光を感じさせる
pov: 三人称近接視点
tense: 過去形
setting: 現代、海辺の静かな地方都市
premise: 感情の欠落を抱え、乾いた砂漠の中にいるような孤独を感じる女子高生・陽菜は、不治の病を抱えながらも鮮烈に生きる少年・透真と出会う。透真は、自分がこの世を去る前に、陽菜に「街の隠れたオアシス」を教えるという約束を交わす。それは、彼が死後に遺す、言葉にならない「遺言」の旅でもあった。
themes:
- 生と死の境界
- 心の渇きと癒え
rules:
- 透真の病状は不可逆的な進行を辿る
- 物語の核心となる感情は、直接的な言葉を避け、情景描写を通じて示唆する
plot_outline:
- '序盤: 感情が枯れ果てたような日々を送る陽菜が、図書室で死を目前にしながらも瞳に光を宿す透真と出会い、彼から「街のオアシス巡り」を提案される。'
- '中盤: 透真が案内する、誰も知らない美しい場所を巡る中で、陽菜は自分の中にあった渇きと、彼への淡い恋心を自覚していく。しかし、透真の身体は刻一刻と衰えていく。'
- '終盤: 透真が急逝する。彼が残したのは、一通の手紙と、陽菜にだけわかる「最後の場所」を示す地図。それが彼の、静かな遺言だった。'
- '結末: 透真が遺した最後の場所で、陽菜は彼が世界に遺した小さな愛の痕跡を見つける。喪失の痛みを受け入れながらも、陽菜は再び歩き出すための微かな熱を胸に抱く。'
style_notes: 感情の奔流を抑え、静かな水面のような筆致を維持すること。読者に感情を強要せず、風景や温度の変化、光の粒子といった細部を描くことで、キャラクターの心の機微を伝える。最後に、救いとしての「小さな希望」を必ず残す。
