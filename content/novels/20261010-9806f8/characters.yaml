- name: 夏目 汐里
  role: 主人公
  age: 17
  gender: 女性
  appearance: 儚げで透明感のある雰囲気。少し長めの黒髪と、どこか遠くを見つめるような静かな瞳が特徴。
  personality: 内向的で思索的。賑やかな街の喧騒に馴染めず、静寂を好む。一人称は「わたし」。
  speech_style: 丁寧で落ち着いており、言葉を選んで話す。
  background: 港湾都市の寂れた高台にある高校に通う二年生。放課後は図書室の隅が定位置。
  motivation: 日常の空虚さを埋める、何か決定的な「繋がり」を求めている。
  relationships:
  - name: 櫂
    relation: 運命的な出会いをする少年
  arc: 孤独を避けていた少女が、大切な存在との別れと記憶の重みを知り、喪失を受け入れながらも前を向くようになる。
- name: 篝 櫂
  role: 相棒
  age: 17
  gender: 男性
  appearance: 月光のように白く透き通るような肌。夜の闇に溶け込みそうな、深く静かな瞳。
  personality: 冷静でどこか浮世離れしている。感情を表に出さないが、深い孤独を抱えている。一人称は「僕」。
  speech_style: 静かでリズムが一定。少し古風で詩的な響きがある。
  background: 月食の夜にのみ現れる、人々の忘れ去られた記憶の集合体（残滓）。
  motivation: 欠けていく月の影に、失われゆく記憶を繋ぎ止めること。
  relationships:
  - name: 夏目 汐里
    relation: 自分を「個」として認識した唯一の人間
  arc: 役割として記憶を集めるだけの存在から、一人の人間として「誰かに記憶されたい」という願いを持つようになる。
- name: 星野 瑞希
  role: 脇役
  age: 17
  gender: 女性
  appearance: 活動的で明るい印象。日焼けした肌と、快活なショートヘア。
  personality: 明るく社交的で、クラスのムードメーカー。直感に優れている。一人称は「あたし」。
  speech_style: はきはきとしていて、現代的な話し方。
  background: 汐里の幼馴染。汐里が図書室に閉じこもることを心配している。
  motivation: 汐里を現実の世界、つまり「今」の生活へと引き戻したい。
  relationships:
  - name: 夏目 汐里
    relation: 親友
  arc: 汐里の不可解な変化に戸惑いながらも、彼女が抱える「目に見えない大切なもの」を尊重するようになる。
