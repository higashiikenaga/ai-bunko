title: 藍色の欠けゆく夜に
genre: 青春恋愛
tone: 静謐、哀切、透明感
pov: 一人称（わたし）
tense: 過去形
setting: 現代、港湾都市の寂れた高台にある高校
premise: 眠らない街の灯りが、波の音に溶ける場所。わたしは、放課後の図書室で、月食の夜にだけ現れるという奇妙な少年と出会う。彼は、欠けていく月の影に、誰かの記憶を閉じ込める力を持っていた。静かな夜の淵で、二人の境界線がゆっくりと滲んでいく。
themes:
- 不在の証明
- 時間の不確かさ
rules:
- 月食の最中に、影の領域へ一時的に干渉できる
- 記憶を閉じ込めるには、その対象への深い情愛が必要である
plot_outline:
- '序盤: 夏の終わり。湿った夜風が吹く中、わたしは図書室の隅で、月食の予報を見つめる少年・櫂に出会う。'
- '中盤: 櫂が月の影を使って、人々の忘れ去られた大切な記憶を拾い集めていることを知る。二人は夜の街を彷徨い、光と影の境界線で言葉を交わす。'
- '終盤: 月食が始まる。櫂の存在そのものが、月の周期と連動した「記憶の残滓」であることが明らかになる。完全な食が進む中、わたしは彼を失う恐怖と向き合う。'
- '結末: 月が再び光を取り戻したとき、櫂の姿は消えていた。しかし、手元に残ったのは、彼と過ごした夜の湿り気と、消えない淡い光の記憶だけだった。'
style_notes: 短い一文を積み重ね、余白を恐れない。季節の移ろいや、月の光、夜の闇の色を丁寧に描く。感情を直接的な言葉で語らず、雨の匂いや、影の揺らぎに託して表現する。感嘆符は使わず、静かな独白のように綴る。
