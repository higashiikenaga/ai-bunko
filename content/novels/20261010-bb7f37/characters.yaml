- name: ジュリアン・ソーン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で青白い肌。使い古されたベルベットのコートを纏い、指先は常に震えている。落ちぶれた貴族のような佇まい。
  personality: 完璧主義で厭世的。過去の栄光に執着しながらも、現在は自己嫌悪に陥っている。一人称は「私」。
  speech_style: 丁寧だが、どこか突き放したような冷ややかな口調。皮肉屋。
  background: かつて神童と呼ばれた演奏家だったが、師匠の死と同時にスランプに陥り、音楽への情熱を失った。路地裏で日雇いの仕事をして食いつないでいる。
  motivation: 亡き師が遺した「音のない遺言」を完成させ、失った自らの音楽的アイデンティティを取り戻すこと。
  relationships:
  - name: クララ・ギアハート
    relation: 互いの専門分野（芸術と技術）に反発しつつも、次第に信頼を寄せるパートナー
  - name: アラリック・ヴェイン
    relation: 失ったものを共有する、静かな共鳴者
  arc: 絶望的な孤独の中で、他者と音を重ねる喜びを思い出し、不完全な自分を受け入れて調和へと向かう。
- name: クララ・ギアハート
  role: 主人公
  age: 16
  gender: 女性
  appearance: 頬に常にオイルの汚れがついている。大きなゴーグルを額にかけ、つなぎの作業服を着た小柄な少女。
  personality: 好奇心旺盛で猪突猛進。機械に対する深い愛情を持つ。一人称は「あたし」。
  speech_style: 早口で活気がある。専門用語を混ぜて喋る癖がある。
  background: 都市の最下層にある整備工場で育った孤児。独学で蒸気機関を学び、機械が発する「音」で不調を察知できる特殊な聴覚を持つ。
  motivation: 都市の心臓部の不協和音を解消し、崩壊の危機から自分の居場所であるアルカディア・ノクターンを救うこと。
  relationships:
  - name: ジュリアン・ソーン
    relation: 気難しい彼を気にかけ、音楽の美しさを再認識させてくれる導き手
  - name: アラリック・ヴェイン
    relation: 口下手な彼を気にかけ、世話を焼く妹のような関係
  arc: 単なる「修理」ではなく、心に響く「創造」という概念に触れ、技術者として精神的な成長を遂げる。
- name: アラリック・ヴェイン
  role: 主人公
  age: 30
  gender: 男性
  appearance: 重厚な銀色の甲冑に身を包み、顔には古い傷跡がある。鋭い眼光を持つが、表情は滅多に動かない。
  personality: 寡黙で忠実。自己犠牲的な精神を持つ。一人称は「俺」。
  speech_style: 極めて短文。多くは頷きや視線で意思疎通を行い、重要な時だけ低い声で話す。
  background: 元・都市守護騎士団の精鋭。過去の作戦中に心臓部の暴走に巻き込まれ、聴覚と声を一部失った。現在は音のない世界で静かに生きている。
  motivation: 失われた「音」の正体を知り、自らの過去に区切りをつけること。そして、守るべき人々を再び守ること。
  relationships:
  - name: ジュリアン・ソーン
    relation: 言葉を介さずとも、喪失感を分かち合える理解者
  - name: クララ・ギアハート
    relation: 彼女の純粋なエネルギーに救われ、再び剣を振るう意志を持つ
  arc: 静寂という絶望の中にいたが、仲間との合奏を通じて「音のない音」という新たな希望を見出す。
