title: 鋼鉄のパッセージ ―響き合う歯車と亡き調べの再会―
genre: 群像劇
tone: 叙情的でリズム感があり、蒸気と調べが混じり合う幻想的な雰囲気
pov: 三人称
tense: 過去形
setting: 蒸気機関が文明の鼓動を担う、巨大な浮遊島都市「アルカディア・ノクターン」
premise: 空に浮かぶ都市の心臓は、巨大な蒸気機関と、それを制御する「旋律の歯車」によって動いている。かつて伝説の音楽家が遺した「音のない遺言」が、都市の崩壊を予兆する不協和音となって響き始めた。落ちぶれた演奏家、蒸気技師の少女、そして音を失った騎士。異なる場所で生きる者たちが、運命の旋律に導かれ、一つの真実へと集い始める。
themes:
- 継承される意志
- 調和と不協和音
- 失われた音の再生
rules:
- 旋律を奏でることで蒸気機関の出力を制御できる（音楽魔法）
- 音の強弱やリズムが、機械の駆動精度に直接影響を与える
- 特定の音階を組み合わせることで、物理的な衝撃波や熱を生み出せる
plot_outline:
- '序盤: 都市の心臓部で発生した不審な振動。没落した楽師の青年が、亡き師の遺言が記された楽譜を見つける。'
- '中盤: 蒸気技師の少女が、機械の不協和音の中に隠された「旋律の欠落」に気づく。各々の視点を持つ登場人物たちが、偶然にも同じ『未完成の楽曲』へと辿り着く。'
- '終盤: 遺言の正体が、都市を再起動するための究極の旋律であることが判明。崩壊の危機に瀕した都市で、全員による合奏が始まる。'
- '結末: 奏でられた調べが蒸気を黄金色に染め上げ、都市は新たなリズムを刻み始める。失われた音は、人々の記憶の中に永遠の余韻として残る。'
style_notes: 文章は常に音楽のリズムを意識し、短文と長文を織り交ぜて拍動を表現すること。各章の冒頭や転換点には、その場面の情動を象徴する『詩（歌詞）』を必ず挿入する。蒸気の噴出や歯車の回転を、打楽器的な擬音や韻を用いてリズミカルに描写せよ。
