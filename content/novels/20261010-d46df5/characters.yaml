- name: 湊 奏太
  role: 主人公
  age: 24
  gender: 男性
  appearance: 青白く儚げな顔立ち。痩身で、常に淡い色のオーバーコートを羽織っている。視線がどこか遠くを彷徨う癖がある。
  personality: 内向的で繊細。喪失感に囚われており、他者との接触を避けている。一人称は「僕」。
  speech_style: 控えめで、言葉数を少なく切り上げる。相手の反応を伺うような、ためらいがちな話し方。
  background: かつては将来を嘱望されたピアニストだったが、ある事故をきっかけに「音楽的な意味での音」を失い、絶望して海辺の町へ移住した。
  motivation: 静寂の中でただ時間をやり過ごすこと。しかし、心の奥底ではもう一度世界と繋がりたいと願っている。
  relationships:
  - name: 凪沙 栞
    relation: 雨の日にだけ心を通わせる理解者
  - name: 瀬戸 鏡介
    relation: 居場所を貸してくれる不思議な店主
  arc: 沈黙を「欠落」ではなく「新しい響き」として受け入れ、言葉にならない想いを伝える勇気を持つ。
- name: 凪沙 栞
  role: ヒロイン
  age: 26
  gender: 女性
  appearance: 清潔感のあるまとめ髪に、深い紺色のエプロンを着用。静かながらも芯の強さを感じさせる澄んだ瞳をしている。
  personality: 穏やかで忍耐強い。他人の感情に寄り添うことができるが、自身の内面はあまり明かさない。一人称は「私」。
  speech_style: 丁寧で落ち着いた口調。比喩表現を多く用い、相手の心に静かに染み込むような話し方。
  background: 古文書や古い手紙の修復・整理を専門とする専門職。喫茶店『水音』で、持ち主不明の手紙を整理する仕事に携わっている。
  motivation: 断片となった手紙の言葉を繋ぎ合わせ、本来届くべき場所や意味へと導くこと。
  relationships:
  - name: 湊 奏太
    relation: 静寂を共有する特別な存在
  - name: 瀬戸 鏡介
    relation: 雇い主であり、人生の先達
  arc: 他人の想いを繋ぐだけの役割から脱却し、自分自身の感情を誰かに伝えるという能動的な行動へ踏み出す。
- name: 瀬戸 鏡介
  role: 脇役/導き手
  age: 58
  gender: 男性
  appearance: 白髪混じりの短髪に眼鏡。古風なベストを着用し、常にコーヒーと古紙の香りを纏っている。
  personality: 飄々としていて掴みどころがないが、深い洞察力を持つ。慈愛に満ちた皮肉屋。一人称は「私」。
  speech_style: 余裕のある、年長者特有のゆったりとした口調。時折、核心を突く問いかけを投げかける。
  background: 雨の日だけ開店する喫茶店『水音』の店主。この町の歴史と、そこに集まる人々の記憶を熟知している。
  motivation: 訪れる人々が自らの傷と向き合い、納得して次の季節へ進めるよう、適切な距離感でサポートすること。
  relationships:
  - name: 湊 奏太
    relation: 見守るべき迷い子
  - name: 凪沙 栞
    relation: 信頼する仕事のパートナー
  arc: 物語の停滞した空気を動かす触媒として機能し、二人が自立して結ばれるための環境を整える。
- name: 浅井 結衣
  role: 物語の鍵を握る人物（回想・手紙の中）
  age: 22
  gender: 女性
  appearance: ひまわりのような明るい笑顔。楽譜を抱え、活動的に動き回る姿が写真や記憶の中に残っている。
  personality: 情熱的で真っ直ぐ。周囲を巻き込む明るさと、音楽に対する純粋な執着を持っていた。
  speech_style: 快活でストレート。相手を鼓舞するような力強い言葉選び。
  background: 湊の元音楽パートナーであり、深い信頼関係にあった。事故の際、湊に多大な影響を与え、その後姿を消した（あるいは他界した）。
  motivation: （手紙を通じて）湊に、音のない世界でも奏でられる音楽があることを伝えたい。
  relationships:
  - name: 湊 奏太
    relation: かつての共演者であり、魂の片割れ
  - name: 凪沙 栞
    relation: 手紙を通じて想いを託した相手
  arc: 手紙という断片的な形で現れ、湊が過去の呪縛を解き、未来へ進むための精神的な導線となる。
