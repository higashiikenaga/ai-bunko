- name: エライアス・ヴォーン
  role: 主人公
  age: 42
  gender: 男性
  appearance: 痩身で鋭い眼差しを持つ。記憶監査官の制服である灰色のロングコートを纏い、右のこめかみに記憶同期用の神経インターフェースを埋め込んでいる。
  personality: 潔癖で論理的。真実への執着が強く、感情を排して事象を分析しようとする。一人称は「私」。
  speech_style: 丁寧だが冷徹。断定的な口調で、相手の論理的破綻を指摘する傾向がある。
  background: 銀河記憶管理局の精鋭監査官。数々の記憶詐欺事件を解決してきたが、ある時、自身の過去の一部が不自然に書き換えられている可能性に気づき、真相を追い求めている。
  motivation: 市場に流通する『未来の観測データ』の出所を突き止め、因果律の崩壊を阻止すること。
  relationships:
  - name: カエリス
    relation: 不本意ながら協力関係にある情報屋
  - name: ヴァレリウス
    relation: 思想的に対立する宿敵
  arc: 厳格な法と論理の信奉者から、個人の記憶という儚い価値を認め、宇宙全体の調和のために自己を犠牲にする覚悟を持つ人物へと変化する。
- name: カエリス
  role: 相棒
  age: 26
  gender: 女性
  appearance: 継ぎ接ぎのサイバーウェアを身に着けた小柄な女性。データ転送速度を上げるため、指先が多機能プラグに改造されている。
  personality: 快楽主義的で機転が利く。生存本能が強く、打算的に動くが根は情に厚い。一人称は「あたし」。
  speech_style: 砕けた口調。市場の専門用語やスラングを多用し、早口で喋る。
  background: レヴィアタン外縁の居住区で活動する記憶の密売人（メモリー・スカベンジャー）。親が売ってしまった「幼少期の記憶」を買い戻すために金を稼いでいる。
  motivation: エライアスを利用して高額な記憶データを手に入れ、失われた家族の記憶を完結させること。
  relationships:
  - name: エライアス・ヴォーン
    relation: 利用対象から、唯一信頼できる友人へ
  arc: 物質的な価値としての記憶のみを信じていたが、エライアスとの旅を通じて、記憶とは所有するものではなく継承するものだと気づく。
- name: ディレクター・ヴァレリウス
  role: 敵役
  age: 150
  gender: 男性
  appearance: 純白のスーツに身を包み、不自然に若々しい肌を持つ。瞳の中にブラックホールの光子球のような黄金の輪が浮かんでいる。
  personality: 傲慢で選民思想が強い。宇宙の物理法則さえも管理可能な「資源」と考えている。一人称は「私」。
  speech_style: 優雅で穏やかだが、言葉の端々に相手を見下す傲慢さが滲み出ている。
  background: 記憶市場の支配層であり、特異点研究の権威。記憶を情報エネルギーに変換し、事象の地平線へ投下することで物理定数を書き換える「因果律再編計画」を主導している。
  motivation: エントロピーの増大を逆転させ、死も衰退もない永遠の帝国を築くこと。
  relationships:
  - name: エライアス・ヴォーン
    relation: 計画の障害となる不快な正義漢
  arc: 自らが神に近い存在になったと確信しているが、最終的に計算外の「感情を伴う記憶」の奔流によって、自らが構築したシステムに飲み込まれる。
- name: ノヴァ
  role: 脇役/導き手
  age: 不明（数億年）
  gender: 不詳
  appearance: 赤方偏移により赤く揺らめく、半透明のホログラムのような人型。輪郭が常にノイズのようにブレている。
  personality: 慈愛に満ちているが、深い絶望を抱えている。超越的な視点から物事を語る。一人称は「我ら」。
  speech_style: 詩的で断片的な話し方。比喩表現が多く、直接的な回答を避ける。
  background: レヴィアタンに飲み込まれた古代文明の集合意識の断片。地平線の彼方から、自分たちの存在の証明として情報を送り続けている。
  motivation: 自分たちの文明の「最後の叫び」を正しく理解し、因果律の改変という冒涜を止めてくれる救世主を探すこと。
  relationships:
  - name: エライアス・ヴォーン
    relation: 文明の遺志を託す相手
  arc: 孤独な送信を続けていたが、エライアスが自らの記憶を放流したことで、ついに宇宙の循環へと還り、安らかな消滅を迎える。
