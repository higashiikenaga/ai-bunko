title: 事象の地平線における市場 ―エントロピーの徴収者―
genre: SF
tone: 硬質なハードSF、冷徹だが壮大な宇宙観
pov: 三人称
tense: 過去形
setting: 超大質量ブラックホール「レヴィアタン」の周囲に形成された、重力レンズ効果を利用した軌道居住圏および事象の地平線付近の特異点領域。
premise: 重力の歪みによって時間の進みが極端に遅延するブラックホール近傍では、数千年の時を数分で過ごすことが可能である。そこには、宇宙の膨張と共に薄れていく『個人の記憶』を、高密度の情報エネルギーとして取引する巨大な市場が存在していた。記憶を売って寿命を延ばす者、あるいは失われた技術を買い戻そうとする者たちが、重力の奔流の中で蠢いている。物語は、記憶の真正性を検証する監査官が、事象の地平線から『消滅したはずの文明の全記録』が流出している異常事態に直面するところから始まる。
themes:
- 情報熱力学と記憶の等価性
- 時間の相対性と存在の証明
rules:
- 記憶は量子ビットとして物理的な情報量（エントロピー）を持ち、取引には莫大なエネルギーを要する。
- ブラックホールへの接近は、外部宇宙の時間軸を加速させるため、高度な重力制御装置（空飛ぶ船：重力波推進船）が不可欠である。
- 事象の地平線を越えた情報は、物理的に外部へ取り出すことは不可能である。
plot_outline:
- '序盤: 監査官のエライアスは、記憶市場における『情報の欠損』を調査するため、重力推進船でブラックホール外縁の居住区へ向かう。そこで彼は、市場に流通する記憶の中に、物理学的にあり得ない『未来の観測データ』が混入していることに気づく。'
- '中盤: 調査を進めるうちに、エライアスは記憶の取引が単なる売買ではなく、ブラックホールへ情報を投げ込むことで、外部の宇宙の物理定数を操作しようとする巨大な実験の一部であることを知る。市場の支配層は、情報の重みを利用して因果律を書き換えようとしていた。'
- '終盤: エライアスは、事象の地平線の直前で、情報の奔流が巨大な光の壁（光子球）となって視界を埋め尽くす、宇宙規模の視覚的スペクタクルに遭遇する。彼は、解析不能な『未来の記憶』の正体が、ブラックホール内部へ落下した文明が、重力赤方偏移を利用して超長期にわたって送信し続けている『最後の叫び』であることを理解する。'
- '結末: エライアスは、因果律の改変を阻止するために、自らの全記憶を情報エネルギーとして市場に放流し、システムをオーバーロードさせる。彼は情報の海へと溶け込み、物理法則の境界線上で、永遠に続く情報の循環の一部となる。'
style_notes: 熱力学第二法則や相対性理論などの物理学概念を、物語の論理的支柱として厳密に記述する。形容詞による情緒的描写よりも、数値や物理現象の動的な推移による描写を優先し、読者に宇宙の巨大さと冷徹さを、センス・オブ・ワンダーを伴って提示する。
