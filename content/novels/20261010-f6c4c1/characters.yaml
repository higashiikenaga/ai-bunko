- name: カイト・レン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 無造作な黒髪に、左目を覆う旧式のサイバー義眼。使い古された黒のレザージャケットと、油汚れの目立つタクティカルパンツを着用している。
  personality: 現実主義で冷笑的。スラムの過酷な環境で生き抜くために感情を殺しているが、根底には捨てきれない正義感を持つ。「オレ」
  speech_style: ぶっきらぼうで、短文を好む。皮肉めいた言い回しが多い。
  background: 元は企業警備隊の精鋭だったが、ある事件をきっかけに追放され、現在はスラムで賞金稼ぎ（フィクサー）として食いつないでいる。
  motivation: 日銭を稼ぐこと、そしてリナの「呪い」の正体と、彼女を狙う組織から逃げ切ること。
  relationships:
  - name: リナ・ソリス
    relation: 相棒であり、守るべき対象
  - name: サイラス・ソーン
    relation: 宿敵
  arc: 他人に深入りすることを避けてきた孤独な男が、リナの叫びを通じて世界の真実に立ち向かう覚悟を決める。
- name: リナ・ソリス
  role: 相棒
  age: 21
  gender: 女性
  appearance: 透き通るような白い肌と、短く切り揃えられた銀髪。喉元には、不自然に光る神経接続用のインプラントが埋め込まれている。
  personality: 真実しか話せない呪いにより、常に精神的な疲弊を抱えている。内面は非常に繊細で、嘘をつけないことに苦悩している。「私」
  speech_style: 丁寧だが、意図せず核心を突く残酷な真実を口にしてしまう。言葉に詰まることが多い。
  background: 企業の極秘プロジェクト「真実の証明（ヴェリタス）」の被験体。記憶操作計画の副作用として、脳内チップのバグにより嘘が物理的に不可能となった。
  motivation: 自分の意思で言葉を選べるようになること、そして隠蔽された真実を白日の下に晒すこと。
  relationships:
  - name: カイト・レン
    relation: 信頼する唯一の理解者
  arc: 自分の不遇な体質を「呪い」として忌む存在から、真実を世界に叩きつける「武器」へと変貌を遂げる。
- name: サイラス・ソーン
  role: 敵役
  age: 52
  gender: 男性
  appearance: 完璧に仕立てられた白のスーツを纏う、威厳のある紳士。一切の無駄がない洗練された容姿だが、瞳には冷徹な計算高さが宿っている。
  personality: 秩序を至高とする徹底的な合理主義者。人類の幸福のためには個人の記憶操作すら正当化すると信じている。「私（わたくし）」
  speech_style: 穏やかで理知的だが、有無を言わせぬ圧迫感を与える話し方。
  background: 超高層企業区画「天頂」を支配する巨大コンツェルン、ソーン・インダストリーズの最高経営責任者。
  motivation: ネオ・エデンの安定を維持するため、市民の記憶をコントロールし、不平不満を根絶すること。
  relationships:
  - name: カイト・レン
    relation: 排除すべきイレギュラー
  - name: リナ・ソリス
    relation: 失敗した実験体
  arc: 完璧な管理社会を築こうとした支配者が、一人の女の「真実」によって、自らが作り上げた虚構の城が崩壊していく様を目の当たりにする。
- name: ゼロ
  role: 脇役
  age: 19
  gender: 不明（中性的）
  appearance: オーバーサイズのフード付きパーカーを深く被り、常に数台の小型ドローンを周囲に浮遊させている。
  personality: 好奇心旺盛で、情報の価値を何よりも重視する情報屋。倫理観よりもデータの新しさに惹かれる。「僕」
  speech_style: 早口で、専門用語やスラングを多用する。
  background: スラムのジャンク屋に身を置きながら、高度なハッキング技術を駆使して「天頂」の情報を盗み出す天才的なハッカー。
  motivation: 世界の全データにアクセスし、誰も見たことのない「真実のコード」を見つけること。
  relationships:
  - name: カイト・レン
    relation: 依頼主であり、面白い事件を運んでくる協力者
  arc: 単なる傍観者（データコレクター）であったが、事件の渦中に巻き込まれることで、情報が持つ「重み」を知る。
