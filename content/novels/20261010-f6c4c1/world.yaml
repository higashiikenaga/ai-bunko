title: クロムの嘘、ネオンの真実
genre: サイバーパンク
tone: 硬質な独白、スピード感のある退廃的な美学
pov: 一人称（オレ）
tense: 現在形主体
setting: 超高層企業区画「天頂」と、酸性雨が降り続くスラム「下層（スラム・バット）」が垂直に分断された巨大都市・ネオ・エデン
premise: 空飛ぶ重機船が、富裕層の虚栄を運ぶ街。だが、オレの隣に座る女は、嘘をつけない呪いに冒されていた。脳内チップのバグか、それとも遺伝子のバグか。真実しか吐けない喉が、企業の深淵を暴いていく。ネオンが滲む雨の中、オレはデバッグされた真実を、硝煙とともに飲み込む。
themes:
- 情報の非対称性
- 真実の暴力性
rules:
- 脳内チップ『ニューロ・リンク』により、情報の閲覧と改ざんが可能
- 『真実の呪い』は、特定の神経回路が焼けた個体に見られる希少なバグ（副作用）
- 企業による情報統制は、視覚情報のリアルタイム書き換えによって行われる
plot_outline:
- '序盤: 路地裏のジャンク屋で、嘘をつけない女・リナと出会う。彼女が持ち込んだ企業機密のデータチップを巡り、追っ手のドローンが襲来する。'
- '中盤: 空飛ぶ船『アステリズム号』に潜入。リナの「嘘をつけない呪い」が、企業が隠蔽する「全市民の記憶操作計画」を暴いていく。'
- '終盤: 企業の防壁をハッキング。コードの奔流、論理爆弾の連打。リナの喉から、隠された世界の真実が、強制的に、残酷に、叫ばれる。'
- '結末: 偽りの夜が剥がれ落ち、酸性雨が真実を洗い流す。オレはリナと共に、逃亡のネオンの中へと消える。'
style_notes: 短いセンテンス。句読点の代わりに視覚的な間を置く。造語（例：電脳のノイズ、クロムの残響）を多用。ハッキングシーンは『プロトコルを叩き潰す』『論理の壁を穿つ』といった、物理的な手触りを持たせた表現で記述。雨とネオンの色彩を常に背景に置く。
