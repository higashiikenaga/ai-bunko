- name: カイ・アルト
  role: 主人公
  age: 15
  gender: 男性
  appearance: 茶色の癖毛に、常に使い古した飛空師ゴーグルを頭に乗せている。小柄だが引き締まった体格。動きやすい作業着を愛用。
  personality: 好奇心旺盛で楽観的。困難な状況でも「なんとかなる」と笑う強さを持つ。一人称は「俺」。
  speech_style: 「～だぜ」「～かよ！」といった、元気で少し粗野な少年らしい口調。
  background: 浮遊島の最下層にある廃材街で、スクラップを拾って日銭を稼ぐ孤児。空への強い憧れを抱きながら、日々の生活に追われていた。
  motivation: 伝説の『鏡の翼』を使い、見たこともない景色が広がる「常夏の大陸」へ到達すること。
  relationships:
  - name: ルナ・エテリウス
    relation: 旅のパートナーであり、共に運命を切り拓く仲間
  - name: ゼファー・ギア
    relation: 頼れる兄貴分であり、飛空艇の整備を任せる師のような存在
  arc: 単なる「自由への憧れ」を持つ少年から、仲間を守り、未知の嵐を突き進む「リーダー」へと精神的に成長する。
- name: ルナ・エテリウス
  role: 相棒
  age: 14
  gender: 女性
  appearance: 透き通るような銀色の長い髪と、風の揺らぎを感じさせる青い瞳。軽やかなヴェールを纏っている。
  personality: 冷静沈着で思慮深い。感情を表に出すことは少ないが、芯が非常に強い。一人称は「私」。
  speech_style: 丁寧で落ち着いた、どこか神秘性を感じさせる穏やかな口調。
  background: 風の流れを視覚化し、読み解くことができる希少な能力「風の読み手」の末裔。一族の使命から逃れるように旅をしていた。
  motivation: 風が導く先にある世界の真実を知り、自分自身の進むべき道を見つけること。
  relationships:
  - name: カイ・アルト
    relation: 自分の運命を共に変えてくれる唯一無二の存在
  arc: 運命に従うだけの「読み手」から、自らの意志で風を操り、仲間と共に新しい未来を掴み取る女性へと変わる。
- name: ヴァーン・ドレイク
  role: 敵役
  age: 38
  gender: 男性
  appearance: 威圧的な帝国軍の将校服を纏い、右目には精密な機械式の義眼を装着している。常に隙のない佇まい。
  personality: 冷酷かつ合理的。空の秩序を乱すものを「不純物」として排除することに躊躇がない。一人称は「私」。
  speech_style: 命令的で、無駄を削ぎ落とした冷徹な軍人口調。
  background: 空の全領域を帝国が統治すべきだと信じる、帝国空軍の精鋭司令官。伝説の『鏡の翼』を帝国の軍事力強化のために狙う。
  motivation: 『鏡の翼』を回収し、未知の気流を完全に制御することで、空の絶対的な秩序を確立すること。
  relationships:
  - name: カイ・アルト
    relation: 秩序を乱す、排除すべき不確定要素
  arc: 絶対的な支配者として立ちはだかるが、カイたちの「予測不能な自由」という力の前に、自身の理論の限界を知ることになる。
- name: ゼファー・ギア
  role: 脇役
  age: 24
  gender: 男性
  appearance: 無精髭に油汚れのついた顔。大きな工具袋を腰に下げ、常に機械の匂いをさせている。屈強な体つき。
  personality: 皮肉屋でぶっきらぼうだが、技術に対する情熱は誰よりも高い。面倒見が良い。一人称は「俺」。
  speech_style: 「～じゃねえか」「～だろ」といった、投げやりだが温かみのある職人気質な口調。
  background: かつて帝国の技術士官だったが、技術の軍事利用に反対して脱走した天才メカニック。現在は廃材街で流れ者の修理屋をしている。
  motivation: 自分の最高傑作となる飛空艇を完成させ、かつて諦めた「空の探求」を再開すること。
  relationships:
  - name: カイ・アルト
    relation: 放っておけない弟分であり、共に空を飛ぶ操縦士
  arc: 過去の挫折から「ただ生き延びるための修理」をしていたが、カイたちとの旅を通じて、再び「夢を叶えるための創造」に情熱を燃やす。
