title: スカイハイ・レガシー ―風を掴む黄金の翼―
genre: 異世界ファンタジー
tone: 爽快、エネルギッシュ、冒険心溢れる
pov: 三人称
tense: 過去形
setting: 無数の浮遊島が点在し、強烈な気流が文明の道となる天空世界「アエロ」。
premise: 廃材屋の少年カイは、ある日、風を反射して加速させる伝説の「鏡の翼」の断片を手に入れる。彼は癖のある仲間たちと共に、ボロボロの小型飛空艇を改造し、伝説の渡り鳥が向かうという世界の果て「常夏の大陸」を目指す。空を独占しようとする帝国軍の追撃を振り切り、少年たちは未知の気流へと飛び込んでいく。
themes:
- 自由への渇望
- 仲間との信頼と絆
rules:
- 移動はすべて『気流（ウィンドロード）』に依存し、気流のない場所では飛行不能となる
- 飛空艇の動力源は『風晶石』であり、その純度によって最大速度と高度が決まる
- 『鏡の翼』は特定の角度で風を受けることで、物理法則を無視した急加速と急旋回を可能にする
plot_outline:
- '序盤: 少年カイがゴミ山から『鏡の翼』と古びた飛空艇を発見し、風の読み手である少女ルナと出会い、旅に出ることを決める。'
- '中盤: 帝国軍の追撃をかわしながら、年に一度だけ現れる伝説の渡り鳥の群れをガイドにして、未踏の危険海域を突破していく。'
- '終盤: 世界の境界である巨大な嵐の壁『絶風の壁』に到達。仲間との連携と翼の真の力を解放し、嵐の核心へと突き進む。'
- '結末: 伝説の常夏の大陸に到達し、空の真の自由を証明した一行。彼らは新たな地図を手に、次なる未知の空へと旅立つ。'
style_notes: 風の疾走感と機械の駆動音をダイナミックな擬音と共に描写する。台詞は快活でテンポ良く、キャラクター同士の賑やかな掛け合いを重視し、読者が共に空を飛んでいるような高揚感を演出する。
