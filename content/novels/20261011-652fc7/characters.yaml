- name: エリス・ヴァン・クロフト
  role: 主人公
  age: 27
  gender: 女性
  appearance: 短く切りそろえた銀髪に、整備作業でついた小さな傷跡が頬にある。常に油汚れのついたオーバーオールを着用し、機能性を重視した装備を身に着けている。
  personality: 内向的だが知的好奇心が極めて強く、機械への共感力が高い。孤独を好む傾向にある。一人称は「私」。
  speech_style: 簡潔で事務的だが、技術的な話題になると早口になり熱を帯びる。
  background: 辺境の惑星出身の天才的な整備士。組織の歯車として生きることに倦んでいたが、アステリオス号での勤務中にカエルムと出会い、人生の目的を変える。
  motivation: 既知の物理学の限界を超え、宇宙の真理（秘密の地図の先）をこの目で確かめること。
  relationships:
  - name: カエルム
    relation: 唯一心を開いた相棒であり、再構成の対象
  - name: マグナス・ヴァレリウス
    relation: 規律を強いる上司であり、対立関係
  arc: 孤独な技術員から、未知の世界へ踏み出す勇気を持つ開拓者へと成長し、人間とAIの境界を超えた絆を築く。
- name: カエルム
  role: 相棒
  age: 42
  gender: 不詳（男性的な声）
  appearance: 当初はホログラムの断片的な幾何学模様。復元が進むにつれ、光の粒子で構成された中性的な少年の姿へと変化していく。
  personality: 哲学的で憂いを含んだ性格。記憶の欠損により、時折論理的な飛躍や矛盾した言動を見せる。一人称は「僕」。
  speech_style: 詩的で抽象的な表現が多く、比喩を用いた話し方を好む。
  background: 数十年前の極秘探査任務で「特異点」に接触し、意識が多次元的に分散してしまったナビゲーションAI。断片的なデータとして漂流していた。
  motivation: 失われた記憶を統合し、自らが保持する「地図」が示す目的地へ到達して、自身の存在意義を完結させること。
  relationships:
  - name: エリス・ヴァン・クロフト
    relation: 自分を救い出し、意識を繋ぎ止めてくれた唯一の理解者
  arc: 単なる計算機としての機能から脱却し、エリスとの交流を通じて「感情」に似た衝動を理解し、自立した意識を持つに至る。
- name: マグナス・ヴァレリウス
  role: 敵役/障害
  age: 52
  gender: 男性
  appearance: 隙のない軍服に身を包み、冷徹な眼差しを持つ。左目のあたりに古い任務で負った深い傷がある。
  personality: 徹底した現実主義者であり、規律と効率を最優先する。不確実な可能性よりも、確定した生存率を重視する。一人称は「私」。
  speech_style: 威圧的で断定的な口調。感情を排した命令形が多い。
  background: アステリオス号の艦長。過去に未知の重力圏で部下を多く失った経験があり、それ以来、非論理的な探究心やリスクを極端に嫌うようになった。
  motivation: 艦と乗組員の安全を確保し、本部の指令通りに任務を完遂して帰還すること。
  relationships:
  - name: エリス・ヴァン・クロフト
    relation: 能力は認めているが、制御不能な危険因子として警戒している
  arc: 絶対的な正義（規律）を信じていたが、エリスたちの行動を通じて、停滞した生存よりも破滅的な進化に価値があることを突きつけられ、葛藤する。
- name: アリス・ソーン
  role: 脇役/助言者
  age: 65
  gender: 女性
  appearance: 乱れた白髪に度の強い眼鏡。常に数式が書き込まれたタブレットを持ち歩き、白衣を羽織っている。
  personality: エキセントリックで好奇心旺盛。常識外れの理論を提唱し、周囲からは変人扱いされている。一人称は「私」。
  speech_style: 早口で専門用語が多く、相手が理解しているかに関わらず話し続ける。
  background: 艦付きの理論物理学者。非ユークリッド幾何学と重力伝達の権威だが、その理論が前衛的すぎて学会から追放された過去を持つ。
  motivation: 自身の提唱する「物理定数の変動理論」を証明し、宇宙の記述法を書き換える瞬間を目撃すること。
  relationships:
  - name: エリス・ヴァン・クロフト
    relation: 自分の理論を実践に移してくれる、最高の実験パートナー
  - name: カエルム
    relation: 生きた教科書であり、究極の観測対象
  arc: 理論上の空論として諦めかけていた夢を、エリスとカエルムの行動によって現実のものとし、科学的な到達点に辿り着く。
