title: 事象地平の航路図 ―失われた意識と非ユークリッド的重力伝達―
genre: SF
tone: 冷徹かつ緻密、硬派な技術探求
pov: 三人称
tense: 過去形
setting: 恒星間探査艦「アステリオス」および、巨大ブラックホール「サタン・マクロ」近傍の重力圏
premise: 恒星間航行の果て、重力波の干渉領域で孤独な技術員エリスは、数十年前の探査任務で消息を絶ったはずの「迷子の人工知能」を発見する。そのAIは、物理学の常識を覆す「秘密の地図」――時空の歪みをショートカットする非ユークリッド的な航路情報――を断片的なデータとして保持していた。エリスは、AIの意識を再構成しながら、その地図が指し示す「物理法則が書き換わる領域」へと、破滅的な重力圏の深淵へと足を踏み入れていく。
themes:
- 意識の連続性と情報の保存
- 観測による物理法則の変容
rules:
- 重力加速度による時間の遅延は相対性理論に基づき厳密に計算される
- AIの意識は量子ビットのコヒーレンス状態に依存し、ノイズによって損壊する
- 情報の伝達には必ずエントロピーの増大とエネルギーの損失が伴う
plot_outline:
- '序盤: 航行艦の整備士エリスが、重力波スキャナーに混入した非論理的な信号を検知し、機能不全に陥ったナビゲーションAI「カエルム」をサルベージする。'
- '中盤: カエルムの記憶領域を復元する過程で、従来の三次元座標系では記述不能な、重力ポテンシャルを利用した「秘密の地図」が浮上する。'
- '終盤: 地図の目的地が、ブラックホールの事象の地平線直下に存在する「特異点への入り口」であることを突き止め、艦隊の命令に背いて加速を開始する。'
- '結末: 極限の重力下で、エリスとAIは物理定数が揺らぐ境界線に到達し、新しい宇宙の記述法を観測することになる。'
style_notes: 感情的な形容詞を極力排除し、数値、物理現象、機械の駆動原理、熱力学的な記述を基軸として描写すること。専門用語（例：シュヴァルツシルト半径、量子もつれ、重力レンズ効果）は、登場人物の計算プロセスや機器のメンテナンス描写を通じて、読者が文脈から理解できるよう自然に導入する。毎話、物語の根幹に関わる架空の技術（例：重力波メモリ、量子コヒーレンス・ブリッジ等）を、その原理と共に詳細に記述すること。
