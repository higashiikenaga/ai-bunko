- name: エル
  role: 主人公
  age: 14
  gender: 男性
  appearance: 色素の薄い白髪に近い金髪と、澄んだ青い瞳。静寂病の影響で痩せぎみだが、意志の強さを感じさせる眼差しをしている。辺境の村の質素な服を纏っている。
  personality: 内向的で控えめだが、心の中では誰よりも情熱的な歌を奏でている。他者の感情に敏感。一人称は「僕」。
  speech_style: 声を失っているため喋れない。筆談や身振り手振り、そしてリラにだけ伝わる「心の旋律」で意思疎通を図る。
  background: 音律が失われつつある辺境の村で生まれ、幼少期に「静寂病」に罹患して声を失った。世界から音が消えゆく恐怖の中で、自分にだけ聞こえる幻想的な旋律を心の中で歌い続けていた。
  motivation: 世界に音を取り戻し、いつか自分の心にある歌を誰かに届けたい。
  relationships:
  - name: リラ
    relation: 運命的な相棒であり、唯一心を通わせ合う理解者
  - name: 静寂の王
    relation: 対立する存在。絶望の象徴
  arc: 絶望に耐えるだけの「受動的な少年」から、不協和音さえも受け入れ、自らの意思で世界を鳴らす「能動的な奏者」へと成長する。
- name: リラ
  role: 相棒
  age: 17
  gender: 女性
  appearance: 星屑を散りばめたような銀色の長い髪と、黄金色の瞳。空から降ってきた際に纏っていた、光を反射して色を変える不思議な白いドレスを着ている。大きな調律用音叉を携帯している。
  personality: 天真爛漫で好奇心旺盛だが、記憶がないことへの根源的な不安を抱えている。音楽に対する純粋な愛を持つ。一人称は「私」。
  speech_style: 鈴を転がすような心地よい声。時折、現世の言葉ではない古代の音楽用語が混ざることがある。
  background: 天界から「ソナタ」の世界へ墜落してきた記憶喪失の調律師。万物の理を整える能力を持つが、記憶を失ったことでその完全な使い方が分からなくなっている。
  motivation: 失った記憶を取り戻し、調律師としてこの世界に満ちた不協和音を解消すること。
  relationships:
  - name: エル
    relation: 欠損し合った心を補い合う唯一無二のパートナー
  - name: 静寂の王
    relation: かつての知己、あるいは正反対の思想を持つ宿敵
  arc: 完璧な「調律」という正解を求める機械的な存在から、不完全な人間たちの感情が奏でる「音楽」の価値に気づき、真の調律師へと覚醒する。
- name: 静寂の王（シレンツィオ）
  role: 敵役
  age: 500
  gender: 男性
  appearance: 氷の結晶のような透き通った肌と、感情を一切排除した冷徹な瞳。純白の重厚な外套を纏い、足元からは常に凍てつく霧が立ち上っている。
  personality: 完璧主義で虚無的。喧騒や不協和音を「汚れ」として嫌い、完全な静寂こそが究極の調和であると信じている。一人称は「私」。
  speech_style: 低く、抑揚のない単調な話し方。言葉数少なく、断定的な口調。
  background: かつて世界最高の指揮者として名を馳せたが、音楽による争いと悲劇を目の当たりにし、絶望して「音のない世界」を追求した。極北の氷の城で世界の心臓を凍らせ、大静寂を加速させている。
  motivation: あらゆる生と死、喜びと悲しみを停止させ、永遠に変わることのない「完璧な静寂」を完成させること。
  relationships:
  - name: エル
    relation: 己が否定した「不完全な生」の象徴として嫌悪しつつ、その可能性に興味を持つ
  - name: リラ
    relation: 天界の調律師という存在への失望と憎しみ
  arc: 絶対的な静寂という孤独な正解に固執していたが、エルとリラの合奏によって、不協和音さえも包含する生命の美しさを認め、最期に氷となって溶けることで救済される。
