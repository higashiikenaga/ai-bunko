title: 静寂を裂く白銀のポリフォニー
genre: 異世界ファンタジー
tone: 抒情的で音楽的な幻想曲風
pov: 三人称
tense: 過去形
setting: 音律が万物の理を定義する世界「ソナタ」。音楽を失うことで物質が崩壊し、世界が凍てつく「大静寂」が忍び寄っている時代。
premise: 全ての音が消えゆく絶望の中、声を失った少年・エルは、空から降ってきた記憶喪失の調律師・リラと出会う。二人は世界の心臓を再び鳴らすため、失われた旋律を求めて極北へと旅立つ。辿り着いた先にあるのは、すべてを凍らせる静寂の王が統べる氷の城だった。
themes:
- 喪失と再生
- 不協和音の肯定
rules:
- 音楽が物理的な力（熱、光、風など）を生成する。
- 「調律」という行為によって物質の性質を書き換えられる。
- 音を失った者は「静寂病」となり、身体が徐々に結晶化して砕け散る。
- 禁忌とされる不協和音は強力な破壊力を生むが、奏者の精神を激しく摩耗させる。
plot_outline:
- '序盤: 静寂病に侵されつつある辺境の村で、心の中でだけ歌う少年エルが、天から降り注いだ調律師のリラと出会い、世界を救うための旅を始める。'
- '中盤: 古代の楽譜が眠る「地下図書館」を訪れ、世界の心臓を動かすための『創世の旋律』の断片を集める。その過程で、不協和音に塗れた過去の悲劇を知る。'
- '終盤: 極北の「氷の城」に到達。静寂こそが究極の調和であると信じ、世界を永遠の停止に導こうとする氷の王との最終対決に挑む。'
- '結末: エルとリラが互いの欠損を補い合う新たな合奏を奏で、不協和音さえも包み込む生命の歌を響かせる。世界に再び音が戻り、氷の城は春の雨へと溶けて消える。'
style_notes: 文章に音楽的な拍子感を持たせ、流麗かつリズミカルな叙述を行う。音楽用語（クレッシェンド、休止符など）を比喩として多用し、各話に物語の情景や感情を象徴する一節の歌詞を挿入することで、読者が聴覚的に物語を体験できるよう構成する。
