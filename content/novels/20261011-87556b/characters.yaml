- name: 如月 詩織
  role: 主人公
  age: 17
  gender: 女性
  appearance: 儚げな印象を与える、透き通るような白い肌と長い黒髪。感情の読めない、深い霧のような灰色の瞳をしている。
  personality: 内向的で孤独を愛する。完璧な美への強い憧憬と、現実世界への強い疎外感を抱いている。一人称は「私」。
  speech_style: 静かで控えめ。言葉数が少なく、独白のような話し方をする。
  background: 幼少期から周囲に馴染めず、芸術への執着のみが心の拠り所だった。ある日、導かれるように雪深い山奥の廃校へと辿り着く。
  motivation: 自分を完全に受け入れ、永遠に変わることのない「究極の美」の世界に浸ること。
  relationships:
  - name: ジュリアン
    relation: 甘美な誘惑をかける導き手であり、運命的な捕食者
  - name: 三枝 澪
    relation: 警告をくれる唯一の人間だが、価値観が合わない不協和音のような関係
  arc: 現実への絶望から、美しき死（静止）への心酔へと堕ち、最終的に自ら硝子の像となることを選ぶ。
- name: ジュリアン
  role: 敵役/導き手
  age: 18
  gender: 男性
  appearance: 銀色の髪に、凍てついたサファイアのような冷徹な瞳。旧時代の寄宿学校の制服を完璧に着こなした、人間離れした美青年。
  personality: 傲慢で支配的だが、振る舞いは極めて紳士的。美しさを「保存」することに病的な執着を持つ。一人称は「僕」。
  speech_style: 詩的で装飾的な言い回しを好み、相手の精神的な隙間に滑り込むような囁き声で話す。
  background: かつてこの学校で「最も美しい生徒」として儀式の中心となり、現在は氷の城を管理する死者の調律師となった。
  motivation: 自身のコレクションを完成させるため、最高の輝きを持つ魂を氷の柩に閉じ込めること。
  relationships:
  - name: 如月 詩織
    relation: 最高の素材として目をつけ、精神的に追い詰めて懐柔しようとする標的
  - name: 三枝 澪
    relation: コレクションから逃げ出した「欠陥品」として忌み嫌っている
  arc: 詩織を完璧に絶望させ、彼女が自ら美しさを捧げる瞬間という最高の快楽を得る。
- name: 三枝 澪
  role: 相棒/警告役
  age: 19
  gender: 女性
  appearance: 乱れた短髪に、凍傷のような痕が残る指先。実用的な防寒着を身に纏い、常に周囲を警戒している鋭い眼差し。
  personality: 現実的で気が強く、サバイバル本能に長けている。冷徹に見えるが、根底には強い人間愛と後悔がある。一人称は「私」。
  speech_style: ぶっきらぼうで、切り捨てるような激しい口調。嘘や甘い言葉を嫌う。
  background: かつてこの学校に迷い込み、仲間たちが次々と凍りつく中で唯一生き残ったサバイバー。脱出を試みながら、後から来る者を救おうとしている。
  motivation: 詩織を氷の城の呪いから救い出し、生きてこの雪山を脱出すること。
  relationships:
  - name: 如月 詩織
    relation: 救いたい対象だが、美に惹かれる彼女の危うさに焦燥感を抱いている
  - name: ジュリアン
    relation: 激しく憎悪しており、彼がもたらす旋律を拒絶している
  arc: 詩織を救うことで自らの過去の罪悪感を拭おうとするが、美の呪縛に抗えない人間の脆さを目の当たりにして絶望する。
