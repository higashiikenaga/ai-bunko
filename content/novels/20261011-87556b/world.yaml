title: 硝子の柩、緋色の共鳴
genre: ホラー
tone: 耽美的で退廃的、静謐な狂気
pov: 一人称
tense: 過去形
setting: 現代、雪に閉ざされた山奥の、美しき廃校となった寄宿学校
premise: 透き通るような白銀の世界に、私は捨てられた。かつて芸術の楽園と呼ばれたこの寄宿学校には、美しきものを蒐集し、凍結させるという呪われた儀式が眠っている。夜明けのラジオから流れる、死者の声のような旋律に誘われ、私は氷の城へと足を踏み入れる。そこで出会うのは、宝石のように美しく、しかし内側から腐り果てた、魂の欠片たちであった。
themes:
- 美への執着と崩壊
- 記憶の凍結
- 孤独の極致
rules:
- 美しく輝くものほど、その内側には腐敗した死が宿っている
- 氷の城に招かれた者は、自身の最も美しい記憶を代償に、永遠の静止を求められる
- ラジオの音声は、死者が現世に繋ぎ止めるための、細い硝子の糸である
plot_outline:
- '序盤: 雪に閉ざされた寄宿学校へ迷い込んだ主人公が、深夜にだけ流れる不思議なラジオ放送に耳を傾け、聞こえてくる甘美な声に抗えなくなっていく。'
- '中盤: 学校の地下に隠された、氷で造られた壮麗な城を発見する。そこでは、かつての生徒たちが宝石のような剥製となって並んでおり、主人公もまた、自らの美しさを捧げたいという衝動に駆られる。'
- '終末: ラジオから流れる旋律が最高潮に達したとき、氷の城が現実の境界を食い破る。美しさを守るために、主人公は自らを凍てつかせる選択を迫られる。'
- '結末: 翌朝、雪原には誰もいない。ただ、凍りついた廃校の窓辺に、あまりにも美しく、あまりにも虚ろな硝子の少女の像が、朝日を浴びて輝いていた。'
style_notes: 言葉の一つひとつを、研磨された宝石や、薄氷のように繊細に綴ること。比喩には常にガラスの透明感、花の凋落、あるいは硬質な鉱物の輝きを用いる。恐怖を直接的な暴力ではなく、美しすぎるものへの眩暈や、静かな壊死として描写し、読者の肌を冷たく撫でるような詩的な文体を維持すること。
