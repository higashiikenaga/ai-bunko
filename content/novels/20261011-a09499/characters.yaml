- name: 瀬戸 遥
  role: 主人公
  age: 17
  gender: 男性
  appearance: 痩せ型で、どこか虚ろな瞳をした少年。常に清潔感はあるが、色の薄い服を好む。
  personality: 内向的で思索的。周囲に合わせることに疲れ、心に空虚感を抱えている。一人称は「僕」。
  speech_style: 静かで控えめ。断定を避け、相手の反応を伺うような話し方。
  background: 成績優秀で期待されているが、親が望む進路と自分の意志の乖離に悩み、人生の目的を見失い「漂流」している状態。
  motivation: 自分だけの居場所を見つけ、心地よい静寂の中で心を休ませたい。
  relationships:
  - name: 星名 凛
    relation: 孤独を共有し、互いの存在に救いを見出す精神的なパートナー
  - name: 鳴海 颯太
    relation: 対照的な性格ながら、信頼し合っている幼馴染
  arc: 自分の空虚さを「欠落」として恐れていたが、凛との出会いを通じて、不完全なままでも進み出せる勇気を得る。
- name: 星名 凛
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と、夜の闇に溶け込む長い黒髪。古びた銀色の懐中時計を大切に持っている。
  personality: 儚げで孤独を好むが、内側に強い頑固さを秘めている。一人称は「私」。
  speech_style: 淡々としており、感情の起伏が少ない。ただし星の話になると熱を帯びる。
  background: 天文学者だった父を幼い頃に亡くしており、父の形見である懐中時計が止まった瞬間に、自分の時間も止まってしまったと感じている。
  motivation: 壊れた時計を直し、父と共有していた「止まった時間」を再び動かすこと。
  relationships:
  - name: 瀬戸 遥
    relation: 自分の止まった時間を肯定してくれた、唯一の理解者
  - name: 浅倉 朱里
    relation: 心配されながらも、距離を置こうとしていたクラスメイト
  arc: 過去への執着から脱却し、時計が直らないという絶望さえも自分の人生の軌道として受け入れ、新しい時を刻み始める。
- name: 鳴海 颯太
  role: 脇役
  age: 17
  gender: 男性
  appearance: 日焼けした肌と快活な笑顔。スポーツウェアを好んで着る、活動的な風貌。
  personality: 明るく世話焼き。直感的で行動力があるが、実は繊細な相手への配慮ができる。一人称は「俺」。
  speech_style: 快活で砕けた口調。声が大きく、場の空気を明るくする。
  background: 地元でスポーツに打ち込む体育会系。遥の幼馴染であり、彼が抱える闇をなんとなく察しながら、外の世界へ連れ出そうとしている。
  motivation: 親友である遥に、もう一度心から笑ってほしい。
  relationships:
  - name: 瀬戸 遥
    relation: 正反対の性質を持つが、深い信頼で結ばれた親友
  arc: 遥と凛の繊細な関係性を尊重することを学び、強引に導くのではなく、見守るという優しさを身につける。
- name: 浅倉 朱里
  role: 脇役
  age: 17
  gender: 女性
  appearance: ショートヘアに眼鏡。機能的な服装を好み、常に手帳を持ち歩いている。
  personality: 現実主義で率直。正義感が強く、曲がったことが嫌い。一人称は「あたし」。
  speech_style: ハキハキとしており、時に厳しい正論を突きつけるサバサバした話し方。
  background: 凛のクラスメイト。凛の家庭環境や孤独を知っており、彼女が現実世界に適応できるよう、不器用にサポートしようとしている。
  motivation: 凛が過去の呪縛から逃れ、普通の高校生としての時間を過ごしてほしい。
  relationships:
  - name: 星名 凛
    relation: 不器用な友情を抱くクラスメイト
  - name: 瀬戸 遥
    relation: 凛を変えてくれた存在として、密かに期待を寄せる相手
  arc: 正論だけでは救えない心があることを知り、相手のペースで待つという寛容さを得る。
