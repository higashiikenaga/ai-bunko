title: 砂塵の夜、壊れた鼓動と星座の地図
genre: 青春恋愛
tone: 静謐でロマンチック、夏の夜の湿り気を帯びた空気感
pov: 三人称
tense: 過去形
setting: 夏の猛暑が続く、海辺の寂れた天文台がある町
premise: 猛暑の熱気が砂漠のようにすべてを焼き尽くそうとする夏、高校生の遥は、学校の旧天文台で一人の少女、凛と出会う。彼女の手元には、時を刻むことを止めた壊れた懐中時計があった。孤独という名の砂嵐の中にいた二人は、夜の静寂と星々の瞬きだけを共有する「オアシス」のような時間を過ごしていく。止まった時計の針と、動き続ける宇宙の運行の間で、二人は自分たちの進むべき軌道を見つけ出せるのか。
themes:
- 失われた時間と再生
- 孤独な魂の共鳴
rules:
- 登場人物の感情や心理描写には、必ず天文学的、あるいは星座にまつわる比喩を用いること
- 物語の各章には、必ず一つ、その章のテーマとなる星座、あるいは天体現象を象徴的に登場させること
plot_outline:
- '序盤: 逃げ場のない熱気に包まれた夏。遥は、誰もいないはずの旧天文台で、壊れた懐中時計を愛おしそうに見つめる凛を見つける。二人は言葉を交わさずとも、夜の静寂に心地よさを感じるようになる。'
- '中盤: 二人は夜な夜な天文台に集まり、星座の神話を語り合いながら、互いの孤独を分かち合っていく。凛が時計を直そうと執着するのは、亡き父との「止まった時間」を繋ぎ止めたいからだと判明する。遥もまた、自分の進路を見失い、漂流する彗星のような空虚さを抱えていた。'
- '終盤: 最大の流星群が訪れる夜。凛は、時計が直らない現実を受け入れられず、自らの居場所である天文台（オアシス）から逃げ出そうとする。遥は、壊れた時計の針が指し示す「欠落」こそが、彼女が歩んできた美しい軌道であることを、星の瞬きと共に伝える。'
- '結末: 時計は直らない。しかし、凛は時計を懐にしまい、新しい時を刻み始める。二人は、銀河の中で互いの重力を感じ合う連星のように、それぞれの未来へと歩み出していく。'
style_notes: 月城すばるとしての文体を徹底すること。夜空の深淵さや、星々の瞬き、季節の星座の移ろいを、登場人物の心情と重ね合わせて描く。会話劇は静かで、言葉の背後にある沈黙（宇宙の空虚さ）を大切にする。比喩表現には「公転」「恒星」「黄道」「朔望」などの天文用語を自然に織り込み、読者の視線を常に夜空へと誘うような、情緒的でロマンチックな叙情性を維持すること。
