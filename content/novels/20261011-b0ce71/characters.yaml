  arc: 過去の隠蔽を暴くことに執着していたが、真実がもたらす残酷な結末を受け入れ、前を向く強さを得る
- name: グリズ
  role: 脇役
  age: 76
  gender: 男性
  appearance: 白髪と長い髭、深く刻まれた皺、古びた羊毛の衣
  personality: 穏やかだが、どこか世捨て人のような寂寥感を漂わせる。一人称は「儂（わし）」
  speech_style: ゆっくりとした、教訓めいた古風な話し方
  background: 村が地図から消された際、唯一村に残ることを選び、記憶と風習を守り続けてきた隠者
  motivation: 村の尊厳を守り、近代化の波によって歴史が不当に塗り替えられるのを防ぐこと
  relationships:
