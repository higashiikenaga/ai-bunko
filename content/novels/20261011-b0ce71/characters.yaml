- name: サイラス・ヴェイン
  role: 敵役
  age: 42
  gender: 男性
  appearance: 隙のない仕立ての高級なスーツ、鋭い眼光、手入れされた整った髭
  personality: 冷徹で合理的。利益こそが世界の真理だと信じている。一人称は「私」
  speech_style: 丁寧だが、相手を見下すような慇懃無礼な話し方
  background: 近代化の波に乗り、鉄道建設や鉱山開発で莫大な富を築いた新興商人の代表
  motivation: 村の遺構に眠るとされる未知の資源、あるいは歴史的価値のある遺物を独占し、自身の帝国を盤石にすること
  relationships:
  - name: エレナ・クロス
    relation: 自身の事業を阻害する厄介な調査者
  arc: 効率と利益のみを追求していたが、村の真実を前に、金では決して贖えない「喪失」の重さを知る
- name: エレナ・クロス
  role: 主人公
  age: 34
  gender: 女性
  appearance: 短く切り揃えた髪、頬にある古い傷跡、機能的な軍用コート
  personality: 沈着冷静で意志が強い。正義感よりも真実への渇望が勝る。一人称は「私」
  speech_style: 無駄がなく、断定的で力強い口調
  background: 国境紛争に従軍していた元軍人。村が消滅した際の隠蔽任務に疑問を抱き、除隊した
  motivation: 村が地図から消された真相と、当時の部隊が隠蔽した「ある事実」を白日の下に晒すこと
  relationships:
  - name: サイラス・ヴェイン
    relation: 利害が真っ向から対立する敵対者
  - name: グリズ
