    relation: かつての村の子供たちの面影を重ねる対象
  arc: 過去を封印し守り続けることに固執していたが、最後には真実を次世代へと託す決意をする
- name: レオ・アリス
  role: 主人公
  age: 24
  gender: 男性
  appearance: どこか虚ろな瞳、使い古された軍服、首に下げた古いペンダント
  personality: 真面目で献身的だが、過去の罪悪感に苛まれている。一人称は「僕」
  speech_style: 控えめで、時折言葉に詰まるような繊細な話し方
  background: 村の幼馴染たちと「約束の丘」で誓いを立てた少年。戦地から帰還したばかりの帰還兵
  motivation: かつての仲間たちと交わした「約束」を果たすため、約束の丘へ辿り着くこと
  relationships:
