title: 残照の境界 ―亡霊たちの聖域と誓いの断崖―
genre: 群像劇
tone: 重厚で哀愁漂う、荘厳な雰囲気
pov: 三人称多視点
tense: 過去形
setting: 架空の北国、激動の近代化が進む山岳地帯と、地図から抹消された廃村の周辺
premise: 近代化の波に呑まれ、地図から消された「消えた村」を巡り、異なる正義を抱く四人の男女が交錯する。村の遺産を求めて追う野心的な商人の男、故郷の真実を追う元軍人の女、村の記憶を守り続ける隠者の老人、そして約束を果たそうとする帰還兵の青年。彼らは、かつて幼馴染たちが誓いを立てた「約束の丘」で、それぞれの葛藤と向き合うことになる。失われた記憶と、変わりゆく時代の狭間で、彼らは真実という名の残酷な光を浴びる。
themes:
- 喪失と再生
- 時代の変遷に伴う個人の矜持
- 記憶の継承
rules:
- 消えた村は、特定の地形的条件下でしか視認できず、歴史学的には存在しないものとして扱われる
- 約束の丘は、村の生存者のみが辿り着ける精神的・地理的な境界線である
plot_outline:
- '序盤: 近代化の恩恵を受ける都市の喧騒と、山岳地帯に潜む「消えた村」の影を描く。商人、軍人、老人の視点が、それぞれ異なる動機で村の痕跡を追い始める。'
- '中盤: 各登場人物が村の周辺へと接近する中で、過去の悲劇が断片的に明かされる。彼らの目的は交差せず、それぞれの正義に基づいた行動が、意図せず他者の足枷となっていく。'
- '終盤: 全ての視点が「約束の丘」へと収束する。そこには、かつての約束を守ろうとする青年と、それを阻もうとする勢力が衝突する嵐のような光景が広がっていた。'
- '結末: 村の真実が白日の下に晒されるが、それは誰もが望んだ形ではなかった。各々が喪失を受け入れ、時代の荒波の中へ歩みを進める姿を描く。'
style_notes: 格調高い語彙を用い、風景描写には季節の移ろいや空気の重みを精緻に反映させること。登場人物の独白は、その人物の社会的地位や生き様を反映した、品位ある言葉遣いを徹底する。感情を直接的な形容詞で説明せず、仕草や情景の対比によって、静かに、かつ深く表現すること。
