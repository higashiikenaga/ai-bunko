- name: 節子 (せつこ)
  role: 主人公
  age: 72
  gender: 女性
  appearance: 銀髪を低くまとめ、使い込まれた藍色のエプロンを身につけている。穏やかだが、どこか遠くを見つめるような寂しげな瞳をしている。
  personality: 静かで落ち着いているが、芯が強く、料理に対しては一切の妥協を許さない。一人称は「私」。
  speech_style: 丁寧でゆったりとした、包み込むような口調。語尾に独特の間がある。
  background: 崖の上の古い灯台で一人暮らしをしている。かつて空飛ぶ船乗りだった息子を、数年前の嵐で亡くして以来、時計が止まったような生活を送っている。
  motivation: 亡き息子への未練と向き合い、止まっていた自分の時間を再び動かすこと。
  relationships:
  - name: 湊
    relation: 居候の青年
  - name: 亡き息子
    relation: 息子
  arc: 孤独に閉じこもっていた心が、湊との共同生活や料理を通じて、再び外の世界と繋がり、過去と和解していく。
- name: 湊 (みなと)
  role: 主人公
  age: 26
  gender: 男性
  appearance: 日焼けした肌と、常に油汚れのついた作業着。無骨で大きな手をしているが、目は非常に繊細で聡明。
  personality: 極めて寡黙で職人気質。自分の感情を言葉にするのが苦手だが、手先は非常に器用。一人称は「俺」。
  speech_style: 短文でぶっきらぼう。必要最低限のことしか話さないが、声のトーンは優しい。
  background: 空飛ぶ船の修理工。ある航路での失敗をきっかけに、特定の場所に留まらず旅を続けてきた。故障した船を直すために、偶然この街に辿り着く。
  motivation: 壊れたもの（船、灯台、そして自身の傷ついた心）を修復すること。
  relationships:
  - name: 節子
    relation: 灯台の主
  arc: 「ただ直すだけ」の機械的な仕事から、誰かのために、あるいは誰かと共に生きるための技術へと、仕事と心の在り方が変化する。
- name: ルカ
  role: 脇役
  age: 10
  gender: 女性
  appearance: ショートカットの髪に、空飛ぶ船の模型を常に持ち歩いている。活発で目が輝いている少女。
  personality: 好奇心旺盛で天真爛漫。街の子供たちを引っ張るリーダー的存在。一人称は「ルカ」。
  speech_style: 語尾が跳ねるような、元気で明るい話し方。疑問符が多く、質問攻めにする癖がある。
  background: 灯台の街の住人。節子の作る料理が大好きで、よく「お裾分け」を求めて灯台を訪れる。
  motivation: いつか大きな空飛ぶ船に乗って、雲の向こうの果てまで行くこと。
  relationships:
  - name: 節子
    relation: 近所の親戚のような存在
  - name: 湊
    relation: 新しいお兄さん
  arc: 二人の静かな交流を間近で見守ることで、物語に明るいリズムと、未来への希望を象徴する役割を果たす。
- name: エルナ
  role: 脇役
  age: 35
  gender: 女性
  appearance: 旅装束に身を包んだ、凛とした雰囲気の女性。風を切って飛ぶ船の船長。
  personality: 現実的で商売人らしい計算高さもあるが、根は非常に情に厚い。一人称は「私」。
  speech_style: はきはきとした、迷いのない明快な話し方。
  background: 空飛ぶ島々を巡る商船の船長。節子の息子の旧友であり、灯台の光が弱まったことに危機感を抱いている。
  motivation: 航路を維持し、街と空の交易を守ること。
  relationships:
  - name: 節子
    relation: 息子の友人であり、旧知の仲
  - name: 湊
    relation: 技術者として信頼する対象
  arc: 灯台の危機を通じて、節子と湊の絆が結実するのを後押しし、物語を終盤のクライマックスへと導く。
