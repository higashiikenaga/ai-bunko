- name: エレーナ・フォン・アステリア
  role: 主人公
  age: 19
  gender: 女性
  appearance: 真珠のように白い肌と、吸い込まれるようなサファイア色の瞳。飾り気のない、しかし隠しきれない気品を持つ。
  personality: 誠実で真っ直ぐ。嘘をつけない自分を「呪われた欠陥品」だと思い込み、孤独を感じている。一人称：私
  speech_style: 丁寧で清楚だが、相手の虚飾を無意識に突いてしまう、残酷なほど純粋な物言い。
  background: 没落寸前の名門貴族の令嬢。幼少期から「嘘をつけない」という特性を、社交界における致命的な欠点として恐れて生きてきた。
  motivation: 虚飾に満ちた世界の中で、自分自身の言葉に意味を見出し、真実の愛と自由を掴むこと。
  relationships:
  - name: ジュリアン
    relation: 孤独を分かち合い、運命を共にする最愛の人
  - name: マクシミリアン大公
    relation: 自らの真実が脅かす、最大の敵
  arc: 呪いを「欠陥」から、真実を暴き世界を変えるための「武器」へと昇華させ、自立した女性へと成長する。
- name: ジュリアン・ド・ラ・ヴァリエール
  role: 相棒
  age: 26
  gender: 男性
  appearance: 鋭い眼差しと、どこか影のある端正な顔立ち。動きやすい、仕立ての良い黒い外套を纏う。
  personality: 冷静沈着で現実主義。しかし、内には激しい情熱とエレーナへの献身的な愛を秘めている。一人称：私
  speech_style: 低く落ち着いたトーン。社交辞令を完璧に使いこなし、相手の懐に入る術に長けている。
  background: かつては有力な伯爵家の子息だったが、政争に敗れ没落。現在は情報の扱いに精通し、裏社会の知識も持つ。
  motivation: 崩壊へと向かう帝国からエレーナを救い出し、二人で新しい人生を歩むための切符を手に入れること。
  relationships:
  - name: エレーナ
    relation: 守るべき光であり、唯一真実を語り合える存在
  - name: マクシミリアン大公
    relation: 家を滅ぼした宿敵
  arc: 単なる生存のための逃亡者から、愛する人のために運命に抗い、戦う騎士へと変わる。
- name: マクシミリアン・フォン・クロムウェル
  role: 敵役
  age: 45
  gender: 男性
  appearance: 銀髪を完璧に整え、威厳に満ちた容貌。常に隙のない、豪華絢爛な軍服や礼装を着用している。
  personality: 冷酷かつ計算高い。帝国の秩序を守るためには、巧妙な嘘と情報操作を手段として厭わない。一人称：私
  speech_style: 優雅で慈悲深く聞こえるが、その言葉は常に相手を支配し、誘導しようとする。
  background: 帝国の実権を掌握する大公。帝都の繁栄を維持するため、政敵の排除と歴史の隠蔽を繰り返してきた。
  motivation: 既存の虚飾に満ちた帝国秩序を維持し、真実によってそれらを揺るがす不確定要素を排除すること。
  relationships:
  - name: エレーナ
    relation: 自らが築いた嘘の城を壊しかねない、忌むべき脅威
  - name: ジュリアン
    relation: 過去の清算すべき残滓
  arc: 絶対的な支配者として君臨していたが、自らが作り上げた嘘の連鎖によって、崩壊の渦へと引きずり込まれる。
- name: セラフィナ・ベルモンド
  role: 脇役
  age: 21
  gender: 女性
  appearance: 華やかな金髪と、常に煌びやかな宝石を身に纏った、帝都の社交界の花。
  personality: 野心的で計算高く、嘘を武器にして上流階級へと駆け上がる。一人称：あたくし
  speech_style: 非常に華やかで甘美な、社交界特有の美辞麗句を操る話し方。
  background: 新興貴族の娘。地位と名誉を確立するために、宮廷のルールと「嘘の技術」を完璧に習得した。
  motivation: 帝都の頂点に立ち、永遠の華やかさと権力を手に入れること。
  relationships:
  - name: エレーナ
    relation: 理解不能で、自分の生き方を脅かす恐ろしい存在
  arc: 嘘が一切通用しない極限状態に直面し、自らの生き方の脆さと、真実の価値に直面する。
