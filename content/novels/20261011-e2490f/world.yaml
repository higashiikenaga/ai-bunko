title: 真珠の涙と黄金の鉄路 ―嘘なき淑女の宮廷舞踏会―
genre: 歴史・時代小説
tone: 優雅で装飾的な宮廷ロマン
pov: 三人称
tense: 過去形
setting: 19世紀風の架空帝国アステリア。豪華絢爛な帝都の宮廷と、国境へと向かう至高の豪華列車。
premise: 虚飾と欺瞞が美徳とされる帝国宮廷で、ある貴族の令嬢は「嘘をつけない」という残酷な呪いに囚われていた。彼女が真実を口にするたびに、宮廷の権力争いは激化し、禁忌の恋に落ちた没落伯爵と共に陰謀の渦へと巻き込まれていく。帝都崩壊の足音が迫る中、彼女たちが辿り着くのは、希望か絶望か。すべてを捨てて逃れるための「最終列車」への切符を巡る、絢爛たる愛と闘争の物語。
themes:
- 真実と虚飾
- 運命的な愛
rules:
- 呪いの制約：主人公は意識的に嘘をつこうとすると激しい呼吸困難に陥り、身体から淡い金色の光が漏れ出すため、嘘をつくことが物理的に不可能である。
- 最終列車の定義：帝都から中立地帯へ向かう唯一の脱出手段であり、一度出発すれば二度と帝都へは戻れない不可逆的な旅である。
- 宮廷礼節：作法や衣装の不備は社会的な死を意味し、会話の端々に込められた比喩や暗号が権力の武器となる。
plot_outline:
- 序盤：帝都で最も華やかな春の舞踏会。呪いゆえに「不器用な淑女」として冷遇されていた令嬢エレーナが、謎めいた没落伯爵ジュリアンと出会い、互いの孤独に惹かれ合う。
- 中盤：エレーナの「嘘をつけない」性質が、皮肉にも宮廷内で巧妙に隠されていた反逆者の嘘を暴き出してしまう。彼女は政敵に狙われるが、ジュリアンの献身的な愛と機転により、帝都を揺るがす巨大な陰謀の核心に近づく。
- 終盤：革命の火の手が帝都に迫る中、最後の仮面舞踏会が開催される。エレーナは自らの呪いを逆手に取り、舞踏会の最中に反逆者の正体を白日の下に晒す。混乱の中、彼女たちは脱出のための唯一の手段である「最終列車」へと急ぐ。
- 結末：燃え上がる帝都を背に、最終列車は静かに旅立つ。虚飾のドレスを脱ぎ捨て、真実の愛を手にした二人は、名もなき地で新しい人生を歩み始める。
style_notes: シルクやレース、宝石のきらめきなど、衣装の素材感と色彩を極めて詳細に描写すること。舞踏会の旋律やシャンデリアの光が、登場人物の心理状態と共鳴するように装飾的な筆致で綴る。会話文は格式高く、含みを持たせた優雅な言い回しを徹底させる。
