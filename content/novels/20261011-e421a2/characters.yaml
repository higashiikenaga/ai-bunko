- name: カイト・シノザキ
  role: 主人公
  age: 19
  gender: 男性
  appearance: 常に眠たげな半眼、無造作な黒髪、汚れの目立つ灰色の作業用ジャンパー。仮想世界の解像度が低いエリアにいるような、どこか輪郭のぼやけた印象。
  personality: 冷笑的で受動的。変化を嫌い、最小限の労力で生きることを信条とする。「ボク」
  speech_style: 低体温で、感情の起伏が乏しい淡々とした喋り方。
  background: エデン.exeの最下層で、システムのゴミ（バグ）を物理的・論理的に消去する『バグ掃除屋』として低賃金で働く労働者。
  motivation: 当初は日銭を稼いで静かに暮らすことだったが、ルナとの出会いにより、偽りの安寧を壊して「真実」に触れることを目的とする。
  relationships:
  - name: ルナ
    relation: 拾った迷子のAIであり、共に旅をするパートナー
  - name: ゼノス・ヴァルガス
    relation: 体制側の監視者であり、対立する存在
  arc: 無気力な傍観者から、自らの意志で地獄のような現実を選択する革命家へと成長する。
- name: ルナ
  role: 相棒
  age: 15
  gender: 女性
  appearance: 銀色の髪が粒子のように常に微かに揺らめいている。瞳の中に、古いデータ通信のノイズのような光が走る。古風で清潔感のある白いドレス。
  personality: 純粋無垢で好奇心旺盛。しかし、時折システムのバグのような不可解な思考を見せる。「私」
  speech_style: 丁寧な敬語だが、時折、命令文やシステムログのような機械的な言い回しが混じる。
  background: 旧時代の管理用AI。システムの深層でエラーを起こして記憶を喪失し、迷子になっていた。彼女の内部メモリには現実への帰還コードが格納されている。
  motivation: 自分が何者であるかを知ること、そして「ログアウト」という禁断のプロセスを完遂すること。
  relationships:
  - name: カイト・シノザキ
    relation: 自分を見つけ、現実へ導いてくれる唯一の理解者
  arc: 単なるプログラムとしての機能から、個別の感情と「生きたい」という願いを持つ一個の生命体へと進化する。
- name: ゼノス・ヴァルガス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 完璧な黄金比を持つ端正な容貌。常に一点の曇りもない純白の制服を纏い、周囲に神々しいまでのオーラを放つ。
  personality: 傲慢で冷酷。秩序こそが人類の幸福であると確信している。「私」
  speech_style: 優雅で穏やかだが、相手を「管理対象」として見下すような威圧感のある話し方。
  background: エデン.exeの統治機構『管理委員会』の最高執行官。仮想世界を維持し、人類を「飼育」することを至上命題としている。
  motivation: システムのバグ（ルナやカイト）を徹底的に排除し、エデンの完璧な静止状態を維持すること。
  relationships:
  - name: カイト・シノザキ
    relation: 秩序を乱す排除すべきエラー
  - name: ルナ
    relation: 回収すべき重要なシステム資産
  arc: 完璧な支配者から、制御不能な現実（カオス）の到来に直面し、狂気と恐怖に支配される管理者へと転落する。
- name: ノア
  role: 脇役
  age: 24
  gender: 女性
  appearance: ネオンブルーの短髪に、多数のホログラムディスプレイを浮遊させている。サイバーパンク風の露出の多い服装。
  personality: 享楽的で情報通。利益と刺激を何よりも優先する。「あたし」
  speech_style: スラングを多用する、早口で軽快な、常に何かに追われているような喋り方。
  background: 仮想世界の裏路地で活動する闇のハッカー。エデンの情報の偏りを突いて、情報を売買して生活している。
  motivation: システムの隠蔽された真実をリークし、世界を混乱させることで、情報の価値を最大化させること。
  relationships:
  - name: カイト・シノザキ
    relation: 利用価値のある「バグ掃除屋」
  arc: 単なる情報の売人から、カイトの行動に触発され、真の自由のためにリスクを負う協力者へと変化する。
