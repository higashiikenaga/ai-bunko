title: '#楽園のバグと、砂まみれのWi-Fi'
genre: ディストピア
tone: ハイテンションでシニカル。デジタルネイティブな軽快さ
pov: 一人称（ボク）
tense: 現在形中心
setting: 全人類が意識をアップロードして暮らす仮想現実都市『エデン.exe』と、そのサーバーが置かれた現実の不毛な砂漠地帯
premise: 完璧な仮想世界で『バグ掃除屋』として低賃金で働くボクは、ある日、記憶を喪失して迷子になった旧時代の管理AIを拾う。彼女が提示した「ログアウトして現実へ帰る」という選択肢は、この世界の支配層にとって最大のタブーだった。砂に埋もれたサーバーを物理的に叩き壊すため、ボクらは仮想世界の中で最高にくだらない反逆を開始する。
themes:
- 仮想と現実の境界
- 管理社会への抵抗
- 不完全であることの価値
rules:
- 現実の肉体はポッドで維持されており、意識のみがエデンに接続されている
- エデン内での地位は『貢献ポイント』で決まり、低ポイント者は解像度が下げられる
- ログアウトの手順は政府によって隠蔽されており、試みることは『精神的自殺』として禁忌とされている
plot_outline:
- '序盤: バグ掃除屋のボクが、システム上のノイズのような迷子のAI『ルナ』と出会い、彼女が持つ『現実世界への地図』を巡って巻き込まれる。'
- '中盤: ルナと共にエデンの深層階層を探索し、この楽園が実は資源枯渇を隠すための巨大な飼育場であることを知る。ボクは匿名掲示板やライブ配信を通じて、市民に『外の世界』の存在をリークし始める。'
- '終盤: 政府の検閲官による大規模な『アカウント削除（物理的抹殺）』が始まり、逃げ場を失ったボクらは、仮想世界から現実のポッドへ強制的に意識を戻す禁断のプログラムを実行する。'
- '結末: 目覚めた現実の世界は、想像以上の地獄のような砂漠だった。けれど、そこにはルナが導いた本物の『砂漠のオアシス』があり、ボクらは不便で汚い、けれど自由な人生を歩み出す。'
style_notes: 一人称『ボク』によるメタ発言と激しいツッコミを多用。地の文に『（ここで絶望してほしい）』などの注釈を入れ、章の合間に【エデン内SNS：トレンド】や【匿名掲示板のレス】を挿入して、世界観の補完とコメディ要素を演出する。スピード感を出すため、あえて文章を短く切り、チャット形式の会話文を多用すること。
