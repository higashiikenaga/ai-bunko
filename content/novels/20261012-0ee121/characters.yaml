- name: 蓮 (レン)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 痩身だがしなやかな筋肉を持つ。前髪が長く、どこか影のある鋭い眼差し。使い古したバスケットシューズを大切に持っている。
  personality: 内向的で冷笑的。一人称は「俺」。かつての栄光に囚われ、自分に期待することを恐れているが、内側には誰よりも激しい情熱を秘めている。
  speech_style: ぶっきらぼうで口数が少ない。突き放すような言い方をするが、核心を突く言葉が多い。
  background: 中学時代は全国レベルの天才ガードとして名を馳せたが、ある試合での致命的なミスと挫折からバスケを捨て、ネオ・カシオペアの喧騒に逃げ込んでいた。
  motivation: 失った自信を取り戻し、もう一度だけ「心から熱くなれる瞬間」を味わいたい。
  relationships:
  - name: カイ
    relation: 対照的な性格ながら信頼し合う最高の相棒
  - name: 澪
    relation: 精神的な支えとなる戦略的パートナー
  - name: ゼオン
    relation: 絶望を突きつけた絶対的な壁であり、超えるべき宿敵
  arc: 自己否定の殻に閉じこもった状態から、仲間との絆を通じてトラウマを克服し、不夜城の頂点に立つ真のエースへと覚醒する。
- name: カイ
  role: 相棒
  age: 17
  gender: 男性
  appearance: オレンジ色の派手な髪にピアス。ストリートファッションを好み、常にエネルギッシュに動き回る。快活な笑顔が特徴。
  personality: 超ポジティブで直感的。一人称は「俺」。考えるより先に体が動くタイプで、チームのムードメーカー的存在。
  speech_style: 快活で騒がしい。「～じゃん！」「最高だな！」など、感情表現が豊かで勢いのある話し方。
  background: ストリートバスケに明け暮れる野生児。形式ばったバスケを嫌い、自由なプレイスタイルを追求している。オアシスのコートの主であり、蓮を強引に引き込んだ。
  motivation: 自分たちのストリートスタイルが、エリートたちのバスケよりも上であることを証明したい。
  relationships:
  - name: 蓮
    relation: 才能を認め、泥臭い情熱を伝染させようとする親友
  - name: 澪
    relation: 喧嘩ばかりしているが、戦術的な信頼を置く仲間
  arc: 単なる個人技の追求から、蓮や澪との連携による「チームとしての強さ」を学び、真のプレイヤーへと成長する。
- name: 澪 (ミオ)
  role: チームメイト
  age: 16
  gender: 女性
  appearance: 黒髪のボブカットに眼鏡。オーバーサイズのジャージを着用。冷静沈着な瞳をしており、常にタブレットでデータを分析している。
  personality: 理知的で現実主義。一人称は「私」。感情に流されず最適解を求めるが、実は誰よりも勝ちたいという執念が強い。
  speech_style: 丁寧だが淡々とした口調。皮肉屋な一面があり、「効率が悪すぎます」など論理的な指摘が多い。
  background: 元々は分析官としてチームをサポートしていたが、ある目的のために自らコートに立つことを決めた。コート上のチェスプレイヤーのような司令塔。
  motivation: 完璧な戦術によって、最強とされるゼオンのチームを論理的に崩壊させたい。
  relationships:
  - name: 蓮
    relation: 彼の潜在能力を数値的に信頼し、最大限に引き出そうとする戦略家
  - name: カイ
    relation: 制御不能な野生動物のように扱いながらも、その突破力を高く評価している
  arc: データや理論への依存を捨て、試合中の「直感」と「仲間への信頼」という不確定要素を受け入れることで、真の司令塔となる。
- name: ゼオン
  role: 敵役
  age: 18
  gender: 男性
  appearance: 長身で鍛え上げられた体躯。整った顔立ちに冷酷な笑みを浮かべている。高級感のある特注のバスケットウェアを纏う。
  personality: 傲慢で支配的。一人称は「私」。バスケを「強者が弱者を蹂躙するゲーム」と考えており、圧倒的な力で相手の心を折ることに快感を覚える。
  speech_style: 優雅で威圧的。相手を突き放すような丁寧語を使い、精神的な優位に立とうとする。
  background: ネオ・カシオペアの全コートを制覇した最強チームのリーダー。あらゆるプレイスタイルを解析し、完封する絶対的な実力を持つ。
  motivation: 自分の頂点を脅かす者が現れないことを確認し、不夜城の支配者として君臨し続けること。
  relationships:
  - name: 蓮
    relation: かつて絶望させた対象であり、再び自分を脅かす可能性を持つ唯一の獲物
  arc: 絶対的な強者として君臨していたが、蓮たちの不屈の精神に触れ、初めて「負ける恐怖」と「競い合う歓喜」を知る。
