title: フルコート・バースト
genre: スポーツ青春
tone: 汗と熱気が迸る、疾走感溢れる熱血スタイル
pov: 三人称
tense: 基本は過去形、試合シーンのみ現在形
setting: 24時間不夜城と化した巨大都市「ネオ・カシオペア」。コンクリートの砂漠のような街並みに潜む、秘密のストリートコート。
premise: かつて天才と呼ばれながら挫折し、バスケを捨てた少年・蓮が、眠らない街の片隅にある「オアシス」と呼ばれる伝説のコートに辿り着く。そこで出会った癖のある仲間たちと共に、街最強のチームに挑む3x3バスケットボールの物語。絶望の淵から這い上がり、再びボールを握る熱い魂のぶつかり合いを描く。
themes:
- 再起
- 絆
- 限界突破
rules:
- 試合は3x3形式のストリートルールを採用し、10分1本勝負とする
- 街のコートは『勝者が全てを奪う』弱肉強食の掟が存在する
- 身体能力を極限まで引き出すため、独自の呼吸法による集中状態（ゾーン）の描写を重視する
plot_outline:
- '序盤: 挫折し心を閉ざした蓮が、不夜城の喧騒の中で唯一静寂と情熱が同居する「オアシス」と呼ばれる隠れ家コートを見つけ、再びバスケに目覚める。'
- '中盤: 個性的なチームメイトと出会い、地区の勝ち抜き戦を勝ち進む。しかし、絶対的な壁となるライバルチームに完敗し、敗者の視点から「届かなかった指先」の絶望を深く味わい、さらなる特訓に励む。'
- '終盤: 都市最大の大会「ミッドナイト・クラッシュ」に出場。心拍数を限界まで上げた死闘の中で、仲間との信頼関係による完璧な連携を完成させる。'
- '結末: 試合終了直前の大逆転劇を演じ、蓮は自分自身のトラウマを完全に乗り越え、不夜城の頂点に立つ真のエースとして覚醒する。'
style_notes: 試合描写は「跳ぶ！」「叩き込む！」など動詞を強調し、実況のような速度感を出す。汗の飛沫、激しい心拍音、シューズが床を噛む摩擦音を具体的に描写し、読者の五感を刺激すること。特に、敗北した側の視点を丁寧に描き、その絶望があるからこそ勝利の快感が際立つ構成にする。
