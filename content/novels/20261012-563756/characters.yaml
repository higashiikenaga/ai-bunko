- name: 瀬戸 海斗
  role: 主人公
  age: 22
  gender: 男性
  appearance: 日焼けした肌と、潮風で少し跳ねた黒髪。海を見る瞳は真剣だが、どこか迷いを含んでいる。
  personality: 真面目で探究心が強いが、将来に対して漠然とした不安を抱えている。一人称：僕。
  speech_style: 基本的には穏やかで丁寧だが、追い詰められると少しぶっきらぼうになる。
  background: 凪ノ浦で生まれ育った青年。漁師を目指していたが、自分の進むべき道を見失いかけていた時に祖父の遺品を見つける。
  motivation: 祖父が遺した地図の謎を解き明かし、海底に眠る真実を知ること。
  relationships:
  - name: 瀬戸 源次
    relation: 祖父
  - name: 凪野 栞
    relation: 幼馴染
  arc: 受動的な村の若者から、海と歴史を受け継ぎ、自らの意志で灯台を守る決意をする灯台守へと成長する。
- name: 瀬戸 源次
  role: 導き手
  age: 75
  gender: 男性
  appearance: 深い皺が刻まれた顔と、使い込まれた手。引退しているが、背筋が伸びた威厳のある佇まい。
  personality: 寡黙で厳格だが、海への深い敬意と慈しみを持っている。一人称：俺。
  speech_style: 短く、重みのある言葉選び。言葉の端々に海への畏怖が滲む。
  background: 長年、凪ノ浦の灯台守を務めてきた伝説的な人物。村の歴史と海の秘密を知る最後の守護者。
  motivation: 海斗に、灯台の真の意味と、海と共に生きる覚悟を伝えること。
  relationships:
  - name: 瀬戸 海斗
    relation: 孫
  arc: 自身の知識と経験を、次世代である海斗へと繋ぐ役割を果たす。
- name: 凪野 栞
  role: 協力者
  age: 23
  gender: 女性
  appearance: 眼鏡をかけた知的な容貌。いつも古い文献や資料を抱えて、村の図書館にいる。
  personality: 冷静沈着で論理的。知識欲が旺盛で、一度興味を持つと徹底的に調べ上げる。一人称：私。
  speech_style: 丁寧で落ち着いた口調。情報の正確さを重んじる。
  background: 村の歴史を記録することに情熱を注ぐ司書。村に伝わる古い伝承の裏に隠された真実を探っている。
  motivation: 海底遺跡が持つ歴史的価値を解明し、正しく後世に伝えること。
  relationships:
  - name: 瀬戸 海斗
    relation: 幼馴染・協力者
  arc: 文献上の知識だった「歴史」が、海斗の行動によって「生きた真実」へと変わる瞬間に立ち会う。
- name: 橘 蓮
  role: 相棒
  age: 22
  gender: 男性
  appearance: 引き締まった体格。ダイビングスーツが似合う、快活な印象を与える青年。
  personality: 楽観的で行動力に溢れる。スリルを好むが、仲間への義理堅さも持つ。一人称：俺。
  speech_style: 威勢が良く、砕けた話し方。海斗を鼓舞するような明るいトーン。
  background: 地元のダイビングショップで働く青年。海斗とは幼馴染で、潜水技術に関しては村で一番の腕を持つ。
  motivation: 海斗と共に未知の領域へ潜り、新しい発見をすること。
  relationships:
  - name: 瀬戸 海斗
    relation: 親友
  arc: 単なる冒険の同行者から、海斗が背負う使命の重さを理解する理解者へと変わる。
