title: 凪の底の記憶、灯台の残響
genre: ヒューマンドラマ
tone: 哀愁漂う、静謐で情緒的な雰囲気
pov: 三人称
tense: 過去形
setting: 現代、潮の香りが色濃く残る入り江の小さな漁村「凪ノ浦」
premise: 引退した灯台守の老人・源次は、潮の満ち引きとともに変わる海辺の暮らしを静かに送っていた。ある嵐の翌日、潮が異常に引いた海底に、古の文明を思わせる海底遺跡の断片が姿を現す。村の若者である青年・海斗は、祖父の遺品の中に眠っていた「秘密の地図」を手に、その遺跡へと導かれていく。それは、失われた記憶と、海が守り続けてきた真実へと繋がる航路だった。
themes:
- 継承と忘却
- 自然との共生
rules:
- 潮の満ち引きが物語の進行（物理的・精神的）を支配する
- 海底遺跡の発見は、特定の天体条件と潮汐が重なる瞬間にのみ可能となる
plot_outline:
- '序盤: 潮騒と漁の音に囲まれた日常の中で、海斗が祖父の遺した古びた地図と、海底に沈む未知の構造物の存在を知る。'
- '中盤: 地図を頼りに潮の引きやすい時間帯を狙い、海斗は潜水して海底遺跡へと足を踏み入れる。そこで彼は、かつて村が海と共に生きていた時代の記録に触れる。'
- '終盤: 遺跡が崩壊の危機に瀕する中、源次は海斗に、灯台の光が守ってきたのは船だけでなく、海と人の絆であったことを伝える。'
- '結末: 遺跡は再び潮の底へと沈むが、海斗は地図を胸に、新たな灯台守としての歩みと、海との対話を始めていく。'
style_notes: 潮の満ち引きや波の音、灯台の明滅を、登場人物の感情の揺らぎと同期させるように描く。言葉の端々に潮の匂いや、船の軋む音を感じさせる比喩を用い、ゆったりとした、寄せては返す波のようなリズムを保つこと。
