- name: 九条 蓮 (クジョウ・レン)
  role: 主人公
  age: 32
  gender: 男性
  appearance: 鋭い眼光、情報のオーバーレイ表示が可能な銀色の義眼、常に黒いロングコートを着用。整ったがどこか無機質な容貌。
  personality: 冷徹な論理主義者。感情よりも情報の整合性を優先する。一人称は「僕」。
  speech_style: 無駄がなく、断定的な言い回し。相手の論理的な矛盾を指摘する際に声のトーンが低くなる。
  background: 元警視庁のデジタル鑑識官。ある事件で「真実」と「法」の乖離を経験し、現在はフリーランスの記憶監査人として活動している。
  motivation: 散らばった情報の欠落を埋め、論理的な整合性を完成させること。
  relationships:
  - name: 坂本 真介
    relation: 依頼人
  - name: リラ
    relation: 協力者（情報屋）
  - name: 有沢 海斗
    relation: ライバル（警察官）
  arc: 記憶を単なる「データ」として扱っていたが、事件を通じて、記憶が持つ残酷な重みと、人間の罪の不可逆性を理解していく。
- name: 坂本 真介 (サカモト・シンスケ)
  role: 敵役
  age: 48
  gender: 男性
  appearance: 高級なスーツを隙なく着こなす、洗練された富豪。整髪された髪と、常に穏やかな微笑を浮かべているが、目が笑っていない。
  personality: 支配的で計算高い。罪悪感を排除するために手段を選ばない。一人称は「私」。
  speech_style: 極めて丁寧な敬語。相手を尊重しているようでいて、常に一段高い視点からコントロールしようとする。
  background: 記憶抽出技術の最大手企業「メモリー・コア社」のCEO。社会的な地位と名声を完璧に構築している。
  motivation: 自分が犯した殺人の記憶を完全に消去（あるいは隠蔽）し、平穏な日常を取り戻すこと。
  relationships:
  - name: 九条 蓮
    relation: 依頼人として利用する対象
  arc: 完璧な隠蔽工作を試みるが、自ら雇った監査人の「論理」によって、自身の存在そのものが罪の証明であることを突きつけられる。
- name: リラ
  role: 相棒（情報屋）
  age: 24
  gender: 女性
  appearance: ネオンカラーの髪、多数の通信デバイスを装着した耳、ストリートファッション。小柄だが存在感が強い。
  personality: 現実主義的で享楽的。金と面白い情報には目がなく、裏社会のルールに精通している。一人称は「あたし」。
  speech_style: 早口で、スラングや技術用語を多用する。感情の起伏が激しく、茶化すような口調が多い。
  background: ネオ・カスケードのスラム街を拠点とする記憶ブローカー。違法な記憶の断片を扱うネットワークを持っている。
  motivation: 莫大な利益を得ることと、都市の底辺で生き残ること。
  relationships:
  - name: 九条 蓮
    relation: ビジネスパートナー兼、数少ない信頼を置く相手
  arc: 最初は金のために九条に協力していたが、事件の真相に触れるにつれ、論理の裏にある人間の醜悪さに恐怖を感じる。
- name: 有沢 海斗 (アリサワ・カイト)
  role: 脇役（ライバル）
  age: 35
  gender: 男性
  appearance: 使い古されたトレンチコート、常に疲労の色が濃い顔、無精髭。どこか古臭いスタイル。
  personality: 頑固で規律を重んじる。デジタル技術を過信せず、足を使った捜査を信条とする。一人称は「俺」。
  speech_style: ぶっきらぼうで荒っぽい。九条の論理的なアプローチを「冷たい」と批判する。
  background: ネオ・カスケード警察の刑事。九条の元同僚であり、現在の彼の活動を「グレーな領域」として監視している。
  motivation: 法に基づいた秩序の維持と、記憶操作による犯罪の根絶。
  relationships:
  - name: 九条 蓮
    relation: かつての同僚であり、現在の監視対象
  arc: 九条の論理的な証明が、法では辿り着けない真実を暴く場面に直面し、自身の信じる「正義」の限界を悟る。
