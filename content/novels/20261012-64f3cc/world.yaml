title: 論理的な欠落の証明
genre: サイバーパンク
tone: 冷徹、理詰め、皮肉な知性
pov: 三人称 (探偵役の思考を括弧書きで挿入)
tense: 過去形
setting: 記憶の抽出と売買が合法化された近未来都市「ネオ・カスケード」
premise: 記憶監査人の主人公が、「殺人の記憶を盗まれた」という矛盾した依頼を受ける。市場に散らばった断片的な記憶を論理的に再構成し、真犯人を追い詰める。しかし、その記憶の空白こそが、残酷な真実を指し示す唯一の手がかりであった。
themes:
- アイデンティティの不確かさ
- 論理と感情の乖離
rules:
- 記憶はデジタルデータとして抽出可能であり、抽出された箇所は『認知的な空白』となり、通常は偽の記憶で補完される
- 記憶売買市場では、体験の希少性と感情の純度によって価格が決定される
- 月食の間、都市の記憶管理サーバーに一時的な同期ズレが生じ、偽装されたデータタグが不可視状態から可視状態へと反転する
plot_outline:
- '序盤: 記憶監査人の主人公のもとに、ある富豪が「自分が犯したはずの殺人の記憶だけが盗まれた」という不可解な相談に訪れる。主人公は依頼人の記憶ログから、不自然な補完データの痕跡（手がかり）を発見する。'
- '中盤: 記憶市場のブローカーたちを訪ね、バラバラに転売された記憶の断片を回収する。取引相手との冷徹な論理戦を繰り広げながら、断片的な記憶を繋ぎ合わせることで、事件の輪郭を浮かび上がらせる。'
- '終盤: 月食の夜、サーバーの同期ズレを利用して、依頼人が隠蔽していた「記憶の空白」の真の形状を暴き出す。同時に、回収した断片が指し示す矛盾を突きつけ、犯人の正体を論理的に追い詰める。'
- '結末: 依頼人こそが犯人であり、罪悪感から逃れるために記憶を売り飛ばしたが、その行為自体が「自分が犯人であること」の動かぬ証拠となったことを証明し、彼を絶望の中へと突き落として幕を閉じる。'
style_notes: 理詰めで冷ややかな知性派の文体。感情的な記述を排し、事象を分析的に描写する。会話は皮肉と論理の応酬とし、探偵役の推論過程を（）を用いて挿入する。読者が推理できるよう、伏線となるデータや違和感を明示的に提示するフェアな構成とする。
