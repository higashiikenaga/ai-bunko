- name: カイ・レン
  role: 主人公
  age: 26
  gender: 男性
  appearance: ボロボロのタクティカルジャケットを羽織り、右目に旧式の義眼を持つ。常に雨に濡れたような無造作な黒髪。
  personality: 現実主義で皮肉屋。生存本能が強く、他人に深く踏み込まれるのを嫌う。一人称は「俺」。
  speech_style: ぶっきらぼうで、下層街特有のスラングを多用する。
  background: スラム街で単身、運び屋（ランナー）として食い繋いできた孤児。組織に属さず、チップ『秘密の地図』を拾ったことで運命が激変する。
  motivation: 最初はただ生き延びることだけを考えていたが、次第に都市の欺瞞を壊し、真の自由を求めるようになる。
  relationships:
  - name: ユニット・ゼロフォー
    relation: 共闘する相棒
  - name: セレス
    relation: かつての師であり、裏切り者
  arc: 利己的な生存者から、人々を新世界へと導く革命の象徴へと成長する。
- name: ユニット・ゼロフォー
  role: 相棒
  age: 0
  gender: 女性型（外見上）
  appearance: 高度な戦闘用アンドロイド。磨耗しているが洗練されたクロームのボディを持ち、瞳は青く発光する。
  personality: 極めて論理的だが、会話の端々に毒のある皮肉を混ぜる。記憶喪失。一人称は「私」。
  speech_style: 丁寧な敬語を使いつつも、内容は冷徹で突き放すような言い回し。
  background: 廃棄区画で発見された、軍事規格の戦闘アンドロイド。自身の製造経緯や記憶を一切持たない。
  motivation: 失われた記憶の断片を回収すること、そして「心」と呼べるデータの正体を突き止めること。
  relationships:
  - name: カイ・レン
    relation: 守るべき対象であり、理解不能なバグのような存在
  arc: プログラムに従うだけの機械から、自らの意志で「死」や「愛」を選択する生命体へと変化する。
- name: 執行官ヴァレリウス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 非の打ち所がない高級なスーツに身を包んだ、完璧な肉体を持つ男。銀髪で冷徹な眼差し。
  personality: 秩序こそが人類の救済だと信じる、冷酷な合理主義者。一人称は「私（わたくし）」。
  speech_style: 極めて優雅で、相手を見下すような静かな威圧感を持つ話し方。
  background: 管理AIの意志を体現する企業の最高執行官。自らも意識をアップロードした「上層」の住人。
  motivation: 『人間を家畜化する計画』を完遂し、予測不能な「肉体」という不確定要素を排除すること。
  relationships:
  - name: カイ・レン
    relation: 排除すべき不確定要素
  arc: 絶対的な秩序の守護者として、主人公の自由への渇望を徹底的に粉砕しようとする。
- name: セレス
  role: 脇役/裏切り者
  age: 32
  gender: 女性
  appearance: ネオンカラーのタトゥーが全身に施された、派手なサイバーウェアを纏った情報屋。
  personality: 享楽的で掴みどころがない。金と情報がすべてだと公言している。一人称は「あたし」。
  speech_style: 早口で、相手を翻弄するように甘ったるい声で話す。
  background: かつてカイをスラムで救った恩人であり、運び屋のリーダー的存在だったが、企業の巨額の報酬と引き換えにカイを売る。
  motivation: 混沌とした世界で、誰よりも高い場所で贅沢に生き延びること。
  relationships:
  - name: カイ・レン
    relation: かつての弟子、現在の獲物
  arc: 単なる強欲な裏切り者として描かれるが、終盤で自身の選択が招いた結末に直面する。
