title: ネオン・ストライク：境界線の亡霊たち
genre: サイバーパンク
tone: ハイテンションで疾走感のあるエンタメ調
pov: 三人称
tense: 過去形
setting: 絶え間なく雨が降り注ぐ超高層スラム街『層状都市カスケード』。物理的な肉体を捨て、意識をクラウドにアップロードした富裕層（上層）と、錆びついた義体で生き延びる労働者（下層）に分断された世界。
premise: 下層の運び屋（ランナー）である主人公が、ある日正体不明のチップ『秘密の地図』を回収する。そこには、全人類の意識を強制的に初期化し、真の自由を取り戻すための聖域へのルートが記されていた。街を支配する管理AIと企業軍に追われながら、彼は皮肉屋の戦闘アンドロイドと共に、電脳空間の最果てを目指す逃走劇に身を投じる。
themes:
- 管理社会への反逆
- 人間性の定義
rules:
- 意識のアップロードには膨大な維持費がかかり、支払えない者は『データ廃棄』として消去される。
- 電脳空間での死は、現実の脳への致命的なフィードバック（脳焼損）を意味する。
- 『渡り鳥』と呼ばれる特殊なデータパケットのみが、管理AIの監視を潜り抜けて層間を移動できる。
plot_outline:
- '序盤: 主人公が偶然手に入れたチップが、都市の根幹を揺るがす『秘密の地図』であることを知る。直後に企業軍の急襲を受け、廃棄区画で記憶喪失の戦闘アンドロイドと共闘し、間一髪で脱出する。'
- '中盤: 地図を解読するため、闇の電脳医や情報屋を渡り歩く。激しいカーチェイスと義体アクションを繰り広げながら、管理AIが隠し持っていた『人間を家畜化する計画』の全貌を暴いていく。'
- '終盤: 地図の目的地である最上層のサーバー室へ強行突破を図る。かつての仲間による裏切りと、最強の執行官との超高速バトルが展開され、主人公は絶体絶命の危機に陥る。'
- '結末: 意識の『大移動（マイグレーション）』を敢行し、都市の支配構造を破壊。人々を物理的な肉体と自由な意識が共存する新世界へと導き、主人公とアンドロイドは再び旅に出る。'
style_notes: 一文を短く切り、テンポを最優先する。アクションシーンでは状況説明を最小限にし、「撃つ」「跳ぶ」「斬る」といった動詞を畳み掛けて速度感を出す。キャラクター同士の軽妙な掛け合いで世界観を説明し、各話の結末は必ず絶望的な状況や衝撃的な新事実を提示して引きを作る。擬音語に頼らず、衝撃や速度を視覚的な描写（火花が散る、視界が歪む等）で表現する。
