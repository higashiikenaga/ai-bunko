- name: アリステア・ヴァレリウス
  role: 主人公
  age: 19
  gender: 男性
  appearance: 銀髪に透き通るような青い瞳。どこか世俗離れした儚げな美貌を持つが、古本屋の埃に塗れた生活の中で、静かな強さを瞳に宿している。
  personality: 思慮深く、穏やかだが、内面には強固な正義感を秘めている。一人称は「僕」。
  speech_style: 静かで丁寧な口調。感情を露わにすることは少ないが、真実を語る時は言葉に重みが増す。
  background: 帝国の正統な血を引く「もう一人の皇太子」として生まれたが、政情安定のために存在を抹消され、貧民街の古本屋で影として育てられた。
  motivation: 自らの存在を否定した帝国の真実を明らかにし、偽りのない世界を見ること。
  relationships:
  - name: エレーヌ・ド・クレルモン
    relation: 理解者であり、心を通わせるパートナー
  - name: ジュリアン・フォン・ルミエール
    relation: 宿命の対決相手であり、光と影の対照
  arc: 社会の片隅で息を潜めていた「影」から、自らの意志で真実を告発し、運命を切り拓く「人間」へと成長する。
- name: エレーヌ・ド・クレルモン
  role: 主人公/相棒
  age: 20
  gender: 女性
  appearance: 艶やかな黒髪を後ろでまとめ、意志の強さを感じさせる瞳を持つ。侍女の制服を完璧に着こなすが、瞳には没落貴族の気品が漂う。
  personality: 聡明で現実主義、非常に高い教養と精神力を持つ。一人称は「私」。
  speech_style: 宮廷仕込みの完璧な礼節を備えた話し方。しかし、アリステアに対してだけは親愛の情が滲む。
  background: かつて栄華を誇った貴族の娘。現在は宮廷の侍女として身を潜め、いつか再興する機会を伺いつつ、知性を磨き続けてきた。
  motivation: アリステアを導き、彼が真実を世に知らしめるための舞台を整えること。
  relationships:
  - name: アリステア・ヴァレリウス
    relation: 守るべき対象であり、共に自由を求める愛する人
  arc: 貴族としての復讐や再興という執着を捨て、愛する人と共に「自由」という新しい価値を見出す。
- name: ジュリアン・フォン・ルミエール
  role: 敵役
  age: 21
  gender: 男性
  appearance: 燃えるような金髪と、傲岸不遜な笑みを浮かべる端正な顔立ち。豪華絢爛な軍服を身に纏い、権力の象徴のような輝きを放つ。
  personality: 虚栄心が強く、支配欲が旺盛。完璧な皇太子を演じているが、その内面は孤独と恐怖に満ちている。一人称は「私（わたくし）」。
  speech_style: 優雅で高圧的。相手を見下すような含みを持たせた言い回しを好む。
  background: 現皇太子。アリステアの存在を知りつつも、自らの地位を脅かす「汚れ」として徹底的に抹消しようとしている。
  motivation: 自らの地位と、完璧に構築された帝国の秩序を維持すること。
  relationships:
  - name: アリステア・ヴァレリウス
    relation: 排除すべき存在であり、自らの正当性を脅かす影
  arc: 完璧な仮面を被り続けてきたが、真実の露呈によって自らが築いた虚飾の城が崩壊していく様を目の当たりにする。
- name: ヴィクトリーヌ・ヴァロワ
  role: 脇役/策謀家
  age: 32
  gender: 女性
  appearance: 常に扇を使い、鋭い眼光を隠すような微笑を絶やさない。洗練された装飾品を纏い、立ち居振る舞いから底知れぬ知性を感じさせる。
  personality: 冷徹な合理主義者で、政局をチェスの駒のように操る野心家。一人称は「私」。
  speech_style: 慇懃無礼。言葉の裏に常に計算された意図を忍ばせる。
  background: 帝国の有力な外交官。権力闘争の激化を予見し、影の皇太子を利用して現体制を転覆させ、新たな秩序の主導権を握ろうとしている。
  motivation: 混乱に乗じて、自らが帝国の新たな権力構造の頂点に立つこと。
  relationships:
  - name: アリステア・ヴァレリウス
    relation: 目的達成のための有用な駒
  - name: ジュリアン・フォン・ルミエール
    relation: 利用価値のある現体制の象徴
  arc: すべてを計算通りに進めようとするが、アリステアとエレーヌが選んだ「権力を捨てた結末」という予測不能な展開に翻弄される。
