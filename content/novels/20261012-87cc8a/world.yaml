title: 緋色の舞踏会と忘却の書架 ―双子の王冠、偽りの調べ―
genre: 群像劇
tone: 優雅で装飾的、華麗にして退廃的
pov: 三人称
tense: 過去形
setting: 19世紀風の架空の帝都ルミエール。美学と礼節が権力に直結する絶対王政の宮廷。
premise: 金箔に彩られた帝都の最深部、贅を尽くした宮廷の裏側には、歴史から抹消された「もう一人の皇太子」が存在していた。古本屋に身を潜める影の王子と、没落貴族の誇りを胸に秘めた侍女、そして野心を抱く外交官たちが、一夜の仮面舞踏会を舞台に交錯する。仮面の裏に隠された真実と、禁じられた恋が、帝国の運命を揺るがす壮大な円舞曲へと変わっていく。
themes:
- 真実のアイデンティティ
- 愛と権力の相克
- 美しき嘘
rules:
- 宮廷の社交界では、衣装の装飾や舞踏の作法がそのまま社会的な階級や権威として機能する
- 帝都の片隅にある古本屋は、禁書を扱う聖域であり、そこでの誓いは絶対的な秘密として守られる
- 年に一度の『永遠の仮面舞踏会』の間だけは、身分を問わず仮面の下の正体を隠して交流することが許される
plot_outline:
- '序盤: 帝都の貧民街にある古本屋に隠れ住む「影の皇太子」と、宮廷で冷遇されながらも知性を磨く侍女エレーヌが出会う。二人は古書に記された帝国の残酷な血統の秘密を共有し、密かに心を通わせていく。'
- '中盤: 帝国の権力闘争が激化し、現皇太子の不備を突いて政権を奪おうとする派閥が、影の王子の存在に気づく。エレーヌは彼を導き、最高の衣装と作法を授けることで、彼を「謎の貴族」として仮面舞踏会へ潜入させる計画を立てる。'
- '終盤: 絢爛豪華な舞踏会の夜。シルクとレースに包まれた貴族たちが踊る中、影の王子は正体を明かさぬまま現皇太子と対峙し、宮廷を揺るがす衝撃の告発を行う。陰謀が渦巻く中、エレーヌとの運命的なダンスが最高潮に達する。'
- '結末: 王座という呪縛を捨て、影の王子はエレーヌと共に自由な人生を選ぶ。帝国の権力構造は崩壊し、新たな時代の幕開けと共に、二人は古本屋の静寂の中へと消えていく。'
style_notes: 絹の光沢、宝石の煌めき、シャンデリアの陰影など、視覚的な豪華さを徹底して描写すること。比喩表現を多用し、舞踏会の情景は音楽が聞こえてくるようなリズム感のある装飾的な文章で綴る。人物の心理描写は、直接的な表現を避け、扇の使い方や視線の交錯といった優雅な所作を通じて暗示させる。
