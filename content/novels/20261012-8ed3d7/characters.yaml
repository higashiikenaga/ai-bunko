- name: エルノア・ヴェイル
  role: 主人公
  age: 24
  gender: 男性
  appearance: 透き通るような白い肌、盲目ゆえに焦点の合わない淡い灰色の瞳。常に古びた司書服を纏い、音を拾うための銀の杖を携えている。
  personality: 冷静沈着で思索的。知識への渇望よりも、世界の「違和感」に対する誠実さを重んじる。一人称は「私」。
  speech_style: 丁寧で穏やかだが、核心を突く際は一切の躊躇がない。
  background: 聖教団直属の禁書庫で、失われた歴史を整理する司書として生きてきた。ある日、禁じられた記憶の欠片に触れたことで視力を失ったが、代わりに世界の「音」と「記憶の残響」を感じ取る力を得た。
  motivation: 世界の断絶された記憶を繋ぎ合わせ、なぜ世界がこれほどまでに静かで空虚なのかという問いの答えを見つけること。
  relationships:
  - name: サイラス
    relation: 旅の同行者であり、地図の所有者
  - name: ヴァレリウス
    relation: 思想的に対立する宿敵
  arc: 知識を収集するだけの受動的な学者から、真実を抱えて世界を変革する能動的な開拓者へと成長する。
- name: サイラス・ヴァルト
  role: 相棒
  age: 31
  gender: 男性
  appearance: 屈強な体躯に無数の傷跡。全身の皮膚には、発光する幾何学模様の「天球の秘密地図」が刻まれている。使い込まれた旅装束を纏う。
  personality: 現実主義者で皮肉屋。しかし、一度交わした約束は死んでも守る義理堅さを持つ。一人称は「俺」。
  speech_style: 粗野でぶっきらぼう。短い言葉で状況を端的に伝える。
  background: かつて極寒の氷原を調査していた放浪の探検家。聖教団に「禁忌の知識を持つ者」として捕らえられ、身体に地図を刻み込まれた異端者。
  motivation: 自身の肌に刻まれた呪いのような地図を辿り果て、自分という存在が歴史の中で何を意味していたのかを知ること。
  relationships:
  - name: エルノア
    relation: 信頼を寄せる唯一の理解者
  arc: 孤独な生存主義者から、エルノアと共に「失われた未来」のために戦う戦士へと変化する。
- name: 枢機卿ヴァレリウス
  role: 敵役
  age: 58
  gender: 男性
  appearance: 聖教団の純白の法衣に身を包んだ、威厳ある老人。瞳には一切の濁りがなく、慈愛に満ちた微笑を絶やさない。
  personality: 徹底した功利主義者。「苦痛なき忘却」こそが人類への究極の救済であると信じて疑わない。一人称は「私（わたくし）」。
  speech_style: 極めて優雅で説得力があり、聞く者に「正しいこと」を説いていると思わせる聖歌のような響きを持つ。
  background: 聖教団の最高指導者。世界が一度滅びた際に、人々が絶望で自滅しないよう、記憶を管理して「偽りの楽園」を再構築した張本人。
  motivation: 真実がもたらす混乱を阻止し、人類が永遠に安らかな忘却の中で生き続ける秩序を維持すること。
  relationships:
  - name: エルノア
    relation: 秩序を乱す危険な異端者
  arc: 絶対的な正義として君臨していたが、エルノアが突きつける「痛みを伴う真実」によって、自らが築いた偽りの世界の崩壊を目の当たりにする。
- name: ライラ
  role: 脇役/キーパーソン
  age: 12
  gender: 女性
  appearance: 星屑を散りばめたような銀髪を持つ少女。実体があるようでないような、淡い光を纏っている。
  personality: 無邪気で好奇心旺盛。世界の記憶が結晶化する際に生じた「残響」のような存在。一人称は「ライラ」。
  speech_style: 幼いが、時折世界の理を言い当てるような、詩的で不可解な言葉を口にする。
  background: 失われた神代の記憶が結晶化した際に生まれた、意思を持つ記憶の結晶体。各地の遺構に潜んでいる。
  motivation: 凍りついた世界に、誰も見たことがない「本当の春」が来るのを見ること。
  relationships:
  - name: エルノア
    relation: 導き手であり、守るべき象徴
  arc: ただの現象としての存在から、人々の意志と結びつき、世界に記憶を還すための「触媒」としての役割を果たす。
