title: 聖刻の巡礼 ―凍てつく星の記憶と忘却の回廊―
genre: 伝奇
tone: 重厚、荘厳、神話的
pov: 三人称
tense: 過去形
setting: 記憶が物質化して結晶となる世界「エテルナ」。空に浮かぶ断絶された諸島と、その最底辺に広がる絶望の氷原。失われた神代の遺構が点在する時代。
premise: 神々が沈黙し、世界の記憶が断片的に失われた時代。盲目の司書である主人公は、ある囚人の皮膚に刻まれた「秘密の地図」を辿り、失われた歴史を回収する巡礼の旅に出る。辿り着いたのは、あらゆる絶望が凍結した究極の地「氷の城」。そこで彼は、世界が一度滅び、偽りの楽園として再構成されたという残酷な真実に直面する。
themes:
- 記憶の継承と喪失
- 運命への抗い
rules:
- 記憶は「星晶」として結晶化し、それを触媒にすることでのみ古の魔術を行使できる
- 「忘却病」にかかった者は自己の存在証明である記憶を失い、最終的に透明な灰となって消滅する
- 氷の城の内部では時間が凍結しており、死者であっても意識を保ったまま氷像として保存されている
plot_outline:
- '序盤: 盲目の司書エルノアが、禁書庫に幽閉されていた異端の旅人から、自らの肌に刻まれた「天球の秘密地図」を提示され、世界の真理を求める旅に同行することを決意する。'
- '中盤: 巡礼の道中、銀嶺の都ルミナリスや嘆きの海ヴォイドを巡り、各地に散らばる古の詩篇を収集。世界を統治する聖教団が記憶を独占し、都合の悪い歴史を抹消している陰謀を暴く。'
- '終盤: 北端の極寒地にある「氷の城」へ到達。城の最深部にある『始原の記憶』を解放することで、世界に真実の歴史を取り戻そうとするが、それは同時に心地よい忘却という救済を捨てることを意味していた。'
- '結末: 激しい葛藤の末、エルノアは全ての記憶を世界に還す道を選択する。人々は過去の悲劇という痛みを取り戻すが、同時に自らの意志で未来を歩む権利を手にし、凍てついた世界に新たな春が訪れる。'
style_notes: 竜胆 アルトの文体を厳守。格調高い三人称視点で、古語や詩的な比喩を多用して世界の重みを表現すること。特に地の文では、神話的なスケール感を持たせ、会話文では身分や性格に応じた厳格な口調の描き分けを行う。物語の節目に、作中に登場する架空の伝承や詩篇を引用し、歴史的奥行きを演出する。
