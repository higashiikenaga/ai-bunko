- name: 奏多・時雨
  role: 主人公
  age: 19
  gender: 男性
  appearance: 藍色の装束を纏い、壊れた懐中時計を大切に持つ、どこか儚げな青年。
  personality: 真面目で思慮深いが、変化を恐れる臆病な一面がある。一人称は「僕」。
  speech_style: 丁寧だが、芯の強さを感じさせる穏やかな口調。
  background: 季節が止まった停滞の村で、伝統的な結び師の家系に生まれるが、自身の力に迷いを感じていた。
  motivation: 止まった季節を動かし、人々の暮らしに正しい巡りを取り戻すこと。
  relationships:
  - name: シキ
    relation: 旅の相棒
  - name: 凪沙
    relation: 思想の対立者
  arc: 変化を恐れる臆病な青年から、別れという痛みを受け入れ、未来を紡ぐ覚悟を持つ者へ。
- name: シキ
  role: 相棒
  age: 10
  gender: 中性
  appearance: 季節の移ろいを感じさせる色彩豊かな髪を持つ、小さな子供のような姿。
  personality: 好奇心旺盛で無邪気だが、時折底知れない寂しさを漂わせる。一人称は「わたし」。
  speech_style: 幼いが、どこか古風で詩的な言い回し。
  background: 懐中時計と共に現れた、記憶を失った季節の神の欠片。
  motivation: 失った記憶を取り戻し、自分が何者であるかを知ること。
  relationships:
  - name: 奏多
    relation: 唯一の理解者
  arc: 自分が「死と別れ」を司る残酷な役割を持つことを知り、それでも世界を愛することを選ぶ。
- name: 凪沙
  role: 敵役
  age: 25
  gender: 女性
  appearance: 氷のような銀髪と、感情の読めない瞳を持つ、冷徹な美貌の女性。
  personality: 執着心が強く、変化を極端に嫌う。一人称は「私」。
  speech_style: 簡潔で、有無を言わせぬ威圧感のある話し方。
  background: 永遠に春が続く島を統治する守護者。かつて季節の巡りによって最愛の人を失い、時計を封印して時間を止めた。
  motivation: 世界から「終わり（死）」を排除し、永遠に変わらない美しい瞬間を維持すること。
  relationships:
  - name: 奏多
    relation: 秩序を壊す者
  - name: シキ
    relation: 忌むべき存在
  arc: 停滞がもたらす世界の腐敗を目の当たりにしながらも、失う恐怖から逃れられず、崩壊する秩序と共に消える。
