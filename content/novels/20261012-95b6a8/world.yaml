title: 八百万の刻を綴る、忘れじの灯台
genre: 異世界ファンタジー
tone: 静謐で優美な和風幻想譚
pov: 三人称
tense: 過去形
setting: 雲海に浮かぶ島々からなる世界。神々が「結び」という儀式で季節を移ろわせている時代。
premise: 季節を司る神との約束が途絶え、ある島では永遠に冬が続き、別の島では春が止まってしまった。若き結び師の青年は、異界の遺物である「壊れた懐中時計」を手に入れ、失われた時を取り戻す旅に出る。世界の果てに立つ「古い灯台」に辿り着いたとき、彼は神々が隠し続けた残酷で美しい真実を知ることになる。
themes:
- 喪失と受容
- 巡る季節の無常
rules:
- 季節の移ろいは、結び師が神に捧げる和歌によってのみ完結する
- 壊れた懐中時計は、持ち主の記憶と引き換えに『止まった時間』の中を歩くことを可能にする
- 灯台の灯火が消えた場所では、人々の記憶から特定の季節に関する想い出が消え去る
plot_outline:
- '序盤: 季節が止まった村で、結び師の青年が不思議な懐中時計を拾い、記憶を失った小さな神と出会う。'
- '中盤: 懐中時計の針を動かすため、各地の歪んだ季節を巡り、人々の心の澱を和歌に綴って浄化していく。'
- '終盤: 世界の果ての古い灯台へ到達。時計の正体が、かつて神が人間への愛ゆえに切り離した『死と別れの時間』であったことを知る。'
- '結末: 青年はあえて時計を完全に破壊し、別れのある正しい季節の巡りを世界に返す。灯台に最後の灯をともし、春の訪れと共に神を送り出す。'
style_notes: 大和言葉を多用し、ひらがなと漢字のバランスを整えた柔らかい語り口にする。章の節目や重要な場面では、情景を詠んだ和歌や俳句を挿入し、季節の色彩（桜の淡紅、紅葉の黄金など）を繊細に描写すること。
