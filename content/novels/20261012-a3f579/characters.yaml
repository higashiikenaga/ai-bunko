- name: 佐倉 湊 (サクラ ミナト)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 引き締まった体躯、鋭い眼光、短く刈り込んだ髪。陸上部時代からの爆発的な脚力を持つ。
  personality: 自信家で独善的、協調性に欠ける。一人称は「俺」。
  speech_style: ぶっきらぼうでストレート。相手を突き放すような言い方をすることが多い。
  background: 元陸上部のエース。周囲との衝突を繰り返し、居場所を失って退部した。個人の能力には絶対の自信がある。
  motivation: 自分の力だけでは届かない「頂点」を、誰かと分かち合う快感を知るため。
  relationships:
  - name: 瀬戸 海斗
    relation: 相棒・コンビ
  arc: 独りよがりの強さから、仲間を信頼し、互いのために力を振るう真の強さへと成長する。
- name: 瀬戸 海斗 (セト カイト)
  role: 相棒
  age: 17
  gender: 男性
  appearance: 細身だがしなやかな筋肉。少し長めの髪。どこか儚げな雰囲気を持つ。
  personality: 真面目で繊細、技術はあるがプレッシャーに弱い。一人称は「僕」。
  speech_style: 丁寧だが、追い詰められると早口になり、言葉が詰まる癖がある。
  background: ビーチバレーの経験者。技術は高いが、ミスを恐れるあまり決定的な場面で動けなくなる脆さがある。
  motivation: 自分を信じてくれる存在と共に、失敗を恐れずに最後まで戦い抜くこと。
  relationships:
  - name: 佐倉 湊
    relation: 相棒・コンビ
  arc: 精神的な脆さを克服し、湊の強さを支えるための「確信を持ったプレー」ができるようになる。
- name: 神崎 烈 (カンザキ レツ)
  role: 敵役
  age: 18
  gender: 男性
  appearance: 圧倒的な威圧感、日焼けした肌、彫刻のような筋肉。常に余裕のある笑みを浮かべている。
  personality: 冷酷な勝負師。勝利のためには手段を選ばず、圧倒的な実力で相手を屈服させる。一人称は「俺」。
  speech_style: 落ち着いていて、相手の弱点を突くような、静かだが威圧的な話し方。
  background: 全国大会王者チームのキャプテン。完璧なチームワークと、個々の圧倒的なスペックを兼ね備える。
  motivation: 自分たちの「完璧なビーチバレー」を証明し、挑戦者を蹂躙すること。
  relationships:
  - name: 佐倉 湊
    relation: 超えるべき壁
  arc: 湊たちの泥臭い成長と、想定外のコンビネーションを目の当たりにし、初めて「恐怖」を知る。
- name: 潮風 先生 (シオカゼ センセイ)
  role: 脇役
  age: 45
  gender: 男性
  appearance: 使い古されたサーフボードを抱えた、海風に吹かれた老人。深く刻まれた皺。
  personality: 飄々としていて掴みどころがないが、鋭い洞察力を持つ。一人称は「ワシ」。
  speech_style: 独特の訛りがあり、比喩表現を多用する教訓めいた話し方。
  background: 潮風町でかつてビーチバレーをプレーしていた元選手。今は灯台近くで静かに暮らしている。
  motivation: 二人の少年が砂の上で何を見つけるかを見守ること。
  relationships:
  - name: 佐倉 湊
    relation: 指導者・メンター
  - name: 瀬戸 海斗
    relation: 指導者・メンター
  arc: 二人の変化を通じて、かつて自分が置き去りにした情熱を再確認する。
