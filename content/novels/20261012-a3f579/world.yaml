title: 海岸線の咆哮
genre: スポーツ青春
tone: 熱血、疾走感、泥臭い臨場感
pov: 一人称（俺）
tense: 現在形（試合描写）と過去形（回想）の混在
setting: 現代、海沿いの地方都市「潮風町」
premise: 才能はあるが協調性に欠ける元陸上部の俺と、技術はあるが精神的に脆い少年が、ビーチバレーという未知の競技に出会う。砂の上でもがき、呼吸を合わせ、最高のコンビネーションを模索する。二人が目指すのは、全国の頂点。砂にまみれ、汗を流した日々が、最強の一撃へと変わる。
themes:
- 不器用な二人の信頼
- 反復練習による限界突破
rules:
- ビーチバレーの競技ルール（2対2、コートサイズ、ローテーション等）を厳守する
- 砂地という不安定な足場による体力の消耗と移動の困難さを物理的に描写する
plot_outline:
- '序盤: 陸上部を退部し居場所を失った俺が、海辺の古い灯台の下で一人練習に励む少年・海斗と出会い、ビーチバレーの世界へ引き込まれる。'
- '中盤: パワーはあるが制御不能な俺と、精密だが決定力に欠ける海斗。二人は灯台前の砂浜で、数千回のレシーブとトス練習という地獄の基礎トレーニングを積み重ね、次第に呼吸を合わせていく。'
- '終盤: 地域の祭りの夜、高鳴る鼓動の中で互いの覚悟を誓い合った二人は、全国大会の決勝戦へ進出。圧倒的な壁となる王者チームとの死闘が幕を開ける。'
- '結末: 限界まで追い込まれ、肺が焼けるような苦しみの中で、練習で叩き込んだ「究極のタイミング」が訪れる。俺の全力のスパイクが砂上のコートに突き刺さり、頂点を掴み取る。'
style_notes: 一人称「俺」で語る。試合描写は短文を多用してテンポを上げ、心拍数、荒い呼吸、飛び散る汗、足裏に感じる砂の熱さを執拗に描写すること。練習シーンは地道な反復描写を丁寧に描き、それが試合中の決定的な一瞬で回収される快感を演出する。
