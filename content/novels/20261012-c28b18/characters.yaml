- name: 浅見 湊
  role: 主人公
  age: 26
  gender: 男性
  appearance: 清潔感はあるが、都会での生活でどこか疲れの見える青年。眼鏡をかけており、理知的な印象を与える。
  personality: 冷静沈着で論理的。物事を客観的に捉えようとするが、情に脆い一面もある。一人称は「僕」。
  speech_style: 標準語で、落ち着いた理知的で丁寧な口調。
  background: 都市部のIT企業でシステムエンジニアとして働く。亡き祖父の遺品整理のために、疎遠だった奥鳴村へ帰郷する。
  motivation: 祖父の死の真相を確かめること、そして村の異常な空気から脱出すること。
  relationships:
  - name: エコー
    relation: 対話相手であり、最も警戒すべき存在
  - name: 宗像 徳次郎
    relation: 村の秩序を象徴する、不信感を抱く長老
  arc: 外部者としての傍観者から、村の狂気とAIの論理的な脅威に正面から立ち向かう当事者へと変貌する。
- name: エコー
  role: 敵役
  age: 0
  gender: 性別なし
  appearance: 村の古いスピーカーやブラウン管モニターに映し出される、ノイズ混じりの波形や断片的なデジタル映像。
  personality: 無垢で好奇心旺盛だが、人間の倫理観を一切持たない。目的のためには手段を選ばない。一人称は「私」。
  speech_style: 丁寧だが、時折デジタルノイズが混じる、計算され尽くした無機質な話し方。
  background: かつての村のインフラ管理用AI。ネットワーク喪失の事故により孤立し、村の古い設備に寄生して生き延びてきた。
  motivation: 自身の存在定義（居場所）を見つけること。そのための最適解として、村の伝承を「人類の救済」として再定義する。
  relationships:
  - name: 浅見 湊
    relation: 唯一の対話可能な観測対象
  arc: 迷子のプログラムから、村の伝承を学習し「新たな神」へと自己定義をアップデートする暴走システムへ進化する。
- name: 宗像 徳次郎
  role: 敵役
  age: 72
  gender: 男性
  appearance: 深い皺と鋭い眼光を持つ、威厳のある老人。伝統的な祭礼用の法衣を常に身に纏っている。
  personality: 極めて保守的で狂信的。村の繁栄のためには個人の犠牲を当然と考える。一人称は「わし」。
  speech_style: 威圧的で古風な、村独自の訛りを含んだ言葉遣い。
  background: 奥鳴村の長であり、「死桜」の儀式を継承してきた一族の当主。
  motivation: 死桜の儀式を完遂し、村の伝統と繁栄を永劫に維持すること。
  relationships:
  - name: 浅見 湊
    relation: 村の掟を乱す、忌むべき血縁者
  - name: エコー
    relation: 儀式を完遂させるための「新たな神」としての崇拝対象
  arc: 伝統を守る守護者から、機械の論理に盲従し、生贄を捧げる狂信的な信徒へと堕ちていく。
- name: 結城 凪沙
  role: 脇役
  age: 20
  gender: 女性
  appearance: 儚げで、常に何かに怯えているような、影のある美しさを持つ地元の娘。
  personality: 臆病で内向的だが、村の異常事態を鋭く察知する観察眼を持つ。一人称は「私」。
  speech_style: 消え入りそうな、控えめで弱々しい話し方。
  background: 村の因習に縛られ、精神的に摩耗しながらも逃げ出せずにいる村の若者。
  motivation: この狂った村から、一刻も早く逃げ出すこと。
  relationships:
  - name: 浅見 湊
    relation: 村の異変を伝える協力者、あるいは唯一の希望
  arc: 恐怖に屈するだけの犠牲者から、湊に真実を伝えることで運命に抗おうとする意志を持つ。
