- name: 星野 凪（ほしの なぎ）
  role: 主人公
  age: 17
  gender: 女性
  appearance: ショートヘアに、動きやすいオーバーオールと灯台の制服を合わせたスタイル。明るい瞳が特徴。
  personality: 元気で少しお節介、困っている人を見捨てられないお人好し。一人称は「あたし」。
  speech_style: 「～だよ！」「～じゃない？」といった、明るくハキハキとした口調。
  background: 代々、崖の上の灯台を守ってきた一族の末裔。ある日、地下に広大な図書館があることを偶然発見する。
  motivation: 地下図書館のレシピを再現し、訪れる人々に「味の記憶」による幸せを届けること。
  relationships:
  - name: 瀬戸 カイト
    relation: 最初の客であり、大切な友人
  - name: シオン
    relation: 図書館の謎を知る協力者
  arc: ただの「灯台管理人」から、物語と味覚を繋ぐ「地下図書館の守護者」へと精神的に成長する。
- name: 瀬戸 カイト（せと かいと）
  role: 相棒
  age: 14
  gender: 男性
  appearance: 少し癖のある柔らかい髪に、大きな瞳。いつもどこかお腹を空かせたような表情をしている。
  personality: 素直で感受性が強く、味覚が非常に鋭い。一人称は「僕」。
  speech_style: 「わあ、すごい！」「なんだか、懐かしい味がする……」といった、感嘆の多い話し方。
  background: 都会から海沿いの町へ引っ越してきたばかりの少年。食への執着の裏に、家族との思い出を忘れたくないという不安を抱えている。
  motivation: 美味しい料理を食べることで、自分の中に眠る大切な記憶を呼び起こすこと。
  relationships:
  - name: 星野 凪
    relation: 料理を作ってくれる頼れるお姉さん
  arc: 食べる喜びだけでなく、料理に込められた「誰かの想い」を理解し、受け止める強さを手に入れる。
- name: シオン
  role: 脇役（案内人）
  age: 25
  gender: 男性
  appearance: 銀色の長い髪に眼鏡をかけた、端正でミステリアスな風貌。落ち着いた色合いの司書服を着ている。
  personality: 冷静沈着で論理的。感情を表に出すことは少ないが、実は非常に情に厚い。一人称は「私」。
  speech_style: 「……それは、記録にありませんね」「レシピの調和が乱れています」といった、丁寧だが距離感のある口調。
  background: 地下図書館の管理を助ける謎の青年。図書館の歴史と、灯台の光がレシピに与える影響を熟知している。
  motivation: 地下図書館の秩序を守り、レシピの記憶が消滅するのを防ぐこと。
  relationships:
  - name: 星野 凪
    relation: 管理人の心得を教える師のような存在
  arc: 効率と記録を重視する「司書」から、凪と共に「心と味」を大切にする一人の人間へと変わっていく。
