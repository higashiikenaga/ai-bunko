title: 地下図書館のしあわせレシピ ―灯台の下、秘密のレシピとページめくる音―
genre: 日常ほのぼの
tone: 明るく軽快、食べ物の香りが漂うような温かい雰囲気
pov: 一人称（あたし）
tense: 現在形・過去形混在
setting: 現代、海沿いの崖の上にある古い灯台と、その地下に広がる不思議な地下図書館
premise: あたしは、崖の上にある古い灯台の管理人をしちゃってる、ちょっとだけお節介な女の子！でも、この灯台、実は地下に広大な『地下図書館』が隠されてるっていう、とんでもない場所だったの。そこには、かつて誰かが大切にしていた『味の記憶』を綴った古いレシピ本がたくさん並んでいて……。お腹を空かせた迷い人と一緒に、物語と料理を味わう、とっておきの毎日が始まるよ！
themes:
- 食を通じて繋がる心
- 本と記憶の温もり
rules:
- 地下図書館の本は、読んだ人の『最も幸せだった味の記憶』に反応して光る
- 灯台の明かりは、迷える本（本の内容が現実化しそうなもの）を落ち着かせる役割を持つ
- 地下図書館での食事は、本の物語に少しだけ影響を与える
plot_outline:
- '序盤: 灯台管理人として働くあたしが、地下に広大な図書館があることを発見し、最初の客としてやってきた食いしん坊な少年と出会う。'
- '中盤: 図書館で見つけた『黄金の蜂蜜パン』のレシピを再現するために、街の市場を駆け巡り、時には本の中の不思議な現象に振り回されながら料理を作る。'
- '終盤: 灯台の明かりが弱まり、図書館の本が混乱し始める中、あたしは『忘れられたレシピ』を完成させることで、図書館と灯台の絆を取り戻そうと奮闘する。'
- '結末: 完璧な料理が完成し、図書館は再び穏やかな静寂を取り戻す。今日もあたしは、美味しい香りと共に、新しい本とお客様を待っている！'
style_notes: 一人称「あたし」による、テンポのよいツッコミ混じりの語り。読者がお腹を空かせるような、シズル感たっぷりの食べ物描写を毎話必ず入れること。会話劇ではキャラクターの可愛げを前面に出し、一話ごとにクスッと笑える小さなエピソードを盛り込むこと。
