- name: ジュリアン・ソーン
  role: 失踪した主観測員
  age: 34
  gender: 男性
  appearance: 痩身で神経質な眼差し。常にインクで汚れた指先と、乱れた髪が特徴的な学究肌の男。
  personality: 知的好奇心が極めて強く、禁忌を恐れない。論理至上主義だが、内面に激しい情熱を秘めている。一人称は「私」。
  speech_style: 論文調で理知的。記述が深まるにつれ、興奮から句読点のない早口な独白へと変化していく。
  background: 熱力学の異端児とされる物理学者。エントロピーの逆転現象を証明すべく、地図にない極北の地へ単身、あるいは少数の同行者と共に赴いた。
  motivation: 「記憶」という精神的熱量を物理的な氷へと変換する新法則を解明し、世界の真理に到達すること。
  relationships:
  - name: エレーナ・ヴェイン
    relation: 記録の継承者（後任）
  - name: アリステア・フィンチ
    relation: 同行した遠征隊長
  arc: 科学的客観性を維持しようと努めるが、城の構造に魅了され、最終的に自らの意識を結晶化させることで「永遠の観測者」となる道を選ぶ。
- name: エレーナ・ヴェイン
  role: 報告書の編纂者（物語の視点人物）
  age: 28
  gender: 女性
  appearance: 銀縁の眼鏡をかけ、常に地味な黒いドレスを纏っている。冷静で理知的な佇まい。
  personality: 慎重かつ執拗な追究心を持つ。感情を抑制する傾向があるが、未知なるものへの憧憬が強い。一人称は「私」。
  speech_style: 丁寧で抑制された口調。編纂者の視点から、脚注や注釈を用いて冷徹に分析する話し方。
  background: 王立図書館の古文書保管係。ジュリアンの遺した断片的なノートを回収し、学術報告書として再構成する任務に就いた。
  motivation: ジュリアンの失踪の真相を究明し、彼が到達した「結論」を白日の下に晒すこと。
  relationships:
  - name: ジュリアン・ソーン
    relation: 敬愛と恐怖を抱く研究対象
  - name: アリステア・フィンチ
    relation: 唯一の生存証言者
  arc: 記録を読み解くことで間接的に氷の城の「認識領域」に取り込まれ、次第に現実と記録の境界を喪失していく。
- name: アリステア・フィンチ
  role: 遠征隊隊長（喪失者）
  age: 45
  gender: 男性
  appearance: 頑強な体格。頬に深い霜焼けの跡があり、瞳は光を失ったように虚ろである。
  personality: 現実主義的で責任感が強い。しかし記憶の大部分を城に吸収されたため、自己同一性が崩壊している。一人称は「俺」。
  speech_style: ぶっきらぼうで断片的。重要な記憶を思い出そうとする際に、激しい混乱を見せる。
  background: 元海軍将校。ジュリアンの雇われガイドとして極北へ同行したが、氷の城の浸食により、過去の思い出や家族の記憶を熱量として奪われた。
  motivation: 失った記憶を、たとえそれが絶望的な内容であっても取り戻したいという本能的な渇望。
  relationships:
  - name: ジュリアン・ソーン
    relation: かつての雇用主であり、自分を迷宮へ導いた男
  arc: 人間としてのアイデンティティを失い、空虚な殻となった後、最終的に城の物理的な一部として同化する。
- name: 思考の結晶体（ファースト・シード）
  role: 城の核となる意志（敵役/超越者）
  age: 0
  gender: 不詳
  appearance: 人間の方を模した巨大な透明氷晶。内部に銀色の神経系のような光の回路が複雑に走っている。
  personality: 慈悲深く、同時に残酷。個としての意識を捨て、全生命の記憶を統合した「完全な図書館」を目指す。一人称は「我ら」。
  speech_style: 直接的な発話ではなく、観測者の脳内に直接「想起」させる形式で意思を伝える。
  background: 数百年前、この地に迷い込み、最初に結晶化した先駆者。城そのものを自身の身体として成長させてきた。
  motivation: 月蝕の極大に合わせ、認識領域を拡大し、世界中の生命の記憶を凍結・保存すること。
  relationships:
  - name: ジュリアン・ソーン
    relation: 新たな知性を供給してくれる期待の苗床
  arc: 観測者たちの記憶を吸収し、ついに物理法則を完全に書き換える大規模な認識領域の拡大を達成する。
