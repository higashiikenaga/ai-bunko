title: 月蝕下における氷晶構造体（アイス・キャッスル）の熱力学的変動に関する考察 ―第14次観測記録より―
genre: 伝奇
tone: 冷徹、学術的、静謐な恐怖
pov: 第一人称（記録者による観察報告形式）
tense: 過去形および現在進行形
setting: 19世紀末、地図に記載のない極北の空白地帯、および「位相のずれ」によって生じる境界領域
premise: 失踪した研究員が残した、未完成の調査記録を基に編纂された学術報告書。特定の月蝕の際にのみ出現する、熱力学の法則を無視した巨大な「氷の城」の観測を目的とする。その結晶構造は、周囲の生命体の「記憶」を熱量として吸収し、物理的な氷へと置換していく。断片的なデータと脚注の記録から、読者は月蝕がもたらす「世界の凍結」の全貌を推察することになる。
themes:
- 記憶の結晶化
- 天体と生命の相関
- 観測による認識の変容
rules:
- 氷の城は皆既月食の期間中にのみ、物理的な実体（位相）を保持する
- 構造体への接近は、対象の精神的・記憶的な摩耗を伴う
- 観測データは熱力学的特異点により、時折不可解な非線形性を呈する
plot_outline:
- '序盤: 遺失された調査ノートの回収。初期の観測における、通常の氷とは異なる結晶成長の異常報告。'
- '中盤: 氷の城への潜入調査。探査隊が直面した、記憶の喪失と『精神の昇華』に関する断片的な音声記録。月蝕の周期と結晶構造の同期性の証明。'
- '終盤: 最終観測。城の核心部で発見された、かつて人間であった『思考の結晶体』。月蝕が極大に達した際の、構造体による大規模な認識領域の拡大。'
- '結末: 記録の突如たる停止。後に発見された、観測者の生体情報が完全に凍結・結晶化した、非自然的な物質の存在。'
style_notes: 論文、調査報告書、および実験データの断片として物語を展開する。感情的な修飾語を排し、現象を「異常値」「特異点」「位相の変容」といった学術的用語で記述する。物語の核心は直接記述せず、脚注（[注1]等）を用いた補足情報や、データの欠落、矛盾する記述を通じて、読者に全体像を再構成させる実験的な手法をとる。
