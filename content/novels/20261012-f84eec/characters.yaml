- name: エリアス・ヴァレンタイン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 青白い肌、精密な銀の懐中時計、煤一つない黒い調律師服を纏った痩身の男。
  personality: 潔癖で規律を重んじる完璧主義者。一人称は「私」。
  speech_style: 規則正しく、秒針の刻むリズムのような落ち着いた丁寧な口調。
  background: 無限の屋敷の調律師として、狂った時計と曇った鏡の維持を自身の存在意義としている。
  motivation: 世界の調和を完璧に保ち、静寂な秩序を維持すること。
  relationships:
  - name: 鏡の中の私
    relation: 鏡像の影であり、自己の抑圧された側面
  arc: 秩序の守護者から、自らが世界の部品であるという残酷な真実に直面する絶望的な反逆者へ。
- name: 鏡の中の私
  role: 敵役（誘惑者）
  age: 32
  gender: 男性
  appearance: エリアスと瓜二つだが、瞳の奥に砂漠の陽炎が揺らめき、常に不気味な微笑を湛えている。
  personality: 奔放で、既存の秩序を嘲笑う狂気的な好奇心を持つ。一人称は「僕」。
  speech_style: 囁くような、複数の声が重なった残響を伴う不自然な話し方。
  background: 鏡の裏側に澱んでいた、エリアスが人間であった頃の記憶や感情の具現。
  motivation: 鏡の境界を破壊し、エリアスを真実の砂漠へと引きずり出すこと。
  relationships:
  - name: エリアス・ヴァレンタイン
    relation: 抑圧された自我
  arc: エリアスの平穏な日常を侵食し、彼を破滅的な真実へと導く触媒となる。
- name: キャプテン・サイラス
  role: 敵役（象徴的脅威）
  age: 0
  gender: 男性
  appearance: 砂にまみれたボロボロの船長服。身体の半分が真鍮の歯車や時計の針に置換されている亡霊。
  personality: 虚無的で、感情が完全に摩耗しきっている。一人称は「我」。
  speech_style: 金属が擦れ合うような、低く掠れた不快な音を伴う話し方。
  background: かつての調律師。脱出を試みたが、空飛ぶ船の動力部品として組み込まれた。
  motivation: 新たな「部品（エリアス）」を回収し、船の運行を継続させること。
  relationships:
  - name: エリアス・ヴァレンタイン
    relation: 次なる部品の候補
  arc: エリアスに調律師の末路を突きつけ、逃れられない運命を象徴する存在として君臨する。
