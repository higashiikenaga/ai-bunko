title: 鏡面世界の調律師と、砂に溶ける空飛ぶ船
genre: ホラー
tone: 幻想的で不条理、静謐な狂気
pov: 一人称
tense: 現在形と過去形が混在
setting: 鏡と時計で構成された、終わりなき回廊を持つ無限の屋敷
premise: 私はこの屋敷の「調律師」として、狂った時計を直し、曇った鏡を磨き続けている。ある日、鏡の中の私が、私とは違うタイミングで微笑みかけ、扉の向こうにありえないはずの砂漠のオアシスが広がっていることに気づく。空飛ぶ船が屋根を突き抜けて降りてくる時、私が守ってきたこの世界の美しき論理は、残酷な正体へと塗り替えられていく。
themes:
- 自己の喪失
- 永劫回帰
rules:
- 鏡に映った自分と視線を合わせ続けると、意識の主客が入れ替わる
- 時計が逆回転を始めた時、部屋の構造と住人の記憶がランダムに再配置される
- 扉を開けるたびに、直前にいた部屋に関する記憶が一つずつ消滅する
plot_outline:
- '序盤: 調律師としての静かな日常。鏡と時計をメンテナンスしながら、世界の調和を維持することに快楽を覚える語り手の独白。'
- '中盤: 鏡の中の「自分」が独立して動き出し、語り手に禁忌の扉を開くよう誘惑する。扉の先には、渇きと静寂に満ちた砂漠のオアシスが広がっており、そこで語り手は自分が「人間であった頃」の断片的な記憶を思い出す。'
- '終盤: 記憶を回収するために「空飛ぶ船」が屋敷に接舷する。船の乗組員は、かつて調律師だったが精神を摩耗し、部品へと成り果てた亡霊たちだった。語り手は自分が人間ではなく、屋敷を維持するための「生きた部品」に過ぎないことを突きつけられる。'
- '結末: 全ての時計を同時に止めることで世界の崩壊を試みるが、鏡が割れた先に現れたのは、さらに巨大な時計の歯車の中にある、もう一つの鏡の回廊だった。'
style_notes: 意識の流れに沿って、論理的に破綻した比喩を多用する。「鏡」「時計」「扉」というモチーフを執拗に繰り返し、心地よい迷宮に閉じ込められたような感覚を演出する。美しさと不気味さが共存する、ねじれた叙述形式を用いる。
