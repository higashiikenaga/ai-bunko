title: 羽憑きの村
genre: 怪談・民俗
tone: 静謐で湿り気を帯びた、逃げ場のない土着的な恐怖
pov: 三人称
tense: 過去形
setting: 昭和後期、山深い閉鎖的な村「狭間村」
premise: 疎遠だった故郷の村へ戻った主人公が、屋根裏で見つけた「届かなかった手紙」をきっかけに、村に伝わる不気味な鳥の信仰に巻き込まれていく。渡り鳥が死者の罪を運び去るという言い伝えの裏には、生者を贄にする残酷な禁忌が隠されていた。静かに、しかし確実に追い詰められていく絶望を描く。
themes:
- 逃れられない血縁
- 因習の残酷さ
rules:
- 渡り鳥が村に到着した際、特定の儀式を怠ると死者の罪が生きている者に転嫁される
- 届かなかった手紙を口に出して読むことは、死者を呼び戻す儀式と同義となる
- 村の境界に巣食う鳥たちが、外の世界へ逃げようとする者の精神を蝕み、方向感覚を失わせる
plot_outline:
- '序盤: 主人公が実家の整理のために狭間村へ帰郷し、屋根裏で宛先不明の古びた手紙を発見する。'
- '中盤: 村人が渡り鳥に対して異常な敬意と恐怖を抱いていることに気づき、鳥に罪を託してやり過ごす「鳥送り」の風習と、その裏にある禁忌を知る。'
- '終盤: 手紙の内容が、かつて村から追放された者が遺した「警告」であったことが判明し、主人公が次の「罪を担う器」として村に囲い込まれる。'
- '結末: 逃げ場を失った主人公が、村の静寂の中で降り注ぐ無数の羽に飲み込まれ、自我を喪失して因習の一部となる。'
style_notes: 湿り気を帯びた情景描写を重視し、会話文には重々しい地方方言を交える。静寂と不協和音の対比を用い、逃げ場のない閉塞感を演出する。
