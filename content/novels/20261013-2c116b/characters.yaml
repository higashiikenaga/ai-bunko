- name: 源之丞
  role: 主人公
  age: 34
  gender: 男性
  appearance: 鋭い眼光だが、どこか虚脱感を漂わせる風貌。使い込まれた着物と、無数の戦いを感じさせる傷跡がある。
  personality: 寡黙で自虐的。過去の罪に苛まれており、生への執着を失いかけている。一人称は「俺」。
  speech_style: 低く、言葉数は極端に少ない。要件のみを短く伝える。
  background: かつて一門を皆殺しにしたという汚名を着せられ、あるいはその罪を背負い、逃亡を続けている浪人。
  motivation: 己の罪を清算すること、あるいは宿敵との決闘による死。
  relationships:
  - name: 葛城一真
    relation: 因縁の宿敵
  - name: お凛
    relation: 茶屋の主
  arc: 逃亡し続ける弱者から、己の運命と向き合い、最後の一撃にすべてを賭ける覚悟を決めた武士へと変化する。
- name: 葛城一真
  role: 敵役
  age: 35
  gender: 男性
  appearance: 雨の中でも乱れない端正な身なりと、冷徹なまでの美貌。隙のない立ち振る舞い。
  personality: 完璧主義で執念深い。正義の名の下に復讐を遂行しようとする。一人称は「私」。
  speech_style: 丁寧だが、相手を突き放すような冷ややかな敬語を使う。
  background: 源之丞と同じ門下であったが、事件の生き残り。源之丞を追って宿場町に現れる。
  motivation: 源之丞への復讐の完遂、および一門の汚名を雪ぐこと。
  relationships:
  - name: 源之丞
    relation: 宿敵
  - name: 佐藤権兵衛
    relation: 部下
  arc: 復讐にのみ燃える執念の追跡者から、一人の男として源之丞の覚悟に触れる対峙者へと変化する。
- name: お凛
  role: 脇役
  age: 28
  gender: 女性
  appearance: どこか浮世離れした透明感のある美しさ。雨音に溶け込むような静かな佇まい。
  personality: 穏やかで包容力があるが、どこか達観しており、底が知れない。一人称は「私」。
  speech_style: 静かでリズムのある、催眠的な話し方。謎めいた言い回しを好む。
  background: 雨の日だけ忽然と現れる不思議な茶屋の女主人。
  motivation: 彷徨える者たちに、嵐の間の束の間の安息を与えること。
  relationships:
  - name: 源之丞
    relation: 客
  - name: 葛城一真
    relation: 闖入者
  arc: 物語の観測者として、静かに運命の激突を見守り続ける。
- name: 佐藤権兵衛
  role: 脇役
  age: 45
  gender: 男性
  appearance: 屈強な体躯と、荒事慣れした鋭い眼光。威圧感のある佇まい。
  personality: 実直で武骨。葛城への忠誠心が極めて高い。一人称は「俺」。
  speech_style: 荒々しく、命令口調に近い。威圧的な響きを持つ。
  background: 葛城に仕える凄腕の追手。茶屋を包囲し、逃げ場を奪う役割を担う。
  motivation: 葛城の命に従い、源之丞を確実に捕縛すること。
  relationships:
  - name: 葛城一真
    relation: 主君
  arc: 心理戦の緊張感を高める、物理的な脅威としての役割を果たす。
