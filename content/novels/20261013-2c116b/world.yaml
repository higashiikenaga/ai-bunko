title: 雨断の太刀
genre: 歴史・時代小説
tone: 剛毅で峻烈。静寂と爆発の対比。
pov: 三人称
tense: 過去形
setting: 江戸時代中期、降りしきる雨の宿場町。
premise: 過去に一門を皆殺しにした罪を背負う浪人・源之丞。彼は雨の日だけ開くという怪しげな茶屋に身を寄せるが、そこへかつての因縁の相手が訪れる。降り止まぬ雨の中、生と死の境界線で、究極の一撃を交える男たちの物語。
themes:
- 贖罪
- 武士の矜持
rules:
- 雨の日だけ開く茶屋では、いかなる私闘も禁じられている。禁を破った者は店主の手によって即座に斬られる。
- 街を去る唯一の手段である「深夜の渡し船」は、一日に一度しか出ない（物語における最終列車の役割）。
plot_outline:
- '序盤: 逃亡を続ける源之丞が、豪雨の中で忽然と現れた「雨の日だけ開く店」に辿り着き、束の間の安息を得る。'
- '中盤: 店の周囲を包囲した追手たちとの静かな心理戦。雨音だけが響く中、抜刀の瞬間を待つ極限の緊張感が描かれる。'
- '終盤: 宿敵との一騎打ち。降りしきる雨が刃に弾かれ、一瞬の静寂の後に閃光が走る。一撃にすべてを賭けた立ち合い。'
- '結末: 決着後、源之丞は夜明け前の「最後の渡し船」に乗り込み、己の罪と共に静かに姿を消す。'
style_notes: 簡潔で力強い短文を重ねる。特に立ち合いの直前、雨音と心拍音のみが聞こえる静寂を執拗に描写し、一撃の瞬間に爆発的な速度感と迫力を出す。
