- name: 八五郎
  role: 主人公
  age: 28
  gender: 男性
  appearance: 日焼けした肌に逞しい体つき。常に動きやすそうな着流し姿で、手は仕事で荒れている。
  personality: ぶっきらぼうで口は悪いが、困っている人を見捨てられない情の厚い性格。一人称は「俺」。
  speech_style: 威勢の良いべらんめえ口調。「〜じゃねえか」「〜ってんだ」など。
  background: 深川の長屋で、日雇いの仕事をして暮らしている若者。
  motivation: 源三の孤独を放っておけず、長屋の賑やかさに彼を巻き込もうとする。
  relationships:
  - name: 源三
    relation: 世話を焼きたくなる隣人
  - name: お凛
    relation: 気心の知れた長屋の仲間
  arc: ただの世話焼きから、老人の心の機微を理解し、世代を超えた絆を築く理解者へと成長する。
- name: 源三
  role: 主要登場人物（物語の核）
  age: 68
  gender: 男性
  appearance: 痩身で背筋は伸びているが、どこか寂しげな眼差しを持つ老人。使い古された、しかし手入れされた着物を着ている。
  personality: 厳格でプライドが高く、他人との交流を避ける孤独な性格。一人称は「私（または拙者）」。
  speech_style: 丁寧だが、どこか突き放すような硬い言葉遣い。
  background: かつては武士であったが、ある事件（折れた剣にまつわる過去）を境に身分を捨て、長屋へ流れ着いた。
  motivation: 過去の悔恨から心を閉ざし、静かに人生の幕を閉じたいと考えている。
  relationships:
  - name: 八五郎
    relation: 強引に懐いてくる厄介な隣人
  arc: 過去の執着（折れた剣）を手放し、長屋の人々の温かさに触れることで、今を生きる喜びを取り戻す。
- name: お凛
  role: 脇役（ムードメーカー）
  age: 24
  gender: 女性
  appearance: 明るい表情と、いつも清潔にまとめられた髪。エプロンを締め、活発に動き回る姿が印象的。
  personality: 世話焼きで、長屋の人間関係を円滑にするムードメーカー。一人称は「あたし」。
  speech_style: 明るく、テンポの速い江戸娘らしい話し方。
  background: 長屋の住人で、小規模な惣菜屋を手伝いながら暮らしている。
  motivation: 長屋のみんなが仲良く、温かい食事を囲めるようにすること。
  relationships:
  - name: 八五郎
    relation: 腐れ縁の友人
  - name: 源三
    relation: 放っておけない困ったおじいさん
  arc: 源三の頑固さを、強引さではなく「食」と「賑やかさ」で溶かしていく役割を果たす。
- name: 熊助
  role: 脇役（子供）
  age: 8
  gender: 男性
  appearance: 泥汚れのついた着物を着た、元気いっぱいの少年。瞳がキラキラしている。
  personality: 好奇心旺盛で、遠慮を知らない天真爛漫な性格。一人称は「自分（または僕）」。
  speech_style: 子供らしく、素直で飾りのない言葉遣い。
  background: 長屋の住人の息子で、毎日路地裏を駆け回っている。
  motivation: 源三が持っている「折れた剣」に興味津々で、彼に近づこうとする。
  relationships:
  - name: 源三
    relation: 不思議なものを持っている怖いけれど気になるおじいさん
  - name: 八五郎
    relation: 頼りになる兄貴分
  arc: 子供特有の無邪気な問いかけを通じて、源三が自身の過去を語り始めるきっかけを作る。
