- name: カイ・ゼフィロス
  role: 主人公
  age: 17
  gender: 男性
  appearance: 風に乱れたアッシュブロンドの短髪に、飛行ゴーグルを首にかけている。使い込まれたフライトジャケットを愛用。
  personality: 直感的で楽観的。自由を愛し、困難な状況ほど燃え上がるタイプ。一人称は「俺」。
  speech_style: 快活で口調は軽い。興奮すると早口になる傾向がある。
  background: 辺境の浮遊島出身。正規の教育よりも独学と実戦で風の読み方を身につけた天才的な操縦センスを持つ。
  motivation: 伝説の「究極の風の道」を見つけ出し、世界の果てまで飛びたい。
  relationships:
  - name: ライラ・ノヴァ
    relation: 喧嘩仲間であり、絶大な信頼を寄せるナビゲーター
  - name: バスティアン・クロム
    relation: 操縦の師であり、精神的な支えとなる恩師
  arc: 単なる快楽主義的な飛行から、世界を背負う責任感を持つ真の操縦士へと成長する。
- name: ライラ・ノヴァ
  role: 相棒/技術担当
  age: 18
  gender: 女性
  appearance: 濃紺の長い髪を機能的に一本に結んでいる。知的な印象を与える銀縁眼鏡を着用。
  personality: 論理的で完璧主義。感情を出すのが苦手だが、根は情に厚い。一人称は「私」。
  speech_style: 丁寧だが、カイの無鉄砲さに対しては辛辣なツッコミを入れる。
  background: スカイ・アーク最高学府の重力制御工学専攻。理論上の「氷の城」の存在を証明しようとしていた研究者。
  motivation: 失われた古代の重力制御技術を解明し、浮遊島の不安定な環境を根本から改善すること。
  relationships:
  - name: カイ・ゼフィロス
    relation: 直感に頼る彼を呆れつつも、その才能に憧れている
  arc: 数式や理論だけでは到達できない「可能性」を信じ、直感的に行動する勇気を得る。
- name: バスティアン・クロム
  role: メンター/戦闘支援
  age: 42
  gender: 男性
  appearance: 頬に古い傷跡がある。頑強な体格で、使い古された重厚なレザーコートを纏っている。
  personality: 寡黙でストイック。経験に基づいた冷静な判断を下す。一人称は「俺」。
  speech_style: 低く威圧感があるが、言葉数は少なく、核心を突く言い方をする。
  background: 元・空軍最強の撃墜王。ある作戦で部下を失った過去があり、現在は隠居して整備士を営んでいた。
  motivation: 過去の贖罪として、次世代の若者たちが生き残れる世界を守ること。
  relationships:
  - name: カイ・ゼフィロス
    relation: かつての自分に似た危うさと才能を持つ弟子
  arc: 過去のトラウマによる絶望を乗り越え、再び空を飛ぶ誇りを取り戻す。
- name: エララ
  role: 鍵を握る重要人物
  age: 16
  gender: 女性
  appearance: 透き通るような白い肌と、月光のように輝く銀髪。氷の結晶のような装飾が施された白いドレスを纏う。
  personality: 儚げでミステリアス。外界への強い好奇心を持つ。一人称は「私」。
  speech_style: 静かで詩的な話し方。現代の言葉に不慣れなところがある。
  background: 氷の城の制御中枢で長い眠りについていた、古代の管理者の末裔。城の再起動に必要な生体認証を持つ。
  motivation: 氷の城を再び安定させ、自分が何のために生まれたのかというアイデンティティを探すこと。
  relationships:
  - name: カイ・ゼフィロス
    relation: 自分を闇から救い出した、光のような存在
  arc: 孤独な管理者の運命を受け入れるのではなく、友人たちと共に生きるという選択をする。
