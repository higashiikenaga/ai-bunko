- name: レイ・カミシロ
  role: 主人公
  age: 32
  gender: 男性
  appearance: 鋭い目元に、無重力適応による引き締まった体躯。宇宙線の影響で左腕の皮膚が微かに青く発光している。
  personality: 冷静沈着で知的好奇心が旺盛だが、どこか死生観が達観している。一人称は「私」。
  speech_style: 論理的かつ簡潔。感情をあまり表に出さず、淡々と事実を述べる。
  background: 元・宇宙物理学の特異点航行主任。タイタン・コア観測計画の生き残りであり、自身の過去のトラウマを払拭するために危険な任務に志願した。
  motivation: 中性子星の重力圏に隠された構造体の謎を解き明かし、人類の科学的フロンティアを切り拓くこと。
  relationships:
  - name: エレーナ・ヴォルコワ
    relation: 信頼する相棒
  - name: カイン・アベル
    relation: 対立するかつての同僚
  arc: 最初は個人の好奇心と過去の贖罪のために動いていたが、極限の重力世界を経て、未来の人類へ命を繋ぐ選択をする。
- name: エレーナ・ヴォルコワ
  role: 相棒
  age: 29
  gender: 女性
  appearance: 赤みがかったショートヘアに、機械工学のインプラントが組み込まれた右目。実用的な作業服を常に着用している。
  personality: 情熱的で直感的。機械への愛着が深く、ピンチでも冗談を忘れないタフな性格。一人称は「私」または「アタシ」。
  speech_style: フランクで歯に衣着せぬ物言い。技術的な議論になると熱くなる。
  background: 天才的な量子工学者。過去にブラックホール近傍での航行事故で肉体の一部を失い、サイボーグ化している。
  motivation: 未知の人工物から回収された量子航路のデータを解析し、安全な生還ルートを確保すること。
  relationships:
  - name: レイ・カミシロ
    relation: 信頼するバディ
  arc: 論理を重視するレイと衝突しながらも、人間の意志の強さを信じるようになり、共に特異点への突入を決意する。
- name: カイン・アベル
  role: 敵役
  age: 45
  gender: 男性
  appearance: 整えられた白髪に、冷徹な目を隠すための度入りスマートグラス。常に隙のないスーツを着込んでいる。
  personality: 権威主義的で目的のためなら手段を選ばない。冷酷なリアリスト。一人称は「私」。
  speech_style: 丁寧だが威圧的で、相手を心理的に追い詰めるような皮肉交じりの口調。
  background: 巨大エネルギー企業の最高幹部。タイタン・コアの重力エネルギーを私物化し、時空航行の独占を企んでいる。
  motivation: 「約束の丘」の異次元座標を手に入れ、時空を支配する究極の富と権力を得るため、レイたちの前に立ちはだかる。
  relationships:
  - name: レイ・カミシロ
    relation: かつての同僚であり、現在は排除すべき障害
  arc: 自身の欲望のために重力崩壊の脅威を軽視し続けた結果、自然の圧倒的な力の前に飲み込まれていく。
