- name: 如月 澪
  role: 主人公
  age: 17
  gender: 女性
  appearance: 黒髪のロングヘアだが、仮想空間では風に揺れやすい淡い青色のアクセントが入る。いつもどこか遠くを見つめているような虚ろな瞳。
  personality: 現実世界では無口で空虚感を抱えているが、仮想空間では意志の強い一面を見せる。一人称は「私」。
  speech_style: 静かで淡々としているが、感情が揺れ動くときは少し早口になる。
  background: 地方都市の高校に通うが、周囲の人間関係に馴染めず、現実逃避するように超大規模仮想空間「スカイ・エデン」に没頭している。
  motivation: 「スカイ・エデン」で出会ったハルと共に世界の果てへ辿り着き、彼の存在を守り抜くこと。
  relationships:
  - name: ハル
    relation: 運命的な出会いを果たす仮想世界の少年
  arc: 現実の空虚さに囚われていたが、ハルとの出会いと別れを通じて、痛みや喪失を抱えながらも自分の足で現実を生きる強さを得る。
- name: ハル
  role: 相棒
  age: 17
  gender: 男性
  appearance: 透明感のある銀髪に、空色のラフなパイロットスーツ。笑うとどこか切なさを感じさせる、実体感の薄い少年。
  personality: 自由奔放で好奇心旺盛、時折見せる表情に深い哀愁が漂う。一人称は「僕」。
  speech_style: 風のように軽やかで、少し謎めいた詩的な言い回しをする。
  background: システムログに存在しないはずのバグであり、実際はサーバーの深層に漂う「かつてのプレイヤーの残滓」。
  motivation: システムから排除される運命に抗い、澪と過ごす一瞬の時間を大切にしながら世界の果てを目指す。
  relationships:
  - name: 如月 澪
    relation: 心を同期させた現実世界の少女
  arc: 自身の消滅を受け入れつつ、澪の心の中に永遠の「同期しない記憶」として刻まれることを選ぶ。
- name: 橘 蓮
  role: 脇役
  age: 17
  gender: 男性
  appearance: 整った顔立ちで、現実でも仮想でも常に洗練されたアバターや服装を好む。
  personality: 現実的で冷静沈着。澪の数少ない理解者であり、彼女を心配している。一人称は「俺」。
  speech_style: 合理的で歯に衣着せぬ物言いだが、どこか面倒見が良い。
  background: 澪と同じ高校に通う幼馴染であり、現実世界での孤立しがちな彼女を気にかけている。
  motivation: 澪が仮想世界に溺れて現実から逃避し続けるのを防ぎ、現実世界へと連れ戻すこと。
  relationships:
  - name: 如月 澪
    relation: 心配性な幼馴染
  arc: 澪の秘密に気づきながらも、彼女が失意から立ち直る過程を現実側からそっと支える。
