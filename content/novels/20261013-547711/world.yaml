title: 碧落の揺らぎ、同期しない僕らの境界
genre: 青春恋愛
tone: 透明感のある切なさと、デジタルな疾走感
pov: 三人称
tense: 過去形
setting: 近未来の地方都市と、超大規模仮想空間「スカイ・エデン」
premise: 巨大仮想空間「スカイ・エデン」では、プレイヤーたちは空飛ぶ船を操り、渡り鳥のように季節の風を追って空を旅している。現実世界で空虚な日々を過ごす女子高生・澪は、そこでシステムログに存在しないはずの少年・ハルと出会う。定期メンテナンスによる「世界の再構築」が迫る中、エラーとして排除されようとする彼と、現実と仮想の境界で揺れ動く、一瞬の恋の物語。
themes:
- 現実と仮想の境界線
- 失われることへの抵抗と受容
rules:
- 「スカイ・エデン」の定期メンテナンス時、システムログに未登録のデータは『ノイズ』として自動削除される
- プレイヤーの感情負荷が一定値を超えると、アバターに視覚的なバグ（ノイズ）が発生する
- 空飛ぶ船の航路は、プレイヤーの滞在密度（熱量）によってリアルタイムに生成される
plot_outline:
- '序盤: 現実の静かな生活に馴染めない澪は、仮想世界で空飛ぶ船の操縦に没頭している。ある日、季節の渡り鳥の群れと共に、システムの監視を逃れて飛翔する少年・ハルと出会い、予期せぬ同期（シンクロ）を経験する。'
- '中盤: 二人は世界の果てを目指して、雲海を越える旅に出る。仮想空間での鮮烈な高揚感に比べ、現実の景色はひどく色褪せて見える。澪はハルを現実へと引き戻そうとするが、彼がサーバーの深層に漂う「かつてのプレイヤーの残滓」であることを知る。'
- '終盤: 大型アップデート「大いなる渡り」の告知。それはシステムの最適化を意味し、ハルという存在の完全消去を意味していた。システムによる強制削除が始まる中、澪は彼を消さないために、自身の意識を仮想世界へ深く沈める決断をする。'
- '結末: ハルは消え、澪は再び静かな現実へと戻る。しかし、彼女の視界の端には、時折プログラムの欠片のような光が渡り鳥の姿となって舞う。それは、二人が確かにそこにいたという、同期しない記憶の証だった。'
style_notes: '仮想空間の場面では、速度感のある短い文章と、色彩豊かな語彙を用いて情報の密度を高める。現実の場面では、湿り気や温度を感じさせる静謐で叙情的な長文を用いる。感情の昂りやシステムの干渉が発生する瞬間には、`[SYSTEM:
  ERROR_DETECTED]` や `[SYSTEM: SYNC_COMPLETE]` といったシステムメッセージを挿入し、読者に現実と仮想の断絶を意識させる。'
