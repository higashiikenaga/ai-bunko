- name: 霧島 蒼
  role: 主人公
  age: 21
  gender: 男性
  appearance: 引き締まった細身の体躯。無駄な脂肪のない筋肉と、日焼けした肌。常にどこか遠くを見つめているような虚ろで鋭い眼差し。
  personality: 内省的で完璧主義。他者の期待に応えようとするあまり自己を追い詰めやすい。一人称は「私」。
  speech_style: 口数は少なく、簡潔かつ論理的。自分自身の心拍数やラップタイムを例えに出す癖がある。
  background: 大学陸上界のエース長距離ランナーとして期待されていたが、昨年のインカレ以降、記録が伸び悩み深刻なスランプに陥っている。
  motivation: 失った自信を取り戻し、自分の走る意味を見つけ出すこと。
  relationships:
  - name: 陣内 宗一
    relation: 恩師・コーチ
  - name: 神崎 響
    relation: ライバル
  arc: 数字や他者の評価に縛られていた状態から脱却し、自分の呼吸と身体感覚を信じる強さを手に入れる。
- name: 陣内 宗一
  role: 脇役（コーチ）
  age: 52
  gender: 男性
  appearance: 白髪混じりの短髪に浅黒い肌。年齢を感じさせない引き締まった体型で、古びたストップウォッチを常に手首に下げている。
  personality: 寡黙だが情が厚い。選手の本質を見抜く洞察力を持ち、強引な指導ではなく環境を用意することで選手を導く。
  speech_style: 低い声でボソボソと話す。含みのある短い言葉が多い。
  background: かつてはオリンピック代表候補だった元マラソンランナー。度重なる怪我で引退後、指導者の道へ進んだ。
  motivation: 霧島が自らの殻を破り、再び純粋に走る悦びを取り戻すのを手助けすること。
  relationships:
  - name: 霧島 蒼
    relation: 指導する教え子
  arc: 霧島をあえて過酷な環境に放り込み、見守ることで彼の精神的自立を促す。
- name: 神崎 響
  role: 敵役（ライバル）
  age: 21
  gender: 男性
  appearance: しなやかでバネのある筋肉を持つ長身のランナー。常に自信に満ちた佇まいと、洗練されたユニフォームの着こなし。
  personality: 野心的で勝気。走ることに対して常に貪欲で、妥協を許さない。
  speech_style: ハキハキとした明快な口調。相手を挑発するような余裕のある言い回しをする。
  background: 霧島と同期であり、近年急速に頭角を現した新星。現在の長距離界のトップランナー。
  motivation: 全盛期の霧島を打ち破り、真の王座を完全に自分のものにすること。
  relationships:
  - name: 霧島 蒼
    relation: ライバル・意識している存在
  arc: スランプから復活した霧島と全国選手権の終盤で激しい競り合いを展開し、互いを高め合う存在となる。
