title: 呼吸の深度
genre: スポーツ青春
tone: 内省的で静謐。身体感覚と数字への執着。
pov: 一人称（私）
tense: 過去形
setting: 現代。山間部のトレーニングセンターおよび地方都市の競技場。
premise: 10,000m走の選手である「私」は、深刻なスランプに陥り、地図から消えた廃村が点在する山岳地帯へ合宿に向かう。孤独な走行の中で、身体の軋みと心拍数という数字だけを頼りに、自分自身の限界と対峙する。月食の夜、闇に包まれたコースで「私」は失った自信と、走ることの根源的な意味を見出す。
themes:
- 孤独の受容
- 自己超越
rules:
- 走る速度、心拍数、ラップタイムなどの具体的な数値が精神状態の指標として機能する
- 廃村の伝承は精神的な比喩として扱い、超常現象は発生させない
plot_outline:
- 序盤：記録が停滞し、周囲の期待に押し潰されそうになった「私」が、コーチの勧めで人里離れた山岳トレーニングセンターへ移る。
- 中盤：ダム建設で水没し、地図から消えた村の跡地を巡る過酷なトレイルルートを走り込み、肉体的な限界と、誰にも理解されない孤独に追い詰められる。
- 終盤：合宿最終日の夜、月食が起こり辺りが深い闇に包まれる。視界を奪われた状況で、心拍数と呼吸の音だけを指標にした全力疾走を行い、数字を超えた「身体の直感」を取り戻す。
- 結末：全国選手権に出場。ライバルとの競り合いの中で、かつての数字への強迫観念を捨て、自分の呼吸と対話しながら自己ベストを更新し、ゴールテープを切る。
style_notes: 心拍数（BPM）やラップタイム（秒単位）を具体的に記述し、肺の焼ける感覚や足裏の接地感など、身体の内部感覚を詳細な独白として描写すること。
