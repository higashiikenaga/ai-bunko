- name: カイト
  role: 主人公
  age: 15
  gender: 男性
  appearance: 赤みがかった逆立った髪に、鋭い意志を宿した瞳。ボロボロのパイロットスーツを着用している。
  personality: 直情的で情熱的。考えるより先に体が動くタイプ。一人称は「俺」。
  speech_style: ぶっきらぼうだが、心根は優しい。語尾に力がこもる少年らしい口調。
  background: 幼い頃に災厄獣の襲撃で家族を失い、双子の弟リクと共にネオ・エデンの孤児院で育った。
  motivation: 弟のリクと街の人々を絶対に守り抜き、災厄獣をこの世から一掃すること。
  relationships:
  - name: リク
    relation: 双子の弟であり、唯一無二の共鳴パートナー
  - name: ゼファー
    relation: 怪しげだが頼りになる武器屋の店主
  arc: 一人で全てを背負おうとする孤独な強さを捨て、リクとの真の信頼による「共鳴」の意味を理解し、精神的に成長する。
- name: リク
  role: 主人公/相棒
  age: 15
  gender: 男性
  appearance: 青みがかったストレートの髪に、知的な眼鏡をかけている。線が細く、静かな佇まい。
  personality: 冷静沈着で分析的。慎重派であり、カイトの暴走を止めるブレーキ役。一人称は「僕」。
  speech_style: 丁寧で論理的。状況を客観的に説明する傾向がある。
  background: カイトと共に育った双子の弟。轟天機の理論的な運用方法や重力制御技術に深い造詣を持つ。
  motivation: 戦いの連鎖を止めるための真実を突き止めること、そして兄のカイトを支えること。
  relationships:
  - name: カイト
    relation: 双子の兄であり、魂の片割れ
  - name: ゼファー
    relation: 技術的な好奇心を刺激し合う関係
  arc: 臆病さと慎重さという殻を破り、理屈を超えた感情でカイトと繋がることで、禁断の合体を完遂させる勇気を得る。
- name: ゼファー
  role: 脇役/導き手
  age: 35
  gender: 男性
  appearance: 長いコートに深い帽子を被り、常に煙管をくゆらせている。年齢不詳で掴み所のない笑みを浮かべている。
  personality: 飄々としており、食えない性格。運命論を好むが、実は情に厚い。一人称は「私」。
  speech_style: なぞなぞのような比喩表現が多く、相手を煙に巻く話し方。
  background: 雨の日だけ現れる「雷鳴の隠れ家」の店主。かつて轟天機の開発に関わっていた禁忌の技術者とされる人物。
  motivation: 運命に抗う双子の少年たちが、宇宙の理を塗り替える瞬間を目撃すること。
  relationships:
  - name: カイト
    relation: 才能ある若きパイロットとしての期待
  - name: リク
    relation: 知的な対話相手としての興味
  arc: 傍観者の立場から、少年たちの純粋な絆に心を動かされ、最後には彼らが勝利するための決定的な鍵を提示する。
- name: セレーネ司令官
  role: 脇役/指導者
  age: 32
  gender: 女性
  appearance: 銀髪をタイトにまとめ、隙のない軍服を纏っている。頬に古い傷跡がある。
  personality: 厳格で現実主義。都市の生存を最優先に考えるため、非情な決断も辞さない。一人称は「私」。
  speech_style: 断定的で簡潔。命令口調が基本だが、信頼した相手には僅かに柔らかくなる。
  background: ネオ・エデンの防衛軍最高責任者。かつての災厄獣襲撃で多くの部下を失った過去を持つ。
  motivation: いかなる犠牲を払っても、人類最後の砦であるネオ・エデンを死守すること。
  relationships:
  - name: カイト
    relation: 危ういが可能性を秘めた兵器（パイロット）
  - name: リク
    relation: 戦術的に不可欠な頭脳
  arc: 効率と犠牲を天秤にかける冷徹な指揮官から、少年たちの「理屈を超えた絆」を信じ、彼らに全てを託す覚悟を決める。
