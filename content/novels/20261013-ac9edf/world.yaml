title: 轟天機ガウル・レクイエム ―双子の魂、雷鳴の合体―
genre: SF
tone: 熱血、爆発的、スペクタクル
pov: 三人称
tense: 過去形
setting: 超巨大怪獣「災厄獣」が都市を蹂躙する近未来、重力制御技術が発達した浮遊都市「ネオ・エデン」。
premise: 突如として現れた災厄獣の猛攻に対し、人類は唯一の対抗手段として巨大機動兵器「轟天機」を実戦投入する！だが、その機体を操れるのは、特殊な共鳴能力を持つ「双子のパイロット」のみであった。雨が降り、空が涙を流す時だけ現れる謎の武器屋「雷鳴の隠れ家」で、彼らは失われた禁断の合体パーツを手に入れる。運命に抗い、魂を燃やし、少年たちは宇宙の理を破壊する一撃を放つ！
themes:
- 血縁の絆
- 限界突破の勇気
- 破壊と再生
rules:
- 轟天機の出力はパイロットの精神波（サイコ・エナジー）に依存する
- 双子の共鳴が一定値を超えた時のみ、禁断の「超合体形態」が起動する
- 災厄獣は雨天時に活性化する特性を持つ
plot_outline:
- '序盤: 災厄獣の襲撃により壊滅寸前のネオ・エデン。双子の少年カイトとリクは、未完成の轟天機に乗り込み、死闘を繰り広げる。二人は雨の日にだけ開く店で、伝説の合体コア「雷神の心臓」を入手する。'
- '中盤: 敵の増援により防衛線が崩壊。カイトとリクは、二つの機体が一つに溶け合う「極限共鳴合体」を試みるが、精神の不一致により暴走の危機に陥る。彼らは互いの孤独と向き合い、真の絆を証明する。'
- '終盤: 宇宙規模の災厄獣が降臨。街は雨に包まれ、絶望が支配する。カイトとリクは、魂を削る叫びと共に、究極の必殺技「轟天・雷鳴神滅斬」を放つべく、全エネルギーを一点に集中させる。'
- '結末: 閃光が闇を切り裂き、災厄獣は塵へと帰す。傷ついた都市に、晴れ渡る青空と、新たな希望の光が差し込む。二人の少年は、次なる戦いへと向かうべく、力強く歩み出す。'
style_notes: 「行け！」「撃て！」といった叫びを多用し、爆発音や金属の軋みを強調する。合体シーンでは、装甲が組み合わさる音、エネルギーが奔流となって溢れ出す様子を、五感を揺さぶるような大げさな修飾語で描写せよ。読者の心拍数を跳ね上げるような、熱量の高い、直線的な文章を心がけること。
