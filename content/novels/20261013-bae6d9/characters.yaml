- name: 九条 蓮
  role: 主人公
  age: 34
  gender: 男性
  appearance: 無精髭を生やし、常に睡眠不足の目を細めている。黒いコートのポケットには常に幾冊もの古書とルーペが入っている。
  personality: 極めて冷静かつ論理的。他者に対する執着が薄く、物事の構造をパズルとして解くことだけに関心がある。一人称は「私」。
  speech_style: 淡々と事実だけを述べ、感情の起伏が少ない。結論から話す傾向がある。
  background: 警視庁の嘱託調査員であり、かつては大学で建築構造学を教えていた。物理的・空間的なトリックの解明に定評がある。
  motivation: 「未完の青い封筒」に残された物理的矛盾を解き明かし、十年前の失踪事件の真相を確定させること。
  relationships:
  - name: 瀬田 葵
    relation: 助手兼、調査の相棒
  - name: 真壁 宗一郎
    relation: 十年前の失踪者の父親であり依頼人
  arc: 事件を解決しても救いは訪れないという冷徹な現実を受け入れ、都市の喧騒の中でただ自己の役割を淡々と全うする境地に至る。
- name: 瀬田 葵
  role: 相棒
  age: 25
  gender: 女性
  appearance: ショートカットの髪に、機能的なナイロンジャケット姿。常に最新型のタブレット端末を携えている。
  personality: 好奇心旺盛で行動力があるが、九条の冷徹さに少し呆れつつも信頼している。一人称は「私（わたし）」。
  speech_style: ハキハキとした口調で、現代的な若者言葉を少し交えつつも、捜査の際はプロフェッショナルな表現を使う。
  background: 元IT企業のデータアナリスト。街の監視カメラ映像やレシートのデジタルデータ解析に長けており、九条の右腕としてスカウトされた。
  motivation: デジタルとアナログの矛盾から事件の隠された全体像を暴き出すこと。
  relationships:
  - name: 九条 蓮
    relation: 上司兼、信頼する調査員
  arc: 単なるデータ処理の補助から、九条の論理の裏にある人間の微細な感情の機微に気づくようになる。
- name: 真壁 宗一郎
  role: 重要関係者
  age: 62
  gender: 男性
  appearance: 整えられた白髪に、仕立ての良い古いスーツ。しかし、どこか疲弊した表情を浮かべている。
  personality: 物静かで思慮深い。十年前の傷を内に秘めながらも、どこか諦めに似た達観を持っている。一人称は「私」。
  speech_style: 丁寧だが、どこか遠くを見つめるような、含みのある話し方をする。
  background: 再開発が進む住宅街で、代々続く文具店を営んでいた。十年前、妻を失踪事件で亡くしている。
  motivation: 妻の失踪の真実を知り、十年ぶりに見つかった手筒の行方にケジメをつけること。
  relationships:
  - name: 九条 蓮
    relation: 真相究明を託した調査員
  arc: 隠し続けていた十年前の秘密が暴かれることで、過去の呪縛から解放される。
