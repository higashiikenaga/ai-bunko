title: 不在の回覧板と、未完の青い封筒
genre: 本格ミステリー
tone: 静謐で、理知的。曇天の街のような冷たさと、微かな情緒。
pov: 三人称客観
tense: 過去形
setting: 現代、24時間営業の大型商業施設と古い住宅街が混在する、光の強すぎる「眠らない街」。
premise: 不夜城のごとき喧騒を誇る都市の片隅で、一通の「失われた手紙」が発見される。それは、十年前の不可解な失踪事件の当事者から、宛先不明のまま遺されたものだった。警視庁の嘱託調査員は、手紙に記された些細な筆跡の乱れと、現場に残された「使い古された銀の栞」から、物理的に不可能な密室の論理を導き出していく。都市の光に隠された、静かな欠落の物語。
themes:
- 記憶の風化
- 論理による真実の再構築
rules:
- 事件は必ず、物理的な閉鎖空間または、視覚的な死角を用いて発生する
- 登場人物の行動原理は、感情論ではなく、その人物が持つ独自の論理に基づかなければならない
plot_outline:
- '序盤: 眠らない街の片隅、整理された古い書庫から、十年前の失踪事件に関連する「未投函の手紙」が見つかる。調査員は、その手紙が本来届くはずだった人物が、実は事件の鍵を握っている可能性に気づく。'
- '中盤: 手紙の記述を辿る過程で、当時の目撃証言と現在の街の構造に、奇妙な矛盾が生じていることが判明する。日常的な小道具――例えば、ある店舗のレシートや、特定の時刻にのみ点灯する看板の光――が、アリバイ崩しの重要な手がかりとして浮上する。'
- '終末: 犯人が構築した「完璧な不在」のトリックが、手紙に挟まれていた銀の栞の、わずかな摩耗の形によって解体される。論理的な帰結として、犯人の動機と、失われた手紙がなぜ届かなかったのかが明らかになる。'
- '結末: 真実は明かされるが、それは救済ではなく、ただ一つの事象の確定として淡々と描写される。街の喧騒は変わらず、解決した事件は再び夜の静寂へと溶けていく。'
style_notes: 感情の形容詞を極力排除し、事象の推移と物理的状況の描写に徹すること。伏線となる小道具は、物語の序盤で風景の一部として自然に、かつ詳細に記述しておく。読者に対しては、推論に必要な情報を隠蔽せず、論理の構築に必要なピースを等価に提示する。
