- name: レオン・ヴァレンタイン
  role: 主人公
  age: 26
  gender: 男性
  appearance: 灰色の髪に油汚れのついた顔。胸部に真鍮製の人工心臓が露出しており、呼吸のたびに蒸気が漏れる。使い古された革の飛行服を着用している。
  personality: 直感的で行動派。困難な状況でも不敵に笑う強さを持つ。一人称は「俺」。
  speech_style: ぶっきらぼうだが情に厚い。技術的なことには無頓着だが、機械の「声」を聞き取る直感に優れる。
  background: 浮遊群島の辺境で廃材回収屋として生計を立てていた。自身の心臓のメンテナンスに問題を抱えており、失われた熱源を求めて旅に出る。
  motivation: 失われた『太陽の肺』を見つけ出し、自分の心臓の動力源と、世界から失われた熱を取り戻すこと。
  relationships:
  - name: クララ・フォン・アイゼン
    relation: 信頼できる相棒
  - name: アリア
    relation: 守るべき存在
  arc: 自身の心臓を単なる「欠陥品」ではなく、世界を調律するための「鍵」として受け入れ、真の探検家へと成長する。
- name: クララ・フォン・アイゼン
  role: 相棒
  age: 24
  gender: 女性
  appearance: 金髪をきっちりとまとめ、多機能なゴーグルと整備用工具ベルトを身につけている。常に精密な計測器を携帯している。
  personality: 冷静沈着で理論主義。未知の技術に対しては狂気的な好奇心を見せる。一人称は「私」。
  speech_style: 丁寧で理知的。ただし、機械の不具合やレオンの無茶な行動に対しては非常に厳しい口調になる。
  background: 没落した貴族の家系出身の機械工学士。失われた古代技術の解明を研究し、学術的な証明を行うことを目的としている。
  motivation: 古代の超大型蒸気機関の構造を解明し、歴史に名を刻むこと。
  relationships:
  - name: レオン・ヴァレンタイン
    relation: 行動力に振り回されるが、最も信頼している相棒
  arc: 理論だけでは解決できない極限状態において、知識を越えた「直感」と「勇気」で決断を下せるようになる。
- name: 守護機構「零式」
  role: 敵役
  age: 500
  gender: 無性
  appearance: 巨大な氷の結晶と錆びついた歯車で構成された、人型に近い自律機械。全身から冷気を放ち、青白い光を明滅させている。
  personality: 感情を一切排し、プログラムに従ってのみ動く。絶対的な秩序の守護者。一人称は「我」。
  speech_style: 機械的な響きを持つ、威圧的な宣告。感情の起伏がない。
  background: 氷の城を管理し、世界の熱を吸い取るヒートシンクの機能を維持するために設計された古代の防衛システム。
  motivation: 熱による世界の融解（混乱）を防ぐため、すべての熱を凍結・吸収し続けること。
  relationships:
  - name: レオン・ヴァレンタイン
    relation: 排除すべき侵入者
  arc: レオンによる「調律」を受け、破壊のための防衛から、熱を循環させるための管理へと役割を再定義される。
- name: アリア
  role: 脇役
  age: 12
  gender: 女性
  appearance: 透き通るような白い肌と、氷の結晶のような装飾がついた古いドレス。瞳の中に蒸気の渦のような模様がある。
  personality: 穏やかでどこか儚げ。世界の記憶を共有しているような不思議な雰囲気を持つ。一人称は「私」。
  speech_style: 詩的で、時に未来を予言するような、現実離れした話し方。
  background: 消えた村の記憶を宿した、生体アンドロイドのプロトタイプ。氷の城の深部で眠っていた。
  motivation: 世界に再び温かな風が吹くのを見届け、村の記憶を次世代へ繋ぐこと。
  relationships:
  - name: レオン・ヴァレンタイン
    relation: 運命を共にする導き手
  arc: 過去の遺物として眠る存在から、新しい時代の熱を運ぶ象徴へと目覚める。
