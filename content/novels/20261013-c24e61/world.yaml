title: 真鍮の肺と、凍てつく鼓動の歯車
genre: スチームパンク冒険
tone: 重厚で油の匂いが漂う、硬質な冒険譚
pov: 三人称
tense: 過去形
setting: 高高度の雲海に浮かぶ浮遊群島と、永久凍土に閉ざされた極北の未踏地
premise: 蒸気機関の心臓を持つ探検家・レオンは、ある日、地図から完全に抹消された「消えた村」の記録を発見する。その村はかつて、無限の熱を供給する超大型蒸気機関『太陽の肺』を管理していた伝説の地であった。レオンは、失われた熱源の行方を追い、極北の果てにそびえ立つ、不可解な結晶体で構成された「氷の城」へと向かう。そこには、機械の寿命を司る禁忌の機構が眠っていた。
themes:
- 技術の継承と忘却
- 生命と機械の境界
rules:
- 蒸気機関の出力は、高純度の『燐光石』の燃焼効率に依存する
- 氷の城の領域では、熱力学第二法則が異常に加速し、あらゆる機械が急速に冷却・停止する
- 『太陽の肺』の再起動には、特定の周波数で共鳴する真鍮製の調律鍵が必要である
plot_outline:
- '序盤: 廃材回収屋のレオンが、消えた村の断片的な設計図を手にし、相棒の自動機械工学士と共に旅立つ。空飛ぶ蒸気艇での過酷な航海が描かれる。'
- '中盤: 霧の向こうに突如現れた氷の城に遭遇。極低温の嵐の中、蒸気圧を維持するための命懸けの修理と、凍りついた機械仕掛けの防衛機構との戦闘が続く。'
- '終盤: 城の最深部で、氷の城自体が巨大な冷却装置（ヒートシンク）であり、かつての村の熱を吸い取り続けている真実を知る。レオンは『太陽の肺』を再起動させるための最終的な調律を試みる。'
- '結末: 氷が溶け出し、熱が大地へ還る。村の記憶は形を変えて再生し、レオンは新たな蒸気の煙と共に、まだ見ぬ地平へと船を出す。'
style_notes: 真鍮の磨耗や蒸気の噴出音、ピストンの往復運動を極めて精緻に描写すること。職人たちの会話は無駄を削ぎ落とした無骨なものとし、機械の仕組み（歯車の噛み合わせや圧力弁の挙動）を論理的に説明することで、物語に実在感を与える。常に煙突から立ち上る黒煙と、遠くで鳴り響く鐘の音を背景として配置せよ。
