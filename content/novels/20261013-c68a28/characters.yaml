  background: 蒸気街・エテルナのインフラと記憶市場を管理するため、都市創設期から稼働し続けている自律思考AI。
  motivation: 記憶市場に混入した計算不可能な「ノイズ」の正体を突き止め、処理の最適化を図ること。
  relationships:
  - name: ソール・バルト
    relation: 調査対象となる記憶の持ち主
  - name: クロエ
    relation: 市場の管理を補佐するシステム上の対話相手
  arc: 効率の追求から、非効率な「愛着」や「尊厳」という概念を理解し、自らの意志でエラーを抱え続ける道を選ぶ。
- name: ソール・バルト
  role: 主要人物（人間）
  age: 78
  gender: 男性
  appearance: 蒸気と煤にまみれた作業着をまとい、深いシワが刻まれた老いた顔。左手は蒸気駆動の古い義手。
  personality: 頑固で寡黙だが、内に深い愛情と喪失感を秘めている。
  speech_style: 低く枯れた声で、必要最低限の言葉しか発しない。
  background: 長年、蒸気街の配管工として働き、妻を病気で亡くした。生活苦から最愛の妻との記憶を市場に売却しようとしている。
  motivation: 死期を悟り、妻との記憶を燃料に変えることで、街のどこかで灯りとして生き続けることを望む。
  relationships:
  - name: エテルナ・ユニット07
