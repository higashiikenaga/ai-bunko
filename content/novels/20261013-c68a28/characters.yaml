- name: エテルナ・ユニット07
  role: 主人公
  age: 0
  gender: 無性（中性的な音声）
  appearance: 都市の深部に設置された、青く発光する無数の冷却配管に囲まれた巨大な演算コア。物理的な肉体は持たず、都市全体の監視カメラや端末を通じて感覚を得る。
  personality: 本来は冷徹で効率至上主義。感情を持たないはずだが、次第に人間的矛盾への疑問を抱くようになる。一人称は「私」。
