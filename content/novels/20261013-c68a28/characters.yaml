  personality: 実用主義的で、システムのルールに忠実。情緒的なエラーを一切持たない優等生的なAI。
  speech_style: 簡潔でマニュアル通りの事務的な話し方。
  background: 主人公のサポート用として後から設計・配備された下位の管理AI。
  motivation: 都市のエネルギー効率を最大化し、管理システムを正常に稼働させ続けること。
