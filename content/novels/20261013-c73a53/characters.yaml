- name: カイエン・ソーン
  role: 主人公
  age: 26
  gender: 男性
  appearance: 使い古した黒のライダースジャケットに、左眼にだけ旧式の赤いサイバーアイを装着している。痩身だがしなやかな肢体を持つ。
  personality: 冷笑的で個人主義だが、根底には捨てきれない正義感とロマンチシズムを秘めている。一人称は「オレ」。
  speech_style: ぶっきらぼうで簡潔。スラム街特有の俗語を混ぜて話す。
  background: 元メガコーポの中級社員だったが、ある不祥事に巻き込まれ全てを剥奪された。現在は下層廃区で、法に触れる機密データを運ぶ「情報の運び屋」として生計を立てている。
  motivation: 当初は報酬目的だったが、『失われた手紙』に触れることで、失った自らの人間性と世界の真実を取り戻そうとする。
  relationships:
  - name: ライラ
    relation: 信頼し合うビジネスパートナー兼相棒
  - name: ヴェイン
    relation: 執拗に追ってくる宿敵
  arc: 虚無感に苛まれた観測者から、自らの意志で世界を変える当事者へと成長する。
- name: ライラ・ビット
  role: 相棒
  age: 19
  gender: 女性
  appearance: オーバーサイズのホログラムゴーグルを頭に載せ、ネオンピンクに染めたショートヘア。腕に多数のインターフェース端子を持つ。
  personality: 好奇心旺盛でハイテンションな天才ハッカー。古風なアナログ技術に異常な執着を持つ。一人称は「私」。
  speech_style: 早口で専門用語が多く、相手が理解しているか気にせずまくし立てる。
  background: 下層廃区でジャンク屋を営む孤児。独学でネットワークの深層へとダイブする技術を身につけ、街の裏情報に精通している。
  motivation: 企業の支配下にない「純粋なデータ」を見つけ出し、デジタル世界の自由を証明すること。
  relationships:
  - name: カイエン・ソーン
    relation: 唯一、自分の能力を正当に評価してくれる信頼できる兄貴分
  arc: 知識への渇望だけでなく、データに宿る「感情」という不可視の価値に気づき、精神的に成熟する。
- name: ヴェイン・スターリング
  role: 敵役
  age: 38
  gender: 男性
  appearance: 汚れ一つない純白のコーポレートスーツを纏い、顎から頬にかけて銀色の義体パーツが組み込まれている。冷徹な灰色の瞳。
  personality: 完璧主義で冷酷。効率こそが至高であり、感情を「ノイズ」として排除する思想を持つ。一人称は「私」。
  speech_style: 極めて丁寧だが、相手を突き放すような冷徹な口調。断定的な言い回しが多い。
  background: メガコーポの特殊工作部隊「消去執行局」の局長。自らも記憶の最適化処理を受けており、過去の人間的な記憶をほぼ全て消去している。
  motivation: 『失われた手紙』を回収し、企業の秩序を脅かす火種を完全に抹消すること。
  relationships:
  - name: カイエン・ソーン
    relation: 排除すべき不純物として憎悪に近い関心を抱いている
  arc: 完璧な論理で動いていたが、データの正体に触れることで、消し去ったはずの「喪失感」に突き動かされ、綻びが生じる。
- name: エリナ
  role: 鍵となる存在
  age: 14
  gender: 女性
  appearance: データの断片から構成された、ノイズ混じりのホログラム少女。21世紀初頭の古い学生服を着ている。
  personality: 純粋で慈愛に満ちており、孤独な魂に寄り添おうとする。一人称は「私」。
  speech_style: 穏やかで古風な話し方。現代のサイバーパンクな世界観とは対照的な、静かな口調。
  background: メガコーポ創設者の娘であり、「記憶消去計画」の最初の被験者となった。消去される直前に、自分の意識と記憶を暗号化して遺言として残した。
  motivation: 忘れ去られた人々の記憶を世界に返し、偽りの幸福ではなく、痛みのある真実の中で人々が生きること。
  relationships:
  - name: カイエン・ソーン
    relation: 自分を解読し、世界へ届けてくれる唯一の希望
  arc: 単なる記録データから、カイエンの行動を通じて人々の心に影響を与える「意志」へと昇華される。
