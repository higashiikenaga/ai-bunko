title: クロムの雨、電子の遺言
genre: サイバーパンク
tone: ハードボイルド、スピード感、退廃的
pov: 一人称（オレ）
tense: 過去形
setting: 2114年、超高層メガコーポの頂と、酸性雨に沈むスラム街「下層廃区」が混在する空中都市ネオ・エデン
premise: 空飛ぶ船が物流を支配する時代、オレは情報の運び屋だ。ある夜、デリート不能な暗号化データ――『失われた手紙』と称される古いアナログ形式の記録を拾う。それは、世界を統べるメガコーポの根幹を揺るがす、ある少女の記憶だった。追っ手のレーザーが視界を焼く中、オレは真実を解読するために、回路の深淵へとダイブする。
themes:
- 情報の真実性
- 人間性の残滓
- 階級格差
rules:
- 脳内チップへの直接アクセスによるハッキングは、ニューロンへの負荷が極めて高い
- 空飛ぶ船の航路は、メガコーポが管理する高度な暗号プロトコルによって独占されている
- スラム街の住人は、生体パーツと安価な合成義体の混在が常態化している
plot_outline:
- '序盤: スラムの路地裏で、回収不能なはずの旧式データ・チップを拾う。それは、物理的な文面を持つ『手紙』のデジタル復元体だった。'
- '中盤: 企業の特殊工作部隊に追われながら、データの解読に必要な『鍵』を求めて、ジャンク屋のネットワークをハッキングで駆け巡る。空飛ぶ船の影に隠れながらの逃走劇。'
- '終盤: データの中身が、企業の創設者が隠蔽した『人類の記憶の強制消去計画』であることを突き止める。最上層のタワーへと強襲を仕掛ける。'
- '結末: データを全世界のネットワークにブロードキャストし、偽りの秩序を崩壊させる。オレは雨の中で、消えゆく電子の温もりを感じながら、次の仕事へ向かう。'
style_notes: 短いセンテンス。ネオンの瞬きと、絶え間ない酸性雨の描写を多用。ハッキングシーンは、コードの羅列やニューロンへの過負荷を感覚的に表現する。スラング混じりの独白で、世界への皮肉を込める。
