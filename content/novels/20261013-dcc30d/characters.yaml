- name: 如月 ハルト
  role: 主人公
  age: 20
  gender: 男性
  appearance: どこにでもいる平凡な大学生。少し猫背で、常にスマートフォンを手放さない。
  personality: 内向的だが好奇心が強く、ネットの噂を追うことに依存気味。一人称は「僕」。
  speech_style: 穏やかで丁寧だが、パニックに陥ると早口になる癖がある。
  background: SNSのトレンドを追うのが日課の大学生。孤独感を埋めるようにネット掲示板を徘徊している。
  motivation: 自身に降りかかった怪異の正体を突き止め、デジタルな死から逃れること。
  relationships:
  - name: 橘 カナタ
    relation: 大学の友人
  - name: 朝倉 リン
    relation: SNSを通じて現象を拡散させた張本人への恐怖と執着
  - name: 九条 蓮
    relation: 古本屋の店主であり、謎めいた助言者
  arc: ネットの傍観者から、死の予言が書き込まれた「コンテンツ」へと変貌していく絶望。
- name: 朝倉 リン
  role: 敵役（媒介者）
  age: 19
  gender: 女性
  appearance: 派手なメイクとファッションに身を包んだ、華やかな容姿のインフルエンサー。
  personality: 極めて高い自己顕示欲を持ち、数字（フォロワー数やいいね）のためなら手段を選ばない。「私」
  speech_style: 常にカメラに向かって話しているような、明るく過剰な演出が混じる話し方。
  background: フォロワー数10万人を抱える人気投稿者。都市伝説を「ネタ」として利用し、バズらせることで自身の価値を高めてきた。
  motivation: 未知の現象を独占し、かつてない規模の「バズ」を生み出すこと。
  relationships:
  - name: 如月 ハルト
    relation: 現象を拡散する一要素としての認識
  arc: 注目を集め続けた結果、怪異の「未完の結末」を書き込むための生贄（器）へと堕ちていく。
- name: 九条 蓮
  role: 脇役（案内人）
  age: 35
  gender: 男性
  appearance: 常に古びたエプロンを着用し、影のある瞳をした、どこか浮世離れした男。
  personality: 冷静沈着で達観しており、物事の結末をあらかじめ知っているかのような不気味さがある。「私」
  speech_style: 低く、抑揚の少ない、静かな話し方。
  background: 路地裏の古本屋の店主。過去にその店で起きた「作家の死」に関する記録を管理している。
  motivation: 繰り返される物語のサイクルを静かに見守り、記録すること。
  relationships:
  - name: 如月 ハルト
    relation: 怪異のルールを教える導き手
  arc: 救済を試みる素振りを見せつつも、結局は怪異の循環の一部であることを確信している。
- name: 橘 カナタ
  role: 相棒（犠牲者）
  age: 20
  gender: 男性
  appearance: 眼鏡をかけ、常にタブレットやノートPCを携帯している理系学生。
  personality: 徹底した合理主義者。非科学的な現象をデータで解明しようとする執着心を持つ。「俺」
  speech_style: 論理的で断定的な、理屈っぽい口調。
  background: コンピュータサイエンス専攻。ハルトの友人であり、SNSの拡散アルゴリズムを解析して現象に立ち向かおうとする。
  motivation: 現象をデジタル的なエラーとして特定し、制御・封印すること。
  relationships:
  - name: 如月 ハルト
    relation: 親友であり、共に調査を行うパートナー
  arc: 論理では説明できない「ノイズ」に精神を侵食され、自らもデジタルな怪異の断片へと崩壊していく。
