title: 桜落としのログ：古本屋の検索履歴
genre: ホラー
tone: 疾走感のある現代ネット怪談、焦燥感、湿度の高いデジタルホラー
pov: 三人称近接視点
tense: 現在・過去混合
setting: 現代、SNSが普及した都市部と、路地裏にある古い古本屋
premise: ネット上で「特定の古本を検索すると、死者の未発表原稿が流れてくる」という都市伝説が拡散する。検索した者は、春に散る桜のビデオを見続けなければならない。拡散が進むにつれ、スマートフォンの通知は「死の予兆」へと変わり、投稿者の位置情報はリアルタイムで怪異に共有されていく。バズればバズるほど、逃げ場はなくなる。
themes:
- 情報の拡散と増殖する恐怖
- 忘却と記録の矛盾
rules:
- 怪異は、ネット上のテキストや画像として「認識」されることで実体化する
- 『桜』のモチーフが描かれた投稿が増えるほど、怪異の干渉範囲が広がる
- 検索履歴に残った文字列は、物理的な呪詛として現実に顕現する
plot_outline:
- '序盤: ネット掲示板で噂される『古本屋の検索ログ』。主人公の大学生が、好奇心から古い文庫本を検索し、スマホの画面越しに『桜が散る音』を聞いてしまう。'
- '中盤: SNSでその現象がバズり始める。投稿される写真には、必ずどこかに『古本屋』と『桜』が写り込み、拡散されるたびに投稿者の周囲で不可解な事件が多発する。主人公のスマホにも、見知らぬユーザーから大量の桜の画像がDMで送りつけられる。'
- '終盤: 怪異の正体は、かつて古本屋で死んだ作家の『未完の結末』を書き込もうとする集合意識だった。街中の桜が、デジタルデータのノイズのように黒く変色し、現実を侵食し始める。'
- '結末: 主人公は拡散を止めるため、自ら『検索されない存在』になろうと試みるが、最後に手にしたスマホの画面には、自分自身の死を予言する書き込みが、既に数万リツイートされた状態で表示されていた。'
style_notes: 短文を多用し、情報の断片を叩きつけるようなスピード感を持たせる。作中には、掲示板のスレッド、SNSのタイムライン、不穏な検索ワードの羅列、エラーメッセージなどのテキストを積極的に挿入し、読者が「自分もそのネット空間に巻き込まれている」感覚を抱かせるように記述する。
