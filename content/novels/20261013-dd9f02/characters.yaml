- name: 荒木 慎二
  role: 主人公
  age: 32
  gender: 男性
  appearance: 無精髭を生やし、常に眠たげで鋭い眼光。鍛え上げられた体躯には、過去の激闘を物語る傷跡が残っている。
  personality: 虚無主義的で皮肉屋。かつての栄光を捨て、酒と静寂に逃避している。一人称は「俺」。
  speech_style: ぶっきらぼうで、言葉数が少ない。相手を突き放すような言い回しが多い。
  background: かつて「神童」と呼ばれたボクサー。試合中の制御不能な怒りによって相手を重傷負わせた事件をきっかけに、リングを去った。
  motivation: レンの純粋さに触れることで、自分が捨て去った「拳を振るう理由」を再発見すること。
  relationships:
  - name: 佐倉 蓮
    relation: 指導者であり、再生のきっかけとなる教え子
  - name: 九条 凱
    relation: かつての自分とは対極にいる、忌むべき才能
  arc: 過去の罪悪感から逃げ続ける「逃亡者」から、再びリングの熱狂と向き合う「指導者」へと成長する。
- name: 佐倉 蓮
  role: 相棒
  age: 16
  gender: 男性
  appearance: 細身だが引き締まった体を持つ。感情が高ぶると顔が真っ赤になり、その直後に打撃の軌道が光の線のように見える特異体質。
  personality: 嘘がつけないほどに真っ直ぐで、情熱的。臆病だが、一度決めたことは曲げられない。一人称は「僕」。
  speech_style: 丁寧だが、ボクシングのことになると熱を帯びて早口になる。
  background: 感情が表情に全て露呈してしまうため、学校では浮いていた少年。ボクシングの衝動を抑えきれず、廃業寸前のジムを訪れる。
  motivation: 自分の「呪い」を、自分を表現するための「武器」に変えること。
  relationships:
  - name: 荒木 慎二
    relation: 不器用だが唯一自分を理解してくれる師匠
  - name: 九条 凱
    relation: 超えるべき、最も憎むべき壁
  arc: 自分の特異性を「呪い」として恐れる少年から、それを「魂の咆哮」として使いこなすボクサーへと覚醒する。
- name: 九条 凱
  role: 敵役
  age: 17
  gender: 男性
  appearance: 整った容姿、冷徹な瞳。一切の無駄がない完璧なフォームと、高級なスポーツウェアに身を包んだ佇まい。
  personality: 冷酷な合理主義者。感情を完全にコントロールし、相手の心理を揺さぶる「嘘」を武器にする。一人称は「私」。
  speech_style: 常に冷静で、敬語を使いながら相手を嘲笑するような、慇懃無礼な話し方。
  background: エリートボクシングアカデミーの最高傑作。技術と心理戦のみで勝利を重ね、ボクシングを「効率的な作業」と考えている。
  motivation: 感情という不確定要素を排除し、ボクシングにおける「絶対的な正解」を証明すること。
  relationships:
  - name: 佐倉 蓮
    relation: 理解不能で、排除すべき「ノイズ」
  arc: 完璧な計算に基づいた勝利を重ねるが、レンの「嘘をつけない一撃」によって、初めて自身の計算が狂う恐怖を知る。
- name: 志摩 節子
  role: 脇役
  age: 58
  gender: 女性
  appearance: 小柄で活発な印象。使い古されたジムのジャージを愛用し、常にタオルやプロテインを持ち歩いている。
  personality: 肝が据わった、姉御肌な女性。荒木の過去を知りつつ、何も聞かずに見守る包容力を持つ。
  speech_style: 威勢が良く、面倒見の良い口調。荒木に対しては少し小言が多い。
  background: 廃業寸前のジムを支え続けているオーナー。荒木の恩人であり、彼が戻ってきたことを内心喜んでいる。
  motivation: この場所を、若者たちが拳を交わせる「聖域」として守り抜くこと。
  relationships:
  - name: 荒木 慎二
    relation: 昔馴染みであり、見守るべき息子のような存在
  - name: 佐倉 蓮
    relation: 孫のように可愛がっている教え子
  arc: ジムの存続という現実的な問題と戦いながら、荒木とレンの絆が再びジムに灯をともすのを支える。
