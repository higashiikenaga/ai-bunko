title: 鉄拳の咆哮 ―剥き出しの鼓動―
genre: スポーツ青春
tone: 硬派・熱量・静寂と爆発
pov: 一人称（俺）
tense: 過去形
setting: 現代、日本の地方都市にある、廃業寸前のボクシングジム
premise: かつて天才と呼ばれ、ある事件で拳を捨てた俺が、錆びついたサンドバッグの前に立っていた。目の前には、嘘をつけない呪いを持つ少年がいた。彼は感情が動き、顔が赤くなるたびに、打つべき拳の軌道が透けて見える。荒野のような静寂のなか、俺たちは一撃の重みだけを信じて、リングという名の砂漠へと足を踏み入れる。
themes:
- 魂の真実
- 孤独な闘争
rules:
- ボクシングの試合は、技術だけでなく精神の純度によって決定的な差が出る
- 主人公の指導は、一切の妥協を許さない肉体への負荷を伴う
plot_outline:
- '序盤: 過去を背負い、酒と静寂に逃げる俺の前に、嘘がつけず表情が全て露呈してしまう少年・レンが現れる。ボクシングへの情熱を隠せない彼を、俺は渋々引き受ける。'
- '中盤: 練習は地獄だ。砂漠のオアシスを求めるような渇望の中で、俺たちは技術ではなく「己を殺さない戦い方」を模索する。レンの特異な能力が、次第に周囲の注目を集め始める。'
- '終盤: 全国大会の決勝。相手は嘘を巧みに操る、冷徹な技術を持つ天才。静寂が降りる。観客の喧騒が消え、俺とレン、拳の音だけが世界を支配する。'
- '結末: 拳は届いた。嘘も、過去も、全てを叩き割るような一撃。リングに立つのは、真っ直ぐな魂だけだった。'
style_notes: 短文を重ね、リズムを作る。擬音を排除し、動詞の選択によって衝撃を表現する。戦闘直前には、必ず呼吸の音や静寂、風景の描写を置き、爆発的なアクションへの落差を作る。
