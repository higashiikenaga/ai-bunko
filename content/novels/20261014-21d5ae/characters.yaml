- name: 佐伯 湊 (さえき みなと)
  role: 主人公
  age: 24
  gender: 男性
  appearance: 少し長めの髪、常にレコーダーとヘッドフォンを持ち歩いている。物静かでどこか浮世離れした雰囲気。
  personality: 内向的で観察眼が鋭い。周囲の音に敏感。一人称は「僕」。
  speech_style: 丁寧で控えめ。語尾が少し消え入りそうな話し方。
  background: 都会での生活に疲れ、音を記録することだけを目的として凪の街へやってきた青年。街の「静寂」の中に何かを探している。
  motivation: 街に伝わる「空飛ぶ船」の音が、本当に存在するのかどうか確かめたい。
  relationships:
  - name: 結城 怜 (ゆうき れい)
    relation: 偶然、時計店で言葉を交わすことになる元ピアニスト
  - name: 橘 宗一郎 (たちばな そういちろう)
    relation: 街の音を録る際に、灯台の場所を教えてもらった老人
  arc: 音を「記録」するだけの傍観者から、他者の感情や街の記憶に「共鳴」し、自らの居場所を見出す存在へ。
- name: 結城 怜 (ゆうき れい)
  role: 主要人物
  age: 29
  gender: 女性
  appearance: 端正な顔立ちだが、どこか寂しげな瞳。以前は華やかだったが、今は落ち着いた色の服を好む。
  personality: 潔癖で真面目。完璧主義ゆえに脆い。一人称は「私」。
  speech_style: 理知的で、感情を抑えた淡々とした口調。
  background: かつて天才ピアニストとして期待されていたが、ある挫折をきっかけに音楽を捨て、逃げるように故郷の凪の街へ戻ってきた。
  motivation: 過去の失敗を忘れたい、あるいは、音楽を捨てた自分を肯定したい。
  relationships:
  - name: 佐伯 湊
    relation: 手紙をきっかけに、言葉を交わし始める青年
  - name: 時任 誠一 (ときとう せいいち)
    relation: 時計店で古い手紙を受け取るきっかけとなった店主
  arc: 音楽を失った喪失感を「空っぽ」として拒絶するのではなく、その欠落を含めて自分の一部として受け入れる。
- name: 時任 誠一 (ときとう せいいち)
  role: 主要人物
  age: 62
  gender: 男性
  appearance: 使い込まれた作業着、眼鏡の奥の優しいが深い皺が刻まれた目。常に時計の部品を弄っている。
  personality: 寡黙で職人気質。物事の道理を重んじる。一人称は「私」。
  speech_style: 短く、重みのある話し方。余計なことは語らない。
  background: 街の時計店を営む店主。止まったままの古い時計を直せないことに、自身の人生の停滞を重ねている。
  motivation: 止まってしまった時間を動かすこと、あるいは止まったままの意味を見つけること。
  relationships:
  - name: 橘 宗一郎
    relation: 長年の友人であり、かつて灯台守だった男
  arc: 「直せないもの」への固執を手放し、止まった時間（過去）を抱えたまま、新しい時を刻み始める。
- name: 橘 宗一郎 (たちばな そういちろう)
  role: 主要人物
  age: 75
  gender: 男性
  appearance: 日焼けした顔、頑丈な体格。海風に晒されてきた強さを感じさせる。
  personality: 豪快に見えて、非常に繊細な感性を持つ。一人称は「俺」。
  speech_style: ぶっきらぼうだが温かみのある方言混じりの話し方。
  background: 長年、街の灯台守を務めていた退職者。海を見続けることで、多くのものを見送ってきた。
  motivation: かつて灯台で見守っていた「何か」を、最後にもう一度だけ見届けたい。
  relationships:
  - name: 時任 誠一
    relation: 古い友人
  - name: 佐伯 湊
    relation: 街の音を記録する若者として、少し気にかけている
  arc: 孤独な守り手としての役割を終え、過去の記憶を「忘れもの」として空へ手放す準備をする。
