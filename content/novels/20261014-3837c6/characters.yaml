- name: 瀬戸 凪
  role: 主人公
  age: 28
  gender: 女性
  appearance: 都会的な洗練さはあるが、どこか疲れの色が見える細身の女性。髪は実用的なまとめ髪。手入れの行き届かない庭に馴染んでいくにつれ、表情が明るくなる。
  personality: 真面目で責任感が強いが、自分に自信が持てない。一人称は「私」。
  speech_style: 丁寧で落ち着いた、少し控えめな話し方。
  background: 都内の広告代理店で働いていたが、過剰な業務量による心身の不調で休職中。疎遠だった叔父の死を機に、遺された山荘を継ぐことになる。
  motivation: 荒れ果てた庭を再生させることで、自分自身の失った生活の感覚と心の平穏を取り戻すこと。
  relationships:
  - name: 瀬戸 葵
    relation: 叔父（遺言書の主）
  - name: 瀬戸 蓮
    relation: 叔父（遺言書の主）
  - name: 望月 源三
    relation: 近隣の協力者
  arc: 効率と成果を求める都会的な価値観から、自然の緩やかなサイクルを受け入れ、ありのままの自分で生きる心地よさを知る。
- name: 瀬戸 葵
  role: 鍵となる人物（回想・遺言）
  age: 45
  gender: 男性
  appearance: 眼鏡をかけた知的な佇まい。常に植物図鑑や記録ノートを携えていた。
  personality: 冷静沈着で観察眼が鋭い。理論を重んじる。一人称は「僕」。
  speech_style: 遺言書（手引書）を通じて、理路整然とした、しかし植物への深い慈しみを感じさせる文体。
  background: 双子の兄。植物学者として、この地の生態系を記録し、学術的に守ることに生涯を捧げた。
  motivation: 凪に植物の観察方法を伝え、自分が愛した庭の「理（ことわり）」を次世代へ繋ぐこと。
  relationships:
  - name: 瀬戸 蓮
    relation: 双子の弟
  - name: 瀬戸 凪
    relation: 姪
  arc: 物語を通じて、単なる「厳しいルール」の書き手から、凪の心を導く「静かな守護者」としての存在感へ変化していく。
- name: 瀬戸 蓮
  role: 鍵となる人物（回想・遺言）
  age: 45
  gender: 男性
  appearance: 葵に似ているが、より野性的で、常に土や植物の香りがする作業服姿。
  personality: 情熱的で直感的。植物を「命」として体温を持って愛する。一人称は「俺」。
  speech_style: 手記を通じて、力強く、自然の生命力を肯定するような温かい言葉遣い。
  background: 双子の弟。葵の理論を実際の庭として形にする現場の責任者であり、秘密の温室を築いた。
  motivation: 葵の知識に「命の輝き」を添え、庭が永遠に循環し続ける場所となること。
  relationships:
  - name: 瀬戸 葵
    relation: 双子の兄
  - name: 瀬戸 凪
    relation: 姪
  arc: 物語の終盤、秘密の温室の発見を通じて、葵の理論と対になる「情熱と愛」の象徴として凪の心に刻まれる。
- name: 望月 源三
  role: 脇役（導き手）
  age: 68
  gender: 男性
  appearance: 日焼けした肌と深い皺を持つ、頑強な老人。使い込まれた登山道具を愛用している。
  personality: 無口でぶっきらぼうだが、非常に面倒見が良い。自然への敬意が深い。一人称は「俺」。
  speech_style: 山言葉が混じった、短くも温かみのある話し方。
  background: 地元の森林組合に所属し、長年この山の管理に携わってきたベテラン。双子の活動を近くで見守っていた。
  motivation: 都会から来た不慣れな凪が、この山の「住人」として馴染めるよう、さりげなくサポートすること。
  relationships:
  - name: 瀬戸 凪
    relation: 山荘の継承者への助言者
  arc: 警戒心の強い凪に対し、山での生活の知恵を授けることで、彼女を孤独な継承者から、コミュニティの一員へと変えていく。
