- name: 瀬戸 澪
  role: 主人公
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と、どこか焦点の定まらない虚ろな瞳。海辺の町に馴染む、淡いブルーのワンピースを好む。
  personality: 内向的で静か。自分の内側に空洞があるような感覚を抱えており、周囲との距離を測りかねている。一人称は「私」。
  speech_style: 控えめで丁寧。言葉を選ぶように、ゆっくりと静かに話す。
  background: 幼い頃の記憶の欠落により、自分が何者であるかという確信を持てずにいる。凪との出会いによって、その欠落が「誰かとの約束」であったことを知る。
  motivation: 胸の空虚感の正体を突き止め、自分自身を取り戻すこと。
  relationships:
  - name: 凪
    relation: 記憶を探す旅の同行者であり、惹かれ合う相手
  - name: 佐倉 奏
    relation: 現実世界で唯一、自分の違和感を察して寄り添ってくれる親友
  arc: 失った記憶がもたらす痛みを拒絶せず、その痛みさえも自分の一部として受け入れ、前を向いて歩き出す。
- name: 凪
  role: 相棒
  age: 17
  gender: 男性
  appearance: 少し乱れた黒髪に、夜空の星を閉じ込めたような深い紺色の瞳。古びた革装丁の星図を常に携えている。
  personality: ミステリアスで達観しているが、内面には強い情熱と優しさを秘めている。一人称は「僕」。
  speech_style: 穏やかで少し含みのある話し方。相手を導くような、静かな響きを持つ。
  background: 「記憶の市場」に住まう、星図の守り手。かつて澪を守るために、彼女から最も大切な記憶を「買い取って」隠した過去を持つ。
  motivation: 澪が記憶を取り戻した時に受けるであろう絶望から、彼女を遠ざけ続けること。
  relationships:
  - name: 瀬戸 澪
    relation: 守るべき対象であり、深く愛している少女
  - name: 商人
    relation: 市場における取引相手
  arc: 嘘によって彼女を守るという独りよがりな願いから脱却し、真実を共有して共に苦しみ、共に歩む道を選ぶ。
- name: 商人
  role: 敵役
  age: 35
  gender: 男性
  appearance: 仕立ての良い黒いスーツにシルクハットを被り、常に影を纏っているような不気味な佇まい。
  personality: 冷徹で利己的。感情や記憶を単なる「商品」としてしか見ていない。一人称は「私」。
  speech_style: 慇懃無礼で、相手の弱みに付け入るような饒舌で甘美な話し方。
  background: 「記憶の市場」を管理する者。人々が忘れたいと願う痛みを買い取り、それを価値あるコレクションとして蓄積している。
  motivation: より価値の高い、人間らしい「切実な記憶」を市場に集めること。
  relationships:
  - name: 凪
    relation: 取引を通じて関わる、興味深い観測対象
  - name: 瀬戸 澪
    relation: 最高級の記憶を秘めた、魅力的な顧客候補
  arc: 物語の進行において、澪と凪の絆を試すような選択を迫る、抗えない運命の象徴として立ち塞がる。
- name: 佐倉 奏
  role: 脇役
  age: 17
  gender: 女性
  appearance: 明るい茶髪のショートカット。活発で、海辺の太陽のような明るい笑顔が特徴。
  personality: 明るく世話焼きで、現実主義的。澪の繊細さを理解し、彼女を現実に繋ぎ止める錨のような存在。一人称は「私」。
  speech_style: 快活でフランク。友人に対しては飾らない、等身大の話し方。
  background: 澪の幼馴染。澪が時折見せる「どこか遠くを見ているような表情」を心配し、彼女の日常を守ろうとしている。
  motivation: 澪がいつもの、穏やかな日常に戻れること。
  relationships:
  - name: 瀬戸 澪
    relation: 放っておけない親友
  arc: 変化していく澪を戸惑いながらも見守り、彼女が「記憶の市場」という非日常から戻ってきたとき、変わらずに隣にいる存在となる。
