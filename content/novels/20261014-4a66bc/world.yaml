title: 星図をなぞる指先と、記憶の市場の淡い嘘
genre: 青春恋愛
tone: 甘酸っぱくて、少しだけ切ない
pov: 一人称（わたし）
tense: 過去形
setting: 現代の海辺の町。月の光が強い夜だけ、異空間としての『記憶の市場』が接続される。
premise: 大切な誰かとの約束を忘れてしまった「わたし」は、空っぽになった胸の痛みを感じながら、ただ静かに日々を過ごしていました。ある夜、迷い込んだ「記憶を売る市場」で、古びた星図を広げる不思議な少年・凪と出会います。その星図に記された光の軌道は、わたしの失った記憶の行方を示しているようでした。けれど、記憶を取り戻すことは、今の幸せな日常を壊してしまうことかもしれない――。
themes:
- 忘却と再生
- 痛みを伴う愛
rules:
- 記憶は市場で『輝く結晶』として売買される
- 記憶を売ると、その体験に伴う感情も完全に消失する
- 星図は、市場に流出した記憶の断片が夜空のように配置された地図である
plot_outline:
- '序盤: 記憶の欠落に違和感を抱く「わたし」が、夜の市場で星図を持つ少年・凪と出会い、記憶を探す旅を始める。'
- '中盤: 凪の導きで星図を辿り、断片的な記憶を拾い集める。「わたし」は、欠片に触れるたびに、言葉にできない切なさと彼への募る想いを感じていく。'
- '終盤: 最後に辿り着いた記憶は、凪が「わたし」を守るために、あえて市場に売らせた、あまりに痛切な真実だった。'
- '結末: 記憶は痛みと共に帰ってくるけれど、「わたし」はそれを拒まない。失った過去ではなく、隣にいる彼との未来を信じて歩き出す。'
style_notes: 「わたし」の心の揺れを、砂糖菓子のように甘くて、少しだけ苦い涙のような言葉で綴ります。語尾は優しく、まるで隣でささやくように。そして、物語の幕が下りる瞬間に、読者さまの心に小さな棘を残すような、そんな一言を添えるのがわたしのこだわりです。
