- name: エリオ・ヴァンス
  role: 主人公
  age: 68
  gender: 男性
  appearance: 白髪混じりの柔らかな髪、使い込まれた革のエプロン、深い皺が刻まれた優しい目元。
  personality: 穏やかで丁寧、職人気質。一人称は「わし」。
  speech_style: 「〜じゃな」「〜しておくれ」といった、ゆったりとした年配者の話し方。
  background: 港町の片隅で小さな修理店を営む老職人。物だけでなく、持ち主の想いも直したいと考えている。
  motivation: 舞い降りた星図の欠片を直し、空飛ぶ船が再び空へ戻れるよう手助けすること。
  relationships:
  - name: ステラ
    relation: 不思議な少女との出会い、師のような関係
  arc: 修理という行為を通じて、失われた思い出を繋ぎ直すことの尊さを再認識する。
- name: ステラ・ルミエール
  role: 相棒
  age: 12
  gender: 女性
  appearance: 星屑が混じったような銀髪、紺色の飛行服、瞳の中に小さな星が宿っている。
  personality: 好奇心旺盛で天真爛漫だが、時折寂しげな表情を見せる。一人称は「わたし」。
  speech_style: 「〜だよ！」「〜なの？」といった、明るくはつらつとした話し方。
  background: 星図を運ぶ空飛ぶ船のナビゲーター。嵐の中で星図の一部を落としてしまった。
  motivation: 失った星図の欠片を集め、船を本来の航路に戻すこと。
  relationships:
  - name: エリオ
    relation: 信頼できる協力者
  arc: 任務に追われる日々から、街の人々の温かな生活に触れ、大切なものは「目的地」だけでなく「過程」にあると気づく。
- name: クララ・メイ
  role: 脇役
  age: 9
  gender: 女性
  appearance: 三つ編みの髪、少し古びたリボン、いつも何かを大切そうに抱えている。
  personality: 内気で感受性が強い。一人称は「わたし」。
  speech_style: 「……です」「……かな」といった、控えめで消え入りそうな話し方。
  background: 亡くなった祖母の形見である小さなオルゴールを失くし、悲しみに暮れている街の少女。
  motivation: 祖母との思い出が詰まった「忘れもの」を見つけ出し、元に戻すこと。
  relationships:
  - name: エリオ
    relation: 大切な品を託す修理職人
  arc: 忘れもの（過去の悲しみ）を受け入れ、それを新しい思い出と共に生きていく強さを得る。
