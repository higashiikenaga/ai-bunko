title: 星図を運ぶ空飛ぶ船と、忘れものを探す街
genre: 日常ほのぼの
tone: 温かく、穏やかで、懐かしい
pov: 三人称
tense: 過去形
setting: 雲の切れ間からいつも美しい星空が見える、坂道の多い静かな港町
premise: 街の片隅にある小さな修理店には、古びた道具を大切に直す老職人が住んでいます。ある日、空からゆっくりと舞い降りてきたのは、星の巡りを記した「星図」を届けるための、不思議な空飛ぶ船でした。船が落としてしまった一枚の古い星図を巡って、街の人々が大切に抱えてきた小さな思い出が、優しく繋がり始めます。
themes:
- 大切な思い出の再生
- ささやかな日常の豊かさ
rules:
- 空飛ぶ船は、急ぐことなく、星の動きに合わせてゆっくりと街を訪れる
- 星図は、持ち主の心の願いを反映して、時折淡い光を放つ
plot_outline:
- '序盤: 修理店の老職人・エリオが、空から舞い降りた小さな空飛ぶ船の一部と、光る星図を見つけるところから物語は始まります。'
- '中盤: 星図の欠片を探す過程で、エリオは街の人々が大切にしている「忘れもの（思い出の品）」の物語を知り、それらを一つずつ丁寧に修復していきます。'
- '終盤: 全ての欠片が集まり、星図が完成したとき、街の人々の優しさが空飛ぶ船に力を与え、船は再び空へと旅立つ準備が整います。'
- '結末: 船は静かに夜空へと戻っていきます。街にはまた新しい星が輝き、人々は明日へのささやかな希望を感じながら、いつもの穏やかな暮らしを続けていくのです。'
style_notes: 小鳥遊ひなたの筆致。情景描写は色彩豊かに、かつ柔らかく。読者に対して「ねえ、知っていますか？」と優しく語りかけるような、寄り添うような語り口を用いる。悪人は登場させず、葛藤は「失われたものへの寂しさ」程度に留め、最後は必ず温かな光が差し込むように書く。
