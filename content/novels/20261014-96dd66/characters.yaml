- name: エリス
  role: 主人公
  age: 22
  gender: 女性
  appearance: 色のない灰色の制服に身を包んだ、表情の乏しい青年。色素の薄い瞳と、感情を抑制されているため常に伏せられた視線が特徴。
  personality: 従順で静か。内面には正体不明の空虚感を抱えている。一人称は「私」。
  speech_style: 抑揚のない、淡々とした話し方。疑問符をつけない断定的な口調が多い。
  background: 管理局の記憶清掃員。効率的に「ノイズ（不要な記憶）」を処理する有能な職員として評価されていたが、ある日禁忌の古本を拾ったことで、システムへの不信感を抱き始める。
  motivation: 古本に記された「痛み」の正体を知ること、そして自分の中にある欠落した記憶を取り戻すこと。
  relationships:
  - name: カイル
    relation: 記憶市場の案内人であり、共犯者
  - name: ジュリアン
    relation: 管理責任者であり、監視対象としての関係
  arc: システムの部品として生きていたが、痛みと絶望を経験することで「人間」としての自我を取り戻し、最後には個人の記憶を公共の遺産として解き放つ選択をする。
- name: カイル
  role: 相棒
  age: 35
  gender: 男性
  appearance: 使い古されたコートを羽織り、右目にだけ古いデータ読み取り用の義眼を装着している。不潔だがどこか知的な雰囲気を持つ。
  personality: 皮肉屋で打算的。しかし、失われた文化や感情に対して強い執着と敬意を持っている。一人称は「俺」。
  speech_style: 砕けた口調。比喩表現を多用し、相手を試すような問いかけが多い。
  background: 元々はレジストリの開発に関わっていた技術者だが、ある記憶の削除に耐えられず脱走。現在は地下の記憶市場でブローカーとして生計を立てている。
  motivation: システムに消し去られた「真実の歴史」を断片的にでも収集し、保存すること。
  relationships:
  - name: エリス
    relation: 好奇心旺盛な素人として興味を持ち、やがて信頼を寄せる相手
  arc: 個人の収集欲に走っていたが、エリスの純粋な探究心に触れ、記憶を「所有」することではなく「伝える」ことの価値に気づく。
- name: ジュリアン
  role: 敵役
  age: 48
  gender: 男性
  appearance: 隙のない白いスーツを纏い、眼鏡の奥に冷徹な眼光を宿している。常に完璧な姿勢を崩さない。
  personality: 極端な合理主義者。感情を「社会の不純物」として忌み嫌い、完全なる静寂こそが人類の救済だと信じている。一人称は「私」。
  speech_style: 丁寧だが威圧的。論理的な正論で相手を追い詰める話し方。
  background: 管理局の最高責任者。レジストリの最適化アルゴリズムを完成させた人物であり、街の秩序を維持するために自らの感情さえも完全に消去している。
  motivation: 一切のノイズが存在しない、完全なる管理社会の完成。
  relationships:
  - name: エリス
    relation: 管理下にあるはずの駒が、予測不能な行動に出たことへの不快感と興味
  arc: 完璧な管理を追求するが、エリスが放流した「言葉」という制御不能なノイズによって、計算外の綻びを突きつけられる。
- name: リリア
  role: 重要人物（回想・記録）
  age: 19
  gender: 女性
  appearance: 古本の挿絵や断片的な記憶に登場する、陽だまりのような笑顔を持つ少女。鮮やかな赤いリボンが象徴的。
  personality: 情熱的で、言葉にすることを何よりも愛していた。他者の痛みに共感することを恐れなかった。
  speech_style: 詩的で感情豊かな表現。相手の心に深く入り込むような語りかけ。
  background: かつてエリスと共に過ごした最愛の人（姉、あるいは恋人）。レジストリに反旗を翻し、自分の記憶を物理的な本に書き残して消去される道を選んだ。
  motivation: いつか誰かがこの言葉を読み、感情を取り戻すこと。
  relationships:
  - name: エリス
    relation: 深く愛し、記憶の種を託した相手
  arc: 物語の回想の中で、エリスが「人間であること」を思い出すための精神的な導き手となる。
