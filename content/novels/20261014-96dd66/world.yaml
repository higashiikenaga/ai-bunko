title: 灰色の静寂と、棄てられた言葉の残滓
genre: SF
tone: 静かな絶望と、冷徹な管理社会の質感
pov: 三人称
tense: 過去形
setting: 高度情報統制下にある閉鎖都市「セクター09」。市民の全感情と記憶は中央サーバー『レジストリ』によって数値化され、管理されている。
premise: すべての記憶がデータとして最適化され、不要な情緒は「ノイズ」として削除される世界。主人公のエリスは、管理局の清掃員として、人々の不要な記憶を破棄する日々を送っている。ある日、彼女は廃棄物の中に、物理的な紙で綴られた一冊の「古本」を見つける。それは、記憶を売買する闇市場でしか手に入らない、誰かの『痛み』が刻まれた禁忌の記録だった。
themes:
- 情報の管理と個人の尊厳
- 忘却することの安寧と、記憶することの苦痛
rules:
- 市民は毎晩、レジストリへの記憶同期を行わなければならない。
- 感情の乱高下は『精神的不安定』とみなされ、即座に鎮静剤による調整が行われる。
- 物理的な媒体（紙、インク、記録媒体以外）による情報の保持は重罪である。
- 『忘却は救済、記録は罪』という標語が街中に掲げられている。
plot_outline:
- '序盤: 感情が数値化された平穏なディストピアの日常。エリスは清掃業務中、管理外の物体である古本を拾い、その不完全な言葉に言いようのない動悸を覚える。'
- '中盤: 古本の記述を辿るうちに、エリスは「記憶を売る市場」の存在を知る。そこは、システムから切り離された、人々の剥き出しの情念が取引される地下の掃き溜めだった。彼女は、自分の失われた過去の断片を買い戻そうと、規則を破り続ける。'
- '終盤: 記憶の売買が中央サーバーの安定を脅かす「ノイズ」として当局に察知される。エリスは、自分が捨ててきたはずの、愛する者との痛切な記憶が、その古本に書き込まれていたことを知る。'
- '結末: 管理局による大規模な「再調整（デリート）」が始まる。エリスは、自身の全記憶を消去される直前、最後の手法として、その古本を街の通気口へと放流する。システムは勝利したが、街の片隅には、名前のない言葉が風に乗って漂い続ける。'
style_notes: 淡々とした三人称の語りを用い、管理社会の無機質なディテール（消毒液の匂い、電子音の規則性、灰色の空）を執拗に描写する。過度な感情表現を避け、人物の絶望を事象の記述によって浮かび上がらせる。作中の標語は、常に冷ややかな権威を持って提示すること。
