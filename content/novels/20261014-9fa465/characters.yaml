- name: 九条 蓮
  role: 主人公（エース投手）
  age: 27
  gender: 男性
  appearance: 鋭い眼光だがどこか虚ろな瞳。鍛え抜かれた肉体を持つが、以前より痩身で影がある。
  personality: 沈黙を好むストイックな性格。一人称：俺
  speech_style: 短く、感情の起伏が少ない淡々とした話し方。
  background: かつては天才と呼ばれたエース。チームの運営費と生活を支えるため、自身の「投球感覚」や「勝負勘」といった鮮明な記憶を市場に売却し続けてきた。
  motivation: 記憶をすべて失い、ただの器になる前に、チームとして最後の一勝を掴むこと。
  relationships:
  - name: 瀬名 陽斗
    relation: 自分を観察し、変化をもたらそうとする控え選手
  - name: 如月 絵里
    relation: 欠落を埋めようと尽力してくれるマネージャー
  - name: 天童 剛
    relation: 自分を「資産」として管理する球団フロント
  arc: 機能を失った「道具」としての自分を脱し、仲間との連動を通じて、記憶ではなく「身体の熱量」で戦う術を見出す。
- name: 瀬名 陽斗
  role: 主人公（控え選手）
  age: 21
  gender: 男性
  appearance: 細身で眼鏡をかけ、常に使い込まれた戦術ノートとタブレットを携えている。
  personality: 観察眼に優れ、思慮深く、やや内向的。一人称：僕
  speech_style: 丁寧だが、核心を突く際には意志の強さを感じさせる話し方。
  background: 身体能力が低く、記憶市場の恩恵を受けられないままベンチに留まっている。選手たちの動きをデータ化し、記憶の欠落による「違和感」を分析することに特化している。
  motivation: 記憶を失った選手たちが、再び「身体の記憶」で動けるような、言葉を超えた戦術を編み出すこと。
  relationships:
  - name: 九条 蓮
    relation: 尊敬の対象であり、最も救いたい選手
  - name: 如月 絵里
    relation: 戦術構築における協力者であり、信頼するパートナー
  arc: ただの傍観者であった自分を捨て、フィールドに直接的な変化をもたらす「司令塔」へと成長する。
- name: 如月 絵里
  role: 主人公（マネージャー）
  age: 25
  gender: 女性
  appearance: 短髪で知的な雰囲気。常に最新のデバイスを操作しており、表情は常に冷静。
  personality: 極めて合理的だが、その根底には選手たちへの深い慈愛がある。一人称：私
  speech_style: 簡潔で論理的、無駄のない口調。
  background: 記憶市場を牛耳る一族の出身。データを用いて選手の欠落を補完することに執着しているが、数値化できない感情の揺らぎに葛藤している。
  motivation: 記憶を失いながら戦う選手たちの尊厳を守り抜き、チームを勝利へ導くこと。
  relationships:
  - name: 九条 蓮
    relation: 守るべきエース
  - name: 瀬名 陽斗
    relation: 共にデータと直感を融合させる同志
  arc: 数値化できない「熱量」や「絆」が、データを超えた奇跡を生むことを認め、それを受け入れる。
- name: 天童 剛
  role: 脇役（球団フロント・監督代理）
  age: 52
  gender: 男性
  appearance: 恰幅が良く、高級なスーツを纏っているが、顔には長年の苦労による疲労が滲んでいる。
  personality: 徹底した現実主義者。冷徹に見えるが、チームの存続に対する執念は人一倍強い。一人称：俺
  speech_style: 重々しく、威圧感のある、命令的な話し方。
  background: チームを倒産から守るため、主力選手の記憶を売却する決断を下してきた責任者。効率的な「資産運用」として野球を捉えている。
  motivation: どんな犠牲を払っても、チームという組織を形として存続させること。
  relationships:
  - name: 九条 蓮
    relation: 最も価値のある、守るべき資産
  arc: 効率的な「管理」としての野球から、人間が泥臭く戦う「スポーツ」の真の価値に気づき、変化していく。
