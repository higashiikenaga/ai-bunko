title: 残響のグラウンド ―記憶の市場と、散りゆく春の攻防―
genre: 群像劇
tone: 熱情、切なさが同居するスポーツ群像劇
pov: 三人称（選手、控え選手、マネージャー、観客席の視点を交錯させる）
tense: 過去形
setting: 近未来の架空都市。人々の『鮮明な記憶』が通貨として取引される「記憶市場」が存在する世界。
premise: 記憶を売ることで生活を支える人々が集う都市。そこでは、かつての栄光や技術を『記憶』として売却し、その対価でチームを維持するプロ野球チームが存在した。主力選手たちが自らの技術を売却し、空っぽの身体で戦う中、ベンチで戦術を練る控え選手と、データを取り続けるマネージャーの視線が交差する。満開の桜が舞い散る中、彼らは失ったはずの『感覚』を、チームという一つの鼓動で取り戻そうとする。
themes:
- アイデンティティの喪失と再生
- 集団における個の役割
- 失われた記憶の価値
rules:
- 記憶市場では、特定のスキル（打撃フォームの感覚など）のみを抽出して売買できるが、売却した者はその感覚を二度と再現できない
- 記憶の売却は精神的な摩耗を伴い、度重なると感情が希薄になる
- 桜の季節は記憶の市場における価格変動が激しくなる
plot_outline:
- '序盤: 記憶を売って戦うスター選手たちの苦悩と、彼らの技術の欠落を埋めようとする控え選手やマネージャーの視点が描かれる。満開の桜の下、チームは連敗の危機に瀕している。'
- '中盤: 作戦ボードの上に描かれる複雑な走塁指示や守備シフト。監督が描く『三角形の連動』と、記憶を失った選手たちが感じる『身体の違和感』の乖離。ベンチの端で祈るようにデータを見つめるマネージャーの葛藤。'
- '終盤: リーグ最終戦。記憶を売りすぎて感情を失ったエースに対し、控え選手が『言葉ではない、身体の記憶』を伝えるための奇策を提案する。作戦ボード上の矢印が、観客席の熱狂とリンクしていく。'
- '結末: 勝利の瞬間、桜の花びらがグラウンドを覆う。記憶は戻らなくとも、共に戦った熱量だけが、彼らの新しい『記憶』として刻まれる。'
style_notes: チームスポーツの躍動感を重視。ベンチ裏の緊張感や、観客席からのざわめきを効果的に挿入すること。作戦指示のシーンでは、作戦ボード上のプレイヤーの動き（『右翼手が二塁へスライドし、遊撃手がその背後をカバーする、逆三角形の陣形』など）を、まるで図解を見ているかのように精密な言葉で描写する。主役だけでなく、影の功労者である控え選手やマネージャーの、静かな、しかし熱い視点に光を当てる。
