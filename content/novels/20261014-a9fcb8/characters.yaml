- name: 瀬戸 陽葵
  role: 主人公
  age: 22
  gender: 女性
  appearance: 透明感のある肌と、少し癖のあるショートヘア。カフェのエプロンがよく似合う。
  personality: 穏やかで聞き上手だが、少し内向的。一人称は「わたし」。
  speech_style: 丁寧で柔らかい、落ち着いた口調。
  background: 都会の喧騒に疲れ、逃げるように海辺の街へ移住。カフェ『オアシス』でアルバイトをしている。
  motivation: 平穏な日常を守ることと、自分の将来に対する漠然とした不安の解消。
  relationships:
  - name: 湊 凪
    relation: 出会いによって心が揺れ動き、共に歩み出す相手
  arc: 凪との交流を通じて、自分の感情に正直になり、新しい季節へ踏み出す勇気を得る。
- name: 湊 凪
  role: 相棒
  age: 24
  gender: 男性
  appearance: 涼しげな目元と少し長めの髪。常に古びた星図を大切そうに抱えている。
  personality: 静かで思慮深い。どこか寂しげな影を纏っている。一人称は「僕」。
  speech_style: 言葉を選びながら話す、物静かで穏やかな話し方。
  background: かつて大切な人と過ごした場所を探すため、古い星図を手に旅をしている。
  motivation: 星図が指し示す「特別な場所」を見つけ出し、過去の記憶に区切りをつけること。
  relationships:
  - name: 瀬戸 陽葵
    relation: 共に旅をし、心を通わせる大切な存在
  arc: 過去の記憶に囚われていた状態から、陽葵との時間を通じて未来を見つめるようになる。
- name: 海野 律
  role: 脇役
  age: 45
  gender: 男性
  appearance: 落ち着いた雰囲気を持つ。使い込まれた麻のエプロンと、優しげな目尻の皺が特徴。
  personality: 包容力があり、客の些細な変化に気づく察しの良い人物。一人称は「私」。
  speech_style: ゆったりとしたリズムで、聞き手に安心感を与える話し方。
  background: 海辺の街で長年、カフェ『オアシス』を切り盛りしてきた店主。
  motivation: 訪れる人々が、この場所で束の間の休息を得られるようにすること。
  relationships:
  - name: 瀬戸 陽葵
    relation: 雇い主であり、彼女の成長を見守る良き理解者
  arc: 変わることのない日常の中で、二人の変化を静かに、温かく見守り続ける。
