title: 星図をたどる、真夏のオアシス
genre: 日常ほのぼの
tone: 甘くて切ない、柔らかな日常
pov: 一人称（わたし）
tense: 過去形
setting: 現代、夏の陽射しが眩しい海辺の街の小さなカフェ
premise: 都会の熱気を忘れさせてくれるような、街の片隅にある小さなカフェ『オアシス』。そこで働くわたしは、ある日、古びた星図を大切そうに抱えた青年と出会います。彼がその星図の先に探しているもの、そして、揺れ動くわたしの心。夏の熱気の中で、静かに、でも確かに動き出す二人の物語です。
themes:
- 大切な居場所を見つけること
- 記憶の中に眠る願い
rules:
- 魔法や非現実的な要素は含まない現実的な日常を描くこと
- 季節の移ろいと、カフェの香りを大切にすること
plot_outline:
- '序盤: 暑い夏の午後、カフェ『オアシス』で働くわたしの、穏やかな日常。そこに、古びた星図を手に持った青年・凪（なぎ）がやってくる。'
- '中盤: 凪が星図を頼りに、かつて大切な人と過ごした場所を探していることを知る。二人は一緒に街を歩き、少しずつ心を通わせていく。'
- '終盤: 星図が指し示したのは、地図には載っていない、けれど二人にとって特別な意味を持つ場所だった。夏の終わり、切ない予感と共に訪れる感情の揺らぎ。'
- '結末: 夏が過ぎ、秋の風が吹き始める頃。二人はそれぞれの場所を見つけ、また新しい季節を共に歩み始める。'
style_notes: 一人称「わたし」を用い、主人公の繊細な心の機微を丁寧に描写すること。語尾は「〜でした」「〜なの」など柔らかい口調を心がけ、甘くて少し切ない情緒的な文体で綴ってください。各話の結びには、読者が次を読みたくなるような、胸に刺さる一言を必ず残してください。
