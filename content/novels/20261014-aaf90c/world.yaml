title: 銀河の砂時計と、月食の夜に消えた地図
genre: 本格ミステリー
tone: 優しく穏やかな、けれどどこか懐かしく不思議な雰囲気
pov: 一人称（わたし／栞）
tense: 現在形と過去形を織り交ぜた軽やかな語り
setting: 現代、海辺の街のカフェ「灯台館」と、その裏手に広がる古い霧深い森
premise: 前作で町の機械機構が再生してから数ヶ月。カフェ「灯台館」に、一人の旅人が奇妙な「砂時計」を持ち込んできました。その砂時計は、月食の瞬間にだけ、砂の代わりに光の粒が逆流するというのです。旅人は、かつてこの周辺に存在したはずの、記録から抹消された『消えた村』の地図を探していると告げます。わたしは、砂時計が示す光の軌跡を追いながら、人々の記憶から零れ落ちた大切な約束を紐解いていくことになります。
themes:
- 失われた記憶の再生
- 誤解の中に隠された善意
rules:
- 殺人は一切起きない
- 謎の解明は物理的な仕掛けや古い記録、人々の記憶の断片に基づいている
- 超常現象ではなく、精巧な機械工作や天文学的現象として描く
plot_outline:
- '序盤: カフェ「灯台館」に、月食の夜にだけ不思議な動きをする砂時計を持った旅人が現れる。砂時計の中に隠された微細な歯車の仕組みを栞が解き明かすと、それはかつて地図から消された『消えた村』の場所を示す座標を刻んでいた。'
- '中盤: 栞と凪沙は、町の古い文献を調査し、数十年前に大規模な地滑りによって地図から消された集落の存在を突き止める。しかし、その村は単に災害で消えたのではなく、誰かが意図的に『存在しないもの』として扱ってきた形跡があった。'
- '終盤: 月食の夜、砂時計が示す光の筋を辿って、一行は森の奥にある隠された入り口を見つける。そこには、災害から人々を守るために、あえて村の記録を抹消し、外部との接触を断って静かに暮らすことを選んだ先人たちの知恵と、かつての灯台守・佐伯の仕事に関わる古い文書が見つかる。'
- '結末: 村は物理的には消えていたが、人々の心の中には温かな記憶として残っていた。砂時計の謎が解けたことで、旅人もまた、自身のルーツを見出す。わたしは、また新しいコーヒーを淹れ、明日も続く穏やかな日常に感謝する。'
style_notes: 「わたし」の一人称を用い、少しおどけた、日常の延長線上にある軽やかな語り口にする。難しい言葉は避け、コーヒーの香りや潮風の匂いを感じさせるような、五感に訴える描写を心がける。ミステリーの核心は論理的に、しかし解決の瞬間は「人の優しさ」に焦点を当てて、読者の心を温めるように書く。
