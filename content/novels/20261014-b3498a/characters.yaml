- name: カイ・エヴァンス
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で、常に油汚れのついた作業着を着ている。瞳には光がなく、どこか遠くを見ているような虚ろな眼差しをしている。
  personality: 冷静沈着で淡々としているが、内面には説明のつかない空虚さを抱えている。一人称は「僕」。
  speech_style: 必要最低限の言葉しか発しない、低く抑えられた声。
  background: かつては将来を嘱望された優秀な蒸気機関技術者だったが、家族を失う事故に遭った。その耐え難い苦痛を『記憶の市場』に売り払い、現在は感情の起伏が乏しい修理工として静かに暮らしている。
  motivation: 依頼された古い蒸気時計の修理を通じて、自分の中に残る微かな違和感の正体を知ること。
  relationships:
  - name: エリス・メイフィールド
    relation: 依頼人であり、感情を揺り動かす存在
  - name: セラス・ヴァイン
    relation: 対立する管理組織の人間
  arc: 感情を失った機械的な存在から、痛みや喪失感さえも自分の一部として受け入れ、色彩のある世界へ踏み出す人間へと変化する。
- name: エリス・メイフィールド
  role: 脇役
  age: 19
  gender: 女性
  appearance: 霧の街に溶け込むような、淡い色の髪と瞳を持つ少女。古びた真鍮のペンダントを常に身につけている。
  personality: 芯が強く、穏やかだが、どこか悲しみを湛えた瞳をしている。一人称は「私」。
  speech_style: 丁寧で優しく、相手の心に寄り添うような話し方。
  background: 亡き祖父が遺した「記憶が刻まれた蒸気時計」を修理するためにカイを訪ねてくる。時計に宿る記憶が、単なるデータではなく「愛の証」であることを知っている。
  motivation: 時計に込められた大切な思い出を、消去することなく正しく受け継ぐこと。
  relationships:
  - name: カイ・エヴァンス
    relation: 信頼を寄せる修理工
  arc: カイが過去に向き合うためのきっかけを与え、彼と共に「忘却の理不尽」に抗う。
- name: セラス・ヴァイン
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない黒い燕尾服を纏い、常に銀色の懐中時計を確認している。冷徹で威圧的な風格を持つ。
  personality: 徹底した合理主義者。個人の感情よりも社会の平穏と秩序を優先する。一人称は「私」。
  speech_style: 慇懃無礼で、論理的かつ逃げ場を与えない冷ややかな話し方。
  background: 「記憶の市場」を管理する組織の幹部。人々から痛みを奪うことで社会の摩擦を減らしているという信念を持っており、イレギュラーな記憶の残留を「不純物」として排除しようとする。
  motivation: 時計に宿る不確定な記憶を完全に消去し、街の平穏な秩序を維持すること。
  relationships:
  - name: カイ・エヴァンス
    relation: 管理すべき対象、あるいは排除すべきイレギュラー
  arc: 変化せず、システムの象徴としてカイの「人間性の回復」を阻む壁として立ちはだかる。
