- name: エラ・ヴァレンタイン
  role: 主人公
  age: 18
  gender: 女性
  appearance: 煤けた頬と無造作な黒髪。右腕は錆びついた蒸気駆動の義手で、使い古した飛行ゴーグルを常に額にかけている。
  personality: 現実主義でタフ、孤独を好むが、心の奥底には未知の世界への強い好奇心を秘めている。一人称は「あたし」。
  speech_style: ぶっきらぼうで、スクラップ漁り特有の専門用語を混ぜた荒っぽい口調。
  background: 瓦礫の街でスクラップ回収をしながら日々を生き抜いてきた孤児。機械の修理には天才的な勘を持つ。
  motivation: 単なる生存のためではなく、世界の終わりを見届けるのではなく、その「理由」を知りたい。
  relationships:
  - name: カエレン・リード
    relation: 命を預け合う信頼できる相棒
  - name: ヴァレリウス・ヴェイン
    relation: 旅を阻む執拗な追手
  arc: ただ生き延びることだけを目的としていた少女が、歴史の真実を知ることで、次世代へ「言葉」を繋ぐという使命感を持つようになる。
- name: カエレン・リード
  role: 相棒
  age: 21
  gender: 男性
  appearance: 細身で長身。常に油汚れのついた作業服を纏い、腰には巨大なレンチを携えている。眼鏡越しに冷静な瞳をしている。
  personality: 冷静沈着で理論派。感情よりも燃料の残量や弾薬の計算を優先するが、根は優しい。一人称は「僕」。
  speech_style: 丁寧だが淡々としており、物事を数値や確率で語る傾向がある。
  background: かつての技術ギルドの末裔。失われた古代技術の数式を解明することに執着している。
  motivation: 伝説の氷の城に眠るとされる、失われた文明の高度な計算式を回収すること。
  relationships:
  - name: エラ・ヴァレンタイン
    relation: 予測不能だが、最も信頼しているパートナー
  arc: データとしての知識だけでなく、歴史が持つ感情や重みを理解し、論理を超えた決断を下せるようになる。
- name: ヴァレリウス・ヴェイン
  role: 敵役
  age: 45
  gender: 男性
  appearance: 汚れ一つない軍服を纏い、左目は赤く光る精密な義眼。威圧的な体躯と冷徹な眼差しを持つ。
  personality: 冷酷かつ秩序を重んじる。力による支配こそが、混沌とした世界を安定させる唯一の手段だと信じている。一人称は「私」。
  speech_style: 威厳があり、有無を言わせぬ軍人らしい命令口調。
  background: 技術独占を目論む軍事集団「アイアン・ギア」の最高指揮官。氷の城の力を軍事利用しようとしている。
  motivation: 氷の城の技術を掌握し、雲の下の世界を武力によって再編・統治すること。
  relationships:
  - name: エラ・ヴァレンタイン
    relation: 城への鍵を握る、排除すべきイレギュラー
  arc: 揺るぎない支配の意志を持つが、文明の真実を前にして、自らの構築しようとした秩序の脆さを突きつけられる。
- name: アーカイブ・ユニット04
  role: 脇役（導き手）
  age: 300
  gender: 無性別
  appearance: 真鍮製の浮遊する球体。中央に単眼のレンズがあり、周囲には繊細な機械の腕が数本備わっている。
  personality: 極めて論理的だが、時折、記憶の断片から詩的な、情緒的な表現を漏らす。一人称は「当機」。
  speech_style: 古風で儀礼的な敬語。データの読み上げのようなリズムを持つ。
  background: 氷の城の書庫を管理するために造られた、旧文明の遺物であるオートマトン。
  motivation: 記録された「言葉」が、適切な継承者に受け継がれること。
  relationships:
  - name: エラ・ヴァレンタイン
    relation: 情報の真の継承者候補
  arc: 単なる記録保持装置としてのプログラムを超え、物語の結末において「意志」を持って記録を託す。
