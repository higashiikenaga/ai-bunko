title: 錆びた蒸気の墓標と、氷の城の頁（ページ）
genre: スチームパンク冒険
tone: 乾いたユーモアと叙情性が混じるポストアポカリプス
pov: 一人称（あたし）
tense: 過去形
setting: 大蒸気災害によって雲に覆われ、太陽を失った終末世界。歯車と蒸気機関が剥き出しになった巨大な瓦礫の街。
premise: 空を覆う厚い雲と煤に汚れきった世界で、あたしはスクラップ漁りの毎日を過ごしている。ある日、廃墟の片隅で見つけたのは、持ち主不明の古本屋の地図と、失われた文明の記録が眠るとされる『氷の城』への手がかりだった。残った燃料はわずか。錆びた義手と、使い古した蒸気銃を手に、あたしは凍てつく真鍮の記憶を求めて旅に出る。
themes:
- 失われた知識の価値
- 荒廃した世界における生の証明
rules:
- 蒸気圧が生命維持の要であり、圧力が低下すると身体機能が著しく制限される
- 雲の上には『氷の城』と呼ばれる、極低温の蒸気が結晶化した謎の領域が存在する
- 高度な技術はすべて遺物（アーティファクト）であり、修理には希少な真鍮部品が必要
plot_outline:
- '序盤: スクラップ回収中に、霧に包まれた廃墟で奇妙な『古本屋』の残骸を発見する。そこで一冊の、凍りついたままの古い記録媒体を手に入れ、それが伝説の氷の城への鍵であることを知る。'
- '中盤: 燃料と弾薬の残量を計算しながら、蒸気駆動の移動艇で雲の境界へと向かう。旅の途中で、技術を独占しようとする軍事集団の追手と遭遇し、死線を潜り抜ける。'
- '終盤: 雲の頂にそびえ立つ、蒸気が凍りついた『氷の城』に到達する。そこはかつての文明が、極限の環境で情報を守るために築いた巨大な書庫だった。'
- '結末: 城の最深部で、世界がなぜ凍りついたのかという真実を知る。すべてを元に戻すことはできなくても、あたしは新しい時代の「言葉」を胸に、また錆びた日常へと降り立っていく。'
style_notes: 「あたし」という一人称を用い、皮肉っぽく、かつ乾いたユーモアを交えた語り。常にガソリン、蒸気圧、弾薬、食料などの残量を意識させ、生存の危うさを強調する。廃墟の中に一輪の機械仕掛けの花や、凍りついた本の美しさを描写する際に、叙情的な表現を差し挟む。
