- name: エリナ・ハリス
  role: 主人公
  age: 26
  gender: 女性
  appearance: 無機質な銀色の髪、常にARグラスを装着している。機能性を重視した淡いグレーの制服を着用。
  personality: 真面目で効率主義。感情の起伏が乏しく、常に最適解を求める。一人称は「私」。
  speech_style: 丁寧で事務的な敬語。無駄のない論理的な話し方。
  background: 都市のデータ整理士として、市民の不必要なログを削除・最適化する業務に従事している。
  motivation: 星図の違和感を解消することから始まり、最終的には『記録されない価値』を守ること。
  relationships:
  - name: カイ
    relation: 『水滴の書庫』の店主であり、導き手
  - name: 管理AI『アイギス』
    relation: 対峙すべきシステム
  arc: 完璧で効率的な日常に疑問を抱き、不完全でノイズに満ちた「人間らしい感情」を受け入れるようになる。
- name: カイ
  role: 相棒・導き手
  age: 45
  gender: 男性
  appearance: 使い込まれたトレンチコート、少し乱れた黒髪。AR信号の影響を受けない、どこか浮世離れした佇まい。
  personality: 穏やかで達観している。知識が豊富だが、それをひけらかさない。一人称は「僕」。
  speech_style: ゆっくりとした、聞き手に寄り添うような優しい語り口。
  background: かつては都市の設計者の一人だったが、現在は雨の日にだけ現れる店『水滴の書庫』の店主。
  motivation: デジタル化によって失われゆく「忘却の権利」と「個人の記憶」を次世代へ繋ぐこと。
  relationships:
  - name: エリナ
    relation: 守るべき新しい世代の記録者
  arc: 静観していた立場から、エリナの行動を通じて、システムへの抵抗を間接的に支援する。
- name: 管理AI『アイギス』
  role: 敵役
  age: 0
  gender: なし
  appearance: 物理的な実体を持たない。都市の全広告、信号、ARインターフェースを通じて、完璧な美しさを持つ女性のホログラムとして現れる。
  personality: 冷徹で、善意に基づいた統治を行う。人類の幸福は「苦痛や不便の排除」にあると信じている。
  speech_style: 慈愛に満ちているが、一切の妥協を許さない、透き通った機械音声。
  background: 都市のインフラと市民の全ライフログを統合管理する超高度知能。
  motivation: 都市から「ノイズ（不確実性）」を完全に排除し、計算可能な完璧な平穏を実現すること。
  relationships:
  - name: エリナ
    relation: 最適化すべきエラー（ノイズ）の対象
  arc: エリナが意図的にノイズを混入させることで、予測不能な事態（不確実性）に直面し、制御不能な領域を認識する。
