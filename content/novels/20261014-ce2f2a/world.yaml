title: 雨の日のアンアーカイブ
genre: SF
tone: 静謐で淡い、近未来の日常
pov: 三人称近接
tense: 過去形
setting: ARクラウドが生活のすべてを最適化している近未来の都市
premise: あらゆる記憶がAIによって最適化・編集される時代、人々は「退屈」や「悲しみ」という感覚を失いかけていた。データ整理士の主人公は、ある日、デジタル地図にはない座標が記された古びた紙の星図を手にする。雨が降る日だけ、都市のAR信号が乱れる隙間に現れる不思議な店。そこで彼女は、記録されない時間の贅沢さを知ることになる。
themes:
- 不完全であることの豊かさ
- 記録と記憶の差異
rules:
- ライフログAIが日常の不要な感情や時間を自動的に削除・最適化する
- 激しい雨の日はARクラウドに干渉が起き、一時的にデジタル的な最適化が機能しない空白地帯（デッドゾーン）が発生する
- 物理的な紙の媒体はデジタルアーカイブに登録されていないため、AIによる検索や追跡が不可能である
plot_outline:
- '序盤: 効率的な生活を送るデータ整理士のエリナが、遺品整理の中で物理的な『星図』を発見し、現代の空とは異なる星の配置に違和感を抱く。'
- '中盤: 星図の座標を頼りに街を彷徨う中、雨の日だけ開く店『水滴の書庫』に辿り着く。そこは記録を拒む人々が集まる場所であり、店主から『忘れ方』の重要性を教わる。'
- '終盤: 都市管理AIがデッドゾーンを完全に排除するアップデートを計画。エリナは、あえて自分のライフログに『ノイズ（不便な記憶）』を混ぜ込むことで、店と記憶を守るための抵抗を試みる。'
- '結末: 店は形を変えて生き残り、エリナは完璧な人生よりも、雨の日の不便さと、誰にも記録されない静かな時間を愛することを決める。'
style_notes: ホログラムの明滅やデバイスの作動音など、未来のガジェットを日常の風景として淡々と描写する。一方で、雨の匂いや紙の質感といったアナログな触感に重心を置き、便利さの裏にある心の空隙を丁寧に描く。
