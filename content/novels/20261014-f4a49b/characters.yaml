- name: サフィア・アル・カリーム
  role: 主人公
  age: 19
  gender: 女性
  appearance: 意志の強そうな瞳と、日焼けした健康的な肌。没落したとはいえ、身だしなみには商家の誇りが感じられる端正な装い。
  personality: 責任感が強く、合理的。一族の再興を第一に考えるが、根底には慈愛がある。一人称は「私」。
  speech_style: 礼儀正しいが、芯の強さを感じさせる毅然とした口調。
  background: かつて砂海を支配した名門商家の娘。父の死と没落により、家宝の地図だけを手に放浪の身となった。
  motivation: 家宝の地図が指し示す「氷の城」を見つけ出し、一族の富と名誉を回復すること。
  relationships:
  - name: ザール・ハッサン
    relation: 雇い主であり、旅の相棒
  - name: ヴァーン・ド・ラ・モル
    relation: 対立する野心的な商人
  arc: 個人の名誉と富を求める旅から、世界に水を取り戻し人々を救うという「真の商人の誇り」を見出す成長。
- name: ザール・ハッサン
  role: 相棒
  age: 42
  gender: 男性
  appearance: 深く刻まれた皺と、砂嵐を耐え抜いてきた強靭な肉体。瞳はかつて灯台が照らした海のように深い色をしている。
  personality: 寡黙で現実主義。孤独を愛するが、内面には過去への悔恨を抱えている。一人称は「俺」。
  speech_style: 砂の唸りのように短く、要点だけを突く無駄のない話し方。
  background: かつて海が存在した時代、砂海を照らす「古い灯台」の最後の手守り。海が失われた際、守るべきものを失った。
  motivation: 最初は報酬のため。しかし次第に、サフィアの行く手に光を見出すことに意味を見出していく。
  relationships:
  - name: サフィア・アル・カリーム
    relation: 雇い主であり、守るべき存在
  arc: 過去の喪失感に沈んでいた隠遁生活から、新たな時代の到来を支える導き手としての再生。
- name: ヴァーン・ド・ラ・モル
  role: 敵役
  age: 55
  gender: 男性
  appearance: 高級な絹の衣服を纏い、宝石を散りばめた指輪をはめている。常に余裕を感じさせる不敵な微笑を浮かべている。
  personality: 極めて強欲で、目的のためには手段を選ばない。冷徹な計算高い性格。一人称は「私」。
  speech_style: 慇懃無礼で、相手を見下したような優雅な話し方。
  background: 現在の交易都市を実質的に支配する有力商人。水資源の独占によって権力を握っている。
  motivation: 氷の城の秘宝「霜の涙」を奪い、水資源を完全に掌握して世界の王となること。
  relationships:
  - name: サフィア・アル・カリーム
    relation: 秘宝を巡るライバル
  arc: 富と権力を追い求め続けるが、最終的には自身の強欲さが招いた破滅を迎える。
- name: エララ
  role: 脇役
  age: 65
  gender: 女性
  appearance: 全身を砂の色に馴染む布で覆っている。瞳は白濁しているが、すべてを見透かしているかのような神秘的な佇まい。
  personality: 達観しており、予言めいた言葉を口にする。穏やかだが、抗えない運命を感じさせる。一人称は「私」。
  speech_style: 古の伝承を語るような、ゆったりとした、時に謎めいた話し方。
  background: 砂漠の民の長老。かつて海が砂に飲み込まれた際の記憶を、口伝として守り続けている。
  motivation: 世界の理が正しく戻るかどうかを見届けること。
  relationships:
  - name: サフィア・アル・カリーム
    relation: 旅路の指針を与える賢者
  arc: 物語の傍観者として、サフィアが真のリーダーへと覚醒するプロセスを見守る。
