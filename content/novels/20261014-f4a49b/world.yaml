title: 琥珀の隊商と霜宮の眠り
genre: 歴史・時代小説
tone: エキゾチックで幻想的な旅情
pov: 三人称
tense: 過去形
setting: 果てしなく広がる砂海と、そこに点在する交易都市。かつて海であった場所が砂に飲み込まれた後の中世的な世界。
premise: 没落した商家の娘サフィアは、一族の再興をかけ、伝説にのみ伝わる「氷の城」へ至る旅に出る。案内役に雇ったのは、かつて砂の海を照らした「古い灯台」の最後の手守りであった孤独な男。灼熱の市場の喧騒を離れ、星さえも凍りつく夜の静寂を越えたとき、二人は世界の理を覆す秘宝へと辿り着く。
themes:
- 名誉と再生
- 静寂と喧騒の対比
rules:
- 水は金以上に価値を持つ通貨として扱われ、厳格な配分制となっている
- 砂漠の夜は極端に冷え込み、特定の鉱石を身に纏わなければ凍死する
- 古い灯台は、かつての海路を記憶する唯一の指標であり、砂嵐の中でのみ真の道を照らす
plot_outline:
- '序盤: 活気と喧騒に満ちた交易都市にて、サフィアが家宝の断片的な地図を手に、隠遁していた元灯台守の男を説得し、旅の契約を結ぶ。'
- '中盤: 隊商と共に死の砂漠を横断する。昼の刺すような日差しと市場のような賑やかな旅路の裏で、夜には耳が痛くなるほどの静寂と、凍てつく孤独に直面しながら絆を深める。'
- '終盤: 地図の果て、熱砂のど真ん中に忽然と現れる、物理法則を無視して凍結した「氷の城」に到達する。そこで城に囚われた太古の記憶と対峙し、水を取り戻すための試練に挑む。'
- '結末: 氷の城の核心にある「霜の涙」を解放し、枯れた大地に再び水脈を呼び戻す。サフィアは富ではなく、人々を救うという真の商人の誇りを得て、新たな街づくりを始める。'
style_notes: 語り部が聴衆に物語を披露するように、緩やかで装飾的な口調を用いる。市場のシーンでは色彩、香辛料の匂い、怒号などの動的な描写を重ね、対照的に砂漠の夜は冷気、星の瞬き、静止した時間といった静的な描写を強調し、エキゾチックな世界観を構築する。
