- name: テオ・ルミナス
  role: 主人公
  age: 19
  gender: 男性
  appearance: 癖のある栗色の髪に、使い込まれた飛行ゴーグルを首にかけている。油汚れのついた茶色のフライトジャケットを着用。
  personality: 控えめで好奇心旺盛。慎重派だが、未知の景色への憧れが強い。一人称は「僕」。
  speech_style: 丁寧で穏やかな口調。考え事をするときに「あー、ええと」と口癖が出る。
  background: 祖父から譲り受けた小型飛行艇『アエロ号』を操縦し、各地の郵便配達や物資輸送で生計を立てている若きパイロット。
  motivation: 古道具屋で手に入れた地図の目的地を訪れ、地図の主が遺した「約束」の意味を知りたい。
  relationships:
  - name: リリア
    relation: 旅の同行者であり、食のガイド
  - name: バーナビー
    relation: 地図を譲り受けた古道具屋の店主
  arc: 「目的地に辿り着くこと」だけを目的としていたが、旅先での出会いを通じ、過程にある日常の尊さに気づく。
- name: リリア・スパイスウォーカー
  role: 相棒
  age: 22
  gender: 女性
  appearance: 亜麻色の髪を三つ編みにし、多くのスパイス瓶を収納できる特製の大きなエプロンドレスを着ている。丸眼鏡をかけている。
  personality: 快活で情熱的。新しい味や文化に触れると興奮して止まらなくなる。一人称は「私」。
  speech_style: ハキハキとしていて勢いがある。料理の解説になると早口になる傾向がある。
  background: 世界中のスパイスと食文化を研究する「香辛料学」の学生。フィールドワークのためにテオの飛行艇に乗り込む。
  motivation: 地図に記された未知の島のスパイスを採取し、究極のレシピを完成させること。
  relationships:
  - name: テオ・ルミナス
    relation: 信頼できるパイロットであり、最高の試食相手
  arc: 効率的なデータ収集よりも、その土地の人々と食卓を囲む「時間」そのものに価値があることを学ぶ。
- name: バーナビー
  role: 脇役
  age: 68
  gender: 男性
  appearance: 白く豊かな髭を蓄え、片目にモノクルを装着している。常に古書の香りと機械油の匂いが漂っている。
  personality: 飄々としていて掴みどころがないが、深い洞察力を持つ。いたずら好きな老人。一人称は「わし」。
  speech_style: 古風で含みのある言い回しを好む。「ふむ、運命というものは面白いねぇ」が口癖。
  background: 浮遊島にある古道具屋の店主。かつては世界を巡った冒険家であり、多くの秘宝や地図を所有している。
  motivation: テオのような若者が、自分の手で新しい世界を見つける様子を特等席で眺めていたい。
  relationships:
  - name: テオ・ルミナス
    relation: お気に入りの客であり、かつての自分を重ねる相手
  arc: 自身の過去の旅の記憶を、テオに託して昇華させる。
- name: エレナ
  role: 重要人物（故人/回想）
  age: 25
  gender: 女性
  appearance: セピア色の写真の中では、真鍮の風鈴を手に持ち、風にたなびく白いスカーフを巻いて微笑んでいる。
  personality: 自由奔放でロマンチスト。世界を愛し、小さな幸せを見つける天才だった。
  background: 数十年前に世界を旅し、秘密の地図を書き残した女性。バーナビーの旧友であり、旅の先駆者。
  motivation: 後世の誰かがこの地図を拾い、自分と同じように世界の美しさに気づいてくれることを願っていた。
  relationships:
  - name: バーナビー
    relation: かつての旅の仲間
  - name: テオ・ルミナス
    relation: 地図を通じて導く先導者
  arc: テオが地図の終着点に辿り着き、彼女の意図（旅の過程こそが宝であること）を理解することで、精神的に完結する。
