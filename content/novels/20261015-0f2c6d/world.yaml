title: 真鍮の風鈴と、スパイスの香る雲の街
genre: 日常ほのぼの
tone: 穏やかで情緒的、色彩豊かな旅日記風
pov: 一人称（僕）
tense: 過去形
setting: 蒸気機関が生活の基盤となっている、浮遊島が点在する空の架空世界
premise: 蒸気機関で動く小さな飛行艇を操る僕の旅は、ある日、古道具屋で見つけた『秘密の地図』から新しい局面を迎える。その地図が指し示すのは、雲の向こう側に隠された、スパイスの香りが漂う未知の浮遊島だった。各地を巡り、新しい土地の風習や温かい料理に触れながら、僕は地図の主が遺した小さな約束を辿っていく。
themes:
- 未知との出会い
- 食を通じた心の交流
- 旅の断片の蒐集
rules:
- 蒸気機関は魔法ではなく、石炭や特殊な植物燃料を動力とする技術である
- 浮遊島間の移動は飛行艇が唯一の手段であり、天候に大きく左右される
- 地図に記された場所は、時として雲の流れによって位置を変える
plot_outline:
- '序盤: 飛行艇での緩やかな旅の日常を描きつつ、古い地図を手に入れる。地図に記された最初の目的地へ向かう準備をする。'
- '中盤: 地図を頼りに各地の浮遊島を巡る。蒸気機関が街を動かす仕組みや、その土地ならではのスパイス料理、独特の挨拶などの風習を丁寧に描写していく。'
- '終末: 地図の終着点である『雲の街』に到着するが、そこは地図の記述とは少し違う、静かな時間が流れる場所だった。'
- '結末: 地図の持ち主が求めていたのは場所ではなく、旅の過程で見つける景色だったと気づく。僕はまた新しい地図を書き添え、次の街へと帆を上げる。'
style_notes: 「僕」の視点から、旅先で食べた料理の味や、蒸気機関が吐き出す白い煙の匂い、窓から見える雲の質感などを、詩的で瑞々しい言葉で綴る。読者がその土地の風に吹かれているような感覚を抱かせる、ゆったりとしたテンポを維持すること。
