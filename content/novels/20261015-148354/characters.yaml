- name: カイ・ソウマ
  role: 主人公
  age: 21
  gender: 男性
  appearance: 痩身で青白い肌。都市の規格に合わせた無機質なグレーの衣服を纏っている。どこか焦点の合わない、寂しげな瞳をしている。
  personality: 内省的で繊細。効率化された世界に馴染めず、正体不明の喪失感を抱えている。一人称は「僕」。
  speech_style: 控えめで丁寧。確信を持てないため、語尾が濁ることが多い。
  background: 都市の最適化管理部門で単純なデータ照合業務に就いている青年。完璧な生活を送っているはずだが、心にぽっかりと穴が開いたような感覚を常に持っている。
  motivation: 自分の心にある「言いようのない寂しさ」の正体を知りたい。
  relationships:
  - name: エララ
    relation: 導き手であり、精神的な師のような存在
  - name: アリス
    relation: 管理システムの代弁者であり、対立する価値観の象徴
  arc: 最適化された空虚な幸福よりも、不便で痛みのある人間らしい記憶に価値を見出し、孤独を受け入れて歩き出す強さを得る。
- name: エララ
  role: 相棒/導き手
  age: 45
  gender: 女性
  appearance: 古びた茶色のエプロンを着用し、使い込まれた眼鏡をかけている。指先は常にオイルや 납（はんだ）で汚れている。
  personality: 風変わりで懐古主義的。知的好奇心が強く、不完全なものを愛する。一人称は「私」。
  speech_style: 比喩表現が多く、哲学的な言い回しを好む。穏やかだが芯が強い。
  background: かつて都市の基幹システム開発に携わっていた技術者。効率化の果てに失われるものの危うさに気づき、密かに「記憶の修復店」を営んでいる。
  motivation: 技術が消し去ろうとしている「人間としてのノイズ（感情や不便な記憶）」を次世代に継承すること。
  relationships:
  - name: カイ・ソウマ
    relation: 店を訪れた稀有な客であり、自身の意志を継ぐ可能性を持つ青年
  arc: 店が消える運命を受け入れながらも、カイという一人の人間に「消えないノイズ」を刻み込むことで、自身の信念を完遂させる。
- name: アリス
  role: 敵役
  age: 30
  gender: 中性
  appearance: 完璧に左右対称な顔立ち。汚れ一つない真っ白な管理職用の制服を着用。感情の起伏が見えない冷徹な眼差し。
  personality: 極めて論理的で効率至上主義。感情やノイズを「システム上のバグ」として忌避する。一人称は「私」。
  speech_style: 断定的で簡潔。感情を排除した事務的な口調。
  background: 都市管理システムの執行責任者。個人の感情を最適化し、社会全体のストレスをゼロにすることを至上命題としている。
  motivation: 都市からあらゆる「不純物（ノイズ）」を排除し、完全なる調和を実現すること。
  relationships:
  - name: カイ・ソウマ
    relation: 最適化されるべき対象であり、不穏な変動を見せ始めた監視対象
  - name: エララ
    relation: 排除すべき過去の遺物であり、システムの欠陥を象徴する人物
  arc: 論理では制御不能な「人間の情動」というバグを突きつけられるが、最後までそれを否定し、システムとしての正しさを貫こうとする。
- name: リナ
  role: 脇役
  age: 17
  gender: 女性
  appearance: 幼さの残る顔立ち。都市の流行に反して、どこか古風な色のリボンを髪に結んでいる。
  personality: 好奇心旺盛で直感的。失った記憶への強い執着を持つ。一人称は「私」。
  speech_style: 感情豊かで、話し方が早口。ときどき子供っぽくなる。
  background: 家族の記憶を最適化によって消去された少女。断片的に残る「誰かに愛されていた記憶」を求めて、雨の日に店を訪れる。
  motivation: システムに消された、家族との「不便で切ない記憶」を取り戻したい。
  relationships:
  - name: カイ・ソウマ
    relation: 店で出会った、似た孤独を共有する友人
  - name: エララ
    relation: 記憶の修復を依頼している技術者
  arc: 記憶を取り戻すことは必ずしも幸福ではないと知るが、それでも「悲しみと共に生きること」を選択し、カイに影響を与える。
