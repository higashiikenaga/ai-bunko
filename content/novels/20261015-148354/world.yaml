title: 雨垂れの記憶と、錆びた歯車のコンパス
genre: SF
tone: 少し先の未来の日常を描く近未来SF。技術が変えた暮らしの手触りと、便利さの裏にある小さな寂しさ。
pov: 三人称近接
tense: 過去形
setting: 全自動管理システムが支配するドーム都市の、システムが感知しない旧区画とわずかにノイズが残る日常。
premise: 前作の決戦から半年後、システムに刻まれた微小なノイズと共に生きるカイとリナは、都市の海底に沈む旧時代のデータサーバー群『海底遺跡』の噂を聞きつける。かつてエララが遺した真鍮の鍵の新たな反応に導かれ、彼らは人々が『眠らない街』の光に依存する裏で忘れ去られた、真実の記憶の断片を回収する旅に出る。効率化された日常の隙間で、不完全な自分たちの過去と未来を手探りで繋ぎ合わせる物語。
themes:
- 不便さの中に宿る人間らしさ
- 失われた記憶と引き継がれる意志
rules:
- ドーム都市の管理システムは完全ではなく、カイたちが刻んだノイズにより一部の領域でエラーが許容されている
- 真鍮の鍵は、都市の深部や過去のデータ保管庫にアクセスするための特殊な物理デバイスである
- ナノマシンによる環境管理は基本機能として継続しており、天候や気温は原則として最適化されている
plot_outline:
- '序盤: システムに刻まれたノイズを抱えながら、カイとリナは旧区画でささやかな同居生活を始めていた。ある日、真鍮の鍵が微かに共鳴し、海底データ保管庫『海底遺跡』に関する不可解なシグナルを拾う。'
- '中盤: 二人は『眠らない街』と呼ばれる常に灯りの消えない商業区を抜け、都市の地下水路を通じて海底遺跡へと向かう。道中、システムの監視を逃れるため、古い物理端末や手動のバルブといった「不便な技術」を駆使する。'
- '終盤: 海底遺跡の最深部で、エララが遺した最後の記録と、ドーム都市建設以前の地球の正確な気候データを発見する。そこに執行官アリスが現れるが、彼女もまたシステムの変化に直面し、かつての絶対的な立場に迷いが生じていた。'
- '結末: データを完全に消去するのではなく、あえて不完全なまま都市のネットワークに散りばめる選択をするカイたち。管理された平穏でも完璧な自由でもない、自分たち自身の手で紡ぐ不確かな日常へ歩み出す。'
style_notes: 自動調光の照明やホログラムの壁といった近未来のガジェットを登場させながらも、触れる真鍮の冷たさや、淹れたての合成珈琲の苦みといった五感に訴える描写を重視する。便利すぎる世界の輪郭にある、少しの切なさと温かさを丁寧にすくい取る語り口。
