- name: 星野 つむぎ
  role: 主人公
  age: 17
  gender: 女性
  appearance: 動きやすいカーゴパンツに、インクの染みがついたエプロンを着用。明るい茶色のボブカットで、空の風を受けていつも少し髪が跳ねている。
  personality: 明朗快活で美味しいものが大好き。少しお節介焼きで、困っている人を放っておけない性格。一人称は「あたし」。
  speech_style: 元気ハツラツとした口調。「〜じゃん！」「〜だし！」と少し砕けた等身大の女子高生らしい話し方。
  background: 両親から空飛ぶ古本屋『ことのは堂』を受け継ぎ、相棒の猫型ロボットと共に様々な浮遊島を巡りながら店を営んでいる。
  motivation: お客さんの探している「思い出の一冊」を見つけ出し、笑顔にすること。
  relationships:
  - name: ハル
    relation: 客から特別な旅の同行者へ
  - name: シロ
    relation: 古くからの相棒・家族のような存在
  arc: ハルとの旅を通じて、自分自身の「誰かと一緒に美味しいものを分かち合う幸せ」に気づき、一歩踏み出す勇気を持つ。
- name: 雨宮 ハル
  role: 相棒（メイン相手役）
  age: 17
  gender: 男性
  appearance: 少し長めの黒髪に、どこか気だげなさそうに見えて実は緊張しいな目をしている。エプロンをつけると毎回盛大に紐が絡まるほどの不器用。
  personality: 何事にも不器用で失敗ばかりだが、目標に向かう情熱と優しさは本物。実はかなりの食いしん坊。一人称は「俺」。
  speech_style: ぶっきらぼうだが、照れると早口になる。「……別に、美味しくなかったわけじゃないけど」など、素直になれないツンデレ気味。
  background: 遠くの島から引っ越してきた転校生。幼い頃に食べた、離れ離れの家族との思い出のパンの味を再現したいと願っている。
  motivation: 「世界で一番美味しいパンのレシピ本」を見つけて、最高のパンを自分の手で焼くこと。
  relationships:
  - name: 星野 つむぎ
    relation: 旅の案内人からかけがえのないパートナーへ
  arc: つむぎと美味しいものを食べ歩き、失敗を恐れずに自分の気持ちや言葉を真っ直ぐに伝えられるようになる。
- name: シロ
  role: 脇役（マスコット）
  age: 不明（外見は成猫サイズ）
  gender: 無性別（オスっぽい振る舞い）
  appearance: 真っ白な毛並みに、本を読む時だけかける小さな丸眼鏡がトレードマークの喋る猫型浮遊生物。
  personality: 知性的で少し皮肉屋。だが、つむぎや古本屋の常連たちのことは密かに深く気にかけている。一人称は「僕」または「私」。
  speech_style: 紳士的かつ古風な口調。「まったく、若い人間というものは……」と呆れたようなセリフが多い。
  background: 『ことのは堂』の先代（つむぎの祖父）の頃から店にいる古株で、船の操縦や古文書の鑑定をサポートする。
  motivation: 『ことのは堂』の安全運行と、つむぎの良き保護者として見守ること。
  relationships:
  - name: 星野 つむぎ
    relation: 育ての親代わり이자 主人
  - name: 雨宮 ハル
    relation: 不器用な若者の試行錯誤を面白がりつつ応援する立場
  arc: 二人の恋模様を温かい目（時々厳しいツッコミ）で見守り、絶体絶命のピンチの際には的確なアドバイスでサポートする。
