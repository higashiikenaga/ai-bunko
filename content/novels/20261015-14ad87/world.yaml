title: ページをめくれば雲の上！〜空飛ぶ古本屋と、お腹ぺこぺこの恋物語〜
genre: 青春恋愛
tone: 明るくテンポの良いコメディタッチ
pov: 一人称（あたし）
tense: 現在形・過去形混在の軽快な語り
setting: 現代風の文明に「浮遊島」が点在する世界。拠点となるのは、店ごと空を飛べる古本屋『ことのは堂』。
premise: 古本屋の店番をしているあたしは、ある日「世界で一番美味しいパンのレシピ本」を探している超絶不器用な少年・ハルと出会う。本を探すため、あたしは店にある小型の空飛ぶ船で彼を連れて空の旅へ！美味しいものを食べて、笑って、いつの間にか彼にドキドキしちゃう、もぐもぐ青春ストーリー。
themes:
- 食欲と恋心
- 運命の一冊との出会い
rules:
- 本に宿る『読み手の強い記憶』を燃料にすることで、本棚付きの船が空を飛べる
- 燃料となる本は、読み手が深く感動した記憶が刻まれている必要がある
- 空飛ぶ島々にはそれぞれ独自の特産品（絶品グルメ）が存在する
plot_outline:
- '序盤: 空飛ぶ古本屋で働くあたしが、不器用すぎる転校生・ハルを客に迎え、『最高のパンを焼きたい』という無謀な依頼を受けて旅に出る。'
- '中盤: 空飛ぶ船で各地の浮遊島を巡り、名物料理に舌鼓を打ちながら、ハルの不器用だけど真っ直ぐな性格に惹かれていくあたし。'
- '終盤: 目的の本が見つかりそうになった瞬間、燃料（本）が底をつき、二人は名もなき小さな島に不時着。絶体絶命の状況で、互いの本音をぶつけ合う。'
- '結末: 最高のレシピで焼いたパンを分け合い、心もお腹も満たされた二人は、これからも一緒に『美味しい記憶が詰まった本』を探す旅を続けることを誓う。'
style_notes: 「あたし」視点の軽快な一人称。会話劇をメインにし、相手への鋭いツッコミを多用してキャラクターの可愛げを出す。特に食べ物の描写は、読者が空腹になるほど詳細かつ情熱的に記述すること。また、シリアスな展開の中でも、必ず一つはシュールな笑いどころを挿入してテンポを維持する。
