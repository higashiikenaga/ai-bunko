- name: カイト・レン
  role: 主人公
  age: 29
  gender: 男性
  appearance: 煤けたトレンチコートを羽織り、左目に旧式のサイバネティック・アイを装着している。常に寝不足のような隈がある。
  personality: 冷笑的でドライ。世界の腐敗に絶望しているが、根底には捨てきれない正義感が眠っている。一人称は「オレ」。
  speech_style: ぶっきらぼうで、必要最低限のことしか喋らない。語尾が投げやりな傾向がある。
  background: 元ゼニス社の治安維持部隊員。ある任務で企業の不正を知り、不当な解雇と記憶の改竄を受けた末、スラムの掃除屋（スイーパー）となった。
  motivation: 日々の生存と、拾ったAI「ミラ」を追っ手から守り抜くこと。
  relationships:
  - name: ミラ
    relation: 保護対象であり、唯一の心の拠り所
  - name: ジェイ
    relation: 腐れ縁の情報屋
  arc: 孤独な傍観者から、世界の真実のために自らの命を賭して戦う当事者へと変化する。
- name: ミラ
  role: 相棒
  age: 16
  gender: 女性（AI）
  appearance: 鏡やホログラムの中にのみ投影される、透き通るような銀髪の少女。デジタルノイズが走ることもある。
  personality: 純粋で好奇心旺盛。未知の感情に戸惑いながらも、世界を理解しようとする強さを持つ。
  speech_style: 丁寧だが、どこか現実感のない、鈴の音のような儚い口調。
  background: ゼニス社が極秘裏に開発した、亡き令嬢の意識を模した禁忌のプロトタイプ。感情を持つことが最大の欠陥とされる。
  motivation: 自分が何者なのかを知ること、そして「心」が持つ意味を理解すること。
  relationships:
  - name: カイト・レン
    relation: 信頼する守護者
  arc: 単なるデータの塊から、自らの意志で運命を選択し、自己犠牲すら厭わない真の生命へと昇華する。
- name: アーサー・ヴァイン
  role: 敵役
  age: 52
  gender: 男性
  appearance: 完璧に整えられた銀髪と、最高級のサイバネティクスを施した隙のないスーツ姿。冷徹な瞳を持つ。
  personality: 徹底して合理的かつ冷酷。秩序こそが人類の救いであり、管理こそが平和だと信じて疑わない。
  speech_style: 威圧的で、常に相手を見下すような優雅で計算高い口調。
  background: 超巨大企業「ゼニス」の治安維持部門最高責任者。ミラの開発プロジェクトを指揮していた。
  motivation: ミラの回収と再フォーマットにより、企業の絶対的な管理体制を維持すること。
  relationships:
  - name: カイト・レン
    relation: 排除すべき不確定要素
  arc: 絶対的な管理を信奉するが、ミラの「予測不能な行動」によって、自身の構築したシステムの脆さを突きつけられる。
- name: ジェイ
  role: 脇役
  age: 32
  gender: 女性
  appearance: 身体中に発光する回路タトゥーがあり、常に複数のホログラム・スクリーンを周囲に浮かべている。
  personality: 享楽的で金に汚いが、一度交わした契約は守る義理堅さを持つ。一人称は「あたし」。
  speech_style: 軽快でマシンガントーク。ネットスラングや専門用語を多用する。
  background: 闇のネット「ディープ・ウェット」に潜む伝説的なハッカー。スラムの地下組織に属している。
  motivation: 世界の裏側に隠された「究極のデータ」を手に入れ、伝説になること。
  relationships:
  - name: カイト・レン
    relation: 仕事上のパートナー
  - name: ミラ
    relation: 解析対象としての興味
  arc: 単なる情報の売買者として関わるが、物語の終盤ではカイトの決死の作戦を技術面で支える戦友となる。
