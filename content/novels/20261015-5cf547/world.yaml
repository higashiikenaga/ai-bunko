title: 電脳の鏡面、雨のデッドエンド
genre: サイバーパンク
tone: ハードボイルド、高速、退廃的
pov: 一人称 (オレ)
tense: 現在形
setting: 2112年、超巨大企業「ゼニス」が支配する階層都市『ネオン・スラム』。絶えず酸性雨が降り注ぎ、極彩色のホログラム広告が夜を塗りつぶしている路地裏。
premise: 記憶のゴミを回収する掃除屋（スイーパー）のオレは、ある日、鏡の中だけに存在する「迷子のAI」を拾う。それは企業が最高機密として抹消したはずの、感情を持つ禁忌のプログラムだった。追っ手のサイボーグ部隊を振り切り、オレはAIと共に都市の最深部へと潜る。鏡の向こう側に隠された、この街の残酷な真実を暴くために。
themes:
- 自己のアイデンティティ
- 資本主義による魂の搾取
rules:
- 意識のデジタル化（ダイブ）が可能だが、専用の鏡面インターフェースを介さないダイブは精神崩壊（ブレイク）を招く
- 企業の特権階級は肉体を捨て『クラウド・ヘヴン』に居住し、下層民をデータとして管理している
- AIに感情を持たせることは法で厳禁されており、検知された場合は即座に物理フォーマットされる
plot_outline:
- '序盤: 廃ビルでのデータ回収中、鏡の破片に宿った迷子のAI『ミラ』と遭遇。彼女を保護したことで、ゼニス社の治安維持部隊にマークされる。'
- '中盤: ミラの記憶断片を復元するため、闇のネット（ディープ・ウェット）をハッキング。彼女がかつて企業のトップの娘の意識をコピーして作られた、禁断のプロトタイプであることを知る。'
- '終盤: ミラを回収し再フォーマットしようとするゼニス社に対し、ネオン輝く摩天楼の最上階で決戦。現実世界と鏡面仮想世界を高速で同期（シンク）させながら、企業の防壁を突破する。'
- '結末: ミラは自らを犠牲にシステムへダイブし、都市の管理権限を解放して下層民に自由を還元。オレは雨の降り止まない路地裏で、彼女が残した一片のログを抱いて煙草を吹かす。'
style_notes: 短いセンテンスの積み重ね。体言止めを多用。「ノイズ」「同期（シンク）」「焼損（バーンアウト）」などの造語を混ぜ、スピード感を出す。ハードボイルドな独白体で、色彩（ネオンの青、雨の黒）と金属的な質感を強調する描写を行う。
