- name: 湊 凪沙（みなと なぎさ）
  role: 主人公
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と、儚げな印象を与える長い黒髪。冬の光に溶けそうなほど細い指先が特徴。
  personality: 内向的で静かだが、芯の強さを秘めている。記憶を失うことへの恐怖を抱えつつも、諦めきれない切望を持っている。一人称：私
  speech_style: 控えめで丁寧な口調。言葉を選ぶようにゆっくりと話す。
  background: 若年性の記憶喪失を伴う難病を患っており、少しずつ過去の記憶が欠落している。幼い頃に誰かと交わした「約束の丘」での誓いだけが、彼女を繋ぎ止める唯一の指標となっている。
  motivation: 記憶が完全に消えてしまう前に、「約束の丘」に辿り着き、幼い日の約束を果たすこと。
  relationships:
  - name: 櫂
    relation: 孤独を共有し、現在の瞬間を刻み合う特別な存在
  - name: 陽葵
    relation: 病状を理解し、精神的に支えてくれる親友
  arc: 過去の記憶に執着し、失うことに怯えていたが、櫂との出会いを通じて「今、この瞬間」に触れることの価値に気づく。
- name: 瀬戸 櫂（せと かい）
  role: 相棒
  age: 18
  gender: 男性
  appearance: 冷たさを感じさせる鋭い瞳と、整っているがどこか突き放したような表情。常に厚手の黒いコートを纏っている。
  personality: 不器用でぶっきらぼうだが、観察力が鋭く、相手の小さな変化に気づく優しさを持つ。馴れ合いを嫌い、孤独を好む。一人称：俺
  speech_style: 短文で突き放すような言い方をするが、言葉の端々に配慮が混じる。
  background: 家庭環境や過去の人間関係から周囲に心を閉ざしており、学校でも浮いた存在。偶然出会った湊の危うさと、記憶を失いながらも何かを追い求める姿に強く惹かれる。
  motivation: 湊が忘れてしまう記憶の代わりに、彼がすべてを記憶し、彼女の「今」を肯定すること。
  relationships:
  - name: 湊 凪沙
    relation: 守りたいと感じる、自分にとって唯一の理解者
  arc: 他者との関わりを拒絶していたが、湊を支えることで、誰かのために生きること、そして失われる運命にあるものを愛することの強さを知る。
- name: 佐倉 陽葵（さくら ひまり）
  role: 脇役
  age: 17
  gender: 女性
  appearance: ショートボブの明るい茶髪。冬でもカラフルなマフラーを巻き、太陽のような笑顔を絶やさない。
  personality: 天真爛漫で世話焼き。湊の病状を誰よりも心配しており、彼女が無理をしないよう気を配りながらも、全力で人生を楽しむことを促す。一人称：私
  speech_style: 快活でテンポが速い。相手を鼓舞するような明るい口調。
  background: 湊の幼馴染。湊の記憶が薄れていく過程をそばで見てきたため、彼女の「忘れられた思い出」を補完する役割を自認している。
  motivation: 湊が絶望せず、最後の日まで笑って過ごせる環境を作ること。
  relationships:
  - name: 湊 凪沙
    relation: かけがえのない親友
  - name: 櫂
    relation: 湊を支えるパートナーとして信頼し、時に背中を押す関係
  arc: 湊の病状悪化に心を痛め、無力感に苛まれることもあるが、櫂と湊の絆を見て、見守ることの尊さを学ぶ。
