title: 星図の残光と、祈りの夜祭
genre: 青春恋愛
tone: 静謐で切なく、微かな温もりを帯びた文体
pov: 三人称近接視点
tense: 過去形
setting: 前作の舞台から数年後。潮風と星空が近い、海沿いの静かな町
premise: 記憶を共有することで存在を繋ぎ止めた凪沙と櫂は、共に歩む日常を取り戻していた。しかし、凪沙の身体には時折、他者の記憶が混濁する「残響」の症状がつきまとう。夏祭りの夜、二人は古くから伝わる「星図」が示す、失われた記憶の在り処へと導かれていく。それは、誰かの欠落を埋めるための、優しくも痛みを伴う再会の物語。
themes:
- 記憶の継承と自己の確立
- 喪失を受け入れた上での再生
rules:
- 記憶を共有する者は、時として他者の感情や感覚を自身のものとして錯覚する『共鳴現象』が起こる
- 身体の透明化は、受け入れきれない強すぎる記憶の負荷によって進行する
- 『星図』は、失われた記憶の断片が天体の配置に投影される現象を指す
plot_outline:
- '序盤: 凪沙と櫂は、互いの記憶を分け合いながらも、平穏な学生生活を送っている。しかし凪沙は、時折見知らぬ誰かの記憶が流れ込んでくる感覚に怯え、自身の輪郭が揺らぐ不安を抱えていた。'
- '中盤: 夏の祭りの準備が進む中、凪沙は古い天文学資料の中に、かつての「約束の丘」と繋がる古い星図を見つける。その星図は、特定の星が重なる祭りの夜に、記憶の奔流を鎮める方法を示唆していた。二人はその真実を探るため、夜の海辺を歩む。'
- '終盤: 祭りの夜、星図が指し示す場所で、凪沙は自身の中に流れ込む「他者の記憶」の正体が、かつてこの町で消えていった人々の願いであることを知る。記憶の重圧に身体が透け始める凪沙を、櫂は自身の存在を懸けて抱きしめる。'
- '結末: 凪沙は記憶を拒絶するのではなく、それらを「誰かの生きた証」として受け入れることで、透明化を食い止める。祭りの喧騒が遠のく中、二人は失われるものへの哀しみと、共に生きる喜びを分かち合い、夜空を見上げる。'
style_notes: 感情を直接的な形容詞で説明せず、揺れる光や温度の変化、肌に触れる風の質感を通じて描写すること。病や喪失の痛みを淡々と、しかし慈しむように綴り、読者が登場人物の孤独にそっと寄り添えるような余白を残すこと。
