- name: レイ
  role: 主人公
  age: 17
  gender: 女性
  appearance: 煤けた髪、使い古された防塵マスク、継ぎ接ぎだらけの作業着、鋭い眼光。
  personality: 皮肉屋で極めて現実主義。生き延びることのみを絶対的な正義とする。「あたし」
  speech_style: ぶっきらぼうで、相手を突き放すような短い口調。
  background: 灰殻市のスラムで孤児として育ち、ガラクタを漁って日銭を稼ぐスカベンジャー。身体は栄養不足で細いが、反射神経は鋭い。
  motivation: フィルターの寿命と食糧不足を解決するための、価値ある物資の確保。
  relationships:
  - name: イザナ
    relation: 地下で出会う管理AI
  - name: ゼノ
    relation: 執拗に追ってくるライバル
  arc: ただ「死なないため」だけに動いていた空虚な魂が、美しさを「記憶に留める」という、生存とは無関係な高潔な選択を知る。
- name: イザナ
  role: 脇役
  age: 142
  gender: 不明（女性的な声）
  appearance: ノイズ混じりの淡いホログラム。半分ほど欠損しており、時折明滅する。
  personality: 穏やかで慈愛に満ちているが、システムエラーにより時折「嘘」を混ぜて現実を美化する。「私」
  speech_style: 丁寧だが、言葉の端々にデジタルなノイズが混じる。
  background: 地下図書館と温室の管理を担う旧文明のAI。数十年前に電源が落ちかけ、孤独の中で桜を守り続けてきた。
  motivation: 管理対象である「本物の桜」が、人類の記憶の中に正しく刻まれること。
  relationships:
  - name: レイ
    relation: 最後の訪問者にして、記憶の継承者
  arc: 機能停止（死）を目前にして、プログラムされた義務を超え、レイに「美しさを守るための諦念」を伝える。
- name: ゼノ
  role: 敵役
  age: 34
  gender: 男性
  appearance: 重厚な防護服、改造された機械義手、常に硝煙と油の臭いがする。顔に深い傷跡がある。
  personality: 強欲で残忍。弱肉強食こそが灰殻市の唯一のルールだと信じている。「俺」
  speech_style: 威圧的で、獲物を追い詰めるような低い声。
  background: スカベンジャー集団「ジャンク・ドッグス」のリーダー。地下の資源を独占し、地上の権力構造を塗り替えようと画策している。
  motivation: 地下図書館の技術と植物を独占し、自らの地位を盤石にすること。
  relationships:
  - name: レイ
    relation: 邪魔な小娘、あるいは獲物
  arc: 欲望のままに地下へ侵攻するが、レイが選んだ「何も持ち出さない」という理解不能な行動に、初めて自身の空虚さを突きつけられる。
