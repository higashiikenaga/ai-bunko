title: コンクリート・ジャンキーと、嘘つきな桜
genre: ディストピア
tone: 乾いた皮肉と、泥臭い人間味
pov: 一人称（あたし）
tense: 過去形
setting: 太陽が分厚い塵に遮られた灰色の都市「灰殻市（はいがらし）」。地表は酸性雨と産業廃棄物に覆われ、人々は巨大なコンクリートの残骸の中で物資を奪い合って生きている。
premise: 生き残るためにガラクタを漁るスカベンジャーのあたしは、ある日、都市の最深部に眠る「地下図書館」への地図を手に入れる。そこには、かつて世界を彩ったという「本物の植物」が保存されているという噂があった。濾過フィルターの寿命が尽きかけ、保存食の缶詰も底をついた絶望的な状況で、あたしはただの好奇心と、ほんの少しの期待を抱いて錆びた階段を降りる。
themes:
- 生存本能
- 絶望の中の美
rules:
- 地上の水は猛毒であり、携帯用濾過装置のフィルター残量が生存時間を直接的に決定する
- 紙の書籍は燃料か物々交換のチップとしてのみ価値があり、内容を理解して読む者は異常者とされる
- 植物の種子は厳格な管理下にあり、個人による所有は反逆罪として処刑対象となる
plot_outline:
- '序盤: フィルターの残量が残り3%という絶望的な状況で、あたしは取引相手から「地下図書館」の座標が記された古びたメモをせしめる。'
- '中盤: 競合するスカベンジャーたちの追撃を、口の悪い皮肉と手製のトラップでかわしながら、光の届かない地下の禁域へと潜入する。'
- '終盤: 埃にまみれた地下図書館で、死にかけた管理AIと出会い、そこにある温室で、合成ではない「本物の桜」がたった一本だけ咲いているのを目撃する。'
- '結末: 桜を地上に持ち出せばすぐに枯れるか、権力者に奪われると悟ったあたしは、最後の一本の煙草を吸いながらその美しさを記憶に刻み、空っぽの胃袋を抱えて再び灰色の地上へと戻る。'
style_notes: 一人称「あたし」による、突き放したような口調と毒舌なモノローグを徹底する。一方で、フィルターの残量や弾丸の数など、生存に直結する物資の数値を執拗に描写し、生存への切実さを出す。対比として、錆びた鉄の質感や、廃墟の隙間に差すわずかな光など、絶望的な風景の中にある小さな美しさを叙情的に描き出す。
