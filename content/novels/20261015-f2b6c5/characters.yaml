- name: エリアス・ヴォーン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常に灰色の長外套を纏い、瞳は記憶の過剰な消費により色素が薄れ、濁った灰色をしている。指先は常に古い書物のインクと塵で汚れている。
  personality: 冷徹で現実主義を装っているが、内面には妹への狂信的なまでの愛を秘めている。一人称は「僕」。
  speech_style: 低く抑えられた、感情の起伏の乏しい淡々とした話し方。
  background: 地下図書館の最下層で禁忌の記憶を回収する「書庫守」として、孤独に任務をこなしてきた男。
  motivation: 死にゆく妹の魂を繋ぎ止めるため、「最終列車」の切符を手に入れ、世界の果てへ向かうこと。
  relationships:
  - name: リーナ
    relation: 最愛の妹
  - name: サイラス
    relation: 唯一信頼を置く相棒
  arc: 妹を救うという人間的な目的のために、人間としての感情と記憶の全てを燃料として使い果たし、最終的に自我を持たぬ名もなき番人へと変貌する。
- name: サイラス・メイブ
  role: 相棒
  age: 30
  gender: 男性
  appearance: 軽薄そうな笑みを浮かべた青年。記憶を量るための銀製の天秤を常に携行している。
  personality: 享楽的で皮肉屋だが、一度交わした約束は命懸けで守る義理堅さを持つ。一人称は「俺」。
  speech_style: 軽快でリズムの良い、どこか人を食ったような口調。
  background: 元は記憶の運び屋として裏社会で名を馳せていたが、エリアスの目的を知り、その旅に同行する。
  motivation: エリアスの旅を完遂させること。その代償として、自らの正気と記憶を捧げることを決意している。
  relationships:
  - name: エリアス
    relation: 目的を共にする戦友
  arc: 目的達成のための代償として自らの理性を失い、エリアスを阻む悲劇的な異形の怪物へと堕ちる。
- name: 聖典官ヴァレリウス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 汚れ一つない純白の儀礼服を纏い、黄金に輝く瞳を持つ。威圧的なまでの美しさを湛えている。
  personality: 傲慢かつ独善的。都市の秩序を維持するためには個人の記憶など塵に等しいと考えている。一人称は「私」。
  speech_style: 慈悲を装った、極めて丁寧で冷酷な敬語。
  background: 灰都の支配層であり、地下図書館の管理運営を行う最高責任者。記憶を搾取することで永生を得ている。
  motivation: 都市の支配体制を維持し、自らの永遠なる統治を継続すること。
  relationships:
  - name: エリアス
    relation: 秩序を乱す排除すべき不浄な存在
  arc: 完璧な支配者として君臨するが、エリアスが引き起こした「真実の記憶」の氾濫により、自らが依って立つ世界の基盤を崩壊させられる。
- name: リーナ
  role: 脇役
  age: 16
  gender: 女性
  appearance: 透き通るように儚い外見を持つ少女。存在自体が陽炎のように揺らめいている。
  personality: 穏やかで献身的。兄の苦悩を誰よりも理解し、案じている。一人称は「私」。
  speech_style: 柔らかく、消え入りそうなほど微かな声。
  background: エリアスの妹。過剰な記憶の搾取による副作用で、魂が霧散しかかっている。
  motivation: 兄にこれ以上自分を犠牲にしてほしくないと願うこと。
  relationships:
  - name: エリアス
    relation: 守るべき兄
  arc: 救済されるものの、その代償としてエリアスの記憶から完全に消え去り、彼が忘却の淵へ落ちる直接的な原因となる。
