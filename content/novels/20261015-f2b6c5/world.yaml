title: 白骨の書架と終焉の特急
genre: 伝奇
tone: 冷徹、残酷、耽美
pov: 三人称
tense: 過去形
setting: 記憶を貨幣として消費する退廃的な近代都市「灰都」とその地下
premise: 記憶を切り売りして生き延びる街で、禁忌の記憶を回収する「書庫守」の男。ある日、彼は死にゆく妹の魂を救うため、世界の果てへと向かう「最終列車」の切符を探し始める。地下図書館の深淵に眠る残酷な真実と、対価として要求される絶望的な代償。光を捨てた男が、最後に掴み取るのは救済か、それとも永劫の孤独か。
themes:
- 記憶とアイデンティティ
- 救済に伴う不可避な喪失
rules:
- 記憶の売買：特定の記憶を切り離して譲渡することで、富や超常的な能力を得ることができる。
- 記憶の空洞：記憶を失った箇所には「空洞」が生じ、そこから精神を侵食する怪異が滲み出す。
- 最終列車の掟：この列車に乗車するためには、人生における「最も幸福な記憶」をすべて支払わなければならない。
plot_outline:
- '序盤: 記憶回収屋の主人公が、地下図書館の最下層で「存在しないはずの歴史」を記した頁を発見し、都市の支配層が記憶を搾取して永生を得ている陰謀を知る。'
- '中盤: 妹の魂を繋ぎ止める唯一の手がかりが最終列車にあると突き止める。同行した相棒が、目的を果たすための代償として自らの正気と記憶を捧げ、異形の怪物へと変貌し主人公に襲い掛かる。'
- '終盤: 最終列車の発車時刻直前、地下図書館の守護者たちとの凄惨な死闘を展開。勝利を掴むが、その過程で主人公は自身の人間としての感情と、妹に関する温かな思い出の大部分を燃料として消費する。'
- '結末: 目的地に到達し妹を救い出すことに成功する。しかし、代償により主人公は世界から完全に忘れられた存在となり、名前も顔も記憶も持たぬまま、永遠に地下図書館の番人として孤独に生き続ける。'
style_notes: 硬質で無機質な地の文を徹底し、感情を排した冷徹な描写を行う。視覚的な対比として、深淵の黒と、焼けるような白や血の赤を鮮烈に描く。台詞は極限まで短く、鋭く切り捨てる。勝利の瞬間にこそ、最も残酷な喪失を配置し、救いのなさを強調する。
