- name: カイト
  role: 主人公
  age: 19
  gender: 男性
  appearance: 無造作な茶髪に、空の風を象徴するようなゴーグルを頭に乗せている。使い込まれた革製の飛行服を着用。
  personality: 明るく猪突猛進だが、仲間への情は非常に厚い。一人称は「俺」。
  speech_style: 「～だぜ」「～じゃねえか」といった、活気のある砕けた口調。
  background: 浮遊島を渡り歩く運び屋。かつて空の嵐で両親を失い、独力でスカイ・ランナー号を維持してきた。
  motivation: 猫の記憶を取り戻すこと、そして世界の空に隠された真実を解き明かすこと。
  relationships:
  - name: ナシ
    relation: 相棒
  - name: リナ
    relation: 信頼する仲間
  - name: ヴァーン
    relation: 宿敵
  arc: 単なる自由な運び屋から、世界の運命を背負い、人々を守るために戦う真の操縦士へと成長する。
- name: ナシ
  role: 相棒
  age: 0
  gender: 不明
  appearance: 透き通るような白い毛並みを持つ猫。瞳には星屑のような不思議な光が宿っている。
  personality: 言葉は話さないが、感情が瞳や鳴き声を通じてカイトに伝わる。ミステリアスな存在感。
  speech_style: 「ニャア」「……」などの鳴き声のみ。
  background: 記憶の市場で、全ての記憶を失った状態で発見された「名前のない」獣。
  motivation: 失った自分自身の記憶と、本来持っていた「名前」を取り戻すこと。
  relationships:
  - name: カイト
    relation: 飼い主兼親友
  arc: 記憶の断片を辿る旅を通じて、自分が何者であるかを知り、自らの意志で「名前」を受け入れる。
- name: リナ
  role: 脇役
  age: 16
  gender: 女性
  appearance: 銀色のショートカット。油汚れのついた作業着を纏い、常に工具袋を腰に下げている。
  personality: 冷静沈着で論理的だが、機械のことになると非常に情熱的になる。一人称は「私」。
  speech_style: 「～です」「～ではありません」といった、丁寧だが少しぶっきらぼうな口調。
  background: 記憶の市場に住む孤児だったが、卓越した魔導整備技術を持つことからカイトにスカウトされた。
  motivation: スカイ・ランナー号を最高の状態に整備し、世界中の空を駆け巡ること。
  relationships:
  - name: カイト
    relation: 信頼する相棒
  arc: 孤独に機械と向き合ってきた日々から、仲間と共に困難に立ち向かうことの喜びを知る。
- name: ヴァーン
  role: 敵役
  age: 52
  gender: 男性
  appearance: 漆黒の礼服に身を包んだ、冷徹な眼差しの紳士。常に銀の煙管を手にしている。
  personality: 極めて合理的で傲慢。世界の混沌を嫌い、秩序のために犠牲を厭わない。一人称は「私」。
  speech_style: 「～たまえ」「～なのだよ」といった、尊大な貴族口調。
  background: 記憶の市場「メモリー・マーケット」を裏で操る支配者。記憶を資源として管理している。
  motivation: 世界の全ての記憶を燃料として、完璧な秩序を維持するための巨大空飛ぶ要塞を起動させること。
  relationships:
  - name: カイト
    relation: 排除すべき障害
  arc: 完璧な秩序を求めて暴走し、最終的に自らが作り出した嵐によって破滅へと向かう。
