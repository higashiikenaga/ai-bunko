title: 蒼穹のエンジンと忘却の追憶 ―名前のない猫と風の航路―
genre: 異世界ファンタジー
tone: 爽快で疾走感のある冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島が点在する天空世界「スカイ・アーキペラゴ」。蒸気機関と魔導風力が融合した文明。
premise: 空飛ぶ小型艇『スカイ・ランナー号』の操縦士カイトは、記憶を売買する闇市「メモリー・マーケット」の噂を追っていた。そこで彼は、持ち主の記憶を失い「名前のない猫」となった不思議な獣と出会う。猫が失った記憶の断片を辿る旅は、やがて世界の空を支配する巨大な嵐の正体へと繋がっていく。風を切り、エンジンを唸らせ、カイトたちは失われた真実を求めて雲海を駆け抜ける！
themes:
- 自己のアイデンティティ
- 失ったものとの再会
- 仲間との絆
rules:
- 記憶は結晶化して取引可能なエネルギー資源となる
- 高度が上がるほど風の魔力が強まり、高度な飛行技術が求められる
- 特定の記憶を失うと、その人物の「名前」さえも世界から消え去る
plot_outline:
- '序盤: 風の運び屋カイトが、記憶の市場で名前を失った白猫を拾い、共に空へ飛び立つ。'
- '中盤: 猫の記憶の欠片を求めて浮遊島を巡る中、カイトの仲間である整備士の少女や操縦士の老人が合流し、スカイ・ランナー号の絆が深まっていく。'
- '終盤: 記憶の市場を操る黒幕が、世界の全ての記憶を燃料に巨大な空飛ぶ要塞を起動させることを知り、カイトたちは全速力で決戦の空へ挑む。'
- '結末: 激しい乱気流と砲火を突き抜け、カイトたちは猫に「名前」を取り戻し、新しい風と共に未知の空へと旅立つ。'
style_notes: 天野ソラ特有の、機械の駆動音や風の匂い、雲を突き抜ける際のスピード感を重視した躍動感あふれる描写。金属の質感と、空の青さのコントラストを鮮やかに描き、読者がまるで一緒に飛空艇に乗っているかのような高揚感を与えること。
