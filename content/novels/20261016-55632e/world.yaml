title: 深海の伽藍と、渡り鳥の軌跡
genre: 本格ミステリー
tone: 重厚、静謐、理知的
pov: 一人称（観察者による語り）
tense: 過去形
setting: 現代、孤島にある海底遺跡調査施設および、渡り鳥の観測基地
premise: 断崖絶壁に立つ観測基地で、一人の考古学者が密室状態の研究所内で遺体となって発見された。遺体の傍らには、不可解なほど整然と並べられた渡り鳥の羽が残されていた。海中深く、未知の海底遺跡の調査が進む中で、不可解な現象が次々と発生する。私が見守る探偵は、静かに、しかし冷徹に、羽と海流が織りなす論理の糸を解き明かしていく。
themes:
- 閉鎖環境における人間心理
- 自然の摂理と計算された犯罪
rules:
- 全ての物理的な証拠（羽の角度、海流の周期、羽毛の組成）は、物語の記述の中に伏線として提示される
- 超自然的な現象は一切存在せず、全ての奇跡は論理的に説明可能である
plot_outline:
- '序盤: 孤島での不可解な死。密室の研究所、不自然な渡り鳥の羽、そして深海調査が進む中での不可解な通信途絶。探偵が現場に到着し、私に観察を促す。'
- '中盤: 二つ目の事件が発生。海底遺跡から引き揚げられた遺物が、物理的に不可能な方法で消失する。探偵は、渡り鳥の渡りのルートと、海底遺跡の構造が持つ数学的な共通点に目を留める。'
- '終盤: 探偵による推理の開始。提示された全ての断片的な情報（潮の満ち引き、羽の配置、観測機器の記録）を統合し、犯人がどのようにして密室を作り上げ、アリバイを構築したかを論理的に解体する。'
- '結末: 犯人の動機は、海底遺跡に眠る「ある真実」を隠蔽することにあった。論理によって真実が暴かれ、嵐と共に島を去る探偵の背中を見送りながら、私は深い喪失感に包まれる。'
style_notes: 「私」という観察者の視点を通じ、探偵の鋭い洞察を間接的に描写する。過度な形容詞を避け、事実と論理を積み重ねることで、読者が自力で謎に辿り着けるよう、手がかりはすべて地の文に、具体的かつ厳密に記述する。古典的な、格調高い硬質な文体を用いる。
