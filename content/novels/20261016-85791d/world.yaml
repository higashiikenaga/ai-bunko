title: 焦点の行方 ―潮騒の灯台と、僕らのメンテナンス―
genre: ヒューマンドラマ
tone: 静謐で誠実、職人の誇りが滲む
pov: 一人称（僕）
tense: 過去形
setting: 現代、霧の深い架空の沿岸部と、そこに点在する古い灯台
premise: 航路の安全を守る「灯台保守技術者」の物語。新人の「僕」は、最新のGPS技術が普及した今、なぜ古い灯台の光学機器を磨き続ける必要があるのか疑問を抱きながら、ベテランの職人たちに弟子入りする。荒涼とした岩場に佇む小さな作業所は、過酷な現場で働く彼らにとって、さながら「砂漠のオアシス」のような安らぎの場だった。使い込まれた「フレネルレンズ」の輝きを取り戻すため、微細な光の歪みと戦う日々の記録である。
themes:
- 専門技術の継承
- 不可欠な影の仕事
rules:
- 灯台の維持には、物理的な光学機器の精度が不可欠である
- 天候や霧の状況に応じて、レンズの角度や光の強さをミリ単位で調整する必要がある
plot_outline:
- '序盤: 技術派遣会社に入社した僕が、霧の深い沿岸部での灯台メンテナンス業務を開始する。慣れない作業に苦戦するが、師匠の丁寧な手仕事に圧倒される。'
- '中盤: 設置から数十年が経過した「古い灯台」の不調が判明する。最新機器の導入ではなく、レンズの洗浄と光軸の再調整という、地道で精密な作業が求められる。'
- '終盤: 記録的な濃霧が発生し、航行中の船が視界を失う。僕がメンテナンスしたばかりの灯台の光が、正確な屈折率を保って霧を割り、船を安全な航路へと導く。'
- '結末: 任務を終え、作業所で仲間と静かに語らう僕。目立たないけれど、誰かの命を支えているという、小さな、けれど確かな達成感を得る。'
style_notes: 野分風太の文体を遵守。新人である「僕」の視点から、「フレネルレンズ（光を集めるための特殊なレンズ）」「光軸（光の中心を通る線）」「屈折率（光が曲がる度合い）」などの専門用語が登場するたびに、その仕組みや職人のこだわりを丁寧に解説する。大きな事件よりも、ネジを締める感触や、磨き上げられたガラスの輝きといった、仕事の「手触り」を重視して描く。
