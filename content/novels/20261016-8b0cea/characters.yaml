- name: 源三郎
  role: 主人公
  age: 32
  gender: 男性
  appearance: 日焼けした逞しい体躯、節くれ立った大きな手、無造作に結った髪。作業着の着流し姿。
  personality: 職人気質でぶっきらぼう。口は悪いが、困っている者を見捨てられない情に厚い一面を持つ。一人称は「俺」。
  speech_style: 威勢が良く、江戸っ子らしいべらんめえ調。
  background: 浅草の長屋に住む腕利きの大工。腕は確かだが、効率よりも「手仕事の魂」を重んじるため、あまり儲けには執着していない。
  motivation: 拾った奇妙な機械の正体を探り、職人としての誇りにかけて、それを「まっとうな道具」として修理すること。
  relationships:
  - name: お初
    relation: 長屋の馴染みであり、気にかけている妹分のような存在
  - name: 徳兵衛
    relation: 商売敵としての嫌悪感を抱く相手
  arc: 効率を追い求める周囲の騒動に辟易していたが、機械に込められた「願い」を知ることで、技術とは人の心を豊かにするためにあるのだと再認識する。
- name: お初
  role: 相棒・ヒロイン
  age: 19
  gender: 女性
  appearance: ぱっちりとした瞳と、いつも明るい表情。清潔感のある小綺麗な着物姿。
  personality: 好奇心旺盛で天真爛漫。長屋の情報をいち早く察知する情報通。一人称は「私」。
  speech_style: 朗らかで、語尾が跳ねるような明るい話し方。
  background: 長屋の入り口で茶屋を営む娘。長屋の住人たちから慕われ、世話焼きな性格。
  motivation: 新しい機械がもたらす「便利さ」にワクワクし、長屋のみんながもっと楽に暮らせるようになることを願う。
  relationships:
  - name: 源三郎
    relation: 頼りにしている兄貴分
  - name: 留吉
    relation: 可愛がっている弟のような存在
  arc: 蒸気の力による便利さに夢中になるあまり、人との繋がりが希薄になる危うさを目の当たりにし、真の豊かさに気づく。
- name: 徳兵衛
  role: 敵役
  age: 45
  gender: 男性
  appearance: 恰幅の良い体格。仕立ての良い高級な着物を着こなし、常に計算高い目をしている。
  personality: 強欲で現実主義。新しい技術を「金を生む道具」としてしか見ていない。一人称は「わたくし」。
  speech_style: 丁寧だが、どこか相手を見下したような慇懃無礼な話し方。
  background: 浅草で呉服問屋を営む商売人。利益を拡大するために、蒸気機関の技術を独占しようと画策する。
  motivation: 蒸気機関を商売に利用し、江戸の流通を支配すること。
  relationships:
  - name: 源三郎
    relation: 機械の修理を阻止しようとする邪魔な職人
  arc: 機械による効率化がもたらした長屋の崩壊と混乱を目の当たりにし、人の情けを無視した進歩の虚しさを知る。
- name: 留吉
  role: 脇役
  age: 7
  gender: 男性
  appearance: 小柄で活発な少年。常に膝の擦り切れた着物を着ており、名もなき三毛猫を連れている。
  personality: 純粋無垢で、子供らしい好奇心の塊。一人称は「僕」。
  speech_style: 無邪気で、感情がすぐに声に出る話し方。
  background: 長屋で暮らす孤児。猫が唯一の友人で、機械を「魔法の箱」だと信じ込んでいる。
  motivation: 機械を使って、長屋のみんなと楽しく遊びたい。
  relationships:
  - name: お初
    relation: 慕っているお姉ちゃん
  - name: 名もなき猫
    relation: 一番の親友
  arc: 機械が引き起こした騒動に怯えることもあるが、源三郎が直した機械の美しさを見て、科学の持つ「優しさ」を直感的に理解する。
