title: 長屋の蒸気と、名もなき猫の縁
genre: 歴史・時代小説
tone: 賑やかで人情味あふれる江戸の風情
pov: 三人称
tense: 過去形
setting: 江戸時代中期、浅草の賑やかな長屋
premise: 腕はいいが口の悪い大工の源三郎が、ある日、出所不明の「蒸気を吐く不思議な鉄の箱」を拾う。長屋の連中がその奇妙な機械に翻弄され、効率を追い求めて大騒動に巻き込まれていくが、そばには常に名もなき一匹の三毛猫が寄り添っていた。機械の正体と、そこに込められた切ない願いが明らかになるにつれ、江戸の町に温かな涙が流れる。
themes:
- 人情と絆
- 伝統と新奇な技術の調和
rules:
- 蒸気機関はあくまで「珍しい仕掛け」として扱い、社会構造を変えるレベルではなく、個人の発明品として描く
- 江戸の風習、階級制度、当時の生活様式を厳守する
plot_outline:
- '序盤: 浅草の長屋に住む源三郎と、彼を慕う賑やかな住民たち、そして名前のない猫が登場。ある日、異国から流れてきたという奇妙な蒸気機関の模型が長屋に持ち込まれ、街中に好奇心が広がる。'
- '中盤: 蒸気の力で物を動かす快感に、長屋の住民たちが夢中になり、家事や仕事を効率化しようと競い合う騒動が起きる。しかし、機械の不具合で長屋は大混乱に陥り、住民同士の喧嘩が勃発する。'
- '終盤: 機械の製作者が遺した手紙が見つかり、それが遠い異国に住む娘へ宛てた、愛と後悔を込めた贈り物であったことが判明。源三郎は江戸の職人魂をかけて、機械を「人々を笑顔にする道具」に作り替える。'
- '結末: 七夕の夜、修理された機械が美しい蒸気の輪を空に描き、住民たちが冷やしそうめんを囲んで笑い合う。名もなき猫が満足げに喉を鳴らし、江戸の粋と人情に包まれた夜で幕を閉じる。'
style_notes: 藤堂小太郎節を全開にする。べらんめえ口調の軽快な掛け合いを多用し、長屋の喧騒を活写すること。初夏の梅雨時のしっとりとした空気感と、旬の食材（冷やしそうめん、梅干し等）の描写を丁寧に盛り込み、最後は心温まる人情話で締める。
