- name: 瀬戸 悠真（せと ゆうま）
  role: 主人公
  age: 23
  gender: 男性
  appearance: 清潔感はあるが少し頼りなげな雰囲気。眼鏡をかけており、真面目そうな印象を与える青年。
  personality: 誠実で感受性が豊か。物事の細かな変化に気づきやすい。一人称は「僕」。
  speech_style: 丁寧で控えめな敬語。困ったときには少し言葉が詰まる癖がある。
  background: 大学を卒業後、進路に迷い「人の役に立ちたい」という抽象的な動機でメモリア・アーカイブスに入社した新人。
  motivation: 遺品整理という仕事の本質を理解し、プロとしての自覚を持つこと。
  relationships:
  - name: 佐伯 誠司
    relation: 教育係であり、尊敬する先輩
  arc: 仕事の表面的な作業（片付け）に追われていた状態から、遺品に込められた想いを汲み取り、生者の未来を支えるという仕事の真価に気づく成長。
- name: 佐伯 誠司（さえき せいじ）
  role: 相棒（メンター）
  age: 45
  gender: 男性
  appearance: 使い込まれた作業着が似合う、がっしりとした体格。目尻に深い笑い皺がある。
  personality: 冷静沈着で職人気質。一見厳格だが、故人の持ち物に対して深い敬意を払う情熱家。一人称は「俺」。
  speech_style: ぶっきらぼうだが、言葉の端々に温かみがある。指示は的確で簡潔。
  background: 元・鑑定士。数多くの遺品に触れてきた経験から、「物は記憶の器である」という哲学を持っている。
  motivation: 依頼人の心の整理を完遂させ、故人の生きた証を正しく後世へ繋ぐこと。
  relationships:
  - name: 瀬戸 悠真
    relation: 部下であり、未熟ながらも可能性を感じている後輩
  arc: 地図の謎を解く過程で、自身の過去の失敗や、失ってしまった大切な記憶と向き合う。
- name: 高柳 志乃（たかやなぎ しの）
  role: 脇役（依頼人/鍵を握る人物）
  age: 32
  gender: 女性
  appearance: 落ち着いた服装の知的な女性。どこか寂しげな瞳をしている。
  personality: 論理的で感情を表に出さないタイプ。故人である地図製作者の姪にあたる。一人称は「私」。
  speech_style: 事務的で淡々としているが、地図の謎に触れるとわずかに声が揺れる。
  background: 故人の遺産相続手続きのために事務所に連絡してきた。叔父の遺した地図の謎を、単なる迷信として片付けようとしている。
  motivation: 叔父が遺した不可解な遺言を、法的な手続きとして完結させること。
  relationships:
  - name: 瀬戸 悠真
    relation: 調査をサポートする協力者
  arc: 叔父の遺志を知ることで、叔父との断絶していた絆を再確認し、自身の喪失感を癒していく。
