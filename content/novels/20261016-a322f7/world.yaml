title: 僕らの記憶の棚卸し
genre: ヒューマンドラマ
tone: 誠実で温かみがあり、専門的な知的好奇心に満ちた雰囲気
pov: 一人称（僕）
tense: 過去形
setting: 現代日本。遺品整理とアーカイブ（記録保存）を専門とする小規模な事務所「メモリア・アーカイブス」
premise: 遺品整理士という職業に憧れて就職した新人「僕」が、単なる片付けではなく「故人の人生を整理する」という仕事の誇りを学んでいく物語。ある日、元地図製作者の遺品の中に、不可解な条件が記された遺言書と、断片的な「秘密の地図」を発見する。僕たちは遺品の一つひとつに隠された意味を紐解きながら、地図が指し示す「故人が本当に遺したかったもの」を探し出す旅に出る。
themes:
- 職業的誇り
- 記憶の継承
- 物の価値の再定義
rules:
- 遺品整理の現場では、感情的に価値がある物（メモリアル品）と、実用的・金銭的に価値がある物（資産品）を厳格に分けて管理する
- 秘密の地図は物理的な宝の地図ではなく、故人の思い出の場所を繋いだ精神的な地図である
- 専門用語が登場する際は、必ず新人の僕が独り言やメモ形式で、読者に分かるように解説する
plot_outline:
- '序盤: 業界未経験の僕が「メモリア・アーカイブス」に入社。ベテランの先輩から、遺品の「分別」や「鑑定」といった基礎知識を叩き込まれ、仕事の厳しさと、一つの物を正しく整理できた時の小さな達成感を味わう。'
- '中盤: 元地図製作者の男性の依頼を引き受ける。遺言書には「地図を完成させた者に、私の全財産を譲る」とあったが、そこには金銭的な財産ではなく、人生の教訓が隠されていた。僕たちは家中の古書や手紙から、切り刻まれた秘密の地図の断片を集め始める。'
- '終盤: 地図の断片を繋ぎ合わせると、それはかつて故人が愛した、今は地図から消えてしまった小さな集落の道標だった。僕たちはその場所を実際に訪れ、そこで待ち受けていた故人の旧友や家族との再会をサポートする。'
- '結末: 物理的な遺品は片付いたが、心の整理がついた遺族の姿を見て、僕は自分の仕事が「死後の片付け」ではなく「生者のための再出発」であることを確信する。プロとしての自信を胸に、次の現場へ向かう。'
style_notes: 一人称「僕」による語りで、新人がもたつきながらも成長する様子を描く。遺品整理士としての専門用語（例：『遺品整理士』『遺品選別』『遺品買取』など）を丁寧に解説し、仕事のディテールを具体的に描写する。大きなドラマよりも、埃っぽい部屋が綺麗になった瞬間や、忘れられていた写真が見つかった瞬間の、静かな達成感を重視して執筆する。
