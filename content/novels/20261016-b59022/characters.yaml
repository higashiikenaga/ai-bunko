- name: エリアン・フォルテ
  role: 主人公
  age: 15
  gender: 男性
  appearance: 旅人の軽装、風に揺れる銀髪、使い込まれたヴァイオリンのケースを背負っている。
  personality: 正義感が強く、好奇心旺盛。一人称は「僕」。
  speech_style: 活発で、感情が声に乗って跳ねるような話し方。
  background: 辺境の浮遊島で育った少年。音を操る才能を持つが、まだ未熟な技術しか持たない。
  motivation: 消えた村の謎を解き、自分の中に響く「失われた音」の正体を知ること。
  relationships:
  - name: ライラ・ルナ
    relation: 運命の共鳴者
  - name: ヴェイン・クロム
    relation: 追跡者であり対立者
  arc: 個人の技術を磨く奏者から、他者と響き合い世界を救うための「和音」を導く指揮者へと成長する。
- name: ライラ・ルナ
  role: ヒロイン/共鳴者
  age: 17
  gender: 女性
  appearance: 霧のような淡い水色の長い髪、記憶を失い虚ろな瞳、透き通るような白い肌。
  personality: 穏やかだが、どこか現実離れした儚さを持つ。一人称は「私」。
  speech_style: 旋律を奏でるような、静かでリズムのある話し方。
  background: 霧の海で発見された、声を持たない歌姫。彼女の記憶は『音のない村』の存亡と直結している。
  motivation: 自分が何者であるかを知り、失われた声を完全に取り戻すこと。
  relationships:
  - name: エリアン・フォルテ
    relation: 魂の伴侶
  - name: ヴェイン・クロム
    relation: 追跡の対象
  arc: 自身の欠落と過去の悲劇を受け入れ、世界を繋ぎ止めるための「最後の歌」を捧げる覚悟を決める。
- name: ヴェイン・クロム
  role: ライバル/密偵
  age: 25
  gender: 男性
  appearance: 黒い外套、音を蒐集するための特殊な小瓶を腰に複数下げている、鋭い眼光。
  personality: 冷徹で合理的。音を感情ではなく「資源」として評価する。一人称は「俺」。
  speech_style: 簡潔で、相手を突き放すような冷たい口調。
  background: 音の蒐集を任務とする秘密組織の密偵。不協和音の発生源を追っている。
  motivation: 村の消滅に関わる「究極の音」を組織に持ち帰り、その力を管理すること。
  relationships:
  - name: エリアン・フォルテ
    relation: 邪魔な闖入者
  - name: ライラ・ルナ
    relation: 最も価値ある蒐集対象
  arc: 音を支配しようとする欲望から、音が持つ「調和」の真の美しさに触れ、自らの信念を問い直す。
- name: プリズム
  role: 謎の存在/鍵
  age: 不詳
  gender: 不明
  appearance: 鏡の破片が集合して形成された、光り輝く少女の幻影。
  personality: 感情が希薄だが、時折切ない響きを漏らす。一人称は「……」
  speech_style: 言葉ではなく、音の断片として意思を伝える。
  background: 消えた村が次元の狭間に封じられた際、村の旋律が結晶化した存在。
  motivation: 閉じ込められた村の住民を、和音によって現世へと解き放つこと。
  relationships:
  - name: エリアン・フォルテ
    relation: 奏者
  - name: ライラ・ルナ
    relation: 器
  arc: 存在が消滅するリスクを冒しながら、世界に真実の和音を届けるための媒介となる。
