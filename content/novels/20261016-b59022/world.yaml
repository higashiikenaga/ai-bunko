title: 残響のプリズムと、銀の旋律に消えた村
genre: 群像劇
tone: 幻想的でリズミカル、哀愁を帯びた音楽的叙事詩
pov: 三人称
tense: 過去形
setting: 音色が物理的な力を持つ、浮遊島と霧の海が広がる世界
premise: 世界は奏でられる調べによって形を成し、不協和音は災厄を招く。ある日、地図から忽然と消えた『音のない村』の謎を巡り、三人の奏者が交差する。追跡する楽師、記憶を失った歌姫、そして鏡の中に閉じ込められた旋律。彼らの歌声が重なる時、世界に失われた真実の和音が響き渡る。
themes:
- 喪失と再生
- 調和の真意
- 記憶の共鳴
rules:
- 音楽の旋律は物理的な干渉力（風、光、重力）を持つ
- 特定の旋律を歌うことで、対象の記憶を呼び覚ますことができる
- 鏡は音を反射・増幅させる装置として機能する
plot_outline:
- '序盤: 楽師の少年が、旅の途中で地図にない『消えた村』の跡地を見つけ、そこに残された不思議な鏡の破片を拾う。'
- '中盤: 鏡の破片を追う過程で、歌を失った歌姫と、音を蒐集する密偵が出会い、それぞれの目的が村の消滅と繋がっていることを知る。'
- '終盤: 鏡の迷宮で、村が『不協和音』によって次元の狭間に封じられたことが判明。三人は命を削るような合奏を開始する。'
- '結末: 完璧な和音が響き、村は姿を取り戻すが、代償として彼らの歌声は世界に溶け込み、新たな伝説として語り継がれる。'
style_notes: 文章は三拍子や四拍子のリズムを意識し、読者が音楽を聴いているかのような躍動感を持たせる。各話の冒頭や転換点には、必ずその場面の情景を象徴する『詩（歌詞）』を挿入すること。例：『震える弦が夜を裂き、銀の雫が空を舞う。あの日、私たちは旋律を失った。』といった表現を織り交ぜる。
