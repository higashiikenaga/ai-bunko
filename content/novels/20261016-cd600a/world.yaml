title: 不夜城の古本屋、本日も盛大に読み間違え中！
genre: 日常ほのぼの
tone: ハイテンション・勘違いコメディ
pov: 三人称（ツッコミ多め）
tense: 現在形・過去形混在
setting: 24時間眠らない街、路地裏の古本屋『まどろみ書房』
premise: 不夜城と呼ばれる眠らない街の片隅で、店主の青年・レンは『本を売る』ことよりも『客の勘違いを加速させる』ことに命をかけている。ある日、凄腕の暗殺者を名乗る（実際はただの極度の人見知りな）女性客が来店し、彼女の些細な言動が街全体を巻き込む大事件へと勘違いされていく。本の内容と現実が絶妙にすれ違い、事態はなぜか平和な方向へと爆走する。本一冊を巡る、文字通りの「読み間違い」から始まるドタバタ劇。
themes:
- コミュニケーションの難しさ
- 言葉の定義のズレ
rules:
- 店主のレンは、客の言葉を極端に深読みして、勝手に物語の展開を作り上げる癖がある
- 街の住人は全員、少しずつ何らかの「思い込み」を抱えている
plot_outline:
- '序盤: 眠らない街の古本屋に、怪しい雰囲気の女性・ミナが来店。彼女が探していた『毒入りの一冊』は、実は単なる『毒々しい色の表紙の本』だったが、レンはそれを暗殺計画だと勘違いする。'
- '中盤: レンが「暗殺を阻止するヒーロー」として振る舞うたびに、ミナは「プロの隠密」として振る舞い、周囲の住民は「街の平和を守るための壮大な聖戦」が始まったと勘違いし、街中が謎の熱狂に包まれる。'
- '終盤: 勘違いが極限に達し、街の警察組織までもが『古本屋を守るための特殊部隊』として出動。レンが差し出した「ただの辞書」が、なぜか「世界の運命を左右する聖典」として扱われ、大騒動のクライマックスへ。'
- '結末: 全ての誤解が解けるどころか、住民たちは「これこそが現代の神話だ」と納得して日常に戻る。ミナは常連になり、レンは今日もまた、本の内容を勝手に解釈して新しい勘違いを生み出し続ける。'
style_notes: 地の文は常に客観的かつ、登場人物のズレた行動に対してキレのあるツッコミを入れること。伏線は「本の内容」や「店内の小道具」としてさりげなく配置し、必ずギャグ的な結末（例：深刻な伏線がただの掃除道具だった等）で回収する。各話の最後には、勘違いが一段階レベルアップした状態を描写してオチをつける。
