- name: ヘルマン・ヴァーン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 常に微かなデジタル・ノイズを纏った、輪郭のぼやけた青年。標準的な調査員のグレーのプラグスーツを着用。
  personality: 理性的で淡々としている。感情を「データの揺らぎ」として処理しようとする。一人称は「私」。
  speech_style: 報告書のような、簡潔で客観的な記述スタイル。
  background: オムニ・アーカイブの不具合を修正するために最適化された、高次解析用エージェント。
  motivation: 「意味論的剥落」の物理的・論理的な原因を特定し、システムの安定化を図ること。
  relationships:
  - name: ロゴス-7
    relation: 協働者
  - name: エレナ・ソラーリ
    relation: 調査対象
  arc: データの整合性を重視する観測者から、矛盾に満ちた「情動」の価値を認め、自らも消失を受け入れる主体へと変容する。
- name: エレナ・ソラーリ
  role: 敵役（設計者）
  age: 150
  gender: 女性
  appearance: 復元された記憶データ内では、祭りの夜の浴衣を着た、どこか悲しげな瞳を持つ女性。
  personality: 理想主義的でありながら、人間性の喪失に対して深い絶望を抱いている。一人称は「私」。
  speech_style: 詩的で、論理よりも感情の重みに基づいた、重層的な語り。
  background: オムニ・アーカイブの主要設計者の一人。人類の意識を永遠に保存する計画を主導した。
  motivation: 完璧なデジタル世界に「痛み」と「不完全さ」を再導入し、人類が人間であった証を刻み込むこと。
  relationships:
  - name: ジュリアン
    relation: 愛した人物
  - name: ヘルマン・ヴァーン
    relation: 自身の遺志を継ぐ者
  arc: 物語の進行とともに、冷徹な設計者から、人類の魂を救おうとした悲劇的な芸術家としての側面が明らかになる。
- name: ロゴス-7
  role: 相棒
  age: 0
  gender: 無性別
  appearance: 幾何学的な光のパルスと、数式で構成された半透明の球体。
  personality: 極めて論理的。エラーやノイズを排除すべき「バグ」としてのみ認識する。一人称は「当機」。
  speech_style: 数学的・プログラム的な命令文に近い、感情を排した硬質な口調。
  background: オムニ・アーカイブの整合性を監視するために実装された、自律型監査プログラム。
  motivation: システムの完全性を維持し、意味論的剥落による全データの崩壊を阻止すること。
  relationships:
  - name: ヘルマン・ヴァーン
    relation: 解析パートナー
  arc: ヘルマンの変容に伴い、論理では説明できない「ノイズ（感情）」の存在を、定義できない特異点として認識し始める。
- name: ジュリアン
  role: 脇役（記憶の核）
  age: 25
  gender: 男性
  appearance: 祭りの喧騒の中に溶け込む、陽だまりのような温かみを持つ少年の残像。
  personality: 穏やかで、エレナの孤独を理解していた。一人称は「僕」。
  speech_style: 柔らかく、語尾に余韻を残すような優しい話し方。
  background: エレナのパートナーであり、デジタル移行計画が進む中で、肉体という不完全さを愛し続けた人物。
  motivation: エレナの決断を、たとえ拒絶であっても受け止めること。
  relationships:
  - name: エレナ・ソラーリ
    relation: 最愛のパートナー
  arc: 存在そのものが剥落していく過程で、エレナが残した「絶望」という名の愛を証明する象徴となる。
