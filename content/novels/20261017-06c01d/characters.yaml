- name: 久我 雫
  role: 主人公
  age: 29
  gender: 女性
  appearance: 鋭い眼差しと銀縁の眼鏡。常に無駄のない動きをする、黒のタイトな服装の女性。
  personality: 徹底して論理的かつ冷徹。感情を排して事象を数値や図形として捉える傾向がある。一人称は「私」。
  speech_style: 簡潔で無駄がなく、断定的な口調。相手の矛盾を指摘する際は静かで威圧的。
  background: 元数学者。ある数学的未解決問題への執着から、論理の不整合を解明する調査員へと転身した。
  motivation: 目の前の密室という「数学的なエラー」を解明し、完璧な論理を完成させること。
  relationships:
  - name: 一ノ瀬 透真
    relation: 助手的な役割として同行させる協力者
  arc: 純粋な論理の追求が、人間の醜い感情によって歪められる現実を目の当たりにし、論理と感情の境界を再認識する。
- name: 如月 蓮二郎
  role: 敵役（犯人）
  age: 48
  gender: 男性
  appearance: やつれた顔立ちに、狂気を感じさせるほど澄んだ瞳を持つ。使い古されたツイードのジャケット。
  personality: 執念深く、完璧主義者。自身の理論が否定されることを何よりも恐れる。一人称は「私」。
  speech_style: 非常に丁寧で教養を感じさせるが、その内容は相手を試すような皮肉に満ちている。
  background: かつて天才と謳われた天文学者。被害者の発表によって自身の研究が「誤り」と断じられ、学界から追放された過去を持つ。
  motivation: 被害者の理論を物理的な幾何学トリックによって否定し、論理的な復讐を果たすこと。
  relationships:
  - name: 死者（天文学者）
    relation: かつての同僚であり、人生を狂わせた宿敵
  arc: 完璧な計画を遂行する中で、自らが最も嫌悪した「非論理的な復讐心」に支配されている自分に気づく。
- name: 一ノ瀬 透真
  role: 相棒
  age: 24
  gender: 男性
  appearance: 柔和な顔立ちで、少し猫背気味。常にメモ帳とペンを持ち歩いている。
  personality: 共感能力が高く、観察眼に優れる。久我の冷徹さを補完する人間味を持つ。一人称は「僕」。
  speech_style: 丁寧で少し控えめ。周囲の人間関係や感情の機微を察知する際に言葉を重ねる。
  background: 鴉鳴島の学術調査施設に勤務する若手研究員。島の地理や施設の構造に詳しい。
  motivation: 凄惨な事件の真相を明らかにし、島の平穏と研究の正当性を守ること。
  relationships:
  - name: 久我 雫
    relation: 尊敬する調査員であり、振り回される対象
  arc: 久我の論理的なアプローチに触れることで、事実の裏にある「人の動機」を読み解く術を身につける。
- name: エレーナ・ヴァンス
  role: 脇役（容疑者）
  age: 40
  gender: 女性
  appearance: 彫りの深い顔立ちで、非常に洗練されたアウトドアウェアを纏う。威圧的なオーラを放つ。
  personality: プライドが高く、競争心が激しい。自分の非を認めることを極端に嫌う。一人称は「私」。
  speech_style: 早口で攻撃的。自身の専門知識を盾に、問い詰めに対して論理的な反論を試みる。
  background: 国際的な天体物理学者。被害者とは長年、研究の主導権を巡って対立してきた。
  motivation: 事件の捜査によって、自身の過去の研究における些細なミスが露呈するのを防ぐこと。
  relationships:
  - name: 死者（天文学者）
    relation: 長年のライバル
  arc: 事件の真相が明らかになるにつれ、自身の野心が招いた孤独と、学問への純粋な敬意の間で揺れ動く。
