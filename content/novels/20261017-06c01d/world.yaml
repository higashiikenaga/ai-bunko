title: 影の幾何学と欠損する月光
genre: 本格ミステリー
tone: 冷徹、論理的、閉鎖的
pov: 三人称
tense: 過去形
setting: 現代、断崖絶壁に位置する孤島・鴉鳴島（あめいじま）の、廃れかけた古い灯台と学術調査施設。
premise: 皆既月食の夜、孤島の古い灯台の最上階にて、著名な天文学者が密室状態で死亡していた。窓は内側から施錠され、唯一の出入り口も閉ざされていた。現場に残されたのは、不自然な角度で配置された天体観測器具と、月食の影が描いた奇妙な幾何学模様のみである。物理的な矛盾と、光の消失が引き起こした「視覚的な密室」の謎を、冷徹な探偵が解き明かしていく。
themes:
- 観測による現実の変容
- 論理の整合性と感情の不整合
rules:
- 密室は物理的に外部からの侵入が不可能であること
- 月食による光量の変化と影の移動が、トリックの物理的根拠となること
- 提示されるすべての手がかりは、記述の中で数学的・物理的に整合性が取れていること
plot_outline:
- '序盤: 月食の観測を目的に、学術調査施設に集まった数名の研究者。月食のピーク時、灯台の最上階から悲鳴が上がるが、扉を開けるとそこには密室状態で絶命した天文学者の姿があった。'
- '中盤: 探偵による現場検証。探偵は死体の配置、灯台のレンズの回転周期、そして月食の進行による影の軌跡を冷徹に分析する。(窓は閉まっている。だが、光の入射角には明らかな不連続がある)。容疑者たちの証言は、論理的な矛盾を孕んだ皮肉な応酬へと変わっていく。'
- '終盤: 探偵が、月食の影を利用して「存在しない時間」を作り出した犯人の計画を暴く。犯人が使用した道具と、灯台の構造が、いかにして密室という錯覚を構築したのかが幾何学的に証明される。'
- '結末: 犯人の動機は、学術的な真実を隠蔽しようとした被害者への、論理的な復讐であった。月食が終わり、再び光が戻ったとき、すべての不合理が合理へと収束する。'
style_notes: 文体は極めて理性的で、情緒を排した冷淡なトーンを維持する。会話劇は、登場人物同士が論理的整合性を武器に攻撃し合うような、皮肉に満ちたディベートの形式をとる。探偵の思考プロセスは括弧書き
  `( )` で記述し、読者が解法に辿り着くための論理的ステップ（伏線）を、感情に流されず淡々と提示すること。
