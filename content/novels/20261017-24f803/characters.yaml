- name: 佐藤 奏太 (さとう そうた)
  role: 主人公
  age: 17
  gender: 男性
  appearance: どこにでもいる平凡な男子高校生。少し猫背で、視線を合わせるのが苦手な印象を与える。
  personality: 内向的で思慮深いが、感情を言葉にするのが極端に下手。一人称は「ボク」。
  speech_style: 丁寧だが、どこか自信なさげで言葉を選びすぎる話し方。
  background: 周囲との衝突を避けるために自分を抑えて生きてきた、典型的な「透明な生徒」。
  motivation: アプリの相手（ノイズ）との繋がりを守ること、そして凛との本当の向き合い方を見つけること。
  relationships:
  - name: 瀬戸 凛
    relation: クラスメイトで犬猿の仲。アプリ内では『ノイズ』として意気投合する相手。
  arc: デジタルな仮面に隠れて逃げていた自分を卒業し、不器用ながらも現実の言葉で相手にぶつかる勇気を持つ。
- name: 瀬戸 凛 (せと りん)
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 整った顔立ちの美少女。常に隙がなく、凛とした佇まいでクラスの中心にいる。
  personality: 完璧主義でプライドが高く、毒舌。しかし内面は非常に繊細で寂しがり屋。一人称は「私」。
  speech_style: 理知的で鋭い言い回し。ただしアプリ内（ノイズ）では、少し砕けた、感情的な話し方になる。
  background: 期待される「完璧な優等生」を演じ続けることに疲れ、本音を言える場所を失っている。
  motivation: 自分を「完璧な人間」としてではなく、一人の人間として理解してくれる存在を求める。
  relationships:
  - name: 佐藤 奏太
    relation: クラスメイト。現実では反発し合うが、アプリ内では唯一の理解者。
  arc: 「完璧な自分」という仮面を脱ぎ捨て、弱さを見せることで他者と真に繋がることの喜びを知る。
- name: 高橋 健斗 (たかはし けんと)
  role: 相棒
  age: 17
  gender: 男性
  appearance: 明るい茶髪で、いつもスマホをいじっている快活な少年。
  personality: ノリが良く、SNSやガジェットに詳しい。空気を読むのが得意なムードメーカー。一人称は「俺」。
  speech_style: 流行語を交えた、テンポの良いフランクな話し方。
  background: 奏太の数少ない友人。アプリ『HeartSync』の流行についても詳しい。
  motivation: 奏太の恋を面白がりつつも、親友として彼が殻を破るのを応援すること。
  relationships:
  - name: 佐藤 奏太
    relation: 親友。奏太の変調にいち早く気づく。
  arc: 傍観者として楽しんでいた立場から、奏太の決断を後押しする重要な理解者へと成長する。
