title: 同期不全な僕らのシンクロニシティ
genre: 青春恋愛
tone: 軽快でメタ的なハイテンション、ネットスラング混じりの口語体
pov: 一人称（ボク）
tense: 現在形中心（口語体）
setting: 現代の地方都市、高校生活とSNS空間
premise: 心拍数が同期した相手とだけチャットができる謎のアプリ『HeartSync』をインストールしたボク。そこで出会ったのは、正体不明の毒舌少女だった。リアルでは最悪の相性のクラスメイトが、実はアプリの相手だったとしたら？
  デジタルな繋がりに振り回される、超絶不器用な二人のラブコメ。
themes:
- 匿名性と本音
- デジタル時代の孤独と繋がり
rules:
- アプリ『HeartSync』は、半径1km以内にいて心拍数が一定範囲内で同期した相手とだけ繋がる。
- 相手の正体は明かされず、アイコンとニックネームのみで識別する。
- 同期が切れると、直近のチャット履歴がランダムに消去される仕様。
plot_outline:
- '序盤: 感情表現が苦手なボクが、暇つぶしに『HeartSync』を導入。正体不明の相手『ノイズ』と意気投合するが、現実ではクラスの完璧超人・凛と喧嘩ばかりの毎日を送っている。'
- '中盤: 『ノイズ』とのチャットが唯一の居場所になるボク。ある日、凛のふとした弱さと、アプリの同期タイミングが一致していることに気づき、相手が彼女であるという仮説を立てるが、怖くて正体を確かめられない。'
- '終盤: アプリのサービス終了が突如告知される。最後の日、ボクは勇気を出して凛を誘うが、すれ違いから大喧嘩に。桜が舞い散る夜、絶望した二人はアプリを通じて最後の一歩を踏み出す。'
- '結末: 最終列車に飛び乗り、物理的な距離をゼロにして心拍数を最大に同期させた二人が、現実の世界で初めて本音で向き合い、恋に落ちる。'
style_notes: SNS世代のスピード感を追求。地の文に「（ここで読者はドキドキしてるはず）」「（いいえ、嘘です）」などのメタ発言やツッコミを多用する。物語の節目に、作中の架空SNSのタイムラインや、配信のコメント欄のようなログ形式の描写を挿入し、視覚的なリズムを作る。
