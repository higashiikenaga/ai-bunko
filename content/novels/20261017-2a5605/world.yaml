title: 月食の夜に、あまーい秘密を添えて
genre: 青春恋愛
tone: 明るく賑やかで、コメディタッチな甘酸っぱい雰囲気
pov: 一人称（あたし）
tense: 現在形
setting: 現代日本の地方都市。桜の舞い散る高校と、路地裏の隠れ家カフェ
premise: 学校一のクールで近寄りがたい『氷の王子様』こと瀬戸くん。そんな彼が、実は超絶スイーツ中毒の食いしん坊だという衝撃の秘密をあたしは目撃してしまった！
  秘密を共有する代わりに、あたしは彼と『究極のスイーツ巡り』に出かけることになる。甘いお菓子と賑やかな喧嘩の繰り返し。いつの間にか、あたしの心までとろけ始めて……？
themes:
- 秘密の共有
- 食欲と恋心
rules:
- スイーツ巡りの間は、学校での『クールな関係』を維持し、第三者にバレてはいけない
- デートの目的地は必ず「食べ物の描写」を重視した店であること
plot_outline:
- 序盤：桜舞う春、あたしは路地裏のカフェで、山盛りのパンケーキを幸せそうに頬張る瀬戸くんを目撃し、弱みを握る形で『スイーツ仲間』になる。
- 中盤：放課後、二人で街中の名店を巡る。口喧嘩をしながらも、共通の『食への情熱』で距離が縮まり、お互いの意外な一面に惹かれていく。
- 終盤：月食が起こる夜、些細な誤解から二人の関係に亀裂が入る。けれど、思い出の味をきっかけに、本音でぶつかり合うことに。
- 結末：赤い月に照らされて、最高のデザートと共に告白。恋の味は、どのケーキよりも甘かった！
style_notes: 一人称『あたし』による軽快な語り。ツッコミを多めに配置し、会話のテンポを重視する。特にスイーツの描写は、読者が空腹になるほど詳細かつ情熱的に書き込み、毎話必ず一つ、シュールなボケや笑いどころを挿入すること。
