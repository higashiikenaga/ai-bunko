- name: エレノア・ド・ローゼンタール
  role: 主人公
  age: 18
  gender: 女性
  appearance: 銀糸のような長い髪と、夜の海を思わせる深いサファイア色の瞳。没落しつつある家門を象徴するように、華やかだがどこか控えめな装い。
  personality: 芯が強く、冷静沈着。没落の危機にありながらも気品を失わず、他者のために動ける献身的な性格。一人称は「私」。
  speech_style: 丁寧で優雅な貴族言葉。感情が高ぶると、少し早口になる癖がある。
  background: かつてアルカディアで名を馳せた貴族の令嬢。政略結婚によって家門を再興させようとする両親の思惑に翻弄される。
  motivation: 家族を守ると同時に、街に隠された不都合な真実を暴き、偽りの平穏を終わらせること。
  relationships:
  - name: ルカ・エヴァンス
    relation: 運命的な恋人・理解者
  - name: ヴァレリウス・グラン・アルカディア
    relation: 対立する支配者
  arc: 運命に従うだけの「籠の中の鳥」から、自らの足で真実へと歩み出す「夜明けの先駆者」へと成長する。
- name: ルカ・エヴァンス
  role: 相棒/ヒーロー
  age: 20
  gender: 男性
  appearance: 無造作な黒髪に、憂いを帯びた灰色の瞳。細身だが、楽器を奏でる指先は驚くほど強く、美しい。
  personality: 孤独を愛する厭世的な音楽家。しかし、一度心を許した相手には深い情熱を注ぐ。一人称は「僕」。
  speech_style: 静かで物静か。言葉数は少ないが、時に詩的で情緒的な言い回しを用いる。
  background: 宮廷音楽家として活動しているが、街の華やかな狂気に馴染めず、孤独に音楽を奏で続けている。
  motivation: 偽りの夜に埋もれた「真実の音」を奏でること、そしてエレノアの孤独を癒やすこと。
  relationships:
  - name: エレノア・ド・ローゼンタール
    relation: 愛する女性
  - name: 名もなき黒猫
    relation: 導き手としての奇妙な縁
  arc: 世界を拒絶していた孤独な表現者が、愛する人のために世界を変える勇気を持つようになる。
- name: ヴァレリウス・グラン・アルカディア
  role: 敵役
  age: 45
  gender: 男性
  appearance: 鋭い眼光と、隙のない完璧な軍服風の礼装。黄金の装飾品を身に纏い、威圧的なオーラを放つ。
  personality: 冷酷非道で支配欲が極めて強い。目的のためには手段を選ばず、他者の感情を「資源」としてしか見ていない。一人称は「私」。
  speech_style: 威圧的で、相手を跪かせるような絶対的な権威を感じさせる話し方。
  background: アルカディアの統治を司る公爵。街の繁栄を維持するという名目のもと、人々の記憶を吸い上げるシステムを管理している。
  motivation: 街の全情熱と記憶を掌握し、永遠に終わらない完璧な夜の支配者として君臨すること。
  relationships:
  - name: エレノア・ド・ローゼンタール
    relation: 政略結婚の道具
  - name: ルカ・エヴァンス
    relation: 排除すべき不純物
  arc: 絶対的な秩序を維持しようとするが、人間の情熱という制御不能な力によって、自らが築いた偽りの夜と共に崩壊する。
- name: 名もなき黒猫
  role: 導き手/神秘的存在
  age: 不明
  gender: 不明
  appearance: 闇に溶け込むような漆黒の毛並み。瞳は夜空に浮かぶ月のように黄金色に輝いている。
  personality: 掴みどころがなく、時にいたずらっぽく、時に神聖な雰囲気を持つ。言葉は発さない。
  speech_style: 言葉は発しないが、その仕草や瞳の動きで、意志や感情を強く伝える。
  background: 街が記憶を代償に繁栄を始めた時から存在する、街の「記憶の残滓」が具現化した存在。
  motivation: 街に失われた「朝」を取り戻し、循環を止めた時間の流れを正常に戻すこと。
  relationships:
  - name: エレノア・ド・ローゼンタール
    relation: 真実へと導くガイド
  - name: ルカ・エヴァンス
    relation: 共鳴する魂
  arc: 物語の鍵を握る導き手として、主人公たちを破滅の淵から真実の光へと導く役割を果たす。
