title: 瑠璃色の夜会と、名もなき獣の挽歌
genre: 青春恋愛
tone: 華麗で耽美的、かつ切実なロマンティシズム
pov: 三人称（全知視点による優雅な叙述）
tense: 過去形
setting: 常夜の霧に包まれ、魔法の灯火が永遠に消えることのない、絢爛豪華な「眠らない街」アルカディアの宮廷
premise: 永遠に夜が続く街アルカディア。そこでは、煌びやかなドレスと宝石に彩られた貴族たちが、終わることのない舞踏会に耽溺していた。没落貴族の令嬢エレノアは、政略結婚の影で密かに街の理を覆す陰謀に巻き込まれていく。孤独な音楽家ルカとの出会いが、彼女の運命を狂わせ、名前を持たぬ一匹の黒猫が、隠された真実へと導いていく。
themes:
- 運命への抵抗
- 真実の愛と自己の確立
rules:
- 街の灯火は住人の情熱を糧としており、情熱を失う者は影に溶けて消える
- 魔法の刺繍を施した衣装は、着用者の感情を増幅させる力を持つ
plot_outline:
- '序盤: 眠らない街の華やかな舞踏会で、エレノアは運命的な音楽家ルカと出会う。しかし、彼女の家門は政略的な罠によって崩壊の危機に瀕していた。'
- '中盤: 街の灯火が不自然に揺らぎ始める中、エレノアは名もなき黒猫に導かれ、宮廷の地下に眠る禁忌の書庫に辿り着く。そこで彼女は、街の繁栄が人々の記憶を代償にしている事実を知る。'
- '終盤: 陰謀を企てる公爵が、街の全情熱を掌握しようと画策する。エレノアとルカは、自らの愛と命を賭して、偽りの夜を終わらせるための最後の舞踏会へと挑む。'
- '結末: 街に初めての朝が訪れる。魔法の衣装も、永遠の夜も失われたが、エレノアとルカは、名もなき猫と共に、新たな光の中を歩み始める。'
style_notes: 絹の擦れる音、宝石の煌めき、重厚なベルベットの質感を細部まで描き出すこと。比喩表現は華麗で装飾的に。登場人物の感情は、直接的な言葉よりも、ドレスの揺らめきや視線の交差、舞踏会の熱狂を通じて優雅に描写すること。
