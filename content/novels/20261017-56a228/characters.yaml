- name: ジャックス・ヴェイン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 無精髭に、使い込まれた飛行ゴーグルと擦り切れた革ジャンを纏った男。左頬に古い戦闘の傷跡がある。
  personality: 皮肉屋で現実主義だが、困っている者を見捨てられない情に厚い性格。一人称は「俺」。
  speech_style: ぶっきらぼうで荒っぽい。パイロット特有の専門用語やスラングを混ぜた話し方をする。
  background: 元帝国軍のエースパイロット。軍の非道な作戦に疑問を抱き、脱走した過去を持つ。現在は浮遊島の片隅でジャンク屋を営み、日銭を稼いで生きている。
  motivation: 過去の罪悪感から逃れ、誰にも縛られない自由な空を飛ぶこと。
  relationships:
  - name: ライラ
    relation: 保護対象であり、共に空を駆ける相棒
  - name: ヴァレリウス将軍
    relation: かつての指揮官であり、現在は追う者と追われる者
  arc: 過去を捨てて逃げ続けるだけの男から、仲間と新しい時代の空を守るために立ち上がるリーダーへと成長する。
- name: ライラ
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような銀髪と、星屑を宿したような不思議な輝きを持つ瞳。純白の簡素なドレスを纏っている。
  personality: 穏やかでどこか浮世離れした雰囲気を持つ。記憶がないため、世界の全てを新鮮な驚きとして受け止める。一人称は「私」。
  speech_style: 丁寧だが、感情の起伏が少なく淡々としている。時折、予言のような神秘的な言葉を口にする。
  background: 墜落した小型艇から発見された記憶喪失の少女。その身には『黄金の星図』を起動させるための生体インターフェースが組み込まれている。
  motivation: 自分の失われた記憶を取り戻すこと、そして自分を救ってくれたジャックスたちの助けになること。
  relationships:
  - name: ジャックス・ヴェイン
    relation: 命の恩人であり、唯一無二の信頼を寄せるパートナー
  arc: 帝国の「装置」としての自分を否定し、自らの意志で世界を書き換えるための決断を下す一人の人間へと覚醒する。
- name: ヴァレリウス将軍
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない帝国軍の正装。片腕は蒸気駆動の重厚な義手で、冷徹な眼光を放つ威厳ある容貌。
  personality: 徹底した秩序と規律を重んじる冷酷なリアリスト。私情を一切挟まない。一人称は「私」。
  speech_style: 威圧的で理知的。命令を下す際の響きに一切の迷いがなく、相手を論理的に追い詰める。
  background: 帝国軍の最高司令官の一人。星図の力を利用して、全浮遊島を蒸気と鉄の規律で統治する絶対的な帝国秩序を完成させようとしている。
  motivation: 『黄金の星図』を奪還し、混沌とした空の世界に帝国の絶対的な秩序をもたらすこと。
  relationships:
  - name: ジャックス・ヴェイン
    relation: 帝国の秩序を乱す不確定要素（排除対象）
  - name: ライラ
    relation: 奪還すべき帝国最高機密の所有者
  arc: 揺るぎない「旧世界の秩序」の象徴として、自由を求める主人公たちの意志を徹底的に叩き潰そうとする。
- name: カエル
  role: 脇役（仲間）
  age: 22
  gender: 男性
  appearance: 油汚れのひどい作業着に、大量の工具を詰め込んだベルトを巻いている。常にゴーグルを頭に乗せている。
  personality: 明るく好奇心旺盛な天才メカニック。機械の構造を語り出すと止まらない。一人称は「僕」。
  speech_style: 非常に早口で、蒸気圧やギアの回転数に関する専門的な語彙を連発する。
  background: 無法者の集まる空中都市のジャンク屋出身。ジャックスに雇われ、ボロボロの愛機の整備を一手に引き受けている。
  motivation: 伝説の聖域に眠るとされる、世界を動かす究極の動力源をこの目で確かめること。
  relationships:
  - name: ジャックス・ヴェイン
    relation: 雇い主であり、共に死線を越える戦友
  arc: 単なる機械への執着から、仲間や守るべき世界のために自らの技術を捧げる覚悟を持つようになる。
