title: ギア・チェイサー：絶空の黄金航路
genre: スチームパンク冒険
tone: 疾走感溢れるハイテンション・エンタメ
pov: 三人称
tense: 過去形
setting: 浮遊島が点在し、雲海に覆われた世界『アエテルナ』。蒸気圧による動力航行が文明の基盤となっている。
premise: 落ちぶれた元帝国軍パイロットの男が、記憶喪失の少女と、世界を書き換える禁忌の『黄金の星図』を手に入れる。帝国の追撃を振り切り、伝説の聖域を目指して空飛ぶ船で激突する。弾丸と蒸気が飛び交う、最高速の宝探しが始まる。
themes:
- 自由への渇望
- 運命の突破
rules:
- 飛行船の動力は『圧力結晶』に依存し、限界突破（オーバーブースト）させると機体が崩壊する危険がある
- 黄金の星図は特定の座標でしか正しく機能せず、読み解くには適合者の生体認証が必要
plot_outline:
- '序盤: ジャンク屋として生きる主人公が、墜落した小型艇から少女と『黄金の星図』を救出。直後に帝国の追撃隊に襲われ、ボロボロの愛機で強行突破を図る。'
- '中盤: 星図の断片を集めるため、無法者の集う空中都市や未踏の嵐域を巡る。少女の正体が帝国の最高機密であること、星図が世界を再構築する鍵であることが判明する。'
- '終盤: 帝国の巨大空中要塞が星図を奪還すべく総攻撃を仕掛ける。仲間と共に寄せ集めの艦隊を結成し、要塞の心臓部へ特攻を仕掛ける超高速空中戦を展開。'
- '結末: 聖域に到達し、星図の真の力を解放。帝国の独裁体制を崩壊させ、誰もが自由に空を飛べる新時代の幕開けと共に、主人公たちは次なる未知の航路へ旅立つ。'
style_notes: 短文を畳み掛けるアクション描写を徹底する。説明台詞を排除し、キャラクター同士の軽妙な掛け合いで状況を伝える。場面転換を速め、常に「次はどうなる」と思わせるクリフハンガーを各話の末尾に配置。擬音に頼らず、機体の振動や火花、風の衝撃を具体的な動作で描写する。
