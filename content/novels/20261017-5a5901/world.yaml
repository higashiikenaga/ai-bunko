title: 大気循環機構（エア・サーキュレーター）の亡霊：蒼穹の熱力学
genre: スチームパンク冒険
tone: 重厚かつ精緻な技術叙述、乾いた砂塵の質感
pov: 三人称
tense: 過去形
setting: 蒸気圧による高度な文明が築かれた、永劫の砂漠に覆われた惑星『テルミヌス』。巨大な浮遊都市が雲海の上を巡る世界。
premise: 浮遊都市の動力源である『熱力学循環エンジン』に異常が生じ、世界の温度バランスが崩壊しつつある。廃材回収業者の青年カイルは、砂漠の深部にある伝説のオアシスで、旧文明の遺物である高周波受信機を拾う。夜明けのラジオから流れてきたのは、失われたはずの制御プログラムによる、崩壊を食い止めるための暗号信号だった。カイルは謎の飛行士リナと共に、雲の底に眠る『大気循環機構』の真実を求めて、過酷な砂嵐の中へと漕ぎ出す。
themes:
- エントロピーの増大と秩序の回復
- 失われた技術の継承と倫理
rules:
- 蒸気機関の効率は、大気中の湿度と熱力学的な圧力差に依存する
- 砂漠の深部は高熱と砂嵐により、高度な電子機器は極めて短命である
- 浮遊都市の維持には、定期的な『熱交換用の大気循環』が不可欠である
plot_outline:
- '序盤: 砂漠の底で廃材を回収するカイルが、異常な熱波の中で古いラジオ型受信機を拾い、そこから意味深な信号を受信する。'
- '中盤: 信号を追うカイルは、高度な航法技術を持つリナと出会い、浮遊都市の権力者が隠蔽しようとしている『循環機構の劣化』を知る。'
- '終盤: 砂嵐を突破し、大気循環機構の心臓部へと到達。そこでは、自律稼働を続ける旧時代のAIが、世界の熱平衡を保つためにシステムを犠牲にしようとしていた。'
- '結末: カイルたちは新たな熱交換プロトコルを実装することに成功し、崩壊の危機を回避する。しかし、それは人類が技術に依存せず、自らの手で環境を管理し始める新たな時代の始まりでもあった。'
style_notes: 硬派なSF文体を維持し、蒸気圧の変動、ピストンの挙動、熱交換器の素材特性など、物理的なメカニズムを詳細に記述する。専門用語はキャラクターの独白や、装置の点検作業を通じて、読者が自然に理解できるよう配置すること。
