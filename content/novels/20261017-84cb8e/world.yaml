title: 琥珀の交易路と、折れた剣の挽歌
genre: 異世界ファンタジー
tone: エキゾチックで叙情的な冒険譚
pov: 三人称（語り部による叙述）
tense: 過去形
setting: 灼熱の砂海が広がる世界。巨大なキャラバン都市が点在し、魔力を宿した「砂晶」や幻の香辛料が取引される交易時代。
premise: 砂の海を渡る商隊の若き案内人が、身元を隠した旅人から奇妙な「折れた剣」を託されるところから物語は始まる。その剣は、かつて伝説の王が守り抜いた約束の証であり、失われた楽園へと続く道を示す鍵であった。二人は商隊の喧騒を離れ、強盗や砂嵐、そして古の呪いが潜む静寂の砂漠へと足を踏み入れる。果たして、地図にない「約束の丘」の頂で待ち受けているのは、救済か、それとも砂塵に消えた滅びの記憶か。
themes:
- 喪失と再生
- 約束の重み
rules:
- 「砂晶」は魔力を蓄えた結晶であり、交易の主役だが、使いすぎると持ち主の生命力を砂へと変えてしまう
- 夜の砂漠では、風が死者の記憶を運んでくるという伝承があり、特定の条件下では幻影が見える
plot_outline:
- '序盤: 商隊の案内人ザイドは、砂嵐の後に倒れていた旅人と、その手にある「折れた剣」を拾う。剣に宿る微かな熱に導かれるように、ザイドは商隊を離れ、剣の謎を解くための旅に出る。'
- '中盤: 活気溢れる市場の喧騒と、命を削るような静寂の夜の砂漠を交互に通り抜けながら、ザイドは各地に散らばった剣の破片を求めていく。旅の中で、剣がかつて「約束の丘」で交わされた誓いを守るための道具であったことを知る。'
- '終盤: 剣の破片を繋ぎ合わせた時、砂漠の深奥に隠された「約束の丘」への道が開かれる。しかし、そこには剣の力を軍事利用せんとする帝国軍の影が迫っていた。'
- '結末: 丘の頂で、ザイドは剣に込められた真の願いを解放する。砂嵐が止み、世界に新たな交易の風が吹く中、彼はかつての旅人が遺した言葉の意味を噛み締める。'
style_notes: 市場のスパイスの香りと人々の熱狂的な喧騒を鮮烈に描き、それとは対照的に、夜の砂漠の孤独で神秘的な静謐さを詩的に表現すること。語り部は、まるで焚き火を囲んで旅人に昔語りを聞かせるかのように、情景を重厚かつエキゾチックな言葉選びで綴る。
