- name: 不知火
  role: 主人公
  age: 28
  gender: 男
  appearance: 砂にまみれた粗末な着物。鋭い眼光とは対照的に、疲弊し痩せこけた体躯。腰には一振りの業物を持つ。
  personality: 寡黙でストイック。過去の罪悪感から心を閉ざしている。一人称は「俺」。
  speech_style: 必要最低限の言葉しか発せず、ぶっきらぼうだが礼節は忘れない。
  background: かつての名門剣術流派の跡継ぎだったが、政争に巻き込まれ門下生と師を失い、家名を追われた浪人。
  motivation: 生き延びることのみを目的としていたが、次第に「誰かのために剣を振るう」意味を取り戻そうとする。
  relationships:
  - name: 玄斎
    relation: 導き手であり、精神的な師となる老人
  - name: ザルガス
    relation: 対極の価値観を持つ宿敵
  arc: 絶望による漂流から、守るべきもののために戦う「義」への覚醒。
- name: 玄斎
  role: 相棒・師匠
  age: 67
  gender: 男
  appearance: 深く刻まれた皺と日焼けした肌。白い髭を蓄え、質素な麻の衣を纏っている。灯台の傍らに古びた太刀を立てかけている。
  personality: 達観しており、穏やか。静寂を愛する。一人称は「私」。
  speech_style: 比喩を用いた緩やかな話し方。相手の核心を突く問いかけを好む。
  background: かつては戦場を駆けた伝説的な剣客だったが、剣の虚しさを悟り、辺境の灯台守として静かに余生を過ごしている。
  motivation: オアシスの平穏を維持し、灯台の火を絶やさずに次世代へ繋ぐこと。
  relationships:
  - name: 不知火
    relation: かつての自分を重ね合わせ、導こうとする青年
  - name: ミラ
    relation: 娘のように慈しんでいる保護対象
  arc: 静止していた人生に不知火という風が吹き込み、最後にもう一度だけ剣を抜き、次世代へ道を譲る。
- name: ザルガス
  role: 敵役
  age: 35
  gender: 男
  appearance: 筋骨逞しい体躯。獣の皮と金属のパーツを組み合わせた威圧的な鎧を纏う。顔に深い切り傷がある。
  personality: 強欲で残虐。力こそが唯一の正義であると信じる快楽主義者。一人称は「俺」。
  speech_style: 尊大で粗野。相手を嘲笑い、精神的に追い詰める挑発的な言い回し。
  background: 砂漠の略奪集団を率いる首領。元は傭兵だったが、裏切りを繰り返し、力で略奪者をまとめ上げた。
  motivation: オアシスの水を独占し、交易路を支配することで砂漠の王となること。
  relationships:
  - name: 不知火
    relation: 己の力を証明するための獲物として認めるライバル
  arc: 圧倒的な力で蹂躙し続けるが、不知火の「折れない心」に直面し、初めて敗北と死を悟る。
- name: ミラ
  role: 脇役
  age: 17
  gender: 女
  appearance: 砂漠の民らしい褐色の肌に、好奇心に満ちた大きな瞳。動きやすい簡素な服を着ている。
  personality: 天真爛漫で勇敢。厳しい環境にありながら希望を捨てない。一人称は「私」。
  speech_style: 快活でストレート。遠慮なく不知火に懐き、話しかける。
  background: 幼い頃に砂嵐で親を失い、玄斎に拾われて灯台で共に暮らしてきた。
  motivation: オアシスの人々を守り、いつか砂漠の向こう側にある世界を見てみたい。
  relationships:
  - name: 玄斎
    relation: 育ての親であり、絶対的な信頼を寄せる相手
  - name: 不知火
    relation: 不器用だが優しいと感じ、親しみを持つ青年
  arc: 守られるだけの存在から、戦火の中で人々を鼓舞し、共に生き残ろうとする強さを得る。
