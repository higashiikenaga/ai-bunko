title: 砂塵の境界、鋼の灯火
genre: 歴史・時代小説
tone: 硬派、峻烈、静謐
pov: 三人称
tense: 過去形
setting: 砂漠が広がる辺境の地。交易路の終着点に位置する、乾燥した荒野。
premise: かつての名門を追われ、浪人となった男・不知火は、果てしない砂の海を彷徨い、奇跡のように現れた「砂漠のオアシス」へと辿り着く。そこには、砂嵐の中で交易船の進路を示す「古い灯台」を守り続ける、一人の老剣客がいた。しかし、オアシスの水を奪わんとする略奪者たちの影が忍び寄る。不知火は、静寂の中で研ぎ澄まされた刃を抜き、砂塵の中に己の義を刻み込むことになる。
themes:
- 武士の矜持と孤独
- 死の淵における静寂
- 奪い合う者と守る者
rules:
- 砂嵐の発生は戦闘の環境を劇的に変化させる
- 剣の扱いは極めて写実的であり、一撃の重みが生死を分ける
- 灯台の明かりは、砂漠における唯一の絶対的な秩序である
plot_outline:
- '序盤: 飢えと渇きに苛まれた不知火が、砂嵐の中で古い灯台を見つけ、その足元に広がるオアシスへと導かれる。'
- '中盤: 灯台守の老剣客との交流を通じて、この地が略奪者たちに狙われていることを知る。不知火は、平和なオアシスに立ち込める不穏な気配を感じ取る。'
- '終盤: 略奪者たちの総攻撃により、オアシスは戦火に包まれる。灯台の頂上、激しい砂嵐の中で、不知火と最強の刺客による一騎打ちが行われる。'
- '結末: 決闘の果てに、不知火は自らの道を定める。灯台の火は再び静かに灯り、砂漠の静寂が戻ってくる。'
style_notes: 簡潔で力強い、無駄を削ぎ落とした文体。剣戟の描写においては、金属の擦れる音や肉を断つ衝撃を、重厚かつ鮮烈に表現すること。特に、一騎打ちの直前、風の音さえ消えた瞬間の「静寂」を、読者が息を呑むような密度で丁寧に描き出すこと。
