- name: 湊 慎一
  role: 主人公
  age: 32
  gender: 男性
  appearance: 痩せこけ、砂にまみれた、虚ろな瞳をした男。常に渇きを感じているような表情をしている。
  personality: 臆病で自己中心的、現実逃避傾向が強い。一人称は「僕」。
  speech_style: 独白が多く、自分に言い聞かせるような、弱々しくたどたどしい話し方。
  background: かつて自身の不注意から大規模な火災事故を引き起こし、多くの命を奪った加害者。その罪悪感から精神を病み、記憶を封印している。
  motivation: 罪悪感から逃れ、すべてを忘れて安らかな休息を得ること。
  relationships:
  - name: 瀬戸 美咲
    relation: 救済者と信じているが、実際は彼を裁く被害者
  arc: 偽りの安らぎの中に逃げ込む状態から、逃れられない罪の真実を突きつけられ、精神が崩壊する。
- name: 瀬戸 美咲
  role: 敵役（導き手）
  age: 24
  gender: 女性
  appearance: 透き通るような白い肌と、慈愛に満ちた微笑みを浮かべる美しい女性。オアシスの光に包まれている。
  personality: 穏やかで献身的だが、どこか人間離れした静謐さと不気味さを纏う。一人称は「私」。
  speech_style: 歌うように優しく、聞き手の不安を鎮めるような、催眠的な話し方。
  background: 湊が引き起こした火災で命を落とした女性。湊の深層心理が生み出した、彼を「救済（死）」へと誘う幻影。
  motivation: 湊を「最終列車」へと導き、彼に自らの罪を直視させること。
  relationships:
  - name: 湊 慎一
    relation: 加害者であり、自らの死を招いた存在
  arc: 優しい救済者としての仮面が剥がれ落ち、怨念と真実を象徴する恐ろしい亡霊へと変貌する。
- name: 謎の車掌
  role: 脇役（象徴）
  age: 0
  gender: 男性
  appearance: 深い影に覆われた制帽を被り、古びた鉄道員の制服を着た、顔の判別がつかない男。
  personality: 冷徹で機械的、一切の感情を表に出さない。一人称は「私」。
  speech_style: 抑揚のない、事務的で規則正しい、時計の針のような話し方。
  background: 精神の荒野における「死」や「終焉」そのものの具現化。列車の運行を通じて、審判の時を告げる。
  motivation: 決まった時刻に列車を運行し、乗客を終着駅（死・真実）へ運ぶこと。
  relationships:
  - name: 湊 慎一
    relation: 運命の執行者と乗客
  arc: 変化することのない、絶対的な死の概念として君臨し続ける。
- name: 幼い影
  role: 脇役（幻影）
  age: 7
  gender: 男性
  appearance: 遠くの陽炎の中に揺れる、小さな子供のシルエット。時折、煤けたような黒い影として見える。
  personality: 無口で、ただじっとこちらを見つめている。言葉を持たない。
  speech_style: 声は聞こえず、時折、すすり泣くような風の音だけが聞こえる。
  background: 火災で亡くなった子供の一人。湊の記憶の片隅にこびりついた、消えない罪の象徴。
  motivation: 湊の視界の端に現れ続け、彼が忘れたがっている「現実」を無言で突きつけること。
  relationships:
  - name: 湊 慎一
    relation: 忘れたい罪の記憶の象徴
  arc: 最初は穏やかな風景の一部に見えるが、終盤では焼け焦げた遺骸のイメージとして鮮烈に現れる。
