- name: エルヴァン・アストラル
  role: 主人公
  age: 19
  gender: 男性
  appearance: 銀髪の短髪、知的な瞳、使い古された天文学者の外套、インクで汚れた指先
  personality: 知的好奇心が強く真面目だが、没落した家系に対する劣等感を抱いている。一人称は「僕」。
  speech_style: 丁寧だが、星図や天文学に関する知識を語る際には情熱的で早口になる。
  background: かつて星図編纂を司った名門アストラル家の嫡男。家の没落と共に地位を失ったが、星への探究心だけは失っていない。
  motivation: 禁忌とされる「真の星図」を完成させ、星墜ちの時代を止めること。
  relationships:
  - name: カイル
    relation: 旅の相棒であり、命を預ける守護者
  arc: 知識として星を追う者から、自らの記憶という代償を払ってでも運命を書き換える「意志を持つ者」へと成長する。
- name: カイル
  role: 相棒
  age: 27
  gender: 男性
  appearance: 無骨な銀の甲冑、感情を読み取らせない深い蒼い瞳、大きな傷跡のある頬、背中に大剣を背負っている。
  personality: 沈黙を貫く寡黙な戦士。言葉ではなく行動で意思を示す。一人称は（なし）。
  speech_style: 無言、あるいは重みのある短い頷きのみ。
  background: 禁書庫に封印されていた沈黙の騎士。星図の守護という使命を帯び、エルヴァンと共に世界の果てを目指す。
  motivation: エルヴァンと星図を守り抜き、世界の崩壊を食い止めること。
  relationships:
  - name: エルヴァン
    relation: 守るべき主であり、唯一の理解者
  arc: 単なる「守護者」という役割から、エルヴァンという個人への共鳴を通じ、自らの意志で歩む「自由な騎士」へと変化する。
- name: ヴァレリウス
  role: 敵役
  age: 42
  gender: 男性
  appearance: 眩い白銀の法衣、天球儀を模した魔導杖、冷酷なまでに整った容貌。
  personality: 極端な秩序主義者。目的のためには世界の破壊すら厭わない。一人称は「私」。
  speech_style: 高圧的で説得力があり、聴く者を陶酔させるような宗教的な演説口調。
  background: 狂信的な教団「天球の調律者」の教祖。星の崩落を、汚れた世界を浄化するための神の意志だと信じている。
  motivation: 星を意図的に落とし、混沌とした現在を破壊して、完璧な秩序を持つ新世界を再構築すること。
  relationships:
  - name: エルヴァン
    relation: 旧世界の残滓として排除すべき対象
  arc: 秩序という名の狂信に囚われたまま、エルヴァンが示す「不完全だが再生する世界の可能性」に直面し、敗北する。
- name: ルミナ
  role: 脇役
  age: 14
  gender: 女性
  appearance: 渡り鳥の羽を模した髪飾り、星屑が散りばめられたような瞳、透き通るような白いドレス。
  personality: 浮世離れしており神秘的。どこか寂しげな空気を纏っている。一人称は「わたし」。
  speech_style: 詩的で比喩が多く、予言めいた穏やかな話し方。
  background: 伝説の渡り鳥と精神を共有する、神話時代の断片を継ぐ少女。旅の導き手として現れる。
  motivation: 渡り鳥の群れを導き、世界の巡礼を完遂させること。
  relationships:
  - name: エルヴァン
    relation: 旅を導くガイド
  - name: カイル
    relation: 同行者
  arc: 導き手としての役割を超え、エルヴァンたちの歩みを永遠に記憶に刻む「歴史の目撃者」となる。
