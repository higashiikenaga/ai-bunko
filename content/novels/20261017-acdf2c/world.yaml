title: 蒼穹の巡礼と、綴られぬ星辰の叙事詩
genre: 異世界ファンタジー
tone: 重厚、神話的、格調高い
pov: 三人称
tense: 過去形
setting: 天球の運行が地上の理を支配する世界「エセルガルド」。浮遊大陸と、星の光が届かぬ深淵の海に分かたれた、神話の残滓が色濃く残る時代。
premise: 星々が空から剥落し、世界が永劫の冬へと向かう「星墜ちの時代」。かつて星図の編纂者であった没落貴族の青年は、禁忌とされる「真の星図」を完成させるため、言葉を失った聖騎士と共に世界の果てを目指す。彼らを導くのは、数千年に一度、天の導きに従い回遊する伝説の渡り鳥。失われた神話の断片を繋ぎ合わせ、運命という名の鎖を断ち切る旅が始まる。
themes:
- 運命への抗い
- 喪失と再生
- 知への渇望
rules:
- 星の配置が地上の魔力分布を決定し、特定の星座が天頂にある時のみ、対応する秘術が発動する。
- 伝説の渡り鳥「アズール・ウェイファー」の飛行経路は、人間には不可視の星の道（エーテル・パス）を可視化させる。
- 星図の書き換えは世界の理に直接干渉することを意味し、代償として書き手の記憶や五感の一部が永久に失われる。
plot_outline:
- '序盤: 没落した星図編纂者の青年・エルヴァンが、禁書庫で白紙の「原初の星図」を発見し、それを守護する沈黙の騎士・カイルと出会う。二人は星の崩落を止める唯一の手掛かりを求め、旅に出る。'
- '中盤: 渡り鳥の群れを追って、雲上の古都や結晶の森など、忘れられた聖域を巡る。旅の途中で、星を意図的に落として世界を再構築しようとする狂信的な教団「天球の調律者」の妨害に遭いながらも、世界の成り立ちに関する神話的真実を解き明かす。'
- '終盤: 世界の最果て、星々の墓場である「星の揺り籠」に到達。エルヴァンは自らの記憶という代償を払い、空白の星図に最後の一線を書き加えることで、天球を再配置する禁忌の儀式を完遂させる。'
- '結末: 永劫の冬は去り、世界に再び春と秩序が戻る。多くの記憶を失ったエルヴァンだったが、傍らに残ったカイルと共に、今度は誰に決められた運命でもない、新しい時代の地図を描き始める。'
style_notes: 荘厳な形容詞を多用し、古風で格調高い言い回しを徹底する。章の冒頭には、作中の架空の詩や伝承を引用し、歴史の奥行きを演出すること。固有名詞はラテン語的な響きを重視し、風景描写は緻密かつ絵画的に描き、読者に神話の世界に迷い込んだかのような感覚を与える。
