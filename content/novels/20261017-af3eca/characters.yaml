- name: 一ノ瀬 拓海
  role: 主人公
  age: 32
  gender: 男性
  appearance: 常に機能性を重視したフィールドウェアを着用。眼鏡の奥には観察者としての冷徹な光を宿しており、やや神経質な印象を与える。
  personality: 論理的で観察眼に優れるが、どこか人間関係に対して一線を引いた冷淡さを持つ。一人称は「私」。
  speech_style: 丁寧で落ち着いた、学術的な響きを持つ話し方。感情の起伏が少ない。
  background: 大学で植物学を専攻し、現在は研究員として希少種の調査に従事している。感情よりも事実とデータを信じる科学的思考の持ち主。
  motivation: 神凪村の特殊な植生を解明し、学術的な成果を記録すること。
  relationships:
  - name: 神凪 美緒
    relation: 村の案内役として接するが、彼女の言葉の真実性に揺さぶりを受ける
  - name: 神凪 左近
    relation: 村の支配者として警戒の対象となる
  arc: 対象を「観察物」として見ていた客観的な視点が、残酷な真実を目の当たりにすることで、逃れられない絶望を抱えた主観的な苦悩へと変貌する。
- name: 神凪 左近
  role: 敵役
  age: 68
  gender: 男性
  appearance: 白髪混じりの髪を後ろで束ね、村の伝統的な装束を纏っている。深く刻まれた皺は、村の歴史そのもののように見える。
  personality: 威厳に満ち、村の秩序を絶対視する。目的のためには手段を選ばない冷酷さと、自然への歪んだ畏敬を併せ持つ。一人称は「儂」。
  speech_style: 重々しく、断定的な口調。相手を威圧するような独特の間がある。
  background: 神凪村の長であり、代々「祭礼」を司ってきた一族の現当主。菌類の特性を熟知し、それを利用して村の統治を維持してきた。
  motivation: 菌類の力を制御し、村の閉鎖的な秩序と権力を永遠に守り抜くこと。
  relationships:
  - name: 神凪 美緒
    relation: 親族であり、村の伝統に従わせるべき対象
  - name: 一ノ瀬 拓海
    relation: 秩序を乱しかねない部外者として監視対象とする
  arc: 自然の摂理を支配しているという自負が、神凪の樅という抗えない自然の暴力によって、その支配の虚構性を突きつけられる。
- name: 神凪 美緒
  role: 脇役
  age: 24
  gender: 女性
  appearance: 素朴で飾り気のない容姿。祭礼の夜には巫女のような装束を着るが、その瞳には常に拭いきれない不安が漂っている。
  personality: 控えめで献身的だが、内面には村の因習に対する静かな抵抗感を抱いている。一人称は「私」。
  speech_style: おっとりとした、訛りのある穏やかな話し方。しかし、祭りの夜には言葉を濁すことができなくなる。
  background: 村の神職に連なる家系の娘。祭礼の準備や進行を担っているが、嘘をつけない夜に暴かれる「真実」の重みに精神を削られている。
  motivation: 祭礼を無事に終え、平穏な日常が続くこと、あるいはこの呪縛から逃れること。
  relationships:
  - name: 一ノ瀬 拓海
    relation: 部外者である彼に、村の異質さを伝える役割
  - name: 神凪 左近
    relation: 絶対的な権威として従っているが、内心では恐れている
  arc: 真実を隠して生きる虚飾の平穏から、暴かれた真実を背負って生きていくという、残酷な受容へと至る。
