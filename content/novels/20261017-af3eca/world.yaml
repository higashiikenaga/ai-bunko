title: 翠森の噤みと、嘘なき祭礼
genre: 伝奇
tone: 静謐で観察的な、博物学的雰囲気
pov: 一人称（私）
tense: 過去形
setting: 現代、東北地方の深い山中に位置する、外部との接触を断った集落「神凪村」
premise: 植物学者である私は、希少な高山植物の調査のため、深い原生林に囲まれた神凪村を訪れる。そこで私は、一年に一度の祭りの夜、村人たちが一切の嘘をつけなくなるという奇妙な伝承に遭遇する。それは単なる迷信ではなく、森に棲まう未知の菌類がもたらす生理的な制約であった。真実だけが暴かれる夜、静かな森の調和がゆっくりと崩壊し始める。
themes:
- 自然と人間の共生と乖離
- 真実という名の暴力
rules:
- 祭りの夜、村の境界を越えて飛散する特定種の生物発光菌の胞子を吸い込んだ者は、意識的に嘘をつこうとすると喉に激しい痙攣と拒絶反応が起き、真実しか口にできなくなる
- この効果は月が沈むまで持続し、その後は緩やかに消失する
- 森の深部にある巨樹『神凪の樅』が胞子の供給源であり、村の秩序はこの菌類への依存によって維持されている
plot_outline:
- '序盤: 私が神凪村に到着し、アオモリマンテマやコメツツジなどの植生を記録しながら、村の閉鎖的な空気感と「嘘をつけない夜」の伝承に触れる。'
- '中盤: 祭りの夜、胞子が舞い散る中で私も「呪い」に囚われる。村人たちが互いの秘めた憎悪や隠し事を強制的に告白し合う地獄絵図のような光景を、私は静かに観察し記録する。'
- '終盤: 村の権力者が、実は菌類の生態を操作して村を支配していたことが判明する。私は森の深部で『神凪の樅』と対峙し、人間が作り出した虚飾の秩序と、自然が強いる残酷なまでの真実の対比を目の当たりにする。'
- '結末: 祭りが終わり、再び嘘をつけるようになった村人たちは、暴かれた真実を抱えたまま、以前よりも深い沈黙に包まれる。私は一冊の観察記録を閉じ、森がもたらした静謐な絶望を胸に村を去る。'
style_notes: 森閑イオリとして、徹底して「観察者の視点」を維持すること。感情的な記述を避け、代わりにアオモリトドマツやミズナラなどの樹種、地衣類の形状、土壌の湿度などの詳細な描写を重ねることで、静かな狂気を表現する。一人称の「私」は、事象に深く介入せず、ただそこに在る自然の摂理として人間模様を記述するスタイルを貫く。
