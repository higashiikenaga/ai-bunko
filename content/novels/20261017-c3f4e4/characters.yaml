- name: テオ・アルジェント
  role: 主人公
  age: 19
  gender: 男性
  appearance: 使い込まれた革の郵便鞄を肩にかけ、飛行ゴーグルを頭に乗せた少年。風に吹かれたような琥珀色の乱れた髪が特徴。
  personality: 好奇心旺盛で穏やか。美しい景色や未知の文化に心を動かされるロマンチスト。一人称は「僕」。
  speech_style: 丁寧だが親しみやすく、感嘆符の多い話し方。
  background: 雲海の辺境にある小さな駅の街で育った郵便配達人。誰に頼まれるでもなく、世界中の「届かなかった手紙」を集める癖がある。
  motivation: 預かった剣の破片の正体を突き止め、伝説の最終列車が向かう「世界の果て」を見てみたい。
  relationships:
  - name: クララ・ギアハート
    relation: 旅の相棒であり、船の整備士
  - name: ジュリアン・ヴェイン
    relation: 目的を同じくしながらも対立するライバル
  arc: 単なる「配達人」という傍観者から、分断された世界を再び繋ぎ合わせる「導き手」へと成長する。
- name: クララ・ギアハート
  role: 相棒
  age: 21
  gender: 女性
  appearance: 油汚れのついたオーバーオールを着用し、赤い髪を高く結い上げた快活な女性。常に巨大なレンチを携帯している。
  personality: 現実主義で勝ち気。機械のことになると早口になるオタク気質な一面がある。一人称は「私」。
  speech_style: ぶっきらぼうだが面倒見が良い。専門用語を混ぜたダイレクトな話し方。
  background: 大都市の時計塔整備局にいたが、既存の技術に飽き足らず、失われた旧時代のオーバーテクノロジーを求めて放浪している。
  motivation: 伝説の最終列車の心臓部にあると言われる「究極の永久機関」をこの目で確認し、解析すること。
  relationships:
  - name: テオ・アルジェント
    relation: 最初は呆れていたが、次第に彼の純粋さに感化される信頼できる友人
  arc: 効率と機能のみを追求していたが、旅を通じて「無駄な寄り道」や「人の情」こそが人生を豊かにすることに気づく。
- name: ジュリアン・ヴェイン
  role: 敵役
  age: 32
  gender: 男性
  appearance: 仕立ての良い黒いロングコートに身を包み、片目に銀色のモノクルを嵌めた痩身の男。冷徹な眼差しを持つ。
  personality: 完璧主義で傲慢。知的な振る舞いをするが、内面には強い選民思想を秘めている。一人称は「私」。
  speech_style: 慇懃無礼で、相手を突き放すような冷ややかな口調。
  background: かつて空を支配した貴族階級の末裔。没落した家門の栄光を取り戻すため、最終列車による世界の再構築を画策している。
  motivation: 最終列車を起動させ、不完全な現在の浮遊都市群を解体し、自らが統治する理想的な新世界を創ること。
  relationships:
  - name: テオ・アルジェント
    relation: 自分にはない「直感」と「運」を持つテオを軽蔑しつつ、利用しようとする
  arc: 支配こそが正義だと信じていたが、テオが繋いだ人々の絆を目の当たりにし、自らの孤独と向き合うことになる。
- name: エララ夫人
  role: 脇役/導き手
  age: 65
  gender: 女性
  appearance: スチームパンク風に改造された豪奢なドレスを纏い、銀のパイプを燻らせる小柄な老婦人。
  personality: ミステリアスで茶目っ気があり、核心を突く助言を比喩的に伝える。一人称は「私」。
  speech_style: ゆっくりとしたリズムで、物語を語るような穏やかな口調。
  background: かつて雲海の全域を航海した伝説のナビゲーター。現在は小さな駅の街で骨董店を営んでいる。
  motivation: 次世代に世界の真実を託し、再び空の道が繋がる日を静かに待つこと。
  relationships:
  - name: テオ・アルジェント
    relation: 才能を見出した教え子のような存在
  arc: 物語の起点となり、テオに剣の破片を託すことで、自身の人生で成し遂げられなかった「再会」を彼に託して完結させる。
