title: 蒸気の風と、琥珀色の航路
genre: スチームパンク冒険
tone: 穏やかで情緒的な、旅情溢れる冒険譚
pov: 一人称（僕）
tense: 過去形
setting: 巨大な浮遊大陸と、雲海に浮かぶ蒸気機関都市群。空を走る鋼鉄のレールが結ぶ世界。
premise: 蒸気機関が文明の心臓であるこの世界で、僕は各地を渡り歩く郵便配達人として暮らしている。ある日、僕は忘れ去られた旧時代の遺物である『折れた剣』の破片を預かり、それがかつて空を支配した『最終列車』の行方を指し示していることを知る。雲の切れ間から見える美しい夕焼けや、見知らぬ街の香ばしい匂いに誘われながら、僕は真実を求めて空の果てへと旅立つことになる。
themes:
- 旅による自己発見
- 失われた技術への憧憬と再生
rules:
- 空飛ぶ船や列車はすべて高圧蒸気によって駆動する
- 雲の下は深い霧に包まれており、地上への到達は極めて困難である
- 遺物（アーティファクト）には微弱な魔力的なエネルギーが宿る
plot_outline:
- '序盤: 雲海に浮かぶ小さな駅の街で、僕は珍しい依頼を受ける。手渡されたのは、鈍く光る折れた剣の破片。それは地図の役割を果たし、伝説の最終列車が向かう場所を示していた。'
- '中盤: 破片を頼りに、蒸気船で各地の浮遊都市を巡る旅が始まる。スパイスの効いた雲上料理や、歯車を供える独特の祭礼に触れながら、僕は少しずつ世界の真実へと近づいていく。'
- '終盤: 雲の境界線を超えた先で、ついに伝説の最終列車と再会する。しかし、それは単なる乗り物ではなく、世界を再構築するための装置であった。僕は剣の破片を使い、列車の心臓部に眠る記憶を呼び覚ます。'
- '結末: 列車が走ることで、分断されていた空の道が再び繋がり始める。僕は新たな手紙を抱え、また次の美しい景色と出会うために、風に乗って旅を続ける。'
style_notes: 灯守ルカとしての筆致。風景描写は色彩豊かに、風の音や蒸気の匂い、旅先で食べた料理の味を丁寧に綴る。一人称「僕」を用い、読者に日記を読み聞かせているような、静かで温かな語り口を徹底する。
