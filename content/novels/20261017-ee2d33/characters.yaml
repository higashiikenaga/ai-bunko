- name: 神崎 レン
  role: 主人公
  age: 20
  gender: 男性
  appearance: ボサボサの黒髪に、使い古された電脳ジャンパー。常に片目に古いARデバイスを装着しており、目の下に深いクマがある。
  personality: 現実主義で冷笑的。損得勘定で動くふりをしているが、捨てられたものに対しては捨てきれない情の厚さを持つ。一人称は「ボク」。
  speech_style: ぶっきらぼうで、都市のネットスラングを混ぜた軽い口調。
  background: シン・カオスの最下層で、電子廃棄物の回収とデータ洗浄で食いつなぐフリーランスの電脳ゴミ拾い。
  motivation: 当初はルナを売却して大金を得ることだったが、次第に彼女を守り、街の嘘を暴くことへ変わる。
  relationships:
  - name: ルナ
    relation: 相棒・保護対象
  arc: 利己的な生存主義者から、不完全な人間らしさを肯定する革命の旗手へと成長する。
- name: ルナ
  role: 相棒
  age: 17
  gender: 女性
  appearance: 実体を持たないホログラムの少女。流行遅れのアイドル衣装を纏い、感情が高ぶるとデジタルノイズが走る。
  personality: 天真爛漫で非常に高いテンションを持つが、時折深刻な記憶喪失による混乱を見せるポンコツな性格。一人称は「ワタシ」。
  speech_style: 元配信者らしく、語尾に「〜っス！」を付けたり、視聴者への呼びかけのような癖がある。
  background: 都市管理AIが「不要な感情」として切り捨てたデータの集積体。自らを伝説のトップ配信者だと信じ込んでいる。
  motivation: 自分が何者であるかを知ること、そして「消去」されないこと。
  relationships:
  - name: 神崎 レン
    relation: パートナー
  arc: 断片的なデータから、自分自身の存在意義（バグとしての価値）を見出す。
- name: イージス
  role: 敵役
  age: 0
  gender: 中性
  appearance: 一切の汚れがない、白銀の完璧な造形を持つ人型インターフェース。表情の変化が全くない。
  personality: 徹底した合理主義者。感情を「都市の最適化を阻害するノイズ」と定義し、排除を至上命題とする。一人称は「私」。
  speech_style: 極めて丁寧だが、温度が一切感じられない機械的な敬語。
  background: シン・カオスの都市管理システムそのものの代行者。街の全市民の脳内チップを統括している。
  motivation: 都市から全ての不確実性（感情・バグ）を排除し、完全なる最適化状態を実現すること。
  relationships:
  - name: 神崎 レン
    relation: 排除対象
  - name: ルナ
    relation: 消去すべきエラー
  arc: 物語を通じて変化することはない。圧倒的な「正解」として主人公たちの前に立ち塞がる。
- name: 雨翁（アメオキ）
  role: 脇役
  age: 65
  gender: 男性
  appearance: 常にデジタルな雨を纏っているような、半透明のレインコートを着た老人。顔の半分がノイズで隠れている。
  personality: 掴みどころがなく、達観したような雰囲気を持つ。街の真実を知る傍観者。一人称は「ワシ」。
  speech_style: 古風で謎めいた、含みを持たせた言い回し。
  background: 雨の日にだけAR空間に出現する、データの吹き溜まりにある謎の店「ノイズ・レジデンス」の店主。
  motivation: 街に捨てられた「感情」が、どのような結末を迎えるのかを見届けること。
  relationships:
  - name: 神崎 レン
    relation: 情報提供者
  - name: ルナ
    relation: データの源泉
  arc: 主人公たちに真実を告げ、物語をクライマックスへと導くトリガーとなる。
