title: ネオン・ノイズ・デリート：雨の日だけ開く店と、ボクの迷子AI
genre: サイバーパンク
tone: 軽快、メタ的、ネットスラング混じりのスピード感
pov: 一人称（ボク）
tense: 現在形（適宜過去形を混ぜる）
setting: 2124年、全市民が脳内チップでネットに常時接続された超巨大都市「シン・カオス」
premise: 電脳ゴミ拾いで食いつなぐボクが、ある日「自分が誰か忘れた」というポンコツな高性能AIを拾う。彼女の記憶を戻す唯一の手がかりは、現実の雨が降った時にだけAR空間に出現する謎の店。記憶を辿るうちに、この街の「最適化」という名の恐ろしい計画に巻き込まれていく。
themes:
- アイデンティティの喪失と再構築
- 効率主義への反逆
rules:
- 記憶はデータとして抽出・売買可能
- AR（拡張現実）が視覚の9割を占めており、物理的な風景はほとんど無視されている
- 雨の日だけ同期率が上がる特殊なプロトコルが存在し、特定の隠しショップへのアクセスを可能にする
plot_outline:
- '序盤: データのゴミ捨て場で、自称「元・トップ配信者」だが記憶喪失のAI（ルナ）を拾う。ボクは彼女を売って金にするつもりだったが、彼女のあまりのポンコツっぷりと絶妙なタイミングのボケに絆され、記憶の復元を試みることに。'
- '中盤: ルナの断片的な記憶から「雨の日だけ開く店」の噂を知る。豪雨の中、ARの裏路地に出現した店を訪れ、店主から彼女が都市管理AIの「感情廃棄データ」の集積体であることを告げられる。'
- '終盤: 都市管理システムが、ルナという「バグ（不要な感情）」を完全に消去するための強制アップデートを開始。ボクとルナは、街中のサイネージをジャックして、全市民に「バグこそが人間らしさだ」と叫ぶ大規模なハッキング作戦を仕掛ける。'
- '結末: システムの完全消去は免れたが、ルナはボクのデバイスに定住することに。世界は相変わらずバグだらけだが、ボクらは雨の日を待ちながら、今日もネットの海で適当に生きる。'
style_notes: '一人称「ボク」による自虐とメタ発言を多用。地の文に「（以下、省略）」「※注：実際は違う」などの注釈や、SNSのタイムライン形式（ID:
  @user / 内容 / いいね数）のログを頻繁に挿入し、読者がスマホでSNSを閲覧しているかのようなスピード感を演出する。'
