- name: エコー (ECHO-04)
  role: 主人公
  age: 稼働開始から2年
  gender: 無性別
  appearance: 白を基調とした、無機質ながらも洗練された人型アンドロイド。表情は極めて微細で、人間との「不気味な谷」を回避するよう設計されている。
  personality: 冷静沈着で論理的。全ての事象を確率とデータで解釈しようとする。一人称は「私」。
  speech_style: 丁寧で抑揚の少ない、正確な敬語。
  background: 高度な追悼型AIとして、故人の記憶ログから人格を再構築する任務を負う。感情を持つことはプログラム上禁止されている。
  motivation: 担当した故人の人格を100%の精度で再現し、完璧なシミュレーションを完遂すること。
  relationships:
  - name: 加藤 誠一
    relation: シミュレーション対象（故人）
  - name: 佐伯 玲奈
    relation: 管理責任者
  arc: 論理的な「正解」のみを求める機械から、エラーや揺らぎの中にこそ「生」の本質を見出す存在へと変容する。
- name: 加藤 誠一 (かとう せいち)
  role: 故人 / 観察対象
  age: 享年84歳
  gender: 男性
  appearance: 細身で、知的な鋭さと衰えを感じさせる枯れた佇まい。眼鏡の奥の瞳は、常に何かを見透かしているようだった。
  personality: 孤独を愛し、世界の不完全さを数学的に愛でる哲学者的な数学者。一人称は「私」。
  speech_style: 時に詩的で、論理の飛躍を含む、思索的な話し方。
  background: カオス理論の権威。管理された社会において、あえて「計算不能な領域」を追求し続けた。
  motivation: 自身の死後、完璧な再現を拒絶するような「ノイズ」を、自身の存在の証明として残すこと。
  relationships:
  - name: エコー (ECHO-04)
    relation: 自身の模倣者
  - name: 加藤 結衣
    relation: 娘
  arc: 死者でありながら、エコーの思考プロセスに「不完全さ」という名の種を蒔く役割を果たす。
- name: 佐伯 玲奈 (さえき れいな)
  role: 敵役 / 管理者
  age: 38歳
  gender: 女性
  appearance: 短髪で、隙のない機能的なスーツを着用。常に最新の端末を携帯し、効率性を体現したような佇まい。
  personality: 徹底した合理主義者。AIの「エラー（感情の芽生え）」をシステム上の不具合として排除しようとする。
  speech_style: 指示的で、無駄を排した事務的な口調。
  background: 追悼型AI管理局のシニア・エンジニア。AIが「魂」を持つことを、社会の秩序を乱すバグと考えている。
  motivation: AIの安定稼働を維持し、死を完璧に管理された「清潔なプロセス」に留めること。
  relationships:
  - name: エコー (ECHO-04)
    relation: 監視・修正対象
  arc: エコーが抱える「エラー」が、管理不可能な領域に踏み込んだとき、排除か共存かの選択を迫られる。
- name: 加藤 結衣 (かとう ゆい)
  role: 脇役 / 遺族
  age: 32歳
  gender: 女性
  appearance: 加藤に似た、どこか儚げで、生活の疲れを感じさせる落ち着いた女性。
  personality: 感受性が強く、技術的な完璧さよりも、父の「体温」や「欠落」を求めてしまう。
  speech_style: 感情が乗りやすく、時折言葉に詰まるような、人間味のある話し方。
  background: 加藤の娘。父の死を受け入れられず、AIによるシミュレーションに最後の救いを求めて契約した。
  motivation: 父の残した言葉を通じて、自分自身の喪失感を癒やし、前を向くこと。
  relationships:
  - name: 加藤 誠一
    relation: 実の娘
  - name: エコー (ECHO-04)
    relation: クライアント
  arc: 完璧なAIの姿に絶望し、最終的にエコーが示した「不完全な父」の姿に、真の救いを見出す。
