title: 空白の楽譜に、君の体温を
genre: 青春恋愛
tone: 詩的で軽やか、旋律を感じさせるリズム感
pov: 三人称
tense: 過去形
setting: 音楽が物理的な光や熱として顕現する都市「ルミナ」。人々は歌うことで街の灯りを灯し、生活を営んでいる。
premise: 音楽の才能（魔力）を持たず、世界の「色」が見えない少年・カイト。彼は街の最底辺にある禁忌の地下図書館で、誰にも聞こえない「静寂の曲」を書き続ける少女・リラと出会う。機能的な音楽ばかりが称賛される街で、二人は不完全で、けれど心に触れるだけの不協和音を奏で始める。それは、世界を塗り替えるほど純粋な、恋という名の旋律だった。
themes:
- 不完全さの肯定
- 孤独の共鳴
rules:
- 歌や演奏は『オーラ』という可視光となり、街のエネルギー源となる。
- オーラの色彩や強度は演奏者の感情と技術に依存する。
- 地下図書館に眠る『古の楽譜』は、機能ではなく感情を増幅させるため、現代では禁書とされている。
plot_outline:
- '序盤: 音楽の不適合者として疎外されていたカイトが、偶然迷い込んだ地下図書館で、孤独に作曲に励むリラと出会い、彼女の奏でる『色を持たない音』に心を奪われる。'
- '中盤: 二人は禁書の楽譜をベースに、効率や美しさではなく、互いの心拍や呼吸を合わせるだけの不格好な共演を繰り返す。次第に、音を通じて言葉にできない恋心を共有していく。'
- '終盤: 街最大の祭りの夜。完璧な調和を求める都市のシステムが暴走し、住民たちの歌が不協和音となって街を飲み込もうとする。絶望の中、カイトとリラは地下図書館で完成させた『静寂の歌』を披露する。'
- '結末: 二人の歌は光を放たなかったが、人々の心の波長を整え、暴走を鎮める。特別な力を持たずとも、隣にいる誰かと響き合えることの幸せを噛み締め、二人は新しい楽譜を書き始める。'
style_notes: 音楽的なメタファー（シンコペーション、休止符、転調など）を文章の構成に組み込む。三人称でありながら、登場人物の鼓動や吐息がリズムとして伝わるような、韻を踏んだリズミカルな文体を徹底する。各話の山場で、物語の感情を凝縮した短い詩（歌詞）を挿入し、読者の耳に音が残るような演出を行う。
