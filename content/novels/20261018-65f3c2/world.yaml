title: 雨季の鏡、あるいは渡り鳥の証言
genre: 本格ミステリー
tone: 静謐で理知的な古典的本格推理
pov: 一人称（ワトソン役の私＝篠崎）
tense: 過去形
setting: 梅雨時の霧深い海辺の街。雨の日だけ開店する古書店兼喫茶店『水鏡堂』。
premise: 前作の事件後、西園寺家の遺産を整理していた学者が、雨の日のみ営業する店『水鏡堂』の密室で殺害される。現場には、季節外れの渡り鳥の羽と、不可解な時刻が記された予約帳だけが残されていた。久我蓮は、雨という気象条件が作り出す「時間的な密室」の正体を暴こうとする。
themes:
- 認識の盲点
- 不可逆的な時間
rules:
- 全てのトリックは物理的・論理的に説明可能であること
- 犯人は提示された容疑者の中に限定されること
- 雨という気象条件が物理的な障壁または視覚的誤認の要因となること
plot_outline:
- '序盤: 篠崎と久我は、西園寺家の資料を管理していた学者が、雨の日だけ開く店『水鏡堂』で死んでいるのを発見する。店は完全な密室であり、唯一の出入り口は雨が降っている間だけ開放される特殊な構造だった。'
- '中盤: 現場に残された渡り鳥の羽と、店主が記録していた『雨の日限定』の顧客名簿から、被害者が誰を待っていたのかを追う。久我は、雨の量と霧の濃度によって、外部からの視認性が劇的に変化することに注目する。'
- '終盤: 容疑者たちの完璧なアリバイが、実は『雨が降っていること』を前提とした時間感覚の錯覚に基づいていることを久我が指摘する。渡り鳥の鳴き声が、特定の時刻を知らせる外部信号として利用されていたことが判明する。'
- '結末: 久我が論理的に犯人を追い詰め、水鏡のように反転した真実を提示する。犯行の動機は前作の西園寺家の権威失墜に伴う、隠された血統の抹消であったことが明かされる。'
style_notes: 記述は常に冷静に。探偵・久我の超人的な洞察力を、観察者である篠崎の驚きと感銘を通じて描写する。手がかりは些細な違和感として本文に散りばめ、結末ではそれらを数式を解くように繋ぎ合わせる。
