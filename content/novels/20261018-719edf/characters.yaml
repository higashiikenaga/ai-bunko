- name: 結城 湊 (ユウキ・ミナト)
  role: 主人公
  age: 18
  gender: 男性
  appearance: 無造作に伸びた黒髪、常に隈のある虚ろな瞳。痩せ型で、ネオンの光を避けるように常に深いフードを被っている。
  personality: 内向的で自己卑下的。かつての輝きを失い、思考すること自体を恐れている。一人称は「俺」。
  speech_style: 低く、感情の起伏が乏しい。必要最低限のことしか話さない。
  background: かつて『タクティカル・チェス』の天才児として名を馳せたが、決定的な局面での「読み」のミスにより、精神を病み表舞台から姿を消した。
  motivation: 失った自信の回復と、自分を壊した「あの一手」の正体を知ること。
  relationships:
  - name: 九条 蓮司
    relation: かつての宿敵であり、現在の対立相手
  - name: アイラ
    relation: 地下の生活を支える協力者
  arc: 自己否定と恐怖に支配された「逃避」から、不確実な未来を自らの手で読み解く「挑戦」へと変化する。
- name: 九条 蓮司 (クジョウ・レンジ)
  role: 敵役
  age: 19
  gender: 男性
  appearance: 仕立ての良いハイテク・スーツを纏い、整った容姿。冷徹な光を放つ鋭い眼差しを持つ。
  personality: 完璧主義者で傲慢。論理の美しさを至上とし、感情をノイズとして切り捨てる。一人称は「僕」。
  speech_style: 丁寧だが、相手を見下すような冷ややかさと威圧感がある。
  background: 結城の挫折を足場に、瞬く間にトッププレイヤーへと登り詰めた。現在は闇のトーナメントの主催者の一人として、絶対的な論理を証明しようとしている。
  motivation: 結城を再び盤上に引きずり出し、自身の「完璧な論理」が彼の「直感」を凌駕することを確認すること。
  relationships:
  - name: 結城 湊
    relation: 執着に近いライバル心を持つ対象
  arc: 絶対的な論理の支配者から、結城の「不合理な一手」によって、計算不能な人間の可能性を突きつけられる。
- name: アイラ
  role: 相棒
  age: 17
  gender: 女性
  appearance: ネオンピンクのショートヘアに、情報の流れを視認するためのホログラム・ゴーグルを装着。活動的なテックウェアを着ている。
  personality: 快活で現実主義。データの裏にある「熱量」を重視する。一人称は「アタシ」。
  speech_style: 語尾が跳ねるような、スピード感のある喋り方。
  background: 地下街のデータ・アナリスト。結城の隠遁生活を見つけ出し、彼の「読み」の残滓に賭けてトーナメントへの復帰を促す。
  motivation: 退屈なデータの世界に、結城のプレイによる「予測不能な劇的な展開」をもたらすこと。
  relationships:
  - name: 結城 湊
    relation: 再起を支援するマネージャー的存在
  arc: 単なる観測者・データ解析者から、結城の戦いに情熱を共有する共犯者へと変化していく。
- name: 影山 (カゲヤマ)
  role: 脇役
  age: 52
  gender: 男性
  appearance: 使い古されたコートを羽織り、片目はサイバネティクス製の義眼。常に電子タバコを燻らせている。
  personality: 無愛想で世慣れた老人。すべてを見通しているような落ち着きがある。一人称は「ワシ」。
  speech_style: ぶっきらぼうだが、核心を突く重みのある言葉を投げかける。
  background: かつてタクティカル・チェスの黎明期を支えた伝説的なプレイヤー。現在は地下の競技場近くのバーの店主。
  motivation: かつての輝きを失った若者たちが、盤上で自分を取り戻す瞬間を見守ること。
  relationships:
  - name: 結城 湊
    relation: 精神的な支えとなるメンター
  arc: 物語の転換点において、結城が過去のトラウマを克服するための「哲学」を授ける役割を果たす。
