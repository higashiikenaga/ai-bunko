title: 零落のチェックメイト：ネオンの残響と、散り急ぐ春
genre: スポーツ青春
tone: 静謐な熱狂と、極限の心理戦
pov: 三人称近接視点
tense: 過去形
setting: 近未来、年中ネオンが輝き、眠らない街として知られる巨大都市。その地下階層にある、高精細なホログラム盤を用いた超高速思考競技『タクティカル・チェス』の競技場。
premise: かつて天才と呼ばれながら、ある「読み」のミスで全てを失った少年・結城は、眠らない街の片隅で廃人同然の生活を送っていた。しかし、街を覆う桜の季節、彼はかつてのライバルが主催する闇のトーナメントに引き戻される。ホログラムの駒が描く光の軌跡、指先から伝わる微かな電気信号。一手に込められた数手先の絶望と希望が、夜の街に交錯する。
themes:
- 再起と贖罪
- 思考の極限における美学
rules:
- タクティカル・チェスは、脳波インターフェースを用いて思考速度を加速させ、視覚化された盤面で行われる競技である。
- 一度のミスが脳へのフィードバック負荷（脳震盪に近い感覚）として返ってくるため、精神的な強靭さが勝敗を分ける。
- 公式ルールとは別に、賭けが行われる地下トーナメントでは、特殊な制限ルールが適用されることがある。
plot_outline:
- '序盤: 挫折した主人公・結城が、ネオンの光に逃げるようにして地下の競技場へ足を踏み入れ、偶然にも圧倒的な「読み」の片鱗を見せてしまう。'
- '中盤: 闇のトーナメントへの招待。かつての宿敵との再会。一手の意味を巡る、静寂の中での激しい思考の衝突。桜が舞い散る街の喧騒と、盤上の静寂のコントラスト。'
- '終盤: 決勝戦。脳への負荷が限界に達する中、結城はかつて自分を壊した「読み」の罠を、逆手に取った一手で打ち破る。'
- '結末: 勝利の余韻の中で、結城は初めて自分自身の思考を肯定する。夜明けの街に、桜の花びらが静かに舞い落ちる。'
style_notes: 盤上で行われる一手の意味を、単なる戦術解説に留めず、登場人物の精神状態や哲学と結びつけて記述すること。思考のプロセスは、まるで水面下に沈んでいくような、あるいは閃光が走るような、密度のある比喩を用いて描写する。緊迫感は叫びではなく、静かな鼓動と、指先が盤に触れる瞬間の静寂によって表現する。
