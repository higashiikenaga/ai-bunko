- name: 篠崎 遥
  role: 主人公
  age: 29
  gender: 女性
  appearance: 落ち着いた瞳、黒髪のボブ、コーヒーの香りが漂う清潔感のあるエプロン姿。
  personality: 穏やかだが、他人との間に絶妙な距離を保つ思慮深さを持つ。一人称：私。
  speech_style: 丁寧で、相手の沈黙を尊重するような柔らかな口調。
  background: かつて都会の喧騒と人間関係の虚飾に疲れ、深夜にだけ開く喫茶店「レム」を営む。
  motivation: 孤独な人々が、偽らなくて済む静かな夜を守ること。
  relationships:
  - name: 如月 蓮
    relation: 惹かれ合い、守りたいと願う相手
  arc: 嘘で相手を守ることの限界を知り、痛みを伴う真実を共に受け入れる覚悟を決める。
- name: 如月 蓮
  role: 主人公
  age: 32
  gender: 男性
  appearance: 色白でどこか儚げな印象。雨に濡れたような、湿り気を帯びた瞳。一人称：僕。
  personality: 過剰なほどに誠実で、嘘をつこうとすると身体が拒絶反応を起こす性質を持つ。一人称：僕。
  speech_style: 飾り気がなく、時に残酷なほど直接的で、言葉の間に独特の間がある。
  background: 過去に組織の不正を告発した際、その「嘘をつけない」性質ゆえに社会から孤立し、縁を切られた。
  motivation: 自分の真実が誰かを傷つけない、静かな居場所を見つけること。
  relationships:
  - name: 篠崎 遥
    relation: 初めて安らぎを感じた女性
  arc: 自身の性質を呪いとしてではなく、ありのままの自分として他者と繋がるための手段として受け入れ始める。
- name: 神崎 健斗
  role: 敵役
  age: 35
  gender: 男性
  appearance: 隙のない高級なスーツ、鋭い眼光、周囲を威圧するような完璧な佇まい。
  personality: 徹底した合理主義者。社会を維持するには「嘘」が必要だと確信している。一人称：俺。
  speech_style: 滑らかで説得力があり、相手を論理的にコントロールしようとする響きを持つ。
  background: 蓮の元上司。蓮の誠実さを利用して利益を得ていたが、彼の告発によって立場を追われた過去を持つ。
  motivation: 蓮を再び社会の論理の中に引き戻し、秩序を乱す「異物」を排除すること。
  relationships:
  - name: 如月 蓮
    relation: 過去に因縁を持つ元同僚
  arc: 言葉による論理では決して届かない、二人の間に流れる非合理な絆を目の当たりにし、敗北を喫する。
