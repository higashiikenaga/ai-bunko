title: 微熱の夜に、透明な嘘を
genre: ヒューマンドラマ
tone: 艶やかで静謐。大人の孤独と渇望を漂わせる。
pov: 三人称
tense: 過去形
setting: 現代、雨の多い都市。深夜にのみ営業する喫茶店「レム」
premise: 深夜にだけ開く喫茶店を営む女は、ある夜、雨に濡れた一人の男と出会う。彼は「嘘をつけない」という残酷な呪いを背負い、社会の縁で静かに息を潜めていた。香り立つコーヒーと夜の静寂の中で、二人は言葉にならない感情を視線で交わし合う。しかし、愛が深まるほどに、真実だけが二人を切り裂いていく。
themes:
- 真実と嘘の境界
- 孤独の共鳴
rules:
- 一部の人間は生まれつき、あるいはある種の呪いにより、意識的に嘘をつくことができない。嘘をつこうとすると激しい喉の痛みと呼吸困難に陥るため、彼らは多くの場合、沈黙を選ぶ。
plot_outline:
- '序盤: 深夜の店に、雨の香りと共に現れた男。彼は不器用に、だが誠実に、店主の女に惹かれていく。'
- '中盤: 男が「嘘をつけない呪い」を持っていることが判明する。女は彼の不器用な真実を愛し、二人は夜の静寂の中で互いの孤独を埋め合う。'
- '終盤: 男の過去に関わる人物が現れ、彼を再び絶望へ突き落とそうとする。女は彼を守るために「優しい嘘」を望むが、彼は物理的にそれに応えることができない。'
- '結末: 最終列車のホームで、二人は残酷なまでの真実を突きつけられる。それでも、言葉ではなく香りや体温という嘘のない感覚で、互いの存在を肯定し合う道を選ぶ。'
style_notes: 台詞を極限まで削ぎ落とし、指先の震えや視線の彷徨、コーヒーの湯気に混じるサンダルウッドの残り香などで心理描写を行う。大人の男女の緊張感を、湿り気を帯びた艶やかな文体で綴る。
