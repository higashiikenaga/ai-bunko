- name: カイ・アステリア
  role: 主人公
  age: 24
  gender: 男性
  appearance: 黒髪で鋭い眼光を持つ、引き締まった体躯の青年。背には対照的な意匠の二振りの剣を背負っている。
  personality: 冷徹で現実主義、孤独を好む。目的のためには手段を選ばないが、内側に強い情熱を秘めている。一人称は「俺」。
  speech_style: 無駄がなく、ぶっきらぼうで突き放すような話し方。
  background: 神を殺すための呪われた双剣を継承した流れ者の傭兵。自身の出生の秘密を知らずに生きてきた。
  motivation: 己の宿命の正体を知り、世界の理に抗うこと。
  relationships:
  - name: ルナ・アステリア
    relation: 魂の片割れであり、殺すべき運命の相手
  - name: ゼノス・ヴァルガード
    relation: 追跡者であり、宿敵
  arc: 感情を殺して生きてきた男が、ルナとの再会を通じて「愛するものと守るべきもの」の矛盾に直面し、真の決断を下す強さを得る。
- name: ルナ・アステリア
  role: ヒロイン/敵役
  age: 24
  gender: 女性
  appearance: カイと瓜二つの容貌を持つ、神秘的な美貌の女性。銀髪に桜色の瞳を持ち、神々しくも儚い雰囲気を纏う。
  personality: 慈愛に満ちているが、世界の終焉を担う者としての虚無感を抱えている。一人称は「私」。
  speech_style: 穏やかだが、どこか現実離れした、超越的な響きを持つ話し方。
  background: 世界の均衡を司る「双子の巫女」の一人。彼女の魔力が極限に達した時、世界は桜と共に崩壊する。
  motivation: 全ての生命を輪廻へと還し、世界の歪みをリセットすること。
  relationships:
  - name: カイ・アステリア
    relation: 魂の片割れであり、自分を止めてくれる唯一の存在
  arc: 巫女としての役割と人間としての自我の間で葛藤し、最終的に自らの意志で世界の運命を受け入れる。
- name: ゼノス・ヴァルガード
  role: 敵役
  age: 42
  gender: 男性
  appearance: 黄金の甲冑に身を包んだ、威厳ある体格の騎士。常に峻厳な表情を崩さない。
  personality: 厳格な正義感の持ち主で、秩序を乱すものを一切容赦しない狂信的な側面を持つ。一人称は「私」。
  speech_style: 威圧的で、教義に基づいた説教めいた、隙のない話し方。
  background: 聖騎士団団長。季節の歪みを「神への冒涜」と断じ、双子の巫女を抹殺することを至上命題としている。
  motivation: 聖なる秩序の維持と、異端者の排除。
  relationships:
  - name: カイ・アステリア
    relation: 排除すべき異端者
  - name: ルナ・アステリア
    relation: 討伐対象
  arc: 揺るぎない正義を信じていたが、世界の歪みの真実を知ることで、己の信念が崩壊する恐怖に直面する。
- name: ミラ
  role: 脇役/ガイド
  age: 17
  gender: 女性
  appearance: 小柄で活動的な装いの少女。辺境の村の娘で、魔力に敏感な透き通った瞳を持つ。
  personality: 明るく献身的だが、過酷な環境で育ったため芯が強く、観察眼に優れる。一人称は「私」。
  speech_style: 快活で感情表現が豊か。カイに対しては遠慮のない態度を取る。
  background: 桜の異変に巻き込まれた村の生き残り。カイの旅に同行し、世界の断片的な知識を提供する。
  motivation: 失われた日常を取り戻し、凍てつく世界に春を呼び戻すこと。
  relationships:
  - name: カイ・アステリア
    relation: 旅の同行者であり、守るべき対象
  arc: ただ守られるだけの少女から、絶望的な状況下でも希望を見出し、人々を導く強さを持つ女性へと成長する。
