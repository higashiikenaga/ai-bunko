title: 双極の刃と落花の残響
genre: 異世界ファンタジー
tone: 硬派・無骨・激情
pov: 一人称
tense: 過去形
setting: 四季が魔力によって歪められた、永劫の冬が迫る境界の国
premise: 魔力を宿した桜が舞い散る時、世界の理が書き換わる。俺は、神を殺すための「双子の剣」を背負う傭兵だ。かつて分かたれた片割れが、世界の終焉を告げる災厄として目の前に現れる。守るべきものと、斬るべきもの。静寂の後に、血の雨が降る。
themes:
- 宿命の対決
- 絆と断絶
rules:
- 桜の精霊は魔力を吸い上げ、物理的な質量を持つ刃へと変換する
- 双子の魂が共鳴すると、時間軸にわずかな歪みが生じる
- 魔力切れの剣士は、心臓の鼓動を糧に一時的な超常能力を発揮できる
plot_outline:
- '序盤: 凍てつく国を旅する傭兵の俺。辺境の村で、桜の花弁が血のように舞う異変に遭遇する。そこには、俺と同じ顔をした女がいた。'
- '中盤: 彼女は世界の均衡を壊す「双子の巫女」の一人だった。追っ手となる聖騎士団との戦闘。俺は彼女を守るため、己の血を剣に注ぎ込む。'
- '終盤: 決戦の地、千本桜の樹海。彼女の魔力が極限に達し、世界を崩壊させる。俺は彼女を殺さねばならない。静寂が訪れ、抜刀の瞬間が来る。'
- '結末: 刃は交差した。桜は散り、春は訪れない。だが、彼女の魂の一部は俺の剣に宿り、俺は止まらない戦いへと歩み出す。'
style_notes: 短文で畳みかける。擬音（ドーン、ザッなど）を徹底的に排除し、動きを動詞で描写する。戦闘開始前には必ず、風の音や静寂、呼吸の描写といった「静」の場面を挿入し、緩急をつける。語り口は「俺」であり、無骨で感情を直接言葉にせず、行動で示すこと。
