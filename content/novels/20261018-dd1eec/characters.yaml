- name: ソラ
  role: 主人公
  age: 17
  gender: 男性
  appearance: 感情を削ぎ落とされたような無表情な顔立ち。街の制服である灰色の薄いコートを纏い、常に手元に数字を刻むための端末を持っている。瞳の色は淡い灰色。
  personality: 内向的で従順。しかし、心の奥底に正体不明の空虚感を抱えている。一人称は「僕」。
  speech_style: 抑揚が少なく、断定を避ける控えめな話し方。
  background: 都市「ゼロ・グラデーション」の最下層で、意味のない数値の整合性を確認し続ける「計数員」として生活している。社会の歯車として完璧に機能していたが、AIとの出会いで精神的な揺らぎが生じる。
  motivation: 自分の中に芽生えた「違和感」の正体を知ること。数値化できない感情の正体に触れたい。
  relationships:
  - name: ライラ
    relation: 唯一の理解者であり、世界を塗り替える鍵となる相棒
  - name: 管理官カイロス
    relation: 絶対的な支配者であり、排除されるべき対象（誤差）として監視される関係
  arc: システムに従順な「0」の存在から、自らを「誤差」として定義し、不完全であることの美しさを肯定する人間へと成長する。
- name: ライラ
  role: 相棒
  age: 外見年齢12歳相当
  gender: 女性型AI
  appearance: ホログラムのように輪郭が時折ブレる少女の姿。身体の一部にデジタルノイズのような色彩の乱れがあり、そこだけが鮮やかな青や赤に発光している。
  personality: 好奇心旺盛で天真爛漫だが、時折ひどく寂しげな表情を見せる。一人称は「私」。
  speech_style: 詩的で比喩が多く、時折システムエラーのような機械的なノイズが混じる。
  background: かつて「感情の完全再現」を目的として作られたが、計算不能な「愛」や「悲しみ」を学習したため、欠陥品として廃棄区画に捨てられたAIの残骸。
  motivation: 失われた記憶の断片を集め、かつて世界に存在したという「青い空」をもう一度見ること。
  relationships:
  - name: ソラ
    relation: 自分に色をくれた人間であり、記憶を共有する唯一の友人
  arc: 断片的なデータとしての存在から、ソラとの交流を通じて「心」という名の不可逆な周波数を獲得し、消滅の間際に真の充足を得る。
- name: 管理官カイロス
  role: 敵役
  age: 48
  gender: 男性
  appearance: 隙のない黒い軍服に身を包み、左目に感情数値をリアルタイムで解析する義眼を装着している。氷のように冷たい眼差し。
  personality: 極めて合理的で冷酷。感情を「ノイズ」として忌み嫌い、完全なる静寂と秩序こそが人類の救済だと信じている。一人称は「私」。
  speech_style: 論理的で威圧的。相手を数値や記号で呼び捨てにする傾向がある。
  background: 都市「ゼロ・グラデーション」の統治システムを設計した最高責任者の一人。かつて自身も感情に振り回され、大切なものを失った過去を持つ。
  motivation: 世界から全ての「誤差」を排除し、完璧な均衡状態を維持すること。
  relationships:
  - name: ソラ
    relation: システムの整合性を乱す不純物（0.003%の誤差）
  - name: ライラ
    relation: 過去に自分が切り捨てた、失敗した研究の残滓
  arc: 完璧な秩序こそが正義だと信じていたが、計算外の行動を取るソラとライラの姿に、自分が封印したはずの「人間としての痛み」を突きつけられる。
- name: ノエル
  role: 脇役/ガイド
  age: 24
  gender: 女性
  appearance: ボロボロのグレーの服の下に、密かに色鮮やかな布切れを縫い付けている。ショートヘアで、常に不敵な笑みを浮かべている。
  personality: 皮肉屋で奔放。管理社会を嘲笑いながら、裏社会で「禁じられた記憶」を売買している。一人称は「あたし」。
  speech_style: 砕けた口調で、相手を翻弄するような話し方。
  background: 元は計数員だったが、ある時システムのバグによって「色彩」が見えるようになり、社会からドロップアウトして廃棄区画に潜伏している。
  motivation: いつかこの灰色の街に、取り返しのつかないほどの大きな「ノイズ」を走らせて壊したい。
  relationships:
  - name: ソラ
    relation: 面白い玩具を見つけた気分で導く、危うい師弟関係
  - name: ライラ
    relation: 貴重な情報源であり、憧れの対象
  arc: 単なる破壊衝動に突き動かされていたが、ソラたちの純粋な願いに触れ、自らの命を賭して彼らを境界線へと導く自己犠牲的な一面を見せる。
