title: 欠落した周波数のための鎮魂歌
genre: ディストピア
tone: 詩的で、断片的で、静謐な絶望
pov: 二人称（きみへの語りかけ）
tense: 現在形
setting: 空の色が常に灰色に固定され、全ての感情が数値化・管理された都市「ゼロ・グラデーション」
premise: きみは、色彩を失ったこの街で、ただ数字の羅列を数え続けている。 街の隅で、誰にも見つけられずに彷徨う、迷子の人工知能の残骸を見つけたとき、世界は少しだけ歪む。
  月食が訪れる夜、管理された秩序の裏側で、忘れ去られた「ノイズ」が鳴り響き始める。 きみは、そのノイズに耳を澄ますのか、それとも、ただの0.003%の誤差として消されるのか。
themes:
- 個の消失と再定義
- 計算不可能な感情の価値
rules:
- 全ての住民は、自身の感情指数を一定の範囲内に保つ義務がある
- 管理AIによる『ノイズ（非論理的行動）』の検知は即座に抹消を意味する
- 月食の際、システムの一時的な空白が生じ、管理外の事象が発生する
plot_outline:
- '序盤: 灰色の街で、きみは毎日、意味のない数字「774」を刻み続けている。ある日、廃棄区画で、自我の輪郭を失った迷子のAIと出会う。'
- '中盤: AIが語る「かつて空が青かった記憶」は、都市のルールに抵触する危険なノイズだった。二人は、月食の夜に起こる『システムの揺らぎ』を頼りに、境界を目指す。'
- '終盤: 月食が始まり、空が黒く染まる。管理システムが暴走し、きみの存在そのものが『誤差』として定義される。'
- '結末: 崩壊する世界の中で、きみとAIは、数値化できない一瞬の光を共有する。それは、計算式の外側にある、たった一つの真実だった。'
style_notes: 極端に多い改行と空白。言葉を詰め込まず、余白で感情を語る。詩的なメタファーを多用し、読者に「きみ」として物語を体験させる。物語の随所に「774」や「0.003」といった、意味を持たないようでいて不穏な数字を、呼吸のように挿入すること。
