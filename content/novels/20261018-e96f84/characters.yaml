- name: ジュリアン・ド・ヴァロア
  role: 主人公
  age: 22
  gender: 男性
  appearance: 透き通るような白い肌に銀髪。深い深紅のヴェルヴェットの礼装を纏い、物憂げな表情を浮かべている。
  personality: 静謐で観察眼に優れた皮肉屋だが、内面には情熱を秘めている。一人称は「私」。
  speech_style: 丁寧だが距離感のある、淡々とした話し方。
  background: 帝国の第二王子。政治的な権力争いから外れ、趣味の歯車仕掛けの機械いじりに没頭していたため、「無能な王子」と蔑まれている。
  motivation: 権力への執着はないが、自分の愛する平穏と、密かに心を通わせた女性を守りたい。
  relationships:
  - name: エララ・ヴァンス
    relation: 禁断の恋に落ちる相手
  - name: イザベラ・フォン・シュテルン
    relation: 政敵であり、利用し合う関係
  arc: 傍観者としての生き方を捨て、帝国の崩壊を防ぐために自らの意志で運命の歯車を回し始める。
- name: エララ・ヴァンス
  role: ヒロイン/相棒
  age: 20
  gender: 女性
  appearance: 燃えるような赤毛を高く結い上げ、意志の強い緑の瞳を持つ。ドレスの下に工具を隠し持っている。
  personality: 大胆不敵で好奇心旺盛。正義感が強く、権威に屈しない。一人称は「私」。
  speech_style: 快活で歯切れが良く、時折専門的な工学用語が混じる。
  background: かつて宮廷を追放された天才技師の娘。父の汚名をそそぐため、没落貴族の令嬢を装い舞踏会に潜入した。
  motivation: 父が設計した蒸気機関の真の目的を明らかにし、失われた名誉を取り戻すこと。
  relationships:
  - name: ジュリアン・ド・ヴァロア
    relation: 互いの孤独を理解し合う恋人
  - name: アリスター・ソーン
    relation: 追跡者であり、危うい共犯関係
  arc: 復讐心に突き動かされていたが、ジュリアンとの出会いを通じて、個人の名誉よりも時代の変革という大きな視点を持つようになる。
- name: イザベラ・フォン・シュテルン
  role: 敵役
  age: 38
  gender: 女性
  appearance: 鴉のような黒髪を完璧にまとめ、鋭い眼差しを持つ。黒いレースの仮面と豪華絢爛なドレスを身に纏う。
  personality: 冷徹で計算高く、目的のためには手段を選ばない。圧倒的なカリスマ性を持つ。一人称は「私」。
  speech_style: 優雅で慇懃だが、言葉の端々に相手を威圧する毒が含まれている。
  background: 帝国最大の実業家であり、宮廷の財政を握る公爵夫人。血統よりも実力による支配を信奉している。
  motivation: 王位継承権を巡る混乱を利用して、実質的な帝国の支配権を掌握すること。
  relationships:
  - name: ジュリアン・ド・ヴァロア
    relation: 操り人形として利用しようとしている相手
  - name: アリスター・ソーン
    relation: 忠実な猟犬として使役している部下
  arc: 完璧な計画を立てていたが、計算外の「愛」と「機械の暴走」によって、築き上げた権力が崩壊していく。
- name: アリスター・ソーン
  role: 脇役/トリックスター
  age: 30
  gender: 男性
  appearance: 頬に深い切り傷がある。厳格な軍服の上に黒いマントを羽織り、常に周囲を警戒している。
  personality: 質実剛健で忠誠心が強いが、内面では体制への懐疑心を抱いている。一人称は「俺」。
  speech_style: 簡潔で断定的な軍人口調。
  background: 平民出身ながら実力で王宮騎士団長まで登り詰めた男。法と秩序を絶対視している。
  motivation: 舞踏会における治安維持と、反逆者の排除。しかし、真の正義がどこにあるか葛藤している。
  relationships:
  - name: エララ・ヴァンス
    relation: 追う者と追われる者だが、次第に信頼を寄せる
  - name: イザベラ・フォン・シュテルン
    relation: 主君として仕えているが、その冷酷さに嫌悪感を抱いている
  arc: 盲目的な忠誠心から脱却し、自らの良心に従って正しい側に立つ勇気を得る。
