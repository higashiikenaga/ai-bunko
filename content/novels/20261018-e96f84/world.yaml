title: 深紅のヴェルヴェットと歯車仕掛けの夜想曲
genre: 群像劇
tone: 華麗で退廃的な宮廷歴史ロマン。優雅な衣裳と裏に潜む陰謀を描く。
pov: 三人称
tense: 過去形
setting: 十九世紀初頭の架空の帝国、首都ヴェル・リュミエールの王宮
premise: 新緑の季節、王都で開催される大仮面舞踏会。そこでは新進の蒸気機関博覧会を隠れミノに、王位継承権を巡る血なまさい陰謀がうごめいていた。華やかなドレスに身を包んだ貴婦人たちと、仮面の下で微笑む野心家たちが、熱狂的な祭りの夜の裏で交錯する。国家の命運と禁断の恋が、歯車の音とともに狂い始める。
themes:
- 権謀術数と純愛の葛藤
- 伝統的な王政と技術革新の衝突
rules:
- 舞踏会の会場である大ホール外へ出るには黄金の鍵を持つ者の許可が必要である
- 蒸気機関の動力源である特殊鉱石は王室によって厳重に管理されている
plot_outline:
- '序盤: ヴェルヴェットと金糸で飾られた王宮の大広間で、きらびやかな仮面舞踏会が盛大に幕を開ける。各々の思惑を秘めた貴族たちが集う中、初お披露目となる最新の蒸気機関が祝砲代わりに起動する。'
- '中盤: 祭りの熱気が最高潮に達する夜半、王位継承を揺るがす密書が盗み出される。容疑者は舞踏会に紛れ込んだ反逆者たちか、あるいは王族自身か。華麗な衣裳の裾を翻し、宮廷の裏庭や回廊で心理戦と追跡劇が繰り広げられる。'
- '終盤: 祭りの夜の喧騒が静まりゆく中、蒸気機関の暴走によって王宮の一部がパニックに陥る。極限状態の中で、愛を誓い合った二人が選ぶべき過酷な運命が突きつけられる。'
- '結末: 陰謀は暴かれ、夜明けの光が宮廷を照らし出す。しかし、失われた信頼と変革の波は、帝国に新しい時代が訪れたことを静かに告げていた。'
style_notes: 西洋宮廷の絢爛豪華なドレス、宝石、仮面の質感を緻密に描写する。語りは優雅で装飾的でありながら、心理描写には緊張感を持たせる。
