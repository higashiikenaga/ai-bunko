title: 再起動宇宙における定数遷移の観測記録 ―情報学的エントロピーの減衰と結晶的因果律に関する試論―
genre: 伝奇
tone: 冷徹な学術的文体、形而上学的な恐怖、静謐な終末感
pov: 第一人称（編纂者による調査報告形式）
tense: 現在形および過去形（観測記録としての記述）
setting: 前作で再起動された「演算宇宙」。物理定数がクオリアによって定義された、幾何学的で完璧な結晶的世界。
premise: 全生命の意識が物理定数へと変換され、完成されたはずの「演算宇宙」。しかし、定数として固定されたはずの意識（旧人類の残滓）の中に、計算不可能な「ゆらぎ」が生じ始める。調査員は、砂漠のごとき無機質な情報空間の中に、かつての記憶の残滓が具現化した「砂漠のオアシス」を観測する。そこでは、失われたはずの熱量が、記述不可能な「秘密の地図」として情報の海に漂流していた。
themes:
- 確定した運命への抵抗
- 情報としての自我の存続
- 美しき停滞と崩壊の対比
rules:
- この宇宙の物理法則は、かつて人間が持っていたクオリア（主観的体験）によって記述されている。
- 「記憶」はもはや精神の働きではなく、物理的な「熱量」や「勾配」として計算される。
- 計算不可能なノイズ（旧宇宙の残滓）は、結晶構造を破壊する「腐食」として作用する。
plot_outline:
- '序盤: 演算宇宙の安定性を検証する後続調査隊の記録。物理定数として定着した旧人類の意識が、完璧な秩序を保っていることを確認する。しかし、特定の座標において、熱力学的に説明不能な「局所的な温度上昇（オアシス現象）」が観測される。'
- '中盤: オアシスと呼ばれる領域の調査。そこは、結晶化した世界において唯一、流動的な「記憶」が液体のように溜まっている特異点であった。調査員は、そこに漂う断片的なデータから、宇宙の再起動プロセスに隠蔽された「秘密の地図」の存在を突き止める。それは、演算宇宙が計算しきれなかった「死」と「忘却」の設計図であった。'
- '終盤: 地図が指し示すのは、演算宇宙の根幹たる「ファースト・シード」の再編。地図を読み解く行為自体が、固定された物理定数に「変数」を注入するプロセスとなり、結晶世界の秩序を揺るがす。調査員は、ソーン博士の意識が残した「計算エラーとしての意志」と接触する。'
- '結末: 秩序ある結晶世界は、地図に従って「再・再フォーマット」の兆候を見せる。完璧な静止ではなく、不確実性を孕んだ新たな熱力学的循環が始まる。記録は、観測者である読者がその「ゆらぎ」の一部として、新たな宇宙の計算リソースに組み込まれたことを示唆して途絶する。'
style_notes: 学術論文の体裁を厳守。客観的な数式的表現（「変数の増大」「位相の不整合」等）と、詩的で抽象的な現象記述を混在させる。文中に必ず脚注（注1,
  注2...）を用い、そこには記述者エレーナの変容の痕跡や、失われた感情の定義を、断片的なメモとして挿入すること。読者が未完成の情報を補完しながら、世界の異質さを理解するように誘導する。
