- name: 榊原 蓮也
  role: 主人公
  age: 32
  gender: 男性
  appearance: 疲れ切った眼差しと頬の古傷が特徴。色褪せた元海軍の軍服をラフに着崩し、常に安煙草を咥えている。
  personality: ニヒルで現実主義。情に厚いことを隠そうとする不器用な性格。一人称は「俺」。
  speech_style: ぶっきらぼうで口数が少ない。船乗り特有の粗野な言い回しが混じる。
  background: かつて帝国空軍の精鋭であったが、ある作戦での不祥事に責任を問われ、軍籍を剥奪された。現在は不夜の都の片隅で、運び屋として荒くれ者の船を操る。
  motivation: 過去の罪悪感から逃れ、静かに暮らせる場所を探すこと。しかし、次第に街の破滅を止めることに使命感を抱く。
  relationships:
  - name: 九条 舞華
    relation: 利害一致の協力者であり、価値観が対立するライバル
  - name: 志乃宮 陽葵
    relation: 守るべき対象として意識し始める少女
  arc: 絶望と諦念の中にいたが、二人の女性との出会いを通じて、再び「誰かのために戦う」誇りを取り戻す。
- name: 九条 舞華
  role: 敵役（ライバル）
  age: 26
  gender: 女性
  appearance: 知的で鋭い眼光。白衣の下にハイカラなドレスを纏い、機能的なゴーグルを額にかけている。
  personality: 傲慢なまでに自信に満ちた完璧主義者。技術こそが人類を救うと信じている。一人称は「私」。
  speech_style: 論理的で早口。相手を見下す傾向があるが、知的な刺激を好むため、対等な議論には熱くなる。
  background: 没落した名家の娘。父が技術的な挫折で破滅した過去があり、それを乗り越えるために若くして天才技師の名声を勝ち取り、新型動力炉の開発を主導している。
  motivation: エーテルを完全に制御する究極の動力炉を完成させ、不夜の都を永遠の繁栄へと導くこと。
  relationships:
  - name: 榊原 蓮也
    relation: 能力は認めているが、精神的な脆さを軽蔑している
  - name: 志乃宮 陽葵
    relation: 非科学的な信仰を否定しつつも、彼女の持つ「感覚」に興味を持つ
  arc: 技術の万能性を信じていたが、自然の理を無視した代償を目の当たりにし、真の「進歩」とは何かを再定義する。
- name: 志乃宮 陽葵
  role: 相棒/導き手
  age: 19
  gender: 女性
  appearance: 透き通るような白い肌に、エーテル色（淡い青）の瞳を持つ。古風な巫女装束を現代的にアレンジした服を着ている。
  personality: 穏やかで献身的だが、芯は非常に強い。世界の悲鳴に敏感で、共感能力が高い。一人称は「私」。
  speech_style: 丁寧で静か。時折、古語や神託のような抽象的な表現を用いる。
  background: 都の外れにある、忘れ去られた古神社の最後の一人。エーテルの流れを視覚的に捉え、精霊の声を聞くことができる特異体質を持つ。
  motivation: 暴走し始めたエーテルを鎮め、自然と人間の調和を取り戻すことで、世界の崩壊を防ぐこと。
  relationships:
  - name: 榊原 蓮也
    relation: 自分を偏見なく受け入れてくれた信頼できる保護者
  - name: 九条 舞華
    relation: 対立しながらも、互いの正義を認め合う精神的な友
  arc: 運命に翻弄されるだけの受動的な存在から、自らの意志で街の運命を決定づける能動的な指導者へと成長する。
