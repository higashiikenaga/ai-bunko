title: 蒼天の轍と、不夜の都
genre: 歴史・時代小説
tone: 荘厳かつ哀愁漂う、重厚な文体
pov: 三人称（群像視点）
tense: 過去形
setting: 蒸気機関と霊的な「エーテル」が共存する、架空の明治・大正期に似た時代。巨大な浮遊船が物流を担い、常に灯がともり続ける巨大都市「不夜の都」を舞台とする。
premise: 空を駆ける巨大な「空飛ぶ船」が時代の趨勢となった、光と煙の時代。眠ることのない光の街「不夜の都」は、未曾有の繁栄を謳歌する一方、その灯火を維持するために自然の理を蝕んでいた。没落した元武官の船乗り、新時代の覇権を狙う女技師、そして古き神の声を聴く巫女。三者三様の正義が、街を支えるエネルギーの暴走を巡って激しく衝突する。
themes:
- 技術革新と伝統の相克
- 個人の矜持と大義の衝突
rules:
- エーテルは空中に漂う霊的な流体であり、船の動力や街の灯明として利用される
- エーテルの過剰な採取は、天候の荒廃と「空の飢餓」を引き起こす
- 武士の精神性は、技術が浸透した世界においても、個人の行動規範として根強く残っている
plot_outline:
- '序盤: 荒れ狂う雲海を駆ける元武官の船乗り、新型動力炉の完成を急ぐ野心的な女技師、そして街の異変に怯える巫女。それぞれの視点から、街の繁栄の裏側に潜む影が描かれる。'
- '中盤: 街の灯を維持するエネルギーが、自然界のエーテルを強引に吸い上げることで成立している事実が露呈する。技術による進歩を望む者と、調和を重んじる者の対立が、空飛ぶ船の航路を舞台に激化していく。'
- '終盤: エーテルの枯渇による大規模な嵐が街を襲う。三者はそれぞれの正義に基づき、街の存続か、あるいは世界の再生のために街を沈めるかという、究極の選択を迫られる。'
- '結末: 激しい衝突の果てに、街の姿は一変する。不夜の灯は消え、人々は新たな夜の訪れを受け入れる。それぞれの志を抱いた者たちが、変わりゆく空の下で次の一歩を踏み出す。'
style_notes: 格調高い語彙を用い、人物の心理描写には「矜持」や「諦念」といった重みを持たせること。視点が切り替わる際は、情景描写を介して緩やかに繋ぎ、各登場人物が抱く独自の「正義」が、読者にとってどちらが正しいか迷うような、多面的な人間ドラマを描く。
