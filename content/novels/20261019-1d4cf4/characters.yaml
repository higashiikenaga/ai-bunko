- name: 如月 澪 (きさらぎ みお)
  role: 主人公
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と、長い黒髪。瞳は常に潤んでおり、どこか虚ろ。物語が進むにつれ、指先から皮膚が宝石のように硬質化していく。
  personality: 献身的で執着心が強く、脆い。一人称は「私」。
  speech_style: 静かで、どこか現実離れした穏やかな口調。
  background: 霧深い洋館で、双子の兄・湊と二人きりで育つ。兄の消失後、彼を取り戻すことだけに生を捧げる。
  motivation: 鏡の中に消えた兄を、現実の世界へ呼び戻すこと。
  relationships:
  - name: 如月 湊
    relation: 双子の兄
  - name: 如月 冴子
    relation: 実母
  arc: 兄への愛ゆえに狂気に陥り、自らを鏡の供物として捧げることで、永遠の氷の彫像へと変貌する。
- name: 如月 湊 (きさらぎ みなと)
  role: 敵役
  age: 17
  gender: 男性
  appearance: 澪と瓜二つの端正な顔立ち。鏡の向こう側では、光を吸い込むような黒い影として描写される。
  personality: 記憶の中では慈愛に満ちた兄だが、実体は空虚な飢餓感を持つ異形。一人称は「僕」。
  speech_style: 記憶の中では優しく、実体は意味をなさない響き。
  background: ある日突然、鏡の中の「結晶の庭」へと引き込まれた。実際には兄ではなく、兄の形を借りた「何か」が戻ってくる。
  motivation: 現実世界への侵食と、肉体を持つことへの渇望。
  relationships:
  - name: 如月 澪
    relation: 双子の妹
  arc: 失われた存在として澪の執着の対象となるが、最終的には澪の肉体を奪い、現実へと歩み出す。
- name: 如月 冴子 (きさらぎ さえこ)
  role: 脇役
  age: 42
  gender: 女性
  appearance: 古い写真の中では、冷徹な美しさを湛えた貴婦人。死者として物語に関わる。
  personality: 運命を呪いながらも、儀式を完遂させようとする冷酷さと諦念を持つ。一人称は「私」。
  speech_style: 遺した手紙の文面は、端正でどこか突き放すような響き。
  background: 双子の片方が『鏡の供物』となる宿命を隠蔽し、儀式を維持しようとした母。
  motivation: 一族に伝わる「入れ替わり」のサイクルを完遂させること。
  relationships:
  - name: 如月 澪
    relation: 実母
  - name: 如月 湊
    relation: 実子
  arc: 彼女の遺した手紙が、澪に真実と破滅の引き金を与える。
- name: 嘉納 (かのう)
  role: 脇役
  age: 68
  gender: 男性
  appearance: 深い皺があり、常に鏡を避けるように視線を落としている老執事。
  personality: 臆病で沈黙を守る、現実主義者。一人称は「私」。
  speech_style: ぶっきらぼうだが、警告を含んだ短い言葉。
  background: 如月家に長く仕え、一族の儀式と狂気を間近で見てきた目撃者。
  motivation: 惨劇を予感しながらも、ただ静かに生き延びること。
  relationships:
  - name: 如月 澪
    relation: 主人の子
  arc: 澪の破滅を止めることはできず、ただ無力な傍観者として絶望を見届ける。
