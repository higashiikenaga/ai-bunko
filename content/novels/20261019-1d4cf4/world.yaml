title: 結晶化する絶望の庭に、君の声を埋めて
genre: ホラー
tone: 耽美で退廃的。静謐な狂気が漂う幻想的な雰囲気
pov: 一人称
tense: 過去形
setting: 冬の終わりの霧に閉ざされた、古びた洋館とそこに併設された温室
premise: 鏡合わせのように瓜二つだった双子の片割れが、ある日突然、巨大な鏡の中へと消え去った。残された私は、彼を取り戻すために鏡の向こう側にある「結晶の庭」へと手を伸ばし続ける。しかし、そこで見つけたのは、母が隠していた一通の失われた手紙と、美しくも残酷な「入れ替わり」の儀式だった。私の皮膚がひとつずつ、冷たい宝石へと変わっていく恐怖に酔いしれる物語。
themes:
- 共依存と執着
- 自己崩壊の美学
rules:
- 鏡の向こう側はすべてが結晶化しており、現実の生きた組織を拒絶する
- 鏡の中の存在を現世に呼び戻すには、同等の価値を持つ『身体の一部』を結晶として捧げなければならない
- 一度結晶化した部位は二度と元に戻らず、感覚が消失し、透き通った宝石へと変化する
plot_outline:
- '序盤: 鏡の中に消えた双子の兄への執着と、彼を呼び戻そうとする絶望的な試行錯誤。家中の鏡が共鳴し始める。'
- '中盤: 屋根裏部屋で、出生の秘密が綴られた母の失われた手紙を発見する。双子の片方は『鏡の供物』として生まれてきた運命であったことを知る。'
- '終盤: 兄を呼び戻すため、自身の指先や心臓の一部を鏡に捧げ、身体を宝石化させていく。鏡の中から現れ始めたのは、兄ではなく、空虚な飢餓感を抱いた『何か』であった。'
- '結末: 完全に結晶化した私が鏡の中に閉じ込められ、私の皮膚を纏った『兄』が、微笑みながら現実の世界へと歩き出す。私は永遠に美しい氷の彫像として、彼の足音を聞き続ける。'
style_notes: 硝子シオンとしての筆致を徹底する。白百合や死にゆく花、砕け散る水晶、冷徹なダイヤモンドなどの比喩を多用し、視覚的な美しさと触覚的な冷たさを強調する。感情の吐露は直接的ではなく、装飾的な形容詞と詩的な独白を用いて、壊れやすい精神状態を繊細に描くこと。
