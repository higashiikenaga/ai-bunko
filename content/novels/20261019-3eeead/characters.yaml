- name: 新次郎
  role: 主人公
  age: 21
  gender: 男性
  appearance: 優しげな目元と整った顔立ち。質素な着物姿だが、清潔感がある。蓮二郎とは瓜二つだが、どこか垢抜けない素朴な雰囲気を持つ。
  personality: 極めて誠実で純粋。嘘をつこうとすると言葉が詰まったり、顔が赤らんだりしてしまう「呪い」に苦しんでいる。一人称は「俺」。
  speech_style: 飾り気がなく、思ったことをそのまま口にする。思ったより言葉がストレートすぎて、時に無礼に聞こえてしまうこともある。
  background: 幼い頃から「真実しか語れない」という奇妙な体質に悩まされ、居場所を求めて各地を放浪していた。浅草の長屋に流れ着く。
  motivation: 嘘をつけない自分を受け入れ、心から安らげる場所を見つけること。
  relationships:
  - name: 蓮二郎
    relation: 双子の兄
  - name: お滝
    relation: 長屋の仲間・友人
  arc: 自分の「正直さ」を欠点ではなく、人を繋ぐための唯一無二の武器であると自覚し、自信を持つようになる。
- name: 蓮二郎
  role: 敵役（ライバル）
  age: 21
  gender: 男性
  appearance: 新次郎と全く同じ顔。しかし、手入れの行き届いた髪型、豪華な絹の着物、自信に満ちた不敵な笑みを浮かべている。
  personality: 極めて計算高く、人を操る術に長けている。外面は華やかで社交的だが、内面は孤独を恐れている。一人称は「俺」。
  speech_style: 巧みな話術と、相手の懐に入るような甘い言葉遣い。聞き手を心地よくさせながら、巧みに情報を引き出す。
  background: 新次郎とは対照的に、嘘と機転だけで生き抜いてきた男。莫大な富と地位を手に入れ、自分を証明しようとしている。
  motivation: 嘘によって作り上げた偽りの地位を確立し、誰にも舐められない存在になること。
  relationships:
  - name: 新次郎
    relation: 双子の弟
  arc: 詐欺計画の失敗を通じて、嘘で塗り固めた虚飾よりも、弟との血の繋がりや長屋の温かさの方が価値があることに気づく。
- name: お滝
  role: 脇役（ヒロイン的役割）
  age: 18
  gender: 女性
  appearance: 活発な印象を与える、引き締まった体つき。動きやすい着物に割烹着を合わせている。瞳が大きく、観察力が鋭い。
  personality: 気が強く、面倒見が良い。長屋の住人たちの様子を常に把握している、長屋のまとめ役。一人称は「あたし」。
  speech_style: 威勢の良い江戸っ子口調。困っている人には優しく、不届き者には容赦なく啖呵を切る。
  background: 長屋の入り口で小さな煮売屋を営む、長年この場所で暮らす娘。
  motivation: 長屋の平穏を守り、住人たちが笑顔で過ごせるようにすること。
  relationships:
  - name: 新次郎
    relation: 世話役・友人
  - name: 蓮二郎
    relation: 疑念を抱く対象
  arc: 最初は新次郎を「お人好しすぎる」と呆れているが、彼の真実味に触れるうちに、彼を全力で守ろうとするようになる。
- name: 源蔵
  role: 脇役（メンター）
  age: 55
  gender: 男性
  appearance: 深く刻まれた皺と、日焼けした肌。常にキセルを燻らせている。使い古された羽織を纏っている。
  personality: 飄々としていて掴みどころがないが、非常に洞察力が鋭い。長屋の酸いも甘いも噛み分けた隠居のような存在。一人称は「ワシ」。
  speech_style: ゆったりとした、落ち着いた話し方。言葉の端々に人生の機微を感じさせる含みを持たせる。
  background: かつては腕利きの職人だったが、現在は長屋で静かに暮らしている。
  motivation: 騒がしい若者たちを見守り、彼らが失敗から学ぶ過程を静かに観察すること。
  relationships:
  - name: 新次郎
    relation: 助言者
  arc: 双子の対立が激化する中で、新次郎の「真実」が事態を打開するきっかけとなるよう、背後からさりげなく導く。
