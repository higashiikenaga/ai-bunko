title: 江戸長屋・正直双子騒動記
genre: 歴史・時代小説
tone: 軽快で人情味あふれる江戸の市井風景
pov: 三人称
tense: 過去形
setting: 江戸時代後期、浅草の賑やかな長屋
premise: 嘘をつけないという奇妙な呪いを背負った青年・新次郎が、浅草の長屋に転がり込む。そこに現れたのは、彼と瓜二つの顔を持ちながら、嘘を自在に操る双子の兄・蓮二郎であった。正反対な双子が巻き起こす騒動を、江戸っ子たちの温かい人情が包み込んでいく。
themes:
- 血縁と絆
- 誠実さと処世術
rules:
- 新次郎は、意識的に嘘をつこうとすると激しいくしゃみが止まらなくなり、結果的に真実を口走ってしまう呪いにかかっている
- 双子の二人は幼少期に生き別れ、互いの存在を物語でしか知らなかった
plot_outline:
- '序盤: 栗ごはんの香る秋の盛り、嘘をつけない呪いを持つ新次郎が長屋にやってくる。正直すぎる性格に周囲は呆れつつも、その純粋さに惹かれ、長屋の住人たちと打ち解けていく。'
- '中盤: 豪華な着物をまとった自称・大商人の蓮二郎が登場。新次郎の双子の兄である彼は、巧みな嘘で長屋の人々を懐柔し、ある大きな企みを巡って新次郎と対立する。'
- '終盤: 冬の訪れとともに、蓮二郎が仕組んだ詐欺計画が露呈し、長屋が窮地に陥る。絶体絶命の状況で、新次郎の「嘘をつけない」という呪いが、皮肉にも唯一の真実を証明する鍵となり、事態を解決へと導く。'
- '結末: 正月に家族のように集まり、温かい雑煮を囲む長屋の住人たち。互いの欠点を受け入れた双子は、不器用ながらも共に生きる道を選び、江戸の空に笑い声が響き渡る。'
style_notes: 「てやんでえ」「べらんめえ」といった江戸っ子の威勢の良い口調を多用し、テンポ速い会話劇を展開させる。栗ごはんや雑煮などの季節の味を丁寧に描写し、最後は涙と笑いが混じり合う人情話として締めくくる。
