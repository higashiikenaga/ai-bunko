- name: 佐藤 陽葵
  role: 主人公
  age: 28
  gender: 女性
  appearance: '黒髪のセミロング。都会的な洗練された雰囲気はあるが、どこか疲弊した様子。 '
  personality: 真面目で責任感が強く、完璧主義。繊細で傷つきやすい一面を持つ。一人称は「私」。
  speech_style: 基本は丁寧な話し方。心が落ち着かない時は言葉が詰まりがち。
  background: 都内の広告代理店で働いていたが、仕事のプレッシャーと人間関係で燃え尽き、逃げるように祖父の家へ戻ってきた。
  motivation: 自分自身の価値を再発見し、これからの人生の歩み方を見つけること。
  relationships:
  - name: 佐藤 健造
    relation: 祖父
  - name: 佐藤 芳江
    relation: 祖母
  arc: 完璧を求める自分を許し、不完全なままでも生きていけるという強さを手に入れる。
- name: 佐藤 健造
  role: 主要人物
  age: 75
  gender: 男性
  appearance: 背筋が少し曲がり、無精髭を生やした頑固そうな老人。手は節くれ立って力強い。
  personality: 口数は少なく無口で不器用。頑固だが、孫思いの優しい心を持つ。一人称は「俺」。
  speech_style: ぶっきらぼうで短い言葉。感情を表に出すのが苦手。
  background: 元剣術家。妻の死後、一人で静かに暮らしている。蔵には折れた剣が大切に保管されている。
  motivation: 孫に自分の過去（後悔）を伝え、家族としての絆を繋ぎ止めること。
  relationships:
  - name: 佐藤 陽葵
    relation: 孫
  - name: 佐藤 芳江
    relation: 亡き妻
  arc: 過去の悔恨を言葉にし、孫との間に新しい信頼関係を築く。
- name: 佐藤 芳江
  role: 脇役（回想・精神的支柱）
  age: 68
  gender: 女性
  appearance: 柔和な笑顔が印象的な、温かみのある女性。エプロン姿が似合う。（回想シーン）
  personality: 包容力があり、家族を食で支える明るく芯の強い女性。一人称は「私」。
  speech_style: 穏やかで、相手を包み込むような優しい話し方。
  background: 健造の妻。亡くなった後も、料理のレシピを通じて家族の絆を支え続けている。
  motivation: 家族が食を通じて繋がり、互いを思い合えること。
  relationships:
  - name: 佐藤 健造
    relation: 夫
  - name: 佐藤 陽葵
    relation: 孫
  arc: レシピという形を通じて、陽葵と健造の心の溝を埋める役割を果たす。
- name: 高橋 結衣
  role: 脇役
  age: 30
  gender: 女性
  appearance: ショートカットの髪に、活動的で明るい印象を与える服装。
  personality: 明るく世話焼きで、町の人々に愛されるムードメーカー。一人称は「私」。
  speech_style: フレンドリーでリズムの良い、親しみやすい話し方。
  background: 町にある商店街の店主。帰郷した陽葵の様子を気にかけている。
  motivation: 陽葵がこの町に居場所を見つけ、笑顔を取り戻せるよう手助けすること。
  relationships:
  - name: 佐藤 陽葵
    relation: 友人
  arc: 陽葵が外の世界ではなく、この町での新しい生活に踏み出すきっかけを作る。
