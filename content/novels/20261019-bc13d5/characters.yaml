- name: 凪野 レン
  role: 主人公
  age: 16
  gender: 男性
  appearance: 鋭い眼差しと、鍛えられた細身の体躯。黒髪の短髪で、常にどこか落ち着かない様子でボールを弄んでいる。
  personality: 極めて実直で、嘘をつこうとすると声が震えてしまう「正直すぎる」性質。一人称は「僕」。
  speech_style: 飾り気がなく、核心を突くストレートな言い回し。嘘をつこうとすると言葉が詰まる。
  background: 幼少期から嘘をつけない性質のせいで、チームプレーにおいて戦術的なブラフが使えず、周囲から「使いにくい」と疎まれ孤立してきた。
  motivation: 自分の「正直さ」が、嘘が支配するこの街のコートで通用することを証明したい。
  relationships:
  - name: 葛城 カイ
    relation: 最も信頼する相棒
  - name: ゼノ
    relation: 超えるべき絶対的な壁
  arc: 呪いだと思っていた「嘘をつけない性質」を、相手の裏をかくのではなく、相手の心の奥底を揺さぶる「最強の武器」へと昇華させる。
- name: 葛城 カイ
  role: 相棒
  age: 17
  gender: 男性
  appearance: 銀髪に近いアッシュカラーの長髪をラフに結んでいる。派手なアクセサリーを身につけた、スタイル抜群の長身選手。
  personality: 皮肉屋で冷笑的だが、内面にはかつての情熱を隠し持っている。一人称は「俺」。
  speech_style: 投げやりで退屈そうな、低く響くトーン。相手を突き放すような言い方。
  background: かつては全国レベルのエリート選手だったが、周囲の大人や仲間たちの政治的な嘘と駆け引きに絶望し、バスケを捨ててネオン・ジロの底辺に身を落とした。
  motivation: もう二度と、誰の言葉も信じたくない。しかし、レンのプレーだけは信じざるを得ない。
  relationships:
  - name: 凪野 レン
    relation: 理解不能だが目が離せないチームメイト
  arc: レンの純粋なプレーに触れることで、嘘に塗り固められていた自身のプライドを捨て、再び本気で勝利を渇望するようになる。
- name: ゼノ
  role: 敵役
  age: 18
  gender: 男性
  appearance: 完璧な造形の美形。常に余裕を感じさせる薄笑いを浮かべ、高級感のあるストリートウェアを纏っている。
  personality: 極めて計算高く、冷酷な支配者。相手の心理的弱点を突くことに悦びを感じる。一人称は「僕」。
  speech_style: 丁寧で慇懃無礼。相手を褒めながら、言葉の端々で精神的に追い詰めるような話し方。
  background: ネオン・ジロの頂点に君臨する王者。心理戦とブラフを駆使し、相手が自滅するまで追い詰めるスタイルで無敗を誇る。
  motivation: ネオン・ジロの全てを、自分のコントロール下に置くこと。
  relationships:
  - name: 凪野 レン
    relation: 自分の理屈が通用しない不快な存在
  arc: レンの「嘘のないプレー」によって、自分が築き上げてきた完璧な心理戦の城が崩れ去る恐怖を味わう。
- name: 詩織 マヤ
  role: 脇役/チームメイト
  age: 17
  gender: 女性
  appearance: 小柄だが筋肉質な体つき。ポニーテールにまとめ、常に動きやすいスポーツウェアを着用している。
  personality: 観察眼が鋭く、冷静沈着。チームのバランスを取る調整役。一人称は「私」。
  speech_style: はきはきとした快活な口調。事実に基づいた的確な指示を出す。
  background: 元エリートのガード。周囲の嘘を見抜きすぎてチームを離れたが、レンの「嘘をつけない」という特性に可能性を見出し、チームに合流する。
  motivation: 嘘に満ちた街で、自分たちが納得できる「本物のプレー」を見届けること。
  relationships:
  - name: 凪野 レン
    relation: 守るべき純粋な核
  - name: 葛城 カイ
    relation: 腐れ縁のチームメイト
  arc: 周囲を疑うことしかできなかった自分から、レンという指標を得ることで、再びチームという組織を信じられるようになる。
