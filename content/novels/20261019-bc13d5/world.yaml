title: 咆哮のストリート：不眠街の真実弾
genre: スポーツ青春
tone: 熱血・疾走感・実況風
pov: 三人称
tense: 基本過去形（試合描写のみ現在形）
setting: 24時間ネオンが消えない不夜城「ネオン・ジロ」の路地裏バスケットコート
premise: 嘘をつけない呪いを背負った少年・レンは、心理戦とブラフが支配するストリートバスケの世界で、その不器用さゆえに孤立していた。しかし、彼の「剥き出しの真実」が、嘘に疲れ果てた挫折した天才たちの心を突き動かす。不眠の街の頂点を目指し、嘘なき情熱がコートを焼き尽くす。
themes:
- 正直さという最強の武器
- 剥き出しの信頼関係
rules:
- 試合は深夜の路上で行われ、観客の熱狂がコートの照明を灯すルールである
- 心理的な揺さぶり（トラッシュトーク）が重要な戦略とされるが、主人公レンは嘘をつこうとすると激しい喉の痛みに襲われ、言葉が出なくなる
plot_outline:
- '序盤: 嘘をつけないためチームメイトに不信感を持たれ、追放されたレンが、不眠街の最底辺コートで孤独にボールを打ち続ける。'
- '中盤: 嘘で塗り固めた成功に絶望した元エリート選手たちと出会い、互いの弱さと本音をさらけ出すことで、誰よりも強固な信頼で結ばれたチームを結成する。'
- '終盤: 相手を精神的に追い詰める策略に長けた絶対王者チームとの決勝戦。レンは弱点を突き、精神的に追い詰められるが、純粋な情熱と圧倒的な身体能力による「真実のプレー」で局面を打開する。'
- '結末: 劇的な逆転勝利を収め、敗北した王者が自らの嘘に気づき、レンの正直さに心から敗北を認める。レンは呪いだと思っていた性質が、最高の武器であったと確信する。'
style_notes: 汗の飛沫、激しい息づかい、シューズがコートを噛む摩擦音を執拗に描写する。試合シーンでは「今、跳んだ！」「突き刺す！」といった実況的な現在形を用い、読者がコートサイドにいるかのような臨場感を演出すること。また、敗者が膝をつき、己の限界を悟る瞬間の視点を深く掘り下げ、勝利の輝きを際立たせる。
