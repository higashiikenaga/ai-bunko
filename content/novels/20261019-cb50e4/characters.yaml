- name: エライアス・ノエル
  role: 主人公
  age: 19
  gender: 男性
  appearance: 少し癖のある茶髪に、真鍮の眼鏡をかけている。常に司書用の使い古された革のエプロンを着用。どこか落ち着いた、穏やかな佇まい。
  personality: 真面目で几帳面。少し内向的だが、本や記憶に対しては深い慈しみを持つ。一人称は「僕」。
  speech_style: 丁寧で落ち着いた話し方。相手を尊重する穏やかな口調。
  background: 亡き師匠から地下書庫の管理を任された見習い司書。蒸気機関のメンテナンスと、届いた記憶の本の整理・分類を日々の任務としている。
  motivation: 書庫に届く「忘れられた記憶」を大切に守り、いつか誰かの心に寄り添うこと。
  relationships:
  - name: ライラ
    relation: 夜の読書会を共にする、不思議な客人であり相棒
  - name: サイラス
    relation: かつての師匠であり、尊敬する先代司書
  arc: 作業としての「本の整理」に追われる日々から、記憶が持つ「光」の価値を理解し、自らの手で物語を街へと届ける意志を持つ司書へと成長する。
- name: ライラ
  role: 相棒
  age: 15
  gender: 女性
  appearance: 夜空を溶かし込んだような深い紺色の瞳。銀色の長い髪が星屑のように輝いている。天体観測用の大きな外套を羽織っている。
  personality: 浮世離れしており、どこか神秘的な雰囲気を持つ。好奇心が強く、時折子供のような無邪気さを見せる。一人称は「私」。
  speech_style: 詩的で、少しゆっくりとした独特のリズムを持つ話し方。
  background: 星の記憶を司る存在、あるいは星の導きによって書庫を訪れる謎の少女。天文学に極めて精通している。
  motivation: 忘れ去られた星の記憶を、再び人々の心へと繋ぎ直すこと。
  relationships:
  - name: エライアス
    relation: 共に星の記憶を紐解く、大切な理解者
  arc: エライアスと共に記憶の重みを知ることで、自らの使命を完遂し、彼に「夜を愛する心」を託して静かに旅立つ。
- name: バスティアン・ヴォルフ
  role: 敵役（対立軸）
  age: 52
  gender: 男性
  appearance: 隙のない仕立てのスーツを着こなし、常に最新式の真鍮製懐中時計を確認している。鋭い眼光を持つ、威厳のある容貌。
  personality: 徹底した合理主義者。効率と生産性を何よりも重視し、無駄を嫌う。一人称は「私」。
  speech_style: 断定的で、論理的かつ冷徹な口調。
  background: 港町の発展を推進する市長。街の蒸気機関の稼働率を最大化するため、夜間の照明と稼働を制限する政策を進めている。
  motivation: 街の経済発展と、蒸気機関による徹底的な効率化の実現。
  relationships:
  - name: エライアス
    relation: 効率を乱す、非合理的な存在として見なしている
  arc: 効率の追求が街から「夜の情緒」を奪い、結果として蒸気機関の不具合を招くことを目の当たりにし、失われたものの価値を再認識する。
- name: サイラス
  role: 脇役
  age: 72
  gender: 男性
  appearance: 白髪の豊かな髭を蓄え、常に温かい微笑みを浮かべている。使い込まれた時計修理の道具を身につけている。
  personality: 包容力があり、街の歴史に詳しい。物事の道理に明るい。一人称は「わし」。
  speech_style: ゆっくりとした、包み込むような、年長者らしい温かい話し方。
  background: エライアスの師匠であり、元地下書庫の司書。現在は街の片隅で小さな時計修理屋を営んでいる。
  motivation: 街の人々が、便利さと引き換えに大切な記憶や情緒を忘れないように見守ること。
  relationships:
  - name: エライアス
    relation: 教え子であり、次世代の司書として期待している存在
  arc: 街の変化に戸惑いながらも、エライアスとライラの活動を通じて、次世代が記憶の灯を繋いでいく姿を確信し、安堵を得る。
