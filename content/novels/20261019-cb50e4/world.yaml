title: 星屑の地下書庫と、真鍮の呼吸
genre: 日常ほのぼの
tone: 静謐で幻想的。星空のような心地よい孤独と温もりに満ちた雰囲気
pov: 三人称
tense: 過去形
setting: 蒸気機関が文明を支える静かな港町。その地下に広がる、世界中の「忘れられた記憶」を本として収蔵する地下書庫
premise: 巨大な真鍮の蒸気機関が心地よい鼓動を刻む地下書庫には、人々が人生で置き忘れてきたささやかな記憶が本となって届く。見習い司書の青年は、夜な夜な訪れる天文学に詳しい不思議な客人と共に、古びた頁の中に眠る星の記憶を紐解いていく。それは、日常の喧騒を離れ、心に溜まった澱を星の光で浄化するような、静かな夜の物語である。
themes:
- 記憶の肯定
- 静かな時間の共有
rules:
- 地下書庫の本は、誰かが完全に忘れた記憶が自動的に書き込まれることで生成される
- 書庫内の照明は地上の星の輝きに連動して明滅し、新星が現れると書庫に新しい棚が増える
- 蒸気機関のメンテナンスを怠ると、本の内容が混ざり合い、記憶が混濁して読み取れなくなる
plot_outline:
- '序盤: 見習い司書の青年が、蒸気機関の管理と本の整理に追われる日々の中で、星の知識に長けた不思議な少女と出会い、夜の読書会を始める。'
- '中盤: 少女と共に、誰にも読まれていない「忘れられた記憶」の本を読み解き、かつての持ち主たちが抱いていた星への純粋な憧れや、切ない恋心を追体験する。'
- '終盤: 街の人々が効率を重視し夜空を見上げなくなったことで、蒸気機関に不具合が生じ、書庫の光が消えかかる。青年と少女は、失われた「夜を愛する心」を取り戻すため、街に星の記憶を還元する試みを始める。'
- '結末: 街の人々が再び夜空を見上げ、地下書庫に眩い光が戻る。少女はある使命を終えて静かに去るが、青年は星を綴る司書として、訪れる人々を温かく迎え続ける。'
style_notes: 静寂な夜の空気感を重視し、会話文は控えめで余韻のあるものにする。比喩には「シリウスの鋭い光」や「冬のダイヤモンド」など、具体的な天体名や星座を用い、読者の心に星図を描くように描写する。毎話、物語の展開に合わせた星座や天体現象を一つ登場させ、心情描写とリンクさせる。
