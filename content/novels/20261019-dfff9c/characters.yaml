- name: 佐伯 拓海
  role: 主人公
  age: 25
  gender: 男性
  appearance: 都会的な雰囲気を持つ、少し痩せた青年。眼鏡をかけており、知的な印象を与えるが、どこか神経質な佇まい。
  personality: 合理的で懐疑的な性格。未知の事象に対して恐怖を感じつつも、真実を解明しようとする強い好奇心を持つ。一人称は「僕」。
  speech_style: 標準語。冷静に状況を分析しようとする論理的な話し方だが、極限状態では呼吸が乱れ、言葉が詰まる。
  background: 都会で編集者として働いていたが、唯一の肉親であった祖父の急死をきっかけに、数十年ぶりに贄村へ帰郷する。
  motivation: 祖父の死の真相を突き止め、村に漂う不気味な違和感の正体を明らかにすること。
  relationships:
  - name: 佐伯 宗次郎
    relation: 村の掟を強いる対立者
  - name: 小夜
    relation: 幼馴染であり、村の秘密を共有する協力者
  arc: 村の隠された歴史を暴こうとする探求者から、最終的には自我を奪われ、村の記憶を刻むだけの無機質な「器」へと変貌する。
- name: 佐伯 宗次郎
  role: 敵役
  age: 68
  gender: 男性
  appearance: 常に黒い着物を纏い、深い皺の刻まれた顔に、全てを見透かすような鋭い眼光を持つ老人。
  personality: 冷徹で伝統至上主義。村の平穏のためには個人の犠牲を厭わない、狂信的なまでの使命感を持つ。一人称は「私」。
  speech_style: 重々しく、古風な言い回しを用いる。静かだが、有無を言わせぬ威圧感のある話し方。
  background: 贄村の祭祀を司る一族の長であり、数十年ごとの「語り部」の選出と儀式の執行を管理している。
  motivation: 村の掟を完遂し、死者の記憶を封じ込めることで、贄村の永劫の平穏を維持すること。
  relationships:
  - name: 佐伯 拓海
    relation: 次代の語り部として選定した獲物
  arc: 拓海の抵抗を冷酷に退け、予定通りに儀式を完遂させることで、村の秩序を維持する役割を全うする。
- name: 小夜
  role: 脇役
  age: 24
  gender: 女性
  appearance: 村の伝統的な装いに身を包んだ、どこか儚げで影のある女性。瞳には常に怯えの色が宿っている。
  personality: 臆病で内向的だが、根は優しく、拓海に対しては密かな情愛と危惧を抱いている。一人称は「私」。
  speech_style: ささやくような、消え入りそうな話し方。言葉を選びながら、慎重に話すクセがある。
  background: 村の祭祀に携わる家系の娘として育ち、幼い頃から地下図書館の存在や儀式の恐ろしさを教え込まれてきた。
  motivation: 拓海に村の真実を伝え、彼をこの呪われた村から逃がそうとすること。
  relationships:
  - name: 佐伯 拓海
    relation: 救いたいと願う幼馴染
  - name: 佐伯 宗次郎
    relation: 恐怖の対象である村の権力者
  arc: 拓海を助けるために禁忌を犯して協力するが、村の抗えない呪いの前に無力であることを悟り、絶望的な結末を見届けることになる。
