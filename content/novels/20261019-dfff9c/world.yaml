title: 隠れ里の刻印 ―泥濘に沈む声―
genre: ホラー
tone: 湿り気を帯びた静謐な恐怖、土着信仰の不気味さ
pov: 三人称
tense: 過去形
setting: 現代、東北の山間部にある閉鎖的な集落「贄（にえ）村」
premise: 山あいに位置する贄村では、数十年ごとに『語り部』を失うという奇妙な風習がある。都会から帰郷した青年・拓海は、村の地下に広がる巨大な書庫、通称「地下図書館」に、死者の記憶が書かれた禁書の山があることを知る。村の祭りの中、ラジオから流れるノイズ混じりの放送が、夜明けを拒む呪いであることを悟った時、彼は村の真の掟に直面する。
themes:
- 血縁の呪縛
- 忘却と継承
rules:
- 村の地下図書館に収められた本を開いてはならない。開いた者の記憶は紙に吸い込まれる。
- 夜明けのラジオ放送が途切れた時、村の境界線（結界）が消失する。
- 祭りの期間中、特定の禁忌を破った者は「語り部」の身代わりにされる。
plot_outline:
- '序盤: 祖父の死をきっかけに贄村へ戻った拓海は、村人たちのよそよそしい態度と、夜な夜な響く不気味な祭囃子に違和感を抱く。村の古い祠の地下に、膨大な古文書が眠る「地下図書館」の存在を偶然発見する。'
- '中盤: 地下図書館で、死んだはずの親族の名前が記された書物を見つけた拓海は、村が「記憶を本に封じ込めることで平穏を保っている」ことを知る。村の祭りが近づく中、夜明けのラジオから流れる声が、次第に死者の叫びに変わっていく。'
- '終盤: 祭りの夜、拓海は自分が「次の語り部」として選ばれ、記憶を奪われる儀式の対象であることを悟る。村人たちの狂気に満ちた眼差しと、逃げ場のない山中の静寂が彼を追い詰める。'
- '結末: 儀式は完了し、拓海は新たな書物の執筆者となる。朝日が昇る中、ラジオからは穏やかな音楽が流れるが、拓海の瞳からは一切の感情が消え、彼はただ村の歴史を書き留めるだけの器と化した。'
style_notes: 湿った土の匂い、腐敗した植物、暗い水の音を想起させる。方言を用いた会話により、外部の人間（拓海）と閉鎖的な村人の断絶を強調する。情緒的でありながら、決して救いを与えない、静かに喉を絞められるような筆致。
