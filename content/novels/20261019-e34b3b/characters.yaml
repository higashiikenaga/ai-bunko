- name: カイル・ヴァン・アストレイ
  role: 主人公
  age: 19
  gender: 男性
  appearance: 黒髪で鋭い眼光を持つ青年。使い古された革の防具を纏い、手には持ち手だけが残った折れた魂鋼の剣を握っている。
  personality: 冷静沈着だが、内側には復讐の炎を燃やす熱い魂を持つ。一人称は「俺」。
  speech_style: 短く、無駄を削ぎ落としたぶっきらぼうな口調。
  background: 帝国の襲撃により故郷の村を失い、家族も仲間も全て消し去られた生き残り。唯一残った折れた剣に、村の記憶を宿して戦う。
  motivation: 村を滅ぼした帝国の真相を突き止め、奪われた全てを取り戻すこと。
  relationships:
  - name: リナ
    relation: 守るべき唯一の生存者であり、旅の相棒
  - name: ゼノス
    relation: かつての親友であり、現在は最大の敵
  arc: 復讐のみを糧にする孤独な戦士から、大切な人の笑顔を守るために戦う真の英雄へと成長する。
- name: リナ・エル・メイ
  role: 相棒
  age: 14
  gender: 女性
  appearance: 透き通るような銀髪と、どこか虚無感を湛えた大きな瞳を持つ少女。村の伝統的な装飾品を身につけている。
  personality: 物静かで忍耐強いが、芯が強く、困難に直面しても決して折れない精神力を持つ。一人称は「私」。
  speech_style: 丁寧だが、感情の起伏が少ない淡々とした話し方。
  background: カイルの故郷の村の生き残り。帝国の禁忌研究において、記憶を安定させるための重要な「鍵」としての価値を秘めている。
  motivation: カイルと共に生き延びること、そして自分自身の失われた記憶を探し出すこと。
  relationships:
  - name: カイル
    relation: 命の恩人であり、家族以上の絆で結ばれた存在
  arc: 運命に翻弄されるだけの被害者から、自らの意志で明日を選択する主体的な女性へと変化する。
- name: ゼノス・ヴォルガード
  role: 敵役
  age: 20
  gender: 男性
  appearance: 帝国の漆黒の重装甲を纏った、威圧的な容姿の騎士。冷徹な美貌を持つ。
  personality: 徹底した合理主義者であり、帝国の秩序こそが世界の救済だと信じている。一人称は「私」。
  speech_style: 高圧的で、相手を見下すような冷酷な口調。
  background: カイルの幼馴染。帝国の圧倒的な力と「秩序」に魅了され、自ら進んで帝国の処刑人となった。
  motivation: 帝国のシステムを完璧なものにし、荒野から混乱を根絶すること。
  relationships:
  - name: カイル
    relation: かつての親友であり、自身の理想を否定する存在
  arc: 秩序の体現者として君臨するが、最終的に自らが守ろうとしたシステムの犠牲者としてカイルと対峙する。
- name: ガルカス
  role: 脇役
  age: 38
  gender: 男性
  appearance: 顔に深い傷跡があり、片目を失った大柄な男。巨大な戦斧を背負っている。
  personality: 豪快で酒好き、仲間想いだが、記憶を失うことに対して異常なまでの恐怖心を抱いている。一人称は「俺」。
  speech_style: 荒っぽいが、どこか哀愁を感じさせるべらんめえ調。
  background: 記憶を燃料にする戦いに身を投じ、多くの記憶を失いかけている歴戦の傭兵。
  motivation: 自分自身が「自分」でなくなる前に、戦いの中で意味を見出すこと。
  relationships:
  - name: カイル
    relation: 共に戦う仲間であり、若き日の自分を重ねる対象
  arc: 過去から逃げ続けるだけの傭兵から、次世代へ希望を託すために命を懸ける戦士へと変わる。
