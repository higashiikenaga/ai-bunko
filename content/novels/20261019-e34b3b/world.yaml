title: 鋼の挽回
genre: 異世界ファンタジー
tone: 硬派、無骨、ストイック
pov: 一人称（俺）
tense: 過去形
setting: 記憶を燃料に武器を強化する『魂鋼』の文明が支配する荒野の世界
premise: ある日、俺の故郷の村は地図から消えた。手元に残ったのは、主を失い折れた一本の剣だけだ。記憶を切り売りして戦うこの世界で、俺は村の生き残りである少女と共に、世界を塗り潰そうとする帝国へと牙を剥く。折れた剣を握りしめ、俺は奪われた全てを取り戻しに行く。
themes:
- 喪失と再生
- 不器用な絆
rules:
- 武器『魂鋼』は、使用者の大切な記憶を消費することで破壊不能な強度と斬撃力を得る
- 記憶を使い果たした人間は『空殻』となり、自我を失った怪物へと変貌する
- 折れた剣は、記憶を捧げても修復できず、代わりに『不可視の刃』を形成する
plot_outline:
- '序盤: 廃墟となった村で目覚めた俺が、唯一の生存者である少女を救い出し、追っ手の空殻たちを折れた剣で屠る。'
- '中盤: 旅の途中で記憶を失いかけた傭兵たちと出会い、信頼し合う。彼らと共に帝国の魂鋼集積所を襲撃し、村が消された理由が帝国の禁忌研究にあることを知る。'
- '終盤: 帝国の心臓部へ乗り込み、かつての親友であり現在は帝国の処刑人となった男と対峙する。最高の記憶を代償に、折れた剣に究極の不可視の刃を宿す。'
- '結末: 親友を斬り、帝国のシステムを破壊する。記憶の多くを失ったが、隣にいる少女の笑顔だけは忘れず、再び荒野へと歩き出す。'
style_notes: 短文で構成し、リズム感を重視。擬音（ドォン、ガキィ等）を一切排除し、『砕いた』『断った』『抉った』などの動詞で衝撃を表現する。戦闘開始直前には、風の音や煙草の煙、静寂な視線などの静的な描写を必ず挿入し、動と静の対比を際立たせる。
