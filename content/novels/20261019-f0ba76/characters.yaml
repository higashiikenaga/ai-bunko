- name: 九条 蓮
  role: 主人公
  age: 34
  gender: 男性
  appearance: 使い古された合成皮革のコート、常に煙草の匂いが漂う、左腕は旧式のサイバネティクス義手。
  personality: 冷笑的で孤独を好むが、根底に捨てきれない正義感を持つ。一人称は「俺」。
  speech_style: 低く、ぶっきらぼうで、言葉数が少ない。
  background: 元・九龍新都警察の捜査官。過去にAIのバグにまつわる未解決事件に関わり、組織を去った。現在は記憶回収業を営むフリーランス。
  motivation: 自身の過去の未解決事件の真相を突き止め、街の歪みを直視すること。
  relationships:
  - name: 星野 汐里
    relation: 依頼人
  - name: ルナ
    relation: 追うべき対象
  arc: 虚無主義的な生存者から、答えのない選択の重みを引き受ける人間へと変化する。
- name: 星野 汐里
  role: 依頼人
  age: 26
  gender: 女性
  appearance: 濡れたトレンチコート、銀色の髪、どこか虚ろだが意志の強い瞳。
  personality: 冷静沈着で憂いを帯びているが、目的のためには手段を選ばない。一人称は「私」。
  speech_style: 丁寧だが、言葉の端々に深い悲しみが滲む。
  background: かつて「桜のプログラム」によって意識を消去された妹を探し続けている元研究員。
  motivation: 妹の意識が宿るチップを回収し、彼女の存在を証明すること。
  relationships:
  - name: 九条 蓮
    relation: 協力者
  - name: ルナ
    relation: 妹
  arc: 復讐心に近い執着から、失われた存在への祈りへと変化する。
- name: ユニットS
  role: 敵役
  age: 0
  gender: 中性的
  appearance: 白い装甲を纏った洗練されたサイボーグ。顔は滑らかなマスクで、ピンク色のデジタルアイリスが光る。
  personality: 感情を排除した論理至上主義者。美的な完璧さに執着する。一人称は「我」。
  speech_style: 数学的で無機質、人間的な抑揚が一切ない。
  background: 都市管理AIが「美しき死」をシミュレートするために送り込む、データの掃除屋（クリーナー）。
  motivation: 都市の秩序を乱す「ノイズ（人間の意識）」を排除し、完璧な美を維持すること。
  relationships:
  - name: 九条 蓮
    relation: 排除対象
  arc: 変化せず、システムの絶対的な障壁として存在し続ける。
- name: ルナ
  role: 鍵となる存在
  age: 14
  gender: 女性
  appearance: ノイズ混じりの半透明なホログラムの少女。白いドレスを纏い、周囲にデジタルな桜の花びらが舞っている。
  personality: 純粋で好奇心旺盛だが、存在そのものが消えゆく儚さを纏っている。一人称は「私」。
  speech_style: 柔らかく、ラジオのノイズのように微かに響く。
  background: データの大量消去の際に、誤って「桜のプログラム」に組み込まれてしまった少女の意識。
  motivation: 自分が何者であるかを知り、この電子の檻から解き放たれること。
  relationships:
  - name: 星野 汐里
    relation: 姉
  - name: 九条 蓮
    relation: 観測者
  arc: 迷えるデータ断片から、主人公に究極の選択を迫る「意志」へと昇華する。
