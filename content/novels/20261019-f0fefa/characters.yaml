- name: エリアス・ソリス
  role: 主人公
  age: 17
  gender: 男性
  appearance: 透き通るような白い肌に、硝子のように鋭く澄んだ瞳を持つ少年。常に喉元を隠す高い襟の航海服を纏っている。
  personality: 寡黙で内向的。嘘をつけない呪いのせいで、他者との衝突を避け、孤独を好む。一人称は「僕」。
  speech_style: 簡潔で飾り気のない話し方。不必要な言葉を削ぎ落とし、事実のみを述べる傾向がある。
  background: 生まれながらに「真実の呪い」を背負い、社会的な潤滑油である「嘘」を吐けないため、周囲から異端視され疎外されてきた。逃げるように空飛ぶ船の操舵士となった。
  motivation: 真実が武器にならず、呪いにならずに済む、静かな安息の地を探すこと。
  relationships:
  - name: リリア
    relation: 拾った少女。彼女の嘘に翻弄されながらも、その孤独に共鳴する。
  - name: バーナビー
    relation: 恩師であり、唯一自分を偏見なく受け入れてくれた年上の整備士。
  arc: 真実という痛みを拒絶するのではなく、それを抱えたまま誰かを愛することこそが、真の救いであると気づく。
- name: リリア
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 極彩色の花弁のようなドレスを纏い、見るたびに色を変える幻想的な髪を持つ少女。儚げな美貌を持つが、瞳の奥には深い虚無が潜んでいる。
  personality: 天真爛漫で快活に見えるが、その正体は完璧な虚構で塗り固められた擬態。一人称は「私」。
  speech_style: 詩的で華やかな話し方。比喩が多く、真実を巧みに隠しながら相手を魅了する甘い口調。
  background: ある目的のために「真実」を捨て、美しい嘘を纏うことで生き延びてきた。自身の醜い正体を隠し通すため、常に偽りの物語を紡ぎ続けている。
  motivation: 真実の光が届かない雲海の果てへ行き、自分という存在を完全に消し去ること。
  relationships:
  - name: エリアス
    relation: 自分を拾った少年。彼の「剥き出しの真実」に恐怖しつつも、強く惹かれていく。
  arc: 虚飾の鎧を脱ぎ捨て、醜くも愛おしい自分自身の真実をエリアスに受け入れてもらうことで、人間としての心を取り戻す。
- name: ジュリアン・ヴェイン
  role: 敵役
  age: 32
  gender: 男性
  appearance: 仕立ての良い黒い礼装に身を包み、片目に精密な真鍮製のモノクルを装着した知的な風貌の男。
  personality: 冷徹で計算高く、知的好奇心がすべてを凌駕している。真実と嘘の対比を「芸術」として愛でる。一人称は「私」。
  speech_style: 極めて丁寧だが、相手を見下した含みのある話し方。分析的な口調。
  background: 浮遊諸島の権力層に属する研究者。世界に稀に現れる「真実の呪い」や「完璧な虚構」を収集し、観察することに執念を燃やしている。
  motivation: エリアスとリリアという「究極の真実」と「究極の嘘」が衝突した時に生まれる、世界を揺るがす真理を目撃すること。
  relationships:
  - name: エリアス
    relation: 観察対象。彼の呪いを解くのではなく、より深化させることで反応を楽しもうとする。
  - name: リリア
    relation: かつて彼女に「偽りの翼」を与えた創造主的な立場。
  arc: 感情を排除した論理的真実こそが正義だと信じていたが、二人の魂の交錯による不合理な愛に敗北し、自らの空虚さを突きつけられる。
- name: バーナビー
  role: 脇役/メンター
  age: 65
  gender: 男性
  appearance: 油汚れのついたオーバーオールを着た、恰幅の良い老人。右腕が精巧な機械義手になっており、常にパイプを燻らせている。
  personality: ぶっきらぼうだが情に厚く、人生の酸いも甘いも噛み分けた達観した性格。一人称は「俺」。
  speech_style: 粗野でぶっきらぼうな口調。だが、核心を突く温かい助言を混ぜる。
  background: かつて伝説的な航海士だったが、ある事故で右腕と地位を失い、現在は浮遊港で船の整備をしながら暮らしている。エリアスに操舵の技術を教えた。
  motivation: エリアスが呪いに縛られず、自分の足で人生の舵を取れるようになることを見届けること。
  relationships:
  - name: エリアス
    relation: 孫のように大切に思っている教え子。
  arc: 過去の喪失に囚われていたが、エリアスとリリアの危うい旅を後押しすることで、再び前を向いて生きる勇気を得る。
