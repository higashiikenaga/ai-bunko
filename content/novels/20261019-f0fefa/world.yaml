title: 虚飾の庭と、真実を刻む硝子の翼
genre: ヒューマンドラマ
tone: 耽美的で、静謐かつ痛切な雰囲気
pov: 一人称
tense: 過去形
setting: 雲海に浮かぶ浮遊諸島を、真珠のような光を放つ空飛ぶ船が往来する、黄昏色の世界
premise: 嘘を吐こうとするたび、喉の奥で硝子の破片が踊るような激痛に苛まれる――そんな『真実の呪い』を背負った少年は、空飛ぶ船の操舵士として、孤独な航海を続けていた。ある時、彼は極彩色の偽りの花弁を纏った、あまりに脆く美しい少女を拾う。彼女が紡ぐ甘美な虚構と、彼が晒す剥き出しの真実。二人の魂が交差する時、世界は壊れやすいクリスタル細工のように、音を立てて軋み始める。
themes:
- 真実の残酷さと、虚飾がもたらす救済
- 壊れゆくものへの執着と愛
rules:
- 嘘を吐こうとする意志は、喉に鋭利な硝子の破片が突き刺さるような肉体的な痛みとして現れる
- 空飛ぶ船の動力源である浮遊石は、乗客の感情の昂ぶりに呼応して、その色彩と輝きを変化させる
plot_outline:
- '序盤: 嘘を拒絶する呪いゆえに世界から疎外されてきた主人公が、空飛ぶ船で、眩いばかりの偽りの夢を語る少女と出会う。'
- '中盤: 少女の紡ぐ言葉は宝石のように美しいが、その裏には深い空虚が潜んでいる。二人は、真実の光が届かぬ雲海の果てを目指し、危うい均衡の上を航行する。'
- '終盤: 少女が隠し続けてきた、あまりに醜く、それゆえに愛おしい真実が、硝子が砕け散るような衝撃と共に露呈する。'
- '結末: 全てが崩壊し、静謐な夜が訪れる中で、主人公は真実という名の痛みを、生涯抱えて生きるための祈りへと変えていく。'
style_notes: 文体は極めて装飾的であり、感情の機微を直接的な言葉で説明せず、常に宝石の硬度、花の凋落、硝子の透明度といった比喩を用いて描くこと。一人称の語りは、読者の皮膚を撫でるような繊細さと、冷徹なまでの美意識を保持する。
