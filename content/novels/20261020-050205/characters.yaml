- name: ポコ
  role: 主人公
  age: 10
  gender: 女性
  appearance: 小柄で、真鍮のヘアピンやアクセサリーを好んで付けている。常に瞳がキラキラと輝いている。
  personality: 天真爛漫で好奇心旺盛。困っている人を放っておけない。一人称は「ポコ」。
  speech_style: 語尾が跳ねるような、明るく無邪気な話し方。「～だよ！」「～なの？」
  background: 集合住宅の住人の一人。機械の分解や組み立てが趣味の少女。
  motivation: 大切にしていた真鍮の小物入れを取り戻すこと。
  relationships:
  - name: ニコ
    relation: 良き友人
  - name: テツ
    relation: 頼りになる兄貴分
  arc: 事件を通じて、街の仕組みだけでなく、人々の想いが繋がっていることに気づき、精神的に成長する。
- name: ニコ
  role: 主人公
  age: 18
  gender: 男性
  appearance: 細身で長身。少し度の強い眼鏡をかけ、常に小さな手帳と万年筆を携えている。
  personality: 冷静沈着で論理的だが、少し世間知らずなところがある。一人称は「僕」。
  speech_style: 丁寧で落ち着いた口調。「～ですね」「～と考えられます」
  background: 街の歴史や記録を管理する「アーカイブ」の見習い。観察することを得意とする。
  motivation: 街で起きる不可解な現象の背後にある、論理的な理由を解明すること。
  relationships:
  - name: ポコ
    relation: 世話を焼く友人
  - name: テツ
    relation: 信頼できる協力者
  arc: 知識だけで解決できない「人の心」の温かさを知り、観察者から当事者へと変化する。
- name: テツ
  role: 主人公
  age: 28
  gender: 男性
  appearance: がっしりとした体格。油汚れのついた作業着を纏い、腰には常に工具袋を下げている。
  personality: 無骨で口数は少ないが、非常に情に厚い。一人称は「俺」。
  speech_style: ぶっきらぼうだが、どこか温かみのある話し方。「～じゃねえか」「～だろ」
  background: 街の蒸気供給システムを保守する技師。集合住宅の設備の管理も兼任している。
  motivation: 街のインフラを正常に保つこと、そして仲間の安全を守ること。
  relationships:
  - name: ポコ
    relation: 妹のように可愛がっている
  - name: ニコ
    relation: 対照的な友人
  arc: 効率や正確さだけを重視する日常の中に、非合理な「願い」がもたらす美しさを見出す。
- name: エリーナ
  role: 脇役
  age: 70
  gender: 女性
  appearance: 白髪を上品にまとめ、常に穏やかな微笑みを浮かべている。琥珀色のドレスを好む。
  personality: 慈愛に満ち、少しいたずら好きな老婦人。一人称は「私」。
  speech_style: ゆったりとした、音楽を奏でるような優しい話し方。「～ですよ」「～かしら」
  background: かつて街で名を馳せた音楽家。現在は集合住宅の最上階で静かに暮らしている。
  motivation: 蒸気の音に紛れて、孤独な人々や忙しい街の人々に、ささやかな驚きと癒やしを届けること。
  relationships:
  - name: ポコ
    relation: 見守る対象
  - name: 集合住宅の住人全員
    relation: 隣人
  arc: 自分の仕掛けたことが、街の若者たちの絆を深めるきっかけになったことを知り、再び音楽への情熱を取り戻す。
