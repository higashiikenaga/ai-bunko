title: 真鍮の音色と、琥珀色の夜明け
genre: 群像劇
tone: 穏やかで温かい、日常ミステリー
pov: 三人称
tense: 過去形
setting: 蒸気機関が街の灯を支え、絶えず駆動音が響く不夜城のような大都市
premise: 蒸気機関の鼓動が止むことのない、眠らない街。その片隅にある古い集合住宅で、あだ名で呼び合う仲間たちが暮らしている。ある日、彼らの日常に「消えた鍵」や「真夜中の旋律」といった、ささやかな謎が舞い込む。誰かを追い詰めるのではなく、なぜそれが起きたのかを優しく探っていく、温かな群像劇ミステリー。
themes:
- 日常の中の小さな奇跡
- 人と人との緩やかな繋がり
rules:
- 街の全動力は巨大な蒸気機関によって供給されており、その駆動音が街の生活リズムとなっている
- 事件の解決は誰も傷つけず、むしろ人々の繋がりを深める形で行われる
- 登場人物は互いにあだ名で呼び合い、親密な距離感を持つ
plot_outline:
- '序盤: 蒸気機関の音が絶え間なく響く街で、ポコが大切にしていた真鍮の小物入れが消えるという、ささやかな事件が起きる。'
- '中盤: ニコやテツが、夜中にだけ聞こえる不思議な旋律や、蒸気の霧の中に消える奇妙な影について、それぞれの視点から手がかりを見つけていく。'
- '終盤: 全ての謎が、街の蒸気供給システムの微細な変化と、ある住人が仕掛けた「誰かを喜ばせたい」という純粋な願いによって繋がっていることが判明する。'
- '結末: 謎が解け、誰も責めることなく、仲間たちはいつものように温かいお茶を囲んで語り合う。街は変わらず、優しく眠らない。'
style_notes: キャラクターは必ずあだ名で呼び合い、会話劇を中心に展開すること。蒸気の温もりや真鍮の質感、街の音を五感に訴えるように描写し、読者が物語の心地よいリズムに身を委ねられるような、やさしく、傷つかないミステリーの文体を徹底する。
