- name: 蓮見 蓮
  role: 主人公
  age: 21
  gender: 男性
  appearance: 都会的な服装だが、疲れ切った眼差し。妹の遺品である折れた剣の破片を常に懐に忍ばせている。
  personality: 理性的で慎重だが、妹への愛情だけは盲信的に強い。一人称は「俺」。
  speech_style: 丁寧だが、核心を突くときは突き放すような冷徹な口調になる。
  background: 大学進学のため村を離れていたが、妹の失踪と村からの不可解な呼び出しを受け、数年ぶりに帰郷した。
  motivation: 妹の行方を突き止め、彼女を連れてこの呪われた村から脱出すること。
  relationships:
  - name: 蓮見 花
    relation: 最愛の妹
  - name: 狗巻 朔
    relation: 村の禁忌を教える導き手にして監視者
  arc: 妹を救いたいという切望から、最終的に自分のアイデンティティすべてを捨てるという究極の自己犠牲に至る。
- name: 蓮見 花
  role: 鍵となる人物
  age: 16
  gender: 女性
  appearance: 透き通るような白い肌と、焦点の合わない虚ろな瞳。白い古風な着物を纏っている。
  personality: 本来は天真爛漫だったが、記憶を切り売りしたため感情が希薄な「空っぽの器」の状態。一人称は「私」。
  speech_style: 断片的な単語のみを呟く。ささやくような、実体のない声。
  background: 村の残酷な運命から逃れるため、あるいは誰かを守るために、自らの存在を『忘却市』に売り払った。
  motivation: （喪失しているが）潜在的に兄に気づいてほしいと願っている。
  relationships:
  - name: 蓮見 蓮
    relation: 唯一の血縁であり、記憶の拠り所
  arc: 自我を完全に失い消滅しかけるが、兄の代償によって肉体と魂を取り戻す。
- name: 狗巻 朔
  role: 敵役/案内人
  age: 78
  gender: 男性
  appearance: 腰が曲がった小柄な老人。白濁した瞳を持ち、常に不気味な笑みを浮かべている。
  personality: 村の秩序を至上とする狂信者。忘却こそが最高の救済であると信じている。一人称は「私」。
  speech_style: 古風で婉曲的な言い回しを好み、相手を精神的に追い詰める話し方をする。
  background: 御神村の古老であり、『忘却市』の運営を司る司祭のような役割を担っている。
  motivation: 異形の神に十分な記憶を捧げ、村の静寂（停滞）を維持すること。
  relationships:
  - name: 蓮見 蓮
    relation: 市場へ誘い込み、絶望させるための獲物
  arc: 蓮の抵抗を嘲笑っていたが、想定外の代償（自己消去）を支払った蓮の意志に、わずかな戦慄を覚える。
- name: 凪原 栞
  role: 相棒/協力者
  age: 19
  gender: 女性
  appearance: ショートカットで、サイズの大きなカーディガンを羽織っている。記憶を忘れないため、常に手帳にメモを取っている。
  personality: 皮肉屋で現実主義。記憶を一部売ったことで、村の異常性に気づいた数少ない生存者。一人称は「私」。
  speech_style: ぶっきらぼうで口が悪いが、根は情に厚い。
  background: かつて家族の記憶を売り払ったが、不完全な取引だったため、喪失感だけが残り、村の構造に懐疑的になった。
  motivation: 忘却の連鎖を断ち切り、自分を取り戻すこと。
  relationships:
  - name: 蓮見 蓮
    relation: 共通の目的を持つ一時的な共犯者
  arc: 諦念の中で生きていたが、蓮の献身に触れ、記憶を失う恐怖よりも大切なものを守る勇気を得る。
