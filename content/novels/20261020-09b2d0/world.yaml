title: 骸鳴る社の忘却市
genre: 伝奇
tone: 静謐で閉塞感のある民俗ホラー
pov: 三人称
tense: 過去形
setting: 現代、地図から消された山間の廃村・御神村（おがみむら）
premise: 外界から隔絶された御神村には、数年に一度、死者の記憶を代価に願いを叶える『忘却市』が開かれる。村の若者・蓮は、失踪した妹を探すため、禁忌とされる祭りの夜に市場へと足を踏み入れる。そこで彼が目にしたのは、折れた剣を奉納することで、自らの存在そのものを「記憶」として売り払う村人たちの狂った儀式であった。一度売った記憶は二度と戻らず、村全体が緩やかな忘却の淵へと沈んでいく。
themes:
- 因習による個の喪失
- 記憶と存在の等価交換
rules:
- 忘却市での取引は、物理的な物品ではなく、脳に刻まれた『記憶』を媒介とする。
- 一度売却した記憶は、神域の蔵に封じられ、本人の意志では決して取り戻せない。
- 村の境界にある御神社の鳥居を越える際、身の潔白（穢れのない記憶）を証明できぬ者は、その場で『名前』を奪われる。
plot_outline:
- '序盤: 都会から戻った蓮は、村に漂う異様な静けさと、祭りの準備に勤しむ村人たちの不自然なほど穏やかな表情に違和感を抱く。妹の遺留品の中に、村の禁忌に触れる「折れた剣」の破片を見つける。'
- '中盤: 蓮は妹を探すため、村の古老から『忘却市』の存在を聞かされる。市場では人々が「幸福な記憶」を売り払い、「呪われた記憶」を買い取っていた。蓮は市場の最奥で、妹が自らの存在をすべて売り払い、もはや誰の記憶にも残らない『空っぽの器』になろうとしている姿を目撃する。'
- '終盤: 祭りのクライマックス、村全体を覆う異形の神が降臨する。蓮は妹を取り戻そうとするが、それは村の掟に反する行為であり、村人たち全員から「蓮という存在」が記憶から消され始める恐怖に直面する。'
- '結末: 蓮は妹を救うため、自らの最も大切な記憶を代価として差し出す。妹は救われるが、蓮は村を出ても、自分が誰であったのか、なぜここにいたのかを一切思い出せないまま、独り静かな霧の中を彷徨うことになる。'
style_notes: 湿り気を帯びた、重苦しい文体。方言を用いた会話により、村の閉鎖性と外部者への拒絶感を強調する。五感（特に音と匂い）に訴えかける描写を用い、神事の荘厳さと、その裏に潜む生理的な嫌悪感を同居させる。
