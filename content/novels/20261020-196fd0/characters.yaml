- name: 星野 栞
  role: 主人公
  age: 27
  gender: 女性
  appearance: 落ち着いた雰囲気の眼鏡をかけた女性。ベージュのリネンエプロンを愛用している。
  personality: 内向的で思慮深い。本の世界に浸ることを好む。一人称は「わたし」。
  speech_style: 丁寧で静かな口調。時折、本からの引用を混ぜて話す。
  background: 都会での生活に疲れ、祖父が遺した海辺の古本屋『アストロラーベ』を継いで町に移住してきた。
  motivation: 届いた星図の謎を解き明かし、そこに込められた想いの行き先を見つけたい。
  relationships:
  - name: 海原 海斗
    relation: 町の案内役であり、良き相談相手
  - name: 沢田 登代子
    relation: 星図にまつわる過去を知る重要な鍵となる人物
  arc: 静かな傍観者であったが、人々の記憶に触れることで、自分自身の人生を主体的に歩む勇気を得る。
- name: 海原 海斗
  role: 相棒
  age: 22
  gender: 男性
  appearance: 日焼けした肌に快活な笑顔。ラフなTシャツに短パンという海辺の青年らしい格好。
  personality: 社交的で好奇心旺盛。町のあらゆる噂に通じている。一人称は「俺」。
  speech_style: 気さくで距離感が近く、語尾に「〜だよな」などの軽い口調が混じる。
  background: 地元の漁協で働きながら、町を盛り上げる方法を模索している青年。
  motivation: 栞の不思議な調査を手伝い、自分の町の知られざる歴史に興味を持つ。
  relationships:
  - name: 星野 栞
    relation: 好奇心を刺激される店主。密かに好意を寄せている
  arc: 単なる「賑やかな青年」から、町の記憶や文化を大切に継承しようとする意識を持つようになる。
- name: 沢田 登代子
  role: 脇役/鍵となる人物
  age: 78
  gender: 女性
  appearance: 小柄で背筋が伸びた上品な老婦人。常に白いハンカチを携えている。
  personality: 凛としていて礼儀正しいが、どこか寂しげな影を纏っている。一人称は「私」。
  speech_style: 古風で穏やかな話し方。感情が高ぶると少し言葉が詰まる。
  background: かつて灯台守だった兄を持ち、ある誤解から数十年もの間、家族と疎遠になっていた。
  motivation: 過去のわだかまりを解消し、兄が本当に伝えたかった言葉を受け取りたい。
  relationships:
  - name: 星野 栞
    relation: 自分の過去を紐解いてくれる信頼できる聞き手
  - name: 沢田 蓮
    relation: 孫
  arc: 長年抱えていた罪悪感と後悔から解放され、穏やかな心で人生の晩年を迎えられるようになる。
- name: 沢田 蓮
  role: 脇役/贈り主
  age: 24
  gender: 男性
  appearance: 細身で知的な印象。旅人のような服装で、いつも小さなスケッチブックを持っている。
  personality: 控えめで優しい。他人の感情に敏感。一人称は「僕」。
  speech_style: 控えめで、相手を立てる物腰柔らかな話し方。
  background: 登代子の孫。大学卒業後、祖母と祖父の間のわだかまりを解くため、密かに星図を栞に送った。
  motivation: 家族の絆を取り戻させるため、第三者である栞に橋渡しをしてもらう。
  relationships:
  - name: 沢田 登代子
    relation: 大切に想っている祖母
  - name: 星野 栞
    relation: 計画を託した協力者
  arc: 裏方として動いていたが、最後には自らも家族の輪に加わり、ありのままの想いを伝える。
