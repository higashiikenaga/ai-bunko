title: 星図のあとに、灯台の光を
genre: 日常ほのぼの
tone: やさしく、温かく、少しだけ不思議な読後感
pov: 一人称（わたし）
tense: 過去形
setting: 現代。海辺の町にある、古い星図を扱う古本屋『アストロラーベ』
premise: 海沿いの静かな町で、古本屋を営む「わたし」のもとに、一冊の古い星図が届きます。それは、かつてこの町にあった「古い灯台」の地図を兼ねた、不思議な贈り物でした。地図に記された星の配置を辿ると、そこには誰かが残した、小さな善意の記憶が隠されています。誤解によって途切れてしまった、ある家族の想いを解き明かしていく物語です。
themes:
- 受け継がれる善意
- 記憶の再発見
- 人との繋がり
rules:
- 事件性はあっても、誰かを傷つける暴力や殺人は一切起きない
- 謎の解決は、論理的な推理よりも、相手の気持ちに寄り添うことで行われる
- 舞台となる町は、時間がゆっくり流れているような穏やかな場所である
plot_outline:
- '序盤: 古本屋の店先に、誰からのものかもわからない、古い星図が挟まった本が届く。「わたし」は、その図に描かれた星の配置が、町の古い灯台の光の規則性と一致していることに気づく。'
- '中盤: 星図を頼りに、町の人々に聞き込みをしながら、かつて灯台守が大切にしていた「星を愛でる習慣」について知っていく。その過程で、ある古い手紙が、かつて誰かが良かれと思ってした行動が、別の誰かに誤解されてしまった記録であることを突き止める。'
- '終盤: 星図が示す最後の場所、今は使われていない古い灯台の跡地を訪れる。「わたし」は、そこに隠されていた、誤解を解くための「最後の星の配置」を見つける。'
- '結末: 誤解が解け、町の人々の間に穏やかな空気が戻る。星図の贈り主の正体が、意外な形で判明し、「わたし」は今日も古本屋で、誰かの物語を待っている。'
style_notes: 「わたし」の語り口は軽やかで、少しとぼけたような、読者の肩の力を抜くようなリズムを意識する。難しい言葉は使わず、日常の風景（淹れたての紅茶の香りや、古い紙の匂い）を丁寧に描写することで、ミステリーとしての緊張感ではなく、謎が解ける時の「ほっとする感覚」を強調する。人の悪意ではなく、不器用な善意が招いたすれ違いに焦点を当てる。
