- name: 成瀬 海斗
  role: 主人公
  age: 28
  gender: 男性
  appearance: 細身で神経質そうな印象。度の強い眼鏡をかけ、常に整ったスーツを着用しているが、目の下には慢性的な隈がある。
  personality: 論理至上主義で妥協を許さない性格。正義感はあるが、それを感情ではなく「整合性」として追求する。一人称は「僕」。
  speech_style: 丁寧だが、相手の矛盾を突くときは冷徹なまでに淡々とした口調になる。
  background: 大手法律事務所を辞め、地方で独立したばかりの若手弁護士。効率的な解決を好むが、本質的な違和感を無視できない業を抱えている。
  motivation: 完璧に見える状況証拠の「綻び」を証明し、真実を法廷で白日の下に晒すこと。
  relationships:
  - name: 久我 瞬一
    relation: 依頼人（被告人）
  - name: 一ノ瀬 善蔵
    relation: 情報源であり協力者
  arc: 法的な正解だけでは救えない人間の孤独と、正義の不完全さを知り、弁護士としての在り方に葛藤する。
- name: 久我 瞬一
  role: 主人公の依頼人
  age: 23
  gender: 男性
  appearance: 青白い肌に、伏せがちな視線。父親の影に押されていたためか、全体的に自信がなく、小さく見える。
  personality: 内向的で自己評価が低い。厳格すぎた父への愛憎に引き裂かれている。一人称は「僕」。
  speech_style: 言葉少なで、語尾が消え入りそうな、自信のない話し方。
  background: 元判事の息子。大学卒業後、就職できず実家で暮らしていた。父の殺害容疑で逮捕されるが、記憶に断片的な空白がある。
  motivation: 自分が本当に父を殺したのかという恐怖と、父が最後に自分に伝えたかったことを知ること。
  relationships:
  - name: 成瀬 海斗
    relation: 唯一自分を信じて戦ってくれる弁護士
  arc: 被害者である父の真の姿を知ることで、依存していた関係から脱却し、自らの足で歩き出す決意をする。
- name: 一ノ瀬 善蔵
  role: 相棒/協力者
  age: 67
  gender: 男性
  appearance: 使い古されたカーディガンを羽織り、常に古本の埃を纏っている。鋭い眼光を持つ老人。
  personality: 皮肉屋で世捨て人のように振る舞うが、知識欲が強く、地域の歴史と人間関係に精通している。一人称は「私」。
  speech_style: 含みを持たせた言い回しが多く、核心を突く前に比喩を用いる癖がある。
  background: 衰退した商店街で古本屋を営む。かつては地域の記録係のような役割を担っており、街の「汚れ」を誰よりも知っている。
  motivation: 権力によって抹消されようとしている「記録（真実）」を、正しい形で後世に残すこと。
  relationships:
  - name: 成瀬 海斗
    relation: 知的な好奇心を刺激し合う奇妙な協力関係
  arc: 孤独な観測者であったが、成瀬を通じて社会に介入し、正義を執行する側に回る快感を覚える。
- name: 佐伯 剛
  role: 敵役
  age: 56
  gender: 男性
  appearance: 恰幅が良く、常ににこやかな笑みを浮かべている。高級なスーツと、信頼感を演出する温かみのある声。
  personality: 支配欲が強く、地域の調和（という名の管理）を最優先する。目的のためには手段を選ばない冷酷さを笑顔の裏に隠している。一人称は「私」。
  speech_style: 包容力のある、父親のような温厚な口調。しかし、拒絶された際は圧迫感のある話し方に変わる。
  background: 地元有力者の子息で、現在は地元の開発計画を主導する実業家。住民たちの信頼を勝ち取り、実質的に街を支配している。
  motivation: 自身の地位と、地域の繁栄という名目のもとに行っている不正を、死守すること。
  relationships:
  - name: 成瀬 海斗
    relation: 自分の秩序を乱そうとする不愉快な侵入者
  - name: 久我 瞬一
    relation: 都合よく利用し、社会的に抹殺しようとした獲物
  arc: 完璧にコントロールしていたはずの地域社会が、一冊の帳簿と若き弁護士によって崩壊していく恐怖に直面する。
