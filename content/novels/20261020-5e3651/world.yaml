title: 不純なる正義の証明
genre: 本格ミステリー
tone: 冷静、理知的、社会批判的
pov: 三人称
tense: 過去形
setting: 現代日本、地方都市の裁判所周辺と衰退した商店街
premise: 元判事の父を殺害したとして起訴された青年。状況証拠は完璧に見えたが、担当弁護士は証言の僅かな食い違いから、事件の背後に潜む「地域社会による組織的な隠蔽」を直感する。古本屋に隠された一冊の記録と、街を彷徨う名前のない猫が、法で裁けない残酷な真実を暴き出していく。
themes:
- 法の限界と正義の乖離
- 地域社会における不可視の貧困
rules:
- 物理的トリックよりも、証言の矛盾と書証による論理的解決を重視する
- 法廷での証拠能力の有無が物語の転換点となる
- 登場人物の社会的地位が証言の信頼性に影響を与えるという社会的な力学を描く
plot_outline:
- '序盤: 厳格な元判事の殺害事件が発生し、その息子が逮捕される。世論は「親殺し」に憤り、検察は完璧な状況証拠を提示して有罪へと追い込む。'
- '中盤: 若手弁護士が担当し、周辺住民へ聞き込みを行うが、彼らの証言は巧妙に食い違っていた。ある古本屋の店主が、被害者が死の直前に買い集めていた「地域の土地開発に関する古い帳簿」の存在を明かす。'
- '終盤: 帳簿から、元判事が地域の有力者たちによる不正を暴こうとしていたことが判明。証言の矛盾を突き合わせることで、真犯人が住民たちの共謀によって守られていた構造を法廷で論理的に証明する。'
- '結末: 真犯人は特定され、青年は無罪を勝ち取る。しかし、法的な勝利の裏で、地域社会の絆という名の排他性がもたらした悲劇と、救われなかった弱者の孤独が静かに描き出される。'
style_notes: 感情的な形容詞を極力排し、客観的な事実と論理的推論を積み重ねる文体。法廷シーンでは鋭い論述を展開し、一方で街の風景や名もなき猫の描写には、社会から切り捨てられた者への静かな慈しみを込める。
