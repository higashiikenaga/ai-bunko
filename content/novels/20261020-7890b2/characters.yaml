- name: セラフィナ・ド・ヴァロワ
  role: 主人公
  age: 18
  gender: 女性
  appearance: 透き通るような白い肌と、真珠のように輝く銀髪。大きな瞳は常に真っ直ぐで、飾り気のない質素ながらも品のあるドレスを好む。
  personality: 誠実で芯が強いが、嘘をつけないために社交界では「不器用な変わり者」として孤立している。一人称は「私」。
  speech_style: 丁寧だが、社交辞令や遠回しな表現ができず、常に核心を突く率直な話し方をする。
  background: 没落しかけた貴族の娘。家系に伝わる「真実しか語れぬ呪い」を、周囲からは欠陥として蔑まれて育った。
  motivation: 偽りのない自分自身として、誇りを持って生きること。
  relationships:
  - name: アルリック・フォン・グレイシア
    relation: 運命を共にする恋人・共犯者
  - name: エレナ・ヴィクトリア
    relation: 社交界の価値観における対照的な敵
  arc: 孤独に怯える「呪われた少女」から、真実を武器に運命を切り拓く「誇り高き証人」へと成長する。
- name: アルリック・フォン・グレイシア
  role: 相棒/ヒーロー
  age: 26
  gender: 男性
  appearance: 漆黒の髪に、冷徹さを感じさせる鋭い碧眼。常に完璧に整えられた軍服風の貴族服を纏い、圧倒的な存在感を放つ。
  personality: 冷徹で計算高い政治家。嘘を武器に権力を操るが、内面には深い孤独を抱えている。一人称は「私」。
  speech_style: 優雅で流暢、かつ含みを持たせた言葉選びをする。相手を煙に巻くのが得意。
  background: 帝国の権力闘争の渦中にいる若き公爵。生き残るために、あらゆる嘘と策略を使いこなしてきた。
  motivation: 政敵を排除し、自らの地位と守るべき秩序を確立すること。
  relationships:
  - name: セラフィナ・ド・ヴァロワ
    relation: 利用対象から、唯一無二の愛する存在へ
  - name: ヴィクター・ド・ラングレー
    relation: 命を懸けて戦う政敵
  arc: 嘘で塗り固めた虚飾の人生を捨て、セラフィナと共に「真実」を受け入れる勇気を持つようになる。
- name: ヴィクター・ド・ラングレー
  role: 敵役
  age: 45
  gender: 男性
  appearance: 整った顔立ちだが、目は笑っておらず、獲物を狙う猛禽類のような冷たさがある。重厚な黒いマントを愛用。
  personality: 極めて野心的で冷酷。目的のためには皇帝の暗殺すら厭わない。一人称は「私」。
  speech_style: 重厚で威圧的。相手の心理を掌握するような、穏やかながらも逃げ場のない話し方。
  background: 帝国の高官であり、裏では巨大な陰謀を操る黒幕。ルメリアの既存の秩序を破壊し、自らが新たな支配者となることを目論む。
  motivation: 皇帝暗殺による政変と、自らによる帝国の再構築。
  relationships:
  - name: アルリック・フォン・グレイシア
    relation: 濡れ衣を着せて排除すべき障害
  - name: セラフィナ・ド・ヴァロワ
    relation: 計画を崩壊させる最大の脅威
  arc: 完璧な陰謀を完遂しようとするが、予測不能な「真実」によって全てを失い、破滅へと向かう。
- name: エレナ・ヴィクトリア
  role: 脇役/ライバル
  age: 24
  gender: 女性
  appearance: 眩いばかりの金髪と、贅を尽くした宝石。常に完璧な微笑みを浮かべているが、瞳の奥に冷ややかな光を宿す。
  personality: 虚栄心が強く、社交界の「嘘こそが礼節」というルールを誰よりも信奉している。一人称は「あたくし」。
  speech_style: 華やかで装飾的な言葉を使い、常に周囲に聞こえるように優雅に、かつ残酷に話す。
  background: 社交界の女王を自称する高位貴族。嘘をつけないセラフィナを、秩序を乱す異端として徹底的に蔑んでいる。
  motivation: 絢爛たる嘘の世界を守り、自身の地位を盤石にすること。
  relationships:
  - name: セラフィナ・ド・ヴァロワ
    relation: 忌むべき不純物
  arc: 真実が暴かれる混乱の中で、自らが信じた虚飾の世界が崩壊していく様子を目の当たりにする。
