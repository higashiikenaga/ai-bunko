title: 真珠の涙と、噤まれぬ真実の舞曲
genre: 歴史・時代小説
tone: 華麗にして耽美、装飾的な宮廷ロマン
pov: 三人称
tense: 過去形
setting: 18世紀風の架空帝国ルメリア。金箔と水晶に彩られた絢爛たる宮廷。
premise: 嘘こそが最高の礼節とされる社交界において、家系に伝わる「嘘をつけない呪い」を持つ貴族の娘セラフィナは、疎まれ、孤独な日々を送っていた。ある夜の仮面舞踏会で、彼女は帝国の権力闘争の渦中にいる謎めいた公爵アルリックと出会う。真実しか語れぬ少女と、嘘で塗り固めた人生を歩む男。黄金の刺繍が舞う舞踏の間で、二人は危険な共犯関係と、切ない恋に落ちていく。
themes:
- 真実と虚飾
- 宿命的な愛
rules:
- 誠実の呪い：呪いを持つ者は、意図的に嘘をつこうとすると激しい喉の痛みに襲われ、強制的に真実を口にさせられる。
- 宮廷法：舞踏会での作法違反や不敬な発言は、即座に社交界からの追放または投獄の対象となる。
plot_outline:
- '序盤: 豪華絢爛なルメリア宮廷で、嘘をつけないために「口下手な変わり者」として蔑まれるセラフィナの日常と、彼女にだけ懐く名前のない白い猫の描写。運命の仮面舞踏会で、彼女の「真実」に興味を持った公爵アルリックと出会う。'
- '中盤: アルリックは、政敵の嘘を暴くための「純粋な道具」としてセラフィナを利用しようとする。豪華なドレスを纏い、夜会を渡り歩く中で、セラフィナの純真さとアルリックの孤独が共鳴し、二人は次第に心を通わせていく。'
- '終盤: 皇帝の暗殺計画という巨大な陰謀が発覚。アルリックは濡れ衣を着せられ、セラフィナだけが真実を知る唯一の証人となる。彼女は自らの呪いを利用し、全貴族が集う最後の大舞踏会で、命懸けの告発を行う。'
- '結末: 真実が白日の下に晒され、陰謀は潰える。呪いは解けなかったが、セラフィナはそれを「誇り」として受け入れ、アルリックと共に、虚飾を捨てた新しい時代の愛を誓い合う。'
style_notes: シルクやサテン、金糸の刺繍といった衣装の質感を詳細に描写し、シャンデリアの光や香水の香りなど、五感を刺激する装飾的な語りを用いる。台詞回しは優雅に、心情描写は情熱的かつ繊細に綴ること。
