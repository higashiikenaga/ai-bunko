- name: エリアン・ソーン
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し癖のある茶髪に、インク汚れがついた指先。多くの道具を収納できる多機能なコートと、つばの広い旅帽子を愛用している。
  personality: 好奇心旺盛で几帳面だが、少し気弱な面がある。未知の景色に心を躍らせるロマンチスト。一人称は「僕」。
  speech_style: 丁寧で控えめな話し方。地図の専門用語を独り言のように呟く癖がある。
  background: 辺境の港町で引退した老地図製作者に弟子入りしていた見習い。教科書通りの地図ではなく、「生きている世界」を書き留めたいと願っている。
  motivation: 失われた星の道標を辿り、世界で最も正確で美しい星図を完成させること。
  relationships:
  - name: 名前のない猫
    relation: 運命に導かれた相棒
  - name: ライラ・ソリス
    relation: 旅を共にするナビゲーター
  arc: 記録者として「正解」を求める姿勢から、旅人として「未知」を楽しむ心へと成長する。
- name: 名前のない猫
  role: 相棒
  age: 不明
  gender: 不明
  appearance: 星屑を散りばめたような銀色の毛並みを持つ猫。瞳は黄金色に輝き、古びた革製の首輪を付けているが、名札はない。
  personality: 気まぐれで超然としているが、時折深い慈愛を見せる。言葉は話さないが、鋭い直感でエリアンを導く。
  speech_style: 鳴き声と仕草のみ。しかし、エリアンにはその意図がなんとなく伝わる。
  background: かつて世界が一つだった時代の記憶を司る星の使い。ふさわしい継承者を探して長い眠りから目覚めた。
  motivation: 星図の断片を集め、忘れ去られた世界の記憶を適切な人物に継承させること。
  relationships:
  - name: エリアン・ソーン
    relation: 選んだ旅の同行者
  arc: 孤独な導き手から、エリアンという個人の親友へと変化していく。
- name: ライラ・ソリス
  role: 脇役
  age: 19
  gender: 女性
  appearance: 陽に焼けた肌と活発に跳ねる金髪。雲海を航行するための特殊なゴーグルを額にかけている。
  personality: 快活で自信家。未知の料理や文化に目がなく、食いしん坊。一人称は「私」。
  speech_style: 快活でハキハキとした口調。地方の訛りが混じることがある。
  background: 浮遊島の間を飛び回るフリーランスのナビゲーター。星の運行による地形変化を読み取る天才的な勘を持つ。
  motivation: 世界中の珍しい食材を集めて、伝説のレシピを完成させること。
  relationships:
  - name: エリアン・ソーン
    relation: お人好しな地図製作者として気に入っている友人
  arc: 目的のためだけの効率的な旅から、寄り道することの価値を知る旅へと変わる。
- name: アステリオン・ヴェイン
  role: 敵役
  age: 42
  gender: 男性
  appearance: 青白い肌に、モノトーンの隙のない正装。レンズの色が変化する特殊な眼鏡をかけている。
  personality: 冷徹で支配的。知識は選ばれた強者だけが持つべきだと信じている。一人称は「私」。
  speech_style: 理知的だが、相手を見下した尊大な言い回しを好む。
  background: 帝国図書局の最高記録官。禁忌とされた古の星図を独占し、世界の構造を書き換えて支配しようと画策している。
  motivation: 星図の終着点である『星降る断崖』の力を手に入れ、世界を意のままに再構築すること。
  relationships:
  - name: エリアン・ソーン
    relation: 利用価値のある、あるいは排除すべき不純物
  arc: 完璧な管理を求めた末に、制御不能な星の記憶に飲み込まれ、喪失を経験する。
