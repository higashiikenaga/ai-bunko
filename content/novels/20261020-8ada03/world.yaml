title: 銀河の滴と、名前のない猫の足跡
genre: 異世界ファンタジー
tone: 穏やかで情緒的な冒険譚
pov: 一人称（僕）
tense: 過去形
setting: 空に浮かぶ無数の島々と、星の運行によって地形が変化する浮遊大陸の世界
premise: 僕は、失われた星の道標を探して旅をする、見習いの地図製作者だ。ある日、名もなき銀色の猫に導かれるようにして、古い星図が記された断片を手にする。その地図が指し示す先は、忘れ去られた星々の記憶が眠る場所だった。各地の風習や不思議な料理に触れながら、僕は世界の欠片を繋ぎ合わせていく。
themes:
- 忘却と記憶
- 旅による自己発見
rules:
- 星図は単なる地図ではなく、その土地の『運命の流れ』を示す魔法の道具である
- 空を飛ぶ手段は、風の精霊が宿る帆船のみに限られる
- 名前を持たない存在は、世界の理から外れた特別な力を持つ
plot_outline:
- '序盤: 辺境の港町で、言葉を話さない『名前のない猫』と出会う。猫が運んできた古びた羊皮紙には、見たこともない星座の配置が描かれていた。'
- '中盤: 星図の断片を辿り、雲海に浮かぶ様々な島々を巡る。スパイスの効いた雲のパンや、夜光植物の蜜を使った飲み物など、未知の文化に触れながら、星図が示す『天の道』の正体に近づいていく。'
- '終盤: 星図の終着点である『星降る断崖』に到達する。そこには、世界がかつて一つであった頃の記憶が、星の輝きとして保存されていた。'
- '結末: 星図は完成したが、僕は地図職人としてではなく、一人の旅人として、猫と共に次の新しい景色を探す旅へ出る。'
style_notes: 旅日記のような、静かで美しい語り口を用いる。風景描写においては、光の加減や風の匂い、その土地ならではの食文化（例：琥珀色の果実のコンポート、星屑の粉を振った温かなスープなど）を丁寧に描き、読者がその場にいるような没入感を与える。
