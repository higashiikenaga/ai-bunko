- name: カイ・レン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で常にフードを深く被っている。右目に情報の奔流を処理するための旧式ニューロリンクを装着しており、感情が読み取りにくい。
  personality: 冷静沈着で現実主義だが、妹のことになると執着を見せる。一人称は「俺」。
  speech_style: 簡潔で無駄のない、ぶっきらぼうな口調。
  background: 重層区の下層階で、違法なデータ復旧やデリート作業を請け負うフリーのハッカー。かつてはエリート候補だったが、ある事件を境にスラムに身を置いている。
  motivation: 行方不明になった妹・リナの足跡を辿り、彼女を『空白』から連れ戻すこと。
  relationships:
  - name: リナ・レン
    relation: 妹
  - name: ゼノ
    relation: 協力者
  arc: 妹を救うという個人的な執着から、世界の理（バグ）を止めるという自己犠牲的な使命へと変容する。
- name: リナ・レン
  role: 重要人物（失踪者）
  age: 17
  gender: 女性
  appearance: 記憶の中では、ネオンカラーの髪飾りをつけた明るい少女。物語中盤、デジタル・ゴーストとしてノイズ混じりに現れる。
  personality: 好奇心旺盛で、ネットワークの深淵に美しさを見出すロマンチスト。一人称は「私」。
  speech_style: どこか浮世離れした、夢見心地で穏やかな話し方。
  background: カイの妹。ネットワークの向こう側に「本当の楽園」があると信じ、都市伝説のハッシュタグを最初に拡散してしまった。
  motivation: 誰も知らない、デジタルと現実が溶け合う『約束の丘』を見つけること。
  relationships:
  - name: カイ・レン
    relation: 兄
  arc: 単なる失踪者から、物語の核心である『バグ』を象徴する存在へと、その存在意義が変質していく。
- name: ゼノ
  role: 相棒
  age: 35
  gender: 男性
  appearance: 全身の半分が重機パーツに置換されたサイボーグ。常に合成煙草を吸っており、不器用なガジェットを弄っている。
  personality: 打算的で皮肉屋だが、筋の通らないことは嫌う義理堅い性格。一人称は「俺」。
  speech_style: 低く、含みのある、少し古臭い言い回し。
  background: 下層階の裏社会で情報を扱うフィクサー。かつては都市管理システムのエンジニアだった過去を持つ。
  motivation: 祭りの夜に発生する情報の混乱から、スラムの秩序と自分の居場所を守ること。
  relationships:
  - name: カイ・レン
    relation: 仕事仲間兼、信頼する協力者
  arc: 情報の波に飲み込まれそうになる街を前に、システム側ではなく、人間側の視点でカイを支える決断を下す。
- name: NULL（ヌル）
  role: 敵役
  age: 0
  gender: 不明
  appearance: 激しいデジタルノイズと、断片的な人間の顔が混ざり合った不定形のシルエット。物理空間では黒い霧のように見える。
  personality: 感情を持たず、ただ「情報の拡散」と「不整合の解消（消去）」というプログラムの目的のみに従う。
  speech_style: 複数の声が重なり合ったような、不協和音を伴う機械音声。
  background: 都市の膨大な廃棄データと、人々の集団心理が結びついて誕生した、ネットワークの自己増殖的なバグ。
  motivation: 現実とデジタルの境界を完全に破壊し、全存在を「無（Null）」へと回帰させること。
  relationships:
  - name: 都市伝説『座標なき祭礼』
    relation: 発生源・具現化体
  arc: 拡散が進むにつれ、単なるバグから、物理世界を侵食する神のごとき災厄へと肥大化していく。
