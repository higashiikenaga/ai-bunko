title: デリート・メモリー：祭りの夜に消える座標
genre: サイバーパンク
tone: 不穏、加速的、デジタル・ゴシック
pov: 三人称近接
tense: 現在・過去混在
setting: 西暦2104年、ネオンと廃棄チップが極彩色に光る超高層スラム街「重層区・下層階'
premise: 高度にネットワーク化された都市で、特定のハッシュタグを追うと物理的な『空白』へと誘導される都市伝説が流行する。その噂は、SNSでの拡散量に比例して、現実の空間を侵食する『バグ（怪異）』を具現化させていく。主人公のハッカーは、行方不明になった妹の足跡を辿り、ネットワークの深淵と、物理的な『約束の丘』が重なり合う祭りの夜へと足を踏み入れる。
themes:
- 情報の拡散と怪異の増幅
- 仮想と現実の境界崩壊
- デジタル・エコーチェンバー
rules:
- 怪異はSNSでの『いいね』や『リポスト』の数に比例して、その物理的な質量と干渉力が増す
- 特定の座標（バグ・スポット）では、ARデバイスの表示と現実の景色が不一致を起こす
- 一度『デリート』されたデータは、現実の肉体からもその存在記憶を消去する
plot_outline:
- '序盤: 都市伝説『座標なき祭礼』がネット掲示板で爆発的に拡散。投稿された画像には、一瞬だけノイズ混じりの『約束の丘』が映り込んでいる。主人公は、妹の最後の書き込みがそのハッシュタグであったことに気づく。'
- '中盤: 噂を検証しようとするユーザーが次々と『ログアウト（失踪）』していく。主人公は、怪異が情報の拡散によって肥大化するプロセスを突き止める。街では、電子的なノイズを伴う謎の『祭り』が、デジタル信号の波として発生し始める。'
- '終盤: 祭りの最高潮、ネットワークのトラフィックが限界に達したとき、物理的な『約束の丘』がネオンの光と共に実体化し、都市を飲み込もうとする。主人公は、怪異を鎮めるために、自らの存在そのものを『デリート』する覚悟で、情報の渦中へとダイブする。'
- '結末: 怪異は沈静化したが、街の記録からは『祭りの夜』に関する全てのデータが消失した。主人公は生き残るが、妹の存在、そして自分自身の記憶の断片が、ネットワークのどこにも残っていないことに気づく。'
style_notes: スピード感のある短文を多用。会話文の合間に、スマートフォンの通知ログ、匿名掲示板のスレッド、バグったAR広告のテキストを挿入し、読者が情報の濁流に飲み込まれるような感覚を与える。怪異の描写は、物理的な恐怖よりも、視覚的なノイズや情報の不整合による精神的な違和感を重視する。
