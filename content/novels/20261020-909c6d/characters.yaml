- name: ルナ・スターダスト
  role: 主人公
  age: 19
  gender: 女性
  appearance: 銀髪のショートカットに、食べ歩きに便利な多機能ポケット付きのフライトスーツを着用。常に口元に食べかすがついていることがある。
  personality: 超ポジティブで底抜けの食いしん坊。好奇心が旺盛で、危険よりも「美味しそう」を優先する。一人称は「あたし」。
  speech_style: 元気いっぱいで、感嘆符の多い快活な口調。「〜だよ！」「〜じゃん！」など、明るく直感的な話し方。
  background: 七色星雲圏の辺境で、ジャンク品を回収しながら配送業を営む若者。幼い頃から「宇宙一の味」を夢見ていた。
  motivation: 美食コンパスが指し示す「伝説のフルコース」を完成させ、宇宙一の美食体験をすること。
  relationships:
  - name: ビット
    relation: 相棒（毒舌ロボット）
  - name: 皇帝ゼノス
    relation: 敵対者
  arc: 単なる食いしん坊な配送員から、食を通じて銀河の平和（懐柔）をもたらす「美食の守護者」へと成長する。
- name: ビット（B.I.T.）
  role: 相棒
  age: 120
  gender: なし（ロボット）
  appearance: 球体に近い小型の浮遊型ドロイド。感情に合わせてモニターの表情がアイコンのように変化する。
  personality: 超論理的で現実主義。ルナの無茶な行動に対して常に冷静かつ毒舌なツッコミを入れる。一人称は「ボク」。
  speech_style: 丁寧だが、内容は辛辣。「非効率的です」「それ、食べても栄養価は低いですよ」といった冷めた言い回し。
  background: かつて美食帝国の研究施設で使われていた旧式管理用ドロイド。ガラクタ市でルナに拾われた。
  motivation: ルナの暴走を最小限のエネルギー消費で食い止めつつ、自身のプログラムにない「未知の味」を観測すること。
  relationships:
  - name: ルナ・スターダスト
    relation: 飼い主兼、最も非論理的な相棒
  arc: 論理のみを重視していたが、ルナの食欲に触れることで、感情や「美味しさという非論理的な喜び」を理解し始める。
- name: 皇帝ゼノス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 金色の装飾が施された真っ黒な軍服を纏い、常に完璧に整えられた銀髪と鋭い眼光を持つ。威圧感がある。
  personality: 支配欲が強く、極めてプライドが高い。美食を「力を統制するための道具」と考えている。一人称は「余」。
  speech_style: 高圧的で傲慢。命令口調が多く、部下や他者を「下等な味覚を持つ者」と見下す話し方。
  background: 美食帝国を率いる絶対君主。古代のレシピを独占することで、全銀河の食糧供給を支配し、軍事力を強化しようとしている。
  motivation: 伝説のフルコースと古代レシピを奪い、美食による全宇宙の支配を完成させること。
  relationships:
  - name: ルナ・スターダスト
    relation: レシピを奪うべき邪魔者
  arc: レシピを手に入れてもなお満たされない孤独を知り、ルナの作った「分け合う料理」によって、支配とは異なる悦びを知る。
