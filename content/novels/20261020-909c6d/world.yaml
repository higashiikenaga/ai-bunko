title: 超銀河デリバリー★フルコース：時を止める懐中時計と禁断のレシピ
genre: SF
tone: コミカルで軽快、食欲旺盛な雰囲気
pov: 一人称（あたし）
tense: 現在形・過去形混在（口語体）
setting: 多彩な惑星と浮遊島が点在する「七色星雲圏」。人々は空飛ぶ船で惑星間を移動し、多様な外星生物が共生している。
premise: 銀河一の食いしん坊配送員である「あたし」が、ガラクタ市で不思議な壊れた懐中時計を拾う。その時計は時間を刻むのではなく、周囲にある「最高に美味い食材」の方向を指し示すコンパスだった！
  伝説のフルコースを完成させるため、空飛ぶ配送船に乗って危険で（でも美味しそうな）惑星を巡る大冒険が始まる。
themes:
- 食への飽くなき好奇心
- 不完全なものの価値
rules:
- 配送船の燃料は「美味しい料理の香り」を変換したエネルギーで駆動する
- 壊れた懐中時計は、特定の食材が揃った時だけ一時的に時間を停止させ、調理時間を短縮できる
- 銀河法により「究極のレシピ」の独占は禁止されており、共有することが美徳とされる
plot_outline:
- '序盤: 配送員として日銭を稼ぐあたしが、ジャンク屋で壊れた懐中時計を拾う。それが「美食コンパス」であることに気づき、人生最大の食欲に突き動かされて旅に出る。'
- '中盤: 空飛ぶ配送船で、空飛ぶ巨大タコが住む惑星や、地面が全部砂糖でできている惑星など、奇妙な地を巡る。相棒の毒舌ロボットと共に、時計が指し示す伝説のスパイスを収集し、道中で絶品料理を堪能する。'
- '終盤: 時計の真の機能が「失われた古代の究極レシピ」を復元することだと判明。レシピを独占して銀河を支配しようとする「美食帝国」に目を付けられ、激しい（けれど食欲に満ちた）追いかけっこが始まる。'
- '結末: 帝国軍を最高の料理で胃袋から掴んで懐柔し、究極のレシピを全宇宙に無料公開する。あたしは相変わらず食いしん坊な配送員として、次なる「美味いもの」を求めて宇宙を旅し続ける。'
style_notes: 一人称「あたし」による軽快な独白と、鋭いツッコミを多用した会話劇形式。食べ物の描写は、色、香り、食感を具体的に書き込み、読者の食欲を猛烈に刺激すること。また、シリアスな場面でもキャラクターがズッコケるなど、毎話ひとつ小さな笑いどころを必ず挿入する。
