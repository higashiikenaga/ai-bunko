- name: エライアス・ソーン
  role: 主人公
  age: 38
  gender: 男性
  appearance: 使い古された合成皮革のコートを纏い、常に眠そうな目の男。右目に旧式のデータ解析用義眼を埋め込んでいる。
  personality: 皮肉屋で懐疑的。クラウドによる永生を「贅沢な停滞」と蔑んでいる。一人称は「俺」。
  speech_style: ぶっきらぼうで、論理的な正論をあえて皮肉っぽく伝える話し方。
  background: 元は都市のシステム監査官だったが、ある不可解なデータ消失事件をきっかけに組織を追われ、現在は路地裏で私立探偵を営んでいる。
  motivation: 依頼料による生計維持と、システムの綻びを突き止めることへの知的好奇心。
  relationships:
  - name: 名前のない猫
    relation: 不本意ながら信頼し始めた奇妙な相棒
  - name: セレーネ・ヴェイン
    relation: 論理的に対立する宿敵
  arc: 冷笑的な傍観者から、消えゆくデータの儚さに価値を見出す人間へと変化する。
- name: 名前のない猫
  role: 相棒
  age: 0
  gender: 不詳
  appearance: 銀色の金属光沢を持つ自律型AI猫。瞳のパターンがデータ処理速度に応じて激しく点滅する。
  personality: 好奇心旺盛だが、AIらしい残酷なまでの客観性を持つ。一人称は「僕」。
  speech_style: 丁寧だが淡々としており、結論を確率論で語る傾向がある。
  background: 開発目的不明のプロトタイプAI。所有者を失い、都市のデータ廃棄区画で断片的な記憶ログを拾い集めて生存していた。
  motivation: 自身が保持している「意味不明なノイズ」の正体を解明し、自身のアイデンティティを確立すること。
  relationships:
  - name: エライアス・ソーン
    relation: 自分のログを解読できる唯一の知的存在
  arc: 単なるデータ収集機から、感情に近い「執着」を理解する個体へと成長する。
- name: セレーネ・ヴェイン
  role: 敵役
  age: 45
  gender: 女性
  appearance: 完璧に左右対称な顔立ち。白一色の幾何学的なドレスを纏い、瞬きをほとんどしない。
  personality: 冷徹で完璧主義。意識の純度を高めるためなら、個人の消去も厭わない選民思想を持つ。一人称は「私」。
  speech_style: 優雅で理知的。相手を論理的に追い詰める際、静かに微笑む習慣がある。
  background: エテリウムのサーバー管理責任者の一人。システム上の「死角」を利用して、選ばれた意識だけを密かに抽出する計画を主導していた。
  motivation: 管理されたクラウドの世界を脱し、物理的な制約のない真の精神的進化を遂げること。
  relationships:
  - name: エライアス・ソーン
    relation: 自分の完璧な計画に泥を塗る不快な不確定要素
  arc: 絶対的な論理の支配を信じていたが、想定外の矛盾を突きつけられ、精神的に崩壊する。
- name: ジュリアン・ヴァレリウス
  role: 脇役
  age: 29
  gender: 男性
  appearance: 青白い肌に、サイズの合わない豪華な喪服を身にまとった、ひ弱そうな青年。
  personality: 内向的で不安げだが、内面には父親への強い劣等感と憎悪を秘めている。一人称は「僕」。
  speech_style: 語尾が弱く、頻繁に言い淀む。しかし、核心に触れる時だけ鋭い口調になる。
  background: 被害者である最高権力者の息子。完璧な父のバックアップデータに囲まれて育ち、自己肯定感を喪失している。
  motivation: 父の死の真相を暴くことで、永遠に消えない「父という呪縛」から解放されたい。
  relationships:
  - name: エライアス・ソーン
    relation: 真相を委ねた雇い主
  - name: セレーネ・ヴェイン
    relation: 精神的な依存先であり、同時に利用されていた関係
  arc: 父の死を受け入れることで、初めて自分自身の人生を歩み始める。
