title: 神経回路の死後診断書
genre: サイバーパンク
tone: 冷徹、分析的、皮肉な知性
pov: 三人称
tense: 過去形
setting: 意識のクラウド保存が義務付けられた階層都市『エテリウム』。物理的な肉体は「器」と呼ばれ、精神はサーバー内で最適化されている。
premise: ある日、都市の最高権力者のバックアップデータに「致命的な論理矛盾」が発見される。それは、死後も生き続けるはずの意識が、内部から意図的に消去されたことを意味していた。唯一の目撃者は、IDを持たない野良の自律型AI猫のみ。皮肉屋の私立探偵が、システムによる全データ抹消プロセス『最終列車』の出発までに、この不可解な精神殺人の真相を暴く。
themes:
- 自我の定義
- 論理と感情の対立
rules:
- 意識は数値化され、メモリ容量に応じて社会階級が決まる
- 『最終列車』とは、30日ごとに実行される不要データの自動消去プロトコルの通称である
- ダイレクトリンクによる記憶共有は可能だが、互いの論理矛盾が衝突すると精神崩壊（フラグメンテーション）を引き起こす
plot_outline:
- '序盤: 探偵が権力者の遺族から、バックアップデータの不整合を調査する依頼を受ける。現場で、所有者不明の『名前のない猫』型のAIが、被害者の断片的な記憶ログを保持していることを突き止める。'
- '中盤: 容疑者たちとの論理的な問答を通じ、被害者が自ら消去を選んだのではないかという仮説を立てる。同時に、猫のログの中に隠された「特定の時間帯にのみ発生するノイズ」という決定的な手がかりを読者に提示する。'
- '終盤: 『最終列車』の執行まで残り数時間。探偵はノイズの正体が、サーバーの物理的な死角で密かに行われていた「意識の密輸」であったことを論理的に導き出し、真犯人を追い詰める。'
- '結末: 真犯人は論理的矛盾を突きつけられ自壊する。探偵は救いようのない結末を皮肉りながら、名前のない猫と共に、消去されゆくデータの雨が降る街を眺める。'
style_notes: 理詰めな構成を徹底し、感情的な記述を排除した冷ややかな文体。会話劇は互いの論理的な穴を突き合う形式とし、探偵の思考プロセスを（……など、この状況で最適解は一つしかない）のように括弧書きで挿入する。手がかりは事前の描写で明確に提示し、読者が論理的に正解に辿り着けるフェアなミステリ形式とする。
