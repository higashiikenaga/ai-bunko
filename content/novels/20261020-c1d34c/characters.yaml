- name: 瀬戸 結衣
  role: 主人公
  age: 17
  gender: 女性
  appearance: 切り揃えられたボブカットに、少し心細げな瞳。サイズの大きなベージュのカーディガンを羽織っている。
  personality: 内向的で思慮深い。周囲に合わせすぎる傾向があり、自分の本当の気持ちを出すのが苦手。一人称は「私」。
  speech_style: 丁寧だが控えめで、語尾に「……」が多く、ためらいがちな話し方。
  background: 進路や将来への不安を抱える高校生。唯一の理解者だった祖父を亡くし、心にぽっかりと穴が開いた状態で、祖父の故郷である港町を訪れている。
  motivation: 祖父の形見である壊れた懐中時計を直し、止まってしまった自分の時間を取り戻したい。
  relationships:
  - name: 蓮見 琥珀
    relation: 師弟のような関係。導き手。
  - name: 凪沙 栞
    relation: 年齢の近い友人であり、共感し合う仲間。
  arc: 他人の心の傷を癒やす手助けをすることで、自分自身の喪失感を受け入れ、自分の意志で歩き出す強さを得る。
- name: 蓮見 琥珀
  role: 相棒/導き手
  age: 65
  gender: 男性
  appearance: 銀色の髪を丁寧に整え、丸眼鏡をかけた穏やかな老紳士。常に清潔な白いエプロンを着用している。
  personality: 温厚で包容力があり、相手の心に寄り添う名人。少し浮世離れした雰囲気を持つ。一人称は「私」。
  speech_style: ゆっくりとした心地よいリズムで、比喩を用いた詩的な表現を好む。
  background: 雨の日だけ開店する時計店『雨音堂』の店主。単に機械を直すだけでなく、持ち主の記憶や感情を整える特別な技術を持つ。
  motivation: 訪れる人々が過去の執着を手放し、前を向いて生きられるようにサポートすること。
  relationships:
  - name: 瀬戸 結衣
    relation: 助手として迎え入れた、大切な教え子。
  - name: 潮見 健三
    relation: 気心の知れた旧友。
  arc: 結衣の純粋な視点に触れることで、自身が抱えていたある種の孤独や諦念が癒やされていく。
- name: 凪沙 栞
  role: 脇役/物語の転換点
  age: 24
  gender: 女性
  appearance: 明るい茶色の髪をゆるく結び、水色のワンピースを着ている。常にスケッチブックを持ち歩いている。
  personality: 外向きには明るく快活だが、内面には強い完璧主義と挫折感を抱えている。一人称は「私」。
  speech_style: 快活で早口だが、核心に触れるときは急に静かになり、寂しげなトーンになる。
  background: 元は画家を目指していたが、ある出来事をきっかけに筆を折った。止まったままのオルゴールを修理しに来店する。
  motivation: 過去に果たせなかった「小さな約束」に区切りをつけ、もう一度絵を描きたいと思うこと。
  relationships:
  - name: 瀬戸 結衣
    relation: 悩みを持つ年下の友人として、精神的な支えになる。
  arc: 結衣と共に思い出に向き合うことで、失敗した過去をも自分の色として受け入れ、再び筆を取る。
- name: 潮見 健三
  role: 脇役/町の象徴
  age: 72
  gender: 男性
  appearance: 日焼けした肌に深い皺。使い込まれた漁師の作業着を着こなす、体格の良い老人。
  personality: ぶっきらぼうで口は悪いが、情に厚く、町の人々に深く信頼されている。一人称は「俺」。
  speech_style: 粗野な港町の方言が混じる、ぶっきらぼうで力強い話し方。
  background: 地元で長く漁師をしている。町の歴史や人々の過去に詳しく、『雨音堂』の不思議な性質を理解している数少ない人物。
  motivation: 静かな港町の平穏を守り、迷い込んだ若者たちが正しく成長することを見守ること。
  relationships:
  - name: 蓮見 琥珀
    relation: 対照的な性格ながら、深い信頼で結ばれた親友。
  - name: 瀬戸 結衣
    relation: 孫のように可愛がり、時に厳しく背中を押す。
  arc: 結衣が成長していく姿を見て、自分自身の人生における「忘れかけていた情熱」を思い出す。
