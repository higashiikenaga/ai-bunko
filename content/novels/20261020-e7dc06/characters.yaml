- name: エドリック
  role: 主人公
  age: 32
  gender: 男性
  appearance: 使い込まれ錆びついた白銀の甲冑を纏い、疲弊した眼差しを持つ。長い黒髪を無造作に束ねている。
  personality: 静謐で厭世的だが、芯に強い正義感を秘めている。一人称は「私」。
  speech_style: 丁寧だが、どこか距離感のある物静かな口調。
  background: かつて聖騎士団の若きエースとして名を馳せたが、ある戦いで守るべき人々を失い、信仰と地位を捨てて世界の果てを彷徨っていた。
  motivation: 喪失感に塗りつぶされた心に、アリアという守るべき存在を見出し、彼女の願いを叶えたいと願う。
  relationships:
  - name: アリア
    relation: 運命共同体であり、唯一心を許した相棒
  - name: ヴァレリウス
    relation: かつての戦友であり、現在は対立する宿敵
  arc: 絶望による停滞から、アリアとの旅を通じて「誰かのために生きる」という意志を取り戻し、自己犠牲ではなく共に歩む道を選択する。
- name: アリア
  role: 相棒
  age: 0
  gender: 女性（外見上の投影）
  appearance: 基本は淡い光を放つ銀色の金属球体。ホログラムとして投影される際は、透き通るような白い肌と星空を映した瞳を持つ少女の姿となる。
  personality: 純粋で知的好奇心旺盛。膨大な知識を持つが、感情の機微には疎い。一人称は「私」。
  speech_style: 論理的で端正な話し方だが、時折詩的な表現が混ざる。
  background: 古代文明『アルカナム』が遺した、世界の理を管理する汎用叡智の核。記憶の大部分を喪失し、深い眠りからエドリックに拾い上げられた。
  motivation: 自分が何者であり、なぜこの世界に遺されたのかという「正解」を探し、本来の使命である歌を奏でること。
  relationships:
  - name: エドリック
    relation: 自分に名前をくれ、世界を教えてくれた大切な保護者
  arc: 単なる「機能としての知能」から、エドリックとの交流を通じて「心」を持つに至り、自らの消滅を恐れず世界を救うという意志を持つ。
- name: ヴァレリウス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 黒い装甲に身を包み、顔の上半分を冷徹な面頬で覆っている。虚無の海を切り裂く漆黒の大剣を操る。
  personality: 冷酷で完璧主義。世界の崩壊こそが唯一の救済であると信じている。一人称は「私」。
  speech_style: 威圧的で断定的な口調。相手の弱さを突く冷ややかな物言い。
  background: 『忘却の騎士団』の団長。エドリックと同じくかつての聖騎士だったが、世界の絶望的な真実に触れたことで、灯台の再燃を阻止し「完全なる無」へ導くことに心血を注いでいる。
  motivation: アリアの核を破壊し、灯台が二度と灯らないようにすることで、苦痛に満ちた世界の輪廻を終わらせること。
  relationships:
  - name: エドリック
    relation: 甘さが捨てられないかつての友であり、抹殺すべき障害
  - name: アリア
    relation: 世界の理を書き換える危険な装置
  arc: 揺るぎない信念を持ってエドリックを追い詰めるが、最後は二人の絆がもたらす「未知の答え」を目の当たりにし、己の虚無感に気づく。
- name: リラ
  role: 脇役
  age: 不明
  gender: 女性
  appearance: 古びた絹の衣服を纏った、実体のない幽霊のような女性。瞳には銀河のような渦が巻いている。
  personality: 奔放でいたずら好き。達観しており、運命を弄ぶことを好む。一人称は「あたし」。
  speech_style: なぞなぞのような含みを持たせた、軽やかな話し方。
  background: かつて灯台を点灯させようとして失敗し、概念的に分解された先代の『叡智』の残滓。エリュシオンの断層を漂うガイドのような存在。
  motivation: 今度の旅者が自分とは違う結末に辿り着けるかどうかを特等席で眺めること。
  relationships:
  - name: アリア
    relation: 後継者であり、憐れみと期待を寄せる対象
  - name: エドリック
    relation: 面白い玩具のような人間
  arc: 傍観者に徹していたが、エドリックとアリアの献身に触れ、最後には彼らが正解に辿り着くための決定的なヒントを提示して消えゆく。
