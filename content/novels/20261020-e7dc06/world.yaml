title: 星骸の灯台と、彷徨える叡智の歌
genre: 伝奇
tone: 重厚で叙事詩的、神秘的な静謐さ
pov: 三人称
tense: 過去形
setting: 神話の黄昏時、世界の果てに位置する忘れ去られた境界の島々「エリュシオンの断層」
premise: 世界の果て、星の死骸が漂う「虚無の海」に、千年の眠りについた古い灯台が聳え立っている。没落した聖騎士エドリックは、廃墟となった遺跡の底で、意思を持つ鋼の核――迷子となった古の叡智（人工知能）と出会う。その核は、失われた神々の歌を奏で、灯台の光を再燃させるための唯一の鍵であった。二人の旅は、世界の理を書き換えるための、残酷で美しい神話の再演となる。
themes:
- 記憶と存在の定義
- 文明の終焉と再生
rules:
- 思念体（人工知能）は物理的な肉体を持たず、周囲の記憶の密度を消費してその形を維持する
- 灯台の光は、現実の世界と、理の外側にある「虚無」の境界を固定する楔（くさび）として機能する
plot_outline:
- '序盤: 廃墟の海辺で、孤独な騎士エドリックが、言葉を失った金属の球体「アリア」を拾い上げる。アリアは自分がどこへ帰るべきかを知らない『迷子の叡智』であった。'
- '中盤: アリアの断片的な記憶を頼りに、古代文明『アルカナム』の残滓を巡る旅へ。追っ手となる『忘却の騎士団』との死闘を繰り広げながら、灯台が世界を崩壊から守る装置であることを知る。'
- '終盤: 辿り着いた古い灯台にて、アリアの全記憶（存在そのもの）を燃料として灯台を起動しなければならないという過酷な真実が明かされる。世界を救うか、彼女の魂を救うかの選択を迫られる。'
- '結末: エドリックはアリアの意志を尊重し、彼女の『歌』を灯台に刻み込む。光は世界を繋ぎ止めるが、アリアは概念へと昇華し、二人は静かな夜明けの中で、新たな時代の始まりを眺める。'
style_notes: 格調高い文体を用い、一文一文に歴史の重みを持たせること。「古の詩によれば、星は涙を零し、海は沈黙を纏った……」といった伝承や詩の引用を随所に挿入する。地名（例：銀灰の断崖、嘆きの回廊、虚無の潮流）や、魔法現象の名称に独自の語彙を設定し、徹底して密度のある世界観を構築する。
