- name: 名無しの猫さん
  role: 主人公
  age: 0
  gender: 不詳
  appearance: 真っ白でふわふわな毛並み。首に小さな銀色の鈴をつけているが、音は鳴らなくなった古びたもの。
  personality: 控えめで心優しい。記憶がないことに不安を抱えているが、好奇心は強い。一人称は「ぼく」。
  speech_style: 「〜です」「〜でしょうか」と丁寧で、少し自信なさげな話し方。
  background: ある日、記憶を失った状態で「ふわふわ王国」に迷い込んだ。自分が誰で、どこから来たのかを思い出したいと願っている。
  motivation: 自分の本当の名前を取り戻し、「約束の丘」で待っている大切な誰かと再会すること。
  relationships:
  - name: スプーン君
    relation: 旅を共にする最高の親友
  - name: ルナ・マダム
    relation: 心と胃袋を満たしてくれた恩人
  arc: 自分は何者でもないという孤独感から脱却し、旅を通じて得た絆を自信に変え、新しい名前を受け入れる。
- name: スプーン君
  role: 相棒
  age: 5
  gender: 男性
  appearance: ピカピカに磨かれた小さな銀色のデザートスプーン。小さな手足があり、ちょこちょこと素早く動く。
  personality: 天真爛漫でポジティブ。おせっかいなほど親切で、誰かを元気づけることが大好き。一人称は「ぼく」。
  speech_style: 「〜だよ！」「〜だね！」と語尾に元気が溢れる快活な話し方。
  background: 魔法のパン屋さんで使われている道具。店内で聞くたくさんのお話に憧れ、いつか外の世界を冒険することを夢見ていた。
  motivation: 猫さんを助けて笑顔にすること。そして、世界中の「美味しいお話」を集めてパン屋さんに持ち帰ること。
  relationships:
  - name: 名無しの猫さん
    relation: 守ってあげたい大切な相棒
  - name: ルナ・マダム
    relation: 慕っている主人
  arc: ただの「便利な道具」である自分から、誰かの人生に寄り添い、勇気づける「かけがえのない友人」へと成長する。
- name: ルナ・マダム
  role: 脇役/導き手
  age: 80
  gender: 女性
  appearance: 三日月のような淡い黄色のドレスを纏った、ふくよかで穏やかな女性。常に甘い香りを漂わせている。
  personality: 包容力に溢れ、どんな悩みも優しく受け止める。物語を愛し、パンに込める魔法を大切にしている。一人称は「私」。
  speech_style: 「あらあら」「〜ですよ」とゆったりとした、おっとりした話し方。
  background: 雲の上のパン屋さんの店主。客が語る人生の物語を材料にして、食べた人の心を癒やす魔法のパンを焼いている。
  motivation: 訪れる人々が心を満たし、前向きな気持ちでそれぞれの目的地へ向かえるようサポートすること。
  relationships:
  - name: 名無しの猫さん
    relation: 温かく見守る保護者のような存在
  - name: スプーン君
    relation: 信頼している店の手伝い
  arc: 旅立つ二人を送り出すことで、魔法は店の中だけでなく、世界へ広がっていくことを確信する。
- name: 星屑のフクロウ
  role: 脇役/試練の番人
  age: 500
  gender: 男性
  appearance: 夜空のように深い青色の羽を持ち、翼を広げると小さな星が瞬いている巨大なフクロウ。
  personality: 厳格で理屈っぽいが、根は寂しがり屋で純粋な心に弱い。一人称は「私」。
  speech_style: 「ふむ」「〜であるな」と古風で威厳のある話し方。
  background: 「約束の丘」の門番。丘に辿り着こうとする者が、本当に名前を求めるにふさわしい心を持っているかを試す役目を担っている。
  motivation: 丘の静寂を守ること。同時に、自分の心をも動かすような真実の絆を持つ旅人に会いたいと密かに願っている。
  relationships:
  - name: 名無しの猫さん
    relation: 試練を与える相手から、認め合う友人へ
  arc: 二人の無償の友情に触れ、形式的な「資格」よりも「心」が大切であることに気づき、彼らの道を切り拓く。
