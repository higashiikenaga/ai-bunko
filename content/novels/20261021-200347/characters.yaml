- name: エラス・ノア
  role: 主人公
  age: 27
  gender: 男性
  appearance: 無機質な灰色の制服を完璧に着こなし、感情の読めない整った顔立ち。瞳には常に数値データが投影されている。
  personality: 理性的で規律を遵守する。一人称は「私」。数値化された安定こそが幸福であると信じている。
  speech_style: 簡潔で論理的な口調。感情的な形容詞を極力排除して話す。
  background: 市民監視局のエージェント。調和指数の逸脱を検知し、修正することを職務とするエリュシオンの模範的市民。
  motivation: システムの不具合（ノイズ）を排除し、完璧な秩序を維持すること。
  relationships:
  - name: ライラ・ヴェイル
    relation: 監視対象から、世界の真実を共有する共鳴者へ
  - name: ディレクター・ヴァレリウス
    relation: 絶対的な正義を体現する上司であり、畏怖の対象
  arc: 完璧な秩序への盲信から、不完全で不純な「感情」こそが人間性の本質であると気づき、静かな抵抗へと向かう。
- name: ライラ・ヴェイル
  role: 相棒/導き手
  age: 23
  gender: 女性
  appearance: 管理都市では禁じられている色彩豊かな古着を纏い、瞳にわずかな「揺らぎ」がある。常に何かを企んでいるような不敵な笑みを浮かべている。
  personality: 奔放で皮肉屋。一人称は「私」。システムに適合できないことを誇りに思っている。
  speech_style: 比喩表現が多く、エラスの論理的な思考を揺さぶるような挑発的な話し方。
  background: システムの盲点に潜伏する「不適合者」。氷の城の入り口と、凍結された記憶の扱い方を知る数少ない生存者。
  motivation: 凍結された記憶を解凍し、人々に「痛み」と「愛」という不純な感情を取り戻させること。
  relationships:
  - name: エラス・ノア
    relation: 退屈な日常における最高の玩具であり、唯一の理解者
  - name: ディレクター・ヴァレリウス
    relation: 秩序という名の檻を作った憎悪の対象
  arc: 孤独な破壊活動に絶望していたが、エラスという「内側から揺らぐ人間」が現れたことで、希望を託すようになる。
- name: ディレクター・ヴァレリウス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 純白の法衣のような衣服。常に穏やかな微笑みを湛えているが、その眼差しは冷徹で全てを見透かしている。
  personality: 極めて慈悲深く、同時に残酷な功利主義者。一人称は「私」。平和のためには少数の犠牲や記憶の抹消は不可避だと考えている。
  speech_style: 穏やかで諭すような、絶対的な権威を持つ口調。
  background: エリュシオンの管理システムの設計に関わった最高責任者。かつて感情による大戦争を経験し、それを根絶することを人生の目的とした。
  motivation: 一切の不純物を排除した、永遠に静止した平和な世界を維持すること。
  relationships:
  - name: エラス・ノア
    relation: 自分の理想を継承させるべき完璧な後継者候補
  - name: ライラ・ヴェイル
    relation: 排除されるべきシステム上のエラー
  arc: 揺るぎない正義を信じているが、エラスという「計算外の変数」によって、自身の構築した秩序に微かな亀裂が入ることに気づく。
- name: ミオ
  role: 脇役/鍵となる記憶
  age: 17
  gender: 女性
  appearance: 氷の結晶の中に閉じ込められた、儚げな少女の姿。時折、ノイズ混じりのホログラムとして現れる。
  personality: 純粋で情熱的。一人称は「私」。激しい悲しみと、それを上回る誰かへの思慕を抱えている。
  speech_style: 断片的で詩的な話し方。言葉の端々に強い感情が漏れ出している。
  background: かつて「不純な感情」が強すぎたために、氷の城に記憶を強制的に切り離され、凍結保存された少女。
  motivation: 自分が存在した証（記憶）を誰かに受け止めてもらうこと。
  relationships:
  - name: エラス・ノア
    relation: 凍結された自分の魂に触れ、共鳴してくれた唯一の人間
  arc: 凍結された静止状態から、エラスを通じて一時的に「生」の感覚を取り戻し、彼に人間としての情動を伝えた後、静かに昇華する。
