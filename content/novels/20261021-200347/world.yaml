title: 零度の静謐、あるいは虚偽の秩序
genre: SF
tone: 静かな絶望と、冷徹な管理社会の質感
pov: 三人称
tense: 過去形
setting: 人工的な恒常性が保たれた管理都市「エリュシオン」。月が完全に影に隠れる「大月食」が周期的に訪れる世界。
premise: 全ての感情が「調和指数」として数値化され、逸脱が許されない管理社会。監視員のエラスは、規定の範囲内で完璧に生活をこなす無機質な市民の一人である。しかし、周期的な大月食の最中、彼は管理システムの盲点である「氷の城」と呼ばれる極低温の記憶保管庫の存在を知る。そこに隠されていたのは、システムが切り捨てた「不純な感情」の断片だった。
themes:
- 個人の尊厳と管理の対立
- 忘却による平和の是非
rules:
- 全ての思考はログとして記録され、規定値を超えると再教育対象となる
- 月食の間は、システムの再起動に伴い全市民が休止状態に入らなければならない
- 『秩序こそが生存の律動である』という標語を日常的に唱唱すること
plot_outline:
- '序盤: 完璧な秩序の中で、規定のルーチンをこなすエラスの日常。彼は世界の美しさを「数値による安定」として受け入れている。'
- '中盤: 大月食の最中、システムの隙間から漏れ出した「ノイズ」に触れる。彼は禁止されている『感覚の記憶』を追ううちに、都市の地下に存在する極低温のデータセンター、通称『氷の城』へと辿り着く。'
- '終盤: 氷の城で、彼はかつて人間であった者たちの、凍結された生々しい記憶の奔流に直面する。管理社会の平和は、人々の痛みを凍結して隠蔽することで成り立っていた。'
- '結末: エラスはシステムを破壊するような大それたことはしない。ただ、管理ログの中に、誰にも気づかれないほど小さな、しかし確かな『不純な揺らぎ』を一つだけ書き込み、静かに、しかし決定的な抵抗を始める。'
style_notes: 淡々とした、感情を排した記述を徹底する。管理社会の細部（デバイスの質感、規則の文言、数値の変化）を執拗に描き、読者に圧迫感を与える。劇的な展開においても、語り口は常に一定の温度を保ち、不気味な静寂を演出すること。
