- name: 瀬戸 蓮
  role: 主人公
  age: 18
  gender: 男性
  appearance: 端正な顔立ちだが、どこか生気のない目。痩せ型だが、ラグビーで鍛えられたしなやかな筋肉を持つ。
  personality: 冷笑的で自己嫌悪が強い。他人に期待せず、自分を「終わった人間」だと思い込んでいる。一人称は「俺」。
  speech_style: 突き放すような、抑揚の少ない淡々とした話し方。
  background: かつては全国屈指の強豪校で「天才司令塔」と称されたが、怪我と挫折によりラグビーを捨て、逃げるように故郷の工場地帯へ戻ってきた。
  motivation: ラグビーを再び始める理由を探すこと、そして自分を否定した世界への復讐。
  relationships:
  - name: 梶原 剛
    relation: チームメイトであり、衝突を繰り返す理解者
  - name: 佐伯 結衣
    relation: 雨の日の店主であり、心の拠り所
  arc: 虚無感に支配された生活から、泥にまみれる痛みを受け入れ、再び勝利への渇望を取り戻していく。
- name: 梶原 剛
  role: 相棒
  age: 19
  gender: 男性
  appearance: 熊のように大きく、無骨な体躯。顔には古い傷跡があり、常に泥にまみれている。
  personality: 猪突猛進で直情的。言葉よりも行動で示すタイプ。一人称は「俺」。
  speech_style: 荒々しく、ぶっきらぼうで威圧感がある。
  background: 地元の工場で働く労働者。社会から「はみ出し者」として扱われることに慣れており、ラグビーだけが唯一の解放の場であると考えている。
  motivation: バラバラなメンバーをまとめ上げ、この街の底辺から這い上がること。
  relationships:
  - name: 瀬戸 蓮
    relation: 才能を認めつつも、その臆病さを激しく嫌うライバル的存在
  arc: 個人の力による突破だけでなく、チームとして「戦術」を理解し、真のリーダーへと成長する。
- name: 佐伯 結衣
  role: 脇役
  age: 23
  gender: 女性
  appearance: 落ち着いた雰囲気を持つ、どこかミステリアスな女性。雨の日の喫茶店の店主。
  personality: 包容力があり、他人の痛みに敏感。全てを見透かしているような静かな強さを持つ。一人称は「私」。
  speech_style: 穏やかで丁寧だが、時に核心を突く鋭さがある。
  background: かつて音楽家を目指していたが、挫折して街を離れず、雨の日だけ開店する奇妙な店を営んでいる。
  motivation: 居場所を失った者たちが、再び歩き出すための「止まり木」を守ること。
  relationships:
  - name: 瀬戸 蓮
    relation: 挫折を知る者として、言葉を交わさずとも通じ合う関係
  arc: 傍観者として彼らを見守る立場から、彼らの戦いを通じて自分自身の情熱を再燃させていく。
- name: 九条院 怜
  role: 敵役
  age: 18
  gender: 男性
  appearance: 完璧に整えられた髪、非の打ち所がない洗練された体躯。エリート校の誇りを感じさせる佇まい。
  personality: 冷徹で合理的。ラグビーを「勝利のための数学的最適解」と考えている。一人称は「僕」。
  speech_style: 優雅で丁寧だが、相手を格下として扱う選民思想的な響きがある。
  background: 全国制覇を約束された超名門校の主将。完璧な戦術と育成システムによって作られた「ラグビーの結晶」のような存在。
  motivation: 完璧なラグビーを体現し、不純物なもの（泥臭い感情や偶然性）を排除すること。
  relationships:
  - name: 瀬戸 蓮
    relation: かつての天才としての執着と、泥にまみれた現状への軽蔑
  arc: 予測不能な「泥臭い執念」に直面し、自身の信じる完璧な理論が崩れる恐怖と戦う。
