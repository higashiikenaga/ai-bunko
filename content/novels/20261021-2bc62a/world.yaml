title: 泥濘の鉄線
genre: スポーツ青春
tone: 硬派、ストイック、加速感のあるアクション
pov: 一人称（俺）
tense: 過去形
setting: 錆びついた工場地帯が広がる地方都市。泥濘にまみれたラグビー場。
premise: 挫折して故郷に逃げ帰った俺は、泥にまみれて勝ち方を忘れた底辺のラグビーチームに拾われる。雨の日だけ開店する得体の知れない店で出会ったのは、社会に居場所のないはみ出し者たちだった。渡り鳥が北へ帰る季節、俺たちは再び地面を蹴り、絶望の淵から頂点へと突き進む。
themes:
- 再起
- 不器用な連帯
rules:
- 試合は泥濘の中での激突を厭わない肉弾戦であること
- 雨の日だけ開く店『雨宿り』は、選手たちが本音を晒す唯一の聖域であること
- 戦術よりも個の突破力と、仲間を信じて体を張る献身を重視する
plot_outline:
- '序盤: かつての天才と称されながら失脚し、工場街へ戻った俺が、なりふり構わぬ弱小チームの勧誘を受ける。'
- '中盤: 寄せ集めのメンバーと衝突を繰り返すが、雨の日だけ開く店で互いの傷を晒し合い、奇妙な信頼関係を築く。'
- '終盤: 完璧な戦術を誇るエリート校との最終決戦。豪雨の中、泥にまみれた俺たちは肉体の限界を超えて激突する。'
- '結末: 勝利という結果以上に、戦い抜いた誇りと仲間を得た俺たちが、次なる人生の地平へと歩き出す。'
style_notes: 短文を畳み掛け、速度感を出す。擬音（ドカッ、ガシャン等）を一切禁止し、「砕く」「穿つ」「叩きつける」などの強い動詞で衝撃を描写する。試合や衝突の直前には、必ず静寂や呼吸、視界の狭まりなどの静かな描写を挿入し、緊張感を最大化させる。一人称「俺」による無骨な語り口を徹底する。
