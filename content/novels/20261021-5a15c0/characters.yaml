- name: 凪野 奏（なぎの かなで）
  role: 主人公
  age: 28
  gender: 女性
  appearance: 少し長めの黒髪を緩く結んでいる。常に落ち着いた色合いのゆったりとした服を着ており、眼鏡の奥の瞳は穏やかだが観察眼が鋭い。
  personality: 静かで思慮深く、他人の感情の機微に敏感。一人称は「私」。効率重視の社会に違和感を持ち、あえて手間のかかる仕事を好む。
  speech_style: 丁寧で落ち着いた口調。相手のペースを乱さないよう、ゆっくりと話す。
  background: 記憶整理士。街の片隅で小さな記憶整理店を営んでいる。高度に管理されたライフログ社会の中で、あえて「忘れること」の意義を探している。
  motivation: 依頼された老人の奇妙な遺言の真意を解き明かし、彼が望む「最善の忘却」を実現すること。
  relationships:
  - name: 佐伯 誠一
    relation: 依頼人（老人）
  - name: 佐伯 陽菜
    relation: 依頼人の娘
  arc: 便利さと引き換えに失われた「喪失の重み」や「不完全さの美しさ」を再認識し、自身の仕事に対する確信を深める。
- name: 佐伯 誠一（さえき せいいち）
  role: 脇役（重要依頼人）
  age: 82
  gender: 男性
  appearance: 深く刻まれた皺が人生の豊かさを物語る、痩身だが背筋の伸びた老人。穏やかだが、どこか諦観を帯びた瞳をしている。
  personality: 真面目で責任感が強く、家族を深く愛している。一人称は「私」。一見頑固に見えるが、実は非常に繊細な優しさを持つ。
  speech_style: 物静かで控えめ。言葉を選びながら、一言一言を噛み締めるように話す。
  background: 元教師。人生の終末期にあり、自分の意識のバックアップを整理する過程で、娘の将来のためにあえて「幸福な記憶」を消去するという逆説的な依頼をする。
  motivation: 娘が「完璧な親」という呪縛から解き放たれ、一人の人間として自由に生きていけるようにすること。
  relationships:
  - name: 凪野 奏
    relation: 記憶整理士
  - name: 佐伯 陽菜
    relation: 娘
  arc: 自らの生きた証を整理する過程で、愛する者のために「あえて忘れてもらう」という究極の愛を完遂する。
- name: 佐伯 陽菜（さえき ひな）
  role: 脇役
  age: 24
  gender: 女性
  appearance: 整った容姿だが、どこか疲れを感じさせる表情。常にスマートデバイスを意識し、完璧なログを残そうとする傾向がある。
  personality: 真面目で努力家。常に「正解」を求め、親の期待に応えようと自分を追い込む性質がある。一人称は「私」。
  speech_style: 理知的で明快。感情を露わにすることを避ける、少し硬い話し方。
  background: 誠一の娘。デジタル化された完璧な思い出に囲まれて育ち、失敗や空白を恐れる現代的な青年。
  motivation: 父の遺した記憶を整理し、彼の人生を「正しく」継承すること。
  relationships:
  - name: 佐伯 誠一
    relation: 父
  - name: 凪野 奏
    relation: 父の記憶整理士
  arc: 父が意図した「不完全な記憶」に触れることで、完璧主義の呪縛から解放され、自身の不完全さを受け入れ始める。
