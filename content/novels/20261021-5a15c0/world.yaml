title: あしたの記憶を、予約します
genre: 日常ほのぼの
tone: 淡々とした静謐さの中に、温かさと切なさが同居する空気感
pov: 三人称近接
tense: 過去形
setting: 20年後の地方都市。意識のバックアップやライフログの保存が一般的になったが、あえて「忘れ方」を重視する人々が暮らす静かな街。
premise: 記憶の編集・整理を請け負う小さな店を営む主人公。ある日、人生の終末期にある老人から「娘に遺す記憶から、幸せな思い出だけを消してほしい」という奇妙な遺言を託される。記憶を一つずつ辿る中で、便利すぎる世界で失われた「喪失の価値」に気づいていく物語。
themes:
- 忘却の肯定
- 不完全な絆
rules:
- 記憶の抽出・編集は認定資格を持つ専門職のみが可能であること
- 完全に消去した記憶は、バックアップを含め二度と復元できないこと
- 意識のバックアップは存在するが、個人の感情的な『ゆらぎ』や直感までは完全に再現できず、あくまで記録の集積であること
plot_outline:
- '序盤: 記憶整理士の主人公が、日常的に人々のライフログを整理する様子と、夜明けにだけ流れる低周波の古いラジオ番組を聴く習慣が描かれる。'
- '中盤: 老人から「幸せな記憶の消去」という依頼を受け、彼の人生を追体験する。効率的に管理された現代の記憶とは違う、不器用で曖昧な、しかし体温のある過去の断片に触れていく。'
- '終盤: 老人がなぜ幸せな記憶を消そうとしたのか、その真意が明らかになる。それは娘が抱える「完璧すぎる親」へのプレッシャーを解き、彼女が自分自身の人生を肯定するための、不完全な遺言だった。'
- '結末: 記憶の一部をあえて残すことで、娘が自らの足で歩き出すきっかけを作る。主人公は夜明けのラジオを聴きながら、誰にも記録されない『今』という瞬間の心地よさを噛み締める。'
style_notes: ウェアラブルデバイスやホログラムなどのガジェットを、あたかも古くなった家電のように日常的に描写する。技術的な説明を台詞でせず、動作や風景の描写にさりげなく混ぜ込むことで、近未来の生活の手触りを演出する。
