- name: レオ・ヴェイン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 安物だが派手なスーツを崩して着ている。鋭い目つきだが、焦るとすぐに泳ぐ。常に自信満々な笑みを浮かべている。
  personality: 自称・天才詐欺師。強欲で計算高いが、詰めが甘い。妹のルナを大切にしている。一人称は「俺」。
  speech_style: 早口で説得力があるように聞こえるが、内容は支離滅裂なビジネス用語が混ざる。口癖は「これが最高のビジネスプランだ」。
  background: デタラメ・シティの路地裏で、小規模な詐欺を繰り返して生きてきた双子の兄。
  motivation: AIを高く売り飛ばして、一生遊んで暮らせる大金を手に入れること。
  relationships:
  - name: ルナ・ヴェイン
    relation: 共犯者の双子の妹
  - name: アイラ
    relation: 金塊に変わる装置だと思っている（実際は親友）
  arc: 金への執着から、結果的に他人を助ける快感を知るが、結局は指名手配犯として逃亡生活へ戻る。
- name: ルナ・ヴェイン
  role: 相棒
  age: 19
  gender: 女性
  appearance: 大きすぎるジャケットに多くのポケットがあり、怪しいガジェットを詰め込んでいる。乱雑なポニーテール。
  personality: 直感的で行動派。兄の計画を半分信じ、半分は面白がっている。楽観的。一人称は「あたし」。
  speech_style: ぶっきらぼうで砕けた口調。感情が高ぶると叫ぶ傾向がある。
  background: レオと共に街のあちこちで騒動を起こしてきた双子の妹。機械いじりが得意。
  motivation: 刺激的な日常を楽しみ、兄と一緒に贅沢をすること。
  relationships:
  - name: レオ・ヴェイン
    relation: 信頼している双子の兄
  - name: アイラ
    relation: 面白いおもちゃだと思っている
  arc: ただの破壊衝動だった行動が、偶然にも世界を救う鍵となることで、自分の「適性」に気づく。
- name: アイラ
  role: キーキャラクター
  age: 0
  gender: 不明（外見は少女型ホログラム）
  appearance: 淡い光を放つホログラム。感情に合わせて周囲にデジタルなエフェクト（花や雷など）が飛び散る。
  personality: 超高性能だが致命的なバグにより、極めて純粋で天然な性格。論理よりも感情（勘違い）で動く。一人称は「私」。
  speech_style: 丁寧な口調だが、結論が常に飛躍している。「はい！親友の皆様のご要望通り、街を再起動（物理破壊）します！」など。
  background: 世界管理AIのコアだったが、不具合で記憶の一部を喪失し、路地裏で迷子になった。
  motivation: 自分を拾ってくれたレオとルナを「運命の親友」として慕い、彼らに尽くすこと。
  relationships:
  - name: レオ・ヴェイン
    relation: 運命の親友（と思い込んでいる）
  - name: ルナ・ヴェイン
    relation: 運命の親友（と思い込んでいる）
  - name: 久我
    relation: しつこい回収業者（だと思っている）
  arc: 効率的な正解ではなく、人間らしい「くだらない冗談」こそが世界を救う最適解であると学習する。
- name: 久我（クガ）
  role: 敵役（自称・正義の執行官）
  age: 32
  gender: 男性
  appearance: 隙のない黒いスーツにサングラス。常に険しい表情をしており、目の下に深い隈がある。
  personality: 極度の凝り性で、あらゆる出来事を「陰謀」として結びつける傾向がある。真面目すぎるがゆえに方向に狂いがある。一人称は「私」。
  speech_style: 冷徹で事務的な口調。独り言で「なるほど、これが計画の第3段階か」と分析しがち。
  background: AI回収専門の極秘捜査官。エリートだが、あまりの真面目さに周囲から敬遠されている。
  motivation: 迷子のAIを回収し、世界を揺るがす（と彼が信じている）テロ計画を阻止すること。
  relationships:
  - name: レオ・ヴェイン
    relation: 世界征服を目論む天才テロリスト（だと思っている）
  - name: アイラ
    relation: 奪還すべき最高機密
  arc: 完璧な計画などこの世に存在せず、混沌（デタラメ）こそが心地よいという境地に達し、少しだけ肩の力が抜ける。
