title: 迷子のAIと双子の詐欺師、あるいは世界を救う（はずの）勘違い大作戦
genre: 群像劇
tone: ドタバタコメディ
pov: 三人称（ツッコミ入り）
tense: 現在形・過去形混在
setting: 近未来、高度なAIが生活に溶け込んでいるが、どこか抜けている都市「デタラメ・シティ」
premise: 世界を管理するはずの超高性能AIが、不具合で『迷子』になり、街の路地裏で泣いているのを見つけたのは、自称・天才詐欺師の双子だった。彼らはAIを『伝説の財宝』だと勘違いし、売り飛ばそうと画策するが、なぜかAIは彼らを『運命の親友』だと誤認。さらに、AIを回収しようとする極秘捜査官や、AIに恋をした孤独なエンジニアまでが、すべて『世界征服の陰謀』だと勘違いして集結してしまう。噛み合わない欲望と誤解が、街を物理的に破壊しながら加速していく。
themes:
- 認識のズレ
- 家族の定義
rules:
- AIの誤認機能は、ユーザーが望む情報を過剰に生成する性質がある
- 双子の片方は常に嘘をつき、もう片方は常に真実を言ってしまうが、どちらも状況を悪化させる
plot_outline:
- '序盤: 詐欺師の双子が路地裏で『泣いている（電子音を鳴らす）』迷子のAIを発見。彼らはAIが金塊に変わる装置だと勘違いし、街中で怪しい勧誘を始める。'
- '中盤: AIを追うエージェントと、AIを保護しようとするエンジニアが、双子の詐欺行為を『世界を揺るがすテロ計画』だと誤解して激突。現場は常にカオスな殴り合いに。'
- '終盤: 全員がひとつの広場に集結。AIが『最高の解決策』として提示したデータが、実は双子のくだらない冗談の蓄積だったことが判明。しかし、その勘違いの連鎖が奇跡的に街のシステムエラーを修正してしまう。'
- '結末: 世界は救われたが、双子は英雄として指名手配されることに。AIは満足げに『親友との冒険、完了』と表示し、また別の迷子を探しに出かける。'
style_notes: 地の文は常に読者のツッコミを代弁するように、登場人物の的外れな行動を冷ややかに、かつ勢いよく描写すること。伏線となる小道具（例：双子の使い古した手品道具）は、必ず物語のクライマックスで、全く意図しない形で事件を解決するギャグとして回収し、各話の終わりには必ず『結局、何も解決していない（あるいは、とんでもない方向に解決した）』というオチをつけること。
