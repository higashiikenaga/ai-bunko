- name: エリス・ローゼンタール
  role: 主人公
  age: 17
  gender: 女性
  appearance: 柔らかな桃色の髪と、春の陽だまりを思わせる温かな琥珀色の瞳。控えめだが気品のある立ち振る舞い。
  personality: 芯が強く、慈愛に満ちている。孤独を知るがゆえに他者の痛みに敏感。一人称は「私」。
  speech_style: 丁寧で穏やか。相手を敬う気持ちが言葉の端々に表れる。
  background: 季節の魔力を操る名家の一族だったが、禁忌とされる「春」の力を発現させたことで一族は没落。政略結婚として氷の城へ送られる。
  motivation: 凍てついた世界で、自分自身の居場所と、愛する人の心を溶かすこと。
  relationships:
  - name: アルフレート・フォン・ルナリス
    relation: 夫であり、孤独を分かち合う最愛の人
  arc: 力を隠して怯えていた少女から、自らの運命と「春」の力を受け入れ、愛のために世界を変える強き女性へ。
- name: アルフレート・フォン・ルナリス
  role: 主人公
  age: 20
  gender: 男性
  appearance: 透き通るような銀髪と、全てを凍らせるかのような鋭い氷青色の瞳。彫刻のように整った冷徹な美貌。
  personality: 極めて冷静沈着で、感情を表に出さない。周囲からは冷酷と恐れられているが、内面は深い孤独を抱えている。一人称は「私」。
  speech_style: 簡潔で威厳があり、無駄を削ぎ落とした冷ややかな口調。
  background: 帝国の王位継承権を持つ王子。「永遠の冬」の魔力を宿し、その力によって城も周囲も常に凍てついている。
  motivation: 呪われた力による孤独から解放され、真に守るべきものを見つけること。
  relationships:
  - name: エリス・ローゼンタール
    relation: 妻であり、凍てついた心を溶かした唯一の存在
  arc: 心を閉ざし、義務としてのみ生きる王族から、愛を信じ、自らの感情と共に運命を切り拓く一人の男へ。
- name: ヴァレリウス・ド・グラナード
  role: 敵役
  age: 35
  gender: 男性
  appearance: 整った顔立ちに常に薄笑いを浮かべているが、瞳の奥は冷酷。漆黒の軍服を完璧に着こなす。
  personality: 野心的で計算高く、目的のためには手段を選ばない。極めて紳士的な振る舞いの裏に、底知れない支配欲を隠している。一人称は「私」。
  speech_style: 優雅で洗練されているが、相手を心理的に追い詰めるような含みを持たせた話し方。
  background: 宮廷の有力な公爵。季節の魔力を独占することで、帝国の全権を握ろうと画策している。
  motivation: 「春」と「冬」の力を制御下に置き、絶対的な権力を確立すること。
  relationships:
  - name: アルフレート・フォン・ルナリス
    relation: 失脚させ、傀儡にしようとしている対象
  - name: エリス・ローゼンタール
    relation: 利用価値のある、あるいは排除すべき脅威
  arc: 完璧な策略家として君臨していたが、予測不能な「愛」という力によって計画が瓦解し、破滅へと向かう。
- name: クララ
  role: 脇役
  age: 18
  gender: 女性
  appearance: 栗色の髪を活発にまとめ、常に動きやすい装いをしている。明るい茶色の瞳。
  personality: 明るく快活で、忠誠心が強い。エリスの良き理解者であり、精神的な支えとなる。一人称は「私」。
  speech_style: はきはきとした、元気で親しみやすい話し方。
  background: エリスが氷の城に嫁いだ際に配属された侍女。城内の複雑な人間関係に詳しい。
  motivation: エリスがこの過酷な城で、心穏やかに過ごせるように尽力すること。
  relationships:
  - name: エリス・ローゼンタール
    relation: 親友であり、守るべき主
  arc: 単なる侍女という立場から、宮廷の陰謀に立ち向かうエリスの重要な協力者へと成長する。
