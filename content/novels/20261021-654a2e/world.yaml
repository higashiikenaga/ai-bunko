title: 桜舞う氷晶のワルツ
genre: 青春恋愛
tone: 絢爛豪華で耽美的な歴史ロマン
pov: 三人称
tense: 過去形
setting: 19世紀欧州を彷彿とさせる架空の帝国ルナリス。季節を司る魔力を持つ貴族が支配する宮廷社会。
premise: 「禁じられた春」の力を宿し、追放された令嬢エリスは、政略結婚により「永遠の冬」に閉ざされた氷の城の主、アルフレート王子のもとへ嫁ぐ。氷のように冷徹な王子と、陽だまりのような心を持つエリス。相反する二人は、宮廷に渦巻く残酷な陰謀に巻き込まれながらも、互いの孤独を溶かし合う運命に導かれていく。
themes:
- 相反する者の共鳴
- 運命への抗い
rules:
- 季節の魔力は血統に宿り、特定の貴族のみが天候を操作できる
- 氷の城は主の精神状態が結界として反映され、深い絶望は物理的な氷壁となって外界を遮断する
- 桜の花はルナリス帝国において禁忌の象徴であり、それを咲かせた者は反逆者として処刑される
plot_outline:
- '序盤: 没落し、禁忌の力を隠して生きるエリスが、冷酷と噂されるアルフレート王子のもとへ嫁ぎ、凍てついた氷の城での孤独な生活が始まる。'
- '中盤: 豪華絢爛な宮廷舞踏会にて、エリスの衣装に隠された桜の意匠が注目を集め、彼女の能力を危惧する権力者たちによる罠と、王子を失脚させようとする陰謀が激化する。'
- '終盤: 黒幕により氷の城が完全に封鎖され、絶望に飲み込まれそうになるアルフレート。エリスは自らの命を賭して禁忌の「桜」を咲かせ、王子の心を解き放つことで結界を打ち破る。'
- '結末: 氷の城に桜が舞い散るという奇跡が起き、二人は政治的なしがらみを越えて真実の愛を誓い合い、帝国に永き冬の終わりと新しい春をもたらす。'
style_notes: 宝石や絹、精緻なレースなど衣装の細部を贅沢に描写し、舞踏会の喧騒と静寂の対比を強調する。形容詞を多用した装飾的で優雅な文体を用い、切なくも華やかな宮廷の情景を綴る。
