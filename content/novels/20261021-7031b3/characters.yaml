- name: 瀬戸 陽葵
  role: 主人公
  age: 26
  gender: 女性
  appearance: 都会的な雰囲気の名残があるが、どこか疲れが見える細身の女性。髪は少し伸びたボブカット。
  personality: 真面目で責任感が強いが、繊細で傷つきやすい。一人称は「私」。
  speech_style: 丁寧だが、少し自信なさげで控えめな口調。
  background: 東京の広告代理店で働いていたが、過剰な業務と人間関係の摩擦により心身を壊し、逃げるように故郷へ帰郷した。
  motivation: 止まってしまった自分の時間を再び動かし、自分自身の居場所を見つけること。
  relationships:
  - name: 瀬戸 静子
    relation: 祖母
  - name: 瀬戸 健二
    relation: 祖父
  - name: 海野 蓮
    relation: 幼馴染
  arc: 挫折による自己否定から、料理と家族の記憶を通じて過去を肯定し、新しい人生を歩む決意をする。
- name: 瀬戸 静子
  role: 脇役（メンター）
  age: 72
  gender: 女性
  appearance: 温和な目元と、いつも清潔なエプロンが似合う、小柄でしっかりとした佇まいの女性。
  personality: おおらかで包容力があり、孫の心の揺れを静かに見守る。一人称は「私」。
  speech_style: 穏やかで、時折優しい方言が混じるリズムの良い話し方。
  background: 亡き夫と共に灯台守を務めていたが、現在は海岸沿いの家で静かに暮らしながら、ささやかな食卓を守っている。
  motivation: 陽葵が心身を癒やし、家族の歴史を次世代へ受け継いでいくこと。
  relationships:
  - name: 瀬戸 陽葵
    relation: 孫
  - name: 瀬戸 健二
    relation: 夫
  arc: 陽葵に家族の物語を語り継ぐことで、自身の人生の歩みを穏やかに肯定していく。
- name: 海野 蓮
  role: 脇役（サポート）
  age: 27
  gender: 男性
  appearance: 日焼けした肌と、海仕事で鍛えられた逞しい体格。屈託のない笑顔が特徴。
  personality: 明るく真っ直ぐで、裏表のない性格。一人称は「俺」。
  speech_style: 快活で、少し荒っぽいながらも温かみのある話し方。
  background: 地元の漁師。陽葵の幼馴染であり、彼女が都会へ出てから再会していなかった。
  motivation: 陽葵が町に馴染めるよう、自然な形で交流の機会を作ること。
  relationships:
  - name: 瀬戸 陽葵
    relation: 幼馴染
  arc: 陽葵の心の変化を一番近くで見守り、彼女が町の大切な一部であることを再認識させる。
- name: 望月 海斗
  role: 脇役
  age: 24
  gender: 男性
  appearance: 眼鏡をかけ、常に本を持ち歩いているような、少し知的な印象の青年。
  personality: 物静かで探究心が強い。少し理屈っぽいところがあるが、根は優しい。一人称は「僕」。
  speech_style: 丁寧で、論理的な話し方を好む。
  background: 町の小さな図書館の司書。古い文献や地域の歴史、天文学に詳しい。
  motivation: 星図の謎を解き明かし、町の失われつつある記憶を記録すること。
  relationships:
  - name: 瀬戸 陽葵
    relation: 星図の解読を手伝う協力者
  arc: 陽葵と共に星図の謎を追うことで、知識として知っていた歴史を「生きた記憶」として実感していく。
