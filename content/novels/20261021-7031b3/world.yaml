title: 潮風と、琥珀色の食卓
genre: 日常ほのぼの
tone: 静謐で温かく、時の流れを慈しむ雰囲気
pov: 三人称
tense: 過去形
setting: 現代。地方の静かな港町。古びた灯台が街を見守る海岸沿いの家。
premise: 都会での生活に疲れ、逃げるように故郷へ戻った陽葵は、そこで祖母が営む静かな食卓と、かつて灯台守だった祖父が遺した不思議な星図に出会う。日々の料理を通じて明かされる家族の記憶が、凍りついていた彼女の心をゆっくりと溶かしていく。失ったと思っていた時間は、実は温かい料理のように、ずっとそこにあったことに気づく物語。
themes:
- 家族の絆
- 自己再生
- 記憶の継承
rules:
- 劇的な事件は起こさず、季節の移ろいと料理を物語の主軸とする
- 祖父の星図は天文学的な地図ではなく、家族の思い出の場所と星を紐付けた「感情の地図」として扱う
- 会話は簡潔に留め、行間に長い年月と信頼関係を滲ませる
plot_outline:
- '序盤: 仕事に挫折し帰郷した陽葵が、祖母の家で古びた星図と、祖父が愛した家庭料理の数々に触れ、心身を休ませ始める。'
- '中盤: 季節の料理を一緒に作る中で、祖母から祖父が灯台守だった頃の苦労や、家族が乗り越えてきた静かな困難について聞かされる。'
- '終盤: 星図に記された「最後の目的地」が、今は使われなくなった古い灯台の麓にある、幼い頃に家族で訪れた思い出の場所であることに気づく。'
- '結末: 祖父が遺した言葉と料理の味に救われ、陽葵は過去の自分を肯定し、この町で緩やかに新しい人生を歩む決意をする。'
style_notes: 久我山灯子としての文体を徹底する。家族の再生をテーマに、静かで温かい三人称視点で描く。特に調理シーンにおいては、食材を切る音や煮立つ湯気などの五感描写を丁寧に重ね、そこに家族の歴史や思い出を自然に織り交ぜること。何気ない短い会話の中に、数十年の歳月と深い愛情が滲むような「間」を大切にする。
