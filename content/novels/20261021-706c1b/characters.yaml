- name: カイ・レン
  role: 主人公
  age: 26
  gender: 男性
  appearance: ノイズが走る義眼、使い古された黒のレザージャケット、スラムの汚れが染み付いたブーツ。
  personality: 冷笑的で現実主義だが、内面は情に厚い。一人称は「俺」。
  speech_style: 短く、ぶっきらぼうな口調。無駄な会話を好まない。
  background: かつては企業の技術者だったが、妹の不可解な死をきっかけにスラムの情報屋へと身を落とした。
  motivation: 妹の記憶の断片を辿り、彼女の死の真相と、自分が失った記憶の真実を突き止めること。
  relationships:
  - name: ルナ
    relation: 守るべき対象であり、妹の面影を投影する存在
  arc: 過去への執着（亡き妹への未練）から解放され、不確かな未来へと足を踏み出す強さを得る。
- name: ルナ
  role: 重要人物
  age: 14
  gender: 女性
  appearance: 透き通るような銀髪、瞳の奥にデジタルノイズが混じる、実体があるようでない儚い姿。
  personality: 無垢で好奇心旺盛だが、時に人間離れした冷徹な論理を展開する。一人称は「私」。
  speech_style: 丁寧だが、どこか機械的なリズムを持つ、感情の起伏が少ない話し方。
  background: 都市管理AIが「失われた記憶」をシミュレートするために生成した、実体のないデータ・エグゼキュータ。
  motivation: 自分が単なるプログラムではなく、一つの「意志」として存在することを示すこと。
  relationships:
  - name: カイ・レン
    relation: 自身に存在意義を与えてくれた導き手
  arc: 単なるデータの断片から、都市のシステムを書き換える「意志を持った意識」へと進化する。
- name: ヴァンス・クロムウェル
  role: 敵役
  age: 45
  gender: 男性
  appearance: 空中艦隊の執行官。汚れ一つない純白の制服、高度な感覚拡張デバイスを埋め込んだ冷徹な貌。
  personality: 極めて合理的で、秩序を絶対視する。人間を「管理すべき変数」と見なす。一人称は「私」。
  speech_style: 威圧的で、感情の起伏が全くない、命令的な口調。
  background: 都市管理企業のセキュリティ部門トップ。情報の独占こそがネオ・カジュの平和の礎だと信じている。
  motivation: 禁忌のコード（チップ）を回収し、社会の絶対的な管理体制を維持すること。
  relationships:
  - name: カイ・レン
    relation: 排除すべきシステムのエラー
  arc: 完璧な管理体制が、予測不能な「人間の意志」によって崩壊していく様を、自身の計算外として目撃する。
- name: エルダー
  role: 脇役
  age: 75
  gender: 女性
  appearance: 継ぎ接ぎだらけのローブを纏い、全身に古いケーブルが絡みついている。瞳は常にVRゴーグルで覆われている。
  personality: 浮世離れしており、哲学的な問いを好む。一人称は「わし」。
  speech_style: 独り言のように、比喩を多用した古めかしい喋り方。
  background: 「地下図書館」の守護者。かつては情報のアーカイブを管理していた伝説のハッカー。
  motivation: 捨てられたデータ（人類の忘却された記憶）が、完全に消滅するのを防ぎ、保存すること。
  relationships:
  - name: カイ・レン
    relation: 真実へと導くための案内人
  arc: 守り続けてきた「情報の墓標」が変容する瞬間を、静かに見届ける。
