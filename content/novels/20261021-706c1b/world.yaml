title: クローム・レクイエム：情報の墓標
genre: サイバーパンク
tone: 疾走感のあるハードボイルド
pov: 三人称
tense: 過去形
setting: 2114年、多層都市ネオ・カジュ。雲の上に浮かぶ富裕層の空中艦隊と、酸性雨が降り注ぐ地上のスラムが乖離した世界。
premise: 記憶をデータとして売買する時代。情報屋のカイは、亡き妹の断片的な記憶が収められた謎のチップを手に入れる。その正体は、都市の全管理AIを書き換える禁忌のコードだった。追っ手を振り切るため、カイは伝説の「地下図書館」を目指す。そこには、捨てられたデータが蠢く、人類の忘却の果てがある。
themes:
- 記憶の価値とアイデンティティ
- 情報の格差と支配
rules:
- 記憶チップの接続には脳への過負荷（オーバーロード）のリスクが伴う
- 空中艦隊は地上への直接的な介入を法律で禁じられているが、密かな情報搾取は常態化している
- 地下図書館は物理的な書物ではなく、サーバーの残骸が堆積した不可侵領域である
plot_outline:
- '序盤: スラムの路地裏。カイは謎の少女から「妹の記憶」を託される。直後に企業の暗殺部隊が襲来。激しい銃撃戦の末、カイは空飛ぶ船による脱出を図る。'
- '中盤: 追跡を逃れ、カイは都市の最下層にある「地下図書館」へ潜入。そこで、記憶が単なるデータではなく、人々の魂の痕跡であることを知る。少女の正体は、AIが生成した『実体のない記憶』だった。'
- '終盤: 空中艦隊の主力艦が地下図書館を強襲。カイはチップを起動し、都市のネットワークへダイブする。意識の境界線で、彼は妹の「真実」と向き合う。'
- '結末: システムは書き換えられ、情報の独占は崩壊する。カイは失った記憶の代わりに、新しい日常の一歩を踏み出す。しかし、背後では新たなデータの嵐が吹き荒れていた。'
style_notes: テンポを最優先。アクションシーンは「弾丸が空気を裂く」「火花が散る」といった短いフレーズで畳みかける。会話はドライで、キャラクター同士の食い気味なやり取りで緊張感を演出する。擬音語に頼らず、銃の反動や電子音の響きを動作として描写せよ。
