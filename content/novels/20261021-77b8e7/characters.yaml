- name: カイル
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無造作な茶髪、油汚れのついた作業着、額に常にゴーグルを乗せている
  personality: 好奇心旺盛で頑固、機械に対しては異常なまでの情熱を持つ。一人称：俺
  speech_style: 元気で少し口が悪いが、技術的な話題になると早口になる
  background: ネオン・アエテルナの片隅にあるジャンク屋の少年。幼い頃から伝説の「大地」を信じ、古い機械を修理して生計を立てている
  motivation: 伝説の「本物の大地」を自分の目で確かめ、世界の真実を証明すること
  relationships:
  - name: ジン
    relation: 信頼できる相棒であり、操縦を任せるパートナー
  - name: ルナ
    relation: 守るべき大切な仲間
  arc: 孤独な技術者から、仲間と共に未知の領域へ挑む決断力を持ったリーダーへと成長する
- name: ジン
  role: 相棒
  age: 28
  gender: 男性
  appearance: 鋭い眼光、頬に古い戦闘の傷跡、着古した黒い飛行服
  personality: 冷静沈着で皮肉屋だが、一度受けた恩義は決して忘れない。一人称：俺
  speech_style: 短く、無駄のない軍人らしい口調
  background: 帝国軍の元エースパイロット。軍の非道な任務に疑問を抱き、脱走した過去を持つ落ちぶれた男
  motivation: 過去の因縁から逃れ、誰の命令も受けない本当の意味での「自由な空」を見つけること
  relationships:
  - name: カイル
    relation: 放っておけない生意気な整備士
  - name: ルナ
    relation: 守るべき対象であり、守護者としての自覚を持つ相手
  arc: 過去の罪悪感と虚無感から解放され、再び空を飛ぶ喜びと生きる目的を取り戻す
- name: ルナ
  role: 航海士
  age: 15
  gender: 女性
  appearance: 銀色の長い髪、透き通るような瞳、不思議な紋様が刻まれた白い航海服
  personality: 穏やかでどこか浮世離れしているが、時折鋭い洞察力を見せる。一人称：私
  speech_style: 丁寧で、時折詩的で抽象的な表現を用いる
  background: 雲海の漂流物の中から発見された記憶喪失の少女。古代遺物と共鳴する特殊な能力を持つ
  motivation: 失われた記憶を取り戻し、自分が何者であるかを知ること
  relationships:
  - name: カイル
    relation: 自分を救ってくれた友人
  - name: ジン
    relation: 頼りになる兄のような存在
  arc: 記憶のない彷徨う魂から、世界の運命を左右する真実の鍵を握る存在へと覚醒する
- name: アラリック・フォン・シュトラウス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない真っ白な帝国軍制服、冷徹な青い瞳、威厳に満ちた佇まい
  personality: 秩序を絶対視し、目的のためには手段を選ばない冷酷な統治者。一人称：私
  speech_style: 高圧的で、命令を下すような貴族的な口調
  background: 帝国軍の最高司令官。雲海上の文明を維持するためには、絶対的な力による支配が必要だと信じている
  motivation: 古代の『超速翼エンジン』を回収し、帝国の支配体制を盤石にすること
  relationships:
  - name: カイル
    relation: 秩序を乱し、帝国の管理から逃れる不届き者
  arc: 絶対的な権威の象徴として立ちはだかるが、未知の可能性と自由の力によって敗北を喫する
