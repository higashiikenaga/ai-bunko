title: アエロ・ダイブ：最果ての蒼い境界線
genre: SF
tone: 爽快感溢れるハイテンションな冒険活劇
pov: 三人称
tense: 過去形
setting: 有毒な雲海に覆われ、人々が浮遊島や空中都市で暮らす遠未来の世界。中心地には24時間不夜城として機能する巨大空中都市「ネオン・アエテルナ」が存在する。
premise: 雲海の下に「本物の大地」があるという伝説を信じる天才整備士のカイルが、禁忌の超高速エンジンを搭載した小型飛空艇『ゼフィロス号』を組み上げる。不運な元軍人パイロットと記憶喪失の航海士と共に、帝国軍の追撃を振り切りながら、世界の最果てを目指して雲海の深淵へとダイブする。風を切り、雲を突き抜ける、自由と絆を求める少年たちの快走が始まる。
themes:
- 自由への渇望
- 仲間との信頼と絆
rules:
- すべての飛行船は『エーテル結晶』を動力源としており、燃料が切れると即座に墜落する。
- 高度1000メートル以下の雲海は強酸性の霧に包まれており、特殊な装甲なしでは数分で船体が腐食する。
- 帝国軍が全空域の飛行許可証を管理しており、無許可飛行は厳格に処罰される。
plot_outline:
- '序盤: 不夜城ネオン・アエテルナのジャンク屋で働くカイルが、古代の遺物である『超速翼エンジン』を発見する。帝国軍の検閲から逃れるため、落ちぶれた天才パイロットのジンと、不思議な少女ルナと共に、急造の飛空艇で都市を脱出する。'
- '中盤: 伝説の大地へ至るルートを探し、様々な浮遊島を巡る旅に出る。激しい気流の嵐や帝国軍の追撃艦隊との空中戦を繰り広げながら、バラバラだった三人が次第にかけがえのない絆で結ばれていく。'
- '終盤: 世界の底へと繋がる唯一の巨大渦巻『グランド・ヴォルテックス』を発見する。しかしそこには、世界を支配し続けようとする帝国軍の最強戦艦が待ち構えていた。カイルの整備したエンジンを限界まで回し、絶望的な戦力差を速度と機動力で突破する。'
- '結末: 雲海を突破し、誰も見たことがない青い空と緑の大地に降り立つ。失われた文明の跡地でルナの記憶が戻り、彼らは新たな時代の開拓者として、空と地上の架け橋となることを誓う。'
style_notes: 風を切る音、エンジンの咆哮、オイルの匂いが伝わるような躍動感のある描写を重視する。アクションシーンでは短文を重ねてスピード感を出し、キャラクター同士の軽快な掛け合いで物語を明るく牽引させる。
