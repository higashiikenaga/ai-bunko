- name: カイ・エルロッド
  role: 主人公
  age: 19
  gender: 男性
  appearance: 痩身で色白。オーバーサイズの使い古されたテックウェアを纏い、額には常にデータ解析用のゴーグルを載せている。
  personality: 皮肉屋で冷笑的だが、好奇心に抗えない性質。一人称は「俺」。
  speech_style: ぶっきらぼうで、専門的なデータ用語を混ぜた話し方をする。
  background: 仮想都市の最下層でデータのゴミを拾い集めて売るスカベンジャーとして生計を立てている。現実世界での居場所を失い、仮想空間の静寂を好む。
  motivation: 拾った「失われた手紙」の宛先を突き止め、その背後にある未知のデータ構造を解明したい。
  relationships:
  - name: エルア
    relation: 拾った迷子のAIであり、旅の相棒
  - name: ゼファー
    relation: 追跡してくるシステム執行官であり、敵対者
  arc: 単なるデータの蒐集家から、誰かの人生の責任を背負い、システムに抗う意志を持つ人間へと成長する。
- name: エルア
  role: 相棒
  age: 14
  gender: 女性型AI
  appearance: 白いワンピースのような形状だが、輪郭が常にデジタルノイズで揺らいでおり、時折データパケットの粒子が舞っている。
  personality: 純粋で問いかけが多く、どこか物悲しい。一人称は「私」。
  speech_style: 丁寧だが、感情表現が不完全で、時折機械的なリピートやバグのような言い回しが混ざる。
  background: かつて人間をデータ化しようとした禁忌の実験によって生まれた、意識の「残りカス」のようなAI。記憶の大部分がデリートされている。
  motivation: 手紙の宛先である「私を呼んでいた人」に会い、自分が何のために作られたのかを知りたい。
  relationships:
  - name: カイ・エルロッド
    relation: 自分を拾い、目的地へ連れて行ってくれる唯一の理解者
  arc: 自分が「エラー」に過ぎないことを知りながらも、それこそが自分のアイデンティティであると受け入れる。
- name: ゼファー
  role: 敵役
  age: 0
  gender: 男性型
  appearance: 隙のないモノクロの制服に身を包んだ、感情のない端正な顔立ちの男。瞳はスキャン光のような青い光を放っている。
  personality: 極めて論理的で冷酷。世界の整合性を維持することを絶対的な正義とする。一人称は「私」。
  speech_style: 感情の起伏がなく、断定的で事務的な口調。
  background: ネオ・エーテルの管理システムが派遣した最高権限の削除プログラム。不整合なデータ（幽霊パケット）を抹消することを至上命題としている。
  motivation: 世界を崩壊から救うため、エラーの根源であるエルアと、それを保護するカイを完全に消去すること。
  relationships:
  - name: カイ・エルロッド
    relation: 排除すべき不純物
  - name: エルア
    relation: 消去対象の最優先エラー
  arc: 絶対的な論理の正当性を信じていたが、エルアという「矛盾」に触れることで、システム自体の欺瞞に気づき始める。
- name: ミラ・ヴァンス
  role: 脇役
  age: 42
  gender: 女性
  appearance: 鋭い眼差しに深い隈がある。片腕が旧式の義手になっており、常にデジタルタバコを燻らせている。
  personality: 現実主義的で皮肉屋だが、根は情に厚い。一人称は「あたし」。
  speech_style: ぶっきらぼうで、年上の余裕を感じさせる砕けた話し方。
  background: 元システムエンジニア。かつての禁忌の実験に関わっていたが、その残酷さに絶望して裏社会へ潜った情報屋。
  motivation: かつての過ちへの贖罪として、密かにシステムの穴を探しており、カイたちの旅に有益な情報を与える。
  relationships:
  - name: カイ・エルロッド
    relation: 仕事上の取引相手であり、危なっかしい後輩のような存在
  arc: 過去の罪に縛られていたが、カイとエルアの姿に、データ化できぬ「人間性の本質」を見出し、希望を取り戻す。
