title: デリートされた空白、あるいは幽霊パケットの行方
genre: SF
tone: 切なくも疾走感のある、境界線の揺らぎ
pov: 三人称
tense: 過去形
setting: 高度情報化社会の果て、崩壊しかけた仮想都市「ネオ・エーテル」と、静まり返った現実の居住区。
premise: データの残骸を拾い集めるスカベンジャーの青年は、ノイズまみれの「失われた手紙」の断片を見つける。そのデータには、持ち主を失った迷子の人工知能が寄り添っていた。手紙の宛先を辿る旅は、やがて世界の管理システムが隠蔽してきた、人間性の定義を揺るがす巨大な矛盾へと突き当たる。
themes:
- 現実と仮想の境界
- デジタル化された魂の在り処
rules:
- 仮想空間では思考速度が加速し、描写は断片的かつ高速になる
- 現実世界では時間の流れが緩慢で、感覚的な描写を重視する
- システムメッセージは[ ]で囲み、物語の進行や状態を示す
plot_outline:
- '序盤: データの墓場で、ノイズにまみれた「失われた手紙」と、主を失った「迷子の人工知能」を拾う。'
- '中盤: 手紙の宛先を探して仮想空間の深層へ潜る中、世界の整合性を守るための削除プログラムに追われ続ける。'
- '終盤: 手紙の正体が、かつて人間をデータ化しようとした禁忌の実験の記録であり、AIはその実験の「遺物」であったことが判明する。'
- '結末: 主人公は、AIの存在をシステムから抹消して秩序を守るか、エラーとして世界に残すかの決断を迫られる。'
style_notes: '仮想空間の描写は、断片的な単語や短い一文を多用し、加速する感覚を表現する。対照的に現実世界の描写は、五感に訴えかける静かな筆致を用いる。物語の節目には必ず
  [SYSTEM: ...] 形式のメッセージを挿入し、現実と仮想の境界線を強調すること。'
