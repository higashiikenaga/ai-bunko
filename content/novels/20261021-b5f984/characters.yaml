- name: アリステア・フォン・ヴァレリウス
  role: 主人公（旧時代の象徴）
  age: 24
  gender: 男性
  appearance: 白金色の長い髪を緩く結んでいる。没落し擦り切れた貴族の礼装を纏い、瞳には凍てついた青い光が宿っている。
  personality: 静謐で理知的だが、内側に激しい喪失感を抱えている。一人称は「私」。
  speech_style: 丁寧で古風な口調。感情をあまり表に出さない。
  background: かつての魔法文明の頂点「氷の城」に仕えた名門貴族の末裔。エーテルの結晶化により魔法を失い、家名も財産も失った。
  motivation: 消えゆく魔法の真実を突き止め、文明の崩壊を食い止める方法を模索すること。
  relationships:
  - name: エレナ・ソーン
    relation: 価値観が対立するが、次第に信頼し合うパートナー
  - name: サイラス・ヴェイン
    relation: 知識の導き手としての師弟関係
  arc: 過去の栄光への執着を捨て、新しい時代の技術と調和することで、真の意味での「継承」を受け入れる。
- name: エレナ・ソーン
  role: 主人公（新時代の象徴）
  age: 21
  gender: 女性
  appearance: 油汚れのついた作業服に大きなゴーグルを額にかけている。赤褐色の短髪で、手は常に機械油で黒ずんでいる。
  personality: 快活で現実主義。好奇心旺盛で、困難な状況ほど燃えるタイプ。一人称は「あたし」。
  speech_style: ぶっきらぼうで活気に満ちた話し方。専門用語を混ぜる傾向がある。
  background: 下層街の時計職人の娘。独学で蒸気機関と歯車技術を習得し、魔法に頼らずに暖を取り、生き延びるための機械を開発している。
  motivation: 魔法という不確かな力に頼らず、誰にでも扱える「鉄の技術」で世界を凍土から救い出すこと。
  relationships:
  - name: アリステア・フォン・ヴァレリウス
    relation: 古臭い貴族だと思っているが、その知識に敬意を抱くようになる
  arc: 技術至上主義から脱却し、過去の叡智（魔法）を論理的に解釈することで、次世代の革新的な技術へと昇華させる。
- name: サイラス・ヴェイン
  role: ガイド/記録官
  age: 62
  gender: 男性
  appearance: 痩身で、厚いレンズの眼鏡をかけている。重厚な記録官のローブを纏い、常に巨大な鉄製の鍵を首から下げている。
  personality: 慎重で懐疑的だが、知識に対する情熱は人一倍強い。一人称は「私」。
  speech_style: ゆっくりとした口調で、比喩や歴史的な引用を多用する。
  background: 地下図書館の現館長。文明の転換期に何が起こったのかを記録し続ける役割を担っており、禁忌とされる「世界の真実」を保管している。
  motivation: 偏った権力者に知識を独占させず、次代を担う若者たちに正しく歴史を継承させること。
  relationships:
  - name: アリステア・フォン・ヴァレリウス
    relation: 魔法の知識を繋ぐための協力者
  - name: エレナ・ソーン
    relation: 新しい時代の知性に期待を寄せる保護者的存在
  arc: 中立的な記録者の立場を捨て、自らの意思で歴史を動かす側に回り、未来への道標を示す。
- name: 大魔導師ジュリアヌス
  role: 敵役
  age: 85
  gender: 男性
  appearance: 見た目は50代に止まっている。純白の豪華な法衣を纏い、結晶化したエーテルの杖を携えている。瞳は感情を欠いた氷のような色。
  personality: 傲慢で独善的。魔法こそが至高であり、それ以外の文明を「野蛮な鉄屑」と見下している。一人称は「我」。
  speech_style: 威圧的で、相手を突き放すような高圧的な話し方。
  background: 「氷の城」の最高権力者。魔法の衰退を拒み、禁じられた術を用いて強制的にエーテルを再結晶化させ、魔法の時代を強引に回帰させようとしている。
  motivation: 魔法文明の完全な復興。そのためには、現在の人口の半分を犠牲にしてでもエーテルの源泉を再起動させること。
  relationships:
  - name: アリステア・フォン・ヴァレリウス
    relation: かつての弟子であり、裏切り者として憎んでいる
  arc: 絶対的な力への執着が、最終的に自らを凍てついた静寂の中へと閉じ込める破滅へと導く。
