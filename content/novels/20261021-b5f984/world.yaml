title: 凍天の刻、鉄の咆哮
genre: 群像劇
tone: 壮大かつ哀切、時代の変遷を捉える重厚な叙事詩風
pov: 三人称多視点
tense: 過去形
setting: 魔法文明が崩壊し、機械文明へと移行する転換期の架空大陸
premise: 世界を覆い始めた「永久凍土」により、魔法の源であるエーテルが結晶化し、文明は崩壊の危機に瀕していた。かつての栄華を象徴する「氷の城」は、絶対零度の静寂の中で魔法の終焉を待っている。その一方で、人々は魔法に頼らぬ「蒸気と鉄」の技術に救いを求め、新たな時代の胎動を始めていた。地下深くの「地下図書館」に隠された古の叡智と、地表で蠢く新技術の衝突が、歴史の大きな転換点を描き出す。
themes:
- 旧時代の終焉と新時代の誕生
- 失われる記憶と継承される意志
rules:
- エーテルが結晶化すると魔法は消失し、物理的な氷へと変質する
- 機械技術はエーテルに依存しないが、極寒下では熱源の確保が生存の絶対条件となる
- 地下図書館の蔵書は、結晶化したエーテルに刻まれた『記憶の残滓』である
plot_outline:
- '序盤: 魔法の衰退と異常寒冷化の兆し。没落貴族、新興技術者、路地裏の庶民、記録官の視点を通じ、世界が変容していく様を描く。'
- '中盤: 「氷の城」に眠る魔法の残滓を巡る争奪戦と、地下図書館に隠された「世界の真実」の露呈。'
- '終盤: 魔法の維持を望む旧勢力と、鉄の技術で生き延びようとする新勢力の全面衝突。'
- '結末: 魔法の時代は終焉を迎えるが、地下図書館から継承された知識が、新しい鉄の時代の礎となる。名もなき人々が、凍てついた大地で新たな灯をともす。'
style_notes: 大きな時代の転換点を多角的な視点から描く。章ごとに視点人物を切り替え、王族の政争から、凍える街で日銭を稼ぐ名もなき庶民の泥臭い生活までを等価に描き出す。時代のうねりを俯瞰するような、重厚で格式高い三人称の文体。
