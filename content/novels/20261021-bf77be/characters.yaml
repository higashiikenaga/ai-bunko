- name: リア・エヴァンス
  role: 主人公
  age: 17
  gender: 女性
  appearance: 油汚れのついたオーバーオールに大きなゴーグルを装着。赤みを帯びたショートヘアで、常に工具袋を腰に下げている。
  personality: 好奇心旺盛で真っ直ぐな性格。機械いじりに関しては妥協を許さない完璧主義者。一人称は「私」。
  speech_style: 快活で率直な話し方。機械の構造について語る時は早口になり、専門用語が混ざる。
  background: 下層街で廃品回収業者として生計を立てていた整備士。古本屋を営んでいた祖父から、技術への誠実さと古い飛行艇を譲り受ける。
  motivation: 祖父が遺した数式の意味を解き明かし、崩壊しつつある空の世界を救いたい。
  relationships:
  - name: カイル・ヴァン・クロムウェル
    relation: 信頼し合う航海士兼パートナー
  - name: ヴァレリウス将軍
    relation: 追跡者であり、思想的な対立相手
  arc: 単なる「修理屋」としての視点から、技術が世界に与える責任を担う「開拓者」へと成長する。
- name: カイル・ヴァン・クロムウェル
  role: 相棒
  age: 24
  gender: 男性
  appearance: 使い古された革製のロングコートを纏い、右頬に古い火傷の痕がある。鋭い眼光だが、笑うと年相応に幼い。
  personality: 皮肉屋で現実主義。しかし根は情に厚く、弱者を放っておけない。一人称は「俺」。
  speech_style: ぶっきらぼうで投げやりな口調。相手を揶揄うような言い回しを好む。
  background: 元帝国軍の精鋭パイロットだったが、軍の非道な資源搾取に気づき、軍籍を捨てて逃亡していた潜伏者。
  motivation: 帝国に抗い、本当の意味で「自由な空」を取り戻すこと。
  relationships:
  - name: リア・エヴァンス
    relation: 危なっかしいが才能ある少女として保護し、導く
  - name: ヴァレリウス将軍
    relation: かつての上官であり、深い恨みを持つ相手
  arc: 絶望して逃げていた過去を乗り越え、リアと共に未来へ向かう勇気を取り戻す。
- name: ヴァレリウス将軍
  role: 敵役
  age: 48
  gender: 男性
  appearance: 汚れ一つない純白の軍服に金色の飾緒。左腕は高度な蒸気駆動の義手となっており、精密な動作が可能。
  personality: 冷酷かつ効率至上主義。秩序こそが至高であり、そのための犠牲は厭わない。一人称は「私」。
  speech_style: 極めて丁寧で理知的だが、言葉の端々に相手を見下す傲慢さが滲み出る。
  background: 帝国軍の熱力学研究部門を統括する将軍。超臨界蒸気炉の力を得て、アイアン・レイヤーの完全な支配権を握ろうとしている。
  motivation: エネルギーの完全掌握による、絶対的な階級社会の維持と安定。
  relationships:
  - name: リア・エヴァンス
    relation: 鍵となる数式を持つ「回収対象」
  - name: カイル・ヴァン・クロムウェル
    relation: 裏切り者として抹殺すべき過去の部下
  arc: 完璧な計算と支配を信じていたが、計算外の情熱と技術の調和に敗北し、自らの過ちに気づく。
