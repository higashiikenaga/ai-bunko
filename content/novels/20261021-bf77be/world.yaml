title: 断熱圧縮の空域、あるいは遺言の書
genre: スチームパンク冒険
tone: 硬派な技術描写を軸とした、重厚なスチームパンク・アドベンチャー
pov: 三人称
tense: 過去形
setting: 蒸気圧と気圧制御技術によって浮遊を維持する、積層型空中都市群「アイアン・レイヤー」
premise: 整備士の少女リアは、古本屋を営んでいた祖父の遺言を受け取り、一冊の古書を手に取る。そこには、失われた「超臨界蒸気炉」の起動コードが、高度な熱力学的計算式として記されていた。帝国軍の追撃を受けながら、リアは旧式の飛行艇を駆使し、雲海に隠された世界の真実へと加速していく。
themes:
- 技術の継承と倫理
- 物理法則への挑戦
- 遺産がもたらす文明の変革
rules:
- 浮遊都市は気圧の階層構造により成立しており、高度が上がるほど大気密度と酸素濃度が低下する
- 演算装置は、蒸気の噴出圧を微細に制御して論理演算を行う『蒸気論理演算機』が主流である
- 動力源となる蒸気圧が設計上の臨界点を超えると、熱力学的平衡が崩れ、装置は爆発的な破裂を起こす
plot_outline:
- '序盤: 廃品回収業者として暮らすリアは、祖父が遺した古本屋の鍵と、不可解な数式が記された遺言状を発見する。同時に、その数式を軍事利用せんとする帝国工作員の襲撃を受ける。'
- '中盤: リアは祖父の旧式飛行艇を『蒸気圧同期機構』を用いて再起動させ、上層部へと脱出。旅の途中で、世界の気圧低下が、帝国の蒸気抽出による熱力学的搾取の結果であることを知る。'
- '終盤: 雲海の最深部にある伝説の「天空書庫」へ到達。帝国艦隊との激しい空中戦の中、リアは古書の数式を演算機へ入力し、失われた超臨界蒸気炉を起動させる。'
- '結末: 炉の稼働により、大気循環の熱力学的均衡が回復する。リアは、技術が支配ではなく、生命の維持のためにあることを証明し、新たな空の航路を切り拓いていく。'
style_notes: 物理学、熱力学、流体力学の概念に基づいた精密な描写を徹底すること。金属の摩擦音、蒸気の噴出、歯車の噛み合わせといった機械的挙動を、擬音に頼らず、物理現象の記述によって表現する。専門用語は、キャラクターが計器の数値を読み取る、あるいはレバーを操作するといった動作のプロセスと共に自然に提示すること。
