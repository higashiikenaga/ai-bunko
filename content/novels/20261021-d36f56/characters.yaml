- name: エリアン・ヴェイン
  role: 主人公
  age: 27
  gender: 男性
  appearance: 煤けた作業着に銀髪、常に油の匂いがする細い指を持つ。感情を読み取らせない無機質な瞳。
  personality: 冷徹で極めて論理的。感情や道徳を「機械の動作を阻害する不純物」として忌避している。一人称：私。
  speech_style: 淡々としており、余計な修飾を削ぎ落とした事務的な口調。
  background: 蒸気と歯車の迷宮都市で、止まった時計を直すことにのみ生の実感を見出す孤高の修復師。
  motivation: 持ち込まれた「逆回転する懐中時計」を、論理的な整合性を持って修理すること。
  relationships:
  - name: サイラス・ソーン
    relation: 不可解な依頼人
  arc: 完璧な論理の殻が、鏡の向こうの自分によって砕かれ、自身の罪と人間性を受け入れていく。
- name: 鏡像のエリアン
  role: 敵役（鏡の中の導き手）
  age: 27
  gender: 男性
  appearance: 主人公と瓜二つだが、肌が鏡のように滑らかで、瞳の中に空の断片が映り込んでいる。
  personality: 情熱的で、時に残酷なほど慈悲深い。エリアンが捨てた「痛み」や「良心」を全て引き受けている。一人称：僕。
  speech_style: 蒸気の熱を帯びた、囁くような、しかし抗いがたい重みを持つ話し方。
  background: エリアンがかつて、効率と生存のために切り捨てた、自身の「感情」と「良心」の集合体。
  motivation: 時計の針を「零時」へと進め、エリアンに自身の存在（失われた記憶）を突きつけること。
  relationships:
  - name: エリアン・ヴェイン
    relation: 欠落した半身
  arc: 単なる幻影から、世界の理を書き換える、逃れられない運命の象徴へと変貌する。
- name: サイラス・ソーン
  role: 依頼人
  age: 40
  gender: 男性
  appearance: 霧を纏ったような灰色の外套を羽織り、常に壊れた懐中時計を大切そうに握りしめている。
  personality: 憂いを含んだ、掴みどころのない人物。全てを悟ったような静かな諦念を抱いている。一人称：私。
  speech_style: 霧の中に消えるような、曖昧で詩的な、捉えどころのない話し方。
  background: エリアンが過去に捨て去った「良心」が、肉体と記憶を失い、概念として形を成した存在。
  motivation: 懐中時計を修理させることで、止まった自身の時間を終わらせ、真の零時に到達すること。
  relationships:
  - name: エリアン・ヴェイン
    relation: かつての自分自身の断片
  arc: 物語の起点として現れ、エリアンが自身の過去と対峙するための「装置」としての役割を全うする。
- name: ライラ
  role: 脇役（相棒的役割）
  age: 19
  gender: 女性
  appearance: 歯車をあしらったゴーグルを額に上げ、使い込まれた革製の工具袋を提げた小柄な少女。
  personality: 現実主義的で逞しく、街の過酷な理に適応している。好奇心は強いが、理屈っぽいエリアンとは対照的な直感派。一人称：あたし。
  speech_style: ぶっきらぼうで、リズムの速い、街の喧騒を感じさせる話し方。
  background: 迷宮都市の廃棄物から部品を拾い集めて生きるスカベンジャー（廃品回収業者）。
  motivation: 街の構造が歪み始める中で、自身の生存圏を守り、混乱の渦中を生き抜くこと。
  relationships:
  - name: エリアン・ヴェイン
    relation: 街の理を知る協力者
  arc: 非論理的な世界の崩壊を目の当たりにし、恐怖を超えて「世界の真実」を直視する強さを得る。
