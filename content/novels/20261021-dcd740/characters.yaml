- name: 湊 悠真
  role: 主人公
  age: 25
  gender: 男性
  appearance: 少し長めの前髪に、穏やかだがどこか所在なさげな瞳。古本屋の作業着やシンプルなシャツを好む。
  personality: 内向的で思慮深く、物事を深く考えすぎる傾向がある。一人称は「僕」。
  speech_style: 丁寧で控えめ。相手の言葉を一度咀嚼してから話すような、少し間のある話し方。
  background: 都会での生活に疲れ、亡くなった祖父が遺した海辺の古本屋を継いだばかりの青年。自分の進むべき道を見失っている。
  motivation: 本の間に残されたメモの主（栞）の真意を知り、自分自身の生きる意味を見つけたい。
  relationships:
  - name: 白石 栞
    relation: メモを通じて言葉を交わす、魂の理解者
  - name: 湊 宗一郎
    relation: 祖父であり、古本屋の先代店主
  arc: 他者の言葉に触れることで孤独を恐れず、誰かと繋がるための場所を守る決意をする。
- name: 白石 栞
  role: ヒロイン
  age: 23
  gender: 女性
  appearance: 透き通るような白い肌と、どこか遠くを見つめるような儚げな表情。病の影響で細身。
  personality: 静かな強さと深い感受性を持つ。孤独を抱えつつも、世界に対して優しさを失わない。一人称は「私」。
  speech_style: 詩的で、リズムを大切にするような柔らかい口調。文字で綴る言葉は非常に美しい。
  background: 不治の病を患い、余命が短いことを悟っている。本に書き込むメモを通じて、世界への「返信」を続けていた。
  motivation: 自分がこの世にいた証を、誰かの心に静かに届けること。
  relationships:
  - name: 湊 悠真
    relation: 自分の言葉を受け取り、夜明けのラジオを共に聴いてくれる存在
  arc: 孤独な死の準備をしていたが、湊との交流を通じて、自分の生が誰かに繋がったことを実感し、穏やかな終焉を迎える。
- name: 佐伯 健二
  role: 脇役（メンター）
  age: 52
  gender: 男性
  appearance: 低く落ち着いた声、目尻に深い笑い皺がある。夜のラジオ局のスタジオに馴染む温かい雰囲気。
  personality: 包容力があり、聞き上手。街の小さな出来事や人々の感情を大切にする。一人称は「俺」。
  speech_style: 深夜ラジオのパーソナリティらしい、落ち着いた低音。リスナーに語りかけるような親しみやすい口調。
  background: 地方都市のコミュニティFMで、夜明け前の番組『薄明の書架』を担当するDJ。
  motivation: 孤独な夜を過ごす人々へ、微かな光のような言葉を届けること。
  relationships:
  - name: 湊 悠真
    relation: ラジオを通じて繋がり、静かに見守る存在
  arc: 物語の狂言回しとして、湊と栞の心の交流を、ラジオという媒体を通じて間接的に支える。
