title: 薄明の書架と、眠らぬラジオ
genre: ヒューマンドラマ
tone: 静謐で慈愛に満ちた、淡い哀愁を帯びた雰囲気
pov: 三人称近接視点
tense: 過去形
setting: 現代、海沿いの静かな地方都市にある古本屋
premise: 祖父が遺した古本屋を継いだ青年・湊は、蔵書の中に書き込まれた「誰かへの返信」のようなメモを見つける。それは、不治の病を抱えながら孤独に生きた女性・栞が、本を通じて世界に遺そうとした静かな対話だった。夜明けのラジオ番組を共通の拠り所として、二人は言葉を交わし、生と死の境界線に寄り添い合う。
themes:
- 死への受容
- 孤独の共有
- 言葉の継承
rules:
- 現実的な現代社会の設定とし、超自然的な現象は一切起こらないこと
- 病状の進行は医学的な現実に基づかせ、安易な奇跡による快復は描かないこと
plot_outline:
- '序盤: 祖父の古本屋を継いだ湊が、本の中に書き込まれた切ない筆跡のメモに気づき、その主である栞と知り合う。'
- '中盤: 栞との交流を通じて、湊は彼女が抱える病と、彼女が本に書き残した「誰かに届いてほしい願い」を知る。二人は夜明け前のラジオ番組を同時に聴き、孤独を分かち合う時間を大切にする。'
- '終盤: 栞の病状が悪化し、彼女は自らの人生を静かに締めくくる準備を始める。湊は彼女が読み終えたかった最後の一冊を届けるため、奔走する。'
- '結末: 栞は静かに旅立つが、彼女が本に遺した言葉たちが湊の心を救い、彼は古本屋を「誰かが誰かに繋がる場所」として続けていく決意をする。'
style_notes: 感情を直接的な形容詞で説明せず、風景の描写や動作、沈黙の間（ま）によって表現する。絶望の底にある小さな温もりを掬い上げるように、低彩度で優しい筆致を徹底し、読者に感情の解釈を委ねること。
