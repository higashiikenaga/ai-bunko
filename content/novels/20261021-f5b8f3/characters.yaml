- name: カエルン・ヴォス
  role: 主人公
  age: 27
  gender: 男性
  appearance: 疲れ切った眼差しに、油と酸性雨で汚れたオーバーサイズのテックコートを纏っている。こめかみにメモリー・ダイブ用のインターフェース端子が埋め込まれている。
  personality: 冷笑的で孤独を好むが、根底には捨てきれない正義感を持つ。一人称は「オレ」。
  speech_style: ぶっきらぼうで短文な話し方。皮肉を交えることが多い。
  background: 元は上層企業の若手技術者だったが、ある不祥事に巻き込まれ、記憶の一部を消去されて下層スラムに追放された。
  motivation: 日々の食いぶちを稼ぐためのサルベージから、次第にデータの少女を救い出し、真実を暴くことへ。
  relationships:
  - name: ライラ
    relation: 保護対象であり、精神的な共鳴相手
  - name: 執行官ヴェイン
    relation: 追跡者であり、憎悪の対象
  arc: 社会の歯車として諦めて生きていたが、ライラとの出会いを通じて、自らの意思で世界に抗う勇気を取り戻す。
- name: ライラ
  role: ヒロイン/鍵となる存在
  age: 16
  gender: 女性
  appearance: ホログラムとして現れる。ノイズが混じった白いドレス姿で、肌は半透明。時折、データ破損によるグリッチが発生する。
  personality: 純粋で好奇心旺盛だが、消去された記憶への深い喪失感を抱えている。一人称は「わたし」。
  speech_style: 静かで詩的な話し方。時折、断片的なキーワードを繰り返す癖がある。
  background: 企業の最高機密プロジェクトで「魂のバックアップ」としてデジタル化された少女。抹消されたはずが、断片的な意識としてネットワークを漂っていた。
  motivation: 自分が何者であったかを知り、最後の一片まで記憶を取り戻して、世界に自分の存在を刻むこと。
  relationships:
  - name: カエルン・ヴォス
    relation: 自分を拾い上げ、世界を見せてくれる唯一の人間
  - name: 執行官ヴェイン
    relation: 自分を「回収すべき資産」として扱う恐怖の対象
  arc: 単なるデータの断片から、全市民に希望を届ける「歌声」へと昇華し、肉体なき存在としての救済を見つける。
- name: 執行官ヴェイン
  role: 敵役
  age: 42
  gender: 男性
  appearance: 隙のない黒い高級スーツ。瞳は完全にサイバネティクス化されており、冷徹な銀色に光る。常に無表情。
  personality: 完璧主義者で冷酷。秩序こそが正義であると信じて疑わない。一人称は「私」。
  speech_style: 極めて丁寧だが、相手を見下した傲慢さが滲み出る事務的な口調。
  background: 企業の汚れ仕事を一手に引き受ける「掃除屋」。数々の反逆者を抹殺し、記憶の消去やデータの回収を完璧に遂行してきた。
  motivation: 『魂のバックアップ』を回収し、企業の支配体制を揺るがす不確定要素を完全に排除すること。
  relationships:
  - name: カエルン・ヴォス
    relation: 排除すべきゴミのような下層民
  - name: ライラ
    relation: 所有権を持つべき企業の重要資産
  arc: 絶対的な管理体制を信じていたが、ライラの歌声による市民の覚醒という「制御不能な変数」に直面し、崩壊していく。
- name: マダム・ニクス
  role: 脇役/協力者
  age: 55
  gender: 女性
  appearance: 派手なメイクとネオンカラーの義手を持つ。常に電子タバコを燻らせており、古びたラジオ機器に囲まれている。
  personality: 強欲で計算高いが、情に厚い一面もある。街の裏表に精通した情報屋。一人称は「あたし」。
  speech_style: 下層街の俗語を多用する、ガサツで威勢の良い話し方。
  background: かつては「夜明けのラジオ」の正当な放送責任者だったが、企業の弾圧により地下へ潜った。
  motivation: いつか再び、上層の欺瞞を暴く放送を街中に流し、かつての誇りを取り戻すこと。
  relationships:
  - name: カエルン・ヴォス
    relation: 生意気だが腕の良い常連のダイバー
  arc: 傍観者として生きることを選んでいたが、カエルンの覚悟に打たれ、禁忌の放送設備を起動させる後押しをする。
