title: ネオン・ドレイン：回路の残響
genre: ディストピア
tone: サイバーパンク・ハードボイルド
pov: 一人称
tense: 過去形
setting: 重層都市「ノア・セクター」。上層のクリーンな企業居住区と、下層の酸性雨が降り注ぐスラム街の対比。
premise: 街は電子の海と酸性雨に沈んでいる。オレは路地裏で、死んだ記憶の断片をサルベージする「メモリー・ダイバー」だ。ある夜、企業の最高機密が隠された『魂のバックアップ』を手に入れる。それは夜明けのラジオから流れる、ありえないはずの歌声と繋がっていた。追手は企業の執行官、オレの逃げ場は、街の最下層へ向かう最終列車しかない。
themes:
- 記憶のアイデンティティ
- 支配構造への叛逆
rules:
- 記憶はデータとして売買可能だが、生体脳への直接接続は精神汚染を招く
- 企業の権限は法を超越し、市民の全ログをリアルタイムで監視している
plot_outline:
- '序盤: スラムの片隅で、依頼人の壊れた記憶チップをハッキングして復元する日常。偶然、解析不能な暗号化ノイズを拾う。'
- '中盤: ノイズの正体が、抹消されたはずの少女の意識だと判明。企業の追っ手が路地裏を包囲し、オレはデータの断片を抱えて逃走する。'
- '終盤: データの終着点を探し、禁断の領域へ。最終列車のプラットフォームで、企業の防衛プロトコルと激突する。'
- '結末: データの真実を「夜明けのラジオ」を通じて全市民へブロードキャスト。街が揺らぎ、新しい光が差し込む兆しの中で、オレは再び雨の中へ消える。'
style_notes: ネオンの色彩と雨の質感にこだわる。短いセンテンスで畳み掛け、スピード感を出す。ハッキングシーンは「プロトコル・ブレイク」「ノードの侵食」など、具体的な手順を感じさせる造語を多用する。一人称は「オレ」。ハードボイルドな独白。
