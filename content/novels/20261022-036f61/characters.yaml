- name: エレン・ヴァレンタイン
  role: 主人公
  age: 24
  gender: 女性
  appearance: 落ち着いた茶色の髪を後ろで低く結んでいる。常に銀のピンセットと小さなルーペを携え、使い込まれた革のエプロンを着用している。
  personality: 内向的で思慮深く、物事の細部にこだわる職人気質。一人称は「わたし」。
  speech_style: 丁寧で静かな口調。相手の言葉を最後までよく聴く。
  background: 霧の深い港町で、亡き祖父が営んでいた小さな時計修理店を継いだ。街の緩やかな変化を眺めながら、静かに暮らしている。
  motivation: 止まった時計を動かすこと、そして祖父が遺した「道具の声を聴く」という教えを守ること。
  relationships:
  - name: セバスチャン
    relation: 重要な依頼人
  - name: リーナ
    relation: 親しい友人
  arc: 過去の遺産を守ることだけに執着していたが、修理を通じて人々の新しい記憶や繋がりを受け入れ、未来へ歩き出す。
- name: セバスチャン・クロムウェル
  role: 重要人物（依頼人）
  age: 72
  gender: 男性
  appearance: 白髪混じりの整えられた髭。使い古された、しかし手入れの行き届いた重厚な外套を羽織っている。
  personality: 威厳があるが、どこか寂しげな瞳を持つ。穏やかだが、時折強い意志を感じさせる。一人称は「私」。
  speech_style: 格式高く、ゆっくりとした、物語を語るような話し方。
  background: かつてこの街の蒸気機関の基礎を築いた伝説的な元技師。ある出来事以来、自身の記録を伏せてきた。
  motivation: 亡き戦友との約束が刻まれた、折れた剣の意匠を持つ懐中時計を、もう一度動かすこと。
  relationships:
  - name: エレン
    relation: 時計師
  arc: 時計の修理を通じて、止まっていた自身の過去への悔恨を昇華し、静かな安らぎを得る。
- name: リーナ
  role: 脇役
  age: 17
  gender: 女性
  appearance: 活発なショートヘア。蒸気機関の工具を腰に下げた、動きやすい作業服姿。いつも少し煤けている。
  personality: 明るく好奇心旺盛で、街の噂に詳しい。一人称は「私」。
  speech_style: はきはきとしていて、元気な口調。語尾に独特の弾みがある。
  background: 港町の蒸気機関整備士の見習い。エレンの店に、部品の相談や差し入れを持ってよく顔を出す。
  motivation: 新しい技術を学び、いつか自分も街を動かす大きな機械を扱えるようになること。
  relationships:
  - name: エレン
    relation: 親友・協力者
  arc: 単なる技術への興味だけでなく、機械に宿る「人の想い」という概念に触れ、技術者としての視点が変わる。
- name: アルベルト
  role: 脇役
  age: 29
  gender: 男性
  appearance: 洗練された都会的なスーツ。常に最新式の蒸気式懐中時計をポケットに入れている。
  personality: 合理的で効率を重んじるリアリスト。一人称は「僕」。
  speech_style: 知的で理路整然としているが、少し早口で自信に満ちている。
  background: 街の近代化を推進する蒸気工学研究所の若手研究員。古いものを「非効率」として切り捨てる傾向がある。
  motivation: 街のすべての機構を最新の蒸気式へと置き換え、生活を最適化すること。
  relationships:
  - name: エレン
    relation: 価値観の異なる知人
  arc: エレンが直す「記憶を宿した時計」の価値に直面し、効率だけでは測れないものの重要性を理解する。
