- name: ハルト・セト
  role: 主人公
  age: 17
  gender: 男性
  appearance: 都市部では清潔感のある「優等生」風の身なり。瞳にはどこか虚無感が漂い、周囲の期待に合わせて表情を使い分けている。
  personality: 冷笑的で、感情の共有を「ノイズ」として嫌う。適当に生きることでシステムから目を逸らそうとする。一人称は「ボク」。
  speech_style: 都市部では模範的な丁寧語、ルナに対してはぶっきらぼうで素直になれないタメ口。
  background: 高い共感指数を持つエリート層の家庭に育つが、数値化される感情の虚飾に嫌気が差し、あえて「無感情（ゼロ）」を装い始めた。
  motivation: システムから逃避することから始まり、最終的にはルナを守り、自分自身の「本当の感覚」を証明すること。
  relationships:
  - name: ルナ
    relation: 恋慕の対象であり、自分の世界を壊してくれた理解不能な理解者
  - name: ゼノ
    relation: かつて自分が属していた秩序の象徴であり、対立する存在
  arc: 虚構の共感に依存する社会人から、不完全で不器用な、タグ付け不能な個の感情を信じる人間へ。
- name: ルナ・ヴォルテックス
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 油汚れのついた作業着、動きやすいショートヘア。瞳は機械のように澄んでいるが、情熱的な光を宿している。
  personality: 直情的で、機械に対しては深い慈しみを持つ。デジタルな価値観に一切染まっていない。一人称は「あたし」。
  speech_style: 活発で、比喩に機械用語（トルク、同期、摩擦など）を混ぜる癖がある。
  background: ネットワーク圏外の廃墟で、亡き両親が残した蒸気機関車の修復に人生を捧げている。
  motivation: 『氷の城』へ辿り着き、デジタル化されなかった両親の「生の記憶」を取り戻すこと。
  relationships:
  - name: ハルト
    relation: 共に旅をする相棒であり、守るべき大切な存在
  arc: 過去の記憶に固執する少女から、現在進行形の「共有できない時間」を愛する少女へ。
- name: 管理官ゼノ
  role: 敵役
  age: 35
  gender: 男性
  appearance: 完璧な造形美を持つ。肌は陶器のように滑らかで、感情の揺らぎが一切見えない、非の打ち所がない美男子。
  personality: 徹底した合理主義者。全人類の幸福は「感情の完全同期」によってのみ達成されると信じている。一人称は「私」。
  speech_style: 穏やかで慈愛に満ちた、しかし拒絶を許さない絶対的なトーン。カスタマーサポートのような丁寧さ。
  background: シンクロポリスの管理AIと直結した、都市の秩序維持の象徴。
  motivation: ルナの計画を「社会の不純物」として排除し、全市民の感情を完全同期させること。
  relationships:
  - name: ハルト
    relation: かつての模範的な市民であり、矯正すべき逸脱者
  arc: 完璧なシステムとしての威厳を保とうとするが、ハルトの「非合理な選択」によって論理の限界を突きつけられる。
- name: K（ケー）
  role: 脇役
  age: 72
  gender: 男性
  appearance: 継ぎ接ぎだらけの防護服を纏った、痩せこけた老人。廃墟のジャンク品に囲まれて暮らしている。
  personality: 飄々としており、どこか達観している。世界の終わりと始まりを同時に見ているような雰囲気。一人称は「ワシ」。
  speech_style: 古めかしい言い回しが多く、謎めいた助言や、アナログな技術に関する知識を語る。
  background: かつてシンクロポリスの設計に関わった元技術者。現在はネットワーク圏外で隠遁生活を送る。
  motivation: 次世代の人間が、デジタルな支配から脱却して「自分自身の心」を取り戻せるかを見届けること。
  relationships:
  - name: ルナ
    relation: 技術的な助言を与える師のような存在
  - name: ハルト
    relation: 変化の兆しを見せる、興味深い観測対象
  arc: 物語の導き手として、ハルトとルナが「アナログな心臓」を鳴らすためのきっかけを作る。
