title: ＃タグ付け禁止の恋、あるいはアナログな心臓の鳴らし方
genre: 青春恋愛
tone: ハイテンションかつシニカル。デジタルな喧騒とアナログな静寂のコントラスト。
pov: 一人称（ボク）
tense: 現在形・過去形混在（口語体）
setting: 全市民が脳内チップで感情を共有し、「共感指数」で階級が決まる近未来都市『シンクロポリス』と、その外縁にあるネットワーク圏外の廃墟地帯。
premise: 感情の「いいね」こそが正義な世界で、あえて「無感情（ゼロ）」を装い適当に生きるボク。そんなボクが、圏外の廃墟で骨董品の蒸気機関車を直そうとしている風変わりな少女・ルナに出会う。彼女が目指すのは、全データの墓場であり物理的に凍結されたサーバー拠点『氷の城』。効率化された恋なんてクソ食らえな、最高に不便でもどかしい、タグ付け不能な青春が始まる。
themes:
- 本物の感情
- 接続と切断
rules:
- 市民は脳内チップで感情をリアルタイム共有し、共感指数が高いほど社会的地位が得られる。
- ネットワーク圏外（デッドゾーン）ではチップが機能せず、生身の感覚のみで生活しなければならない。
- 『氷の城』は都市の全記憶を保存する超低温サーバー群であり、物理的な鍵と旧時代の輸送手段がなければ到達できない。
plot_outline:
- '序盤: 共感指数を操作して「いい奴」を演じているボクが、逃避行の途中でデッドゾーンに迷い込み、蒸気機関車を整備する少女ルナに拾われる。'
- '中盤: ルナの目的が『氷の城』に封印された亡き親の「非デジタルな記憶」を取り戻すことだと知り、ボクは彼女の助手としてアナログな生活に染まっていく。SNSの虚構に疲れ、ルナとの『共有できない時間』に本物の恋心を抱き始める。'
- '終盤: 蒸気機関車で『氷の城』へ強行突破。管理AIが提示する「完璧な幸福（偽物の記憶）」の誘惑を振り切り、ボクはルナを守るために自分の全共感指数（社会的地位）をシステムに投げ打ってハッキングを敢行する。'
- '結末: 社会的な敗北者となったボクとルナ。けれど、誰にも観測されない場所で、蒸気機関車の汽笛を鳴らしながら、二人だけの不器用な恋愛をスタートさせる。'
style_notes: 「草」「w」「（絶望）」などのネットスラングを多用。各話の途中に【タイムライン：@anonymous「この主人公、都合良すぎじゃない？」】といった、作中のSNS投稿や読者のメタ的なツッコミを模したコメント欄を挿入し、物語のテンポを加速させる。
