- name: レオン・ヴァレンタイン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 煤けたゴーグルを額にかけ、砂塵で汚れぐずついた革のベストを着た青年。左耳に小さな真鍮の歯車を飾っている。
  personality: 好奇心旺盛で、どこか達観している。面倒くさがりだが、いざという時の胆力は据わっている。一人称は「俺」。
  speech_style: やや気だるげだが、商売人の名残で口達者。「〜だろ」「〜じゃねえの」といった砕けた口調。
  background: 移動都市の片隅で、使い物にならないガラクタを修理しては日銭を稼ぐ露天商の孤児。
  motivation: 偶然手に入れた壊れた懐中時計の秘密と、それが示す「氷の城」の正体を突き止めること。
  relationships:
  - name: シェラ・ナヴィ
    relation: 共に旅をする相棒の機械技師
  - name: ヴォルフ・ガレオン
    relation: 執拗に懐中時計を狙う敵対者
  arc: 過去の遺物に囚われていたが、旅を通じて過去でも未来でもなく「現在（いま）」を生きることの大切さを知る。
- name: シェラ・ナヴィ
  role: 相棒
  age: 21
  gender: 女性
  appearance: 耐熱性の青いオーバーオールを着込み、油と煤で汚れた手袋を常備している。鮮やかな赤髪を無造作に束ねている。
  personality: 冷静沈着で理知的。機械いじりが何よりも好きで、蒸気船のエンジン音を聞いていると機嫌が良い。一人称は「私」。
  speech_style: 論理的ではきはきとした物言い。「〜よ」「〜ね」といった端正なトーンだが、機嫌が悪いと辛辣になる。
  background: かつて移動都市の大手ギルドで蒸気機関の設計技師をしていたが、自由を求めてドロップアウトした。
  motivation: 古代文明の超技術（ロストテクノロジー）が詰まった「氷の城」の構造をこの目で確かめ、自分の技術の糧にすること。
  relationships:
  - name: レオン・ヴァレンタイン
    relation: 軽口を叩き合うが信頼している相棒
  arc: 机上の空論や完全な機械仕掛けを求めていたが、レオンの選択を見届けることで、不完全さの中にある美しさを受け入れるようになる。
- name: ヴォルフ・ガレオン
  role: 敵役
  age: 42
  gender: 男性
  appearance: 豪奢な金色の装飾が施された軍服風のコートをまとい、右目は機械式の義眼で冷たく青く光っている。
  personality: 野心家で冷徹。秩序と管理を重んじ、世界のすべてを自らの統制下に置こうとする。一人称は「私（わし）」。
  speech_style: 威圧感があり、命令口調や皮肉交じりの紳士的な口調を使い分ける。「〜かね」「〜し給え」。
  background: 砂漠の交易ルートを牛耳る強大な交易ギルドの幹部。かつて世界を停止させた「時間凍結」の再来を企む。
  motivation: 「氷の城」の権能を手に入れ、砂漠の全都市を完全に管理・支配すること。
  relationships:
  - name: レオン・ヴァレンタイン
    relation: 計画を邪魔する厄介な小僧
  arc: 時間に縛られ、永遠の停滞を望むがああまりに、最後はレオンたちの選んだ変化する世界に敗北する。
