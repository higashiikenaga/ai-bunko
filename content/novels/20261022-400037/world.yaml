title: 琥珀色の砂風と、凍てついた刻の揺り籠
genre: スチームパンク冒険
tone: エキゾチックで幻想的な語り口
pov: 三人称
tense: 過去形
setting: 巨大な蒸気機関で駆動する移動都市と、果てしなく広がる黄金の砂漠。水と香辛料が通貨と同義である世界。
premise: 砂漠の交易都市でガラクタを商う青年が、ある日「決して時を刻まない壊れた懐中時計」を手に入れる。その針が指し示したのは、灼熱の地の最深部に眠るという伝説の「氷の城」だった。失われた文明の遺産を求め、蒸気帆船に乗り込んだ青年が、静寂と喧騒の狭間で運命に抗う旅に出る。
themes:
- 喪失と再生
- 文明の儚さ
rules:
- 蒸気機関による動力こそが権力の象徴であり、浄水技術を持つ者が街を支配する。
- 砂漠には『刻の嵐』と呼ばれる、局所的に時間軸を歪ませる気象現象が存在する。
- 氷の城の内部では物理的な時間は停止し、人々の強い記憶だけが結晶化して物質として存在する。
plot_outline:
- '序盤: 喧騒極まる市場で壊れた懐中時計を拾った主人公が、それが「氷の城」へ導く方位磁針であることを知る。'
- '中盤: 気の置けない仲間と共に蒸気帆船で砂漠を横断。追撃してくる交易ギルドの軍勢と戦いながら、静寂に包まれた夜の砂漠で旅の目的を問い直す。'
- '終盤: 灼熱の最深部に突如として現れる氷の城に到達。時計を鍵として城の深部へ入り、世界から時間を奪い去った古代の機械仕掛けの真実に直面する。'
- '結末: 主人公は時計を修理して時間を戻すのではなく、あえて壊れたままにして「今という不確かな瞬間」を生きることを選び、城と共に消えゆく記憶を抱いて日常へと帰還する。'
style_notes: 市場の喧騒（香辛料の香り、商人たちの怒号、蒸気の噴射音）を濃密かつ彩り豊かに描き、それとは対照的に、夜の砂漠や氷の城の静寂を、耳が痛くなるほどの空白として表現すること。語り部が聴衆に伝説を説き聞かせるような、ゆったりとした情緒的な文体を維持する。
