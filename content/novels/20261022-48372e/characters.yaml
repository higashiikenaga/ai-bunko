- name: カエレン
  role: 主人公
  age: 21
  gender: 男性
  appearance: 淡い灰色の髪に、知的ながらもどこか儚げな面持ち。禁書保管庫の番人としての古びたローブを纏い、指先には常にインクの汚れがついている。
  personality: 内向的で思慮深く、静寂を好む。責任感が強く、他者の痛みに敏感な心優しい青年。一人称は「僕」。
  speech_style: 丁寧で控えめな口調。時折、書物から引用したような古風な言い回しが混ざる。
  background: 聖都の禁書保管庫で、忘れ去られた知識の管理をしていた。唯一の居場所であった街が『意味の浸食』で消滅したことで、絶望の中で手紙を拾い上げる。
  motivation: 世界の崩壊を止め、失われた「意味」を取り戻すことで、誰かが誰かを想う記憶を救いたい。
  relationships:
  - name: リィネ
    relation: 旅の同行者であり、心を通わせる戦友
  - name: ゼフィール
    relation: 世界の残酷な真実を教える導き手であり、危うい協力者
  arc: 知識への執着と孤独な番人としての人生から脱却し、世界のために自己を捧げるという究極の愛と覚悟に至る。
- name: リィネ
  role: 相棒
  age: 24
  gender: 女性
  appearance: 使い込まれた銀色の甲冑を身に纏う騎士。鋭い眼差しを持つが、微笑むと年相応の幼さが見える。大きな大剣を背負っている。
  personality: 質実剛健で忠実。言葉を失っているため感情表現は乏しいが、行動で示す深い慈愛と献身性を持つ。一人称は（心の中で）「私」。
  speech_style: 喋ることができないため、身振り手振りと、カエレンにだけ伝わる独特の合図、または短い書き置きで意思疎通する。
  background: かつては王国最強の騎士団に属していたが、『意味の浸食』により「言葉」という定義を奪われ、騎士としての誇りだけを頼りに彷徨っていた。
  motivation: 再び言葉を取り戻し、かつて守りきれなかった人々への誓いを果たすこと。
  relationships:
  - name: カエレン
    relation: 自分の失った声を理解しようとしてくれる唯一の理解者
  arc: 喪失感による絶望から、言葉がなくとも心で繋がれることを学び、カエレンを守る最強の盾として覚醒する。
- name: ゼフィール
  role: 脇役/導き手
  age: 38
  gender: 男性
  appearance: 色褪せた極彩色のコートを羽織り、いくつもの不思議な小瓶をぶら下げた風変わりな商人。常に薄笑いを浮かべている。
  personality: 皮肉屋で計算高いが、根底には人間への深い諦念と愛情が共存している。快楽主義的に振る舞う。一人称は「俺」。
  speech_style: 芝居がかった大げさな話し方。相手を食ったような軽薄な口調。
  background: 記憶を物質化して売買する「記憶商人」。自らの重要な記憶を切り売りして生き延びてきたため、自身の過去の多くを忘れている。
  motivation: 世界の崩壊を特等席で眺めていたいと考えていたが、カエレンの純粋さに触れ、物語の結末に興味を持つ。
  relationships:
  - name: カエレン
    relation: 興味深い観測対象であり、久々に感じた「希望」の象徴
  arc: 冷笑的な傍観者から、最後には自らの残った記憶をカエレンの旅の助けとして提供する、真の利他的な行動へ転じる。
