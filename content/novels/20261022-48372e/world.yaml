title: 蒼穹の挽歌と眠れる誓約
genre: 異世界ファンタジー
tone: 重厚かつ荘厳。神話的な余韻を纏った格調高い雰囲気
pov: 三人称
tense: 過去形
setting: 意味を喪失し、緩やかに崩壊へと向かう大陸「エテルガルド」。かつて神々が言葉で世界を編んだとされる、古き信仰と忘却が共存する時代。
premise: 万物がその「定義」を失い、灰へと還る病『意味の浸食』に侵された世界。禁書保管庫の番人であった青年カエレンは、偶然にも神代の落とし物である「失われた手紙」を拾い上げる。そこには、世界の崩壊を止める唯一の術と、太古に交わされた残酷な約束が記されていた。カエレンは絶望の淵にある世界を救うため、伝説にのみ語られる「約束の丘」を目指して、記憶と祈りの旅に出る。
themes:
- 記憶の継承と忘却
- 運命への抗い
- 言葉に宿る祈りと呪い
rules:
- '【意味の浸食】: 物や人がその名前や定義を忘れられたとき、物理的な実体を失い、白い灰となって消滅する。'
- '【言霊の術式】: 始祖神が用いたとされる『原初の言語』を正しく発声することで、事象を書き換える魔法が発動するが、術者の精神に多大な負荷をかける。'
- '【等価の沈黙】: 世界に新たな意味を書き加えるには、術者が持つ最も大切な記憶を一つ、永久に消去しなければならない。'
plot_outline:
- '序盤: 静寂に包まれた聖都の禁書庫で、カエレンが神代の神から人間へ宛てられた『失われた手紙』を発見する。同時に、彼が愛した街の半分が『意味の浸食』により一夜にして消滅し、彼は手紙に記された目的地へと旅立つことを決意する。'
- '中盤: 旅の途中で、言葉を失った騎士や、記憶を売って生き延びる商人に遭遇する。カエレンは手紙の断片を解読しながら、かつて神々が人間に与えた恩恵が、実は世界を蝕む呪いの一部であったという残酷な歴史を紐解いていく。'
- '終盤: 幾多の試練を乗り越え、世界の頂に位置する『約束の丘』に到達する。そこには世界の再構築を司る太古の祭壇があり、手紙の正体が、かつて神が愛した人間への、叶わぬ再会の誓約であったことが明かされる。'
- '結末: カエレンは世界を再生させるため、自らの存在に関するすべての記憶を対価として捧げる。世界に色彩と意味が戻るが、誰もカエレンのことを覚えていない。ただ、丘の上に一通の手紙だけが残り、新たな時代の物語が始まる。'
style_notes: 地の文は、古風で重厚な語彙を用い、歴史書や叙事詩を読み進めるようなリズムで記述する。場面転換や重要な局面では、「古き詩篇」や「忘れ去られた伝承」を引用し、世界の奥行きを演出すること。キャラクターの台詞は、身分や種族によって明確に書き分け、特に高位の存在には古風な尊称や婉曲的な表現を多用させる。
