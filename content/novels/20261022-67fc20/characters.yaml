- name: ギィ・ヴァルツ
  role: 主人公
  age: 24
  gender: 男性
  appearance: 油汚れのついた作業着に、使い込まれた革の工具ベルト。無造作に伸びた茶髪と、常に何かに集中している鋭い瞳。指先は機械油で黒ずんでいる。
  personality: 不器用で口下手だが、機械の構造や動きに対しては異常なまでの情熱と直感を持つ職人気質。一人称は「俺」。
  speech_style: ぶっきらぼうで簡潔。しかし、機械の修理や構造について語る時だけは、驚くほど早口で饒舌になる。
  background: 浮遊都市の最下層、廃材置き場に近い工房で独り暮らしをする天才技師。社会的な地位には興味がなく、ただ「動かないものを動かすこと」だけを生きがいとしている。
  motivation: 壊れた機械を完璧な状態に戻すこと、そして未知の古代技術への純粋な探究心。
  relationships:
  - name: リナ・エルム
    relation: 潜航における唯一のナビゲーターであり、信頼する友人
  - name: ゼノス・クロム
    relation: 自分を利用する政治的な障壁
  arc: 「ただの修理屋」としての技術が、世界の存亡を左右する「創造の力」であることを自覚し、責任を背負って帰還する。
- name: リナ・エルム
  role: 相棒
  age: 20
  gender: 女性
  appearance: 精密な観測機器を多数装着した軽装の航海士。知的な印象を与える銀縁の眼鏡をかけ、常にタブレット端末を手にしている。
  personality: 冷静沈着で論理的。数字やデータに基づいた判断を好むが、ギィの突拍子もない行動を支える芯の強さを持つ。一人称は「私」。
  speech_style: 丁寧で理性的。緊急時には指示を出す際に非常に明快で、迷いのない口調になる。
  background: 浮遊都市の気圧観測局に所属する若きエリート観測士。都市の崩壊をデータとしていち早く察知し、ギィに協力を要請した。
  motivation: 気圧低下による都市の崩壊を食い止め、市民の命を守ること。
  relationships:
  - name: ギィ・ヴァルツ
    relation: 技術的な補完関係にあるパートナー
  arc: データ（予測）が通用しない極限状態において、ギィの「直感」と「即興性」を信じる勇気を手に入れる。
- name: ゼノス・クロム
  role: 敵役
  age: 55
  gender: 男性
  appearance: 磨き上げられた真鍮の装飾が施された豪華な礼服を纏う、威厳のある老人。常に余裕を感じさせる笑みを浮かべている。
  personality: 極めて功利主義的。都市の秩序維持のためなら、個人の犠牲を厭わない冷徹な政治家。一人称は「私」。
  speech_style: 慇懃無礼。相手を敬っているようでいて、その実、駒としてしか見ていない高圧的な話し方。
  background: 浮遊都市評議会の最高幹部。都市の維持を最優先事項とし、ギィのような「制御不能な天才」を道具として利用しようとする。
  motivation: 都市の体制を維持し、自らの権力を揺るがさないこと。
  relationships:
  - name: ギィ・ヴァルツ
    relation: 都市を救うための「使い捨ての道具」
  arc: 計算外の事態（ギィの即興的な成功）に直面し、自らが信じる「秩序」の脆さを突きつけられる。
- name: セレス
  role: 脇役
  age: 200
  gender: 女性（外見的）
  appearance: 深海鏡の投影によって現れる、半透明で青白く光る女性のホログラム。古代文明の意匠を凝らしたドレスを纏っている。
  personality: 穏やかでどこか哀愁を帯びており、機械の意志を代弁するような神秘的な性格。一人称は「私」。
  speech_style: 古めかしく、詩的で抽象的な表現を好む。まるで遠い記憶を語るかのような口調。
  background: 海底遺跡の管理システムの一部であり、深海鏡を通じて機械の内部情報を視覚化する役割を担うAIのインターフェース。
  motivation: 主時計の再起動と、失われた文明の記憶を次世代へ繋ぐこと。
  relationships:
  - name: ギィ・ヴァルツ
    relation: 技術的な導き手であり、文明の継承者としての観察対象
  arc: 停滞していた自身のプログラムが、ギィの「破壊と創造」のプロセスによって新たな意味を見出す。
