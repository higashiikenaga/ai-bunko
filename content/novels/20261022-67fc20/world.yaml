title: 真鍮の圧力と深海鏡の共鳴
genre: SF
tone: 重厚な工業的質感と油臭い職人世界
pov: 三人称
tense: 過去形
setting: 浮遊都市と、その遥か深海に沈む機械文明の遺構がある世界
premise: 浮遊都市の生命線である「大気圧調整機」が寿命を迎え、世界は緩やかな窒息へと向かっていた。唯一の希望は、海底遺跡に眠る伝説の主時計を再起動させること。不器用な天才技師ギィは、水圧に耐えうる真鍮製の潜水殻を組み上げ、暗い海の底へと潜る。そこで彼が見つけたのは、機械の内部構造を完璧に投影する「深海鏡」と、止まったままの巨大な歯車だった。
themes:
- 技術の継承と忘却
- 職人の矜持
rules:
- 世界の全エネルギーは海底の主時計が生成する『圧力差』によって供給されている
- 深海潜航には、内部気圧を外部と同期させる『圧力平衡バルブ』の精密な操作が不可欠である
- 深海鏡は物体を映すのではなく、その物体の『設計図（ブループリント）』を視覚化する特性を持つ
plot_outline:
- '序盤: 浮遊都市の煙突から出る煙が薄くなり、気圧低下による疾病が蔓延する。ギィは都市評議会から、海底遺跡への潜航と主時計の修理を強引に依頼される。'
- '中盤: 自作の潜水殻で深海へ潜行。水圧で軋む真鍮の壁と、油漏れに格闘しながら海底遺跡に到達する。そこで、機械の構造を透視できる『深海鏡』を発見し、主時計の心臓部である『超硬度合金製の主歯車』が破断していることを突き止める。'
- '終盤: 予備部品のない絶望的な状況の中、ギィは遺跡内の廃材と潜水殻の一部を解体し、即興の鋳造炉を構築。深海鏡で導き出した最適解に基づき、極限の圧力下で新しい歯車を鍛造する。'
- '結末: 再起動した主時計が巨大な鐘の音を深海に響かせ、浮遊都市に安定した気圧が戻る。ギィは名声に興味を示さず、使い古したスパナを片手に、次なる発明の構想を練りながら地上へ帰還する。'
style_notes: 蒸気、真鍮、潤滑油、煤煙の描写を執拗に盛り込むこと。特に『差動歯車』や『往復動ピストン』などの機械的構造の説明には具体性を持たせ、職人間では「あぁ」「ああだ」といった簡潔で無骨な会話を徹底させる。静寂を破る鐘の音と、絶え間ない機械の駆動音を文章のリズムに組み込む。
