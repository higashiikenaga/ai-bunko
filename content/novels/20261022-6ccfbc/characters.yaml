- name: 瀬戸 蓮（セト レン）
  role: 主人公
  age: 19
  gender: 男性
  appearance: 無造作な黒髪に、少し隈のある瞳。常にスマホや機材を身に纏っているような、デジタルに依存した生活感がある。
  personality: 内向的で自己肯定感が低いが、一度興味を持つと寝食を忘れて没頭するタイプ。一人称は「ボク」。
  speech_style: 配信時は明るく振る舞うが、素は早口で自信なさげな話し方。
  background: 登録者数が増えない底辺配信者として、孤独と承認欲求の狭間で揺れる大学生。
  motivation: ルナを時間の迷子から救い出し、デジタルではない「手触りのある繋がり」を掴むこと。
  relationships:
  - name: ルナ
    relation: 救いたいヒロイン
  - name: 佐々木 海斗
    relation: 唯一の現実の友人
  arc: 画面越しの承認欲求のために配信していた少年が、目の前の大切な存在を守るために、デバイスを捨てて現実へ飛び出す勇気を得る。
- name: ルナ
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と、夜空のように深い瞳を持つ。どこか懐かしい、少し古いデザインの制服を着ている。
  personality: 儚げで物静かだが、自分の運命に対しては静かな覚悟を持っている。一人称は「わたし」。
  speech_style: 丁寧で、どこか時代がかった古風な言い回し。
  background: 数年前、大切な約束の場所に間に合わなかった後悔から、止まった時間の中に閉じ込められた「時間の迷子」。
  motivation: 止まった懐中時計を動かし、もう一度「明日」という時間へ戻ること。
  relationships:
  - name: 瀬戸 蓮
    relation: 自分を見つけてくれた唯一の人
  arc: 過去の後悔に縛られた「幽霊」のような存在から、未来への希望を抱いて消えていく「一人の人間」へと変化する。
- name: 佐々木 海斗（ササキ カイト）
  role: 相棒
  age: 19
  gender: 男性
  appearance: 作業着やパーカーが似合う、がっしりとした体格。常に油の匂いや機械のパーツを持ち歩いている。
  personality: 徹底的な現実主義者で論理的だが、情に厚い。一人称は「俺」。
  speech_style: ぶっきらぼうで、結論から先に述べる断定的な話し方。
  background: 時計修理店を営む祖父を持つ、メカニック志望の大学生。レンの数少ない理解者。
  motivation: レンの奔走を支え、ルナを救うための「アナログな解決策（時計の修理）」を物理的に実現すること。
  relationships:
  - name: 瀬戸 蓮
    relation: 親友
  - name: ルナ
    relation: 謎を解明すべき対象
  arc: 全てを科学や論理で割り切ろうとしていた青年が、理屈を超えた「奇跡」や「祈り」の価値を認め始める。
