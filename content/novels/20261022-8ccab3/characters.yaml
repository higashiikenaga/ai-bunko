- name: エライ・ヴァンス
  role: 主人公
  age: 22
  gender: 男性
  appearance: 無彩色の制服を完璧に着こなす、色素の薄い端正な容貌。感情を排した虚ろな瞳をしている。
  personality: 冷静で規律を重んじるが、内面に強い孤独感を抱いている。一人称は「僕」。
  speech_style: 極めて丁寧で、感情の起伏が少ない事務的な口調。
  background: エデン・セクターの記録官。規定通りの『調和指数』を維持し、システムの歯車として忠実に勤務してきた。
  motivation: 地図の目的地を確認し、自分自身が感じている「違和感」の正体を突き止めること。
  relationships:
  - name: シオン
    relation: 追跡者であり、かつての同僚
  arc: システムの歯車として無感情に生きていた青年が、色彩と感情を取り戻し、自らが「ノイズ」であることを受け入れて抵抗する人間へと変貌する。
- name: シオン・レイド
  role: 敵役
  age: 25
  gender: 男性
  appearance: 鋭い眼光と、一切の無駄がない動き。常に清潔で機能的な警備隊の装備を身に纏っている。
  personality: 徹底した秩序主義者。感情を「バグ」と見なし、排除することに躊躇がない。一人称は「私」。
  speech_style: 断定的で威圧感があり、論理的かつ冷徹な話し方。
  background: エライの同期であり、記録官としての優秀さを認められて警備隊に抜擢されたエリート。システムの維持を絶対の正義と信じている。
  motivation: 社会の調和を乱す『ノイズ』を検出し、完全に抹消すること。
  relationships:
  - name: エライ・ヴァンス
    relation: かつての同僚であり、抹消対象
  arc: エライを追う中で、自身の信じる「秩序」が揺らぎそうになるが、最終的にはシステムの守護者として非情な決断を下す。
- name: リナ・メイ
  role: 脇役
  age: 19
  gender: 女性
  appearance: 管理区域の隅でひっそりと暮らす、痩身で影のある少女。衣服は継ぎ接ぎだらけだが、瞳だけは強い光を宿している。
  personality: 慎重だが好奇心旺盛。抑圧された環境下でも、わずかな美を見出そうとする強さを持つ。一人称は「私」。
  speech_style: ささやくような、しかし芯のある控えめな話し方。
  background: 非管理区域の境界付近で、廃棄された旧時代の遺物を回収して生き延びている「境界の住人」。
  motivation: 失われた色彩の世界の断片を、誰かに伝えること。
  relationships:
  - name: エライ・ヴァンス
    relation: 地図の謎を解くヒントを与える協力者
  arc: エライに地図の価値と「感情」の重さを教え、彼が地下へ向かうための精神的な導き手となる。
