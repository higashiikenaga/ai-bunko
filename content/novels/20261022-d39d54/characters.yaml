- name: カイ
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無造作な黒髪に、意志の強さを感じさせる鋭い瞳。使い古された整備士用ジャンパーを着用している。
  personality: 真っ直ぐで熱血漢。嘘をつけない性質ゆえに周囲からは浮いているが、内面には誰よりも熱い魂を秘めている。一人称：俺
  speech_style: 飾り気がなく、単刀直入。嘘が混じる「ネオン・バベル」の社交辞令を理解できず、常に言葉がストレート。
  background: 脳内チップの不具合により、嘘を吐こうとすると激しい拒絶反応が出る「真実の呪い」を背負った少年。廃棄区画で孤独に生きていた。
  motivation: 自分の存在理由を見つけること、そして偽りのない世界をその手で掴み取ること。
  relationships:
  - name: ルナ
    relation: 信頼し合うパートナー
  - name: ゼファー
    relation: 宿命のライバル
  arc: 自身の「嘘をつけない性質」を欠点や呪いとして忌み嫌っていたが、最終的にはそれを「揺るぎない信念」へと昇華させ、真の英雄へと成長する。
- name: ルナ
  role: 相棒
  age: 16
  gender: 女性
  appearance: ネオンブルーのショートヘアに、多数のデバイスを装着したサイバーパンク風の衣装。瞳には常にデータが流れている。
  personality: 冷静沈着で計算高いハッカー。嘘を巧みに操る街の住人だが、カイの純粋さに触れ、次第に心を開いていく。一人称：私
  speech_style: 早口で専門用語を多用する。皮肉屋だが、カイに対しては少しだけ毒気が抜けた話し方になる。
  background: 都市の中層区で高度なハッキング技術を駆使して生き抜いてきた少女。企業の陰謀に触れ、行方不明になった兄を追っている。
  motivation: 企業の不正を暴き、兄の行方を探ること。そしてカイの機体を完璧にサポートすること。
  relationships:
  - name: カイ
    relation: 共に戦う戦友
  arc: 情報の海に逃げ込み嘘で自分を偽ってきたが、カイと共に戦う中で、真実を伝えることの重みと勇気を学んでいく。
- name: ゼファー
  role: 敵役
  age: 19
  gender: 男性
  appearance: 洗練された白のパイロットスーツに身を包み、黄金のサイバネティクス義眼を持つ美青年。
  personality: 傲慢で完璧主義。嘘こそが社会を円滑にする「高度な知性」であると信じて疑わない。一人称：僕
  speech_style: 優雅で丁寧だが、相手を見下すような冷ややかな響きがある。
  background: 都市運営企業の精鋭パイロット。最新鋭の機体でグリッチ・ビーストを駆逐し、街の秩序を守る「正義」を演じている。
  motivation: 嘘によって構築された完璧な秩序を維持し、非効率な「真実」を排除すること。
  relationships:
  - name: カイ
    relation: 排除すべき異分子
  - name: ヴァーン局長
    relation: 雇用主であり絶対的な支配者
  arc: カイの圧倒的な「魂の熱量」に直面し、自分が信じてきた「完璧な嘘の世界」が崩壊していく恐怖と葛藤を味わう。
- name: ヴァーン局長
  role: 黒幕
  age: 48
  gender: 男性
  appearance: 隙のない銀色のスーツ。表情を一切変えない無機質な顔立ち。常にホログラムのモニターに囲まれている。
  personality: 冷徹で合理的。人間をデータの一部としてしか見ていない。一人称：私
  speech_style: 極めて事務的。感情の起伏が全く感じられない、機械的な話し方。
  background: ネオン・バベルを統治する巨大企業の最高責任者。グリッチ・ビーストの発生すらも、市民を管理するための計画の一部として利用している。
  motivation: 全人類の意識をデータ化し、嘘と真実の区別すら不要な、完全管理社会「ゼロ・エゴ」を構築すること。
  relationships:
  - name: ゼファー
    relation: 有用な駒
  - name: カイ
    relation: 計画を乱すノイズ
  arc: 完璧な管理を目指した結果、自らが作り出した究極の怪獣によって全てを失い、自らの構築したシステムの脆弱性を突きつけられる。
