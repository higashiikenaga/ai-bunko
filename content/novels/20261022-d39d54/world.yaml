title: ギガソウル・オーバードライブ：クロムバースト
genre: サイバーパンク
tone: 熱血・過剰演出・特撮風SF
pov: 三人称
tense: 過去形
setting: 西暦2144年、全住民が脳内チップで嘘を自在に操る超階層都市「ネオン・バベル」。
premise: 嘘こそが通貨であり礼儀である街で、唯一「嘘をつけない呪い」を背負った青年カイが、折れた剣を持つ旧式巨大ロボットで戦う！都市を喰らう電脳怪獣「グリッチ・ビースト」に立ち向かう、魂の咆哮の物語。冷徹な回路の世界を、真っ赤な情熱で焼き尽くせ！
themes:
- 真実の価値
- 不器用な誠実さ
rules:
- 魂の同期率（ソウルシンクロ）が高いほどロボットの出力が上がるが、精神的負荷が激増する
- 都市の全住民はチップにより意識的に嘘を生成できるが、カイだけはシステムエラーにより真実しか口にできない
- グリッチ・ビーストは都市の蓄積データがバグを起こして実体化した怪物である
plot_outline:
- '序盤: 嘘つきたちの街で疎まれるカイが、廃棄区画で伝説の旧式機『ガオ・ブレイカー』を起動させ、街を襲う中型怪獣を撃破する。しかし、機体の主武器である大剣は無残に折れていた。'
- '中盤: 都市運営企業の陰謀により、さらに巨大な怪獣たちが量産される。カイは仲間となるハッカーの少女と共に、機体の強化パーツを回収し、三つのユニットが激突・融合する超合体形態『ギガ・ガオ・ブレイカー』を完成させる。'
- '終盤: 全都市をデータごと消去しようとする究極の怪獣『ゼロ・エゴ』が出現。絶望的な状況の中、カイは「嘘をつけない」という呪いを「揺るぎない信念」へと昇華させ、折れた剣の隙間に魂の炎を充填させる。'
- '結末: 全エネルギーを一点に集中させた必殺技『ギガ・ソウル・クロムバースト』が怪獣を貫き、都市に偽りのない夜明けが訪れる。カイは不器用なまま、真実の絆を手にする。'
style_notes: 「ドガーン！」「ズガガガガ！」といった豪快な擬音を多用すること。台詞は感嘆符を多用し、叫ぶように記述。特に合体シーンや必殺技の演出は、空間が歪み宇宙が震えるかのような大げさな表現で盛り上げ、読者の血を沸騰させること。
