- name: 伝助
  role: 主人公
  age: 22
  gender: 男
  appearance: 快活な顔立ち。使い込まれた道具袋を肩にかけ、動きやすい短い半纏を纏っている。
  personality: 好奇心旺盛で情に厚い。お節介だが憎まれない江戸っ子。一人称は「俺」。
  speech_style: べらんめえ口調。早口で威勢が良い。
  background: 没落した商家の中年嫡男。家業を継がず、あらゆる道具を直して回る「修理屋」として長屋で自活している。
  motivation: 壊れたものを直し、人々の笑顔を取り戻すこと。
  relationships:
  - name: 源三郎
    relation: 気にかかる不思議な隠居
  - name: お菊
    relation: 口喧嘩の絶えない幼馴染
  arc: 単に物を直す技術者から、人の心の傷に寄り添い、絆を繋ぎ止める精神的な成熟を遂げる。
- name: 源三郎
  role: 相棒/キーマン
  age: 48
  gender: 男
  appearance: 痩身で頬がこけているが、眼光だけは鋭い。色褪せた古 kimonoを纏い、常に背筋が伸びている。
  personality: 寡黙でストイック。過去の罪悪感に囚われている。一人称は「私」。
  speech_style: 丁寧だが距離感のある武家言葉。必要最低限のことしか話さない。
  background: かつてある藩で重職に就いていたが、主君や仲間を裏切った（と思い込んでいる）ことで全てを捨て、身分を隠して長屋に潜伏している。
  motivation: 折れた剣と共に静かに朽ち果てること。
  relationships:
  - name: 伝助
    relation: 自分の殻を破ろうとする厄介な青年
  - name: 信之助
    relation: 過去の因縁を持つ宿敵
  arc: 絶望の中で抱えていた「折れた剣」を、捨てるべき恥ではなく、未来へ繋ぐ誓いの印として受け入れる。
- name: 信之助
  role: 敵役
  age: 35
  gender: 男
  appearance: 整った容姿だが、氷のように冷たい瞳を持つ。汚れ一つない黒い着物を端正に着こなしている。
  personality: 冷酷かつ完璧主義。力こそが正義だと信じている。一人称は「私」。
  speech_style: 静かで理知的だが、相手を見下す傲慢さが滲み出ている。
  background: 源三郎の元部下。源三郎が全てを捨てたことで信念を歪め、現在は権力者に取り入った冷徹な浪人として暗躍している。
  motivation: 源三郎を絶望させ、己の正しさを証明するために彼を抹殺すること。
  relationships:
  - name: 源三郎
    relation: 憎しみと憧憬が混ざった執着の対象
  arc: 個人の武力と権力で全てを支配しようとするが、長屋の人々の結びつきという「計算外の力」に敗北する。
- name: お菊
  role: 脇役/ムードメーカー
  age: 24
  gender: 女
  appearance: 健康的で明るい笑顔。いつも前掛けを締め、手際よく立ち働く。まとめ上げた髪に小さな簪を差している。
  personality: 肝が据わっており、誰に対しても分け隔てなく接する。長屋のまとめ役。一人称は「あたし」。
  speech_style: ハキハキとした江戸の女言葉。相手を鼓舞する言い回しが多い。
  background: 長屋で惣菜屋を営む。親を早くに亡くし、女手一つで店を切り盛りしてきた苦労人。
  motivation: 長屋の住人たちが家族のように仲良く暮らすこと。
  relationships:
  - name: 伝助
    relation: 呆れつつも信頼している相棒的な存在
  - name: 源三郎
    relation: 放っておけない不器用な居候のような存在
  arc: 源三郎という異物を長屋に受け入れさせることで、コミュニティの包容力を象徴する存在となる。
