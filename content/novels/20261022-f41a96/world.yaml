title: 折れた鉄と渡り鳥の季節
genre: 歴史・時代小説
tone: 活気ある江戸の情緒と、人情味あふれる温かな雰囲気
pov: 三人称
tense: 過去形
setting: 江戸、神田界隈の賑やかな長屋
premise: 道具を直して回る若旦那の伝助は、長屋に紛れ込んだ落ちぶれた元武士の隠居と出会う。隠居が大切に抱えていたのは、もはや武器にもならぬ「折れた剣」だった。季節は秋から冬へと移ろい、渡り鳥が空を渡る頃、長屋の住人たちは隠居の過去に巻き込まれていく。それでも、江戸っ子の意地と情けが、凍てつく心を溶かしていく。
themes:
- 失われた誇りと再生
- 隣人同士の絆
rules:
- 江戸の長屋の掟（隣近所の助け合い）は絶対である
- 季節の移ろいは必ず食文化を通じて描写される
plot_outline:
- '序盤: 秋が深まり、焼き芋の香りが漂う長屋の日常。修理屋の伝助が、不審な動きを見せる隠居・源三郎と出会い、彼が折れた剣を大切に持っていることに気づく。'
- '中盤: 渡り鳥が南へ飛び立つ季節、源三郎を追って冷酷な浪人が長屋に現れる。長屋の住人たちは騒動に巻き込まれるが、伝助は道具を直す技術と江戸っ子の知恵で、争いを回避しようと奔走する。'
- '終盤: 追い詰められた源三郎。折れた剣は、かつての栄光ではなく、守るべきものへの誓いとして再定義される。長屋の連中の団結が、武力による解決ではなく、人情による解決をもたらす。'
- '結末: 初雪が舞う中、長屋の皆で温かい汁物を囲む。源三郎の心は晴れ、江戸の夜に人情の灯がともる。'
style_notes: 三人称で、長屋の騒がしさをまるで目の前にあるように描くんだ。会話は『てやんでぇ、べらぼうめ！』ってな具合に、威勢よく、軽快に。季節が変われば、旬の美味いもんを忘んじゃいけねぇ。最後は、やっぱり人情で、心の奥がじーんと温かくなるような締め方にするのさ。
