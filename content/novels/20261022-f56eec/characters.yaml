- name: 佐々木 陽葵
  role: 主人公
  age: 17
  gender: 女性
  appearance: 明るい茶髪のポニーテール。日焼けした肌に、常に食いしん坊そうな期待に満ちた瞳をしている。
  personality: 好奇心旺盛で天真爛漫。食べることが大好きで、島のグルメマップを自作している。一人称は「あたし」。
  speech_style: 快活でテンポが早く、感情がすぐに顔に出る。食べ物の例え話をよく使う。
  background: 離島で生まれ育った地元高校生。島への愛着が強く、日常の小さな幸せを大切にしている。
  motivation: 美味しいものを食べ尽くすことと、海斗の不思議な計画に巻き込まれるドキドキ感を味わうこと。
  relationships:
  - name: 瀬戸 海斗
    relation: 強引に誘われた助手であり、次第に惹かれ合う相手
  - name: 潮崎 蓮
    relation: 幼馴染で、価値観の異なる喧嘩友達
  arc: 単なる「同行者」から、島の歴史と大切な人を守りたいと願う「主体的な人間」へと成長する。
- name: 瀬戸 海斗
  role: 相棒
  age: 17
  gender: 男性
  appearance: 色白で線が細い。どこか遠くを見つめるようなクールな眼差しと、古びた潜水日誌を常に持ち歩いている。
  personality: 冷静沈着で合理的だが、考古学と渡り鳥のことになると途端に熱くなる。不器用な優しさを持つ。一人称は「僕」。
  speech_style: 淡々としていて論理的。たまに専門用語を混ぜて話し、陽葵に突っ込まれる。
  background: ある目的を持って都会からこの島へ転校してきた。代々伝わる家系の秘密と、海底遺跡に深い因縁がある。
  motivation: 伝説の『海底の神殿』を発見し、家族が追い求めていた真実を解き明かすこと。
  relationships:
  - name: 佐々木 陽葵
    relation: 唯一自分を偏見なく受け入れ、世界を彩ってくれた助手
  - name: 凪子
    relation: 島の伝承を教えてくれる協力者
  arc: 過去の遺恨や家族の呪縛に囚われていたが、陽葵との時間を通じて「今」を生きる喜びを知る。
- name: 潮崎 蓮
  role: 敵役/脇役
  age: 17
  gender: 男性
  appearance: 整った顔立ちに眼鏡。清潔感のあるポロシャツを着用しており、優等生風の佇まい。
  personality: 現実主義で効率を重視する。ぶっきらぼうだが、実は誰よりも島の将来を憂いている。一人称は「俺」。
  speech_style: 皮肉屋で正論を突きつける傾向があるが、言葉の端々に陽葵への気遣いが滲む。
  background: 島をリゾート開発しようとしている建設会社の社長の息子。陽葵とは幼い頃からの付き合い。
  motivation: 開発によって島に経済的な潤いをもたらし、若者が消えない島にすること。
  relationships:
  - name: 佐々木 陽葵
    relation: 幼馴染であり、密かに想いを寄せている相手
  - name: 瀬戸 海斗
    relation: 対立する価値観を持つライバル
  arc: 開発こそが正義だと信じていたが、遺跡の価値と二人の絆に触れ、共生という新しい答えを模索し始める。
- name: 凪子
  role: 脇役
  age: 65
  gender: 女性
  appearance: 深い笑い皺がある温和な顔立ち。色鮮やかな割烹着を身に纏い、店先でいつも笑っている。
  personality: 包容力があり、島のすべてを知り尽くしている知恵袋。いたずら好きで若者の恋を応援する。一人称は「私」。
  speech_style: ゆっくりとした口調で、時折島特有の方言が混じる。比喩表現を多用する。
  background: 地元で人気の海鮮料理店を営む店主。かつて海斗の祖父とも交流があった。
  motivation: 島の記憶を次世代に繋ぐことと、美味しい料理で客を幸せにすること。
  relationships:
  - name: 佐々木 陽葵
    relation: 常連客であり、娘のように可愛がっている相手
  - name: 瀬戸 海斗
    relation: 導き手であり、見守るべき青年
  arc: 大きな変化はないが、二人が出した答えを肯定し、島の歴史の継承を彼らに託す。
