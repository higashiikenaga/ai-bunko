title: ソーダ色の波音と、渡り鳥のダイブ
genre: 青春恋愛
tone: 明るく軽快、でも少しだけセンチメンタル
pov: 一人称（あたし）
tense: 過去形
setting: 潮風の香る、夏休み中の小さな離島
premise: 食べ歩き大好き女子高生のアタシは、夏休みに「海底遺跡を探したい」という謎めいた転校生・海斗に、強引に助手として誘われる。彼が追う遺跡と、空を舞う渡り鳥の不思議な関係。美味しい海鮮丼と、揺れる心、そして青すぎる夏の記憶が、波音とともに動き出す。
themes:
- 未知への好奇心
- 大切な人との距離感
rules:
- 渡り鳥の飛来ルートは、海底遺跡のエネルギー流と一致している
- 遺跡は特定の潮位の時にしか、その入り口を現さない
plot_outline:
- '序盤: 夏休み開始。海斗の突拍子もない計画に振り回されつつも、地元の美味しいスイーツや海鮮を食べ歩く日々。海斗のクールな仮面の下にある熱い情熱に、あたしは少しずつ惹かれていく。'
- '中盤: 渡り鳥の大群が空を横切る夜、ついに海斗が目指す『海底の神殿』の入り口が見える。しかし、そこで遺跡の真実と、海斗が抱える家族との複雑な事情が明らかになる。'
- '終盤: 遺跡の調査が進む一方で、町には開発の波が押し寄せる。二人は、遺跡を守ることと、自分たちの恋をどう進めるかの間で葛藤し、一つの答えを出すために奔走する。'
- '結末: 渡り鳥が南へ旅立った後の静かな秋。遺跡は再び海の底へと沈んだけれど、二人の心には消えない青い刻印が刻まれている。'
style_notes: 「あたし」による軽快な一人称視点。会話劇を重視し、キャラクター同士のテンポのよい掛け合いやツッコミを通じて、キャラの可愛げを引き出す。食べ物の描写（食感、温度、香り）は徹底的に美味しそうに書き、毎話必ず読者がほっこりするような小さな笑いどころを配置すること。
