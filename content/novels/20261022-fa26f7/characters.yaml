- name: 瀬戸 謙悟
  role: 主人公
  age: 42
  gender: 男性
  appearance: 痩せこけて目の下に深い隈がある。色褪せたベージュのコートを纏い、常に震える手で折れた剣を握りしめている。
  personality: 繊細で強迫観念が強く、現状を否定し続けようとする。一人称は「僕」。
  speech_style: 丁寧だが、どこか上の空で独り言が多い。自信なげに言葉を濁らせる傾向がある。
  background: 海辺の村で娘と二人で暮らしていたが、ある事件をきっかけに娘を失う。精神的なショックから記憶を改竄し、理想的な「青空」の世界に逃避している。
  motivation: 娘が遺した地図の先に、失った平穏と娘への救いがあると考えている。
  relationships:
  - name: 瀬戸 澪
    relation: 亡き娘。愛していると同時に、無意識下で激しく恐れている。
  - name: 凪沢
    relation: 村の唯一の知人。導き手であると信じているが、実際には死の受容を促す案内人。
  arc: 娘を救いたいという「希望」から始まり、自身の罪を思い出す「絶望」を経て、自分がすでに死んでいるという「現実」に辿り着く。
- name: 瀬戸 澪
  role: 鍵となる人物（亡霊）
  age: 8
  gender: 女性
  appearance: 白いワンピースを着た、透き通るように白い肌の少女。常に霧の向こう側に立っており、表情は読み取れない。
  personality: 物静かで寂しげ。父親への愛と、拒絶された悲しみが同居している。
  speech_style: 断片的で囁くような話し方。直接的な答えを避け、比喩的な表現を用いる。
  background: 謙悟によって殺害された娘。父親の罪悪感が生み出した幻影でありながら、彼を真実（海底）へと導く意志を持っている。
  motivation: 父親に自分の死を認めさせ、共に底へと沈むこと。
  relationships:
  - name: 瀬戸 謙悟
    relation: 父。自分を殺した凶器を持つ男であり、同時に唯一愛していた人。
  arc: 慈愛に満ちた「導き手」としての姿から、最終的に血に染まった「被害者」としての姿へ変貌する。
- name: 凪沢
  role: 脇役・狂言回し
  age: 75
  gender: 男性
  appearance: 深い皺が刻まれた顔に、白濁した瞳を持つ老人。潮風でボロボロになった漁師服を着ている。
  personality: 冷徹で達観している。感情に流されず、残酷な真実を淡々と告げる。一人称は「私」。
  speech_style: 古風で突き放すような口調。「〜ですな」「〜ことだ」など、教訓めいた言い回しが多い。
  background: 村の長老的な存在。この村が「死者が現実を忘れるための待機所」であることを知っており、謙悟が目を覚ます（沈む）のを待っている。
  motivation: 謙悟が自らの罪を認め、この擬似的な世界から脱却することを促す。
  relationships:
  - name: 瀬戸 謙悟
    relation: 観察対象。哀れみを感じつつも、残酷に真実を突きつける。
  arc: 物語の進行に合わせて、親切な村人から、逃げ場をなくさせる冷酷な審判者のような立ち位置へと変化する。
- name: 追跡者（影）
  role: 敵役・概念的存在
  age: 0
  gender: 不明
  appearance: 泥のようにドロドロとした黒い人型の影。形が定まっておらず、移動するたびに水が滴る音がする。
  personality: 本能的な攻撃性と執拗さを持つ。意思疎通は不可能。
  speech_style: 言葉を発さず、心臓の鼓動のような重い足音と、水に溺れるような喘ぎ声のみを発する。
  background: 謙悟が切り捨て、忘れようとした「罪悪感」と「死の恐怖」が具現化したもの。謙悟自身の鏡合わせの存在である。
  motivation: 謙悟の認識を破壊し、彼を強制的に現実（海底）へ引き摺り戻すこと。
  relationships:
  - name: 瀬戸 謙悟
    relation: 同一人物の裏側。逃げれば逃げるほど、その距離を詰める。
  arc: 最初は正体不明の怪物として恐怖の対象となるが、最後には謙悟自身と一体化し、彼を完結させる。
