title: 模造された青空の、底に沈む
genre: ホラー
tone: 湿り気を帯びた、閉塞的な心理的恐怖
pov: 一人称
tense: 過去形
setting: 霧に包まれ、断崖に囲まれた寂れた海辺の村
premise: 「空は、いつも透き通るように美しい」――そう自分に言い聞かせながら、僕は霧の中を歩く。手元にあるのは、娘が遺した「秘密の地図」と、かつて守るべきものだと信じた「折れた剣」。地図が指し示す場所へ辿り着けば、失ったはずの平穏が戻ると信じて。しかし、背後から迫る「何か」の影が、僕の認識を少しずつ、確実に蝕んでいく。
themes:
- 記憶の防衛本能
- 罪の具現化
rules:
- 語り手の視界に入る色彩や音は、彼の精神状態によって極端に誇張・変容する
- 地図に記された道は、彼の記憶の欠落に合わせて物理的に接続を変える
plot_outline:
- '序盤: 霧の村で一人暮らす主人公が、亡き娘の遺品である『秘密の地図』と『折れた剣』を見つけ、地図が示す「宝物」を探す旅に出る。'
- '中盤: 地図を辿る過程で、村の景色が不自然に歪み、自分を殺そうとする『怪物』の気配を感じる。しかし、その足音は次第に自分自身の鼓動と同期し始める。'
- '終盤: 地図の終着点である海辺の洞窟に辿り着いた時、彼は『折れた剣』が娘を守るための道具ではなく、自分が彼女を傷つけた凶器であったことを思い出す。'
- '結末: 冒頭の「空は、いつも透き通るように美しい」という認識が反転する。実際には、彼は暗い海底に沈んでおり、美しい空は死の間際に見た、罪を忘却するための虚飾の幻覚であったことが明かされる。'
style_notes: 信頼できない語り手として、主人公の「見たい景色」を美しい色彩で描写しつつ、随所に生理的な嫌悪感を抱かせる違和感（腐敗臭や、不自然な音の重なり）を潜ませる。結末に向けて、読者が「美しい物語」だと思い込んでいる視覚情報を、残酷な物理的事実へと一気に引きずり下ろす。
