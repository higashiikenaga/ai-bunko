- name: 朝比奈 春樹
  role: 主人公
  age: 16
  gender: 男性
  appearance: 線が細く、少し猫背。常に疲れたような目つきをしているが、走る時だけ鋭くなる。
  personality: 内省的で考えすぎる傾向がある。他人と自分を比較して落ち込みやすい。一人称は「俺」。
  speech_style: 控えめで、語尾を濁らせることが多い。独白では詩的な表現を用いる。
  background: 中学時代は期待されていたが、高校進学後に壁にぶつかり、陸上部の底辺に甘んじている。
  motivation: 誰にも認められなくてもいいから、自分だけが納得できる「走る意味」を見つけたい。
  relationships:
  - name: 九条 蓮
    relation: 同級生であり、才能への劣等感を抱く対象
  - name: 水城 汐里
    relation: 地下図書館での秘密を共有する理解者
  - name: 空 海斗
    relation: ノートを通じて対話する、精神的なメンター
  arc: SNS的な「正解」や他人の速度に惑わされず、自分の鼓動と向き合い、泥臭く走り抜く強さを獲得する。
- name: 九条 蓮
  role: ライバル
  age: 16
  gender: 男性
  appearance: 整った顔立ちに鋭い眼差し。無駄のない筋肉がついた体型。常に清潔感がある。
  personality: ストイックで完璧主義。周囲からは自信満々に見えるが、内側では強迫的なプレッシャーに晒されている。
  speech_style: 端的で断定的な話し方。感情をあまり表に出さない。
  background: 陸上部のエース。SNSでも注目されるインフルエンサー的な存在であり、期待される役割を演じ続けている。
  motivation: 誰にも追いつかれない絶対的な頂点に立ち、孤独な不安を消し去ること。
  relationships:
  - name: 朝比奈 春樹
    relation: 最初は無視していたが、次第にその独自の走法に興味を持つ
  arc: 効率と結果だけを求める走りの限界を感じ、春樹の「不器用な情熱」に触れて、走る純粋な喜びを思い出す。
- name: 水城 汐里
  role: 相棒/ガイド
  age: 17
  gender: 女性
  appearance: 緩く編んだ髪に、サイズの大きなカーディガン。古書のような静かな雰囲気を纏っている。
  personality: 穏やかで達観している。観察眼が鋭く、核心を突く言葉をさらりと口にする。
  speech_style: ゆったりとした口調。相手に考えさせるような問いかけが多い。
  background: 図書委員。旧校舎の地下図書館の存在を知る数少ない人物であり、管理人のような役割を自称している。
  motivation: かつての伝説的ランナーが遺したノートが、誰の手によって完結するかを見届けたい。
  relationships:
  - name: 朝比奈 春樹
    relation: 地下図書館への案内人であり、精神的な支え
  - name: 空 海斗
    relation: 彼が遺した記録を大切に保管していた人物
  arc: 傍観者としての立場を脱し、春樹の挑戦を全力で応援することで、自分自身の停滞していた感情を動かす。
- name: 空 海斗
  role: 精神的支柱
  age: 18
  gender: 男性
  appearance: 古い写真の中では、屈託のない笑顔で、日に焼けた肌をしている。
  personality: 情熱的で哲学的な思考を持つ。走ることを「世界と対話すること」と考えていた。
  speech_style: （ノートの記述）語りかけるような口調で、時に厳しく、時に優しく励ます。
  background: 数年前に急逝した伝説のランナー。記録よりも「走るプロセス」に価値を置いていた。
  motivation: 未来に現れる「走ることに迷う誰か」へ、自分が見つけた答えを伝えたい。
  relationships:
  - name: 朝比奈 春樹
    relation: 時間を超えて意志を継がせる相手
  arc: （故人のため変化はないが）春樹がノートに言葉を書き加えることで、彼の意志が完結し、次代へ引き継がれる。
