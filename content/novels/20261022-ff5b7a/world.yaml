title: 秒針の地下室、僕らのラストレップ
genre: スポーツ青春
tone: 瑞々しく、少し切なく、疾走感のある文体
pov: 一人称（俺）
tense: 過去形
setting: 海沿いの地方都市にある、少し古びた高校
premise: 陸上部の練習についていけず、走る意味を見失った俺は、旧校舎の地下に隠された「地下図書館」で、一冊の古いノートを見つける。それは、数年前に急逝した伝説のランナーが遺した、走ることへの情熱が詰まった「遺言」のような記録だった。SNSの通知に追い立てられるような日常の中で、俺はその言葉を道標に、自分だけのペースで走り出す。
themes:
- 自己との対峙
- 継承される情熱
rules:
- 各話の終わりに、必ず「放課後」の情景描写を入れること
- SNSのやり取りは、キャラクターの孤独や繋がりを表現する手段として自然に組み込むこと
plot_outline:
- '序盤: 陸上部での停滞感と、放課後の旧校舎探索。地下図書館での偶然の出会いと、謎めいたノートの発見。'
- '中盤: ノートの言葉を指針に、独自のトレーニングを開始。部内の人間関係や、SNSで見かける「輝いている同級生」への劣等感との葛藤。'
- '終盤: 県大会のレース当日。ノートに記されていた「最後の一歩」に込められた真意を、極限状態のなかで理解する。'
- '結末: レースを終えた後の静かな放課後。地下図書館で、俺は自分の言葉をノートに書き残す。'
style_notes: 「俺」の一人称による、飾らない等身大の独白。部活の汗の匂い、教室の空気感、夕暮れの光といった五感を刺激する描写を重視。会話はテンポよく、SNSのテキストは現代的なリズムで。放課後の静寂と、走る時の高揚感のコントラストを鮮明に描く。
