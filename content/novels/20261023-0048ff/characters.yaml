- name: ヘルマン・クライン
  role: 主人公
  age: 42
  gender: 男性
  appearance: 常に皺の寄ったグレーのスーツを着用。深い隈のある眼差しと、記録用デバイスを握りしめた節くれだった指が特徴。
  personality: 徹底した合理主義者で懐疑的。感情を排して事実のみを追う。一人称は「私」。
  speech_style: 報告書のような淡々とした口調。結論から述べる習慣がある。
  background: レテ・セクターの記憶監査局に所属していた元エリート調査員。ある事件で自身の記憶の一部を喪失しており、現在はフリーの記憶解析コンサルタントとして活動している。
  motivation: 記憶の空白（レセッション）のメカニズムを解明し、論理的な整合性を完結させること。
  relationships:
  - name: ジュリアン・ヴァンス
    relation: 不信感を抱く調査対象
  - name: クララ・リンチ
    relation: データ提供者であり協力者
  arc: 絶対的な正解を求めていたが、最終的に自らの記憶さえも信頼できないという絶望的な矛盾に直面する。
- name: ジュリアン・ヴァンス
  role: 敵役
  age: 35
  gender: 男性
  appearance: 贅沢なシルクのガウンを纏い、瞳に記憶抽出用の特殊な義眼を埋め込んでいる。常に余裕のある微笑を浮かべている。
  personality: 享楽的で計算高い。他者の純粋な記憶を「収集」することに執着している。一人称は「僕」。
  speech_style: 丁寧だが慇懃無礼。相手の心理的な隙を突くような比喩表現を多用する。
  background: 記憶市場における最大手ブローカー。表向きは合法的な取引を行っているが、裏では禁忌とされる記憶の合成や書き換え実験を主導している。
  motivation: 完璧な「初恋」の記憶を構築し、自らの空虚な精神を埋めること。
  relationships:
  - name: ヘルマン・クライン
    relation: 知的なゲームを楽しむ相手
  - name: エレーナ
    relation: 記憶の抽出対象であり、執着の対象
  arc: 完璧な記憶を手に入れたと思った瞬間、それが偽造されたものであるという残酷な真実に突き落とされる。
- name: クララ・リンチ
  role: 相棒/脇役
  age: 27
  gender: 女性
  appearance: 短く切り揃えた青い髪。常にホログラムディスプレイが投影される大型のゴーグルを首にかけている。
  personality: 神経質で完璧主義。データ整合性に異常なこだわりを持つ。一人称は「あたし」。
  speech_style: 早口で専門用語が多く、興奮すると独り言が増える。
  background: 都市記憶アーカイブの若き管理官。システムのバグに気づき、内部告発に近い形でヘルマンに情報を流している。
  motivation: 市場で流通する「偽造記憶」のルートを特定し、記憶の純粋性を守ること。
  relationships:
  - name: ヘルマン・クライン
    relation: 能力を認めている数少ない理解者
  arc: データこそが真実だと信じていたが、人間の感情という不確定要素が記憶を歪めることを知り、視点が変わる。
- name: エレーナ
  role: 被害者/鍵となる人物
  age: 24
  gender: 女性
  appearance: 記憶ログの中では、常に白いワンピースを着て月光の下に立っている。儚げで、どこか焦点の合わない瞳をしている。
  personality: 献身的で内向的。自身のアイデンティティよりも、誰かに必要とされることを望んでいた。
  speech_style: 囁くような静かな話し方。断片的な言葉を繋ぎ合わせて話す。
  background: 高純度の『初恋の情景』を所有していたが、生活苦からそれを売却。その後、記憶置換の実験台にされ、精神的な崩壊を経て不審死を遂げた。
  motivation: （生前）愛した人物にだけは、本当の自分を覚えていてほしかった。
  relationships:
  - name: ジュリアン・ヴァンス
    relation: 記憶を奪われた被害者と加害者
  arc: 物語の大部分を「記録」として登場し、断片的な証言を通じて、密室トリックの核心となる感情的な動機を提示する。
