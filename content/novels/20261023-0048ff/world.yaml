title: 記憶抽出市場における欠落した観測記録：第42回月食事変に関する考察
genre: 本格ミステリー
tone: 冷徹、学術的、断片的な記録
pov: 第一人称（調査報告者）
tense: 過去形および現在完了形
setting: 近未来、記憶が通貨として流通する隔離都市「レテ・セクター」
premise: 記憶の売買が合法化された都市において、特定の月食の夜にのみ発生する「記憶の空白（レセッション）」が報告されている。本調査は、高価な『初恋の情景』が市場から消失し、代わりに『殺人の動機』に酷似した偽造記憶が流通した一件の不審死を追うものである。遺された断片的なログと、矛盾する三人の目撃証言を照合した結果、物理的に不可能な密室での記憶置換の全容が浮かび上がる。
themes:
- 自己の同一性と記憶の代替性
- 観測による事実の変容
rules:
- 記憶は抽出装置によって、感覚器官の劣化を伴わずにデジタル化・物理化が可能である
- 抽出された記憶は他者の脳へ移植できるが、元の持ち主には『忘却』という形で欠落が残る
- 月食の間は、記憶抽出装置の同期精度が極端に低下し、ノイズとしての『偽記憶』が発生しやすい
plot_outline:
- '序盤: 調査員ヘルマンによる、記憶市場における『高純度記憶の消失事件』の概要報告。被害者の脳内に残された、月食の夜に不自然に欠落した30分間の記録の提示。'
- '中盤: 証言者たちの記録（ファイル番号09-A〜C）の提示。彼らの語る『月食の夜』の光景が、物理法則および既存の記憶整合性テストにおいて致命的な矛盾を露呈する過程。'
- '終盤: 消失した記憶が「売られた」のではなく、「特定の誰かのために書き換えられた」ことを示す、隠蔽された実験データの発見。密室のトリックは、記憶の同期ズレを利用した時間的錯覚であったことが判明する。'
- '結末: 真犯人の特定と、その動機の記述。しかし、調査員自身もまた、自らの調査プロセスの一部が「書き換えられた記憶」に基づいている可能性を脚注にて示唆する。'
style_notes: 学術論文または事後調査報告書の形式を徹底すること。記述は極めて乾燥しており、感情表現は排される。重要な事実や矛盾点については、文末に[注1][注2]といった形式で、補足説明や、それに関連する資料の欠落（例：『当該資料は焼失しているため、推測に留まる』）を挿入し、読者に情報の欠落を埋めさせる構造を用いること。
