- name: 九条 蓮 (くじょう れん)
  role: 主人公
  age: 32
  gender: 男性
  appearance: 端正だがどこか陰のある顔立ち。常に灰色のトレンチコートを着用し、鋭い眼差しを持つ。
  personality: 冷静沈着で極めて論理的。物事の整合性を何よりも重視する。一人称は「僕」。
  speech_style: 丁寧だが、事実を淡々と述べる時に冷徹な響きが混じる敬語体。
  background: かつて天才的な数学者として知られたが、ある事件を機に法学と論理学を修め、現在は「事象の再構築」を専門とする私立探偵。
  motivation: 銀雨館に隠された建築学的矛盾と、消失した密室の論理的解明。
  relationships:
  - name: 佐伯 結衣
    relation: 協力者であり、現場の状況を観察する助手的な役割
  arc: 論理だけで割り切れない「人間の情念」という非合理な要素に直面し、真実の残酷さを理解する。
- name: 佐伯 結衣 (さえき ゆい)
  role: 相棒
  age: 26
  gender: 女性
  appearance: 活動的な服装に、常に小さな手帳とカメラを携えている。明るい茶髪のショートカット。
  personality: 観察力が鋭く、九条の論理を補完する直感力を持つ。一人称は「私」。
  speech_style: 快活で、九条の硬い言葉を噛み砕いて周囲に伝えるような話し方。
  background: ジャーナリスト志望。九条の事件解決のプロセスに魅了され、助手として同行している。
  motivation: 館に隠された「失せ物屋」の伝承と、生存者たちの真実を記録すること。
  relationships:
  - name: 九条 蓮
    relation: 信頼する依頼主兼パートナー
  arc: 情報の断片から「人の心の機微」を読み取る重要性を学び、単なる記録者から観察者へと成長する。
- name: 一ノ瀬 誠司 (いちのせ せいじ)
  role: 敵役
  age: 45
  gender: 男性
  appearance: 高級なスーツに身を包んだ、品格のある紳士。しかし、鏡を見る際に時折、虚ろな表情を見せる。
  personality: 完璧主義者で、外面は極めて紳士的。しかし内面には強烈な喪失感と執着を抱えている。一人称は「私」。
  speech_style: 穏やかで落ち着いた、教養を感じさせる話し方。
  background: 亡き建築家アルカディアの筆頭弟子であり、現在は遺産相続に関わる財団の理事。
  motivation: 館の構造を維持し、亡き師や失った過去を「鏡の迷宮」の中に永遠に封じ込めること。
  relationships:
  - name: 九条 蓮
    relation: 論理によって自らの聖域を暴こうとする天敵
  arc: 完璧に構築したはずのトリックが論理的に崩壊していく中で、自身の空虚な虚像と向き合わざるを得なくなる。
- name: 霧島 玲奈 (きりしま れな)
  role: 脇役/容疑者
  age: 29
  gender: 女性
  appearance: ミステリアスな雰囲気を持つ美女。黒いドレスを纏い、常にどこか落ち着かない様子。
  personality: 情緒不安定で、言葉を濁すことが多い。秘密主義的。一人称は「あたし」。
  speech_style: 語尾が消え入りそうで、相手の反応を窺うような不安定な話し方。
  background: 「失せ物屋」の店主の姪と称される女性。館の隠し通路について何かを知っている様子。
  motivation: 店主の死の真相を知ると同時に、自分が失った「あるもの」を取り戻すこと。
  relationships:
  - name: 一ノ瀬 誠司
    relation: 過去に深い因縁がある人物
  arc: 恐怖に怯えるだけの存在から、真実を語ることで自らの運命を切り拓く強さを得る。
