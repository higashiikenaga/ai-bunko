title: 銀雨の館と鏡像の不在証明
genre: 本格ミステリー
tone: 幻想的、古風、耽美、静謐
pov: 三人称
tense: 過去形
setting: 絶海に浮かぶ孤島に建つ、建築家・アルカディアが遺した奇怪な構造の邸宅「銀雨館」
premise: 豪雨の日にのみ現れるという「失せ物屋」が、館の内部に隠されている。ある嵐の夜、その店内で邸宅の主が死体となって発見されるが、雨が上がると同時に店への入り口は完全に消失し、現場は完全なる密室となる。鏡の回廊と複雑な水路の仕掛けに彩られた館で、不可能犯罪の論理的解明が試みられる。
themes:
- 喪失と執着
- 視覚的欺瞞
rules:
- 店への扉は、雨樋から集められた一定量の水が水圧装置を動かした時にのみ開く物理的な仕掛けである
- 館の回廊に配置された巨大な鏡は、特定の角度から見た時にのみ通路を壁に見せかける視覚トリックとして機能する
- 犯行時刻の雨量と潮位の変動が、密室形成の絶対条件となる
plot_outline:
- '序盤: 語り手である探偵が、遺産相続の立ち会いのために「銀雨館」へ招かれる。雨の日だけ開く店という奇妙な伝承と、迷宮のごとき館の歪な構造が、装飾的な筆致で詳述される。'
- '中盤: 激しい豪雨の中、店主が「雨の日だけ開く店」の中で殺害される。しかし、捜査が始まる前に雨が止み、店への通路が物理的に消失。容疑者たちは、鏡に囲まれた回廊の中で互いを疑い合う。'
- '終盤: 探偵が、鏡の反射を利用した視覚的死角と、雨水による自動開閉装置の連動性を突き止める。超常現象に見えた「店の消失」が、緻密な建築計算に基づいた物理的なトリックであったことが暴かれる。'
- '結末: 犯人は、鏡に映る自身の虚像に囚われ、過去の喪失を埋めようとした人物であった。雨が降り止み、晴れ渡った空の下で、館の全ての秘密が白日の下に晒され、静かに幕を閉じる。'
style_notes: 装飾的な形容詞を多用し、静謐で重厚な空気感を演出すること。特に館の見取り図（回廊の幅、鏡の設置角度、水路の走行経路など）を、読者が脳内で図面を引けるほど緻密に描写し、幻想的な状況を冷徹な論理で解体する快感を追求する。
