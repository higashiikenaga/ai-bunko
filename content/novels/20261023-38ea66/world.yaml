title: 黄金のレースと氷晶のクロノグラフ
genre: 群像劇
tone: 絢爛豪華かつ憂いを含んだ、装飾的な歴史ロマン
pov: 三人称
tense: 過去形
setting: 新時代を迎えたヴェル・リュミエールの王都（眠らない街）および北方の極寒地帯にそびえる「氷の城」
premise: 「種子」のエネルギーがもたらした永遠の光により、王都は不夜城へと変貌を遂げた。しかし、繁栄の裏で世界の均衡が崩れ、北方に住まう古き血脈が「氷の城」への招待状を送り届ける。黄金のレースを纏った貴族たちの虚飾と、絶対零度の静寂が支配する北の地で、ジュリアンとエララは再び運命の歯車を回し始める。
themes:
- 進歩と喪失の対価
- 永遠なる静止と流転する愛
rules:
- 「種子」のエネルギーは、精密な真鍮の歯車による同期制御がなければ、周囲の熱を奪い尽くす「凍結現象」を引き起こす
- 氷の城の建築物は、訪問者の精神状態に応じて結晶の形状や色を変える共鳴特性を持つ
- 新時代の特権階級は、機械制御の才を持つ「技術貴族」へと移行している
plot_outline:
- '序盤: 永遠の光に照らされた「眠らない街」にて、新時代の祝祭が催される。ジュリアンとエララは技術貴族として称賛されるが、街の至る所で原因不明の霜が降り始める。そこへ、かつての王家の血を引く謎の貴婦人から、北方の「氷の城」で開催される冬の舞踏会への招待状が届く。'
- '中盤: 氷の城に足を踏み入れた一行は、そこが世界の熱量を調整する巨大な冷却装置であることを知る。豪華な白銀のドレスと氷の仮面が交錯する舞踏会の裏で、アリスターは新体制に不満を持つ反乱分子の影を追う。エララは城の心臓部にある「氷晶のクロノグラフ」が、前作で失われたはずの禁忌の設計図に基づいていることに気づく。'
- '終盤: 氷の城の主が、世界を完璧な静止（凍結）の中に閉じ込めることで、争いのない永遠の楽園を築こうとする計画を明かす。ジュリアンとエララは、互いの信頼と愛を鍵として、氷の心臓部へ潜入。絶望的な寒さと、かつての因縁が絡み合う陰謀の中、彼らは真鍮の歯車と氷晶を同期させる究極の調律に挑む。'
- '結末: 激しい衝突の末、氷の城は崩壊せず、世界の熱循環を正常化させる「季節の歯車」へと再構築される。不夜城だった王都に初めて心地よい「夜」が訪れ、人々は眠ることの幸福を知る。ジュリアンとエララは、移ろいゆく時間の中で共に生きることを誓い、黄金のレースを翻して新たな夜明けへと歩き出す。'
style_notes: サテン、タフタ、ブロケードといった布地の質感や、ダイヤモンドやエメラルドの煌めきを過剰なまでに詳細に描写すること。舞踏会のシーンでは、音楽の旋律とドレスの裾が描く弧を同期させ、優雅で緩やかなテンポの文章を心がける。会話文には貴族的な矜持と、その裏に潜む鋭い毒を忍ばせること。
