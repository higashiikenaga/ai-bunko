- name: 瀬戸 航平
  role: 主人公
  age: 32
  gender: 男性
  appearance: 疲れ気味の目元に、サイズの合わない古びたコートを羽織っている。どこか自信なさげな佇まい。
  personality: 内向的で皮肉屋だが、根は情に厚い。一人称は「僕」。
  speech_style: 丁寧だが距離感があり、言葉を濁らすことが多い。
  background: かつては期待されたピアニストだったが、ある挫折を機に音楽を捨て、都会で事務的に働く日々を送っていた。故郷である凪ノ浦を避けていた。
  motivation: 手紙に記されていた「書きかけの曲の続き」の答えを見つけ、過去の自分と決別すること。
  relationships:
  - name: 凪原 栞
    relation: 街を巡る中で共鳴し合う、孤独な理解者
  - name: 桐生 誠一郎
    relation: 価値観の対立しつつも、大人の孤独を共有する関係
  arc: 自己嫌悪と絶望に囚われていたが、他者の欠落に触れることで、不完全なまま歩き出す勇気を得る。
- name: 凪原 栞
  role: 主要人物
  age: 24
  gender: 女性
  appearance: ショートボブに、常にスケッチブックを持ち歩いている。リネンのシンプルなワンピースを好む。
  personality: 観察眼が鋭く、思慮深い。変化を恐れる臆病な一面がある。一人称は「私」。
  speech_style: おっとりとしていて、語尾が消え入るような話し方。
  background: 地元のイラストレーター。再開発で消えゆく街の風景だけを描き続けており、新しい世界へ踏み出すことができない。
  motivation: 古書店主がなぜ自分の「誰にも見せない絵」のことを知っていたのか、その理由を突き止めること。
  relationships:
  - name: 瀬戸 航平
    relation: 静かな時間と喪失感を共有するパートナー
  - name: 佐伯 陽葵
    relation: 正反対の性格ながら、惹かれ合う姉妹のような関係
  arc: 過去の記憶に固執することをやめ、変わりゆく街の中で「今」を切り取る強さを手に入れる。
- name: 桐生 誠一郎
  role: 主要人物
  age: 58
  gender: 男性
  appearance: 白髪混じりの整った髪に、隙のないスーツ姿。鋭い眼光を持つが、笑うと年相応に柔らかい。
  personality: 厳格で合理的。感情を出すことを禁忌としているが、内面には深い後悔を抱えている。一人称は「私」。
  speech_style: 断定的で威厳がある。時折、独り言のように感傷的な口調になる。
  background: 凪ノ浦の再開発計画を推進する責任者。かつてこの街で唯一信頼していた友（古書店主）を裏切った過去がある。
  motivation: 遺言の手紙を通じて、かつての友に許しを請い、自身の人生の正解を確認すること。
  relationships:
  - name: 瀬戸 航平
    relation: かつての自分に似た若者として、複雑な感情を抱く
  - name: 佐伯 陽葵
    relation: 懐かしさと危うさを同時に感じさせる、孫のような存在
  arc: 効率と発展という鎧を脱ぎ捨て、人間としての弱さと、忘れかけていた情愛を取り戻す。
- name: 佐伯 陽葵
  role: 主要人物
  age: 19
  gender: 女性
  appearance: 派手な髪色に、大ぶりのアクセサリー。常にヘッドホンを首にかけている。快活な印象。
  personality: 直感的で天真爛漫。寂しさを隠すためにわざと賑やかに振る舞う。一人称は「あたし」。
  speech_style: 現代的な若者言葉。早口で、核心に触れると話題をそらす。
  background: 家庭環境に居場所がなく、流れ着いた凪ノ浦で古書店主にだけは心を開いていた。街の誰とも深い繋がりを持たず、漂流するように生きている。
  motivation: 手紙に書かれた「あなただけの居場所」という言葉を信じ、本当の居場所を探すこと。
  relationships:
  - name: 凪原 栞
    relation: 自分にない静けさと芯の強さに憧れている
  - name: 桐生 誠一郎
    relation: 堅物な彼をかき乱し、人間味を引き出すトリガー
  arc: 「どこにいても孤独だ」という諦めから、「誰かと繋がっていたい」と願う素直さを取り戻す。
