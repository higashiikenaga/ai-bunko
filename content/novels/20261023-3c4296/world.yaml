title: さよならを書き換える街
genre: ヒューマンドラマ
tone: 静謐で切なく、最後には温かみが宿る
pov: 三人称（視点人物ごとに切り替わり）
tense: 過去形
setting: 再開発が進む地方の海辺の街「凪ノ浦」
premise: ある古書店主が残した奇妙な遺言。それは、面識のない数人の住民に「ある場所」へ集まるよう促す、断片的な手紙だった。バラバラな人生を歩む人々が、手紙に導かれ、街の忘れ去られた記憶を辿り始める。月食の夜、彼らが辿り着いた場所で、孤独な魂が静かに交差する。
themes:
- 喪失と再生
- 縁の再構築
rules:
- 遺言の手紙は、受け取った本人が納得して次の目的地へ向かわない限り、次のヒントが現れない
- 物語の舞台は現代の日本であり、超自然的な現象は起きない
plot_outline:
- '序盤: 古書店主の死後、全く接点のない4人の男女に、それぞれの人生の欠落を突くような遺言の手紙が届く。'
- '中盤: 視点が切り替わりながら、彼らが街のあちこちにある思い出の場所を巡る様子を描く。それぞれの孤独や後悔が明かされ、偶然の出会いとすれ違いを繰り返す。'
- '終盤: 月食が起こる夜、手紙の最終目的地である「海辺の古い時計塔」に全員が集結する。そこで遺言の真の意図と、彼らが実は過去に繋がっていたことが判明する。'
- '結末: 過去の呪縛から解放された人々が、それぞれの明日へ歩き出す。街の再開発は止まらないが、彼らの心には消えない灯がともる。'
style_notes: 視点人物に合わせて文体の温度を変える。冷徹な青年は硬質で短い文章、心優しい老婦人はゆったりとした情景描写を多用し、音楽を愛する者はリズム感のある言葉選びを行う。断片的なエピソードを積み重ね、最終的に一つの感情的なピークへ収束させる群像劇形式を徹底する。
