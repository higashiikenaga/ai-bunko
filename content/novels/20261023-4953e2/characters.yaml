- name: エリアン・ソーン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 柔らかい茶髪に、旅慣れたベージュの外套を羽織っている。常に祖父から受け継いだ年季の入った革の手帳を大切に抱えている。
  personality: 好奇心旺盛で穏やか。聞き上手であり、料理を通じて人の心に触れることを好む。一人称は「僕」。
  speech_style: 丁寧で控えめ。相手の気持ちに寄り添うような優しい口調。
  background: 料理研究家だった祖父に育てられ、世界中の「心を満たす味」を記録することに憧れを抱いていた。祖父の死後、その遺志を継ぎ旅に出る。
  motivation: 手帳に記されたレシピを実際に再現し、失われつつある温かな記憶を世界に再提示すること。
  relationships:
  - name: リオーラ
    relation: 街の案内人であり、共にスープの材料を探す相棒
  - name: サイラス
    relation: 手帳を通じて導かれる、精神的な師のような存在
  arc: 単にレシピを追うだけの旅人から、料理を通じて他者の孤独を癒やし、街に安らぎを取り戻す導き手へと成長する。
- name: リオーラ・ヴェイン
  role: 相棒
  age: 21
  gender: 女性
  appearance: 銀色のショートヘアに、機械整備用のゴーグルを額にかけている。油汚れのついたオーバーオールを着用し、常に眠たげな目のクマがある。
  personality: 現実主義でぶっきらぼうだが、根は情に厚い。効率を重視する街の価値観に密かに疑問を抱いている。一人称は「私」。
  speech_style: 短文でテンポが速く、少しぶっきらぼうな話し方。
  background: 眠らない街の灯火維持機構で働く若き整備士。幼い頃に「眠り」という概念を忘れ、慢性的な疲労感の中で生きている。
  motivation: エリアンの作る料理の香りに惹かれ、自分が失った「心地よい眠り」という感覚を取り戻したいと願う。
  relationships:
  - name: エリアン
    relation: 正反対の価値観を持つが、次第に信頼し合う友人
  - name: ジュリアン
    relation: 元上司であり、効率至上主義の象徴として反発している相手
  arc: 効率と義務に縛られた生活から脱却し、休息することの豊かさと、誰かと食卓を囲む喜びを知る。
- name: サイラス
  role: キーパーソン（故人）
  age: 82
  gender: 男性
  appearance: （回想や記述にて）白い髭を蓄え、使い込まれたエプロンを身に着けた小柄な老人。瞳には星のような輝きがある。
  personality: 思慮深く、詩的な感性を持つ。魔法が消えゆく世界に絶望せず、ささやかな味の中に永遠を信じていた。一人称は「私」。
  speech_style: ゆっくりとした、語りかけるような穏やかな口調。
  background: かつて星が降っていた時代の記憶を持つ、街で最後の一人となった料理人。街が灯火に支配され、人々が眠りを忘れた後も、密かに「星降る夜の味」を守り続けていた。
  motivation: 自分が死んだ後、誰かがこの味を再現し、街の人々に「静かな夜」を返してくれることを願っていた。
  relationships:
  - name: エリアン
    relation: レシピと遺言を通じて導く、時を超えた継承者
  arc: 物語の起点となる存在。彼の遺したレシピが、停滞していた街の時間を再び動かすきっかけとなる。
- name: ジュリアン・クロック
  role: 脇役（対立軸）
  age: 45
  gender: 男性
  appearance: 隙のない三つ揃いのスーツに、金のモノクルを着用。常に懐中時計を確認しており、一分の狂いもない動作をする。
  personality: 完璧主義で冷徹。睡眠を「人生の浪費」と考え、街の生産性を最大化することに心血を注いでいる。一人称は「私」。
  speech_style: 極めて形式的で論理的。感情を排した事務的な話し方。
  background: 眠らない街の管理局長。灯火のシステムを統括し、住民が効率的に働き続けるための環境を構築した。
  motivation: 街を完璧な機械のように機能させ、一切の停滞（眠り）を排除すること。
  relationships:
  - name: リオーラ
    relation: 有能な部下だと思っていたが、反抗的な態度に苛立っている
  - name: エリアン
    relation: 非効率な旅をする正体不明の若者として不審に思っている
  arc: スープの香りと街に訪れた静寂に触れ、自分が切り捨ててきた「空白の時間」こそが人間にとって必要だったことに気づく。
