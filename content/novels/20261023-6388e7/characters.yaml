- name: 佐倉 志乃 (さくら しの)
  role: 主人公
  age: 24
  gender: 女性
  appearance: 都会的な清潔感はあるが、どこか影のある表情。長い黒髪を後ろで一つに結んでいる。祖母に似た、意志の強そうな瞳を持つ。
  personality: 冷静で観察力に優れるが、孤独を抱えている。一人称は「私」。
  speech_style: 標準語。丁寧だが、核心を突く際は簡潔で淡々としている。
  background: 都内の出版社で校閲として働く。幼い頃に失踪した父の記憶が希薄で、心のどこかで彼を探している。
  motivation: 祖母の遺品整理をきっかけに、失踪した父の足跡を辿り、真実を明らかにすること。
  relationships:
  - name: 佐倉 拓海
    relation: 失踪した父
  - name: 村長
    relation: 監視・圧迫してくる存在
  arc: 真実を知る恐怖から逃れようとするが、最終的には自己の記憶さえも失う運命を受け入れ、村のシステムに取り込まれていく。
- name: 村長・御神 宗助 (みかみ そうすけ)
  role: 敵役
  age: 68
  gender: 男性
  appearance: 痩身で背が高く、常に淀んだ笑みを浮かべている。古めかしい和服を纏い、村の伝統を象徴するような威厳がある。
  personality: 冷酷で盲目的。村の平穏と『地下図書館』の存続こそが絶対の正義だと信じ込んでいる。一人称は「私」。
  speech_style: 穏やかで丁寧だが、言葉の端々に威圧感と、村独特の古風な言い回しが混じる。
  background: 御神村の現当主。代々、地下図書館の管理と『約束の丘』の祭礼を司る一族の長。
  motivation: 新たな『記録者』を見出し、村の因習と死者の記憶の循環を絶やさないこと。
  relationships:
  - name: 佐倉 志乃
    relation: 次代の記録者候補
  arc: 志乃を巧みに誘導し、彼女が自らの意志で村の狂気に沈んでいくよう仕向ける。
- name: 結城 蓮 (ゆうき れん)
  role: 相棒
  age: 26
  gender: 男性
  appearance: 少し野暮ったい作業着姿。村の境界付近で作業をしている青年。日焼けした肌と、警戒心の強い瞳。
  personality: 口数は少ないが、義理堅い。村の因習に疑問を抱きつつも、抗えずにいる。一人称は「俺」。
  speech_style: ぶっきらぼうで、語尾が少し投げやりな村の方言混じりの言葉遣い。
  background: 村の青年。村の掟に縛られながらも、幼馴染が祭礼の後に「記憶を失う」現象を目の当たりにしてきた。
  motivation: 志乃の探索を手助けし、彼女と共に村の呪縛から逃げ出すこと。
  relationships:
  - name: 佐倉 志乃
    relation: 協力者・守るべき対象
  - name: 村長
    relation: 支配者
  arc: 志乃を助けようと奔走するが、村の力の前に無力であることを悟り、彼女の逃走を阻む壁となる村のシステムに飲み込まれていく。
- name: 佐倉 拓海 (さくら たくみ)
  role: 脇役（回想・重要人物）
  age: 45
  gender: 男性
  appearance: 志乃の記憶の中では、常に古いノートを抱えた、どこか疲れ果てた知的な男性として描かれる。
  personality: 探究心が強く、真実を追い求めるあまり、狂気に足を踏み入れてしまう危うさを持っていた。一人称は「僕」。
  speech_style: 理知的で、少し早口な傾向がある。
  background: 志乃の父。民俗学者として御神村を訪れ、地下図書館の存在に気づいたことで姿を消した。
  motivation: 死者の記憶が持つ意味を解明しようとし、その過程で『記録者』の役割を担わされた。
  relationships:
  - name: 佐倉 志乃
    relation: 娘
  arc: 志乃が地下図書館で見つけた記録を通じて、彼女の運命を決定づける道標となる。
