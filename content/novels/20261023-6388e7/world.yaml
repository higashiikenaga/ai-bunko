title: 泥濘の頁と、約束の丘の葬列
genre: ホラー
tone: 湿り気を帯びた、静謐で逃げ場のない恐怖
pov: 三人称
tense: 過去形
setting: 現代、地図から消えかかっている山間の廃村「御神村（みかみむら）」
premise: 祖母の死をきっかけに、主人公の志乃は外界から隔絶された御神村を訪れる。村には、古くから『地下図書館』と呼ばれる、死者の記憶を紙に綴り保存する禁忌の儀式が存在していた。村の人間たちが畏怖する『約束の丘』では、数年に一度、生贄の代わりに「言葉」を捧げる祭礼が行われる。志乃は、失踪した父の足跡を追ううちに、村の信仰が隠蔽してきた恐ろしい真実に直面していく。
themes:
- 血縁の呪縛
- 記憶の風化と腐敗
- 土着信仰の狂気
rules:
- 地下図書館に収められた書物は、生きた人間が触れてはならず、触れた者はその記憶を失う。
- 約束の丘での儀式は、満月の夜にしか行えず、一度約束を違えれば村全体が泥に沈むとされる。
- 村の人間は、外部の人間に対して、特定の儀礼的な方言（隠語）を用いて情報を遮断する。
plot_outline:
- '序盤: 志乃は祖母の遺品整理のため御神村へ向かうが、村人たちのよそよそしい態度と、奇妙な方言の響きに違和感を覚える。村の境界にある『約束の丘』が、村の平穏を保つための聖域であることを知る。'
- '中盤: 志乃は村の古い蔵の地下で、不自然に広がる石造りの階段を見つける。そこは、村の禁忌である『地下図書館』へと続いていた。そこで彼女は、死者の記憶が文字として蠢く異様な光景を目撃し、父がかつてこの場所で「何か」を書き記そうとして消えたことを知る。'
- '終盤: 祭礼の夜、村人たちは志乃を『生贄』ではなく、新たな『記録者』として地下図書館へ誘おうとする。約束の丘では、泥の中から無数の「声」が響き、村の因習が剥き出しになっていく。'
- '結末: 志乃は逃げ出すが、村を出た瞬間に自分が何を逃げてきたのか、誰を愛していたのかという記憶が、一枚の紙となって足元の泥に溶け落ちていくのを感じる。彼女は、次の記録者として丘へ戻るしかない運命を受け入れる。'
style_notes: 湿り気のある描写を重視。草木の匂い、泥の粘り、古い紙の腐敗臭など、五感に訴える表現を多用する。会話文には、実在しないが説得力のある独特の地方方言を織り交ぜ、村全体が閉鎖的なコミュニティであることを強調する。静かな地の底から響くような、逃げ場のない絶望感を三人称視点で淡々と綴る。
