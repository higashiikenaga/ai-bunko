- name: ザイド
  role: 主人公
  age: 19
  gender: 男性
  appearance: 日焼けした肌に、砂除けのゴーグルを首にかけた少年。機能性を重視した使い古しのキャラバン衣装を纏っている。
  personality: 好奇心旺盛で正義感が強いが、慎重さも兼ね備えている。一人称は「僕」。
  speech_style: 快活で丁寧だが、緊張すると早口になる傾向がある。
  background: 交易都市の若き案内人。地図にない道を切り拓くことに憧れを抱きながら、日々の商隊の誘導に従事していた。
  motivation: 折れた剣に導かれ、失われた楽園「約束の丘」の正体を突き止めること。
  relationships:
  - name: エリアス
    relation: 恩人と導き手
  - name: リディア
    relation: 信頼し合う旅の相棒
  - name: ヴァレリウス将軍
    relation: 対立する追跡者
  arc: 単なる「案内人」から、世界に新たな風を吹かせる「開拓者」へと精神的に成長する。
- name: エリアス
  role: 導き手（物語の起点）
  age: 45
  gender: 男性
  appearance: ボロボロの旅装に身を包み、深い疲労を湛えた瞳を持つ男。右手に古い包帯を巻いている。
  personality: 寡黙で厭世的だが、内側に強い信念を秘めている。一人称は「私」。
  speech_style: 静かで詩的な言い回しを好み、核心をはぐらかす癖がある。
  background: かつて伝説の王に仕えた騎士の末裔。一族に伝わる「折れた剣」を正しく届けるため、人生の終盤を旅に捧げた。
  motivation: 剣を約束の丘へ戻し、古の誓いを完結させること。
  relationships:
  - name: ザイド
    relation: 意志を継がせる後継者
  arc: 絶望的な孤独の中で、ザイドという希望に出会い、自身の使命を完遂して安らかな眠りにつく。
- name: リディア
  role: 相棒
  age: 24
  gender: 女性
  appearance: 琥珀色の瞳を持つ、しなやかな肢体の女戦士。曲刀を使い、軽装の革鎧を身に着けている。
  personality: 現実主義で皮肉屋だが、情に厚い。プロの傭兵としての誇りを持つ。一人称は「私」。
  speech_style: ぶっきらぼうで突き放した言い方をするが、気遣いが滲み出ている。
  background: 帝国軍の脱走兵であり、現在は賞金稼ぎとして砂海を彷徨っていたところをザイドに雇われる。
  motivation: 当初は報酬目的だったが、次第に「居場所」としての楽園に惹かれていく。
  relationships:
  - name: ザイド
    relation: 危なっかしい年下を保護する姉のような関係
  - name: ヴァレリウス将軍
    relation: 憎悪の対象である元上官
  arc: 過去の罪悪感から逃げる人生を捨て、誰か（ザイド）を守るために戦う意味を見出す。
- name: ヴァレリウス将軍
  role: 敵役
  age: 42
  gender: 男性
  appearance: 白銀の装甲に身を包み、冷徹な眼差しを持つ男。常に完璧に整えられた身なりをしている。
  personality: 傲慢で支配欲が強く、力こそが秩序であると信じている。一人称は「私」。
  speech_style: 威圧的で格式高い口調。相手を見下した言い方を好む。
  background: 大陸を支配せんとする帝国の軍事最高責任者。古代兵器としての剣の力を利用し、砂海全域を統治しようと目論む。
  motivation: 折れた剣を完全な形に戻し、その絶対的な権能を手に入れること。
  relationships:
  - name: ザイド
    relation: 排除すべき取るに足らない障害
  - name: リディア
    relation: 裏切り者として処刑したい元部下
  arc: 絶対的な力への執着が、結果として彼自身の破滅と、砂塵への消滅を招く。
