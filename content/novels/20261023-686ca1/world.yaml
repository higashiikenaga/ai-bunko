title: 瑠璃の交易路と、忘却の砂海の残響
genre: 異世界ファンタジー
tone: エキゾチックで抒情的な冒険譚。喧騒と静寂の対比。
pov: 三人称（語り部による物語形式）
tense: 過去形
setting: 「約束の丘」の浄化後、再生の兆しを見せつつも依然として砂の呪いの残滓が漂う、広大な砂漠と交易都市群。
premise: 聖剣の光によって「砂化」の連鎖は断ち切られたが、失われたエリアスの記憶と、世界に刻まれた空白の穴は埋まってはいなかった。案内人ザイドは、リディアと共に、人々の記憶を糧に栄える奇妙な「記憶を売る市場」へと足を踏み入れる。そこで彼らは、かつての英雄の記憶を買い占める謎の集団と、砂漠の深淵に眠る「忘却のオアシス」の伝承に出会う。再生した世界で、失われた絆と失われた歴史を巡る新たな巡礼が始まる。
themes:
- 記憶の価値と代償
- 喪失からの再生
- 継承される意志
rules:
- 砂晶の使いすぎは身体を砂に変える「砂化」を引き起こす
- 聖剣は記憶を形にする「記憶の器」としての側面を持つ
- 砂漠の夜は昼間の熱気とは対照的に、静寂が物理的な重みを持って襲いかかる
plot_outline:
- '序盤: 聖剣の守護者として歩み始めたザイドとリディアは、交易の要衝である市場都市へ辿り着く。そこは「記憶を売る市場」と呼ばれ、人々が大切な思い出を砂晶に変えて売り捌く、喧騒と哀愁の入り混じった場所であった。'
- '中盤: 市場で、ザイドはエリアスの面影を持つ「記憶の断片」を取引する謎の商人と遭遇する。エリアスの意志が、完全に消滅したのではなく、砂漠のどこかに「記憶の残響」として漂っていることを知った二人は、砂嵐の向こうに輝く伝説のオアシスを目指す。'
- '終盤: 記憶を奪い、世界を再び静止した砂の檻に閉じ込めようとする「忘却の守護者」との戦いが始まる。ザイドは聖剣を用いて、失われたエリアスの記憶と自身の歩んできた道のりを一つに繋ぎ合わせる。'
- '結末: 忘却のオアシスで見つけたのは、失われた記憶の再生ではなく、新しい記憶を刻むための清らかな水であった。ザイドはエリアスの魂が砂漠の風になったことを悟り、リディアと共に、まだ見ぬ地平線へと商隊を率いて旅立つ。'
style_notes: 市場の喧騒はスパイスや獣の匂い、怒号、色彩の氾濫として描き、砂漠の夜は月光の冷たさ、砂の流れる音、圧倒的な孤独として対比させる。砂原オアシス特有の、旅情を誘う語り部のような、どこか遠い昔の出来事を語るような優雅な文体を用いること。
