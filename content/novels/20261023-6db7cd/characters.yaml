- name: 佐伯 澄人（さえき すみと）
  role: 主人公
  age: 75
  gender: 男性
  appearance: 白髪混じりの短髪、深く刻まれた目尻の皺。穏やかだが、どこか孤独を纏った佇まい。
  personality: 思慮深く、静かな探究心を持つ。一人称は「私」。
  speech_style: 丁寧で落ち着いた語り口。回想シーンでは幼少期の無垢な口調。
  background: 都会で静かな隠居生活を送っていたが、実家の片付け中に祖父の遺した謎に直面する。
  motivation: 祖父が隠し通した「消えた村」の真実と、写真の女性の正体を知ること。
  relationships:
  - name: 佐伯 源三
    relation: 祖父
  - name: 雪代 志乃
    relation: 祖父の恋人（写真の女性）
  arc: 単なる好奇心から、過去の悲劇への共感、そして記憶を継承していく覚悟へと変化する。
- name: 佐伯 源三（さえき げんぞう）
  role: 物語の鍵を握る人物
  age: 45
  gender: 男性
  appearance: 日焼けした頑強な体躯、氷を扱うために荒れた手。鋭いが慈愛に満ちた瞳。
  personality: 寡黙で職人気質。情熱を内に秘め、一度決めたことは曲げない。一人称は「俺」。
  speech_style: 無駄のない、重みのある話し方。孫の澄人には時折、詩的な表現を用いる。
  background: 東北の山奥で氷室「氷の城」を築いた男。村の消失と共に、その目的を墓まで持っていこうとした。
  motivation: 消えゆく村の記憶と、愛した女性の存在を、氷という形に変えて永遠に留めること。
  relationships:
  - name: 佐伯 澄人
    relation: 孫
  - name: 雪代 志乃
    relation: 最愛の女性
  arc: （回想を通じて）絶望的な喪失を経験した男が、記憶を保存するための「聖域」を築き上げる過程が描かれる。
- name: 雪代 志乃（ゆきしろ しの）
  role: 過去のヒロイン
  age: 22
  gender: 女性
  appearance: 雪のように白い肌と、黒い瞳。どこか現実離れした、儚げで清廉な美しさ。
  personality: 芯が強く、運命を受け入れる静かな強さを持つ。言葉少なだが、表情が豊か。
  speech_style: 鈴の音のように澄んだ、穏やかな話し方。
  background: 地図から消された村の娘。時代の荒波や村の存亡に翻弄され、歴史の闇に消えていった。
  motivation: 過酷な運命の中でも、愛する者との繋がりを信じようとする。
  relationships:
  - name: 佐伯 源三
    relation: 恋人
  arc: 歴史の犠牲者として消えていく運命にありながら、源三の記憶の中で永遠の命を得る。
