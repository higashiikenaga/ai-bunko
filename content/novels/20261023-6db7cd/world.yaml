title: 銀雪の記憶、あるいは消えた里の挽歌
genre: 歴史・時代小説
tone: 懐古的で寂寥感のある、静かな哀愁
pov: 一人称（わたし）
tense: 過去形
setting: 昭和初期から中期、東北地方の山深い村
premise: 押し入れの奥から見つかった一枚の古ぼけた写真と、宛名のない手紙。そこには、かつて地図から消された「消えた村」の記憶と、祖父が密かに築いた「氷の城」と呼ばれる氷室の秘密が綴られていた。失われた時間と、禁じられた恋を辿る回想録。
themes:
- 忘却と記憶
- 家族の秘め事
rules:
- 「消えた村」は戦前の災害後、行政により記録を抹消された集落であること
- 「氷の城」は天然の氷室を利用し、村の遺品や書簡を保存していた秘密の保管庫であること
- 物語は全て、老年の主人公による回想として語られること
plot_outline:
- '序盤: 老年の「わたし」が、実家の片付け中に色あせた写真と一通の古い手紙を発見し、幼少期の記憶が呼び覚まされる。'
- '中盤: 少年時代の「わたし」が、祖父に連れられて山奥の「氷の城」を訪れ、そこにあるはずのない村の歴史や人々の暮らしについての話を聞かされる。'
- '終盤: 祖父がなぜ「氷の城」を作ったのか、その理由が、消えた村にいた女性への叶わぬ恋と、彼女の記憶を守りたいという切なる願いであったことが判明する。'
- '結末: 過去の悲しみと向き合った「わたし」が、最後の手紙を静かに焼き、記憶だけを胸に抱いて今の時代を生きる決意をする。'
style_notes: 昭和の商店街の夕暮れのような、温かさと切なさが同居する文体。古い和紙の質感や、冬の凍てつく空気感を丁寧に描写し、「わたし」の静かな独白形式で綴る。
