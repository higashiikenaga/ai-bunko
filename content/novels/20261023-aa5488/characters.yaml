- name: カイ・ライトナー
  role: 主人公
  age: 15
  gender: 男性
  appearance: 無造作な茶髪に、使い古された飛行ゴーグルを額にかけている。動きやすさを重視した革のベストと作業ズボンを着用。日焼けした肌と、廃材回収でついた小さな傷跡が特徴。
  personality: 直感的で好奇心旺盛。窮地でも諦めない強靭な精神力を持つ。一人称は「俺」。
  speech_style: 少年らしく快活で、ややぶっきらぼう。「～だろ」「～じゃねえか」といった、勢いのある口調。
  background: 浮遊島スラムの廃材回収業者。空の向こうにある「未知の世界」への憧れを抱きながら、日々の糧を得るために空を駆け回っていた。
  motivation: 伝説の空中庭園を見つけ、分断された世界を繋ぐ新たな航路を見つけ出すこと。
  relationships:
  - name: リーナ・ベルンシュタイン
    relation: 最高の相棒であり、共に空を拓くパートナー
  - name: バルゴス・ザ・クロウ
    relation: 地図を狙う宿敵
  arc: ただの運び屋の少年から、仲間を守り、自らの意志で未知の空へ突き進む決意を持った「空の開拓者」へと成長する。
- name: リーナ・ベルンシュタイン
  role: 相棒
  age: 16
  gender: 女性
  appearance: ポニーテールにまとめた銀髪。油汚れのついたオーバーオールに、無数の工具が収められたベルトを巻いている。理知的で鋭い瞳を持つ。
  personality: 冷静沈着で論理的。機械に対しては並々ならぬ愛情と情熱を注ぐ完璧主義者。一人称は「私」。
  speech_style: 丁寧だが、機械の不調や修理の際には早口で専門用語を交える。「～です」「～しましょう」
  background: かつて高度な技術を誇った技術者一族の末裔。家系が没落した後、独学と廃材を組み合わせて旧式機を修理する技術を磨いてきた。
  motivation: 失われた古代技術の真理を解明し、機械の力で世界を再び繋ぎたい。
  relationships:
  - name: カイ・ライトナー
    relation: 信頼する操縦士であり、共に運命を共にする友人
  arc: 機械を単なる「道具」として扱う段階から、機体と魂を共鳴させる「真のエンジニア」へと進化する。
- name: バルゴス・ザ・クロウ
  role: 敵役
  age: 42
  gender: 男性
  appearance: 威圧的な体躯に、黒い軍服風の外套を羽織っている。片目はエーテル結晶で作られた義眼で、不気味に発光している。
  personality: 冷酷非道で野心的。力こそが秩序であると信じる支配者。一人称は「我」。
  speech_style: 重々しく、相手を威圧するような命令口調。「～せよ」「～に値しない」
  motivation: 空中庭園の莫大なエーテル資源を独占し、雲海全域を支配する空賊帝国を築くこと。
  relationships:
  - name: カイ・ライトナー
    relation: 地図を奪うために排除すべき邪魔者
  arc: 圧倒的な力で一行を追い詰める脅威として君臨し、技術と絆の力を信じる主人公たちの対極として立ちはだかる。
- name: セレナ
  role: 脇役（キーパーソン）
  age: 18
  gender: 女性
  appearance: 透き通るような白い肌と、幻想的な輝きを放つ長い銀髪。古代の意匠が施された白いドレスを纏っている。
  personality: 神秘的で穏やか。どこか浮世離れしており、世界の真実を知っているかのような言動をとる。一人称は「私」。
  speech_style: 静かで詩的な響きを持つ。「～なのです」「～でしょう」
  background: 空中庭園の防衛システムの一部、あるいは庭園を守護するために設計された古代の意識体。
  motivation: 庭園の真実が正しく理解され、空の新たな時代が始まることを見届けること。
  relationships:
  - name: カイ・ライトナー
    relation: 新たな時代の航路を託すべき者
  arc: 単なる「守護者」としての役割を超え、人類に未知の可能性を示す「導き手」となる。
