title: 雲海を駆ける銀翼の航路
genre: スチームパンク冒険
tone: 爽快で躍動感のある冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島群が点在する天空の世界「スカイ・アーク」。蒸気機関とエーテル結晶を用いた飛行技術が発達しているが、文明は雲の層によって分断されている。
premise: 廃材回収を生きがいにしていた少年カイは、ある日、墜落した旧式飛空艇の中から一通の「失われた手紙」を見つける。その手紙には、失われた伝説の空中庭園へと導く「秘密の地図」が隠されていた。カイは優秀なメカニックの少女リーナと共に、錆びついた愛機を修理し、未知なる空へと飛び立つ。雲を切り裂く轟音と仲間との絆を胸に、彼らは空の果てに隠された真実を追い求める。
themes:
- 未知への挑戦
- 仲間との絆
- 技術の継承
rules:
- 飛行にはエーテル燃料と蒸気圧の絶妙なバランスが必要
- 高度が上がると大気が薄くなり、エンジンの出力維持が困難になる
- 空賊は高度な操縦技術と重武装の飛空艇を駆使して航路を支配している
plot_outline:
- '序盤: カイが手紙と地図を発見し、リーナと共に旧式機を極限までチューンアップして、初めての雲海突破に挑む。'
- '中盤: 地図を狙う空賊団の猛追を、機体の限界を引き出す操縦と二人の連携で退けながら、地図の指し示す「嵐の眼」へと突き進む。'
- '終盤: 地図の目的地である空中庭園に到達するが、そこには古代の自動防衛システムが待ち構えていた。絶体絶命の危機を、機体と魂の共鳴によって乗り越える。'
- '結末: 防衛網を突破し、伝説の庭園の美しさと、空の新たな航路を見出した一行は、さらなる高みを目指して再び空へと舞い上がる。'
style_notes: 風が翼を叩く衝撃や、蒸気が噴き出す熱量、歯車が噛み合う精緻な金属音を鮮烈に描写すること。空の広大さと、機械が命を宿したかのような躍動感を強調し、読者が共に風を切って飛んでいるようなスピード感溢れる文体を目指す。
