- name: レイ・カリス
  role: 主人公
  age: 22
  gender: 女性
  appearance: 砂埃で汚れたオーバーサイズの作業着、無造作なショートヘア、油の染みたゴーグル。腰には使い古したレンチと、自作の小型ピストルを装備している。
  personality: 現実主義で口が悪いが、困っているものを見捨てられない情の深さを隠し持っている。一人称は「あたし」。
  speech_style: 「～だろ」「～じゃねえよ」といった、ぶっきらぼうで荒っぽい口調。
  background: 廃棄都市の最下層で孤児として育ち、生き残るためにジャンク屋を営んできた。文明崩壊後の価値観に染まりきっている。
  motivation: 渡り鳥を守り抜き、自分を追う者たちから逃げ切ること。そして、記憶が示す「真実」の正体を知ること。
  relationships:
  - name: カイ・レン
    relation: 技術的な面での協力者であり、信頼できる相棒
  - name: ゼノス・ヴォルテックス
    relation: 命を狙う宿敵
  arc: ただ日銭を稼いで生き延びるだけの「生存」から、世界に意味を見出すための「生」へと意識が変容していく。
- name: カイ・レン
  role: 相棒
  age: 27
  gender: 男性
  appearance: 落ち着いた色合いのロングコート、精密な作業を行うための機械義手。知的ながらもどこか陰のある風貌。
  personality: 冷静沈着で博識。常に論理的な思考を好むが、レイの突飛な行動に振り回されることが多い。一人称は「僕」。
  speech_style: 丁寧だが、どこか突き放したような淡々とした話し方。
  background: かつて記憶の管理を行っていた旧文明の技術者一族の生き残り。現在は技術者として隠遁生活を送っていた。
  motivation: 渡り鳥が持つデータの解析と、失われた技術の真の目的を明らかにすること。
  relationships:
  - name: レイ・カリス
    relation: 共に逃亡生活を送るパートナー
  arc: 過去の知識を「隠すための道具」としてではなく、「未来を切り拓くための力」として使う決意をする。
- name: ゼノス・ヴォルテックス
  role: 敵役
  age: 48
  gender: 男性
  appearance: 汚れ一つない純白の軍服、機械化された片目、威圧的な体躯。常に完璧な身なりを保っている。
  personality: 冷酷非道で支配的。効率と秩序を絶対とし、感情を「不確定要素」として嫌悪する。一人称は「私」。
  speech_style: 威厳に満ち、有無を言わせぬ絶対的な命令口調。
  background: 記憶売買市場を独占する巨大組織「メモリー・コア」の最高執行責任者。世界の再構築を自らの手で行おうとしている。
  motivation: 渡り鳥が持つ「世界の成り立ちに関する記憶」を奪い、自らが神として世界を管理・再設計すること。
  relationships:
  - name: レイ・カリス
    relation: 計画を阻む邪魔な「ゴミ」
  arc: 絶対的な支配を確信していたが、記憶が持つ「理不尽な希望」によって自らの構築した秩序が崩壊していく恐怖を味わう。
