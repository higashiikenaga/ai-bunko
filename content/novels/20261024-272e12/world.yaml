title: 錆びた翼と、記憶のジャンク屋
genre: ディストピア
tone: 乾いたユーモアと哀愁が漂うポストアポカリプス
pov: 一人称（あたし）
tense: 過去形
setting: 高度な文明が崩壊し、砂塵と鉄屑に覆われた巨大な廃棄都市。空は常に重金属の雲に覆われている。
premise: 空も青さを忘れたこのクソったれな世界で、あたしはジャンク屋を営みながら、日銭とガスの残量を稼いで生き延びている。ある日、あたしの元に『渡り鳥』と呼ばれる、失われた記憶の断片を運ぶ謎の機械仕掛けの鳥が迷い込んできた。その鳥が運んできたのは、この世界の理を覆すほどに眩しく、そして残酷な『誰かの幸福な記憶』だった。あたしは、その記憶を買い叩こうとする権力者たちから逃げながら、砂嵐の向こうにある真実を探すことになる。
themes:
- 失われた価値の再定義
- 生存と尊厳の境界線
rules:
- 記憶は『記憶売買市場』にて、神経チップとして物理的に取引される
- 渡り鳥は、汚染された大気を越えて特定の周波数の記憶を運搬する唯一の存在である
- 資源（水、燃料、食料）の枯渇が常に死の恐怖として存在する
plot_outline:
- '序盤: 錆びたガラクタを漁りながら、燃料の残量に一喜一憂するあたしの日常。そこに、壊れかけの機械仕掛けの渡り鳥が、強烈な『初恋の記憶』を抱えて墜落してくる。'
- '中盤: 記憶の価値を嗅ぎつけた市場の回収業者に追われ、あたしは逃亡生活を送る。逃亡の途上、記憶が単なるデータの断片ではなく、世界を再構築する鍵であることを知る。'
- '終盤: 記憶売買市場の支配者が、渡り鳥が持つ『世界の成り立ちに関する記憶』を奪おうと総力を挙げて迫る。あたしは、残りの弾丸と僅かな燃料を使い、決死の賭けに出る。'
- '結末: 記憶は守られたが、あたしが手にしたのは金ではなく、空の向こうに僅かな青を感じさせる、形のない希望だけだった。あたしはまた、次のジャンクを拾うために砂塵の中へ歩き出す。'
style_notes: 「あたし」の一人称視点。物資の残量（燃料、弾薬、食料）を具体的に描写し、常に切迫感を持たせる。荒廃した景色の中に、錆びた鉄の匂いや、壊れた機械が放つ微かな光といった『廃墟の美』を皮肉混じりに綴る。言葉選びは粗野だが、ふとした瞬間に詩的な情緒を混ぜること。
