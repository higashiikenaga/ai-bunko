- name: 凪野 栞
  role: 主人公
  age: 24
  gender: 女性
  appearance: 眼鏡をかけ、柔らかな質感のニットを好む。本を大切に扱う丁寧な手つきが印象的。
  personality: 穏やかで思慮深い。内向的だが観察力に優れる。一人称：私
  speech_style: 丁寧で静かな話し方。言葉を一つひとつ選ぶような落ち着いた口調。
  background: 元司書。都会の喧騒に疲れ、逃げるようにこの街の古本カフェ「氷の城」で働き始めた。
  motivation: 詩集に隠された真実を解き明かし、街の平穏とカフェの静かな時間を守ること。
  relationships:
  - name: 瀬戸 駆真
    relation: 友人・調査の協力者
  - name: 葛城 源三
    relation: 常連客・謎を遺した人物
  arc: 周囲の騒動に翻弄されながらも、自分の感性を信じて真実を見出す強さを得る。
- name: 葛城 源三
  role: 鍵となる人物
  age: 78
  gender: 男性
  appearance: 銀髪を綺麗に整えた、品のある老紳士。上質なウールコートを纏っている。
  personality: 威厳があり、どこか浮世離れした雰囲気を持つ。一人称：私
  speech_style: 丁寧で少し古風な、教養を感じさせる落ち着いた話し方。
  background: かつて街で愛された氷の彫刻家。現在は隠居し、カフェの常連として静かに過ごしていた。
  motivation: 失われゆく街の美しい伝統を、正しい形で次世代へ託すこと。
  relationships:
  - name: 凪野 栞
    relation: 自分の想いを託せる唯一の人物
  arc: 物語の起点となり、死後もなお詩を通じて主人公を真実へと導く導き手となる。
- name: 瀬戸 駆真
  role: 相棒
  age: 27
  gender: 男性
  appearance: 活動的な体格。常にカメラを首から下げており、冬の景色を撮るのが好き。
  personality: 明るく行動的。直感的で少しお調子者な面もあるが、根は誠実。一人称：僕
  speech_style: 快活で飾らない、親しみやすい話し方。
  background: 地元のフリーカメラマン。街の四季を記録することを生きがいとしている。
  motivation: 最初は「財宝」という刺激を求めて騒動に加わるが、次第に街の真の価値を知る。
  relationships:
  - name: 凪野 栞
    relation: 友人・調査仲間
  arc: 物質的な好奇心から、形のない「記憶」や「伝統」の価値を理解する大人へと成長する。
- name: 大河内 隆
  role: 対立役
  age: 52
  gender: 男性
  appearance: 鋭い目つきをした、実業家風の男。常に効率と利益を意識した身なりをしている。
  personality: 現実主義で野心的。街の活性化を口実にするが、本質は金銭的な利益追求。一人称：俺
  speech_style: 威圧的で、周囲の人々を扇動するような力強い話し方。
  background: 地元の商店街組合の有力者。街の再開発を推進している。
  motivation: 詩集の「財宝」を見つけ出し、それを観光資源として金銭に変えること。
  relationships:
  - name: 凪野 栞
    relation: 真実を隠そうとする妨害者としての認識
  arc: 騒動の中心となり物語に緊張感を与えるが、最終的に真実の価値に触れ、自身の在り方を問い直される。
