title: 氷の城の図書室と、冬に溶ける遺言
genre: 日常ほのぼのミステリー
tone: 穏やかで少し可笑しな、温かな空気感
pov: 一人称（わたし）
tense: 過去形
setting: 雪深い静かな街にある、ガラス張りの不思議な古本カフェ「氷の城」
premise: 古本カフェ「氷の城」で働くわたしの元に、ある常連客が「これは私の遺言です」と一冊の古い詩集を置いていきました。そこには、誰も知らないはずの「氷の城」へと続く奇妙な手がかりが記されています。街の人々はそれを財宝の地図だと勘違いして騒ぎ立てますが、わたしは詩の行間に隠された、あるささやかな願いに気づいていきます。
themes:
- 誤解が生む温もり
- 形に残らない記憶の継承
rules:
- 殺人は一切起きない
- 謎解きの鍵は、誰かの善意や思い込みにある
- 物語の舞台は常に静かで、人の体温を感じさせる場所である
plot_outline:
- '序盤: 冬の訪れとともに、常連の老紳士が「遺言」と記した詩集を店に残して姿を消す。そこには「氷の城へ捧ぐ」という謎めいた一文があった。'
- '中盤: 「氷の城」を伝説の場所だと信じた街の住人たちが騒ぎ出す中、わたしは詩集の中に隠された、かつての街の風景や、忘れられた約束を読み解いていく。'
- '終盤: 「氷の城」の正体が、かつて街で愛された氷の彫刻展示会の記憶であり、老紳士が残したのは財産ではなく、ある美しい伝統を次世代に託すためのメッセージだったことが判明する。'
- '結末: 誤解は解け、街には再び穏やかな時間が流れる。わたしは、新しい季節を待つように、温かい紅茶を淹れる。'
style_notes: 「わたし」という一人称を用い、少しとぼけたような、それでいて観察眼の鋭い語り口にする。難しい論理よりも、人の心の機微や、紅茶の香り、古い本の匂い、窓の外の雪景色といった感覚的な描写を大切にし、読者がふっと肩の力を抜けるような、やさしいリズムで綴ること。
