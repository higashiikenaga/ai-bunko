- name: 久我 誠
  role: 主人公
  age: 38
  gender: 男性
  appearance: 無精髭があり、使い古したトレンチコートを愛用。常に鋭い眼光を放っている。
  personality: 頑固で実直。正義感よりも真実に対する執着心が強く、周囲からは浮いている。一人称は「俺」。
  speech_style: 短文で、無駄な言葉を削ぎ落とした、ぶっきらぼうな話し方。
  background: 地方警察の捜査一課刑事。過去に組織の隠蔽工作に異を唱えたことで、昇進から外され現場を回っている。
  motivation: 星図が指し示す座標の謎を解き、二十年前の未解決事件の真相を明らかにすること。
  relationships:
  - name: 佐伯 結衣
    relation: 信頼する協力者
  - name: 松岡 健三
    relation: 敵対者
  arc: 組織の孤立と圧力に晒されながらも、孤独な戦いの末に真実を証明し、刑事としての矜持を再確認する。
- name: 松岡 健三
  role: 敵役
  age: 65
  gender: 男性
  appearance: 白髪混じりの整えられた髪。威厳のある佇まいで、常に高級なスーツを着用している。
  personality: 冷徹で計算高い権力主義者。組織の平穏のためなら、過去の過ちを隠蔽することも厭わない。一人称は「私」。
  speech_style: 丁寧だが、相手を威圧するような、論理的で隙のない話し方。
  background: 元捜査責任者で、現在は警察の有力な顧問として暗躍する。二十年前の失踪事件における隠蔽工作の主導者。
  motivation: 自身の社会的地位を守り、自らが築き上げた「秩序」に泥を塗る存在を排除すること。
  relationships:
  - name: 久我 誠
    relation: 排除すべき厄介な部下
  arc: 権力を用いて久我を追い詰めるが、最終的に自らが隠蔽した「真実」によって地位を失墜させる。
- name: 佐伯 結衣
  role: 協力者
  age: 29
  gender: 女性
  appearance: 眼鏡をかけた知的な風貌。常に白衣を着用しており、冷静な印象を与える。
  personality: 論理的で感情に左右されない。データと事実のみを信じるリアリスト。一人称は「私」。
  speech_style: 専門用語を交えた、淡々とした、説明的な話し方。
  background: 県警鑑識課の技官。天文学と地質学に深い造詣があり、星図の解析で久我をサポートする。
  motivation: 科学的な事実を解明し、矛盾のないデータを示すこと。
  relationships:
  - name: 久我 誠
    relation: 捜査のパートナー
  arc: 当初は久我の強引な捜査を非科学的だと批判するが、データの裏付けを通じて事件の深淵に触れ、共に真実を追う決意をする。
- name: 渡辺 拓海
  role: 脇役
  age: 25
  gender: 男性
  appearance: 清潔感のある身なり。少し緊張した面持ちで、周囲の顔色を伺う癖がある。
  personality: 真面目だが、組織の力に抗う勇気に欠ける。典型的な「組織の人間」。一人称は「僕」。
  speech_style: 丁寧な敬語。上司に対しては非常に謙虚で、怯えたような話し方をすることもある。
  background: 久我の部下として配属されたばかりの新米刑事。組織の論理と正義の間で揺れている。
  motivation: 大きなトラブルを避け、組織の中で順調にキャリアを積むこと。
  relationships:
  - name: 久我 誠
    relation: 上司
  arc: 久我の孤独な戦いと、組織が隠蔽しようとする闇を目の当たりにし、沈黙を守るか真実を追うかの葛藤を経て、小さな一歩を踏み出す。
