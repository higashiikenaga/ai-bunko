title: 座標の沈黙
genre: 本格ミステリー
tone: 乾いた硬質さ、警察組織のリアリズム
pov: 三人称
tense: 過去形
setting: 現代、地方都市の県警捜査一課とその管轄区域
premise: 山間部の廃天文台で、身元不明の遺体が発見される。遺体のポケットに残されていたのは、不自然な修正が加えられた一枚の星図だった。刑事の久我は、地道な聞き込みと座標の解析を通じて、事件が二十年前の未解決失踪事件と結びついていることに気づく。組織の圧力と沈黙に抗い、久我は星図が指し示す「真の座標」を追う。
themes:
- 組織の腐敗
- 埋もれた真実
rules:
- 捜査手順は現代日本の警察組織の規定に準拠する
- 超自然的な現象は一切排除し、すべての謎を論理的に解決する
- 星図は暗号として機能しており、地理的な座標へと変換可能である
plot_outline:
- '序盤: 03時15分、旧北条天文台にて男性遺体を発見。身分証はなく、血痕の付着した星図のみが遺留品として回収される。久我は遺体の死後硬直から死亡推定時刻を割り出し、現場周辺の聞き込みを開始する。'
- '中盤: 聞き込みの過程で、現場周辺に居着いている名前のない猫が、被害者が生前頻繁に接触していたことを突き止める。猫が導いた路地裏の廃屋から、二十年前の失踪事件に関する手記が発見され、星図の修正箇所が当時の地形で特定の地点を指していることが判明する。'
- '終盤: 星図の座標が指し示したのは、現職の県警幹部が所有する土地の境界線だった。久我は組織内部の妨害を受けながらも、単独で現場の土壌採取と掘削を行い、もう一つの遺体を掘り起こす。'
- '結末: 犯人は当時の捜査責任者であった退職警視。権力による隠蔽工作を立証し、逮捕に至る。久我は上司からの冷淡な評価を受けながらも、淡々と報告書を作成し、事件を締めくくる。'
style_notes: 時刻と場所を分単位、地点まで正確に記述すること。感情的な形容詞を排し、行動と事実のみを短文で繋ぐ。会話は実務的なやり取りに限定し、冗長な言い回しを避ける。聞き込み場面では、対象者の視線の動きや指先の震えなど、観察記録としてのディテールを徹底して描く。
