title: 真実の冠と、緋色の夜会を彩る偽りの祝祭
genre: 歴史・時代小説
tone: 華やかで退廃的、優雅な陰謀劇
pov: 三人称（全知視点）
tense: 過去形
setting: 新体制へと移行した帝国ルメリア、白金宮および周辺諸国の宮廷
premise: 皇帝退位という激動を経て、新たな秩序を築き始めたアルリック公爵とセラフィナ。しかし、平和の陰では、かつての帝国の正統性を主張する旧勢力が、封印されたはずの「失われた手紙」を巡って暗躍を始めていた。セラフィナの「真実しか語れない呪い」は、今や帝国の命運を左右する聖なる力として畏怖の対象となる。豪華絢爛な刺繍に彩られた夜会が幕を開ける時、愛する者を守るために、二人は再び偽りの仮面を被り、血塗られた真実の迷宮へと足を踏み入れる。
themes:
- 真実の価値と代償
- 愛による救済と自己犠牲
- 権力闘争と血統の正当性
rules:
- 「誠実の呪い」を持つ者は、意図に関わらず真実以外の言葉を紡ぐことができない
- 帝国の血統に関わる重大な真実を暴く際、審判官の血は激痛と共にある種の予知的な力を発揮する
- 社交界における嘘は礼節であり、真実を露呈させることは最大の不敬とされる
plot_outline:
- '序盤: 皇帝退位後の混乱が収まりつつあるルメリア。セラフィナはアルリックと共に新体制の象徴として社交界に君臨するが、彼女の「真実しか語れない」性質を逆手に取った政治的陥穽に陥る。ある日、亡き先帝の隠密書簡――「失われた手紙」が、帝国の根幹を揺るがす内容を含んでいるという噂が流れる。'
- '中盤: 手紙を奪還しようとする旧勢力と、それを阻止しようとするアルリックの策謀が激突する。セラフィナは、自らの呪いが単なる体質ではなく、手紙に記された「帝国の罪」を浄化するための儀式の一部であることを知る。舞踏会の準備が進む中、ドレスのレースに隠された暗殺の企みが、二人の間に緊張を走らせる。'
- '終盤: 豪華なクリスタルが輝く大舞踏会。旧勢力のリーダーが、セラフィナの力を強制的に引き出し、公衆の面前で帝国の失脚を狙う。アルリックは自らの地位を賭けた壮大な「嘘」を演じ、セラフィナは激痛に耐えながら、手紙に記された真実ではなく、新たな時代を紡ぐための「真実の言葉」を宣言する。'
- '結末: 陰謀は霧散し、旧勢力は退場するが、二人は帝国の守護者としての重責を背負うことになる。傷跡を残しながらも、黄金の刺繍が舞う夜会の片隅で、二人は偽りのない真実の愛を誓い合い、新しい時代の夜明けを迎える。'
style_notes: 絢爛豪華なドレスの質感、宝石の煌めき、舞踏会の香水の香りを、比喩を多用した装飾的な文体で描写すること。登場人物の心理描写は、優雅な所作の裏に潜む葛藤として描く。情景描写には「黄金」「真珠」「緋色」「白金」といった色彩豊かな語彙を用い、歴史ロマンとしての重厚感を演出する。
