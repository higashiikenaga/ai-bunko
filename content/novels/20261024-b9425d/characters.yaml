- name: カイ・セリザワ
  role: 主人公
  age: 26
  gender: 男性
  appearance: 清潔感はあるがどこか無機質な雰囲気。整えられた短髪、眼鏡。感情の起伏が表に出にくい静かな瞳。
  personality: 冷静沈着で合理主義的。効率を重視するが、心の奥底に言語化できない喪失感を抱えている。一人称は「僕」。
  speech_style: 丁寧で淡々とした敬語。必要最小限の言葉しか使わない。
  background: 記憶の整理業者。極貧の幼少期を過ごし、生存のために大切な記憶を次々と売却してきた過去を持つ。
  motivation: 偶然手にした記憶の断片の正体を突き止め、自分自身の欠落した部分を埋めたい。
  relationships:
  - name: リン・ハルサワ
    relation: 記憶の断片に登場する女性であり、再会した運命の相手
  arc: 効率的な「無」の生活から、痛みや空白を抱えながらも「今」を生きる人間的な豊かさへと変化する。
- name: リン・ハルサワ
  role: ヒロイン
  age: 25
  gender: 女性
  appearance: 儚げで透明感のある佇まい。少し色素の薄い髪。どこか遠くを見ているような瞳。
  personality: 穏やかだが、芯に強さを持つ。記憶を失ったことで自己認識が希薄になっている。一人称は「私」。
  speech_style: 柔らかく、少し間を置くような話し方。叙情的な表現を好む。
  background: かつてカイと共に過ごしていたが、過酷な生活の中で自己のアイデンティティに関わる重要な記憶を売却してしまった。
  motivation: 自分が誰であったのか、何を感じていたのかという「欠落感」の正体を知りたい。
  relationships:
  - name: カイ・セリザワ
    relation: かつて愛し合い、現在は互いに記憶を失っている相手
  arc: 過去の記憶に固執するのではなく、記憶がなくても目の前の存在を感じ取れる強さを獲得する。
- name: ガク・トウノウ
  role: 脇役 / メンター
  age: 58
  gender: 男性
  appearance: 恰幅が良く、使い古された作業着を着ている。顔には深い皺があり、温和な笑みを浮かべている。
  personality: 楽観的で包容力がある。記憶の売買がもたらす倫理的な危うさを理解しつつ、それでも人間を信じている。一人称は「俺」。
  speech_style: ぶっきらぼうだが温かい、地方都市の年配者らしい語り口。
  background: カイの職場の先輩であり、記憶市場の裏事情にも詳しいベテラン整理業者。
  motivation: カイが記憶の迷宮に呑み込まれすぎないよう、適度な距離で見守ること。
  relationships:
  - name: カイ・セリザワ
    relation: 上司であり、技術と哲学を伝える師のような存在
  arc: 物語における「安定した日常」の象徴として、主人公の変容を静かに肯定する役割。
