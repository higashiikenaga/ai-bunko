title: 鳥のゆくえと、空白の季節
genre: SF
tone: 静謐で淡い寂しさのある近未来日常
pov: 三人称近接
tense: 過去形
setting: 2080年代、記憶の断片を売買できるようになった地方都市
premise: 記憶の整理業に従事する青年は、人々が「不要」として売った記憶をアーカイブし、必要な人へ繋ぐ仕事をしている。ある日、彼は市場に流れてきた名もなき記憶の断片に、かつて自分が捨てたはずの「誰かへの思慕」を見つける。失ったはずの感情が、効率的に管理された今の生活に静かな波紋を広げていく。
themes:
- 喪失と受容
- 便利さの裏にある孤独
rules:
- 記憶は「感覚データ」として抽出・保存でき、市場で売買が可能である
- 抽出された記憶は、元の所有者の意識からは完全に消去される
- 他人の記憶をインストールしても、それは「他者の体験」としての認識に留まり、自分自身のアイデンティティに統合されることはない
plot_outline:
- '序盤: 主人公の淡々とした日常と、記憶の整理業の仕事風景を描写。便利に最適化された社会で、彼は心地よい空虚感を抱えて暮らしている。'
- '中盤: 記憶市場で、幼少期の自分と見知らぬ女性が一緒に渡り鳥を眺めている記憶の断片を偶然買い取る。それは彼がかつて生活費のために売却し、存在さえ忘れていた人生で最も幸福な記憶だった。'
- '終盤: 記憶の中の女性を捜す旅に出るが、彼女もまた多くの記憶を売り、自分を構成する重要なピースを失っていた。二人は思い出せないはずの共通の感覚を頼りに、かつて共に過ごした海岸線へと辿り着く。'
- '結末: 記憶を完全に復元して元に戻すことはできず、心には空白が残る。しかし、記憶がないままでも「今」目の前にいる相手を大切に思えることに気づき、冬の空を飛ぶ渡り鳥と共に、不完全な新しい日常を歩み始める。'
style_notes: 記述は淡々と、温度感を抑えて。空調の微かな動作音やホログラムの淡い光など、生活のディテールを丁寧に描く。未来技術を説明的に書かず、日常会話の中に自然に混ぜ込むことで、技術が浸透した世界の空気感を出す。便利さゆえにこぼれ落ちた「心の手触り」を情緒的に描写すること。
