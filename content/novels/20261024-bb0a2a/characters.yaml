- name: 如月 蓮（きさらぎ れん）
  role: 主人公
  age: 22
  gender: 男性
  appearance: 少し長めの黒髪に、物静かな印象を与える眼鏡をかけた青年。古書の香りが染み付いた質素な服装をしている。
  personality: 内向的で思慮深く、どこか世捨て人のような雰囲気を持つ。一人称は「僕」。
  speech_style: 丁寧で穏やかだが、感情の起伏が少ない淡々とした話し方。
  background: 常盤里で祖父から古本屋を継いだ。本に触れると、その持ち主の記憶が断片的なイメージとして流れ込んでくる特殊な力を持っている。
  motivation: 記憶を失った白妙の正体を探り、彼女が抱える孤独を癒やすこと。
  relationships:
  - name: 白妙
    relation: 守りたいと願う対象、運命の相手
  - name: 朔也
    relation: 里の掟を重んじる年長者としての畏怖
  arc: 本を通じて「過去の記憶」に逃避していた孤独な青年が、白妙との交流を通じて「現在」を生きる意味を見出し、自らの言葉で未来を書き換える強さを得る。
- name: 白妙（しろたえ）
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と、季節を失った里に似合わないほど鮮やかな銀髪を持つ。神々しい美しさを持つが、どこか儚い。
  personality: 純真無垢で好奇心旺盛。しかし、記憶がないことへの根源的な不安を抱えている。一人称は「私」。
  speech_style: たどたどしくも、古風で美しい言葉遣いをする。
  background: 季節を司る神であったが、かつての「忘却の約束」により記憶と情愛を失い、里を彷徨っていた。
  motivation: 自分が何者なのか、なぜこの懐かしい香りに導かれたのかを知ること。
  relationships:
  - name: 如月 蓮
    relation: 記憶の欠片を共有する大切な存在
  arc: 神としての義務と、人間としての情愛の間で葛藤し、最終的に神の座を捨てて、不完全で移ろいゆく「人間としての生」を受け入れる。
- name: 朔也（さくや）
  role: 敵役/守護者
  age: 72
  gender: 男性
  appearance: 厳格な眼光を持つ老人。里の守護職を思わせる、古風で隙のない装束を纏っている。
  personality: 冷徹で規律を重んじる。変化を「世界の崩壊」と捉え、現状維持を絶対とする。一人称は「私」。
  speech_style: 威厳に満ち、相手を突き放すような断定的な話し方。
  background: 里に伝わる「神と人の約束」を次世代へ繋ぐ守護者。季節が巡ることで訪れる「死」や「衰退」を恐れ、止まった時間を守り続けている。
  motivation: 白妙が人間への情愛を取り戻さないよう、約束を完遂させ、神としての役割を全うさせること。
  relationships:
  - name: 如月 蓮
    relation: 秩序を乱す危うい存在
  - name: 白妙
    relation: 守るべき対象であり、儀式の依代
  arc: 変化を拒み続けてきたが、主人公の和歌によって、終わりのある季節の巡りこそが生命の美しさであることを悟る。
- name: 琥珀（こはく）
  role: 脇役
  age: 17
  gender: 女性
  appearance: 里の娘らしい、快活な印象を与える茶髪の少女。薬草を摘むための籠を常に持っている。
  personality: 明るく世話焼き。止まった時間の中でも、日常を精一杯楽しもうとする強さがある。一人称は「私」。
  speech_style: 元気で親しみやすく、里の訛りが少し混じる。
  background: 常盤里の住人。季節が止まった里で、いつか訪れるはずの「春」を夢見ながら暮らしている。
  motivation: 里の人々に、再び四季の彩りを取り戻してあげること。
  relationships:
  - name: 如月 蓮
    relation: 相談相手、良き理解者
  - name: 白妙
    relation: 憧れの対象
  arc: 停滞した日常への諦めを捨て、変化を受け入れようとする主人公たちの姿を見て、新しい季節を待つ希望を持つ。
