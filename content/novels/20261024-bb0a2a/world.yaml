title: 花霞の栞
genre: 伝奇
tone: 静謐で優美、和風の情緒に満ちた語り
pov: 三人称
tense: 過去形
setting: 季節が止まった山奥の古都「常盤里」と、そこにひっそりと佇む古本屋
premise: 神と人が結んだ「忘却」の約束があった。古本屋を営む青年は、本に宿る記憶を読み解く力を持ち、ある日、記憶を失った美しい神の少女に出会う。彼女が探し求めるのは、かつて「約束の丘」で交わした、季節を戻すための言葉。二人は古書に散りばめられた断片を辿り、失われた約束の正体を探る。
themes:
- 記憶と忘却
- 季節の巡り
rules:
- 神々は人間との約束を「文字」として本に封じ込めることで、その権能と存在を維持する。
- 本から記憶（文字）が消えれば、神はその力を失い、やがて消滅するか人間となる。
- 「約束の丘」に咲く花が全て開花した時のみ、封印された約束を書き換えることが許される。
plot_outline:
- '序盤: 古本屋の店主である主人公が、記憶をなくした神の少女・白妙（しろたえ）と出会う。彼女は自分の名以外のすべてを忘れ、ただ懐かしい香りに導かれて店を訪れていた。'
- '中盤: 白妙と共に、里に眠る古書の中に隠された「神々の断片」を集める旅に出る。季節が止まった里の住人たちが抱える静かな悲しみと、かつて神と人が交わした契約の片鱗が明らかになっていく。'
- '終盤: ついに「約束の丘」へと辿り着くが、そこで残酷な真実を知る。かつての約束とは、世界に季節を取り戻す代償として、神が人間への情愛をすべて捨てるという誓いだった。'
- '結末: 主人公が白妙のために綴った一首の和歌が、凍てついた神の心を溶かし、新たな約束へと書き換えられる。季節が再び動き出し、白妙は神としての座を捨て、一人の人間として里で生きることを選ぶ。'
style_notes: 擬音語や外来語を極力避け、大和言葉を用いた柔らかな表現を用いる。場面転換や感情の昂りに合わせて、五・七・五・七・七の和歌を挿入し、風景の移ろいと心の機微を重ねて描く。
