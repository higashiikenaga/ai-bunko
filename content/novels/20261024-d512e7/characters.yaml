- name: 瀬戸 航
  role: 主人公（語り手）
  age: 32
  gender: 男性
  appearance: 痩身で少しやつれた風貌。常に手帳とボイスレコーダーを持ち歩いている。
  personality: 冷静で論理的であろうとするが、一度気になると執拗に追求する性質。一人称は「僕」。
  speech_style: 丁寧だが、どこか距離を置いた客観的な話し方。
  background: フリーランスのライター。数年前に失踪した旧友の足跡を追ううちに、地図にない離島の噂に辿り着く。
  motivation: 失踪した友人の行方を突き止め、不可解な現象の裏にある論理的な説明を見つけること。
  relationships:
  - name: 佐伯 海斗
    relation: 旧友であり、物語の動機となる人物
  - name: 龍崎 源三
    relation: 島の謎を知る協力者（あるいは警告者）
  arc: 未知の怪異を「解明すべき謎」として扱っていたが、言葉が現実を侵食する恐怖に直面し、理性では抗えない神域の存在を悟る。
- name: 佐伯 海斗
  role: 重要人物（犠牲者）
  age: 32
  gender: 男性
  appearance: かつては快活な漁師だったが、現在は生気を失い、虚ろな瞳をしている。
  personality: 責任感が強く、他人のために自分を犠牲にしがちな性格。一人称は「俺」。
  speech_style: 以前は明るかったが、現在は言葉を慎重に選び、途切れがちな話し方。
  background: 航の幼馴染。離島の近くで漁をしていた際、潮の引いた海底の石柱群を目撃して以来、様子が一変した。
  motivation: 自分が目撃した「真実」を、航に悟られないように隠し通そうとする。
  relationships:
  - name: 瀬戸 航
    relation: 親友
  arc: 嘘を守ろうとすればするほど、内面から崩壊し、最終的に「隠していた真実」を口にしたことで破滅へと向かう。
- name: 龍崎 源三
  role: 脇役（島の守り手）
  age: 76
  gender: 男性
  appearance: 深く刻まれた皺と、潮風に焼かれた肌。常に古い法衣のようなものを纏っている。
  personality: 寡黙で峻厳。島の伝統と禁忌を絶対的なものとして守る。一人称は「わし」。
  speech_style: 古風で、断定的かつ含みのある言い回し。多くを語らない。
  background: その島に代々伝わる「沈黙の儀式」を司る家系の長。島の異常な風習を「審判」として受け入れている。
  motivation: 外から来た者が島の禁忌を破り、嘘を吐くことによって「濁流」を招かないよう監視すること。
  relationships:
  - name: 瀬戸 航
    relation: 調査者として警戒している対象
  arc: 物語を通して変化せず、逃れられない運命と、残酷な信仰の象徴として君臨し続ける。
- name: 凪沙 詩織
  role: 脇役（目撃者）
  age: 28
  gender: 女性
  appearance: 鋭い眼差しを持つ、実務的な服装の女性。島の売店を営んでいる。
  personality: 現実主義的で、島の不穏な空気を察して周囲と距離を置いている。一人称は「私」。
  speech_style: ぶっきらぼうで、余計なことは言わない事務的な口調。
  background: 島で生まれ育ったが、海底遺跡の伝説を「ただの迷信」と切り捨てようと努めている住民。
  motivation: 島の奇妙な習慣に深入りせず、平穏な日常を維持すること。
  relationships:
  - name: 瀬戸 航
    relation: 不審な外来者として扱う
  arc: 現象を否定し続けてきたが、目の前で男たちが消えていくのを目の当たりにし、沈黙こそが唯一の生存戦略であることを理解する。
