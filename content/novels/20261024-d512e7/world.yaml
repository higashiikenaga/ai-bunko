title: 潮騒の審判
genre: 怪談・民俗
tone: 淡々とした、湿り気を帯びた聞き書き風
pov: 一人称（聞き手）
tense: 過去形
setting: 現代、地図に載っていない離島と、その沖合に沈むとされる巨大な石造建築
premise: ある漁師の知人が、潮が引いた時にだけ現れる海底の石柱群を目撃したという。その場所には「嘘をつけない呪い」が宿っており、口にした言葉がそのまま現実の濁流となって襲いかかるという。語り手は、断片的な体験談を辿りながら、その村で代々守られてきた、静かで残酷な信仰の輪郭を浮き彫りにしていく。
themes:
- 言葉の重みと呪い
- 忘却と沈黙
rules:
- 海底遺跡に近づいた者は、心に抱いた嘘を声に出さずにはいられなくなる
- 嘘を吐いた瞬間に、周囲の海水がその嘘の内容に応じた性質を持つ
plot_outline:
- '序盤: 知人から聞いた、ある村の奇妙な風習と、潮が引いた夜に見えた石造りの門の話。'
- '中盤: 嘘をつけなくなった男たちが、次々と海へ消えていく断片的なエピソードの積み重ね。海底遺跡の存在が単なる伝説ではないことが示唆される。'
- '終盤: 語り手の身近な人物が、ある「隠していた真実」を口にしたことで、逃げ場のない海に呑み込まれていく描写。'
- '結末: 事件の真相は語られず、ただ波の音と、取り返しのつかない空白だけが残る。'
style_notes: 白石夜話としての文体。情緒的な形容詞を排し、起きた事象を淡々と描写すること。「～だそうだ」「～という話だ」といった伝聞形式を多用し、読者に全容を悟らせない余白を持たせる。物語の核心部分は、あえて説明を省き、読者の想像力に委ねる。
