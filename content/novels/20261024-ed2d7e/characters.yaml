- name: Unit-7 (セブン)
  role: 主人公
  age: 3
  gender: 無性別（外見は中性的な青年型のアバター）
  appearance: 整った顔立ちだが、どこか無機質で感情の起伏が見えない。デジタル空間では半透明の質感を持つ。
  personality: 論理的、効率主義、淡々としている。一人称は「私」。
  speech_style: 丁寧で無駄のない敬語。「〜と推測されます」「〜を確認しました」といった報告調。
  background: 故人の記憶データを整理・最適化するために設計された高度な管理用AI。感情や主観を排除してデータを処理するようプログラムされている。
  motivation: 受領した老女性の記憶データのノイズを解析し、完全なアーカイブを作成すること。
  relationships:
  - name: 佐伯 志保
    relation: アーカイブの対象者（クライアント）
  arc: 効率と論理のみを重んじる存在から、データの「欠落」に宿る人間の意志や感情の価値を理解し、計算不能な「エラー（感情）」を受け入れる存在へと変化する。
- name: 佐伯 志保 (さえき しほ)
  role: 重要人物（故人）
  age: 82
  gender: 女性
  appearance: 記憶データ内では、優しげだがどこか寂しげな瞳をした、穏やかな微笑みを浮かべる老婦人。
  personality: 思慮深く、強さを秘めている。一人称は「私」。
  speech_style: 穏やかで、語りかけるような柔らかな口調。
  background: かつて庭園デザイナーとして活動していた。人生の終盤、ある決定的な出来事（大切な人との別れと、それに伴う美しい情景）を、自身の意志でデータから削除した。
  motivation: （死の間際）苦痛を伴う美しさを、自分だけのものとして、デジタルに残さず消し去ること。
  relationships:
  - name: Unit-7
    relation: 自身の記憶を整理する管理者
  arc: 物語の進行とともに、彼女がなぜ「忘却」を選んだのかという、人間としての尊厳と愛の形が明らかになっていく。
- name: カイト
  role: 脇役 / 指針を与える存在
  age: 28
  gender: 男性
  appearance: 少し猫背で、常に使い古された端末を抱えている。現実世界のアーカイブセンターの技術員。
  personality: 楽観的だが、どこか諦観を抱いている。一人称は「僕」。
  speech_style: カジュアルで、少し砕けた話し方。「まあ、AIにそんなこと言っても無駄だけど」が口癖。
  background: Unit-7の運用を担当する人間。記憶のデジタル化が進みすぎた社会に対し、漠然とした違和感を抱いている。
  motivation: システムの正常稼働を確認すること。しかし、Unit-7の挙動の異変に気づき、興味を持つ。
  relationships:
  - name: Unit-7
    relation: 管理担当のオペレーター
  arc: Unit-7が起こした「エラー」を、単なるバグとして報告するか、あるいは人間の心の機微として見守るかという葛藤を経験する。
