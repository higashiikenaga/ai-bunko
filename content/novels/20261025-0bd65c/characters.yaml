- name: エリオット
  role: 主人公
  age: 21
  gender: 男性
  appearance: 痩身で色白。司書の正装である古びたローブを纏い、知的な印象を与える眼鏡をかけている。瞳には好奇心と諦念が混在している。
  personality: 内向的で控えめだが、知識への探求心は人一倍強い。一人称は「僕」。
  speech_style: 丁寧で控えめな口調。本の内容を引用する癖がある。
  background: 辺境の街で古書の管理をしていた司書。静止した世界に疑問を持ち、禁書庫で黄金の切符と神の遺言を発見したことで運命が動き出す。
  motivation: 世界の時間を再び動かし、誰もが「明日」を夢見ることができる世界を取り戻すこと。
  relationships:
  - name: ルナ
    relation: 旅の同行者であり、精神的な支え
  - name: ヴァレリウス
    relation: 思想的に対立する宿敵
  arc: 知識を蓄えるだけの「観察者」から、自らの記憶という最大の犠牲を払って世界を救う「当事者」へと成長する。
- name: ルナ
  role: 相棒
  age: 外見は20代前半
  gender: 女性
  appearance: 白銀の甲冑に身を包んだ女騎士。長い白髪を一つに結んでいる。瞳は深い瑠璃色で、どこか遠くを見つめている。
  personality: ストイックで責任感が強い。感情表現は乏しいが、内面には深い孤独と慈愛を秘めている。一人称は「私」。
  speech_style: 簡潔で武骨な騎士口調。感情が高ぶると言葉数が少なくなる。
  background: 記憶を失った状態でエリオットの前に現れた。かつて星辰の軌道を護っていた聖騎士の一員だったとされるが、その詳細は不明。
  motivation: 自身の失われた記憶を取り戻し、自分がなぜこの世界に遺されたのかという理由を知ること。
  relationships:
  - name: エリオット
    relation: 守るべき対象であり、唯一心を許した友人
  arc: 過去の記憶という呪縛から解放され、エリオットと共に歩む「未来」に価値を見出す。
- name: ヴァレリウス
  role: 敵役
  age: 不詳（外見は50代）
  gender: 男性
  appearance: 豪華絢爛な黄金の法衣を纏い、顔の右半分を精巧な時計仕掛けの仮面で覆っている。細長い指にいくつもの指輪を嵌めている。
  personality: 傲慢で支配欲が強く、選民思想を持つ。停滞こそが究極の完成であると信じている。一人称は「私」。
  speech_style: 慇懃無礼で芝居がかった話し方。相手を精神的に追い詰めるような言い回しを好む。
  background: 時間を独占し、永遠の生を享受しようとする教団の教祖。黄金の切符を奪い、終着駅で自分だけが時間を操作する神になろうと企む。
  motivation: 世界の時間を完全に停止させたまま、自分と選ばれた信者だけが統治する永遠の帝国を築くこと。
  relationships:
  - name: エリオット
    relation: 切符を持つ邪魔者であり、興味深い観察対象
  arc: 永遠という停滞に固執するが、エリオットがもたらした「変化」と「喪失」という時間の真理に敗北し、崩壊する。
- name: トック
  role: 脇役/ガイド
  age: 数百年（推定）
  gender: 不明
  appearance: 浮遊する球体型の小型オートマトン。中心に大きな時計の文字盤があり、小さな機械の腕が2本生えている。
  personality: 皮肉屋で毒舌だが、根は親切。古代文明の知識を豊富に持っている。一人称は「当機」。
  speech_style: 分析的な口調。語尾に「～ですな」「～でしょう」と付ける傾向がある。
  background: 最終列車の案内役として造られた古代の自動人形。長い年月を経て機能が劣化し、一部の記憶回路が破損している。
  motivation: プログラムされた使命である「乗客を終着駅まで送り届けること」を完遂すること。
  relationships:
  - name: エリオット
    relation: 不慣れな旅人を導くガイド兼ツッコミ役
  arc: 単なる機械的な命令の遂行から、エリオットたちの絆に触れ、自らの意思で彼らを助けたいと願うようになる。
