title: 天球の鉄路、黄昏の終焉に
genre: 異世界ファンタジー
tone: 重厚で神話的、格調高い雰囲気
pov: 三人称
tense: 過去形
setting: 世界の時計が停止し、永遠の黄昏に閉ざされた大陸アステリオン。空には巨大な星辰の歯車が静止し、地上にはかつての文明が遺した「星辰の軌道（レール）」が張り巡らされている。
premise: 絶望的な停滞に沈む世界で、唯一「明日」を運ぶと言われる伝説の最終列車。辺境の司書である青年エリオットは、古書の中に隠されていた神の「遺言」と、列車に搭乗するための黄金の切符を発見する。彼は世界の時間を再び動かすため、失われた駅を巡り、星の記憶を回収する旅に出る。
themes:
- 運命への抗い
- 記憶と継承
rules:
- 「時間」は物理的な資源として存在し、消費し尽くした者は存在が希薄になり、やがて「忘却の塵」となって消える
- 星辰の軌道の上でのみ、高度な星辰魔術が発動可能である
- 最終列車は、世界で最も多くの喪失を経験し、それでもなお前を向く意志を持つ者しか搭乗できない
plot_outline:
- '序盤: 停滞した街の司書エリオットが、禁書庫の奥底で神の遺言が刻まれた黄金の切符を発見し、旅の導き手となる記憶喪失の女騎士ルナと出会う。'
- '中盤: 忘れ去られた複数の「星の駅」を巡り、かつての文明が遺した記憶の断片を収集する。その過程で、時間を独占して永遠の生を得ようとする教団の陰謀に巻き込まれる。'
- '終盤: 世界の最果てにある「終着駅」へ到達するが、列車を起動させるには、搭乗者の最も大切な記憶を燃料として捧げるという残酷な代償があることが判明する。'
- '結末: エリオットは自らの存在証明である全ての記憶を捧げ、最終列車を走らせる。世界に再び「時間」という流れが戻り、人々は忘却を乗り越えて新しい夜明けを迎える。'
style_notes: 竜胆 アルトとしての執筆。章の冒頭に架空の叙事詩や格言を引用し、世界の奥行きを演出する。地名や魔術名にはラテン語的な響きを持たせ、地の文は比喩を多用した重厚な文体で記述。会話文は、高潔な騎士、傲慢な司教、純朴な青年など、キャラクターの社会的地位と精神性を反映した厳格な口調の書き分けを行う。
