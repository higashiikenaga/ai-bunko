- name: エリアス・ソーン
  role: 主人公（探偵役）
  age: 32
  gender: 男性
  appearance: 痩身で神経質な印象。度の強い眼鏡をかけており、常に懐中時計を気にしている。
  personality: 極めて論理的で冷徹。感情よりも数式や物理法則を信頼する。一人称は「僕」。
  speech_style: 淡々としており、相手の矛盾を突く際は静かに、しかし容赦なく指摘する。
  background: 元光学物理学の教授。ある事件で学界を追われたが、その類まれなる観察眼と推論能力から、裏で困難な事件の解決を請け負っている。
  motivation: 不可解な密室トリックという「解かれるべき数式」への知的好奇心を満たすこと。
  relationships:
  - name: ジュリアン・スターリング
    relation: かつての恩師であり、現在は軽蔑し合うライバル
  - name: サラ・アル＝ラシード
    relation: 現場の状況把握において協力し合うビジネスライクな関係
  arc: 論理のみを信じていたが、犯人の動機に潜む「人間的な情念」に触れ、知的な快感以上の感情を抱く。
- name: ジュリアン・スターリング
  role: 敵役（容疑者）
  age: 55
  gender: 男性
  appearance: 白髪を完璧に整えた紳士。仕立ての良いリネンスーツを纏い、高価な指輪を嵌めている。
  personality: 傲慢で権威主義的。自身の知識と地位に絶対の自信を持つ。一人称は「私」。
  speech_style: 慇懃無礼。相手を格下に見下した、余裕のある話し方をする。
  background: 世界的な権威を持つ天文学者。被害者である主催者とはかつて共同研究を行っていたが、ある研究成果の横取りを巡って激しく対立していた。
  motivation: 失われた名声の回復と、被害者が隠し持っていたとされる「真の天球儀の設計図」の奪還。
  relationships:
  - name: エリアス・ソーン
    relation: かつての教え子であり、自分の能力を脅かす不快な存在
  - name: クララ・ヴァルモン
    relation: 利用価値のある若手研究者として扱い、操ろうとしている
  arc: 完璧な計画を立てたつもりでいたが、想定外の物理的事実（砂の痕跡）によって論理的に追い詰められ、崩壊する。
- name: クララ・ヴァルモン
  role: 脇役（容疑者/証言者）
  age: 24
  gender: 女性
  appearance: 小柄で、常に不安げに視線を泳がせている。白衣の下に地味な服装をしている。
  personality: 内向的で献身的だが、内側に強い独占欲と上昇志向を秘めている。一人称は「私」。
  speech_style: 語尾が消え入りやすく、たどたどしい。感情が高ぶると早口になる。
  background: 被害者の唯一の弟子であり、天文観測施設の助手。師匠に心酔していたが、同時にその厳しさに精神的に追い詰められていた。
  motivation: 師匠に認められたいという欲求と、彼が隠していたある「秘密」を共有すること。
  relationships:
  - name: エリアス・ソーン
    relation: 正体を暴かれることを恐れつつも、その明晰さに惹かれている
  - name: ジュリアン・スターリング
    relation: 恐怖と反感を感じているが、権威に抗えない
  arc: 依存心から脱却し、自身の犯した過ち（あるいは隠し事）を認めることで、精神的な自立を果たす。
- name: サラ・アル＝ラシード
  role: 相棒（協力者）
  age: 30
  gender: 女性
  appearance: 日焼けした肌に、機能的な砂漠装束を身に纏っている。鋭い眼差しを持つ。
  personality: 現実的で行動的。砂漠の自然と環境に精通しており、直感に優れる。一人称は「私」。
  speech_style: 簡潔で率直。回りくどい言い方を嫌い、核心を突く。
  background: オアシスリゾートの運営責任者兼、地域のガイド。この地の風習や、気象条件による視覚的な錯覚について熟知している。
  motivation: 静謐なオアシスで起きた惨劇を早急に解決し、施設の平穏を取り戻すこと。
  relationships:
  - name: エリアス・ソーン
    relation: 理屈っぽい彼に呆れつつも、その推理の精度を信頼している
  arc: 外部から来た者たちの争いに翻弄されるが、最終的にエリアスの推理を物理的に裏付ける決定的な証拠（砂の性質）を提示する役割を担う。
