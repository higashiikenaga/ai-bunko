title: 砂塵の檻と蝕の天球儀
genre: 本格ミステリー
tone: 重厚かつ理知的で、静謐な緊張感に満ちた文体
pov: 一人称（ワトソン役の観察者による視点）
tense: 過去形
setting: 架空の砂漠地帯、奇跡のオアシスに建つ、閉鎖的な天文観測施設
premise: 広大な砂漠に浮かぶオアシスのリゾートに、天文学者による特別招待が行われた。目的は、数十年ぶりの皆既月食を観測することである。しかし、月が影に呑み込まれたその刹那、密室となった天文台から主催者の遺体が発見される。現場には、不可解なほど精密な天球儀と、わずかな砂の痕跡だけが残されていた。闇がもたらした死は、果たして自然の摂理か、それとも計算された殺意か。
themes:
- 密室の物理的解明
- 光と影による欺瞞
rules:
- 全てのトリックは、月食による光量の変化と、天体観測機器の物理的特性に基づいていること
- 読者が犯人を特定できるよう、手がかりとなる物理的事実（影の動き、温度、物質の配置）をすべて記述すること
plot_outline:
- '序盤: 砂漠のオアシスへと続く旅路と、閉鎖的なリゾートへの到着。月食を待ちわびる賓客たちの、一見平穏ながらも含みのある会話の描写。'
- '中盤: 皆既月食の開始と共に、密室の天文台で殺人が発生。探偵が現場に立ち入り、天球儀の角度、窓の結露、床に散った微細な砂といった、一見無関係な物理的事実を収集する。'
- '終盤: 探偵による、読者への挑戦を込めた論理的な推理の披露。月食の影がどのように「密室」を作り出し、犯人の存在を物理的に消し去ったのかを、天球儀の構造を用いて解き明かす。'
- '結末: 犯人の動機と、論理の綻びによる追い詰め。夜明けと共に砂漠の熱気が訪れ、事件の真相が白日の下に晒される。'
style_notes: 語り手である「私」は、探偵の鋭い観察眼を傍らで見守る立場を貫き、探偵の思考を正確に記録する。文体は端正かつ硬質であり、情景描写は極めて具体的であること。手がかりとなる物理的証拠（光の屈折、影の長さ、音の反響など）は、決して抽象化せず、読者が論理の糸を辿れるよう本文中に明示的に記述する。
