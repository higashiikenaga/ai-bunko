- name: 凪原 海帆
  role: 主人公
  age: 17
  gender: 男性
  appearance: 日焼けした肌に引き締まった肢体。意志の強そうな鋭い眼差しを持つが、ふとした時に年相応の幼さが出る。
  personality: 情熱的でストイック。責任感が強く、自分一人で全てを背負い込もうとする傾向がある。一人称は「俺」。
  speech_style: ぶっきらぼうだが、艇のことになると熱を帯びて早口になる。
  background: 廃部寸前のボート部のエース。天性の身体能力を持つが、精神的なプレッシャーから時折リズムを崩す。妹の海陽に戦術面を完全に依存している。
  motivation: 全国大会で優勝し、ボート部の存在意義を証明すること。
  relationships:
  - name: 凪原 海陽
    relation: 双子の妹であり、絶対的な信頼を置く戦術家
  - name: 佐伯 亮介
    relation: 反発し合いながらも、精神的な壁を乗り越えるためのライバル的な先輩
  arc: 個人の能力への過信と孤独な戦いから脱却し、チーム全員で一つのリズムを刻む喜びと信頼を学ぶ。
- name: 凪原 海陽
  role: 相棒/軍師
  age: 17
  gender: 女性
  appearance: 眼鏡をかけ、常に作戦ボードとストップウォッチを携帯している。冷静沈着な佇まいで、兄とは対照的に知的で静かな印象。
  personality: 極めて分析的で合理的。感情を排して最適解を導き出そうとするが、内面では兄への深い愛情と、自分は漕げないことへの葛藤を抱えている。一人称は「私」。
  speech_style: 論理的で淡々としている。データに基づいた指摘が多く、時に残酷なほど正論を突きつける。
  background: 幼少期に怪我で競技を断念。それ以来、海の流れ、風向き、選手の心拍数までを数値化する緻密な戦術構築に没頭し、マネージャーとして部を支える。
  motivation: 完璧な戦術図を完成させ、兄を最高の舞台で勝利させること。
  relationships:
  - name: 凪原 海帆
    relation: 双子の兄。彼の身体能力を最大限に引き出すことが自分の使命だと考えている
  - name: 源造
    relation: 理論では説明できない「海の理」を教わる師のような存在
  arc: 数値や理論だけでは制御できない「情熱」や「呼吸」という不確定要素を受け入れ、真の調和を導き出す術を身につける。
- name: 佐伯 亮介
  role: 脇役/精神的支柱
  age: 18
  gender: 男性
  appearance: 疲れ切った目つきに、年季の入った大きな手。かつての栄光を忘れさせない風格が漂うが、現在はどこか投げやりな雰囲気。
  personality: 皮肉屋で冷笑的。しかし根は情に厚く、後輩たちのひたむきさに心を動かされる。一人称は「俺」。
  speech_style: 気だるげな口調。核心を突く皮肉を混ぜながらも、時折、経験に基づいた重みのある助言をする。
  background: 元・期待の星だったが、ある大会での致命的なミスで自信を喪失。現在は記録係や控えとして部にとどまっているが、心の中では海への恐怖と憧憬が同居している。
  motivation: もう一度、自分自身の足で（艇で）前へ進めるという感覚を取り戻すこと。
  relationships:
  - name: 凪原 海帆
    relation: 若すぎる才能への嫉妬と、かつての自分を重ね合わせた危うさを危惧している
  - name: 凪原 海陽
    relation: 彼女の冷徹な分析に呆れつつも、その執念を高く評価している
  arc: 過去の挫折という呪縛を解き、チームの「重し」ではなく、全員を繋ぎ止める「錨（いかり）」としての役割を見出す。
- name: 源造
  role: 導き手
  age: 72
  gender: 男性
  appearance: 深く刻まれた皺と、潮風に晒されたごわごわの肌。古びたレインコートを纏い、常に灯台の頂上から海を見つめている。
  personality: 達観しており、寡黙。若者たちの衝突を微笑ましく眺めているが、ここぞという時に言葉ひとつで彼らの視点を変える。一人称は「わし」。
  speech_style: ゆっくりとした、古風な漁村の訛りがある話し方。
  background: 数十年前、この村のボート競技を黄金時代に導いた伝説の漕ぎ手。現在は灯台守として、静かに海と対話しながら暮らしている。
  motivation: 次世代の若者たちが、海という巨大な存在に屈せず、共に踊る術を身につけることを見届けること。
  relationships:
  - name: 凪原 海陽
    relation: 理論に固執する彼女に、直感と自然への敬意を教える精神的なメンター
  - name: 佐伯 亮介
    relation: かつての教え子のような関係であり、彼の心の傷を誰よりも理解している
  arc: 自らの経験を直接的に教えるのではなく、彼らが自力で「リズム」に辿り着くまで待つことで、次世代への継承を完遂する。
