title: 潮騒の艇、双子の航跡
genre: 群像劇
tone: 熱情と静寂が交錯する、泥臭くも美しい青春劇
pov: 三人称（選手、ベンチ、観客席、灯台の観測者の視点を交錯させる）
tense: 過去形
setting: 海沿いの寂れた漁村、潮風の吹き荒れるボート競技場
premise: 廃部寸前の沿岸部ボート部。エースとして期待される双子の兄と、その影で緻密な戦術を練るマネージャーの妹。挫折した元選手、記録係の控え選手、そして丘の上の古い灯台から彼らを見守る老人が、バラバラな思いを一つの艇（ボート）に集約していく。荒れ狂う海と、作戦ボードに描かれた緻密な戦術図が、彼らを極限のレースへと導く。
themes:
- 個の限界と集団の調和
- 喪失からの再起
rules:
- ボート競技において、漕ぎ手の呼吸と艇の傾斜が完全に同期したときのみ、爆発的な推進力が生まれる
- 作戦は、指揮者が言葉によって脳内に描く「見えない図解」によって共有される
plot_outline:
- '序盤: 廃部危機に瀕した部活動の現状と、双子の兄妹が抱える複雑な感情。古い灯台の下で黙々と練習する彼らを、遠くから見つめる視点。'
- '中盤: 控え選手やマネージャーの視点を通じ、チームの綻びと、それを埋めるための緻密な戦術構築が描かれる。地方予選での激闘。'
- '終盤: 全国大会。荒天の海。エースの予期せぬトラブルに対し、ベンチの焦燥と、作戦ボード上の指示が言葉の連なりとなって展開されるクライマックス。'
- '結末: 結果以上に、彼らが一つの「リズム」を掴んだことの証明。灯台の光が、彼らの新たな航路を照らす。'
style_notes: チームスポーツの群像劇として、主役だけでなく控え選手やマネージャーの心理描写を厚くすること。作戦ボード上の矢印や選手のポジショニング、艇の重心移動といった戦術的な動きを、まるで精密な設計図を言葉で写し取るように詳細に記述する。観客席の熱狂と、静まり返ったベンチの緊張感を対比させること。
