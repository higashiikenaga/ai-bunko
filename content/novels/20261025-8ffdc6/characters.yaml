- name: 佐藤 航平
  role: 主人公
  age: 26
  gender: 男性
  appearance: 都会的な、少し疲れの見える細身の青年。清潔感はあるが、どこか虚脱感を漂わせている。
  personality: 内省的で観察眼が鋭い。一人称は「僕」。
  speech_style: 標準語。丁寧だが、他者との距離を置くような淡々とした話し方。
  background: 東京のIT企業で消耗し、心身を病みかけていた。亡き祖父の遺品整理のために、疎遠だった御神辺村を訪れる。
  motivation: 祖父の死の真相を探り、村の違和感の正体を突き止めること。
  relationships:
  - name: 霧島 彩
    relation: 謎めいた協力者
  - name: 黒田 宗厳
    relation: 警戒すべき村の権力者
  arc: 都会的な論理で村の異変を解釈しようとするが、非科学的な恐怖に直面し、最終的に逃れられない運命の「器」へと変貌する。
- name: 霧島 彩
  role: 相棒（導き手）
  age: 22
  gender: 女性
  appearance: 黒髪のロングヘア。村の伝統的な装いを好むが、どこか現代的な寂寥感を感じさせる。
  personality: 静かで物静か。予感や直感に従う。一人称は「私」。
  speech_style: 穏やかだが、時折村特有の古い方言が混じる。
  background: 村の神職の家系に生まれたが、鏡の儀式の残酷さを知り、心を閉ざしている。
  motivation: 航平に真実を伝え、彼が儀式の犠牲になるのを防ごうとする。
  relationships:
  - name: 佐藤 航平
    relation: 救いたいと願う対象
  - name: 黒田 宗厳
    relation: 畏怖すべき長老
  arc: 傍観者として村の理に抗おうとするが、最後には村の呪縛に抗いきれず、絶望を受け入れる。
- name: 黒田 宗厳
  role: 敵役
  age: 78
  gender: 男性
  appearance: 背は低いが威圧感のある老人。深く刻まれた皺が、まるで地図の紋様のように見える。
  personality: 冷酷で、集団の利益を絶対視する狂信者。一人称は「わし」。
  speech_style: 重々しく、威厳に満ちた古い言葉遣い。
  background: 御神辺村の長老。村の繁栄を支える「鏡の儀」の継承者。
  motivation: 儀式を完遂させ、村に永劫の繁栄をもたらすこと。
  relationships:
  - name: 佐藤 航平
    relation: 儀式に必要な「器」
  arc: 変わることのない村の「理」そのものとして、航平を逃げ場のない極限へと追い詰める。
- name: 柳沢 慎一
  role: 脇役
  age: 45
  gender: 男性
  appearance: 日焼けした肌と、常に周囲を警戒する鋭い眼光。作業着が似合う屈強な体格。
  personality: 臆病だが、情に厚い一面もある。一人称は「俺」。
  speech_style: 荒っぽい、泥臭い方言。
  background: かつて村から逃げ出そうとして失敗し、村の闇を知りながら従わざるを得なくなった男。
  motivation: 航平を村から連れ出し、自分も解放されること。
  relationships:
  - name: 佐藤 航平
    relation: 脱出を試みる共犯者
  arc: 航平の脱出を助けようと奔走するが、村の呪い（泥）に飲み込まれ、無残な末路を辿る。
