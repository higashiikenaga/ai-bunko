title: 泥濘の鏡、あるいは噤みの村
genre: 伝奇
tone: 静謐、湿り気のある、逃げ場のない恐怖
pov: 三人称
tense: 過去形
setting: 現代、山間の閉ざされた集落「御神辺（みかみべ）村」
premise: 都会での生活に疲れ、亡き祖父の遺品を整理するために御神辺村を訪れた青年・航平は、村の異様な静けさに違和感を抱く。村の古老たちが忌み嫌う「鏡の儀」の時期、彼は蔵の奥底で、村の境界を示す不可解な紋様が刻まれた『秘密の地図』を見つける。その地図は、地図上の道が現実の地形と一致せず、描かれた「空白の地」へ足を踏み入れた者だけが、鏡の向こう側の真実を覗き込むことができるというものだった。
themes:
- 土着信仰と血の継承
- 鏡像世界の侵食
- 因習による個の消失
rules:
- 村の者は、鏡に自分の姿を映してはならない。映った瞬間、魂の一部が鏡側に引き寄せられるため。
- 『秘密の地図』に記された境界線を越える際、必ず「名」を捨てなければ、向こう側の住人に同化してしまう。
- 祭りの最中、特定の禁忌を破った者は、村の土（泥濘）に溶けて「神の依代」となる。
plot_outline:
- '序盤: 航平は祖父の遺品の中から、奇妙な模様が描かれた古い地図と、黒ずんだ手鏡を見つける。村人たちは彼を歓迎しつつも、どこか「よそ者」としての冷ややかな視線を送り、鏡を使うことに対して強い忌避感を示す。'
- '中盤: 地図に従って村の境界を辿る航平は、地図にしか存在しない「鏡の社」を見つける。そこで彼は、村の繁栄が、定期的に鏡の向こう側の存在へ「生贄」を捧げることで保たれているという残酷な真実を知る。村人たちの言葉は次第に呪詛めいた方言へと変質し、航平を囲い込んでいく。'
- '終盤: 祭りの夜、鏡の儀が始まる。地図が指し示す「空白の地」は、村そのものが鏡像の世界と重なり合っている場所だった。航平は、祖父がなぜ死んだのか、そして自分がこの村の「器」として選ばれていたことを悟る。'
- '結末: 逃げようとする航平の足元から泥が這い上がり、彼を地面へと引きずり込む。翌朝、村はいつもと変わらぬ静寂に包まれており、鏡の中には、表情を失い、ただ静かに微笑む航平の姿だけが映っていた。'
style_notes: 湿った土の匂い、腐敗していく植物、沈殿するような空気感を重視する。会話には「～じゃ」「～のう」といった、聞き慣れないがどこか不穏な地方の訛りを混ぜ、登場人物の心理描写は直接的ではなく、周囲の景色の変化や音（虫の音、水音）を通じて、静かな狂気を表現する。
