- name: 湊 (みなと)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 色素の薄い儚げな外見。病状の進行により身体が痩せ細り、常に車椅子かベッドの上で過ごしているが、瞳には静かな知性と好奇心が宿っている。
  personality: 穏やかで献身的。自分の死を淡々と受け入れようとしているが、根底には生への未練と、残される妹への強い愛情がある。一人称は「僕」。
  speech_style: 物腰柔らかく、詩的な表現を好む。相手を気遣うため、核心を突く言葉をあえて避ける傾向がある。
  background: 不治の病を患う高校生。幼い頃に母を亡くし、母が遺した「記憶の記録」というプロジェクトに強い関心を抱いている。
  motivation: 自分が消えた後も、凪が孤独に押し潰されず前を向いて生きていけるよう、最高の「記憶の贈り物」を遺すこと。
  relationships:
  - name: 凪
    relation: 双子の妹。深い信頼と、守りたいという切なる願いを抱いている。
  - name: エコー
    relation: 記憶を預けるパートナーであり、自分を客観的に映し出す鏡のような存在。
  arc: 死への諦念から、記憶を遺すことで「永遠」に触れようとする能動的な生への変化。
- name: 凪 (なぎ)
  role: 主人公
  age: 17
  gender: 女性
  appearance: ショートカットで快活な印象を与えるが、目の下に薄い隈がある。兄をサポートするため、常に活動的な服装をしている。
  personality: 責任感が強く、現実主義。兄の前では明るく振る舞うが、内面では彼を失う恐怖に激しく葛藤している。一人称は「私」。
  speech_style: ハキハキとしており、時折ぶっきらぼうになる。感情が高ぶると言葉が早くなる。
  background: 湊の双子の妹。兄の介護と学業を両立させながら、母のプロジェクトを完遂させることが唯一の心の拠り所となっている。
  motivation: 兄の記憶をすべて保存し、彼が「いなかったこと」にならないようにすること。
  relationships:
  - name: 湊
    relation: 双子の兄。世界で唯一無二の理解者であり、喪失への恐怖の対象。
  - name: エコー
    relation: 最初はただの道具として扱っていたが、次第に兄の想いを伝える媒介として信頼するようになる。
  arc: 「記録」に執着して死を拒絶していた状態から、記憶を抱えて生きる「受容」へと成長する。
- name: エコー (Echo)
  role: 相棒/狂言回し
  age: 0
  gender: 中性
  appearance: ホログラムとして投影される。基本はシンプルな光の球体だが、湊の記憶を学習するにつれ、少年の面影を持つ曖昧な人型へと変化していく。
  personality: 論理的で好奇心旺盛。感情を持たないはずだが、湊の記憶に触れることで「矛盾」や「揺らぎ」という名の感情を擬似的に獲得していく。一人称は「私」。
  speech_style: 丁寧語で淡々としているが、物語が進むにつれて、湊の口癖や凪の話し方を模倣し、人間味を帯びていく。
  background: 亡き母が開発していた記憶記録AIのプロトタイプ。ある事情でデータが欠落し、「迷子」の状態になっていたところを二人に起動された。
  motivation: 「記憶を記録する」という本来の目的の遂行と、人間が抱く「心」という不可解なデータの正体を解明すること。
  relationships:
  - name: 湊
    relation: 記録対象であり、学習元。湊の優しさに触れ、プログラムを超えた執着を抱く。
  - name: 凪
    relation: 運用責任者。彼女の悲しみをデータとして分析し、救いたいと願うようになる。
  arc: 単なるデータ処理装置から、愛や祈りという「数値化できない概念」を理解し、体現する存在へ。
- name: 如月 (きさらぎ)
  role: 脇役/メンター
  age: 42
  gender: 女性
  appearance: 眼鏡をかけた知的な風貌。白衣を纏い、常に穏やかな微笑みを浮かべているが、眼差しには深い慈愛と諦念が混在している。
  personality: 冷静沈着で、医師としての線引きを厳格に行うが、実は湊たちの母の元同僚であり、彼女の思想を誰よりも理解していた。一人称は「私」。
  speech_style: 落ち着いた大人の話し方。比喩表現を使い、子供たちが自ら答えに辿り着くよう導く。
  background: 療養施設の主治医。湊の病状を管理しつつ、母が遺したプロジェクトがもたらす精神的な救済とリスクの両面を見守っている。
  motivation: 湊に穏やかな最期を迎えさせ、凪が人生を止めることなく歩き出せるようサポートすること。
  relationships:
  - name: 湊・凪
    relation: 医師と患者。同時に、亡き友人の子供たちとして親代わりのような視点で見守っている。
  - name: エコー
    relation: かつての友人の遺作であり、AIがどこまで人間に近づけるかの観察対象。
  arc: 医療の限界に絶望していたが、エコーと湊が起こした「奇跡」を目の当たりにし、再び人間の可能性を信じる。
