title: さよならの余白を、君と綴る
genre: 青春恋愛
tone: 静謐で切なく、微かな光が差し込むような温度感
pov: 三人称近接視点
tense: 過去形
setting: 現代、海沿いの寂れた療養施設がある町
premise: 不治の病を抱え、余命を数える高校生の双子の兄・湊と、妹の凪。二人は、亡き母が遺した「記憶を記録する」という未完のプロジェクトを、迷子の人工知能『エコー』と共に進めていた。感情を持たないはずのエコーが、湊の消えゆく記憶に触れるたび、不可解な「揺らぎ」を見せ始める。それは、喪失の淵で少年が最後に掴もうとした、言葉にならない願いだった。
themes:
- 生と死の境界線
- 記憶の継承
- 言葉にできない感情の共有
rules:
- 人工知能『エコー』は、対象者の脳波と連動して、視覚的なイメージを生成する機能を持つ
- 双子の間には、互いの痛みや感情を微かに共有できる共感覚的な繋がりがある
plot_outline:
- '序盤: 身体の自由を失いつつある湊は、妹の凪と共に、旧型のAI『エコー』を起動させる。エコーは持ち主を見失った迷子のプログラムであり、二人の日常に静かに溶け込んでいく。'
- '中盤: 凪は兄の病状が悪化していく恐怖を隠しながら、エコーを使って湊の「忘れたくない風景」をデジタルアーカイブ化していく。しかし、エコーが生成する映像は、時折、二人がまだ知らない「未来の予感」を含んでいた。'
- '終盤: 湊の意識が混濁し始める中、エコーは「死」という概念を学習し、湊の最期の記憶を保存しようと暴走に近い挙動を見せる。凪は、エコーが示すのは単なるデータではなく、湊が凪に残したかった「祈り」であることに気づく。'
- '結末: 湊は静かに息を引き取るが、エコーは凪の傍らで、湊が愛した海の色を映し出し続ける。凪は悲しみの中に、兄が遺したささやかな温もりを感じながら、一歩を踏み出す。'
style_notes: 過剰な形容詞を避け、風景描写を通じて登場人物の沈黙や孤独を描く。病や死という重い主題を扱いながらも、冷たくなりすぎないよう、光の粒子や風の匂いといった、五感に訴える柔らかな表現を心がける。感情を直接的な言葉で説明せず、読者がキャラクターの心の揺れを静かに察することができるような、余白のある筆致を用いる。
