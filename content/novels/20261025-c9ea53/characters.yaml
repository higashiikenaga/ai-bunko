- name: エリアス・ソーン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 青白く病的な美しさを持つ青年。砂漠の熱を拒絶するかのように、常に冷ややかな印象を与える。
  personality: 完璧主義で、変化や衰退を極端に忌み嫌う。美に対する執着が、次第に狂気へと変質していく。一人称は「僕」。
  speech_style: 静かで、どこか現実離れした、詩的で独白に近い話し方。
  background: 砂漠を彷徨う旅人。かつて愛する者を病で失い、その「美しさが損なわれていく過程」に耐えられなかった過去を持つ。
  motivation: 全ての美を永遠に固定し、時間の残酷な侵食から解放すること。
  relationships:
  - name: クララ・ヴァレリウス
    relation: 最愛の婚約者
  - name: 影の蒐集家
    relation: 観察対象
  arc: 孤独な旅人から、愛する者を標本にする狂気の蒐集家へと堕ち、最後は自らもまた無機質な宝石へと変貌する。
- name: クララ・ヴァレリウス
  role: 脇役（犠牲者）
  age: 24
  gender: 女性
  appearance: 生命力に満ち、光を反射するような輝かしい瞳を持つ美女。エリアスの視線を釘付けにする存在。
  personality: 慈愛に満ち、エリアスの不安定な精神を支えようとする。しかし、彼の異常性に気づいた後は恐怖に支配される。
  speech_style: 柔らかく、温かみのある、包容力に満ちた話し方。
  background: エリアスの婚約者。彼と共に新しい生活を求めて砂漠を越えようとしていた。
  motivation: エリアスと共に、平穏で美しい時間を過ごすこと。
  relationships:
  - name: エリアス・ソーン
    relation: 婚約者
  arc: エリアスの最初の「標本」となり、意識を持ったままガラスの中で永遠に絶叫し続ける苦痛の象徴となる。
- name: 影の蒐集家
  role: 敵役
  age: 0
  gender: 不明
  appearance: 幾何学的な影のような輪郭を持ち、瞳だけが多面体の宝石のように不気味に輝く、人知を超えた存在。
  personality: 感情が一切読み取れない、超越的かつ捕食的な観察者。一人称は「私」。
  speech_style: 言葉として発せられるのではなく、直接脳内に響くような、音のない声。
  background: 邸宅の真の主であり、時を止める懐中時計の持ち主。美を蒐集することだけを目的とする上位存在。
  motivation: 完璧な「美」の蒐集と、その完成を見届けること。
  relationships:
  - name: エリアス・ソーン
    relation: 次なる標本候補
  arc: 邸宅の影からエリアスの狂気を静かに観察し続け、彼が完璧なコレクションを完成させた瞬間に彼を回収する。
- name: ジュリアン
  role: 脇役
  age: 55
  gender: 男性
  appearance: 砂にまみれた、深く刻まれた皺を持つ老いた邸宅の執事。生気を感じさせない無表情な顔。
  personality: 冷徹で現実主義。邸宅の呪いと歴史を知り尽くしており、抗えない運命に対して深い諦念を持っている。
  speech_style: 事務的で、感情を徹底的に排した丁寧な敬語。
  background: 邸宅に仕え、かつて多くの「蒐集家」が現れては破滅していく様を見てきた者。
  motivation: 邸宅の秩序（蒐集のサイクル）を維持し、静寂を守ること。
  relationships:
  - name: エリアス・ソーン
    relation: 邸宅への案内人
  arc: エリアスに警告を与えるが、彼の狂気を止めることはできず、ただ静かにその破滅と新たな標本の誕生を見届ける。
