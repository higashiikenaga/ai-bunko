title: 玻璃の標本室
genre: ホラー
tone: 耽美、退廃的、静謐な狂気
pov: 一人称
tense: 過去形
setting: 白砂の砂漠に佇む、時間から切り離された古風な邸宅
premise: 美しさは、死に絶えて初めて完成する。時間を止める壊れた懐中時計を手にした男が、愛する人々を宝石へと変え、永遠の美を追求する。しかし、結晶化した肉体の中で、彼らの意識だけは絶叫し続けていた。
themes:
- 永遠への執着
- 美と残酷の不可分性
rules:
- 壊れた懐中時計で時間を止めた対象は、外見が透明な宝石へと変質する
- 意識は完全に覚醒したまま固定され、外部からの刺激には反応できないが、内部的な苦痛は永劫に持続する
- 砂漠の中のオアシスは、孤独な魂を標本室へと誘い込むための精神的な罠である
plot_outline:
- '序盤: 砂漠を彷徨う主人公が、幻想的なオアシスの奥にある邸宅と、時を止める壊れた懐中時計を拾う。'
- '中盤: 衰えや死を恐れるあまり、主人公は周囲の人間を次々と美しいガラスの彫像へと変え、標本室に蒐集し始める。'
- '終盤: 完璧なコレクションを完成させた頃、彫像たちから聞こえるはずのない、耳を劈くような悲鳴と亀裂の音が室内に満ち始める。'
- '結末: 自らもまた、上位の『蒐集家』に見初められ、絶望の中で最も美しい宝石へと変えられ、永遠の静寂に閉じ込められる。'
style_notes: 冷徹なまでの美しさを追求し、宝石や花、割れた硝子の比喩を散りばめる。流麗で装飾的な文体を使い、精神的な崩壊を美的に描き出すこと。
