- name: 清次（せいじ）
  role: 主人公
  age: 22
  gender: 男性
  appearance: 端正だがどこか影のある顔立ち。薬種問屋の徒弟らしく、常に薬草の香りが漂う質素な旅装束を纏っている。手には常に、薬草を調合するための小さな道具箱を持っている。
  personality: 冷静沈着で観察眼に優れるが、根は非常に情に厚い。理屈で解決できない事象に対しても、まずは相手の痛みを知ろうとする。一人称は「私」。
  speech_style: 丁寧で落ち着いた口調。相手を敬いつつも、核心を突くときは真っ直ぐな言葉を使う。
  background: 江戸の薬種問屋で修行中の青年。珍しい薬草を探す旅の途中で、霧に巻かれ朧月町へと迷い込む。
  motivation: この奇妙な街の呪いを解き、住人たちの苦しみを取り除き、自分自身も元の世界へ帰ること。
  relationships:
  - name: 栞
    relation: 謎めいた協力者であり、心を寄せる存在
  - name: 宴寿
    relation: 街の秩序を巡る対立相手
  arc: 単なる「観察者」であった青年が、真実と嘘の狭間で葛藤し、最終的には「慈悲ある沈黙」という、理屈を超えた救いを選択できる人間へと成長する。
- name: 栞（しおり）
  role: 相棒
  age: 20
  gender: 女性
  appearance: 月明かりに透けるような白い肌を持つ美女。この街の住人とは異なり、足元に「影」が存在しない。夜の闇に溶け込むような深い藍色の着物を着ている。
  personality: ミステリアスで掴みどころがない。嘘をつける唯一の存在として、周囲からは畏怖されているが、その内面は深い孤独に包まれている。一人称は「私」。
  speech_style: どこか浮世離れした、静かで艶のある話し方。時折、相手を試すような含みを持たせた言い方をする。
  background: 朧月町において「嘘をつくことができる唯一の存在」。彼女の正体は、街の成り立ちに深く関わる、形のない存在の断片である。
  motivation: 自分を縛り付ける「影のない体」と、この終わらない夜のサイクルから解放されること。
  relationships:
  - name: 清次
    relation: 初めて自分の「嘘」を否定せず受け入れてくれた理解者
  arc: 街の道具として「嘘」を使い続けてきた彼女が、清次との出会いを通じて、本当の意味での「自分自身の意志」を見出す。
- name: 宴寿（えんじゅ）
  role: 敵役
  age: 400
  gender: 男性
  appearance: 威厳に満ちた、古風で豪華な装束を纏う美しい男。瞳には月光が宿っているが、その眼差しは凍てつくように冷たい。人間離れした圧倒的な存在感を放つ。
  personality: 傲慢で支配的だが、その根底には底知れぬ悲哀と執着がある。愛する者を失った絶望から、世界を止めてしまいたいという願いを持つ。一人称は「我」。
  speech_style: 古風で威圧的な言葉遣い。感情が高ぶると、周囲の空気が震えるような重圧を伴う。
  background: 朧月町の主であり、街を統べる巨大な妖。かつて人間との愛に破れた未練が、この「嘘をつけない街」を作り上げた元凶である。
  motivation: 愛する者の面影を残すため、街と住人を永遠の宵闇の中に留め置くこと。
  relationships:
  - name: 清次
    relation: 街の平穏を乱す侵入者であり、己の未練を試す者
  arc: 執着によって時を止めていた支配者から、清次の選択によって、変化と終わりを受け入れる「哀しき神」へと変化する。
- name: お凛（おりん）
  role: 脇役
  age: 14
  gender: 女性
  appearance: 幼さの残る、小柄な少女。常に不安げに周囲を窺っており、瞳には涙が溜まっていることが多い。
  personality: 純粋無垢であるがゆえに、嘘をつけない呪いの残酷さに最も晒されている。自分の感情を隠すことができず、常に剥き出しの恐怖を抱えている。一人称は「わたし」。
  speech_style: 幼く、たどたどしい。感情が言葉に直結してしまうため、驚いたり怖がったりするとすぐ声に出てしまう。
  background: 街に住む人間（あるいは眷属）の少女。嘘をつけない呪いのせいで、日々の生活さえも苦痛に感じている。
  motivation: ただ、何も感じずに、静かに眠りたいという切実な願い。
  relationships:
  - name: 清次
    relation: 自分を助けてくれるかもしれないと期待する、唯一の光
  arc: 呪いに翻弄されるだけの被害者から、清次がもたらした「夜明けの兆し」によって、微かな希望を見出す存在となる。
