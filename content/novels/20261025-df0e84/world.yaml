title: 月下灯籠と嘘なき瞳
genre: 歴史・時代小説
tone: 幽玄、哀切、美しくも恐ろしい
pov: 三人称
tense: 過去形
setting: 江戸時代、夜が明けることのない異界の入り口となった宿場町・朧月町
premise: 陽の光が届かぬ、永遠に宵闇が続く「眠らない街」に、一人の若き薬種問屋が迷い込む。その街の住人は、心に抱いた偽りや欺瞞を即座に露呈させる「嘘をつけない呪い」をかけられていた。薬種屋の青年は、街に漂う妖（あやかし）たちの悲哀に触れ、呪いの正体がかつて愛に破れたある妖怪の未練であることを知る。彼は、止まった時を動かすため、月の光を模した灯籠を手に、真実の灯をともそうと試みる。
themes:
- 真実と欺瞞の境界
- 孤独な魂の救済
rules:
- 朧月町では、太陽が昇らず、常に月明かりと提灯の灯のみが頼りである。
- 「嘘をつけない呪い」により、悪意ある嘘をつこうとすると喉が焼け付くような痛みに襲われる。
- 妖怪は人間に紛れて暮らしているが、感情が高ぶるとその正体が影や姿として漏れ出す。
plot_outline:
- '序盤: 旅の途中で霧に巻かれ、陽の昇らぬ宿場町・朧月町へ辿り着いた薬種屋の清次。そこは、人々が互いに剥き出しの感情をぶつけ合う、奇妙な静寂に包まれた街であった。'
- '中盤: 清次は、街で唯一嘘をつくことができる「影のない女」に出会う。彼女の正体を探るうちに、街の住人たちが実は妖怪の成れの果てや、人間に捨てられた眷属であることを知る。街の繁栄は、人々の「嘘」を糧とする巨大な妖の犠牲の上に成り立っていた。'
- '終盤: 季節の節目である「朔月の祭」が迫る中、街を統べる主が、清次に究極の選択を迫る。真実を語れば街は消滅し、嘘を重ねれば街は永劫に眠り続ける。'
- '結末: 清次は、嘘ではなく「慈悲ある沈黙」を以て、妖怪の悲しみを受け止める。呪いは解けずとも、街には微かな夜明けの兆しが訪れ、妖怪と人間は互いの存在を認め合いながら、淡い月明かりの下で生きていく。'
style_notes: 和の情緒を重んじ、季節の移ろいや月、灯火の描写を繊細に描く。妖怪の描写においては、単なる怪物としてではなく、拭えぬ業や情愛を持つ存在として、その美しさと悲哀を強調すること。語彙は古風で雅なものを選び、読者の五感に訴えかけるような静謐な文体を維持する。
