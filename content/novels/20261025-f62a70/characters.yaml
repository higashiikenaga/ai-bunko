- name: アリスター・ソーン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 整った容姿だが、常に疲労の色が見える鋭い眼差し。仕立ての良いが実用的な褐色のコートを纏っている。
  personality: 現実主義で計算高い。上昇志向が強く、伝統よりも実利を優先する。一人称は「私」。
  speech_style: 丁寧だが、相手の弱点を突くような皮肉が混じる話し方。
  background: 没落した地方貴族の息子として生まれ、商才のみで新興商会の主となった。帝国の制度に絶望しており、経済的な力で社会を塗り替えたいと考えている。
  motivation: 秘密の地図を入手し、新航路を独占することで、血統に依存しない新たな権力基盤を築くこと。
  relationships:
  - name: ヴァレリウス・フォン・ケストラー
    relation: 利害の一致による不安定な協力関係
  - name: エララ・ヴァンス
    relation: 情報の取引相手であり、互いに信用しきれない共犯者
  arc: 個人の野心のために動いていたが、帝国の崩壊という不可避な潮流を目の当たりにし、次世代への責任という視点を持つようになる。
- name: ヴァレリウス・フォン・ケストラー
  role: 主人公/相棒
  age: 48
  gender: 男性
  appearance: がっしりとした体格。頬に古い戦傷がある。常に厳格な軍服を着用し、背筋が伸びている。
  personality: 質実剛健で忠義心が強い。正義感はあるが、組織の論理に縛られ苦悩している。一人称は「私」。
  speech_style: 簡潔で断定的な軍人口調。感情をあまり表に出さない。
  background: 帝国軍の最高司令官の一人。老皇帝に心から忠誠を誓っていたが、現在は野心的な摂政の下で、軍を政治利用されることに葛藤している。
  motivation: 帝国の秩序を維持し、内戦という最悪の事態を回避すること。同時に、皇帝が遺した真の意志を遂行すること。
  relationships:
  - name: アリスター・ソーン
    relation: 軽蔑しつつも、その行動力と情報網を頼りにしている
  - name: ジュリアン摂政
    relation: 主君として仕えているが、内心ではその独裁的傾向を危惧している
  arc: 盲目的な忠誠から脱却し、古い秩序を壊してでも守るべき「真の正義」を見出す。
- name: エララ・ヴァンス
  role: 主人公/密偵
  age: 24
  gender: 女性
  appearance: 地味な服装で目立たないが、動きやすさを重視した装い。状況に応じて髪型や服装を使い分ける。
  personality: 機敏で好奇心旺盛。冷徹に振る舞うが、根底には真実を求める情熱がある。一人称は「私」。
  speech_style: 相手に合わせて口調を変える。本音を話す時は少しぶっきらぼうになる。
  background: かつて宮廷の記録係を務めていたが、ある陰謀に巻き込まれて家門を没落させられた。現在は裏社会で情報を売る密偵として活動している。
  motivation: 隠蔽された「失われた手紙」を探し出し、自身の家門を陥れた真犯人を暴き、名誉を回復すること。
  relationships:
  - name: アリスター・ソーン
    relation: 互いの目的のために利用し合うビジネスパートナー
  - name: ヴァレリウス・フォン・ケストラー
    relation: かつての恩人であり、唯一信頼しうる大人
  arc: 個人的な復讐心から始まり、次第に帝国全体の闇と、歴史を正すという大きな使命に目覚めていく。
- name: ジュリアン摂政
  role: 敵役
  age: 52
  gender: 男性
  appearance: 贅沢な刺繍の施された衣装を身に纏う。白皙の肌と、冷酷さを湛えた細い目が特徴。
  personality: 極めて知略に長け、傲慢。人間をチェスの駒のように扱う。一人称は「私」または「我」。
  speech_style: 優雅で流麗だが、言葉の端々に威圧感と拒絶感が滲む。
  background: 皇帝の遠縁にあたり、権力の中枢で長年機会を伺っていた。皇帝の急逝に乗じて実権を握り、強権政治を展開している。
  motivation: 「失われた手紙」を完全に抹消し、自身の正統性を偽装することで、オーロボス帝国の絶対的な支配者となること。
  relationships:
  - name: ヴァレリウス・フォン・ケストラー
    relation: 便利な軍事的な道具として利用している
  - name: アリスター・ソーン
    relation: 排除すべき新時代の象徴であり、同時に利用価値のある駒
  arc: 完璧な支配を企てるが、自分が軽視していた「個人の意志」と「時代の変化」によって、積み上げた権力が瓦解していく。
