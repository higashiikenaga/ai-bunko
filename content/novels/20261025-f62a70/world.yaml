title: 鉄の潮流と、琥珀の布告
genre: 群像劇
tone: 重厚かつ壮大な政治劇
pov: 三人称多視点
tense: 過去形
setting: 産業革命の胎動期にある、衰退しつつある巨大帝国オーロボスと周辺諸国
premise: 老皇帝の急逝により、帝国の継承権を巡る空白が生じる。摂政による強権政治が敷かれる中、隠蔽された「失われた手紙」と、未踏の富を約束する「秘密の地図」が、世界の均衡を揺るがす装置として動き出す。野心を抱く商人、忠義に揺れる将軍、そして真実を追う密偵たちが、権力の奔流の中で複雑に絡み合っていく。歴史の断片が、一つの巨大な変革へと収束していく様を描く。
themes:
- 権威の正統性と虚構
- 技術革新と伝統的秩序の衝突
rules:
- 血統の証明なき限り、摂政会議の布告は絶対的な法として機能する
- 情報の流布は「密使」と呼ばれる独自のネットワークを通じて管理されている
- 蒸気機関の導入は、既存の騎士階級の軍事的特権を直接的に脅かす存在である
plot_outline:
- '序盤: 皇帝崩御。混乱に乗じて、地図と手紙の存在が密かに囁かれ始め、各勢力の接触が始まる。'
- '中盤: 勢力争いの激化。商会による新航路の独占工作と、貴族による血統偽装の陰謀が、海戦と宮廷闘争の両面で交錯する。'
- '終盤: 帝都での大評議会。手紙が暴く真実と、地図が指し示す未知の地平が、帝国の終焉と再生を同時に引き起こす。'
- '結末: 旧来の秩序は崩壊。古い帝国は消え去り、新たな力学に基づく混沌とした新時代が幕を開ける。'
style_notes: アルベルト・藤としての矜持。各章の冒頭には必ず「〇〇年、〇〇の嵐が吹き荒れた」といった年代記風の一文を置き、歴史の重みを感じさせること。文体は、個人の感情よりも、それが歴史や政治という巨大な機構の中でどのように作用するかを記述すること。三人称多視点を用い、対立する勢力の論理を等しく重厚に描き出すことで、群像劇としての密度を極限まで高めること。
