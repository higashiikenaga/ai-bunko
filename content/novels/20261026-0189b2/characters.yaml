- name: エリアス・ソーン
  role: 主人公
  age: 38
  gender: 男性
  appearance: 使い古された灰色のロングコートを纏い、度数の強い眼鏡をかけた痩身の男。常に古書のインクと埃の匂いがする。
  personality: 懐疑的で慎重。知識への飽くなき好奇心を持つが、表向きは冷淡な個人主義者。一人称は「私」。
  speech_style: 丁寧だが突き放したような口調。比喩表現を多用する。
  background: 元帝国歴史アーカイブの主任司書だったが、ある禁忌の記述に触れたことで追放され、辺境のヴォイド・セクターで古本屋兼情報屋を営んでいる。
  motivation: 断片的な記録から「世界の真の姿」を再構築し、歴史の空白を埋めること。
  relationships:
  - name: ヴァレリウス・ケイル
    relation: 奇妙な信頼関係を築く顧客であり協力者
  - name: ライラ・ヴァンス
    relation: 互いの能力を認めつつも、決して信用し合えない宿敵
  arc: 傍観者として歴史を眺めていたが、自らが歴史を動かす当事者となることを受け入れ、真実を公表する覚悟を決める。
- name: ヴァレリウス・ケイル
  role: 主人公格/帝国側視点
  age: 31
  gender: 男性
  appearance: 銀色の短髪に鋭い眼光。帝国軍の純白の士官服を隙なく着こなしている。右頬に古い戦傷がある。
  personality: 誠実で規律正しい。軍人としての忠誠心と、個人の倫理観の間で激しく葛藤する。一人称は「俺」。
  speech_style: 簡潔で断定的な軍隊調。感情が高ぶると口調が荒くなる。
  background: 帝国第一艦隊の若き精鋭士官。エリート街道を歩んでいたが、エリアスの店で手に入れた紙の記録により、帝国の建国神話に疑念を抱く。
  motivation: 国家への忠誠ではなく、人間としての正義に基づいた「正しい秩序」の確立。
  relationships:
  - name: エリアス・ソーン
    relation: 導き手であり、価値観を揺さぶる危険な男
  - name: セラフィナ・ヴォス
    relation: 絶対的な上官であったが、次第に軽蔑し対立する相手
  arc: 盲目的な忠誠を捨て、組織を裏切ってでも守るべき「真実」のために戦う反逆者へと変貌する。
- name: ライラ・ヴァンス
  role: 敵役/企業側視点
  age: 27
  gender: 女性
  appearance: 左眼に高度な情報処理用サイバネティクスを組み込んだ、冷徹な美貌の女性。身体のラインに沿った黒いタクティカルスーツを着用。
  personality: 効率至上主義で冷酷。感情をノイズとして切り捨てるが、内心では企業の部品として消費される自分に絶望している。一人称は「私」。
  speech_style: 論理的で淡々とした話し方。相手の弱点を突く皮肉屋。
  background: 連合企業シンギュラリティの特務工作員。幼少期から企業の実験体として育てられ、最高効率の暗殺・情報奪取術を叩き込まれた。
  motivation: 氷の城のデータを独占し、企業内での地位を確立して自由（脱却）を得ること。
  relationships:
  - name: エリアス・ソーン
    relation: 排除対象だが、知的な駆け引きを楽しむゲーム相手
  - name: ヴァレリウス・ケイル
    relation: 非効率な正義感を 가진、排除すべき障害
  arc: 冷徹な工作員として動いていたが、人類の起源を知ることで、自身のアイデンティティを「企業の道具」から「一人の人間」へと取り戻そうとする。
- name: セラフィナ・ヴォス
  role: 黒幕/政治的対立軸
  age: 52
  gender: 女性
  appearance: 威厳のある恰好で、豪華な勲章を付けた軍服を纏う。深く刻まれた眉間の皺が、彼女の執念と苦悩を物語っている。
  personality: 冷徹な戦略家。大義のためには少数の犠牲は厭わないが、その根底には種としての絶滅への強い恐怖がある。一人称は「私」。
  speech_style: 威圧的で格式高い。相手をコントロールするための静かな口調。
  background: 帝国第一艦隊の司令官。氷の城の存在を密かに察知しており、それを利用して企業シンギュラリティを排除し、帝国の絶対覇権を確立しようと画策している。
  motivation: 混沌とした銀河に、強権による永続的な平和と秩序をもたらすこと。
  relationships:
  - name: ヴァレリウス・ケイル
    relation: 期待していた後継者であり、裏切り者
  - name: ライラ・ヴァンス
    relation: 利用価値のある駒であり、不快な侵入者
  arc: 盤面を完璧にコントロールしていた自負があったが、想定外の「真実」の解放により、自らが築いた秩序が崩壊していく絶望を味わう。
