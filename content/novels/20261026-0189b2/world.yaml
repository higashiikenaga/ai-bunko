title: 恒星間断層の黙示録
genre: 群像劇
tone: 重厚、壮大、政治的緊迫感
pov: 三人称（艦艇、陣営、重要人物による視点の切り替え）
tense: 過去形
setting: 銀河辺境の「ヴォイド・セクター」。巨大な氷の小惑星帯と、情報の集積地である廃墟宇宙ステーション群。
premise: 星間帝国アステリズムと、超技術を独占する連合企業シンギュラリティの均衡が、辺境の「氷の城」と呼ばれる巨大彗星要塞の発見によって崩れ始める。中立地帯の古本屋を営む情報屋が、古代の物理記録を読み解き、歴史を覆す機密を暴いたことで、銀河は未曾有の艦隊戦へと突き進む。複数の艦隊、政治家、そして一人の情報屋の視点が交錯し、宇宙の真実が剥き出しになっていく。
themes:
- 情報の独占と真実の重み
- 伝統的秩序と技術的進歩の衝突
- 広大な虚無における個の生存
rules:
- 超光速通信は中継局を介さなければ不可能であり、通信の遅延が戦術に決定的な影響を与える
- 艦隊戦は相対速度、センサーの探知範囲、および質量弾の弾道に基づく物理的な描写に準拠する
- 「氷の城」は超低温環境下でしかデータが安定しない、古代の超大規模アーカイブである
plot_outline:
- '序盤: 辺境の古本屋で、帝国側の士官が偶然手に入れた古い紙媒体の記録から、銀河の境界線に関する禁忌の事実が判明。同時に、企業側の工作員がその情報を追ってステーションに侵入する。'
- '中盤: 氷の城を巡り、帝国第一艦隊と企業私設艦隊による大規模な遭遇戦が勃発。星系地図上の座標を奪い合う複雑な艦隊展開と、司令部間での政治的な駆け引きが描かれる。'
- '終盤: 氷の城の深部で、人類の起源に関わるデータが解放され、全艦隊の通信網をジャックする。両陣営は情報を制御するか、あるいは全滅を賭けて要塞を占拠するかの選択を迫られる。'
- '結末: 戦争は終結せず、新たな勢力図が形成される。生き残った者たちは、凍てつく宇宙の中で、書き換えられた歴史と共に歩み始める。'
style_notes: 艦隊の通信プロトコル（識別符号、確認応答、階級に基づいた命令系統）を正確に記述すること。星系の座標、航路、艦艇の配置を地図を意識して描写し、空間的なスケールを維持する。感情的な修辞を抑え、状況の変化とキャラクターの行動、および戦術的なやり取りによって緊迫感を構築する。
