- name: 瀬戸 遥
  role: 主人公
  age: 28
  gender: 女性
  appearance: 清潔感はあるが少し疲れの見える瞳。動きやすさを重視したアウトドアウェアを好む。眼鏡をかけている。
  personality: 真面目で内向的。物事を論理的に捉えようとするが、感受性は豊か。一人称は「私」。
  speech_style: 丁寧で落ち着いた話し方。感情が昂ると少し言葉が詰まる癖がある。
  background: 都市部の植物研究所に勤務していたが、過剰な競争と事務作業に消耗し、休職状態。恩師・志賀の遺言に従い、山荘での生活を始める。
  motivation: 恩師のノートに記された植物の記録を完遂し、自分自身の居場所を見つけること。
  relationships:
  - name: 志賀 誠一郎
    relation: 恩師・故人
  - name: 蔵本 源蔵
    relation: 近隣の世話役
  - name: 小鳥遊 凪
    relation: 現地の協力者・友人
  arc: 孤独な「記録者」として森に入るが、人々との交流を通じて、森の一部として生きる喜びを知る。
- name: 志賀 誠一郎
  role: 導き手（回想・遺言）
  age: 75
  gender: 男性
  appearance: 深く刻まれた皺と、日焼けした肌。常に使い込まれた植物観察ノートを携えていた。
  personality: 厳格だが自然に対して深い慈しみを持つ。学問的な正確さと、生命への畏敬を重んじる。一人称は「私」。
  speech_style: 穏やかだが、植物の観察に関しては一切の妥協を許さない、凛とした口調。
  background: この地で長年植物学の研究を続けてきた学者。森の微細な変化を記録し続けることが、次世代への唯一の贈り物だと信じていた。
  motivation: 森の生態系の変化を正確に記録し、次世代へと繋ぐこと（遺言として遥に託す）。
  relationships:
  - name: 瀬戸 遥
    relation: 教え子
  arc: 物語を通じて、彼の遺したノートの言葉が、遥の孤独を癒やし、真意を伝えるプロセスとして描かれる。
- name: 蔵本 源蔵
  role: 脇役
  age: 72
  gender: 男性
  appearance: がっしりとした体格。使い古された作業着と、手入れの行き届いた農具が似合う。
  personality: 無口でぶっきらぼう。伝統を重んじる頑固者だが、根は非常に情に厚い。一人称は「わし」。
  speech_style: 訛りのある、短く力強い話し方。言葉数は少ないが、一言一言に重みがある。
  background: 村の古老であり、祭事の管理者。代々、山の神への信仰と共にある集落の暮らしを守ってきた。
  motivation: 村の伝統と、自然との調和を保ち続けること。
  relationships:
  - name: 瀬戸 遥
    relation: よそ者として見守る対象
  arc: 都会から来た「よそ者」である遥を、次第に村の営みを共にする一員として受け入れていく。
- name: 小鳥遊 凪
  role: 相棒
  age: 26
  gender: 女性
  appearance: ベリーショートの髪。明るい色のレインウェアや、植物の実をあしらったアクセサリーを身につけている。
  personality: 快活で好奇心旺盛。植物を「研究対象」としてだけでなく「生活の糧」として捉える。一人称は「私」。
  speech_style: ハツラツとしていて、少し早口。相手の懐に飛び込むような親しみやすい話し方。
  background: 村の薬草園を管理し、地元の特産品を作っている。植物の知識は豊富だが、学術的な記録よりも実用性を重視する。
  motivation: 植物の恵みを村の暮らしに活かし、豊かな日常を守ること。
  relationships:
  - name: 瀬戸 遥
    relation: 観察のパートナー・友人
  arc: 遥の緻密な観察眼に触れることで、植物の「記録」が持つ、未来を守るための価値を再認識する。
