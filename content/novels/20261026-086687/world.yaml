title: 翠嶺の遺言、あるいは落葉の譜
genre: 日常ほのぼの
tone: 静謐で叙情的、自然への深い畏敬
pov: 一人称（私）
tense: 過去形
setting: 現代、標高の高い山間に位置する、古い信仰と植物の多様性が残る集落
premise: 恩師から譲り受けたのは、一冊の古びた植物観察ノートと、深い森に囲まれた小さな山荘だった。そこには、季節の移ろいに合わせて行われる、静かな祭りの夜があった。恩師が遺した「遺言」とは、金銭的な財産ではなく、森の微細な変化を正確に読み解き、次世代へ繋ぐための観察の継続であった。私はその記録を辿りながら、森と人間が共生する穏やかな日常に身を置いていく。
themes:
- 自然との対話
- 世代を超えて継承される記憶
- 生命の循環
rules:
- 動植物の名称や生態を学術的に正確に描写すること
- 季節の移ろいや天候の変化を、物語の情緒的基盤として機能させること
plot_outline:
- '序盤: 恩師の死後、遺された膨大な観察記録と共に、山荘での孤独だが豊かな生活が始まる。'
- '中盤: ノートに記された特定の植物（ミヤマリンドウやアオノツガザクラなど）の開花を追いながら、村の古老や人々との穏やかな交流が描かれる。'
- '終盤: 村の収穫祭の夜、祭りの篝火の中で、恩師が遺した真の意図と、森が持つ生命の力強さに触れる。'
- '結末: 季節は巡り、私は恩師の足跡を辿りながら、自分自身の観察記録を書き記し始める。'
style_notes: 森閑イオリとしての文体を徹底する。植物や動物（カモシカやキツツキなど）の描写には正確な名称を用いる。感情を直接的な言葉で説明せず、風の音、土の匂い、光の加減といった自然現象の微細な描写を通じて、読者に情景と心情を伝えること。
