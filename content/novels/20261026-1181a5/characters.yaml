- name: 八五郎
  role: 主人公
  age: 24
  gender: 男性
  appearance: 日焼けした肌と快活な目元。動きやすい質素な着物姿。江戸っ子らしい、がっしりとした体格。
  personality: お人好しで困った人を放っておけない世話焼き。一人称は「俺」。
  speech_style: 威勢の良い、べらんめえ調。感情が豊かで声が大きい。
  background: 日本橋の長屋に住み、小仕事で生計を立てる青年。昔から長屋の連中からは「お節介焼き」と呼ばれている。
  motivation: 拾った手紙の主を助け、失われた想いを取り戻させること。
  relationships:
  - name: 清次
    relation: 長屋の住人であり、助けたい対象
  - name: お菊
    relation: 協力者であり、手紙の宛先
  arc: 単なる好奇心から始まった騒動を通じて、人の心の痛みや記憶の尊さを学び、長屋の絆を守るリーダーシップを身につけていく。
- name: 清次
  role: 重要人物（手紙の主）
  age: 32
  gender: 男性
  appearance: どこか虚ろな瞳、生気を欠いた顔立ち。整った顔立ちだが、影が薄く消え入りそうな印象。
  personality: 静かで掴みどころがなく、感情の起伏が乏しい。一人称は「私」。
  speech_style: 淡々とした、抑揚の少ない話し方。言葉数が極端に少ない。
  background: かつては腕の良い職人だったが、耐えがたい失恋の痛みから「忘れもの市」で記憶を売り払い、空虚な日々を送っている。
  motivation: 自分の中に欠落している「何か」を、無意識のうちに求めている。
  relationships:
  - name: 八五郎
    relation: 世話を焼かれる相手
  - name: お菊
    relation: かつての恋人
  arc: 記憶を失った空っぽの存在から、痛みも含めた「人間らしい感情」を再び受け入れる強さを取り戻す。
- name: お菊
  role: 脇役（手紙の宛先）
  age: 27
  gender: 女性
  appearance: 凛とした佇まいの茶屋の看板娘。明るく艶やかな着こなし。意志の強さを感じさせる瞳。
  personality: 芯が強く、情に厚い。明るい振る舞いの裏に、去った恋人を想う寂しさを秘めている。一人称は「私」。
  speech_style: はっきりとした、活気のある丁寧な話し方。
  background: 日本橋で賑わう茶屋で働く女性。かつて清次と深い絆で結ばれていたが、彼が突然心を通わせなくなったことに戸惑い続けている。
  motivation: 清次の変貌の理由を知り、止まっていた自分の時間を動かすこと。
  relationships:
  - name: 清次
    relation: かつての恋人
  - name: 八五郎
    relation: 騒動のきっかけを作った人物
  arc: 過去の未練に囚われた状態から、現在の清次と向き合い、新たな絆を築く前向きな姿勢へと変化する。
- name: 市松
  role: 謎の人物（忘れもの市の商人）
  age: 45
  gender: 男性
  appearance: 黒い羽織を纏い、影のある、底知れない眼差しを持つ。常に薄暗い路地裏に佇んでいる。
  personality: 冷笑的で掴みどころがないが、どこか達観したような慈悲深さも感じさせる。一人称は「わし」。
  speech_style: 謎めいた、含みのある丁寧な言葉遣い。相手を煙に巻くような話し方。
  background: 「忘れもの市」を仕切る怪しげな商人。人の記憶を金に換える仕組みを管理している。
  motivation: 人間が記憶を捨てた時に、どのような感情の行方を見せるのかを観察すること。
  relationships:
  - name: 八五郎
    relation: 奇妙な因縁を持つ、興味深い観察対象
  arc: 単なる傍観者として物語を見守るが、八五郎たちの騒動を通じて、記憶の価値を再確認する。
