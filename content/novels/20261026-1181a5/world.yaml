title: 忘却の市と人情の灯
genre: 歴史・時代小説
tone: べらんめえ口調の軽快さと、江戸の粋な人情味あふれる雰囲気
pov: 三人称
tense: 過去形
setting: 江戸時代後期、日本橋近辺の賑やかな長屋と、路地裏にひっそりと現れる不思議な「忘れもの市」
premise: 辛い記憶を金に換えて売るという怪しげな「忘れもの市」が江戸の片隅に存在する。お人好しの長屋住まい・八五郎が、ある日道端で一通の「宛先不明の手紙」を拾う。しかし、その手紙を書いた主は記憶を売ってしまったため、誰に何を伝えたかったのかを完全に忘れていた。失われた言葉と記憶を取り戻すため、長屋の連中が騒動に巻き込まれながら奔走する人情物語。
themes:
- 記憶と絆
- 忘却と許し
rules:
- 「忘れもの市」は特定の条件を満たした者にしか見えず、記憶を売るとその出来事に関する感情まで消える
- 一度売った記憶は、強い後悔や他者からの切実な呼びかけがあれば、一時的に取り戻すことができる
plot_outline:
- '序盤: 賑やかな長屋の日常と、八五郎が偶然「忘れもの市」に迷い込み、主を失った手紙を拾う。秋の夜長に栗ご飯を囲む長屋の団欒の中で、手紙の謎についてもめ合う。'
- '中盤: 手紙の主が、かつての恋人に宛てた切ない想いを売ってしまった男であることを突き止める。記憶を失い空虚に生きる男と、彼を案じる周囲の人々の対立と葛藤が描かれる。'
- '終盤: 冬の足音が聞こえ始めた頃、手紙の宛先である女性を探し出し、無理やり記憶を思い出させるのではなく、今の気持ちで伝え直させるための大騒動を長屋の連中が仕掛ける。'
- '結末: 記憶は完全には戻らなかったが、手紙を通じて新たな絆が生まれ、長屋の住人全員で湯豆腐を囲み、笑いと涙の中で心を温め合う。'
style_notes: 「てやんでえ」「べらぼうめ」などの江戸っ子口調を多用し、会話のテンポを重視する。季節の食材（栗ご飯、冬の鍋など）を具体的に描写し、五感に訴える。最後は理屈ではなく、情に流される心地よさを描き出すこと。
