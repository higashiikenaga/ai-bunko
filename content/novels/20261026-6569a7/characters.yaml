- name: 如月 静真（きさらぎ しずま）
  role: 主人公
  age: 27
  gender: 男性
  appearance: 青白い肌に、常に眠そうな深い隈がある。サイズの合わない古い外套を羽織っている。
  personality: 内向的で執着心が強い。喪失感に苛まれており、過去にすがりつく傾向がある。一人称は「僕」。
  speech_style: 控えめで、語尾を濁らせることが多い。独り言が多い。
  background: 幼少期にこの街を離れたが、ある種の強迫観念に突き動かされ、数年ぶりに帰郷した。自分が何を失ったのかを正確に思い出せない。
  motivation: 市場に流出した「自分自身の記憶」を買い戻し、欠落した自己を完成させること。
  relationships:
  - name: 虚（うつろ）
    relation: 記憶の取引相手であり、街の案内人
  - name: 柳 澪（やなぎ みお）
    relation: 記憶の中だけに存在する幼馴染
  arc: 記憶を取り戻そうと足掻くが、最終的に「帰郷した」という意識さえも偽造された記憶であったことを悟り、空虚に飲み込まれる。
- name: 虚（うつろ）
  role: 敵役/案内人
  age: 不詳
  gender: 不明（中性的）
  appearance: 霧に溶け込むような灰色い衣服を纏い、顔の上半分を白い布で覆っている。常に鈍い光を放つ灯籠を持っている。
  personality: 慇懃無礼で計算高い。人間の絶望や執着を最高の調味料として楽しむ快楽主義者。一人称は「私」。
  speech_style: 丁寧語だが、相手を突き放すような冷徹さと、誘惑するような甘さが同居している。
  background: 記憶を売る市場の管理人。街に溜まる「泥濘」の意志を代行し、新たな記憶（餌）を市場に誘い込む役割を担っている。
  motivation: 静真に最高に甘美な夢を見せた後、彼が持つ最後の核心的な記憶を喰らわせること。
  relationships:
  - name: 如月 静真
    relation: 獲物であり、観察対象
  arc: 静真を精神的に追い詰め、彼が自らすべてを投げ出す瞬間を演出して完遂させる。
- name: 柳 澪（やなぎ みお）
  role: 脇役/警告者
  age: 27（外見上）
  gender: 女性
  appearance: 透き通るほど白い肌。瞳にハイライトがなく、足元から常に泥のような黒い液体が滴っている。
  personality: 儚げで、時折意識が混濁している。静真に対してだけは強い親愛の情を示す。一人称は「私」。
  speech_style: 囁くような小さな声。断片的な単語を繋ぎ合わせて話す。
  background: かつて静真の幼馴染だったが、市場に記憶を売りすぎたため、人間としての形を維持できなくなり、「湿りびと」へと成り果てた。
  motivation: 静真にだけは自分と同じ道を辿ってほしくないという、消えかかった本能的な願い。
  relationships:
  - name: 如月 静真
    relation: かつての親友であり、唯一の執着対象
  arc: 静真に警告を与えようとするが、彼が記憶を求めるほどに彼女の存在は希薄になり、最後は泥濘へと完全に溶けて消える。
- name: 源蔵（げんぞう）
  role: 脇役/情報提供者
  age: 72
  gender: 男性
  appearance: 深く刻まれた皺と、湿気で常に湿った古びた作務衣を着ている。片目が白濁している。
  personality: 皮肉屋で現実主義的。街の理（ことわり）を熟知しており、諦念に満ちている。一人称は「わし」。
  speech_style: ぶっきらぼうな山里の老人風。突き放すような言い方をする。
  background: この街で唯一、記憶を売らずに生き残っている老人。市場の成り立ちと、記憶を喰らう「影」の正体を知っている。
  motivation: 街の均衡を保つため、余計な詮索をせずに静かに朽ち果てること。
  relationships:
  - name: 如月 静真
    relation: 危なっかしい若者として、半分呆れながら助言を与える
  arc: 静真に街の残酷な真実を告げ、逃げることを勧めるが、それが不可能であることを同時に突きつける。
