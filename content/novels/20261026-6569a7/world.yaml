title: 湿りびとの市、昏き灯の街
genre: ホラー
tone: 湿り気を帯びた、静謐で不穏な和風ホラー
pov: 三人称
tense: 過去形
setting: 霧が深く、夜が明けることのない山間の「眠らない街」
premise: 霧が常に立ち込める、夜が明けることのない街。そこには、苦しい記憶を対価に、甘美な夢を買い求める「記憶を売る市場」が存在する。故郷へ戻った主人公は、市場に漂う腐った花の匂いと、粘りつくような足音に、かつて失ったはずの「ある記憶」の欠片を見出す。しかし、記憶を売ることは、その人間の一部を、底の見えない泥濘へと差し出すことと同義であった。
themes:
- 記憶と自己の同一性
- 忘却の代償
rules:
- 市場での取引は、一度成立すると取り消せない
- 記憶を売った者は、その記憶に関わる感情や感覚を一切失う
- 街を覆う霧は、住人の記憶が霧散した残滓である
plot_outline:
- '序盤: 霧の深い山里、常に灯火が消えない「眠らない街」に主人公が帰郷する。街には独特の湿り気があり、夜な夜な開かれる市場では、人々が記憶を売り買いしている。'
- '中盤: 主人公は市場で、自分が捨てたはずの幼い頃の記憶が、得体の知れない「何か」の餌として扱われているのを目撃する。周囲の住人たちは、どこか虚ろな瞳で、湿った泥のような足音を立てて街を徘徊している。'
- '終盤: 記憶を買い戻そうと市場の深部へ足を踏み入れる主人公。しかし、そこには売られた記憶を喰らい、形を変えて蠢く「影」のような、名状しがたい気配が渦巻いていた。'
- '結末: 主人公は、自分が今抱いている「帰郷した」という実感さえも、誰かに売った後の、空っぽな残響に過ぎなかったことに気づく。街にはただ、重苦しい雨の音だけが響き続ける。'
style_notes: 視覚情報よりも、湿った土の匂い、錆びた鉄の味、衣擦れの音、遠くで鳴る鈍い水音などの感覚描写を優先する。怪異そのものの姿は描かず、ただ「そこにある気配」や「肌に触れる温度の変化」として表現すること。会話には、独特の間と、静かな方言を混ぜ、不気味な平穏さを演出する。
