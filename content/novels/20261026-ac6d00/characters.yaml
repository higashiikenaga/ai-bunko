- name: カイ・エルドレッド
  role: 主人公
  age: 27
  gender: 男性
  appearance: 痩身で色白。常に気象観測用のゴーグルを首にかけ、機能性の高い技師服を纏っている。
  personality: 慎重で分析的。知的好奇心が強く、物事を数式で捉える傾向がある。一人称は「僕」。
  speech_style: 論理的で淡々としているが、熱くなると思わず専門用語を並べて早口になる。
  background: 惑星アエロの気象管理局に所属する若き気象技師。理論上の効率よりも現場の観測データを信頼している。
  motivation: 崩壊しつつある惑星の熱平衡を回復させ、生命圏を維持すること。
  relationships:
  - name: ライラ・ヴェイル
    relation: 直感と理論で補完し合う信頼すべきパートナー
  - name: ソロモン・グレイ
    relation: 保守的な思想を持つ上司であり、対立関係
  arc: システムの「維持」という保守的な思考から、物理法則に基づいた「再構築」という創造的な決断へと成長する。
- name: ライラ・ヴェイル
  role: 相棒
  age: 24
  gender: 女性
  appearance: 日焼けした肌に短く切り揃えた銀髪。飛行服をラフに着崩しており、身軽な装備を好む。
  personality: 直感的で行動的。困難な状況でも冗談を忘れない楽観主義者。一人称は「私」。
  speech_style: ぶっきらぼうだが情熱的。複雑な現象を身体感覚に基づいた比喩で表現する。
  background: 「渡り鳥」の飛行軌道を熟知する天才的なナビゲーター。型に嵌まることを嫌い、独学で気流の読み方を習得した。
  motivation: 誰よりも高く、そして自由に空を飛び続けたい。故郷の空を失いたくない。
  relationships:
  - name: カイ・エルドレッド
    relation: 理屈っぽい彼を面白がっており、深い信頼を寄せている
  arc: 単なる操縦士から、惑星規模の熱対流を導く「指揮者」としての自覚を持つようになる。
- name: ソロモン・グレイ
  role: 敵役
  age: 62
  gender: 男性
  appearance: 厳格な仕立ての礼装を纏い、冷徹な眼差しを持つ老人。常に完璧な身だしなみを維持している。
  personality: 権威主義的で完璧主義。システムこそが正義であり、個人の逸脱を許さない。一人称は「私」。
  speech_style: 威圧的で断定的な言い回しを好み、相手を論理的に追い詰める話し方をする。
  background: 大気蒸気エンジンの総責任者。先代から受け継いだ管理体制を絶対視し、効率低下を隠蔽しようとする。
  motivation: 既存の秩序と管理体制を維持し、自身の権威とシステムの完全性を証明すること。
  relationships:
  - name: カイ・エルドレッド
    relation: 能力は認めているが、体制を脅かす危険な異端児として警戒している
  arc: 絶対的な管理の限界を突きつけられ、崩壊の恐怖に直面した末に、不確実な未来へ権限を譲る。
- name: ユニット-7（セブン）
  role: 脇役
  age: 0
  gender: 無性別
  appearance: 旧世代の「渡り鳥」自律飛行体。表面は剥げかかっており、一部に不自然な回路の露出がある。
  personality: 淡々とした機械的思考だが、時折詩的な表現を用いる。一人称は「本機」。
  speech_style: 断続的な音声出力。重要なキーワードのみを抽出して伝える断片的な話し方。
  background: 初期の熱交換モデルであり、現行システムからは「廃棄済み」とされているが、独自の意識を芽生えさせていた。
  motivation: エントロピーの増大という抗えない運命の中で、意味のある循環を完結させること。
  relationships:
  - name: カイ・エルドレッド
    relation: 自身の内部データを解析し、目的を共有した共鳴者
  arc: 個としての生存を捨て、群れを導くための「核」となって消滅することで、新たな平衡に寄与する。
