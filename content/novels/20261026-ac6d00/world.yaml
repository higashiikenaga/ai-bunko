title: 蒸気圏の渡り、あるいはエントロピーの巡礼
genre: SF
tone: 緻密で壮大な熱力学的叙情
pov: 三人称
tense: 過去形
setting: 二重連星系に属する、極端な熱対流が支配する惑星「アエロ」
premise: 惑星アエロの気候は、水を媒体とした巨大な熱交換システムによって制御されている。熱を運搬する自律飛行体「渡り鳥」が、蒸気噴出孔から立ち上がる膨大な熱エネルギーを回収し、極寒の夜側へと運搬することで、惑星の生命圏は維持されてきた。しかし、システムの熱効率の低下により、渡り鳥の群れが軌道を外れ始め、惑星規模の熱力学的崩壊が始まろうとしていた。
themes:
- エントロピーと秩序の相克
- 生命維持のための人工的循環
rules:
- 熱力学第二法則に従い、エネルギーの循環には必ず損失が生じる
- 渡り鳥は磁気流体力学に基づいた飛行経路に従う
- 蒸気機関の動力源は惑星深部の地熱による水の相変化である
plot_outline:
- '序盤: 気象技師のカイは、渡り鳥の帰還率低下が引き起こす異常な熱嵐に直面し、惑星規模の気候制御システムの不全を察知する。'
- '中盤: カイは、熱循環の核となる巨大な「大気蒸気エンジン」の深部へと向かい、渡り鳥の飛行が高度な熱力学計算に基づく回路の一部であることを突き止める。'
- '終盤: エンジンの暴走により、海が沸騰し、惑星を覆う巨大な雲の壁が発生する。カイは物理法則に基づいた軌道計算を用い、渡り鳥の群れを熱交換の媒体として再配置する壮大な試みを行う。'
- '結末: 凄まじい熱対流の奔流が収まった後、惑星は新たな熱平衡状態に到達する。カイは、美しくも冷徹な宇宙の循環を見つめる。'
style_notes: 熱力学や流体力学の専門用語を、その物理的現象がもたらす圧倒的な視覚的スケール（沸騰する海、雲の彫刻、熱の奔流）と共に、理性的かつ情緒的な文体で描き出す。
