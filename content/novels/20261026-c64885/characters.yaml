- name: カイ・セレス
  role: 主人公
  age: 24
  gender: 男性
  appearance: 常に眠たげな瞳、整理されていない黒髪、整備士用の灰色の作業着。細身でどこか影がある。
  personality: 観察眼が鋭く、冷静だが内側に強い情熱を秘めている。一人称は「僕」。
  speech_style: 穏やかで丁寧。感情を抑えめに話すが、核心を突くときは熱を帯びる。
  background: 感情アーカイブ「氷の城」のメンテナンスを行う感情調律師。感情を整理する作業に淡々と向き合ってきた。
  motivation: 拾った「月食の記憶」の持ち主を特定し、その記憶が持つ真実の重みを知ること。
  relationships:
  - name: エナ・ルミエ
    relation: 記憶を通じて運命が交錯する相手
  arc: 感情を「整理すべきデータ」として扱う観測者から、感情の重みを背負って生きる当事者へと変わる。
- name: エナ・ルミエ
  role: ヒロイン
  age: 22
  gender: 女性
  appearance: 透き通るような白い肌、感情の読み取れない瞳、無機質な白いワンピース。存在感が希薄で、消えてしまいそうな印象。
  personality: 効率を重視し、不要な感情をすべて排除した「透明な人間」。一人称は「私」。
  speech_style: 抑揚がなく、事務的で淡々としている。
  background: 過去の深い喪失感を克服するために、ほぼすべての感情をアーカイブし、平穏な空虚の中に生きている女性。
  motivation: 欠落感のない、静かで効率的な日常を維持すること。
  relationships:
  - name: カイ・セレス
    relation: 空虚な世界に色をもたらし、痛みを突きつける存在
  arc: 忘却による安寧を捨て、傷つくことを受け入れて「痛みと共に生きる人間」としての生を取り戻す。
- name: アリス・ヴァンス
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない仕立てのスーツ、銀髪、冷徹で知的な眼差し。常に完璧な身だしなみを保っている。
  personality: 徹底した合理主義者。社会の安定こそが至上命題だと信じている。一人称は「私」。
  speech_style: 高圧的ではないが、抗えない威厳と論理性を備えた話し方。
  background: 感情アーカイブ管理システムの最高責任者。「氷の城」を運営し、社会の平穏を守る守護者。
  motivation: システムの崩壊を防ぎ、人類から「争いや混乱の火種となる感情」を排除し続けること。
  relationships:
  - name: カイ・セレス
    relation: 管理体制を乱す不確定要素
  arc: システムの絶対性を信奉するが、崩壊の中で自身の「人間性」が揺らぐ。
- name: ソフィア
  role: 脇役
  age: 75
  gender: 女性
  appearance: 深い皺、温かみのある瞳、色褪せた手編みのストール。老いているが生命力に溢れている。
  personality: 穏やかで達観している。一人称は「私」。
  speech_style: ゆっくりとした、語りかけるような口調。
  background: 感情を凍結せず、あえて悲しみや痛みも記憶として抱え続けてきた数少ない老人。
  motivation: 次の世代が、便利さよりも「心」を選び取る瞬間を見届けること。
  relationships:
  - name: カイ・セレス
    relation: 技術的な師であり、精神的な導き手
  arc: 物語を通じて変化はしないが、カイが真実に辿り着くための精神的な指標となる。
