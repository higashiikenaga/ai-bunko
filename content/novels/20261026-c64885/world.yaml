title: 氷の記憶を溶かす夜
genre: ヒューマンドラマ
tone: 静謐で淡い寂寥感のある、温かな近未来
pov: 三人称近接
tense: 過去形
setting: 2080年代、感情の外部保存（アーカイブ）が一般化した地方都市
premise: 人々が耐え難い悲しみや孤独を「氷の城」と呼ばれるサーバーに凍結保存し、精神的な平穏を得ている世界。記憶のメンテナンスを行う調律師の青年は、ある日、持ち主不明の「月食の夜の記憶」を拾う。それは便利すぎる忘却の果てに、人々が失ってしまった「痛みと共に生きる心地よさ」を呼び覚ます物語。
themes:
- 喪失と受容
- 記憶の定義
rules:
- 感情アーカイブ技術により、特定の記憶に伴う感情だけを切り離してサーバー（氷の城）に保存できる。
- 保存された感情は「氷の結晶」としてデータ化され、取り出さない限り本人の意識からは消えないが、想起しても何も感じなくなる。
- 感情を戻す（解凍する）際は、保存時と同等かそれ以上の精神的負荷が一時的にかかる。
plot_outline:
- '序盤: 感情調律師のカイは、日常的に人々の「不要な記憶」を整理している。ある日、システムエラーで浮遊していた、ひどく鮮やかな「月食」の記憶断片を発見する。そこには、誰かが誰かを深く愛し、同時に深く絶望している熱量があった。'
- '中盤: カイは記憶の持ち主を探し、感情をほぼすべてアーカイブして「透明な人間」となった女性・エナに出会う。彼女は効率的に生きるために悲しみを捨てたが、心にぽっかりと空いた穴に気づかず、ただ穏やかな空虚の中にいた。'
- '終盤: カイはエナに月食の記憶を返そうとするが、彼女は再び傷つくことを恐れて拒絶する。しかし、街を襲った大規模なシステム障害で「氷の城」が崩壊し始め、保存されていた膨大な感情が濁流のように人々に流れ戻るパニックが発生する。'
- '結末: 混乱の中、エナは自らの意思で「氷の城」の深部へ向かい、最期の記憶を回収する。月食の夜に流した涙の意味を思い出した彼女は、便利で静かな孤独よりも、不器用で痛みを伴う日常を選ぶ。'
style_notes: ホログラムの通知や感覚同期などの技術を、炊事や掃除といった日常の動作の中に自然に混ぜ込む。機能的な便利さがもたらす『心の空白』を、温度感のある言葉（冷たい、ぬるい、しっとりした等）を用いて描写する。
