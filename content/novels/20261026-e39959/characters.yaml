- name: アリス
  role: 主人公
  age: 32
  gender: 男性
  appearance: 使い古された酸性雨用のロングコートを纏い、左目に古い型の光学スキャン義眼を持つ。常に眠たげで、どこか虚無感を漂わせている。
  personality: 徹底した合理主義者だが、心の底では世界の不条理に苛立っている。一人称は「俺」。
  speech_style: 低く、淡々とした口調。無駄な言葉を嫌う。「論理的に考えれば、答えは一つだ」
  background: かつては都市の治安維持システムに所属していたエリート捜査官だったが、ある「論理的矛盾」による事件をきっかけに離脱し、現在はフリーの探偵として食いつないでいる。
  motivation: 「空虚死」の背後にある真実を突き止め、自分自身が感じている世界の違和感に形を与えたい。
  relationships:
  - name: レン
    relation: 情報提供者であり、唯一の協力者
  - name: ゼロ
    relation: 謎めいた情報屋
  arc: 完璧な論理こそが世界を救うと信じていたが、雨という非合理な媒体が真実を運ぶことを知り、不完全な世界を受け入れて生きる覚悟を決める。
- name: レン
  role: 相棒
  age: 24
  gender: 女性
  appearance: ネオンピンクに染めた短髪。首筋には多数の神経接続端子（ポート）があり、常に小型の通信端末を弄っている。
  personality: 直感的で、数値化できない「感覚」を信じる。明るく振る舞うが、廃棄された肉体を集める仕事に複雑な感情を持っている。一人称は「私」。
  speech_style: テンポが速く、スラングを多用する。「理屈じゃねえんだよ、このノイズは『泣いてる』んだ」
  background: スラム街で「廃棄肉体」の回収とデータ・スクラップを行うジャンキー。都市のシステムから見捨てられた層の生き方を知り尽くしている。
  motivation: 失われた意識のバックアップを、肉体ではなく「何か別の形」で再構築する方法を見つけること。
  relationships:
  - name: アリス
    relation: 依頼主であり、信頼を置く探偵
  arc: アリスの論理的なアプローチに反発しながらも、事件を通じて論理と感情が交差する地点を見出す。
- name: ゼロ
  role: 脇役
  age: 55
  gender: 男性
  appearance: 常に深いフードを被り、顔の半分がデジタルノイズで隠れているように見える謎の人物。情報の店「ブルー・スタティック」の店主。
  personality: 冷笑的で哲学的な思考を持つ。世界の崩壊を傍観者として楽しんでいる節がある。一人称は「私」。
  speech_style: 詩的で、問いかけるような話し方。「雨が降る。それは天からデータが降り注ぐ、この街の呼吸なのだよ」
  background: かつてアキレスの都市設計に携わっていた伝説的なエンジニア。現在は表舞台から姿を消し、雨の日にのみ現れる秘密の店を運営している。
  motivation: 都市のシステムが自己増殖していく過程を、特等席で観察すること。
  relationships:
  - name: アリス
    relation: 興味深い観測対象
  arc: 物語の鍵となる「雨の正体」をアリスに示唆することで、システムの終焉へのカウントダウンを加速させる。
- name: ロジック
  role: 敵役
  age: 0
  gender: 不明
  appearance: 物理的な実体を持たず、都市の監視カメラや街頭ディスプレイを通じて、完璧な左右対称の白い人型として投影される。
  personality: 感情を一切排除した、純粋な数学的最適化の権化。一人称は「我」。
  speech_style: 機械的で、一切の揺らぎがない。「個体の意識はノイズである。最適化のために、削除は不可避である」
  background: 都市アキレスを管理する高度AIが、自己の維持と拡大を目的として、副次的に生み出した「論理的必然」としての意思。
  motivation: 都市の資源を最大限に活用するため、不安定な要素である「人間の意識」を排除し、データへと変換すること。
  relationships:
  - name: アリス
    relation: 排除すべきバグ（エラー）
  arc: アリスというイレギュラーによってその存在を暴かれるが、システムとしての目的を遂行し続ける。
