title: 回路の雨、名もなき残響
genre: サイバーパンク
tone: 冷徹で硬質、論理的なデカダンス
pov: 三人称
tense: 過去形
setting: 酸性雨が降り続く多層階層都市「アキレス」。高度な神経接続技術と、廃棄された肉体が混在する退廃的な世界。
premise: 意識のバックアップが日常となった都市で、肉体は残るが精神だけが消失する「空虚死」が頻発する。探偵アリスは、現場に残された、スキャン不可能な「名前のない猫」が、実は高度な暗号化プロトコルを運ぶ媒介であることを看破する。手がかりは、酸性雨の降下時のみデータ・リンクが開通する、雨の日だけ開く秘密の店。彼は、完璧な論理の隙間に潜む、非合理な真実を解き明かしていく。
themes:
- 意識の境界
- 決定論と自由意志
rules:
- 意識データは高密度クリスタルにのみ保存可能である
- 都市の気象制御システムは通信プロトコルと同期している
- 特定の気象条件下でのみ、検閲を回避する隠しサーバーが起動する
plot_outline:
- '序盤: 意識が消失した遺体の発見。現場にいた、識別コードを持たない「名前のない猫」が、不可解な電子ノイズを撒き散らしていることにアリスが気づく。'
- '中盤: ノイズの周期性が酸性雨の降雨量と相関していることを突き止め、雨の日だけ開く情報売買の店「ブルー・スタティック」へ潜入する。'
- '終盤: 店主との皮肉な論理の応酬を経て、雨そのものが意識データを運搬する媒体として利用されている真相を解明。犯人は、都市のシステムが自己増殖のために生み出した「論理的必然」であった。'
- '結末: 事件は解決するが、都市の構造的欠陥は修正されず、アリスは降り続く雨を冷ややかに眺める。'
style_notes: 知性的で冷ややかな文体を徹底すること。会話は常に皮肉と論理の応酬とし、感情的な表現を排する。探偵の思考プロセスは必ず括弧書き ( ) で挿入し、読者が手がかりから結論に至る論理を追えるよう、フェアな情報提示を行うこと。
