title: 玻璃の眠らぬ街に、君の蒼い心臓を塗り潰して
genre: ホラー
tone: 耽美的、退廃的、静謐な狂気
pov: 一人称（主人公：澪の残滓）
tense: 現在形と過去形の混在（詩的な叙述）
setting: 結晶化が進行し、生命が静止した現代都市（眠らぬ街）
premise: 偽物の湊によって世界は静止した結晶の地獄へと塗り替えられた。意識の破片だけとなった澪は、脆い硝子の人形に宿り、この「眠らぬ街」を彷徨う。兄・湊の魂が凝固したサファイアの核に刻まれた「秘密の地図」を辿り、彼女は永遠の静寂を終わらせるための絶望的な旅に出る。
themes:
- 永劫の停滞と破壊の美学
- 欠落を埋めるための共依存
rules:
- 世界は『飢餓』を宿した偽物の湊により、有機物から無機質の結晶へと書き換えられ続けている。
- 結晶化した人間は意識を保持したまま動けなくなるが、精神的な飢餓感だけが増幅され続ける。
- 澪の意識は完全な肉体を持たず、触れたものを結晶化させる『浸蝕の毒』を帯びている。
- サファイアの核（本物の湊）は、この世界の唯一の特異点であり、破壊すれば世界は崩壊し、再生または消滅する。
plot_outline:
- '序盤: 意識を失っていた澪が、路地裏に捨てられた精巧な硝子人形の中で目を覚ます。街は宝石のように美しく凍結し、人々は絶叫のまま結晶化した彫像となっている。彼女は自身の胸に、砕けたサファイアの欠片が埋まっていることに気づく。'
- '中盤: 偽物の湊が支配する『眠らぬ街』を彷徨う澪は、サファイアの欠片に浮かび上がる『秘密の地図』に従い、都市の核へと向かう。道中、結晶化に抗いながらも正気を失った生還者たちと出会い、彼らの絶望を宝石として喰らうことで、自身の形を維持する残酷な生存競争を強いられる。'
- '終盤: 都市の最上階、巨大な鏡の祭壇で偽物の湊と再会する。偽物は澪を再び取り込むことで、不完全な『人間』から完全なる『神』へと昇華しようと企む。澪は本物の湊の核（サファイア）が、自分を呼ぶ悲痛な鼓動を奏でていることを確信する。'
- '結末: 澪は自らの硝子の身体を内側から爆砕させ、その破片を偽物の湊の心臓へと突き立てる。サファイアの核を媒介に、街全体の結晶化を逆回転させ、すべてを無へと還す。美しくも残酷な光の中で、二人は本当の意味で『死』という名の安息を得て、静かに砕け散る。'
style_notes: 『瑠璃色の絶望』『氷晶の吐息』など、宝石や寒色系の色彩比喩を多用する。文章はあえて冗長に、装飾的な形容詞を重ねることで、壊れそうな危うさと過剰なまでの美しさを演出する。絶望を『至上の快楽』として描く倒錯的な視点を貫くこと。
