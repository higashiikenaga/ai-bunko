- name: カエレン・ヴェイン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 無造作な黒髪に、どこか虚ろな灰色の瞳。使い古された指揮者のコートを羽織っている。
  personality: 内向的で自己評価が低いが、音楽に対しては異常な執着を持つ。「僕」
  speech_style: 消え入りそうな、しかし芯のある話し方。語尾が少し震える癖がある。
  background: エリート演奏家を目指していたが、街の調律に適合しない「不協和音」しか奏でられないために音楽院を追放された落ちこぼれ。
  motivation: 自分の音を否定せず、ありのままの旋律で生きられる場所を見つけること。
  relationships:
  - name: ライラ
    relation: 守るべき対象であり、共に歌うパートナー
  - name: エララ・ソーン
    relation: 頼りになるが、時に厳格すぎる師のような存在
  arc: 自身の不完全さを「欠陥」ではなく、世界を揺るがす「個性」として受け入れ、指揮者として立ち上がる。
- name: ライラ
  role: 鍵となる存在
  age: 14
  gender: 女性
  appearance: 透き通るような銀髪と、星屑を散りばめたような瞳。喉元に音を封じるための銀のチョーカーを付けている。
  personality: 言葉数は極端に少ないが、感情表現が豊かで直感的。「……」
  speech_style: 声を出さず、音階の響きや視線、あるいは小さなハミングで意思を伝える。
  background: かつての調律儀式での事故により声を失った少女。その体内には、街のエネルギーを喰らうほどの強大な「星の共鳴」が眠っている。
  motivation: 失った声を取り戻すことではなく、自分の内なる響きを誰かに届けること。
  relationships:
  - name: カエレン・ヴェイン
    relation: 初めて自分の音を肯定してくれた理解者
  arc: 沈黙の中に閉じこもっていた少女が、禁忌の歌を解き放ち、世界を変える「歌い手」へと変貌する。
- name: エララ・ソーン
  role: 相棒/技術的支援
  age: 28
  gender: 女性
  appearance: 鋭い眼差しを持つ知的な美女。調律師の制服を改造した、機能的な黒いドレスを纏う。
  personality: 合理的で現実主義。冷徹に見えるが、内には熱い正義感を秘めている。「私」
  speech_style: 論理的で無駄のない、命令口調に近い話し方。
  background: 元・上級調律師。街の維持のために個人の感情を抹殺する『絶対和音』の真実を知り、組織を脱走した。
  motivation: 完璧すぎる調和によって失われた、人々の「生の音」を取り戻すこと。
  relationships:
  - name: カエレン・ヴェイン
    relation: 未熟な才能を見出し、導く対象
  - name: マエストロ・ヴァレリウス
    relation: かつての師であり、打倒すべき旧体制の象徴
  arc: 体制の歯車として生きてきた過去を捨て、自らも不協和音の一部となる決意を固める。
- name: マエストロ・ヴァレリウス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 隙のない純白の礼服を纏い、常に穏やかな微笑を浮かべている。目が見えないが、音だけで全てを把握している。
  personality: 傲慢なまでの完璧主義者。混乱を悪とし、秩序こそが至高だと信じている。「私（わたくし）」
  speech_style: 優雅で慈愛に満ちた、しかし拒絶を許さない威圧的な敬語。
  background: ノクトピアの音楽評議会を率いる最高権力者。『絶対和音』の儀式を計画し、街の永遠の安定を望んでいる。
  motivation: 一切の雑音を排除し、永遠に変わることのない「完璧な静寂と調和」を完成させること。
  relationships:
  - name: カエレン・ヴェイン
    relation: 排除すべき不純物（ノイズ）
  arc: 絶対的な秩序の守護者として、主人公たちの生々しい感情の爆発（不協和音）と真っ向から衝突する。
