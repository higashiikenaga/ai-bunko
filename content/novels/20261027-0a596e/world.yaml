title: 共鳴する夜の輪舞曲（ロンド）と、星を喰らう歌い手
genre: 群像劇
tone: 幻想的でリズミカル。音楽的な韻律と高揚感に満ちた雰囲気
pov: 三人称
tense: 過去形
setting: 永遠に夜が明けない浮遊都市「ノクトピア」。音色が物理的なエネルギーとなり、街の灯りと重力を維持している世界
premise: 絶え間ない音楽で維持される「眠らない街」ノクトピア。そこでは歌こそが権力であり、魔法であり、生命線であった。千年に一度、星々が共鳴する「祭りの夜」に、世界の調律を変えようと企む不協和音の奏者たちが集う。異なる孤独を抱えた彼らが、一つの禁忌の歌を完成させるまでの物語
themes:
- 調和と不協和
- 個の叫びと全体の共鳴
rules:
- 音楽が物理的な力（熱、光、重力）に変換されるため、静寂は死と停滞を意味する
- 完璧な和音は社会に秩序をもたらすが、個人の感情や個性を消し去る
- 不協和音は破壊を招くが、同時に現状を打破する唯一の創造的な力となる
- 特権階級の『調律師』が街のメインBGMを管理し、市民の精神状態をコントロールしている
plot_outline:
- '序盤: 街の調律に馴染めず、不協和音を奏でてしまう落ちこぼれの演奏家や、声を失った少女など、社会の縁に追いやられた人々が、路地裏の地下音楽堂で出会う'
- '中盤: 千年に一度の「祭りの夜」に向け、調律師たちが全市民を強制的に同調させる『絶対和音』の儀式を計画。それに抗うため、主人公たちはそれぞれの孤独な旋律を重ね合わせ、不完全ながらも力強い共鳴を模索する'
- '終盤: 祭りの絶頂、街全体を飲み込む絶対和音の奔流に対し、主人公たちは禁忌とされる『不協和の合唱』をぶつける。個々の叫びが重なり、街の構造そのものを揺るがす巨大な音楽の渦が巻き起こる'
- '結末: 強制的な調和は崩れ、街に本当の意味での「個」の音が戻る。物理的な浮遊都市としての形態は失われるが、人々は地上の未知なる世界へと、自分たちだけの歌を歌いながら降り立つ'
style_notes: 文章に拍動感（ビート）を持たせ、読者がリズムを感じる構成にする。音楽用語（クレッシェンド、スタッカート、フェルマータ等）を情景描写の比喩に積極的に用いる。各話の転換点や感情のピークに、その人物の魂を象徴する詩的な歌詞を挿入し、物語に旋律を添えること
