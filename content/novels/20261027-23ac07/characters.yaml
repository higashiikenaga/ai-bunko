- name: 瀬戸 奏太
  role: 主人公
  age: 17
  gender: 男性
  appearance: 細身で無駄のない筋肉質。常にストップウォッチを首から下げ、鋭い眼差しをしている。
  personality: 完璧主義で孤独を好む。数字や記録に対して異常なまでの執着を持つ。一人称は「僕」。
  speech_style: 短く、事務的で論理的な話し方。
  background: 中学時代から中距離走のエースとして活躍してきたが、1500mの4分10秒という壁を突破できず、精神的に追い詰められている。
  motivation: 1500mで4分を切ること、そして自分の走りの正解を見つけること。
  relationships:
  - name: 如月 蓮
    relation: ライバル
  - name: 佐伯 監督
    relation: 指導者
  arc: タイムという数字の呪縛に苦しむ「孤独な戦い」から、自身の身体感覚を信じて走る「確信に満ちた孤独」へと変化する。
- name: 如月 蓮
  role: 敵役（ライバル）
  age: 17
  gender: 男性
  appearance: 快活な印象を与える、日焼けした肌と柔らかな表情。走る姿が非常に軽やか。
  personality: 直感的で自由奔放。記録よりも「走る感覚」を重んじる。一人称は「俺」。
  speech_style: 明るく、リズム感のある話し方。相手の懐に飛び込むような距離感。
  background: 奏太とは対照的な哲学を持つ転校生。タイムを追うことの苦しさを、走ることの楽しさで塗り替えていく。
  motivation: 風を感じ、自分が一番心地よいと感じるスピードで走り抜けること。
  relationships:
  - name: 瀬戸 奏太
    relation: ライバル
  arc: 奏太の強迫観念を揺さぶる存在として現れ、共に高みを目指すことで、競技の楽しさを再確認する。
- name: 佐伯 健一
  role: 脇役（指導者）
  age: 45
  gender: 男性
  appearance: 鋭い眼光を持つが、口元には常に穏やかな笑みを湛えている。元陸上選手。
  personality: 洞察力が鋭く、部員のメンタル面を静かに見守る。一人称は「私」。
  speech_style: 落ち着いていて、諭すような、重みのある口調。
  background: 高校の陸上部顧問。奏太の才能と危うさを誰よりも理解しており、彼が自滅しないよう距離を保っている。
  motivation: 選手たちが数字ではなく、自分自身の足で立ち続けること。
  relationships:
  - name: 瀬戸 奏太
    relation: 教え子
  arc: 奏太が挫折を乗り越え、真の意味で自立したアスリートになる過程を支え続ける。
- name: 望月 結衣
  role: 脇役（友人）
  age: 17
  gender: 女性
  appearance: 活動的なショートヘア。陸上部のマネージャーとして、常に記録ノートを持ち歩いている。
  personality: 真面目で世話焼き。奏太のストイックすぎる性格を心配している。一人称は「私」。
  speech_style: 優しく、聞き上手な話し方。
  background: 奏太の幼馴染。彼のこれまでの記録をすべて把握しており、彼の変化に誰よりも早く気づく。
  motivation: 奏太が、苦しみではなく喜びを感じながら走れるようになること。
  relationships:
  - name: 瀬戸 奏太
    relation: 幼馴染
  arc: 奏太の孤独を理解しつつも、彼が再び「誰かと共に走る感覚」を取り戻すための情緒的な支えとなる。
