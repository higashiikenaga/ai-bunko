title: 零点一秒の孤独
genre: スポーツ青春
tone: 内省的で静謐。身体感覚と数字への執着が同居する雰囲気。
pov: 一人称（私）
tense: 現在形と過去形の混在
setting: 現代。地方都市の高校とその周辺の陸上競技場。
premise: 中距離走者の「私」は、1500メートルで4分を切るという壁にぶつかっていた。タイムという残酷な数字に支配され、孤独なトレーニングに没頭する日々。しかし、ある日の練習で出会った他者の呼吸が、私の凝り固まった身体感覚を揺さぶり始める。桜が舞う決勝戦、私は自分だけの正解を求めてトラックを駆け抜ける。
themes:
- 身体的限界への挑戦
- 孤独の受容
rules:
- 1500m走の競技特性（スピードと持久力の拮抗）を正確に描写すること
- タイムの短縮を精神論ではなく、心拍数や乳酸の蓄積といった身体的な感覚として表現すること
plot_outline:
- '序盤: 4分10秒から更新されないタイムに絶望し、一人でストップウォッチと向き合い続ける「私」の日常。'
- '中盤: タイムへの強迫観念からフォームを崩し、足首を負傷。療養中に、数字に縛られず「風を切る快感」を優先するライバルと出会い、走ることの根源的な意味を問い直す。'
- '終盤: 復帰し、桜が舞い散る県大会決勝へ。1000m地点で訪れる激しい乳酸の蓄積と呼吸の乱れの中、孤独な練習で得た身体の声を信じてラストスパートをかける。'
- '結末: 限界を突破し、目標のタイムを更新。帰路の最終列車に揺られながら、一人で走り抜けてきた時間の正しさを確信し、静かに目を閉じる。'
style_notes: 「〇分〇秒〇」というタイム表記を文章の随所に配置し、時間経過の緊張感を演出する。ストライドの幅や心拍数など、定量的な数値を用いて内面的な葛藤を具体化して描く。独白は短文を重ね、激しい呼吸のリズムを文章のテンポで表現すること。
