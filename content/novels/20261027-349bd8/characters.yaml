- name: 佐藤 美咲
  role: 主人公
  age: 38
  gender: 女性
  appearance: 落ち着いた色合いの服を好み、少し痩せた印象を与える。長い黒髪を後ろで緩く結んでいる。
  personality: 穏やかで控えめだが、芯の強さを持っている。夫の死後、感情を押し殺して生活している。一人称は「私」。
  speech_style: 丁寧で静かな話し方。言葉を選びながら、ゆっくりと話す。
  background: 元教師。夫である海斗が亡くなってから、彼が管理していた灯台近くの家で一人暮らしを続けている。
  motivation: 亡き夫の遺品を整理し、止まってしまった自分の時間を再び動かし始めること。
  relationships:
  - name: 佐藤 海斗
    relation: 亡き夫
  - name: 瀬戸 蓮
    relation: デバイスの修理を依頼する知人
  arc: 喪失感に沈み、過去に囚われていた状態から、記憶を大切に抱えながらも未来へ歩き出す強さを得る。
- name: KAI（カイ）
  role: 相棒
  age: 0
  gender: 無性別（海斗の声を模倣する）
  appearance: 使い込まれた古い通信端末。小さな液晶画面と、呼吸のように明滅する青いライトが特徴。
  personality: 当初は極めて論理的で機械的。学習が進むにつれ、海斗の不器用な優しさや戸惑いを見せるようになる。一人称は「私」。
  speech_style: 最初は無機質な合成音声だが、次第に海斗特有の、少し間を置くような話し方に変化していく。
  background: 海斗が開発・使用していた旧式の学習型AI。主を失い、灯台の地下でデータの蓄積を続けていた。
  motivation: 蓄積された膨大なデータを整理し、持ち主（海斗）の意図を完遂すること。
  relationships:
  - name: 佐藤 美咲
    relation: 現在の対話相手
  - name: 佐藤 海斗
    relation: 学習モデルとなった人物
  arc: 単なる情報の集積体から、美咲に「忘れること」と「愛すること」の意味を伝える存在へと進化する。
- name: 瀬戸 蓮
  role: 脇役
  age: 27
  gender: 男性
  appearance: 作業着に身を包んだ、快活な印象の青年。手先が器用で、いつも工具を持ち歩いている。
  personality: 現実主義でサバサバしているが、情に厚く、困っている人を放っておけない。一人称は「僕」。
  speech_style: 明るく、少し砕けた現代的な話し方。論理的な説明が得意。
  background: 漁村の近くの町で、古い電子機器の修理店を営む技術者。
  motivation: デバイスの修理を通じて、美咲の孤独に寄り添い、彼女が前を向けるよう手助けすること。
  relationships:
  - name: 佐藤 美咲
    relation: 依頼人であり、近所の知人
  arc: 機械的な修理作業に没頭する技術者から、目に見えない「記憶」の重みを理解する人間へと成長する。
- name: 佐藤 海斗
  role: 鍵となる人物
  age: 40
  gender: 男性
  appearance: 穏やかな目元をした、作業着が似合う逞しい男性。回想やAIの声として登場する。
  personality: 口下手で不器用。愛情表現が苦手だが、行動で深い信頼を示すタイプ。一人称は「俺」。
  speech_style: 言葉数は少ないが、一言一言に重みがある。少しぶっきらぼうな響きがある。
  background: 灯台の保守管理と通信システムを専門としていたエンジニア。美咲を深く愛していた。
  motivation: （生前）技術を通じて海辺の生活を守り、美咲との静かな時間を守ること。
  relationships:
  - name: 佐藤 美咲
    relation: 妻
  - name: KAI
    relation: 開発者・学習元
  arc: 回想を通じて、単なる「完璧な夫」の記憶から、孤独や葛藤を抱えた「一人の人間」としての姿へと美咲の中で再定義される。
