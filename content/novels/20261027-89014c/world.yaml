title: 星屑の航跡と、銀河を渡る空飛ぶ船
genre: 青春恋愛
tone: 明るく軽快で、ときめきと美味しそうな香りが漂う文体
pov: 一人称（佐々木陽葵）
tense: 過去形
setting: 前作の舞台である島から少し離れた、星空が美しい海辺の町と、空に浮かぶ未知の航路
premise: 海底遺跡の守り手となった海斗と、相変わらず美味しいものに目がないあたしの、新しい夏が始まる！遺跡のエネルギーが空へと繋がり、夜空に突如として『空飛ぶ船』の影が浮かび上がるようになったんだ。海斗が持つ星図の謎を解くため、あたしは彼と一緒に、雲の上を目指す空の旅へと巻き込まれていく。美味しい星空スイーツを頬張りながら、二人の距離はもっと加速していく……はず！
themes:
- 未知への冒険
- 運命の再確認
- 食欲と恋心の相関関係
rules:
- 海底遺跡のエネルギーは、特定の天体配置において空中の『エネルギーの通り道』を形成する
- 青い羽根は、空飛ぶ船の航路を示すナビゲーターの役割を果たす
- 星図は、単なる地図ではなく、遺跡の起動と空の航路を同期させるための鍵である
plot_outline:
- '序盤: 海底遺跡の保護が始まり、平和な日常を取り戻した島。でも、夜空に巨大な船の影が見えるようになる。海斗が『空の遺跡』の存在を予感し、あたしは彼に誘われ、星図の調査を手伝うことに。'
- '中盤: 調査の途中で、遺跡の技術で作られた『空飛ぶ船』のプロトタイプに乗り込むことに！ 狭い船内でのドキドキ、そして空の上で食べる『雲の綿あめ風パフェ』の美味しさに感動。しかし、星図を狙う謎の組織が動き出す。'
- '終盤: 星図が示す最終目的地は、空に浮かぶ巨大な星の観測所。組織の妨害を、海斗の冷静な判断とあたしの直感（と、おやつ休憩によるエネルギー補給！）で乗り越え、二人は空の航路を完成させる。'
- '結末: 空の航路は、世界を繋ぐ新しい道となった。海斗との距離も、前作より確実に縮まったみたい。次は、宇宙一美味しい海鮮丼を食べに、もっと遠くまで行こう！'
style_notes: 一人称「あたし」による、テンポの速い軽快な語り。海斗へのツッコミは鋭く、でも隠しきれない好意を滲ませる。食べ物の描写は「口の中でとろける～」「弾けるような～」と、読み手が空腹になるくらい美味しそうに。毎話、必ず陽葵が何かを食べた時の感想や、ちょっとした食べ物の失敗談などの笑いどころを入れること。
