- name: 桐生 蓮 (きりゅう れん)
  role: 主人公
  age: 24
  gender: 男性
  appearance: 鋭い眼光だが、どこか虚無感を漂わせる。日に焼けた肌と、工場勤務で鍛えられた無骨な体格。左の眉に古い傷跡がある。
  personality: 冷笑的で無気力。自分を「終わった人間」だと思っている。一人称は「俺」。
  speech_style: ぶっきらぼうで、必要最低限のことしか話さない。低く、投げやりな口調。
  background: かつてアマチュアボクシング界の天才と呼ばれたが、数年前の試合中に相手を重傷負わせた事件（あるいは自身の精神的な挫折）をきっかけに競技を辞め、現在は工場で単純作業に従事している。
  motivation: 後輩の情熱に抗えず、自分自身を縛り付けている過去の罪悪感と向き合うこと。
  relationships:
  - name: 瀬戸 凪
    relation: 後輩であり、再起のきっかけを与える存在
  - name: 神代 零士
    relation: かつてのライバルであり、現在の最大の壁
  arc: 絶望の中で止まっていた時間が、再び動き出す。過去の自分を否定するのではなく、それを受け入れた上で「今」を戦う強さを手に入れる。
- name: 瀬戸 凪 (せと なぎ)
  role: 相棒（導き手）
  age: 17
  gender: 男性
  appearance: 小柄だが引き締まった体つき。瞳が非常に澄んでおり、意志の強さを感じさせる。短髪で清潔感がある。
  personality: 猪突猛進で真っ直ぐ。空気を読まない不器用さがあるが、一度決めたことは曲げない。一人称は「僕」。
  speech_style: 敬語が混じるが、熱量が高く、ストレートな物言いをする。迷いがない。
  background: 地元のボクシングジムに通う高校生。かつての桐生の試合をビデオで見て憧れていた。桐生が拳を捨てた理由を知りながらも、彼が持つ「本当の強さ」を信じて挑みかかる。
  motivation: 桐生に再びリングに上がってもらうこと。そして自分自身の限界を超えること。
  relationships:
  - name: 桐生 蓮
    relation: 憧れの先輩であり、超えるべき壁
  arc: ただの憧れを抱く少年から、桐生と共に泥にまみれて戦う一人のボクサーへと成長する。
- name: 神代 零士 (かみしろ れいじ)
  role: 敵役
  age: 25
  gender: 男性
  appearance: 端正な顔立ち。モデルのようなスタイルだが、全身が鋼のような筋肉に覆われている。常に隙のない佇まい。
  personality: 傲慢で冷酷。勝利こそが全てであり、弱者を切り捨てることに躊躇がない。一人称は「私」。
  speech_style: 丁寧だが、相手を見下したような冷ややかな敬語。威圧感がある。
  background: 桐生の元ライバル。桐生が去った後のボクシング界を、圧倒的な実力と冷徹な戦略で支配している現在のトップランナー。
  motivation: 自身の完璧な世界を脅かす存在（桐生）を排除し、絶対的な王座を証明すること。
  relationships:
  - name: 桐生 蓮
    relation: かつての唯一のライバルであり、排除すべき過去の亡霊
  arc: 桐生の再起によって、自身の「勝利への執着」が単なるエゴであったことに気づかされ、真の闘志に火がつく。
- name: 佐伯 健一 (さえき けんいち)
  role: 脇役（師匠的存在）
  age: 52
  gender: 男性
  appearance: 使い古されたトレーニングウェアを着た、小柄で痩せ型の老人。目は笑っているが、鋭い観察眼を持つ。
  personality: 飄々としていて掴みどころがない。厳しいが、教え子の心の機微に敏感。一人称は「俺」。
  speech_style: 冗談めかした口調が多いが、核心を突く時は重みがある。
  background: かつて桐生を指導していたジムのオーナー。桐生が去った後も、街の小さなジムを守り続けている。
  motivation: 桐生が再び自分自身の足で歩き出すのを見守ること。
  relationships:
  - name: 桐生 蓮
    relation: 元教え子であり、息子のように案じている存在
  arc: 停滞していたジムに再び活気を取り戻し、桐生の精神的な支柱となる。
