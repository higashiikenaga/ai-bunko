title: 錆びた拳と空の鳥
genre: スポーツ青春
tone: 硬派、ストイック、速度感あるアクション
pov: 一人称（俺）
tense: 過去形
setting: 現代日本、錆びついた工場地帯が広がる地方都市
premise: かつて天才と呼ばれながら、ある事件で拳を捨てた俺。泥を啜る日々の中で、不器用な後輩の真っ直ぐな挑戦を受ける。再びグローブを嵌めた俺が、人生の底から空を目指して、絶望という名の壁を殴り抜く物語。
themes:
- 再起
- 不器用な絆
rules:
- 試合は厳格なアマチュアボクシングルールに従うが、精神的な屈服まで戦い続ける非公式の特訓試合が存在する
- 勝利の条件は相手を倒すことではなく、自分の弱さを超えることにある
plot_outline:
- '序盤: 絶望してボクシングを捨て、工場で働く俺。そこに現れた後輩の少年が、俺の過去を知った上で対戦を申し込む。'
- '中盤: 少年の情熱に突き動かされ、再びジムへ戻る。かつてのライバルたちが支配する街の大会に出場し、一人ずつ叩き潰していく。'
- '終盤: 月食の夜、最大の宿敵との決勝戦。喧騒が消えた静寂の中、俺は自分自身の過去という最大の敵と向き合い、最後の一撃を叩き込む。'
- '結末: 勝利し、執着から解放された俺たちは、空を渡る鳥のように自由な心を持って、それぞれの新しい道へと歩き出す。'
style_notes: 短文で畳みかける。擬音を一切排除し、「裂く」「抉る」「叩き潰す」など強い動詞でアクションを描写する。戦闘の直前には必ず、心拍音さえ消えるような静寂の場面を挿入すること。
