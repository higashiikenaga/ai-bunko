- name: カイ・レン
  role: 主人公
  age: 26
  gender: 男性
  appearance: 黒いフード付きの防塵ジャケット、左腕には旧式の継ぎ接ぎだらけのサイバネティクス義手、鋭く疲れ切った瞳
  personality: 冷笑的で合理主義的なリアリスト。「俺」が一人称。孤独を好むが、心の奥底に捨てきれない正義感を隠している
  speech_style: 低く、短く、ぶっきらぼうな口調
  background: 酸性雨が降るドレンで、生き延びるために情報の深淵を泳ぐデータ潜水屋（ダイバー）として活動してきた
  motivation: 拾った手紙に隠された謎を解き明かし、自分を縛る都市の仕組みの正体を知ること
  relationships:
  - name: リナ・ヴァレンティン
    relation: 協力者
  - name: エライジャ・ヴォーン
    relation: 追跡者
  arc: システムの歯車として生きる諦念から、世界の理を書き換える変革者へと覚醒する
- name: リナ・ヴァレンティン
  role: 相棒
  age: 32
  gender: 女性
  appearance: アンティークな眼鏡、首元に埋め込まれた神経接続端子、落ち着いた色調のロングヘア
  personality: 知的好奇心が旺盛で、失われゆくアナログ文化を愛する。「私」が一人称。冷静だが情熱を秘めている
  speech_style: 丁寧だが、時折皮肉めいた知的な言い回しを用いる
  background: ドレンの路地裏で違法古本屋を営む。かつてはゼニス社の情報解析部門に所属していたエリート研究員
  motivation: 手紙が証明する「人間としての真の記憶」を世界に、そして自分自身に証明すること
  relationships:
  - name: カイ・レン
    relation: 協力者
  arc: 安全な隠れ家での観察者から、運命を賭けて戦いに身を投じる当事者へ
- name: エライジャ・ヴォーン
  role: 敵役
  age: 45
  gender: 男性
  appearance: 完璧に手入れされた白の軍服、全身を覆う高機能な戦闘用サイバネティクス、氷のように冷たい眼差し
  personality: 都市の秩序を絶対視し、感情や歴史を「ノイズ」として排除する。「私」が一人称。徹底した規律主義者
  speech_style: 命令的で、感情の起伏が一切ない機械的な話し方
  background: 超巨大企業ゼニスの治安維持部隊「パルス・センチネル」の指揮官。都市の安定を脅かす存在を排除する掃除屋
  motivation: 都市のシステムを乱す「不純物（手紙とカイ）」を徹底的に抹殺し、完璧な秩序を維持すること
  relationships:
  - name: カイ・レン
    relation: 抹殺対象
  arc: 完璧な秩序の執行者から、システムの脆弱性と真実の前に崩壊していく支配の象徴へ
- name: ニコ
  role: 脇役
  age: 14
  gender: 男性
  appearance: 汚れの目立つオーバーサイズのスウェット、大きな防塵ゴーグル、小柄で素早い体つき
  personality: 狡猾で現実主義。「ボク」が一人称。スラムの厳しい掟を熟知している
  speech_style: 早口で、相手を試すような生意気な口調
  background: ドレンの路地裏で生まれ育った、小規模な窃盗団のメンバー。情報の運び屋としても活動している
  motivation: 日々の食料と、いつかこの泥沼のようなスラムから抜け出すこと
  relationships:
  - name: カイ・レン
    relation: 情報提供者兼、兄貴分
  arc: 目の前の利益だけを追う生存主義者から、世界の変容を目の当たりにする目撃者へ
