title: クローム・パルス：偽典の雨
genre: SF
tone: 硬質で高速、ネオンと酸性雨に濡れたハードボイルド
pov: 一人称（オレ）
tense: 現在形
setting: 超巨大企業「ゼニス」が支配する垂直都市。最上層の純白の楽園と、酸性雨が降り注ぐ最下層のスラム「底辺（ドレン）」。
premise: データ潜水屋（ダイバー）のオレは、違法な古本屋で一通の「失われた手紙」を拾う。それはデジタル化不可能な生身のインクで書かれた、50年前の遺言だった。手紙に隠されたアナログな暗号が、都市の全記憶を書き換える禁忌のサーバーへの鍵となる。ゼニスの処刑部隊に追われながら、オレは雨の路地裏を駆け抜け、情報の深淵へとダイブする。
themes:
- アナログとデジタルの対立
- 個人の記憶の不可侵性
rules:
- 脳内チップによる記憶の外部保存が一般的であり、忘却は贅沢品とされる
- 紙媒体は『ノイズ源』として法的に禁止されており、所持は重罪
- ハッキングは精神的な『潜水（ダイブ）』として行われ、同期率が限界を超えると脳が焼ける（ブレイン・フリーズ）
plot_outline:
- 序盤：ドレンの路地裏にある隠れ家的な古本屋で、オレは古ぼけた手紙を買い取る。そのインクに特殊なナノコードが組み込まれていることを突き止め、好奇心から接続した瞬間、ゼニスのセキュリティに検知される。
- 中盤：都市の追跡者を振り切りながら、手紙の差出人を捜索。情報の断片を繋ぎ合わせるため、闇のデータブローカーや違法サイボーグたちと接触し、手紙が『人間としての感情』を取り戻すためのバックドアであることを知る。
- 終盤：ゼニスの本拠地である最上層のタワーへ強行突破。物理的なポートに手紙のコードを流し込むため、アナログな物理破壊と超高速の論理爆弾（ロジックボム）を組み合わせたハッキングを仕掛ける。
- 結末：サーバーを解放し、全市民に『偽造されていない真の記憶』を還元。都市は混乱に陥るが、オレは雨の中、誰にも追われない自由な幽霊（ゴースト）となって消える。
style_notes: 短いセンテンスの積み重ねでスピード感を出す。「シナプス・ジャック」「電脳泥濘」などの造語を散りばめる。比喩は金属、電気、化学薬品を用いる。独白は突き放したハードボイルド調で、感情を記号的に処理する記述にする。
