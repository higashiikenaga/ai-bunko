- name: 真壁 弦之介
  role: 主人公
  age: 38
  gender: 男性
  appearance: 浅黒い肌に、使い込まれた灯台守の粗末な着物。鋭い眼光を隠すように伏せ目がちだが、立ち姿には隠しきれない武人の風格がある。
  personality: 沈着冷静で寡黙。過去を悔い、静寂を愛する。一人称は「私」。
  speech_style: 低く落ち着いた声。無駄を削ぎ落とした、簡潔で丁寧な言葉選び。
  background: かつて幕府の汚れ仕事を担った凄腕の隠密剣客。ある任務での凄惨な経験から剣を捨て、この断崖の灯台へと辿り着いた。
  motivation: 静かな隠遁生活を維持し、自分自身の魂の安寧を得ること。
  relationships:
  - name: 佐久間 宗次
    relation: かつての盟友であり、己の過去を象徴する宿敵
  - name: お凛
    relation: 村の娘であり、守るべき平穏の象徴
  arc: 逃避していた過去を受け入れ、己の業を断つために再び剣を握る。
- name: 佐久間 宗次
  role: 敵役
  age: 38
  gender: 男性
  appearance: 端正な顔立ちだが、瞳には狂気が宿る。身なりは整っているが、どこか死の気配を纏った、危うい美しさを持つ。
  personality: 執念深く、破壊衝動を抱える。一瞬の閃光に命を懸ける刹那主義者。一人称は「俺」。
  speech_style: 情緒的で高圧的。時折、哄笑や独白のような話し方を見せる。
  background: 真壁と共に闇を駆けた剣客。真壁の離脱によって己の存在意義を見失い、剣による狂乱の果てに真壁を追う。
  motivation: 真壁との死闘を通じて、生と死の境界を確かめること。
  relationships:
  - name: 真壁 弦之介
    relation: 唯一の理解者であり、殺害すべき対象
  arc: 執着の果てに、真壁の刃によって己の虚無を埋めようとする。
- name: お凛
  role: 脇役
  age: 17
  gender: 女性
  appearance: 潮風に焼けた健康的な肌と、輝くような瞳。漁村らしい素朴な着物姿。
  personality: 明るく快活で、周囲を明るくする生命力を持つ。一人称は「私」。
  speech_style: はつらつとした、村の訛りを感じさせる親しみやすい話し方。
  background: 断崖の村で暮らす漁師の娘。真壁の正体を知らず、不器用な彼を「灯台守の親切な人」として慕っている。
  motivation: 村の平穏と、大切な人々との日常を守ること。
  relationships:
  - name: 真壁 弦之介
    relation: 恩人であり、密かに慕う大人
  arc: 残酷な現実と武士の因縁を目の当たりにし、無垢な少女から、無常を受け入れる強さを備えた女性へと成長する。
- name: 源蔵
  role: 脇役
  age: 65
  gender: 男性
  appearance: 深く刻まれた皺、節くれ立った手。常に海を見つめている老漁師。
  personality: 達観しており、物事の移ろいを受け入れている。一人称は「ワシ」。
  speech_style: ゆっくりとした、重みのある口調。教訓めいた言い回しが多い。
  background: 村の長。かつて真壁が隠遁した際、その過去を察しながらも黙認し、静かに見守ってきた。
  motivation: 村の平穏を保ち、自然の摂理に従って事を見守ること。
  relationships:
  - name: 真壁 弦之介
    relation: 過去を知る理解者
  arc: 嵐の予兆として、真壁に覚悟を促す導き手となる。
