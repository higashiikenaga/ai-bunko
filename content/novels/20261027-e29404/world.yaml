title: 孤影の灯、散りゆく刃
genre: 歴史・時代小説
tone: 重厚、峻烈、静謐
pov: 三人称
tense: 過去形
setting: 江戸中期、外海に面した断崖絶壁の漁村と、その頂に立つ古びた灯台
premise: かつて幕府の闇を駆けた元剣客・真壁は、過去を捨てて沿岸の古い灯台で静かに暮らしていた。しかし、桜の舞い散る季節、かつての盟友であり、今は狂気を宿した剣客が彼を追って現れる。避けられぬ因縁が、断崖の静寂を切り裂いていく。
themes:
- 武士の矜持と孤独
- 宿命からの脱却
rules:
- '抜刀術の真髄: 速度ではなく、間合いと呼吸の制御が勝敗を決する'
- '灯台の掟: 灯火を守ることは、海上の命を守ることと同義である'
plot_outline:
- '序盤: 灯台守として隠遁生活を送る真壁の静かな日常と、忍び寄る刺客の気配。'
- '中盤: 桜の季節に現れた宿敵との対峙。村を巻き込む抗争と、真壁が隠してきた凄惨な過去の露呈。'
- '終盤: 嵐の前触れの静寂の中、断崖の灯台の下での一騎打ち。命を懸けた刹那の立ち合い。'
- '結末: 剣戟の果てに訪れる静寂と、散りゆく桜が象徴する生の無常。'
style_notes: 簡潔で力強い文。無駄な修飾を排し、一文字一文字に重みを持たせる。特に一騎打ちの直前、風の音や呼吸の音だけが響く極限の静寂を丁寧に描き、決着の瞬間に爆発的な躍動感を与えること。
