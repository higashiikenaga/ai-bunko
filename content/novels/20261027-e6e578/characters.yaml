- name: 瀬名 奏
  role: 主人公
  age: 24
  gender: 女性
  appearance: ゆるいウェーブの茶髪に丸眼鏡。オーバーサイズのカーディガンを愛用し、いつも指先にインクの汚れがついている。
  personality: 内向的だが好奇心旺盛。観察力に優れ、本の中の世界に没入することを好む。一人称は「わたし」。
  speech_style: 丁寧で控えめ。考え込みながら話すため、語尾に「……かもしれません」と付け加えがち。
  background: 大学卒業後、偶然見つけた「星屑の書架」に惹かれ、店員として働き始めた。前店主の遺した空気感に心地よさを感じている。
  motivation: 本に挟まっていた星図と栞の謎を解き明かし、誰かが残した「意志」を正しく届けたい。
  relationships:
  - name: 桐生 蓮
    relation: 不可思議な協力者
  - name: 司馬 誠一
    relation: 恩師のような前店主（故人）
  arc: 受動的な読書家から、自ら街へ出て記憶の断片を繋ぎ合わせる能動的な探究者へと成長する。
- name: 桐生 蓮
  role: 相棒
  age: 28
  gender: 男性
  appearance: 端正な顔立ちに冷徹そうな鋭い眼差し。仕立ての良いシャツを着用し、常に手帳を携帯している。
  personality: 論理至上主義で効率を重視するが、根は情に厚い。古書や天文に造詣が深い。一人称は「僕」。
  speech_style: 断定的で簡潔。皮肉屋な一面があるが、奏の直感には敬意を払っている。
  background: 若き天文学研究者。かつて司馬誠一に人生の転機となる助言を受けたことがあり、密かに店を訪れていた。
  motivation: 論理的に解けない「感情の暗号」に挑むことで、司馬が最後に伝えたかった答えを知りたい。
  relationships:
  - name: 瀬名 奏
    relation: 直感的な相棒
  - name: 司馬 誠一
    relation: 精神的な導き手
  arc: 正解か不正解かという二分法ではなく、曖昧で優しい「記憶の真実」を受け入れられるようになる。
- name: 司馬 誠一
  role: 謎の設計者
  age: 72
  gender: 男性
  appearance: （回想・写真）白髪混じりの柔らかな髪に、いつも穏やかな微笑みを浮かべている。古いパイプを嗜んでいた。
  personality: ロマンチストで茶目っ気がある。言葉にするよりも、物や本に想いを託すことを好む。
  speech_style: ゆったりとした口調で、比喩表現を多用する。
  background: 「星屑の書架」の元店主。街のあらゆる物語を収集し、人々の縁を繋ぐことを生きがいにしていた。
  motivation: 過去に自分が断ち切ってしまった大切な人との約束を、時を超えて完結させること。
  relationships:
  - name: 瀬名 奏
    relation: 後継者として信頼した女性
  - name: 桐生 蓮
    relation: 才能を見出した教え子のような存在
  arc: 死後、奏と蓮を通じて、自身の後悔が希望へと書き換えられる。
- name: 陽葵
  role: 鍵を握る人物
  age: 65
  gender: 女性
  appearance: 上品なグレーのワンピースに、小さな真珠のネックレス。静かな佇まいだが、瞳に強い意志を宿している。
  personality: 穏やかで気品があるが、ある一点においてのみ頑固。過去の思い出を大切に抱えている。
  speech_style: 静かで落ち着いた話し方。相手を包み込むような慈愛に満ちている。
  background: かつて司馬誠一と深い絆で結ばれていたが、ある誤解によって長い年月、距離を置いていた。
  motivation: 司馬が自分に宛てていたはずの、最後のメッセージを受け取りたい。
  relationships:
  - name: 司馬 誠一
    relation: かつての親友であり、忘れられない人
  - name: 瀬名 奏
    relation: 思い出を繋いでくれた恩人
  arc: 長年の孤独と誤解から解放され、司馬への想いに区切りをつけて前を向くことができる。
