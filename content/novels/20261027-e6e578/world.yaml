title: 星図の迷子と、折れた剣の栞
genre: 本格ミステリー
tone: 穏やかで温かみのある日常の空気感
pov: 一人称
tense: 過去形
setting: 現代、街の片隅にある静かな古本屋「星屑の書架」
premise: 古本屋「星屑の書架」に、一冊の古い天体図が挟まった本が持ち込まれる。そこには、実際の夜空とは明らかに異なる、奇妙な配置の星々が描かれていた。さらに、本の間に挟まっていたのは、銀色に光る「折れた剣」の形をした小さな真鍮の栞。これは、誰かが意図的に残した暗号なのだろうか。わたしは、星の配置と栞の謎を紐解きながら、街に眠る優しい記憶の断片を探し始める。
themes:
- 記憶の継承
- 善意による誤解の解消
rules:
- 物語の中で殺人は一切起きない
- 謎解きは物理的な遺物と論理的な観察に基づく
plot_outline:
- '序盤: 常連客が置き忘れた一冊の本の中に、不自然な星図と折れた剣の栞を見つける。わたしは、その星図の「間違い」が単なる書き間違いではないという直感を得る。'
- '中盤: 星図の星の配置が、店内に並ぶ特定の古書たちのページ番号や文字を指し示していることに気づく。栞の剣の形状も、ある騎士物語の隠喩であることを突き止め、調査を進める。'
- '終盤: 星図が指し示す場所へ辿り着いたとき、かつてこの店を支えた店主が、ある大切な約束を守るために仕掛けた「時を超えたメッセージ」の全貌が明らかになる。'
- '結末: 誤解によって途切れていた人々の繋がりが、星図の迷子を救うように再び結ばれ、わたしは温かな気持ちで店に立ち続ける。'
style_notes: 一人称「わたし」による、軽やかで少しとぼけた語り口。古本の匂いや淹れたての紅茶の香りが漂ってくるような、五感に訴える描写を大切にする。複雑な謎を解き明かすプロセスは論理的に描きつつも、解決の結末は常に人の善意に光を当て、読者の心を解きほぐすような優しい文体を目指す。
