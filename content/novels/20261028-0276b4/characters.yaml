- name: エララ・フォン・ローゼスソーン
  role: 主人公
  age: 19
  gender: 女性
  appearance: かつての華やかさを残した、少し色褪せた銀髪と深い菫色の瞳。没落後も身だしなみには気を配っているが、ドレスの裾には綻びがある。
  personality: 気高く、芯が強い。没落の屈辱を抱えつつも、他者への慈愛を忘れない。一人称は「私」。
  speech_style: 格式高く、凛とした貴族的な口調。感情が高ぶると少し言葉が鋭くなる。
  background: かつてエテルナの社交界を彩った名門公爵家の令嬢。政争に巻き込まれ、家督と財産をすべて奪われ、現在は下層街で細々と暮らしている。
  motivation: 奪われた家族の誇りを取り戻すこと、そして父の失脚に隠された真実を暴くこと。
  relationships:
  - name: ジュリアン・ヴェイン
    relation: 不思議な縁を感じる協力者
  - name: アラリック・ド・ヴァロワ
    relation: 利害が一致した共闘相手
  arc: 個人の復讐心から、街全体の運命を背負う覚悟へと成長していく。
- name: ジュリアン・ヴェイン
  role: 主人公/謎の鍵
  age: 24
  gender: 男性
  appearance: 無造作な黒髪に、すべてを見透かすような澄んだ灰色の瞳。油汚れのついた作業着を纏い、常に懐に精密な工具を忍ばせている。
  personality: 冷静沈着で論理的。感情の起伏が乏しく見えるが、内側に熱い正義感を秘めている。一人称は「僕」。
  speech_style: 淡々としており、事実に基づいた簡潔な話し方。時計の機構に例えた表現を好む。
  background: 中央時計塔の近くで記憶を失った状態で発見された時計職人。卓越した技術を持つが、自分の過去については一切の記憶がない。
  motivation: 失われた記憶の断片を繋ぎ合わせ、自分がなぜこの街の「心臓」を知っているのかを知ること。
  relationships:
  - name: エララ・フォン・ローゼスソーン
    relation: 守るべき対象であり、理解者
  - name: アラリック・ド・ヴァロワ
    relation: 警戒しつつも、その志に共鳴する者
  arc: 過去の不在による空虚さから、自らの意志で「今」を刻む決意へと変化する。
- name: アラリック・ド・ヴァロワ
  role: 主人公/導き手
  age: 22
  gender: 男性
  appearance: 陽光を思わせる金髪と、意志の強さを感じさせる碧眼。旅慣れた外套の下には、かつての王族の証である紋章が隠されている。
  personality: カリスマ性があり、決断力に富む。しかし、亡命生活による孤独と、守れなかった国への罪悪感を背負っている。一人称は「俺」。
  speech_style: 自信に満ちた、人を惹きつける力強い話し方。時折、ふとした瞬間に哀愁を漂わせる。
  background: エテルナの外側にあった王国の第一王子。政変によって国を追われ、現在は正体を隠してエテルナに潜伏している。
  motivation: エテルナの陰謀を暴き、停滞した世界に「夜明け」をもたらすこと。
  relationships:
  - name: エララ・フォン・ローゼスソーン
    relation: 共に運命を切り拓く戦友
  - name: セラフィナ伯爵夫人
    relation: 排除すべき宿敵
  arc: 逃亡者としての自分を捨て、真の指導者として人々を導く覚悟を決める。
- name: セラフィナ伯爵夫人
  role: 敵役
  age: 42
  gender: 女性
  appearance: 完璧に整えられた黒髪と、冷徹なダイヤモンドのような瞳。常に夜の闇を象徴するような漆黒のドレスを纏っている。
  personality: 極めて計算高く、冷酷。美しさと秩序が永遠に続くことを至上の価値と考えている。一人称は「わたくし」。
  speech_style: 優雅で慇懃無礼。相手を褒めながらも、その実、底知れぬ圧力を与える話し方。
  background: エテルナの支配層の一員。街の「永遠の黄昏」を維持することで、自身の権力と美を永劫のものにしようと画策している。
  motivation: 「最終列車」の到来を阻止し、街の停滞した美しさを永遠に固定すること。
  relationships:
  - name: エララ・フォン・ローゼスソーン
    relation: 秩序を乱す不快な存在
  - name: アラリック・ド・ヴァロワ
    relation: 計画を脅かす最大の脅威
  arc: 絶対的な支配者としての慢心が、街の崩壊と共に瓦解していく。
