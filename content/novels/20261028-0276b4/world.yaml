title: 星霜の帳と真夜中の円舞（ワルツ）
genre: 群像劇
tone: 優雅、華麗、耽美、幻想的
pov: 三人称
tense: 過去形
setting: 永遠の黄昏に包まれた浮遊都市「エテルナ」
premise: 太陽の昇らぬ「眠らない街」エテルナでは、貴族たちが宝石を散りばめた衣装を纏い、終わりのない舞踏に興じている。没落した公爵令嬢、記憶を失った時計職人、そして亡命中の王子。異なる運命を背負う三人が、街の命運を左右する巨大な陰謀の中で交錯する。彼らの前に現れたのは、伝説に語られる「最終列車」——それは、この街の終焉を告げるものか、あるいは再生への鍵か。
themes:
- 運命の交錯
- 美しき滅びと再生
rules:
- 街の灯りは「星屑の雫」と呼ばれる魔力資源によって維持されており、その枯渇は街の崩壊を意味する
- 社交界における地位は、纏う装束の華麗さと、舞踏会における舞踏の完成度によって決定される
- 伝説の「最終列車」は、街を支配する音楽が完全に途絶えた瞬間にのみ、中央駅の軌道上に姿を現す
plot_outline:
- '序盤: 豪華絢爛な仮面舞踏会の準備が進む中、街の灯りを支える結晶が盗まれる事件が発生する。没落令嬢、時計職人、亡命王子の三人が、それぞれの目的を抱えながら、華やかな社交界の裏側に潜む闇へと足を踏み入れる。'
- '中盤: 煌びやかなドレスやタキシードが舞う舞踏会の舞台裏で、権力者たちによる陰謀が加速する。三人は偶然の重なりによって奇妙な協力関係を築き、街が「眠らない」理由に隠された、残酷で美しい真実を知る。'
- '終盤: 陰謀の渦中で街の音楽が静まり返り、ついに中央駅に「最終列車」がその姿を現す。混乱に陥る舞踏会の中で、三人は己の愛と信念、そして街の未来を懸けた究極の選択を迫られる。'
- '結末: 列車への乗車と、街の秩序の崩壊。古い夜が終わりを告げ、初めての朝焼けがエテルナを照らす中、三人が辿り着いた新たな運命の地が描かれる。'
style_notes: 絹の擦れる音、宝石の煌めき、香水の芳香、そしてダンスのステップを、装飾的な語彙を用いて執拗なまでに美しく描写すること。登場人物の心情は、その日の衣装の質感や舞踏会の熱気と重ね合わせて叙情的に綴り、読者がその華やかな世界に溺れるような優雅な文体を維持する。
