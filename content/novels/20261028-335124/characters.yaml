- name: 如月 暁人 (きさらぎ あきと)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無造作な黒髪に、どこか虚無感を漂わせた鋭い瞳。細身だが、バスケで鍛えられたしなやかな筋肉を持つ。
  personality: 冷笑的で無気力。かつての情熱を失い、周囲に壁を作っているが、内面には激しい飢餓感を隠し持っている。一人称は「俺」。
  speech_style: 短く、抑揚の少ないぶっきらぼうな話し方。
  background: かつて「神童」と呼ばれた天才バスケ少年。父の急逝と、それに関連する挫折からバスケを捨て、廃墟のような工業地帯で虚無的に過ごしていた。
  motivation: 父の遺した未投函の手紙と遺言を完遂し、父が愛したバスケの「答え」を見つけること。
  relationships:
  - name: 如月 健造
    relation: 亡き父
  - name: 九条 蓮
    relation: 宿命のライバル
  arc: 喪失感による虚無の状態から、父の意志を継ぎ、己の限界を超えて魂を燃やす熱狂的なプレイヤーへと変貌する。
- name: 九条 蓮 (くじょう れん)
  role: 敵役
  age: 18
  gender: 男性
  appearance: 長身で圧倒的な威圧感を放つ。銀髪に近い明るい髪色と、全てを見透かすような冷徹な眼差し。
  personality: 絶対的な強者としてのプライドを持つ。バスケを「力の証明」と捉える冷酷なリアリスト。一人称は「俺」。
  speech_style: 尊大で、相手を見下すような余裕のある口調。
  background: ストリートの頂点に君臨する絶対王者。再開発で消えゆく街の「聖地」を守るかのように、そのコートを支配している。
  motivation: 自分を脅かす存在を排除し、自らの絶対性を証明し続けること。
  relationships:
  - name: 如月 暁人
    relation: 唯一、自身の牙を剥かせた挑戦者
  arc: 暁人の異常な執念に触れ、単なる力の誇示ではない「バスケの真髄」に直面し、王としての矜持をかけて激突する。
- name: 早乙女 雫 (さおとめ しずく)
  role: 脇役
  age: 17
  gender: 女性
  appearance: ショートカットで活動的な服装。街の風景に馴染む、明るく健康的な印象。
  personality: 真っ直ぐで観察眼が鋭い。暁人の変化を誰よりも早く察知する。一人称は「私」。
  speech_style: 快活で、ストリートらしい砕けた話し方。
  background: 工業地帯の商店街の娘。暁人の父のことも知っており、彼が再びボールを握るきっかけとなる情報を共有する。
  motivation: 変わりゆく街の中で、大切な記憶（コートやバスケ）が消えてしまうのを防ぎたい。
  relationships:
  - name: 如月 暁人
    relation: 幼馴染であり、再起を見守る理解者
  arc: 暁人の孤独に寄り添い、彼が再び外の世界（コート）へと踏み出すための精神的な支えとなる。
- name: 権藤 大河 (ごんどう たいが)
  role: 脇役
  age: 19
  gender: 男性
  appearance: がっしりとした巨体と、拳に刻まれた無数のマメ。野性味溢れる風貌。
  personality: 荒っぽいが義理堅い。負けを認められる潔さを持つ。一人称は「俺」。
  speech_style: 野太く、威勢の良い荒っぽい口調。
  background: 中盤に暁人が立ち向かう、エリアの有力プレイヤー。圧倒的なパワーで街を支配していたが、暁人に完敗する。
  motivation: 自分の縄張りであるコートを守ること。
  relationships:
  - name: 如月 暁人
    relation: 圧倒的な執念を見せつけられた敗者
  arc: 暁人に完敗することで、彼の「異常なまでの飢餓感」を目の当たりにし、彼が真の王へ至る道筋を物語の視点から語る観測者となる。
