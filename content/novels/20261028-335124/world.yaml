title: 鉄錆のコートに吠えろ
genre: スポーツ青春
tone: 汗と泥が舞う、熱量最大級の熱血スポーツ
pov: 三人称
tense: 基本は過去形、試合中は現在形
setting: 現代日本、再開発が進む寂れた工業地帯のストリートバスケットボールコート
premise: かつての神童でありながら絶望しバスケを捨てた少年が、亡き父が遺した「届かなかった手紙」と、そこに記された最後の願い（遺言）に突き動かされる。泥にまみれたストリートの頂点を目指し、己の限界を突破するための激闘が始まる。魂を削り、心拍数を跳ね上げる、究極の1対1（ワンオンワン）の物語。
themes:
- 再起と情熱
- 父と子の絆
rules:
- 試合は3対3のストリートルール。激しい身体接触が許容される泥臭いスタイル
- 敗者は勝者にコートの支配権を譲り、二度とそのコートに立てないというストリートの暗黙の掟がある
plot_outline:
- '序盤: バスケを捨てて虚無的に生きる主人公が、遺品整理中に父がかつてのライバルに宛てた未投函の手紙と、息子へ宛てた遺言状を発見し、再びボールを握る。'
- '中盤: 街の至る所にある「コート」を巡り、個性的なストリートプレイヤーたちと死闘を繰り広げる。一度、圧倒的な実力者に完敗した相手側の視点から、主人公の異常なまでの執念と飢餓感を描き出す。'
- '終盤: 都市開発で壊される運命にある、父がかつて愛した「聖地」のコートで、最強の王者との最終決戦に挑む。'
- '結末: 肺が焼けるほどの激走の末、限界を超えたラストショットを決め、父の魂と共に頂点に立つ。バスケを通じて、喪失した自己を完全に奪還する。'
style_notes: 「汗が飛ぶ」「肺が焼ける」「心臓が早鐘を打つ」といった身体的感覚を強調する。試合シーンでは現在形を用い、実況のような速度感とリズム感のある短文を畳み掛ける。負け側の絶望と悔しさを克明に描き、勝利の価値を最大化させる。
