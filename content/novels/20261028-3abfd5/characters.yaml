- name: エリオ・ヴァレンタイン
  role: 主人公
  age: 15
  gender: 男性
  appearance: 灰色の瞳と、少し癖のある茶髪。古びた革のエプロンを身につけ、常に奇妙な無線機を抱えている。
  personality: 慎重で思慮深いが、未知のものに対する好奇心が強い。一人称は「僕」。
  speech_style: 丁寧だが、どこか孤独を感じさせる落ち着いた話し方。
  background: 霧に包まれた村で古物商を営む孤児。世界の記憶が失われていく中で、物を通じて過去の断片を集めることを日課としていた。
  motivation: ラジオから流れる旋律の正体を探り、失われゆく世界と人々の記憶を守ること。
  relationships:
  - name: セレナ・ルミナス
    relation: 旅の同行者であり、守るべき存在
  - name: ゼノス・ヴォイド
    relation: 対立する宿敵
  arc: 記憶を失うことを恐れ、慎重に生きてきた少年が、世界の真理に触れることで、自らの記憶を代償にしてでも「痛みと共に生きる未来」を選択する強さを得る。
- name: セレナ・ルミナス
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような銀髪と、夜明けの光を宿したような瞳。肌がわずかに石のように白濁している。
  personality: 穏やかで慈悲深いが、自身の記憶がないことに深い虚無感を抱いている。一人称は「私」。
  speech_style: 静かで、時に詩的な響きを持つ、柔らかな口調。
  background: 記憶を失ったまま「聖女」として扱われていた少女。彼女の失われた記憶そのものが、世界の崩壊を止めるための鍵を握っている。
  motivation: 自分が何者であるかを知り、この世界の理を受け入れること。
  relationships:
  - name: エリオ・ヴァレンタイン
    relation: 信頼を寄せる旅のパートナー
  arc: 空っぽの器のような存在から、エリオとの旅を通じて「記憶の痛み」こそが人間である証だと悟り、自らの存在を世界へ捧げる覚悟を決める。
- name: ゼノス・ヴォイド
  role: 敵役
  age: 35
  gender: 男性
  appearance: 漆黒の甲冑に身を包み、顔は常に無表情な金属の仮面で覆われている。巨大な記憶の鎌を携えている。
  personality: 冷酷かつ合理的。人類の苦しみから解放するには「忘却」こそが唯一の救済であると狂信的に信じている。一人称は「我」。
  speech_style: 重々しく、有無を言わせぬ断定的な口調。
  background: 記憶を狩る異形の騎士団「忘却の執行者」の団長。星の塵による石化を、神が与えた慈悲として執行している。
  motivation: 全人類から記憶を剥ぎ取り、苦痛のない永遠の安寧（石化の世界）をもたらすこと。
  relationships:
  - name: エリオ・ヴァレンタイン
    relation: 世界の理を乱す忌むべき存在
  - name: セレナ・ルミナス
    relation: 計画完遂のための重要な鍵
  arc: 完璧な救済を信じて疑わなかったが、エリオの自己犠牲的な行動と、苦しみの中でもがきながら生きる人間の姿を前に、自らの信念が揺らぎ始める。
- name: カイ・ガスト
  role: 相棒/ガイド
  age: 24
  gender: 男性
  appearance: 風を模したマントを羽織り、使い古された短剣とコンパスを持つ放浪者。鋭い眼光が特徴。
  personality: 皮肉屋で現実主義、一見すると利己的。しかし、根は情に厚い。一人称は「俺」。
  speech_style: ぶっきらぼうで、軽口を叩くような荒っぽい話し方。
  background: かつて渡り鳥を追っていた伝説の調査員。ある事件で仲間と記憶を失い、現在は霧の中を彷徨う放浪者となっている。
  motivation: 失われた「風の音」と、かつての仲間の記憶を取り戻すこと。
  relationships:
  - name: エリオ・ヴァレンタイン
    relation: 世話の焼ける協力者
  arc: 他人の記憶には無関心を装っていたが、エリオたちの旅に同行することで、失った過去を懐かしむのではなく、新しい記憶を刻むために戦う姿勢へと変化する。
