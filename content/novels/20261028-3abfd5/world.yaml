title: 終焉の奏鳴（レクイエム）―渡り鳥の聖歌と夜明けの残光―
genre: 伝奇
tone: 荘厳、哀愁、神秘的
pov: 三人称
tense: 過去形
setting: 黄昏の刻が永劫に続く、霧に包まれた浮遊大陸「アイテール・ノア」と、その下に広がる廃都。
premise: 天界から降り注ぐ『星の塵』が、人々の記憶を侵食し、精神を石化させる呪われた世界。人々は、失われた記憶を繋ぎ止めるために、空を渡る聖なる鳥の鳴き声に耳を澄ませている。ある夜、古びた無線機から「夜明けのラジオ」が奇跡的に響き渡り、世界を滅ぼす予言の旋律が流れ出す。記憶を狩る者と、失われた言葉を探す少年が、世界の真理を巡る旅へと足を踏み入れる。
themes:
- 忘却と継承
- 運命への抗い
- 信仰と真実
rules:
- 『星の塵』に触れた者は、その者の最も幸福な記憶から順に、結晶となって身体を覆い尽くす。
- 渡り鳥は、失われた魂の欠片を運ぶ使者であり、その飛翔ルートは世界の理（ことわり）を規定する。
- 『夜明けのラジオ』は、存在しないはずの『光の時代』の音声を拾う、禁忌の魔導具である。
plot_outline:
- '序盤: 記憶を失い、石像へと変わりつつある村で、古物商の少年エリオは、奇妙な旋律を奏でる「夜明けのラジオ」を拾う。それは、かつて神話に記された『渡り鳥の歌』を奏でていた。'
- '中盤: ラジオの音を頼りに、エリオは記憶を狩る異形の騎士団「忘却の執行者」に追われながら、伝説の渡り鳥の棲み処を目指す。旅の途中で、記憶を失った聖女セレナと出会い、彼女の失われた記憶が世界の崩壊を防ぐ鍵であることを知る。'
- '終盤: 世界の果て、天空の神殿にて、エリオたちは『星の塵』の正体が、神が人類に与えた「忘却という名の救済」であったことを突き止める。執行者との決戦の中、ラジオから流れる旋律が、石化した世界を揺り動かす。'
- '結末: エリオは自らの記憶を代償に、ラジオの旋律を世界へ解き放つ。世界は夜明けを迎え、人々は苦痛に満ちた記憶と共に、再び歩み始める。空には、新たな季節を告げる渡り鳥の影が舞っていた。'
style_notes: 重厚な語り口を徹底すること。神話的な比喩を用い、「古の詩によれば……」といった伝承の引用を随所に挟む。地名や固有名詞（例：エーテル・ヴォイド、刻限の鐘）は、響きに重みを考慮して設定する。会話文は、キャラクターの出自（高貴な聖女、粗野な商人、冷徹な騎士）に合わせて格調や語彙を厳格に使い分ける。
