- name: カイ・フェンリス
  role: 主人公
  age: 22
  gender: 男性
  appearance: 鋭い眼光を持つ鷹型の獣人。大きな翼は銀色に輝き、風を切るための軽量な革製アーマーを纏っている。
  personality: 冷静沈着で責任感が強い。種族の誇りを重んじるが、内面には空の向こうへの好奇心を秘めている。一人称：俺
  speech_style: 無駄を削ぎ落とした軍人らしい簡潔な話し方。
  background: 浮遊大陸の防衛軍に所属する偵察兵。渡り鳥の異常な動きを最初に察知し、不穏な予兆を感じ取る。
  motivation: 空の秩序を守ること、そして異常な天候の正体を突き止めること。
  relationships:
  - name: ベル・ギアレット
    relation: 後に運命を共にする、地上で見つけた異端の技術者
  - name: ゼノス・ヴァルガ
    relation: 上官であり、対立する思想を持つ宿敵
  arc: 種族の防衛という限定的な使命から、種族の境界を超えて世界そのものを守るという大局的な視点へと成長する。
- name: ベル・ギアレット
  role: 主人公
  age: 17
  gender: 女性
  appearance: 小柄な亜人。常に油汚れのついた作業着を着ており、頭には大きなゴーグルを乗せている。工具ベルトを腰に巻いている。
  personality: 実利主義で手先が器用。困難な状況でも機械の仕組みに思考を逃がす癖がある。一人称：私
  speech_style: 語尾が少し跳ねるような、活気のある早口な話し方。
  background: 雲海に沈んだ旧世界の残骸付近で、廃棄された機械を修理して暮らす技師。資源不足に苦しむ地上コミュニティの支え。
  motivation: 壊れた機械を直すこと、そして地上の人々が飢えないための資源確保。
  relationships:
  - name: エリアス・ノイズ
    relation: ラジオを通じて、唯一心が通じ合うと感じている遠くの存在
  arc: 「自分たちの生存」のための技術から、「種族間を繋ぐ」ための技術へと、その目的を変化させていく。
- name: エリアス・ノイズ
  role: 主人公
  age: 20
  gender: 中性
  appearance: 線の細い少年のような容姿。常に大きなヘッドフォンを首にかけており、指先は常にインクや機械の摩耗で汚れている。
  personality: 穏やかで直感に優れる。世界のノイズの中に真実を見出そうとする探求者。一人称：僕
  speech_style: 音楽を流す時のように、抑揚のある心地よい、語りかけるような話し方。
  background: 辺境の廃墟に設置された「夜明けのラジオ」の唯一の放送員。情報の断絶した世界で、唯一の通信手段を維持している。
  motivation: 世界中の人々に、真実の音（信号）を届けること。
  relationships:
  - name: カイ・フェンリス
    relation: 空からの信号を拾う、未知の受信者
  - name: ベル・ギアレット
    relation: 地上の音を拾い上げる、大切なリスナー
  arc: ただ情報を伝えるだけの観測者から、ノイズの中に「共存の旋律」を見出し、自らを発信源として繋ぎ止める役割へと進化する。
- name: ゼノス・ヴァルガ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 筋骨隆々とした獣人の将軍。全身を重厚な蒸気駆動の甲冑で固め、威圧感を放っている。
  personality: 徹底した実力主義者で、種族の生存のためには他種族の犠牲も厭わない冷酷さを持つ。一人称：我
  speech_style: 重々しく、命令口調で威圧的な話し方。
  background: 浮遊大陸の軍事指導者。資源枯渇を背景に、地上への侵攻による資源確保を画策している。
  motivation: 種族の絶対的な生存権の確立と、大陸の覇権確立。
  relationships:
  - name: カイ・フェンリス
    relation: 期待しているが、その迷いを許さない部下
  arc: 「力による支配」が崩壊する嵐を目の当たりにし、旧来の価値観が通用しない新しい世界の到来を突きつけられる。
