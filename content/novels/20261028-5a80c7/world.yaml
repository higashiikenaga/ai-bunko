title: 風の喉笛、鉄の鼓動
genre: 群像劇
tone: 重厚で野性的、かつ詩的
pov: 三人称多視点
tense: 過去形
setting: 巨大な浮遊大陸と、雲海に沈んだ旧世界の残骸が混在する蒸気文明時代
premise: 空を飛ぶ翼を持つ獣人と、地上で鉄の歯車を回す土着の亜人たちが、限られた資源を巡って衝突を繰り返す世界。ある時、数十年ぶりに『渡り鳥』たちが季節外れの北上を開始し、天候の異常と地政学的な動乱の予兆を告げる。辺境のラジオ局から流れる『夜明けのラジオ』の不規則なノイズが、分断された種族たちを予期せぬ運命へと繋いでいく。種族の誇りと生存の境界線で、彼らは何を選択するのか。
themes:
- 種族間の生存競争と共生
- 変革の予兆と時代の転換
rules:
- 獣人の嗅覚は感情の揺らぎ（アドレナリンや恐怖の匂い）を鋭敏に察知する
- 亜人の機械技術は魔力を帯びた鉱石を動力源とする
- 渡り鳥の回帰は天候と世界の均衡の指標となる
plot_outline:
- '序盤: 翼を持つ獣人の偵察兵、地上で機械を修理する小柄な亜人の技師、そしてラジオ局の若き放送員の視点を交錯させ、渡り鳥の異常な集団移動と、それに関連する不穏な軍事行動を描く。'
- '中盤: 資源を巡る種族間の小競り合いが激化し、各視点の登場人物たちが偶然にも同じ「嵐の到来」という危機に直面する。夜明けのラジオから流れる謎の信号が、衝突を回避するための鍵となることが示唆される。'
- '終盤: 巨大な嵐が浮遊大陸を襲い、種族間の対立が頂点に達する中、主人公たちはそれぞれの立場から、個別の生存ではなく「種族を越えた共存」のための決断を迫られる。'
- '結末: 嵐が去った後の新しい世界で、異なる種族が同じ空を見上げ、互いの匂いと音を認め合いながら、新たな秩序の兆しの中に生きていく姿を描く。'
style_notes: 獣人の視点では、風に乗る血の匂い、湿った土の香り、獲物の震えによる微かな空気の振動を執拗に描写すること。亜人の視点では、蒸気の噴出音、歯車の噛み合う硬質な響き、金属の冷たさを強調する。種族間の軋轢は、単なる対立ではなく、感覚の決定的な違いから来る「理解の不可能性」として骨太に描くこと。
