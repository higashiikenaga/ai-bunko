- name: リナ
  role: 主人公
  age: 16
  gender: 女性
  appearance: 煤に汚れた灰色の衣服に、旧時代の粗末な機械装甲を纏っている。意志の強さを感じさせる鋭い瞳と、短く切り揃えた銀髪が特徴。
  personality: 情熱的で献身的。兄への想いが行動原理のすべてであり、目的のためなら自らを危険にさらすことを厭わない。一人称は「私」。
  speech_style: ぶっきらぼうだが、感情が乗りやすく切迫感がある。上層の人間に対しては攻撃的な口調になる。
  background: 下層の貧民街でカイと共に育つ。生まれ持った高い共鳴能力により、禁忌とされる旧時代の兵装を起動させることができた。
  motivation: 供犠者に選ばれた兄カイを救い出し、彼を奪おうとする都市のシステムを破壊すること。
  relationships:
  - name: カイ
    relation: 最愛の双子の兄
  - name: アリスター
    relation: 憎むべき都市の管理責任者
  arc: 兄を救いたいという個人的な願いから始まり、最終的には都市全体の欺瞞を終わらせるという大義を背負い、真の夜空（自由）を受け入れる。
- name: カイ
  role: 物語の鍵を握る重要人物
  age: 16
  gender: 男性
  appearance: リナと対照的に儚げで白い肌を持つ。祭りの儀式のために白い聖衣を纏わされ、瞳には人工太陽の光を反射する金色が混じっている。
  personality: 穏やかで自己犠牲的。リナの激しさを宥める役割を担っており、彼女にだけは悲しんでほしくないと願っている。一人称は「僕」。
  speech_style: 静かで丁寧。絶望的な状況にあっても、相手を気遣う優しい話し方をする。
  background: リナの双子の兄。共鳴能力が極めて高く、今回の「祭りの夜」に最も適した供犠者として選出された。
  motivation: 自分が犠牲になることで、妹のリナがこの残酷な都市で生き延びられることを願う。
  relationships:
  - name: リナ
    relation: 守りたい双子の妹
  - name: アリスター
    relation: 自分を「部品」として扱う監視者
  arc: 運命に従うだけの受動的な存在から、最後には自らの意志でシステムを破壊し、リナと共に未知の世界へ踏み出す決意をする。
- name: アリスター
  role: 敵役
  age: 42
  gender: 男性
  appearance: 汚れ一つない純白の軍服に身を包み、冷徹な眼差しを持つ。常に完璧な身だしなみを維持しており、権威の象徴である金の冠を模した装飾品を付けている。
  personality: 極めて合理的で冷酷。少数の犠牲で多数の生存を維持することを「正義」と信じて疑わない。一人称は「私」。
  speech_style: 慇懃無礼で論理的。相手を突き放すような、静かだが威圧感のある話し方。
  background: 垂直都市アステリズムの最高管理責任者。都市の心臓部の真実と、光を維持するための血の代償を熟知している。
  motivation: 都市の秩序と人工太陽の光を永続的に維持し、文明の崩壊を防ぐこと。
  relationships:
  - name: リナ
    relation: 秩序を乱す不確定要素（害虫）
  - name: カイ
    relation: 都市を駆動させるための最高品質の燃料
  arc: 絶対的な正義を信じていたが、リナの盲目的なまでの情愛と叛逆によって、自身の築き上げた偽りの秩序が崩壊していく恐怖と虚無を味わう。
- name: エラ
  role: 相棒/ガイド
  age: 27
  gender: 女性
  appearance: 顔に大きな火傷の痕があり、片腕が粗末な義手になっている。ボロボロのコートの下に、かつての反乱軍の紋章が入った服を着ている。
  personality: 皮肉屋で現実主義。過去に絶望を味わっているため冷めているが、根は情に厚く、リナの危うさに自分のような過去を重ねて放っておけない。一人称は「あたし」。
  speech_style: ぶっきらぼうで口が悪い。下層の俗語を多用する。
  background: かつて都市のシステムに反旗を翻したが、仲間をすべて失い、唯一生き残った元反乱兵。都市の構造と隠し通路に精通している。
  motivation: 死んでいった仲間たちへの贖罪として、リナをサポートし、この呪われた連鎖を断ち切ること。
  relationships:
  - name: リナ
    relation: 危なっかしい後輩のような存在
  - name: アリスター
    relation: かつて自分からすべてを奪った仇敵
  arc: 諦めて死を待っていた人生から、リナという光に触れることで再び「戦うこと」の意味を見出し、最後には彼女の道を切り拓くために自らを盾にする。
