title: 灰の冠と、偽りの夜明け
genre: ディストピア
tone: 冷徹で絶望的、救いのない美しさ
pov: 三人称
tense: 過去形
setting: 垂直都市「アステリズム」。上層は人工太陽が照らす永遠の白昼、下層は廃棄物と煤に覆われた永久の黄昏に閉ざされた階層社会。
premise: 都市の生命維持装置を稼働させるため、年に一度「祭りの夜」に選ばれた生贄が魂を捧げる世界。選ばれたのは、極めて高い共鳴能力を持つ双子の少年、カイとリナだった。妹のリナは兄を救うため、都市の欺瞞を暴く過酷な叛逆へと身を投じる。しかし、光を維持するには血が必要であり、光を絶つにはすべてを失わなければならない。
themes:
- 偽りの救済と真の自由
- 血縁の絆と自己犠牲
rules:
- 都市の光は『共鳴者』の生命エネルギーを燃料としている
- 双子の共鳴は単体よりも数倍の出力を生むが、その代償として寿命を劇的に削る
- 上層階級は光の恩恵を独占し、下層の犠牲を『神聖な儀式』として正当化している
plot_outline:
- '序盤: 祭りの夜を目前に、カイが「供犠者」に選ばれる。妹のリナは彼を救うため、都市の禁忌である旧時代の兵装を手に取る。'
- '中盤: 都市の深部へ潜入するリナ。そこで目にしたのは、光を維持するために無数の犠牲者が魂を啜られる、悍ましい機械の心臓だった。'
- '終盤: 祭りの絶頂。リナは中央制御塔に到達し、カイの命を救うか、都市のシステムを破壊して世界を闇に落とすかの選択を迫られる。'
- '結末: 二人は共にシステムを破壊する。人工の太陽は消え、都市は崩壊するが、リナの瞳には初めて、本物の夜空に輝く星が見えた。'
style_notes: 硬質で無機質な地の文。情景描写は光と影、熱と冷たさの対比を強調すること。台詞は削ぎ落とし、鋭利な刃物のように短く書く。登場人物の感情は、叫びではなく、剥き出しの意志の強さとして表現せよ。
