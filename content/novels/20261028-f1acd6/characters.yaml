- name: カイ
  role: 主人公
  age: 17
  gender: 男性
  appearance: 痩身で、亡き師から受け継いだ古びた灰色の外套を纏っている。意志の強い瞳をしているが、記憶を売るたびにその色彩が淡くなっていく。
  personality: 真面目で献身的。目的のためには自己犠牲を厭わない危うさを持つ。一人称は「僕」。
  speech_style: 丁寧だが、芯の強い話し方。感情が高ぶると幼さが露呈する。
  background: 古代術式を研究していた呪術師の弟子。師を亡くし、その遺志である「空への回帰」を果たすため、禁忌の地である忘却の市へと足を踏み入れた。
  motivation: 失われた「翼」の術式を取り戻し、渡り鳥たちが再び空を舞う世界を取り戻すこと。
  relationships:
  - name: 無銘の商人
    relation: 取引相手であり、憎悪と好奇心の対象
  - name: リリア
    relation: 市で出会った共鳴者であり、唯一の心の拠り所
  arc: 力を求める執着から始まり、最終的には自己のアイデンティティさえも捨てて世界を救うという究極の利他主義へと至る。
- name: 無銘の商人
  role: 敵役
  age: 不明
  gender: 男性（に見える）
  appearance: 常に表情の変わらない白い仮面を被り、贅沢だが色褪せた多色の絹衣を纏っている。影が不自然に揺らめいている。
  personality: 享楽的で計算高い。記憶を「通貨」として愛でる収集家。一人称は「私」。
  speech_style: 慇懃無礼で演劇的な口調。相手の精神的な弱点を突くような言い回しを好む。
  background: 忘却の市の管理運営者。かつては人間だったが、膨大な記憶を喰らいすぎたため、個としての輪郭を失い「市」というシステムそのものと化した。
  motivation: 最高純度の「絶望」や「愛」といった記憶を集め、自らが完全な神へと昇華すること。
  relationships:
  - name: カイ
    relation: 極上の記憶を持つ「最高の顧客」として弄んでいる
  arc: 絶対的な支配者として君臨していたが、カイが提示した「無（存在の消去）」という価値観によって、自身の存在根拠を揺さぶられる。
- name: リリア
  role: 相棒/犠牲者
  age: 18
  gender: 女性
  appearance: 透き通るような白い肌と、焦点の定まらない虚ろな瞳。記憶の欠落により、時折自分の名前さえ思い出せないため、首に名前を書いた札を下げている。
  personality: 穏やかで儚げ。忘却への恐怖を抱えながらも、他者への慈愛を忘れない。一人称は「私」。
  speech_style: 囁くような静かな話し方。言葉を途中で忘れることがあり、しばしば沈黙が挟まる。
  background: 大切な人を救うために記憶を売りすぎた結果、魂の輪郭が摩耗し、「空蝉（うつせみ）」になる寸前の少女。
  motivation: 自分が何を、誰を愛していたのかという「最後の一片の記憶」を買い戻すこと。
  relationships:
  - name: カイ
    relation: 同じ喪失感を共有する理解者
  - name: 無銘の商人
    relation: 魂を切り売りさせられた搾取関係
  arc: 絶望の中でカイと出会い、再び「誰かを想うこと」の意味を取り戻すが、最終的にカイの道を切り拓くための鍵となり、記憶の鳥へと昇華する。
