title: 噤みの鳥、忘却の市にて
genre: 異世界ファンタジー
tone: 重厚、陰鬱、伝奇的
pov: 三人称
tense: 過去形
setting: 浮遊大陸「遷界（せんかい）」、常に薄霧に覆われ、高度によって術式の密度が異なる世界
premise: 空を飛ぶ術を失った「渡り鳥」の死骸が降り注ぐ世界。人々は己の最も大切な記憶を対価に、異能を授かる「忘却の市」へと足を踏み入れる。若き呪術師の少年は、失われた翼を取り戻すため、禁忌の術式を求めて市を彷徨う。しかし、記憶を売る行為は、その者の魂の輪郭を摩耗させ、やがて「無」へと帰す呪いでもあった。
themes:
- 喪失と自己の定義
- 代償を伴う力の真理
rules:
- 術の発動には、必ず同等以上の価値を持つ『記憶』または『感覚』を対価として捧げねばならない。
- 忘却の市では、取引された記憶は物質化され、黄金の羽を持つ渡り鳥の姿となって空を舞う。
- 術式は言語化された『言霊』によって固定され、一度綴られた術式は使用者の精神を蝕む。
- 記憶を失いすぎた者は『空蝉（うつせみ）』となり、自我を持たぬ術の残滓と化す。
plot_outline:
- '序盤: 術師の少年・カイは、亡き師の遺志を継ぎ、失われた古代術式を探して「忘却の市」へと辿り着く。彼は翼を求めるあまり、自身の幼少期の記憶を対価に、風を操る術を買い取る。'
- '中盤: 市の運営者である「無銘の商人」の正体を追う中で、カイは記憶を喰らうことで繁栄する市の歪んだ構造を知る。渡り鳥の群れが、死者の記憶を運ぶ生贄であることが判明し、カイはかつての友が「空蝉」となった姿を目撃する。'
- '終盤: カイは究極の術式「天墜（てんつい）」を起動させるため、自らの「存在そのもの」を対価に差し出す決断を迫られる。市の中心部で、巨大な記憶の鳥と激しい術式戦を展開する。'
- '結末: 術式は成就し、空には再び渡り鳥が舞うが、カイは術の代償として、自分が誰であったか、何を成したかさえも忘却する。ただ、空を見上げる名もなき放浪者として、新しい物語の断片を拾い集める姿で幕を閉じる。'
style_notes: 文体は、静謐ながらも緊張感を孕んだ伝奇的な筆致とする。術式の発動描写においては、「其の術、天を衝き、理を穿つ」といった古風な言い回しを用い、術の行使に伴う肉体的・精神的な苦痛を克明に描く。緊迫した戦闘場面では、一文を極限まで短く切り、読者の呼吸を制御せよ。術の代償が支払われる瞬間は、残酷なまでの美しさを強調すること。
