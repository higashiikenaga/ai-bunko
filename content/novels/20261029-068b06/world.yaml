title: 碧落の再同期：蒼い鳥が運ぶ空の遺言
genre: 青春恋愛
tone: 幻想的なデジタル静謐さと、加速するシンクロの疾走感
pov: 三人称
tense: 過去形
setting: 現実世界（大学生になった澪の日常）と、次世代アップデート版仮想空間『SKY EDEN Next』
premise: ハルの消失から数年後、澪の脳内に刻まれた「生物学的記憶」が、新システムへの不可視の鍵となる。アップデートされた仮想世界に潜む、ハルが遺した「デジタル遺言」の断片を辿る旅が始まる。現実と仮想の境界が再び崩れ、二人は物理法則を超えた再会を目指すが、それは世界の理を書き換える危険な試みだった。
themes:
- 記憶の継承
- 現実と仮想の融和
rules:
- 生物学的記憶（バイオ・メモリ）は、システム上の特権IDとして機能し、管理者の検閲を回避して深層領域へアクセスできる。
- 消去されたはずのデータは「記憶の渡り鳥」としてサーバー間を回遊しており、特定の同期率（シンクロ率）に達したユーザーのみが捕捉可能。
- 現実世界での過度な同期は、視覚的なグリッチ（ノイズ）を発生させ、精神的な境界線を曖昧にする。
plot_outline:
- '序盤: 大学生活を送る澪は、日常の風景にデジタルノイズが混じる現象に悩まされていた。ある日、最新版『SKY EDEN Next』への招待状と共に、かつてのハルの声を模したシステムメッセージを受信し、彼が遺した「遺言」の断片を求めて再び仮想世界へダイブする。'
- '中盤: 仮想世界で「記憶の渡り鳥」となったハルの断片を追いかける澪。断片を集めるたびに、前作では語られなかったハルの真の目的と、彼が澪に託した最後の願いが明らかになる。同時に、異常な同期率を示す澪を、システム検閲官が「特異点」としてロックオンし、追跡を開始する。'
- '終盤: 全ての断片を集めた澪は、世界の最深部である『特異点：零の空』へと辿り着く。そこで彼女は、ハルを仮想世界の住人として復元させるか、あるいは彼を自分の意識に統合して現実へ連れ出すかの選択を迫られる。システムによる強制パージが開始される中、澪は自らの意識を媒介にした禁忌の「逆同期」を試みる。'
- '結末: ハルは完全なデータとしてではなく、澪の意識に寄り添う「不可視のパートナー」として再構成される。現実世界の空に、かつてないほど鮮やかな青い光の軌跡が走り、澪は仮想と現実のどちらにも縛られない、新しい共生のかたちを見出していく。'
style_notes: '仮想世界では「[System: Sync Rate 85%... Loading Fragments]」のようなシステムログを随所に挿入し、スピード感のある文体で描く。対して現実世界では、温度感の低い静かな描写を徹底し、二つの世界のコントラストを強調する。現実の空と仮想の空が重なり合う瞬間の色彩描写にこだわる。'
