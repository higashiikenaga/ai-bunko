- name: リリア・ステラリス
  role: 主人公
  age: 16
  gender: 女性
  appearance: 夜空のような深い紺色の髪に、星の輝きを宿した瑠璃色の瞳。古びた星詠みのローブを身に纏っている。
  personality: 真面目で好奇心旺盛だが、自分の才能に自信が持てない控えめな性格。一人称は「私」。
  speech_style: 丁寧で控えめな口調。感情が高ぶると早口になる傾向がある。
  background: 辺境の浮遊島で星詠みの見習いとして育った。忘れ去られた古の航宙船アステリア号を偶然発見し、独学で修復した。
  motivation: 失われた星座の記憶を取り戻し、世界に再び正しい星の導きを呼び戻すこと。
  relationships:
  - name: カイル
    relation: 旅の護衛であり、信頼し合える兄のような存在
  - name: アステリア
    relation: 船の意思であり、導き手
  - name: ノクティス
    relation: 対立する宿敵
  arc: 自信のない見習いから、世界の運命を背負って大詠唱を完遂させる誇り高き星詠みへと成長する。
- name: カイル・ヴァン・クロムウェル
  role: 相棒/護衛
  age: 24
  gender: 男性
  appearance: 短く刈り込んだ黒髪に、鋭い眼光。使い込まれた革鎧と、星海を切り裂く大剣を携えている。
  personality: 現実主義で皮肉屋だが、根は情に厚く、弱者を放っておけない。一人称は「俺」。
  speech_style: ぶっきらぼうで簡潔な話し方。リリアを揶揄いつつも気遣う。
  background: 元・帝国空軍の精鋭騎士だったが、ある軍事機密に触れたことで追放され、流れ者の傭兵となっていた。
  motivation: 過去の過ちを償い、自分が見捨てた「守るべきもの」を再び見つけること。
  relationships:
  - name: リリア・ステラリス
    relation: 危なっかしい少女だと思いつつ、彼女の純粋さに心を動かされている
  - name: アステリア
    relation: 効率性を重視するため、時折口論になる関係
  arc: 孤独に慣れきった心をリリアに開かれ、誰かのために剣を振るう真の騎士としての誇りを取り戻す。
- name: アステリア
  role: 相棒/ナビゲーター
  age: 0
  gender: 中性
  appearance: 航宙船の制御端末に宿る光の精霊のような姿。金色の粒子で構成された少年のような外見。
  personality: 博識で茶目っ気があるが、時折、数千年前の記憶に浸り物憂げな表情を見せる。一人称は「僕」。
  speech_style: 古風で演劇的な言い回しを好む。
  background: 古の文明が造り上げた自律思考型航宙船。長い眠りの間に記憶の大部分を失っていた。
  motivation: 自分を呼び覚ましたリリアと共に、かつて自分が導いた星空の絶景をもう一度見ること。
  relationships:
  - name: リリア・ステラリス
    relation: 自分を再生させてくれた大切なパートナー
  - name: カイル・ヴァン・クロムウェル
    relation: 喧嘩友達のような関係
  arc: 単なる「機械の記憶」ではなく、リリアとの旅を通じて新しい感情と意志を持つに至る。
- name: ノクティス
  role: 敵役
  age: 0
  gender: 男性
  appearance: 透き通るように白い肌に、光を一切反射しない漆黒の瞳。虚無を纏ったような黒い外套を羽織っている。
  personality: 静謐と静寂を愛し、喧騒や光を「不純なもの」として嫌う。冷徹で傲慢。一人称は「私」。
  speech_style: 穏やかで静かだが、有無を言わせぬ威圧感のある口調。
  background: かつて最古の星詠みと呼ばれた男。星の光に絶望し、世界を永遠の静寂（月食）に沈めることで苦しみを取り除こうとしている。
  motivation: 全ての星の光を喰らい、世界を完全なる闇と静寂に包み込むこと。
  relationships:
  - name: リリア・ステラリス
    relation: かつての自分に似た危うさと可能性を持つ、排除すべき障害
  arc: 絶望による救済を信じていたが、リリアが再誕させた新しい光を目の当たりにし、自身の誤りを悟る。
