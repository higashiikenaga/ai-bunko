title: 瑠璃色の月蝕と、星詠みの飛行船
genre: 異世界ファンタジー
tone: 幻想的で静謐、色彩豊かな物語
pov: 三人称
tense: 過去形
setting: 浮遊する島々と、星の光が海のように流れる「星海（せいかい）」が広がる世界
premise: 星々の配置を読み解き、空飛ぶ船を導く「星詠み」の少女リリアは、古びた航宙船と共に未知の航路へと漕ぎ出します。しかし、世界を静寂に沈める不吉な月食が訪れ、星の導きが途絶えてしまいます。光を失いゆく空の下で、彼女は失われた星座の記憶を辿り、世界の夜明けを取り戻すための旅を始めます。
themes:
- 運命の導き
- 光と影の調和
rules:
- 魔法は星座の瞬きと、特定の詠唱を介してのみ発動する
- 空飛ぶ船の動力は、夜空から滴る「星屑の雫」である
- 月食の最中、星の力は封じられ、魔法使いは無力となる
plot_outline:
- '序盤: 星詠みの見習いリリアが、古の記憶を宿す飛行船アステリア号を修復し、空の果てを目指す旅に出る。'
- '中盤: 航海の途中で、星の光を喰らう影の現象に遭遇。月食が自然現象ではなく、世界の均衡を壊す意図的な災厄であることを知る。'
- '終盤: 月が完全に天を覆う瞬間、リリアは天空の最も高い場所で、星座を再誕させるための大詠唱を試みる。'
- '結末: 月食が明け、新たな光を纏った星空が広がると共に、世界には希望の航路が再び刻まれる。'
style_notes: 夜空の深い藍色、星の瞬く金色、魔法が放つ菫色の光といった色彩を、宝石や光の粒子を用いることで贅沢に描写すること。語り口は、静かな夜に語りかけるおとぎ話のようにゆったりとしたリズムで紡ぐ。魔法の詠唱は、天体への祈りのような詩的な言葉を添えること。
