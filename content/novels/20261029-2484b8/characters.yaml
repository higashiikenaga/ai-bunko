- name: カイト
  role: 主人公
  age: 17
  gender: 男性
  appearance: 整った顔立ちだが、どこか孤独を感じさせる瞳を持つ。音楽を奏でる際、指先から淡い光の粒子が舞う。
  personality: 真面目で完璧主義。音楽に対してストイックすぎるあまり、周囲との調和よりも自己の表現を優先しがち。一人称は「僕」。
  speech_style: 丁寧だが、音楽の理論や技術について語る時は熱を帯びる。
  background: 島の音楽学校で「神童」と称される天才奏者。完璧な旋律を追求するあまり、音楽に「感情」や「不完全さ」が介在することを嫌っている。
  motivation: 失われた海底の旋律を解明し、自分だけの至高の音楽を完成させること。
  relationships:
  - name: ミナ
    relation: 運命的な出会い、音楽的な理解者、恋慕の対象
  - name: レオ
    relation: ライバル
  arc: 「完璧な独奏」を求める孤高の奏者から、他者の不完全さを受け入れ、共に響き合う「合奏」の喜びを知る表現者へと成長する。
- name: ミナ
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような白い肌と、海の色を映したような瞳を持つ。声が出せないため、言葉の代わりに微かな光の揺らぎで感情を示す。
  personality: 静かで神秘的。感情の起伏は少ないが、内側に強い意志を秘めている。一人称は「私」。
  speech_style: 言葉を発することはできない。指先のリズムや、視線、存在感によるコミュニケーションを行う。
  background: 海底遺跡を守り続ける「旋律の依代」。古の文明が残した「失われた旋律」をその身に宿している。
  motivation: 自分の中に響き続ける旋律の正体を知り、自分が何者であるかを確かめること。
  relationships:
  - name: カイト
    relation: 唯一、音を通じた対話ができる存在
  arc: 遺跡と共に消え去る運命を受け入れるだけの「依代」から、自らの意志で新しい旋律を刻もうとする「一人の人間」へと変わる。
- name: レオ
  role: ライバル
  age: 18
  gender: 男性
  appearance: 快活で華やかな容姿。音楽を奏でることで、周囲の気温を上昇させるほどの強力な熱エネルギーを放出する。
  personality: 野心的で自信家。音楽を「世界を制御するための力」と考えている。一人称は「俺」。
  speech_style: 自信に満ち溢れた、朗々とした話し方。
  background: 島の音楽騎士団の次期リーダー候補。音楽の力を社会秩序の維持に使うべきだと信じている。
  motivation: 音楽による絶対的な力の証明と、カイトの才能を上回ること。
  relationships:
  - name: カイト
    relation: 超えるべき壁、ライバル
  - name: ミナ
    relation: 制御すべき未知のエネルギー源
  arc: 音楽を「支配の道具」と捉えていたが、カイトとミナの共鳴を目の当たりにし、音楽が持つ真の「祈り」としての側面を知る。
- name: サイラス
  role: 敵役
  age: 32
  gender: 男性
  appearance: 冷徹な眼差しを持つ、黒い装束の男。彼が奏でる音は、周囲の光を吸い込み、静寂を強いる。
  personality: 合理的で冷酷。目的のためには手段を選ばない。一人称は「私」。
  speech_style: 理知的で、相手の心理的な隙を突くような静かな話し方。
  background: かつて音楽文明の崩壊を研究していた考古学者。音楽がもたらす熱狂と破壊を恐れ、音楽を「封印すべき呪い」と定義している。
  motivation: ミナを捕獲し、海底遺跡の旋律を完全に封印することで、音楽による世界の変動を止めること。
  relationships:
  - name: ミナ
    relation: 封印すべき対象
  - name: カイト
    relation: 音楽の危うさを体現する危険分子
  arc: 音楽を「恐怖の対象」として排除しようとするが、最終的に音楽が持つ「生命の輝き」に直面し、自らの信念が揺らぐ。
