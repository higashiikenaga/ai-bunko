title: 残響のプリズム、海底に沈む旋律
genre: 青春恋愛
tone: 叙情的で、波音と調べが交錯する瑞々しい雰囲気
pov: 三人称
tense: 過去形
setting: 音楽が物理的な熱や光を伴うエネルギーとして存在する、海に囲まれた島国。かつて高度な音楽文明が海底へと沈んだ伝説を持つ世界。
premise: 音を奏でることで世界を彩る少年、カイトは、声を持たぬ少女、ミナと出会う。彼女が口ずさむのは、古の海底遺跡から響いてくる、誰も聞いたことのない失われた旋律だった。鏡のような海面に映る空と、深海に眠る記憶の破片を辿りながら、二人の不器用な共鳴が始まる。音楽が魔法となるこの世界で、彼らは「沈黙」という名の真実へと辿り着く。
themes:
- 失われた言葉の再生
- 共鳴による自己肯定
rules:
- 歌や楽器の演奏は、周囲の温度や光の屈折を変化させる物理的な力を持つ。
- 感情の昂ぶりは旋律の強度に直結し、制御を失うと周囲の物質を破壊することもある。
- 海底遺跡に眠る「古の歌」は、現在の音楽の法則とは異なる理（ことわり）に従う。
plot_outline:
- '序盤: 音楽の力で調律された穏やかな島で、天才的な旋律を紡ぐカイトは、ある日、波打ち際で鏡のように静かな水面に佇むミナを見つける。彼女が歌うことはできないが、指先で奏でるリズムが、海中から響く未知の音を呼び起こす。'
- '中盤: 二人は、ミナの音を完成させるために、禁忌とされる海底遺跡へと向かう旅に出る。航海の途中、彼らは音楽が自然現象を制御する力を使い、嵐や荒波を乗り越えていく。しかし、カイトの奏でる完璧な音楽と、ミナの不完全な旋律が衝突し、二人の関係に亀裂が生じる。'
- '終盤: 海底遺跡の最深部、巨大な鏡の回廊に辿り着いた二人は、そこがかつて音楽を失った文明の墓標であることを知る。ミナの正体は、遺跡を守り続ける「旋律の依代」だった。彼女が真実の歌を歌えば、遺跡と共に消え去る運命にある。'
- '結末: カイトは独奏ではなく、ミナの不完全なリズムを受け入れる「合奏」を試みる。二人の旋律が混ざり合い、鏡の回廊は光の洪水へと変わる。音楽は消えず、新たな形となって二人の日常へと溶け込んでいく。'
style_notes: 一文一文を音節を意識したリズム感のある文体で綴る。情景描写には色彩と音の比喩を多用し、各話の冒頭または転換点に、物語の情動を象徴する短い詩（歌詞）を挿入すること。例：『銀の波、砕ける調べ、君の瞳に映るは、未だ見ぬ夜明けの残響』
