- name: 桜井 陽葵
  role: 主人公
  age: 19
  gender: 女性
  appearance: ポニーテールに結った栗色の髪。いつも少しだけエプロンが曲がっている。快活な笑顔が印象的。
  personality: おっちょこちょいだが前向きで、誰に対してもフレンドリー。一人称は「あたし」。
  speech_style: 明るく賑やか。語尾に「〜だよ！」「〜かな？」とつく、快活な話し方。
  background: 大学1年生。都会の喧騒に少し疲れ、静かな場所で自分らしく働きたいと思い「黎明亭」のバイトに応募した。
  motivation: 完璧なモーニングセットを提供できるようになり、お客さんの心を癒やす最高の店員になること。
  relationships:
  - name: 桐生 奏多
    relation: 店主であり、憧れの師匠
  - name: 椎名 紬
    relation: 心をひらきたい常連客
  arc: 失敗ばかりの新人から、客の悩みや願いをメニューに昇華させる感性を身につけ、店に欠かせない存在へと成長する。
- name: 桐生 奏多
  role: 相棒/店主
  age: 32
  gender: 男性
  appearance: 細い銀縁メガネをかけ、常に清潔感のある白いシャツに紺色のエプロンを着用。穏やかな眼差し。
  personality: 冷静沈着で思慮深い。音楽とコーヒーへのこだわりが強いが、根は非常に優しい。一人称は「僕」。
  speech_style: 丁寧で静かな口調。相手の心に寄り添うような、間を大切にした話し方。
  background: 元ラジオ番組のプロデューサー。ある出来事をきっかけに放送業界を離れ、「音と食で人を癒やす場所」として黎明亭を開いた。
  motivation: 夜明け前の孤独な時間を過ごす人々へ、温かい食事と音楽という「救い」を提供すること。
  relationships:
  - name: 桜井 陽葵
    relation: 危なっかしいが可能性を感じている教え子
  - name: 椎名 紬
    relation: 静かに見守っている常連客
  arc: 陽葵の真っ直ぐなエネルギーに触れ、自分の中にあった過去の喪失感や凝り固まった考えを解きほぐしていく。
- name: 椎名 紬
  role: 脇役/常連客
  age: 24
  gender: 女性
  appearance: 色白で儚げな雰囲気。長い黒髪をゆるく編んでいる。オーバーサイズのカーディガンを愛用。
  personality: 内向的で寂しがり屋。自分の気持ちを言葉にするのが苦手。一人称は「私」。
  speech_style: 声が小さく、語尾が消え入りそうになる。「……かもしれません」など、控えめな言い回しが多い。
  background: フリーランスのイラストレーター。締め切りに追われる日々の中で孤独を感じ、偶然見つけた黎明亭の静けさに救われている。
  motivation: もう一度、心から「描きたい」と思える情熱を取り戻すこと。
  relationships:
  - name: 桜井 陽葵
    relation: 懐いているが、まだ距離がある友人のような関係
  - name: 桐生 奏多
    relation: 信頼して心を開き始めている店主
  arc: ラジオへの投稿を通じて自分の想いを外に発信できるようになり、再び筆を執る勇気を得る。
- name: 佐々木 蓮
  role: 脇役/常連客
  age: 17
  gender: 男性
  appearance: 短髪でスポーツマンらしいガッシリした体格。高校のジャージ姿で来店することが多い。
  personality: 直情的に純粋。曲がったことが嫌いで、誰にでも等しく接するムードメーカー。一人称は「俺」。
  speech_style: ハキハキとした体育会系な口調。「〜っす！」「マジで！」などの若者言葉を多用する。
  background: 陸上部のエース。早朝練習の前にエネルギー補給と精神統一のために黎明亭に通っている。
  motivation: 大会での優勝と、部員たちを引っ張っていける強い精神力をつけること。
  relationships:
  - name: 桜井 陽葵
    relation: よく言い合いをしながらも仲の良い年上の友人
  - name: 椎名 紬
    relation: 正反対な性格ゆえに興味を持っている知人
  arc: がむしゃらな努力だけでなく、立ち止まって心に耳を傾けることの大切さを知り、精神的に成熟する。
