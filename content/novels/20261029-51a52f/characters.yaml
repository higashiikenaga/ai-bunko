- name: レオ・ヴァレリウス
  role: 主人公
  age: 19
  gender: 男性
  appearance: 油汚れのついた茶色の作業着、無造作な癖毛、首から亡き父の懐中時計を下げている。
  personality: 内向的で真面目、職人気質。一人称は「僕」。
  speech_style: 丁寧だが少し距離を置いた、控えめな話し方。
  background: 浮遊大陸の片隅にある小さな整備工場で、独り孤独に蒸気船の修理をして生きてきた。
  motivation: 父が遺した「壊れた懐中時計」を修理し、父が最後に見た景色を知ること。
  relationships:
  - name: ライラ・スカイウォーカー
    relation: 旅の仲間
  - name: サイラス・ソーン
    relation: 船の持ち主であり、父の旧友
  arc: 孤独な整備士として技術のみを求めていたが、旅を通じて世界の美しさを慈しみ、その記憶を語り継ぐ「旅人」へと成長する。
- name: ライラ・スカイウォーカー
  role: 相棒
  age: 18
  gender: 女性
  appearance: 飛行ゴーグルを頭に乗せ、軽やかな旅装束を纏った、活発な印象の少女。
  personality: 好奇心旺盛で社交的、美味しいものに目がなく、楽観主義者。一人称は「私」。
  speech_style: 明るく、リズムの良い快活な話し方。
  background: 各地の食文化と空の風習に精通した、運び屋の家系の娘。
  motivation: 見たこともない景色を見ることと、各地の珍しいスパイス料理を味わうこと。
  relationships:
  - name: レオ・ヴァレリウス
    relation: 旅の仲間
  arc: 単なる好奇心による冒険から、失われた「春」の価値を知り、それを守るための強い意志を持つようになる。
- name: サイラス・ソーン
  role: 脇役（メンター）
  age: 55
  gender: 男性
  appearance: 白髪混じりの髭、使い込まれた革のコート、片目が機械化された義眼。
  personality: 豪胆でぶっきらぼうだが、深い慈愛を持つ。一人称は「俺」。
  speech_style: 低く、少しかすれたような、落ち着いた話し方。
  background: かつて帝国軍の蒸気船士官を務めていたが、現在は古い蒸気船で雲海を渡る放浪の船長。
  motivation: レオに父の遺志を継がせること、そして自分が見逃してきた「過去」をレオに託すこと。
  relationships:
  - name: レオ・ヴァレリウス
    relation: 保護者的な存在
  arc: 過去の失敗や後悔に縛られていたが、レオの旅を見守ることで、新しい時代への希望を見出す。
- name: アイゼン伯爵
  role: 敵役
  age: 45
  gender: 男性
  appearance: 完璧に仕立てられた軍服、冷徹な瞳、精密な歯車が組み込まれた義手。
  personality: 極めて合理的で野心的、目的のためには手段を選ばない。一人称は「私」。
  speech_style: 威圧的で、相手を支配下に置こうとするような冷ややかな話し方。
  background: 蒸気帝国の技術開発を統括する高官。資源不足を解決するため、未知のエネルギー源を求めている。
  motivation: 懐中時計に秘められた「春」の力を、文明を永続させるための動力源として管理・利用すること。
  relationships:
  - name: レオ・ヴァレリウス
    relation: 目的を阻む障害
  arc: 自然の摂理を力でねじ伏せようとする支配者として、物語のクライマックスでレオの「記憶を繋ぐ」思想と対立する。
