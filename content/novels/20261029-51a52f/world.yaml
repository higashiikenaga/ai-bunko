title: 空飛ぶ蒸気船と、春を運ぶ歯車の音
genre: スチームパンク冒険
tone: 穏やかで情緒的な、旅の追憶
pov: 一人称（僕）
tense: 過去形
setting: 浮遊大陸群と、蒸気機関が文明を支える雲海の世界
premise: 蒸気船の整備士である僕は、亡き父の遺品である「壊れた懐中時計」を修理するために、雲の向こうにある未知の浮遊島を目指す旅に出る。旅の途中で出会う人々や、見たこともない美しい景色、そして各地で供される温かな料理が、僕の孤独を少しずつ溶かしていく。しかし、懐中時計の針が動き出したとき、世界に眠る「春」の真実が明らかになる。それは、鉄と蒸気の時代に忘れ去られた、桜の花びらが舞う記憶の物語だった。
themes:
- 失われた記憶の修復
- 旅先でのささやかな幸福
rules:
- 全ての浮遊島は蒸気機関の気圧差によって空中に留まっている
- 懐中時計の修理には、特定の島でしか採れない『星屑の潤滑油』が必要である
- 雲海の下は、高度な蒸気文明から切り離された霧の領域となっている
plot_outline:
- '序盤: 整備士の僕が、動かない懐中時計を抱えて古い蒸気船で旅立つ。最初の寄港地では、蒸気で蒸し上げた色鮮やかな果実のパイを味わい、空の風習を知る。'
- '中盤: 懐中時計の部品を探して各地を巡る。美しい雲の上の庭園や、歯車が音楽を奏でる街を訪れ、各地の珍しいスパイス料理に触れながら、父が残したメッセージを読み解いていく。'
- '終盤: 時計の修理が完了した瞬間、壊れた時間軸が繋がり、空に桜の花びらが舞い上がる。それは、かつて世界が緑に溢れていた時代の記憶だった。'
- '結末: 僕は失われた春を再生させる装置ではなく、その美しさを語り継ぐ旅人として、新しい空へと船を出す。'
style_notes: 灯守ルカとしての文体を徹底する。風景描写には色彩と温度を感じさせ、旅の情景を日記のように綴る。各エピソードの終わりに、その土地で食べた料理の味や、人々の暮らしの細かな所作を丁寧に書き込み、読者が共に旅をしているような感覚を与えること。
