- name: カイト
  role: 主人公
  age: 18
  gender: 男性
  appearance: 風に焼けた肌と、意志の強い琥珀色の瞳。使い古された飛行ジャケットに、常にゴーグルを首にかけている。
  personality: 直情的で正義感が強いが、内面には孤独を抱えている。一人称は「俺」。
  speech_style: ぶっきらぼうだが熱量のある話し方。年上の相手にも物怖じせず、直球な物言いをする。
  background: 忘却の市で記憶の端切れを売って食いつなぐ若き操縦士。幼い頃に失踪した父が残した懐中時計を唯一の宝物にしている。
  motivation: 懐中時計が示す「真実の青い空」に到達し、父が何を見たのかを突き止めること。
  relationships:
  - name: リリア
    relation: 信頼し合う相棒・整備士
  - name: サイラス
    relation: 皮肉屋だが頼れる導き手
  - name: ヴァレリウス
    relation: 宿敵・追跡者
  arc: 日々の生存に汲々としていた青年から、世界の嘘を暴き、人々に希望を示す先駆者へと成長する。
- name: リリア
  role: 相棒
  age: 16
  gender: 女性
  appearance: 油汚れのついたオーバーオールを着用。大きな保護メガネをかけ、常に工具袋を腰に下げている小柄な少女。
  personality: 論理的で完璧主義な天才整備士。機械への愛は深いが、対人関係には不器用。一人称は「私」。
  speech_style: 専門用語を多用し、早口でまくしたてる傾向がある。呆れた時に「信じられない」と呟く癖がある。
  background: 中央政府の技術アカデミーを追放された異端児。禁忌とされる「記憶を使わない純粋動力」の研究に没頭している。
  motivation: 自分の設計した飛空艇「アズール・ウィング」で、世界の果てまで飛行することを証明したい。
  relationships:
  - name: カイト
    relation: 最高のパイロットとして認めている相棒
  arc: 効率と理論のみを信じていたが、カイトと共に旅をすることで、数値化できない「情熱」や「絆」の価値を知る。
- name: サイラス
  role: 脇役/導き手
  age: 45
  gender: 男性
  appearance: くたびれたロングコートを纏い、常に煙草のような香草を燻らせている。片目にモノクルを着用した痩身の男。
  personality: 冷笑的で現実主義だが、根は情に厚い。過去に深い喪失感を抱えている。一人称は「私」。
  speech_style: 余裕のある、なだめるような口調。比喩表現や皮肉を混ぜた知的な話し方をする。
  background: かつて忘却の市で権力を握っていた伝説的な記憶商人。ある禁忌の記憶に触れたことで業界を追われ、隠居生活を送っていた。
  motivation: 自分が失った「ある大切な記憶」の断片を、世界の真実と共に取り戻したい。
  relationships:
  - name: カイト
    relation: 危なっかしい若者を導く保護者的存在
  arc: 過去への後悔と諦めの中で生きていたが、カイトたちの純粋さに触れ、再び未来へ歩き出す勇気を持つ。
- name: ヴァレリウス
  role: 敵役
  age: 52
  gender: 男性
  appearance: 汚れ一つない純白の軍服に身を包み、冷徹な氷のような青い瞳を持つ。左腕は記憶燃料で駆動する義手となっている。
  personality: 秩序と統制を至上の価値とする独裁的な性格。個人の記憶よりも文明の維持を優先する。一人称は「私」。
  speech_style: 威圧的で簡潔な命令調。相手を突き放すような、冷徹で静かなトーンで話す。
  background: 中央政府の記憶徴収局局長。世界の均衡を保つためには、一部の人間が記憶を犠牲にすることは不可避だと信じている。
  motivation: カイトが持つ懐中時計（古代航法装置）を回収し、政府による完全な記憶管理体制を完成させること。
  relationships:
  - name: カイト
    relation: 秩序を乱す不確定要素として排除すべき対象
  arc: 絶対的な正義を信じていたが、真実の青い空を目の当たりにした際、自らが構築した偽りの秩序が崩壊し、激しく葛藤する。
