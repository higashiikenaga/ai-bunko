title: スカイ・ランナー：忘却の市を駆ける銀翼
genre: SF
tone: 爽快で躍動感のある冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島が点在する空中世界「エテルナ」。人々の記憶を精製してエネルギーに変える「記憶燃料」が文明を支えている時代。
premise: 記憶を売買する「忘却の市」が繁栄する世界で、若き操縦士カイトは、動かなくなった父の懐中時計を手に、雲の彼方を目指す。その時計は、失われた「真実の青い空」へと導く古代の航法装置だった。記憶を奪い文明を維持しようとする巨大組織に追われながら、カイトは仲間と共に、風を切り裂き、未知なる空の果てへと飛び立つ。
themes:
- 自己のアイデンティティの確立
- 自由への渇望
rules:
- 記憶を燃料として使うと、その記憶を持つ者の人格が欠落する
- 懐中時計の針は、特定の高度と気流が交差するポイントでのみ動き出す
- 飛空艇の航行には、高度な機械技術とパイロットの直感的な風読みが不可欠である
plot_outline:
- '序盤: 記憶の売買で食いつなぐカイトが、市場で拾った懐中時計が空の地図であることを知る。'
- '中盤: 時計を狙う中央政府の追撃を受け、天才整備士の少女や元記憶商人の仲間と共に、新型飛空艇「アズール・ウィング」で雲海の果てへ逃走する。'
- '終盤: 記憶を強制徴収する巨大要塞へ突入。懐中時計が真の機能を起動し、世界を覆う雲の正体を暴く。'
- '結末: 嵐を突き抜けた先に、人類が忘れていた真実の蒼天が広がり、仲間と共に新たな冒険へと旅立つ。'
style_notes: 風の唸り、エンジンの咆哮、そして翼が空気を切り裂く瞬間の高揚感を、精密な機械描写と共に熱量たっぷりに描く。三人称でありながら、キャラクターの情熱がダイレクトに伝わるような、視界がパッと開ける明るく勢いのある語り口を徹底すること。
