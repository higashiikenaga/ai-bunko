- name: レン・カイト
  role: 主人公
  age: 16
  gender: 男性
  appearance: 無造作な黒髪に、ネオンの反射を吸い込むような深い瞳。動きやすいオーバーサイズのストリートウェア。左腕に古いスケートボードの傷跡がある。
  personality: 不器用だが芯が強く、孤独を好む。一人称は「俺」。挫折を味わい、自分に自信を持てずにいた。
  speech_style: ぶっきらぼうで言葉数は少ないが、スケートの話になると熱を帯びる。
  background: かつては天才と呼ばれたが、ある事故をきっかけにボードを捨て、ネオ・ベイの片隅で日銭を稼ぐ生活を送っていた。
  motivation: 『星図』を完遂し、自分がなぜスケートを愛していたのか、その答えを見つけること。
  relationships:
  - name: ミナ
    relation: 謎の協力者・導き手
  - name: ゼクス
    relation: 最大のライバル
  arc: 自信喪失した少年から、自身の走りで街の景色を変える「光の先駆者」へと成長する。
- name: ミナ・ルナ
  role: 相棒/導き手
  age: 15
  gender: 女性
  appearance: 銀髪のショートカット。光ファイバーが編み込まれたジャケットを着用。常に小型のホログラム端末を携帯している。
  personality: 冷静沈着で分析的だが、どこか浮世離れした神秘的な雰囲気を持つ。一人称は「私」。
  speech_style: 丁寧だが、事実を淡々と突きつけるような、少し機械的な響きのある話し方。
  background: ネオ・ベイの都市管理システムに深く関わる一族の末裔。伝説のルート『星図』の真の管理者。
  motivation: 『星図』を完遂させ、都市の停滞した秩序を再構築すること。
  relationships:
  - name: レン・カイト
    relation: 星図を走るための「鍵」となる存在
  arc: システムの一部として生きることをやめ、レンと共に予測不能な未来を歩む決意をする。
- name: ゼクス・ヴァルガス
  role: 敵役
  age: 19
  gender: 男性
  appearance: 金髪をオールバックにし、高級感のあるタクティカル・ウェアを纏う。瞳は冷徹なライトブルー。
  personality: 傲慢で支配欲が強く、勝利のみを至上命題とする。一人称は「我」。
  speech_style: 威圧的で、相手を見下すような高圧的な口調。
  background: 地区支配組織『ナイト・キングス』のリーダー。圧倒的なスピードと、重力を無視したテクニックを持つ。
  motivation: ネオ・ベイのストリートを完全に掌握し、自分以外の誰もが制御できない絶対的な力になること。
  relationships:
  - name: レン・カイト
    relation: 排除すべきイレギュラー
  arc: 完璧だと思っていた自分の走りが、レンの「自由な軌跡」によって崩される恐怖を知る。
