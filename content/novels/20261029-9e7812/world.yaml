title: ネオン・スキャッター ―星図を刻む疾走―
genre: スポーツ青春
tone: スピード感溢れる、熱く鋭い疾走感
pov: 三人称
tense: 過去形
setting: 24時間、ネオンの光が絶えない巨大摩天楼都市「ネオ・ベイ」。
premise: 眠らない街、ネオ・ベイ。そこでは夜のストリート・スケートボードが、街の秩序を書き換える唯一の手段だった。落ちこぼれの少年・レンは、伝説の走行ルート『星図（スターチャート）』を手にし、頂点を目指す。超高層ビルの隙間を縫い、重力と戦う極限のレース。彼が刻む光の軌跡は、夜の闇を切り裂く。
themes:
- 限界の突破
- 孤独な魂の共鳴
rules:
- レースは夜間のみ。都市の照明とネオンの反射を視覚ガイドとして利用する。
- ボードの技術に加え、都市の構造を読み解く知能が勝敗を分ける。
- 高層階での転落は即、選手生命の終わりを意味する。
plot_outline:
- '序盤: ボードを捨てかけたレン。謎の少女ミナから渡されたのは、光り輝く『星図』。それは街の死角を繋ぐ、伝説のルートだった。初陣で圧倒的なセンスを見せ、レンの名は夜の街に響き始める。'
- '中盤: 各地区を支配する精鋭『ナイト・キングス』との連戦。ビル風を読み、ネオンの光を頼りに加速する。一瞬の判断が、死か勝利かを分ける過酷な駆け引きが続く。'
- '終盤: 最終決戦は、都市の最上層スカイ・ハイウェイ。全市民の視線が集まる中、レンは重力を置き去りにする。極限のスピードの中で、彼は『星図』の真の意味を知る。'
- '結末: 星図を完遂したレン。街の景色は変わった。夜明けはまだ遠いが、彼の加速は止まらない。'
style_notes: 場面転換は鋭く、テンポを最優先する。アクションシーンでは擬音を避け、重心の移動、風の抵抗、視線の動きを短い文で畳みかけるように描写する。キャラクターの掛け合いは弾丸のような速さで進め、各話の末尾には必ず読者の心拍数を上げる「引き」を配置すること。
