title: 蒼穹のレジスタンス ―風を編む銀翼と忘却の書庫―
genre: 異世界ファンタジー
tone: 爽快で躍動感のある冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島が点在し、巨大な上昇気流「天の川」が島々を結ぶ浮遊世界。高度の高い場所ほど空気が薄く、高度の低い「底なしの雲海」には失われた文明が眠るとされている。
premise: 空を駆ける若き整備士カイトは、偶然見つけた「名前のない猫」と共に、世界の記憶が封印されたとされる「地下図書館」への旅に出る。彼らが操るのは、風を読み、空気を燃料に変える伝説の試作型飛空艇『スカイ・ストライダー』だ。失われた歴史を巡る戦いの中で、カイトは仲間たちと共に、空を支配しようとする帝国に立ち向かう。風を切り裂く翼の音と、仲間との絆が、停滞した世界に新たな風を吹き込む。
themes:
- 未知への好奇心
- 絆による再生
- 記録と記憶の価値
rules:
- 飛空艇の動力は『風の精髄』と呼ばれる高純度の空気結晶を用いる
- 高度が上がると魔法的な気流が強まり、特別な操舵技術が必要になる
- 『名前のない猫』は、記憶を食べることで実体化する希少な魔獣である
plot_outline:
- '序盤: 浮遊島で整備士として働くカイトが、不思議な力を持つ『名前のない猫』を拾い、帝国の追っ手から逃れるために小型艇で空へ飛び出す。'
- '中盤: 仲間となる操縦士や魔導士と共に、雲海の下に隠された伝説の『地下図書館』の存在を突き止め、激しい空中戦を繰り広げながら目的地を目指す。'
- '終盤: 地下図書館に到達した一行は、世界を書き換えようとする帝国の野望を知る。カイトは新型飛空艇の真の力を解放し、巨大な帝国の戦艦に挑む。'
- '結末: 激闘の末に世界の真実を守り抜き、カイトたちは新たな地図を作るため、再び果てしない空へと旅立っていく。'
style_notes: 機械の駆動音や風のうねり、飛空艇が空を切る感覚を、五感を刺激する躍動感ある描写で綴ること。キャラクターの感情は、上昇気流のように高く、突き抜けるような爽快感をもって描く。仲間との会話はテンポ良く、共に困難を乗り越える高揚感を重視する。
