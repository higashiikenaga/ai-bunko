- name: カイト・アインズワース
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無造作な黒髪に、光を反射しない濁った瞳。華美な装飾を嫌う、質素で動きやすい服装をしている。
  personality: 内向的で観察眼が鋭い。音楽の才能を持たない自分に諦めを感じているが、根は情熱的。一人称は「僕」。
  speech_style: 控えめで、相手の反応を伺うような静かな話し方。
  background: 音楽が光となる都市ルミナに生まれながら、音を光や熱に変換する「魔力」を一切持たない不適合者として育った。
  motivation: 世界の色が見えない理由を知り、自分にしか聞こえない「音」の価値を見つけ出したい。
  relationships:
  - name: リラ
    relation: 運命を変える出会いをした少女、大切なパートナー
  - name: ジュリアン
    relation: 対極に位置する、光り輝く才能の持ち主
  arc: 無力感に苛まれる少年から、不完全な音であっても誰かと響き合えることを信じる強さを得る。
- name: リラ・ノエル
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような銀髪と、どこか遠くを見つめるような深い青の瞳。地下図書館の古びたローブを纏っている。
  personality: 孤独を愛するが、内側に激しい情熱を秘めている。世間一般の「美しい音楽」に疑問を抱いている。一人称は「私」。
  speech_style: 詩的でリズム感があり、時折、音楽の比喩を用いる。
  background: 地下図書館に隠棲し、光を放たない「静寂の曲」を書き続けている。街の音楽システムから逸脱した存在とされる。
  motivation: 光を放つためではなく、誰かの心の奥底に触れるための「真実の音」を完成させること。
  relationships:
  - name: カイト
    relation: 自分の音を初めて「聴いて」くれた唯一の理解者
  arc: 孤独な作曲家から、カイトと共に世界へ向かって音を放つ表現者へと成長する。
- name: ジュリアン・ヴァレンティン
  role: 敵役
  age: 18
  gender: 男性
  appearance: 黄金の刺繍が施された豪華な指揮者衣装。彼が歌うと、周囲が眩いばかりの光に包まれる。
  personality: 完璧主義で傲慢。音楽は都市の秩序と効率のためにあると信じている。一人称は「私」。
  speech_style: 威厳があり、淀みのない流暢で高圧的な話し方。
  background: ルミナの音楽システムを象徴する天才音楽家。街の光を維持する「調和の守護者」として崇められている。
  motivation: 都市の完璧な調和を維持し、ノイズ（不協和音）を徹底的に排除すること。
  relationships:
  - name: カイト
    relation: 排除すべき、秩序を乱す不適合者
  arc: 完璧な調和の崩壊を目の当たりにし、自身の信じてきた音楽の価値観が揺らぐ。
- name: 司書エリアス
  role: 脇役/メンター
  age: 68
  gender: 男性
  appearance: 深く刻まれた皺と、分厚い眼鏡。常に古い楽譜の匂いをさせている。
  personality: 飄々としていて掴みどころがないが、知識が深く、二人を静かに見守る慈愛を持つ。一人称は「わし」。
  speech_style: ゆっくりとした、含みを持たせた老人らしい話し方。
  background: 禁忌とされる地下図書館の守護者。かつてルミナの音楽システムが作られる前の「古い音」を知る数少ない生き残り。
  motivation: 失われゆく「名もなき音」の記録を次世代へ繋ぐこと。
  relationships:
  - name: リラ
    relation: 才能を認めている教え子のような存在
  - name: カイト
    relation: 物語の鍵を握る少年として注目している
  arc: 変化する世界において、古い知識が新しい世代の力となる過程を導く。
