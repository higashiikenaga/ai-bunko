title: 響き合う残響に、君の旋律（メロディ）を重ねて
genre: 青春恋愛
tone: 叙情的でリズミカル。光と影、音と静寂が交錯する美しい幻想的な雰囲気。
pov: 三人称
tense: 過去形
setting: 多様な色彩が灯り始めた都市ルミナ。音楽が感情の色彩として視覚化される世界。
premise: 黄金の支配から解き放たれ、多様な色彩を取り戻したルミナ。カイトとリラは、音の響きが人々の心の色を形作る新たな時代を共に歩んでいた。しかし、ある夜、街を訪れた「音を遺す祭」の最中に、かつて存在したはずのない『死者の旋律』が響き渡る。それは、音楽を通じて誰かの意志を伝える「遺言」の歌だった。色彩の氾濫に戸惑う人々の中で、カイトの「空白」とリラの「真実」は、失われた音の欠片を探す新たな旅へと誘われる。
themes:
- 継承される意志
- 不完全な共鳴
- 記憶の彩り
rules:
- 音楽は光や色として視覚化されるが、カイトの『空白』はそれらを吸収・中和する性質を持つ。
- 感情が昂ると音のオーラが強まり、周囲の色調を変化させる。
- 『遺言の旋律』は、死者が残した強い未練や願いが音の残響として結晶化した特殊な現象である。
plot_outline:
- '序盤: ルミナに多様な色彩が戻り、カイトとリラは音楽の講師として穏やかな日々を送る。祭りの夜、街の広場で突如として、美しくも悲しい『遺言の歌』が鳴り響き、人々の色彩を一時的に奪い去ってしまう。'
- '中盤: 歌の正体を探る中で、二人はかつて音楽を失った者たちが遺した『音の遺品』を集める旅に出る。祭りの夜に現れる幻影の音を追ううちに、カイトは自らの『空白』が、単なる無ではなく「過去の音を受け継ぐ器」であることを知る。'
- '終盤: 街を飲み込もうとする巨大な『忘却の不協和音』に対し、カイトは集めた音の遺言を自らの空白に流し込み、リラの歌声と衝突させることで、新たな『生命の律動』へと昇華させる。'
- '結末: 遺言は悲劇ではなく、未来への贈り物として街に溶け込む。カイトとリラは、消えゆく音の中にこそ真実の輝きがあることを確信し、止まらない旋律と共に、新しい朝へと歩み出す。'
style_notes: 文章は拍子（リズム）を意識し、読経や詩を詠むような流麗な調べを持たせること。各話の冒頭または節目に、その場面の情景や感情を象徴する一節の歌詞を、地の文と区別して挿入する。音楽的語彙（クレッシェンド、休符、和音など）を比喩として多用し、視覚的な色彩描写と聴覚的な音の描写を密接に絡ませること。
