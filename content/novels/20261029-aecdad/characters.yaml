- name: カイル・ヴァン・クロムウェル
  role: 主人公
  age: 27
  gender: 男性
  appearance: 無機質な灰色の作業服を纏い、常に冷え切った指先を温めるための薄い手袋を着用している。鋭い眼差しと、過酷な環境に慣れた無駄のない動きが特徴。
  personality: 徹底した合理主義者。感情を「熱の浪費」として忌避しているが、内面には拭いきれない好奇心を秘めている。一人称は「僕」。
  speech_style: 簡潔で論理的。必要最低限の言葉しか発しない。
  background: ヘリオスの技術回収官。都市の維持に必要な旧時代の遺物を回収・再利用する任務に従事しており、システムの不備を修正する作業を繰り返してきた。
  motivation: 発見した『熱を持った遺物』の正体を突き止め、システムの嘘を暴くこと。
  relationships:
  - name: リナ・アイリス
    relation: 共闘者であり、思想的な対照となる存在
  - name: 管理者ゼノ
    relation: 追跡者であり、世界の秩序を象徴する存在
  arc: 秩序ある凍結死を受け入れていた受動的な生存者から、不確かな熱（自由）のために世界を崩壊させるリスクを背負う能動的な開拓者へと変化する。
- name: リナ・アイリス
  role: 相棒
  age: 24
  gender: 女性
  appearance: 色褪せた古いスカーフを首に巻き、廃墟の隙間で拾った古い楽器を携えている。瞳には凍てつく世界には似つかわしくない、強い生命力が宿っている。
  personality: 直感的で情緒的。効率よりも「意味」を重んじる。一人称は「私」。
  speech_style: 詩的で比喩表現が多く、カイルの論理的な言葉とは対照的に響く。
  background: かつて芸術が許容されていた時代の記憶を断片的に継承する、地下居住区の『記録者』。非効率な文化を密かに保存している。
  motivation: 失われた人類の熱量（感情や芸術）を、再び世界に灯すこと。
  relationships:
  - name: カイル・ヴァン・クロムウェル
    relation: 論理と感情を繋ぎ合わせるパートナー
  arc: 単なる過去の守護者から、カイルと共に新しい時代の熱を生み出すための「火種」となる存在へ。
- name: 管理者ゼノ
  role: 敵役
  age: 55
  gender: 男性
  appearance: 極めて整った身なり。ヘリオスの中心部から送られる熱によって、常に完璧な体温を保っている。感情を一切感じさせない、氷のような瞳を持つ。
  personality: 冷徹なマキャベリスト。人類の存続のためには、個の犠牲は統計的な誤差に過ぎないと断じる。一人称は「私」。
  speech_style: 穏やかだが、拒絶の余地を与えない絶対的な権威を感じさせる話し方。
  background: ヘリオスの熱循環システムを統括する最高執行官。エントロピー増大による文明の死を回避するため、市民の生命エネルギーを抽出するシステムを維持している。
  motivation: 管理社会の秩序を維持し、人類という種を「凍結した状態」で存続させること。
  relationships:
  - name: カイル・ヴァン・クロムウェル
    relation: 排除すべきシステムへの脅威
  arc: 絶対的な秩序の守護者として、カイルがもたらす「無秩序な熱」による世界の崩壊を阻止しようと足掻くが、最終的にはシステムの限界を突きつけられる。
