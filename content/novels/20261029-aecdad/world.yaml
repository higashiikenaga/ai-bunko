title: 極地軌道：熱力学的な葬送
genre: ディストピア
tone: 乾いた、硬質な、冷徹なリアリズム
pov: 三人称
tense: 過去形
setting: エントロピー増大により熱源が枯渇した、超低温の地球圏。居住区は巨大な熱循環装置によって維持される閉鎖都市『ヘリオス』のみ。
premise: 全てのエネルギーが管理・配分される管理社会において、非効率な『感情』や『芸術』は熱力学的な浪費として厳格に排除されている。技術回収官のカイルは、廃墟となった旧時代の地下軌道から、論理的には存在し得ない『熱を持った遺物』を発見する。それは、かつて人類が誇った物理学の特異点であり、同時に管理社会の根幹を揺るがす爆弾でもあった。カイルは、閉ざされた都市の境界へと向かう、運行停止が決まった最終列車に乗り込むことを決意する。
themes:
- 資源管理と個人の尊厳
- 熱力学的な死と生の定義
rules:
- すべての生命活動は、市民権に紐付けられた『熱量クレジット』によって厳密に制限される。
- 未承認の熱発生（運動、発熱、演算）は、即座に治安維持ドローンによって検知・制圧される。
- 都市の外側は絶対零度に近い極低温の真空に近い環境であり、生命は生存不可能である。
plot_outline:
- '序盤: 技術回収官のカイルは、廃棄区画の調査中に、物理法則を無視して微小な熱を発し続ける『折れた剣』のような形状をした超伝導デバイスを発見する。それは旧時代の量子演算機の一部であった。'
- '中盤: デバイスの解析を進める中で、カイルは都市のエネルギー供給が、実は市民の『余剰生命エネルギー』を強制抽出することで成立しているという不都合な真実に直面する。彼は追跡を逃れるため、旧時代の磁気浮上式鉄道の残骸である『最終列車』を利用して、都市の隔離壁を突破する計画を立てる。'
- '終盤: 列車が加速する中、カイルはデバイスに記録された、人類がかつて熱力学の限界に挑んだ記録を読み取る。彼は都市の管理システムが、熱の死（エントロピー最大化）を回避するために、あえて文明を停滞させていることを知る。'
- '結末: カイルはデバイスを都市の中枢に衝突させ、一時的な熱暴走を引き起こす。秩序ある凍結死か、無秩序な熱による崩壊か。彼は、不確かな熱を求めて、極寒の地へと列車を走らせる。'
style_notes: 精密な物理学用語（エントロピー、熱力学第二法則、超伝導、量子干渉など）を用い、現象を記述する。感情描写は最小限に留め、キャラクターの心理は、その動作や周囲の環境温度の変化、機械の稼働音といった物理的描写を通じて間接的に表現する。架空技術『熱量同期型インターフェース』を、神経系への熱伝導プロセスとして詳細に描写すること。
