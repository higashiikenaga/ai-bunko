- name: 瀬戸 蓮
  role: 主人公
  age: 28
  gender: 男性
  appearance: 都会的な身なりだが、どこか疲れが見える痩身。清潔感はあるが、常に周囲を警戒しているような鋭い目つき。
  personality: 合理的で理性的。未知の事象に対しては懐疑的。一人称：僕。
  speech_style: 丁寧な標準語。論理的に説明しようとする傾向がある。
  background: 都市部の設計事務所で働く建築士。幼少期に村を離れ、以来、村の不気味な噂を忌避してきた。
  motivation: 親族の死の真相を確かめ、村の異常な空気から一刻も早く脱出すること。
  relationships:
  - name: 瀬戸 凪
    relation: 従姉妹
  arc: 合理的な思考が、村の非論理的な怪異によって崩壊し、自分自身の存在の輪郭が失われていく恐怖を味わう。
- name: 瀬戸 凪
  role: 脇役
  age: 24
  gender: 女性
  appearance: 黒髪のロングヘア。肌が病的なほど白く、瞳の焦点がどこか合っていない。村の伝統的な装束を纏っている。
  personality: 穏やかで献身的だが、感情の起伏が乏しく、どこか空虚な印象を与える。一人称：私。
  speech_style: おっとりと、抑揚の少ない静かな話し方。
  background: 村の祭祀を司る一族の娘。蓮の帰郷を、まるで「予定されていたこと」のように静かに迎える。
  motivation: 村の伝統を守り、祭りの儀式を滞りなく遂行すること。
  relationships:
  - name: 瀬戸 蓮
    relation: 従兄弟
  arc: 蓮の戸惑いを静かに見守りながら、彼を「客」として受け入れるための儀式を完遂させる導き手となる。
- name: 黒岩 厳
  role: 敵役
  age: 65
  gender: 男性
  appearance: 恰幅が良く、常に重厚な黒い雨合羽を着用している。肌は常に湿っており、不自然な光沢がある。
  personality: 厳格で排他的。村の掟を絶対とし、外来者に対して強い警戒心を持つ。一人称：ワシ。
  speech_style: 低く、威圧感のある、独特の訛りを含んだ話し方。
  background: 雨啜村の長であり、祭りの執行責任者。村の秩序を維持することに生涯を捧げている。
  motivation: 村の平穏を維持し、毎年のように現れる「最終列車」の客を、正しく村の理に組み込むこと。
  relationships:
  - name: 瀬戸 凪
    relation: 村の娘（保護対象）
  arc: 蓮の不作法を糾弾し、彼を異界の秩序へと強制的に引きずり込む役割を果たす。
- name: 濡れた影
  role: 謎の存在
  age: 0
  gender: 不明
  appearance: 顔の判然としない、濡れた衣類を纏った人影。常に水滴を滴らせ、周囲に湿った匂いを漂わせる。
  personality: 感情を感じさせない、ただ存在しているだけの不気味さ。一人称：不明。
  speech_style: 言葉を発さず、湿った音や低い唸りのような音のみ。
  background: 最終列車から降りてくる「客」の一人。蓮の死んだ叔父に酷似している。
  motivation: 蓮をこちら側の世界（列車の中、あるいは異界）へと誘うこと。
  relationships:
  - name: 瀬戸 蓮
    relation: かつての親族（の模造）
  arc: 蓮の記憶と現実の境界を揺さぶり、彼が「人間」であることをやめるためのきっかけを与える。
