title: 雨啜りの村と、最期の乗客
genre: 怪談・民俗
tone: 湿り気を帯びた不穏さと、静かな狂気
pov: 一人称
tense: 過去形
setting: 現代。山深い僻地に位置し、常に霧と雨に包まれている閉鎖的な村「雨啜村」
premise: 親戚の葬儀のため、数年ぶりに故郷へ戻った主人公は、村が執り行う奇妙な祭りの夜に立ち会う。その夜、一年に一度だけ現れる「最終列車」が、この世のものではない客を運んでくるという。もてなしの作法を違えたとき、村の静寂の中に潜んでいた「何か」が、ゆっくりと主人公の足元まで忍び寄る。
themes:
- 血縁という名の呪縛
- 生と死の曖昧な境界
rules:
- 祭りの夜に届く最終列車は、物理的なレールではなく『記憶の澱み』を走っており、乗客は生前の強い未練を持つ死者である
- 乗客に声をかけられた際、不用意に返答すると、自身の名前と存在を乗客に上書きされる
- 村人は乗客を『客』と呼び、特定の香 incense を焚くことで彼らの輪郭をぼかし、共存を図っている
plot_outline:
- '序盤: 葬儀のために帰郷した主人公が、村全体を覆う不自然な湿気と、住民たちのどこか虚ろな視線に違和感を抱く。村中から線香と腐った果実が混ざったような、甘ったるい匂いが漂い始める。'
- '中盤: 祭りの夜、村人たちが無言で駅へ向かう。到着した最終列車から降りてきたのは、顔の判然としない、濡れた衣類を纏った人々だった。主人公は、死んだはずの親族がその中に混ざっているような錯覚に陥る。'
- '終盤: 村の伝統的な作法を無視して「客」に触れてしまった主人公は、次第に自分の輪郭が薄れ、周囲の音が遠のいていく感覚に襲われる。同時に、村人が自分を「客」として扱い始めたことに気づく。'
- '結末: 再び列車が走り出す頃、主人公は自分が駅のホームに立っているのか、あるいは列車の中で外を眺めているのか判別できなくなる。ただ、隣に座る誰かの、ひどく冷たい指先が、ゆっくりと自分の手に重なった気がした。'
style_notes: 濡れた土、古い畳、錆びた鉄のような匂いを執拗に描写し、読者の嗅覚を刺激すること。また、遠くで鳴る鐘の音や、衣服が擦れる湿った音など、静寂の中の微細な音を強調する。「〜だったはずだ」「〜のように見えた」といった不確かな表現を多用し、正解を提示せずに不安感だけを増幅させる。
