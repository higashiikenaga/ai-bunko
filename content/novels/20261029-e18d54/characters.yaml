- name: リナ・クロムウェル
  role: 主人公
  age: 18
  gender: 女性
  appearance: 短く切り揃えられた灰色の髪、煤けた頬、使い古された革製の防護服、腰には複数の工具ポーチ。
  personality: 現実主義で皮肉屋。生き残るためなら手段を選ばない。一人称は「あたし」。
  speech_style: ぶっきらぼうで、語尾が強く跳ねるような荒っぽい口調。
  background: 廃墟の底で拾い集めたガラクタを売って食いつないできた屑拾い。
  motivation: 飢えと酸性雨から逃れ、安定した生活を手に入れること。
  relationships:
  - name: カイ
    relation: 同行者
  - name: バルガス
    relation: 追跡者
  arc: 自分のためだけに動いていた生存主義から、知識を使い、他者のために未来を切り開く勇気を持つ。
- name: カイ
  role: 相棒
  age: 12
  gender: 男性
  appearance: 大きすぎる防護ゴーグル、継ぎ接ぎだらけの作業着、細身で小柄な体格。
  personality: 好奇心旺盛で純粋。文字や物語への強い憧れを持つ。一人称は「ボク」。
  speech_style: 丁寧だが、言葉の使い方が少し独特で、物語のような表現を好む。
  background: 文字を教える者がいないスラムで育った孤児。
  motivation: 本の中に描かれた「青い空」や「清らかな水」をこの目で見てみたい。
  relationships:
  - name: リナ
    relation: 保護者兼相棒
  arc: 守られるだけの存在から、リナが持ち帰った知識の断片を繋ぎ合わせ、彼女を支えるパートナーへ。
- name: バルガス・ヴォルク
  role: 敵役
  age: 42
  gender: 男性
  appearance: 巨大な蒸気式義眼、錆びた重装甲の鎧、傷だらけの顔。
  personality: 残忍で強欲。力による支配こそが混沌とした世界を統べる唯一の手段と信じる。一人称は「俺」。
  speech_style: 低く威圧的で、相手を威圧するような断定的な話し方。
  background: 武装集団「鉄鼠団」の首領。旧文明の遺物を武器に変えて街を支配している。
  motivation: 大蒸気ポンプの再起動権を独占し、街全体の生命線を握ること。
  relationships:
  - name: リナ
    relation: 邪魔な獲物
  arc: 圧倒的な武力でリナを追い詰めるが、技術の真の価値を理解しないまま、自らの強欲さによって破滅する。
