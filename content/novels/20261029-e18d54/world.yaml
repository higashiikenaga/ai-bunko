title: 泥水と古本と、蒸気の唸り
genre: SF
tone: 退廃的で乾いたユーモア、泥臭いサバイバル感
pov: 一人称（あたし）
tense: 過去形
setting: 酸性雨が降り止まない錆びついた高地都市の廃墟。デジタル文明が崩壊し、人々は地下の遺物から掘り出した蒸気機関で細々と生きている世界。
premise: 食いぶちを稼ぐ屑拾いの「あたし」は、ある日地下深くで奇跡的に保存されていた「古本屋」を発見する。そこには失われた時代の技術書が眠っており、街を救う唯一の手段である巨大蒸気ポンプの再起動方法が記されていた。強欲な武装集団に狙われながら、あたしはたった一冊の古ぼけたマニュアルを抱えて、錆びた鉄の迷宮を駆け抜ける。
themes:
- 知識の価値と生存
- 絶望の中の小さな美学
rules:
- 電子機器は完全に動作せず、記録媒体は紙のみが有効であること
- 水は極めて貴重で、蒸気機関による精製が生命線であること
- 紙は燃料や通貨としても取引される超希少資源であること
plot_outline:
- '序盤: 生存物資（濾過フィルターと燃料）の残量に絶望しながら廃墟を漁るあたしが、偶然地下の古本屋に転落し、文明の残滓に触れる。'
- '中盤: 本に記された『大蒸気ポンプ』の存在を知るが、その情報は街を支配する武装集団の耳に入り、追われる身となる。道中で、文字の読めない世の中で本に憧れる奇妙な少年と同行することになる。'
- '終盤: ポンプのある最深部へ向かう。部品の不足と燃料切れという極限状態で、あたしは古本屋で見つけた図面と、皮肉なまでの運を駆使して巨大な蒸気機関を再起動させる。'
- '結末: 街に清浄な水が戻る。古本屋の多くは崩落したが、あたしは手元に残った数冊の本を抱え、相変わらず口を悪くしながらも、少しだけマシになった泥水のような日常に戻っていく。'
style_notes: 一人称「あたし」を徹底し、突き放したような皮肉屋の口調で語る。ただし、壊れた機械の歯車や、黄ばんだ紙の匂いなど、廃墟の中の微細な美しさを執拗に描写すること。また、「残り燃料200ml」「保存食あと3日分」など、物資の数値的な残量を頻繁に差し挟み、生存の切迫感を出す。
