- name: エリアン・ヴァンス
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で、常にインクの汚れが手に残っている。古びた司書服を纏い、知的ながらもどこか頼りなげな瞳。
  personality: 冷静で探究心が強いが、内向的。一人称は「僕」。
  speech_style: 丁寧で控えめ、論理的な話し方。
  background: 地下図書館の下級司書。帝国の歴史を学ぶ中で、建国神話を否定する禁忌の記述に触れてしまう。
  motivation: 帝国の沈下と建国神話の矛盾の真実を解明すること。
  relationships:
  - name: マリーナ
    relation: 協力者
  - name: カエレン・ドレイクン
    relation: 対立者
  arc: 真実から逃避する学者から、崩壊する世界を導く決断を下す指導者へ。
- name: カエレン・ドレイクン
  role: 敵役
  age: 45
  gender: 男性
  appearance: 屈強な体躯、顔に古い戦闘の傷跡。重厚な海軍将校の制服を隙なく着こなす。
  personality: 規律を重んじる冷徹なリアリスト。一人称は「俺」。
  speech_style: 断定的で威圧的、命令口調。
  background: 帝都防衛軍の最高司令官。軍事力による帝国の維持と、外敵からの防衛を信奉している。
  motivation: 海底遺跡を外敵の脅威と断じ、武力によって帝国の威信と秩序を守ること。
  relationships:
  - name: エリアン・ヴァンス
    relation: 邪魔者
  - name: ライラ・ソラリ
    relation: 利用対象
  arc: 秩序の守護者としての矜持が、帝国の必然的な滅亡を前にして崩壊していく。
- name: ライラ・ソラリ
  role: 脇役
  age: 38
  gender: 女性
  appearance: 神秘的な美貌、透き通るような白い法衣。常に穏やかな微笑を浮かべている。
  personality: 悟りを開いたような超越的な雰囲気を持つ。一人称は「私」。
  speech_style: 詩的で含みのある、静かな話し方。
  background: 帝都の国教を司る大巫女。海底遺跡の出現を「神の再臨」として民衆に説く。
  motivation: 地下図書館の「鍵」を起動させ、世界を浄化（沈没）させること。
  relationships:
  - name: エリアン・ヴァンス
    relation: 観察対象
  - name: カエレン・ドレイクン
    relation: 政治的対立者
  arc: 宗教的指導者から、旧世界の終焉と新世界の幕開けを司る媒介者へ。
- name: マリーナ
  role: 相棒
  age: 26
  gender: 女性
  appearance: 日焼けした肌、動きやすい潜水服。短髪で、実用的な道具をいくつも腰に下げている。
  personality: 現実主義で勇敢、生命力に溢れる。一人称は「あたし」。
  speech_style: さっぱりとしていて、飾り気のない口調。
  background: 帝都の貧民街出身の潜水士。海底遺跡の調査や、帝都の地下構造に精通している。
  motivation: 政治的な理想よりも、目の前の人々が生き延びるための術を探すこと。
  relationships:
  - name: エリアン・ヴァンス
    relation: 守るべき対象
  - name: ライラ・ソラリ
    relation: 不信感
  arc: 刹那的な生存主義者から、新しい文明の基盤を築く開拓者へ。
