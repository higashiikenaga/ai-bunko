title: 沈黙の帝都と黄金の泥濘
genre: 歴史・時代小説
tone: 重厚、荘厳、政治的、悲劇的
pov: 三人称多視点
tense: 過去形
setting: 海上に築かれた巨大帝都アエテルナ。文明の衰退期にある架空の海洋帝国。
premise: 栄華を極めた海洋帝国アエテルナは、今や緩やかな地盤沈下という避けられぬ運命に瀕していた。帝都の地下深く、禁忌とされる「地下図書館」に眠る古の叡智を巡り、宮廷の権力闘争が激化する。一方、海面に突如として姿を現した「海底遺跡」が、帝国の正統性を根底から覆す真実を突きつける。滅びゆく国家の最期に、人々は何を求め、何を捨てるのかを描く群像劇である。
themes:
- 文明の盛衰
- 知識の呪縛と解放
rules:
- 帝都の地盤は徐々に沈んでおり、下層階級の居住区から順に浸水被害を受けている
- 地下図書館への立ち入りは皇帝直属の司書のみに許され、知識の外部漏洩は死罪に相当する
- 海底遺跡から発掘される遺物は、現代の魔導技術を凌駕する未知の動力源を内蔵している
plot_outline:
- '序盤: 地盤沈下が加速し、帝都に不安が広がる中、宮廷では次期皇帝を巡る派閥争いが激化。地下図書館の若き司書が、禁書の中に帝国の建国神話を否定する記述を発見する。'
- '中盤: 沿岸部に巨大な海底遺跡が出現。これを「神の再臨」とする宗教派と「外敵の前兆」とする軍部が対立し、帝都の政治的均衡が崩壊。司書は遺跡の構造が地下図書館と対になっていることに気づく。'
- '終盤: 権力闘争の果てにクーデターが発生し、帝都は内乱の渦に飲み込まれる。地下図書館の真の目的が、帝都を完全に沈めて世界を浄化するための「鍵」であったことが判明する。'
- '結末: 帝都アエテルナは海へと還るが、司書と生き残った人々は海底遺跡の知恵を用いて、海と共に生きる新たな文明の礎を築く。かつての栄華は黄金の泥濘へと消え、新たな時代が幕を開ける。'
style_notes: 大河小説のような重厚な筆致。政治的駆け引きには冷徹な分析を、情景描写には絢爛たる装飾を施す。章の冒頭には必ず『〇年、〇月、〇日の記録。～』という年代記的な一文を挿入し、歴史の不可逆性と時間の経過を演出すること。
