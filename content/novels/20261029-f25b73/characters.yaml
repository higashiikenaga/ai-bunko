- name: 灰原 凱
  role: 主人公
  age: 27
  gender: 男性
  appearance: 常に眠たげで虚ろな眼差し。ボロボロのトレンチコートを羽織り、左腕には複雑な術式が刻印されている。古びた壊れた懐中時計を常に持ち歩いている。
  personality: 厭世的で無気力。過去を捨てたふりをしているが、根底には捨てきれない情の厚さを持つ。一人称は「俺」。
  speech_style: 低く、淡々とした、感情の起伏が少ない話し方。
  background: かつては呪術階級の頂点にいた天才的な刻印師だったが、ある禁忌の術式を使用した代償として、記憶と地位、そして「自分自身」という存在の核を失った落ちぶれた男。
  motivation: 少女を守ること。そして、断片的に残る「自分が何者であったか」という感覚を、失った五感と引き換えにでも取り戻すこと。
  relationships:
  - name: 栞
    relation: 守るべき対象であり、魂の共鳴者
  - name: 西園寺 宗厳
    relation: 排除すべき宿敵
  arc: 虚無感に満ちた日々を送る男が、少女との出会いを通じて「誰かのために全てを捧げる」という、最も人間らしく、最も残酷な決断を下すまでを描く。
- name: 栞
  role: ヒロイン
  age: 14
  gender: 女性
  appearance: 透き通るような白い肌と、夜の闇を溶かし込んだような黒髪。瞳は深い藍色。実体があるようでない、儚く美しい亡霊の少女。
  personality: 純粋無垢で物静か。死者としての諦念と、生者に対するかすかな好奇心が同居している。一人称は「私」。
  speech_style: 丁寧で、どこか遠い世界から語りかけるような、静かで落ち着いた話し方。
  background: 禁忌の経典の断片をその魂に宿してしまった、生者と死者の境界に漂う「死なない亡霊」。
  motivation: 自分が何者であるかを知り、呪縛から解き放たれて、一人の人間として「正しく死ぬ」こと。
  relationships:
  - name: 灰原 凱
    relation: 唯一、自分を人間として扱ってくれる存在
  arc: 運命に翻弄される「器」としての受動的な存在から、自らの意志で運命を受け入れ、凱の最後の選択を支える一人の人間へと成長する。
- name: 西園寺 宗厳
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない高級な和装。身体の至る所に、黄金に輝く贅を尽くした術式が刻まれている。威厳と狂気を孕んだ眼光。
  personality: 冷酷な狂信者。選民思想が強く、目的のためには数多の命を「塵」として扱う。一人称は「私」。
  speech_style: 相手を支配下に置くような、威圧的で教条的な話し方。
  background: 古都の呪術階級を束ねる一族の長。経典を完成させることで、現世を死者が支配する「永遠の停滞」へと導こうとしている。
  motivation: 経典による世界の理の書き換えと、死者が支配する理想郷の構築。
  relationships:
  - name: 灰原 凱
    relation: 秩序を乱す排除すべき異分子
  - name: 栞
    relation: 経典を完成させるための鍵（器）
  arc: 神のごとき力を手に入れようとするが、自らが信じる「理」の矛盾と、凱の自己犠牲という非合理な力によって破滅へと突き進む。
- name: 蓮見 零
  role: 脇役/ライバル
  age: 25
  gender: 男性
  appearance: 現代的な黒のスーツ。鋭い眼光と、常に最新の呪術端末を操作する指先。清潔感はあるが、どこか冷たい印象を与える。
  personality: 超合理主義者。感情を術式のノイズとして忌避し、規律と秩序を絶対視する。一人称は「僕」。
  speech_style: 事務的で、一切の無駄を排した論理的かつ効率的な話し方。
  background: 呪術管理機構の執行官。世界の均衡を保つため、逸脱した刻印師や禁忌の経典の回収を任務としている。
  motivation: 経典の暴走を阻止し、既存の呪術的秩序を維持すること。
  relationships:
  - name: 灰原 凱
    relation: 監視対象であり、理解不能なライバル
  - name: 西園寺 宗厳
    relation: 秩序を乱す最大の脅威
  arc: 秩序こそが正解だと信じていたが、凱が全てを捨てて世界を救う姿を目の当たりにし、世界の真の姿と正義の在り方に葛藤する。
