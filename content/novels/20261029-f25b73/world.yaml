title: 骸の経典、刻限の断罪
genre: 伝奇
tone: 峻烈、耽美、重厚な緊張感
pov: 三人称
tense: 過去形
setting: 現代日本、古の結界が幾重にも重なり、裏側で呪術的な階級社会を形成している古都
premise: 言霊を身体に刻むことで異能を振るう「刻印師」たちが、世界の理を書き換える禁忌の経典を巡って争う。主人公は記憶を代償に時間を局所的に停止させる「壊れた懐中時計」を持つ、落ちぶれた呪術師。夜明けのラジオから流れる「死者の声」を道標に、彼はある少女の魂を救い出すための絶望的な戦いに身を投じる。
themes:
- 喪失と救済
- 代償の必然性
rules:
- 全ての術の発動には、身体の一部、五感、または重要な記憶などの「等価な代償」を必要とする。
- 術式は厳格な幾何学陣と古語の詠唱によって構成され、一字の誤りも許されず、失敗すれば術者が反動で崩壊する。
- 禁忌の術を用いるほど、術者の存在確率（他者からの認識）が希薄になり、最終的に世界から消滅する。
plot_outline:
- '序盤: 記憶を失い続ける呪術師の男が、ある夜、壊れた懐中時計を媒介に「死なない亡霊」の少女と出会い、彼女に封印された禁忌の経典の断片を巡る抗争に巻き込まれる。'
- '中盤: 都市の地下に眠る経典の本体を狙う狂信的な一族と対峙。夜明けのラジオから流れる断続的なノイズの中にのみ現れる「先代の導き」を頼りに、男は自らの五感を一つずつ代償に捧げながら術式を構築していく。'
- '終盤: 経典の完成により現世と幽世の境界が消滅し、死者が溢れ出す。男は少女を救い出すため、自身の全記憶と存在を代償にする最大禁忌の術式「絶筆の断罪」を展開する。'
- '結末: 世界は元の形に戻るが、男は誰からも忘れ去られ、完全に消滅する。ただ一つ、修理された懐中時計だけが、彼がかつて存在した唯一の証として少女の手の中に残る。'
style_notes: 緊迫した戦闘シーンは体言止めや短文を多用し、速度感と切迫感を演出する。術式の発動場面では「其の理、ここに断たん」等の古風な言い回しを交え、儀式的な荘厳さを出す。代償が支払われる瞬間の肉体的・精神的な苦痛と喪失感を、残酷なまでに詳細に描写すること。
