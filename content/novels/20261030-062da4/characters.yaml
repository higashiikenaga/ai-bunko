- name: 瀬戸 凪
  role: 主人公
  age: 19
  gender: 女性
  appearance: 色素の薄い瞳と、引き締まった肢体。日焼けした肌に、長年の山歩きで鍛えられたしなやかな筋肉を持つ。
  personality: 内向的で静かな観察者。周囲の喧騒を避け、自然の微細な変化に敏感。一人称は「私」。
  speech_style: 落ち着いており、言葉を選ぶように穏やかに話す。無駄な装飾を好まない。
  background: 都会の過密な生活と人間関係に摩耗し、祖父が遺した海岸沿いの古い灯台近くの家へ移り住んだ。
  motivation: 自分が生きているという実感と、世界の循環の中に自分自身の居場所を見つけること。
  relationships:
  - name: 九条 蓮
    relation: 導き手
  - name: 櫂 朔斗
    relation: 対照的な価値観を持つライバル
  arc: 自然を「征服すべき対象」や「逃避先」としてではなく、自分自身を構成する一部として受け入れ、精神的な調和を得る。
- name: 九条 蓮
  role: 脇役
  age: 52
  gender: 男性
  appearance: 深い皺が刻まれた顔、日焼けした肌、使い込まれた登山道具を身に着けた山岳ガイドの風貌。
  personality: 寡黙で達観しており、山の理を熟知している。一人称は「俺」。
  speech_style: 短く、核心を突くような話し方。自然の音のように静かで重みがある。
  background: かつてはプロの登山家として名を馳せたが、ある出来事をきっかけに地元のガイドとして静かに暮らしている。
  motivation: 凪が山と対話する術を学び、自然の厳しさと慈しみを知る過程を見守ること。
  relationships:
  - name: 瀬戸 凪
    relation: 指導者的な役割
  arc: 凪の純粋な走りに触れることで、かつて自分が忘れてしまった「自然と一体になる感覚」を再確認する。
- name: 櫂 朔斗
  role: 敵役
  age: 20
  gender: 男性
  appearance: 最新の高性能なスポーツウェアに身を包んだ、洗練されたアスリート。鋭く挑戦的な眼差し。
  personality: 合理的で野心的。勝敗と記録を至上命題とする。一人称は「僕」。
  speech_style: 論理的で自信に満ちている。効率や数値を重視した、無駄のない話し方。
  background: 都市部の強豪トレーニングセンターで、科学的な管理のもとで徹底的に鍛え上げられたエリートランナー。
  motivation: トレイルランニングを技術的に完全攻略し、頂点に立つこと。
  relationships:
  - name: 瀬戸 凪
    relation: 走りの哲学が正反対のライバル
  arc: 自然をコントロール可能な対象として捉えていたが、凪の走りに触れ、数値化できない自然の深淵に直面し葛藤する。
