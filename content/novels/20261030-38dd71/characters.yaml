- name: 葛城 蓮
  role: 主人公
  age: 23
  gender: 男性
  appearance: 痩身で理知的な風貌。度の強い眼鏡をかけ、都会的な書記官の服に蒸気機関の煤が薄くついている。
  personality: 慎重で観察眼が鋭い。合理主義者で、非科学的な事象を嫌う。一人称は「僕」。
  speech_style: 丁寧で論理的な話し方。混乱すると言葉が短くなる。
  background: 都市部の技術局に勤める書記官。蒸気機関の構造に精通しており、天球儀の修理派遣を命じられて星喰村へやってくる。
  motivation: 蒸気機関の修理を完遂し、村の不自然な風習の正体を解明すること。
  relationships:
  - name: 志乃
    relation: 村の案内役として頼るが、彼女の異様さに戸惑う
  - name: 厳島 宗助
    relation: 村の権威として接するが、次第に警戒心を抱く
  arc: 理性的で客観的な観測者から、逃れられない宇宙的恐怖の目撃者へと変貌する。
- name: 志乃
  role: 相棒/キーパーソン
  age: 19
  gender: 女性
  appearance: 黒髪の長いポニーテール。村の伝統的な装束を纏っているが、どこか生気を感じさせない表情。
  personality: 無口で感情の起伏が乏しい。村の掟を絶対的なものとして受け入れている。一人称は「私」。
  speech_style: 抑揚のない淡々とした話し方。時折、独特の村の方言が混じる。
  background: 星喰村の娘。次回の儀式において、天球儀を動かすための「記憶」を捧げる生贄の候補として選ばれている。
  motivation: 村の平穏を守り、神（星）の怒りを買わないこと。
  relationships:
  - name: 葛城 蓮
    relation: 外の世界から来た異質な存在として興味を抱く
  arc: 盲目的な信仰心から、自らの犠牲が意味する残酷な真実を知り、絶望へと沈んでいく。
- name: 厳島 宗助
  role: 敵役
  age: 58
  gender: 男性
  appearance: 威厳のある老人。重厚な祭服を纏い、常に古い油と香の匂いをさせている。
  personality: 冷酷なリアリスト。村の存続のためなら個人の犠牲を厭わない強い意志を持つ。一人称は「我」。
  speech_style: 重々しく、有無を言わせぬ威圧的な口調。
  background: 星喰村の村長であり、天球儀の管理責任者。星から降る「何か」を封じ込めることを使命としている。
  motivation: 天球儀を稼働させ続け、星の災厄を村の外に押し留めること。
  relationships:
  - name: 葛城 蓮
    relation: 儀式を円滑に進めるための「技術的手段」として利用する
  - name: 志乃
    relation: 守るべき村の構成員であり、同時に必要な供物
  arc: 秩序の守護者として振る舞うが、暴走する天球儀と共に、自身の守ってきた世界の崩壊を目の当たりにする。
- name: 嘉間
  role: 脇役
  age: 45
  gender: 男性
  appearance: 目が虚ろで、常に油まみれの作業着を着ている。手足の一部が機械の部品のように硬直している。
  personality: 記憶を失っており、同じ動作や言葉を繰り返す。一人称は「オレ」。
  speech_style: 支離滅裂で、機械の駆動音のような断片的な言葉を発する。
  background: かつて天球儀の整備士だったが、儀式で「記憶」を過剰に捧げた結果、自我を失い、機械の一部のように生きている。
  motivation: 止まった歯車を回し続けるという、本能的な衝動のみに従う。
  relationships:
  - name: 葛城 蓮
    relation: 技術的な助言を与えるが、同時に儀式の恐怖を体現する存在
  arc: 物語の序盤で、村の儀式が人間に与える「欠損」の恐ろしさを象徴的に示す。
