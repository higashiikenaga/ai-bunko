title: 星屑の柩と鉄の供物
genre: ホラー
tone: 静謐で閉鎖的、湿り気を帯びた土着の恐怖
pov: 三人称
tense: 過去形
setting: 明治期に似た、蒸気機関が普及しつつあるが、未だ深い山々に囲まれた閉鎖的な村・星喰村（ほしみ村）
premise: 山間の星喰村では、百年に一度、天の動きを記録する「星図」を神に捧げる儀式が行われる。村の若者は、神の声を聴くための巨大な蒸気機関――天球儀を動かすための生贄として、選ばれた者たちの『記憶』を捧げなければならない。村外れから来た書記官の青年は、蒸気の煤と古い血の匂いが混ざり合う村の異様さに気づいていく。星々が異常な配置を見せ始めた時、機械の歯車は、人ならざるものの足音を刻み始める。
themes:
- 因習による個の喪失
- 科学と土着信仰の軋轢
- 天体への畏怖
rules:
- 星図の配置が狂うと、村の境界が曖昧になり、境界の『外』のものが侵入する
- 蒸気機関の稼働には、村の掟に基づいた『血を引く者の供物』が必要である
- 村の人間は、特定の星が沈むまでは決して村の結界を越えてはならない
plot_outline:
- '序盤: 蒸気機関の修理のために星喰村を訪れた青年が、村人が星の運行を異常なほど恐れ、奇妙な方言で「星が落ちる」と囁き合っている光景を目にする。'
- '中盤: 村の祭礼が近づく中、青年は村の地下に眠る巨大な蒸気駆動式天球儀を発見する。それは星図を物理的に動かし、神を欺くための装置だった。しかし、その歯車の隙間には、かつて儀式に失敗した者たちの遺骸が組み込まれていることを知る。'
- '終盤: 儀式の夜、天球儀が激しく唸りを上げ、星図が書き換わる。青年は、村人たちが星を崇拝しているのではなく、星から降ってくる『何か』を機械の力で押し留めようとしている真実を知る。'
- '結末: 蒸気機関が暴走し、星図が完成した瞬間、空から降ってきたのは光ではなく、形を持たない暗黒の塊であった。青年は、村の静かな日常が、ただの凄惨な捕食の合間に過ぎなかったことを悟り、機械の轟音と共に闇に呑まれていく。'
style_notes: 湿った土の匂いや、錆びた鉄の質感、蒸気の熱気を強調する。会話には「〜じゃけぇ」「〜のう」といった、聞き慣れないが粘着質な地方の方言を混ぜる。恐怖は直接的な暴力ではなく、逃げ場のない静寂と、理不尽な言い伝えの重圧として描写する。
