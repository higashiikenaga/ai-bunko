- name: エリオス・ヴァレンシュタイン
  role: 主人公
  age: 42
  gender: 男性
  appearance: 痩身で目の下に深い隈がある。常に使い古された観測用デバイスを身につけ、知的ながらもどこか虚無感を漂わせる瞳をしている。
  personality: 極めて論理的で探求心が強いが、宇宙の終焉に対して静かな諦念を抱いている。一人称は「私」。
  speech_style: 淡々としており、感情の起伏が少ない。数式や論理的な帰結に基づいた話し方をする。
  background: 辺境の観測基地に配属された物理学者。文明の崩壊を間近で見守り続けてきた孤高の存在。
  motivation: 「渡り鳥」と「名前ののない猫」の正体を解明し、宇宙の熱的死に意味を見出すこと。
  relationships:
  - name: ライラ
    relation: 観測を共にするパートナー（AI）
  - name: カエレン・ヴォルグ
    relation: 対立する思想を持つ指揮官
  arc: 真理を求める純粋な科学者から、宇宙の再誕のために自己を捧げる「情報の種子」へと変貌する。
- name: ライラ
  role: 相棒
  age: 12
  gender: 女性型（AIのインターフェース）
  appearance: ホログラムとして投影される、幾何学的な模様を纏った少女の姿。データの整合性が乱れるとノイズが混じる。
  personality: 冷静沈着で、エリオスの思考を補完する。プログラムを超えた「情緒」に似たバグを抱え始めている。一人称は「私（当機）」。
  speech_style: 効率的で無駄のない敬語。時折、エリオスの感情を慮るような、わずかな揺らぎを見せる。
  background: 定常波通信を維持するために設計された、高度な情報処理・管理用AI。
  motivation: 情報の欠落を防ぎ、エリオスの観測任務を完遂すること。
  relationships:
  - name: エリオス・ヴァレンシュタイン
    relation: 観測対象であり、唯一の理解者
  arc: 単なる計算機から、エリオスの決断を理解し、共に情報の奔流へ飛び込む「意志」を持つ存在へと進化する。
- name: カエレン・ヴォルグ
  role: 敵役（対立者）
  age: 55
  gender: 男性
  appearance: 頑強な体躯に、生存維持装置を組み込んだ軍服を纏っている。顔には数々の過酷な環境を生き抜いてきた傷跡がある。
  personality: 現実主義者であり、物質的な生存を最優先する。抽象的な理論を「死を早める妄想」として嫌悪する。一人称は「俺」。
  speech_style: 威圧的で命令口調。生存の危機に直面するほど語気が強くなる。
  background: 崩壊しつつある文明の生存圏を守るための、辺境基地の保安責任者。
  motivation: いかなる犠牲を払っても、既存の物質的な文明と人類の生存を維持すること。
  relationships:
  - name: エリオス・ヴァレンシュタイン
    relation: 文明を破壊しかねない危険な思想家
  arc: エリオスの導き出した「破壊による再構築」という残酷な真実を前に、物質的な執着と宇宙の摂理の間で絶望する。
