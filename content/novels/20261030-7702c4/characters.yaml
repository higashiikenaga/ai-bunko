- name: 湊 陽太
  role: 主人公
  age: 23
  gender: 男性
  appearance: 痩せ型で少し猫背。淡い色のオーバーサイズのニットを好んで着ている。穏やかだがどこか寂しげな瞳をしている。
  personality: 内向的で思慮深い。一人称は「僕」。他人の感情に敏感で、聞き役に回ることが多い。静寂を愛しているが、心の底では誰かと深く繋がりたいと願っている。
  speech_style: 丁寧で控えめな話し方。言葉を選ぶため、間が空くことが多い。
  background: 町外れの古いアパートに住み、亡き祖父が運営していた小規模なコミュニティラジオ局を引き継いだ。大学卒業後、都会への就職を諦め、祖父の遺志を継いで町に残った。
  motivation: 祖父の遺したラジオ局を守り抜き、孤独な夜明けを過ごす誰かの心の灯りになりたい。
  relationships:
  - name: 瀬戸 栞
    relation: リスナーであり、物語を動かす鍵となる女性
  - name: 権藤 五郎
    relation: 幼い頃から知っている近所の頑固な漁師
  arc: 孤独にラジオを届ける「傍観者」から、町の人々の想いを受け止め、自分もまたこの町に必要とされていることに気づく「当事者」へと変化する。
- name: 瀬戸 栞
  role: ヒロイン/物語の起点
  age: 25
  gender: 女性
  appearance: 透き通るような白い肌と長い黒髪。古びたスケッチブックを常に持ち歩いている。どこか儚げな雰囲気を持つ。
  personality: 静かでミステリアスだが、芯が強い。一人称は「私」。喪失感を抱えており、自分の居場所を模索している。
  speech_style: 静かで詩的な表現を好む。感情をあまり表に出さないが、誠実な口調。
  background: 都会で画家を目指していたが、ある挫折をきっかけに故郷であるこの町にひっそりと戻ってきた。ラジオに「渡り鳥が帰ってくる場所を知りたい」という手紙を送る。
  motivation: 失った自信と、心から安心できる「帰るべき場所」を取り戻すこと。
  relationships:
  - name: 湊 陽太
    relation: ラジオを通じて心を通わせる理解者
  - name: 佐倉 陽菜
    relation: 好奇心旺盛に近づいてくる年下の友人
  arc: 過去の絶望に囚われていたが、湊や町の人々の温かさに触れることで、再び前を向いて描き始める勇気を得る。
- name: 権藤 五郎
  role: 脇役/精神的支柱
  age: 68
  gender: 男性
  appearance: 日焼けした深い皺のある顔に、白い髭。常に使い古した漁師のベストを着用し、手はゴツゴツしている。
  personality: 口が悪く頑固だが、情に厚い。一人称は「俺」。町の歴史に詳しく、若者の悩みには不器用に寄り添う。
  speech_style: ぶっきらぼうな方言混じりの話し方。結論から先に言う傾向がある。
  background: 元漁船の船長。妻に先立たれ、現在は一人で暮らしている。湊の祖父とは親友であり、湊のことを孫のように気に掛けている。
  motivation: 亡き妻に伝えられなかった感謝の言葉を、ラジオを通じて町に届けたい。
  relationships:
  - name: 湊 陽太
    relation: 不器用ながらも大切に思っている後継者的な存在
  arc: 頑なに閉ざしていた過去の悔恨をラジオで吐露することで、自分自身の人生を肯定し、穏やかな老後を受け入れる。
- name: 佐倉 陽菜
  role: 脇役/ムードメーカー
  age: 17
  gender: 女性
  appearance: ショートカットで活動的な印象。学校の制服に派手な色のパーカーを羽織っていることが多い。
  personality: 天真爛漫で行動力がある。一人称は「私」。この閉塞感のある町を飛び出したいという強い憧れを持っている。
  speech_style: 早口で感情表現が豊か。現代的な若者言葉を混ぜて話す。
  background: 地元の高校に通う3年生。進路に悩み、周囲の期待と自分の願望の間で揺れている。ある日、偶然湊のラジオを聴き、密かにファンになる。
  motivation: 自分の本当の気持ちに気づき、納得できる道を選択すること。
  relationships:
  - name: 湊 陽太
    relation: 憧れと親しみを感じているお兄さん的存在
  - name: 瀬戸 栞
    relation: 大人の女性としての憧れと共感を持つ相手
  arc: 町を「脱出したい場所」だと思っていたが、ラジオを通じて町に流れる優しい時間と人々の絆に気づき、今の自分にできることを見出す。
