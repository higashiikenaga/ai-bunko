- name: 瀬戸 航
  role: 主人公
  age: 23
  gender: 男性
  appearance: 清潔感はあるが線が細く、新品の作業着が少し大きく見える青年。眼鏡をかけている。
  personality: 合理的で論理的。疑問を抱くと突き詰める性格。一人称は「僕」。
  speech_style: 丁寧で標準的な話し方。効率やデータに基づいた根拠を求める傾向がある。
  background: 工学部卒業後、技術派遣会社に入社。最新の光学理論に精通しているが、現場での「勘」や「経験」という曖昧な概念に懐疑的。
  motivation: 自分の仕事が誰にどう役立っているのか、数値化できない価値を見出したい。
  relationships:
  - name: 潮崎 厳
    relation: 師匠であり、価値観が対立する導き手
  - name: 凪原 結衣
    relation: 気さくに接してくれる良き先輩
  arc: 効率至上主義から脱却し、地道な手仕事がもたらす「確実な救い」に誇りを持つようになる。
- name: 潮崎 厳
  role: 師匠・ベテラン技術者
  age: 58
  gender: 男性
  appearance: 潮風にさらされた深い皺と、節くれだった大きな手を持つ。常に使い古された作業用エプロンを着用している。
  personality: 寡黙で厳格。完璧主義者だが、内面には海と灯台への深い愛情を持つ。一人称は「私」。
  speech_style: 短く断定的な言い回し。専門用語を交えつつも、本質を突く比喩を用いる。
  background: 灯台保守技術者の三代目。数十年にわたりこの沿岸部の灯台を守り続けてきた、地域の生き字引的な存在。
  motivation: 機械化が進んでも変わらない「光の質」を維持し、次世代に技術を継承すること。
  relationships:
  - name: 瀬戸 航
    relation: 不器用ながらも期待を寄せている弟子
  - name: 凪原 結衣
    relation: 信頼している腕の良い助手
  arc: 航の合理的な視点が、古い技術に新しい気づきを与えることを認め、心を許していく。
- name: 凪原 結衣
  role: 相棒・中堅技術者
  age: 29
  gender: 女性
  appearance: ショートカットで快活な印象。工具ベルトを腰に巻き、動きやすさを重視した服装。
  personality: 楽観的で社交的。厳格な潮崎と戸惑う航の間を取り持つ緩衝材のような存在。一人称は「私」。
  speech_style: 明るくフランク。冗談を交えながら、難しい作業を前向きに捉えさせる話し方。
  background: 元々は都市部の電子機器メーカーに勤めていたが、海への憧れから転職。理論と現場の両方を知る。
  motivation: この土地の風景と、そこに住む人々、そして航路を行き交う船の安全を心から願っている。
  relationships:
  - name: 瀬戸 航
    relation: 迷える後輩を精神的にサポートする姉貴分
  - name: 潮崎 厳
    relation: 尊敬しつつも、たまに頑固さにツッコミを入れる関係
  arc: 航の成長を促すことで、自分自身の技術者としての初心を思い出し、より深い職人魂に目覚める。
- name: 霧島 宗助
  role: 脇役・元灯台守
  age: 72
  gender: 男性
  appearance: 小柄で腰が曲がっている。厚手のニットカーディガンを羽織り、常にパイプを咥えている。
  personality: 穏やかで哲学的。海と共に生きる知恵を持っており、物語の精神的な支柱となる。一人称は「ワシ」。
  speech_style: ゆっくりとした口調で、物語を語るように話す。方言が混じっている。
  background: かつてこの地域の最古の灯台で灯台守を務めていた。現在は作業所の近くに住み、技術者たちの休息を見守っている。
  motivation: 灯台の光が絶えることなく、迷える者が帰る場所であり続けてほしい。
  relationships:
  - name: 潮崎 厳
    relation: かつての教え子であり、旧知の友人
  - name: 瀬戸 航
    relation: 若者の葛藤を静かに見守る賢者
  arc: 航に「光の向こう側にいる人間」の存在を意識させ、メンテナンスの本当の意味を気づかせる。
