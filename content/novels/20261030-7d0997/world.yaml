title: 残光の記録 ―不夜城の灯火と、継承される遺言―
genre: ヒューマンドラマ
tone: 静謐だが熱を帯びた、技術者たちの矜持を描く物語
pov: 一人称（瀬戸航の「僕」）
tense: 現在形・過去形混在
setting: 前作の数年後。巨大なエネルギー消費により、昼夜の区別を失った「眠らない街」と呼ばれる近未来の臨海都市。
premise: 灯台保守技術者として歩み始めた僕は、かつて救ったあの「銀色の存在」の余波が、都市のインフラに影を落としていることに気づく。眠らない街の眩い光の裏側で、旧式の制御システムが限界を迎え、都市の生命線が揺らぎ始めていた。ある日、僕は亡き先代技術者から託された、解読不能な「遺言」のような設計図を手にする。それは、失われつつある「暗闇」と「正確な光」を取り戻すための、最後の設計図だった。
themes:
- 技術の継承と伝統の重み
- 便利さと引き換えに失ったものへの追憶
rules:
- 前作で示唆された『未知の存在』による光への干渉は、現代の高度な電気通信網にも微細なノイズとして影響を与えている
- 灯台の光学機器のメンテナンスは、数値化できない『直感的な同調』が必要とされる特殊技能である
- 都市の電力供給は極めて安定しているように見えるが、実は不安定な『光の脈動』によって維持されている
plot_outline:
- '序盤: 灯台保守の仕事を続ける僕。都市は『眠らない街』として進化し、かつての灯台の役割は縮小していた。しかし、都市の基幹システムに原因不明の『光の揺らぎ』が発生。僕は、かつての師である潮崎から、亡くなった旧技術者が遺した古いメンテナンス・ログ（遺言）を託される。'
- '中盤: ログには、都市の光の設計に潜む致命的な欠陥と、銀色の存在がもたらす干渉への対策が記されていた。僕は、凪原と共に、最新のデジタル制御と、旧式の光学技術を融合させる『ハイブリッド調整』に挑む。専門用語である「指向性（光を特定の方向に集中させる性質）」の制御に苦戦しながら、現場の技術者たちが誇りを持って古い道具を使い続ける姿に触れていく。'
- '終盤: 都市全域を覆う巨大な光の干渉が、ついに制御不能に陥る。街の明かりが暴走し、人々が眠れない狂乱に陥りかける中、僕は潮崎の教えを胸に、かつての灯台で学んだ『同調』の技法を都市の主制御塔で実践する。数値ではなく、光の波形そのものを「感じる」ことで、暴走するエネルギーを鎮めるための極限の調整を行う。'
- '結末: 嵐のような光の暴走は収まり、都市に「静かな夜」が戻る。僕は、技術とは単なる計算ではなく、受け継いできた意志の積み重ねであることを悟る。手元に残った古い設計図は、次世代へ繋ぐための新しい地図へと変わっていた。'
style_notes: 新人である「僕」が、現場のプロフェッショナルたちの言葉に圧倒されながらも、その背中を追う過程を丁寧に描く。専門用語（例：指向性、光軸、同調など）が登場する際は、必ず「――それは、〇〇ということだ」と、僕の視点で噛み砕いて解説する。大きな事件の解決よりも、ネジ一本の締め具合や、レンズのわずかな曇りを取り除いた瞬間の、指先に伝わる小さな達成感を細やかに描写する。
