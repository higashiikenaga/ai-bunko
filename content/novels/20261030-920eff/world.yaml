title: 共鳴する夜の残響と、地上の調べを紡ぐ空飛ぶ船
genre: 群像劇
tone: 叙情的でリズムに富んだ、希望と喪失が交差するファンタジー
pov: 三人称（各話の主人公が交代する群像劇形式）
tense: 過去形
setting: 浮遊都市ノクトピアが地上へと降下を開始した後の世界。雲海を抜けた先に広がる、多様な音階を持つ未知の陸地と、空を駆ける蒸気船の時代。
premise: ノクトピアが地上へと舞い降りた後、世界は「完璧な静寂」ではなく、無数の「雑音」に満ちた混沌を迎えていた。かつて不協和音を奏でたカエレンとライラは、地上で流浪しながら、失われた音の記憶を辿る旅に出る。彼らの前には、古本の中に眠る旋律を求める司書や、空飛ぶ船を操る旋律師たちが現れる。バラバラになった音の破片を繋ぎ合わせ、新たな世界の調律を見つけるための、旋律の旅が始まる。
themes:
- 不完全なものへの肯定
- 継承される記憶と音
rules:
- 音楽は物理的なエネルギーとして作用し、音階によって事象（熱、光、重力）を操ることができる。
- 『旋律の残響』と呼ばれる現象により、過去に強く奏でられた音は、特定の場所や物に記憶として刻まれる。
- 空飛ぶ船の航行には、船体と同期する「操舵用旋律（ナビゲーション・メロディ）」が不可欠である。
plot_outline:
- '序盤: 地上に降り立ったノクトピアの住人たちは、未知の環境に戸惑いながらも、各地で異なる「音の文化」を持つ人々との接触を開始する。カエレンとライラは、古い旋律が記された古本を探す旅の途中で、空飛ぶ船『アルペジオ号』の船長と出会い、音の地図を求めて空の旅へ出る。'
- '中盤: 各地を巡る中で、かつての調律師たちが「世界の音を統一しようとした痕跡」が各地に残されていることが判明する。カエレンたちは、音を奪い、静寂による支配を目論む「無音の教団」の暗躍を知る。物語は、古本屋を営む盲目の楽譜家、空飛ぶ船の操舵士、そして街の調律師だったエララの視点を交え、多層的に展開していく。'
- '終盤: 教団が放つ「絶対静寂」の波が、地上の多様な音を飲み込み始める。カエレンとライラは、アルペジオ号を駆り、教団の本拠地である「沈黙の塔」へと突入する。彼らは、これまでの旅で出会った人々の、不揃いで、けれど温かい「生の音」を集め、世界を救うための究極の即興曲（インプロヴィゼーション）を奏でようとする。'
- '結末: 完璧な和音ではなく、あえて不協和音を含んだ「生きた音楽」が世界に響き渡り、教団の静寂を打ち破る。世界は再び、騒がしくも美しい、予測不可能な音の響きに満たされる。カエレンとライラは、空飛ぶ船のデッキで、新しい時代の夜明けを告げる風の音に耳を澄ませる。'
style_notes: 文章は音楽的なリズムを重視し、三拍子や四拍子の鼓動を感じさせる句読点の配置を行うこと。情景描写には音のメタファーを多用する。各話の冒頭または結びに、その章の感情を象徴する一節の歌詞（例：『震える指先、奏でるは祈りか、それとも呪いか――』）を挿入し、物語に詩的な彩りを添えること。
