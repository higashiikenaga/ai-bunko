- name: エリアス・ヴァント
  role: 主人公
  age: 28
  gender: 男性
  appearance: 銀色の髪に、硝子の粉が薄く付着している。細く長い指先と、深い藍色の瞳を持つ。
  personality: 冷静で職人気質。感情を抑制し、美的な完成度を追求する。一人称は「僕」。
  speech_style: 丁寧だが、どこか距離を感じさせる淡々とした口調。
  background: 記憶を宝石に加工する一族の末裔。代償として、自身の過去の記憶を欠落させている。
  motivation: 完璧な、魂の結晶を創り出すこと。
  relationships:
  - name: リィネ
    relation: 運命を変える依頼人
  arc: 無機質な職人から、他者の痛みに共鳴し、自らの心に消えない記憶を刻む人間へと変化する。
- name: リィネ・フロスト
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような白い肌と、凍てつく硝子のような青い瞳。氷細工のように儚い容姿。
  personality: 浮世離れしており、残酷な美しさを好む。一人称は「私」。
  speech_style: 静かで、詩的な響きを持つ、冷ややかな話し方。
  background: 極北の「氷の城」に住まう、実体を持たない記憶の化身のような存在。
  motivation: 最も美しく残酷な記憶をあえて結晶化させ、自らの存在を維持すること。
  relationships:
  - name: エリアス
    relation: 記憶を加工する職人
  arc: 記憶を捨てて生き永らえる道から、記憶を刻むことで「喪失」を受け入れる覚悟へと至る。
- name: カミラ・ソーン
  role: 脇役
  age: 35
  gender: 女性
  appearance: 常に黒い喪服のような服を纏い、枯れた薔薇のような陰のある美貌を持つ。
  personality: 悲劇的で、絶望に慣れきっている。一人称は「私」。
  speech_style: 祈るような、掠れた、消え入りそうな声。
  background: 繰り返される喪失の苦痛から逃れるため、何度も記憶を売りに来る『忘却の市』の常連。
  motivation: 苦痛を完全に消し去り、平穏な無（忘却）を得ること。
  relationships:
  - name: エリアス
    relation: 顧客
  arc: 忘却を渇望する存在として、リィネの「忘れることを拒む」姿勢との対比を描く。
