title: 硝子細工の追憶、氷晶の揺り籠
genre: ヒューマンドラマ
tone: 耽美で静謐、壊れやすく美しい哀愁
pov: 一人称
tense: 過去形
setting: 常春の熱気に包まれながらも、極北の凍てつく空気が混じる架空の都市。中心部には『忘却の市』が広がる。
premise: 私は、人々の魂の欠片を宝石へと加工する職人である。人々は苦痛に満ちた記憶を『記憶を売る市場』へと持ち込み、代わりに輝かしい結晶へと変えて差し出す。ある日、私の元へ「氷の城」に住まうという、形のない記憶を持った少女が訪れる。彼女が求めるのは、失った愛の記憶ではなく、あえて忘れることを拒んだ、最も美しく残酷な痛みであった。
themes:
- 忘却による救済と喪失
- 痛みの美学
rules:
- 記憶を売る際は、その記憶が持つ感情の純度に応じて、生成される宝石の輝きが変わる
- 一度市場へ売却した記憶は、二度と元の形では取り戻せない
- 氷の城の住人は、極寒の孤独を維持するために、自らの熱（記憶）を物質化して差し出さなければならない
plot_outline:
- '序盤: 記憶を宝石に加工する職人である『私』の日常と、市場に集う人々の切実な願いが、装飾的な筆致で描かれる。'
- '中盤: 氷の城からやってきた、瞳が凍てつく硝子のような少女との出会い。彼女の記憶は、他の者とは異なり、触れると指先を切り裂くような鋭利な輝きを放っていた。'
- '終盤: 少女の記憶の核に触れた『私』は、彼女が自らの存在を維持するために、最も愛した人の記憶をあえて結晶化して捨てようとしている事実を知る。'
- '結末: 記憶を宝石として完成させた時、少女は温もりを失い、私は彼女の記憶の残滓を、永遠に割ることのできないプリズムとして胸に刻む。'
style_notes: 比喩として「割れた鏡」「零れ落ちる真珠」「凍てついた薔薇」を多用すること。感情の機微を、温度や光の屈折、硬度といった質感に置き換えて詩的に表現する。叙情的で、読者の皮膚に冷たい硝子が触れるような、繊細で装飾的な文体を維持せよ。
