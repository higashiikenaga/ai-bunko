- name: 源次
  role: 主人公
  age: 22
  gender: 男性
  appearance: 日焼けした肌に藍染めの半纏を羽織った、身軽で細身の青年。常に道具箱を提げている。
  personality: お人好しで世話好き。好奇心旺盛だが、どこか冷めたところもある。一人称は「俺」。
  speech_style: 江戸っ子らしい威勢の良さと、相手への気遣いが混じった気さくな口調。「〜じゃねえか」「へい」など。
  background: 両親を早くに亡くし、長屋の便利屋として修理や雑用をこなして日銭を稼いでいる。
  motivation: 亡き隠居の残した箪笥から見つけた秘密の地図の謎を解き、路地裏の「忘れ物」を探し出すこと。
  relationships:
  - name: 惣兵衛
    relation: 恩人であり、箪笥を残して亡くなった隠居
  - name: お糸
    relation: 長屋の幼馴染で、源次の無茶を呆れつつも手伝う娘
  arc: 単なる好奇心や一攫千金の期待から地図を追い始めるが、人々との出会いを通じて、失われゆく江戸の人情の尊さに気づき、長屋の暮らしこそが自分の居場所だと確信する。
- name: お糸
  role: 相棒
  age: 20
  gender: 女性
  appearance: 栗色の手ぬぐいを粋に被り、明るい笑顔が印象的な娘。動きやすいように裾をまくっている。
  personality: 勝ち気で現実的。面倒見が良く、源次の無謀な行動にブレーキをかける。一人称は「あたし」。
  speech_style: ハキハキとした江戸言葉。「もう、勝手なことばかり言って！」など。
  background: 長屋の茶店の娘。源次とは幼馴染で、昔から彼の面倒を見ている。
  motivation: 源次が地図の謎に巻き込まれてトラブルを起こさないよう見守り、一緒に路地裏の秘密を暴くこと。
  relationships:
  - name: 源次
    relation: 幼馴染であり、放っておけない存在
  arc: 源次と共に路地裏を巡る中で、かつての街の記憶や人々の深い絆に触れ、自身も街や人々に対する愛着を深めていく。
- name: 惣兵衛
  role: 脇役
  age: 70
  gender: 男性
  appearance: 背中が少し曲がり、白髪交じりの髪に温和な目をたたえた老職人。いつも使い古された眼鏡をかけている。
  personality: 物静かで知的。かつての江戸の歴史や路地裏の秘密をよく知る。生前は頑固者として恐れられた。
  speech_style: 落ち着いた低めの声で、含蓄のある言葉遣い。「ふむ、そう慌てるな」など。
  background: 長屋に長く暮らしていた元・腕利きの仕立て職人。源次に細工の技術や生きる知恵を教えた。
  motivation: 自分が遺した地図を通じて、源次に忘れかけた「大切な何か」を思い出させること。
  relationships:
  - name: 源次
    relation: 頼りにしていた一番弟子
  arc: 物語の開始時点で故人だが、彼が遺した箪笥と地図がすべての発端となり、生前の想いが源次を通じて蘇る。
