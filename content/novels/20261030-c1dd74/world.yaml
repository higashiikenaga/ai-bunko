title: 江戸鼠と、路地裏の記憶
genre: 歴史・時代小説
tone: 活気ある市井の賑わいと、人情味あふれる温かな雰囲気
pov: 三人称
tense: 過去形
setting: 江戸時代、隅田川に近い下町の長屋
premise: 長屋の便利屋として日々を奔走する青年・源次は、亡くなった隠居の古びた箪笥を修理している最中、底に隠された「秘密の地図」を見つける。それは、江戸の迷路のような路地裏に、ある「忘れ物」が眠っていることを示す奇妙な図面だった。祭りの熱狂が街を包む夜、地図が導く先で、源次は金銀財宝よりも尊い、人々の絆の物語に触れることになる。
themes:
- 人情と絆
- 過去との和解
rules:
- 江戸の身分制度と風俗に基づいた現実的な描写を徹底する
- 魔法や超常現象は一切排除し、すべては人の知恵と偶然、そして人情によって解決する
plot_outline:
- '序盤: 長屋の便利屋、源次は、亡き隠居が遺した箪笥を直している最中、隠された秘密の地図を見つける。地図には、今の地図には載っていないはずの、古い蔵や細い路地が記されていた。'
- '中盤: 地図の謎を追う中で、源次はかつての賑わいを懐かしむ老人や、商売に苦しむ職人たちと出会う。地図が指し示す場所は、実は江戸の街が失いかけている「人々の思い出」が詰まった場所だった。'
- '終盤: 夏祭りの夜、笛の音が響き渡り、街が熱狂に包まれる中、源次は地図の最後の目的地へと辿り着く。そこには、ある事件で離ればなれになった家族の再会の鍵が隠されていた。'
- '結末: 財宝は手に入らなかったが、源次は長屋の仲間たちと、祭りのあとの冷やし飴や川魚を囲み、笑い合う。江戸の夜の静寂の中に、人情の灯がともる。'
style_notes: 江戸の市井を描くため、五感（音、匂い、味）を豊かに表現すること。会話文は「てやんでえ」「べらんめえ」といった威勢の良い江戸言葉を使い、長屋の住人たちの距離の近さを軽快なテンポで描く。季節の行事（祭りの夜）と、その時期の食べ物（夏なら鱧や冷やし飴など）を必ず描写に組み込み、最後は人情の温かさで締めくくること。
