- name: ポポ
  role: 主人公
  age: 12
  gender: オス
  appearance: 茶色のふかふかな毛並み、小さな金縁の眼鏡をかけている。常に小さなドライバーをポケットに入れている。
  personality: 真面目で丁寧だが、少し心配性。道具たちの声を聞くことができる優しい心を持つ。一人称は「ぼく」。
  speech_style: 「～だよ」「～かな？」といった、穏やかで丁寧な口調。
  background: 森の奥にある小さな時計店を継いだ若きリスの職人。
  motivation: 預かった懐中時計を修理し、持ち主の思い出を繋ぎ止めること。
  relationships:
  - name: ルナ
    relation: 依頼人
  - name: チック
    relation: 相棒
  arc: 慎重で控えめな職人から、大切なもののために未知の冒険へ踏み出す勇気を持つ者へと成長する。
- name: ルナ
  role: 主要な依頼人
  age: 8
  gender: メス
  appearance: 純白の毛並みと、感情に合わせてぴょこぴょこと動く長い耳を持つ子ウサギ。
  personality: 純粋で感情豊かだが、大切な記憶を失ったことに心のどこかで寂しさを感じている。一人称は「わたし」。
  speech_style: 「～なの」「～してください」といった、子供らしく一生懸命な口調。
  background: かつて「約束の丘」で大切な誰かと約束を交わしたが、時計が壊れたことでその記憶が薄れてしまった。
  motivation: 懐中時計を動かして、忘れてしまった大切な約束を思い出すこと。
  relationships:
  - name: ポポ
    relation: 時計職人
  arc: 失った記憶を追い求める過程で、思い出は形あるものではなく心にあるのだと気づく。
- name: チック
  role: 相棒
  age: 45
  gender: 不明
  appearance: 真鍮製の小さな振り子時計。足には小さな車輪がついており、どこへでも転がっていく。
  personality: お調子者で知識豊富。少し皮肉屋なところもあるが、実は誰よりも仲間思い。一人称は「私（わたくし）」。
  speech_style: 「～ですわ」「～ですな」といった、少し古風で芝居がかった話し方。
  background: ポポの時計店に住み着いている、森の道具たちのリーダー的存在。
  motivation: ポポの冒険をガイドし、時計の修理に必要な知識を提供すること。
  relationships:
  - name: ポポ
    relation: 店主兼友人
  arc: 知識や理論だけで物事を判断していたが、ポポたちの旅を通じて「心」の動きを理解するようになる。
