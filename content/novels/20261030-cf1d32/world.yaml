title: ぽんぽこ時計店と、お月さまの約束
genre: 日常ほのぼの
tone: やわらかくて温かい、絵本のような雰囲気
pov: 三人称（主に主人公のリスの「ポポ」の視点）
tense: 過去形
setting: 森の奥にある、おしゃべりな道具たちが暮らす小さな時計町
premise: 森の片隅にある時計店には、持ち主の思い出を大切に直すリスのポポが住んでいます。ある日、ポポの前に「壊れた懐中時計」を持った子ウサギがやってきました。その時計は、かつて「約束の丘」で交わした大切な約束を忘れてしまったようです。ポポは時計の針を動かすために、森の仲間たちと一緒に、優しくて少し切ない冒険に出かけます。
themes:
- 思い出を大切にすること
- 約束の尊さ
rules:
- 壊れた道具は、持ち主の『心』が少し寂しい時に壊れる性質がある
- 時計町の道具たちは、夜になると少しだけ人間のように言葉を話すことができる
plot_outline:
- '序盤: 時計店を営むリスのポポが、困った顔をした子ウサギから、動かなくなった懐中時計を預かるシーンから始まります。'
- '中盤: 時計を直すには『約束の丘』にある不思議な光が必要だと知り、ポポは道具たちの助けを借りて、森の小道を歩き始めます。'
- '終盤: やっとの思いで約束の丘に辿り着き、懐中時計の中に眠っていた、持ち主たちの温かな思い出の欠片を見つけ出します。'
- '結末: 時計は元通りに動き出し、子ウサギは笑顔で帰り、ポポはまた新しい日々の音を聴きながら、静かに眠りにつきます。'
style_notes: 陽向ぽぷらとしての文体。難しい言葉は使わず、「～でした」「～ですね」といった、子供に読み聞かせるような優しい、語りかける口調を徹底してください。擬人化された道具たちが、まるで生きているかのように愛らしく描かれるようにします。各話の終わりには、『大切なものは、目に見えないところにありますよ』といった、小さな教訓をそっと添えてください。
