- name: 九条 蓮
  role: 主人公
  age: 35
  gender: 男性
  appearance: 鋭い眼光と、常に整えられたチャコールグレーのコート。デジタル端末を使いこなすが、愛用しているのは古い万年筆である。
  personality: 極めて論理的で冷静沈着。感情に流されず、物理的な矛盾を徹底的に嫌う。一人称は「私」。
  speech_style: 簡潔で断定的。無駄な修飾語を削ぎ落とした、硬質な話し方。
  background: 元・都市警察の鑑識官。現在はフリーランスの探偵として、物理的証拠とデジタルデータの不整合を解く「情報考古学」の専門家。
  motivation: 目の前の「論理的矛盾」を解明し、事実に裏打ちされた真実を提示すること。
  relationships:
  - name: 朝比奈 未央
    relation: 助手
  arc: 効率とデータのみを重視する冷徹な探偵が、事件を通じて「情報の重み」と人間の執着を理解していく。
- name: 朝比奈 未央
  role: 相棒
  age: 24
  gender: 女性
  appearance: 動きやすい実用的なテックウェア。観察力の高い瞳と、微かな匂いの変化に気づく鋭い鼻を持つ。
  personality: 感受性が豊かで、細かな違和感や情緒的な側面を見逃さない。慎重だが、真実に対しては勇敢。一人称は「私」。
  speech_style: 丁寧で、九条の言葉を補足したり、疑問を投げかけたりするような柔らかな話し方。
  background: 地下図書館の運営管理局に勤めていたが、あるデータ消失事件をきっかけに九条の助手となる。
  motivation: 地下図書館の静寂を守り、迷子になった情報の行方を突き止めること。
  relationships:
  - name: 九条 蓮
    relation: パートナー
  arc: 単なる観察者から、自ら現場の違和感に踏み込み、論理の隙間を埋める能動的な探求者へと成長する。
- name: 神崎 紫音
  role: 敵役
  age: 46
  gender: 女性
  appearance: 隙のない洗練された研究服。銀縁の眼鏡をかけ、常に知的な威圧感を放つ端正な容姿。
  personality: エリート意識が高く、知識は「正しく管理されるべきもの」と信じている。冷徹で極めて計算高い。一人称は「私」。
  speech_style: 優雅だが、相手を見下すような含みを持たせた、完璧な敬語。
  background: 都市最高峰の研究機関の主任研究員。地下図書館の管理AIの再起動プロジェクトのリーダー。
  motivation: 迷子のAIを完全に制御下に置き、情報の選別と独占を行うことで、知識の守護者となること。
  relationships:
  - name: 守屋 誠
    relation: 部下
  arc: 完璧な論理による情報の統制を試みるが、人間の欲望という非論理的な要素によって自らの構築した城を崩される。
- name: 守屋 誠
  role: 脇役
  age: 31
  gender: 男性
  appearance: 常に疲れ切った表情で、インクの汚れや回路の断片が目立つ白衣を着ている。髪は乱れている。
  personality: 神経質で、技術的な問題にのみ没頭する。社会性には欠けるが、純粋な探求心を持つ。一人称は「僕」。
  speech_style: 早口で、論理が飛躍しがちな、落ち着きのない喋り方。
  background: AIのプログラム復元を担当する技術者。神崎のプロジェクトに従事している。
  motivation: 純粋な好奇心から、AIの深層意識に眠る未知のデータに触れること。
  relationships:
  - name: 神崎 紫音
    relation: 上司
  arc: 自身の技術への執着が、意図せずして重大な犯罪の引き金となった事実に直面し、困惑する。
