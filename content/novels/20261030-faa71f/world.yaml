title: 忘却の書庫と、迷子の電子音
genre: 本格ミステリー
tone: 重厚、静謐、論理的
pov: 一人称（観察者）
tense: 過去形
setting: 近未来、巨大都市の地下に広がる広大な「地下図書館」と、旧式の管理AIが住まう隔離区画
premise: 都市の深淵、幾千もの書物が眠る地下図書館で、一人の司書が密室状態で死亡しているのが発見される。現場には不可解なほど古い紙の匂いと、出所不明の電子信号だけが残されていた。私たちが同行する探偵は、この「論理的矛盾」を解く鍵が、都市から切り離された迷子の人工知能にあると断言する。果たして、物理的な痕跡とデジタルの残響、どちらが真実を語るのか。
themes:
- 情報の永続性と忘却
- 知性と感情の境界
rules:
- 地下図書館は高度なセキュリティにより、生体認証なしでは立ち入り不可能である
- 現場に残された電子信号は、特定の古い言語コードで記述されている
- 全ての物理的なトリックは、図書館内の自動搬送システムと書架の配置に依存している
plot_outline:
- '序盤: 地下図書館の閉鎖区画で発生した、鍵のかかった書庫内での死体発見。私は探偵と共に現場へ赴き、物理的な密室状態を確認する。'
- '中盤: 現場に残された、意味をなさない電子音の正体を追う中で、管理システムから切り離され、地下を彷徨う「迷子のAI」の存在が浮上する。容疑者は、AIの再起動を企む三人の研究者。'
- '終盤: 探偵による、物理的証拠（インクの汚れ、書架の摩擦痕）とデジタル証拠（通信ログの矛盾）を用いた緻密な検証。AIが「迷子」となった理由が、犯人の工作であったことが暴かれる。'
- '結末: 探偵が論理的に犯人を指し示し、動機が「情報の独占」であったことを証明する。AIは静かに、持ち主を失った知識の海へと沈んでいく。'
style_notes: 神楽坂探による執筆。語り手である「私」は、探偵の鋭い観察眼と、時折見せる人間臭い断罪の姿を、敬意を持って記述する。読者に対し、「手がかりは既に提示した」と告げるような、フェアプレイを遵守した格調高い文体を用いること。情緒的な描写よりも、状況の緻密な記述と、論理の連鎖を優先する。
