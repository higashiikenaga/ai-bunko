- name: 如月 蓮 (きさらぎ れん)
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常に目の下に薄い隈があり、どこか虚ろな瞳をしている。使い古された砂埃にまみれたロングコートを纏い、記憶の破片を収めるための銀の小瓶を腰に下げている。
  personality: 冷静で事務的な振る舞いを見せるが、その内面は亡き恋人への執着と喪失感に支配されている。一人称は「僕」。
  speech_style: 低く落ち着いたトーン。必要最低限のことしか話さない、淡々とした口調。
  background: かつて、最も大切な人の記憶を「事故」で失ったことで、失われた記憶を物理的な結晶として回収する『蒐集家』となった。その目的は、いつか失った記憶の欠片をすべて揃えること。
  motivation: 「砂の檻」に眠るとされる、亡き恋人の記憶の核を見つけ出すこと。
  relationships:
  - name: 澪
    relation: 亡き恋人の面影を重ねる対象
  - name: 朔夜
    relation: 行く手を阻む対立者
  arc: 記憶を「所有」することで喪失を埋めようとする執着から、大切な存在を守るために自らの記憶という「自己」を放棄する自己犠牲へと変容する。
- name: 澪 (みお)
  role: ヒロイン
  age: 19
  gender: 女性
  appearance: 透き通るような白い肌と、吸い込まれるような瑠璃色の瞳を持つ。髪は細い銀糸のように輝き、常に青い結晶の花を纏っているかのような幻想的な美しさを持つ。
  personality: 穏やかで慈愛に満ちているが、どこか浮世離れしており、感情の起伏が乏しい。一人称は「私」。
  background: 「砂の檻」が記憶を糧に肥大化するために生み出した「結晶の乙女」。村の均衡を保つための核として、永遠に記憶を吸い上げ続ける役割を担っている。
  motivation: 自分が装置の一部であることを自覚しながらも、誰かに「記憶の破片」ではなく「自分自身」を見てほしいと願っている。
  relationships:
  - name: 如月 蓮
    relation: 初めて自分を「道具」ではなく「人間」として扱った存在
  arc: ただ存在するだけの美しい装置から、自らの意思で崩壊を受け入れ、蓮と共に消滅することを選ぶ一人の女性へと変化する。
- name: 朔夜 (さくや)
  role: 敵役
  age: 35
  gender: 男性
  appearance: 隙のない黒い礼服を纏い、一切の汚れを寄せ付けない端正な容姿。手には村の秩序を象徴する銀の杖を持っている。
  personality: 極めて合理的で非情。村の美しさと循環を維持することこそが至高の善であると信じている。一人称は「私」。
  speech_style: 丁寧だが、相手を突き放すような冷徹な敬語を使う。
  background: 「砂の檻」の管理人。村が装置として正常に機能し、訪れる者の魂を磨き続けるよう監視・制御する役割を担う。
  motivation: 村の循環を乱す「蒐集家」を排除し、結晶化のプロセスを完遂させること。
  relationships:
  - name: 澪
    relation: 管理・維持すべき装置の核
  - name: 如月 蓮
    relation: 秩序を破壊するイレギュラー
  arc: 完璧なシステムを信奉していたが、蓮の自己犠牲という「非合理な行動」によって、自らが守ってきた世界の脆さを突きつけられる。
- name: 九条 (くじょう)
  role: 脇役
  age: 62
  gender: 男性
  appearance: 深く刻まれた皺と、日焼けした肌を持つ老人。境界の地で古びた茶屋を営んでいる。
  personality: 飄々としており、掴みどころがない。世俗の理に疎いようでいて、世界の真理をどこかで見通している。一人称は「俺」。
  speech_style: べらんめえ調に近い、親しみやすくも含みのある喋り方。
  background: かつて「砂の檻」に足を踏み入れ、記憶の多くを失って生還した元蒐集家。現在は境界の地で、次に訪れる者への警告を繰り返している。
  motivation: 新たな蒐集家が、自分と同じような「空虚」に陥るのを防ぐための、ささやかな警告。
  relationships:
  - name: 如月 蓮
    relation: かつての自分を重ねる後継者
  arc: 物語の進行において、蓮が真実に辿り着くための導き手、あるいは悲劇を予言する観測者として機能する。
