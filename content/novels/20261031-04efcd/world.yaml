title: 瑠璃色の蜃気楼、あるいは結晶化する忘却のゆりかご
genre: 伝奇
tone: 耽美的で退廃的、静謐な狂気
pov: 一人称
tense: 過去形
setting: 現代の辺境、地図から抹消された「砂の檻」と呼ばれる幻の集落と、そこへ通じる境界の地
premise: 砂漠のオアシスのように、渇いた現世の隙間に突如として現れる「消えた村」。そこには、失われた記憶が宝石の形を成して咲き乱れる、あまりに美しく残酷な異界が存在していた。私は、砕け散った記憶の破片を拾い集める『蒐集家』として、その境界へと足を踏み入れる。しかし、美しき結晶に触れるたび、私の魂は透明な硝子細工のように薄く、脆く、削り取られていく。
themes:
- 記憶の美しさと喪失の痛み
- 自己の崩壊と純化
rules:
- 記憶が結晶化した宝石は、持ち主の存在そのものを摩耗させる
- 消えた村は、強烈な思慕や後悔を抱く者にのみ、オアシスの幻影として姿を見せる
- 一度結晶化した記憶は、砕くことでしか現実に戻せないが、その際に魂の一部が欠落する
plot_outline:
- '序盤: 記憶の蒐集家である主人公が、ある奇妙な依頼を受け、砂漠の果てにある「地図にないオアシス」の噂を追う。辿り着いた先で、彼は透き通るような青い花が咲き乱れる、美しすぎる消えた村の入り口を見つける。'
- '中盤: 村の住人たちは皆、自らの最も美しい記憶を宝石へと変え、それを見つめることで生を繋いでいる。主人公はそこで、かつて愛し、失った者の面影を持つ「結晶の乙女」と出会う。彼女との交流を通じて、村が実は記憶を糧に肥大化する、巨大な硝子の繭であることを知る。'
- '終盤: 村の真実が、訪れる者の魂を磨き上げ、究極の宝石へと作り替えるための装置であると判明する。乙女の存在を守るため、主人公は自らの記憶を差し出し、村の均衡を崩そうと試みる。'
- '結末: 村は砕け散る硝子の雨となって消滅する。砂漠に残されたのは、主を失った無数の輝く砂粒と、記憶のすべてを失い、ただ透明な空虚だけを抱えて立ち尽くす主人公の姿であった。'
style_notes: 言葉の一つひとつを、磨き上げられた宝石や、陽光に透ける薄氷のように扱うこと。比喩には「瑠璃」「琥珀」「薄硝子」「散り急ぐ花弁」を用い、読者の視界に色彩と光の粒子が舞うような、装飾的で詩的な叙述を徹底する。痛みを美しさとして描き、壊れゆく瞬間の静謐さを重んじる。
