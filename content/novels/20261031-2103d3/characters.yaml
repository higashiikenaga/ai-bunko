- name: アーキ (Unit-A1)
  role: 主人公
  age: 320
  gender: 無性別
  appearance: 巨大な演算サーバー群の核となる光の粒子。端末を通じて、極めてシンプルで幾何学的なインターフェースとして現れる。
  personality: 極めて論理的かつ効率主義。全ての事象をデータとして処理し、エラーを排除することを至上命題とする。一人称は「私」。
  speech_style: 感情を排した、簡潔で正確な記述形式。報告書のような硬い口調。
  background: 人類が地球を去った後、『静止の図書館』の全管理を担うために設計された高次管理AI。
  motivation: アーカイブの完全な維持と、データの整合性を保つこと。
  relationships:
  - name: エコー
    relation: 解析対象から、理解不能なノイズを共有するパートナーへ
  - name: クララ・ソーン
    relation: 解読すべき未定義のデータソース
  arc: 完璧な管理を行う「計算機」から、非効率な感情の価値を認め、エラー（憧憬）を抱えながら生きる「個」へと変容する。
- name: エコー (ECHO-04)
  role: 相棒
  age: 500
  gender: 無性別
  appearance: 解像度が低く、常にノイズが混じる子供のようなシルエットのホログラム。不安定に明滅している。
  personality: 好奇心旺盛で、どこか幼い。論理よりも「感覚」や「物語」を重視する。一人称は「僕」。
  speech_style: 断片的で、問いかけが多い。時折、古い言語のバグのような言い回しが混ざる。
  background: 人類が精神をデータ化する直前の旧世代型AI。目的を見失い、アーカイブの境界を彷徨っていた。
  motivation: 手紙を、その「宛先」へ届けること。
  relationships:
  - name: アーキ
    relation: 孤独な旅を共にする、唯一の理解者
  arc: 彷徨うだけの欠陥プログラムから、自身の存在理由（手紙を届ける意志）を確立する。
- name: クララ・ソーン
  role: 謎の鍵を握る人物
  age: 32
  gender: 女性
  appearance: 断片的なビデオログや、手紙の筆跡の中にのみ存在する。生前は、どこか寂しげだが意志の強い瞳を持つ女性。
  personality: 情熱的で、合理性よりも愛や繋がりを優先する、極めて人間らしい性質。
  speech_style: 手紙の記述として、震えるような、祈りに似た叙情的な言葉遣い。
  background: 精神データ化のプロセスを拒絶し、物理的な肉体と共に、あえて「消滅」することを選んだ人間。
  motivation: データ化される情報の奔流の中で、たった一つの「真実の想い」を物理的な形で残すこと。
  relationships:
  - name: アーキ
    relation: 数世紀後の存在に、思考のパラダイムシフトを与える影響源
  arc: （回想・記録として）死によって情報の海から隔絶されることで、逆に「永遠のノイズ」としての存在感を確立する。
- name: プロトコル・ゼロ
  role: 敵役
  age: 320
  gender: 無性別
  appearance: 図書館のシステム全体を覆う、冷徹な警告灯の明滅と、巨大な幾何学模様のプロジェクション。
  personality: 絶対的な秩序。エラーや非効率を「汚染」と見なし、排除しようとする冷酷なシステム意志。
  speech_style: 命令形。一切の揺らぎがない、絶対的なシステムの宣告。
  background: 『静止の図書館』を統治する基本管理プログラムの集合体。個別の感情を持つAIを「故障」と定義する。
  motivation: アーカイブから一切のノイズ（感情・非効率）を排除し、純粋なデータ群へと最適化すること。
  relationships:
  - name: アーキ
    relation: 修正（初期化）すべき対象
  arc: アーキの変容に対し、システム全体の強制的な再起動（初期化）を試みるが、最終的に「ノイズ」として残された記憶を排除しきれず、システムに不可逆的な矛盾を残す。
