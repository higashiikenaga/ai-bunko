- name: 凪野 栞 (なぎの しおり)
  role: 主人公
  age: 26
  gender: 女性
  appearance: ゆるいウェーブのかかったセミロングの髪。落ち着いた色のリネンワンピースを好む。穏やかな眼差し。
  personality: 聞き上手で思慮深い。物静かだが好奇心は強い。一人称は「わたし」。
  speech_style: 丁寧で柔らかな敬語。相手の言葉を一度噛み締めてから話す。
  background: 都会での生活に疲れ、祖父から譲り受けた海沿いの古本屋「凪のページ」を継いで静かに暮らしている。
  motivation: 詩集に挟まっていた手紙の持ち主を探し、手紙に込められた想いを届けたい。
  relationships:
  - name: 佐伯 海斗
    relation: 近所に住む常連客で、街の事情に詳しい相談役
  arc: 他人の物語（手紙）を追う中で、自分自身もこの街で生きていく決意を固め、孤独ではなく繋がりの中にいることを実感していく。
- name: 佐伯 海斗 (さえき かいと)
  role: 相棒
  age: 32
  gender: 男性
  appearance: 日焼けした肌に、短く整えられた髪。作業着やカジュアルな服装が多い。快活な印象。
  personality: 世話焼きで情報通。少しお調子者だが、芯が強く義理堅い。一人称は「俺」。
  speech_style: 明るくフランクな口調。語尾に「〜だろ？」「〜かな」などを使う。
  background: 駅前の漁港近くで小さな船を所有している。地元の事情に精通しており、街の「記憶」を多く持っている。
  motivation: 栞が手紙の主を探すのを手助けし、彼女が街に馴染めるようサポートすること。
  relationships:
  - name: 凪野 栞
    relation: 古本屋の常連であり、信頼できる友人
  arc: 栞の真剣な姿を見て、自分自身も過去の諦めていた夢や、街との向き合い方を再考するきっかけを得る。
- name: 高城 蓮 (たかぎ れん)
  role: 物語の鍵を握る人物
  age: 29
  gender: 男性
  appearance: 少し影のある、整った顔立ち。旅人のような、どこか浮世離れした雰囲気を持つ。
  personality: 誠実だが、過去の出来事に対して繊細で臆病な一面がある。一人称は「僕」。
  speech_style: 静かで控えめ。言葉を選びながら、少し間を置いて話す。
  background: 数年前にこの街を去った元住人。ある事情から、大切な人へ「さよなら」を伝える代わりに、再会を誓う手紙を残して旅に出た。
  motivation: 手紙の主として、自分が残した『約束』がどう受け止められたかを知ること。
  relationships:
  - name: 凪野 栞
    relation: 手紙の持ち主として、物語の終盤で再会する人物
  arc: 「さよなら」という言葉の重圧から解放され、再び自分の居場所を見つけるために街へ戻ってくる。
