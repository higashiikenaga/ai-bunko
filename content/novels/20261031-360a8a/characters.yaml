- name: 浅木 櫂
  role: 主人公
  age: 28
  gender: 男性
  appearance: 痩身でどこか無機質な印象を与える青年。常に手帳とペンを持ち歩いている。目の下に薄い隈がある。
  personality: 冷静沈着で観察眼に優れるが、どこか世間に対して冷めた視点を持つ。一人称は「僕」。
  speech_style: 丁寧だが距離感のある、淡々とした話し方。
  background: フリーランスのライター。事実に基づいた記録を残すことに執着しており、怪談に対しても「現象」として捉えようとする。
  motivation: 断片的な話の中に隠された、世界の真実（法則性）を解明すること。
  relationships:
  - name: 神崎 周平
    relation: 聞き手と語り手
  arc: 客観的な観察者としての立場を失い、自身が物語の当事者（獲物）へと変貌していく恐怖を味わう。
- name: 神崎 周平
  role: 脇役
  age: 67
  gender: 男性
  appearance: 古びた骨董品店を営む老人。深く刻まれた皺と、すべてを見透かすような濁った瞳が特徴。
  personality: 穏やかだが、時折、底知れない不気味さを覗かせる。一人称は「私」。
  speech_style: ゆっくりとした、間を多用する独特の語り口。
  background: 各地の奇妙な伝承や遺品を集めており、それらが持つ「呪い」に近い性質を熟知している。
  motivation: 自身の持つ知識（あるいは重荷）を、誰かに引き継ぐこと。
  relationships:
  - name: 浅木 櫂
    relation: 情報の提供者
  arc: 単なる知識の伝達者から、物語を現実へと引き摺り出す媒介者としての側面が強まる。
- name: 一ノ瀬 玲奈
  role: 重要人物
  age: 25
  gender: 女性
  appearance: かつて浅木が調査した資料の中に登場する、知的な雰囲気を持つ女性。写真の中では、どこか遠くを見つめている。
  personality: 真実を追い求める情熱家。一人称は「私」。
  speech_style: 論理的で、確信に満ちた話し方（手記による）。
  background: 民俗学者を目指していた学生。各地の「影」の法則性を解明しようとして、ある村の祭りの夜に消息を絶った。
  motivation: 世界の裏側に潜む「何か」の正体を突き止めること。
  relationships:
  - name: 浅木 櫂
    relation: 調査対象、あるいは導き手
  arc: 彼女の残した断片的な記録が、浅木の思考を「恐怖の正体」へと導く鍵となる。
- name: 仮面の男
  role: 敵役
  age: 0
  gender: 不明
  appearance: 祭りの行列や古い写真に、一瞬だけ写り込む、歪んだ仮面をつけた人影。
  personality: 感情がなく、ただ「音」と「影」と共にそこに存在する。一人称はなし。
  speech_style: 言葉を発さず、不気味な祭囃子や足音のみで存在を示す。
  background: 物語に登場するすべての怪異の根源、あるいは現象そのもの。
  motivation: 観察者の意識に潜り込み、境界線を越えて現実へ侵食すること。
  relationships:
  - name: 浅木 櫂
    relation: 追跡者と獲物
  arc: 物語の中の断片的な存在から、物語の終わりと共に、語り手のすぐ背後に実在する恐怖へと昇華する。
