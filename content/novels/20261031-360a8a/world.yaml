title: 影渡りの聞き書き
genre: ホラー
tone: 淡々とした、静謐で不穏な語り口
pov: 一人称（聞き書き形式）
tense: 過去形
setting: 現代、各地の地方集落や古い住宅街
premise: ある知人から、奇妙な話を聞いたことがある。それは、祭りの夜に起きた不可解な出来事や、亡き者が残した不可解な遺言に関する断片的な記録だ。一つ一つの話は短く、決定的な答えは何一つ示されない。しかし、それらを繋ぎ合わせると、この世界の裏側に潜む「何か」の輪郭が、静かに浮かび上がってくる。
themes:
- 日常の侵食
- 言葉による固定
rules:
- 怪異は実体を持たず、影や音、あるいは僅かな違和感としてのみ認識される
- 祭りの夜は、現世の境界が最も薄れ、見えてはいけないものが現れる
- 遺言は、単なる伝達手段ではなく、現象をこの世に繋ぎ止めるための呪縛として機能する
plot_outline:
- '序盤: 知人から聞いた、いくつかの短い怪談が淡々と綴られる。山間の村の祭りと、そこで消えた仮面の行列の話。'
- '中盤: 遺言の内容に縛られた家族の話や、誰もいないはずの部屋から聞こえる祭囃子の音など、日常に潜む違和感が積み重ねられる。'
- '終盤: 全てのエピソードに共通する、ある「影の形」と「音」の法則性が、断片的な情報の集積によって示唆される。'
- '結末: 語り手が聞き終えた後の静寂の中に、自身の背後にもその「何か」が潜んでいるような、説明のつかない予感だけが残る。'
style_notes: 実話怪談のように、感情を抑えた抑制的な文体を用いる。劇的な展開や派手な恐怖演出は避け、「～だそうだ」「～という話だ」といった伝聞形式を多用する。読者に答えを提示せず、説明しすぎないことで、想像力のなかに恐怖が残留するような「余白」を大切にする。
