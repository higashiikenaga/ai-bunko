- name: 乾 三郎
  role: 主人公
  age: 32
  gender: 男
  appearance: 痩身だが引き締まった肢体。使い込まれた古びた羽織を纏い、鋭い眼光を持つ。右頬に古い刀傷がある。
  personality: 寡黙で禁欲的。時代の変化に懐疑的だが、知への敬意は強い。一人称は「俺」。
  speech_style: ぶっきらぼうで短い口調。武士の礼節が端々に滲む。
  background: 元ある藩の精鋭剣客だったが、維新後の混乱で主君を失い浪人となった。世の不条理を避け、山間に潜伏していたところ地下図書館に辿り着く。
  motivation: 権力者が都合よく書き換える歴史ではなく、真実の知識が記された書庫を、時代の濁流から守り抜くこと。
  relationships:
  - name: 久我 慎之助
    relation: 宿敵。近代的な合理主義を象徴する対極の存在。
  - name: ハナ
    relation: 協力者。孤独な戦いの中で唯一心を許した理解者。
  arc: 過去への執着を捨て、守るべき価値あるものを後世へ託すことで、真の意味で「武士」としての死生観を完結させる。
- name: 久我 慎之助
  role: 敵役
  age: 35
  gender: 男
  appearance: 仕立ての良い欧州仕込みの軍服を着用。金縁の眼鏡をかけ、冷徹で理知的な表情を浮かべている。
  personality: 冷酷な合理主義者。旧時代の遺物を「効率を妨げるゴミ」と断じる。一人称は「私」。
  speech_style: 丁寧だが高圧的な敬語。相手を論理的に追い詰める話し方。
  background: 新政府の治安維持組織に属する若きエリート。海外で近代戦術と政治学を学び、国家の安定のためには少数の犠牲や情報の抹消は不可欠だと信じている。
  motivation: 地下図書館に眠る、政府にとって不都合な「禁忌の知識」を完全に回収・破棄し、国家の正統性を盤石にすること。
  relationships:
  - name: 乾 三郎
    relation: 排除すべき旧時代の残滓。同時に、その不屈の精神に密かな執着を抱く。
  arc: 近代兵器による圧倒的優位を確信していたが、極限状態での三郎の剣技に触れ、数値化できない「魂」の存在に直面し、崩壊する。
- name: ハナ
  role: 相棒/ガイド
  age: 21
  gender: 女
  appearance: 質素な絣の着物を着ているが、瞳には強い知性が宿る。常に古びた灯籠を携えている。
  personality: 芯が強く、知的好奇心に溢れている。三郎の不器用さに呆れつつも深く信頼している。一人称は「私」。
  speech_style: 地元の訛りが混じった柔らかい口調だが、本を語る時だけは理知的で流暢になる。
  background: かつて地下図書館の管理を任されていた村の名主の娘。家系に伝わる地図と知識を持ち、迷い込んだ三郎を地下へと導いた。
  motivation: 先祖が守ってきた知識を、単なる権力の道具にさせず、正しく後世に繋げたい。
  relationships:
  - name: 乾 三郎
    relation: 信頼し合う戦友。彼に「守るべきもの」を再認識させた。
  - name: 久我 慎之助
    relation: 故郷と知識を蹂躙する権力の象徴として激しく憎んでいる。
  arc: 運命に翻弄されるだけの村娘から、自らの意思で歴史の封印を選択する「知識の継承者」へと成長する。
