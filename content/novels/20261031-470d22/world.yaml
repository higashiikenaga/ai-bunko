title: 鉄路の残響、地下の書叢
genre: 歴史・時代小説
tone: 骨太で重厚、静寂と爆音の対比
pov: 三人称
tense: 過去形
setting: 明治十年代、文明開化の波が押し寄せる山間の鉄道敷設地
premise: 時代の転換点、文明の象徴である蒸気機関が山々を切り裂く。浪人・乾三郎は、新政府が隠蔽しようとする禁忌の知識が集められた「地下図書館」を守るため、孤独な戦いに身を投じる。追っ手の剣戟と、間近に迫る鉄道の轟音が、静寂な書庫を揺るがす。これは、消えゆく武士の魂と、加速する近代化の衝突を描いた物語である。
themes:
- 武士道の終焉
- 伝統の継承と破壊
rules:
- 地下図書館は、古の文献が物理的に保管されている閉鎖的な空間である
- 近代兵器（銃器）は存在するが、物語の核心は刀による一騎打ちに置く
- 最終列車は、その路線の運行を終える象徴的な蒸気機関車を指す
plot_outline:
- '序盤: 廃寺に身を潜める浪人・乾三郎が、地底へと続く隠し階段を見つけ、禁断の知識が眠る地下図書館に辿り着く。'
- '中盤: 政府の追っ手が、最新鋭の武装を携えて地下へ侵攻。三郎は狭隘な書庫の中で、抜き身の刀を手に死闘を繰り広げる。'
- '終盤: 鉄道建設の最終段階、山間を走る「最終列車」が書庫の直上を通過する。その爆音と激しい振動の中で、三郎は宿敵との一騎打ちに臨む。'
- '結末: 激しい立ち合いの末、三郎は敵を討つが、書庫は崩落の危機に。彼は歴史の闇へと知識を封印し、時代の濁流の中へと消えていく。'
style_notes: 無駄な修飾語を排し、短文で畳みかける。立ち合いの直前、周囲の音が消え、呼吸の音だけが際立つ「静」の描写を徹底すること。剣戟は、重く、鋭く、一撃の重みが伝わるように記述せよ。
