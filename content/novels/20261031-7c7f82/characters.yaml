- name: 湊 凪斗
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で少し青白い顔立ち。潮風で少し乱れた黒髪と、静かだがどこか不安げな瞳。
  personality: 内向的で思索的。周囲との間に一線を引く傾向がある。「僕」
  speech_style: 丁寧だが淡白で、感情の起伏が少ない話し方。
  background: 幼い頃の海での事故により記憶の一部を失っている。現在は潮凪町の灯台守として静かに暮らしている。
  motivation: 鏡に映る「自分ではない誰か」の正体を突き止め、失われた記憶を取り戻すこと。
  relationships:
  - name: 蔵本 宗助
    relation: 店主・謎めいた導き手
  - name: 海野 栞
    relation: 鏡の中に閉じ込められた少女
  arc: 孤独に閉じこもっていた青年が、他者の痛みや未練に触れることで、過去を受け入れ、生きていく勇気を得る。
- name: 蔵本 宗助
  role: 導き手
  age: 65
  gender: 男性
  appearance: 深い皺の刻まれた顔。常に古い雨具を纏っており、どこか湿り気を帯びた雰囲気を持つ。
  personality: 飄々としており、全てを見透かしているような掴みどころのなさ。「私」
  speech_style: 言葉の端々に含みを持たせ、謎めいた言い回しを好む。
  background: 雨の日にだけ現れる「蒐集店」の店主。海と現世の境界を見守る役割を担っている。
  motivation: 湊に鏡を託し、彼が町の因習と自身の運命に決着をつけるのを見届けること。
  relationships:
  - name: 湊 凪斗
    relation: 客・運命の観察者
  arc: 傍観者として物語を見守りつつ、湊が境界を越えるための決定的な契機を与える。
- name: 海野 栞
  role: ヒロイン
  age: 12
  gender: 女性
  appearance: 透き通るような肌と、濡れたように艶やかな黒髪。鏡の向こう側にだけ存在する、儚げな少女。
  personality: 寂しげだが、どこか芯の強さを感じさせる。「私」
  speech_style: 囁くような、消え入りそうなほど静かな声。
  background: かつて町で海に消えた少女の記憶の残滓。湊の失われた記憶と深く結びついている。
  motivation: 鏡の外の世界を知ること、そして誰かに自分の存在を刻みつけること。
  relationships:
  - name: 湊 凪斗
    relation: 救われるべき存在・記憶の鍵
  arc: 単なる「怪異の核」から、湊との交流を通じて一人の人間としての記憶を完成させ、安らぎを得る。
- name: 潮崎 栄造
  role: 敵役
  age: 78
  gender: 男性
  appearance: 頑固そうな顔つきと、海の色をした濁った瞳。常に海を見つめている。
  personality: 保守的で強情。町の伝統と秩序を何よりも重んじる。「わし」
  speech_style: 低く威圧的な声。断定的な言い方をする。
  background: 潮凪町の長老。海にまつわる古い因習を維持し、異形を「穢れ」として排除しようとする。
  motivation: 異界の存在が顕現することを防ぎ、町の平穏（停滞）を守ること。
  relationships:
  - name: 湊 凪斗
    relation: 因習を壊そうとする異分子
  arc: 変化を拒む町の象徴として、湊の歩みを阻む壁となるが、最終的には潮の満ち引きという抗えない理に飲み込まれる。
