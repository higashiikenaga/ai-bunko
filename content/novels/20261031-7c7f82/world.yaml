title: 凪の鏡、雨の蒐集店
genre: 怪談・民俗
tone: 湿り気を帯びた、静謐で幻想的な怪異
pov: 三人称
tense: 過去形
setting: 現代、入り組んだ入江を持つ古い漁港町・潮凪町
premise: 潮の満ち引きが激しいその町では、海から持ち帰られた『忘れもの』が、時折、人の形を成して現れるという。雨が降る日だけ、港の片隅にひっそりと現れる古びた店には、海に沈んだ記憶を映し出す鏡が並んでいた。灯台守の青年は、ある日、鏡の中に映る「自分ではない誰か」の視線に気づいてしまう。それは、潮が引くたびに少しずつ、現世へと歩み寄る異形たちの足音であった。
themes:
- 失われた記憶の重み
- 境界線上の存在
rules:
- 雨の日にしか開かない店は、霧が晴れると跡形もなく消える
- 鏡に映る異形は、鏡越しにしか実体を持てない
- 潮の満ち引きは、異界と現世の距離を決定づける
plot_outline:
- '序盤: 灯台守の青年・湊は、雨の日にだけ現れる不思議な店を訪れ、そこで失ったはずの幼い日の記憶を映し出す「鏡」を手に入れる。'
- '中盤: 鏡を通じて、町の人々が海に流した「後悔」が、実体を持った怪異として港に現れ始める。湊は、鏡の中に閉じ込められた少女の姿を見つけ、彼女を救おうと試みる。'
- '終盤: 大嵐の夜、潮がかつてないほど満ち、異界と現世の境界が崩れる。湊は鏡を介して、怪異の正体がかつて海に還った町の人々の未練であることを知る。'
- '結末: 湊は鏡を海へと返し、潮の満ち引きとともに怪異たちを静かな深淵へと還す。翌朝、雨が上がった港には、ただ穏やかな波音だけが残されていた。'
style_notes: 潮騒の音や、濡れた石畳の匂い、鈍い霧の質感を丁寧に描写する。文体はゆったりとした波のうねりのように、情緒的な形容詞を重ね、読者の感覚を海辺の情景へと沈め込ませるように書く。
