- name: 暁 烈 (あかつき れい)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無造作な黒髪に、どこか虚ろな瞳。細身だが、脱ぐと引き締まった筋肉を持つ。常にどこか眠たげな表情。
  personality: 物語序盤は感情が欠落した虚無的な性格。物語が進むにつれ、泥臭くも熱い闘志を燃やす。一人称は「俺」。
  speech_style: 言葉数が少なく、ぶっきらぼう。情熱を取り戻してからは、呼吸に合わせた鋭い口調になる。
  background: かつてストリートバスケの天才と呼ばれた少年。勝利への執念を闇市場に売り払い、情熱を失った状態で「錆びた檻」に現れる。
  motivation: 頂点に立ち、失った記憶を取り戻すこと。そして、身体が覚えている「本能」を証明すること。
  relationships:
  - name: 神崎 カイ
    relation: 宿命のライバル
  - name: 湊 蓮
    relation: チームメイト兼戦術パートナー
  arc: 空っぽの器から、記憶を超えて「今」を生きる情熱的なプレイヤーへと覚醒する。
- name: 神崎 カイ (かんざき かい)
  role: 敵役
  age: 17
  gender: 男性
  appearance: 整った顔立ちに、隙のない完璧な身のこなし。高級感のあるストリートウェアを纏う。冷徹な眼差し。
  personality: 完璧主義者で計算高く、冷酷。しかしその内側には、買い集めた記憶による「偽物の自分」への空虚さを抱えている。一人称は「俺」。
  speech_style: 冷静沈着で丁寧だが、相手を見下すような尊大な響きがある。
  background: 才能の限界を感じ、闇市場で「歴戦の経験」や「勝利の感覚」を買い集めて最強へと登り詰めた少年。
  motivation: 買い集めた完璧な技術で、烈のような「剥き出しの才能」をねじ伏せ、自らの存在意義を証明すること。
  relationships:
  - name: 暁 烈
    relation: 排除すべき異分子であり、唯一執着する対象
  arc: 完璧な機械のようなプレイスタイルから、烈の熱量に当てられ、人間としての葛藤と苛立ちに直面する。
- name: 湊 蓮 (みなと れん)
  role: 相棒
  age: 17
  gender: 男性
  appearance: 眼鏡をかけた知的な風貌。長身で手足が長く、コート上では司令塔として機能する。常に冷静な佇まい。
  personality: 論理的で冷静沈着。感情に流されず状況を分析するタイプ。一人称は「僕」。
  speech_style: 論理的で理路整然としている。状況説明や戦術指示の際に独特のテンポを持つ。
  background: かつて烈のプレーに心酔していたが、烈の変貌を目の当たりにして離れていた。路地裏の情勢に詳しい知略家。
  motivation: 烈と共に、再びストリートバスケの「熱」を街に呼び戻すこと。
  relationships:
  - name: 暁 烈
    relation: かつての憧れであり、現在の再起を支える相棒
  arc: データに基づいた管理型のバスケから、仲間と呼吸を合わせる「予測不能な熱狂」を受け入れる。
- name: 鉄平 (てっぺい)
  role: 脇役
  age: 45
  gender: 男性
  appearance: 無精髭に深いシワ、彫りの深い顔立ち。使い古されたタンクトップと、古びたバスケットシューズ。
  personality: 豪放磊落で、街の掟に厳しい。口は悪いが、若者の情熱を見守る慈愛を持つ。一人称は「おいら」。
  speech_style: 荒っぽい江戸っ子のような口調。威圧感があるが、どこか温かみがある。
  background: ストリートバスケの聖地「錆びた檻」の管理人。かつては伝説的なプレイヤーだった。
  motivation: 「錆びた檻」を、記憶を売るような偽物の場所ではなく、魂がぶつかり合う場所として守り続けること。
  relationships:
  - name: 暁 烈
    relation: 再起を促すメンター的存在
  arc: 過去の栄光にすがる街の象徴から、次世代の咆哮を支える礎へと役割を変える。
