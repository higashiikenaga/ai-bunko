title: アスファルトの咆哮 ―フルコート・クライマックス―
genre: スポーツ青春
tone: 熱血、疾走感、泥臭い
pov: 三人称
tense: 基本は過去形（試合中は現在形）
setting: 現代。工業地帯の路地裏にストリートバスケの聖地「錆びた檻」が存在する街。
premise: 記憶を売る闇市場で「勝利への執念」を売ってしまった少年・烈。かつての栄光も情熱も失った彼が、名前のない一匹の猫に導かれ、再びストリートバスケの世界へ飛び込む。失った記憶を取り戻す唯一の方法は、頂点の称号を手に入れること。汗と絶叫が交錯するコートで、魂の奪還戦が始まる。
themes:
- 喪失と再生
- 執念の価値
rules:
- 記憶の市場では、特定の感情や記憶を対価に金や能力を得られる
- 売られた記憶は物理的な『記憶の欠片』として保管され、正当な対価か勝利によってのみ回収できる
- ストリートバスケの頂点決定戦『キング・オブ・ラスト』の優勝者は、市場のオーナーに一度だけ願いを叶えてもらえる
plot_outline:
- '序盤: 情熱を失い空虚な日々を送る烈が、路地裏で名前のない猫と出会う。猫に導かれ辿り着いたコートで、かつてのライバルから今の惨状を嘲笑され、再びボールを握る。'
- '中盤: 記憶を買い集めて最強となったライバル・カイに挑戦するが、圧倒的な実力差で完敗。ここではカイ視点で、完璧な勝利の裏にある空虚さと、烈の泥臭い抵抗への苛立ちを描く。'
- '終盤: 記憶に頼らない『身体が覚えている本能』を研ぎ澄ますため、仲間と共に地獄の特訓を開始。決勝戦でカイと激突し、心拍数と呼吸が同期する極限の攻防を繰り広げる。'
- '結末: 劇的な逆転勝利を収め、失った記憶を取り戻す。しかし、烈は記憶よりも、今この瞬間に流した汗と仲間の絆こそが本物であると確信し、さらなる高みを目指して走り出す。'
style_notes: 心臓の鼓動や激しい呼吸（ゼー、ハァ）を擬音的に挿入し、肉体の躍動感を強調する。試合描写では「走る、跳ぶ、打つ」と短い動詞を畳み掛け、現在形を用いて実況のようなスピード感を出す。敗者の視点では、世界が静止したかのような絶望感と静寂を対比的に描写する。
