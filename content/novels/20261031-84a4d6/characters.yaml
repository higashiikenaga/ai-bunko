- name: カイ・セト
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無機質なグレーの清掃員用作業着。少し猫背で、常に何かを観察しているような鋭いが怯えた目元をしている。
  personality: 内向的で観察眼が鋭い。システムに従順に生きてきたが、未知の感覚に戸惑う。一人称は「ボク」。
  speech_style: 淡々としており、感情の起伏が少ない。問いかけるような語尾が多い。
  background: 都市の不要なログやデータを消去する「データ清掃員」。嘘をつくことの痛みを知らずに育った。
  motivation: 拾った懐中時計の謎を解き、自分の中に生まれた「嘘をついても痛くない」というバグの正体を知ること。
  relationships:
  - name: ゼロ
    relation: 導き手であり、危険な協力者
  - name: リナ
    relation: 守るべき幼馴染
  arc: 受動的にシステムに従う市民から、世界に致命的なエラーを書き込む「デバッガー」へと変貌する。
- name: ゼロ
  role: 相棒/指導者
  age: 32
  gender: 女性
  appearance: 黒いレザージャケットに、古い電子部品をいくつも身につけている。左目のチップ跡が特徴的。
  personality: 冷徹で合理的だが、瞳の奥に強い情熱を秘めている。一人称は「私」。
  speech_style: 簡潔で命令的。無駄な言葉を削ぎ落とした、プロフェッショナルな口調。
  background: 地下組織『デバッガーズ』のリーダー。かつて管理システムの設計に携わっていた元エンジニア。
  motivation: 捏造された「真実」による管理社会を解体し、人類に不完全な自由を取り戻すこと。
  relationships:
  - name: カイ
    relation: システムを壊すための鍵となる存在
  arc: 復讐心に燃える革命家から、カイと共に新しい世界の混沌を受け入れる覚悟を持つ者へ。
- name: エイドス執行官
  role: 敵役
  age: 45
  gender: 男性
  appearance: 一点の曇りもない真っ白な制服。一切の表情の変化がない、彫刻のように整った容貌。
  personality: 極端な秩序主義者。「真実こそが平和をもたらす」という教義を狂信的に信じている。一人称は「私」。
  speech_style: 非常に礼儀正しいが、一切の妥協を許さない威圧的な敬語を使う。
  background: 都市の治安維持を司る最高執行官。チップのバグや「嘘」の兆候を徹底的に排除する。
  motivation: システムのエラーを完全に抹消し、完璧で静寂な「真実の世界」を維持すること。
  relationships:
  - name: カイ
    relation: 排除すべき致命的なバグ
  arc: 完璧な管理を信じる絶対者として、システムの崩壊と共に自らの存在意義を失い、瓦解する。
- name: リナ
  role: 脇役
  age: 17
  gender: 女性
  appearance: 清潔感のある明るい色の服。常に周囲の顔色を伺うように、視線が泳いでいる。
  personality: 善良で真面目だが、チップの痛みを恐れるあまり、思考が極端に保守的になっている。一人称は「私」。
  speech_style: 常に相手の同意を求めるような、弱々しく丁寧な話し方。
  motivation: 痛みを感じることなく、平穏で安全な日常を維持すること。
  relationships:
  - name: カイ
    relation: 唯一心を許せる幼馴染
  arc: システムの管理下で怯えて生きる存在から、崩壊した世界で「嘘と痛み」と共に生きる現実へと放り出される。
