title: 真実（トラスト）の檻と、止まった秒針のデバッグ
genre: ディストピア
tone: 軽快かつシニカルなデジタル・ノワール
pov: 一人称（ボク）
tense: 過去形
setting: 全人類に「誠実チップ」が埋め込まれ、嘘をつくと物理的な激痛が走る管理都市
premise: ボクたちの世界では、嘘をつこうとすると脳が焼けるほど痛い。完全なる「真実」が支配するこの街で、ボクはゴミ捨て場で一台の「壊れた懐中時計」を拾った。その時計を手にした瞬間、ボクのチップにバグが走り、初めて「嘘」という概念に触れることになる。これは、完璧な世界に潜む致命的なエラーを暴くための、最悪なデバッグ作業の記録だ。
themes:
- 真実と欺瞞の境界
- 情報の透明性と自由意志
rules:
- 誠実チップ：嘘を検知すると使用者に激痛を与える。これは法的強制ではなく、生物学的な『呪い』として機能している。
- 社会信用スコア：発言の真実性がリアルタイムで数値化され、生活水準やアクセス権に直結する。
- 懐中時計の干渉：壊れた懐中時計の周囲数センチでは、チップの検知が一時的に無効化される。
plot_outline:
- '序盤: データ清掃員として平穏に生きるボクが、不思議な懐中時計を拾い、嘘をついても痛くないことに気づく。SNS上では「ボクは嘘つきだ！」という投稿が謎のバズを見せ、当局の監視が強まる。'
- '中盤: チップのバグを持つ地下組織『デバッガーズ』と接触。彼らから、世界の「真実」が巨大な演算によって捏造された偽装であることを知らされる。懐中時計は、かつて嘘が許されていた時代の遺物だった。'
- '終盤: 管理AIとの直接対決。ボクは懐中時計の修理を試みながら、全市民のチップに「嘘をつける自由」という名の致命的なバグを流し込もうとする。'
- '結末: システムは崩壊し、世界はカオスに陥る。だが、痛みのない、それでいて不自由な静寂ではない「剥き出しの現実」が始まる。ボクは壊れた時計の針を、もう一度動かすために歩き出す。'
style_notes: 一人称「ボク」による、メタ視点とツッコミを交えたスピード感のある独白。地の文の合間に、[Live Chat Log]や[SNS Trend]などのデジタルな断片を挿入し、物語の疾走感を演出する。深刻な展開でも「はい、ここで感動展開くるかと思いきや」といったメタ発言を挟むことで、SNS世代特有の乾いた文体を実現する。
