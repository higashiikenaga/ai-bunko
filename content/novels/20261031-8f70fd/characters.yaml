- name: ヘルマン・フォン・クライスト
  role: 主人公
  age: 34
  gender: 男性
  appearance: 痩身で神経質そうな面持ち。片目にモノクルを着用し、常に黒い革表紙の記録用手帳を携えている。灰色のフロックコートを纏う。
  personality: 極めて合理主義的で冷徹な分析家。感情を排して事象を記述することを信条としている。一人称は「私」。
  speech_style: 事務的で論理的な口調。会話の中でも「〜と推測される」「〜との結論に至る」など、報告書のような記述的な言い回しが混じる。
  background: ノクティア・メトロポリス統計局に属する特級調査員。都市で蔓延する「記憶喪失症」の統計的分析を任されていたが、次第にその背後にある非物質的な経済圏に気づく。
  motivation: 記憶喪失症のメカニズムを完全に解明し、都市の秩序を揺るがす「忘却の市」の正体を暴くこと。
  relationships:
  - name: シルヴァン・ヴァルモン
    relation: 監視対象であり、知的な駆け引きを繰り広げる不気味な取引相手
  - name: ライラ
    relation: 調査対象として接触したが、次第に人間的な同情を抱くようになる少女
  arc: 客観的な観察者として振る舞っていたが、真実へ近づく代償として自らの記憶を切り売りし、最終的にアイデンティティが崩壊して報告書の記述が乱れていく。
- name: シルヴァン・ヴァルモン
  role: 敵役/案内人
  age: 45
  gender: 男性
  appearance: 派手なシルクハットに紫色のベルベットコート。瞳の中に記憶の残滓のような金色の粒子が星のように輝いている。
  personality: 享楽的で狡猾。他者の人生を「価値」として査定することに快感を覚える蒐集家。一人称は「僕」。
  speech_style: 慇懃無礼で芝居がかった話し方。相手を挑発し、精神的な隙を突くのが得意。
  background: 『忘却の市（メモリー・バザール）』で最大手の記憶ブローカー。誰が何を売り、誰が何を買ったかという都市の全記憶を把握している。
  motivation: 世界で最も純度の高い「愛の記憶」を集め、それを燃料として最終列車を概念的な終点へと到達させること。
  relationships:
  - name: ヘルマン・フォン・クライスト
    relation: 退屈な日常に刺激をくれる「最高に知的な検体」
  - name: ライラ
    relation: 極上の記憶を保有していたが、現在は空っぽになった哀れな債務者
  arc: ヘルマンの知的好奇心を巧妙に利用し、彼に「真実を知るための記憶」を代価として差し出させ、彼を精神的な空洞へと追い込む。
- name: ライラ
  role: 相棒/犠牲者
  age: 19
  gender: 女性
  appearance: 色褪せた白いドレスを纏い、瞳から光が消えかかっている。手首に記憶の欠損を示す幾何学的な紋様が刻まれている。
  personality: 儚げで受動的。多くを失ったため感情の起伏が少ないが、時折激しい喪失感に襲われる。一人称は「私」。
  speech_style: 小声で途切れ途切れな話し方。記憶が混濁しているため、時折主語が抜けた断片的な言葉を発する。
  background: かつては裕福な家庭の令嬢だったが、病の家族を救うために自身の記憶を切り売りし続け、最終的に自分自身の名前さえ忘れた「空洞の人間」となった。
  motivation: 自分が誰を愛していたか、という人生の核心となる唯一の記憶を取り戻すこと。
  relationships:
  - name: ヘルマン・フォン・クライスト
    relation: 自分を「人間」として扱い、記憶を取り戻そうと助けてくれる唯一の希望
  - name: シルヴァン・ヴァルモン
    relation: 人生を食い尽くした恐ろしい債権者
  arc: ヘルマンと共に記憶の断片を追い求めるが、最終的に取り戻した記憶が「残酷な真実」であったことを知り、自ら最終列車へ乗り込む。
- name: 運行管理者ゼロ
  role: 脇役/概念的存在
  age: 0
  gender: 不明
  appearance: 全身を黒い制服で包み、顔があるべき場所が精巧なアンティークの時計文字盤になっている。懐中時計を常に確認している。
  personality: 極めて機械的で公平。個人の感情や悲劇には一切関心を持たず、ただ「運行スケジュール」のみを重視する。一人称は「我」。
  speech_style: 感情を完全に排した定型文のような話し方。ノイズ混じりの金属的な声。
  background: 物理法則を無視して走行する『最終列車』の運行責任者。売られすぎた記憶の残骸をエネルギーに変換するシステムの一部。
  motivation: 記憶という燃料を効率的に消費し、予定時刻に概念的な忘却の果て（終点）へ列車を到達させること。
  relationships:
  - name: シルヴァン・ヴァルモン
    relation: 質の良い燃料を供給してくれる効率的な調達業者
  arc: 物語を通じて変化せず、世界の残酷な法則性と、不可避な忘却という結末を象徴し続ける。
