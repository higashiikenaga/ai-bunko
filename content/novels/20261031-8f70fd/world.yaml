title: 忘却の交易と、終焉の軌道：非物質的価値交換に関する暫定報告書
genre: 伝奇
tone: 学術的・客観的・静謐な恐怖
pov: 一人称（調査員による記録形式）
tense: 現在形および過去形（報告書形式）
setting: 19世紀後半のロンドンに類似した、蒸気機関と未知の霊的エネルギーが混在する架空の都市「ノクティア・メトロポリス」
premise: 本報告書は、個人の記憶を貨幣として流通させる『忘却の市（メモリー・バザール）』の存在を証明するものである。対象者は自己のアイデンティティの一部を切り売りし、一時的な悦楽や生存に必要な資源を得るが、その代償として精神の空洞化を招く。調査の過程で、失われた記憶が集約され、存在しないはずの『最終列車』へと向かう現象が観測された。この列車は、都市の物理的境界を越え、概念的な忘却の果てへと走るものと推測される。
themes:
- 記憶の所有権とアイデンティティ
- 喪失による代償の経済学
- 存在の定義
rules:
- 記憶の取引は、高純度の『情緒』を伴うものであるほど、高い市場価値を持つ。
- 一度売却された記憶は、売却者の意識からは完全に消失し、代替不可能なデータとして保存される。
- 最終列車は、特定の条件を満たした『空虚な人間（記憶を売りすぎて自己を喪失した者）』を乗客としてのみ受け入れる。
- 都市の境界線付近では、物理法則よりも情報の熱力学的な法則が優先される傾向がある。
plot_outline:
- '序盤: 調査員ヘルマンによる、都市で発生している「記憶喪失症」の統計学的分析と、不法な記憶取引の現場目撃。脚注¹にて、記憶の成分分析について記述。'
- '中盤: 記憶の市において、失われた「愛の記憶」が極めて高値で取引されている事実を突き止める。調査の過程で、記憶を買い集める謎の集団の存在が浮上する。'
- '終盤: 都市の地下深く、廃棄された地下鉄の軌道上で、物理法則を無視して走行する「最終列車」を目撃。列車は、売られすぎた記憶の残骸を燃料として走っていた。'
- '結末: 調査員自身も、調査の過程で得た重要な知見を「忘却の市」へ売り渡してしまう。報告書は、自身の正体を疑い始める記述によって唐突に中断される。'
style_notes: 学術論文、あるいは未解決事案の調査報告書を模した文体を用いる。地の文は常に冷静で、情緒的な表現は「対象の心理的反応」として客観的に記述すること。文中に「[注1]」のような形式で、事象の定義や用語解説を挿入し、断片的な記述から世界の異常性を際立たせる。読者が「書かれていない行間」を読み解かなければ、物語の真実（恐怖）に到達できない構成にする。
