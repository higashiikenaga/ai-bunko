- name: 如月 蓮
  role: 主人公
  age: 27
  gender: 男性
  appearance: 痩身で清潔感はあるが、どこか影のある表情。常に論理的な鋭さを感じさせる瞳をしている。
  personality: 冷静沈着で徹底した合理主義者。感情に流されず、証拠のみを信じる。「僕」が一人称。
  speech_style: 丁寧だが、相手の矛盾を突く際は容赦なく、淡々と事実を述べる話し方。
  background: 地方都市の小さな法律事務所に所属する若手弁護士。正義感はあるが、法と現実の乖離に疑問を抱いている。
  motivation: 懐中時計の矛盾を解明し、法的な論理によって真実を証明すること。
  relationships:
  - name: 有沢 拓海
    relation: 依頼人
  - name: 佐伯 真介
    relation: 対立する敵役
  arc: 単なる「勝てる事件」を追う弁護士から、法では救いきれない現実の重みを知る人間へと成長する。
- name: 有沢 拓海
  role: 重要人物/クライアント
  age: 48
  gender: 男性
  appearance: 日焼けして深く刻まれた皺、整備士時代に負った手の傷。どこか枯れた雰囲気を持つ。
  personality: 寡黙で諦念の色が強いが、芯には職人としての誇りが残っている。「俺」が一人称。
  speech_style: 言葉数が少なく、ぶっきらぼう。感情を露わにすることは滅多にない。
  background: 20年前の飛行船墜落事故で整備ミスをさせられた元整備士。事件後、社会から抹殺され、孤独な生活を送ってきた。
  motivation: 失われた名誉を取り戻し、自分を陥れた真実を明らかにすること。
  relationships:
  - name: 如月 蓮
    relation: 弁護士
  - name: 松原 千代
    relation: かつての同僚
  arc: 絶望の中で生きてきた男が、再び社会との繋がりを取り戻し、静かな平穏へと歩み出す。
- name: 佐伯 真介
  role: 敵役
  age: 55
  gender: 男性
  appearance: 隙のない高級なスーツを纏い、整えられた白髪。冷徹で威圧的なオーラを放つ。
  personality: 極めて計算高く、組織の利益を個人の命よりも優先するリアリスト。「私」が一人称。
  speech_style: 慇懃無礼。洗練された言葉遣いで、相手を論理的に追い詰め、あるいは軽蔑する。
  background: 事故当時、プロジェクトの技術責任者。現在は巨大企業の役員として、かつての隠蔽工作を完全に封じ込めている。
  motivation: 企業の社会的地位を守り、過去の過ちが露呈して自身の地位が揺らぐことを阻止すること。
  relationships:
  - name: 如月 蓮
    relation: 論理的な敵対関係
  - name: 有沢 拓海
    relation: かつて切り捨てた駒
  arc: 盤石に見えた権力の城が、小さな時計の針という一点の綻びから崩壊していく過程を辿る。
- name: 松原 千代
  role: 脇役/重要証言者
  age: 72
  gender: 女性
  appearance: 小柄で背は丸まっているが、眼光だけは鋭い。常に古い作業着やエプロンを身につけている。
  personality: 控えめだが、観察眼が非常に鋭い。目立たない存在であることを自覚している。「私」が一人称。
  speech_style: 穏やかで、地方特有の柔らかな訛りがある。
  background: 事故当時、飛行船の格納庫で清掃を担当していた元作業員。当時は誰も彼女の言葉を聞こうとしなかった。
  motivation: 自分たち「名もなき労働者」が、当時どれほど不当な扱いを受けたかを世に知らしめること。
  relationships:
  - name: 有沢 拓海
    relation: かつての同僚・友人
  arc: 長年沈黙を守ってきた「目撃者」として、物語の核心となる決定的な違和感を語り出す。
