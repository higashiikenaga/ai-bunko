title: 墜落した正義の座標
genre: 本格ミステリー
tone: 冷徹かつ論理的。社会の不条理を告発する重厚な雰囲気。
pov: 三人称
tense: 過去形
setting: 地方の旧工業都市。かつて国家プロジェクトとして巨大飛行船の開発拠点であった場所。
premise: 20年前に起きた実験飛行船の墜落事故。当時、整備ミスで全ての責任を負わされ社会的に抹殺された男が、今になって再審を請求する。唯一の物証である「止まった懐中時計」が示す時刻は、公式記録と決定的に食い違っていた。若き弁護士が証言の矛盾を突き、巨大企業の隠蔽工作と、切り捨てられた労働者たちの悲痛な真実を暴き出す。
themes:
- 企業の組織的隠蔽
- 社会的な弱者の尊厳
- 時間と記憶の乖離
rules:
- 証拠品（懐中時計）の停止時刻は物理的な衝撃で固定されており、事後的な改ざんが不可能であること
- 当時の公式記録は企業によって厳格に管理され、公文書として固定されているため、書き換えが困難であること
plot_outline:
- '序盤: 再審請求を受けた弁護士が、元整備士の男と出会う。唯一の物証である壊れた懐中時計が、事故発生時刻の矛盾を提示し、物語が動き出す。'
- '中盤: 当時の関係者への聴取を開始。エリート技術者たちの整合性の取れた証言の裏に、清掃員や雑用係といった「名もなき人々」が目撃した違和感（空飛ぶ船の異様な挙動）が浮かび上がる。'
- '終盤: 法廷での激しい論戦。懐中時計の停止時刻と、気象データおよび船体の構造的欠陥を論理的に結びつけ、責任者が意図的に事故を誘発させたことを証明する。'
- '結末: 有罪判決が覆り、男の無実が証明される。しかし、企業の社会的責任は曖昧なままとなり、法と正義の乖離という苦い後味と共に、男は静かに人生を取り戻す。'
style_notes: 客観的な視点から淡々と記述し、感情的な訴えよりも論理的な矛盾の指摘によって読者を納得させる。特に法廷シーンでは、証言の微細な食い違いを執拗に追い、社会的な権力構造がどのように真実を歪めたかを冷徹に描き出す。
