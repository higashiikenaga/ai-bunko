- name: エリュシオン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 青白い肌に、インクの汚れが染み付いた指先。知的な眼鏡をかけ、記録官の質素なローブを纏っている。
  personality: 慎重で好奇心旺盛。正義感よりも「真実を記録したい」という知的欲求が強いが、根は慈悲深い。一人称は「僕」。
  speech_style: 丁寧で理知的な口調。独り言が多く、分析的に物事を語る。
  background: 帝国中央図書館に所属する若き記録官。禁書庫の管理を任されていた際、地図から消えた村「セーリス」に関する矛盾に気づき、独断で調査を開始した。
  motivation: 歴史の空白を埋めること。そして、絶望の歌に囚われた生存者を救うこと。
  relationships:
  - name: アルテウス
    relation: 導き手であり、後継者としての運命を共有する相手
  - name: リラ
    relation: 救うべき対象であり、物語の核心を握る少女
  arc: 記録という傍観者の立場から、自らの存在を代償にする能動的な救済者へと成長し、最終的に孤独な守護者となる。
- name: アルテウス
  role: 相棒/導き手
  age: 120
  gender: 男性
  appearance: 半透明の青白い身体を持つ亡霊。古びた灯台守の制服を着ており、手には消えかかったランタンを持っている。
  personality: 皮肉屋で厭世的だが、内面には深い愛情と後悔を抱えている。一人称は「私」。
  speech_style: 古風で尊大な話し方。時折、ため息混じりに語る。
  background: かつての「アストラエアの眼」の灯台守。村を隔離し、現世から隠し通すという神の残酷な救済を完遂させた責任感に縛られ、死後もこの地に留まっている。
  motivation: 灯台の光を絶やさず、自分に代わってこの「呪われた使命」を引き継ぐに足る後継者を見つけること。
  relationships:
  - name: エリュシオン
    relation: 不器用な師弟関係
  arc: エリュシオンの純粋な献身に触れ、自身の罪悪感から解放され、静かな眠りにつく。
- name: リラ
  role: 鍵となる人物
  age: 17
  gender: 女性
  appearance: 海水の揺らぎのような淡いドレスを纏い、瞳には深い霧が立ち込めている。常に儚げな歌を口ずさんでいる。
  personality: 絶望に塗り潰され、感情が希薄になっているが、心の奥底では誰かに見つけ出されることを切望している。一人称は「私」。
  speech_style: 囁くような、夢遊病者のような曖昧な話し方。
  background: 消えた村セーリスの生き残りであり、村の記憶を一身に背負わされた「歌い手」。彼女の絶望が物理的な現象となり、周囲を虚無へ引きずり込んでいる。
  motivation: 終わりのない孤独から解放され、忘れ去られた村の住人たちと共に安らぎを得ること。
  relationships:
  - name: エリュシオン
    relation: 自分を「名」と共に繋ぎ止めてくれた唯一の理解者
  arc: 絶望の歌を止め、現世に再び足をつけることで、失われた人間としての心を取り戻す。
- name: ヴァレリウス
  role: 敵役/対立者
  age: 38
  gender: 男性
  appearance: 隙のない軍服に身を包み、鋭い眼光を持つ。常に厳格な規律を体現したような佇まい。
  personality: 冷徹な現実主義者。個人の感情よりも世界の秩序と安定を最優先する。一人称は「私」。
  speech_style: 断定的で威圧的な口調。無駄を嫌う。
  background: 記録局の監査官であり、エリュシオンの上司。セーリスの存在を「世界のバグ」として完全に抹消し、歴史から消し去ることを任務としている。
  motivation: 禁忌に触れたエリュシオンを連れ戻し、セーリスの残滓を完全に消滅させて世界の均衡を保つこと。
  relationships:
  - name: エリュシオン
    relation: 才能を認めていながらも、甘さを切り捨てようとする天敵
  arc: 完璧な秩序こそが正義だと信じていたが、エリュシオンの自己犠牲という「非効率な奇跡」を目の当たりにし、価値観を揺さぶられる。
