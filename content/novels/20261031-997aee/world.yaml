title: 星鉄の挽歌と失名の汀
genre: 伝奇
tone: 荘厳かつ重厚。神話的余韻を湛えた格調高い文体。
pov: 三人称
tense: 過去形
setting: 神代の残滓が漂う大陸の辺境、忘却の海に面した絶壁の地「灰白の岬」。
premise: かつて神の失策により地図から消し去られた村「セーリス」。その記憶を繋ぎ止める唯一の道標が、千年の間灯り続けた古き灯台「アストラエアの眼」である。若き記録官エリュシオンは、禁忌の書物に従い、消えた村の生存者が発する「絶望の歌」を止めるため、絶海へと旅立つ。そこで彼は、歴史の裏側に塗り潰された残酷な真実と対峙することになる。
themes:
- 忘却と記憶
- 運命への抗い
rules:
- 『名』を失った者は世界の認識から外れ、物理的に不可視となる。
- 灯台の光が届く範囲のみ、消滅した空間（位相）が一時的に顕現する。
- 神代の詩を正しく詠唱することで、物質の構成を一時的に書き換えることができる。
plot_outline:
- 序盤：記録官エリュシオンが、古文書に記された『消えた村』の異変を察知し、禁域である灰白の岬へ向かう。
- 中盤：古き灯台に到達したエリュシオンは、灯台守の亡霊から、村が消えた本当の理由が神への反逆ではなく、救済のための隔離であったことを知る。
- 終盤：灯台の光が絶え、村が完全に虚無へ飲み込まれようとする中、エリュシオンは自らの『名』を代償に、村の住人たちを現世へと繋ぎ止める儀式を試みる。
- 結末：村は救われたが、エリュシオンは世界から忘れ去られた存在となり、新たな灯台守として静かに海を見守り続ける。
style_notes: 竜胆 アルトとしての筆致。地の文は古風で重厚な語彙を選定し、神話的な比喩を多用すること。作中に挿入される伝承や詩篇は、独立した段落で格調高く記述する。地名や固有名詞にはラテン語や古語の響きを持たせ、世界の奥行きを表現する。
