title: 断熱の境界、あるいは情報の熱力学
genre: SF
tone: 重厚、硬質、知的な高揚感
pov: 三人称
tense: 過去形
setting: 惑星アエロの再構築後。熱循環が安定し、新たな相転移を遂げた大気圏から、熱の残滓が沈殿する深海の底まで。
premise: 惑星アエロは熱平衡を再構築し、新たな「静かなる季節」を迎えていた。しかし、再起動の際に放出された過剰な情報エントロピーが、物理的な熱量と共に惑星の深層へと沈殿し始めていた。かつての熱嵐の痕跡を辿るカイとライラは、海底に沈んだ旧文明のデータ集積地「情報の海底遺跡」へと向かうことになる。そこで彼らが目にするのは、熱の循環を維持するために惑星が支払った「記憶」という名の代償であった。
themes:
- 熱力学第二法則と情報理論
- 文明の記憶と忘却のコスト
rules:
- 熱の移動は常にエントロピーの増大を伴い、情報の記録は物理的な熱エネルギーの散逸とトレードオフの関係にある。
- 惑星アエロの深海は、高圧と熱の残留物により、情報の熱力学的安定状態（情報の海底遺跡）を形成している。
- 渡り鳥の群れは、熱だけでなく、磁気的な情報パルスを運搬する媒体としても機能する。
plot_outline:
- '序盤: 熱平衡が安定したアエロで、カイとライラは「渡り鳥」の新しい役割を模索している。しかし、大気中に漂う磁気ノイズが、単なる熱の揺らぎではなく、構造化された「情報」であることをカイが発見する。二人は、その情報の源流が惑星の極深海にあることを突き止める。'
- '中盤: 調査のため、二人はかつての熱嵐の影響で海面下に沈んだ旧時代の居住区へと潜航する。そこには、物理的な書籍が情報の断片を保持したまま化石化した「古本屋」のような領域が存在していた。彼らは、かつての管理局が隠蔽していたのは熱量だけでなく、惑星の進化プロセスそのものの記録であったことを知る。'
- '終盤: 海底遺跡の深部で、二人は巨大な「情報の相転移」に遭遇する。蓄積された情報エントロピーが臨界点を超え、物理的な熱として再噴出（熱暴走）しようとするのだ。カイは、熱を逃がすだけでなく、情報を適切に「散逸」させるための新しい熱循環回路の設計を試みる。'
- '結末: ライラの精密な操縦により、情報の奔流を磁気的な波形として宇宙へ整流することに成功する。惑星は再び安定するが、それは以前よりも「記憶を失った」静かな世界であった。二人は、失われた情報の代わりに、新たに刻まれた物理法則の美しさを眺めながら、次なる航海へと向かう。'
style_notes: ハードSFの文体を徹底する。熱力学、情報理論、流体力学の概念を物語の推進力とし、熱の移動を単なる現象ではなく、宇宙の秩序（あるいは無秩序）への意志として描く。大規模な熱対流や深海の高圧環境といった、スケールの大きな光景を物理的な整合性を持って描写し、読者に「宇宙の理」を感じさせるセンス・オブ・ワンダーを提供する。
