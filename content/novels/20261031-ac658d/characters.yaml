- name: 湊 遥斗
  role: 主人公
  age: 26
  gender: 男性
  appearance: 線の細い体型、少し疲れたような目元、常に油の匂いがかすかにする清潔な手。落ち着いた色合いの作業着を好む。
  personality: 内向的で思慮深い。物静かで観察眼が鋭い。一人称は「僕」。
  speech_style: 丁寧で穏やかだが、どこか自分と世界との間に距離を置いたような話し方。
  background: 亡き父から時計修理店を継いだが、父の死後、自分自身の時間も止まったかのように感じ、修理に没頭することで孤独を紛らわせている。
  motivation: 壊れた時計を完璧に直すこと。しかし本質的には、止まったままの自分の心を動かすきっかけを求めている。
  relationships:
  - name: 紬 陽菜
    relation: 依頼人
  - name: 雫
    relation: 喫茶店の店主・不思議な知人
  arc: 喪失を恐れて時間を止めていた青年が、他者の想いに触れることで、再び未来へ進む勇気を得る。
- name: 紬 陽菜
  role: 重要人物（依頼人）
  age: 17
  gender: 女性
  appearance: 透明感のある瞳、雨の日でも明るい色のレインコートを好む、少し幼さの残る顔立ち。
  personality: 真面目で芯が強いが、内面に深い悲しみを抱えている。一人称は「私」。
  speech_style: 丁寧だが、祖父の話題になると言葉がわずかに震えることがある。
  background: 亡くなった祖父の形見である壊れた懐中時計を手に、湊の店を訪れる。時計の中に祖父の言葉が隠されていると信じている。
  motivation: 時計の針を再び動かすことで、祖父が遺した「最後の言葉」を受け取りたい。
  relationships:
  - name: 湊 遥斗
    relation: 時計修理師
  - name: 紬の祖父
    relation: 祖父
  arc: 過去への執着と悲しみを受け入れ、祖父の死を「終わり」ではなく「記憶」として昇華させる。
- name: 雫
  role: 導き手（謎の人物）
  age: 不詳（30代後半に見える）
  gender: 女性
  appearance: 霧雨に溶け込むような落ち着いた服装、すべてを見透かすような静かで深い瞳。
  personality: 神秘的で慈愛に満ちているが、どこか浮世離れしている。一人称は「私」。
  speech_style: 抑揚が少なく、詩的でリズムのある、聞き手に安らぎを与える話し方。
  background: 雨の日だけ現れる不思議な喫茶店の店主。持ち主を失った「物」たちの声を聞き、その願いを届ける役割を担っている。
  motivation: 持ち主を失った物たちが、最後に果たしたい願いを届ける手助けをすること。
  relationships:
  - name: 湊 遥斗
    relation: 客・理解者
  arc: 物語を通じて変化することのない存在として、湊が変化していく過程を静かに見守る。
- name: 佐伯 絵美
  role: 脇役（湊の理解者）
  age: 26
  gender: 女性
  appearance: 快活な表情、街の花屋の店員らしい、色彩豊かなエプロン姿。湊とは対照的に色彩豊かな格好をする。
  personality: 明るく社交的、直感的で面倒見が良い。一人称は「私」。
  speech_style: はきはきとした、親しみやすく活気のある話し方。
  background: 湊の幼馴染。彼が店に閉じこもっていることを心配し、時折食事などを差し入れに来る町の住人。
  motivation: 湊が孤独な殻を破り、日常の明るい世界に戻ってくること。
  relationships:
  - name: 湊 遥斗
    relation: 幼馴染
  arc: 湊の閉ざした心に、日常の些細な喜びや変化を伝え続ける役割を果たす。
