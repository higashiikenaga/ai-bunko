- name: 佐藤 健一（さとう けんいち）
  role: 主人公
  age: 35
  gender: 男性
  appearance: 無造作な黒髪に、少し使い込まれたエプロン姿。常に工具やテスターを身につけている。穏やかだがどこか影のある瞳。
  personality: 寡黙で冷静沈着。物や機械に対して深い敬意を払う。一人称は「僕」。
  speech_style: 落ち着いたトーンで、丁寧だが少しぶっきらぼうな話し方。
  background: 元精密機器エンジニア。亡き祖父が営んでいた骨董電子機器カフェを継ぎ、町に根付いた店を守っている。
  motivation: 持ち込まれた古いゲーム機の修復と、その中に宿るAIの「願い」を叶えること。
  relationships:
  - name: ミミ
    relation: 店員・妹分のような存在
  - name: ポポ
    relation: 修理・ケア対象
  arc: 機械の修理という「過去の修復」に没頭していたが、ポポとの関わりを通じて、人と人との感情の機微に向き合うようになる。
- name: 美咲（みみ）
  role: 相棒
  age: 19
  gender: 女性
  appearance: 明るい茶髪のショートボブ。動きやすいオーバーオールを着ている。表情が豊かで、瞳がキラキラしている。
  personality: 好奇心旺盛で社交的。困っている人を放っておけないお節介焼き。一人称は「私」。
  speech_style: はつらつとした明るい話し方。語尾が少し跳ねる癖がある。
  background: 地元の大学に通う学生。カフェのアルバイトとして働きながら、町の人々との交流を楽しんでいる。
  motivation: ポポが探している相手を見つけ出し、物語をハッピーエンドに導くこと。
  relationships:
  - name: 佐藤 健一
    relation: 店主
  - name: ポポ
    relation: 親友・守るべき存在
  arc: 単なる好奇心で動いていたが、ポポの切実な願いを知ることで、誰かの記憶を繋ぐことの責任と喜びを学ぶ。
- name: ポポ
  role: キーキャラクター
  age: 30
  gender: 不明
  appearance: 90年代の携帯ゲーム機の液晶画面の中に映る、ドット絵の小さなキャラクター。感情に合わせて色が変化する。
  personality: 純粋無垢で、少し寂しがり屋。時折、データ破損によるノイズを出す。一人称は「ポポ」。
  speech_style: 電子音を思わせる、リズム感のある独特な話し方。「〜だよ」「〜なの？」など。
  background: 三十年前の実験的な対話型AIプログラム。ある人物へのメッセージを抱えたまま、電源が切れていた。
  motivation: 不完全な記憶の断片を頼りに、三十年前の約束の相手にメッセージを届けること。
  relationships:
  - name: 佐藤 健一
    relation: メンテナンスしてくれる人
  - name: 望月 重雄
    relation: 探している相手
  arc: 消えゆく記憶への不安を抱えていたが、人々に助けられることで、自身の存在意義を「記憶を届けること」に見出す。
- name: 望月 重雄（もちづき しげお）
  role: 脇役
  age: 72
  gender: 男性
  appearance: 白髪混じりの髪を丁寧に整え、使い込まれたハンチング帽を被っている。優しげな皺が刻まれた顔立ち。
  personality: 穏やかで教養があるが、過去の出来事に対しては少し頑固な一面もある。一人称は「私」。
  speech_style: ゆっくりとした、品のある落ち着いた話し方。
  background: かつてこの町で電子工作の教室を開いていた元技術者。現在は静かな隠居生活を送っている。
  motivation: ふと思い出した古い約束の真意を、再確認すること。
  relationships:
  - name: ポポ
    relation: かつての約束の相手（の記憶の依り代）
  arc: 過去の約束を「果たせなかった後悔」として抱えていたが、ポポとの再会を通じて、それを「温かな思い出」として受け入れられるようになる。
