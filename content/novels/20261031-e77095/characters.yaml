- name: エルン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 色素の薄い髪に、インク汚れが染み付いた指先。地下図書館の古びた記録官の外套を纏っている。
  personality: 知的好奇心が強く、内向的だが芯が強い。一人称は「僕」。
  speech_style: 丁寧だが、自信なさげに言葉を濁らせる癖がある。
  background: 記憶の遺棄場とも呼ばれる地下図書館で、ただ記録を整理する日々を送っていたが、ある日自らの血脈に秘められた「書き換えの力」に気づく。
  motivation: 失われた神話の断片を集め、世界がなぜ滅びゆくのかという真実を突き止めること。
  relationships:
  - name: 車掌
    relation: 監視者であり、世界の理を教える導き手
  - name: リラ
    relation: 旅の同行者であり、守るべき存在
  arc: 受動的に記録を読み取るだけの存在から、自らの意志で新しい世界の物語を書き記す創造者へと成長する。
- name: 車掌
  role: 敵役/ガイド
  age: 0
  gender: 男性
  appearance: 隙のない黒い制服に身を包み、瞳の中に時計の歯車が回転している。常に金色の懐中時計を手にしている。
  personality: 冷徹で効率主義。世界の終焉を「慈悲深い救済」と考えている。一人称は「私」。
  speech_style: 事務的で厳格。相手を突き放すような冷たい口調。
  background: 神々から「忘却の執行」を託された歴史の守護者。列車を走らせ、記憶を燃料に変えて世界を無へと還す役割を担う。
  motivation: 一切の未練と記憶を消し去り、完璧な「無」による救済を完遂させること。
  relationships:
  - name: エルン
    relation: 秩序を乱す不確定要素であり、同時に興味深い観察対象
  arc: 絶望的な決定論に従っていたが、エルンの純粋な執着に触れ、忘却以外の選択肢があることを認め始める。
- name: リラ
  role: 相棒
  age: 17
  gender: 女性
  appearance: 星屑を散りばめたような銀色の髪。記憶を燃料として消費したため、時折身体の一部が透き通っている。
  personality: 天真爛漫で儚げ。失った記憶に悲しみを感じず、今の瞬間を愛そうとする。一人称は「私」。
  speech_style: 夢見心地で詩的な表現を多用する話し方。
  background: 最終列車の乗客の一人。かつては高名な音楽家だったが、記憶を燃料に捧げたため、自分の名前以外のすべてを忘れている。
  motivation: 消えゆく前に、もう一度だけ「心から震えるような美しい音」を聴くこと。
  relationships:
  - name: エルン
    relation: 絶望の中で唯一自分を「個」として見てくれた親友
  arc: 忘却を受け入れて消える運命だったが、エルンの決断によって「新しい世界の最初の記憶」として再生する。
- name: カエル
  role: 脇役/警告者
  age: 42
  gender: 男性
  appearance: ボロボロの衣服に身を包み、灰にまみれた顔。片方の目が白濁している。
  personality: 強迫観念に囚われており、情緒不安定。一人称は「俺」。
  speech_style: 断続的に早口で話し、時折激しく笑い出す。
  background: かつてエルンと同じく記録官であり、世界の書き換えを試みたが失敗し、記憶の大部分を喪失して列車に彷徨う幽霊のような存在となった。
  motivation: エルンが持つ「書き換えの鍵」を奪い、自分の失った記憶を取り戻すこと。
  relationships:
  - name: エルン
    relation: かつての自分を投影する憎悪と羨望の対象
  arc: エルンの旅の障害となるが、最終的に自らの過ちを認め、彼に禁忌の呪文のヒントを遺して灰に還る。
