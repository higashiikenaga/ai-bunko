title: 刻印の灰、忘却の終着駅
genre: 異世界ファンタジー
tone: 重厚、哀切、神話的
pov: 三人称
tense: 過去形
setting: 黄昏の時代。魔法が枯渇し、文明が緩やかに滅びゆく「終焉の地」アステリア。地表は常に薄灰の降る霧に覆われている。
premise: 神々の死後、世界の記憶は「地下図書館」に封印され、その記録は失われつつあった。若き記録官エルンは、失われた神話の断片を求めて、禁忌とされる「最終列車」に乗り込む。その列車は、世界の終焉を確定させるためではなく、過ぎ去りし輝かしい時代を葬り去るために走っていた。エルンは列車の旅を通じて、自らの血脈に刻まれた、世界の理を書き換える禁じられた呪文に気づいていく。
themes:
- 記憶と忘却
- 滅びゆく世界の美学
- 継承される意志
rules:
- 「記憶の質量」：人間が忘れた記憶は、物理的な灰となって大地に降り積もる。
- 「地下図書館の理」：書物は生きた魂の模造であり、閲覧には持ち主の「記憶の一部」を代償として捧げなければならない。
- 「最終列車の運行規則」：列車は物理的な線路ではなく、人々の「追憶」が繋ぎ止める概念の軌道を走る。
plot_outline:
- '序盤: 灰降る街の片隅で、地下図書館の司書として働くエルンは、古びた詩編の中に「世界を再編する鍵」の記述を見出す。彼は禁断の知識を求め、列車の駅へと向かう。'
- '中盤: 終着点のない最終列車に乗り込んだエルンは、乗客たちが「過去の最も美しい記憶」を燃料として消費していることに気づく。列車の車掌は、歴史の守護者であり、同時に破壊者でもあった。'
- '終盤: 列車は世界の底、全ての記憶が集積する「忘却の深淵」へと到達する。そこでエルンは、神々が世界を終わらせた真の理由が、忘却による苦しみからの救済であったことを知る。'
- '結末: エルンは全ての記憶を灰として還すのではなく、新しい神話として書き換える決断を下す。列車は砕け散り、灰の中から、記憶を持たないがゆえに自由な、新しい世界の夜明けが訪れる。'
style_notes: 格調高い古語を交え、叙事詩のような重厚な筆致を用いる。地名や伝承には、それ自体が歴史の重みを感じさせる造語を多用すること。例えば『星霜の詩』『灰の黙示録』といった比喩を地の文に組み込み、読者がその世界の悠久の時間を肌で感じられるように記述する。会話文では、騎士には厳格な口調を、司書には静謐な口調を徹底して使い分ける。
