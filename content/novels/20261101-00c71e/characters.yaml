- name: 湊 怜
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常にどこか疲弊した表情を浮かべ、清潔感はあるが生命感に欠ける青年。霧に濡れたスーツを着ている。
  personality: 内向的で思索的。日常の中に潜む「欠落」に苛まれている。一人称：僕
  speech_style: 控えめで、言葉を選びながら静かに話す。
  background: 平凡な会社員。生活に不満はないはずだが、耳鳴りと正体不明の喪失感に追い詰められている。
  motivation: 自分の中に空いた「穴」の正体を突き止め、失われた何かを取り戻すこと。
  relationships:
  - name: 鴉丸
    relation: 対峙する記憶の商人
  - name: 陽葵
    relation: 失われた最愛の人
  arc: 違和感の正体が、自ら売却してしまった「愛の記憶」であったことを知り、絶望と共に現実を放棄する。
- name: 鴉丸
  role: 敵役
  age: 0
  gender: 不詳
  appearance: 黒い外套を纏い、霧に溶け込むような影の濃い男。顔の半分が広いつばの帽子に隠れている。
  personality: 冷徹で事務的。人間の記憶を単なる「商品」としてのみ扱う。一人称：私
  speech_style: 低く、一定のリズムを刻むような、地響きに近い声。
  background: 地図にない駅のホームで、迷い込んだ者の記憶を買い取る露店の主。
  motivation: 価値ある記憶を集め、この奇妙な市場を維持すること。
  relationships:
