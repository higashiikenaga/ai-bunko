  age: 22
  gender: 女性
  appearance: 雨に濡れた髪、焦点の合わない虚ろな瞳。空の小瓶を大切そうに、しかし力なく抱えている。
  personality: 虚脱状態にあり、生気がない。自分が何者であるかも忘れている。一人称：私
