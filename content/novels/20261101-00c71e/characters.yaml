  personality: 慈愛に満ちており、湊を精神的に支えていた。一人称：私
  speech_style: 穏やかで、聞き心地の良い、音楽のような声。
  background: 湊がかつて深く愛し、その存在そのものを「幸福の代償」として売却してしまった女性。
