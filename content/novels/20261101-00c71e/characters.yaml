  background: 記憶を売りすぎて、自分の名前や存在の拠り所を失ってしまった駅の迷い人。
  motivation: 自分がかつて持っていた「何か」の温もりや感触を、無意識に探し求めている。
  relationships:
  - name: 湊 怜
