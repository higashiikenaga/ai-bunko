title: 黄金砂の郵便船と、碧き翼の記憶
genre: スチームパンク冒険
tone: エキゾチック、寓話的、静寂と喧騒の対比
pov: 三人称
tense: 過去形
setting: 巨大な歯車で駆動する空中交易都市「アズラール」と、その下に広がる無限の砂漠。蒸気機関を搭載した砂上船が往来する世界。
premise: 砂漠を旅する郵便配達員の青年は、ある日、数十年前に宛先を失った一通の手紙を拾う。手紙に記されていたのは、地図にない「水が枯れない伝説の都」への道標だった。彼は導き手となる渡り鳥と共に、錆びついた蒸気船で静寂の砂海へと漕ぎ出す。それは失われた約束と、世界の秘密を辿る旅となる。
themes:
- 約束の価値
- 孤独と連帯
- 失われた記憶の再生
rules:
- 砂漠の航行には『風読みの鳥』の誘導が不可欠であること
- 蒸気船の動力源は、砂漠に点在する希少な結晶石であること
- 空中都市アズラールは、巨大な主歯車が止まると墜落すること
plot_outline:
- '序盤: 喧騒に満ちた空中都市アズラールの市場で、若き配達員が古びた「失われた手紙」を発見し、導き手となる渡り鳥と共に伝説の都を目指す旅に出る。'
- '中盤: 砂嵐や略奪船との激しい攻防を繰り広げながら、砂漠の深部で忘れ去られた蒸気文明の遺構を巡り、手紙の差出人が遺した謎を解き明かす。'
- '終盤: 伝説の都に到達した青年は、そこが空中都市アズラールの動力源を制御する心臓部であることを知る。都市の崩壊を止めるため、手紙に記された真の約束を果たす決断を迫られる。'
- '結末: 都市を救い、砂漠に再び緑の兆しを取り戻した青年は、誰にでも届く言葉を届けるため、再び郵便船を走らせて地平線の彼方へと旅立つ。'
style_notes: 砂原オアシスの筆致を再現すること。市場の場面では、真鍮の擦れる音や香辛料の匂い、多言語が飛び交う喧騒を濃密に描き、対照的に夜の砂漠では、星々の静寂と冷たい風の音のみが支配する空間を静謐に描写し、動と静のコントラストを際立たせる。
