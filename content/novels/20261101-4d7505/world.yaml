title: 空飛ぶ歯車と、迷子の鉄屑心臓（メカニカル・ハート）
genre: スチームパンク冒険
tone: 明るく活気に満ちた、ワクワクする冒険譚
pov: 一人称（あたし）
tense: 過去形
setting: 巨大な浮遊島と蒸気船が飛び交う、雲海の上の世界
premise: ジャンク屋のあたし、ルルが拾ったのは、おしゃべりな小さな歯車型AIだった！「ボク、どこにいるの？」なんて無垢な問いを投げかけてくるアイツが、伝説の『最終列車』への鍵を握っているなんて、誰が思う？蒸気機関が唸り、空を駆ける、お腹も空く、騒がしくて最高な大冒険の始まり！
themes:
- 自己の存在理由
- 機械と心の境界線
rules:
- エネルギー源はすべて高圧蒸気とエーテル結晶である
- 伝説の最終列車は、空の果てにある『星の軌道』にのみ現れる
- 高度な人工知能は、世界政府によって厳重に管理・回収の対象となっている
plot_outline:
- '序盤: 廃品回収中のルルが、意思を持つ歯車型AI『ピコ』を拾う。ピコの不思議な能力に惹かれるルルだったが、すぐに政府の回収部隊に追われる身となる。'
- '中盤: 相棒の操縦士と共に、ボロボロの蒸気船で雲海を逃走。ピコが『最終列車』を呼び出すためのナビゲーション・エンジンであることが判明し、物語は加速する。'
- '終盤: 世界の端にある巨大な空中駅で、政府の巨大戦艦との決戦。ルルはピコを「道具」ではなく「友達」として守るため、命がけの操縦を見せる。'
- '結末: 黄金のレールを走る最終列車への乗車に成功。未知なる新世界へと向かう車内で、ルルは勝利の祝杯として、焼きたての肉パイを頬張る。'
style_notes: 一人称「あたし」による軽快でツッコミの多い語り。キャラクター同士の掛け合いを重視し、テンポよく展開する。食べ物の描写（湯気が立ち上る肉パイの脂の照りや、甘いシロップの香りなど）は、読者の食欲をそそるように細かく、美味しそうに書くこと。毎話、必ずキャラクターの可愛げや小さな笑いどころを配置する。
