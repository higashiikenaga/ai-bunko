- name: 如月 新
  role: 主人公
  age: 17
  gender: 男性
  appearance: 細身でどこか影のある風貌。眼鏡をかけており、コート上では目立たない存在感。
  personality: 冷静沈着で観察眼に優れる。一人称は「僕」。一見冷めているが、内側に強い執着心を秘めている。
  speech_style: 丁寧だが、核心を突くときは淡々とした口調。
  background: かつては期待された選手だったが、怪我の影響で身体能力が衰え、現在はベンチで戦況を俯瞰する役割に回っている。
  motivation: 「選ばれなかった者」にも、勝負を決定づける価値があることを証明すること。
  relationships:
  - name: 立花 澪
    relation: 戦術を共に構築する理解者
  - name: 久我 亮介
    relation: 自分の理論を体現させる守備の要
  arc: 傍観者として戦況を眺める立場から、チームの欠損を埋めるための「思考の核」へと成長する。
- name: 立花 澪
  role: 相棒
  age: 17
  gender: 女性
  appearance: 常にタブレットを持ち歩き、手際よくデータを記録する。ポニーテールの快活な少女。
  personality: 合理的で数字を信奉する。一人称は「私」。感情よりも論理を優先するが、実は誰よりも情熱的。
  speech_style: 早口で、結論から先に述べる論理的な話し方。
  background: 元ハンドボール指導者の娘。理論には明るいが、実戦での「予測不能な動き」に苦しんできた。
  motivation: 数字と理論によって、才能の差を埋める「勝利の方程式」を完成させること。
  relationships:
  - name: 如月 新
    relation: データに意味を与える最高のパートナー
  arc: 数字では測れない「泥臭い献身」や「選手の熱量」を認め、理論と感情を融合させたマネジメントを学ぶ。
- name: 久我 亮介
  role: 主要プレイヤー
  age: 17
  gender: 男性
  appearance: がっしりとした体格。膝や肘に擦過傷が絶えない、泥臭い雰囲気を持つ選手。
  personality: 不器用で口下手だが、誰よりも練習に打ち込む努力家。一人称は「俺」。
  speech_style: ぶっきらぼうで、言葉数は少ないが力強い。
  background: 特別な才能がなく、周囲からは「器用ではない」と見なされてきた控え選手。
  motivation: 自分がこのチームに必要であるという実感を得ること。
  relationships:
  - name: 如月 新
    relation: 自分の役割を定義してくれた恩人
  arc: 「個の力」への劣等感を捨て、隣の選手と繋がり、隙間を埋める「ディフェンスの要」としての誇りを見出す。
- name: 一ノ瀬 蓮
  role: 敵役
  age: 17
  gender: 男性
  appearance: 圧倒的なオーラを放つ、華やかで洗練されたアスリート。恵まれた体格とスピードを持つ。
  personality: 自信家で、勝利を当然のものと考えている。一人称は「俺」。
  speech_style: 余裕を感じさせる、高圧的だが礼儀正しい話し方。
  background: 全国屈指のハンドボール強豪校のエース。天賦の才を持ち、すべてを個の力でねじ伏せてきた。
  motivation: 完璧な勝利によって、自らの絶対的な優位性を証明し続けること。
  relationships:
  - name: 如月 新
    relation: 初めて自分の動きを「無効化」してきた未知の脅威
  arc: 個の力が組織力に飲み込まれる絶望を味わい、スポーツにおける「強さ」の定義について葛藤する。
