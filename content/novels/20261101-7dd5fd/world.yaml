title: ラスト・サークル・ディフェンス
genre: スポーツ青春
tone: 熱量のある群像劇。泥臭さと緻密な戦略の対比。
pov: 三人称（選手、ベンチ、観客の視点をスイッチ）
tense: 過去形
setting: 現代、かつてのハンドボール名門校が没落した地方都市の高校。
premise: かつての栄光を失い、今は「どこからも選ばれなかった」控え選手と不器用な部員ばかりが集まるハンドボール部。エース不在のチームが、徹底した組織力とベンチからの緻密な分析で強豪に挑む。個の才能ではなく、互いの欠損を埋め合う「補完のスポーツ」としての物語。
themes:
- 個の喪失と集団の肯定
- 役割の価値
rules:
- 試合時間は30分ハーフ。1チーム7名が出場し、交代は自由。戦術ボードの指示は、選手の動きを座標と矢印で言語化して描写する。
plot_outline:
- '序盤: 弱小となったハンドボール部。控え選手ばかりのチームは連敗続きだが、分析好きのマネージャーと、コート外から戦況を俯瞰する控え選手が、チームの「隙間」を埋める独自の戦術を考案し始める。'
- '中盤: 練習場の古びた鏡に向き合い、自分のフォームではなく「隣の選手との距離」を意識する特訓を重ねる。相手の動きを鏡のように写し取り、無効化する徹底的なディフェンス戦術を確立し、地方大会で強豪を次々と撃破していく。'
- '終盤: かつての宿敵である超強豪校との決勝戦。戦術が読み切られた絶望的な状況の中、彼らは放課後の「約束の丘」で誓い合った、数字や理論に表れない「泥臭い献身」を武器に、最後の1分間の攻防に挑む。'
- '結末: 勝敗を超えて、ベンチの全員が「自分はこのチームに不可欠なピースだった」と確信し、最高の充足感を得る。スポーツにおける勝利の定義を書き換え、彼らは新たな誇りを胸に卒業へと向かう。'
style_notes: 三人称多視点。特にベンチから見たコートの俯瞰的な描写を重視し、観客席のざわめきを舞台装置として活用する。作戦ボードの内容を「右ウィングから中央へ斜めの矢印、ピボットがスクリーンをかける」といった形で、視覚的にイメージできるよう具体的に言語化して描く。控え選手やマネージャーの心理的葛藤に深く光を当てる。
