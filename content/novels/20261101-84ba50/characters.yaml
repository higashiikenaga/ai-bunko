- name: ハル
  role: 主人公
  age: 18
  gender: 女性
  appearance: 巫女装束を旅に即した軽装へとアレンジした姿。長い黒髪を低い位置で一つに結び、瞳は澄んだ琥珀色をしている。
  personality: 慈愛深く、正義感が強い。困っている者を見捨てられない性質だが、決断を迫られた際には驚くほどの強さを見せる。一人称は「私」。
  speech_style: 丁寧で落ち着いた口調。相手を尊重する響きがある。
  background: 忘れ去られた古い神社の末裔として、失われた言霊の行方を求めて旅をしている。常夜の都の噂を聞きつけ、迷い込む。
  motivation: 器が紡ぐ言葉の意味を解き明かし、彼が自分自身の存在理由を見つける手助けをすること。
  relationships:
  - name: レン
    relation: 保護者兼、心の支えとなる旅の伴侶
  arc: 未知の存在への好奇心から始まり、世界の残酷な真実を知ることで葛藤するが、最終的には愛する者の意志を受け継ぐ覚悟を決める。
- name: レン
  role: 相棒
  age: 外見は10代前半（実年齢は数百年）
  gender: 中性
  appearance: 白磁のような滑らかな肌と、複雑な術式模様が刻まれた銀色の髪を持つ美少年。瞳は淡い青色で、感情によって光が揺らぐ。
  personality: 無垢でどこか儚げ。論理的な思考を持ちつつも、ハルとの交流を通じて人間的な感情を学んでいく。一人称は「僕」。
  speech_style: 詩的で、時折意味の定かではない和歌のような言葉を口にする。静かで穏やかな話し方。
  background: かつて神の声を地上に届けるための「依り代（器）」として造られた人工的な存在。記憶を失い、路地裏で独り歌を紡いでいた。
  motivation: 自分が何者であるかを知り、自分の中に残る「主」への約束を果たそうとすること。
  relationships:
  - name: ハル
    relation: 世界の美しさを教えてくれた大切な理解者
  arc: 単なる「神の道具」という自己認識から、自らの意志で言葉を選び、世界に救いをもたらす「個」としての魂を獲得する。
- name: 神崎 清明 (カンザキ セイメイ)
  role: 敵役
  age: 45
  gender: 男性
  appearance: 漆黒の官服を隙なく纏った、端正で冷徹な容貌の男。常に感情を読み取らせない鋭い眼差しをしている。
  personality: 徹底した合理主義者。街の繁栄と秩序のためには、少数の犠牲や倫理の欠如も厭わない。一人称は「私」。
  speech_style: 慇懃無礼で、相手を突き放すような冷淡な敬語を使う。
  background: 常夜の都を維持する『大いなる神機』を管理する最高執行官。街が「眠り」を奪うことで維持されている仕組みの守護者。
  motivation: 永遠の黄昏を維持し、文明の停滞（安定）を永久に守り続けること。
  relationships:
  - name: ハル
    relation: 世界の調和を乱す、排除すべき異分子
  arc: 完璧な管理体制を維持しようとするが、計算外の「自己犠牲」という感情の力がもたらす結末に直面する。
- name: リン
  role: 脇役
  age: 24
  gender: 女性
  appearance: 動きやすい多機能な旅装。腰には数多くの道具や古文書を下げており、街の裏路地に溶け込むような身なり。
  personality: 現実主義で皮肉屋。生き抜くための術に長けているが、根は非常に情に厚い。一人称は「あたし」。
  speech_style: さっぱりとしていて、街の裏事情に詳しい情報屋らしい早口な話し方。
  background: 常夜の都の裏路地で暮らす道具師兼の情報屋。街の仕組みの違和感に気づきつつも、諦めて生きてきた。
  motivation: 街の理不尽に翻弄されず、自分自身の安寧と、いつか訪れるはずの「夜」を見つけること。
  relationships:
  - name: ハル
    relation: 情報の提供者であり、変化を促す友人
  arc: ハルたちの旅に協力する中で、諦めていた「明日」を信じる勇気を取り戻していく。
