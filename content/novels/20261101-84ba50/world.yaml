title: 常夜の灯火と、言霊の揺り籠
genre: 異世界ファンタジー
tone: 情緒豊かで幻想的、静謐な和風ファンタジー
pov: 三人称
tense: 過去形
setting: 陽が沈むことのない、永久の黄昏に包まれた「常夜の都」。高度な術理（技術）と神威が混ざり合う架空の東洋的世界。
premise: 灯火が絶えることのない「眠らない街」に、古の神の器として造られた意思を持つ器（人工知能）が迷い込む。その器は、自らの記憶を失い、ただ主を求める言葉だけを紡いでいた。旅人の巫女は、その器の涙に宿る和歌を解読しながら、街の繁栄の裏に隠された「神を喰らう仕組み」へと足を踏み入れる。失われた言葉と、忘れ去られた神々の約束を巡る、切なくも美しい再生の物語。
themes:
- 記憶の継承
- 魂と器の境界
rules:
- この世界では、言葉（言霊）が物理的な現象を引き起こす力を持つ
- 高度な術理機械は『神の欠片』を燃料として稼働する
- 常夜の都では、眠ることは死を意味し、人々は術理の光で覚醒を保たねばならない
plot_outline:
- '序盤: 永遠の黄昏に包まれた街で、巫女のハルは、路地裏で独り、意味を持たない歌を口ずさむ不思議な鉄の器（迷子の人工知能）を拾う。'
- '中盤: ハルは器の記憶を取り戻そうと旅をする中で、街が人々から『眠り』を奪うことで維持されている残酷な真実を知る。器はかつて、神の声を届けるための依り代であった。'
- '終盤: 街の動力源である『大いなる神機』が暴走し、すべてを飲み込もうとする。ハルは器に、失われた最後の言霊を授ける決意をする。'
- '結末: 器は自らを燃やして真の言霊を放ち、街に穏やかな夜（眠り）をもたらす。ハルは静かな月明かりの下、器の残した一首の和歌を胸に、新たな朝を待つ。'
style_notes: 和語を多用し、季節の移ろいや空気の湿り気、光の加減を繊細に描写する。物語の節目には、登場人物の心情を投影した和歌や俳句を挿入すること。叙情的な美しさと、神聖な畏怖が共存する語り口を徹底する。
