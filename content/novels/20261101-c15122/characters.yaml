- name: 蓮見 朔
  role: 主人公
  age: 17
  gender: 男性
  appearance: 痩身で猫背。サイズの大きな制服を纏い、常に目の下に隈がある。どこか遠くを見ているような虚ろな瞳。
  personality: 内向的で厭世的。周囲の喧騒に耐えられず、精神的な逃避行を望んでいる。一人称は「僕」。
  speech_style: 口数が少なく、語尾を濁らせることが多い。独白に近い話し方。
  background: 超高層住宅の狭小ユニットで家族と形式的な関係のみを保ち、学業のプレッシャーと都市の閉塞感に押し潰されそうになっている学生。
  motivation: 噂に聞く「オアシス」へ行き、この息苦しい世界から完全に消えてしまいたい。
  relationships:
  - name: 玖珂 澪
    relation: 不審者としてマークされるが、やがて共鳴し合う関係
  - name: 桐生 宗久
    relation: 都市の設計者として、自身の絶望の根源を体現する人物として対峙する
  arc: 単なる現実逃避から、鏡に映った醜い自分をも受け入れ、泥濘のような現実を歩む覚悟を決める。
- name: 玖珂 澪
  role: 主人公
  age: 32
  gender: 女性
  appearance: ショートカットの黒髪に鋭い眼差し。機能性を重視した古びたトレンチコートを着用している。
  personality: 合理的で冷徹に見えるが、内側には強い正義感と孤独を抱えている。一人称は「私」。
  speech_style: 断定的で簡潔。感情を排した事務的な口調だが、時折皮肉が混じる。
  background: 都市治安維持局の刑事。オアシスに伴う「失踪事件」を追う中で、都市のシステムに組み込まれた不可解なバグに気づき始める。
  motivation: オアシスの正体を突き止め、物理的な特異点として封鎖、あるいは制御すること。
  relationships:
  - name: 蓮見 朔
    relation: 保護対象でありながら、自分の失った純粋さを投影する相手
  - name: 桐生 宗久
    relation: 都市の矛盾を追及する対象として、情報を引き出そうとする
  arc: 論理では割り切れない「心の空白」を認め、正解のない問いと共に生きることを受け入れる。
- name: 桐生 宗久
  role: 主人公
  age: 74
  gender: 男性
  appearance: 白髪で細身。仕立ての良いが時代遅れの三つ揃えのスーツを着こなしている。穏やかな微笑を絶やさない。
  personality: 達観しており、静謐。自らの過去に深い後悔を抱えている。一人称は「私」。
  speech_style: 丁寧で比喩表現を多用する。相手に問いかけるような、ゆったりとした話し方。
  background: 「凪ノ都」の都市設計に深く関わった元主席建築家。効率と秩序を優先し、自然を排除した都市構造を構築した張本人。
  motivation: 自らが作り出した「完璧な檻」に生じた綻び（オアシス）を見届け、贖罪を果たしたい。
  relationships:
  - name: 蓮見 朔
    relation: かつての自分と同じ絶望を抱える若者として、密かに導こうとする
  - name: 玖珂 澪
    relation: 鋭い追及を心地よく感じている、知的なゲームの相手
  arc: 自らの罪を認め、完璧な設計図よりも、不完全な断片（人間性）にこそ価値があることを確信する。
- name: 鏡花
  role: 狂言回し/象徴
  age: 不詳（外見は15歳前後）
  gender: 中性
  appearance: 透き通るような白い肌に、色彩を持たない瞳。服装は白く、背景の緑に溶け込むような不思議な衣装。
  personality: 無垢でありながら残酷。他者の欲望や記憶を反射して映し出す鏡のような存在。一人称は「私」。
  speech_style: 夢見心地で、断片的な言葉を繋ぎ合わせる。問いかけに答えず、別の問いで返す。
  background: 都市の集合無意識が形を成した存在。オアシスの中心にのみ現れ、訪れる者を誘惑し、真実の自己を突きつける。
  motivation: 都市の人々が「楽園」という幻想に飲み込まれ、個としての形を失うこと。
  relationships:
  - name: 蓮見 朔
    relation: 最も容易に誘い込める、純粋な絶望の器
  - name: 玖珂 澪
    relation: 論理という鎧を剥ぎ取りたい、興味深い観察対象
  arc: 三人が現実を選択することで、その役割を終え、静かに都市のノイズへと還元される。
