title: 模造の楽園と、断片の鏡
genre: 群像劇
tone: 静謐かつ都会的な虚無感
pov: 三人称
tense: 過去形
setting: 近未来、極度に高層化が進んだ過密都市「凪ノ都」
premise: 摩天楼の隙間、アスファルトの裂け目に突如として現れる、瑞々しい緑に満ちた「砂漠のオアシス」の噂。それは幻覚か、あるいは物理的な特異点か。逃避を求める学生、違和感を追う刑事、そして都市の設計に関わった老人。異なる地点で「鏡」のような現象に触れた三人の運命が、都市の空白地帯へと収束していく。
themes:
- 現実と虚構の境界
- 自己の再発見と喪失
rules:
- オアシスは、強い喪失感を抱く者にのみ視覚的に認識される
- 鏡に映る像は、本人が最も恐れている、あるいは最も渇望している姿に変容する
plot_outline:
- '序盤: 都市の喧騒の中で、それぞれが「オアシス」の断片を目撃し、日常が僅かに歪み始める様子を描く。'
- '中盤: 視点が切り替わるたび、オアシスに引き寄せられる動機が異なる三人の葛藤と、鏡を通じて直面する「真実の自己」を描写する。'
- '終盤: 三人が偶然にも、都市の地図から消された「空白地帯」で邂逅し、オアシスの正体が都市の集合無意識の現れであることを知る。'
- '結末: オアシスという楽園を選択するか、歪んだ現実を生きるか。彼らは鏡の破片のような決断を下し、再び都市の雑踏へと消えていく。'
style_notes: 視点人物が替わるごとに、文体の温度とリズムを明確に変えること。刑事の章は硬質で乾いた短文、学生の章は色彩豊かで流動的な比喩を用いた描写、設計士の章は幾何学的で論理的な、無機質な叙述を用いることで、読者に異なる世界観を提示する。
