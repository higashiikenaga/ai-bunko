- name: エレナ・ヴァランティーヌ
  role: 主人公
  age: 19
  gender: 女性
  appearance: 透き通るような白い肌に、夜空を映したような深い紺色の瞳。もともとは豪華だったが、今は手入れの行き届いた質素なドレスを纏っている。
  personality: 知的好奇心が強く、芯が強い。社交界の作法には疎いが、天文学のことになると情熱的になる。一人称は「私」。
  speech_style: 丁寧で理知的だが、感情が高ぶると早口になる傾向がある。
  background: かつて天文学を推奨した名門伯爵家の令嬢。家門の没落後、独学で星図の解読技術を磨き、その才を認められて王宮に召喚された。
  motivation: 失われた星図を解読し、没落した実家の名誉を回復させるとともに、星が示す真実を明らかにすること。
  relationships:
  - name: ジュリアン・エストレリア
    relation: 運命的に惹かれ合うパートナー
  - name: アラリック・エストレリア
    relation: 利用され、追い詰められる敵対関係
  arc: 運命に翻弄されるだけの令嬢から、自らの知識と意志で王国と愛する人を守る強い女性へと成長する。
- name: ジュリアン・エストレリア
  role: 相棒/ヒーロー
  age: 24
  gender: 男性
  appearance: 鋭い眼差しを持つ瑠璃色の瞳と、艶やかな黒髪。完璧に仕立てられた軍服や礼装を身に纏い、常に隙のない佇まい。
  personality: 冷徹で皮肉屋に見えるが、内面には深い孤独と強い正義感を秘めている。一人称は「私」。
  speech_style: 静かで淡々としており、相手の核心を突く鋭い言い回しが多い。
  background: エストレリア王国の第二王子。有能すぎるがゆえに兄である第一王子から疎まれ、宮廷内で孤立し、影から王国を支えてきた。
  motivation: 王国の腐敗を正し、真に正当な統治を実現すること。そして、自分をありのままに見てくれる居場所を見つけること。
  relationships:
  - name: エレナ・ヴァランティーヌ
    relation: 知的な刺激を受け、次第に心を開く相手
  - name: アラリック・エストレリア
    relation: 憎しみと複雑な愛憎が入り混じる実兄
  arc: 孤独に耐えるための「仮面」を捨て、エレナへの愛と信頼を通じて、自身の野心を「独占」から「献身」へと変える。
- name: アラリック・エストレリア
  role: 敵役
  age: 28
  gender: 男性
  appearance: 黄金色の髪に、陽気さを装った軽やかな微笑。過剰なまでに豪華な宝石を身に付け、華やかさを強調している。
  personality: 傲慢で支配欲が強く、目的のためには手段を選ばない。外面は極めて親切だが、内面は冷酷な権力主義者。一人称は「私」。
  speech_style: 朗らかで芝居がかった口調。相手を褒め称えながら、精神的に追い詰める話し方。
  background: 王国の第一王子であり、次期国王としての地位を確実にするため、正統性を脅かすあらゆる証拠（星図など）を抹消しようとしている。
  motivation: 絶対的な権力を手に入れ、自らが望むままに王国を支配すること。
  relationships:
  - name: ジュリアン・エストレリア
    relation: 排除すべき眼中にもない弟
  - name: エレナ・ヴァランティーヌ
    relation: 星図を解読させるための便利な道具
  arc: 完璧な計画に自信を持っていたが、星の導きと二人の絆によって、積み上げた嘘が崩壊し、破滅へと向かう。
- name: ソフィア・ルミエール
  role: 脇役/協力者
  age: 20
  gender: 女性
  appearance: ふっくらとした頬に、好奇心旺盛に輝く茶色の瞳。動きやすさを重視した司書のような服装をしている。
  personality: 明るくお喋りで、誰にでも懐くムードメーカー。情報収集能力に長けており、宮廷の噂話に精通している。一人称は「私」。
  speech_style: 親しみやすく、感嘆符が多く混じる快活な話し方。
  background: 王立図書館の若き司書。本と知識を愛しており、エレナの天文学的な才に心から感銘を受けて協力することを決める。
  motivation: 歴史の闇に埋もれた真実を解き明かす手助けをすることと、エレナに最高の幸せが訪れること。
  relationships:
  - name: エレナ・ヴァランティーヌ
    relation: 親友であり、精神的な支え
  - name: ジュリアン・エストレリア
    relation: 恐れつつも、密かに応援している関係
  arc: 単なる傍観者だったが、エレナと共に危険に飛び込むことで、自分自身の勇気と誇りを見出す。
