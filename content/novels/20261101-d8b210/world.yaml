title: 瑠璃色の星図と、月下舞踏会の密約
genre: 歴史・時代小説
tone: 優雅で絢爛、かつ情緒的なロマンティシズム
pov: 三人称
tense: 過去形
setting: 18世紀風の架空の王国、エストレリア。華やかな宮廷文化と、星の運行を神聖視する天文学が重んじられる国。
premise: 没落した伯爵家の令嬢であり、星の動きを読み解く天文学の才を持つエレナは、王国の正統性を証明する「失われた星図」の解読を命じられる。祭りの夜、煌びやかな舞踏会が催される中、彼女は冷徹な第二王子ジュリアンと運命の邂逅を果たす。絹のドレスと宝石の輝きに彩られた社交界の裏側では、王位を狙う者たちの陰謀が静かに渦巻いていた。星が導く真実と、仮面の下に隠された愛が、運命の夜に交錯する。
themes:
- 宿命と自由意志
- 偽りの美しさと真実の愛
rules:
- 星図の解読は王室直属の占星術師のみに許される特権である
- 祭りの夜の舞踏会では、全ての貴族は真実を隠すための仮面を着用しなければならない
- 天文学的現象は、王国の吉凶を占う神聖な予兆とされる
plot_outline:
- '序盤: 星図の解読という任務を帯び、エレナが王宮へと召喚される。そこで仮面を被った第二王子ジュリアンと出会い、彼が抱える孤独と野心を垣間見る。'
- '中盤: 祭りの夜に向けた準備が進む中、エレナは星図に刻まれた「王位継承を覆す暗号」を発見する。同時に、ジュリアンとの間に募る情熱と、政敵による執拗な妨害が彼女を追い詰めていく。'
- '終盤: 祭りの夜、月光が降り注ぐ大舞踏会。豪華絢爛な衣装を纏った貴族たちが集う中、星図を巡る暗殺計画が実行される。エレナは星の導きを頼りに、暗闇の中でジュリアンを守り抜く。'
- '結末: 陰謀は暴かれ、エレナとジュリアンは共に星の輝きの下で新たな誓いを立てる。星図が示すのは、滅びではなく、再生の夜明けであった。'
style_notes: 絹の擦れる音、香水の残り香、宝石の煌めき、そして揺らめく蝋燭の火を、装飾的な語彙で緻密に描写すること。登場人物の心理は、夜空の星々の運行や舞踏会の旋律に重ね合わせ、優雅かつ劇的に表現する。
