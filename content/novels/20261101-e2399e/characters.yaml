- name: 葛城 蓮
  role: 主人公
  age: 32
  gender: 男性
  appearance: 痩身で青白い肌。常に空を見上げる癖があり、瞳にはどこか虚ろな光がある。身なりは清潔だが、どこか生活感に欠ける。
  personality: 孤独で執着心が強く、内向的。父の言葉を絶対的な真理として信じ込んでいる。一人称は「僕」。
  speech_style: 静かで、独り言のように淡々と話す。感情の起伏が乏しい。
  background: 亡き父が遺した奇妙な遺言に従い、断崖の古い洋館で一人、空を見上げ続けて生活している。
  motivation: 空飛ぶ船を見つけ、父との約束を果たして救済を受けること。
  relationships:
  - name: 葛城 宗一郎
    relation: 実の父
  arc: 救済を待ち望む純粋な信者から、記憶の断片によって狂気に陥り、最終的に自身の罪と直面する絶望者へ。
- name: 葛城 宗一郎
  role: 鍵を握る人物
  age: 65
  gender: 男性
  appearance: 厳格そうな風貌。霧の中に現れる幻影として、あるいは過去の回想の中で、威圧的な姿で描かれる。
  personality: 狂信的で支配的。息子を自分の望む形に縛り付けようとする執念を持つ。
  speech_style: 重々しく、命令口調。聞き手の意識を支配するような響きを持つ。
  background: 奇妙な遺言を残して世を去った、洋館の主。空飛ぶ船の真実を知る唯一の人物。
  motivation: 死後もなお、息子を「船」という概念に縛り付け、自らの思想を継承させること。
  relationships:
  - name: 葛城 蓮
    relation: 息子
  arc: 崇拝すべき聖なる父から、息子を地獄へ引きずり込む呪縛の象徴へと変貌する。
- name: 霧子
  role: 敵役（狂気の象徴）
  age: 不明
  gender: 女性
  appearance: 濡れた黒髪、霧の中から現れる、どこか不自然に美しい姿。瞳は底知れない深淵を思わせる。
  personality: 挑発的で冷酷、無慈悲。蓮の精神的な隙間に入り込む。
  speech_style: 耳元で囁くような、湿り気を帯びた不気味な話し方。一人称は「私」。
  background: 蓮の抑圧された罪悪感や、崩壊していく記憶が具現化した存在、あるいは船がもたらす深淵の化身。
  motivation: 蓮の隠された記憶を抉り出し、彼が現実（あるいは水底）の真実を受け入れるよう促すこと。
  relationships:
  - name: 葛城 蓮
    relation: 精神的な侵食者
  arc: 蓮の唯一の理解者を装いながら、最終的には彼を逃げ場のない絶望へと突き落とす。
