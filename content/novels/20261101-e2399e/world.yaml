title: 透き通る空の、底の方で
genre: ホラー
tone: 幻想的で閉塞感のある心理的恐怖
pov: 一人称
tense: 過去形
setting: 霧の深い、切り立った崖の上に建つ古い洋館
premise: 亡き父が遺した「空飛ぶ船が来る。それを見上げ続けよ」という奇妙な遺言を唯一の指針として、男は孤高の生活を送っていた。雲の隙間に見える巨大な船影を、男は死後の世界への救済だと信じて疑わない。しかし、船が近づくにつれ、屋敷の景色は歪み、男の記憶は悍ましい断片へと分解されていく。救済の船は、果たして空から降ってくるのか、それとも底から這い上がってくるのか。
themes:
- 信仰と狂気
- 記憶の改ざん
rules:
- 「遺言」を信じ続ける者に対してのみ、空飛ぶ船の姿が視認される
- 船が近づくほど、観測者の現実認識と物理法則の乖離が激しくなる
plot_outline:
- '序盤: 父の遺言に従い、高台の屋敷で空を見上げ続ける男。雲間に見える『空飛ぶ船』を、天国への渡し舟として崇拝する静かな日常。冒頭では『空はどこまでも透き通っていて、指先で触れられそうだった』と語られる。'
- '中盤: 船が急速に接近を開始。空の色が変色し、屋敷の壁から死者の囁きが聞こえ始める。男は、船に乗るための『清め』として、自らの記憶や周囲の物品を捨て、現実との接点を失っていく。'
- '終盤: 船が屋敷の真上まで迫り、巨大な影が全てを覆い尽くす。その時、男は自分がかつて父を、そして『船』の真実を、自らの手で葬ったという凄惨な記憶を取り戻す。'
- '結末: 船の正体は救済ではなく、深淵の裂け目であった。男が見ていた『透き通る空』とは、溺れゆく意識の中で水底から見上げた、水面の光に過ぎなかったことが明かされ、全てが暗転する。'
style_notes: 語り手の主観による感覚的な描写を多用し、読者が「何が現実で何が幻覚か」を判断できないように記述する。美しい情景描写の中に、生理的な嫌悪感や違和感を忍ばせる。一人称の語りを使い、認識の歪みをにじませることで、結末の反転を最大化させる。
