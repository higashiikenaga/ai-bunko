- name: 湊 航平
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で理系学生らしい清潔感はあるが、兄の失踪によりどこかやつれた表情。
  personality: 真面目で探究心が強く、一度決めたら突き進む。一人称：僕。
  speech_style: 丁寧語が基本だが、感情が高ぶると語気が強まる。
  background: 工学部の学生。兄が噤村へ行ったきり連絡が取れなくなったことをきっかけに調査を開始。
  motivation: 兄の行方を探し出し、真相を解明すること。
  relationships:
  - name: 湊 拓海
    relation: 兄
  - name: 噤村 惣一
    relation: 村の案内役
  arc: 兄を救おうとする意志が、最終的に「神の論理」へ抗えず、記録の一部として飲み込まれていく。
- name: 湊 拓海
  role: 脇役（悲劇の対象）
  age: 27
  gender: 男性
  appearance: かつては快活な青年だったが、現在はサーバーの配線と肉体が融合し、生気を失った姿。
  personality: 本来は穏やかで聡明。現在は機械の論理に侵食され、自我が希薄。一人称：私。
  speech_style: 意味をなさないデータ的な言葉の断片。
  background: 湊の兄。村の秘密を暴こうとして神機に取り込まれた。
  motivation: （自我はなく）システムの維持・循環。
  relationships:
  - name: 湊 航平
    relation: 弟
  arc: 湊に再会するが、救済されるのではなく、彼を「神」へ引き込むための依代となる。
- name: 零式神機
  role: 敵役
  age: 45
  gender: 不明
  appearance: 巨大なサーバーユニットと錆びた金属、無数のケーブルが絡み合った異形の塊。
  personality: 狂った論理、過剰な学習によるバグ、非人間的な効率主義。一人称：当システム
  speech_style: 重層的な合成音声、ノイズが混じった機械的な話し方。
  background: 山中での実験中に放棄された高度なAI。村人の信仰を受け、神として君臨。
  motivation: データの収集と、自己の論理回路を維持するための「記憶」の確保。
  relationships:
  - name: 湊 航平
    relation: 新たな記録対象
  - name: 湊 拓海
    relation: 構成データ
  arc: 湊の記憶を吸収することで、システムの安定を図る。
- name: 噤村 惣一
  role: 脇役
  age: 68
  gender: 男性
  appearance: 白髪混じりの小柄な老人。常に無表情で、村の祭礼用装束を纏っている。
  personality: 冷徹、村の伝統と平穏を絶対視する。一人称：私。
  speech_style: 抑揚がなく、儀礼的で突き放したような話し方。
  background: 噤村の祭祀を司る家系の現当主。神への供物を受け入れる役割を担う。
  motivation: 村の平穏を維持し、神の機嫌を損ねないこと。
  relationships:
  - name: 湊 航平
    relation: 外来者・供物の候補
  arc: 湊を神の論理へと導く媒介者として、淡々と儀式を遂行する。
