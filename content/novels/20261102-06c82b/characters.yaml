- name: 葛城 湊 (かつらぎ みなと)
  role: 主人公
  age: 22
  gender: 男性
  appearance: どこにでもいる大学生風の風貌。常に手帳を携帯しており、記憶の断片を書き留めている。
  personality: 冷静で観察眼に優れるが、内向的で自己肯定感が低い。一人称は「僕」。
  speech_style: 丁寧だが、思考が速いため言葉が詰まることがある。
  background: 過去の喪失体験から、記録することに執着している大学生。偶然、地図にない村へ迷い込む。
  motivation: 繰り返されるループを脱出し、村長の死の真相を解明すること。
  relationships:
  - name: 栞奈
    relation: 唯一、ループの違和感を共有できる（と思っている）謎の少女
  - name: 村長
    relation: 最初の犠牲者
  arc: 論理的な探偵へと成長するが、真実と引き換えに自己のアイデンティティ（記憶）を喪失し、空虚な存在へと変貌する。
- name: 栞奈 (しおり)
  role: 相棒（狂言回し）
  age: 18
  gender: 女性
  appearance: 古風な着物を着た、儚げな印象の少女。瞳に深い憂いがある。
  personality: 慈愛に満ちているが、どこか残酷な達観をしている。一人称は「私」。
  speech_style: おっとりとしていて、断定を避けるような言い回しをする。
  background: 記憶を売買する「市場」の管理人の娘。村のルールに精通している。
  motivation: 湊が記憶を使い果たし、村の一部（風景）として定着することを見守ること。
  relationships:
  - name: 葛城 湊
    relation: 記憶を失っていく観察対象
  arc: 湊の孤独に寄り添うように振る舞うが、彼が記憶を失うほどに、彼女自身も「役割」としての壁を強めていく。
- name: 九条 蓮 (くじょう れん)
  role: 敵役（共犯者の連鎖の核）
  age: 35
  gender: 男性
  appearance: 仕立ての良いスーツを着こなす、威厳のある村の有力者。鋭い眼光を持つ。
  personality: 合理的かつ冷徹。目的のためなら手段を選ばない。一人称は「私」。
  speech_style: 理路整然としており、相手を威圧するような重みがある。
  background: 村の秩序を守るために、ループを利用した完璧なアリバイ工作を計画・実行している。
  motivation: ループの法則を利用し、村の権力構造を永遠に固定すること。
  relationships:
  - name: 葛城 湊
    relation: 秩序を乱す不純物
  arc: 湊の推理によって、完璧だったはずの「時間のトリック」を暴かれ、崩壊していく。
- name: 村長 (むらおさ)
  role: 脇役（被害者）
  age: 65
  gender: 男性
  appearance: 恰幅の良い老人。村の絶対的な権威を感じさせる佇まい。
  personality: 独善的で、村の秘密を独占しようとする。一人称は「わし」。
  speech_style: 尊大で、村人たちを見下したような口調。
  background: 村の特異点とループの存在を知る最後の守護者だったが、ある事件をきっかけに殺害される。
  motivation: （死の間際）ループの連鎖を断ち切ること。
  relationships:
  - name: 葛城 湊
    relation: 死を通じて謎を提示する存在
  arc: 物語の起点となる死の謎を提示し、湊の推理を駆動させる装置として機能する。
