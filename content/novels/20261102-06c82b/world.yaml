title: 昨日を売る市場の迷宮
genre: 本格ミステリー
tone: 静謐で分析的、反復による微細な変化を追う叙情的な雰囲気
pov: 一人称（僕）
tense: 現在形と過去形の混在（ループの記憶を辿る形式）
setting: 地図から消えた「忘却の村」。外界から隔絶され、時間だけが円環する特異点。
premise: 地図にない村に迷い込んだ僕が目撃したのは、不可解な密室殺人と、記憶を貨幣として取引する奇妙な市場だった。死の瞬間までを繰り返すループの中で、僕は「前回の自分」が残した痕跡を辿り、犯人を追い詰める。しかし、記憶を売るたびに僕自身のアイデンティティが削られていく。果たして、真実を掴んだ時に僕に残っているものは何か。
themes:
- 記憶とアイデンティティ
- 運命の不可逆性
rules:
- ループは被害者が死亡した瞬間に自動的に発生する
- 村の市場で記憶を売却することで、前の周回で得た情報を『確定した事実』として固定したり、新しい能力を得たりできる
- 記憶を売りすぎると、ループの目的や自分自身の名前さえ忘れるため、物語の崩壊を招く
plot_outline:
- 序盤：村に迷い込んだ僕が、村長の密室殺人を目の当たりにする。絶望と共に意識が戻ると、そこは殺人が起きる数時間前の村だった。
- 中盤：何度も同じ一日を繰り返し、村人たちの行動パターンを分析する。記憶を売る市場で『犯人の手がかり』を買い戻すが、代償に幼少期の思い出を失っていく。
- 終盤：犯人が同一人物ではなく、ループを利用してアリバイを偽装する『共犯者の連鎖』であることを突き止める。同じ会話を何度も繰り返し、相手のわずかな矛盾を引き出す。
- 結末：真犯人を特定し、ループを止める方法を見つける。しかし、すべての謎を解いた僕の手元には、売ってしまった記憶のせいで、誰に向けた感情だったのか分からない空虚な解答だけが残る。
style_notes: 「同じ場面を三度描き、二度目で違和感を、三度目で解決の鍵を提示する」構成を徹底。一人称「僕」による、前周回の自分への独白や、既視感を強調した描写を用いることで、読者にループの蓄積を感じさせること。
