title: ゼロ地点のオーバータイム
genre: スポーツ青春
tone: 熱血、臨場感、疾走感
pov: 一人称（俺）
tense: 現在形（試合描写）と過去形（回想）の混在
setting: 地方の工業都市、寂れた公立高校とストリートコート
premise: 才能なき俺が、唯一信じられる「反復練習」だけで頂点を目指す3x3バスケの物語。廃校寸前の地下図書館を拠点に、誰にも見られず磨き上げた泥臭い技術が、コート上の絶望を塗り替える。名前のない猫だけが知っている、血の滲むような努力の正体を証明する。
themes:
- 凡人の執念
- 反復の価値
rules:
- 3x3バスケの公式ルールを準用
- 特待生と一般生徒の格差がある階級的なスポーツ環境
plot_outline:
- '序盤: 才能ある天才たちに完敗し、絶望した俺が、地下図書館で見つけた古い戦術書と、名前のない猫に導かれ、孤独な地獄の反復練習を開始する。'
- '中盤: 練習の成果を少しずつ出し始め、クセのある仲間を集めてチームを結成。地区大会で、かつての宿敵であるエリートチームに挑む。'
- '終盤: 全国大会決勝。スタミナ切れと精神的限界に追い込まれるが、地下図書館で書き溜めた「改善ノート」の内容を体現し、絶望的な点差をひっくり返す。'
- '結末: 勝利の瞬間、コートに響くのは俺たちの激しい呼吸音。才能ではなく、積み上げた時間こそが最強であると証明し、新たな夢へと走り出す。'
style_notes: 一人称「俺」で綴る。試合中は「右へ、左へ、今だ！」といった実況風の短文を畳み掛け、汗の飛沫や心拍数、シューズの摩擦音を具体的に描写する。練習シーンでは、地味な反復動作の苦しさと、それが試合で「身体が勝手に動く」快感に変わるカタルシスを重視して描く。
