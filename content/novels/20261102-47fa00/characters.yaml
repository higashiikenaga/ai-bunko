- name: 雫 陽菜
  role: 主人公
  age: 22
  gender: 女性
  appearance: 柔らかな質感の茶髪。雨の日には透明な傘を愛用しており、少し控えめだが澄んだ瞳をしている。
  personality: 共感力が高く、観察眼に優れている。日常の小さな変化に気づく繊細さを持つ。一人称は「わたし」。
  speech_style: 丁寧で穏やか。相手の言葉を一度受け止めてから話すような、落ち着いた口調。
  background: 港町の事務局に勤め始めたばかりの新人。蒸気機関が鳴り響く騒々しい街の生活に、どこか馴染めず孤独を感じている。
  motivation: 騒がしい日常の中で、自分の心が安らげる「本当の居場所」を見つけること。
  relationships:
  - name: 如月 蓮
    relation: 不思議な喫茶店の店主であり、惹かれる存在
  arc: 孤独を抱えていた状態から、雨の日のティータイムを通じて他者と心を通わせる温かさを知る。
- name: 如月 蓮
  role: 主要登場人物
  age: 28
  gender: 男性
  appearance: 色白で細身。整っているがどこか影のある顔立ち。常に清潔なエプロンと、蒸気機関用の道具を身に着けている。
  personality: 無口で寡黙。職人気質で、蒸気式のティーメーカーの手入れには並々ならぬこだわりを持つ。一人称は「僕」。
  speech_style: 簡潔で無駄がないが、決して冷たくはない。言葉の端々に静かな優しさが滲む。
  background: 雨の日だけ路地の奥に店を開く喫茶店の店主。古い蒸気式ティーメーカーに、亡き大切な人との約束を込めている。
  motivation: 雨の日という限られた時間の中で、過去の記憶を蒸気の香りと共に守り続けること。
  relationships:
  - name: 雫 陽菜
    relation: 雨の日に通い、凍りついた心を溶かしていく客
  arc: 過去の悲しみを「守るべきもの」から「前へ進むための糧」へと昇華させ、新しい関係を受け入れる。
- name: 佐伯 五郎
  role: 脇役
  age: 68
  gender: 男性
  appearance: 深い皺が刻まれた顔と、油の匂いが染み付いた作業着。使い込まれた工具袋を常に持っている。
  personality: 豪快で世話焼き。町の歴史を知り尽くした、経験豊かな職人。一人称は「わし」。
  speech_style: 威勢の良い、べらんめえ調が混じる老人らしい話し方。
  background: 町の蒸気機関修理工。蓮の家族とも旧知の仲であり、彼がなぜ雨の日にだけ店を開くのかという事情を知る数少ない人物。
  motivation: 蓮が過去に縛られすぎず、一人の人間として街で生きていけるよう、遠くから見守ること。
  relationships:
  - name: 如月 蓮
    relation: かつての縁がある、親代わりのような存在
  - name: 雫 陽菜
    relation: 蓮の変化を察し、導こうとする理解者
  arc: 蓮の過去と陽菜の現在を繋ぐ、物語の橋渡しとしての役割を果たす。
