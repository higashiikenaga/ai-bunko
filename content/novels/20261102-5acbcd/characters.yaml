- name: 凪 湊 (なぎ みなと)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し伸びた黒髪に、どこか遠くを見つめるような物憂げな瞳。海沿いの街に馴染む、少し使い古されたパーカー姿。
  personality: 冷静沈着で内向的。かつての栄光と挫折から、勝負事に対して臆病になっている。一人称は「僕」。
  speech_style: 低く落ち着いたトーン。必要最低限のことしか話さないが、思考に没入すると独白のような呟きが増える。
  background: かつて『グリッド・タクティクス』の神童と呼ばれたが、計算外の事象によって敗北し、競技から離れて海辺の街で隠遁生活を送っていた。
  motivation: 勝負に対する恐怖（呪縛）を克服し、勝利の先にある「納得できる一局」を見つけること。
  relationships:
  - name: 結城 陽葵
    relation: 部活動の仲間であり、自分を再び戦場へ引き戻した人物
  - name: 氷室 カイ
    relation: かつてのライバルであり、現在の価値観の対極にいる宿敵
  arc: 逃避的な態度から、仲間と共に困難に立ち向かい、最後には結果以上にプロセスを愛する真の競技者へと覚醒する。
- name: 結城 陽葵 (ゆうき ひまり)
  role: 相棒
  age: 17
  gender: 女性
  appearance: ショートカットの髪に、活動的なスポーツウェア。瞳には常に強い意志が宿っている。
  personality: 直感的で情熱的。不器用だが、人の心の機微に敏感な優しさを持つ。一人称は「私」。
  speech_style: 明るくハキハキとした話し方。凪を鼓舞したり、時に強引に引っ張ったりする。
  background: 廃部寸前のタクティクス部の唯一の部員だった。技術的には未熟だが、盤面から「波」を感じ取る独特のセンスを持つ。
  motivation: タクティクス部を全国大会へ連れて行き、部を存続させること。
  relationships:
  - name: 凪 湊
    relation: 才能を信じて再び部へ誘った、頼れるパートナー
  arc: 単なる「部活動への熱意」だけでなく、凪の深い戦術を理解し、共に戦うための論理的思考を身につけていく。
- name: 氷室 カイ (ひむろ かい)
  role: 敵役
  age: 17
  gender: 男性
  appearance: 隙のない整った容姿。最新鋭のデバイスを常に携行し、常に清潔感のある制服を着用している。
  personality: 極めて合理的で効率至上主義。感情を「計算を乱すノイズ」として切り捨てる冷徹さを持つ。一人称は「俺」。
  speech_style: 慇懃無礼で、論理の飛躍を許さない。相手の弱点を的確に突くような鋭い口調。
  background: 最新のAI解析に基づいた「最適解」のみを追求するエリートプレイヤー。伝統的な直感や読みを「旧時代の遺物」と蔑んでいる。
  motivation: グリッド・タクティクスの完全な合理化と、自身の計算が絶対であることを証明すること。
  relationships:
  - name: 凪 湊
    relation: かつて自分が超えるべき壁として認めていたが、現在は否定すべき対象
  arc: 凪との対局を通じ、計算では導き出せない「人間の意志による一手」の存在を知り、自身の価値観が揺らぐ。
- name: 潮崎 誠 (しおざき まこと)
  role: 脇役
  age: 35
  gender: 男性
  appearance: 日焼けした肌と、穏やかな笑みを浮かべた中年男性。使い込まれたタクティクス盤を常に持ち歩いている。
  personality: 寛容で達観している。部員たちの成長を静かに見守る、精神的な支柱。一人称は「私」。
  speech_style: ゆったりとした、包み込むような話し方。アドバイスは常に示唆に富む。
  background: かつてこの街で名を馳せた元プレイヤー。現在は地元の商店主を営みながら、タクティクス部の顧問を務める。
  motivation: 次世代のプレイヤーたちが、勝敗を超えた競技の真髄に触れることを見届けること。
  relationships:
  - name: 凪 湊
    relation: かつての才能を惜しみ、彼が再び歩き出すのを待っていた師のような存在
  arc: 物語の進行において、凪が迷った際の指針となる「静的読み」の概念を伝える役割を担う。
