title: 潮騒のロジック
genre: スポーツ青春
tone: 知的緊張感と静謐な熱量
pov: 三人称近接
tense: 過去形
setting: 近未来の海辺の街。戦略思考競技『グリッド・タクティクス』が普及した世界
premise: かつて天才と呼ばれながら絶望し、勝負の世界から逃げ出した少年・凪。廃部寸前のタクティクス部に引き戻された彼は、不器用な仲間と共に全国大会を目指す。一手の選択が運命を分かつ極限の精神戦を通じ、彼は『勝利』の先にある真理を追い求める。
themes:
- 完璧への渇望
- 孤独と共鳴
rules:
- 競技は100×100の仮想平面上で行われる領域支配ゲームである
- ユニット配置後の移動コストが極めて高く、序盤の『読み』が勝敗を決定づける
- 精神的負荷による『思考停止（スタック）』が発生し、その間は操作不能となる
plot_outline:
- 序盤：凪がタクティクス部に入部し、現代の効率重視の戦術に対し、古風ながらも深淵な『静的読み』で周囲を圧倒する。
- 中盤：地方予選での激闘。古い灯台を拠点に、自然の造形から座標感覚を養う特訓を行い、過去の敗北というトラウマを克服していく。
- 終盤：全国大会決勝。祭りの夜の喧騒の中、宿敵との対局が始まる。一手の配置が戦況を劇的に変える極限の読み合いが展開される。
- 結末：結果を超え、相手と最高の『一局』を共有したことで、凪は勝負の呪縛から解放され、真の競技者として覚醒する。
style_notes: 一手の配置がもたらす戦況の変動を数理的・幾何学的に詳細に解説する。三人称近接視点を維持し、対局中の思考の深さを内省的な独白と鋭い観察眼で描写。静寂の中にある激しい精神的衝突を、空気の密度や視界の変化として表現する。
