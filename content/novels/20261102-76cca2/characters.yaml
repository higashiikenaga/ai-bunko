- name: 八五郎
  role: 主人公
  age: 24
  gender: 男性
  appearance: 短髪で日焼けした肌、快活な笑顔。常に動き回っている。江戸の若衆らしい軽快な身のこなし。
  personality: お節介で情に厚い、考えるより先に体が動くタイプ。一人称は「俺」。
  speech_style: 威勢が良く、江戸っ子らしいべらんめえ調が混じる。
  background: 長屋の若衆。特に決まった職はないが、街の事情や噂話には誰よりも明るい。
  motivation: 街の人々を笑わせたい、日常の中に面白い発見をしたい。
  relationships:
  - name: お静
    relation: 茶屋の主への強い興味
  - name: 勘助
    relation: お節介な訪問対象
  arc: 賑やかな日常を守るために、一歩踏み込んで他人の孤独に触れ、寄り添う勇気を持つ。
- name: 勘助
  role: 主要な脇役
  age: 68
  gender: 男性
  appearance: 白髪混じりの髭、深く刻まれた皺。使い古された質素な着物を着ている。
  personality: 偏屈で口が悪いが、根は非常に寂しがり屋。一人称は「わし」。
  speech_style: ぶっきらぼうで、相手を突き放すような短い言い方。
  background: かつては海に関わる重要な役職についていたが、家族を亡くした喪失感から、街外れの灯台に隠居した。
  motivation: 誰にも邪魔されず、過去の記憶と共に静かに朽ち果てたい。
  relationships:
  - name: 八五郎
    relation: 困った闖入者
  arc: 長屋の人々の強引なまでの温かさに触れ、過去を認め、再び社会へと心を開いていく。
- name: お静
  role: 脇役
  age: 35
  gender: 女性
  appearance: 落ち着いた藍色の着物。常に穏やかな微笑みを浮かべ、どこか浮世離れした美しさがある。
  personality: 神秘的で包容力がある。聞き上手で、訪れる者の心を解きほぐす。一人称は「私」。
  speech_style: 丁寧で、静かな波のような柔らかな口調。
  background: 雨の日だけひっそりと茶屋を営む女性。なぜ雨の日にだけ店を出すのかは謎に包まれている。
  motivation: 雨の日に訪れる人々の心を、お茶を通じて癒やすこと。
  relationships:
  - name: 八五郎
    relation: 茶屋の常連
  arc: 物語の観測者として、人々の変化を静かに見守り続ける。
- name: お初
  role: 脇役
  age: 21
  gender: 女性
  appearance: 小柄で身軽。手際よく家事をする、清潔感のある身なり。まとめ髪。
  personality: 現実主義でしっかり者。八五郎の暴走をたしなめる常識人。一人称は「私」。
  speech_style: はきはきとしていて、少しお姉さんぶった落ち着いた口調。
  background: 長屋にある商家で働く娘。長屋の住人たちの面倒をよく見ている。
  motivation: 長屋の仲間たちが、喧嘩もせず穏やかに暮らせるようにすること。
  relationships:
  - name: 八五郎
    relation: 幼馴染であり、腐れ縁
  arc: 八五郎と共に勘助の心の壁を崩す作戦を練る中で、人情の深さを改めて実感する。
