- name: カイト・レン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 黒いボロボロのレザージャケット、右目に鈍く光るサイバネティック義眼、常に煙草を燻らせている。
  personality: 冷笑的で現実主義。生存本能が強く、他人に深入りしない。一人称は「オレ」。
  speech_style: ぶっきらぼうで、短文で吐き捨てるような話し方。
  background: 下層街のゴミ溜めでデータ回収（スカベンジャー）として細々と生きる孤児。都市のシステムには無関心だった。
  motivation: 当初はただ生き延びることだったが、猫とチップを手にしたことで、抑圧された街から逃れる「自由」を求めるようになる。
  relationships:
  - name: ミア・ルナ
    relation: 信頼する相棒
  - name: エグゼクティブ・ヴァイス
    relation: 命を狙う宿敵
  arc: 保身のみを優先していた男が、自らの記憶という「過去」を犠牲にしてでも、未知の空という「未来」を掴み取る決意をする。
- name: ミア・ルナ
  role: 相棒
  age: 19
  gender: 女性
  appearance: ネオンブルーのショートヘア、大型の通信用ヘッドセット、ホログラムディスプレイを多用する軽量型サイバーウェア。
  personality: 好奇心旺盛で明るいが、計算高く、情報の価値を誰よりも理解している。一人称は「私」。
  speech_style: 早口で専門用語を多用し、テンションが高い。
  background: かつて上層の企業で天才プログラマーとして期待されていたが、ある実験の失敗により追放され、下層のハッカー集団に身を寄せている。
  motivation: 企業の管理ネットワークをハッキングし、情報の独占を終わらせること。
  relationships:
  - name: カイト・レン
    relation: 行動を共にするパートナー
  arc: 孤独な情報の管理者から、カイトと共に運命を切り拓く、感情を持った一人の人間へと成長する。
- name: エグゼクティブ・ヴァイス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 一切の汚れがない純白のスーツ、感情の読み取れない銀色のサイバネティック義体、完璧な左右対称の容貌。
  personality: 徹底した秩序主義者。効率と論理のみを信じ、イレギュラーを「ノイズ」として排除する。一人称は「私」。
  speech_style: 丁寧だが、相手を人間ではなく処理対象として扱うような冷淡な敬語。
  background: 巨大企業『アエテルナ・コア』の治安維持部門責任者。都市の管理システムの守護者。
  motivation: 禁忌データの回収と、都市の秩序を乱すすべての要素の徹底的な排除。
  relationships:
  - name: カイト・レン
    relation: 排除すべき不純物
  arc: 完璧な管理こそが正義だと信じて疑わないが、カイトの「非論理的な決断」によって、自身が守る秩序の脆さを突きつけられる。
