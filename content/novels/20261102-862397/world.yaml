title: クローム・ハザード：雨の街のゴースト・シップ
genre: サイバーパンク
tone: ハードボイルドで高速、退廃的なネオンの色彩
pov: 一人称（オレ）
tense: 現在形・過去形混在（独白形式）
setting: 超高層垂直都市『アエテルナ』。上層の純白の企業街と、下層の酸性雨が降りしきるスラム街。
premise: 路地裏のゴミ溜めで、オレは『名前のない猫』を拾った。その首に埋め込まれていたのは、都市を支配する巨大企業の禁忌データ。それは、伝説の『空飛ぶ船』を起動させ、管理社会の空を切り裂くための鍵だった。
themes:
- 個の自由
- 記憶の真正性
rules:
- 全市民は脳内に『ID-チップ』を埋め込まれ、行動を常時監視されている
- ハッキングには物理的な『ダイブ・ジャック』が必要であり、精神汚染のリスクを伴う
- 上層への移動は厳格に管理され、許可なき上昇者は即座に排除される
plot_outline:
- '序盤: 路地裏のデータ回収屋であるオレが、チップを埋め込まれた名もなき猫を拾い、企業の追手（クリーナー）に狙われる。'
- '中盤: 裏社会のハッカーたちと協力し、チップの正体が『空飛ぶ船（アーク）』の起動座標であることを突き止める。都市のインフラを次々とジャックし、上層へ登る道を切り開く。'
- '終盤: 企業の心臓部である中央塔に潜入。船を起動させれば都市の管理ネットワークを崩壊させられるが、同時に自分の記憶も消去されるという代償を突きつけられる。'
- '結末: 猫を抱いたままアークを起動。燃え上がるネオンの街を背に、見たこともない本物の青い空へと飛び立つ。'
style_notes: 短文を畳み掛けるスピード感。『ジャックしろ』『ノイズが走る』など、サイバーパンク特有の造語とスラングを多用。雨の匂い、ネオンの点滅、ハードウェアの熱量を強調したハードボイルドな独白。
