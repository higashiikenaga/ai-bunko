- name: カイ・シロガネ
  role: 主人公
  age: 27
  gender: 男性
  appearance: 銀色の街に馴染まない、使い込まれた藍色の駅員制服を着用。少し長めの黒髪で、どこか物憂げな瞳をしている。
  personality: 穏やかで聞き上手。感情の起伏が少なく見えるが、内面は非常に思慮深く優しい。一人称は「僕」。
  speech_style: 丁寧で落ち着いた口調。相手の言葉を一度受け止めてから、ゆっくりと返す。
  background: かつては銀色の街で感情管理システムの設計に携わっていたが、ある出来事をきっかけに、システムの「外側」である忘却線の駅員となった。
  motivation: 乗客たちが手放す記憶を丁寧に扱い、彼らが明日へ進めるよう見送ること。
  relationships:
  - name: エリス
    relation: 良き理解者であり、駅の運営を支える助手
  arc: 完璧な管理社会の矛盾に疑問を抱き、自分自身が封印してきた「忘れたい記憶」と向き合い、喪失を肯定できるようになる。
- name: エリス・メイ
  role: 相棒
  age: 24
  gender: 女性
  appearance: ショートカットの明るい髪。機能性を重視したオーバーオール姿で、常に小さなレンチやデバイスを持ち歩いている。
  personality: 快活で現実主義。デジタル技術に精通しており、旧式の蒸気機関のメンテナンスを担当している。一人称は「私」。
  speech_style: 明るくハキハキとした話し方。少しおせっかいなところがある。
  background: 街の最新技術に飽き足らず、あえて「不完全な機械」の美しさに惹かれて忘却線に流れ着いた技術者。
  motivation: 蒸気機関車を最高の状態に保ち、駅の日常を守ること。
  relationships:
  - name: カイ・シロガネ
    relation: 職場の同僚であり、精神的な支え
  arc: カイの抱える謎や変化を最も近くで見守り、彼が過去を受け入れるための「技術的・精神的な土台」となる。
- name: ルカ・ヴァレンタイン
  role: 脇役（物語の鍵を握る乗客）
  age: 72
  gender: 男性
  appearance: 高級感のある、しかし時代遅れなコートを纏った老人。常に最新の記憶デバイスを首から下げている。
  personality: 気品があるが、どこか虚無感を漂わせている。効率的な幸福を追求してきた街の住人。一人称は「私」。
  speech_style: 教養を感じさせる、丁寧で少し距離のある言葉遣い。
  background: かつて銀色の街の重要人物であり、一切の悲しみを取り除いた「完璧な幸福」を享受してきた成功者。
  motivation: どうしても消去できない、ある「美しい痛み」を伴う記憶を廃棄し、完全に平穏な状態に戻ること。
  relationships:
  - name: カイ・シロガネ
    relation: 記憶の処置を依頼する依頼人
  arc: 記憶を捨てようと試みる中で、皮肉にも「忘れたくない大切なもの」の存在を再認識し、忘却の本当の意味を知る。
