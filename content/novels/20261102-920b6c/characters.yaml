- name: 一ノ瀬 和也
  role: 主人公
  age: 28
  gender: 男性
  appearance: 痩身で青白い顔。度の強い眼鏡をかけており、常にどこか疲れた表情をしている。
  personality: 内向的で分析的。他者との距離を置く傾向がある。一人称は「僕」。
  speech_style: 丁寧だが、どこか突き放したような淡々とした話し方。
  background: 古書店の店員兼、個人の記録収集家。断片的な情報を繋ぎ合わせて一つの物語を構築することに執着している。
  motivation: 知人が語った「水のないオアシス」という不可解な体験の正体を突き止め、記録すること。
  relationships:
  - name: 篠崎 零
    relation: 不可解な体験を語った知人
  - name: 水城 あかり
    relation: 怪異に巻き込まれた調査対象者
  arc: 客観的な観察者であろうとするが、次第に自らも「砂」の浸食を受け、逃れられない運命に気づく。
- name: 篠崎 零
  role: 狂言回し/導き手
  age: 32
  gender: 女性
  appearance: 虚ろな瞳と、不自然に白い肌。季節を問わずベージュの長いストールを巻いている。
  personality: 儚げで不安定。現実と記憶の境界が曖昧になっている。一人称は「私」。
  speech_style: 言葉が途切れがちで、独り言のような呟きが多い。
  background: 旅先で「失われた手紙のオアシス」に迷い込み、そこから生還した。しかし、精神の一部をあちら側に残してしまった。
  motivation: 自分の中に溜まった「他者の言葉（砂）」を誰かに預け、静寂を得ること。
  relationships:
  - name: 一ノ瀬 和也
    relation: 唯一、自分の話を真剣に聞いてくれる人間
  arc: 物語が進むにつれ、身体が徐々に砂へと変わり、最後には完全に「不在」となる。
- name: 水城 あかり
  role: 被害者
  age: 24
  gender: 女性
  appearance: 快活な印象の若者だったが、物語が進むにつれ目の下に深い隈ができ、やつれていく。
  personality: 情に厚く、責任感が強い。好奇心旺盛。一人称は「私」。
  speech_style: 当初は快活だったが、次第に追い詰められ、早口で切迫した話し方になる。
  background: ある日、死んだはずの祖母から「宛先不明」の状態で届いた手紙を受け取ったことで、怪異に接触する。
  motivation: 手紙に綴られた後悔を解消し、祖母の魂を救いたいと願う。
  relationships:
  - name: 一ノ瀬 和也
    relation: 手紙の謎について相談する相手
  arc: 純粋な善意から手紙の主を辿ろうとするが、絶望の言葉に飲み込まれ、耳元で砂の音を聞くようになる。
- name: 有馬 賢二郎
  role: 助言者/解説役
  age: 62
  gender: 男性
  appearance: 乱れた白髪に、古びたツイードのジャケット。常に煙草の匂いが染み付いている。
  personality: 皮肉屋だが知的好奇心が旺盛。諦念を抱いた現実主義者。一人称は「私」。
  speech_style: 衒学的な言い回しを好み、結論をはぐらかす傾向がある。
  background: 民俗学および言語学の元教授。世界各地の「消えた言葉」や「境界の地」に関する禁忌を研究している。
  motivation: この現象が単なる怪異か、あるいは世界の構造的な欠陥であるかを検証すること。
  relationships:
  - name: 一ノ瀬 和也
    relation: 稀に情報を共有する奇妙な協力関係
  arc: 理論で現象を制御しようと試みるが、最後には理論を超えた「不在」の恐怖に屈し、沈黙する。
