title: 凪の砂、綴られぬ不在
genre: ホラー
tone: 淡々とした、静謐で湿り気を帯びた怪談調
pov: 一人称（聞き書き）
tense: 過去形
setting: 現代の日本、および記憶の底に沈んだ境界の場所
premise: これは、ある知人から聞いた、不可解な出来事の断片を繋ぎ合わせたものだ。砂漠の真ん中で見た、水ではなく『失われた手紙』が溢れるオアシスの話。そして、死者の未送信の言葉が、現代の誰かの元へ届いてしまう怪異。それらは、消えてしまったはずの声が、砂となって堆積したものの残滓なのだ。
themes:
- 不在の存在感
- 言葉の腐敗
rules:
- 怪異の正体は決して明かされない
- 現象は目に見える形ではなく、音や質感として現れる
- 語り手は常に第三者的な距離を保つ
plot_outline:
- '序盤: 知人が旅先で見つけた、水のないオアシス。そこは無数の『失われた手紙』が砂のように積み重なった、奇妙な場所だったという話。'
- '中盤: 現代の街角で、宛先不明の古い封筒が次々と発見される。その手紙は、かつて誰かが伝えられなかった、絶望や後悔の言葉を綴っていた。'
- '終盤: 手紙を受け取った人々が、耳元で絶え間ない『砂が流れる音』を聞くようになる。それは言葉が形を失い、砂へと変わっていく音だった。'
- '結末: 結局、何が起きているのかは分からない。ただ、語り手の足元でも、時折、乾いた砂の感触が混じるようになったという。'
style_notes: 「これは知人から聞いた話だが」という聞き書きの形式を徹底する。短い文章を積み重ね、感情的な形容詞を極力排除した淡々とした語り口を維持すること。読者に説明を与えすぎず、結末のあとに言いようのない余白と、説明不可能な不気味さを残すこと。
