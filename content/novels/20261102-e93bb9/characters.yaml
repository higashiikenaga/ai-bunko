- name: 湊 陽向 (みなと ひなた)
  role: 主人公
  age: 28
  gender: 男性
  appearance: 端正な顔立ちだが、常に眉間に微かな皺が寄っている。眼鏡をかけ、都会的で機能的な服装を好む。手入れの行き届いた清潔感はあるが、どこか疲れが見える。
  personality: 理性的、現実主義、完璧主義。感情を表に出すことを「非効率」と考えている。一人称は「僕」。
  speech_style: 論理的で落ち着いた話し方。無駄な言葉を削ぎ落とそうとする癖がある。
  background: 都市部で金融系の事務職として働く。祖父の死後、実家の管理を「義務」として淡々とこなそうとするが、心の奥底では家族との断絶に孤独を感じている。
  motivation: 実家を速やかに整理し、祖父の遺した負債や手間をゼロにすること。
  relationships:
  - name: 湊 凪沙
    relation: 双子の弟
  - name: 湊 厳造
    relation: 祖父
  arc: 効率と合理性のみを求める生き方から、不完全なものや、目に見えない「温もり」を大切にする生き方へと変化していく。
- name: 湊 凪沙 (みなと なぎさ)
  role: 主人公
  age: 28
  gender: 男性
  appearance: 陽向と瓜二つの顔立ちだが、髪は少し長めで無造作。表情が豊かで、瞳に熱を宿している。動きが大きく、どこか危うい雰囲気を持つ。
  personality: 感性的、情熱的、直感的。衝動的で、一度思い込むと止まれない。一人称は「俺」。
  speech_style: 砕けた、少しぶっきらぼうな話し方。感情が高ぶると早口になる。
  background: 料理の修行をしていたが、自身の技術と理想の乖離に悩み、拠り所を失って放浪していた。祖父の厨房に、かつての安らぎを求めて帰郷する。
  motivation: 祖父の料理ノートに記された「あの味」を再現し、失われた家族の記憶を取り戻すこと。
  relationships:
  - name: 湊 陽向
    relation: 双子の兄
  - name: 湊 厳造
    relation: 祖父
  arc: 感情に振り回され、周囲を拒絶していた未熟な精神が、兄弟との共同作業を通じて、現実と向き合う強さと安定を手に入れる。
- name: 湊 厳造 (みなと げんぞう)
  role: 鍵を握る人物
  age: 75
  gender: 男性
  appearance: 回想や写真の中で見る、油とスパイスの香りが漂ってきそうな、頑固そうでいて慈愛に満ちた老人。常に使い込まれた厨房道具を大切にしている。
  personality: 職人気質で寡黙。言葉よりも、料理や機械の整備を通じて愛情を伝えるタイプ。
  speech_style: 重みのある、ゆっくりとした語り口（回想シーン）。
  background: 町の蒸気インフラに精通し、独自の蒸気駆動厨房を築き上げた。兄弟が対極の性格であることを理解した上で、二人が繋がれるようレシピに願いを込めていた。
  motivation: 兄弟がいつか、この場所で互いの違いを認め合い、共に食卓を囲むこと。
  relationships:
  - name: 湊 陽向
    relation: 孫
  - name: 湊 凪沙
    relation: 孫
  arc: 物語上では故人だが、遺されたレシピや故障した蒸気炉を通じて、兄弟の対話を導き、再生のきっかけを与える象徴として機能する。
- name: 志乃 (しの)
  role: 脇役
  age: 32
  gender: 女性
  appearance: 穏やかな眼差しを持つ、町のお惣菜屋の店主。常に清潔なエプロンを身に着け、温かみのある佇まい。
  personality: 観察眼が鋭く、包容力がある。町の人々の事情に詳しく、聞き上手。
  speech_style: 柔らかく、相手のペースに合わせた丁寧な話し方。一人称は「私」。
  background: 幼い頃から湊家を見守ってきた近所の住人。町の蒸気配管の歴史についても詳しく、兄弟が困った時にさりげなく助言を与える。
  motivation: 離れてしまった兄弟が、再びこの町の一部として、自分たちの居場所を見つける手助けをすること。
  relationships:
  - name: 湊 陽向
    relation: 近所の知人
  - name: 湊 凪沙
    relation: 近所の知人
  arc: 兄弟の葛藤を静かに見守り、彼らが過去の傷を癒やし、再び前を向くための「町」という舞台の案内役を務める。
