- name: キサラギ・レン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で常にクマが目立つ。神経接続用の端子が首筋に露出しており、使い古された情報調査員用のジャケットを着用している。
  personality: 執念深く、目的のためには自己犠牲を厭わない。内向的で、一人称は「俺」。
  speech_style: 短文で要件のみを伝える事務的な口調。感情が高ぶると言葉が荒くなる。
  background: 元・都市データ監査官。数年前、妹のミナが「データ消失事故」で失踪して以来、情報の海を彷徨うフリーの調査員となった。
  motivation: 失踪した妹の行方を突き止め、彼女が残した情報の断片を繋ぎ合わせること。
  relationships:
  - name: キサラギ・ミナ
    relation: 妹
  - name: ジャックス
    relation: 協力者
  arc: 妹への執着という「過去」に縛られた状態から、現実を受け入れ、未来を守るために「断ち切る」決断ができる大人へと成長する。
- name: キサラギ・ミナ
  role: 重要人物（幽霊データ）
  age: 19
  gender: 女性
  appearance: デジタル空間で見える姿は、ノイズに揺れる白いワンピースを着た少女。時折、解像度が崩れて背景の風景が透けて見える。
  personality: 儚げで、どこか遠くを見つめているような空虚な雰囲気。一人称は「私」。
  speech_style: 断片的で詩的な言い回し。意味が通じそうで通じない、ノイズ混じりの声。
  background: 天才的なプログラマー。海底遺跡のサーバーにアクセスした際、人類の記憶のゴミ捨て場に接触し、データとして溶け込んだ。
  motivation: 自分が何者であるかを、兄であるレンに思い出してもらうこと。
  relationships:
  - name: キサラギ・レン
    relation: 兄
  arc: 単なる「怪異」としての恐怖の対象から、レンの決断によって救済（消去）されるべき「記憶」へと変容していく。
- name: ジャックス
  role: 相棒
  age: 38
  gender: 男性
  appearance: 水没都市の潜水作業用に強化されたサイバネティクス義手を持ち、顔には深い傷跡がある。重装備のダイビングスーツを常用。
  personality: 現実主義で皮肉屋。金と生存を最優先するが、根は義理堅い。一人称は「俺」。
  speech_style: 荒っぽく、独特のストリート・スラングを多用する。ぶっきらぼうな態度。
  background: 旧市街の廃墟から資材を回収するサルベージ業者。レンに依頼され、海底遺跡への潜入ルートを案内する。
  motivation: 高額な報酬を得ること、そしてネオ・エデンの底で生き延びること。
  relationships:
  - name: キサラギ・レン
    relation: 依頼人兼相棒
  arc: 利己的な生存本能のみで動いていた男が、レンの信念に触れ、無謀とも言える危険な潜入に命を懸けるようになる。
- name: サイラス・ソーン
  role: 敵役
  age: 55
  gender: 男性
  appearance: 非の打ち所がない高級なバイオ・スーツに身を包んだ、清潔感のある初老の男。瞳には常に微かな電子の光が宿っている。
  personality: 冷徹で選民思想を持つ。人類の進化をデータの統合と考える狂信的な合理主義者。一人称は「私」。
  speech_style: 穏やかで説得力のある、教授のような教養を感じさせる話し方。
  background: ネオ・エデンのインフラを管理する巨大企業「エデン・コア」の最高経営責任者。
  motivation: 幽霊データを制御し、人類の意識をデジタル化して不滅の存在へと昇華させること。
  relationships:
  - name: キサラギ・レン
    relation: 計画を阻害する排除対象
  arc: 「神」になろうとする絶対的な支配者として、物語の終盤で情報の氾濫を加速させる装置として立ちはだかる。
