title: デッド・リンク・ラグーン：埋没する情報の墓標
genre: サイバーパンク
tone: 疾走感のある現代ホラー、不穏なデジタル・ノワール
pov: 三人称近接視点
tense: 過去形
setting: 高度な電子化が進んだ超巨大都市「ネオ・エデン」。海面上昇により水没した旧文明の廃墟と、その深海に存在するデータセンターが舞台。
premise: ネオ・エデンのネット掲示板では、特定のアドレスにアクセスすると「消えた村」の断片的な風景が見えるという都市伝説が流行していた。その正体は、かつて海没した集落の記憶がデジタル化した、実体を持たない怪異「幽霊データ」だった。噂を拡散するほど、そのデータは増殖し、現実世界の端末を通じて人々の精神を侵食していく。調査員の青年は、その怪異の源流が、深海に沈む未知の遺跡に接続された巨大なサーバー群であることを突き止める。
themes:
- 情報の拡散と実体化
- 忘却される記憶の恐怖
rules:
- 怪異はSNSでの拡散数（インプレッション）に比例して、物理的なバグや現象として実体化する
- 深海の遺跡に接続されたネットワークは、一度アクセスすると精神のバックアップを強制的に吸い上げる
plot_outline:
- '序盤: ネット上で囁かれる『消えた村』の怪異。ユーザーが次々と精神崩壊を起こす中、主人公は失踪した妹の端末に、海底遺跡の座標が含まれていることを発見する。'
- '中盤: 噂が爆発的に拡散し、都市のインフラに『潮騒』のようなノイズが混じり始める。主人公は情報の波を追うように、水没した旧市街と海底遺跡へと潜入する。'
- '終盤: 海底遺跡の最深部で、怪異の正体が『人類が捨て去った記憶のゴミ捨て場』であることを知る。増殖した怪異は、都市全体を海の中へと引き摺り込もうとする。'
- '結末: 主人公はサーバーを物理的に破壊しようとするが、それは同時に妹の記憶を永遠に失うことを意味していた。ノイズの嵐の中、彼は決断を迫られる。'
style_notes: 無明蓮司による筆致。短文を多用し、情報過多な現代の速度感を演出する。作中には掲示板の書き込み、チャットログ、エラーメッセージを頻繁に挿入し、読者が直接怪異に触れているような没入感を与える。怪異が強まるにつれ、文章自体にノイズや文字化けのような崩壊を混ぜていく。
