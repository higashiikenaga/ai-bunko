title: 空白の星図を綴る指先と、地下図書館の密やかな再会
genre: 青春恋愛
tone: 甘くて切ない、内省的な独白が中心の静かな雰囲気
pov: 一人称（わたし）
tense: 過去形
setting: 現代の海辺の町、および記憶の市場の深層にある「地下図書館」と「消えた村」
premise: 凪を救う代償に「彼を愛する感情」を失った澪。心にぽっかりと空いた空白を抱えながらも、彼の隣にいたいと願う彼女は、失った感情を取り戻す手がかりを求めて、記憶の市場のさらに奥底にある「地下図書館」へと足を踏み入れます。それは、かつて人々が心を捨てた「消えた村」の記憶を辿る、もう一度恋に落ちるための旅路でした。
themes:
- 意志としての愛
- 喪失と再生
rules:
- 感情の等価交換の原則が継続。地下図書館には市場で取引される前の「魂の原典」が保管されており、そこでの書き換えは現実の感情に影響を与える。ただし、強制的な書き換えには相応の代償が必要となる
plot_outline:
- '序盤: 現実世界で凪と共に過ごすが、愛の実感がないことに絶望しつつも、彼を大切に想う「意志」だけで繋がっている危うい日常が描かれる。ある日、手元に残っていた星図に、地下図書館への入り口を示す新たな座標が浮かび上がる。'
- '中盤: 記憶の市場の深層へ戻った二人は、あらゆる感情の記録が眠る「地下図書館」に辿り着く。そこで、市場のルールの起源となった、感情を捨てて平穏を得た「消えた村」の物語を知り、澪は自分の感情がどこに保管されているかを探し始める。'
- '終盤: 感情の原典を取り戻そうとする澪の前に、商人が再び現れ、「愛という快楽」と「喪失という痛み」はセットであると告げる。凪は澪が再び痛みを背負うことを拒むが、澪は凪と共に泣き、笑いたいという切なる願いから、全ての痛みを引き受ける覚悟を決める。'
- '結末: 感情を単に「取り戻す」のではなく、今の自分たちが新しく「書き込む」ことで、商人の契約を上書きする。かつての愛とは違う、より深く、不完全で、それでも強い絆を結んだ二人が、本当の意味で手を取り合い、温かな体温を感じながら現実へ帰還する。'
style_notes: 「～かしら」「～なの」といった柔らかい語尾を用い、心の揺れを繊細に描写する。情景描写よりも「今、胸がどう痛んでいるか」という内面的な感覚を優先的に書き込む。毎話の終わりに、読者の心をざわつかせる切ない独白（クリフハンガー）を必ず配置する。
