- name: エリオ・スカイウォーカー
  role: 主人公
  age: 17
  gender: 男性
  appearance: 風に焼けた肌と、好奇心に満ちた碧い瞳。使い古した飛行ゴーグルを常に首にかけている。軽快なフライトジャケットを着用。
  personality: 直感的で楽観的。正義感が強く、困難な状況でも諦めない不屈の精神を持つ。一人称は「俺」。
  speech_style: 快活で少年っぽさが残る口調。興奮すると早口になる傾向がある。
  background: 没落した飛行士の家系に生まれ、幼い頃から祖父に操縦を教わった。沈みゆく故郷の島を救いたいという強い願いを持っている。
  motivation: 伝説の「風の心臓」を見つけ出し、世界に再び安定した風を取り戻すこと。
  relationships:
  - name: リーナ
    relation: 幼馴染であり、唯一無二の信頼を寄せる相棒
  - name: ゼノ
    relation: 記憶の取引を通じて導かれる導き手
  arc: 単なる憧れとしての冒険から、世界の運命を背負う責任感を持つ真の操縦士へと成長する。
- name: リーナ・アイアンハート
  role: 相棒/整備士
  age: 18
  gender: 女性
  appearance: 赤褐色のショートヘアに、油汚れのついたオーバーオール。腰のツールベルトに大小様々なレンチをぶら下げている。
  personality: 現実的で慎重。口は悪いが情に厚く、エリオの無茶をフォローする苦労人。一人称は「私」。
  speech_style: ぶっきらぼうだが、相手を気遣う言葉が端々に混じる。技術的な話になると熱くなる。
  background: かつて高度な技術を持っていたが、ある事件で記憶の一部を「忘却の市場」に売り払い、故郷を失った過去を持つ。
  motivation: スカイ・ラッシュ号を最高の状態で維持し、エリオを無事に帰還させること。そして失った記憶の断片を取り戻すこと。
  relationships:
  - name: エリオ・スカイウォーカー
    relation: 危なっかしいが、誰よりも信じているパートナー
  arc: 過去の喪失感に囚われていたが、エリオとの旅を通じて「今」を生きる勇気を取り戻す。
- name: ゼノ
  role: 導き手/記憶の調律師
  age: 25
  gender: 男性
  appearance: 白い長いコートを纏い、片目を銀色のモノクルで覆っている。常に記憶が封じられたクリスタルを弄んでいる。
  personality: ミステリアスで皮肉屋。感情を表に出さないが、本質的に孤独を嫌うロマンチスト。一人称は「僕」。
  speech_style: 穏やかで丁寧だが、どこか突き放したような含みのある話し方。
  background: 「忘却の市場」で記憶の取引を司る調律師。世界の成り立ちと風の衰退の真実を知る数少ない人物の一人。
  motivation: 自分自身の消えかけた記憶を完結させるため、風を呼び戻せる「器」としてのエリオを観察・誘導すること。
  relationships:
  - name: エリオ・スカイウォーカー
    relation: 興味深い観察対象であり、かつての自分を重ねる存在
  arc: 冷徹な傍観者の立場を捨て、自らの意志でエリオたちの航海に同行し、世界を救う側に回る。
- name: ヴァルガス・ヴォルテックス
  role: 敵役/ライバル
  age: 30
  gender: 男性
  appearance: 黒い軍服に身を包んだ威圧感のある男。鋭い眼光と、左腕に機械仕掛けの義手を持つ。
  personality: 冷徹な能力主義者。弱者は淘汰されるべきという選民思想を持つ。一人称は「私」。
  speech_style: 威厳に満ちた断定的な口調。相手を精神的に追い詰める論理的な話し方。
  background: 帝国軍の精鋭部隊を率い、強引に「風の心臓」を回収して、特権階級の島だけを浮かせて維持しようと企んでいる。
  motivation: 風の心臓を独占し、選ばれた者だけが生き残る「完璧な新世界」を構築すること。
  relationships:
  - name: エリオ・スカイウォーカー
    relation: 排除すべき甘ちゃんであり、同時にその才能を認めているライバル
  arc: 絶対的な力による支配を信じていたが、エリオたちの絆による奇跡を目の当たりにし、己の信念の脆さを知る。
