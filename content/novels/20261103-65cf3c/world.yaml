title: 蒼穹のブレイカーズ：風の鼓動と忘却の航路
genre: 異世界ファンタジー
tone: 爽快で躍動感のある冒険活劇
pov: 三人称
tense: 過去形
setting: 無数の浮遊島が雲海の上に漂う世界「スカイ・アーク」。上昇気流の源である「風」が衰退し、島々が次々と深淵へ沈み始めている時代。
premise: 風の消失により、世界の均衡が崩れようとしていた。若き操縦士エリオは、愛機『スカイ・ラッシュ号』の仲間と共に、失われた風を呼び戻す「風の心臓」を探す旅に出る。記憶を売買する「忘却の市場」での出会いと、雨の日だけ現れる不思議な店での遭遇。空を裂く風の咆哮と共に、彼らの熱い航海が幕を開ける！
themes:
- 仲間との強い絆
- 失われた記憶と自己の再発見
rules:
- 浮遊島は、大気中の魔力によって生じる『上昇気流』によって浮力を得ている
- 記憶を売買する際は、抽出された『記憶の結晶』を貨幣として用いる
- 雨の日は大気中の魔力が凝縮し、空間の歪みが安定するため、特定の店や場所が物理的に実在する
plot_outline:
- '序盤: 操縦士エリオと整備士リーナは、風の弱まりによる浮遊島の沈下を目の当たりにする。突発的な雨の中で、地図を売る『雨降りの交易店』に遭遇し、伝説の航路の断片を手に入れる。'
- '中盤: 航路を辿り、人々の記憶が取引される『忘却の市場』へと到達。そこでエリオは、仲間が抱える過酷な過去を知ることになるが、それを乗り越え、仲間との絆を深めながら空の深淵へと突き進む。'
- '終盤: 風の源流である『天空の聖域』で、風を食らう巨大な嵐の化身と遭遇。スカイ・ラッシュ号の全出力を解放し、空を切り裂くような決死の空中戦を展開する。'
- '結末: 嵐を打ち破り、新たな風が世界に吹き抜ける。沈みかけた島々は再び空へと舞い戻り、エリオたちは新たな冒険の風を感じながら、青い空の彼方へと飛翔する。'
style_notes: 風の唸り、エンジンの爆音、翼が空気を切り裂く感覚を、五感に訴えかけるような鮮やかな描写で綴る。機械の精密な美しさと、空の広大さを、突き抜けるような爽快な文体で描き出すこと。
