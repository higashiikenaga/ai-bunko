- name: 如月 朝陽
  role: 主人公
  age: 26
  gender: 男性
  appearance: 都会的な清潔感はあるが、少し疲れの見え隠れする細身の青年。眼鏡をかけている。
  personality: 合理的で慎重、物事を疑う癖がある。一人称は「僕」。
  speech_style: 丁寧な敬語、あるいは標準語。感情が昂ると少し早口になる。
  background: 東京の広告代理店に勤める会社員。数十年前に村を離れた祖母の訃報を受け、故郷へ帰還する。
  motivation: 祖母の死の真相を探り、村の異様な空気の正体を突き止めること。
  relationships:
  - name: 佐伯 源蔵
    relation: 敵対者
  - name: 佐伯 美緒
    relation: 同情の対象
  arc: 理性的な都会人から、逃れられない呪術的因習に翻弄され、絶望へと沈んでいく犠牲者へと変貌する。
- name: 佐伯 源蔵
  role: 敵役
  age: 68
  gender: 男性
  appearance: 日焼けして深く刻まれた皺、鋭い眼光を持つ。常に伝統的な作業着を纏っている。
  personality: 厳格、冷徹、独善的。村の掟を絶対とし、個人の感情を排除する。一人称は「わし」。
  speech_style: 訛りの強い、威圧感のある古風な言葉遣い。
  background: 村の長であり、代々「空舟」の儀式を司る佐伯家の当主。
  motivation: 儀式を完遂し、空舟を鎮めることで村の安寧を維持すること。
  relationships:
  - name: 如月 朝陽
    relation: 生贄
  - name: 佐伯 美緒
    relation: 娘
  arc: 物語を通じて一切揺らぐことなく、伝統を守るための「絶対的な悪」として君臨し続ける。
- name: 佐伯 美緒
  role: 脇役
  age: 20
  gender: 女性
  appearance: 色白でどこか儚げな美しさを持つ。村の祭礼用の装束を纏うことが多い。
  personality: 内向的で臆病。村の因習に恐怖を感じつつも、抗えない諦念を抱いている。一人称は「私」。
  speech_style: 消え入りそうな、おどおどとした話し方。
  background: 源蔵の娘。自分が次の生贄になるのではないかという予感に怯えながら暮らしている。
  motivation: 儀式の連鎖を止めること、あるいは朝陽を逃がすこと。
  relationships:
  - name: 佐伯 源蔵
    relation: 父
  - name: 如月 朝陽
    relation: 共鳴者
  arc: 傍観者として沈黙を守る立場から、一瞬の勇気を持って朝陽に警告を与える者へと変化する。
- name: 小枝
  role: 脇役
  age: 35
  gender: 女性
  appearance: 常に影の中にいるような、古びた着物姿の女。瞳に生気がない。
  personality: 達観しており、どこか浮世離れしている。一人称は「私」。
  speech_style: 意味深で、断片的な言葉を紡ぐような独特のリズム。
  background: 数十年前の祭りで「神隠し」に遭い、死んだはずの村の住人。黒猫を媒介に現れる。
  motivation: 儀式の真実を伝え、誰かがこの連鎖を断ち切るのを待つこと。
  relationships:
  - name: 如月 朝陽
    relation: 導き手
  arc: 朝陽に真実の断片を与え、彼を絶望的な結末へと導くための触媒として機能する。
