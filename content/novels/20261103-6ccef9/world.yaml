title: 空舟の凪ぎに沈む
genre: 怪談・民俗
tone: 静謐で閉塞感のある、土着的な恐怖
pov: 三人称
tense: 過去形
setting: 現代。四国の山奥に位置し、外界から隔絶された「神隠し」の伝承が残る集落。
premise: 祖母の葬儀で数十年ぶりに故郷へ戻った主人公は、村に伝わる「空舟（そらぶね）」の伝承に触れる。雲海を漂う巨大な亡者の船を鎮めるため、村では代々、ある残酷な「禁忌」を守り続けていた。名もなき黒猫に導かれ、彼は村がひた隠しにする血塗られた因習の正体を知ることになる。
themes:
- 逃れられない血縁
- 共同体の狂気
rules:
- 「空舟」が見える夜、決して空を見上げてはならない。見上げた者は舟の乗組員として連れ去られる。
- 村の猫に名前をつけてはならない。名を与えた者は、その猫を通じて「舟」に居場所を教えられることになる。
- 祭りの夜、集落の最北端にある古井戸に、供物となる者の髪を捧げなければ舟は去らない。
plot_outline:
- '序盤: 主人公が村に帰還し、不気味な静寂と村人の異様な視線に気づく。正体不明の名前のない黒猫が彼に付きまとい、警告するように鳴き続ける。'
- '中盤: 50年に一度の「空舟送り」の祭りが近づく。村の古文書を盗み見た主人公は、かつて空を飛ぶ朽ちた船のような異形が村を襲い、それを鎮めるために血縁者の生贄を捧げていた歴史を見出す。'
- '終盤: 祭りの夜、村人の誘導で禁忌を破り空を見上げた主人公は、雲を裂いて降りてくる巨大な木造船を目撃する。彼こそが今回の「供物」として選ばれていたことが判明し、逃げ場のない村の結界に閉じ込められる。'
- '結末: 黒猫の導きで一時的に森へ逃れるが、村人全員に囲まれ、絶望的な静寂の中で空舟の影に飲み込まれていく。'
style_notes: 湿度を感じさせる静かな情景描写を徹底する。会話文には山間部の訛りを交え、よそ者を拒絶する共同体の圧迫感を演出すること。
