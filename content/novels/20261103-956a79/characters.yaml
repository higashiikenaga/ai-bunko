- name: エリオス・ヴァイン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 灰色の瞳と、どこか虚ろな表情を持つ青年。細く長い指を持ち、常に銀の記憶蒐集箱を携行している。
  personality: 冷静で理性的だが、内面には深い孤独を抱えている。一人称は「僕」。
  speech_style: 淡々としており、感情の起伏が少ない丁寧な口調。
  background: 幼少期に自らの最も大切な記憶を失っており、その欠落を埋めるために「失われた断片」を蒐集する蒐集家となった。
  motivation: ルミエラの消滅を阻止すること、そして自身の失われた記憶の正体を知ること。
  relationships:
  - name: ルミエラ
    relation: 守るべき対象であり、旅の同行者
  arc: 孤独を愛する蒐集家から、喪失の痛みを受け入れ、それでも誰かを想い続ける強さを得る人間へと変化する。
- name: ルミエラ
  role: 相棒
  age: 16
  gender: 女性
  appearance: サファイアのように透き通る青い髪と、煌めく瞳を持つ少女。体が時折、硝子のように細かくひび割れる。
  personality: 天真爛漫で好奇心旺盛だが、自身の消滅を予感しており、どこか達観した寂しさを纏っている。一人称は「私」。
  speech_style: 歌うような、柔らかく浮世離れした話し方。
  background: 世界の理から零れ落ち、実体化しつつある「忘れ去られた記憶の結晶」そのもの。
  motivation: 自分がかつて誰の、どのような記憶であったのかという「存在の証明」を見つけること。
  relationships:
  - name: エリオス・ヴァイン
    relation: 唯一の理解者であり、愛する人
  arc: 消えゆく運命に抗うのではなく、自らの意志で「記憶の一部」として永遠に刻まれる道を選択する。
- name: 虚無の車掌
  role: 敵役
  age: 不詳
  gender: 不明
  appearance: 顔の部分が星のない夜空のように暗い、漆黒の外套を纏った人影。巨大な懐中時計を手にしている。
  personality: 感情を一切持たず、世界の摂理に従って「忘却」を遂行する絶対的な存在。一人称は「我」。
  speech_style: 重々しく、空間を震わせるような低音の響き。
  background: すべての記憶が尽きた後に訪れる終焉の象徴であり、「最終列車」を操る者。
  motivation: すべての記憶を回収し、世界を完全な無へと還すこと。
  relationships:
  - name: エリオス・ヴァイン
    relation: 理を乱す排除対象
  arc: 変化することのない絶対的な「終焉」として、主人公に究極の選択を突きつける。
- name: セレナ・クロム
  role: 脇役
  age: 62
  gender: 女性
  appearance: 銀髪を束ね、多くのレンズを重ねた特殊な眼鏡をかけている、結晶都市の古物商。
  personality: 口が悪く皮肉屋だが、実は情に厚い。一人称は「私」。
  speech_style: べらんめえ調に近い、威厳と親しみやすさが混ざった話し方。
  background: かつてエリオスの師であり、彼に記憶の蒐集技術を教えた人物。
  motivation: エリオスが過去の欠落に囚われすぎず、一人の人間として歩めるよう見守ること。
  relationships:
  - name: エリオス・ヴァイン
    relation: かつての弟子
  arc: エリオスに「記憶とは所有するものではなく、共に生きる証である」という真理を伝える役割を果たす。
