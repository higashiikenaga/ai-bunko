title: 砕け散る銀河の、硝子の葬送曲
genre: 伝奇
tone: 耽美、静謐、哀切
pov: 一人称
tense: 過去形
setting: 星の塵が降り積もる、黄昏の結晶都市
premise: 記憶が宝石として実体化する世界で、私は「失われた断片」を蒐集する孤独な蒐集家として生きていた。ある日、砕けゆくサファイアの輝きを持つ少女と出会い、彼女の消滅を止めるために、伝説の「約束の丘」を目指すことになる。しかし、その旅路の果てには、すべての記憶を虚無へと連れ去る「最終列車」の咆哮が待ち受けていた。これは、美しくも残酷な、忘却と愛の物語である。
themes:
- 記憶の不可逆性
- 美しき喪失
rules:
- 記憶は宝石の形を取り、破損するとその記憶は永遠に失われる
- 『最終列車』は百年一度、星光の軌道上を走る
- 生身の人間が記憶の結晶に直接触れると、自身の輪郭が溶け出し、存在が霧散する
plot_outline:
- '序盤: 結晶の街で孤独に過ごす主人公が、崩壊しかけた記憶の結晶を抱える少女と出会い、彼女の存在が世界から零れ落ちようとしていることを知る。'
- '中盤: 少女の記憶を繋ぎ止めるため、二人は「枯れた星々の庭」を越える旅に出る。旅の中で、主人公の過去に隠された欠落の正体が明かされていく。'
- '終盤: 「約束の丘」に辿り着いた時、空を切り裂いて「最終列車」が姿を現す。少女は列車に乗らなければ、この世界の理から消えてしまう運命にある。'
- '結末: 主人公は彼女を永遠に閉じ込めるか、手放すかの選択を迫られる。少女は光の粒子となって列車に乗り込み、主人公の手元には、決して割れることのない小さな一粒の輝きだけが残される。'
style_notes: 宝石の色彩や、ガラスの透過・屈折、花弁の散り際を多用した、装飾的で詩的な文体。一文一文を、磨き上げられたクリスタルを眺めるような、繊細で耽美な質感で綴ること。魂の脆さを、壊れやすい硝子や一瞬の煌めきに例えて描写する。
