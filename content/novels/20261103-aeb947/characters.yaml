- name: 葛城 慎一郎
  role: 主人公
  age: 42
  gender: 男性
  appearance: 鋭い眼光と、どこか寂寥感を漂わせる表情。使い込まれた軍服風の外套を纏い、常に壊れた銀の懐中時計を握り締めている。
  personality: 冷静沈着でストイック。武士道の矜持を捨てきれない、誇り高くも孤独な性格。一人称は「私」。
  speech_style: 丁寧だが、言葉の端々に武士的な硬さと、時代に取り残された者の響きがある。
  background: かつての戦での敗北と、守れなかった部下への悔恨を抱えながら、湊凪市の片隅で静かに暮らす退役士官。
  motivation: 止まった時計を直すように、過去の過ちを清算し、己の魂の行く末を見定めること。
  relationships:
  - name: 蓮 拓海
    relation: 旧時代の遺物として軽蔑しつつも、その熱量に戸惑う対象
  - name: 織部 志乃
    relation: 不器用ながらも、真実を求める志を共有する協力者
  arc: 過去の亡霊に囚われた男が、時代の激動の中で「今、何を護るべきか」という答えを見出す。
- name: 織部 志乃
  role: 主人公
  age: 24
  gender: 女性
  appearance: 端正にまとめられた髪と、理知的で透き通った瞳。電信局の機能的な制服を隙なく着こなしている。
  personality: 合理的で好奇心が強く、正義感に対しては極めて真摯。感情に流されず事実を追う。一人称は「私」。
  speech_style: 明快で無駄がなく、電信の信号のように正確で淀みのない話し方。
  background: 没落した商家の娘として、自らの力で生きるために電信局員となった、湊凪市の新時代の象徴的存在。
  motivation: 不可解な電信の裏に隠された、街の腐敗を象徴する「失われた手紙」の真実を暴くこと。
  relationships:
  - name: 葛城 慎一郎
    relation: 情報の断片を通じて繋がる、守るべき、あるいは導くべき協力者
  - name: 鷹司 宗助
    relation: 真実を隠蔽しようとする、巨大な悪の権化
  arc: ただ情報を処理するだけの傍観者から、自ら情報の海へ飛び込み、真実を社会に突きつける主体者へと変貌する。
- name: 蓮 拓海
  role: 主人公
  age: 28
  gender: 男性
  appearance: 逞しい体格と、煤けた作業着。労働で鍛え上げられた手と、燃えるような情熱を宿した瞳を持つ。
  personality: 情熱的で直情的。抑圧される者への共感力が強く、変化を恐れない。一人称は「俺」。
  speech_style: 荒々しく、力強い。労働者特有の語彙を使い、聴衆の心を揺さぶる演説のような話し方。
  background: 劣悪な工場環境で家族を失い、労働者の権利を守るために蜂起を企てる若き運動家。
  motivation: 搾取の構造を破壊し、労働者が人間らしく生きられる新しい時代を築くこと。
  relationships:
  - name: 葛城 慎一郎
    relation: 過去に固執する古い価値観として、反発と疑問を抱く対象
  - name: 織部 志乃
    relation: 思想の隔たりはあるが、共に街を変える力を持つと確信する存在
  arc: 単なる怒りに任せた破壊者から、時代の濁流の中で、自らの理想と現実の矛盾を受け入れる覚悟を持つ者へ。
- name: 鷹司 宗助
  role: 敵役
  age: 55
  gender: 男性
  appearance: 恰幅の良い体躯に、最高級の洋装を纏う。金色の装飾品を好み、常に余裕を感じさせる微笑を浮かべている。
  personality: 冷酷で計算高く、目的のためには手段を選ばない。圧倒的な支配欲を持つ。一人称は「私」。
  speech_style: 優雅で洗練されているが、相手を見下し、操るような含みを持たせた話し方。
  background: 湊凪市の近代化を牽引する政商であり、街の経済と政治を実質的に掌握する黒幕。
  motivation: 自身の権威と富を守るため、過去の汚職を証明する「手紙」を永久に葬り去ること。
  relationships:
  - name: 織部 志乃
    relation: 自身の帝国を脅かす、排除すべき知的な障害
  - name: 蓮 拓海
    relation: 秩序を乱す、鎮圧すべき火種
  arc: 盤石な権力を誇示し続けるが、個人の魂の抗いという、計算不能な変数の前で崩壊していく。
