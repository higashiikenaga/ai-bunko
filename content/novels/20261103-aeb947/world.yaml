title: 暁の残影、鉄の律動
genre: 群像劇
tone: 重厚かつ哀愁漂う、格調高い文体
pov: 三人称（章ごとに視点人物が切り替わる）
tense: 過去形
setting: 明治・大正期を模した架空の港湾都市「湊凪市」。蒸気機関と電信が急速に普及し、旧来の武士道的矜持と、新興資本家の野心が激しく衝突する時代。
premise: 近代化の奔流に呑まれゆく港町、湊凪市。止まった懐中時計と共に過去の栄光に縋る退役士官、消えた手紙の行方を追う電信局の女性、そして変革を叫ぶ労働者の徒党。三つの異なる正義が、ある政商の汚職を暴く「失われた手紙」を巡って、運命的に交錯する。時代の転換点において、人は何を捨て、何を護るべきか。鉄の響きと共に、魂の抗いを描く。
themes:
- 失われた矜持と再生
- 時代の変遷に伴う個人の疎外
- 衝突する正義
rules:
- 都市の動力源は石炭と蒸気であり、その供給路が権力の源泉となっている
- 電信技術は発達途上であり、情報の伝達には物理的なリスクが伴う
- 身分制度は法的には解消されつつあるが、実態としての階級差は根深い
plot_outline:
- '序盤: 湊凪市の繁栄の裏で、静かに腐朽が進む様を描く。退役士官・葛城は、壊れた懐中時計を眺めながらかつての敗北に苛まれる。電信局員の志乃は、届くはずのない不可解な電信に違和感を覚える。'
- '中盤: 志乃が、政界を揺るがす「失われた手紙」の存在を突き止める。一方、労働運動家・蓮は、工場の過酷な搾取に抗うべく蜂起を計画し、街に不穏な空気が流れる。'
- '終盤: 手紙の隠し場所を巡り、葛城の過去の因縁、志乃の追及、蓮の暴動が、港湾の蒸気機関が稼働する中心地で一堂に会する。三者の正義が激突し、混乱の中で真実が露わになる。'
- '結末: 真実は明かされるが、それは必ずしも救いをもたらさない。葛城は己の誇りを完遂し、志乃は新たな時代の理を見つめ、蓮は時代の濁流に身を投じる。夜明け前の静寂の中、鉄の律動だけが残される。'
style_notes: 語彙は典雅かつ峻烈であること。人物の動作、視線の揺らぎ、沈黙の深さに、その人物の生き様と哲学を投影させる。会話文は、教養や身分に即した、格式ある言葉遣いを厳守する。
