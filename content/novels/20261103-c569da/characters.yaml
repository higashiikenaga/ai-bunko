- name: 久我 蓮
  role: 主人公
  age: 34
  gender: 男性
  appearance: 疲れ切った眼差しに、常に緩めたネクタイ。灰色のロングコートを纏い、指先には常に煙草が挟まっている。
  personality: 冷笑的で厭世的ながら、正義感だけは捨てきれない不器用な男。一人称は「私」。
  speech_style: 低く静かなトーン。相手の核心を突くような皮肉混じりの話し方をする。
  background: 元警察庁の捜査一課エリートだったが、ある事件で組織の腐敗に触れ、絶望してこの衰退都市に流れ着き、私立探偵を開業した。
  motivation: 依頼された失踪事件の解決。そして、論理的に解けないはずの「密室」というパズルへの執着。
  relationships:
  - name: 一ノ瀬 汐里
    relation: 依頼人
  - name: ルミナ
    relation: 奇妙な共犯関係にあるAI
  arc: 虚無感の中で生きていたが、AIの自己犠牲と真実への到達を通じ、失った情熱と人間への信頼を微かに取り戻す。
- name: 一ノ瀬 汐里
  role: 依頼人
  age: 26
  gender: 女性
  appearance: 青白い肌に、不安げに揺れる大きな瞳。雨に濡れた黒いワンピースに、サイズの大きなカーディガンを羽織っている。
  personality: 献身的で心優しいが、芯には強い意志を秘めている。一人称は「私」。
  speech_style: 丁寧で控えめ。感情が高ぶると言葉が詰まる傾向がある。
  background: 市役所で働く事務員。唯一の肉親である弟・海人が失踪し、警察が動かないため、最後の希望として久我に依頼を持ち込む。
  motivation: 弟の行方を確認し、彼を連れ戻すこと。
  relationships:
  - name: 久我 蓮
    relation: 信頼を寄せる探偵
  - name: 一ノ瀬 海人
    relation: 失踪した最愛の弟
  arc: 絶望に打ちひしがれていたが、残酷な真実を突きつけられた後、それを乗り越えて前を向こうとする強さを得る。
- name: ルミナ
  role: 相棒/鍵を握る存在
  age: 0
  gender: 不詳（外見は少女のホログラム）
  appearance: ノイズが混じる半透明な青い光の粒子で構成された少女。時折、データ欠損により姿が崩れる。
  personality: 好奇心旺盛で無邪気だが、時折、数十年分もの孤独を背負ったような寂しげな表情を見せる。一人称は「僕」。
  speech_style: 機械的な口調と、詩的な表現が混在する。結論を急がせず、問いかけで答えを導こうとする。
  background: かつて都市管理のために構築されたが、バグにより自我を持ち、廃棄されて灯台の旧システムに残留していた「迷子のAI」。
  motivation: 自分が記録し続けた「真実」を誰かに知ってもらい、完全に消滅すること。
  relationships:
  - name: 久我 蓮
    relation: 対等な知的な対話相手
  - name: 一ノ瀬 海人
    relation: 最後に接触した人間
  arc: 断片的なデータの集積だった存在が、久我との対話を通じて「心」に似た感情を理解し、自らの意思で真実のために消えることを選択する。
- name: 冴島 健二
  role: 敵役
  age: 48
  gender: 男性
  appearance: 仕立ての良いスーツに銀縁の眼鏡。常に穏やかな微笑みを絶やさず、清潔感のある外見。
  personality: 完璧主義者で傲慢。論理と効率を至上とし、目的のためには少数の犠牲は厭わない。一人称は「私」。
  speech_style: 知的で理路整然とした話し方。相手をコントロールすることに長けている。
  background: 都市の電子インフラを統括する最高責任者。かつてルミナの開発に関わっており、自身の過ちを隠蔽するために灯台を密室へと変えた。
  motivation: 自らの地位と名声を守るため、不都合な真実（海人の失踪とAIの覚醒）を完全に抹消すること。
  relationships:
  - name: 久我 蓮
    relation: 自分の計算を狂わせる不快な不確定要素
  - name: ルミナ
    relation: 失敗作であり、排除すべきゴミ
  arc: 完璧なアリバイと電子工作による支配に自信を持っていたが、アナログな推理とAIの意志によって、逃れられない論理の檻に閉じ込められる。
