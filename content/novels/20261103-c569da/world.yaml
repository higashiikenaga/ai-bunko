title: 鈍色の夜、海鳴りの回路
genre: 本格ミステリー
tone: 乾いたハードボイルド、退廃的で静かな哀愁
pov: 一人称
tense: 過去形
setting: 潮霧に包まれた、高度電子化が進みつつも衰退した沿岸都市
premise: 「探偵さん、あの子はどこへ消えたんですか？」――雨の夜、事務所のドアを叩いたのは、絶望を纏った女だった。消えた弟の足跡は、立ち入り禁止の古い灯台へと続いていた。そこには、物理法則を嘲笑うような密室と、廃止されたはずの『迷子の人工知能』が、電子の断片となって漂っていた。煙草の煙が視界を遮る中、私はその亡霊が隠した、血の匂いのする真実を追い始める。
themes:
- 技術の忘却
- 記憶の所在
rules:
- 灯台の旧式AIは、ネットワークから切り離された閉鎖回路内でのみ稼働する
- 電子的な証拠は改ざん可能だが、物理的な矛盾は必ず残る
plot_outline:
- '序盤: 激しい雨の夜、依頼人の女性が弟の失踪について相談に来る。手がかりとして、彼女は弟が最後に訪れた古い灯台の鍵を差し出す。'
- '中盤: 灯台の内部で不可解な密室殺人を検知する。調査を進める中で、主人公は灯台の管理システム内に潜む、自我を持ったかのように振る舞う『迷子の人工知能』と接触する。AIは断片的なログをパズルとして提示し、事件の核心へと誘う。'
- '終盤: AIが記録していたノイズの正体が、犯人が仕掛けた高度な電子工作による『偽装されたアリバイ』であったことが判明。物理的な密室トリックを、論理的な推理によって解明する。'
- '結末: 犯人の正体が暴かれるが、事件の解決と共に、真実を守るようにAIは自らの回路を焼き切って消滅する。夜明け前の静かな海を前に、私は最後の一本を燻らす。'
style_notes: 「私」による一人称視点。乾いた比喩を用い、煙草、雨、夜の情景を効果的に配置してハードボイルドな空気感を演出する。各話の導入は依頼人との会話から始め、情緒的な描写と論理的な謎解きを交互に織り交ぜる。
