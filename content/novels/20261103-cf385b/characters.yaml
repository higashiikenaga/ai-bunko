- name: カイ・レン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 煤けた作業着に身を包んだ、無造作な黒髪の青年。右手の指先に古い火傷の跡がある。
  personality: 無口で冷静だが、エンジンの鼓動に対しては異常なまでの情熱を燃やす。一人称は「俺」。
  speech_style: 短文でぶっきらぼう。機械の調子について話す時だけ言葉が熱を帯びる。
  background: かつてはエリートレーサー候補だったが、原因不明の墜落事故で全てを失い、低層階の廃材街で隠遁生活を送っていた。
  motivation: 再び空へ上がり、失った己の証明と、事故の真相を突き止めること。
  relationships:
  - name: ライラ
    relation: 整備を担当する唯一無二の相棒
  - name: ゼオン
    relation: 越えるべき壁であり、宿命のライバル
  arc: 過去の敗北による閉塞感から脱し、仲間と共に予測不能な「咆哮」を上げるレーサーへと成長する。
- name: ライラ・ヴェイン
  role: 相棒
  age: 18
  gender: 女性
  appearance: 銀髪のショートカットに、常に額にゴーグルを載せている。油汚れのついたオーバーオールが特徴。
  personality: 明るく快活だが、技術に関しては妥協を許さない頑固な天才肌。一人称は「私」。
  speech_style: 早口で専門用語を多用する。機体の不調に対しては厳しい口調になる。
  background: 中層階の技術者家系の娘だったが、家系の没落により低層階へ。旧式船の改造に並外れた才能を持つ。
  motivation: 自らの設計した機体が、世界の頂点の空を切り裂く瞬間を見ること。
  relationships:
  - name: カイ
    relation: 信頼するパイロットであり、守るべき相棒
  arc: 機械の数値的な完璧さだけでなく、パイロットの魂と機体が共鳴する「感覚」を理解していく。
- name: ゼオン・ヴァレリウス
  role: 敵役
  age: 21
  gender: 男性
  appearance: 隙のない金髪と、冷徹な青い瞳。上層階の特権を示す純白のレーシングスーツを纏う。
  personality: 傲慢で選民思想が強く、効率と秩序を絶対とする完璧主義者。一人称は「私」。
  speech_style: 丁寧だが、相手を徹底的に見下すような冷ややかな敬語。
  background: 都市の頂点を支配する巨大企業「ヴァレリウス重工」の御曹司。最新鋭の艦隊を率いるエリート。
  motivation: 階級社会の秩序を維持し、自らの完璧なレースで世界の頂点を証明すること。
  relationships:
  - name: カイ
    relation: 秩序を乱す不純物であり、排除すべき対象
  arc: カイの泥臭い情熱に直面し、自らが信じてきた「完璧」という虚構が崩れていく恐怖と葛藤を味わう。
- name: ガンツ
  role: 脇役
  age: 56
  gender: 男性
  appearance: 深い皺が刻まれた顔と、使い古されたオイルの匂いが染み付いたコート。片腕が義手。
  personality: 皮肉屋で世捨て人のような風貌だが、若者の熱意を静かに見守る懐の深さがある。一人称は「わし」。
  speech_style: 濁った声で、含みを持たせた古めかしい言い回しをする。
  background: かつて伝説と呼ばれたレーサーだったが、ある事故を境に廃材街の修理屋として隠居している。
  motivation: かつての自分のような「空への渇望」を持つ者に、最後の一撃を託すこと。
  relationships:
  - name: カイ
    relation: かつての自分を重ねる教え子
  arc: 過去の失敗に対する後悔を、次世代の勝利を見届けることで昇華させていく。
