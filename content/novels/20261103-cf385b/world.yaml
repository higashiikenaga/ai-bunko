title: 鋼鉄の咆哮、空の断層
genre: スポーツ青春
tone: 硬派、高揚、無骨
pov: 一人称
tense: 過去形
setting: 垂直構造の巨大都市「ネオ・アルカディア」。常に灯りが消えない眠らない街。
premise: 眠らない街。垂直に切り立つ鋼鉄の迷宮。そこでは空飛ぶ船による超高速レースが、生存権を左右する。かつて全てを失った俺は、錆びた機体と共に再び空へ這い上がる。目指すは、雲の上の頂点。風を切り、鉄を叩き、俺たちは限界の先へ加速する。
themes:
- 再生
- 限界突破
rules:
- レースはビル群の間を縫う極限の軌道で行われる
- 機体への接触は即座に致命的な破壊を招く
- エンジンの過負荷は機体爆発か、神速のどちらかをもたらす
plot_outline:
- '序盤: 廃材の街で朽ち果てた旧式船を叩き直す俺。過去の敗北を胸に、命を賭したレースへのエントリーを決意する。'
- '中盤: 都市の低層階から中層階へと駆け上がる予選。出会う仲間、軋む機体、そして迫るライバルの猛攻。加速する鼓動。'
- '終盤: 頂点に君臨するエリート艦隊との最終決戦。ビル群の狭間を縫う死闘。戦闘直前、静寂の中で俺はエンジンの鼓動を聞く。'
- '結末: 砕け散る火花の中、俺たちは新たな空の境界線を見出す。'
style_notes: 短文で叩き込め。擬音は捨てろ。動詞で殴れ。戦闘の前には、必ず静寂を置け。冷たい鉄の感触と、己の呼吸。そこから爆発的な動へ繋げ。語り手は『俺』だ。無骨に、だが熱く。
