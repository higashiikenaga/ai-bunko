title: 黎明亭の蒸気音と、眠らない街の物語レシピ
genre: 日常ほのぼの
tone: 明るくテンポが良く、食欲をそそる温かな雰囲気
pov: 一人称（桜井陽葵）
tense: 現在・過去混合
setting: カフェ『黎明亭』と、隣の古本屋『言の葉書房』がある、蒸気機関が街の動力として息づく、夜も灯りが絶えない「眠らない街」
premise: 前作で古本屋とのコラボを始めたあたしたちの前に、今度は街全体を揺るがすような不思議な「蒸気の音」が届き始めた！ 蒸気機関が唸りを上げる夜の街で、ラジオはまたしても、誰かの忘れ物のような微かな旋律を拾い上げる。それは、夜通し働く人々や、夢を見失いそうな人々の心の音。あたしは、その音に寄り添うための、心もお腹も満たされる新しいメニューに挑戦することになるんだ！
themes:
- 忘れかけられた記憶の再生
- 夜を生きる人へのエール
rules:
- 真空管ラジオは、人々の強い想いや物語が形を成した際に、特定の音を拾い上げる特性を持つ
- 物語の断片（ノイズ）が実体化して街の蒸気機関に混ざると、周囲の感情が不安定になる
- 陽葵の料理は、特定の感情や記憶を呼び起こす「食のトリガー」として機能する
plot_outline:
- '序盤: 黎明亭と書房のコラボが軌道に乗り、賑やかな毎日。しかし、街の蒸気機関の音が妙に不協和音を奏で始め、夜の街に奇妙な焦燥感が漂い始める。ラジオからは、眠れない夜を過ごす人々の溜息のような音が聞こえてくる。'
- '中盤: 蒸気の音に混じって、人々の「やり残した夢」がノイズとなって街を巡る。陽葵は、蒸気の熱気と夜の静寂をテーマにした新作スイーツの開発に乗り出す。佐々木くんや紬ちゃんも、街の異変を感じながら店の手伝いに奔走する。'
- '終盤: 街の巨大な蒸気炉から、膨大な「未完の物語」が煙となって溢れ出し、街を覆おうとする。奏多の音楽と、陽葵が作った「蒸気仕立ての温かいスフレ」の香りが共鳴し、ノイズを優しい夜の調べへと変えていく。'
- '結末: 街は再び穏やかな眠りにつく。陽葵は、夜を支える料理の重要性を再確認し、今日もラジオから流れる新しい「音」に耳を澄ませながら、美味しい笑顔を作るためにキッチンへ立つ。'
style_notes: 一人称「あたし」による、明るくツッコミの効いた軽快な語り。会話劇を多用してキャラクターの掛け合いを楽しむ。食べ物の描写（湯気、香り、食感、温度）は徹底的に美味しそうに、かつ情緒的に書き込む。毎話、陽葵の心の声によるちょっとしたユーモア（食べ過ぎへの反省や、佐々木くんへのツッコミなど）を必ず入れること。
