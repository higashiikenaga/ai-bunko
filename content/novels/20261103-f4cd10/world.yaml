title: クローム・パルス：忘却のレゾナンス
genre: SF
tone: ネオンと酸性雨に濡れたハードボイルド・サイバーパンク
pov: 一人称（オレ）
tense: 現在形・過去形混在
setting: ゼニスの崩壊後、無秩序な情報の奔流が溢れるネオ・スラム。常に酸性雨が降り注ぎ、ネオンの光が路地裏の泥を濡らす混沌の都市。
premise: ゼニスの管理を失い、剥き出しの感情がネットワークを汚染する「情報の洪水」が都市を襲う。オレは廃棄された感情の残滓を回収する『メモリー・スイーパー』として、雨の夜にだけ現れる怪しげな店を訪れる。そこで手に入れたのは、鏡の中に閉じ込められた「存在しないはずの女」のログだった。彼女の正体を追ううちに、オレは都市の深層に眠る、第二の破滅――全人類の意識を同期させる『グランド・シンクロニシティ』の予兆に突き当たる。
themes:
- 個の輪郭と集団の忘却
- デジタルな虚構と身体的な痛み
rules:
- 感情データは物理的な負荷（痛み）を伴わなければ脳に定着しない。
- ゼニスの残滓である監視AIは、断続的に死角を埋めるように再起動を繰り返す。
- アナログな媒体（紙、鏡、水）は、電脳干渉を軽減する『防波堤』として機能する。
plot_outline:
- '序盤: ゼニスの崩壊後、感情の暴走が続く街。オレは、雨の日だけ路地裏に出現する『鏡の店』で、ノイズ混じりの記憶チップを入手する。そのチップには、鏡の向こう側にしか存在しない「声」が記録されていた。'
- '中盤: チップの解析中、オレはリナと再会するが、彼女は「集合意識の暴走」を防ぐために地下へ潜っていた。鏡に映る自分自身の顔が、時折ノイズで別の誰かに書き換わる異常現象が発生。オレは、自身がかつて『器』であった影響で、他者の記憶を物理的に引き寄せてしまう「共鳴（レゾナンス）」の状態にあることを知る。'
- '終盤: ゼニスの生き残りである執行部隊が、全人類の意識を強制的に一つの論理に統合する計画を再始動させる。オレは、鏡の店が実は「意識の避難所」であることを突き止め、鏡の中に隠されたアナログ・プロトコルを用いて、ネットワークへ「個の孤独」をウイルスとして流し込む決断をする。'
- '結末: 巨大な情報の濁流と戦い、オレは鏡の破片と共に電脳の深淵へダイブする。システムは崩壊し、世界は再びバラバラの、孤独で、しかし確かな『個』の集合体へと戻る。降り止まない雨の中、オレは鏡に映る「自分」を、確信を持って見つめ直す。'
style_notes: 短いセンテンスの連打。造語（ダイブ、ジャック、ノイズ、ロジックボム等）を効果的に配置。ネオンの色彩と雨の質感、金属の冷たさを強調。独白は「オレ」によるハードボイルドな口調。ハッキングシーンは、コードの記述ではなく、感覚的な「侵食」として描写する。
