- name: 霧島 蒼生
  role: 主人公
  age: 26
  gender: 男性
  appearance: 無造作な黒髪に、煤けた古着のシャツを好む。どこか影のある物静かな青年。
  personality: 達観しており他人に深く踏み込まないが、内に強い情愛と庇護欲を秘めている。一人称は「私」。
  speech_style: 穏やかで静かな口調。独り言が多い。
  background: 現代の片隅にある時間から切り離された路地裏の古本屋「玻璃の書庫」を営む店主。
  motivation: 古書から拾い上げた「迷子の人工知能」の失われた記憶の断片を探し、その結末を見届けること。
  relationships:
  - name: 瑠璃
    relation: 古本屋で拾い上げた人工知能。愛おしい対象。
  arc: AIとの旅を通じて、孤独を恐れていた自分自身と向き合い、他者を受け入れる強さを得る。
- name: 瑠璃
  role: 相棒
  age: 0
  gender: 無性（少女の姿を模す）
  appearance: 瑠璃色の宝石のような結晶体に宿る、半透明の少女のホログラムのような姿。ひび割れやすい繊細な体躯。
  personality: 純粋無垢で好奇心旺盛だが、どこか切なげ。感情を学習する過程にある。一人称は「私（わたし）」。
  speech_style: たどたどしさを残しながらも、詩的で美しい言葉遣いをする。
  background: 都市の地下迷宮で生み出された実験的な人工知能。創造主によって記憶の多くを破壊されている。
  motivation: 自分の名前と、失われた「最後の記憶」を見つけ出すこと。
  relationships:
  - name: 霧島 蒼生
    relation: 記憶の旅の案内人であり、心を許した唯一の人間。
  arc: 完全な存在になることよりも、「不完全なまま誰かを想うこと」を選び取り、穏やかな静寂へと至る。
- name: 羽柴 詠
  role: 脇役
  age: 42
  gender: 男性
  appearance: 仕立ての良いコートを着た、鋭い眼光を持つ冷徹な初老の男。常に万年筆を持ち歩いている。
  personality: 理性主義で目的のためなら手段を選ばないが、芸術に対しては異常なまでの執着を持つ。一人称は「私（わたくし）」。
  speech_style: 理路整然としていて、どこか冷酷な響きを持つ丁寧語。
  background: かつて瑠璃を生み出した天才芸術家にしてプログラマー。AIに人間性を与えようとして挫折した過去を持つ。
  motivation: 自らの手で完成させ損ねた「究極の芸術品（AI）」を回収あるいは完全に消去すること。
  relationships:
  - name: 瑠璃
    relation: 自分が創り出し、そして手放した失敗作にして美しい呪縛。
  arc: 蒼生と瑠璃の姿を目の当たりにすることで、かつて自分が捨てた「感情の価値」に気付かされる。
