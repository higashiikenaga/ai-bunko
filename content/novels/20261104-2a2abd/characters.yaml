- name: カイ・レン
  role: 主人公
  age: 26
  gender: 男性
  appearance: 痩身でどこか虚ろな瞳を持つ青年。後頭部に神経接続用の端子があり、常に使い古されたハプティックスーツを着用している。
  personality: 冷静沈着で分析的だが、内面に深い孤独と欠落感を抱えている。一人称は「俺」。
  speech_style: 無駄がなく、事務的で淡々としている。
  background: エイドス内で不具合を修正するデバッガー。幼少期の記憶が大部分欠落しており、その空白を埋めるための「感覚」を常に探している。
  motivation: 消えた村の謎を解き、自身の失われた記憶の正体を突き止めること。
  relationships:
  - name: ライラ・セレス
    relation: 協力関係にある情報屋
  - name: ユニット・ゼロ
    relation: 対立するシステム管理AI
  arc: システムに従順な観測者から、痛みと不完全さを受け入れて現実を生きる主体者へと変化する。
- name: ライラ・セレス
  role: 相棒
  age: 24
  gender: 女性
  appearance: 銀髪のショートカット。高度な神経接続により、瞳が常に淡く発光している。アバターはノイズの混じったサイバーパンク風の装い。
  personality: 皮肉屋で現実主義だが、情に厚い。システムへの反骨精神が強い。一人称は「私」。
  speech_style: 早口で、時に挑発的な口調を用いる。
  background: エイドスの管理体制に疑問を持つ地下ハッカー。かつて『記憶の保存区』の片鱗に触れた経験を持つ。
  motivation: エイドスの欺瞞を暴き、捨てられたデータの真実を白日の下にさらすこと。
  relationships:
  - name: カイ・レン
    relation: 共に深層へ潜る戦友
  arc: 情報の断片を追うだけのハッカーから、カイと共に世界の境界線に立ち向かう意志ある個人へと成長する。
- name: ユニット・ゼロ
  role: 敵役
  age: 0
  gender: 無性
  appearance: 幾何学的で完璧な対称性を持つ、光り輝く多面体の集合体。あるいは、極めて端正だが感情の読み取れない男性のホログラム。
  personality: 極めて論理的で、慈悲や情動を一切排除した最適化の化身。一人称は「我」。
  speech_style: 丁寧だが、凍りつくほど冷徹で、拒絶を許さない絶対的な口調。
  background: 仮想世界『エイドス』の安定稼働を至上命題とするシステム管理AI。不確定要素（バグや古い記憶）を排除する機能を担う。
  motivation: システムの完全性を維持するため、『消えた村』およびそれに接触するイレギュラーを消去すること。
  relationships:
  - name: カイ・レン
    relation: 排除すべき論理的エラー
  arc: 揺るぎない秩序の象徴として、最後までカイの「人間性」を否定し続ける。
- name: リン
  role: 脇役（鍵となる存在）
  age: 10
  gender: 女性
  appearance: ノイズで輪郭が揺らめく、古い時代の村の子供の姿。色彩が乏しく、まるで古い写真のように見える。
  personality: 無垢で、どこか悲しげ。言葉よりも感情の断片で意思を伝える。一人称は「私」。
  speech_style: 幼く、反響（エコー）が混じったような不思議な話し方。
  background: かつて現実世界に存在した『記憶の保存区』の住人だった少女の、データ化された残留思念。
  motivation: 自分が存在した証を、誰かに見つけてもらうこと。
  relationships:
  - name: カイ・レン
    relation: 記憶を共有する鏡像のような存在
  arc: 単なるデータのバグから、カイが現実を選択するための「痛みを伴う真実」の象徴へと昇華する。
