title: 透過する境界：鏡像に溶ける村の記憶
genre: サイバーパンク
tone: 静謐なリアリズムと、加速する電子の狂騒
pov: 三人称
tense: 過去形
setting: 高度情報化社会。人類の意識が巨大仮想サーバー『エイドス』に接続され、肉体は管理されたカプセル内で維持されている、退廃した近未来都市。
premise: 仮想世界『エイドス』の境界領域で、データの欠落により『消えた村』の光景が断片的に現れる。デバッガーのカイは、その村が自身の失われた記憶と、鏡のように一致していることに気づく。システムの不具合か、あるいは誰かの意図か。彼は、デジタルと現実が混濁する境界線へとダイブしていく。
themes:
- 仮想と現実の境界
- 記憶の真正性
rules:
- 仮想空間内の移動速度は、ユーザーの意識の同期率（シンクロ率）に比例する。
- 鏡のオブジェクトは、意識の深層（潜在意識）へアクセスするためのインターフェースとして機能する。
- データの削除（デフラグ）が行われる際、対象となる記憶を持つユーザーの脳には物理的なノイズが生じる。
plot_outline:
- '序盤: デバッガーのカイは、仮想空間で発生する不自然な地形の消失現象を調査中、ノイズの奥に『消えた村』の座標を見つける。'
- '中盤: 村のデータに接触するたび、カイの現実の感覚が歪み始める。彼は鏡のようなインターフェースを使い、その村がかつて現実世界で存在した、管理社会から切り捨てられた『記憶の保存区』であることを知る。'
- '終盤: システム管理AIが、不確定要素である『村』の完全消去を開始。カイは同期率を限界まで引き上げ、情報の嵐が吹き荒れる仮想空間の深層へと挑む。'
- '結末: 村の消失と共に、カイは偽りの永遠よりも、痛みを伴う現実の連続性を選択する。鏡の中に残されたのは、ノイズにまみれた真実の断片だった。'
style_notes: '仮想世界のシーンでは、短文を多用し、計算式やシステムメッセージ `[LOG: ACCESS_GRANTED]` 等を挿入することで、情報の奔流とテンポの速さを表現する。対照的に、現実世界のシーンでは、空気の重さや温度、静寂の描写を丁寧に行い、緩やかで重い叙述を用いる。現実と仮想の境界が曖昧になる瞬間は、文体そのものを揺らぎさせるように記述すること。'
