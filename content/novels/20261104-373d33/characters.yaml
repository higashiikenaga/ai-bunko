- name: カイト・アルトス
  role: 主人公
  age: 17
  gender: 男性
  appearance: 癖のある茶髪に飛行用ゴーグルを頭にかけている。油汚れのついたつなぎを着用し、常に工具ポーチを腰に下げている。
  personality: 好奇心旺盛で真っ直ぐな性格。機械に対する情熱が人一倍強く、困難な状況でも「直せばなんとかなる」と考える楽観主義者。一人称は「僕」。
  speech_style: 快活でエネルギッシュ。興奮すると機械の専門用語が混ざった早口になる。
  background: 浮遊島の辺境で整備士として働いていたが、古い設計図を解読することに没頭していた。ある日、帝国の追っ手から逃げてきた「名前のない猫」を拾ったことで運命が変わる。
  motivation: 世界の真実を解き明かすことと、伝説の飛空艇『スカイ・ストライダー』を完璧に完成させ、どこまでも自由に飛びたい。
  relationships:
  - name: 名前のない猫
    relation: 運命的な相棒
  - name: リラ・ヴァレンティナ
    relation: 信頼し合う操縦士
  arc: 単なる機械好きの少年から、仲間と共に世界の運命を背負い、停滞した時代に風を吹かせるリーダーへと成長する。
- name: 名前のない猫
  role: 相棒/ガイド
  age: 0
  gender: 不明
  appearance: 透き通るような銀色の毛並みを持ち、瞳の中に星空のような紋様が浮かんでいる。首に古びた青いリボンを巻いている。
  personality: 達観しており、時に皮肉屋だが、根は深い慈愛を持っている。人間を導く導き手としての自覚がある。一人称は「私」。
  speech_style: 古風で静かな口調。テレパシーで直接相手の意識に語りかける。
  background: 地下図書館の番人であり、世界の記憶を管理する高次元の存在。記憶の封印を解く鍵を保持しており、それを託せる人間を探していた。
  motivation: 世界の記憶を正しく継承させ、帝国による歴史の改竄を阻止すること。
  relationships:
  - name: カイト・アルトス
    relation: 導くべき後継者
  arc: 永劫の孤独の中で番人を務めていたが、カイトたちとの旅を通じて、不完全ながらも温かい人間との絆に価値を見出す。
- name: リラ・ヴァレンティナ
  role: 仲間/操縦士
  age: 20
  gender: 女性
  appearance: 鋭い眼差しを持つ金髪のショートヘア。帝国軍の制服を自由に改造した軽装に、赤いマフラーを巻いている。
  personality: クールで現実主義。責任感が強く、プロとしての誇りが高い。ぶっきらぼうだが、実は年下のカイトを妹のように気にかけている。一人称は「私」。
  speech_style: 簡潔で断定的な話し方。時折、呆れたようにため息をつく。
  background: 元帝国軍のエースパイロットだったが、軍が隠蔽していた「消された島々」の真実を知り、軍を脱走した反逆者。
  motivation: 帝国による空の支配を終わらせ、誰もが自由に空を飛べる世界を取り戻すこと。
  relationships:
  - name: カイト・アルトス
    relation: 危なっかしいが才能ある整備士
  - name: ゼノス・ヴァン・クロムウェル
    relation: かつての上官であり、憎むべき宿敵
  arc: 過去の裏切りに対する罪悪感に苛まれていたが、カイトの純粋な情熱に触れ、再び自分の意志で空を飛ぶ喜びを取り戻す。
- name: ゼノス・ヴァン・クロムウェル
  role: 敵役
  age: 42
  gender: 男性
  appearance: 整えられた白髪に冷徹な青い瞳。隙のない完璧な軍服を纏い、常に白い手袋を着用している。
  personality: 完璧主義で傲慢。秩序こそが唯一の正義であり、そのためには少数の犠牲や歴史の改竄も厭わない。一人称は「私」。
  speech_style: 極めて丁寧だが、言葉の端々に相手を見下す傲慢さが滲み出ている。
  background: 帝国の軍事力を統括する最高司令官。地下図書館の力を利用して世界の理を書き換え、永遠に揺るぎない帝国を築こうと企む。
  motivation: 混沌とした世界を完全に管理下に置き、自らが定義する「完璧な秩序」を実現すること。
  relationships:
  - name: リラ・ヴァレンティナ
    relation: 最も優秀だったが裏切った元部下
  - name: カイト・アルトス
    relation: 計画を乱す不確定要素であり、排除対象
  arc: 絶対的な力と論理で世界を支配しようとするが、計算不可能な「絆」と「情熱」の力に敗北し、自らの空虚さに気づかされる。
