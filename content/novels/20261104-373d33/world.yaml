title: 蒼穹のレジスタンス ―星図に刻む銀翼の航路―
genre: 異世界ファンタジー
tone: 爽快感溢れる冒険活劇、機械と風の躍動感
pov: 三人称
tense: 過去形
setting: 前作の激闘から一年後。記憶が解放されたことで空が色彩を取り戻したが、各地で「星の欠落」と呼ばれる異常気象が発生している浮遊大陸世界。
premise: 帝国の崩壊後、自由な空を取り戻したカイトとリラだったが、空に浮かぶはずの星座が次々と消え去る謎の現象に直面する。カイトは再構築した『スカイ・ストライダー』を駆り、失われた星々を導くための「失われた星図」を探す旅に出る。古本屋に隠された古い航海記を頼りに、彼らは雲海を突き抜け、宇宙の果てへと続く未知の風へと飛び込んでいく。
themes:
- 失われた地図の再生
- 未知への好奇心と絆
rules:
- 星図（スターチャート）は、飛空艇のエンジンを駆動させるための高次エネルギーの設計図として機能する
- 風の流れは世界の記憶と連動しており、記憶が薄れる場所では気流が死滅する
- 飛空艇の機体と操縦者のシンクロ率が高まるほど、機体は物理法則を超えた加速が可能になる
plot_outline:
- '序盤: 穏やかな空での日常。カイトは『スカイ・ストライダー』のメンテナンスに明け暮れているが、空の星座が消える現象に気づく。リラと共に、風の道が途絶えつつあることを察知し、原因を探るため古い古本屋で「星を綴る者」の伝承を見つける。'
- '中盤: 星図の断片を求め、雲の上の廃墟や高度な気流が渦巻く領域を突破する。旅の中で、星の力を利用して新たな秩序を作ろうとする新勢力「天体観測団」と衝突。カイトたちは仲間たちと連携し、激しい空中戦を繰り広げながら、星図が物理的な物質ではなく、空の記憶そのものであることを知る。'
- '終盤: 星図の完成には、かつて猫が守っていた「世界の核」となる光が必要だと判明。カイトとリラは、巨大な星の残骸が漂う「星降る海」へと突入する。迫りくる天体観測団の超大型戦艦を、スカイ・ストライダーの極限シンクロによる加速で突破し、星の核へと到達する。'
- '結末: カイトは星図を空に再び描き直し、失われた星座と気流を世界に呼び戻す。空には再び眩い光が満ち、星々は本来の軌道を取り戻す。カイトとリラは、新たな星図が示す「まだ見ぬ空の果て」を目指し、仲間と共に風を切って飛び立っていく。'
style_notes: 空を切り裂く風の音、エンジンが奏でる機械の鼓動、そして翼が風を掴む瞬間の爽快感を、擬音や躍動感のある動詞を多用して描写する。キャラクター同士の信頼関係が、機体の出力に直結する熱い展開を重視すること。
