- name: レオン・アルトワ
  role: 主人公
  age: 16
  gender: 男性
  appearance: オイル汚れのついたオーバーオールに、額に跳ね上げた真鍮製のゴーグルがトレードマーク。器用で細い指先を持つ。
  personality: 好奇心旺盛で誠実。機械への愛情が深く、困っている人を放っておけないお人好し。一人称は「僕」。
  speech_style: 丁寧だが、機械の話になると早口で熱っぽく語る。
  background: 辺境の修理街で育ち、独学で蒸気機関の整備技術を習得した少年。古い機械に宿る「記憶」を大切にしている。
  motivation: 秘密の地図が指し示す「約束の丘」へ辿り着き、世界の真実を知ること。
  relationships:
  - name: リラ
    relation: 旅の相棒であり、互いの才能を認め合う信頼関係
  - name: バーン
    relation: 対立する宿敵だが、技術者としての矜持は認め合っている
  - name: マーサ
    relation: 恩師であり、精神的な支えとなる店主
  arc: 単なる「修理屋」という殻を破り、世界を繋ぐ「航路の開拓者」へと成長する。
- name: リラ・エトワール
  role: 相棒
  age: 17
  gender: 女性
  appearance: 風に舞う琥珀色のドレスを纏い、小型の蒸気オルガンを背負っている。透き通るような青い瞳が特徴。
  personality: 自由奔放で楽観的だが、各地の文化や歴史に精通している博識家。一人称は「私」。
  speech_style: 歌うようなリズム感のある話し方。時折、詩的な表現を混ぜる。
  background: 雲海の各地を巡り、失われた旋律を集めている旅の音楽家。風の流れを読み取る特殊な能力を持つ。
  motivation: 世界に散らばる「琥珀の旋律」を完成させ、空の調和を取り戻すこと。
  relationships:
  - name: レオン・アルトワ
    relation: 彼の純粋さと技術に惹かれ、旅に同行することを決めた
  arc: 孤独な旅人だったが、レオンとの出会いを通じて「誰かと共に歩む喜び」を知る。
- name: バーン・ガスト
  role: 敵役
  age: 38
  gender: 男性
  appearance: 豪奢な船長コートを羽織り、右腕に巨大な真鍮製の義手を持つ。鋭い眼光と口元の傷が威圧感を放つ。
  personality: 傲慢で強欲だが、実力主義者。力こそが正義だと信じている。一人称は「俺」。
  speech_style: 尊大で命令調。相手を挑発するような皮肉屋。
  background: 元帝国海軍の精鋭だったが、軍を離脱し空賊団を組織。効率と支配による「完璧な空の秩序」を追い求めている。
  motivation: 「約束の丘」の力を手に入れ、全ての浮遊島を支配下に置くこと。
  relationships:
  - name: レオン・アルトワ
    relation: 自分にはない「機械への愛」を持つレオンを、忌々しくも羨ましく思っている
  arc: 絶対的な力への執着に敗れ、真の絆や繋がりの価値に気づかされる。
- name: マーサ・クロー
  role: 脇役
  age: 55
  gender: 女性
  appearance: 丸い眼鏡に、機能的なポケットがたくさんついたエプロン姿。常にシナモンと機械油の香りを漂わせている。
  personality: 厳格だが慈愛に満ちた女性。レオンにとっての母のような存在。一人称は「私」。
  speech_style: 落ち着いた口調で、核心を突く助言を授ける。
  background: 辺境の街で古い道具店を営む店主。かつて「約束の丘」を目指した旅人の末裔であり、地図の守護者であった。
  motivation: 次世代の若者が、失われた航路を正しく修復し、世界に平和を取り戻すこと。
  relationships:
  - name: レオン・アルトワ
    relation: 才能を見出し、旅立ちを後押しした師匠のような存在
  arc: 地図を託したことで、自身の使命を完遂し、静かに次世代へバトンを渡す。
