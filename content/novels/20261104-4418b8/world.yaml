title: 真鍮の翼と、琥珀の旋律
genre: スチームパンク冒険
tone: 穏やかで叙情的な旅情、ノスタルジックな冒険
pov: 一人称（僕）
tense: 過去形
setting: 無数の浮遊島が雲海に浮かぶ世界。蒸気機関を動力とする飛行艇が島々を繋ぎ、空の色は時間によって琥珀色や瑠璃色へと美しく移ろう。
premise: 壊れた機械を修理しながら空を渡る少年、レオンは、ある古い道具店で「蒸気の熱を当てると模様が浮かび上がる秘密の地図」を手に入れる。その地図が指し示す先は、伝説の場所とされる「約束の丘」。レオンは、未知の風と、各地で出会う温かな料理、そして不思議な人々との交流を糧に、空の最果てを目指す旅へと漕ぎ出す。
themes:
- 再会と約束
- 未知なる土地への憧憬
rules:
- 浮遊島の高度と位置は、季節ごとの蒸気流（エア・ストリーム）によって周期的に変化する
- すべての機械装置は、高圧の蒸気と特定の鉱石による心臓（コア）を必要とする
- 雲海の下には深い霧が立ち込め、そこへ降りた者は二度と戻れないとされる
plot_outline:
- '序盤: 辺境の修理街で、レオンが古い地図を手に入れる。地図の導きに従い、古い飛行艇を整備して、初めての雲海への旅立ちを決意する。'
- '中盤: 地図が示す航路を辿り、様々な浮遊島を巡る。雲の上で採れる果実を使った料理や、風を鎮めるための独特な儀式など、多様な文化に触れながら、旅の仲間となる少女と出会う。'
- '終盤: 地図の真の目的が、世界を繋ぐ失われた航路を修復することだと判明。地図を狙う空賊団との激しい空中戦を、レオンの修理技術と仲間との絆で乗り越える。'
- '結末: ついにたどり着いた「約束の丘」で、かつて人々が交わした約束の真意と、世界の成り立ちを知る。空はどこまでも広く、レオンは新しい航路を記すために再び旅立つ。'
style_notes: 「僕」を主語とした、旅日記のような穏やかな語り口。空の色、蒸気の匂い、風の感触といった風景描写を豊かに綴ること。各話の終盤には、必ずその土地特有の料理（例：雲海蒸しパン、琥珀色の果実酒）や、その土地ならではの風習を詳細に記述し、旅の彩りを与えること。
