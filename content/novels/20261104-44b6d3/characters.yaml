- name: マルタ・ハンス
  role: 主人公
  age: 72
  gender: 女性
  appearance: 穏やかな眼差しと深い笑い皺。銀髪を後ろで丁寧にまとめ、使い込まれた革のエプロンを常に身につけている。手は節くれ立っているが、非常に器用で落ち着いている。
  personality: 冷静沈着で慈愛に満ちている。物の「声」を聞くことができるような観察眼を持つ。一人称は「私」。
  speech_style: ゆったりとしていて、相手を包み込むような優しい敬語。語尾に「〜ね」「〜ですよ」を多用する。
  background: 雲の街の片隅で、代々続く修理屋を営む。かつては空の航海士だったが、今は静かな暮らしを好んでいる。
  motivation: 壊れた道具に再び命を吹き込み、それを持つ人々の止まった時間を動かすこと。
  relationships:
  - name: レオ
    relation: 弟子
  - name: エリアス
    relation: 依頼人
  arc: 日常のルーチンの中に、新しい世代への継承と、過去の記憶を癒やすという新たな使命を見出す。
- name: エリアス・ヴァレンティン
  role: 主要登場人物（依頼人）
  age: 75
  gender: 男性
  appearance: 日焼けした肌と、厳しい空の旅を物語る鋭い目つき。古びた飛行士のジャケットを愛用している。
  personality: 寡黙で少し頑固。過去の出来事に囚われ、感情を外に出すことを避けている。一人称は「私」。
  speech_style: 低く、少し掠れた声。言葉数が少なく、要件だけを短く伝える。
  background: かつて伝説的な飛行船の船長だったが、ある事故をきっかけに空を離れ、今は静かに隠居生活を送っている。
  motivation: 止まったままの懐中時計を直し、自分自身が忘れてしまった「空への情熱」と向き合うこと。
  relationships:
  - name: マルタ
    relation: 修理屋
  - name: シルヴィ
    relation: 孫
  arc: 修理された時計と共に、凍りついていた過去の記憶を認め、再び前を向いて生きる決意をする。
- name: レオ
  role: 脇役（相棒）
  age: 13
  gender: 男性
  appearance: 元気いっぱいの少年。常にゴーグルを額にかけており、頬には機械油の汚れがついていることが多い。
  personality: 好奇心旺盛で猪突猛進。技術への関心が強く、マルタの教えを真剣に吸収しようとする。一人称は「僕」。
  speech_style: 早口で活気がある。専門用語を使いこなそうとして、時々間違える愛嬌がある。
  background: 雲の街の孤児院出身。マルタの修理技術に憧れ、弟子として居候している。
  motivation: マルタのような、人の心まで直せる立派な修理職人になること。
  relationships:
  - name: マルタ
    relation: 師匠
  arc: 単なる「機械の修理」と、持ち主の「思いを直すこと」の違いを学び、職人としての精神性を理解していく。
- name: シルヴィ
  role: 脇役（きっかけを与える者）
  age: 8
  gender: 女性
  appearance: ふわふわとした髪に、小さな飛行士風の帽子を被っている。瞳が大きく、好奇心に満ちている。
  personality: 天真爛漫で、純粋無垢。周囲の空気を明るくする力がある。一人称は「わたし」。
  speech_style: 明るく、語尾が跳ねるような話し方。質問攻めにする癖がある。
  background: エリアスの孫娘。おじいちゃんの元気がないのを心配し、壊れた模型をマルタの元へ持っていく。
  motivation: おじいちゃんを笑顔にすること、そして壊れた模型がまた飛ぶこと。
  relationships:
  - name: エリアス
    relation: 祖父
  - name: マルタ
    relation: 親切なおばあさん
  arc: 自分が持ち込んだものが、大人たちの心を動かす大きな力を持っていることを、無意識のうちに実感する。
