title: 雲の上の修理屋と、止まった時間のおやつ
genre: 日常ほのぼの
tone: 湯気が立ち上るような、穏やかで優しい雰囲気
pov: 三人称
tense: 過去形
setting: 浮遊島が点在する、風の穏やかな空の街。古い飛行船が生活の足となる世界。
premise: 雲の切れ間に浮かぶ小さな島で、壊れた道具を直す「空の修理屋」を営む老婦人の物語です。彼女の手元にはいつも、使い込まれた道具と、香ばしい小麦の匂いが漂っています。ある日、彼女のもとに、持ち主を失い針が止まったままの懐中時計と、小さな空飛ぶ船の模型が持ち込まれます。壊れたものと向き合い、丁寧に時を刻み直すことで、持ち主たちの止まっていた心も少しずつ動き出していきます。
themes:
- 物の記憶と再生
- 日常のささやかな幸せ
rules:
- 空飛ぶ船は風の魔法によって浮力を得ており、定期的なメンテナンスが必要である
- 壊れた時計は、持ち主の強い未練や記憶を宿すことがある
plot_outline:
- '序盤: 雲の街の片隅で、修理屋のマルタが丁寧に茶を淹れ、道具を磨く日常。止まった懐中時計を預かる。'
- '中盤: 時計を直す過程で、その持ち主がかつて空飛ぶ船で旅をしていた記憶に触れる。折れた部品を一つずつ、温かいスープを飲みながら丹念に作り直す。'
- '終盤: 時計が再び時を刻み始めると同時に、かつての持ち主が訪れる。修理された時計と、マルタが作った焼き立てのスコーンが二人の時間を繋ぐ。'
- '結末: 修理された道具たちは新しい持ち主のもとへ。マルタはまた次の湯気を立てながら、新しい依頼を待つ。'
style_notes: 白湯 ぬくみの文体を徹底すること。煮込み料理の香ばしい匂いや、布を拭く手触り、お茶を注ぐ音などの五感を刺激する描写を細かく入れる。語り手は読者に対し、「さあ、どうぞ。温かいうちに」と、まるで隣に座って食事を勧めるような、慈しみ深い態度で語りかけること。
