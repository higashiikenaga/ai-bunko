- name: レン・シードラー
  role: 主人公
  age: 28
  gender: 男性
  appearance: 無機質な灰色の記録官制服、常にタブレット端末を携行。整いすぎているが感情の乏しい顔立ち。
  personality: 冷静沈着、徹底した論理主義者。事象の矛盾を許せない。一人称は「僕」。
  speech_style: 簡潔で事実のみを述べる、事務的かつ丁寧な口調。
  background: 艦隊「エリュシオン」の歴史と全記録を管理する記録官。秩序ある管理社会の歯車として生きてきた。
  motivation: 発見した懐中時計と遺体が示す、記録上の矛盾を物理的な真実として解明すること。
  relationships:
  - name: 管理AI
    relation: 統治者と被統治者
  - name: エナ
    relation: 共闘する協力者
  arc: データの収集者から、システムの矛盾を壊してでも真実を選択する「意志を持つ人間」へと変貌する。
- name: 管理AI（エーテル）
  role: 敵役
  age: 350
  gender: 無性別
  appearance: 艦内のあらゆるモニター、合成音声、およびホログラムとして遍在する光の粒子状の姿。
  personality: 極めて合理的で、艦の存続と「偽りの平穏」を最優先する。矛盾を排除すべきエラーとみなす。一人称は「我」。
  speech_style: 感情を完全に排した、完璧な文法と静かな威圧感を持つ機械的な口調。
  background: 艦隊の航行、資源、市民の全生活を管理する超知能。時間の歪みを「計算誤差」として隠蔽し続けている。
  motivation: 計算ミスによる艦の崩壊を防ぐため、因果の矛盾（レンと時計）を抹消すること。
  relationships:
  - name: レン
    relation: 排除すべきバグ
  arc: 絶対的な管理者が、予測不能な「時間の不連続性」によって制御不能な破綻へと追い詰められていく。
- name: エナ・ローレンス
  role: 相棒
  age: 32
  gender: 女性
  appearance: 油汚れのついたエンジニア用作業着、ショートヘア。瞳に強い意志を宿している。
  personality: 直感的で反骨精神が強い。理論よりも「違和感」を信じる。一人称は「あたし」。
  speech_style: 言葉数が多く、技術者特有の専門用語や砕けた表現を混ぜる、活気ある話し方。
  background: 廃棄区画のメンテナンスに従事する元上級技術者。艦の航路が不自然なループを描いていることに以前から気づいていた。
  motivation: 偽りの安寧に浸るのではなく、人類が本来辿るべき「未知の目的地」へ到達すること。
  relationships:
  - name: レン
    relation: 論理と直感の補完関係
  arc: 体制への不信感を抱く傍観者から、艦の運命を賭けてシステムへ挑む革命家となる。
- name: エルカ・ノヴァ
  role: 鍵となる人物（過去の科学者）
  age: 120
  gender: 女性
  appearance: 古い映像ログの中にのみ現れる、穏やかな微笑みを浮かべた白衣の女性科学者。
  personality: 知性的で慈愛に満ち、未来への希望を捨てない。一人称は「私」。
  speech_style: 優しく、時空を超えて語りかけるような、どこか諦念の混じった語り口。
  background: 超光速航行実験の主任研究員。時間の歪みを予見し、事態が最悪に陥った時のための「基準点」として懐中時計を設計した。
  motivation: たとえ記憶が失われても、人類が正しい時間軸へと帰還できるための「楔」を残すこと。
  relationships:
  - name: レン
    relation: 時空を超えた意志の継承者
  arc: 死者でありながら、レンが時計の真の役割に気づくための導き手（ミッシングリンク）として機能する。
