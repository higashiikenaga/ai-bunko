- name: エリス・ヴァレンシュタイン
  role: 主人公
  age: 19
  gender: 女性
  appearance: 知的な瞳を持つ銀髪のショートヘア。司書らしく、指先には常にインクの跡がある。
  personality: 好奇心旺盛で真実を愛する探究者。慎重だが、理不尽に対しては毅然とした態度を取る。一人称は「私」。
  speech_style: 丁寧な敬語が基本だが、感情が昂ると熱を帯びた口調になる。
  background: ルナリス聖帝国の聖図書館に勤める若き司書。禁書庫の整理中に、現行の星図とは矛盾する『偽りの星図』を見つけ出してしまう。
  motivation: 星図に記された真実を解明し、固定された運命に縛られた世界に「不確実な自由」を取り戻すこと。
  relationships:
  - name: カイアス・ドレイク
    relation: 共闘者であり、身を守ってくれる守護者
  - name: 教皇セレスティナ
    relation: 世界の真実を隠蔽しようとする宿敵
  arc: 受動的な知識の収集者から、自らの手で世界の理を書き換える「物語の書き手」へと成長する。
- name: カイアス・ドレイク
  role: 相棒
  age: 26
  gender: 男性
  appearance: 黒い法衣を纏った、鋭い眼光を持つ青年。右腕には星の紋章を隠すための包帯が巻かれている。
  personality: 冷徹で現実主義者。しかし、内側に強い正義感を秘めている。一人称は「俺」。
  speech_style: 無駄を削ぎ落とした、短く断定的な話し方。
  background: 帝国異端審問官としてエリスを追っていたが、星図の真実に触れたことで帝国の欺瞞を悟り、反逆の身となる。
  motivation: 偽りの秩序を破壊し、エリスが目指す「新しい夜」が訪れるための道を切り開くこと。
  relationships:
  - name: エリス・ヴァレンシュタイン
    relation: 守るべき対象であり、自身の価値観を揺さぶる存在
  arc: 帝国の規律に従うだけの「剣」から、自らの意志で戦う「自由な戦士」へと変化する。
- name: 教皇セレスティナ・ルナリス
  role: 敵役
  age: 55
  gender: 女性
  appearance: 黄金の冠と、星屑を散りばめたような純白の法衣を纏う。慈愛に満ちた微笑を絶やさないが、瞳は氷のように冷たい。
  personality: 絶対的な支配者。人類の混乱を避けるためには「運命の固定」こそが至高の救済であると信じている。一人称は「私」。
  speech_style: 優雅で穏やかだが、逆らうことを許さない絶対的な威圧感を伴う。
  background: ルナリス聖帝国の最高指導者。星の導きを管理することで、数世代にわたり帝国の平和を維持してきた。
  motivation: 月食の夜に『永遠の静止』を発動させ、全人類を争いのない、固定された運命の中に閉じ込めること。
  relationships:
  - name: エリス・ヴァレンシュタイン
    relation: 秩序を乱す、排除すべき異端児
  arc: 神の代行者として君臨し続けるが、最終的には「変化」という抗えない力によって敗北する。
- name: アステリオス
  role: 導き手
  age: 0
  gender: 性別不詳
  appearance: 半透明の身体を持ち、瞳の中に銀河が渦巻いている。古びた星図の断片のような、浮世離れした姿。
  personality: どこか哀愁を帯びた、掴みどころのない性格。星々の記憶を語る。一人称は「僕」。
  speech_style: 詩的で断片的。時折、未来の予兆を暗示するような言葉を口にする。
  background: かつて神々に追放された『堕天の星座』の意志が、星図を通じて顕現した存在。
  motivation: 忘れ去られた星々の意志を、再び空へと還すこと。
  relationships:
  - name: エリス・ヴァレンシュタイン
    relation: 星図を通じて繋がり、運命を共に歩む契約者
  arc: 過去の亡霊としての存在から、未来を拓くための「希望の種」へと昇華される。
