title: 天球の枷と、黄昏に綴られた禁書
genre: 伝奇
tone: 格調高く、神話的で重厚な雰囲気
pov: 三人称
tense: 過去形
setting: 星辰の導きが絶対視される神権国家「ルナリス聖帝国」。天球儀と古書が立ち並ぶ大図書館と、星も見えぬ深い地下迷宮。
premise: 帝国の歴史から抹消された「失われた星座」を記した禁断の星図。若き司書がその星図を手にしたとき、止まっていた世界の時計が動き出す。月食の夜、天の枷が外れ、地上の理を塗り替える古き神々の再臨が始まる。運命という名の鎖に抗い、彼は空に新たな物語を刻もうとする。
themes:
- 運命への抗い
- 失われた歴史の再構築
rules:
- 魔法は天球の配置に連動する『星辰共鳴』によって行使される。
- 月食の間は星の加護が消失し、同時に禁忌の術式が起動可能になる。
- 星図に記された星座を地上で再現（儀式化）することで、現実を改変できる。
plot_outline:
- '序盤: 帝国の禁書庫で、現世の星空とは異なる『偽りの星図』を発見した司書エリスが、それを追う異端審問官に追われる。'
- '中盤: 星図の真意が、かつて神々に追放された『堕天の星座』の復活であることを知り、エリスは各地の聖地を巡り欠けた星の断片を集める。'
- '終盤: 全世界的な月食が起こる夜、帝国の頂点に立つ教皇が星図を奪い、全人類を固定された運命に縛り付ける『永遠の静止』を企てる。'
- '結末: エリスは自らの命を触媒に星図を書き換え、星々に自由な意志を返還させる。世界は不確実だが希望ある『新しい夜』を迎える。'
style_notes: 竜胆 アルト特有の、重厚な叙事詩のような文体。地の文では『悠久の時を刻む』『深淵なる静寂』など、格調高い語彙を多用し、世界の奥行きを演出する。作中には『星の詩篇』などの架空の伝承を断片的に引用し、歴史的裏付けを持たせる。会話文は、高潔な騎士、傲慢な教皇、知的な司書など、身分と性格に応じた厳格な口調の書き分けを行う。
