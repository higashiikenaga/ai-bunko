- name: エライアス・ヴァン・クロムウェル
  role: 主人公
  age: 22
  gender: 男性
  appearance: 灰色の瞳と、没落の証である汚れの目立つ黒い外套。細身だが、記憶収集の道具を扱う手は器用で、どこか冷徹な印象を与える。
  personality: 現実主義的で皮肉屋。しかし、心の底では「失われたもの」への強い執着と、不条理な世界への憤りを抱いている。一人称は「僕」。
  speech_style: 事務的で淡々としているが、感情が昂るとかつての貴族的な端正な口調が混じる。
  background: かつては名門貴族の嫡子だったが、家門の記憶を「忘却」させられ、地位も家族の記憶もすべてを失い、現在は記憶収集屋として泥を啜る生活を送っている。
  motivation: 家族の記憶の断片を探し出し、都の支配層が隠蔽した「創世の記憶」の真実を暴くこと。
  relationships:
  - name: ライラ・セレスティア
    relation: 共に真実を追う相棒であり、唯一心を許せる存在
  - name: 大司祭ヴァレリウス
    relation: 自身の人生を奪った、都の欺瞞を象徴する宿敵
  arc: 過去の喪失に囚われ、他者の記憶を「拾い集めるだけ」の傍観者から、自らのすべてを賭けて世界の夜明けを「創り出す」決断者へと成長する。
- name: ライラ・セレスティア
  role: 相棒
  age: 18
  gender: 女性
  appearance: 星屑のような輝きを持つ銀髪と、透き通るような青い瞳。どこか浮世離れした、儚げで神秘的な美しさを持つ。
  personality: 明るく好奇心旺盛だが、時折、深い虚無感を見せる。世界の仕組みに疑問を抱く直感的な性質。一人称は「私」。
  speech_style: 穏やかで、相手を包み込むような優しい話し方。時折、詩的な比喩を用いる。
  background: 記憶の闇市場で見つかった、出所不明の少女。彼女自身が、エライアスが手にした「空白の記憶結晶」と共鳴する特殊な資質を持っている。
  motivation: 自分が何者であるかを知り、記憶が商品として扱われない、本当の意味での「自由」を見つけること。
  relationships:
  - name: エライアス・ヴァン・クロムウェル
    relation: 過酷な運命を共に歩む、最も信頼するパートナー
  arc: 自分が世界の「鍵」であるという残酷な運命を受け入れ、エライアスの決断を支える精神的な支柱へと変化する。
- name: 大司祭ヴァレリウス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 眩いばかりの白銀の法衣を纏い、黄金の瞳を持つ。威厳に満ちた、神々しいまでの容姿。年齢を感じさせない若々しさがある。
  personality: 徹底した功利主義者。都市の安寧と秩序のためなら、個人の記憶や命を犠牲にすることを「慈悲」と考えている。一人称は「私」。
  speech_style: 慈愛に満ちており、常に相手を導くような高潔な口調だが、その内容は極めて冷酷な論理に基づいている。
  background: 不眠の都オフィールの最高指導者。「不滅の灯台」の管理を通じて、人々から「苦痛を伴う記憶」を奪い、偽りの平和を維持してきた。
  motivation: 世界の覚醒（＝混乱と苦痛）を阻止し、管理された永遠の夜による完璧な秩序を維持すること。
  relationships:
  - name: エライアス・ヴァン・クロムウェル
    relation: 秩序を乱し、偽りの夜を終わらせようとする危険な異分子
  arc: 変化を拒む「停滞の守護者」として、エライアスの掲げる「痛みのある真実」と真っ向から対立し、物語の終焉までその信念を貫く。
