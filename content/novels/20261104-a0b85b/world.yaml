title: 天蓋の断絶と、忘却の祭壇に捧ぐ挽歌
genre: 異世界ファンタジー
tone: 重厚、神話的、格調高い
pov: 三人称
tense: 過去形
setting: 砕け散った神の残滓が星となって降り注ぐ世界「セリス」。永遠に夜が明けないが、記憶の灯火によって擬似的な昼を創り出した不眠の都「オフィール」。
premise: 人々の記憶を燃料として灯る「不滅の灯台」が、世界を蝕む永い眠りと虚無から都市を守っている。記憶を売ることで生を繋ぐ貧民と、他者の記憶を買い集めて永遠の知を追求する貴族。失われたはずの「創世の記憶」を追う没落貴族の青年が、都の残酷な真実と向き合い、世界の覚醒を願う物語。
themes:
- 記憶とアイデンティティ
- 忘却による救済と残酷さ
rules:
- 記憶は結晶化して譲渡可能であり、譲渡された者はその記憶を完全に喪失する。
- 灯台の維持には「強い感情を伴う記憶」が必要であり、それが都の唯一の通貨として機能している。
- 記憶を失いすぎた者は『殻』となり、意識のないまま街を彷徨う。
plot_outline:
- '序盤: 記憶の収集屋として生きる主人公エライアスが、ある日、主を持たず、かつ誰の記憶とも一致しない「空白の記憶結晶」を手に入れ、そこに刻まれた禁忌の古歌に導かれる。'
- '中盤: 記憶を売買する闇市場「ムネモシュネの回廊」にて、都の支配層が特定の記憶を意図的に消去し、都合の良い歴史を構築している陰謀を突き止める。'
- '終盤: 灯台の燃料が底を突き、世界に「真の眠り」が訪れようとする中、エライアスは自らの全記憶を捧げて世界を覚醒させるか、偽りの不眠を維持し続けるかの究極の選択を迫られる。'
- '結末: 全ての偽りの記憶を焼却し、人々は個々の痛みと喪失感と共に目覚める。夜明けなき都に、数千年の時を経て初めて本物の朝日が昇り、物語は静かに幕を閉じる。'
style_notes: 擬古文的な格調高い地の文を用い、作中に架空の聖典や叙事詩を引用することで世界観の奥行きを演出する。地名や術式名にはラテン語的な響きを持たせ、静謐ながらも重厚な情景描写に徹する。
