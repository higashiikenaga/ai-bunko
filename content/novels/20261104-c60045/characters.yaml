- name: カイ・レン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常に薄暗い作業場で過ごしているため、少し青白い肌。手先が器用で、指先には微細な機械の傷が絶えない。無表情だが瞳に深い思索の色がある。
  personality: 冷静沈着で内向的。効率と論理を重んじる街の価値観に馴染めず、どこか孤独を愛する性質。一人称は「僕」。
  speech_style: 丁寧だが抑揚が少なく、事実を淡々と伝えるような話し方。
  background: 感情チップの修復を行う技術者。便利になりすぎた世界で、人々が「感情の加工」に依存している現状に漠然とした違和感を抱いている。
  motivation: 未知の記憶チップに含まれる『不合理なノイズ』の正体を知り、その本質に触れること。
  relationships:
  - name: エナ
    relation: 仕事上の協力者であり、唯一の友人
  - name: 記憶チップの持ち主
    relation: 解析対象であり、精神的な導き手
  arc: 効率的な修復こそが正義だと考えていたが、不完全なもの、壊れやすいものに宿る尊さを理解し、あえて「不完全なまま残す」という決断を下せるようになる。
- name: エナ・ミズキ
  role: 相棒
  age: 26
  gender: 女性
  appearance: 明るい色のアンドロイド風のファッションを好む。街の流行に敏感で、常に最新のデバイスを身に付けている。
  personality: 社交的で楽観的。シミュレーターによる快楽を享受することに迷いがない。一人称は「私」。
  speech_style: 明るくテンポが良い。流行語を交えた現代的な話し方。
  background: 海底遺跡の調査データを管理するドローン・オペレーター。カイとは古い友人。
  motivation: カイの仕事を手伝いつつ、退屈な日常に新しい刺激（新しいデータ）をもたらすこと。
  relationships:
  - name: カイ・レン
    relation: 親友、かつ危ういバランスを心配している対象
  arc: 最初はカイの探究心を「非効率な趣味」と笑っていたが、チップの記憶に触れる中で、自分が享受してきた幸福がいかに薄っぺらなものだったかに気づき、動揺する。
- name: 理事長・サカキ
  role: 敵役
  age: 55
  gender: 男性
  appearance: 隙のない仕立てのスーツを着こなし、常に穏やかな微笑を浮かべている。威圧感を感じさせないが、目が笑っていない。
  personality: 極めて合理的で支配的。社会の安定と、感情の管理による紛争の防止を至上命題としている。一人称は「私」。
  speech_style: 非常に丁寧で理路整然としているが、相手の逃げ道を塞ぐような威圧感がある。
  background: 街の感情インフラを管理する巨大企業の幹部。不確実な「生の感情」が社会の秩序を乱すことを極端に嫌う。
  motivation: 回収されたチップを解析し、社会に有害な『不合理な感情』が拡散しないよう、データを完全に消去または管理下に置くこと。
  relationships:
  - name: カイ・レン
    relation: 優秀な技術者として期待しているが、思想的には排除すべき対象
  arc: カイの「壊れやすいまま残す」という選択に対し、秩序を守るための正論をぶつけるが、論理では説明できないカイの意志に直面し、初めて制御不能な事態に直面する。
