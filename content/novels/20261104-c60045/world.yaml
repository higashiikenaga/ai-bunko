title: 深海の記憶、静かな回路
genre: ヒューマンドラマ
tone: 静謐で物悲しい、透き通った近未来感
pov: 三人称近接
tense: 過去形
setting: 高度な自動化が進み、夜も人工照明で明るい「眠らない街」と、その近海に沈むかつての文明の残滓（海底遺跡）
premise: 感情シミュレーターによって失われた家族の記憶を擬似体験できる時代。技術者であるカイは、海面下に沈んだ海底遺跡から回収された古い記憶デバイスの修復を請け負う。その中には、高度なAIですら解析できない『不合理な悲しみ』が刻まれていた。便利すぎる世界で忘れ去られた、手触りのある痛みを探す物語。
themes:
- 技術による代替不可能な感情
- 忘却と記憶の価値
rules:
- 感情シミュレーターは、脳波と過去のログに基づき『最も心地よい体験』を生成するが、本物の痛みは再現できない
- 海底遺跡は高圧と塩害により、物理的な記録媒体の劣化が激しい
- 眠らない街では、全市民がスマート・インターフェースを通じて常時ネットワークに接続されている
plot_outline:
- '序盤: 眠らない街の片隅で、カイは日々、不具合を起こした感情チップの修復を行っている。ある日、海底遺跡の調査ドローンが回収してきた、旧時代の不完全な記憶チップが届く。'
- '中盤: チップの中身は、技術が発展する前の、不器用で、けれど鮮烈な「誰かを失う痛み」だった。シミュレーションされた快楽に慣れた街の人々にとって、その記憶は理解不能なノイズとして扱われる。'
- '終盤: カイはチップの持ち主が残した「言葉にならない祈り」に触れ、便利さの代償として自分たちが何を捨ててきたのかを自覚する。彼はチップのデータを完全に復元するのではなく、あえて「壊れやすい形」で保存することを選ぶ。'
- '結末: 街の明かりは変わらず眩しいが、カイの心には、海底の静寂のような、切なくも温かい孤独が宿っている。'
style_notes: 技術用語（ホログラム、神経接続、自動修復など）を生活の一部として自然に配置し、説明臭さを避ける。便利になった生活の描写の中に、かつての不便さが持っていた温もりや、デジタル化できない手のぬくもり、微かな寂寥感を対比させて描く。
