- name: ユリアン・ヴェイン
  role: 主人公
  age: 28
  gender: 男性
  appearance: 青白い肌、銀塩で汚れた細い指、瞳に奇妙な光が宿る端正な顔立ち
  personality: 完璧主義で憂鬱、内省的。一人称「僕」
  speech_style: 冷静で丁寧だが、どこか他人を寄せ付けない距離感がある
  background: 貴族たちの肖像鏡を修復する腕利きの鏡職人。美しさの背後にある残酷な真実を、鏡を通じて知る者。
  motivation: 禁忌の儀式により自らの肉体を硝子へと変え、移ろいゆく美を永遠に留めること。
  relationships:
  - name: エララ・スターリング
    relation: 依頼人であり、街の犠牲者としての共感対象
  - name: 剥離した自己
    relation: 鏡の中に潜む、忌むべき対峙者
  arc: 美を観測する者から、禁忌に手を染める狂信者へ、そして最後には真実と決別する犠牲者へと変貌する。
- name: 剥離した自己
  role: 敵役
  age: 28
  gender: 男性
  appearance: 割れた磁器のような肌、蒸気のように揺らめく紅い瞳を持つユリアンの異形
  personality: 剥き出しの生存本能と、捨てられた記憶への深い怨嗟。一人称「俺」
  speech_style: 複数の声が重なり合ったような、歪んだ残響を伴う話し方
  background: 街の蒸気機関の燃料として消費され、捨て去られたユリアンの「記憶」と「魂」の結晶。
  motivation: 鏡の境界を破壊し、現実世界を侵食して、本来あるべき肉体を奪い返すこと。
  relationships:
  - name: ユリアン・ヴェイン
    relation: 自分を捨て去った、肉体を持つ本体
  arc: 鏡の底から這い出し、街全体を鏡の迷宮へと変えようとする災厄として君臨する。
- name: エララ・スターリング
  role: 脇役
  age: 24
  gender: 女性
  appearance: 真鍮の装飾を施したドレスを着た優雅な貴族令嬢。物語が進むにつれ、肌が透明なガラスのように透けていく。
  personality: 聡明で感受性が強いが、自身の変貌に怯えている。一人称「私」
  speech_style: 洗練されているが、常にどこか切迫感と震えが混じる
  background: 街の繁栄を享受する貴族階級の一員。自身の記憶が欠落し、肉体がガラス化していく恐怖に直面している。
  motivation: 街の異常なシステムを止め、人間としての尊厳を取り戻すこと。
  relationships:
  - name: ユリアン・ヴェイン
    relation: 鏡の修復を依頼する顧客
  arc: 街の繁栄に守られた無垢な令嬢から、システムの犠牲者となり、主人公に真実を突きつける存在へ。
- name: サイラス・ソーン
  role: 脇役
  age: 45
  gender: 男性
  appearance: 重厚な革と真鍮の防具を纏い、常に濃密な蒸気に包まれた巨漢の技師。
  personality: 冷徹で実利主義。個人の感情よりも都市の機能を優先する。一人称「私」
  speech_style: 威圧的で事務的な、感情を排した口調
  background: 中央蒸気機関を管理する機関の主任技師。街の維持には「記憶」の供給が不可欠であることを熟知している。
  motivation: 蒸気機関の出力を安定させ、都市の秩序と繁栄を維持し続けること。
  relationships:
  - name: ユリアン・ヴェイン
    relation: 禁忌に触れかねない、監視対象の市民
  arc: 秩序の守護者として、主人公の行動を「都市への脅威」と見なし、冷酷に排除しようとする壁として立ちふさがる。
