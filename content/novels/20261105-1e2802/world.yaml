title: 緋色の蒸気と、砕け散る万華鏡の貌
genre: ホラー
tone: 耽美、退廃的、静謐な狂気
pov: 一人称
tense: 過去形
setting: 常に濃密な蒸気が街を覆い、水晶と真鍮の建築物が立ち並ぶ巨大都市
premise: 街の心臓である蒸気機関は、美しき者の「記憶」を燃料として燃え上がっている。鏡職人である私は、ある日、鏡の向こう側からこちらを覗き込む、美しくも悍ましい「剥離した自己」に出会う。それは、蒸気の熱によって溶け出した、魂の結晶であった。美しさを永遠に留めるため、私は自らの肉体を硝子へと変える禁忌の儀式へと足を踏み入れる。
themes:
- 美の崩壊
- 自己の同一性
- 永遠への執着
rules:
- 鏡の中の存在は、人間が最も美しいと感じる記憶を喰らうことで実体化する
- 蒸気機関の出力は、都市に供給される情動の純度に依存する
- ガラス化した肉体は一度砕ければ二度と修復できない
plot_outline:
- '序盤: 鏡職人として、貴族たちの肖像鏡を修復する日々。ある日、鏡の中に、自分自身の『泣いている顔』を見つける。'
- '中盤: 街の蒸気機関が異常な出力を出し始め、人々が次々と透明な人形へと変貌していく。鏡の向こうの住人が、街の繁栄の犠牲者であることを知る。'
- '終盤: 鏡の中の『私』が現実へ這い出し、街を巨大な鏡の迷宮へと変えようとする。蒸気機関の心臓部に、自らの命を捧げるかの選択を迫られる。'
- '結末: 蒸気は止まり、街は静寂に包まれる。残されたのは、砕けた鏡の破片と、その一つひとつに閉じ込められた、美しくも悲しい瞳の残像だけだった。'
style_notes: 宝石の輝きや、花が枯れ落ちる瞬間の描写を多用すること。「薔薇の棘のような孤独」や「サファイアの涙」といった比喩を用い、恐怖を『叫び』ではなく『静かなる亀裂』として描く。美しさが壊れる瞬間のカタルシスを強調せよ。
