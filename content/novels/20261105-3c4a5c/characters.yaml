- name: エリアス・ヴァンス
  role: 主人公
  age: 34
  gender: 男性
  appearance: 短く整えられた黒髪、鋭い眼光、常に隙のない星系連合の制服姿。左手の甲に古い火傷の跡がある。
  personality: 冷静沈着で規律を重んじるリアリスト。責任感が強く、個人の感情よりも任務の完遂を優先する。一人称は「私」。
  speech_style: 簡潔で理知的。部下に対しては威厳を持ちつつも、無駄な叱責を避ける丁寧な口調。
  background: 連合軍のエリートとしてキャリアを積み、数々の境界紛争を収めてきた。秩序こそが銀河の平和を維持する唯一の手段だと信じている。
  motivation: 星図の悪用を阻止し、連合の管理下で銀河の均衡を維持すること。
  relationships:
  - name: ライラ・ソル
    relation: 戦場における宿敵であり、奇妙な共鳴を感じる相手
  - name: ヴァレリウス
    relation: 尊敬する上官であり、思想的な対立を抱く対象
  arc: 秩序を守るための「正義」が、時に他者の自由を奪う破壊であることを悟り、真の平和のために既存の秩序を壊す決断を下す。
- name: ライラ・ソル
  role: 主人公
  age: 26
  gender: 女性
  appearance: 無造作な銀髪、機能的な飛行スーツ、左目に旧式のサイバネティクス義眼を装着している。
  personality: 現実主義的で皮肉屋。過酷な環境で育ったため、他者を簡単に信用しない。一人称は「あたし」。
  speech_style: ぶっきらぼうで、時に挑発的な口調。軍隊的な規律を嫌う。
  background: 資源不足に苦しむ独立惑星同盟の辺境宙域出身。同盟の生存圏を広げるため、特務工作員として戦場を渡り歩いている。
  motivation: 同盟の仲間たちが飢えることのないよう、生存に必要な資源と技術を確保すること。
  relationships:
  - name: エリアス・ヴァンス
    relation: 敵対関係にあるが、その戦術眼には一目置いている
  - name: アリス・ソーン
    relation: 情報の供給源として利用しようとする対象
  arc: 己の生き残りと仲間の利益のみを追う「生存」のフェーズから、銀河全体の存亡を左右する「意志」を持つ戦士へと変貌する。
- name: アリス・ソーン
  role: 脇役
  age: 48
  gender: 女性
  appearance: 白衣を纏った、疲労の色が濃い知的な女性。常に古いデータ端末や解析用デバイスを携えている。
  personality: 好奇心が極めて強く、学問に対しては時に狂信的。感情よりも真理の探究を優先する。一人称は「私」。
  speech_style: 穏やかだが、学術的な議論になると早口になり、論理の飛躍を許さない。
  background: 超古代文明の研究に人生を捧げてきた考古学者。中継ステーション『エリュシオン』に駐在し、星図の断片を最初に解析した。
  motivation: 「失われた星図」が示す宇宙の真理を解明し、人類の歴史を書き換えること。
  relationships:
  - name: エリアス・ヴァンス
    relation: 研究の安全を保障してくれる守護者
  - name: ライラ・ソル
    relation: 未知の領域へ足を踏み入れるための動的なサンプル
  arc: 知識がもたらす破滅の可能性を目の当たりにし、真理を「知る」ことよりも、それを「どう扱うか」という倫理的責任に目覚める。
- name: ヴァレリウス
  role: 敵役
  age: 59
  gender: 男性
  appearance: 威圧感のある巨躯、銀髪、数々の戦功を示す勲章が並ぶ重厚な軍服。常に冷徹な笑みを浮かべている。
  personality: 極めて冷酷なリアリスト。力による絶対的な支配こそが、銀河から紛争を根絶する唯一の方法だと確信している。一人称は「私」。
  speech_style: 威圧的で、有無を言わせぬ絶対的な命令口調。相手を心理的に追い詰める術に長けている。
  background: 星系連合の最高司令官。数々の艦隊戦を勝利に導いてきた英雄であり、政治的な権力も掌握している。
  motivation: 星図の装置を利用し、宇宙の物理定数を制御することで、連合による永続的な銀河統治を確立すること。
  relationships:
  - name: エリアス・ヴァンス
    relation: 理想的な駒として期待しているが、使い捨てにする準備もできている
  arc: 自らが構築しようとした「完璧な秩序」が、装置の暴走と部下の反逆によって崩壊していく中で、狂信的な支配への執着を露呈させる。
