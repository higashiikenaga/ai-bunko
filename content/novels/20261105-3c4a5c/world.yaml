title: 虚空の座標、銀河の鎮魂歌（レクイエム）
genre: 群像劇
tone: 重厚、壮大、緊張感のあるハードSF
pov: 三人称（各艦隊、各陣営の視点による切り替え）
tense: 過去形
setting: 超光速航行技術「重力波跳躍」が確立された、星系連合と独立惑星同盟が対立する銀河系中枢圏。
premise: 銀河の秩序を維持する星系連合と、資源確保を掲げる独立惑星同盟。両陣営の均衡は、伝説の「失われた星図」の発見によって崩壊する。その星図は、宇宙の全領域を統制する超古代文明の航路を記したものだった。各国の艦隊は、眠らない街と呼ばれる中継ステーション「エリュシオン」を舞台に、情報戦と艦隊戦の渦へと飲み込まれていく。星々の命運を懸けた、非情な戦略と個々の信念が交錯する。
themes:
- 秩序と自由の相克
- 情報の価値と権力
- 歴史の再解釈
rules:
- 重力波跳躍は、あらかじめ計算された座標（星図）がなければ不可である
- 通信は量子もつれを利用しているが、強力な重力場下では遅延が発生する
- 艦隊の指揮権は階級に基づき、通信プロトコルに従った厳格な命令系統を持つ
plot_outline:
- '序盤: 中継ステーション『エリュシオン』にて、未公開の古代星図の断片が発見される。連合軍の偵察艦隊と同盟軍の特務部隊が、その座標を巡って接触し、小規模な交戦が発生する。'
- '中盤: 星図が示す「特異点」を目指し、両陣営の主力艦隊が大規模な展開を見せる。戦線は広大な星系へと拡大し、艦隊同士の通信傍受や電子戦、そして重力波を利用した大規模な艦隊戦が繰り広げられる。'
- '終盤: 星図の真の目的が、宇宙の物理定数を書き換える装置の起動シーケンスであることが判明する。戦場は、全勢力が集結する星系中央へと収束していく。'
- '結末: 装置の起動を巡る最終決戦。ある指揮官の決断により、星図は破壊されるが、銀河の勢力図は決定的に塗り替えられ、新たな緊張状態へと移行する。'
style_notes: 宇佐見コウの文体を徹底。艦橋における階級に基づいた命令口調（「大佐、敵艦隊より電波信号を受信、座標L-12より接近中！」等）を正確に描写する。艦隊戦の際は、艦船の機動力、エネルギー残量、通信ラグを意識した描写を行うこと。星系間の距離感や、星図上の座標移動を具体的に記述し、空間的な広がりを読者に提示する。
