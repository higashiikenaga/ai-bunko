- name: 佐伯 誠一郎
  role: 主人公
  age: 42
  gender: 男性
  appearance: 痩身で鋭い眼差し。常に色褪せたグレーのトレンチコートを着用し、不眠による深い隈がある。
  personality: 冷徹なロジック至上主義。感情を排して事実のみを繋ぎ合わせる。一人称は「私」。
  speech_style: 簡潔で断定的。相手の矛盾を突く際、静かな口調で追い詰める。
  background: 警視庁捜査一課。かつて正義感から組織の不正を暴こうとして左遷され、現在は能力を認められつつも周囲から浮いている。
  motivation: 感情的な救済ではなく、完璧な論理でパズルを完成させ、真実を白日の下に晒すこと。
  relationships:
  - name: 杵島 蓮
    relation: 不器用な信頼を寄せている後輩
  - name: 熊谷 宗介
    relation: 組織の壁として対立する上司
  arc: 虚無感に浸っていたが、犯人との知的な対峙を通じて、絶望の中でも真実を追うことの意味を再確認する。
- name: 杵島 蓮
  role: 相棒
  age: 26
  gender: 男性
  appearance: 快活な表情と、少し癖のある短髪。機能性を重視したカジュアルなスーツ姿。
  personality: 直感的で行動的。人当たりが良く、夜の街の住人たちから情報を引き出す能力に長けている。一人称は「僕」。
  speech_style: 丁寧だが親しみやすく、時折若者らしい口語が混じる。
  background: 捜査一課に配属されたばかりの新人。佐伯の能力を心から尊敬しており、彼の孤独を埋めようと奔走する。
  motivation: 佐伯のような本物の刑事になりたいという憧れと、事件を解決して被害者の無念を晴らしたいという純粋な正義感。
  relationships:
  - name: 佐伯 誠一郎
    relation: 尊敬するメンターであり、導き手
  arc: 純粋な正義感だけでは解決できない組織の闇に直面し、大人の苦渋を学びながらも、最後まで人間性を失わない強さを得る。
- name: 織部 律
  role: 敵役
  age: 31
  gender: 男性
  appearance: 青白い肌に知的な眼鏡。仕立ての良い黒い服を纏い、指先まで神経が行き届いた所作を持つ。
  personality: 完璧主義でニヒリスティック。都市を巨大な檻と捉え、そこに「航路」を刻むことで芸術的な秩序を作ろうとする。一人称は「私」。
  speech_style: 慇懃無礼で詩的な言い回しを好む。論理的に相手を否定する快楽を享受する。
  background: 元鳥類学者であり地理学の博士号を持つ。ある政治的な都市開発によって大切な研究拠点と居場所を奪われた過去がある。
  motivation: 都市の喧騒に塗り潰された記憶を、死という消えない印（航路）で復元し、社会に突きつけること。
  relationships:
  - name: 佐伯 誠一郎
    relation: 自分の計画を理解し得る唯一の知的対等者
  arc: 佐伯に読み解かれることで、自身の孤独な航海が完結することを密かに望み、最後は静かに敗北を受け入れる。
- name: 熊谷 宗介
  role: 脇役（障害役）
  age: 55
  gender: 男性
  appearance: 恰幅が良く、高級なスーツと金縁の眼鏡。権威を感じさせる重厚な佇まい。
  personality: 極めて現実的で政治的な人間。個人の正義よりも組織の安寧と面子を最優先する。一人称は「私」。
  speech_style: 威圧的で、結論だけを求める効率的な話し方。婉曲的な表現で圧力をかける。
  background: 警視庁幹部。政界とのパイプを重視し、事件の真相よりも「いかに速く、都合よく解決させるか」を管理する。
  motivation: 事件による社会不安を最小限に抑え、自身の出世と組織の権威を維持すること。
  relationships:
  - name: 佐伯 誠一郎
    relation: 能力は認めているが、制御不能な危険因子として嫌悪している
  arc: 徹底して管理しようとした事件が、佐伯によって制御不能な方向（政治的スキャンダル）へ転がり、地位を脅かされる。
