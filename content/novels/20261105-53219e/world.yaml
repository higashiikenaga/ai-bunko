title: 都市の航路、午前三時の残響
genre: 本格ミステリー
tone: 硬質で乾いたリアリズム
pov: 三人称
tense: 過去形
setting: 現代、眠らない街・東京
premise: 午前三時十五分、新宿の雑居ビルで遺体が発見される。警視庁捜査一課の刑事、佐伯は、遺体の配置が特定の渡り鳥の移動経路を模していることに気づく。連続する殺害事件は、都市の喧騒に紛れ、計算された時刻と場所で行われていた。組織の介入と捜査の限界の中で、佐伯は冷徹なロジックのみを頼りに、夜の街に潜む犯人を追う。
themes:
- 組織の機能不全
- 都市における孤立
rules:
- 捜査は証拠と手続きに基づき、感情的な推測を排除する
- すべての事象には正確な時刻と場所が伴う
- 警察組織内の政治的判断が捜査に干渉する
plot_outline:
- '序盤: 新宿での第一の殺人事件。佐伯は遺体の状況から、犯人が特定のパターンを持っていることを直感する。現場検証と初動捜査が詳細に描かれる。'
- '中盤: 続く連続殺人。被害者の共通点と地理的な航路が判明する。捜査方針を巡り、上層部との軋轢が生じる。聞き込みにより、都市の夜の住人たちの断片的な証言を収集し、パズルを組み立てる。'
- '終末: 渡り鳥の移動周期と、犯人の次の目的地が一致。佐伯は組織の制止を振り切り、現場へ急行する。犯人の行動原理と、緻密なトリックが暴かれる。'
- '結末: 犯人の検挙。事件の解決と引き換えに、組織の不条理と政治的隠蔽が露呈する。佐伯は虚無感を抱えながら、再び静寂と喧騒の入り混じる街へと戻る。'
style_notes: 感情描写を極力削ぎ落とし、動作と事実に焦点を当てる。会話は短く実務的なものとし、聞き込みの場面では、時間、場所、天候、対象者の反応を詳細かつ客観的に記す。
