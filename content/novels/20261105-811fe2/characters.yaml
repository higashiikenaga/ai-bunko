- name: 瀬戸 結衣
  role: 主人公
  age: 28
  gender: 女性
  appearance: 機能的な登山服に身を包んだ、痩身で活動的な女性。知的ながらもどこか孤独を感じさせる瞳をしている。
  personality: 冷静沈着で論理的。観察眼に優れるが、他者との感情的な繋がりを避ける傾向がある。一人称は「私」。
  speech_style: 丁寧だが淡々とした、事実に基づいた話し方。
  background: 植物学の研究者。自然の秩序をデータとして捉えることを信条としてきたが、過去に自然災害で大切な場所を失った経験を持つ。
  motivation: 未踏の地における希少植物の調査、および「消えた村」の歴史的・生態学的謎の解明。
  relationships:
  - name: 佐伯 源造
    relation: 物語の導き手（生存者）
  arc: 自然を「研究対象」として客観的に眺める立場から、自然の一部として「生と死の循環」を受け入れる存在へと精神的に深化する。
- name: 佐伯 源造
  role: 脇役（重要人物）
  age: 82
  gender: 男性
  appearance: 深く刻まれた皺と、森の苔のような色をした髪を持つ老人。痩せているが、背筋は驚くほど真っ直ぐに伸びている。
  personality: 穏やかで、諦念に近い悟りを開いている。自然の理に従うことを美徳とする。一人称は「わし」。
  speech_style: ゆっくりとした、静かな語り口。山や植物に語りかけるような独特の節回し。
  background: 地図から消えた村の最後の一人。村が自然に飲み込まれていく過程を、抗うことなく静かに見守り続けてきた。
  motivation: 結衣に、人間が自然の一部であることを伝え、村の記憶を（記録ではなく）感覚として受け継がせること。
  relationships:
  - name: 瀬戸 結衣
    relation: 訪れる者（観察者）
  arc: 物語の中で結衣に「生きた証」を託し、自らの存在もまた森の循環の一部として完結させる。
- name: 村長（回想上の人物）
  role: 敵役（概念的な対立者）
  age: 45
  gender: 男性
  appearance: かつての村の指導者。鋭い眼光と、強靭な肉体を持つ威圧的な風貌。折れた剣の持ち主。
  personality: 支配的で、意志が極めて強い。自然を克服すべき対象と見なし、合理性のみを追求する。一人称は「俺」。
  speech_style: 断定的で、周囲を従わせるような力強い話し方。
  background: かつて村を率い、開拓によって自然を支配しようとした男。その野心が村の破滅を招いたとされる。
  motivation: 山を切り拓き、人間が管理できる秩序ある村を作り上げること。
  relationships:
  - name: 村の住民たち
    relation: 支配対象
  arc: （回想を通じて）人間の傲慢さが自然の摂理によって打ち砕かれ、その象徴である剣が錆び果てていく過程を描く。
