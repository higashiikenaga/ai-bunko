- name: カシム・アル・ラシード
  role: 主人公
  age: 32
  gender: 男性
  appearance: 砂埃にまみれた簡素な旅装束。使い込まれた測量器具と、革製の地図管を腰に下げている。鋭いが、どこか虚無感を湛えた瞳を持つ。
  personality: 冷静沈着で現実主義。かつての栄光への未練を隠している。一人称は「私」。
  speech_style: 丁寧だが、どこか突き放したような、落ち着いた淡々とした口調。
  background: 元帝国の宮廷地図製作者。政争に巻き込まれ、全ての地位と名誉を失って没落。現在は市場の片隅で、地図の書き写しなどの細かな仕事で日銭を稼いでいる。
  motivation: 地図の断片を完成させ、失った誇りを取り戻すこと。そして、自分の技術が「伝説」を証明すること。
  relationships:
  - name: セフィラ
    relation: 地図を託した謎の女性であり、旅の同行者
  - name: 名もなき猫
    relation: 旅を共にする不思議な相棒
  arc: 過去の挫折に囚われた「記録者」から、自らの意志で未知の地平を切り拓く「開拓者」へと変化する。
- name: セフィラ
  role: 相棒 / キーパーソン
  age: 24
  gender: 女性
  appearance: 砂漠の陽光に映える、透き通るような白い肌。異国の意匠が施された、古びた、しかし上質なローブを纏っている。
  personality: 神秘的で直感的。記憶を失っているが、時折、世界の真理を見通すような聡明さを見せる。一人称は「私」。
  speech_style: 穏やかで詩的。言葉を選びながら、静かに語りかけるような話し方。
  background: 「約束の丘」への地図の断片を手に、ザムザラの市場に突如として現れた女性。自身の記憶がなぜ失われたのかを知らない。
  motivation: 失われた記憶の断片を繋ぎ合わせ、地図が導く「丘」の正体に触れること。
  relationships:
  - name: カシム
    relation: 地図を託し、共に旅をするパートナー
  arc: 失われた過去を探す旅から、自らが「丘」の記憶を呼び覚ます聖なる媒介者としての自覚を持つようになる。
- name: ジェド・バハル
  role: 敵役
  age: 45
  gender: 男性
  appearance: 帝国の紋章が刻まれた重厚な銀の甲冑を纏う。鋭い眼光と、深い傷跡が残る頬が特徴的な、威圧感のある軍人。
  personality: 冷酷で野心的。帝国の秩序と権威を絶対視し、目的のためには手段を選ばない。一人称は「俺」。
  speech_style: 短く、命令的な口調。相手を威圧するような重みのある声。
  background: 帝国の治安維持を司る将校。伝説の「緑の丘」に眠るとされる古の力が、帝国の支配を永劫にするための鍵であると信じている。
  motivation: 地図を回収し、聖域を帝国の管理下に置くことで、軍事的な優位を確立すること。
  relationships:
  - name: カシム
    relation: 聖域への到達を阻むべき、不遜な追跡対象
  arc: 物理的な武力による支配が、精神的な覚醒や新たな時代の流れには抗えないことを悟り、敗北する。
- name: 名もなき猫
  role: 相棒 / 導き手
  age: 不明
  gender: 不明
  appearance: 砂漠の黄金色に溶け込むような、淡い砂色の毛並み。瞳は、まるで宝石のようなエメラルドグリーン。
  personality: 自由奔放で気まぐれ。しかし、砂嵐や危機が迫る際には、確かな意志を持って行動する。
  speech_style: 鳴き声のみ。
  background: 交易都市の片隅からいつの間にか一行に同行している。砂漠の過酷な環境下でも決して衰えない生命力を持つ。
  motivation: 一行を「約束の丘」へと導き、砂漠に眠る記憶を呼び覚ますこと。
  relationships:
  - name: カシム
    relation: 守るべき、あるいは導くべき旅人
  arc: 単なる迷い猫から、過酷な砂漠において一行の命を繋ぐ「聖なる道標」としての役割を完遂する。
