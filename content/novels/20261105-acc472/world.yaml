title: 香料の都と、砂に消えた約束の丘
genre: 歴史・時代小説
tone: エキゾチックで叙情的、冒険的な雰囲気
pov: 三人称
tense: 過去形
setting: 仮想の砂漠帝国「ザムザラ」。色彩豊かな交易都市と、果てしなく続く黄金の砂海が広がる世界。
premise: かつて帝国の宮廷地図製作者だった男が、ある日、正体不明の女から「伝説の緑の丘」への地図の断片を託される。賑やかな市場の喧騒を離れ、彼は名もなき一匹の猫と共に、砂に埋もれた失われた楽園を探す旅に出る。それは、失った誇りを取り戻すための、命懸けの交易路の旅であった。
themes:
- 喪失と再生
- 自由への渇望
rules:
- 砂漠の夜は絶対的な静寂に包まれ、音を立てる者は精霊に魂を奪われるとされる迷信がある
- 交易都市では通貨よりも希少な香料や染料が価値を持つ
- 地図の正しさは、星の運行と砂の波紋を読む技術によってのみ証明される
plot_outline:
- '序盤: 没落し、市場の片隅で日銭を稼いでいた主人公が、記憶を失った女から「約束の丘」へと導く古地図を提示され、商隊の案内人に雇われる。'
- '中盤: 喧騒に満ちた交易都市を後にし、過酷な砂漠へと踏み出す。道中で、どこからかついてきた名前のない猫が、砂嵐の中での道標となり、一行を救う。'
- '終盤: 帝国の追手と、砂漠の略奪者に追い詰められながらも、ついに地図の終着点である「約束の丘」に到達するが、そこは物理的な場所ではなく、精神的な覚醒を促す聖域であった。'
- '結末: 丘に眠っていた古の記憶を呼び覚ました主人公は、帝国に頼らぬ新しい交易路を切り拓くことを決意し、猫と女と共に新たな地平へ旅立つ。'
style_notes: 語り部が聴衆に物語を披露しているような、ゆったりとした、しかし情熱的な口調を用いる。市場の場面では、スパイスの香りや人々の怒鳴り声を重層的に描き、対照的に夜の砂漠では、風の音さえ消え入るほどの静寂と、星空の冷徹さを際立たせて描写する。
