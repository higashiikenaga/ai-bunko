- name: 佐藤 航太
  role: 主人公
  age: 24
  gender: 男性
  appearance: 都会的な、少しやつれた痩身の青年。眼鏡をかけており、どこか神経質そうな印象を与える。
  personality: 内向的で思索的。都会での挫折から逃避するように帰郷した。一人称は「僕」。
  speech_style: 丁寧だが、自信なさげで、周囲の反応を伺うような話し方。
  background: 都内のIT企業で過労により精神を病み、亡き祖父が遺した鳴神村の旧家へと逃れるように戻ってきた。
  motivation: 平穏な生活を取り戻すこと。しかし、村の異変を知るにつれ、生き延びるための脱出へと目的が変化する。
  relationships:
  - name: 蔵本 慎一
    relation: 古本屋の主人であり、真実を伝える謎の導き手
  - name: 鳴神 宗次郎
    relation: 村の因習を強いる監視者
  arc: 静かな隠居生活を望む逃避者から、理不尽な呪いに抗う生存者へ、そして最終的には抗う術を失い、村の「記録」へと変貌する。
- name: 蔵本 慎一
  role: 脇役
  age: 65
  gender: 男性
  appearance: 深い皺と濁った瞳を持つ、痩せこけた老人。古びた書物のような埃っぽい匂いがする。
  personality: 冷静沈着で達観しているが、どこか諦念を感じさせる。一人称は「私」。
  speech_style: 抑揚が少なく、淡々と事実のみを述べるような、教訓めいた話し方。
  background: 村外れの古本屋の店主。かつて儀式の理不尽を暴こうとして、村のシステムに飲み込まれた過去を持つ。
  motivation: 新たな「器」が生まれる過程を、歴史の目撃者として見届けること。
  relationships:
  - name: 佐藤 航太
    relation: 次なる犠牲者、あるいは新たな記録の候補
  arc: 航太に禁忌の知識を与え、彼を逃げ場のない運命へと誘導する、静かな観測者としての役割を全うする。
- name: 鳴神 宗次郎
  role: 敵役
  age: 52
  gender: 男性
  appearance: がっしりとした体格。常に村の伝統的な作業着を纏い、鋭い眼光で周囲を威圧する。
  personality: 狂信的で強固な意志を持つ。村の秩序と伝統を絶対視し、個人の感情を排している。一人称は「俺」。
  speech_style: 威圧的で、村の掟を突きつけるような、重々しく断定的な口調。
  background: 鳴神村の祭礼を司る一族の長。村の「汚れ」を管理し、座敷神への供物を守る責任を負っている。
  motivation: 泥供の儀式を滞りなく遂行し、村の平穏（と、村人の身の安全）を維持すること。
  relationships:
  - name: 佐藤 航太
    relation: 儀式を完遂するために必要な「器
  arc: 航太を村から逃がさないよう追い詰め、彼を「座敷神への供物」へと導く絶対的な障壁として立ちふさがる。
- name: 結衣
  role: 脇役
  age: 22
  gender: 女性
  appearance: 儚げで、常に何かに怯えているような、顔色の悪い若い女性。
  personality: 臆病で、村の因習に抗えない無力感に苛まれている。一人称は「私」。
  speech_style: 消え入りそうなほど小さく、震えるような話し方。
  background: 村の祭礼に関わる家系の娘。かつて航太の祖父と面識があった。
  motivation: 儀式の恐怖から逃れること、あるいはただ静かに消えていくこと。
  relationships:
  - name: 佐藤 航太
    relation: 警告を与える者
  arc: 航太に村の異常性を察知させるための「予兆」として登場し、儀式の狂気に飲み込まれていく過程を見せる。
