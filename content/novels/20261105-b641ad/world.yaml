title: 泥濘の還り、刻の蔵
genre: ホラー
tone: 静謐、湿り気を帯びた、逃げ場のない恐怖
pov: 三人称
tense: 過去形
setting: 現代、東北地方の山間に位置する閉鎖的な集落「鳴神村（なるかみむら）」
premise: 都会から逃れるように帰郷した青年・航太は、村の端にある古びた古本屋で、持ち主の不明な古い郷土誌を見つける。そこには、村の祭礼で行われる「座敷神への供物」に関する禁忌が、歪な筆致で記されていた。村を走る唯一の路線、深夜にのみ現れる「最終列車」に乗る者は、決して座を替えてはならないという。航太は、古本に記された禁忌を破る村人たちの姿と、夜な夜な響く鉄路の軋みに、抗えない死の予兆を感じ始める。
themes:
- 血縁による呪縛
- 忘却された土着信仰
rules:
- 最終列車に乗る者は、車内の『見知らぬ同行者』と目を合わせてはならない
- 古本屋に置かれた書物は、村の禁忌を破った者の魂を吸う依代である
- 祭りの夜、村の境界線である結界を越えてはならない
plot_outline:
- '序盤: 都会での生活に疲れ、亡き祖父の家がある鳴神村へ戻った航太。村の空気は重く、人々の視線は粘りつくようだ。彼は村外れの古本屋で、奇妙な図解が描かれた古い書物を手に入れる。'
- '中盤: 書物には、村の祭り『泥供（どろく）の儀』の真実が記されていた。それは神を祀るものではなく、村の汚れを人間に押し付ける儀式だった。航太は、夜の最終列車に乗った際、隣に座る「顔のない男」と視線が合ってしまう。'
- '終盤: 儀式の夜、村全体が異様な熱気に包まれる。逃げようとする航太だったが、村の出口は常に霧と泥に阻まれる。古本屋の主が、かつて儀式を止めようとして飲み込まれた者であることを知る。'
- '結末: 航太は、逃げることを諦め、次の祭りのための『器』として村の一部に取り込まれる。最後の一行は、彼が古本屋の棚に、新たな「記録」として並べられる描写で終わる。'
style_notes: 湿度を感じさせる描写を多用し、土の匂いや湿った風、古い紙の質感を描き出す。方言は、意味を理解させる程度に抑えつつ、不気味な響きを持たせる。展開は急がず、静かに、確実に逃げ場が失われていく様子を、民俗学的な視点から淡々と綴る。
