- name: 凪 (ナギ)
  role: 主人公
  age: 22
  gender: 男性
  appearance: 鋭い眼光を持つ黒髪の浪人。使い込まれた黒い着物に、蒸気機関の煤で汚れた袴を纏っている。腰には一振りの漆黒の刀を帯びている。
  personality: 寡黙で冷徹に見えるが、内には熱い情熱と深い悲しみを秘めている。一人称は「俺」。
  speech_style: 無駄を削ぎ落とした、短く硬い口調。感情を表に出さない。
  background: かつて名門の侍として修行していたが、双子の兄・蓮との戦いの最中に兄を失った（と信じている）。現在は、鋼殻鬼を狩る孤独な流浪の身。
  motivation: 兄の正体を知り、自らの手で兄を介錯して、止まった時間を動かすこと。
  relationships:
  - name: 蓮
    relation: 双子の兄
  - name: 志音
    relation: 旅の同行者
  arc: 復讐と義務感に縛られた「剣」から、愛する者を解放するための「慈悲」としての剣へと精神が昇華していく。
- name: 蓮 (レン)
  role: 敵役（悲劇の象徴）
  age: 22
  gender: 男性
  appearance: かつての端正な顔立ちの半分が、剥き出しの歯車と青く光る蒸気回路に覆われた鋼殻鬼の王。巨大な鉄の腕と、蒸気を噴き出す背部装甲を持つ。
  personality: 自我は霧の向こう側にあり、本能と機械的な指令に従うのみ。時折、凪の呼びかけに苦悶の表情を見せる。
  speech_style: 言葉にならない機械音や、歪んだ残響のような声。凪の記憶にある声が時折混じる。
  background: 凪の双子の兄。死んだと思われていたが、狂気の術師によって回収され、最強の鋼殻鬼の核として再構築された。
  motivation: （術師の命令により）凪を排除すること、あるいは凪を自身の鋼の肉体に取り込み、永遠の結合を果たすこと。
  relationships:
  - name: 凪
    relation: 双子の弟
  - name: 久我
    relation: 創造主であり支配者
  arc: 無機質な破壊の塊から、最期の瞬間、凪との共鳴によって人間としての魂を取り戻す。
- name: 志音 (シオン)
  role: 相棒
  age: 19
  gender: 女性
  appearance: 大きなゴーグルを頭に乗せ、油汚れのついた法衣を纏う少女。多数の工具と呪符が詰まった大きな革袋を背負っている。
  personality: 好奇心旺盛で現実主義。技術と呪術の両方に精通しており、冷静な分析を行う。一人称は「私」。
  speech_style: 早口で専門用語を多用する。落ち着いているが、危機的状況では少し口が悪くなる。
  background: 蒸気機関と呪術を融合させる「術機師」の家系出身。失われた技術の真実を追う中で凪と出会う。
  motivation: 鋼殻鬼を生み出した狂気の技術を解明し、この技術が人間を蝕むのを止めること。
  relationships:
  - name: 凪
    relation: 護衛兼、技術的支援者
  - name: 久我
    relation: かつての師、あるいは忌むべき宿敵
  arc: 知識への執着から、目の前の命を救うための技術の使い方へと、研究者としての在り方が変化する。
- name: 久我 (クガ)
  role: 敵役（黒幕）
  age: 55
  gender: 男性
  appearance: 贅を尽くした機械仕掛けの法衣を纏う、痩躯の老人。瞳には精密なレンズが埋め込まれており、常に冷徹な計算を行っている。
  personality: 選民思想の強い狂信者。人間を「不完全な肉体」と見なし、鋼鉄による進化こそが救済だと信じている。一人称は「我」。
  speech_style: 高圧的で、神の啓示を説くような尊大な話し方。
  background: 蒸気機関の都を築いた天才術師。異界の技術を使い、人間を鋼殻鬼へと変貌させる禁忌の術を完成させた。
  motivation: 全人類を鋼殻鬼へと昇華させ、死も衰えもない「鋼鉄の理想郷」を築くこと。
  relationships:
  - name: 蓮
    relation: 最高傑作の傀儡
  - name: 凪
    relation: 理想郷を脅かす不純物
  arc: 絶対的な支配者として君臨しようとするが、自らが作り上げた「進化」の暴走によって、最期は自らの構築した城塞と共に崩壊する。
