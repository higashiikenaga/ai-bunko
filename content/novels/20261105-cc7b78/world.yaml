title: 鉄錆の業火、双眸の宿命
genre: 伝奇
tone: 剛毅かつ静謐。血と鉄の匂いが漂う骨太な文体
pov: 三人称
tense: 過去形
setting: 幕末、異界の技術が混入した架空の山間地方。蒸気機関と呪術が融合した「鋼殻鬼」が跋扈する時代
premise: かつて斬り結んだ双子の兄を失い、孤独に生きる剣客・凪。彼は、死んだはずの兄が蒸気機関の心臓を持つ異形の怪物「鋼殻鬼」の王として君臨していることを知る。武士の誇りを胸に、冷徹な鋼の肉体へと成り果てた肉親を斬るための旅が始まる。静寂を切り裂く一撃が、血と蒸気の地獄を浄化する。
themes:
- 宿命と断絶
- 武士道と機械文明の対立
rules:
- 鋼殻鬼は心臓部に高圧蒸気釜を持ち、そこを正確に突かなければ再生する
- 双子は魂を共有しており、一方が斬ればもう一方に激痛が走る
- 剣技は精神集中による『静止の極致』を経て放たれる
plot_outline:
- '序盤: 浪人となった凪が、村を襲う鋼殻鬼を圧倒的な剣技で討伐し、その残骸から兄の面影を持つ部品を発見する。'
- '中盤: 蒸気機関の都を築いた狂気の術師と、その傀儡となった兄の正体、そして双子の魂を繋ぎ止める禁忌の術について明かされる。'
- '終盤: 歯車と煙に覆われた城塞へ単身乗り込み、鋼の身体を持つ刺客たちを一人ずつ斬り伏せながら頂上へ向かう。'
- '結末: 月夜の下、静寂の中で兄と対峙。互いの魂を共鳴させながら、最後の一撃で兄を解放し、蒸気の都と共に消え去る。'
style_notes: 簡潔で力強い短文を重ねる。特に立ち合いの場面では、呼吸、風の音、視線の交差などの静寂を執拗に描き、その後の斬撃の速度と衝撃を対比させて描写する。
