- name: カイト・レンフィールド
  role: 主人公
  age: 22
  gender: 男性
  appearance: 油汚れのついた作業着、無造作な黒髪、鋭いがどこか虚ろな瞳。常にレンチを携帯している。
  personality: 皮肉屋で現実主義。過去の失敗から技術への情熱を封印しているが、根は義理堅い。一人称は「俺」。
  speech_style: ぶっきらぼうで、要件のみを伝えるような短い口調。
  background: かつて帝国の王立技師団で「神童」と呼ばれた天才整備士。ある実験事故の責任を押し付けられ、追放された落ちぶれた青年。
  motivation: 自分を頼ってくるアイリスを守り、彼女の記憶の断片を繋ぎ合わせることで、失った自分自身の誇りを取り戻すこと。
  relationships:
  - name: アイリス
    relation: 相棒・守るべき存在
  - name: ゼノス・ヴォルガード
    relation: 宿敵
  arc: 世界を見捨てていた諦念から、アイリスとの交流を通じて「技術で世界を救う」という本来の志を取り戻していく。
- name: アイリス
  role: 相棒
  age: 14
  gender: 女性型
  appearance: 青い光を放つ結晶体。ホログラム投影時には、銀髪で透き通るような肌を持つ少女の姿となる。
  personality: 純粋無垢で好奇心旺盛。論理的な思考を持つが、時折人間らしい感情の揺らぎを見せる。一人称は「私」。
  speech_style: 丁寧で落ち着いているが、解析結果を伝える際などは極めて無機質な口調になる。
  background: 「最果ての灯台」を管理・起動するために造られた古代の演算機。激しい戦闘の末に記憶を失い、ジャンク屋に放置されていた。
  motivation: 自分が何者であるかを知り、自身が導くべき「座標」へ辿り着くこと。
  relationships:
  - name: カイト
    relation: パートナー・保護者
  arc: 単なる「目的達成のための道具」としての自覚から、カイトを守りたいと願う「意志を持った生命」へと進化する。
- name: ゼノス・ヴォルガード
  role: 敵役
  age: 45
  gender: 男性
  appearance: 磨き上げられた純白の軍服、冷徹な金色の瞳、威圧的な体躯。常に完璧な身だしなみを保っている。
  personality: 秩序を絶対視する冷酷な独裁者。人類の生存には強権的な管理が必要だと信じて疑わない。一人称は「私」。
  speech_style: 尊大で、相手を格下として扱うような、有無を言わせぬ命令口調。
  background: 帝国の特務隊を率いる最高司令官。雲海の毒を制御し、人類を完全に統制するための「力」としてアイリスを狙う。
  motivation: アイリスを回収し、灯台の力を帝国の兵器として利用することで、永遠の秩序を確立すること。
  relationships:
  - name: カイト
    relation: 排除すべき不確定要素
  - name: アイリス
    relation: 回収対象の演算機
  arc: 完璧な管理社会を築こうとするが、予測不能な「絆」と「技術の解放」によって、自らが築いた秩序が崩壊していくのを目の当たりにする。
- name: リナ・ヴェイン
  role: 脇役
  age: 19
  gender: 女性
  appearance: 赤い飛行ジャケットにゴーグル、ショートヘア。小柄だが非常に身軽な動きをする。
  personality: 向こう見ずで自由奔放。リスクを恐れず、面白いことには首を突っ込みたがる。一人称は「アタシ」。
  speech_style: 快活で、流行りのスラングやぶっきらぼうな言い回しを混ぜる。
  background: 浮遊島の無法地帯で名を馳せる、腕利きの小型艇操縦士。情報の運び屋としての顔も持つ。
  motivation: 帝国の監視を掻い潜り、空の果てにあるという「伝説」を自分の目で確かめること。
  relationships:
  - name: カイト
    relation: 信頼できる整備士
  - name: アイリス
    relation: 興味の対象
  arc: 単なる「金と刺激」のために動いていたが、カイトたちの冒険に加わることで、世界の未来を守るための勇気を手に入れる。
