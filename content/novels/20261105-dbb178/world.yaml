title: 雲海最果ての灯火と、迷子の演算機
genre: スチームパンク冒険
tone: 疾走感のあるエンタメ調
pov: 三人称
tense: 過去形
setting: 浮遊島が点在し、蒸気機関で駆動する文明圏。地表は猛毒の雲海に覆われ、人類は空に逃れた世界。
premise: 落ちぶれた天才整備士の青年が、ジャンク屋のゴミ溜めで「自分を導いてほしい」と願う記憶喪失のAIを拾う。AIが保持していたのは、世界を浄化すると伝えられる伝説の「最果ての灯台」への座標だった。帝国の追手から逃れ、空を駆けるハイスピードな逃避行と冒険が始まる。
themes:
- 喪失と再生
- 自由への渇望
rules:
- 蒸気圧の過剰上昇は爆発を招くため、常にリミッター管理が必要である
- 浮遊島の外縁から落下した者は、地表の毒霧により生存不可能である
- 古代AIは現行の蒸気技術を遥かに凌駕する演算能力を持つが、外部からの電力供給を必要とする
plot_outline:
- '序盤: ジャンク屋の青年が迷子のAIと出会い、直後に帝国の特務隊に襲撃される。ボロボロの小型艇を無理やり起動させ、間一髪で脱出する。'
- '中盤: 灯台を目指して浮遊島を転々とし、癖のある操縦士や情報屋を仲間に加える。帝国の追撃を振り切る空中戦を繰り返し、AIの記憶が断片的に回復していく。'
- '終盤: 雲海最深部に眠る「古い灯台」に到達。帝国の総督がAIを奪い、世界を統制するための兵器として利用しようと最終攻勢を仕掛ける。'
- '結末: 整備士とAIの絆が灯台を再起動させ、世界を覆う毒霧を消し去る。人々は数百年ぶりに地表へと降り立ち、新たな時代の航海が始まる。'
style_notes: 短文をたたみかけるアクション描写。キャラクター同士の掛け合い中心のテンポ良い会話劇。場面転換を速くし、各話の結びに強い引きを作る。擬音を排し、金属の歪みや火花の散乱など物理的な動きで衝撃や速度を表現する。
