- name: 柳 紬
  role: 主人公
  age: 26
  gender: 女性
  appearance: 柔らかな茶髪を後ろで緩く結んでいる。少しおっとりとした雰囲気で、常に古書店の使い込まれたエプロンを着用している。
  personality: おっとりとしていて少し天然なところがあるが、本に対する敬意は人一倍強い。一人称は「わたし」。
  speech_style: 「〜ですね」「〜でしょうか」といった、丁寧で穏やかな話し方。時々、考え事をして言葉が詰まる。
  background: 祖父が遺した古書店「ことの葉堂」を継いだばかりの新人店主。本は好きだが、人と深く関わることには苦手意識がある。
  motivation: 亡き常連客の遺言に従い、指定された本を届けることで、祖父が愛したこの店と街の繋がりを守ること。
  relationships:
  - name: 琥珀
    relation: 店に居着いている猫
  - name: 佐藤健一
    relation: 街の常連客であり、相談相手
  arc: 自分の未熟さに悩みながらも、本を通じて人の心に触れることで、店主としての自信と、人との繋がりを楽しむ心を取り戻していく。
- name: 琥珀
  role: 相棒
  age: 5
  gender: オス
  appearance: 額に星のような模様がある三毛猫。毛並みは艶やかで、どこか品がある。
  personality: 非常に賢明で落ち着いており、紬の感情を敏感に察知する。時折、不思議な行動で紬を導く。
  speech_style: 言葉は話さないが、鳴き声やしなやかな仕草で、肯定や促しを表現する。
  background: ある雨の日、店に迷い込んできた名前のない猫。紬に「琥珀」と名付けられる。
  motivation: 紬が遺言の本当の意味に気づけるよう、さりげなく、時に大胆に導くこと。
  relationships:
  - name: 柳紬
    relation: 信頼し合うパートナー
  arc: ただの居候から、店と紬の日常に欠かせない、精神的な支柱のような存在へと変わっていく。
- name: 佐藤 健一
  role: 脇役
  age: 65
  gender: 男性
  appearance: 白髪混じりの短髪に、知的な印象を与える眼鏡。いつも使い古した革の手帳を持ち歩いている。
  personality: 物静かで思慮深く、街の歴史に詳しい。紬の不器用さを温かく見守る、良き理解者。一人称は「私」。
  speech_style: 「ふむ」「〜ですよ」といった、ゆったりとした落ち着いた語り口。
  background: 前店主（紬の祖父）からの古い友人であり、街の行く末を静かに見守ってきた人物。
  motivation: 紬がこの街と店に馴染み、新しい「ことの葉堂」の形を見つけるのを手助けすること。
  relationships:
  - name: 柳紬
    relation: 店主と、見守る常連客
  arc: 紬の活動を通じて、自身の過去の思い出や、街との新たな繋がりを再確認していく。
- name: 伊藤 結衣
  role: 脇役
  age: 22
  gender: 女性
  appearance: 都会的な服装だが、どこか寂しげな表情を浮かべている。少し疲れを感じさせる瞳をしている。
  personality: 真面目で責任感が強いが、人間関係に疲れ、周囲に対して心を閉ざしがち。一人称は「私」。
  speech_style: 少し早口で、最初は警戒心の強い、よそよそしい丁寧な話し方。
  background: 遺言によって届けられた本を受け取る、街に住む若い女性。ある事情から人と距離を置いている。
  motivation: 本を通じて届けられたメッセージを受け取り、止まっていた自分の時間を動かすこと。
  relationships:
  - name: 柳紬
    relation: 本を届けてくれた恩人
  arc: 本に込められた優しさに触れることで、閉ざしていた心を少しずつ開き、再び誰かと向き合う勇気を取り戻す。
