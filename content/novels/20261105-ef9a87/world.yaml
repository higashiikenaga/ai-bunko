title: 猫柳古書店の、おすそ分け遺言帳
genre: 日常ほのぼの
tone: 軽やかで温かい、おっとりとした空気感
pov: 一人称（わたし）
tense: 現在形
setting: 地方都市の路地裏にある、静かな古書店「ことの葉堂」
premise: わたしが店を継いだ古書店に、ある日一冊の不思議な「遺言帳」が届きます。そこには財産ではなく、「誰に、どの本を届けてほしいか」というささやかなお願いが綴られていました。店に居着いた名前のない猫と一緒に、本に込められた優しさと、すれ違った心をつなぎ直す物語です。
themes:
- 善意の連鎖
- 言葉の伝え方
rules:
- 殺人は一切起きない
- 謎はすべて人の善意や勘違いから生じている
- 猫は喋らないが、物語の導き手として機能する
plot_outline:
- '序盤: どこか抜けている店主の『わたし』のもとに、亡くなった常連客から『本を届けてほしい』という奇妙な遺言状が届く。'
- '中盤: 遺言に従い、特定の誰かに向けた本を届けていく。その過程で、本に挟まれたメモや書き込みから、かつての持ち主たちが抱えていた小さな誤解や、伝えられなかった感謝が明らかになり、人々が笑顔を取り戻していく。'
- '終盤: 遺言状の最後に記されていた『一番大切な人へ』という宛先不明の指示。誰に届けるべきか迷うわたしを、店に居着いた名前のない猫が不思議な行動で導く。'
- '結末: 遺言の真の目的は、受け取った人々がまた店に集まり、新しい縁を結ぶことだったと気づく。わたしは猫と共に、今日ものんびりと店を開ける。'
style_notes: 「わたし」の視点から、少しとぼけた口調で語る。難しい言葉は避け、お茶を淹れる音や古い紙の匂いなど、五感を刺激する描写を散りばめる。解決策は鋭い推理ではなく、相手への共感と、ちょっとした勘違いをほどく優しさで導き出すこと。
