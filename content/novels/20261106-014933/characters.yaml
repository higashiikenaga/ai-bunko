- name: 朔夜 零
  role: 主人公
  age: 19
  gender: 男性
  appearance: 青白い肌に、眠たげな半眼。サイズの合わない白いシャツを纏い、常にどこか心ここにあらずな佇まいをしている。
  personality: 内向的で厭世的。現実世界に馴染めず、時間の流れに疎い。一人称は「僕」。
  speech_style: 控えめで口数が少なく、語尾を濁らせる傾向がある。
  background: 美大生。色彩感覚に優れているが、自身の描く絵に「生きた時間」が欠けていることに絶望し、鏡の中の静止した世界に惹かれた。
  motivation: 鏡の世界から脱出し、現実へと帰還すること。
  relationships:
  - name: 鏡花
    relation: 案内人を装った捕食者
  - name: 閑
    relation: 共鳴し合う孤独な犠牲者
  arc: 受動的に流されていた人生から、自らの境界線を切り裂くという残酷な決断を下す能動的な主体へと変化する。
- name: 鏡花
  role: 敵役
  age: 不詳（外見は20代）
  gender: 女性
  appearance: 鮮やかな朱色の振袖に、狐の面を斜めに被っている。瞳の中に時計の歯車のような紋様が浮かんでいる。
  personality: 享楽的で残酷。礼儀正しい言葉遣いの裏に、獲物を追い詰める狩人のような冷徹さを隠し持っている。一人称は「私」。
  speech_style: 歌うようなリズムで話し、相手を翻弄する古風な言い回しを用いる。
  background: 祭りの夜を維持するための「管理人」。折れた剣の欠落を埋めるため、外の世界から迷い込んだ人間の記憶を効率よく回収する役割を担う。
  motivation: 零の記憶と存在を供物として捧げ、世界の歪みを完全に修復すること。
  relationships:
  - name: 朔夜 零
    relation: 極上の供物候補
  arc: 完璧な管理を誇っていたが、零が「自分を切り裂く」という想定外の行動に出たことで、初めて制御不能な恐怖を味わう。
- name: 閑
  role: 脇役
  age: 不詳（外見は10代後半）
  gender: 女性
  appearance: 色が褪せた灰色の着物。腕や足の先が鏡の破片のように欠けており、常に微かにチリチリと音を立てて剥離している。
  personality: 虚無的で悲しげ。記憶をほとんど失っているため、断片的な思考しか持てない。一人称は「私」。
  speech_style: 言葉が途切れ途切れで、同じフレーズを繰り返すなどの反復癖がある。
  background: かつて鏡の世界に迷い込み、記憶の大部分を剣に捧げられた元人間。今は祭りの踊り子として、意識のないまま踊らされ続けている。
  motivation: 自分が誰であったかを思い出すこと、あるいは完全に消滅して楽になること。
  relationships:
  - name: 朔夜 零
    relation: かつての自分を重ねる救済の対象
  - name: 鏡花
    relation: 逃れられない支配者
  arc: 零に警告を発することで、忘れ去られていた「個」としての意思を取り戻し、最期に静かな安らぎを得る。
