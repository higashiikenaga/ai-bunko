title: 硝子の揺籃、あるいは刻を断つ折れた剣の祭礼
genre: ホラー
tone: 幻想的で不条理、美しき狂気
pov: 一人称
tense: 過去形
setting: 鏡の中に存在する、終わらない祭りの夜の集落
premise: 鏡の向こう側には、提灯の火が揺らめく永遠の『祭りの夜』が居座っている。人々は時計の秒針が刻む拍子に合わせて、壊れた人形のように踊り続けている。私はそこで、時間を支配するはずの、折れた剣を見つけてしまう。その剣を手に取った瞬間、私の指先から現実が剥がれ落ち、鏡の破片へと変貌していく。
themes:
- 時間の不条理
- 自己の境界の喪失
rules:
- 鏡は異界への扉であり、一度視線を外すと元の世界へ戻ることはできない
- 祭りの音楽（拍子）が乱れた者は、即座に時計の部品へと変貌する
- 折れた剣の欠落は、持ち主の記憶を糧として埋まっていく
plot_outline:
- '序盤: 自室の鏡に、見知らぬ祭りの情景が映り込む。吸い寄せられるように鏡の枠を通り抜け、色彩豊かで、しかしどこか非現実的な、終わらない祭りの夜へと迷い込む。'
- '中盤: 村人たちの動きが、巨大な時計の歯車のように精密であることを知る。彼らは「折れた剣」を神聖視し、その欠落を埋めるために、人間の記憶を供物として捧げていた。私は自分が次の供物であることを悟る。'
- '終盤: 逃げ場を求めて時計塔へ駆け込むが、そこは世界の歪みを補正するための巨大な機構だった。鏡の中の自分と、現実の自分が、鏡の境界を挟んで互いの存在を侵食し始める。'
- '結末: 私は剣を振り、自分自身の境界線を切り裂く。意識が遠のき、目が覚めると元の部屋に戻っていた。しかし、鏡の中には、祭りの衣装を纏い、永遠に踊り続ける「私」が閉じ込められていた。'
style_notes: 夢と現実が混ざり合う不条理を、美しく幻想的な比喩を用いて描く。鏡、時計、扉といったモチーフを繰り返し、物語の進行に伴い一人称の論理が徐々にねじれていくような、感覚的かつ不気味な文体を徹底する。
