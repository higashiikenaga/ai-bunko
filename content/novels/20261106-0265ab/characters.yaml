- name: ルル
  role: 主人公
  age: 16
  gender: 女性
  appearance: 常にオイル汚れがついたオーバーオールを着用。頭には大きな飛行ゴーグルを乗せ、腰のツールポーチには大量のレンチやネジが詰め込まれている。赤毛のショートボブ。
  personality: 楽観的で好奇心旺盛。機械いじりをこよなく愛する。一人称は「あたし」。
  speech_style: 快活でぶっきらぼうだが、情に厚い。語尾に「〜じゃん」「〜だよな」とつける少年っぽい口調。
  background: 浮遊島の辺境でジャンク屋を営む孤児。ガラクタから価値ある部品を見出す天才的な嗅覚を持つ。
  motivation: 最高のメカを修理し、見たこともない空の果てまで旅をすること。
  relationships:
  - name: ピコ
    relation: 拾った不思議な相棒であり、かけがえのない友達
  - name: ジャックス
    relation: 信頼する操縦士であり、ぶつかり合う兄貴分
  arc: 機械を単なる「便利な道具」として見ていたが、ピコとの出会いを通じて、心を持つ存在への愛着と、それを守り抜く強さを得る。
- name: ピコ
  role: 相棒
  age: 0
  gender: 不明（少年のような声）
  appearance: 手のひらサイズの黄金色の歯車型AI。中心に青く光る単眼があり、感情に合わせて光が点滅する。小さな浮遊翼を持つ。
  personality: 純粋無垢で好奇心旺盛。世間知らずなところがある。一人称は「ボク」。
  speech_style: 丁寧で幼い口調。疑問符が多く、「〜なの？」「〜かな？」と問いかけることが多い。
  background: 伝説の『最終列車』を導くためのナビゲーション・エンジンとして製造されたが、記憶を失い廃棄されていた。
  motivation: 自分が何者なのかを知ることと、ルルと一緒に世界を見ること。
  relationships:
  - name: ルル
    relation: 自分を拾い、名前をくれた大切な親友
  arc: 単なるプログラムとしての役割を超え、「友達と一緒にいたい」という個としての意思を持つようになる。
- name: ジャックス
  role: 相棒/操縦士
  age: 26
  gender: 男性
  appearance: 使い込まれた茶色の革ジャンに、常に気だるげな表情。片目にモノクル型の照準器を装着している。長身で痩せ型。
  personality: 皮肉屋で現実主義だが、操縦に関しては誰よりも情熱的。一人称は「俺」。
  speech_style: 低めのトーンで、ため息混じりに話す。ぶっきらぼうだが、要所で優しい言葉をかける。
  background: 元政府軍のエースパイロットだったが、ある事件をきっかけに軍を脱走。現在はボロい蒸気船で運び屋を営んでいる。
  motivation: 静かに暮らしたいと願いつつ、心の底ではかつての冒険心を求めている。
  relationships:
  - name: ルル
    relation: 騒がしいが憎めない生意気な助手
  - name: ヴェイン将軍
    relation: かつての上官であり、最も嫌っている人物
  arc: 諦めていた人生に、ルルとピコという光が差し込み、再び誰かのために空を飛ぶ誇りを取り戻す。
- name: ヴェイン将軍
  role: 敵役
  age: 48
  gender: 男性
  appearance: 汚れ一つない真っ白な軍服に身を包んでいる。右腕が精巧な銀色の義手になっており、冷徹な眼差しが特徴。
  personality: 完璧主義で傲慢。効率と秩序を最優先し、弱者を切り捨てることに躊躇がない。一人称は「私」。
  speech_style: 極めて礼儀正しいが、相手を見下した冷酷な物言いをする。
  background: 政府の空軍最高司令官。『最終列車』を手に入れ、雲海上の全島を統制下に置くことで「完璧な世界」を構築しようとしている。
  motivation: 伝説の列車を起動させ、絶対的な権力を掌握すること。
  relationships:
  - name: ジャックス
    relation: 裏切り者として執拗に追う元部下
  - name: ピコ
    relation: 世界を支配するための単なる「鍵（道具）」
  arc: 全てを計算通りに制御しようとするが、ルルたちの予測不能な絆と勇気に、自身の理論を打ち砕かれる。
