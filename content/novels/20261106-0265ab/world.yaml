title: 空飛ぶ歯車と、桜舞う旧世界の灯台
genre: スチームパンク冒険
tone: 明るく軽快で、どこか懐かしい冒険活劇
pov: 一人称（ルル）
tense: 現在形・過去形混在
setting: 伝説の『最終列車』が走り続ける、雲海を超えた未知の浮遊大陸と、かつて文明が栄えた放棄された島々
premise: 伝説の『最終列車』に乗り込み、未知の空へと旅立ったあたしとピコ、それからジャックス！　でも、新しい世界は想像以上に騒がしくて、お腹もペコペコ！　そんなある日、列車が立ち寄ったのは、空中に浮かぶ美しい『桜』が舞い散る、古い灯台のある島だった。でも、そこには世界政府の影と、ピコの力が呼び寄せてしまった『空の嵐』の予兆が潜んでいたみたい……。美味しいパイを食べながら、あたしたちの新しい大冒険がまた始まるよ！
themes:
- 未知への好奇心
- 絆と食欲
- 失われた文明の記憶
rules:
- ピコの黄金の力は、周囲の機械装置と共鳴して出力を増幅させる
- 世界政府は未登録のエネルギー反応を執拗に追跡する
- 浮遊大陸の移動は、蒸気機関の出力と気流の安定性に依存する
plot_outline:
- '序盤: 最終列車での賑やかな生活。ピコの力で船の整備はバッチリだけど、あたしのお腹はいつも空っぽ！　ある日、列車が桜の花びらが舞う奇妙な浮遊島に接近する。そこには、かつて航路を導いたという『古い灯台』があった。'
- '中盤: 灯台を調査する一行だが、そこには世界政府の新型探査機が待ち構えていた！　灯台の地下には、桜のエネルギーを利用した古代の動力源が眠っており、ピコはその反応に強く共鳴してしまう。追跡をかわしながら、ジャックスの操縦で灯台の謎を解き明かしていく。'
- '終盤: 灯台が起動すると、巨大な桜の嵐が巻き起こり、世界政府の艦隊が押し寄せる。ヴェイン将軍の執念による総攻撃に対し、ピコとスカイ・ジャンク、そして灯台の力が一つに重なり、眩い光の防壁を作り出す。'
- '結末: 嵐が去った後、灯台は静かに眠りについた。世界政府を退けたあたしたちは、また新しい空の景色を目指して出発！　お祝いに、ジャックスが用意した特製ベリーの蒸気パイを頬張りながら、次の目的地を指さすの！'
style_notes: 一人称「あたし」による、ツッコミ満載の軽快な語り口。キャラクター同士の掛け合いはテンポよく、可愛げを重視する。特に、旅先で見つける珍しい食べ物や、焼きたてのパン、熱々のパイなどの描写には徹底的にこだわり、読者の食欲をそそること。各エピソードの終わりに、ちょっとしたボケやクスッとする日常のワンシーンを必ず入れること。
