- name: リアナ・サマー
  role: 主人公
  age: 19
  gender: 女性
  appearance: 栗色のポニーテールに、常に小麦粉がついた白いエプロン姿。好奇心に満ちた大きな瞳が特徴。
  personality: お菓子作りへの情熱は人一倍だが、盛り付けで皿を割ったり、砂糖と塩を間違えたりするドジっ子。前向きで天真爛漫。一人称は「あたし」。
  speech_style: 明るく快活。語尾に「～っす！」「～ですよね！」と弾むような口調。
  background: 最高のスイーツで人を幸せにしたいという夢を持って、不夜城の街にやってきた修行中の見習い店員。
  motivation: 客の悩みや気分に完璧にマッチした「魔法のレシピ」を完成させること。
  relationships:
  - name: ソロモン
    relation: 雇い主であり、尊敬する師匠
  - name: カイル
    relation: 口は悪いが信頼し合っている常連客
  arc: 失敗ばかりの毎日から、相手の心に寄り添うことで「正解」ではないけれど「最高の味」を作れる自信を持つまで成長する。
- name: ソロモン・クロムウェル
  role: 相棒/メンター
  age: 45
  gender: 男性
  appearance: 銀縁眼鏡に仕立ての良いベストを着用。常に穏やかな微笑みを浮かべている長身の男性。
  personality: 冷静沈着で包容力がある。店全体の調和を重視し、リアナの失敗も「新しい発見だね」と肯定する。一人称は「私」。
  speech_style: 丁寧で物腰柔らか。比喩表現を多く使い、相手に気づきを与える話し方。
  background: かつて王宮などで腕を振るった伝説的なパティシエだが、ある理由で喧騒を離れ、街の片隅にこの店を開いた。
  motivation: 疲れた人々が心から休息できる「精神的なオアシス」を守ること。
  relationships:
  - name: リアナ・サマー
    relation: 危なっかしいが才能ある弟子
  - name: セレーネ
    relation: 長年の知人で、互いの孤独を理解し合う友人
  arc: 完璧主義だった過去を捨て、リアナがもたらす「不完全な賑やかさ」に本当の心地よさを再発見する。
- name: カイル・ヴァン
  role: 脇役/常連客
  age: 26
  gender: 男性
  appearance: 砂埃にまみれた旅装束。日焼けした肌に鋭い眼差しを持つが、甘いものを食べている時だけ頬が緩む。
  personality: ぶっきらぼうで皮肉屋。しかし根は情に厚く、困っている人を放っておけない。一人称は「俺」。
  speech_style: ぶっきらぼうな短文。「ふん、悪くないな」「甘すぎるだろ」など。
  background: 砂漠を渡り歩き、珍しい品を扱う行商人。定住せず旅を続けているが、この店だけは必ず立ち寄る。
  motivation: 旅の疲れを癒やし、日常という名の安らぎを一時的に味わうこと。
  relationships:
  - name: リアナ・サマー
    relation: 賑やかな妹のように思っており、新作の試食役を押し付けられがち
  arc: 孤独な旅こそが正解だと思っていたが、店の人々と過ごす時間を通じて、「帰る場所」がある安心感を知る。
- name: セレーネ
  role: 脇役/常連客
  age: 31
  gender: 女性
  appearance: 白に近いプラチナブロンドを低く結い、指先には常にインクや油汚れがついている。眠そうな目。
  personality: 超合理的で現実主義。夜通し働く時計職人で、極度の不眠症。甘いものでしか脳をリセットできない。一人称は「私」。
  speech_style: 淡々とした理詰めの話し方。感情の起伏が少ない。
  background: 街の精密機械を管理する熟練の職人。仕事への責任感が強く、自分の休息を後回しにする傾向がある。
  motivation: 仕事のストレスを解消し、短時間でも深い休息を得ること。
  relationships:
  - name: ソロモン・クロムウェル
    relation: 信頼している相談相手
  - name: リアナ・サマー
    relation: 予測不能な動きをするリアナを興味深く観察している
  arc: 効率のみを追求する生活から、あえて「無駄な時間」や「甘い贅沢」を楽しむ心の余裕を取り戻していく。
