title: 真夜中の砂漠スイーツ・パレット
genre: 日常ほのぼの
tone: 明るく軽快、賑やかで心温まる雰囲気
pov: 一人称（あたし）
tense: 現在形・過去形混合
setting: 24時間、灯りが消えることのない不夜城のような砂漠の街。その片隅にある小さなカフェ。
premise: 眠らない街の砂漠に、奇跡のように佇むオアシス。そこにあるのは、お疲れさまの胃袋を救う甘い魔法、カフェ『デザート・ドリーム』。あたしは、この店で働く、お菓子作りにはうるさいけど少しドジな店員。仕事帰りの旅人や、眠れない街の住人たちが持ち込む悩みは、いつだって一口のケーキで解決しちゃう！？
  食べること、笑うこと、それだけで明日も頑張れる、そんな毎日の記録。
themes:
- 食による癒やし
- 孤独と繋がり
rules:
- この街は砂漠の中にあるが、夜も昼も街の灯りが絶えない
- カフェのメニューは、客の『今一番足りないもの』に合わせて店主が即興で作る
plot_outline:
- '序盤: 眠らない街の喧騒から逃れるように、あたしがカフェでのバイトを始める日常を描く。初めての客との、甘い失敗談。'
- '中盤: 街の珍客たちが次々とやってくる。砂漠を旅する商人の悩みや、夜通し働く職人の疲れを、新作のシュークリームで癒やすエピソード群。'
- '終末: 街に訪れる一時的な砂嵐。店が閉まりそうになる不安の中、客たちがそれぞれの『甘い思い出』を語り合い、店を守ろうとする。'
- '結末: 嵐が去り、またいつもの賑やかな朝が来る。あたしは新しいレシピを考えながら、今日も元気に『いらっしゃいませ！』と叫ぶ。'
style_notes: 一人称「あたし」による、テンポの良い軽快な語り。読者に語りかけるようなツッコミを多用し、キャラクターの可愛げを強調する。特にスイーツの描写は、食べた瞬間の食感や香りが伝わるよう、美味しそうに、かつ情熱的に書くこと。毎話、クスッと笑える小さなエピソードを必ず盛り込む。
