- name: 湊 奏汰
  role: 主人公
  age: 17
  gender: 男性
  appearance: 鋭い眼光と、少し長めの黒髪。痩身だが、マウンドに立つと独特の威圧感を放つ。指先には長年の練習による硬いタコがある。
  personality: 冷静沈着を装っているが、内面には激しい情熱と挫折による傷を抱える。一人称は「俺」。
  speech_style: 言葉数は少なく、ぶっきらぼう。しかし、要所では熱を帯びた話し方をする。
  background: かつて「天才」と呼ばれた投手。双子の弟・海斗との決別と、ある挫折を経て、野球から離れかけていた。廃部寸前のチームを再建するためにマウンドへ戻る。
  motivation: 野球を通じて自分自身を肯定すること、そして弟との断絶した関係を修復すること。
  relationships:
  - name: 湊 海斗
    relation: 双子の弟
  - name: 瀬戸 彰人
    relation: チームメイト・捕手
  arc: 過去の執着から解放され、現在の一球にすべてを懸ける覚悟を決める。
- name: 湊 海斗
  role: 重要人物/ライバル
  age: 17
  gender: 男性
  appearance: 奏汰と瓜二つの容姿だが、整った身なりと洗練された動作が特徴。常に自信に満ちた表情をしている。
  personality: 合理的で負けず嫌い。奏汰とは対照的に、感情を露わにすることを嫌う。一人称は「俺」。
  speech_style: 理路整然としており、どこか突き放すような冷たさがある。
  background: 奏汰の双子の弟。兄とは異なる道を歩み、エリートとしての地位を築いているが、心の底では兄への複雑な感情を抱えている。
  motivation: 兄を超え、自分自身の存在を証明すること。
  relationships:
  - name: 湊 奏汰
    relation: 双子の兄
  arc: 兄を避けるのではなく、一人の対等なプレイヤーとして向き合う勇気を得る。
- name: 鳳 煉
  role: 敵役
  age: 18
  gender: 男性
  appearance: 強靭な肉体と、獲物を射抜くような執念深い瞳。マウンドでの存在感は圧倒的。
  personality: 勝利への執着が異常に強く、プライドが高い。一度の敗北を許さない完璧主義者。一人称は「俺」。
  speech_style: 威圧的で、相手を威圧するような重みのある話し方。
  background: かつて湊兄弟を圧倒し、彼らの挫折の引き金となった宿敵。圧倒的な実力を持つエース投手。
  motivation: 誰にも負けない絶対的な支配者としての地位を維持すること。
  relationships:
  - name: 湊 奏汰
    relation: 宿敵
  arc: 敗北の屈辱の中で、自身の野球に対する真の執念と向き合う。
- name: 瀬戸 彰人
  role: 相棒/脇役
  age: 17
  gender: 男性
  appearance: がっしりとした体格。常に笑顔を絶やさないが、キャッチャーとしての眼光は鋭い。
  personality: 明るく、面倒見が良い。チームのムードメーカーでありながら、冷静な判断力を持つ。一人称は「俺」。
  speech_style: 快活で、仲間を鼓舞するような力強い口調。
  background: 廃部寸前のチームの捕手。奏汰の才能を誰よりも信じ、彼が再びマウンドに立つための支えとなる。
  motivation: チームを全国大会へ連れて行くこと、そして奏汰の最高の相棒になること。
  relationships:
  - name: 湊 奏汰
    relation: チームメイト・エース
  arc: 単なる熱血漢から、チームを精神的に支える真のリーダーへと成長する。
