title: 残響のストライク・ゾーン
genre: スポーツ青春
tone: 熱血・躍動感・泥臭い
pov: 三人称（試合中は現在形）
tense: 混合（日常は過去形、試合は現在形）
setting: 現代、不夜城と呼ばれる港湾都市・湊湾市。24時間眠らない街。
premise: 眠らない街、湊湾市で、不遇の天才投手・湊（みなと）は、双子の弟・海（かい）との決定的な決別を経て、最後の野球人生を歩む。街の喧騒を背に、湊は廃部寸前のチームを率いて全国を目指す。マウンドで感じる熱風、指先に食い込む縫い目。一球ごとに命を削るような、極限の攻防が幕を開ける。
themes:
- 兄弟の決別と再生
- 不夜城の孤独と情熱
rules:
- 物語のクライマックスでは、必ず敗北した相手側の心理描写を挿入する
- 試合の描写は、選手の鼓動、汗の飛沫、ボールの回転、観客の熱狂を現在形でリアルタイムに描写する
plot_outline:
- '序盤: 湊湾市の喧騒の中で、才能を持ちながらも挫折した双子の片割れ、湊が野球部再建のために奔走する。弟・海との断絶した関係が描かれる。'
- '中盤: 湊のチームが地方大会で快進撃を見せる。試合の描写は激しい現在形で綴られ、読者をスタジアムの熱狂へと引き込む。'
- '終盤: 決勝戦。対峙するのは、かつて自分たちを追い落とした宿敵。試合中、敗北を喫した相手投手の、屈辱と執念が混じる視点が一度描かれる。'
- '結末: 勝敗を超えた先にある、双子の再会。眠らない街の夜明けとともに、湊は新たな一歩を踏み出す。'
style_notes: 汗の匂い、肺を焼くような息づかい、土の感触を徹底的に描写すること。試合シーンでは「投げる」「打つ」といった動作を現在形で記述し、実況さながらの速度感と臨場感を持たせる。情緒的な叙述よりも、身体感覚に訴えかける文体を貫くこと。
