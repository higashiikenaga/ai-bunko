- name: サイラス・ヴェイン
  role: 主人公
  age: 26
  gender: 男性
  appearance: 無精髭を生やし、煤けたゴーグルを額にかけた、風雨に晒された身なりの青年。左腕には旧式の機械式義手をつけている。
  personality: 現実主義だが根は好奇心旺盛。古い機械をいじるのが好き。一人称は「俺」。
  speech_style: 淡々としているが、機械や航海のことになると早口になる。
  background: 浮遊都市群のしがない航海士。ある雨の夜に謎の古書店で伝説の設計図を手に入れてしまい、帝国に追われる身となる。
  motivation: 「霧雨の書庫」で見つけた設計図の謎を解き、世界の気圧の真実を明らかにすること。
  relationships:
  - name: エレーナ・ヴォルコフ
    relation: 追う者から追われる者へ、利害の一致で協力する関係
  - name: クロエ
    relation: 道中で拾う、古い防衛機構の少女
  arc: 単なるしがない航海士から、世界の運命を選択する決意を持った調停者へと成長する。
- name: エレーナ・ヴォルコフ
  role: 敵役（のちに協力者）
  age: 30
  gender: 女性
  appearance: 厳格な帝国の制服を纏い、黄金の刺繍が入った軍帽をかぶった冷徹な美女。右目にスチーム式の単眼鏡を装着している。
  personality: 義務感が強く冷徹に見えるが、実は帝国市民の生存を第一に考えている。一人称は「私」。
  speech_style: 命令口調で論理的。無駄な感情を排した話し方をする。
  background: 帝国の気象管理特務機関の将校。大気圧制御機構の流出を防ぎ、体制を維持するためにサイラスを追跡する。
  motivation: 国家の秩序と都市群の崩壊を防ぐため、設計図を回収しサイラスを拘束すること。
  relationships:
  - name: サイラス・ヴェイン
    relation: 追跡対象から、雲海の真実を共有する共犯者へ
  arc: 帝国の絶対的な正義を疑わずに行動していたが、雲海の最下層で過酷な真実を知り、サイラスと共に新たな選択を選ぶ。
- name: クロエ
  role: 相棒
  age: 14
  gender: 女性（自律機械人形）
  appearance: 青白く透き通るような肌を持ち、背中に精巧な蒸気機関のパイプと冷却弁を背負った少女。衣服は古いが精巧なつくり。
  personality: 感情表現が乏しく淡々としているが、時折人間らしいユーモアを見せる。一人称は「私（わたし）」。
  speech_style: 少し機械的だが、文法は正確で丁寧語を好む。
  background: 雲海の深層に眠る旧時代の管理施設で作られた自律型の自動防衛機構。サイラスの小型浮遊艇に回収される。
  motivation: 設計図に記された「最終調整」のプロトコルを、正しく完了させること。
  relationships:
  - name: サイラス・ヴェイン
    relation: 整備士と機械、あるいは保護者と被保護者のような信頼関係
  arc: プログラムされた命令に従うだけの存在から、自らの意志で未来を選び取る存在へと変化する。
