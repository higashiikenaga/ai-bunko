title: 黄昏の圧力計と、雲海の階層律
genre: スチームパンク冒険
tone: 硬派で重厚、緻密な技術描写を伴う冒険譚
pov: 三人称
tense: 過去形
setting: 浮遊都市群が文明の主軸を成す「高層気流圏」。厚い腐食性の雲海に覆われ、地表は数世紀にわたり未踏の領域となっている。
premise: 重力制御に依存する浮遊艇の航海士サイラスは、酸性雨の降る夜にだけ姿を現す古書店「霧雨の書庫」で、未知の設計図が挟まった一冊の古本を手に取る。それは、かつて世界の気圧を一定に保っていたとされる伝説の「大気圧制御機構」の所在を示すものだった。帝国の追っ手と空の略奪者たちの間で、サイラスは失われた技術の真実を求めて、雲海の階層を降り、未知の領域へと舵を切る。
themes:
- 技術の継承と文明の維持
- 観測による世界の定義
rules:
- 浮力は蒸気圧と高密度気体の循環によって制御される
- 酸性雨は金属を急速に腐食させるため、防食コーティングされた機体のみが生存可能である
- 古書店は、特定の気圧と湿度、および局所的な電磁場の干渉が重なった瞬間にのみ、物理的な位相を固定する
plot_outline:
- '序盤: 航海士サイラスが雨の夜に古書店で謎の設計図を見つけ、帝国の特務機関から逃れるために旧式の小型浮遊艇で雲海の深層へと逃走する。'
- '中盤: 設計図の解析を進める中で、サイラスは「音響共鳴蒸気機関」という未知の推進技術を独学で応用し、敵の追跡を振り切る。道中、失われた文明の自動化された防衛機構と遭遇する。'
- '終盤: 雲海最下層、伝説の制御施設に到達。そこでは世界の気圧バランスを維持するために、人類が何を代償にしてきたのかという残酷な物理学的真実が明かされる。'
- '結末: サイラスは既存のシステムを破壊するのではなく、新しい圧力平衡を導き出すための『調整』を試みる。壊れゆく世界の中で、新たな航路を切り拓く決意を固める。'
style_notes: 緻密な工学描写を売りにする。蒸気機関のピストン運動、圧力弁の挙動、あるいは浮力制御における流体力学的な計算プロセスなどを、専門用語を用いて自然な形で記述すること。感情的な叫びよりも、事象の物理的・論理的な帰結を優先した硬派な文体を用いる。毎話、その世界の理を支える架空の技術（例：音響共鳴蒸気機関、気圧感知型自動航法計など）を一つ、詳細な描写と共に提示すること。
