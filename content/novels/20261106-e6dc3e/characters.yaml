- name: 旭日 海 (あさひ かい)
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で青白い肌。光を拒絶するように伏せがちな瞳と、サイズの合わない古びた紺色のコートを纏っている。
  personality: 内向的で静謐。深い喪失感から感情が摩耗しており、世界に対して距離を置いている。一人称は「僕」。
  speech_style: 口数が少なく、語尾が消え入るような儚い話し方。丁寧だが、どこか壁を感じさせる。
  background: 数年前の海難事故で両親と妹を同時に失った。生き残った罪悪感から、心に大きな空洞を抱えたまま、導かれるように海辺の町へ辿り着いた。
  motivation: 結晶に映る家族の記憶に浸ることで、喪失した時間を埋め合わせたいと願う。
  relationships:
  - name: 草薙 栞
    relation: 雇い主であり、危うい精神状態を案じている監視役
  - name: 東間 蓮
    relation: 正反対の気質を持つ、唯一の友人候補
  arc: 過去の記憶に執着し、自己を喪失しかけるが、最終的に「忘却」と「受容」こそが再生への道であると悟る。
- name: 草薙 栞 (くさなぎ しおり)
  role: 相棒/導き手
  age: 38
  gender: 女性
  appearance: 知的な眼鏡をかけ、髪をきっちりと後ろで結んでいる。機能性を重視したダイビングスーツやフィールドウェアを着用。
  personality: 合理的で現実主義。一見冷徹に見えるが、根底には強い責任感と、静かな慈愛を秘めている。一人称は「私」。
  speech_style: 明快で断定的な口調。冗談を言わず、核心を突く厳しい言葉を投げかけることが多い。
  background: 海底遺跡の主任研究員。かつて自身の研究への執着から大切な人間関係を壊した経験があり、遺跡が持つ「記憶の誘惑」の危険性を誰よりも知っている。
  motivation: 遺跡の正体を解明することと、海が精神的に飲み込まれる前に彼を地上へ引き戻すこと。
  relationships:
  - name: 旭日 海
    relation: 危うい才能を持つ助手であり、かつての自分を重ね合わせている対象
  arc: 海を救おうとする過程で、自身が封印していた過去の感情と向き合い、許しを得る。
- name: 東間 蓮 (とうま れん)
  role: 脇役/対照的な存在
  age: 22
  gender: 男性
  appearance: 日焼けした肌に快活な笑顔。活動的なスポーツウェアを好み、常にエネルギーに満ち溢れている。
  personality: 楽観的で真っ直ぐ。他人の痛みに敏感だが、それを深刻に考えすぎず、明るさで塗り替えようとする。一人称は「俺」。
  speech_style: ぶっきらぼうだが親しみやすい。地元の青年らしい、少し砕けた話し方。
  background: 地元の漁師の息子で、調査チームの潜水サポートを担当。海を「記憶の場所」ではなく「今を生きる場所」として愛している。
  motivation: 閉ざされた心を持つ海を、日常のささやかな楽しみ（食事や祭りの喧騒など）に連れ出すこと。
  relationships:
  - name: 旭日 海
    relation: 危なっかしい年上の友人。彼を現実世界に繋ぎ止める錨のような存在
  arc: 海という深い悲しみに触れることで、単なる楽観主義ではない、他者に寄り添う本当の強さを身につける。
- name: 氷室 源蔵 (ひむろ げんぞう)
  role: 脇役/賢者
  age: 72
  gender: 男性
  appearance: 流木のように深く刻まれた皺と、潮風に晒された白い髪。常に古いパイプを燻らせている。
  personality: 達観しており、謎めいた言動が多い。町の人々に敬われつつも、少し恐れられている。一人称は「わし」。
  speech_style: ゆっくりとした間があり、比喩や寓話を用いた言い回しを好む。
  background: かつて若き日に遺跡の深部へ潜り、結晶の光を見た唯一の生存者。その体験から、海にまつわる古い伝承を口伝で守り続けている。
  motivation: 海が遺跡の罠に完全に囚われる前に、彼が自らの意志で「決別」を選べるよう、間接的な助言を与えること。
  relationships:
  - name: 旭日 海
    relation: かつての自分と同じ道を歩む青年への、静かな共感と懸念
  arc: 海が自立して地上に戻る姿を見ることで、自分が長年抱えていた遺跡への後悔に区切りをつける。
