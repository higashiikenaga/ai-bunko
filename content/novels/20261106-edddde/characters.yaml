- name: 浅木 朔
  role: 主人公
  age: 25
  gender: 男性
  appearance: 色白で知的な印象を与える、線の細い青年。眼鏡をかけ、古書を扱うため指先には常に微かなインクの汚れがある。
  personality: 内向的で観察眼が鋭いが、どこか世俗から浮いている。一人称は「僕」。
  speech_style: 丁寧で落ち着いた都会的な話し方。
  background: 都会の喧騒を嫌い、静かな生活を求めて古本屋を営んでいる。古書の中に煤隠村の記述を見つけ、好奇心から村を訪れる。
  motivation: 古書に記された謎を解明したいという知的好奇心。
  relationships:
  - name: 篝
    relation: 村の案内役として接触するが、彼女の言葉には常に違和感を覚える
  arc: 知的好奇心に突き動かされる「観察者」から、因習に飲み込まれ、歴史の一部として「記録される者」へと転落する。
- name: 篝
  role: 脇役（偽りの協力者）
  age: 17
  gender: 女性
  appearance: 煤けた着物に身を包み、瞳の奥に感情の欠落を感じさせる、どこか浮世離れした少女。
  personality: 献身的で礼儀正しいが、人間味に欠ける不気味さを持つ。一人称は「私」。
  speech_style: 独特の抑揚と語尾を持つ、煤隠村の古い方言。
  background: 蒸気機関の神事における巫女の一族。村の掟を幼少期から叩き込まれている。
  motivation: 儀式を滞りなく遂行し、神を鎮めること。
  relationships:
  - name: 朔
    relation: 村への案内役を務めるが、その実、獲物を観察する役割
  arc: 朔に対して微かな同情を見せつつも、最終的には儀式の完遂を冷徹に見届ける。
- name: 源蔵
  role: 敵役
  age: 70
  gender: 男性
  appearance: 煤と油の臭いが染み付いた作業着を着た、威圧的な体躯の老人。鋭い眼光を持つ。
  personality: 狂信的で、村の掟を絶対とする冷徹な支配者。一人称は「わし」。
  speech_style: 低く響く、命令的な方言。
  background: 煤隠村の長であり、地下の蒸気機関の管理を司る一族の家長。
  motivation: 蒸気機関への「供物」を絶やさず、村の繁栄を維持すること。
  relationships:
  - name: 朔
    relation: 計画的に村へ誘い込み、次の供物として選定した対象
  arc: 物語を通じて変化することなく、最後まで村の因習と恐怖を象徴し続ける。
- name: 蓮
  role: 脇役
  age: 19
  gender: 男性
  appearance: 常に怯えた表情を浮かべ、煤で汚れがちな、痩せこけた村の青年。
  personality: 臆病で慎重だが、村の異常性に気づいてしまい、精神的に追い詰められている。一人称は「俺」。
  speech_style: 震えるような、早口な方言。
  background: 以前の祭礼で親しい者が犠牲になったことを知っており、次は自分が標的になることを恐れている。
  motivation: 村の因習から逃げ出し、生き延びること。
  relationships:
  - name: 朔
    relation: 村の異常性を警告するが、信じてもらえないことに絶望している
  arc: 恐怖に駆られ逃亡を試みるが、結局は村のシステムに取り込まれ、消えていく。
