title: 鈍色の煙と、噤みの神事
genre: 伝奇
tone: 湿り気を帯びた、静謐で逃げ場のない恐怖
pov: 三人称
tense: 過去形
setting: 大正末期、山間に隔離された閉鎖的な村「煤隠村」
premise: 都会の喧騒を逃れ、古本屋を営む青年・朔は、ある一冊の古書をきっかけに、霧深い煤隠村へと足を踏み入れる。村では古来より、地下に鎮座する「鉄の神」を鎮めるための、蒸気機関を用いた異様な祭礼が行われていた。立ち昇る鈍色の煙と、村人に通じる奇妙な方言の響き。朔は、村の掟と蒸気の咆哮の間に隠された、身の毛もよだつ因習の正体に気づいてしまう。
themes:
- 因習の連鎖
- 科学と土着信仰の歪な融合
rules:
- 蒸気機関が吐き出す「赤き煙」を直視した者は、魂が村の土に同化し、生ける屍となる。
- 祭りの期間中、古本の頁に挟まれた「供物の髪」を見つけてはならない。
- 村の境界にある石碑に、外から来た者の名を刻むことは、神への冒涜とみなされる。
plot_outline:
- '序盤: 都会から逃れてきた古本屋の店主・朔は、古書の中に煤隠村の禁忌に関する記述を見つけ、吸い寄せられるように村へ向かう。村では祭礼の準備が進められており、人々は蒸気機関の稼働音を「神の呼吸」と呼んで崇めていた。'
- '中盤: 朔は村の老人から、村の繁栄は蒸気機関による「供物」によって保たれているという言い伝えを聞かされる。村人たちの言葉はどこか呪術的で、方言の端々に聞き慣れぬ不穏な響きが混じる。彼は、古本屋の棚に並ぶ古い書物たちが、実は村の犠牲者たちの記録であることを知る。'
- '終盤: 祭りの夜、巨大な蒸気機関が赤き煙を吐き出し、村全体が視界を奪われる。朔は、自身がこの村に辿り着いたこと自体が、次の「供物」として選ばれるための計画であったことを悟る。逃げ場のない霧の中で、機械の咆哮と村人の祈祷が混ざり合う。'
- '結末: 翌朝、霧が晴れた村には、いつものように静かな時間が流れている。しかし、朔の姿はどこにもない。ただ、古本屋の片隅に、新しく一冊の、朔の筆跡で記された「禁忌の書」が静かに、確かに増えていた。'
style_notes: 湿り気を帯びた、重苦しい文体。五感、特に「蒸気の匂い」「錆びた鉄の味」「湿った土の感触」を強調すること。村人の会話には、独特の訛りや方言を交え、異界との距離感を演出する。静かな絶望感を醸成するため、過度な叫びよりも、静寂の中に潜む違和感を描写すること。
