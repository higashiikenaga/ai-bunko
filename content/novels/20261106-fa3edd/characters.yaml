- name: 九条 蓮司
  role: 主人公
  age: 32
  gender: 男性
  appearance: 痩身で常に整ったスーツを纏う。眼鏡の奥の瞳は冷徹で、感情の起伏が見えない。
  personality: 極めて合理的で冷徹。論理こそが世界の唯一の真理だと信じている。一人称は「僕」。
  speech_style: 無駄がなく、常に結論から述べる。相手の感情を無視した事務的な口調。
  background: かつて数学の世界で天才と呼ばれたが、ある事件を機に人間関係を断絶し、現在は数理論理学の探究のみに没頭している。
  motivation: 密室に存在する物理的・数学的な矛盾を解明し、論理の正しさを証明すること。
  relationships:
  - name: 神代 宗助
    relation: かつての師であり、今回の被害者
  - name: 伊織 冴子
    relation: 唯一、感情的な対立を見せる協力者
  arc: 事件を通じて真実を暴くが、犯人の情念を理解することなく「非効率」として切り捨てることで、自らの冷徹さをより強固にする。
- name: 伊織 冴子
  role: 相棒（協力者）
  age: 28
  gender: 女性
  appearance: 知的な印象を与える瞳と、動きやすさを重視した旅装。観察力が鋭い。
  personality: 直感的かつ共感的。九条の冷酷さに反発しながらも、彼の卓越した思考力を信頼している。一人称は「私」。
  speech_style: 丁寧だが、九条に対しては時に鋭い指摘や感情的な言葉を投げかける。
  background: 元・神代の弟子の一人。現在は博物学の研究者として、機械や自然界の動態を専門としている。
  motivation: 師である神代の死の真相を突き止め、彼が大切にしていた「情熱」が汚されるのを防ぐこと。
  relationships:
  - name: 九条 蓮司
    relation: かつての同門であり、論理と感情の対立軸
  - name: 神代 宗助
    relation: 尊敬する師
  arc: 九条の論理によって犯人が追い詰められていく様を見守りつつ、論理では救えない人間の悲劇を痛感する。
- name: エドワード・メイソン
  role: 敵役（犯人）
  age: 35
  gender: 男性
  appearance: 恰幅が良く、紳士的な風貌。常に落ち着いた微笑を浮かべているが、目が笑っていない。
  personality: 表面的には温厚で社交的だが、内面には激しい執着心と独占欲を隠し持っている。一人称は「私」。
  speech_style: 穏やかで教養を感じさせる話し方。常に相手を立てるような物腰。
  background: 神代の元弟子の一人。蒸気機関の設計技術に長け、邸宅『約束の丘』の設備管理にも関与していた。
  motivation: 神代が自分以外の「論理」にのみ価値を見出し、自分という人間を無視し続けたことへの復讐と、自身の存在の証明。
  relationships:
  - name: 神代 宗助
    relation: 尊敬と憎悪が入り混じった師弟関係
  - name: 九条 蓮司
    relation: 自分と同じ「冷徹な論理」を持つ者への嫌悪
  arc: 完璧な密室を作り上げたという自負が、九条の計算によって無機質な「数式の一部」として解体され、崩壊していく。
- name: 神代 宗助
  role: 脇役（被害者）
  age: 65
  gender: 男性
  appearance: 白髪の長い老人。威厳に満ちているが、どこか虚無感を漂わせている。
  personality: 数学を神格化し、感情をノイズとして嫌う。極めて厳格。一人称は「私」。
  speech_style: 断定的で、他者を教え諭すような高圧的な口調。
  background: 世界的な数学者。蒸気機関による自動制御システムを愛し、自身の邸宅を数学的秩序の象徴として構築した。
  motivation: （死ぬ間際まで）自身の理論の完成と、完璧な孤独の追求。
  relationships:
  - name: 九条 蓮司
    relation: 最も才能を感じていたが、最も冷酷な弟子
  - name: エドワード・メイソン
    relation: 技術的には認めるが、感情的な脆さを軽蔑していた弟子
  arc: 物語の導入部で殺害されることで、彼の遺した「論理」が、皮肉にも彼を殺した犯人を炙り出す道具となる。
