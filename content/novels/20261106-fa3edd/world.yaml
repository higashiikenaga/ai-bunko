title: 鋼鉄の沈黙の証明
genre: 本格ミステリー
tone: 冷徹、理知的、皮肉な対話
pov: 三人称（探偵役の思考を括弧書きで挿入）
tense: 過去形
setting: 19世紀末の架空の山岳地帯。巨大な蒸気機関によって全ての設備が自動制御された邸宅『約束の丘』
premise: 孤高の数学者が招集した元弟子たち。嵐の夜、主人は蒸気駆動の可動橋で完全に隔離された離れで殺害される。橋は格納されており、物理的に進入不可能な『絶対的な密室』が完成していた。冷徹な論理のみを信奉する客人の一人、九条が、蒸気圧の数値と機械的矛盾から真実を導き出す。
themes:
- 合理性の限界
- 復讐の論理
rules:
- 邸宅の全ての扉と可動橋は、中央の蒸気機関の圧力制御によってのみ開閉する
- 圧力計は共有ホールに設置されており、誰でもリアルタイムで確認できる
- 可動橋の作動には特定の圧力閾値が必要であり、外部からの手動操作は物理的に不可能
plot_outline:
- '序盤: かつての師である数学者の邸宅『約束の丘』に、5人の男女が集う。主人は離れに籠もり、蒸気機関を操作して可動橋を切り離して瞑想に入ることを宣言する。'
- '中盤: 翌朝、主人が離れで絶命しているのが発見される。橋は格納されたままであり、圧力計の記録からも橋が再接続された形跡はない。しかし、室内の密閉状況に不自然な『真空状態』が生まれていた。'
- '終盤: 九条が、ホールの圧力計に記録されていた微細な変動と、蒸気機関の排熱サイクルから、犯人が利用した『擬似的な密室トリック』を論理的に解体する。'
- '結末: 犯人が抱いていた情念を「非効率な感情」として切り捨て、数学的必然として犯行を証明。絶望する犯人を冷ややかに見下ろして物語は幕を閉じる。'
style_notes: 文末まで徹底して冷ややかな知性を維持すること。感情的な訴えには皮肉で返し、思考プロセスは（……という矛盾がある。ゆえにAは排除される）のように括弧書きで記述。読者に提示した圧力計の数値が解決の鍵となるフェアな構成にする。
