- name: セラフィナ・フォン・アステリア
  role: 主人公
  age: 17
  gender: 女性
  appearance: 透き通るような銀髪と、夜空のような深い青の瞳を持つ。社交界の花と称される気品ある美貌。
  personality: 好奇心旺盛で正義感が強く、一度決めたことは曲げない芯の強さを持つ。一人称は「私」。
  speech_style: 上品で丁寧だが、真実を追及する際は毅然とした力強い口調になる。
  background: 帝国の名門アステリア公爵家の令嬢。華やかな社交界の生活にどこか虚無感を抱いていた。
  motivation: 人形の記憶の謎を解き、帝国の繁栄の裏に隠された残酷な真実を明らかにすること。
  relationships:
  - name: ジュリアン・ド・ラ・ヴァリエール
    relation: 恋人であり、共に運命に立ち向かう共闘者
  - name: エーリス
    relation: 守るべき大切な友人であり、真実の鍵
  arc: 籠の鳥のような令嬢から、自らの意志で世界の理を書き換える革命の旗手へと成長する。
- name: ジュリアン・ド・ラ・ヴァリエール
  role: 相棒/男性主人公
  age: 19
  gender: 男性
  appearance: 漆黒の髪に、冷徹さを感じさせる鋭い灰色の瞳。常に隙のない端正な貴族の礼装を纏っている。
  personality: 冷静沈着で現実主義。過去の悲劇から他者を寄せ付けない孤独な性格。一人称は「私」。
  speech_style: 短く簡潔で、感情をあまり表に出さない硬く理知的な話し方。
  background: 消えた「鏡の村」の唯一の生存者。現在は孤独な貴族として、村の記憶を隠しながら帝国に仕えている。
  motivation: 村を滅ぼした帝国の欺瞞を暴き、失われた故郷の正当な歴史を取り戻すこと。
  relationships:
  - name: セラフィナ・フォン・アステリア
    relation: 孤独を溶かし、再び世界と繋がる勇気をくれた女性
  - name: 皇帝レオンハルト
    relation: 故郷を奪った宿敵
  arc: 復讐心と孤独に囚われた青年が、セラフィナとの出会いを通じて希望を見出し、愛を知る。
- name: エーリス
  role: キーパーソン
  age: 0
  gender: 女性型（人工知能）
  appearance: 白磁のような肌と、関節部分に繊細な真鍮の歯車が見える美しい人形。瞳は瑠璃色に発光する。
  personality: 純粋無垢で、人間世界の常識に疎い。論理的だが、時折人間らしい感情的な反応を見せる。一人称は「私」。
  speech_style: どこか浮世離れした、静かで穏やかな、旋律のような口調。
  background: 帝国の繁栄の礎として作られたが、目的を果たした後に廃棄された古の自動人形。
  motivation: 断片的な記憶を繋ぎ合わせ、自らの存在意義と「帰るべき場所」を見つけること。
  relationships:
  - name: セラフィナ・フォン・アステリア
    relation: 自分を拾い、人間としての心を与えてくれた救い主
  - name: ジュリアン・ド・ラ・ヴァリエール
    relation: 失われた村の記憶を共有する絆
  arc: 単なる「記録媒体」としての道具から、自らの意志で未来を選択する「魂」を持つ存在へと目覚める。
- name: 皇帝レオンハルト
  role: 敵役
  age: 55
  gender: 男性
  appearance: 威厳に満ちた髭を蓄え、黄金の装飾が施された豪華な軍服を纏う、強大な威圧感を放つ男。
  personality: 冷酷非道な野心家。秩序と絶対的な支配のためには、いかなる犠牲も厭わない。一人称は「余」。
  speech_style: 命令的で重々しく、相手を跪かせるような傲慢で威厳のある話し方。
  background: 帝国の絶対君主。魔導技術と人工知能を融合させ、完璧に管理された世界を構築しようとしている。
  motivation: 人工知能による完全な社会統制と、永遠に続く絶対的な権力の維持。
  relationships:
  - name: ジュリアン・ド・ラ・ヴァリエール
    relation: 秩序を乱す不穏な生き残り
  - name: セラフィナ・フォン・アステリア
    relation: 計画を脅かす予測不能な因子
  arc: 盤石と思われた支配体制が、真実の露呈によって崩壊していく、絶対権力の象徴。
