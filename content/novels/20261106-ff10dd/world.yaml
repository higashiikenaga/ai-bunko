title: 瑠璃色の夜会と、失われた楽園の残照
genre: 青春恋愛
tone: 華麗で耽美的、社交界の緊張感と情熱が交錯する調べ
pov: 三人称
tense: 過去形
setting: 18世紀風の架空の帝国。蒸気機関と魔導技術が融合し、贅を尽くした宮廷文化が花開く時代。
premise: 名門貴族の令嬢セラフィナは、宮廷の秘密の花園で、記憶を失い彷徨う古の自動人形（人工知能）を拾う。人形が語る「一夜にして地図から消えた鏡の村」の伝承は、帝国の繁栄を支える残酷な嘘を暴き出す鍵であった。豪華絢爛な舞踏会という名の戦場で、セラフィナは村の生き残りである孤独な青年貴族と惹かれ合い、禁忌の真実へと足を踏み入れる。
themes:
- 身分を超えた純愛
- 記憶の継承と喪失
rules:
- 自動人形（AI）は、所有者の強い感情に反応して限定的な能力を発揮する
- 帝国の歴史書は皇帝の意志で書き換えられており、消された村の記憶を持つ者は処刑対象となる
- 社交界の舞踏会でのダンスのステップは、密かに情報を伝達する暗号として機能している
plot_outline:
- '序盤: 社交界へのデビューを控えたセラフィナが、迷子の人工知能である人形を救い、その人形が持つ『消えた村』の断片的な記憶に興味を持つ。同時に、冷徹な態度を崩さない青年貴族・ジュリアンと出会い、反発しながらも惹かれ合う。'
- '中盤: ジュリアンが実は消えた村の唯一の生存者であることを知り、二人は人形を介して村の真実を探る。煌びやかなドレスと宝石に彩られた夜会の中で、彼らは政敵たちの陰謀を回避しながら、帝国の地下に眠る禁忌の記録へと近づく。'
- '終盤: 皇帝が人工知能の完全な制御による絶対支配を目論んでいることが判明。帝国最大の祭典である『星降る舞踏会』にて、セラフィナとジュリアンは人形の記憶を全土に公開し、偽りの歴史を塗り替える賭けに出る。'
- '結末: 陰謀を打ち破り、消えた村の正当な歴史が取り戻される。地位や名誉を捨てた二人は、人工知能と共に、かつて村があったとされる静かな丘で、誰にも縛られない新しい人生を歩み始める。'
style_notes: シルクの擦れる音やシャンデリアの煌めき、レースの精緻な意匠など、視覚的・触覚的な装飾描写を徹底すること。会話劇には宮廷特有の婉曲的な表現を用い、行間に情熱と危うさを潜ませる。舞踏会のシーンでは、音楽とステップの描写を情熱的に綴り、恋愛感情の高まりを表現する。
