- name: 星野 昴 (ほしの すばる)
  role: 主人公
  age: 29
  gender: 男性
  appearance: 落ち着いた雰囲気の青年。少し癖のある黒髪に、穏やかだがどこか寂しげな瞳。常に清潔感のあるエプロンを身につけている。
  personality: 思慮深く、非常に穏やか。聞き上手で、相手の心の機微を察するのが得意。一人称は「僕」。
  speech_style: 静かで丁寧な敬語。相手の言葉を一度深く受け止めてから、ゆっくりと、詩的な比喩を交えて話す。
  background: 元・天文学研究者。かつて星の真理を追い求めていたが、ある挫折と喪失を経験し、研究の道を離れた。現在は「ルナ・テラス」の店主として、星そのものではなく「星を見る心」を守るために働いている。
  motivation: 都会の喧騒で自分を見失った人々に、静寂と自分自身の光を思い出してもらうこと。
  relationships:
  - name: 如月 蓮
    relation: 雇い主と助手
  - name: 朝比奈 汐里
    relation: 過去を知る旧友
  arc: 過去の喪失感から逃げるように静寂の中に隠れていたが、客たちの変化と汐里との再会を通じて、再び「星（希望）」を信じる勇気を取り戻す。
- name: 三月 遥 (みつき はるか)
  role: 主要な客
  age: 26
  gender: 女性
  appearance: 都会的で洗練されたファッションに身を包んでいるが、目の下に薄いクマがあり、どこか疲れ切った様子を見せる。
  personality: 真面目で責任感が強く、周囲の期待に応えようと無理をしがちな性格。一人称は「私」。
  speech_style: 仕事モードの早口な話し方から、店内でリラックスすると少しずつ、たどたどしく本音を漏らすようになる。
  background: 大手広告代理店で働く会社員。数字と効率、他人の評価ばかりを追い求める日々に、自分が何者であるかを見失っている。
  motivation: 自分が何のために生きているのか、心の空虚さを埋める何かを探している。
  relationships:
  - name: 星野 昴
    relation: 心を解きほぐしてくれる相談相手
  arc: 完璧主義の仮面を脱ぎ捨て、不完全な自分自身と、日常に転がる小さな幸せを肯定できるようになる。
- name: 如月 蓮 (きさらぎ れん)
  role: 脇役
  age: 21
  gender: 男性
  appearance: 明るい茶髪に、動きやすいカジュアルな服装。常に活気があり、店内の空気を明るくする存在。
  personality: 天真爛漫で好奇心旺盛。少しお調子者だが、観察眼が鋭く、昴の孤独にも気づいている。一人称は「俺」。
  speech_style: 飾らない、明るいタメ口に近い丁寧語。場を和ませるような軽快なリズム。
  background: 地方から夢を抱いて上京してきた大学生。アルバイトとして「ルナ・テラス」で働きながら、都会での生き方を模索している。
  motivation: 店での仕事を通じて、自分自身の進むべき道を見つけること。
  relationships:
  - name: 星野 昴
    relation: 尊敬する店主であり、兄貴分
  - name: 三月 遥
    relation: 気にかけている常連客
  arc: ただの「賑やかし」から、客の心に寄り添い、店の一員として精神的に成長していく。
- name: 朝比奈 汐里 (あさひな しおり)
  role: 鍵を握る人物
  age: 29
  gender: 女性
  appearance: 儚げで透明感のある美しさを持つ。どこか浮世離れした、静かな佇まい。
  personality: 芯が強く、冷静。しかしその内側には、誰にも言えない深い孤独を秘めている。一人称は「私」。
  speech_style: 優雅で落ち着いた、距離感のある丁寧な話し方。
  background: 昴の大学時代の研究仲間。かつて二人で星空を見上げていたが、ある出来事を境に連絡を絶っていた。物語の終盤、特別な天体現象の夜に店を訪れる。
  motivation: 止まってしまった昴の時間と、自分自身の過去に向き合うこと。
  relationships:
  - name: 星野 昴
    relation: かつての共同研究者であり、特別な絆を持つ人物
  arc: 過去の決別を乗り越え、昴と共に新しい夜（未来）へ進む準備を整える。
