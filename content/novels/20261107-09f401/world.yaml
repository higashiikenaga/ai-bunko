title: 星を掬う夜の止まり木
genre: 日常ほのぼの
tone: 静謐でロマンチックな夜の空気感
pov: 三人称
tense: 過去形
setting: 眠らない街の一角にある、屋上に天体望遠鏡を備えた小さな喫茶店「ルナ・テラス」
premise: 眩いネオンに覆われ、星が見えなくなった大都会。そこにある静かな喫茶店では、店主の天文青年が客の悩みを聞き、その心に寄り添う星を提示する。鏡で反射させた夜空を店内に映し出しながら、人々は忘れかけていた「静寂」と「自分自身の光」を取り戻していく。星屑のような小さな幸せを掬い上げる、穏やかな夜の物語。
themes:
- 孤独の肯定
- 心の調律
rules:
- 店にある特殊な鏡の装置は、屋上の空を店内に反射させ、光害を抑えて星を観察できる仕組みであること
- 店主は客の相談内容に対し、必ずその夜にちなんだ星や天体現象を一つ選び、比喩を用いて語ること
- 物語の舞台は常に深夜から夜明け前にかけての時間を扱い、外界の喧騒から切り離された聖域として描写すること
plot_outline:
- '序盤: 眠らない街の喧騒に疲れた人々が、偶然「ルナ・テラス」に辿り着き、店主・昴（すばる）との静かな対話を通じて凝り固まった心を解きほぐしていく。'
- '中盤: 鏡に映る星空を媒介に、客が抱える喪失感や迷いが、星座の神話や天体の運行と重ね合わされ、人生の不可避な流れとして肯定されていく。'
- '終盤: 年に一度の特別な天体現象（流星群や掩蔽など）をきっかけに、店主自身の過去と、なぜこの街で星を見せ続けているのかという想いが明かされる。'
- '結末: 物理的な星は見えなくても、心の中に自分だけの「北極星」を見つけた人々が、明日への希望を抱いて再び街の灯りの中へ歩き出す。'
style_notes: 夜空と天文を愛するロマンチストな筆致。比喩として星座名や天体現象を多用し、静かな会話劇を重視する。情景描写には「深い藍色」「銀の砂」など夜を彩る色彩表現を取り入れ、読者が夜の静寂に包まれるような心地よさを追求する。
