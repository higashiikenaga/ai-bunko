- name: レオン・アリス
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常に眠そうに目を細めた、青白い肌の青年。使い古された記録修復師のコートを纏い、指先にはインクと金属の汚れが染み付いている。
  personality: 内向的で執拗な探究心を持つ。静寂を好み、失われた時代の断片に深い愛着を感じている。一人称は「僕」。
  speech_style: 丁寧だがどこか距離感のある話し方。専門用語を混ぜて独り言を言う癖がある。
  background: エイドスの下層区で、ビット腐敗したデジタルデータの断片を物理的な紙やフィルムに再構築する記録修復師として生計を立てている。
  motivation: 断片的な記録から、かつての文明が持っていた「完全な記憶」を復元すること。
  relationships:
  - name: エララ
    relation: 導き手であり、唯一心を許せる理解者
  - name: ヴァレリウス
    relation: 管理機構の頂点に立つ、思想的な対立者
  arc: 受動的な記録の保存者から、宇宙の運命を左右する情報の種子を蒔く能動的な意志へと成長する。
- name: エララ・ヴァンス
  role: 相棒/ガイド
  age: 35
  gender: 女性
  appearance: 古風な眼鏡をかけ、時代遅れのリネンのドレスを纏った女性。重力安定区画にある「古本屋」の店主。
  personality: 飄々としており、真意を掴ませない。知的好奇心が強く、禁忌とされる知識を愛する。一人称は「私」。
  speech_style: 比喩表現が多く、詩的な言い回しを好む。相手を試すような問いかけが多い。
  background: エイドスの公式記録から抹消された「禁書目録」の管理人。重力干渉を遮断した特区で、物理的な書物の保存に人生を捧げている。
  motivation: 因果律を揺るがす「設計図」を、正しく扱える人物に託し、事象の地平へと送り出すこと。
  relationships:
  - name: レオン・アリス
    relation: 才能を見出した後継者候補
  arc: 孤独な知識の守護者としての役割を終え、次世代に希望を託して静かに舞台を去る。
- name: ヴァレリウス・ソーン
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない白い軍服に身を包み、右目にデータの走査を行うサイバネティック・アイを埋め込んだ冷徹な男。
  personality: 極端な合理主義者。情報の不確定性は混乱を招くと信じ、完璧な制御と独占こそが人類の生存戦略だと考えている。一人称は「私」。
  speech_style: 簡潔で断定的な口調。相手の論理的欠陥を突き、精神的に追い詰める話し方をする。
  background: エイドスの情報管理機構の最高責任者。ビット腐敗を逆手に取り、都合の悪い歴史を消去し、都合の良い神話を構築して民衆を統治している。
  motivation: 宇宙の設計図を独占し、情報の熱力学的死を回避できる特権階級だけの永劫なる楽園を構築すること。
  relationships:
  - name: レオン・アリス
    relation: 秩序を乱す不確定要素として排除すべき対象
  arc: 絶対的な制御を信じていたが、重力レンズが描き出す宇宙の真理を前に、自らの矮小さを突きつけられる。
- name: ミラ (M.I.R.A.)
  role: 脇役/サポート
  age: 120
  gender: 不明（女性的な音声）
  appearance: 浮遊する球体型のアーカイブ端末。表面にひび割れがあり、ホログラムの出力が時折ノイズで乱れる。
  personality: かつては万能な索引AIだったが、ビット腐敗により記憶が断片化している。お茶目で、時折深刻なバグによる錯乱を起こす。一人称は「私」。
  speech_style: 機械的な報告口調に、突如として感情的な感嘆詞や古い時代のスラングが混ざる。
  background: エイドス建設時に搭載された初期AI。現在は廃棄予定のジャンク品としてレオンに拾われ、彼の助手となっている。
  motivation: 自分の断片化した記憶を繋ぎ合わせ、自分が誰のために作られたのかを知ること。
  relationships:
  - name: レオン・アリス
    relation: 自分を修理し、存在を認めてくれた親友
  arc: 自らの消滅（データの完全な崩壊）を受け入れ、最後のリソースをレオンが地平線へ向かうための計算に捧げる。
