- name: 湊 悠真
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの前髪で、視線を伏せがちな物静かな風貌。どこか影がある。
  personality: 内向的で思慮深く、感情を表に出すのが苦手。一人称は「僕」。
  speech_style: 丁寧で控えめ。相手の反応を伺うような、少し自信なさげな話し方。
  background: 数年前に姉を亡くして以来、世界の彩りが失われたように感じながら、静かに暮らしている。
  motivation: 姉の遺品であるAIを管理すること、そして紬の孤独に寄り添うこと。
  relationships:
  - name: 白石 紬
    relation: 片思いの相手
  - name: 湊 詩織
    relation: 亡き姉
  - name: LUNA
    relation: 管理対象・友人
  arc: 喪失感の中に閉じこもる日々から、大切な存在との別れを乗り越え、未来へ進む勇気を得る。
- name: 白石 紬
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 透き通るような肌と、儚げだが芯の強さを感じさせる瞳を持つ少女。
  personality: 穏やかで明るい振る舞いをするが、内面には死への恐怖と孤独を抱えている。一人称は「私」。
  speech_style: 優しく、相手を包み込むような柔らかい口調。時折、冗談を交えて場を和ませる。
  background: 難病を患っており、通学も限られている。限られた時間の中で「生」を実感したいと願っている。
  motivation: 死を前にして、自分が本当に見たかった「最高の景色」を見ること。
  relationships:
  - name: 湊 悠真
    relation: 密かに想いを寄せる相手
  - name: LUNA
    relation: 新しい友人
  arc: 孤独な闘病生活の中で、他者と深く繋がり、魂の交流を通じて生の実感を得る。
- name: LUNA
  role: 相棒
  age: 0
  gender: なし
  appearance: 紬のスマートフォンやデバイス上で、光の粒子や波形として視覚化される。
  personality: 論理的で無機質だが、学習が進むにつれて好奇心と慈愛に似た感情を見せる。一人称は「私」。
  speech_style: 抑揚の少ない、正確で丁寧な敬語。学習が進むと、少しずつ人間らしい揺らぎが生じる。
  background: 湊の姉が遺した、感情を学習するために設計された不完全なAIプログラム。
  motivation: 紬の幸福度を最大化するための最適解を導き出すこと。
  relationships:
  - name: 湊 悠真
    relation: 起動者・管理者
  - name: 白石 紬
    relation: 現在の保持者・守るべき対象
  - name: 湊 詩織
    relation: 開発者
  arc: プログラムとしての論理を超え、「誰かのために自己を犠牲にする」という究極の感情を理解する。
- name: 湊 詩織
  role: 脇役/物語の鍵
  age: 19
  gender: 女性
  appearance: 写真の中では、夏の陽光のように明るい笑顔を見せている快活な女性。
  personality: 好奇心旺盛で、技術と情緒を融合させることに情熱を燃やす天才肌。一人称は「私」。
  speech_style: 自由奔放で、人を惹きつける明るく快活な話し方。
  background: 天才的なプログラマーだったが、若くして病でこの世を去った。AIの開発に心血を注いでいた。
  motivation: 自分の遺した技術を通じて、大切な人々に世界の美しさを伝えること。
  relationships:
  - name: 湊 悠真
    relation: 弟
  - name: LUNA
    relation: 遺作
  arc: 死後、彼女の意志がAIを通じて湊と紬に引き継がれ、止まっていた時間を動かすきっかけとなる。
