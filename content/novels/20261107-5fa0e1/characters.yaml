- name: 瀬戸 奏多
  role: 主人公
  age: 23
  gender: 男性
  appearance: 清潔感はあるがどこか頼りない青年。眼鏡をかけている。
  personality: 真面目で慎重、かつ好奇心旺盛。一人称は「僕」。
  speech_style: 丁寧で少し控えめな敬語。
  background: 文学部出身。言葉が持つ力に惹かれ、実務的な修復技術を学ぶためセンターに入職した。
  motivation: 修復技術の習得と、地下図書館で見つけた「失われた手紙」の主を特定すること。
  relationships:
  - name: 結城 蓮
    relation: 師匠的存在
  - name: 真壁 凛
    relation: 共に調査を行う同僚
  arc: 技術的な未熟さを克服し、記録を繋ぐことの社会的・感情的な重みを理解する。
- name: 結城 蓮
  role: 相棒（師匠）
  age: 45
  gender: 男性
  appearance: 無駄のない動き。使い込まれた作業着。鋭い眼差しを持つ。
  personality: ストイックで職人気質。寡黙だが、内面には強い矜持を持つ。一人称は「私」。
  speech_style: 短く、断定的。専門用語を多用する。
  background: 数々の国宝級古文書を修復してきた伝説的な職人。過去に自身のミスで資料を損なわせたトラウマがある。
  motivation: 完璧な修復を通じて、失われるはずだった歴史の断片を守り抜くこと。
  relationships:
  - name: 瀬戸 奏多
    relation: 教え子
  - name: 真壁 凛
    relation: 信頼できる仕事仲間
  arc: 過去の失敗への執着を捨て、技術を次世代へ継承していく覚悟を決める。
- name: 真壁 凛
  role: 脇役（専門家）
  age: 30
  gender: 女性
  appearance: 知的で洗練された雰囲気。常に資料や手帳を携帯している。
  personality: 合理的で冷静沈着。しかし、歴史の真実に対しては非常に情熱的。一人称は「私」。
  speech_style: 論理的で無駄のない、落ち着いた話し方。
  background: 歴史学の博士号を持つ調査員。文書の文脈や時代背景、書体の特徴から情報を読み解く。
  motivation: 文書の背後にある歴史的事実を解明し、空白を埋めること。
  relationships:
  - name: 瀬戸 奏多
    relation: 調査のパートナー
  - name: 結城 蓮
    relation: 仕事上のパートナー
  arc: データの解析だけでなく、記録に込められた「人間の感情」を尊重するようになる。
- name: 佐伯 宗次
  role: 脇役（管理人）
  age: 62
  gender: 男性
  appearance: 常に少し埃を纏っているような、枯れた雰囲気。穏やかな笑みを浮かべている。
  personality: 飄々としていて掴みどころがないが、底知れない知識を持つ。一人称は「わし」。
  speech_style: 古風で、時折含みを持たせた謎めいた言い回しをする。
  background: センター最古参の職員。未整理文書が眠る「地下図書館」の管理を一手に引き受けている。
  motivation: 忘れ去られた言葉たちが、再び誰かの目に触れる瞬間を見届けること。
  relationships:
  - name: 瀬戸 奏多
    relation: 成長を見守る対象
  - name: 結城 蓮
    relation: 旧知の仲
  arc: 物語の導き手として、瀬戸が真実へと辿り着くためのきっかけを与える。
