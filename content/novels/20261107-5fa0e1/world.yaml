title: アーカイブ・リペアーズ：失われた言葉の修復師たち
genre: 群像劇
tone: 真摯で温かみのある、職人的な雰囲気
pov: 一人称「僕」（新人修復士）
tense: 過去形
setting: 現代日本。都心にある古文書・古書修復の専門機関「記憶保存センター」
premise: 古文書修復の道に足を踏み入れた新人の僕が、職人たちの矜持と技術を学んでいく物語。ある日、センターの最深部にある「地下図書館」で、宛先不明のまま放置された一通の「失われた手紙」を見つける。手紙の主を辿る過程で、同僚たちの意外な過去と、言葉を遺すことの意味に触れていく。小さな紙片の修復という地道な仕事が、誰かの人生を繋ぎ直す瞬間を描く。
themes:
- 職業的誇り
- 記憶の継承
rules:
- 修復作業は物理的な損壊を最小限に抑え、可逆的な（後で取り消し可能な）素材のみを使用しなければならない
- 地下図書館に保管された文書は、正当な継承者が現れるまで厳重に管理され、外部への無断持ち出しは禁止されている
plot_outline:
- '序盤: 修復センターへの配属。脱酸処理や裏打ちといった専門用語に戸惑いながらも、先輩たちの仕事ぶりに惹かれ、破れたページの一枚を完璧に繋ぎ合わせることで小さな達成感を味わう。'
- '中盤: センターの地下にある、未整理の文書が眠る「地下図書館」への立ち入りを許可される。そこで、戦時中に届けられなかった一通の「失われた手紙」を発見し、その修復と解読に挑む。'
- '終盤: 手紙に記された謎を解き明かすため、同僚の専門知識を借りて当時の記録を調査。手紙の送り主と受け取り主の想いを現代に届けるため、地道な裏付け作業に奔走する。'
- '結末: 手紙が正当な相手に届き、止まっていた時間が動き出す。僕自身も「記録を繋ぐ」という仕事の価値に確信を持ち、一人前の修復士としての第一歩を踏み出す。'
style_notes: 働く人の視点を徹底し、糊付けの温度管理や和紙の繊維の選び方など、専門的な修復工程を丁寧に解説する。新人の「僕」が感じる、仕事への不安と、それが自信に変わる小さな成功体験を積み重ねて描写する。
