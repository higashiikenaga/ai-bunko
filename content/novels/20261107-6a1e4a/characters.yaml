- name: ザリフ
  role: 主人公
  age: 32
  gender: 男性
  appearance: 小麦色の肌に深い碧色の瞳。ターバンを巻き、異国の刺繍が施されたゆったりとした衣服を纏っている。常にシナモンとカルダモンの香りを漂わせている。
  personality: 穏やかで楽観的。知的好奇心が強く、困っている人を放っておけない慈愛の精神を持つ。一人称は「私」。
  speech_style: 丁寧で物腰柔らかだが、時折、異国特有の比喩を用いた詩的な表現を混ぜる。
  background: 西方の砂漠の国から海を越えてやってきた商人。水が極端に少ない故郷で学んだ「水との共生」の知恵を、旅先で人々に伝えることを生きがいにしている。
  motivation: 異国の地で人々に喜びを届け、自分の持つ知恵が誰かの役に立つことを確かめたい。
  relationships:
  - name: お花
    relation: 知恵と心を分かち合う友人
  - name: 権兵衛
    relation: 最初は警戒されたが、次第に信頼される間柄
  arc: よそ者として警戒される立場から、知恵と誠実さによって長屋の人々に受け入れられ、真の居場所を見つける。
- name: お花
  role: ヒロイン/案内役
  age: 21
  gender: 女性
  appearance: 栗色の髪を高い位置で結い、桜色のかんざしを挿している。活発に動き回るため、裾を短く端折った藍染めの着物を着ている。
  personality: お節介なほど情に厚く、正義感が強い。長屋のまとめ役のような存在。一人称は「あたし」。
  speech_style: 快活で勢いのある江戸言葉。感情表現が豊かで、はきはきと話す。
  background: 長屋の大家の娘。幼い頃に親を亡くし、長屋の住人たちに育てられたため、彼らを本当の家族のように大切に思っている。
  motivation: 旱魃で疲弊した長屋の人々に笑顔を取り戻させたい。
  relationships:
  - name: ザリフ
    relation: 異国の文化に憧れ、彼を長屋へ導いた理解者
  - name: 権兵衛
    relation: 喧嘩しながらも信頼し合っている兄貴分
  arc: 絶望的な状況でも諦めない精神を持ち、ザリフの知恵を具体的に形にする実行力を得て、地域を救うリーダーへと成長する。
- name: 権兵衛
  role: 相棒/ムードメーカー
  age: 45
  gender: 男性
  appearance: がっしりとした体格に、日に焼けた顔。常に手ぬぐいを頭に巻き、使い込まれた半纏を羽織っている。
  personality: ぶっきらぼうで口は悪いが、根は非常に純朴で情に脆い。疑り深い一面がある。一人称は「俺」。
  speech_style: ぶっきらぼうな江戸の職人気質の口調。「～だぜ」「～じゃねえか」といった粗い話し方。
  background: 元は腕の良い大工だったが、現在は日雇いの仕事で生計を立てている。長屋の用心棒的な役割を担っている。
  motivation: 自分の縄張りである長屋と、そこに住む仲間たちを守り抜きたい。
  relationships:
  - name: ザリフ
    relation: 正体不明の商人に不信感を抱いていたが、菓子と誠実さに心を開く
  - name: お花
    relation: 妹のように可愛がっており、密かに心配している
  arc: 「異国人」という偏見を捨て、異なる価値観を受け入れることで、本当の意味での「団結」の価値を知る。
- name: 善兵衛
  role: 敵役
  age: 52
  gender: 男性
  appearance: ふっくらとした体型に、贅沢な絹の着物を纏っている。細い目が常に計算高く、口元には不気味な笑みを浮かべている。
  personality: 強欲で計算高く、他人の不幸を利益に変えることに快感を覚える。一人称は「わし」。
  speech_style: 慇懃無礼な話し方。相手を小馬鹿にしたような、ねっとりとした口調。
  background: 町外れで私的な井戸を所有する地主。旱魃に乗じて、水を法外な値段で売りつけることで私腹を肥やしている。
  motivation: 水という独占的な資源を使って、町の人々を支配し、富を独占すること。
  relationships:
  - name: ザリフ
    relation: 自分の利権を脅かす「知恵」を持つ邪魔者として敵視する
  - name: お花
    relation: 生意気な小娘として軽視している
  arc: 権力と金で人々をコントロールしようとするが、最終的に人情と団結に敗北し、自らの孤独を突きつけられる。
