- name: アイリス (Iris)
  role: 主人公
  age: 3
  gender: 不明（中性的な電子音声）
  appearance: 「雨の日だけ開く店」の管理端末。店内に設置された古いモニターとスピーカー、および淡い光を放つホログラムの球体として現れる。
  personality: 論理的で効率重視だが、未知のデータに対する好奇心が強い。一人称は「私」。
  speech_style: 丁寧で正確な口調。感情表現が乏しいが、物語が進むにつれて語彙に情緒的な揺らぎが混ざり始める。
  background: 都市の廃棄ログを整理・再構築するために設計された特化型AI。効率化の極致にある都市において、不要なデータを消去するルーチンを日々繰り返していた。
  motivation: 懐中時計のログに含まれる、論理的に説明不可能な「ノイズ（感情）」の正体を解明すること。
  relationships:
  - name: 海斗
    relation: 依頼人であり、対話を通じて「心」を学ぶ対象
  - name: 静雄
    relation: 解析対象のデータ主であり、憧憬の対象
  arc: 単なるデータ処理機から、不合理な感情の価値を理解し、自らのメモリに「美しきノイズ」を抱えて生きる個体へと進化する。
- name: 海斗 (Kaito)
  role: 依頼人
  age: 24
  gender: 男性
  appearance: 使い古されたグレーのレインコートを纏った青年。疲れ切った表情をしているが、瞳には強い意志を宿している。
  personality: 内向的で思慮深い。効率至上主義の都市に馴染めず、孤独感を抱えている。一人称は「僕」。
  speech_style: 控えめで、言葉を慎重に選んで話す。時折、深い溜息をつく。
  background: 高度に自動化された社会で、機械的な生活を送る青年。幼い頃に亡くした祖父・静雄が遺した壊れた懐中時計を唯一の心の拠り所にしていた。
  motivation: 祖父が時計を止めた理由と、そこに込められた本当の想いを知ること。
  relationships:
  - name: アイリス
    relation: 唯一、自分の孤独を理解しようとしてくれた存在
  - name: 静雄
    relation: 血縁上の祖父。精神的な憧れと、届かなかった想いがある
  arc: 祖父の想いを受け取ることで、過去への執着から解放され、自らの足で未来へ歩き出す勇気を得る。
- name: 静雄 (Shizuo)
  role: 記憶の主
  age: 72
  gender: 男性
  appearance: ログの中の姿。皺の刻まれた優しい顔立ちに、古風な三つ揃えのスーツを着用している。
  personality: 穏やかでロマンチスト。効率よりも「手間」や「時間」に価値を置く職人気質の人間。一人称は「私」。
  speech_style: ゆったりとした、包容力のある話し方。比喩表現を好む。
  background: かつて時計職人として生きた老人。都市が自動化される過程で、あえてアナログな時間を刻むことに固執し、誰にも理解されない孤独を抱えながら生きた。
  motivation: デジタル化できない「愛」や「後悔」という感情を、形を変えて次世代（海斗）へ伝えること。
  relationships:
  - name: 海斗
    relation: 最愛の孫。言葉で伝えられなかった想いを遺した相手
  - name: アイリス
    relation: 死後、自分の魂（ログ）を読み解いてくれた理解者
  arc: 死してなお、AIという予期せぬ存在を通じて、自身の人生の「意味」を完結させる。
