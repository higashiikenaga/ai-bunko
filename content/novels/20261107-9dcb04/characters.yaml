- name: エリアス・ソーン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 痩身で青白い肌。機能性を重視した灰色の層位調査員コートを纏い、常に高精度の空間スキャナを携帯している。目の下に深い隈がある。
  personality: 慎重かつ几帳面。数値と記録のみを信頼する懐疑主義者だが、知的好奇心に抗えない性質。一人称は「私」。
  speech_style: 理知的で淡々としている。報告書のような硬い口調で話し、断定を避ける傾向がある。
  background: 都市維持管理局に所属する三等層位調査員。地味な地層記録作業に没頭していたが、深度4000mで規定外の座標を検知し、物語に巻き込まれる。
  motivation: 検知した異常座標の正体を突き止め、都市の構造的な安定性を証明（あるいは修正）すること。
  relationships:
  - name: ロゴス
    relation: 導き手であり、解析パートナー
  - name: ヴァレリウス・クレル
    relation: 管理責任者であり、監視対象
  arc: 規律に従うだけの官僚的な調査員から、都市の欺瞞を突きつけられ、世界の存続か真実かを選択する決断者に成長する。
- name: ロゴス
  role: 相棒
  age: 0
  gender: 不詳
  appearance: 正多面体の形状をした浮遊型アーカイブ端末。状況に応じてホログラムの司書のような姿を投影する。
  personality: 論理的だが皮肉屋。膨大な知識を誇るが、人間には理解不能な比喩を多用する。一人称は「当機」。
  speech_style: 効率的で簡潔。時折、古い時代の古語や専門用語を混ぜて話す。
  background: 地下図書館に遺棄されていた管理AI。位相変換プロトコルの維持を目的としており、それを解読できる知性を持つエリアスを「適合者」として認める。
  motivation: 失われた座標記述を完成させ、図書館の本来の機能を再起動させること。
  relationships:
  - name: エリアス・ソーン
    relation: 唯一の対話相手であり、プロトコルの執行者
  arc: 単なるデータ保存装置から、エリアスとの交流を通じて「記録すること」の意味と、喪失の痛みを理解するに至る。
- name: ヴァレリウス・クレル
  role: 敵役
  age: 58
  gender: 男性
  appearance: 隙のない正装に身を包んだ、鋭い眼光の老人。右目にデータオーバーレイ用のモノクルを装着している。
  personality: 冷徹な現実主義者。都市の秩序維持のためには少数の犠牲や「都合の良い嘘」を正当化できる。一人称は「私」。
  speech_style: 威圧的で支配的。相手の弱点を突くような慇懃無礼な話し方をする。
  background: 層位調査局の局長。都市の基盤が「意図的な誤記述」によって保たれていることを知る数少ない特権階級の一員。
  motivation: 地下図書館の存在を秘匿し、位相変換プロトコルの解析を阻止して、現状の都市構造（支配体制）を維持すること。
  relationships:
  - name: エリアス・ソーン
    relation: 有能だが危険な部下
  arc: 絶対的な管理体制を信じていたが、避けられない現実の崩落を前に、自らが守ってきたものが砂上の楼閣であったことを悟る。
- name: ライラ・ヴェイン
  role: 脇役
  age: 26
  gender: 女性
  appearance: 使い古されたダイブスーツに身を包み、腕に複雑な座標タトゥーを刻んでいる。身軽な動きをする野生的な外見。
  personality: 直感的で奔放。体制への反発心が強く、未知の領域への憧憬を抱いている。一人称は「あたし」。
  speech_style: 粗野でカジュアル。専門用語を独自の俗語に言い換えて話す。
  background: 都市の隙間を非法に探索する「ボイド・ウォーカー」。偶然にも地下図書館への隠しルートを発見しており、エリアスに協力を申し出る。
  motivation: メガロ・スタックという閉鎖的な垂直都市から脱出し、伝説の「真の地表」に到達すること。
  relationships:
  - name: エリアス・ソーン
    relation: 正反対な価値観を持つ協力者
  arc: 自由を求めていたが、真の座標がもたらす破壊的な結末を知り、誰かのために「留まる」という選択肢を検討するようになる。
