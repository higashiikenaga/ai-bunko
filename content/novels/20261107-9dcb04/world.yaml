title: 層位学的深層記録：第4セクター地下書庫における非定常座標の検知に関する報告
genre: SF
tone: 学術的・冷徹・断片的
pov: 第一人称（調査報告者）
tense: 現在形（記述事項）および過去形（観測事実）
setting: 高度文明の遺構が地層のように積み重なる、垂直構造を持つ都市「メガロ・スタック」の最深部。
premise: 都市の維持管理を担う『層位調査員』が、規定の深度を超えた領域に存在する「地下図書館」の存在を偶然検知する。そこには物理的な地図ではなく、空間の歪みを記述した『秘密の地図（位相変換プロトコル）』が保管されていた。調査を進めるうちに、記述された座標が現在の都市の構造と致命的な矛盾を起こしていることが判明する。この記録は、その矛盾が引き起こす現実の崩落を回避するための、あるいはその過程を記録するためのものである。
themes:
- 情報の保存と忘却
- 物理法則の解体
- 観測による現実の確定
rules:
- 都市は垂直方向に重なる地層状の構造を持ち、下層ほど物理法則が不安定になる
- 『地下図書館』に保管される情報は、読み手の観測によってその内容が確定する性質を持つ
- 地図（プロトコル）の座標を書き換えることは、現実の空間構造を再定義することと同義である
plot_outline:
- '序盤: 層位調査員による、深度4000m地点での異常振動と、未登録の書庫領域の発見に関する観測データの提示。'
- '中盤: 地下図書館の内部調査。断片的な書誌目録から、都市の基盤がかつての『意図的な誤記述』によって構築されている仮説を立てる過程。'
- '終盤: 秘密の地図（位相変換プロトコル）の解析。地図が示す『真の座標』が、現在の都市の居住区を抹消する経路であることを突き止める。'
- '結末: 調査員による、座標の修正、あるいは現状維持を選択するための最終的な観測記録。ただし、その結果が都市に何をもたらしたかは、後続の調査員に委ねられる。'
style_notes: 物語全体を、学術論文、フィールドノート、および解析ログの形式で記述する。地の文は「〜である」「〜と推測される」といった客観的な断定・推量を用い、読者が欠落した情報（脚注に記された矛盾点や、削除されたデータ）を繋ぎ合わせることで、物語の全容を推測できるように構成する。情緒的な表現は避け、事象の記述のみを通じて、その背後にある恐怖や壮大さを演出すること。
