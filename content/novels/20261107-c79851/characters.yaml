- name: 佐々木 栞
  role: 主人公
  age: 26
  gender: 女性
  appearance: 都会的な、少し垢抜けた服装。手入れはされているが、どこか疲れを感じさせる瞳。髪は短めにまとめている。
  personality: 真面目で責任感が強く、やや神経質な性格。感情をあまり表に出さない。一人称は「私」。
  speech_style: 丁寧な標準語。父に対しては、敬語とタメ口が混ざったような、どこか距離のある話し方。
  background: 東京の広告代理店で働く事務職。幼少期に母を亡くし、父との間に流れる沈黙に耐えかねて、家を出て自立した生活を送ってきた。
  motivation: 実家の片付けを迅速に終わらせ、父との気まずい関係を「整理」して、元の生活に戻ること。
  relationships:
  - name: 佐々木 拓海
    relation: 父
  - name: 佐々木 恵美
    relation: 母（故人）
  arc: 「過去を整理すべき荷物」と考えていたが、料理を通じて「過去は共に生きていく記憶」であると気づき、父と向き合う勇気を得る。
- name: 佐々木 拓海
  role: 重要人物
  age: 58
  gender: 男性
  appearance: 無精髭が生え、節くれだった大きな手。使い古された作業着を纏い、どこか寂しげな眼差しをしている。
  personality: 寡黙で不器用。自分の失敗を隠そうとする傾向がある。一人称は「俺」。
  speech_style: ぶっきらぼうで、言葉数が極端に少ない。語尾が短く、突き放すような印象を与えることがある。
  background: かつて伝統的な職人（刀鍛冶）を目指していたが、ある挫折を経て、現在は海に近い町で静かに暮らしている。家族を守れなかったという自責の念を抱えている。
  motivation: 娘の帰郷に対し、どう接していいか分からず、ただ静かに、波風を立てずに過ごすこと。
  relationships:
  - name: 佐々木 栞
    relation: 娘
  - name: 佐々木 恵美
    relation: 妻（故人）
  arc: 隠し続けてきた挫折と弱さを娘にさらけ出すことで、止まっていた自身の時間を再び動かし、父としての役割を再定義する。
- name: 佐藤 よし江
  role: 脇役
  age: 72
  gender: 女性
  appearance: 小柄で丸みのある体型。いつも清潔なエプロンをつけ、穏やかな笑みを浮かべている。
  personality: お節介だが愛情深く、周囲の空気を和ませるのが上手い。一人称は「私」。
  speech_style: 温かみのある、ゆっくりとした地方特有の訛りを含んだ話し方。
  background: 近所の商店の店主であり、亡き恵美の親友。佐々木家の歴史をよく知る、町の人々との架け橋のような存在。
  motivation: 栞と拓海の間に流れる冷たい空気を、料理や昔話を通じて少しずつ溶かしてあげること。
  relationships:
  - name: 佐々木 栞
    relation: 近所の娘
  - name: 佐々木 拓海
    relation: 昔馴染み
  - name: 佐々木 恵美
    relation: 親友
  arc: 物語の観察者として、二人が自分たちの力で歩み寄るためのきっかけを、さりげなく提供し続ける。
