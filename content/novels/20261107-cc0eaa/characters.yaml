- name: カイ・ランバート
  role: 主人公
  age: 17
  gender: 男性
  appearance: 茶色の癖毛に油汚れのついた作業着、額には常にゴーグルを乗せている。手先が器用で細身ながらも引き締まった体格。
  personality: 好奇心旺盛で楽観的。機械の鼓動を感じ取る直感力を持つ。一人称は「僕」。
  speech_style: 「〜だよ」「〜かな？」といった、明るく少し幼さの残る、技術用語が混じった口調。
  background: 浮遊島の廃材置き場で孤児として育ち、独学で整備士の技術を身につけた。古いラジオから流れる謎の声に強く惹かれる。
  motivation: ラジオの主を探し出し、世界を覆う霧の正体を解明すること。
  relationships:
  - name: エリナ・ヴァイス
    relation: 信頼できる操縦士であり相棒
  - name: ヴァン・クロムウェル
    relation: 師匠のような存在
  arc: 単なる「機械を直す少年」から、世界の理（ことわり）を動かす「運命を切り拓く者」へと成長する。
- name: エリナ・ヴァイス
  role: 相棒
  age: 18
  gender: 女性
  appearance: 銀髪のポニーテール、使い込まれた飛行士用のレザージャケット、意志の強さを感じさせる鋭い碧眼。
  personality: 冷静沈着で現実主義。しかし内面には熱い正義感を秘めている。一人称は「私」。
  speech_style: 簡潔で迷いのない、凛とした、軍人のような規律を感じさせる話し方。
  background: かつて帝国の飛行士候補生だったが、ある任務の失敗で仲間を失い、現在はフリーの操縦士として空を渡っている。
  motivation: ラジオの放送が、失われた家族の遺したメッセージであるという予感に従うこと。
  relationships:
  - name: カイ・ランバート
    relation: 守るべき対象であり、信頼するパートナー
  - name: ギルバート・フォン・シュタイン
    relation: かつて所属していた帝国の元上官
  arc: 過去の喪失感による閉ざされた心を開き、仲間と共に未知の未来へ飛び込む勇気を取り戻す。
- name: ギルバート・フォン・シュタイン
  role: 敵役
  age: 45
  gender: 男性
  appearance: 威厳のある帝国軍の白制服、片目に嵌めたモノクル、顔を横切る古い傷跡。冷徹な眼光。
  personality: 徹底的な秩序主義者。目的のためには手段を選ばない冷酷さを持つ。一人称は「私」。
  speech_style: 丁寧だが威圧的で、相手を格下として扱うような、尊大で格式高い口調。
  background: 帝国空軍の提督。霧による社会の混乱を「力による統治」で解決しようと画策している。
  motivation: 大気生成装置を帝国の管理下に置き、空の支配権を完全に掌握すること。
  relationships:
  - name: エリナ・ヴァイス
    relation: かつての教え子であり、利用価値のある駒
  - name: カイ・ランバート
    relation: 秩序を乱す排除すべきイレギュラー
  arc: 絶対的な秩序を信奉する独裁者として立ちはだかるが、人間の予測不能な意志に敗北する。
- name: ヴァン・クロムウェル
  role: 脇役
  age: 52
  gender: 男性
  appearance: 筋骨逞しい体格、白髪混じりの無精髭、機械化された重厚な義手。常に煙草の香りがする。
  personality: 豪快で義理堅い、海千山千の冒険家。一人称は「俺」。
  speech_style: 「〜じゃ」「〜だぜ」といった、荒っぽいが温かみのある、年嵩の男らしい口調。
  background: かつて伝説と呼ばれた空賊で、現在はスカイ・ランナー号の船長として、霧の海を渡る運び屋をしている。
  motivation: 愛機である飛空艇を守り抜き、若者たちの冒険を陰ながら支えること。
  relationships:
  - name: カイ・ランバート
    relation: 息子のように可愛がっている弟子
  - name: エリナ・ヴァイス
    relation: 腕の立つ信頼できる操縦士
  arc: 隠居を決め込んでいたが、再び空の自由を信じることで、次世代へバトンを渡す役割を果たす。
