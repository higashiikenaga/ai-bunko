title: 蒼穹のプロペラと、暁の周波数
genre: スチームパンク冒険
tone: 爽快で疾走感のある冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島が点在する空中世界と、その下に広がる霧に包まれた海。蒸気機関と魔導電気が共存する時代。
premise: 空を駆ける飛空艇『スカイ・ランナー号』の若き整備士カイは、ある朝、古いラジオから流れてきた「夜明けのラジオ」の謎めいた放送に導かれる。その声が指し示す先は、地図にない海底遺跡に眠る「失われた大気生成装置」。カイと仲間たちは、世界を覆う霧を晴らし、再び真の太陽を取り戻すため、雲海を突き抜け、未知なる深淵へと飛び立つ。
themes:
- 未知への挑戦
- 技術と自然の調和
- 仲間との絆
rules:
- 浮遊島は重力制御装置によって空に留まっている
- 蒸気機関は魔導結晶を燃料として動力となる
- 海面下の遺跡は高圧と霧により、特殊な潜水艇でしか接近できない
plot_outline:
- '序盤: 整備士カイが古いラジオから謎のメッセージを受信し、仲間と共に飛空艇で雲海探索へ旅立つ。'
- '中盤: 嵐の空を突破し、伝説の海底遺跡を発見。そこには古代文明の高度な機械技術が眠っていた。'
- '終盤: 遺跡を狙う帝国軍の巨大戦艦と空中戦を展開。カイたちは機体の限界を超えた飛行を見せる。'
- '結末: 装置を再起動させ、世界に光を取り戻す。青い空の下、新たな冒険へと船を出す。'
style_notes: 空の青さ、風の匂い、蒸気が噴き出す音、そして歯車が噛み合うメカニカルな描写を鮮烈に描くこと。キャラクターの掛け合いは明るく、困難な状況でも希望を失わない勢いのある語り口を徹底する。
