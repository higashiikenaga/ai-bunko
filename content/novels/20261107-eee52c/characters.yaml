- name: ルナ
  role: 主人公
  age: 15
  gender: 女性
  appearance: 星屑のような銀色の長い髪と、深い夜空を映したような紺色の瞳。古びた灯台守の白いコートを纏っている。
  personality: 内向的だが芯が強く、純粋な好奇心を持つ。一人称は「私」。
  speech_style: 丁寧で控えめだが、星のことになると熱を帯びた話し方になる。
  background: 世界の端にある「銀河の灯台」で、誰に教わったわけでもなく星の欠片を拾い集めて暮らしてきた孤独な少女。
  motivation: 消えゆく世界の光を取り戻し、空に再び星座を呼び戻すこと。
  relationships:
  - name: ソル
    relation: 旅の道導であり、信頼し合う相棒
  - name: ニクス
    relation: 対極に位置する宿敵であり、救済の対象
  arc: ただ星を数えるだけの傍観者から、自らの祈りと詠唱で世界を導く「星の歌い手」へと成長する。
- name: ソル
  role: 相棒
  age: 200
  gender: 男性
  appearance: 黄金色の瞳に、使い古された星座の外套を羽織っている。手には壊れた天球儀を携えている。
  personality: 皮肉屋で現実主義的に振る舞うが、根は情に厚い。一人称は「俺」。
  speech_style: ぶっきらぼうで砕けた口調。時折、古風な言い回しが混ざる。
  background: かつて星座を管理していた守護者の一人だったが、ある過ちにより力を失い、長い眠りについていた。
  motivation: ルナをサポートすることで、過去の贖罪を果たし、再び空に居場所を取り戻すこと。
  relationships:
  - name: ルナ
    relation: 導くべき後輩であり、大切な友人
  arc: 絶望して光を捨てた過去を乗り越え、ルナの純粋さに触れることで再び未来を信じる心を取り戻す。
- name: ニクス
  role: 敵役
  age: 不明
  gender: 不詳
  appearance: 色彩を一切持たないモノクロームの姿。周囲には光を吸い込む黒い霧と、砕けた鏡の破片が浮遊している。
  personality: 虚無的で冷酷。すべてを無に帰すことで、喪失の痛みを消し去りたいと願っている。一人称は「私」。
  speech_style: 静かで抑揚のない、囁くような話し方。
  background: かつて最も強く輝いた星だったが、あまりの孤独と絶望から自らの光を喰らい、「無色の虚無」へと変貌した存在。
  motivation: 世界のすべての光と色彩を奪い、完璧な静寂と無の世界を完成させること。
  relationships:
  - name: ルナ
    relation: 眩しすぎる光を憎みつつ、どこか懐かしさを感じる対象
  arc: ルナが紡ぐ記憶の歌によって、忘れかけていた「かつての輝き」を思い出し、静かに消滅して星へと還る。
