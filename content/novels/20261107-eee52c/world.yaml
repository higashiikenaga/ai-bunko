title: 星霜を紡ぐ、桜の雫と銀河の灯台
genre: 異世界ファンタジー
tone: 幻想的で、静謐かつ色彩豊かなおとぎ話のような雰囲気
pov: 三人称
tense: 過去形
setting: 空に星座の海が広がり、人々が浮遊する星の島々に暮らす世界。かつて銀河を導いたとされる、忘れ去られた「銀河の灯台」が世界の端に佇んでいる。
premise: 星の輝きが魔法の源となる世界で、空の光が次第に失われゆく黄昏の時代が訪れていた。古い灯台の傍らで、星の欠片を拾い集めて暮らす少女・ルナは、星の記憶を吸って咲く「星桜」のひとひらを手にする。それは、消えゆく銀河を再び輝かせるための、最後の導火線だった。ルナは失われた星座を呼び戻すため、星の調べを詠唱し、暗い夜空の深淵へと旅立つ。
themes:
- 記憶の継承
- 光と忘却の循環
rules:
- 魔法は星座の運行に基づいた『星詠みの詠唱』によってのみ発動する
- 空の星が消えると、その星座に属する魔法の力も地上から失われる
- 星桜は、地上に落ちた星の欠片が変質したものであり、触れる者の記憶を光として映し出す
plot_outline:
- '序盤: 古い灯台の傍らで、静かに星を数えて暮らす少女ルナ。ある夜、空から桜の花びらのような淡い光が降り注ぎ、彼女は世界から星の命が失われつつある予兆を知る。'
- '中盤: ルナは、星座の守護者たちが眠る浮遊島を巡る旅に出る。各地で魔法の詠唱を学び、星桜の雫を集める中で、かつて灯台が銀河の航路を照らしていた壮大な歴史に触れていく。'
- '終盤: 星の光を喰らう「無色の虚無」が灯台を包み込み、世界から色彩が奪われようとする。ルナは、集めた星桜の記憶と、自らの祈りを込めた最大級の詠唱によって、消えかけた星座を空へ呼び戻そうと試みる。'
- '結末: 灯台に再び青白い光が灯り、空には新たな星々の海が広がった。ルナは、新しく生まれた星座の輝きを、桜が舞い散る丘から優しく見守り続ける。'
style_notes: 夜空の深い藍、星の瞬く銀、桜の淡い桃色といった色彩と、光の粒子が舞うような描写を極めて豊かに用いること。魔法の発動シーンでは、詩的でリズムのある詠唱を挿入し、物語のテンポをゆったりとした幻想的なものに保つこと。
