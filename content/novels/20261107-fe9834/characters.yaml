- name: 星野 灯 (ほしの あかり)
  role: 主人公
  age: 17
  gender: 女性
  appearance: 双子の姉と瓜二つだが、どこか生気がなく、伏し目がちで影のある雰囲気。自分を隠すように大きめの服を好む。
  personality: 内向的で感受性が強く、自己評価が極端に低い。一人称：わたし。
  speech_style: 控えめで、言葉の端々に迷いや遠慮が感じられる丁寧な話し方。
  background: 完璧な双子の姉の「替え身」として育てられ、自分の意志よりも姉の期待に応えることを優先して生きてきた。
  motivation: 誰にも知られない場所で、自分自身の存在を肯定したい。
  relationships:
  - name: 星野 奏
    relation: 双子の姉
  - name: 霞 蓮
    relation: ラジオの主（唯一の理解者）
  arc: 「姉の影」として生きることをやめ、不完全な自分を認め、自らの名前で誰かと向き合う勇気を持つ。
- name: 霞 蓮 (かすみ れん)
  role: 相棒（恋愛対象）
  age: 17
  gender: 男性
  appearance: 色白で痩身。少し癖のある黒髪に、どこか遠くを見つめるような孤独な瞳。ヘッドホンがよく似合う。
  personality: 静かで思索的。世間に対して微かな違和感を抱いている。一人称：ぼく。
  speech_style: 落ち着いていて、言葉を選んで話す。時折、詩的な比喩を用いる。
  background: 周囲との温度差に馴染めず、午前四時の静寂の中でだけ、自分の言葉を放てるラジオ放送を続けている。
  motivation: 自分の声が、世界のどこかにいる「誰か」に届いているかを確認したい。
  relationships:
  - name: 星野 灯
    relation: 手紙のやり取り相手
  arc: 匿名性の殻に閉じこもるのではなく、一人の人間として、目の前の相手と真実の対話を試みる。
- name: 星野 奏 (ほしの かなで)
  role: 敵役（葛藤の源）
  age: 17
  gender: 女性
  appearance: 灯と瓜二つだが、表情が明るく、立ち居振る舞いに自信と華やかさがある。周囲に光を放つような容姿。
  personality: 社交的で天真爛漫。周囲の期待を当然のように受け入れる。一人称：わたし。
  speech_style: 朗らかで、聞き取りやすく、人を惹きつけるリズムがある。
  background: 家族や学校から「完璧な存在」として愛され、その期待に応えることで自らのアイデンティティを確立している。
  motivation: 周囲の期待を裏切らず、平穏で輝かしい日常を維持すること。
  relationships:
  - name: 星野 灯
    relation: 双子の妹
  arc: 無自覚に灯の個性を奪っていたことに直面し、物語の決定的な衝突を引き起こす。
- name: 佐藤 澪 (さとう みお)
  role: 脇役
  age: 17
  gender: 女性
  appearance: ショートヘアで、活動的な服装。明るい表情をしている。
  personality: 現実主義で竹を割ったような性格。情に厚い。一人称：わたし。
  speech_style: 飾らず、ストレートで明快な物言い。
  background: 灯の数少ない友人。灯が演じている「姉の代わり」としての笑顔に、ずっと違和感を抱き続けている。
  motivation: 灯が偽りの自分を脱ぎ捨て、楽に生きてほしいと願っている。
  relationships:
  - name: 星野 灯
    relation: 友人
  arc: 灯の変容を傍で見守り、彼女が本当の自分を取り戻す過程の証人となる。
