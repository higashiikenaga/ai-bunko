title: 薄明のラジオ、あるいは静かな嘘
genre: 青春恋愛
tone: 静謐で断片的。孤独と救済が混ざり合う空気感
pov: 一人称（わたし）
tense: 過去形
setting: 晩秋から冬にかけての、海沿いの静かな地方都市
premise: 完璧な双子の姉の影で「替え身」として生きてきたわたしは、午前四時にだけ流れる正体不明の私設ラジオに心を寄せていた。放送主である少年と、届かないはずの手紙を介して、誰にも知られない秘密の時間を共有し始める。名前も顔も知らないまま、夜明け前の青い光の中でだけ、わたしは「わたし」になれた。
themes:
- 個の確立
- 不可視の連帯
rules:
- ラジオ放送は出力が極めて低く、町の一部でしか受信できない
- 双子は外見的に区別がつかず、周囲からも同一人物のように扱われる傾向がある
- 主人公と放送主のやり取りは、物理的な手紙と一方的な放送という時間差のある形式で行われる
plot_outline:
- '序盤: 姉の代わりを務める日々に疲弊したわたしが、偶然、夜明け前のラジオ放送を拾う。孤独を肯定してくれる少年の声に惹かれ、指定された古い郵便ポストに手紙を出し始める。'
- '中盤: 手紙のやり取りを通じて、お互いの繊細な感性や、世界に対する違和感を共有する。秋から冬へ移ろう景色や、冷たい空気の描写と共に、二人の精神的な距離が縮まっていく。'
- '終盤: ラジオの放送主が、わたしを姉と勘違いして接触してくる。一番理解し合っていたはずの相手に「個」を否定された絶望から、わたしは手紙を書くことをやめ、ラジオを聴かなくなる。'
- '結末: 初雪の降る朝、正体を明かした彼から最後の手紙が届く。彼もまた、誰にも見えない場所で震えていたことを知り、二人は夜明けの海岸で、初めて「個」としての名前を呼び合う。'
style_notes: 短い文章を積み重ねる。光の階調（紺色から白へ）や、空気の冷たさを丁寧に描写する。感情を直接的な言葉にせず、風景や小物に託して表現する。感嘆符は排除し、余白を多く持たせた構成にする。
