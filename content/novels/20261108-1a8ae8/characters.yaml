- name: 葛城 蓮司
  role: 主人公
  age: 28
  gender: 男性
  appearance: 眼鏡をかけた理知的な風貌。細身で、常に手帳と万年筆を携えている。
  personality: 冷静沈着で論理的。未知の現象に対しても感情に流されず、観察を優先する。一人称は「私」。
  speech_style: 丁寧で落ち着いた敬語。常に事実に基づいた確認を行う。
  background: 大学で建築学と民俗学を修めた家系研究者。奇妙な構造を持つ建築物や、一族に伝わる伝承の解明に情熱を注いでいる。
  motivation: 銀鱗館の変幻自在な構造の謎を解き、十年前の双子失踪事件の真相を明らかにすること。
  relationships:
  - name: 九条 宗厳
    relation: 調査依頼主であり、疑念の対象
  - name: 九条 詩織
    relation: 事件の鍵を握る、救出対象の少女
  arc: 非科学的な怪異に直面し、一時的な恐怖に揺れるものの、最終的には論理の力で恐怖を打ち破り真実を暴く強さを得る。
- name: 九条 宗厳
  role: 敵役
  age: 55
  gender: 男性
  appearance: 威厳のある老紳士。黒い和服を隙なく着こなし、鋭い眼光を持つ。
  personality: 厳格で、一族の血統と名誉を何よりも重んじる。目的のためには手段を選ばない冷徹さを持つ。一人称は「私（わたくし）」。
  speech_style: 威圧的で重々しい話し方。相手を値踏みするような響きがある。
  background: 銀鱗館の現当主。十年前の失踪事件を「呪い」として処理し、一族の秘密を隠蔽し続けてきた。
  motivation: 一族の歪んだ血統の秘密を守り、館に伝わる「儀式」の連続性を維持すること。
  relationships:
  - name: 葛城 蓮司
    relation: 利用価値のある調査員
  - name: 九条 詩織
    relation: 一族の血脈を繋ぐための、管理対象
  arc: 隠蔽してきた真実が物理的な機構によって暴かれる中で、崩壊していく一族の秩序に直面する。
- name: 九条 詩織
  role: 重要人物
  age: 18
  gender: 女性
  appearance: 透き通るような白い肌と、銀鱗館の壁と同じような輝きを放つ長い銀髪。どこか現実離れした儚い美しさ。
  personality: 極めて静かで内向的。外界に対して深い恐怖と、同時に強い渇望を抱いている。一人称は「私」。
  speech_style: 消え入りそうな、弱々しい話し方。言葉数が極端に少ない。
  background: 十年前、完全に密閉された「天球の間」から忽然と姿を消した双子の片割れ。鏡合わせの隠し部屋に長年囚われていた。
  motivation: 閉ざされた世界からの解放と、失われた半身（双子の片割れ）との再会。
  relationships:
  - name: 葛城 蓮司
    relation: 自分を現実の世界へ引き戻す者
  - name: 九条 宗厳
    relation: 自分を幽閉してきた監禁者
  arc: 幽閉された「幽霊」のような存在から、一人の人間としての実体を取り戻し、光の下へと踏み出す。
- name: 志摩 慎平
  role: 脇役
  age: 45
  gender: 男性
  appearance: 無骨な体つきの執事風の男。常に館のメンテナンス道具を身に着けている。
  personality: 実務的で現実主義。一族の狂気からは一線を画しているが、従順に従う。一人称は「俺」。
  speech_style: ぶっきらぼうだが、最低限の礼儀を保った事務的な話し方。
  background: 銀鱗館に長く仕える管理責任者。館の複雑な天球儀の機構を熟知している。
  motivation: 館の物理的な機構を維持し、平穏を保つこと。
  relationships:
  - name: 葛城 蓮司
    relation: 館の謎を解くための協力者
  - name: 九条 宗厳
    relation: 雇用主
  arc: 沈黙を守り続けてきたが、真実が明らかになる瞬間に、館の機構を動かすための重要な役割を果たす。
