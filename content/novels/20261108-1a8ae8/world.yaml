title: 月蝕の刻、銀鱗の館に閉ざされた双子
genre: 伝奇
tone: 幻想的かつ耽美的な推理
pov: 三人称
tense: 過去形
setting: 大正末期、霧深い山間にひっそりと佇む、銀色の鱗のような外壁を持つ奇邸「銀鱗館」
premise: 十年前、完全に密閉された「天球の間」から忽然と姿を消した双子の跡継ぎ。招かれた家系研究者は、月の満ち欠けに合わせて構造を変えるという奇怪な館の謎に挑む。月食の夜、止まっていたはずの巨大な歯車が再び動き出し、不可解な密室の真実が白日の下に晒される。
themes:
- 境界線
- 運命の対称性
rules:
- 館の壁面および床面は巨大な時計仕掛けの機構により、月の満ち欠けに連動して物理的に移動・変形する。
- 特定の部屋への扉は、月の角度と天球儀の位相が正確に一致した瞬間にのみ開扉される。
- 館内に現れる「亡霊」は、精巧な鏡の配置と光の屈折を利用した光学的な錯覚である。
plot_outline:
- '序盤: 家系研究者の主人公が銀鱗館へ招待され、十年前の双子失踪事件と、内部から完全に封鎖されていた「天球の間」の不可解な状況について聞かされる。'
- '中盤: 館の探索を通じ、部屋の配置が月相によって変動することに気づく。壁に刻まれた天文学的な記号と、地下に眠る館全体の制御塔である巨大な天球儀の存在を突き止める。'
- '終盤: 全月食の夜、館全体の機構が連動し、十年間閉じられていた「天球の間」の隠し扉が物理的に開く。そこで発見されたのは、鏡合わせの構造を持つ隠し部屋に囚われていた双子の片割れであった。'
- '結末: 幽霊の正体は鏡による投影であり、密室のトリックは月相連動の可動壁によるものであることを論理的に解明し、一族の歪んだ血統の悲劇に終止符を打つ。'
style_notes: 三人称視点を用い、「～であり」「～であった」といった古風で重厚な装飾的文体で綴る。特に館の構造（回廊の曲がり角、天井の装飾、壁の材質、扉の意匠）を執拗なまでに詳細に描写し、読者に迷宮を歩いている感覚を与えること。怪異を提示しつつも、最終的には物理的な機構と幾何学的な論理によってすべてを解決させる。
