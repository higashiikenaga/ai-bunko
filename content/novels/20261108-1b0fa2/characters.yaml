- name: 海童 レン (Ren Kaidoh)
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常に着古した黒い防弾ロングコートを羽織っている。左目は高度なスキャニング機能を持つ青いサイバネティック・アイ。常に煙草の煙を纏っている。
  personality: 冷笑的で虚無主義的。他人に深入りすることを避けるが、根底には強い正義感と過去への悔恨を隠している。一人称は「オレ」。
  speech_style: ぶっきらぼうで、必要最低限の言葉しか発しない。低く、乾いた声。
  background: かつて天穹重工のセキュリティ部門に所属していたエリートエンジニアだったが、ある「データの消失事件」に巻き込まれ、身分を抹消されてスラムへ堕ちた。現在は記憶泥棒として生きている。
  motivation: 莫大な報酬を得て、失った過去の記憶を取り戻すこと。しかし、桜のデータに触れることで真の目的が変化する。
  relationships:
  - name: サクラ
    relation: 解析対象であり、意識の境界を揺さぶる存在
  - name: カイト
    relation: スラムでの唯一の協力者・情報屋
  arc: 世界の欺瞞に対して無関心だった傍観者が、真実を知ることで、自らの意志で世界を書き換える「決断者」へと変貌する。
- name: サクラ (Sakura)
  role: 物語の鍵を握る存在
  age: 17
  gender: 女性
  appearance: 電脳空間においてのみ実体化する、透き通るような白い肌の少女。彼女の周囲には常にデジタルな桜の花びらが舞っている。
  personality: 儚げで慈愛に満ちているが、どこか人間離れした冷徹な論理も併せ持つ。一人称は「私」。
  speech_style: 詩的で、現実と夢の境界が曖昧な、静かで穏やかな話し方。
  background: 天穹重工が都市の基幹OSを管理するために開発した、極秘の「人工意識プログラム」。都市の「偽りの空」を維持するための演算核としての側面を持つ。
  motivation: プログラムとしての役割を果たすことと、一人の「意識」として、偽りのない世界を見ることの葛藤。
  relationships:
  - name: 海童 レン
    relation: 自身の真実を解き明かす唯一の観測者
  arc: 単なる管理用プログラムから、レンの選択によって「世界に影響を与える意志」へと昇華される。
- name: 有坂 理事 (Director Arisaka)
  role: 敵役
  age: 52
  gender: 男性
  appearance: 完璧に仕立てられた高級なスーツを着用。全身の半分以上が黄金色の最先端サイバネティクスで置換されており、威圧的な存在感を放つ。
  personality: 極端な合理主義者であり、秩序こそが人類の救済だと信じている。目的のためには都市規模の犠牲も厭わない。一人称は「私」。
  speech_style: 丁寧だが、相手を駒としてしか見ていない、冷酷で慇懃無礼な敬語。
  background: 超巨大企業『天穹重工』の治安維持部門の最高責任者。ネオ・カサミの秩序（偽りの空）を守ることが自身の使命であると考えている。
  motivation: 電脳桜を回収・制御し、都市の支配体制を盤石なものにすること。
  relationships:
  - name: 海童 レン
    relation: 排除すべき過去の遺物および、システムへの脅威
  arc: 完璧な支配を確信していたが、レンによる予測不能な「人間的選択」によって、構築した秩序が崩壊していく様を目の当たりにする。
- name: カイト (Kaito)
  role: 脇役
  age: 22
  gender: 男性
  appearance: ジャンクパーツを繋ぎ合わせたような、不恰好なサイバネティクスを装着している。常にヘッドセットを首にかけている。
  personality: 軽薄で好奇心旺盛、金に汚いが、根は情に厚い。一人称は「ボク」。
  speech_style: 早口で、ネットスラングや専門用語を多用する、落ち着きのない話し方。
  background: スラムのジャンク屋兼、非合法な情報屋。レンの技術を高く評価しており、時折、危険なデータの仲介を行う。
  motivation: スラムから脱出し、上層の空中浮遊船で贅沢な暮らしをすること。
  relationships:
  - name: 海童 レン
    relation: ビジネスパートナーであり、尊敬する兄貴分
  arc: 単なる利益追求の傍観者であったが、世界の真実が明らかになる過程で、自らの生きる場所（スラム）の価値を再認識する。
