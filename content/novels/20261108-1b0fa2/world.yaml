title: ネオン・ハイドロ・レクイエム：電脳桜の残響
genre: サイバーパンク
tone: ネオンと雨、硬質なスピード感
pov: 一人称（オレ）
tense: 現在形・過去形混合
setting: 2114年、超巨大企業『天穹重工』が支配する垂直都市・ネオ・カサミ。上層の雲海に浮かぶ空中浮遊船と、下層の酸性雨が降り注ぐスラムの対比。
premise: 降り止まぬ酸性雨。ネオンの光が水たまりに溶ける路地裏。オレは、死んだはずの少女の意識データを盗み出す『記憶泥棒（メモリー・スリッパー）』だ。今回のターゲットは、天穹重工の空中浮遊船に隠匿された、電脳化された『桜』のプログラム。それを解析するうちに、オレは都市の基幹OSが隠蔽する、美しすぎる偽りの空の正体に触れてしまう。
themes:
- 情報の真正性
- 管理された楽園と真実の地獄
rules:
- 脳内チップ（ニューロ・リンク）への直接干渉は致死率が高い
- 空中浮遊船は特権階級のみがアクセス可能な物理的・情報的聖域である
- 電脳空間における『桜』のコードは、精神崩壊を引き起こす高密度の美学データである
plot_outline:
- '序盤: スラムの安酒場で、依頼人の謎めいたデータチップを受け取る。ターゲットは空中浮遊船に眠る『電脳桜』。オレは雨の街を駆け、ゲートのセキュリティを突破する。'
- '中盤: 浮遊船へのハッキング作戦。コードの奔流、ファイアウォールの防壁をバイパスする感覚。だが、桜のデータに触れた瞬間、オレの意識は現実と電脳の境界を喪失する。'
- '終盤: 天穹重工の追っ手。空飛ぶ船のデッキで、ネオンの光を切り裂く銃撃戦。桜のプログラムが展開され、街全体を覆う偽りの春の光が溢れ出す。'
- '結末: データの真実を知ったオレは、桜を破壊するか、あるいは世界に『偽りの春』を流布するかを選択する。降りしきる雨の中、オレはただ、次の依頼を待つ。'
style_notes: 「オレ」の独白。短文の連打。『ノイズ混じりの思考』『電気信号の痛み』といった感覚的な言葉を多用。ハッキング描写は、バイナリの断片、プロトコルの衝突、神経への負荷を具体的に、かつ詩的に綴る。企業の清潔な白と、路地裏の汚濁したネオンの色彩対比を強調せよ。
