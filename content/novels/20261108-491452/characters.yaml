- name: エリナ・ルミエール
  role: 主人公
  age: 18
  gender: 女性
  appearance: 栗色の緩いウェーブヘアをリボンで結んでいる。清潔感のある白いエプロンドレスを身に纏い、いつも穏やかな微笑みを浮かべている。
  personality: 控えめだが芯が強く、他者の小さな変化に気づく心優しい性格。一人称は「私」。
  speech_style: 丁寧で柔らかい口調。相手を包み込むような温かみのある話し方をする。
  background: 巨大蒸気機関の傍らにある小さな喫茶店「黄金のしずく」を営む。街の灯りと蒸気の音を子守唄のようにして育った。
  motivation: 訪れる人々が心から安らげる場所を提供し、街の穏やかな日常を守りたい。
  relationships:
  - name: テオドール
    relation: 信頼し、尊敬している街の相談役のような存在
  - name: ルカ
    relation: 賑やかな友人であり、店に活気をもたらしてくれる常連客
  arc: ただ日常を見守る側から、人々を繋ぎ合わせることで街の綻びを癒やす中心的な存在へと成長する。
- name: テオドール・クロック
  role: 相棒/導き手
  age: 64
  gender: 男性
  appearance: 銀髪の短髪に、片眼鏡（モノクル）を着用。油汚れのついた茶色のベストと、使い込まれた革の工具ベルトを身につけている。
  personality: 職人気質で厳格に見えるが、内面は非常に情に厚い。街の機械を我が子のように愛している。一人称は「私」。
  speech_style: 落ち着いた低音。簡潔に話すが、言葉の端々に相手への気遣いが滲み出る。
  background: 街の蒸気供給路と時計塔を管理する熟練の時計職人。街の構造に誰よりも詳しく、蒸気の「声」を聞くことができる。
  motivation: 街の鼓動である蒸気機関を完璧な状態で維持し、次世代に引き継ぐこと。
  relationships:
  - name: エリナ
    relation: 孫のように可愛がっており、彼女の淹れる紅茶を唯一の休息としている
  arc: 完璧を求める孤独な職人だったが、住民たちの自発的な助けに触れ、一人で背負わず頼ることの心地よさを再発見する。
- name: ルカ・ベルモンド
  role: 脇役/ムードメーカー
  age: 21
  gender: 男性
  appearance: 明るい金髪に、動きやすい配達員風の衣装。常に大きな配送鞄を肩にかけ、快活な笑顔を絶やさない。
  personality: 好奇心旺盛で社交的。街中の誰とでもすぐに友達になれる天真爛漫な性格。一人称は「僕」。
  speech_style: 早口でエネルギッシュ。感嘆符が多く、感情表現が豊かな話し方。
  background: 街のあちこちに手紙や小包を届ける配達員。街の隅々まで足を運ぶため、住民たちの小さな悩みや噂に一番に気づく。
  motivation: 街の人々を笑顔にし、心地よい繋がりを増やすこと。
  relationships:
  - name: エリナ
    relation: 仕事の合間に店に寄り、賑やかに喋る親友のような関係
  - name: テオドール
    relation: 口うるさいおじいちゃんだと思いつつ、その技術を心から尊敬している
  arc: 常に動き回っていたが、灯りが弱まった静寂の時間を通じて、ゆっくりと誰かに寄り添うことの大切さを知る。
- name: クララ・ノートン
  role: 脇役
  age: 27
  gender: 女性
  appearance: 長い黒髪を低めの位置でまとめ、知的な印象の眼鏡をかけている。常に古い羊皮紙のノートを持ち歩いている。
  personality: 内向的で思索にふけることが多いが、知識欲が強く、真面目。一人称は「私」。
  speech_style: 論理的で丁寧だが、緊張すると少し言葉が詰まる傾向がある。
  background: 街の歴史と蒸気機関の記録を管理する記録保管係。静かな図書館で過ごす時間が多く、対人関係には不器用。
  motivation: 街の記憶を正確に記録し、過去の知恵を現代に活かすこと。
  relationships:
  - name: テオドール
    relation: 技術的な相談相手であり、学問的な信頼関係にある
  - name: エリナ
    relation: 店で静かに本を読みながら、エリナの優しさに救われている
  arc: 記録という「過去」の世界に閉じこもっていたが、現実の危機に直面し、自分の知識を誰かのために役立てる喜びを得る。
