- name: カイ
  role: 主人公
  age: 24
  gender: 男性
  appearance: 疲れ切った目元に、使い古されたオーバーサイズのテックジャケットを羽織っている。首筋には旧型のニューラルインターフェース端子が露出している。
  personality: 現実主義で慎重。他者との深い関わりを避ける傾向にあるが、根は情に厚い。一人称は「俺」。
  speech_style: ぶっきらぼうで簡潔。技術的な専門用語を日常的に混ぜて話す。
  background: 元は企業の下請けエンジニアだったが、ある不祥事に巻き込まれ追放され、現在は低層階層でバグ回収を請け負うフリーランスのデバッガーとして生活している。
  motivation: 日々の生活費を稼ぐこと。そして、偶然手にした「桜のデータ」に導かれ、失われた記憶の断片に触れたいという本能的な欲求。
  relationships:
  - name: サクラ
    relation: データ上の導き手であり、守るべき対象
  - name: ミア
    relation: 信頼している情報屋であり、唯一の友人
  - name: ヴェクター
    relation: 執拗に追ってくる宿敵
  arc: 単なる生存本能で動いていたところから、誰かのため、あるいは都市の未来のために、自らの大切な記憶という代償を払ってでも戦う覚悟を持つに至る。
- name: サクラ
  role: 鍵となる存在
  age: 17
  gender: 女性（のデータ残滓）
  appearance: 半透明で、輪郭が絶えず桜の花びらのようなピンク色の粒子となって散っている。物理的な実体を持たない電脳生命体。
  personality: 儚げで穏やかだが、時折強い意志を見せる。記憶が断片的であるため、混乱していることが多い。一人称は「私」。
  speech_style: 詩的で静か。データ破損の影響で、時折言葉がループしたり、ノイズが混じったりする。
  background: 都市管理OSの初期開発に関わった人物の記憶データ。都市の根幹を書き換えるための「鍵」として設計されたが、禁忌として封印されていた。
  motivation: 自分が何者であるかを知ること。そして、自分の存在がもたらす崩壊を止めるために消滅すること。
  relationships:
  - name: カイ
    relation: 自分を拾い、理解しようとしてくれた唯一の人間
  arc: 断片的な記憶を統合し、自分が都市の「エラー」であることを受け入れ、カイに託して消えることを選択する。
- name: ヴェクター
  role: 敵役
  age: 30
  gender: 男性
  appearance: 白を基調とした機能的な企業制服に身を包んでいる。感情を読み取らせない無機質なバイザーを装着し、動作に一切の無駄がない。
  personality: 冷徹で効率至上主義。都市の秩序を維持することを絶対的な正義と考えている。一人称は「私」。
  speech_style: 丁寧だが威圧的。論理的な正論で相手を追い詰める話し方。
  background: 企業治安維持局の精鋭。肉体の多くをサイバネティクス化しており、電脳空間へのダイブ速度と演算処理能力に特化した「狩人」。
  motivation: 「桜のデータ」を回収し、都市の管理OSを完全な状態で維持・固定すること。
  relationships:
  - name: カイ
    relation: システムを乱す不確定要素（バグ）として排除対象と見なしている
  arc: 完璧な論理で動いていたが、カイの「非効率で自己破壊的な最適化」という人間らしい選択に直面し、システムの不完全さと人間の可能性にわずかな疑問を抱く。
- name: ミア
  role: 相棒/サポート
  age: 32
  gender: 女性
  appearance: ネオンカラーの派手な髪色に、複数のホログラムディスプレイを周囲に展開させている。腕には高速タイピング用の補助アームを装着している。
  personality: 快活で強欲だが、情に脆い。リスクを好むギャンブラー気質。一人称は「アタシ」。
  speech_style: 早口でスラングが多く、冗談を交えた軽快な口調。
  background: 元ネットランナー。現在は低層階層で闇の情報屋を営み、カイに機材の調達やルート解析のサポートを提供している。
  motivation: この退屈な都市で、歴史に残るような大事件に巻き込まれ、一攫千金を狙うこと。
  relationships:
  - name: カイ
    relation: ビジネスパートナーであり、兄のような信頼を寄せている
  arc: 単なる好奇心と金儲けのために協力していたが、カイが失おうとしているものの大きさを知り、彼を精神的に支える真の相棒へと成長する。
