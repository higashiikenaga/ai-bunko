title: 電脳桜の演算誤差：約束の丘のデッドロック
genre: サイバーパンク
tone: ハードボイルドかつ戦略的、スピード感のある電脳戦
pov: 一人称（俺）
tense: 現在形・過去形混在
setting: 超巨大階層都市『ネオ・エデン』。物理層と電脳空間が不可分に結合した、高度情報化社会の果て。
premise: 電脳空間の「バグ」を回収し、物理的な報酬を得るフリーランスの『デバッガー』、カイは、ある日「約束の丘」と呼ばれる禁忌の仮想領域へアクセスしてしまった。そこには、消滅したはずの過去の記憶データが、散りゆく桜の粒子として可視化されていた。カイは、そのデータが都市を崩壊させる致命的な論理爆弾であることを知る。追っ手となる企業治安維持局の防衛プログラムを、限られた演算リソースと知略だけで切り抜け、彼はデータの真実に辿り着けるのか。
themes:
- 記憶のデータ化とアイデンティティ
- システムの非情さと個人の意志
rules:
- 電脳空間における『リソース消費』：スキル使用ごとに脳内チップの演算負荷（オーバーヒート）が蓄積し、限界を超えると意識が消失する。
- 物理・仮想の同期：仮想空間でのダメージは、神経接続を通じて肉体的な苦痛や機能停止としてフィードバックされる。
- プロトコル制約：特定の権限（権限レベル）がない限り、高次階層のデータ構造には干渉できない。
plot_outline:
- '序盤: 低層階層で小規模なバグ回収をこなすカイが、謎の少女の残滓が含まれた『桜のデータ』を偶然拾い、都市最上層の『約束の丘』へのルートを強制起動させられる。'
- '中盤: 企業治安維持局の執拗な追跡。カイは自身のチップの限界を見極めながら、リソースを最小限に抑える『ルート最適化』の戦術で、追撃をかわし続ける。中盤、桜のデータが単なるバグではなく、都市の管理OSを書き換えるための『鍵』であることが判明する。'
- '終盤: 約束の丘での決戦。最上位AIが展開する、物理法則を書き換えるほどの演算攻撃に対し、カイはあえて自身のメモリを破壊する『自己破壊的最適化』を仕掛ける。'
- '結末: 都市のシステムは維持されるが、桜のデータは消去される。カイは生き残るが、その代償として、自分自身の最も大切な記憶の一部を、演算リソースの補填として失ってしまう。'
style_notes: 「俺」という一人称を用い、状況を常に「演算」「リソース」「最適解」といったゲーム的なメタファーで捉える。戦闘シーンでは、単なる力押しではなく、相手の行動パターンの予測、攻撃のフレーム、スキルのクールタイムといった、ルールに基づいた緻密な駆け引きを、軽口を叩きながらも冷徹な分析と共に描く。
