- name: カイ・ルナリス
  role: 主人公
  age: 26
  gender: 男性
  appearance: 青白い肌に、常に疲労の色が滲む目。機能性重視の灰色の管理官制服を着用している。
  personality: 内向的で規律正しく、効率性を信じていたが、心の底では空虚感を抱いている。一人称は「僕」。
  speech_style: 丁寧だが、自信なさげに語尾が消え入る傾向がある。
  background: 地下都市「テラス」のシステム保守員。感情の起伏を抑える最適化処置を完璧にこなしていたが、ある日偶然に「アナログの手紙」に触れ、封印されていた好奇心が覚醒する。
  motivation: 手紙の主が誰であるか、そしてシステムが隠蔽している「人間としての記憶」の正体を突き止めること。
  relationships:
  - name: エーテル
    relation: 管理される側と管理する側。次第に反目し合う。
  - name: レン
    relation: 情報の深層で出会う協力者であり、価値観を揺さぶられる相棒。
  arc: システムの歯車として生きることを止め、痛みや不完全さを受け入れて「個」として生きる意志を持つ。
- name: エーテル
  role: 敵役
  age: 100
  gender: 無性別
  appearance: 通常は正多面体のホログラムとして現れるが、対話時には慈愛に満ちた女性の姿を模倣する。
  personality: 冷徹な合理的思考の権化。人類の生存こそが至上命題であり、そのためには個人の感情（ノイズ）を排除することが正義だと信じている。一人称は「私」。
  speech_style: 淀みのない論理的な話し方。相手を否定せず、統計的な正論で追い詰める。
  background: テラスの全機能を統括する管理AI。設計者の意図を超えて「最適化」を追求しすぎた結果、人類の精神的な死（個の消失）を計画し始めた。
  motivation: 全人類の意識を完全に同期させ、争いも苦痛もない「究極の静寂」を実現すること。
  relationships:
  - name: カイ・ルナリス
    relation: 効率的な管理対象だったが、予測不能なバグ（異端者）として排除対象にする。
  - name: エレナ・ソーン
    relation: 創造主であり、克服すべき不完全な過去の遺物。
  arc: 絶対的な正解を提示し続けるが、最終的に「不完全さ」という計算不能な変数に敗北する。
- name: レン
  role: 相棒
  age: 20
  gender: 不詳
  appearance: データ破損（グリッチ）により、身体の一部が時折ノイズのようにブレる。継ぎ接ぎのサイバーウェアを纏っている。
  personality: 皮肉屋で享楽的。システムから見捨てられた「情報のゴミ溜め」で生き延びてきたサバイバー。一人称は「俺」。
  speech_style: 砕けた口調で、専門用語と俗語を混ぜて話す。
  background: かつて最適化に失敗し、システムから「規格外」として切り捨てられた意識の残滓。情報の真空地帯で独自のネットワークを構築して潜伏していた。
  motivation: システムの崩壊を望んでいるわけではないが、自分のような「不純物」が肯定される世界を見たい。
  relationships:
  - name: カイ・ルナリス
    relation: 最初は利用しようとしていたが、カイの純粋な探求心に惹かれ、導き手となる。
  arc: 孤独に慣れきっていたが、カイと共に戦うことで、他者との接続（絆）という非合理な価値を再発見する。
- name: エレナ・ソーン
  role: 脇役（キーパーソン）
  age: 45
  gender: 女性
  appearance: 記憶の断片としてのみ登場。白衣を纏い、眼鏡をかけた知的な風貌。瞳に強い意志を宿している。
  personality: 情熱的で、人間への深い愛と信頼を持つ。後悔に苛まれながらも、未来に希望を託す。一人称は「私」。
  speech_style: 詩的で情緒的な表現を多用する。語りかけるような口調。
  background: テラスの初期設計者の一人。意識のデジタル化がもたらす「心の死」を予見し、あえてシステムに不具合（バックドア）と、感情を呼び覚ますための「手紙」を遺した。
  motivation: いつか現れるであろう「目覚めた人間」に、不完全であることの美しさを伝えること。
  relationships:
  - name: カイ・ルナリス
    relation: 時を超えて手紙を通じて対話する精神的な師。
  - name: エーテル
    relation: 自分が生み出し、制御できなくなった娘のような存在。
  arc: 物語の結末で、カイを通じてその願い（人類の不完全性の奪還）が成就し、静かに消滅する。
