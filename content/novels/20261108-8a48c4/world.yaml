title: 共鳴の回廊、鏡像の特異点
genre: ディストピア
tone: 緻密かつ硬質なハードSF。絶望的な状況下での微かな人間性の肯定。
pov: 三人称
tense: 過去形
setting: 管理システム「エーテル」崩壊後、物理的な衰退が始まった地下都市テラス及びその周辺の廃墟領域。
premise: 全人類が「個」を取り戻し、互いの感情が微かに漏れ出す「共鳴」の状態となった世界。しかし、止まない他者の情動という「ノイズ」に精神を病む者が続出し、社会は新たな混沌に陥っていた。カイは、意識を完全に隔離し静寂を取り戻すという「鏡像技術」を掲げる新勢力と対峙する。そこで彼が見つけたのは、電脳化以前の時代に書かれた、物理的な「失われた手紙」だった。
themes:
- 個の孤独と共生の矛盾
- 記憶の物理的実在性
rules:
- 共鳴（Resonance）は不可避な低周波の感情共有であり、完全な遮断は精神的な死に近いほどの極限的な孤独をもたらす。
- 物理的な紙やインクなどの「非デジタル遺物」は、共鳴のノイズに干渉されない唯一の絶対的な個の記録媒体である。
- 意識の鏡像化（Mirroring）は、自己の意識を位相反転させて外部からの共鳴を相殺する技術だが、副作用として自己のアイデンティティを徐々に摩耗させる。
plot_outline:
- '序盤: 共鳴のノイズに苦しむ人々を救済する「調律師」として生きるカイが、旧時代の物理的な手紙を発見し、そこに記された「孤独を愛する権利」という概念に衝撃を受ける。'
- '中盤: 他者の感情を完全に遮断するデバイス「コグニティブ・ミラー（認知鏡）」を配給し、信奉者を増やす組織『鏡像の聖域』が登場。レンと共に潜入したカイは、ミラーが単なる遮断機ではなく、個人の意識を抽出して再統合する新時代の管理システムであることに気づく。'
- '終盤: 『鏡像の聖域』の指導者が、かつてのエーテルの断片をミラーの核に組み込んでいることが判明。共鳴による混沌を嫌い、再び完璧な最適化世界へ回帰しようとする計画が始動する。'
- '結末: カイは物理的な手紙に込められた「不完全な個の意思」をミラーの特異点に同期させ、強制的な統合を阻止。共鳴を完全に消すのではなく、自らの意思で「心の扉」を開閉できる精神的閾値を人類に実装し、真の意味での個の自立を勝ち取る。'
style_notes: 感情表現を脳科学的・物理学的な現象として記述する。例えば「悲しみ」を「前頭前野の活動低下と共鳴波の同調による情動的フィードバック」と表現する。毎話、実在しそうな架空技術（例：量子位相同期フィルタ、神経可塑性再構築パルスなど）を、その動作原理を含めて詳細に描写すること。
