- name: エリアン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 穏やかな眼差しと、使い込まれた革の旅鞄を持つ青年。常に一冊の分厚い日記帳を携えている。
  personality: 控えめで思慮深く、他者の感情に敏感。一人称は「僕」。
  speech_style: 丁寧で静かな話し方。相手の話を遮らず、ゆっくりと相槌を打つ。
  background: 幼い頃に家族を亡くし、孤独の中で「誰かの記憶を繋ぐこと」に救いを見出した。現在は各地を巡り、死者の小さな願いを叶える旅人として生きている。
  motivation: 遺された人々のささやかな願いを完遂させ、世界に心地よい記憶を残すこと。そして、自身の家族が遺した未完の遺言の答えを見つけること。
  relationships:
  - name: ガレス
    relation: 旅の途中で出会った人生の師のような存在
  - name: リラ
    relation: 好奇心旺盛な友人であり、旅の道連れ
  arc: 「さよなら」を届けるだけの役割だと思っていたが、旅を通じて自分自身も誰かに必要とされていることを知り、孤独を癒やして前を向く。
- name: ガレス・ソーン
  role: 脇役（導き手）
  age: 58
  gender: 男性
  appearance: がっしりとした体格だが、背中を少し丸めて歩く。折れた剣の破片を組み込んだ特製の杖を使い、庭に色とりどりの花を育てている。
  personality: ぶっきらぼうだが情に厚い。過去の戦いに疲れ、今は静寂を愛する。一人称は「私」。
  speech_style: 低く、ぶっきらぼうな口調。時折、深い溜息をつきながらも優しい言葉を添える。
  background: かつては王国最強と謳われた騎士だったが、ある戦いを機に剣を折り、隠居して花を育てる生活を送っている。
  motivation: 静かな余生を過ごすことと、エリアンの危うい純粋さを密かに見守り、導くこと。
  relationships:
  - name: エリアン
    relation: 若さゆえの危うさを気に掛けている後輩のような存在
  arc: 折れた剣（過去の挫折や後悔）を捨てるのではなく、杖として使いながら生きることで、不完全な自分を肯定できるようになる。
- name: リラ・ソレーヌ
  role: 相棒/脇役
  age: 24
  gender: 女性
  appearance: 明るい橙色の髪をリボンで雑に結んでいる。小麦粉とハーブの香りが染み付いたエプロンを身に着けている。
  personality: 天真爛漫で好奇心旺盛。直感的に行動するタイプ。一人称は「私」。
  speech_style: 早口で弾むような話し方。比喩表現が多く、「風の味がする」など感覚的な言い回しを好む。
  background: 季節の風を瓶に詰め、料理の隠し味にするという不思議な技術を持つ料理人。新しい味と経験を求めて旅をしている。
  motivation: 世界中の「心地よい風」を集め、誰もが幸せになれる究極のスープを作ること。
  relationships:
  - name: エリアン
    relation: 彼の静かな旅路に彩りを添えたいと思っている親友
  arc: 完璧なレシピを追い求めるのではなく、誰と一緒に食べるかという「時間」こそが最高の調味料であることに気づく。
