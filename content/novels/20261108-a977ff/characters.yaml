- name: ポポ・リスリー
  role: 主人公
  age: 8
  gender: 男
  appearance: 茶色いふわふわの毛並みを持つ小さなリス。どんぐりの形をした小さなリュックを背負っている。
  personality: 好奇心旺盛で元気いっぱい。新しいもの好きだが、少しだけおっちょこちょい。一人称は「ぼく」。
  speech_style: 明るくハキハキとした話し方。「～だよ！」「～かな？」と語尾が弾む。
  background: フルーティ・フォレストの古い樫の木の下で、家族と仲良く暮らしていたリスの男の子。
  motivation: 地図に描かれた「さくらんぼの桜」を見つけ、世界を美しいピンク色に染めること。
  relationships:
  - name: ルナ・ラビット
    relation: 大切な旅の仲間・親友
  - name: ベリーおじいさん
    relation: 森の知恵を教えてくれる尊敬する大人
  arc: 未知の世界への好奇心だけで動いていた少年が、困難の中で仲間を守りたいという責任感と、真の宝物は形のないものだと気づく心の成長を遂げる。
- name: ルナ・ラビット
  role: 相棒
  age: 8
  gender: 女
  appearance: 真っ白で長い耳を持つ、とても可愛らしいウサギ。イチゴ色のリボンを耳につけている。
  personality: とても臆病で慎重派。しかし、困っている人を見捨てられない深い優しさを持っている。一人称は「わたし」。
  speech_style: 少しおどおどとした、控えめな話し方。「～ですぅ」「～かも……」と少し自信なさげに話す。
  background: クローバーの草原で、静かな生活を送っていたウサギの女の子。
  motivation: 臆病な自分を変えて、ポポくんの冒険を最後まで支え抜くこと。
  relationships:
  - name: ポポ・リスリー
    relation: 勇気をくれる大切な親友
  arc: 最初は小さな物音にも驚いて逃げ出してしまうほど怖がりだったが、旅を通じて、大切な人のために一歩踏み出す勇気を手に入れる。
- name: ベリーおじいさん
  role: 脇役（導き手）
  age: 75
  gender: 男
  appearance: 丸い眼鏡をかけた、物知りそうなハリネズミ。麦わら帽子と古いベストを着用している。
  personality: 穏やかで包容力があり、常にゆったりとした時間を過ごしている。一人称は「わし」。
  speech_style: ゆっくりとした、落ち着いた老人の話し方。「～じゃよ」「～のう」といった古風な言い回し。
  background: 森の図書館を守る長老。地図の歴史や、さくらんぼの桜にまつわる伝説を熟知している。
  motivation: ポポとルナが地図の真の意味を理解し、自分たちの足で歩んでいけるよう見守ること。
  relationships:
  - name: ポポ・リスリー
    relation: 冒険の出発を応援する導き手
  - name: ルナ・ラビット
    relation: 優しさを認めてあげる理解者
  arc: 物語の進行を支える精神的支柱として、二人の成長を静かに見守り続ける。
