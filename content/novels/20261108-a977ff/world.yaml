title: さくらんぼ色の風と、ひみつの地図の冒険
genre: 異世界ファンタジー
tone: やわらかくて、あたたかい雰囲気
pov: 三人称（親しみやすい語り）
tense: 過去形
setting: お菓子や果物が実る、不思議な森の国「フルーティ・フォレスト」
premise: 小さなリスのポポくんは、ある日、古い木の中から「ひみつの地図」を見つけます。その地図には、世界中をピンク色に染めるという、魔法の「さくらんぼの桜」の場所が描かれていました。ポポくんは、臆病なウサギのルナちゃんと一緒に、地図を頼りに冒険へ出かけます。色あせた地図をたどる旅は、勇気と優しさを教えてくれる、素敵な贈り物になるでしょう。
themes:
- 勇気を持って一歩踏み出すこと
- 友達と一緒に過ごす時間のたからもの
rules:
- 地図は持ち主の『ときめき』に反応して、少しずつ道を示してくれる
- 魔法の桜が咲くと、その土地のすべての動物たちが幸せな気持ちになる
- 大きな声で怒ったり、意地悪をしたりすると、道が霧で隠れてしまう
plot_outline:
- '序盤: リスのポポくんが、古い樫の木の根元で、キラキラ光る「ひみつの地図」を見つけます。地図を広げると、そこには見たこともない美しい桜の木が描かれていました。'
- '中盤: ポポくんは、怖がりなウサギのルナちゃんと出会い、二人で旅を始めます。川を渡ったり、高い丘を登ったりしながら、時々迷子になりそうになりますが、地図が優しく光って助けてくれます。'
- '終盤: 二人はついに、地図が指し示す「さくらんぼの桜」の丘にたどり着きます。でも、そこには大きな嵐が吹き荒れていて、桜はまだ眠っていました。'
- '結末: 二人が手を取り合って「咲いてほしいな」と心から願うと、風に乗って桜の花びらが舞い踊り、世界は美しいピンク色に包まれます。ポポくんたちは、本当の宝物は地図の中ではなく、旅の中で出会った友達なのだと気づきます。'
style_notes: 児童文学のような、優しくて丸みのある言葉を使います。難しい漢字には読み仮名を振るようなイメージで、読者に語りかけるように書きます。物語の終わりに、「みんなも、勇気を出して一歩進んでみませんか？」といった、小さな教訓をそっと添えてください。
