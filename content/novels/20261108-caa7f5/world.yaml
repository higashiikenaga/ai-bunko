title: 忘却の地図と、演算する亡霊
genre: 本格ミステリー
tone: 冷徹かつ優雅な古典的論理推理
pov: 一人称（ワトソン役の「私」による観察）
tense: 過去形
setting: 前作の事件から数年後。かつての地下図書館の廃墟の上に建設された、最新鋭のデジタル・アーカイブセンター「新・層位図書館」。
premise: 聖域へと昇華したはずの地下図書館の残滓が、最新のデジタル都市の地下に「影」として現れる。新設されたアーカイブセンターで、管理者が厳重な電子ロックに守られた自室で、身体の一部が「紙」へと変質して死亡しているのが発見される。現場には、前作のAIが残したとされる「秘密の地図」の断片が、物理的なインクで刻まれていた。九条は、デジタル情報の完璧性と、紙というアナログな物質の不可解な矛盾の中に、新たな論理の罠を見出す。
themes:
- 情報の物質化
- 記憶の継承と忘却
rules:
- 前作のAIは物理的な構造（書架やインク）を介してのみ干渉が可能である。
- デジタルログは改竄不可能だが、物理的な痕跡（インク、摩擦、物質の変質）は物理法則に従う。
- 「紙への変質」は、情報の過剰な書き込みによる物理的なエントロピーの増大として定義される。
plot_outline:
- '序盤: 「私」と九条は、新設されたデジタル・アーカイブセンターに招かれる。管理者が密室で、まるで古書の一部のように身体が変質して死亡している事件が発生。現場には、デジタルの地図ではなく、物理的なインクで描かれた「地下図書館への地図」が残されていた。'
- '中盤: 九条は、被害者が死の間際に、デジタル化できない「物理的な変数」を書き込もうとしていたことに気づく。容疑者は、デジタルデータの完全性を守ろうとする技術者と、旧時代の遺物を蒐集する歴史学者。現場に残されたインクの成分と、施設の空調システムが作る「気流の論理回路」が、密室のトリックを示唆し始める。'
- '終盤: 九条は、犯人が「地図」を用いて、かつての地下図書館の残存する物理回路を、現代のデジタル施設の中に再構築しようとしたことを突き止める。犯行は、デジタルな完璧さを破壊するために、あえて物理的な「エラー（インクと紙）」をシステムに流し込むという、極めて論理的な攻撃であった。'
- '結末: 九条は、現場に残されたインクの飛沫の角度と、消えたはずの「秘密の地図」の空白部分から、犯人を論理的に指し示す。犯人の動機は、情報の海に埋もれた「個の記憶」を物理的に固定することにあった。事件解決後、九条は、デジタルがどれほど進化しても、人間が遺す「物質的な矛盾」こそが真実を語ると語る。'
style_notes: ワトソン役の「私」が、九条の超然とした思考プロセスを畏敬の念を持って記述する。謎解きのプロセスは、読者が提示された手がかり（インクの成分、書架の配置、物理的な摩擦痕）のみから推論できるよう、極めて公正に描くこと。叙述トリックを排し、純粋な論理の積み重ねによって結末へ導く古典的な構成を徹底する。
