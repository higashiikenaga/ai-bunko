- name: エリアナ・フォン・アストライア
  role: 主人公
  age: 19
  gender: 女性
  appearance: 透き通るような銀髪に、深い夜を湛えたような紺色の瞳。没落し擦り切れたドレスを纏っているが、気品ある立ち居振る舞いは隠せていない。
  personality: 芯が強く、誇り高い。絶望的な状況でも諦めない強靭な精神を持つ。一人称は「私」。
  speech_style: 丁寧で格式高い令嬢言葉だが、時折、意志の強さが滲み出る鋭い口調になる。
  background: かつてソリス公国で権勢を誇ったアストライア伯爵家の令嬢。政敵の陰謀により家名は汚され、財産を没収された。現在はスラムに近い下町で細々と暮らしながら、家名の再興を誓っている。
  motivation: 父を陥れた黒幕を突き止め、奪われた名誉と家を取り戻すこと。
  relationships:
  - name: ジュリアン・ソーン
    relation: 共犯関係。宝石の力を借りて社交界への復帰を企てる協力者。
  - name: カエレン
    relation: 警戒しつつも、目的のために情報を交換し合う危うい関係。
  arc: 復讐心に突き動かされていたが、街の危機を目の当たりにし、個人の名誉よりも多くの人々を救うための真のリーダーシップに目覚める。
- name: ジュリアン・ソーン
  role: 主人公/相棒
  age: 24
  gender: 男性
  appearance: 癖のある茶髪に、知的な光を宿した眼鏡。指先には常に宝石の研磨剤やインクの汚れがついている。服装は奔放だが、身につけている小物は極めて高価。
  personality: 好奇心旺盛で皮肉屋。美への執着が強く、職人気質。一人称は「僕」。
  speech_style: 早口で饒舌。専門的な宝石の話になると止まらなくなり、相手を置き去りにすることが多い。
  background: 平民出身ながら、類稀なる才能で公国の御用職人にまで登り詰めた天才宝石職人。美の極致を追い求めるあまり、禁忌とされる「呪いの宝石」の研究に手を染めている。
  motivation: オアシスの青い光を完全に再現した、世界で唯一の至高の宝石を作り出すこと。
  relationships:
  - name: エリアナ・フォン・アストライア
    relation: 最高の素材（ミューズ）として興味を持ち、彼女を飾り立てることに快感を覚えている。
  - name: カエレン
    relation: 裏社会のルートを通じて希少な原石を調達している取引相手。
  arc: 美への盲信から脱し、宝石が持つ真の価値とは、それを身につける者の想いや歴史にあることを悟る。
- name: カエレン
  role: 主人公/密偵
  age: 27
  gender: 男性
  appearance: 影に溶け込むような黒い装束。鋭い眼光と、顎に刻まれた薄い傷跡が特徴。感情を読み取らせない無表情な顔立ち。
  personality: 冷徹で合理的。常に最悪の事態を想定して動く現実主義者。一人称は「俺」。
  speech_style: 簡潔でぶっきらぼう。必要最低限のことしか話さず、相手の急所を突くような言い回しを好む。
  background: 正体不明の外部組織から派遣された密偵。ソリス公国の水源管理システムに隠された秘密を盗み出し、母国へ持ち帰る任務を帯びている。
  motivation: 任務を完遂し、組織への忠誠を証明して自由な身分を得ること。
  relationships:
  - name: エリアナ・フォン・アストライア
    relation: 監視対象だったが、彼女の不屈の精神に次第に惹かれていく。
  - name: ジュリアン・ソーン
    relation: 便利で使い勝手のいい技術屋として利用している。
  arc: 組織の駒として生きることをやめ、自らの意志で誰かを守るために戦う人間へと変化する。
- name: ヴァレリウス・ソリス公爵
  role: 敵役
  age: 45
  gender: 男性
  appearance: 黄金の刺繍が施された豪華絢爛な礼服を纏う。傲慢な笑みを浮かべた、彫刻のように整った容貌。瞳は不気味なほどに輝く金色。
  personality: 極めて独占欲が強く、支配欲に飢えている。他者を自分の快楽のための道具としか見ていない。一人称は「私」。
  speech_style: 優雅で朗々とした話し方だが、その言葉の端々には相手を威圧し、見下す冷酷さが潜んでいる。
  background: ソリス公国の実権を握る支配者。水源の枯渇を隠蔽し、一部の特権階級だけに水を配分することで、絶対的な権力を維持している。
  motivation: オアシスの力を利用して永遠の若さと不滅の権力を手に入れること。
  relationships:
  - name: エリアナ・フォン・アストライア
    relation: かつて排除したアストライア家の生き残りであり、再び自分の盤上の駒として利用しようとする。
  - name: ジュリアン・ソーン
    relation: 自分の野望を叶えるための「呪いの宝石」を完成させるための道具。
  arc: 絶対的な権力を誇っていたが、信頼していた道具（ジュリアン）と排除したはずの弱者（エリアナ）によって、積み上げた虚飾の城を崩壊させられる。
