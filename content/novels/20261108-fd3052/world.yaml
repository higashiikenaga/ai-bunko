title: 琥珀の砂塵と、真珠の円舞曲
genre: 群像劇
tone: 華麗で耽美、かつ緊迫感のある歴史ロマン
pov: 三人称
tense: 過去形
setting: 砂漠の真ん中に位置する、永遠の夜を謳歌するオアシス都市「ソリス公国」
premise: 黄金の砂漠に囲まれた、眠らない街ソリス。そこは、奇跡のオアシスが放つ青い光に照らされた、贅を尽くした貴族たちの楽園である。しかし、その輝きの裏では、枯れゆく水源を巡る権力闘争と、血塗られた陰謀が渦巻いていた。運命に翻弄される没落令嬢、天才宝石職人、そして謎の密偵の三人が、華やかな舞踏会の幕が上がる時、歴史の歯車を狂わせていく。
themes:
- 繁栄と衰退の美学
- 虚飾の裏に隠された真実
rules:
- 都市の繁栄はオアシスの魔力的な水源に直接依存している
- 貴族の地位は、身に纏う衣装の装飾性と宝石の質によって厳格に示される
- 都市の外側に広がる砂漠は、魔術的な障壁なしでは生存不可能である
plot_outline:
- '序盤: 世紀の舞踏会を目前に控え、ソリスの街はかつてない熱狂に包まれる。没落した伯爵令嬢、天才宝石職人、正体不明の密偵が、それぞれの目的を抱いて社交界へと足を踏み入れる。'
- '中盤: 舞踏会の最中、水源を操る巨大な陰謀が露呈する。豪華絢爛なドレスの下に隠された短剣と、宝石に秘められた呪いが、人々の愛と欲望を暴いていく。'
- '終盤: オアシスが枯渇の危機に瀕し、街は混沌に陥る。陰謀の黒幕を巡る駆け引きが、月明かりの下の舞踏会でクライマックスを迎える。'
- '結末: 犠牲を払いながらも、新たな秩序のもとで街は再生へと歩み出す。残された者たちは、砂塵の中で失われた愛と栄華の記憶を胸に、新たな夜明けを待つ。'
style_notes: 衣装の素材感（シルク、ベルベット、レース）や宝石の輝き、舞踏会の喧騒と香りを、装飾的かつ優雅な語彙を用いて極めて詳細に描写すること。情景描写は、まるで絵画を眺めるような耽美的なトーンを維持し、登場人物の心理は、優雅な動作や視線の動きを通じて間接的に、かつ情緒豊かに表現する。
