- name: 如月 海也
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身でしなやかな肢体を持つが、かつての鋭さは消え、どこか儚げな佇まい。右足首に古い手術痕がある。
  personality: 内省的で慎重。喪失感から感情を抑制している。一人称は「僕」。
  speech_style: 静かで控えめ。言葉を選ぶようにゆっくりと話す。
  background: 大学まで陸上競技（400m）の有望株だったが、致命的な足の故障で挫折。失踪した父への複雑な思いを抱え、逃げるように故郷の島に戻った。
  motivation: 身体的な恐怖を乗り越え、止まった時間を動かすための「自分なりの走り方」を見つけること。
  relationships:
  - name: 七瀬 澪
    relation: 幼馴染であり、再起を促す理解者
  - name: 如月 真司
    relation: 失踪した父。憧憬と憎しみが混在する対象
  arc: 「過去の栄光」への執着を捨て、不完全な今の自分を受け入れ、新しい一歩を踏み出す。
- name: 七瀬 澪
  role: 相棒
  age: 21
  gender: 女性
  appearance: 日焼けした肌と短い髪。活動的な服装に身を包み、常に海風に吹かれているような快活な印象。
  personality: 率直で情熱的。他人の痛みに敏感だが、あえて突き放す強さを持つ。一人称は「私」。
  speech_style: ハキハキとしており、時折地方特有の緩い口調が混じる。
  background: 地元のダイビングショップの娘。海への深い知識を持ち、海也の父が追い求めていた海底遺跡の噂を今も大切に信じている。
  motivation: 海也が再び前を向いて走る姿を見ること。島の記憶を次世代に繋ぐこと。
  relationships:
  - name: 如月 海也
    relation: 幼馴染。彼の孤独を誰よりも理解している
  - name: 海崎 五郎
    relation: 近所のおじさん的な関係
  arc: 海也をサポートする中で、自分自身の「守りたいもの」に対する覚悟を強める。
- name: 如月 真司
  role: 物語の核（回想・記憶）
  age: 45
  gender: 男性
  appearance: 知的で鋭い眼差し。常に使い古されたフィールドノートを携え、潮風に焼けた顔に深い笑い皺がある。
  personality: 好奇心旺盛で、一度決めたことは曲げない情熱家。一人称は「私」。
  speech_style: 論理的だが、未知のものについて語る時は少年のような熱を帯びる。
  background: 海洋考古学者。島の周辺に眠る伝説の海底遺跡の調査に没頭し、ある調査航海中に消息を絶った。
  motivation: 物理的な距離を超え、歴史の深淵に眠る真実を解き明かすこと。
  relationships:
  - name: 如月 海也
    relation: 息子。愛情はあったが、研究への情熱が優先されていた
  arc: 遺した資料や潜水具を通じて、海也に「限界に挑む意味」を間接的に伝える。
- name: 海崎 五郎
  role: 脇役（メンター）
  age: 68
  gender: 男性
  appearance: 白髪混じりの短髪に、深い皺が刻まれた顔。常に古いシャツを纏い、煙草の香りが漂う。
  personality: ぶっきらぼうだが、根は優しい。現実主義者。一人称は「俺」。
  speech_style: 短文でぶっきらぼう。核心を突く皮肉を言うことが多い。
  background: 元・町の医師で、現在は引退して隠居生活。海也の足の状態を把握しており、真司の危うい情熱を間近で見ていた。
  motivation: 海也が無理をして身体を壊さず、精神的な充足を得る道を見つけること。
  relationships:
  - name: 如月 海也
    relation: 主治医のような存在。厳しくも温かく見守る
  - name: 如月 真司
    relation: 旧友であり、危うさを危惧していた相手
  arc: 海也の葛藤を見守り、彼が「走ること」の意味を書き換える過程を肯定する。
