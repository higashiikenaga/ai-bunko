title: 残響の400メートル：潮騒と砂の記憶
genre: ヒューマンドラマ
tone: 孤独で内省的、静かな情熱と身体感覚の描写
pov: 一人称（私）
tense: 過去形
setting: 現代、地方の沿岸部にある小島と、その周辺の海岸線
premise: かつて陸上競技の有望株だった私は、足の故障を機に走ることをやめ、静かな海辺の町で暮らしている。ある日、地元の夏祭りの夜、波打ち際で偶然見つけた古い潜水用のヘルメットが、私の止まった時間を動かし始める。それは、かつて海底遺跡の調査に没頭していた父が残した、海に沈んだ記憶の欠片だった。私は再び、自分の身体を駆動させるための「距離」を探し始める。
themes:
- 挫折からの再生
- 肉体と記憶の繋がり
- 喪失の受容
rules:
- 主人公の身体能力は怪我の影響でかつてのピークではない
- 海辺の町の祭りは一年に一度、特定の月の満ち欠けに合わせて開催される
- 海底遺跡の存在は伝説ではなく、地質学的な事実として物語に組み込まれる
plot_outline:
- '序盤: 故障した右足の鈍い痛みを感じながら、海岸線を散歩する日常。夏祭りの喧騒から逃れるように、夜の砂浜を歩いていると、波に洗われた古い潜水具の破片を見つける。'
- '中盤: 父が研究していた海底遺跡の資料を整理する中で、父がなぜ海に没頭し、そして消えたのかを知る。身体を動かすことへの恐怖と、再び走りたいという衝動の間で葛藤し、夜の砂浜を走る練習を始める。'
- '終盤: 祭りの最終夜、激しい波が押し寄せる中で、私は父が夢見た海底の景色を想像しながら、限界を超えた距離を走り抜ける。砂の上でのトレーニングで鍛えられた、肺を焼くような感覚と、一歩ごとの接地感。'
- '結末: タイムはかつてのような輝きはないが、自分の足で着地しているという確かな手応えを得る。海を見つめ、私は再び、新しい距離を刻むために走り出す。'
style_notes: 「心拍数160、肺が酸素を拒絶する」「400メートルのトラックではなく、砂の感触を、潮風の粘度を」といった、数値や身体感覚に徹底的にこだわった描写を行う。内省的な独白を多用し、風景描写と主人公の心理状態を同期させる。詩的でありながら、肉体の痛みや重さを忘れない硬質な文体。
