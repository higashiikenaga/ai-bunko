- name: 八五郎
  role: 主人公
  age: 22
  gender: 男性
  appearance: 浅黒い肌に引き締まった体格。常に作業着を纏い、手は職人らしく硬い。快活な目つきをしている。
  personality: 猪突猛進で真っ直ぐ。少し血気盛んだが、困っている人を放っておけない義理堅さを持つ。一人称は「俺」。
  speech_style: 江戸っ子らしい威勢の良い、べらんめえ調。
  background: 日本橋の腕の良い大工の弟子。熊さんには厳しくも温かく育てられ、彼を親代わりのように慕っていた。
  motivation: 熊さんの不可解な遺言の謎を解き明かし、彼が守ろうとした長屋の平穏を取り戻すこと。
  relationships:
  - name: お節
    relation: 口喧嘩ばかりしているが、最も信頼している相棒
  - name: 熊さん
    relation: 亡き師であり、尊敬する恩人
  arc: 自分の技術や仕事にしか興味がなかった未熟な職人が、遺言を追う中で「人の心」と「繋がること」の価値を知る。
- name: お節
  role: 相棒
  age: 24
  gender: 女性
  appearance: 切れ長の瞳が印象的な、凛とした佇まい。小柄だが、動きやすく着崩した着物姿が粋。
  personality: 口が悪く毒舌だが、非常に観察力に優れ、誰よりも情に厚い。一人称は「あたし」。
  speech_style: 歯に衣着せぬ物言いで、相手の痛いところを突くような話し方。
  background: 長屋の隣で小さな呉服屋を営む娘。熊さんが密かに行っていた長屋の面倒見を、一番近くで見ていた。
  motivation: 熊さんの遺言が単なる悪ふざけではなく、長屋の人々への愛であることを証明すること。
  relationships:
  - name: 八五郎
    relation: 手のかかる弟分であり、共に遺言を遂行するパートナー
  - name: 熊さん
    relation: 長屋の頼もしい顔として慕っていた人物
  arc: 長屋の出来事をどこか冷めた目で見守る傍観者だったが、遺言を通じて自らも長屋の絆を築く中心へと変わっていく。
- name: 源蔵
  role: 敵役（後に協力者）
  age: 35
  gender: 男性
  appearance: 鋭い目つきと、頬に古い傷跡がある。がっしりとした体格で、威圧感がある。
  personality: 粗暴で疑り深く、他人に心を開かない。過去の自分を恥じている。一人称は「俺」。
  speech_style: 低く、威圧感のあるぶっきらぼうな話し方。
  background: かつては街の不良だったが、熊さんに救われた過去を持つ。現在は用心棒のような仕事をしている。
  motivation: 熊さんの遺言が自分を縛るものだと感じ、当初は遺言の遂行を邪魔しようとする。
  relationships:
  - name: 熊さん
    relation: 命の恩人でありながら、直視できない複雑な相手
  - name: 八五郎
    relation: 鼻持ちならない若造
  arc: 熊さんへの恩義と自分自身の過去の間で葛藤していたが、遺言の真意を知ることで再び誰かのために動く勇気を取り戻す。
- name: 菊乃
  role: 脇役
  age: 28
  gender: 女性
  appearance: 柔和な顔立ちで、いつも清潔な割烹着を身につけている。温かみのある雰囲気。
  personality: おっとりしているが、芯が強く、長屋の揉め事をなだめるまとめ役。一人称は「私」。
  speech_style: 穏やかで丁寧な、聞き心地の良い江戸言葉。
  background: 長屋の隅で小さな飯屋を営む未亡人。長屋の住人全員の健康を気にかけている。
  motivation: 長屋の人々が争いなく、笑顔で祭りを迎えられるようにすること。
  relationships:
  - name: 八五郎
    relation: 世話の焼ける、可愛らしい弟分
  - name: お節
    relation: 悩みを聞いてあげる相談相手
  arc: 困った時にだけ動く受動的な立場から、祭りの準備を通じて長屋の結束を導く精神的な支柱となる。
