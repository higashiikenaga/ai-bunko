title: 長屋の灯火と、お節介な遺言
genre: 歴史・時代小説
tone: 江戸の活気あふれる人情味と、べらんめえ調の軽快な雰囲気
pov: 三人称
tense: 過去形
setting: 江戸時代後期、日本橋近辺の賑やかな長屋
premise: 長屋の頑固親父・熊さんが遺したのは、金一文ない「お節介な遺言書」だった。そこに記されていたのは、隣人たちへの奇妙な「お願い事」の数々。若き職人の八五郎と口の悪いお節が、喧嘩しながらもその遺言を遂行していくうちに、熊さんが隠していた深い情愛と長屋の絆が明らかになる。
themes:
- 隣人愛
- 形のない遺産
rules:
- 江戸時代の階級制度と商習慣を遵守する
- 長屋という狭いコミュニティ内の相互扶助関係を基調とする
plot_outline:
- '序盤: 長屋の中心人物だった熊さんが急逝し、残されたのは「もらった物を返せ」という不可解な遺言書だった。'
- '中盤: 遺言に従い、八五郎たちがかつて熊さんが密かに助けていた人々を訪ね歩く。秋刀魚や栗などの秋の味覚を囲みながら、熊さんの意外な過去と優しさが語られる。'
- '終盤: 祭りの夜、最後の遺言である「長屋全員で最高の祭りを」を実現させるため、喧嘩ばかりの住人たちが一丸となって準備に奔走する。'
- '結末: 遺言の真意が「金ではなく、互いに助け合える関係こそが財産である」ということだったと気づき、涙と笑いの中で長屋の絆が深まり、心温まる大団円を迎える。'
style_notes: 「てやんでぇ」「べらぼうめ」などの江戸言葉を多用し、テンポの良い会話劇にする。季節の行事や食文化を詳細に描き、最終的に人情の機微で読者の心を打つ構成にする。
