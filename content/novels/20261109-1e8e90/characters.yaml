- name: 瀬戸 栞奈
  role: 主人公
  age: 28
  gender: 女性
  appearance: 柔らかな栗色のセミロングヘア、眼鏡、落ち着いた色合いのエプロン。穏やかな表情をしている。
  personality: 物静かで観察眼が鋭い。他人の感情に寄り添う優しさを持つ。一人称は「私」。
  speech_style: 丁寧で、相手を急かさない穏やかな話し方。
  background: 祖父から受け継いだ古本屋「陽だまりの栞」を営む。本を通じて人の想いに触れることを大切にしている。
  motivation: 依頼人の願いを叶えるため、本と時計に隠された手がかりを辿る。
  relationships:
  - name: 望月 誠一郎
    relation: 依頼人
  - name: 橘 結衣
    relation: 友人・常連客
  arc: 傍観者として本を眺める日々から、自ら物語に飛び込み、人の心を動かす経験を得る。
- name: 望月 誠一郎
  role: 依頼人
  age: 75
  gender: 男性
  appearance: 品のあるカーディガンを羽織った、優しげな老紳士。少し背が丸まっている。
  personality: 誠実で思慮深いが、心の奥底に拭いきれない後悔を抱えている。一人称は「私」。
  speech_style: ゆっくりとした、落ち着いた敬語。
  background: 元教員。学生時代に親友と交わした「約束」が、時計が止まったあの日からずっと胸に刺さっている。
  motivation: 壊れた懐中時計の持ち主である親友を探し出し、止まった時間を動かすこと。
  relationships:
  - name: 佐伯 健二
    relation: かつての親友
  - name: 瀬戸 栞奈
    relation: 依頼人
  arc: 過去の停滞した時間から脱却し、再会を通じて心の平穏を取り戻す。
- name: 佐伯 健二
  role: 鍵を握る人物
  age: 75
  gender: 男性
  appearance: 日焼けした肌と、温かみのある笑みを湛えた、活動的な印象の老人。
  personality: 自由奔放で情熱的。一度決めたことは曲げない義理堅さを持つ。一人称は「俺」。
  speech_style: 快活で、飾り気のない温かい話し方。
  background: かつては旅を愛し、砂漠の旅書に心を奪われた青年だった。現在は町の片隅で静かに暮らしている。
  motivation: 待ち続けていた約束の相手との再会。
  relationships:
  - name: 望月 誠一郎
    relation: かつての親友
  arc: 長年の誤解が解けることで、過去の記憶を「後悔」から「美しい思い出」へと変える。
- name: 橘 結衣
  role: 脇役（協力者）
  age: 32
  gender: 女性
  appearance: 明るい表情と、動きやすいカジュアルな服装。いつも手帳を携帯している。
  personality: 好奇心旺盛で社交的。町の歴史や噂話に詳しい、世話焼きな性格。一人称は「私」。
  speech_style: はきはきとした、親しみやすい口調。
  background: 喫茶店「オアシス」の店主。古本屋の常連であり、町のネットワークを持っている。
  motivation: 栞奈の手伝いを通じて、町の古い記憶や物語を繋ぎ合わせること。
  relationships:
  - name: 瀬戸 栞奈
    relation: 友人
  - name: 望月 誠一郎
    relation: 客
  arc: 人々の想いが町の風景の中に息づいていることを再発見する。
