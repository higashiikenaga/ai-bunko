- name: エリアン・ソーン
  role: 主人公
  age: 19
  gender: 中性
  appearance: 透き通るように白い肌と、銀色の瞳を持つ。呼吸するたびに胸の奥で微かに硝子が擦れるような音が鳴る。古びた外套を纏っている。
  personality: 内向的で思索的。喪失感を抱えており、静寂を好む。一人称は「私」。
  speech_style: 丁寧だが、どこか遠い場所を見ているような儚げな口調。
  background: 自分がどこから来たのか、なぜこの世界に迷い込んだのかという記憶を失っている。ただ、胸の中に空洞のような欠落感を抱えていた。
  motivation: 世界に存在しないはずの「ある音」を探し出し、自分という存在の意味を確かめること。
  relationships:
  - name: ライラ・ミラーヴェイル
    relation: 鏡の向こう側から導いてくれる不可思議な案内人
  - name: 時刻守ヴァレリウス
    relation: 世界の理を維持しようとする対立者
  arc: 欠落を埋めるために旅を始めるが、最終的に自分自身が世界の欠落を埋めるための「部品」であったことを受け入れ、自己犠牲による昇華に至る。
- name: ライラ・ミラーヴェイル
  role: 相棒/ガイド
  age: 17
  gender: 女性
  appearance: 鏡の破片を縫い合わせたような煌めくドレスを纏う。実体を持たず、鏡面や水面にしか姿を映さない。
  personality: 奔放で好奇心旺盛。残酷な真実を冗談めかして語る傾向がある。一人称は「私」。
  speech_style: いたずらっぽく、相手を試すような含みを持たせた話し方。
  background: かつて時計塔の祭りに溶け込み、個としての意識を失いかけた「記憶の残滓」。エリアンの呼吸が世界を揺らしていることに気づき、彼に興味を持つ。
  motivation: 止まったままの時計を再び動かし、自分という不完全な存在を終わらせたい。
  relationships:
  - name: エリアン・ソーン
    relation: 唯一、自分を認識し、鏡の外側へと連れ出してくれる希望
  arc: エリアンへの情愛に似た感情を抱くようになるが、彼が供物となる運命を誰よりも早く悟り、静かに彼を後押しする。
- name: 時刻守ヴァレリウス
  role: 敵役/監視者
  age: 500
  gender: 男性
  appearance: 全身を重厚な歯車の鎧で覆った巨漢。顔の部分は巨大な時計の文字盤になっており、針が感情に合わせて回転する。
  personality: 厳格で保守的。秩序を至上とし、変化を極端に嫌う。一人称は「我」。
  speech_style: 威圧的で古風な言い回し。秒針が刻むような規則正しいリズムで話す。
  background: 「刻の揺り籠」の管理を任された元・時計職人。世界の崩壊を防ぐため、あえて時間を止め、永遠の祭りの夜を維持し続けている。
  motivation: 世界の理を壊そうとするエリアンを排除し、静止した楽園を永劫に維持すること。
  relationships:
  - name: エリアン・ソーン
    relation: 世界の調和を乱す不純物であり、同時に唯一の代替品（供物）
  arc: 絶対的な正義を信じてエリアンを追い詰めるが、彼がもたらした「鼓動」によって、止まった時間こそが最大の停滞（死）であったことに気づかされる。
- name: セラフィナ
  role: 脇役/鍵となる人物
  age: 20
  gender: 女性
  appearance: 地下図書館の書物の中にだけ存在する、淡いインク色の少女。触れると文字となって霧散する。
  personality: 慈愛に満ち、寂しがり屋。失われた「昨日」の記憶を司っている。一人称は「私」。
  speech_style: 囁くような、心地よくも悲しい声音。
  background: 数百年前に時計塔の理に抗い、自らの記憶を本に書き写して世界に遺した元・司書。
  motivation: いつか訪れる「音」を持つ者に、真実の記憶を伝え、時計塔に終止符を打ってもらうこと。
  relationships:
  - name: エリアン・ソーン
    relation: 自身の遺志を継ぎ、世界の心臓となる運命の青年
  arc: エリアンに自身の記憶を譲り渡すことで、彼に世界の残酷な真実と、それを受け入れるための精神的強さを与え、完全に消滅する。
