title: 硝子の肺と、秒針の葬列
genre: 異世界ファンタジー
tone: 幻想的で不条理、退廃的な美しさ
pov: 一人称
tense: 過去形
setting: 時計の歯車が空を覆い、時間の流れが物理的な質量を持つ「刻の揺り籠」と呼ばれる浮遊大陸
premise: 私は、存在しないはずの音を探して、永遠に止まったままの時計塔へと足を踏み入れた。そこでは祭りの夜が数百年繰り返され、人々は狂った秒針の刻むリズムに合わせて踊り続けている。地下図書館に眠る、失われた「昨日」を記した書物を手に入れるために、私は鏡の中に広がる迷宮を彷徨うことになる。やがて、私が呼吸するたびに、世界の理が少しずつ軋みを上げて崩壊していくことに気づくのだ。
themes:
- 時間の主観性
- 忘却による救済と喪失
rules:
- 鏡に映る像は、現実の人間よりも数秒遅れて動き、本心を語る
- 地下図書館の書物は、読んだ者の記憶を燃料として文字を紡ぐ
- 祭りの夜の間だけ、扉は「開くべきではない場所」へと繋がる
plot_outline:
- '序盤: 止まった時計塔の麓で、狂った祭りの夜に巻き込まれた主人公。鏡の向こう側にだけ見える「声」に導かれ、地下図書館への入り口となる巨大な扉を見つける。'
- '中盤: 地下図書館の深部で、過去の記憶が文字となって漂う光景を目にする。本を読み進めるほどに、主人公自身の記憶が削られ、現実と夢の境界が曖昧になっていく。'
- '終末: 自分が探していた「音」の正体が、自分自身の心臓が刻む鼓動の残響であったと知る。世界の歯車を回すための供物として、自分が選ばれる運命を悟る。'
- '結末: 鏡の破片が降り注ぐ中、主人公は永遠の祭りの夜へと溶け込んでいく。時計の針が再び動き出したとき、そこには誰もいない、静寂だけが支配する美しい廃墟が残されていた。'
style_notes: 一人称の語りにおいて、論理的な思考が徐々に崩壊し、比喩が肥大化していく様子を描く。鏡、時計、扉のモチーフを、単なる小道具ではなく、世界の法則を象徴する不条理な存在として繰り返し登場させる。色彩や音の描写は、夢幻的で、どこか冷ややかな質感を持たせること。
