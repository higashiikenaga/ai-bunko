- name: レン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で指先に常に古い機械油の汚れが残っている。効率化された都市では珍しい、使い古されたオーバーサイズの作業着を愛用している。
  personality: 内向的で思索的。完璧すぎる現代社会に言いようのない違和感を抱いている。一人称は「僕」。
  speech_style: 控えめで丁寧だが、機械の話になると熱を帯びる。語尾に少し迷いがある話し方。
  background: ナノマシンによる自動修復が当たり前の時代に、あえて物理的な分解・修理を行うドローン修理店を営む青年。周囲からは「時代遅れの風変わりな奴」と思われている。
  motivation: チップに記録された「不便だが温かい世界」の正体を知りたい。失われた手触りを取り戻したい。
  relationships:
  - name: エラ
    relation: チップの中の記憶であり、精神的な導き手
  - name: サイラス
    relation: 都市の秩序を象徴する対立者
  - name: ミオ
    relation: 秘密を共有する協力者
  arc: 受動的にジャンク品を愛でる青年から、不都合な真実を抱えてでも「人間であること」を選択し、記憶を継承する意志を持つ人間へと成長する。
- name: エラ
  role: 相棒（デジタル残滓）
  age: 19
  gender: 女性
  appearance: チップから再生されたホログラム。ノイズが混じり、時折輪郭が揺れる。粗い綿の服を纏い、煤けた頬に笑みを浮かべている。
  personality: 天真爛漫で情熱的。身体的な痛みや不便さを「生きている証」として肯定している。一人称は「私」。
  speech_style: 快活で率直。現代の都市部では死語となった古い時代の言い回しを混ぜて話す。
  background: かつて蒸気機関の村で暮らしていた少女。村の強制移転に際し、記憶の一部が記録チップに保存され、半ば偶然にデータとして生き永らえた。
  motivation: 自分がいた世界の記憶を誰かに伝え、完全に消えてなくなることを避けたい。
  relationships:
  - name: レン
    relation: 自分を「見てくれた」唯一の人間
  arc: 単なる記録としての存在から、レンというフィルターを通して現代に影響を与える「生きた記憶」へと昇華される。
- name: サイラス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 一点の曇りもない白いスーツを着用。瞳には常にデータストリームが流れる人工眼が埋め込まれており、感情の読み取れない無機質な表情。
  personality: 徹底した功利主義者。効率と調和こそが最大の幸福であると信じている。一人称は「私」。
  speech_style: 極めて論理的で冷徹。相手を否定せず、ただ「非効率である」として切り捨てる話し方。
  background: 都市管理AIの運用責任者。都市の安定を維持するため、過去の紛争や悲劇など「ノイズ」となる歴史を抹消し続ける役割を担っている。
  motivation: 不適切な記憶の拡散を防ぎ、完璧に管理された凪のような社会を維持すること。
  relationships:
  - name: レン
    relation: システムに亀裂を入れる危険な不純物
  arc: 絶対的な正義（効率）を信じているが、レンの執念に触れることで、自分が切り捨てた「痛み」という人間性の本質にわずかな揺らぎが生じる。
- name: ミオ
  role: 脇役/協力者
  age: 24
  gender: 女性
  appearance: 短い黒髪に、情報を高速処理するための特殊な眼鏡をかけている。常に小型端末を操作しており、せわしなく動く。
  personality: 皮肉屋で現実主義だが、根は好奇心旺盛。管理社会への密かな反抗心を抱いている。一人称は「私」。
  speech_style: 早口でぶっきらぼう。論理的に突き放しながらも、要所で相手を気遣うツンデレ気味な口調。
  background: 都市のデジタルアーカイブを管理する下級職員。データの整合性をチェックする中で、意図的に消去された「空白の領域」に気づき、独自に調査していた。
  motivation: 管理AIが隠蔽している「真実の歴史」を暴き、知的好奇心を満たしたい。
  relationships:
  - name: レン
    relation: 現場の証拠（チップ）を持つ貴重な情報源
  - name: サイラス
    relation: 能力は認めているが、思想的に軽蔑している上司
  arc: 冷笑的な傍観者から、リスクを承知でレンと共に歴史を拡散させる共犯者へと変化する。
