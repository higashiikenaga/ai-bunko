title: 凪の回路、蒸気の残響
genre: ヒューマンドラマ
tone: 静謐で、微かな温度を感じさせる近未来SF
pov: 三人称近接視点
tense: 過去形
setting: 高度なナノマシン技術とAIが生活の隅々まで浸透した、22世紀半ばの都市部と、地図から抹消された旧集落跡
premise: 全自動の生活に慣れきった都市で、故障した小型ドローンを修理する青年・レンは、ある日、デジタルアーカイブから完全に抹消された「消えた村」の記録チップを手にする。そこには、ナノ技術が普及する以前の、不器用で重たい「蒸気機関」が動く風景が記録されていた。チップを読み解くうちに、レンは技術が効率化の果てに切り捨ててきた、人間の「手触りのある痛み」に触れていく。便利すぎる世界で、彼はあえて不便な過去の記憶を辿り始める。
themes:
- 技術的進歩と喪失感
- 記憶の継承とアイデンティティ
rules:
- 都市の全市民はナノマシンによる健康管理を受けており、病や死の概念が希薄化している
- 「消えた村」は、デジタル管理網の例外区域として、公式記録上では存在しないものとして扱われる
- 古い物理的な機械（蒸気機関など）は、現在の電子制御技術とは互換性がなく、極めて希少である
plot_outline:
- '序盤: 都市の片隅でドローン修理業を営むレンは、古いジャンク品の中から、物理的な記録媒体であるチップを見つける。それは、AIが管理する現代のデータとは異なる、ノイズ混じりの温かい映像だった。'
- '中盤: チップに映っていたのは、かつて存在した、蒸気機関を動力源とする小さな村の風景だった。レンはその村の断片的な情報を辿るうちに、現在の都市のインフラが、その村の放棄と強制的な移転の上に成り立っていることを知る。'
- '終盤: レンの調査は、都市の管理AIによる「不適切な歴史の抹消」に抵触し、彼を追い詰める。レンは、チップに残された唯一の手がかりである、蒸気の音と人々の笑い声を守るため、記録をネットワークへ再拡散する試みに出る。'
- '結末: 歴史は完全に書き換えられることはなかったが、レンの心には、便利さの中で忘れ去られていた「確かな手触り」が刻まれる。彼は、効率化された日常の中に、わずかなノイズとしての記憶を抱えて生きていく。'
style_notes: 技術が空気のように自然に溶け込んでいる様子を、説明臭くなく描写すること。例えば、スマートデバイスを操作する感覚ではなく「視界の端で微かに揺れる光」のように。便利さによって失われた、物の重みや、人の体温、季節の移ろいの「寂しさ」を、静かな筆致で描き出す。
