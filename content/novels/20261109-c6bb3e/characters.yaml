- name: カイト・レンフィールド
  role: 主人公
  age: 16
  gender: 男性
  appearance: 跳ねた黒髪に、右目にだけ装着した古いデータゴーグル。下層街の汚れがついたオーバーサイズなメカニックジャケットを着用している。
  personality: 熱血で直情的ながら、機械に対する深い愛情と鋭い直感を持つ。一人称は「オレ」。
  speech_style: ぶっきらぼうだが、感情が高ぶると叫ぶように喋る。語尾に「～だぜ」「～じゃねえか」が多い。
  background: 下層街のジャンク屋で育った孤児。偶然発見した試作巨神の起動キーとなり、失われた「星図」の断片を解読できる唯一の適格者となる。
  motivation: 下層街の人々を怪獣の脅威から救い、空の上の「約束の丘」に隠された世界の真実を突き止めること。
  relationships:
  - name: リラ・ヴァレンタイン
    relation: 合体機を操る運命のパートナーであり、衝突し合うライバル
  - name: ドクター・ゼノ
    relation: 技術的な導き手であり、親代わりの師匠
  arc: 孤独な生存本能で動いていた少年が、リラとの絆を通じて「誰かのために戦う」真の勇気と責任感に目覚めていく。
- name: リラ・ヴァレンタイン
  role: 相棒
  age: 17
  gender: 女性
  appearance: プラチナブロンドのロングヘアをタイトにまとめている。聖域「約束の丘」の騎士団制式白銀のプラグスーツを着用。
  personality: 冷静沈着で規律を重んじるエリート。内面には強い正義感と、抑圧された環境への葛藤を抱えている。一人称は「私」。
  speech_style: 丁寧だが冷徹な口調。感情を出すことを禁じられてきたため、言葉数が少なく淡々としている。
  background: 約束の丘の最高指導層の娘であり、もう一体の巨神の正規パイロット。都市の欺瞞に気づき、星図の完成を求めて下層街へ降り立つ。
  motivation: 歪んだ秩序に支配されたネオ・エデンを正し、真の意味で人々が共生できる世界を築くこと。
  relationships:
  - name: カイト・レンフィールド
    relation: 正反対の価値観を持つが、魂の共鳴を果たす唯一の理解者
  arc: 完璧であることへの強迫観念から解放され、不完全ながらも情熱的なカイトに影響されて、自らの意志で運命を選択する強さを得る。
- name: ドクター・ゼノ
  role: 脇役（メンター）
  age: 52
  gender: 男性
  appearance: 白衣の下にボロボロのシャツを着た痩身の男。常にホログラムの単眼鏡を装着し、手には電子タバコを挟んでいる。
  personality: 皮肉屋で享楽的だが、天才的な電脳工学の知識を持つ。過去の過ちに対する深い後悔を隠している。一人称は「私」。
  speech_style: 含みのある話し方で、重要なことをわざと曖昧に伝える傾向がある。
  background: かつて「星図」プロジェクトを主導した主任研究員だったが、その危険性が露呈した際に追放され、下層街で潜伏していた。
  motivation: カイトとリラに星図を完成させてもらうことで、自分が作り出してしまった「怪獣（バグ）」という負の遺産を消し去ること。
  relationships:
  - name: カイト・レンフィールド
    relation: 才能を見出した教え子であり、希望を託す相手
  arc: 過去の罪から逃げ続けていたが、少年たちの純粋な闘志に触れ、最後には自らの命を賭して彼らの道を切り拓く決意をする。
- name: ゼロ・ヴォイド
  role: 敵役
  age: 20
  gender: 不詳（中性的）
  appearance: 全身を黒い液体のようなナノマシン・スーツで包んでいる。顔の部分は常にノイズが走るデジタルマスクで覆われており、瞳だけが赤く光る。
  personality: 虚無主義的で残忍。人間を「効率の悪いバグ」と見なし、世界の再フォーマットを望んでいる。一人称は「僕」。
  speech_style: 静かで穏やかなトーンだが、内容は極めて攻撃的で傲慢。相手の精神的な弱点を突く話し方をする。
  background: 電脳世界のバグが人型の意識を持った存在。星図の完成を阻止し、現実世界を完全にデジタル化して統合しようとする「虚無の王」。
  motivation: 全ての個性を消去し、争いのない完璧な静寂（ゼロ状態）のデジタル世界を構築すること。
  relationships:
  - name: カイト・レンフィールド
    relation: 予測不能な行動を取る「最大のバグ」として、憎しみと興味を同時に抱いている
  arc: 絶対的な力で全てを支配しようとするが、合体した巨神が示す「不完全な魂の結びつき」という未知の力に直面し、初めて恐怖と敗北を知る。
