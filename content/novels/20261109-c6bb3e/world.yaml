title: 鋼鉄咆哮！スターチャート・レボリューション
genre: サイバーパンク
tone: 熱血、爆発的、壮大
pov: 三人称
tense: 過去形
setting: 摩天楼が電子の雲を突く巨大電脳都市ネオ・エデン。都市の最上層に位置する聖域「約束の丘」と、怪獣が跋扈する混沌とした下層街。
premise: 電脳世界のバグが巨大な怪獣となって実体化し、人類を蹂躙する暗黒の近未来！少年カイトは、伝説の航路「星図」を解読し、二体の巨神を合体させる唯一のパイロットとなる！約束の丘を舞台に、鋼鉄の鼓動と魂の叫びが、絶望の闇を打ち砕く！
themes:
- 魂の共鳴
- 絆による進化
rules:
- 怪獣は電脳空間のバグが物理実体化した存在である
- 二体の巨神は「星図」に基づく精神同調（シンクロ）が一致した時のみ合体できる
- パイロットの情熱が機の限界出力を引き上げる
plot_outline:
- '序盤: 都市を襲う巨大怪獣に対し、少年カイトが試作機を起動。初陣の激闘と、機体に宿る意志との出会い。'
- '中盤: 星図の断片を求め、サイバー空間と現実を股にかけた死闘。相棒となるもう一機の巨神との邂逅。'
- '終盤: 敵の総攻撃により約束の丘が崩壊の危機に。星図が完成し、究極の合体「スターチャート・フォーメーション」が発動！'
- '結末: 必殺技「ギャラクシー・バースト・ストライク」が闇を粉砕し、新時代の夜明けを呼び戻す！'
style_notes: 合体シーン、必殺技シーンは、金属の軋み、火花、エネルギーの奔流を、読み手の魂が震えるほど大げさに描写せよ！必殺技の名称は、天を割るような叫びと共に、凄まじい熱量で刻み込め！！
