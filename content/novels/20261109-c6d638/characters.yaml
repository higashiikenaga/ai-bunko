- name: カイ・スカイランダー
  role: 主人公
  age: 15
  gender: 男性
  appearance: 風になびく癖のある茶髪、使い古された飛行士のゴーグル、音の断片を収集するための特殊な聴診器型デバイスを腰に下げている。
  personality: 猪突猛進で直情的だが、音に対しては非常に繊細な感性を持つ。一人称は「俺」。
  speech_style: 短文で勢いがあり、活気にあふれた話し方。「行くぞ！」「この音、ただ事じゃないぜ！」
  background: 廃品回収船「スカイ・メロディ号」の操縦士。かつて音楽が溢れていた時代の記憶を、断片的な音から辿ろうとしている。
  motivation: 失われた旋律を全て集め、世界に再び「歌」を取り戻すこと。
  relationships:
  - name: リナ
    relation: 通信を通じて心を通わせる大切なパートナー
  - name: マエストロ
    relation: 技術的な助言をくれる謎の師匠的な存在
  arc: 孤独に音を拾い集める「回収者」から、他者の音を受け入れ、世界を導く「指揮者」へと成長する。
- name: リナ・エコー
  role: 主人公
  age: 14
  gender: 女性
  appearance: 大きなヘッドフォンを常に装着している。星空のような模様のドレスと、アンテナを模した髪飾り。瞳は澄んだ青色。
  personality: 控えめで内向的だが、ラジオの前に立つ時だけは強い意志を見せる。一人称は「私」。
  speech_style: 丁寧で落ち着いているが、放送時は情感豊かで包容力のある声になる。「……聞こえていますか？」「夜明けの旋律をお届けします」
  background: 辺境の浮遊島で、古びたラジオ放送を一人で続けているDJ。静寂の病に侵された人々の孤独を音で癒そうとしている。
  motivation: バラバラになった人々の魂を、音を通じて再び繋ぎ合わせること。
  relationships:
  - name: カイ
    relation: 空から届く音を世界へ届けるための、唯一無二の協力者
  arc: 孤独に震えていた少女から、世界中の不協和音を肯定し、歌い上げる「伝道師」へと覚醒する。
- name: マエストロ
  role: 脇役/導き手
  age: 40
  gender: 男性
  appearance: 灰色の長いコートを纏い、常に古い指揮棒を持っている。記憶を失っているため、どこか虚ろな眼差しをしている。
  personality: 冷静沈着で哲学的。世界の理（ことわり）を知っているような、浮世離れした雰囲気を持つ。一人称は「私」。
  speech_style: 詩的で静か。言葉の端々に重みがある。「音は、記憶の残響なのです」「調律の時が来ました」
  background: かつて世界を調律していた伝説の調律師。静寂の病に侵された際、自らの記憶と音楽の力を失った。
  motivation: 失った記憶を取り戻し、世界を「最後の調律」へと導くこと。
  relationships:
  - name: カイ
    relation: 失われた旋律を運んでくる、運命の少年
  - name: リナ
    relation: 音を広めるための、希望の拡声器
  arc: 過去の罪や喪失と向き合い、完璧な調和ではなく「不協和音の肯定」こそが真の調律であると理解する。
- name: ニル（静寂の化身）
  role: 敵役
  age: 0
  gender: 不明
  appearance: 音を吸い込む漆黒の霧のような不定形な姿。あるいは、一切の表情を持たない、美しくも空虚な人間の姿をとる。
  personality: 無慈悲で、感情の揺らぎを「ノイズ」として嫌悪する。静寂こそが究極の平穏であると信じている。一人称は「我（われ）」。
  speech_style: 声ではなく、直接脳内に響くような、無機質で冷徹な響き。「争いも悲しみも、無音の中にこそ真の平穏がある」
  background: 世界の不協和音（争いや苦悩）を排除しようとする概念が具現化した存在。
  motivation: 全ての音を消し去り、世界を完璧な無（静寂）に塗り潰すこと。
  relationships:
  - name: カイたち
    relation: 秩序（静寂）を乱す不純なノイズ
  arc: 個々の叫びが混ざり合った「最強の不協和音」に直面し、概念としての静寂を打ち砕かれる。
