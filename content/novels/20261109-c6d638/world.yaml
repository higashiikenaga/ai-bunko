title: 万象のアンサンブル：空を舞う絶唱の旅路
genre: 群像劇
tone: 詩的でリズミカル、幻想的な音色の物語
pov: 三人称
tense: 過去形
setting: 浮遊島が点在し、音楽が物理的な動力となる空の世界「ソナタ・レルム」
premise: 音が消えゆく「静寂の病」に侵された世界で、絶望を歌い上げる人々がいた。空飛ぶ船で失われた旋律を拾い集める少年と、夜明けのラジオで孤独な魂を繋ぐ少女。不協和音を奏でる彼らが、世界を再調律するための「最後の一曲」へと導かれていく。
themes:
- 調和と不協和音
- 孤独の共有
rules:
- 音楽は物理的なエネルギー（共鳴力）として変換され、動力や武器となる
- 特定の周波数を維持することで島を浮遊させることができる
- 静寂の病にかかると、次第に音を失い、最終的に存在自体が透き通って消滅する
plot_outline:
- '序盤: 静寂の病が広がる世界で、記憶を失った調律師と、廃品回収の空飛ぶ船に乗る少年、辺境のラジオDJの少女がそれぞれの孤独を抱えて生活している。'
- '中盤: 少年の船が「伝説の楽譜」の断片を回収し、少女のラジオを通じてその旋律が世界に響き渡ると、消えかけていた島々が再び歌い始める。'
- '終盤: 静寂の化身が世界を完全な無音に塗り潰そうと襲来する。人々はバラバラな旋律を歌いながらも、次第に一つの巨大なアンサンブルへと融合していく。'
- '結末: 全ての個性が混ざり合った不協和音こそが、世界を再生させる最強の歌だったと気づき、新しい時代の夜明けを迎える。'
style_notes: 音楽的なリズムを意識した文章。各話に一節の歌詞を挿入し、音色や響きを視覚的に描写する。流麗で幻想的な表現を多用し、読み手にメロディを感じさせる構成とする。
