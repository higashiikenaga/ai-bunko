- name: カイル・ヴァン・デンプ
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常にクマが薄く残る、無表情で整った顔立ち。灰色の制服を着こなしている。
  personality: 冷徹で事務的。感情を抑制することに慣れている。一人称は「僕」。
  speech_style: 簡潔で淡々とした、感情の起伏が乏しい敬語。
  background: ルキドゥスの記憶回収官。幼少期の記憶が欠落しており、それを「不完全な個体」として管理されている。
  motivation: 禁忌の記憶に触れたことで、自身の失われた欠片と、世界の真実を知りたいと願う。
  relationships:
  - name: リナ・エルスター
    relation: 協力者・導き手
  - name: 執行官ゼノス
    relation: 監視者・対立者
  arc: 管理社会の歯車として感情を殺して生きていた男が、痛みや悲しみを含む「真の人間性」を取り戻し、変革者へと成長する。
- name: リナ・エルスター
  role: 相棒（導き手）
  age: 24
  gender: 女性
  appearance: 瞳に強い光を宿した、どこか浮世離れした美しさを持つ女性。地下組織の衣装を纏う。
  personality: 情熱的で、静かな怒りを内に秘めている。一人称は「私」。
  speech_style: 詩的で含みのある、穏やかだが芯の強い話し方。
  background: 地下組織『微睡の会』のリーダー。かつては記憶市場の分析官だったが、システムの矛盾に気づき離脱した。
  motivation: 市民に「眠る権利」と、奪われた記憶を返還すること。
  relationships:
  - name: カイル・ヴァン・デンプ
    relation: 共闘する同志
  arc: 組織を守るための隠遁者から、カイルと共にシステムを破壊する革命の先導者へと変わる。
- name: ゼノス・アシュレイ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない仕立ての軍服に身を包んだ、威圧感のある壮年男性。常に完璧な姿勢を保っている。
  personality: 合理的かつ独善的。秩序こそが人類の幸福であると信じている。一人称は「私」。
  speech_style: 威厳があり、有無を言わせぬ断定的な口調。
  background: ルキドゥスの治安維持部門の最高責任者。都市のシステムを維持するために、不純な感情を徹底的に排除してきた。
  motivation: 都市の完全な覚醒状態を維持し、混沌（睡眠や夢）を根絶すること。
  relationships:
  - name: カイル・ヴァン・デンプ
    relation: 管理対象・排除すべき逸脱者
  arc: 秩序の守護者として、カイルの叛逆を理論と武力で阻もうとするが、最終的にはシステムそのものの崩壊に直面する。
