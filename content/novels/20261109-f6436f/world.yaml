title: 覚醒維持義務と、不純な微睡
genre: SF
tone: 静謐な絶望感と、無機質な管理社会の不気味さ
pov: 三人称
tense: 過去形
setting: 永続的な人工光に照らされ、睡眠が法的に禁じられた都市「ルキドゥス」
premise: この街では、生産性を最大化するため、市民に『覚醒維持義務』が課せられている。精神の飽和を防ぐため、不要な記憶や感情は『記憶市場』で売却し、脳の空き容量を確保することが義務付けられていた。記憶回収官として働く男は、ある日、市場に流れ込んできた「眠ることへの憧憬」という禁忌の記憶に触れてしまう。それは、管理社会の根幹を揺るがす、静かなる叛逆の始まりだった。
themes:
- 忘却による統制
- 人間性の回復としての睡眠
rules:
- '【覚醒維持法】: 1日20時間以上の覚醒を義務付け、睡眠は重罪とされる。'
- '【記憶の換金制度】: 感情的に負荷の高い記憶（悲しみ、愛、懐古）を売却し、生活配給券を得る。'
- '【標語】: 『覚醒は真実、睡眠は裏切り』を街中のディスプレイに常時表示する。'
- '【精神飽和状態】: 記憶を売らずに溜め込んだ者は、精神崩壊を起こし『廃棄処理』される。'
plot_outline:
- '序盤: 主人公の記憶回収官・カイルが、淡々と市民から記憶を徴収し、市場へ回す日常が描かれる。街は不夜城であり、人々は覚醒剤に似た処置を施され、感情を削ぎ落として働いている。'
- '中盤: カイルは、正体不明の人物から「夢を見た記憶」という、理論上存在し得ない記憶パケットを密かに買い取る。その断片的な映像に惹かれた彼は、密かに睡眠を実践する地下組織『微睡の会』の存在を知る。'
- '終盤: カイルは自身の過去の記憶が、権力層によって意図的に売却させられていたことを突き止める。彼は組織を裏切り、市場に蓄積された膨大な「睡眠の記憶」を全市民の脳に同時還流させる計画を立てる。'
- '結末: 大規模なシステムダウンと共に、街の人々が一斉に深い眠りに落ちる。目覚めた彼らが、管理された幸福ではなく、不自由で苦痛に満ちた「個人の記憶」を取り戻し、静かに涙を流す場面で幕を閉じる。'
style_notes: 感情的な形容詞を極力排除し、行政報告書のような乾いた文体で綴る。管理社会の冷徹さを強調するため、建築物の材質や光の波長、規則の条文などの細部を具体的に描写し、その中で行われる「密かに本を読む」「目を閉じる」といった小さな抵抗にのみ、わずかな体温を宿らせる。
