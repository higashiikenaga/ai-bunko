- name: ジュリアン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 氷のように冷ややかな青い瞳と、透き通るような白い肌。常に黒い手袋を着用し、感情を読ませない端正な顔立ち。
  personality: 冷静沈着で完璧主義。孤独を愛し、感情の起伏を極限まで抑えている。一人称は「私」。
  speech_style: 丁寧で淡々とした、温度を感じさせない話し方。
  background: かつて愛する人を失った衝撃から、感情を「記憶の宝石」として切り離すことで、平穏な孤独を保ってきた記憶の剥製師。
  motivation: 完璧な記憶の標本を作り上げること。自身の心の凍結を維持すること。
  relationships:
  - name: エリス
    relation: 静寂を揺らす客
  - name: レン
    relation: かつての恋人
  arc: 完璧な静寂を守る孤独な職人から、痛みと共に生きる強さを見出し、他者を受け入れる人間へと変化する。
- name: エリス
  role: ヒロイン
  age: 26
  gender: 女性
  appearance: 陽だまりのような温かみのある栗色の髪。瞳には深い悲しみが宿っているが、どこか芯の強さを感じさせる。
  personality: 感受性が強く、情に厚い。苦痛から逃れたいと願いながらも、本質的には生命力に溢れている。一人称は「私」。
  speech_style: 穏やかで丁寧だが、時折、抑えきれない切実さが滲み出る話し方。
  background: 避けられない喪失を経験し、その記憶が自分を蝕むことを恐れて、記憶の消去を求めて「氷の城」を訪れた女性。
  motivation: 過去の痛みをすべて消し去り、新しい人生を歩み始めること。
  relationships:
  - name: ジュリアン
    relation: 記憶を託そうとする相手
  - name: 名もなき猫
    relation: 同行者
  arc: 記憶を消すことで救われると信じていたが、痛みも含めて自分自身を受け入れ、共に生きる道を選ぶ。
- name: レン
  role: 脇役
  age: 28
  gender: 男性
  appearance: 柔らかな笑みを浮かべた、春の陽光のような温かい雰囲気を持つ青年。回想の中でのみ鮮明に描かれる。
  personality: 明るく、包容力があり、周囲を照らすような性質。
  speech_style: 優しく、相手の心に寄り添うような穏やかな話し方。
  background: ジュリアンのかつての恋人。不慮の死によって、ジュリアンの心の中に「凍りついた記憶」として残っている。
  motivation: ジュリアンが過去に縛られず、再び世界と繋がることを願う（死後、記憶を通じて）。
  relationships:
  - name: ジュリアン
    relation: かつての恋人
  arc: ジュリアンの心を閉ざした原因であり、最終的に彼の心を解き放つための精神的な鍵となる。
- name: 名もなき猫
  role: 相棒
  age: 不明
  gender: 不明
  appearance: 雪のように真っ白な毛並みに、透き通るような翡翠色の瞳を持つ美しい猫。
  personality: 自由奔放で、どこか神秘的な雰囲気を持つ。時折、人間の心の機微を見透かすような眼差しを見せる。
  speech_style: なし（鳴き声のみ）
  background: エリスと共に氷の城へ迷い込み、静寂に包まれていたジュリアンの日常に変化をもたらす存在。
  motivation: 凍りついた邸宅に「生」の気配を運び込むこと。
  relationships:
  - name: エリス
    relation: 連れ
  - name: ジュリアン
    relation: 新しい家族
  arc: 名前のない孤独な存在から、最後に名前を与えられることで、愛される存在へと変化する。
