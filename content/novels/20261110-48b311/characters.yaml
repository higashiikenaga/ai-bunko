- name: エリアナ・フォン・アストレア
  role: 主人公
  age: 19
  gender: 女性
  appearance: 燃えるような赤毛と、意志の強さを感じさせる紫色の瞳。没落後も気品を失っていないが、どこか影がある。
  personality: 芯が強く聡明。冷静に状況を分析するが、内には熱い情熱を秘めている。一人称：私
  speech_style: 丁寧で教養を感じさせる、洗練された淑女の口調。
  background: 帝国の名門貴族の令嬢だったが、父が政争に巻き込まれ汚名を着せられたことで家を追われ、没落した。
  motivation: 父の冤罪を晴らし、失われた家族の誇りと名誉を取り戻すこと。
  relationships:
  - name: カイエン
    relation: 運命的な恋人であり、孤独を分かち合うパートナー
  - name: マキシミリアン
    relation: 父を陥れた元凶であり、憎むべき敵
  arc: 過去の悲劇に縛られた「被害者」から、自らの意志で運命を切り拓く「開拓者」へと成長する。
- name: カイエン
  role: 相棒/ヒーロー
  age: 24
  gender: 男性
  appearance: 漆黒の髪に切れ長の瞳。東洋の装束をモダンにアレンジした礼服を纏う、儚げで美しい青年。
  personality: 沈着冷静でミステリアス。孤独を愛するが、一度心を開いた相手には極めて献身的。一人称：僕
  speech_style: 静かで詩的な響きを持つ、落ち着いた物静かな話し方。
  background: 極東の国から派遣された特使。その実体は、帝国の動向を監視し、自国の利益を守るための諜報員。
  motivation: 任務の遂行と、仮面の下に隠した真の自己を受け入れてくれる存在を見つけること。
  relationships:
  - name: エリアナ
    relation: 守るべき愛する女性
  arc: 任務と情愛の間で揺れる「傍観者」から、愛のために全てを賭ける「共犯者」へと変化する。
- name: マキシミリアン・フォン・アイゼン
  role: 敵役
  age: 52
  gender: 男性
  appearance: 銀髪を完璧に整え、片眼鏡（モノクル）を着用。隙のない黒の軍服風礼服に身を包む。
  personality: 冷酷非道で野心的。すべてをチェスの駒のように扱い、感情を排して合理的に動く。一人称：私
  speech_style: 威圧的で、相手を支配下に置こうとする高圧的かつ優雅な口調。
  background: 帝国宰相。古い貴族制度を打破し、自らが頂点に立つ近代的な独裁体制を構築しようと画策している。
  motivation: クーデターによる帝国の完全掌握と、自らの権威を脅かす旧勢力の徹底的な排除。
  relationships:
  - name: エリアナ
    relation: 排除すべき旧時代の残滓
  - name: カイエン
    relation: 帝国の秩序を乱す不愉快な不純物
  arc: 完璧な支配を夢見た「策士」が、自らが仕掛けた混乱の炎に呑み込まれる「破滅者」となる。
- name: ルシアン
  role: 脇役/協力者
  age: 22
  gender: 男性
  appearance: 煤けた顔に、蒸気機関の部品をぶら下げた作業服。快活で野性味のある印象。
  personality: 義理堅く、裏社会のルールに精通している。陽気な振る舞いの裏に鋭い観察眼を持つ。一人称：俺
  speech_style: 砕けた、都会的なスラング混じりの話し方。
  background: 近代都市の下層街に住む整備士兼、情報の運び屋。エリアナの潜入を密かに手助けする。
  motivation: 搾取される下層民の生活を守ること、そして退屈な日常を打破すること。
  relationships:
  - name: エリアナ
    relation: 信頼を寄せる協力者
  arc: 街の片隅で生きるだけの「生存者」から、変革の嵐の中で道を指し示す「導き手」へと変わる。
