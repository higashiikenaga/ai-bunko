title: 金糸の檻と、薄紅の幻想曲
genre: 歴史・時代小説
tone: 絢爛豪華で耽美、退廃的な気品に満ちた雰囲気
pov: 三人称
tense: 過去形
setting: 19世紀末、架空の帝国ヴァレリアナ。社交界の頂点である黄金宮殿と、蒸気機関が普及し始めた近代都市。
premise: 没落した名家の令嬢エリアナは、父の汚名をそそぐため、仮面舞踏会が催される帝都へと戻る。そこで彼女が出会ったのは、極東の国から来た謎めいた特使であり、散りゆく桜を愛でる孤独な青年だった。宝石とレースに彩られた贅沢な夜の裏側で、国家を揺るがす恐ろしい陰謀が静かに動き出す。
themes:
- 運命への抗い
- 美しきものの儚さ
- 禁断の恋
rules:
- 社交界の作法（エチケット）の逸脱は、社会的な死を意味する
- 帝国の最高権力者は『深紅の印章』を持つ者のみが決定権を持つ
- 極東の桜は、この地では『死と再生』を象徴する希少な霊花とされる
plot_outline:
- '序盤: 絹と宝石に包まれた豪華絢爛な舞踏会に、エリアナが正体を隠して潜入し、特使カイenと運命的な出会いを果たす。'
- '中盤: 舞踏会の華やかな狂乱の中で、エリアナとカイenは互いの孤独に惹かれ合い、父の冤罪にまつわる宮廷の黒い秘密を共有する。'
- '終盤: 帝国の崩壊を狙うクーデターが勃発し、宮殿は炎に包まれる。エリアナは愛する者と共に、追手から逃れるため国境へ向かう決断をする。'
- '結末: 燃え盛る帝都を背に、夜明けの光の中で出発する『最終列車』に飛び乗る二人。車窓に舞う最後の一片の桜を見つめながら、新たな地での生を誓い合う。'
style_notes: 形容詞を贅沢に使い、ドレスの生地（サテン、ベルベット、チュール）や宝飾品の輝き、香水の香りを詳細に描写すること。舞踏会のシーンでは、音楽のリズムに合わせた緩急のある優雅な文体を徹底し、心理描写には詩的な比喩を多用する。
