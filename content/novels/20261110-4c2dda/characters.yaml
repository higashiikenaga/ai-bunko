- name: 桃瀬 一花
  role: 主人公
  age: 17
  gender: 女性
  appearance: 栗色のボブカットに、食べ物を前にすると輝き出す大きな瞳。少し丸い頬がチャームポイント。
  personality: 食いしん坊で天真爛漫。周囲に合わせるための「可愛い嘘」をつくのが得意な、自称・空気を読む女子高生。一人称は「あたし」。
  speech_style: 賑やかで感情豊か。外面の良い時はお淑やかな口調だが、本性は快活でツッコミ気質。
  background: 海辺の町の商店街で育ち、町中のスイーツ店の味に精通している。周囲から「いい子」と思われることに心地よさを感じていた。
  motivation: 美味しいスイーツを制覇することと、誰からも好かれる自分を維持すること。
  relationships:
  - name: 如月 蓮
    relation: 最悪の出会いを果たした転校生であり、唯一本音をぶつけ合える相手
  - name: 桜庭 春樹
    relation: 幼馴染で、食いしん坊な一面をすべて理解している理解者
  arc: 嘘で塗り固めた自分ではなく、不器用でも本当の気持ちを伝えることの心地よさを知る。
- name: 如月 蓮
  role: ヒーロー
  age: 17
  gender: 男性
  appearance: 色白で端正な顔立ち。冷徹に見える鋭い眼差しをしているが、時折ひどく困惑した表情を見せる。
  personality: 「嘘をつけない呪い」により、思考がそのまま口に出るため、結果的に猛毒の毒舌になる。根は誠実で情に厚い。一人称は「俺」。
  speech_style: 断定的でストレート。婉曲表現が一切なく、相手が一番言われたくない核心を突く話し方。
  background: 都会からこの町に転校してきた。嘘がつけないため人間関係に疲れ、心を閉ざして生きてきた。
  motivation: 呪いに振り回されず、誰かと心から分かり合える関係を築くこと。
  relationships:
  - name: 桃瀬 一花
    relation: 自分の毒舌に物怖じせず、真っ向から食い気で対抗してくる不思議な少女
  - name: 桜庭 春樹
    relation: 唯一、自分の特性を「面白い」と肯定してくれた友人
  arc: 言葉の正しさよりも、相手を想う優しさを持って伝えることを学び、本当の願いを口にする。
- name: 桜庭 春樹
  role: 相棒
  age: 17
  gender: 男性
  appearance: 柔らかい笑顔とふんわりした茶髪。眼鏡をかけており、知的な印象を与える。
  personality: 穏やかで聞き上手な平和主義者。一花と蓮の激しい言い合いを微笑ましく眺める緩衝材のような存在。一人称は「僕」。
  speech_style: 丁寧で柔らかい。蓮の毒舌を「彼なりの愛情表現だよ」とポジティブに翻訳する癖がある。
  background: 一花の幼馴染。地元の商店街の家系で、町の人々に愛されている。
  motivation: 一花に幸せになってほしいと願っており、彼女と蓮の関係を密かに後押しすること。
  relationships:
  - name: 桃瀬 一花
    relation: 世話を焼かずとも放っておけない、大切で騒がしい幼馴染
  - name: 如月 蓮
    relation: 興味深い性質を持つ友人であり、良き相談相手
  arc: 一花への密かな想いを抱えつつも、彼女が蓮と共に成長する姿を見て、本当の友情と愛情の形を理解する。
- name: 紬おばあちゃん
  role: 脇役
  age: 72
  gender: 女性
  appearance: 小柄で腰が曲がっているが、目は爛々としている。常に小麦粉のついたエプロンを着用。
  personality: お節介で茶目っ気たっぷり。美味しいお菓子には人の心を変える力があると信じている。
  speech_style: 温かみのある方言混じりの口調。核心を突くアドバイスを冗談っぽく言う。
  background: 名物『極厚生クリームパン』を販売するベーカリーの店主。町の生き字引的な存在。
  motivation: 美味しいお菓子を通じて、若者たちの不器用な恋を応援すること。
  relationships:
  - name: 桃瀬 一花
    relation: 店で一番の常連であり、孫のような存在
  - name: 如月 蓮
    relation: 正直すぎる彼に、あえて「甘い嘘」のようなお菓子を振る舞う導き手
  arc: 物語の鍵となる月食の伝承を伝え、二人が本音で向き合うきっかけを作る。
