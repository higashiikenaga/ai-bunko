title: 嘘をつけないキミと、月食の夜に溶ける恋心
genre: 青春恋愛
tone: 明るくポップ、ときどき胸キュン
pov: 一人称（あたし）
tense: 過去形
setting: 商店街が美味しいスイーツで有名な、海辺の町
premise: 「あたし」は、美味しいものさえあれば人生最高！と思える、食いしん坊な女子高生。そんなあたしの前に現れたのは、顔はいいのに「嘘をつけない呪い」のせいで、なぜか毒舌が止まらない転校生だった。本音しか言えない彼との、噛み合わないようで噛み合っているドタバタな日々。そして月食の夜、隠し続けてきた二人の「本当のこと」が、甘いデザートのように溶け出していく――。
themes:
- 本音と建前
- 食を通じた心の交流
rules:
- 嘘をつこうとすると喉が詰まるような感覚に襲われる
- 月食の期間中のみ、呪いの力が不安定になり、感情が言葉として溢れ出しやすくなる
plot_outline:
- '序盤: 商店街の目玉『極厚生クリームパン』を巡って、転校生の彼と最悪の、でもあまりに正直すぎる出会いを果たす。'
- '中盤: 嘘をつけない彼に振り回されつつも、美味しいスイーツを共有するうちに、あたしの心も少しずつ解けていく。でも、彼のストレートすぎる本音攻撃にツッコミが追いつかない！'
- '終盤: 月食の夜、呪いの力が不安定になり、彼がずっと隠していた『本当の願い』が、夜空の下で溢れ出す。'
- '結末: 嘘がつけない彼と、嘘をつくのが得意なあたし。不器用な二人が、言葉の裏側にある優しさを学びながら、新しい恋を始める。'
style_notes: 「あたし」による軽快な一人称視点。テンポの良い会話と、読者が思わずクスッとするツッコミを多用すること。特に食べ物の描写は、味だけでなく食感や香りまで、読者の食欲をそそるように細かく書き込む。毎話必ず、キャラクターの可愛さが爆発するような小さな笑いどころを盛り込むこと。
