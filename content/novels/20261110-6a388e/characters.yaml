- name: シオン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 知的な瞳を持つ、少し痩身の青年。古文書を扱うための革の手袋と、旅に適した実用的な外套を纏っている。常に小さな筆記用具を持ち歩いている。
  personality: 好奇心旺盛で真面目。理性的だが、真実を追うことに関しては時に強引な一面も見せる。一人称は「僕」。
  speech_style: 丁寧だが、学術的な用語を混ぜる癖がある。困った時や驚いた時には、つい独り言で考察を始めてしまう。
  background: 聖都ルミナリスの禁書庫に勤める若き歴史学者。世界の崩壊の予兆をいち早く察知し、禁忌とされる「消えた村」の伝承に辿り着く。
  motivation: 世界の崩壊を食い止め、狂気に蝕まれた人々を「眠り」という安らぎへ導くため、創世の詩の断片を集めること。
  relationships:
  - name: アルヴィス
    relation: 護衛であり、旅の相棒
  - name: ゼノス
    relation: 思想的に対立する宿敵
  arc: 知識を求めるだけの学者から、世界を救うために自己の存在さえも賭ける決断を下す、真の英雄へと変貌を遂げる。
- name: アルヴィス
  role: 相棒
  age: 35
  gender: 男性
  appearance: 銀髪の長身。傷跡の残る重厚な鎧を纏い、背には巨大な大剣を背負っている。瞳は静かな銀色で、感情の起伏が乏しい。
  personality: 沈黙を貫く寡黙な戦士。しかし、その行動には深い慈愛と騎士道精神が宿っている。一人称は「私」。
  speech_style: ほとんど話さない。必要最小限の言葉、あるいは頷きや視線で意思を示す。言葉を発する際は低く重厚な声。
  background: かつて神に仕えた古の騎士。ルミナリスの狂気に染まらず、ある「誓い」を守るために沈黙を続けている。
  motivation: シオンを目的地まで護衛し、世界の理を取り戻すこと。そして自身の果たせなかった誓いを完遂すること。
  relationships:
  - name: シオン
    relation: 守るべき対象であり、理解者
  - name: セレスティア
    relation: かつて守護を誓った主の欠片
  arc: 停滞していた自身の時間が、シオンとの旅を通じて再び動き出し、失われた名誉と使命を再発見する。
- name: セレスティア
  role: 脇役
  age: 14
  gender: 女性
  appearance: 透き通るような肌と、星屑を散りばめたような瞳を持つ少女。エテルナの幻影のように儚く、どこか浮世離れした美しさを持つ。
  personality: 穏やかで達観している。世界の終わりを悲しむことなく、静かに受け入れているような不思議な包容力がある。一人称は「わたし」。
  speech_style: 詩を詠むような、ゆったりとした独特のリズムを持つ話し方。予言めいた言葉を口にすることがある。
  background: 隠れ里エテルナに眠る「最後の神の欠片」の化身。世界が眠りを取り戻すための鍵となる存在。
  motivation: 神の苦しみから解放され、世界に真の安らぎ（眠り）をもたらすこと。
  relationships:
  - name: シオン
    relation: 運命を共に歩む者
  arc: 孤独な神の残滓として存在していたが、シオンと触れ合うことで「死」と「忘却」の尊さを知り、儀式へと導く。
- name: ゼノス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 白銀の法衣に身を包んだ、威厳ある老人。狂気に満ちた輝きを瞳に宿しており、その立ち振る舞いは神々しいほどに傲慢である。
  personality: 極めて独善的。不眠による狂気を「神への接近」と誤認しており、覚醒を維持することこそが人類の進化だと信じている。一人称は「我」。
  speech_style: 権威的で、聴く者を圧倒するような荘厳な口調。断定的な言い回しを好む。
  background: 聖都ルミナリスの最高指導者。神を殺した人間たちの傲慢さを象徴する存在であり、永遠の覚醒を司る教団を率いている。
  motivation: 神を完全に支配し、人間が永遠に眠ることのない、超越的な存在へと進化すること。
  relationships:
  - name: シオン
    relation: 進化を妨げる愚かな者
  arc: 自らが神に近い存在であると確信していたが、世界の真実を前にして、自らが作り上げた狂気の中に飲み込まれていく。
