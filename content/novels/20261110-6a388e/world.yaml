title: 天球の断章：絶えぬ灯火と亡き日の郷
genre: 伝奇
tone: 荘厳にして重厚な神話的雰囲気
pov: 三人称
tense: 過去形
setting: 星の破片が大地を形作る幻想世界。永劫の不眠に囚われた白銀の聖都「ルミナリス」と、歴史の狭間に消えた隠れ里「エテルナ」を舞台とする。
premise: 神の死と共に星々の運行が狂い、世界は緩やかな崩壊へと向かっていた。かつて禁忌の知識を求めた人間たちが築いた「眠らぬ街」ルミナリスは、いまや覚醒の呪いに焼かれ、人々は狂気の中で永遠を彷徨っている。若き歴史学者シオンは、古文書に記された「消えた村」に眠る創世の詩を求め、絶望の地を巡る旅に出る。失われた言葉を取り戻したとき、世界に真の安らぎとしての「眠り」が戻るのか。
themes:
- 記憶と忘却
- 永劫の孤独と救済
rules:
- 「星辰の理」により、睡眠は魂を一時的に神の領域へ返還させる浄化の儀式である。
- 睡眠を放棄して魔力を得た者は、精神が摩耗し、最終的に自我を喪失した「白き亡霊」へと変貌する。
- 消えた村エテルナは、特定の韻律を持つ「鍵の詩」を唱えた者にのみ、境界の霧を分かち姿を現す。
plot_outline:
- '序盤: 聖都ルミナリスで不眠の狂気に蝕まれる人々。学者シオンが禁書庫から「消えた村」の伝承を発見し、護衛として沈黙を誓った古の騎士アルヴィスと共に、街を脱出する。'
- '中盤: 荒廃した聖域や忘れられた神殿を巡る旅。道中で神話時代の詩の断片を回収し、世界が崩壊した真の原因が「神を殺し、永遠の覚醒を得ようとした人間たちの傲慢」にあることを突き止める。'
- '終盤: 霧の彼方に現れた「消えた村」エテルナに到達。そこで眠り続ける最後の神の欠片と対峙し、ルミナリスの人々を呪いから解放するための唯一の手段である「永き眠りの儀式」を執り行う。'
- '結末: 聖都に再び眠りが訪れ、人々は正気を取り戻す。しかし、儀式の代償としてシオンは世界の記憶から自身の存在を消去され、誰にも知られぬまま新たな伝説の語り手となって世界を旅し続ける。'
style_notes: 竜胆アルトの筆致を用い、地の文には「〜なり」「〜たらん」といった古風で格調高い表現を配する。作中に架空の古詩や聖典の引用を挿入し、世界の奥行きを演出すること。地名や固有名詞は、ラテン語や古英語の響きを意識し、重厚感を持たせる。会話文はキャラクターの身分や背景に基づき、厳格な口調と柔和な口調を明確に描き分ける。
