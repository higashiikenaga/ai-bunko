- name: 湊 (みなと)
  role: 主人公
  age: 24
  gender: 女性
  appearance: 色素の薄いベージュのコートを纏い、どこか儚げな印象を与える女性。雨の日には大きな紺色の傘を差している。
  personality: 内向的で思慮深く、感情を出すのが苦手。一人称は「私」。
  speech_style: 控えめで丁寧な口調。言葉を選ぶため、間が空くことが多い。
  background: 都会で事務的に働いていたが、兄の急逝を機に故郷の海辺の町へ戻った。幼い頃から兄の背中を追いかけていた。
  motivation: 兄が遺した宛名のない手紙の意味を理解し、彼が本当に伝えたかった言葉を見つけること。
  relationships:
  - name: 海
    relation: 最愛の兄。憧れであり、同時に理解しきれなかった存在。
  - name: 陽葵
    relation: 兄の友人であり、手紙の謎を解く鍵を握る協力者。
  arc: 喪失感による停滞から、兄の記憶を辿ることで自分自身の人生を歩み出す勇気を得る。
- name: 海 (かい)
  role: 物語の核心となる故人
  age: 27
  gender: 男性
  appearance: 陽だまりのような柔らかい笑顔と、どこか寂しげな瞳を持つ青年。写真の中ではいつも海を眺めている。
  personality: 自由奔放に見えて、実は繊細で責任感が強い。一人称は「俺」。
  speech_style: 軽やかで冗談交じりの話し方だが、核心に触れるときは静かで真摯。
  background: 地元で愛されていたが、ある秘密を抱えていた。妹の湊にだけは心配をかけまいと、自分の孤独を隠し通していた。
  motivation: 自分が去った後、妹が前を向いて生きられるよう、記憶の断片を導線として遺すこと。
  relationships:
  - name: 湊
    relation: 大切に想っていた妹。彼女にだけは本当の自分を知ってほしかった。
  - name: 陽葵
    relation: 唯一、弱さをさらけ出せた親友であり、共犯者のような関係。
  arc: 死後、手紙を通じて湊に自分の真実を伝え、彼女の心の中に永遠の居場所を作る。
- name: 陽葵 (ひまり)
  role: 相棒・案内役
  age: 26
  gender: 男性
  appearance: 潮風にさらされたリネンシャツを着こなす、穏やかな風貌の青年。古本屋を営んでいる。
  personality: 穏やかで包容力があるが、時折鋭い洞察を見せる。一人称は「僕」。
  speech_style: ゆったりとした、心地よいリズムの話し方。比喩表現を好む。
  background: 海とは学生時代からの親友で、彼が抱えていた「約束」の内容を唯一知る人物。
  motivation: 海が遺した意志を完遂させるため、湊を「約束の丘」へと導くこと。
  relationships:
  - name: 海
    relation: 親友。彼が遺した孤独と希望を誰よりも理解している。
  - name: 湊
    relation: 友人。海の面影を追い求める彼女を、静かにサポートする。
  arc: 湊を助けることで、自分自身も海を失った喪失感を乗り越え、前を向いて生きる決意をする。
- name: 静江 (しずえ)
  role: 脇役・精神的支柱
  age: 68
  gender: 女性
  appearance: 白髪を丁寧にまとめ、常にエプロンを着用している。深い皺が刻まれた優しい目元が特徴。
  personality: 肝っ玉母さん的な気質で、町の誰もが頼りにする。一人称は「私」。
  speech_style: はっきりとした口調だが、慈愛に満ちている。方言が混じる。
  background: 湊と海の祖母。海辺の町の歴史や、土地に伝わる伝承に詳しい。
  motivation: 湊が悲しみに暮れず、この町で心地よく過ごせるように見守ること。
  relationships:
  - name: 湊
    relation: 孫娘。都会で疲れた彼女を温かく迎え入れ、食事と居場所を与える。
  - name: 海
    relation: 孫。彼の不器用さを理解し、見守っていた。
  arc: 湊が成長していく姿を見届けることで、家族の絆が形を変えて受け継がれることを実感する。
