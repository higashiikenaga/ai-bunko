title: 藍色の雨と、渡り鳥の栞
genre: ヒューマンドラマ
tone: 透明感のある叙情的な静謐さ
pov: 三人称近接視点
tense: 過去形
setting: 雨の多い、潮風が吹く海辺の町
premise: 兄の死後、故郷の海辺へ戻った湊は、兄が遺した宛名のない手紙の束を見つける。手紙には、かつて二人で訪れた「約束の丘」へと続く、不可解な言葉が綴られていた。雨が降るたびに、湊の心には兄が飲み込んできた言葉の欠片が降り積もっていく。渡り鳥が空を渡る季節、彼女は兄が隠し続けてきた、ある大切な記憶を辿り始める。
themes:
- 言葉にできなかった想い
- 喪失からの再生
- 記憶の継承
rules:
- 雨の情景描写は登場人物の心理的変容と同期させる
- 手紙の文面は、直接的な説明を避け、情景や比喩を用いて感情を伝える
- 渡り鳥の飛来は、物語の感情的な転換点を示す
plot_outline:
- '序盤: 兄を亡くした湊が、潮の香る町へ帰郷する。兄の遺品整理の中で、季節ごとに書かれた、宛先不明の美しい手紙の束を見つける。'
- '中盤: 手紙の断片を頼りに「約束の丘」を訪ねる湊。そこで、兄がかつて誰かと分かち合った、果たせなかった約束の存在を知る。雨の日にだけ届く、不思議なメッセージが彼女を導いていく。'
- '終盤: 激しい嵐の中、湊は手紙の行間に隠された、兄の真実の想いと、伝えられなかった言葉の正体に辿り着く。'
- '結末: 季節が巡り、渡り鳥が丘へ帰ってくる頃、湊は海を見つめながら、自分自身の言葉で新しい手紙を綴り始める。'
style_notes: 透明感のある叙情的な文体。視点人物の感覚（雨の冷たさ、潮の匂い、紙の質感）を地の文に溶け込ませ、内心を直接語らずに描写する。会話における「言い淀み」や「すれ違い」を丁寧に描き、作中に手紙やメッセージの文面を挟むことで、情緒的な奥行きを持たせる。
