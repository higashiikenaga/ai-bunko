title: クローム・ハザード：ネオン・レクイエム ―― 忘却のパルスと鋼の記憶
genre: サイバーパンク
tone: ネオンと雨。硬質で高速なハードボイルド。
pov: 一人称（カイト）
tense: 現在形・過去形混在
setting: 雲海を越えた先の浮遊都市群「アエテルナ・ノヴァ」と、高度な自動化が進み、人間が不要となった棄民たちの掃き溜め「アンダー・グリッド」。
premise: 記憶を失ったカイトは、自由の空を旅するゴースト・シップ『アーク』のクルーとして、ミアと三毛猫と共に日々を過ごしていた。だが、平穏は長くは続かない。失われた記憶の断片を指し示す「失われた手紙」が、高度な暗号化された物理メディアとしてカイトの元へ届く。それは、かつての自分自身が、未来の自分へと宛てた警告だった。都市の深淵で、再び「折れた剣」の如き欠陥プログラムが動き出す。
themes:
- 記憶の同一性
- 自由の代償
- デジタルな魂の再生
rules:
- ゴースト・ダイブは精神を電子の海に溶かす行為であり、頻用は自我の崩壊を招く
- アークの航行には、乗員の感情や記憶の微弱な電気信号が燃料として消費される
- 企業の防衛AIは、物理的な破壊よりも『概念の書き換え』によって対象を抹殺する
plot_outline:
- '序盤: 自由な空を旅するカイトたち。しかし、カイトの脳内にノイズが走る。謎の運び屋から、古い物理的な手紙（メモリー・カード）を渡される。そこには、アエテルナ脱出時に彼が自ら消去したはずの『罪の記録』が刻まれていた。'
- '中盤: 手紙の解析を進めるカイトとミア。ハッキングの深層で、彼らは『折れた剣』と呼ばれる、かつて企業に挑んだハッカー集団の遺物を見つける。それは、都市の基幹システムを内側から破壊するための物理キーだった。追っ手として、ヴァイスの意志を継ぐ新型サイボーグ「エグゼキューター」がアークを襲撃する。'
- '終盤: アークは、記憶の燃料が尽きかけ、制御不能に陥る。カイトは、手紙に記された真実――自分が記憶を捨てたのは、自分自身が企業の生体演算ユニットの一部だったからだという事実――に直面する。ミアは、カイトの自我を維持するために、自らの意識をアークのメインフレームに接続する決断を下す。'
- '結末: カイトは『折れた剣』を起動させ、エグゼキューターを撃破。アークは新たな座標へと跳躍する。記憶は完全には戻らない。だが、カイトの掌には、ミアが残した電子の温もりがあった。ネオンの雨が降る中、彼らは新しい「空」を探して、再び航海を続ける。'
style_notes: 短いセンテンスを叩きつけるように。形容詞を削ぎ落とし、名詞と動詞でスピードを刻む。ハッキングシーンは『ノードへの強行突入』『レイヤーの剥離』『論理爆弾のデプロイ』といった、具体的で硬質な造語を多用する。雨、ネオン、クローム、回路。これらの色彩を、ハードボイルドな独白に織り交ぜること。
