- name: カイ・ヴァン・クロムウェル
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無造作な茶髪に、額には常に使い込まれた飛行ゴーグルを装着。軽量な革製の飛行服を纏っている。
  personality: 向こう見ずで楽観的、直感に従って動くタイプ。一人称は「俺」。
  speech_style: 快活で勢いがあり、語尾が跳ねるような少年らしい話し方。
  background: 浮遊島の辺境で、廃品回収（スカベンジャー）として細々と暮らしていた孤児。
  motivation: 世界の真実を知ることと、何にも縛られない空の自由を守ること。
  relationships:
  - name: ライラ・アルカディア
    relation: 信頼する相棒であり、共に旅をする友人
  - name: ヴァレリウス・ヴォルガ
    relation: 行く手を阻む宿敵
  arc: 自分の自由だけを求めていた少年が、仲間と世界の運命を背負う覚悟を持つリーダーへと成長する。
- name: ライラ・アルカディア
  role: 相棒
  age: 18
  gender: 女性
  appearance: 銀色の長い髪、精密なレンズを内蔵した機械式の片眼鏡（モノクル）を着用。知的な学者風の装い。
  personality: 冷静沈着で論理的。感情に流されず常に最適解を求める。一人称は「私」。
  speech_style: 理知的で丁寧だが、芯の強さを感じさせる落ち着いた口調。
  background: かつて地下図書館の知識を管理していた学術機関の元研究員。現在は帝国の追っ手から逃れている。
  motivation: 失われた世界の歴史を正しく修復し、後世に伝えること。
  relationships:
  - name: カイ・ヴァン・クロムウェル
    relation: 操縦士としての能力を信頼している相棒
  arc: 理屈とデータだけで世界を見ようとしていた彼女が、不確かな「希望」や「絆」を信じる強さを手に入れる。
- name: ヴァレリウス・ヴォルガ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 威厳のある黒い軍服、顔に走る古い傷跡。重厚な真鍮製の装飾が施された巨大な指揮官用外套を羽織る。
  personality: 冷酷で規律を重んじる絶対主義者。秩序こそが世界の安定をもたらすと信じている。一人称は「私」。
  speech_style: 威圧的で無駄のない、命令口調の話し方。
  background: 帝国軍の最高司令官。蒸気技術による絶対的な支配を目論んでいる。
  motivation: 地下図書館の鍵を奪い、最終列車を掌握することで、空の全領域を統治すること。
  relationships:
  - name: カイ・ヴァン・クロムウェル
    relation: 秩序を乱す排除すべき不確定要素
  arc: 完璧な支配を追求するあまり、自らが築いた秩序が崩壊していく混沌に直面し、狂気に陥っていく。
- name: ギルバート・アイアンサイド
  role: 脇役
  age: 52
  gender: 男性
  appearance: 筋骨隆々とした大柄な体格。油に汚れた作業服と、蒸気駆動の義手を装着している。
  personality: 無骨でぶっきらぼうだが、非常に情に厚い職人気質。一人称は「おいら」。
  speech_style: 豪快でぶっきらぼうな、下町情緒のある話し方。
  background: かつて帝国の機関士だったが、ある事件を機に隠居し、現在は辺境で整備士をしている。
  motivation: 伝説の「最終列車」が再び空を駆ける、その壮大な輝きをこの目で見ること。
  relationships:
  - name: カイ・ヴァン・クロムウェル
    relation: 技術を継承すべき若き才能
  arc: 過去の過ちを悔やみながら隠居生活を送っていたが、カイたちの挑戦を通じて、再び未来のために戦う決意を固める。
