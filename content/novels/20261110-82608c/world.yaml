title: 蒼穹の風と、銀翼の最終列車
genre: スチームパンク冒険
tone: 爽快で躍動感あふれる冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島が点在する天空世界「アエロ・スチーム」。巨大な蒸気機関が文明の鼓動となり、果てしない雲海が世界の境界線となっている。
premise: 若き操縦士カイは、相棒の小型飛空艇『スカイ・レーサー』と共に、失われた世界の記憶が眠る「地下図書館」の鍵を探していた。しかし、その鍵を狙う帝国軍の追撃が、カイたちの行く手を阻む。世界の命運を託された唯一の脱出手段は、雲海を切り裂いて走る伝説の「最終列車」に乗ること。カイと仲間たちは、風と蒸気の力を信じ、空の果てを目指す決死の航海へと飛び出す。
themes:
- 自由への渇望
- 仲間との絆
- 失われた文明の再生
rules:
- 高度が上がるほど蒸気圧が高まり推進力が増すが、同時に機体への負荷も増大する
- 雲海の下には『沈黙の領域』と呼ばれる、通信も飛行も不能な未知の領域が存在する
- 飛空艇の性能は、操縦士の風を読むセンスと、エンジニアによる精密な整備によって決まる
plot_outline:
- '序盤: 雲海でのスカベンジャーとして生きるカイが、地下図書館の地図が記された羅針盤を拾い、帝国軍の追跡を受けながら脱出する。'
- '中盤: 隠された空中都市の「地下図書館」へ辿り着き、世界の真実と、雲海を渡る巨大蒸気機関車「最終列車」の存在を知る。'
- '終盤: 帝国軍の巨大戦艦との空中戦を潜り抜け、カイたちは崩壊しつつある軌道に乗る最終列車へと、飛空艇で強引に飛び乗る。'
- '結末: 列車の屋根の上での決戦。仲間たちの結束が奇跡を起こし、列車は新天地へと突き進む。空に新しい時代の風が吹き抜ける。'
style_notes: 蒸気の噴出音、歯車の回転、風を切る音を鮮烈な擬音や躍動感のある表現で描写すること。空の広大さと、機械の力強さを強調し、読者がキャラクターと共に風を感じるような、スピード感あふれる文体を維持する。
