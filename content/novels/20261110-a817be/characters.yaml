- name: アルド・レヴァンテ
  role: 主人公
  age: 28
  gender: 男性
  appearance: 深い憂いを帯びた灰色の瞳と、銀糸の刺繍が入った黒い聖騎士の外套。左頬には鏡の破片で切られたような古い傷痕がある。
  personality: 実直で強い正義感を持つが、己の過去に深いコンプレックスを抱く。一人称は「私」。
  speech_style: 冷静で丁寧だが、内面の切実さが滲む厳格な口調。
  background: 鏡の神を祀る聖域の守護騎士。幼少期の記憶の大部分が欠落しており、その空白を埋めるために迷宮都市で任務に従事している。
  motivation: 迷宮都市に巣食う禁忌の記憶を回収し、世界の均衡を守ること。そして自らの失われた記憶の真相を知ること。
  relationships:
  - name: セレネ
    relation: 最も美しく残酷な記憶を求める謎の貴婦人であり、対峙すべき存在
  - name: ギルバート
    relation: アルドを知る記憶の蒐集家であり、因縁の敵
  arc: 自身の全ての記憶を鏡に捧げて歴史から消え去ることで、世界を救う。
- name: セレネ・ヴェスペラ
  role: ヒロイン／敵役
  age: 25
  gender: 女性
  appearance: 月光のように青白い肌と艶やかな黒髪。常に顔の半分を隠す精巧な銀の面を身につけている。
  personality: ミステリアスで妖艶、どこか儚げだが冷酷な目的を秘める。一人称は「私（わたくし）」。
  speech_style: 優雅で含みのある、詩的な言い回し。
  background: 『純粋なる記憶』を求めて鏡の市場を渡り歩く貴婦人。その正体は、神代の忘れ形見とも噂される存在。
  motivation: 世界を揺るがす禁忌の記憶を手に入れ、失われた神話を再来させること。
  relationships:
  - name: アルド・レヴァンテ
    relation: 市場で出会い、運命を狂わされていく聖騎士
  arc: アルドとの接触を通じて、神々の定めた宿命に抗う意味を見出し、自身の在り方を変えていく。
- name: ギルバート・ヴォルフ
  role: 敵役
  age: 42
  gender: 男性
  appearance: 仕立ての良い紫のコートを着こんだ、眼光の鋭い男。右目に機械仕掛けの義眼を嵌めている。
  personality: 野心的で冷徹、人間の欲望と記憶の価値を冷ややかに見つめる。一人称は「俺」または「私」。
  speech_style: 皮肉屋で、相手を値踏みするような余裕のある話し方。
  background: 迷宮都市の裏側で暗躍する『記憶の蒐集家』たちの首魁。禁忌の記憶を売買し、教団と結託している。
  motivation: 鏡の神の再臨を利用して、新たな世界の支配者となること。
  relationships:
  - name: アルド・レヴァンテ
    relation: 計画の邪魔をする聖騎士であり、過去の秘密を握る因縁の相手
  arc: 野望半ばで教団との力関係に敗れ、自らが集めた記憶の濁流に呑まれて破滅する。
- name: リッカ
  role: 脇役
  age: 14
  gender: 女性
  appearance: ボロ布のフードを被り、大きな革製の鞄を背負った小柄な少女。大きな琥珀色の目をしている。
  personality: 勝気でちゃっかりしているが、根は優しく寂しがり屋。一人称は「あたし」。
  speech_style: 少しぶっきらぼうだが、年相応に感情豊かなストリートスラング混じりの口調。
  background: 霧に包まれた迷宮都市で、他人の捨てた微弱な記憶の欠片を拾い集めて日銭を稼ぐ少女。
  motivation: 過酷な都市で生き延びること、そしていつか自分の本当の居場所を見つけること。
  relationships:
  - name: アルド・レヴァンテ
    relation: 市場で助けられ、密かに信頼を寄せるようになる聖騎士
  arc: アルドの生き様と言葉に触れ、自分の足で未来を切り開く強さを手に入れる。
