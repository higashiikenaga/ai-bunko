title: 断罪の鏡像、あるいは忘却の銀河に捧ぐ挽歌
genre: 伝奇
tone: 重厚かつ荘厳、神話的な哀愁を帯びたトーン
pov: 三人称（限定視点と全知視点の使い分け）
tense: 過去形
setting: 神代の残滓が漂う、黄昏の霧に包まれた迷宮都市「エリュシオン・ノクティス」
premise: かつて神々が世界を創りし際、使い残した『純粋なる記憶』が澱のように溜まった場所がある。人々はその記憶を糧とし、あるいは忌むべき過去を清算するために、密かに『記憶を売る市場』へと足を運ぶ。鏡の神を祀る聖域を守護する騎士は、鏡の中に映る「あり得たはずの自己」に蝕まれ、世界の理を揺るがす禁忌の記憶に直面することとなる。それは、失われた神話の再来か、それとも終焉への序曲か。
themes:
- 自己の同一性と記憶の不確かさ
- 神話の崩壊と人間性の証明
rules:
- 鏡は魂の投影であり、特定の儀式を通じて過去の記憶を物理的な結晶として取り出すことができる
- 記憶を売買する行為は、魂の一部を切り売りすることを意味し、過度の取引は精神の崩壊を招く
- 神話時代の遺物（レリック）は、所有者の記憶を糧にその力を発揮する
plot_outline:
- '序盤: 聖騎士アルドは、鏡の市場で『最も美しく、最も残酷な記憶』を求める謎の貴婦人と出会い、その記憶が世界の均衡を壊す禁忌のものであることを知る。'
- '中盤: 市場の裏側に潜む『記憶の蒐集家』たちの陰謀が明らかになり、アルドは自身の失われた幼少期の記憶が、鏡の深淵に封印されていることに気づく。'
- '終盤: 鏡の神の再臨を狙う教団との戦いの中で、アルドは鏡の中に閉じ込められた『偽りの神』と対峙し、世界の真実を突きつけられる。'
- '結末: 世界を救うために、アルドは自らの全ての記憶を鏡に捧げ、歴史から消え去る道を選ぶ。残されたのは、誰も知らない美しい伝承だけである。'
style_notes: 格調高い語彙を用い、地名や神話的背景を詩的に描写すること。物語の節目には、その世界の歴史を裏付けるような古の詩や伝承を引用し、読者に世界の奥行きを感じさせる。会話文は、高潔な騎士、狡猾な商人、神秘的な巫女など、それぞれの身分や性質に応じた重みのある口調で書き分ける。
