- name: レオン・ベルベット
  role: 主人公
  age: 20
  gender: 男性
  appearance: やや色褪せた旅用のコートを着ており、ゴーグルを額に引っかけている。好奇心に満ちた瞳が特徴。
  personality: 新しい土地の文化や食を愛する楽天家。一人称は「僕」。
  speech_style: 丁寧だが気さくで、美味しいものや綺麗な景色に出会うと子供のように目を輝かせる。
  background: 各地を巡る旅人。古びた地図を手に入れたことをきっかけに、大きな航海へと踏み出す。
  motivation: 「眠らない街」と海底遺跡の謎を解き、まだ見ぬ景色と星の瞬きを見つけること。
  relationships:
  - name: セレス・ギアハート
    relation: 旅の相棒・修理職人
  - name: ヴァルカン・クロウ
    relation: 対立するトレジャーハンター
  arc: 未知への憧れから出発した旅を通じて、失われた文明の重みを知り、自分の足で未来を切り開く決意をする。
- name: セレス・ギアハート
  role: 相棒
  age: 22
  gender: 女性
  appearance: オイルまみれの作業着を好み、髪を乱雑にまとめている。左腕には精巧な義手（機械式）を装着している。
  personality: 現実主義で職人肌だが、根は面倒見が良い。一人称は「私」。
  speech_style: 歯に衣着せぬ物言いだが、機械やメカニズムを語る時は早口で熱くなる。
  background: 優れた腕を持つ機械職人。街の工房で朽ちかけていた羅針盤をレオンに直したことで、旅に同行することになる。
  motivation: 自身の機械技術の限界を超えた失われたオーパーツ（古代の歯車や潜水艇）の構造をこの目で確かめること。
  relationships:
  - name: レオン・ベルベット
    relation: 相棒・旅の同行者
  arc: 理論と機械だけを信じていたが、レオンとの旅や海底遺跡での体験を通じて、ロマンや目に見えない絆の価値を理解する。
- name: ヴァルカン・クロウ
  role: 敵役
  age: 35
  gender: 男性
  appearance: 仕立ての良い黒いロングコートを着込み、鋭い眼光と冷徹な笑みを浮かべた男。大型の蒸気銃を携帯している。
  personality: 冷酷で目的のためには手段を選ばない野心家。一人称は「俺」。
  speech_style: 低く落ち着いた声で、皮肉交じりに相手を威圧するような話し方をする。
  background: 海底遺跡に眠る膨大な富とオーパーツの技術を狙う、腕利きの闇のトレジャーハンター。
  motivation: 海底遺跡の最深部にある古代のエネルギー源を手に入れ、世界の覇権を握ること。
  relationships:
  - name: レオン・ベルベット
    relation: 目的を邪魔するライバル
  - name: マリア・ヴェント
    relation: 情報屋
  arc: 力と富こそが全てという信念の持ち主だったが、遺跡の崩壊と古代の真実を目の当たりにし、自身の野望の空疎さに気づく。
- name: マリア・ヴェント
  role: 脇役
  age: 28
  gender: 女性
  appearance: 色鮮やかな東方の民族衣装をまとい、常に煙管（キセル）をくゆらせているミステリアスな美女。
  personality: 掴みどころがなく商売熱心。一人称は「私（あてし）」。
  speech_style: 艶っぽく、どこか含みのある思わせぶりな言葉遣いをする。
  background: 雲海の市場や「眠らない街」の裏社会に通じる凄腕の情報屋。
  motivation: 面白い人間を観察することと、高額な報酬を稼ぐこと。
  relationships:
  - name: レオン・ベルベット
    relation: 面白い客
  - name: ヴァルカン・クロウ
    relation: 危険な取引相手
  arc: 傍観者として旅人たちを利用していたが、レオンたちの純粋な探求心に触れ、彼らに決定的な助言を与えるようになる。
