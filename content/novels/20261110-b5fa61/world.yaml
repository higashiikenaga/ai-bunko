title: 真鍮の星屑と、碧き底の夢航路
genre: スチームパンク冒険
tone: 穏やかで叙情的な冒険譚
pov: 一人称（僕）
tense: 過去形
setting: 蒸気機関が空と海を支配する、浮遊島と巨大な海洋国家が共存する世界。
premise: 空飛ぶ蒸気船で各地を巡る僕の旅は、ある古びた地図を手にしたことから大きく動き出す。目的地は、絶え間なく歯車が回り続け、決して夜が訪れることのない「眠らない街」。その街の地下深く、遥か海底には、失われた文明の記憶を湛えた「海底遺跡」が眠っているという。僕は風の香りと、新しい土地の味を楽しみながら、星の瞬きを探す旅へと漕ぎ出す。
themes:
- 忘れ去られた記憶の再発見
- 旅路におけるささやかな幸福
rules:
- 蒸気機関は特殊な「燐光石」を燃料とする
- 高度が上がると空気は薄くなり、蒸気船の圧力調整が不可欠になる
- 海底遺跡は、強力な水圧と古代の魔力的な蒸気によって守られている
plot_outline:
- '序盤: 旅人である僕が、古い羅針盤を修理する職人と出会い、地図に記された「眠らない街」を目指して蒸気船で旅立つ。道中、雲海に浮かぶ市場で不思議な香辛料を使った料理を味わう。'
- '中盤: 24時間、蒸気灯が輝き続ける「眠らない街」に到着する。街の喧騒の中で、地図が示す真の目的地が、この街の真下にある海底遺跡であることを知る。'
- '終盤: 特殊な潜水蒸気艇を操り、深海の静寂へと降りていく。海底遺跡で、かつて空と海が一つだった時代の美しい記憶と、失われた技術の断片を目撃する。'
- '結末: 遺跡から持ち帰った「星の欠片」を抱え、僕はまた次の目的地へと船を出す。窓の外に広がる朝焼けを眺めながら、次に出会う土地の料理のことを考える。'
style_notes: 灯守ルカとしての筆致を貫く。風景描写は、真鍮の質感や蒸気の匂い、波の音を丁寧に描き、旅日記のように「僕」の主観で綴る。各章の終わりに、その土地で食べた料理や独特の風習を、温かな記憶として書き添えること。
