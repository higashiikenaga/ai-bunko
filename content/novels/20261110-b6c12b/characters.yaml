- name: ジュリアン・ソーン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 痩身で青白い肌。度の強い眼鏡をかけ、常に古びたツイードのジャケットを着用している。指先には常にインク汚れがある。
  personality: 極めて論理的で懐疑的。一度疑問を持つと解決するまで眠れない強迫的な探究心を持つ。一人称は「私」。
  speech_style: 丁寧だが、相手の論理的矛盾を突く際は冷徹で断定的な口調になる。
  background: 元・幾何学講師。ある学術的不祥事に巻き込まれ職を追われ、現在は学術都市の地下アーカイブで古文書の整理・解析を請け負う記録保管士。
  motivation: 「桜の庭園における消失事件」という究極の未解決問題に論理的な解答を出すことで、自身の知性を証明し、失った社会的地位を回復すること。
  relationships:
  - name: エレナ・ヴェイン
    relation: 調査対象であり、知的な憧憬の対象
  - name: アーサー・スターリング
    relation: かつての恩師であり、現在は不信感を抱く監視者
  arc: 純粋な論理的解決を求めていたが、最終的に自らの認識さえもが書き換えられるという「不完全な観測者」としての絶望と陶酔を経験する。
- name: エレナ・ヴェイン
  role: キーパーソン（記録上の人物）
  age: 28
  gender: 女性
  appearance: 鋭い眼差しと、常に何かを計算しているような口元の癖がある。遺された写真では、白衣にコンパスを携えている。
  personality: 直感的かつ大胆。既存の学問体系に縛られない自由な思考を持つ。一人称は「私」。
  speech_style: 論文調の硬い文章の中に、時折、詩的で情熱的な独白が混じる。
  background: 植物学と数学の二重専攻をしていた天才研究者。消失事件の当事者であり、事件直前まで「桜の散布パターン」と「空間座標」の相関性を研究していた。
  motivation: 物理的な地図に描かれない「空白の街区」を定義し、人間が認識できない高次空間への到達を証明すること。
  relationships:
  - name: ジュリアン・ソーン
    relation: 時空を超えて対話する解析者
  - name: アーサー・スターリング
    relation: 理論を否定し、研究を隠蔽しようとした権威
  arc: 記録を通じてのみ登場するが、彼女の思考の痕跡がジュリアンを誘導し、最終的に彼を自分と同じ「消失の座標」へと導く。
- name: アーサー・スターリング
  role: 敵役/妨害者
  age: 55
  gender: 男性
  appearance: 隙のない身なりをした紳士。金色の懐中時計を常に持ち、冷徹な青い瞳をしている。
  personality: 保守的で権威主義的。秩序を乱す「特異点」を徹底的に排除しようとする。一人称は「私」。
  speech_style: 穏やかで格式高いが、言葉の端々に相手を威圧し、思考を制限させるような誘導が含まれている。
  background: 学術都市の大学学部長。かつてエレナの研究を指導していたが、その危険性に気づき、事件後の調査報告書を改ざんし、証拠を隠蔽した人物。
  motivation: 「空白の街区」の存在が公になることで、都市の物理的・社会的秩序が崩壊することを防ぐこと。
  relationships:
  - name: ジュリアン・ソーン
    relation: 管理下に置きたい元教え子
  - name: エレナ・ヴェイン
    relation: 排除すべき危険な知性の象徴
  arc: 完璧な隠蔽工作を完遂したと信じていたが、ジュリアンの解析によって、自分自身もまた「再定義された認識」の中に閉じ込められていたことに気づかされる。
- name: クララ・ハロウェイ
  role: 脇役/情報提供者
  age: 60
  gender: 女性
  appearance: 日焼けした肌に深い皺があり、常に花柄のショールを纏っている。古い手書きの観察日記を大切に持っている。
  personality: 穏やかで物静かだが、植物に関しては偏執的なまでの観察眼を持つ。一人称は「私」。
  speech_style: ゆったりとした口調。比喩表現が多く、論理よりも感覚的な説明を好む。
  background: 植物学研究所の元庭師。消失事件の際、唯一現場に居合わせながらも「何も見ていない」と証言し続けた人物。
  motivation: かつての同僚たちが消えた「本当の理由」を、誰か正しく理解してくれる人間に託したい。
  relationships:
  - name: ジュリアン・ソーン
    relation: 断片的な記憶を共有する協力者
  - name: エレナ・ヴェイン
    relation: 庭の美しさを共有した友人
  arc: 沈黙を守り続けていたが、ジュリアンの推論が核心に近づくにつれ、記憶に封じ込めていた「座標の違和感」を話し始める。
