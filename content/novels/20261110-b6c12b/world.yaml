title: 未解読事象『散華する座標』に関する一考察
genre: 本格ミステリー
tone: 乾いた学術的叙述、静謐な不条理
pov: 第一人称（調査員）による断片的記述
tense: 現在形および過去形（資料の引用による混在）
setting: 20世紀初頭の架空の学術都市、および記録された不可解な遺構
premise: 未解決事件として扱われる「桜の庭園における消失事件」の再検証。遺された調査報告書、断片的な手記、および判明していない「秘密の地図」の断片を、事後的な解析によって繋ぎ合わせる。散りゆく桜の時期にのみ現れる、地理的整合性を欠いた構造物の存在を追う。読者は提示される資料の矛盾を突き、隠蔽された「真の座標」を導き出さなければならない。
themes:
- 空間の認識論的矛盾
- 記憶の地層学
rules:
- 記録された事象は、記述者の観測によって確定する。
- 地図上の座標と、実際の物理的距離には、特定の条件下で非線形な差異が生じる。
- 事件の核心は、記述されていない『空白の脚注』にのみ存在する。
plot_outline:
- '序盤: 廃墟となった植物学研究所から回収された、未完成の調査報告書の提示。そこには、特定の桜の木の下で、人間が「座標の不一致」により消失した記録が記されている。'
- '中盤: 複数の研究者の手記を照合する過程で、一通の「秘密の地図」の断片が発見される。地図は、物理的な地形ではなく、特定の季節における「桜の散布パターン」を論理的な回路として描いていた。'
- '終盤: 地図の欠落した座標を、学術的推論によって補完する。それは、かつて存在したはずの、地図上には描かれない「空白の街区」への道筋であった。'
- '結末: 消失の真相は、空間の物理的な欠陥ではなく、観測者の認識が特定の幾何学的配置（桜の配置）によって強制的に再定義されたことにあると結論付けられる。しかし、調査員自身の記述もまた、その陥穽に嵌まっている可能性が脚注によって示唆される。'
style_notes: 学術論文、あるいは事後調査報告書の形式を徹底する。物語の核心は直接語らず、図表の説明、文献引用、および「注釈（脚注）」を用いて、読者が情報の断片から真相を再構築するような構造にする。感情的な表現は避け、現象を記述する冷徹な語り口を用いること。
