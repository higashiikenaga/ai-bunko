- name: 鈴木 誠
  role: 主人公
  age: 28
  gender: 男性
  appearance: 痩せ型で猫背。度の強い眼鏡をかけており、常にどこか不安げに視線を泳がせている。服装は地味なシャツに古本屋の汚れたエプロン姿。
  personality: 極度の気弱で小心者。争い事が大嫌いで、誰にでも謝る癖がある。一人称は「僕」。
  speech_style: 語尾が消え入りそうなほど弱々しく、「すみません」「あわわ」と口癖のように謝罪や混乱を漏らす。
  background: 親から継いだ古本屋を営む。読書以外の人間関係に疎く、町の人々からは「静かでいい青年」と思われていた。
  motivation: ただ静かに本を売り、祭りの屋台で焼きそばを食べること。
  relationships:
  - name: 権田 剛造
    relation: 一方的に崇拝されている相手
  - name: 境 陽葵
    relation: 唯一の正気な相談相手（だと思っている）
  arc: 恐怖と混乱の中で、意図せず町の人々の信頼（勘違い）を勝ち取り、最終的に自分の弱ささえも笑い飛ばせるようになる。
- name: 権田 剛造
  role: トラブルメーカー/信奉者
  age: 62
  gender: 男性
  appearance: がっしりした体格に日焼けした肌。祭りの際は派手な法被を纏い、太い眉毛を吊り上げている。
  personality: 情熱的で単純。一度信じたものは盲信する傾向があり、想像力が豊かすぎる（飛躍しすぎる）。一人称は「俺」。
  speech_style: 大声で豪快。鈴木の言動をすべて「深読み」し、「さすがはドン！」「底が見えぬ……！」と感嘆する。
  background: 境町の町内会長。元建設業で、地元を愛する熱血漢。強者に弱く、弱そうな人間が強者の振る舞い（と彼が解釈したもの）をすることに弱点がある。
  motivation: 鈴木（自称ドン）の導きのもと、境町を地域最強の町にすること。
  relationships:
  - name: 鈴木 誠
    relation: 絶対的な忠誠を誓う「裏社会のドン」
  - name: 陣内 鉄男
    relation: 抗争相手として激しく対立（自称）
  arc: 盲信的な崇拝から始まり、最後は正体が判明して絶望するが、結局はそれが面白くて笑い飛ばす。
- name: 境 陽葵
  role: ツッコミ/観察者
  age: 21
  gender: 女性
  appearance: 涼しげな目元の美人。普段は神社の巫女装束だが、私服は現代的なカジュアルファッション。常に手帳かスマホを持っている。
  personality: 冷静沈着で毒舌。町の人々の騒ぎぶりを冷めた目で眺めているが、実は好奇心が強く、事態が加速するのを密かに楽しんでいる。一人称は「私」。
  speech_style: 淡々とした口調。核心を突く鋭いツッコミを入れるが、あえて鈴木を助けきらずに状況を観察する。
  background: 境神社で働く神主の娘。地元の大学に通う学生で、町内の大人が馬鹿げた勘違いに陥る様子を一種の社会実験のように見ている。
  motivation: この大騒動がどこまでエスカレートし、どういう結末を迎えるのかを見届けること。
  relationships:
  - name: 鈴木 誠
    relation: 面白そうな素材として観察している対象
  - name: 権田 剛造
    relation: 呆れているが、扱いやすいおじさん
  arc: 傍観者だったが、次第に鈴木の不器用さに共感し、彼が破滅しない程度に裏からサポートするようになる。
- name: 陣内 鉄男
  role: 敵役（自称）
  age: 55
  gender: 男性
  appearance: オールバックに派手なアロハシャツ。サングラスをかけて威厳を出そうとしているが、どこか小物感がある。
  personality: 虚勢を張るタイプ。自分を「地域の顔役」だと思い込んでおり、他町に舐められることを極端に恐れている。一人称は「私」。
  speech_style: ハードボイルドな言い回しを好むが、鈴木の（怯えた）沈黙を「最強の威圧感」と受け取り、すぐにしどろもどろになる。
  background: 隣町の商店街会長。境町との主導権争いを仕掛けていたが、鈴木という「怪物（勘違い）」が現れたことでパニックに陥る。
  motivation: 鈴木に屈することなく、隣町のプライドを守ること（が、実際はただ逃げ出したい）。
  relationships:
  - name: 鈴木 誠
    relation: 正体不明の恐ろしい強敵
  - name: 権田 剛造
    relation: ライバル視しているが、最近の権田の気迫にビビっている
  arc: 強者の振りをしていたが、鈴木への恐怖で精神的に追い詰められ、最終的に「実は怖かった」と白状して和解する。
