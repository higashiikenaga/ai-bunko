title: 境町の縁日は、なぜか全裸大騒動の予感がする
genre: 日常ほのぼの
tone: 勘違いが雪だるま式に膨らむハイテンション・コメディ
pov: 三人称
tense: 過去形
setting: 現代の地方都市・境町の古びた商店街と神社
premise: 気弱な古本屋店主・鈴木は、祭りの夜に拾った一冊の奇妙な古書をきっかけに、町内中から「伝説の裏社会のドン」として崇められてしまう。本に挟まれていたしおりのメモを「抗争の暗号」と盛大に誤解した住民たちは、鈴木のビビり散らす姿すら「底知れぬ余裕の笑み」と脳内変換し、事態は取り返しのつかない大勘違いの渦へと突入していく。果たして、鈴木の平和な日常とズボンの安全は守られるのか。
themes:
- 盛大な勘違い
- 地域住民の暴走
- 平和な日常
rules:
- 鈴木の行動や発言はすべて、周囲の勝手な妄想によって「凶悪な裏社会の計画」として解釈される。
- 古本屋の在庫はただの古雑誌だが、住民には「禁断の機密文書」に見えている。
plot_outline:
- '序盤: 鈴木が古本屋の棚の奥から「極秘」と書かれた落書き入りの古書を発見し、その日の夜の祭りに繰り出す。'
- '中盤: 祭りの会場で鈴木が落としたレシートと飴玉が、町内会長らに「テロの犯行予告と買収工作」と完璧に誤認される。'
- '終盤: 鈴木がただ焼きそばを欲しがっているだけなのに、住民たちが命がけで他所の町との「抗争」の準備を始めてしまう。'
- '結末: 全ての勘違いが最高潮に達した瞬間、古書の正体がただの「昔の小学生の交換日記」と判明し、盛大なズッコケと共に平和が訪れる。'
style_notes: 真鍋コトの文体。三人称の語り手による容赦ないツッコミの地の文を多用し、登場人物たちの脳内暴走とすれ違いをテンポよく、かつ雪だるま式に大げさに描写する。伏線はすべてギャグとして回収する。
