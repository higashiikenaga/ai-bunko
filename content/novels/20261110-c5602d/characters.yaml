- name: 佐藤 健太
  role: 主人公
  age: 22
  gender: 男性
  appearance: おっとりした垂れ目に、どこにでもいそうな平凡な身なり。常に困ったような、穏やかな笑みを浮かべている。
  personality: 極めて善良で押しに弱く、空気が読めない。一人称は「ぼく」。他人のために動くことが習慣化しており、断ることができない。
  speech_style: 丁寧語で、語尾がふんわりしている。「あ、すみません」「どうしましょうか」が口癖。
  background: 大学を卒業したばかりの就職活動中。争い事が大嫌いで、幼少期から「いい子」として育てられたため、自分の意見を出すよりも相手に合わせる傾向がある。
  motivation: 拾ったメモを元の持ち主に届け、平穏な日常の中で心地よい昼寝をすること。
  relationships:
  - name: 五郎
    relation: 勘違いの起点となったパン屋の店主
  - name: 里奈
    relation: 自分を聖者として神格化させる物語の構築者
  - name: 武田
    relation: 当初は不審者扱いされていたが、後に心酔される警察官
  arc: 意図せず街の英雄となるが、最後まで自分の善意がどう解釈されたか気づかず、結果的に心からの安眠を得る。
- name: 五郎
  role: 勘違いの加速装置
  age: 45
  gender: 男性
  appearance: 小麦粉がついたエプロン姿。恰幅が良く、常に血走ったような情熱的な目をしている。
  personality: 情熱的で想像力が豊かすぎる。一人称は「俺」。日常の些細な出来事をスパイ映画や陰謀論に結びつける癖がある。
  speech_style: 声が大きく、断定的な言い方をする。「これは合図だ！」「運命の歯車が回ったぞ！」など。
  background: 街の老舗パン屋の店主。眠らない街のハイテンションに完全に同調しており、刺激的な展開を常に求めている。
  motivation: 退屈な日常を打破する「歴史的事件」の当事者になりたい。
  relationships:
  - name: 佐藤 健太
    relation: 世界を揺るがす暗号を届けに来た謎の使者だと思い込んでいる
  arc: 佐藤への不信感を瞬時に狂信的な信頼へと変え、街全体に「救世主説」を広める扇動者となる。
- name: 里奈
  role: 物語の編纂者
  age: 28
  gender: 女性
  appearance: 大きな眼鏡をかけ、常にメモ帳とタブレットを持ち歩いている。知的だがどこか浮世離れした雰囲気。
  personality: 分析的だが妄想癖が激しい。一人称は「私」。事象に「意味」を見出すことに快感を覚えるタイプ。
  speech_style: 早口で理屈っぽい。専門用語を混ぜながら、佐藤の行動を神話的に解釈して解説する。
  background: 地元で活動する自称・都市歴史研究家（実態はただの噂好きのブロガー）。街の伝説を作ることに情熱を注いでいる。
  motivation: この街に語り継がれるような「伝説の救世主」の物語を完成させること。
  relationships:
  - name: 佐藤 健太
    relation: 自身の理論を体現する完璧な「聖者」として観察・崇拝している
  arc: 佐藤の単純な謝罪や行動を「高度な暗喩」として体系化し、住民たちの熱狂を理論的に正当化させる。
- name: 武田
  role: 常識人の崩壊
  age: 25
  gender: 男性
  appearance: きっちりとした警察制服。短髪で鋭い眼差しを持つが、精神的な余裕が少ない。
  personality: 真面目で規律を重んじる。一人称は「僕」。最初は唯一の常識人として振る舞うが、集団心理に弱い。
  speech_style: 硬い口調。最初は「いい加減にしてください」と怒鳴るが、次第に「佐藤さんの御意」と敬語になる。
  background: この街に配属されたばかりの新米警官。街の異常なテンションに戸惑い、正気な人間を求めていた。
  motivation: 街の治安維持と、異常な騒動の鎮圧。
  relationships:
  - name: 佐藤 健太
    relation: 不審者から、守るべき至高の存在へと認識が変化する
  arc: 徹底的に佐藤を疑うが、彼のあまりに純粋な善意（と都合の良いタイミング）に触れ、誰よりも熱狂的な信奉者へと転落する。
