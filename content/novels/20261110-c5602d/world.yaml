title: 約束の丘で、ぼくの善意が爆発しました
genre: 日常ほのぼの
tone: コメディ、ハイテンション、勘違い、ドタバタ
pov: 三人称
tense: 過去形
setting: 現代、深夜まで商店街が賑わい、住民のテンションが異常に高い「眠らない街」
premise: 善良すぎて空気が読めない青年・佐藤は、ただの親切心で「約束の丘」に落ちていたメモを届けようとする。しかし、その些細な行動が「眠らない街」の住人たちの間で、歴史を揺るがす重大な暗号や、壮大な運命の物語として勝手に解釈されてしまう。善意が雪だるま式に膨れ上がり、街全体を巻き込んだ巨大な勘違いの渦へと発展していく、制御不能な日常コメディ。
themes:
- 善意の暴走
- コミュニケーションの致命的なズレ
rules:
- 街の住人は、一度抱いた勘違いを修正するよりも、それを正当化する理由を見つける方が得意である
- 主人公の些細な動作や言い間違いは、必ず周囲によって「深遠な意味を持つ儀式」や「高度な知略」として解釈される
plot_outline:
- '序盤: 佐藤が丘で拾った「明日、パン屋へ」という走り書きのメモを届けようとしたところ、パン屋の店主が「これは暗殺の合図か！？」と勘違いし、街中に緊張が走る。'
- '中盤: 勘違いは止まらず、佐藤の「すみません」という謝罪が「聖者の慈愛」として崇められ始める。彼はただの謝罪のつもりだが、街の人々は彼を「眠らない街の救世主」として扱い、次々と無理な期待を寄せてくる。'
- '終盤: 全ての勘違いが極限に達し、街の人々が「救世主の降臨」を祝うために約束の丘へ大集結。佐藤がただ昼寝をしようと丘に登っただけなのに、人々はそれを「世界を変えるための瞑想」だと信じ込み、熱狂の渦に包まれる。'
- '結末: 結局、騒動の元となったメモは、ただの「パンの買い出しリスト」だったことが判明。全ての伏線が「単なる日常の些細なこと」として回収され、佐藤は静かに（そして大騒ぎの中で）昼寝を完遂する。'
style_notes: 三人称視点による、キレのあるツッコミを交えた地の文。キャラクターの深刻な表情と、事態のくだらなさのギャップを強調すること。伏線は「一見無意味な小道具」や「誰かの噛んだ言葉」として提示し、終盤でギャグとして鮮やかに回収する。毎話、読者の予想を裏切る勘違いの飛躍と、テンポの良いオチを徹底すること。
