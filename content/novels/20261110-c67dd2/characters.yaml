- name: エリアナ・フォン・アステリア
  role: 主人公
  age: 19
  gender: 女性
  appearance: 淡い銀色の長髪に、深い海を思わせるサファイア色の瞳。没落し色褪せた、しかし気品ある絹のドレスを纏っている。
  personality: 芯が強く、忍耐強い。礼儀正しいが、内面には現状を打破したいという静かな情熱を秘めている。一人称は「私」。
  speech_style: 丁寧で控えめな貴族言葉。感情が高ぶると言葉数が少なくなる傾向がある。
  background: かつて帝国の星読みを担った名家アステリア家の令嬢。家名が失墜し、今は屋敷の片隅で静かに暮らしているが、代々伝わる「星図の刺繍が入った衣」を密かに所有している。
  motivation: 失われた家名を取り戻し、自分自身の足で生きていくための自由を得ること。
  relationships:
  - name: ジュリアン・ソーン
    relation: 利害の一致による危うい協力関係
  - name: シルヴァン
    relation: 正体不明ながら、魂の共鳴を感じる理解者
  arc: 運命に翻弄される「犠牲者」から、自らの意志で星図の真実を導き出す「開拓者」へと成長する。
- name: ジュリアン・ソーン
  role: ライバル/敵役
  age: 27
  gender: 男性
  appearance: 金縁の眼鏡をかけ、隙のない完璧な黒のタキシードを着用。指先には常に希少な宝石のリングを光らせている。
  personality: 計算高く、野心的。目的のためには手段を選ばないが、美学に反することだけは嫌う。一人称は「僕」。
  speech_style: 流暢で説得力のある話し方。相手の懐に入るのがうまく、皮肉を混ぜた話し方を好む。
  background: 平民出身から類稀なる商才で帝国最大の宝石商に登り詰めた男。血統至上主義の宮廷に潜り込み、権力の頂点に立つことを切望している。
  motivation: 星図を手に入れ、帝国の繁栄の鍵を握ることで、誰にも否定できない絶対的な権力を得ること。
  relationships:
  - name: エリアナ・フォン・アステリア
    relation: 利用価値のある駒だと思っていたが、次第に彼女の気高さに惹かれていく
  - name: シルヴァン
    relation: 正体を見抜こうとする警戒対象
  arc: 数字と権力のみを信じていたが、偽りの自分を脱ぎ捨て、本当の「価値」とは何かを見出す。
- name: シルヴァン
  role: 相棒/トリックスター
  age: 24
  gender: 中性
  appearance: 仮面で顔の上半分を隠している。光の当たり方で色を変える鱗のような素材の衣装を纏い、しなやかな身のこなしを持つ。
  personality: 捉えどころがなく、奔放。常に冗談めかしているが、鋭い観察眼で周囲のすべてを見通している。一人称は「僕」または「俺」。
  speech_style: 詩的で曖昧な言い回しを多用し、核心をはぐらかす話し方。
  background: 宮廷に雇われた正体不明の舞踏手。実は隣国から派遣されたスパイであり、星図がもたらす政治的混乱を監視する任務を帯びている。
  motivation: 星図の真実を突き止め、それをあるべき場所へ戻すこと（あるいは破棄すること）。
  relationships:
  - name: エリアナ・フォン・アステリア
    relation: 彼女が持つ純粋さに興味を持ち、密かにサポートする
  - name: ジュリアン・ソーン
    relation: 互いの化けの皮を剥ぎ合おうとするゲーム相手
  arc: 任務という「役割」に縛られていたが、エリアナとの交流を通じて、仮面を捨てて自分自身の人生を歩むことを決意する。
