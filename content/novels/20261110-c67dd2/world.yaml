title: 銀冠の舞踏会と、星図を秘めた絹の衣
genre: 群像劇
tone: 華麗、優雅、耽美的
pov: 三人称
tense: 過去形
setting: 幻想的な海洋帝国「ルミナス」の宮廷
premise: 帝国の繁栄を約束するとされる「天空の星図」が、ある名匠の刺繍の中に隠されているという伝説が、社交界の深淵で囁かれる。没落の淵にある令嬢、野心を抱く宝石商、そして正体不明の舞踏手。彼らは、鏡に映る偽りの自分を演じながら、豪華絢爛な舞踏会で秘密の地図を巡る罠へと足を踏み入れていく。煌めく宝石と、絹の衣擦れが交錯するなか、運命の歯車が静かに回り始める。
themes:
- 虚飾と真実
- 宿命的な愛
rules:
- 貴族の地位は、身に纏う衣装の格式と、舞踏会での振る舞いによって厳格に決定される。
- 宮廷の鏡は、嘘をつく者の顔を曇らせるという伝承がある。
plot_outline:
- '序盤: 帝国の祝祭「銀冠の舞踏会」を控え、社交界には不穏な噂が流れる。伝説の星図を求める者たちが、それぞれ異なる目的を持って宮廷へ集う。'
- '中盤: 豪華なドレスと宝石が彩る夜会。鏡の迷宮のような回廊で、密かな密談と陰謀が渦巻く。令嬢は刺繍に隠された地図の存在を知り、運命に翻弄される。'
- '終盤: 舞踏会の最高潮、地図の奪い合いが激化し、隠されていた真実が白日の下に晒される。愛と裏切りが、華やかな旋律の中で交差する。'
- '結末: 陰謀は霧散し、生き残った者たちは、鏡に映る己の真実の姿を見つめ、新たな夜明けへと歩み出す。'
style_notes: 絹の衣擦れ、宝石の瞬き、舞踏会の旋律を、まるで絵画を描くかのように装飾的な修辞を用いて描写すること。登場人物の感情は、瞳の揺らぎや指先の震え、纏うドレスの色調の変化といった、優雅なメタファーを通じて表現すること。
