- name: 瀬戸 航平（せと こうへい）
  role: 主人公
  age: 26
  gender: 男性
  appearance: 都会的で清潔感があるが、少し疲れの見える顔立ち。眼鏡をかけている。
  personality: 論理的で慎重派。未知の現象を否定しようとするが、内面に孤独を抱えている。一人称は「僕」。
  speech_style: 丁寧だが、動揺すると早口になる。
  background: 都内の出版社に勤める編集者。亡くなった祖母の遺品整理のために、数年ぶりに凪ヶ浦を訪れる。
  motivation: 祖母の死の真相と、凪ヶ浦に漂う違和感の正体を突き止めること。
  relationships:
  - name: 凪の姉妹
    relation: 出会い、惹かれ、そして恐怖の対象となる存在
  - name: 祖母
    relation: 遺品を通じて呪いの繋がりを持つ人物
  arc: 合理的な都会人から、逃れられない血の因縁と怪異に侵食され、精神的に追い詰められていく。
- name: 凪（なぎ）
  role: 敵役（怪異）
  age: 20
  gender: 女性
  appearance: 透き通るような白い肌、濡れたような黒髪。どこか儚げで、瞳に光がない。
  personality: 穏やかで慈愛に満ちているように見えるが、その実、執着心が異常に強い。一人称は「私」。
  speech_style: 静かで、耳元で囁くような、湿度を感じさせる話し方。
  background: かつて村の儀式によって海へ「半分」として捨てられた存在の記憶を持つ。灯台に佇む。
  motivation: 主人公を「こちら側」へ連れて行き、欠けた自分を埋めること。
  relationships:
  - name: 潮（うしお）
    relation: 瓜二つの姿をした姉妹（あるいは影）
  - name: 瀬戸 航平
    relation: 運命によって引き寄せられた、迎え入れるべき対象
  arc: 静かな誘い手から、逃れられない恐怖の象徴へと変貌する。
- name: 潮（うしお）
  role: 脇役（怪異）
  age: 20
  gender: 女性
  appearance: 凪と瓜二つだが、どこか刺々しく、常に不機嫌そうな表情を浮かべている。
  personality: 攻撃的で、人間に対して強い拒絶反応を示す。一人称は「あたし」。
  speech_style: ぶっきらぼうで、突き放すような、荒い口調。
  background: 凪と対になる存在。凪が「静」なら潮は「動」を象徴し、村の呪いの激しさを体現している。
  motivation: 村の理不尽な習わしを維持すること、あるいは破壊すること。
  relationships:
  - name: 凪
    relation: 鏡合わせの存在
  - name: 瀬戸 航平
    relation: 不快な侵入者
  arc: 物語の緊張感を高める狂言回しとして、主人公を追い詰める役割を果たす。
- name: 村長・源次（げんじ）
  role: 脇役（人間）
  age: 68
  gender: 男性
  appearance: 日焼けした深い皺の刻まれた顔。常に長靴を履き、潮の匂いが染み付いている。
  personality: 排他的で頑固。村の伝統を守ることを絶対視している。一人称は「俺」。
  speech_style: 威圧的で、含みのある言い回しを好む。
  background: 凪ヶ浦の伝統的な儀式を司る一族の長。主人公の祖母の過去も知っている。
  motivation: 村の因習を守り、海からの災厄を鎮め続けること。
  relationships:
  - name: 瀬戸 航平
    relation: 厄災を呼び込むよそ者
  arc: 主人公に村の忌まわしい真実を突きつける、壁のような存在。
