title: 濡れ潮の呼び声
genre: ホラー
tone: 湿り気を帯びた、静謐で陰鬱な和風ホラー
pov: 三人称
tense: 過去形
setting: 現代。地図から消えかけた、常に濃霧に包まれた寂れた漁村『凪ヶ浦』
premise: 祖母の遺品整理に訪れた主人公は、村の外れに立つ、今は使われていない古い灯台に惹きつけられる。そこで出会ったのは、鏡合わせのように瓜二つの姿をした、正体不明の女二人だった。潮の香りと共に忍び寄る、逃れられぬ血の呪いと、海に捨てられた「半分」の記憶が彼を飲み込んでいく。
themes:
- 喪失と執着
- 境界線の曖昧さ
rules:
- 灯台の灯りは船を導くためではなく、海から這い上がる『何か』を追い返すために点されていた
- この村の双子は、片方が生きるために片方が海に捧げられるという密かな習わしがある
- 霧が濃い夜、耳に届く囁き声に答えてはいけない
plot_outline:
- '序盤: 主人公が凪ヶ浦を訪れ、村人の排他的な態度と、常に漂う生臭い潮の匂いに不快感を覚える。廃灯台で、互いに正反対の性格を持つ双子の女と出会う。'
- '中盤: 女たちとの交流を通じて、村に伝わる忌まわしい習わしと、祖母が隠していた過去を知る。夜な夜な、家の中に濡れた足跡がつき、壁の裏から爪でひっかくような音が聞こえ始める。'
- '終盤: 嵐の夜、灯台の灯火が消え、海から「かつて捨てられた側」の者たちが村へ押し寄せる。双子の女の一人が、実はすでにこの世のものではないことが判明し、主人公を海へと誘おうとする。'
- '結末: 主人公は辛うじて村を脱出するが、鏡を見るたびに自分の背後に濡れた女の気配を感じるようになり、体からは消えない潮の香りが漂い続ける。'
style_notes: 腐った海藻や古い畳の匂い、濡れた足が床に張り付く粘り気のある音など、嗅覚と聴覚を刺激する描写を徹底する。会話文には土着的な方言を混ぜ、不気味さを演出する。怪異の正体は「形」として具体的に描写せず、影や気配、部分的な断片として表現し、読者の想像力に恐怖を委ねる。
