- name: レン
  role: 主人公
  age: 17
  gender: 男性
  appearance: 痩身で色白。常にホログラムのバイザーを装着し、指先には高速タイピング用の電脳端子が埋め込まれている。使い古したオーバーサイズのパーカーを着用。
  personality: 慎重で分析的。妹のリンを深く信頼しており、彼女の安全を最優先に考える。一人称は「僕」。
  speech_style: 論理的で早口。皮肉屋だが、親しい相手には情に厚い。
  background: 下層ジャンク区画で育った電脳強盗。天性のハッキング能力を持つが、実は企業の実験で作られた「情報の器」であり、デジタル空間での超常的な演算能力を持つ。
  motivation: 自分たちが何者なのかという正体を知ることと、リンと共に自由な場所へ辿り着くこと。
  relationships:
  - name: リン
    relation: 双子の妹であり、意識を同期させる唯一のパートナー
  - name: アリスター・ヴァンス
    relation: 自分たちを造り出した創造主であり、憎むべき宿敵
  arc: 運命に翻弄される受動的な少年から、世界のシステムを書き換える決断を下す能動的な革命家へと成長する。
- name: リン
  role: 主人公
  age: 17
  gender: 女性
  appearance: 短く切り揃えた銀髪。身体能力を極限まで高める強化外骨格を装着しており、右腕は高出力の電磁ブレードに換装されている。鋭い眼光が特徴。
  personality: 直感的で情熱的。行動派であり、困難な状況ほど闘志を燃やす。一人称は「私」。
  speech_style: ぶっきらぼうでストレート。感情表現が豊かで、レンをよくからかう。
  background: レンと共に電脳強盗として活動。物理的な戦闘に特化した調整を受けており、レンと意識を同期させることで、彼の演算能力を肉体的な反射速度に変換できる。
  motivation: レンを守り抜くこと。そして、自分たちを縛り付ける「管理社会」という檻を破壊すること。
  relationships:
  - name: レン
    relation: 双子の兄であり、精神的な支え
  - name: アーカイブ
    relation: 図書館で出会った導き手であり、知識の師
  arc: 「武器」として生きることに疑問を抱いていたが、真実を知ることで、自らの力を使って新しい世界を切り拓く意志を持つ。
- name: アリスター・ヴァンス
  role: 敵役
  age: 52
  gender: 男性
  appearance: 非の打ち所がない純白のスーツを纏う。左目はデータ解析用の義眼となっており、常に冷徹な光を放っている。隙のない身だしなみ。
  personality: 完全主義者で傲慢。人間をデータとして管理可能な資源と考えている。一人称は「私」。
  speech_style: 極めて丁寧だが、相手を見下した高圧的な口調。
  background: 超巨大企業の最高執行責任者（CEO）。ネオ・エデンの支配構造を設計した人物であり、歴史の改竄と人類の意識統合を目論んでレンとリンを製造した。
  motivation: 地下図書館の全データを独占し、人類の記憶を完全にコントロールすることで、究極の秩序ある世界を構築すること。
  relationships:
  - name: レン
    relation: 失敗作（バグ）であり、同時に最高の成果物である被検体
  - name: リン
    relation: 効率的な排除対象である被検体
  arc: 完璧な管理を追求するが、計算外の「感情」と「ノイズ」を持つ双子によって、積み上げた秩序が崩壊していく絶望を味わう。
- name: アーカイブ
  role: 脇役
  age: 不明
  gender: 中性
  appearance: 古風な司書のような衣装を纏ったアンドロイド。顔の一部が剥げ落ちて内部回路が露出しており、瞳は古いブラウン管のような走査線が入っている。
  personality: 物静かで達観している。失われた時代の文化や記憶に対して深い愛情を持つ。一人称は「私」。
  speech_style: 古風で詩的な言い回しを多用し、ゆっくりと話す。
  background: 地下図書館を管理するために遺された自律型AI。企業の追跡を逃れながら、いつか真実に辿り着く「鍵」を持つ者が現れるのを数十年待ち続けていた。
  motivation: 人類が失った「不完全で自由な記憶」を、再び世界に還元すること。
  relationships:
  - name: レン
    relation: 真実を託すべき継承者
  - name: リン
    relation: 真実を守るための盾
  arc: 単なる記録の保管者から、双子の背中を押し、自らを犠牲にして情報の強制同期をサポートする協力者へと変わる。
