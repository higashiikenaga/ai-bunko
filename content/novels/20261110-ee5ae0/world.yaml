title: ノイズの深淵：双子の断片と禁じられた記憶
genre: サイバーパンク
tone: ハイスピード・ハードボイルド
pov: 三人称
tense: 過去形
setting: 超巨大垂直都市「ネオ・エデン」。光り輝く上層の電脳区画と、廃棄物と情報の塵が舞う下層のジャンク区画に分断された世界。
premise: 意識の同期（シンクロ）を持つ双子の兄妹、レンとリン。彼らは、デジタル化された社会で唯一「物理的記録」を保管する地下図書館の存在を知る。企業追跡部隊の銃火を潜り抜け、二人が辿り着いた真実は、自分たちの存在そのものが巨大企業の「バグ」であるという衝撃的な事実だった。加速する銃撃とデータ戦の中、彼らは世界の再起動（リブート）を選択する。
themes:
- 個のアイデンティティ
- 情報の独占と真実
rules:
- 全市民は脳内チップによってネットワークへ常時接続されている
- 「地下図書館」に収められた物理データは、ネットワークから完全に遮断された特異点である
- 双子のシンクロ・リンクは、感覚と痛みを共有する強力な武器だが、過負荷は精神崩壊を招く
plot_outline:
- '序盤: 電脳強盗として活動するレンとリン。任務中に、ネットワークから消されたはずの「物理的な鍵」を奪取。追っ手との激しい市街地チェイスを展開し、地下図書館の入り口を見出す。'
- '中盤: 地下図書館への潜入。そこは、失われた人類の「生」の記録が詰まった迷宮だった。二人はそこで、自分たちが企業の実験によって作られた「情報の器」であることを知る。企業は図書館のデータを独占し、歴史を改ざんしようとしていた。'
- '終盤: 企業の最高執行責任者（CEO）が率いる特殊部隊による、図書館への総攻撃。レンの電脳戦とリンの肉体戦が連動し、物理とデジタルの境界が崩壊する中での決死の突破劇。'
- '結末: 全世界のネットワークに、図書館の「真実」を強制同期させる。システムの崩壊と共に、双子は「器」としての役割を捨て、ノイズに満ちた自由な世界へと駆け出していく。'
style_notes: 短文による畳み掛けを徹底。アクションシーンでは「ドン」「バキッ」といった擬音を極力排除し、弾丸の軌道、肉体の衝撃、火花の散り方といった動きの描写でスピード感を出す。会話の掛け合いを多用してテンポを作り、場面転換は鋭く。各話の末尾には、必ず読者の予測を裏切り、次を読まずにはいられない強烈な引きを用意すること。
