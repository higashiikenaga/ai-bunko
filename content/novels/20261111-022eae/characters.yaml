- name: 佐倉 ニコ
  role: 主人公
  age: 16
  gender: 女性
  appearance: 清潔感のあるショートヘア。図書委員の制服に、使い込まれたエプロンを身に着けている。観察力が鋭い瞳。
  personality: 真面目で几帳面、少し心配性。ルールを重んじるが、困っている人を見過ごせない。一人称：私
  speech_style: 丁寧で落ち着いた話し方。真剣な場面では少し早口になる癖がある。
  background: 海辺の町の高校に通う生徒。幼い頃から地下図書館の静かな空間に救われてきた。
  motivation: 消えた「青い栞」を必ず見つけ出し、図書館の秩序を守ること。
  relationships:
  - name: テト
    relation: 調査を共にする協力者
  - name: モモ
    relation: 尊敬する管理人
  arc: 正解やルールを求める少女が、不完全なものや「迷子になった優しさ」を受け入れられるようになる。
- name: 海野 テト
  role: 相棒
  age: 25
  gender: 男性
  appearance: リラックスしたリネンシャツのスタイル。穏やかな目元と、コーヒーの香りがする温かい手。
  personality: おおらかで包容力がある。町の噂や人々の事情に詳しい。一人称：僕
  speech_style: 親しみやすく、ゆったりとした口調。相手の緊張を解くような話し方。
  relationships:
  - name: ニコ
    relation: 放っておけない大切な協力者
  - name: モモ
    relation: 信頼を寄せる常連客
  background: 教会のすぐそばで、潮風を感じる小さなカフェを営む店主。町の人々の相談役。
  motivation: ニコの不安を取り除き、町に流れる不思議な変化の正体を突き止めること。
  arc: 日常の平穏を守るだけでなく、過去の記憶が持つ力と向き合う勇気を持つ。
- name: ルル
  role: 重要人物
  age: 13
  gender: 女性
  appearance: 透き通るような肌。少し大きめの夏服を着ており、どこか現実離れした儚い雰囲気。
  personality: 物静かで直感に優れる。言葉数は少ないが、核心を突く。一人称：私
  speech_style: 囁くような、詩的な響きを持つ独特の話し方。
  background: 夏祭りの準備が始まる頃、ふらりと町に現れた謎の少女。古い手紙を大切に持っている。
  motivation: 自分が持っている手紙に記された「物語」の結末を見つけること。
  relationships:
  - name: モモ
    relation: 図書館の守り手
  - name: ニコ
    relation: 不思議な絆を感じる友人
  arc: 孤独な漂流者から、町の思い出の一部として、人々の繋がりの中に居場所を見つける。
- name: モモ
  role: 導き手
  age: 42
  gender: 女性
  appearance: 上品だが飾り気のない装い。古い紙のような香りがする、長い髪をまとめている。
  personality: 冷静で慈愛に満ちている。全てを包み込むような包容力を持つ。一人称：私
  speech_style: 穏やかで、リズム感のあるゆったりとした話し方。
  background: 地下図書館の管理人。町の記憶が本となって眠る場所を長年守り続けている。
  motivation: 図書館に眠る大切な記憶と、人々のささやかな願いを守ること。
  relationships:
  - name: ニコ
    relation: 見守るべき教え子のような存在
  - name: テト
    relation: 町の平和を共に支える理解者
  arc: 守るべきものを失うという経験を通じ、新しい世代へ想いを繋ぐ喜びを再確認する。
