title: 月明かりの地下書庫と、願いを運ぶ青い栞
genre: 群像劇
tone: 穏やかで、どこか懐かしい、温かなミステリー
pov: 三人称
tense: 過去形
setting: 海辺の静かな町。町の古い教会の地下に、迷宮のように広がる「地下図書館」が存在する。
premise: 海辺の町に伝わる、人々の思い出が本となって眠る「地下図書館」。ある夏、図書委員のニコは、図書館の守り神とも言える大切な「青い栞」が消えたことに気づく。カフェを営むテトや、どこからかやってきた少女のルル、そして管理人モモ。それぞれの視点から、祭りの準備が進む町の中で、消えた栞の足跡を追いかけていく。それは、誰かのささやかな優しさが迷子になっていた、優しい謎解きの物語。
themes:
- 記憶の継承
- 日常に隠れた善意
rules:
- 地下図書館の書物は、持ち主の想いに反応して微かに光る性質を持つ
- 謎の解決は、犯人を糾弾するのではなく、誰かの願いを知ることで完結する
plot_outline:
- '序盤: 図書館の管理人モモが、大切にしていた青い栞の紛失に気づく。ニコとテトが協力して、祭りの準備が進む町の中で、栞が最後に残した「かすかな光」の手がかりを探し始める。'
- '中盤: 図書館に迷い込んだルルが、古い手紙をきっかけに物語の核心へ触れる。ニコ、テト、ルル、モモの視点が交差する中で、町の人々が過去に受け取った「小さな恩」が点と点のように繋がり始める。'
- '終盤: 祭りの夜、提灯の明かりが地下へと降り注ぐ中、栞が隠されていた理由が明らかになる。それは、誰かの大切な願いを叶えるために、誰かがそっと手助けをしようとした、ささやかないたずらだった。'
- '結末: 栞は無事に持ち主のもとへ戻り、地下図書館にはまた静かな時間が流れる。登場人物たちは、祭りの喧騒の中で、互いの存在を少しだけ温かく感じながら、日常へと戻っていく。'
style_notes: 朝霧ゆいとしての文体を徹底する。登場人物は「ニコ」「テト」「ルル」「モモ」のように、親しみを込めたあだ名で呼び合う。会話劇を中心に、日常の小さな違和感を丁寧に拾い上げ、論理的な推理よりも「人の心の動き」を紐解くことで謎を解く。読後に、祭りのあとの夜風のような、心地よい余韻が残る描写を心がける。
