- name: レン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 常に眠たげな半眼に、度の強い丸眼鏡。サイズの大きな古着の店員エプロンを着用している。
  personality: 好奇心旺盛で、事態が斜め上に転がることを至上の喜びとする享楽的な読書家。一人称は「僕」。
  speech_style: 丁寧だが、含みを持たせた言い回しが多く、相手の誤解を誘う誘導尋問のような話し方。
  background: 元々は名門大学の文学部だったが、「正解のある解釈」に飽きて退学。路地裏に店を構えた。
  motivation: 日常という物語を「読み間違え」によってドラマチックに書き換えること。
  relationships:
  - name: ミナ
    relation: 最高の「読み間違い」を提供してくれる客であり、観察対象
  - name: ゴロウ
    relation: 都合よく事態を大騒ぎしてくれる便利な権力者
  arc: 単なる観察者だったが、ミナとの交流を通じて「誰かの勘違いが誰かを救う」という心地よさを知り、より積極的に混乱を演出するようになる。
- name: ミナ
  role: ヒロイン
  age: 21
  gender: 女性
  appearance: 黒いオーバーサイズのパーカーで顔を半分隠している。鋭い目つきをしているが、実は緊張で凝視しているだけ。
  personality: 極度の人見知りで、緊張すると口数が減り、態度が不自然に硬くなる。一人称は「私」。
  speech_style: 短文でぶっきらぼう。緊張から声が低くなり、結果として「冷酷なプロ」のように聞こえる。
  background: 幼少期から読書に没頭し、ミステリーやスパイ小説に憧れていた。現実の人間関係に不器用すぎるため、つい「設定」に逃げがち。
  motivation: 誰にも邪魔されずに、自分の好きな本を静かに読みたい。
  relationships:
  - name: レン
    relation: 自分の挙動を肯定（誤解）してくれる、不思議で心地よい店主
  - name: ゴロウ
    relation: なぜか自分を伝説の暗殺者として敬う恐ろしい警察官
  arc: 「暗殺者」という擬似的な殻に閉じこもっていたが、街の人々に（勘違いで）受け入れられることで、少しずつ本当の自分を出す勇気を持つ。
- name: ゴロウ
  role: 脇役
  age: 45
  gender: 男性
  appearance: がっしりした体格に、常にしわくちゃのトレンチコート。目の下に深い隈があるベテラン刑事。
  personality: 正義感が強すぎるあまり、些細な違和感から壮大な陰謀論を組み立ててしまう妄想癖がある。一人称は「俺」。
  speech_style: ハードボイルドを気取った、低くしわがれた声。独り言で推理を披露する癖がある。
  background: 不夜城の治安維持を担う警察組織の中堅。事件が起きない平和な日々に飢えており、刺激を求めている。
  motivation: 街に潜む「見えない脅威」を暴き、市民の平和を守ること。
  relationships:
  - name: レン
    relation: 街の情報を握る怪しい情報屋だと思っている
  - name: ミナ
    relation: 世界を揺るがすほどの危険な能力を持つ潜入工作員だと思っている
  arc: 張り詰めた緊張感の中で空回りし続けるが、最終的に「勘違いによる平和」という新しい治安維持の形に納得し、精神的に余裕を持つ。
