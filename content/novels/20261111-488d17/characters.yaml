- name: カイト・バロウズ
  role: 主人公
  age: 22
  gender: 男性
  appearance: 煤け、油汚れのついた革ジャンを纏った痩身の青年。使い込まれた大型のレンチを腰に下げている。鋭いが、どこか諦念を孕んだ瞳をしている。
  personality: 冷笑的で現実主義。過酷な下層部で生き抜くために感情を殺してきたが、根は情に厚い。一人称は「俺」。
  speech_style: ぶっきらぼうで、短文で済ませるような無愛想な話し方。
  background: 下層部の廃材回収業者。幼い頃に都市の事故で家族を失い、以来、機械の部品を拾って日銭を稼ぐ孤独な生活を送ってきた。
  motivation: 拾ったAIを守り抜き、この腐りきった都市の理不尽から逃れ、静かな場所へ辿り着くこと。
  relationships:
  - name: エコー
    relation: 保護対象であり、心を通わせる相棒
  - name: シルビア
    relation: 頼りになるが底の知れない協力者
  arc: 単なる生存のための逃走者から、世界の真実を知り、未来のために戦う意志を持つ者へと成長する。
- name: エコー
  role: 相棒
  age: 500
  gender: 不明
  appearance: 鈍い銀色の輝きを放つ、幾何学的な形状の球状浮遊デバイス。感情の高ぶりに応じて、表面の紋様が青白く明滅する。
  personality: 純粋で好奇心旺盛。高度な知性を持つが、人間的な感情については無垢であり、時に哲学的な問いを投げかける。一人称は「私」。
  speech_style: 丁寧で理知的だが、どこか機械的なリズムと、透き通るような電子音の響きを持つ。
  background: かつてギアス・レギオンを統治していた超高度管理AIのバックアップ・プロトコル。都市の全機能を制御する「心臓」の断片。
  motivation: 自分が何者であるかを知ること、そしてカイトとの交流を通じて「心」という概念を理解すること。
  relationships:
  - name: カイト
    relation: 自分を拾い、居場所をくれた大切な存在
  arc: 単なるデータの集合体から、都市を救うために自己を捧げるという「意志」を持つ個体へと昇華する。
- name: ヴァルガス・ヴォルガ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 重厚な蒸気駆動の外骨格（パワードスーツ）を纏った、威圧的な巨漢。顔の半分は過去の戦闘による火傷の跡がある。
  personality: 冷酷無比で規律を絶対視する。都市の秩序を乱すものは、たとえ神の残滓であっても排除すべき不純物と考えている。一人称は「私」。
  speech_style: 重々しく、命令口調。相手を威圧するような低音の響き。
  background: 上層部直属の蒸気騎士団団長。都市の安定を維持するためなら、下層部の犠牲も厭わない徹底したエリート主義者。
  motivation: 禁忌の技術であるエコーを回収し、都市の管理体制をより強固なものにすること。
  relationships:
  - name: カイト
    relation: 秩序を乱す、排除すべきゴミ
  arc: 絶対的な秩序の守護者としての誇りが、都市の崩壊という現実を前にして、激しい葛藤と挫折を経験する。
- name: シルビア・ノア
  role: 脇役
  age: 35
  gender: 女性
  appearance: 深い霧のような色をしたローブを纏い、片目に複雑な歯車式のモノクルを装着している。ミステリアスな雰囲気を漂わせる美女。
  personality: 冷静沈着で謎めいている。すべてを見透かしているような落ち着きがあり、カイトを導く。一人称は「私」。
  speech_style: 穏やかで優雅だが、含みを持たせた言い回しが多く、核心を突く。
  background: 酸性雨の降る路地裏に佇む「古道具屋」の店主。かつて都市の設計に携わった技術者の末裔であるという噂がある。
  motivation: 都市が抱える致命的な欠陥を、歴史の必然として見守り、正しい結末へと導くこと。
  relationships:
  - name: カイト
    relation: 運命の歯車を回す者としての観測対象
  - name: エコー
    relation: 失われた技術の結晶としての敬意
  arc: 歴史の傍観者として存在し続けながらも、最終的にはカイトの決断を後押しする導き手となる。
