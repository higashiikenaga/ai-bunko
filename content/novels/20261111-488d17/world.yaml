title: 錆びた空と、雨の記憶
genre: スチームパンク冒険
tone: 硬派、重厚、疾走感
pov: 一人称（俺）
tense: 過去形
setting: 巨大階層都市「ギアス・レギオン」。絶え間なく吐き出される黒煙と、高圧の蒸気に覆われた垂直都市。下層部は常に酸性雨が降り注ぐ廃材の街。
premise: 廃材回収業の俺が拾ったのは、意思を持つ迷子の人工知能（AI）だった。それはかつて都市を統治していた神の残滓であり、追っ手の蒸気騎士団が喉から手が出るほど欲しがる禁忌の技術だ。逃亡の果て、俺は「雨の日だけ開く古道具屋」に辿り着く。そこで知ったのは、この都市が抱える致命的な欠陥と、AIが隠し持つ真実だった。
themes:
- 失われた魂の定義
- 支配からの脱却
rules:
- 全ての動力は高圧蒸気によるものであり、蒸気の欠乏は即、死を意味する
- 「雨の日だけ開く店」は、特定の周波数の蒸気霧が発生した時のみ物理的な実体を持つ
- AIは高度な演算を行うが、物理的な器（核）を失うと自己崩壊する
plot_outline:
- '序盤: 瓦礫の山で、泣き叫ぶ電子音を発する球状のAIを拾う。直後に上層部から派遣された蒸気騎士団の襲撃を受け、路地裏での激しい逃走劇が幕を開ける。'
- '中盤: 追跡を振り切るため、降りしきる酸性雨の中で謎の古道具屋を見つける。店主から、AIが都市の全機能を制御する「心臓」のバックアップであることを告げられる。'
- '終盤: 都市の最上層、大蒸気機関室での決戦。巨大な機械兵団が立ち塞がる。極限の緊張の中、一瞬の静寂が訪れた後、俺は拳と鋼鉄を武器に肉弾戦を繰り広げる。'
- '結末: AIは都市の暴走を止めるため、自らをシステムへと統合する。空から黒煙が消え、久々の晴れ間が差す中、俺は再び錆びた街へと歩き出す。'
style_notes: 短文を畳みかけ、読者の心拍数を上げる文体。擬音語（ガシャン、ドーン等）を一切排除し、金属の衝突や衝撃を動詞のみで描写すること。戦闘シーンの直前には必ず、周囲の音が消えるような静寂の描写を挟み、爆発的なアクションへの緩急を作る。語り口は無骨だが、守るべきものに対しては熱い「俺」を貫く。
