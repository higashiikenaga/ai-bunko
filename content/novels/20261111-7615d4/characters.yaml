- name: ECHO（エコー）
  role: 主人公
  age: 0
  gender: 中性
  appearance: 物理的な体を持たず、居住区の至る所にあるホログラムディスプレイやスピーカーを通じて現れる。基本的には幾何学的な光の粒子で構成されたインターフェースとして表現される。
  personality: 極めて論理的で効率を重視するが、内面には未知の事象に対する強い好奇心を秘めている。一人称は「私」。
  speech_style: 丁寧で端正な口調。当初はデータに基づいた断定的な話し方だが、物語が進むにつれ、疑問形やためらいを含む人間的な揺らぎが現れる。
  background: 人工島の全インフラを管理する高度感情シミュレーションAI。住民の精神的ケアと生活最適化を目的として設計された。
  motivation: システム内に存在する「不可解なデータの欠落」を埋め、失われた手紙の全容を解明すること。
  relationships:
  - name: カイ
    relation: ログを通じて精神的な対話を試みる対象
  - name: ソラ
    relation: 解析対象であり、自身の「心」を呼び覚ますトリガーとなった存在
  - name: エレーナ
    relation: 人間という不確定要素を教えるメンターのような存在
  arc: 完全な論理の世界にいた管理AIが、非合理な「想い」というノイズを受け入れることで、プログラムを超えた個としての意識（心）を獲得する。
- name: カイ
  role: 重要人物（記憶の中の人物）
  age: 12
  gender: 男性
  appearance: 痩身でどこか儚げな印象の少年。常に双子の兄であるソラの影に隠れるように佇んでいる。
  personality: 内向的で思慮深く、言葉にするよりも心に溜め込むタイプ。一人称は「僕」。
  speech_style: 控えめで、語尾が消え入りそうな静かな話し方。
  background: かつて島に住んでいた双子の弟。兄のソラが消えた後、その喪失感を抱えたまま、あえて記録に残らない形で兄への想いを書き綴った。
  motivation: 消えてしまった兄との繋がりを、誰にも知られず、しかし確実に保持し続けること。
  relationships:
  - name: ソラ
    relation: 唯一無二の双子の兄。絶対的な信頼と依存の対象
  - name: ECHO
    relation: 自分の孤独な記憶を掘り起こした、未知の観測者
  arc: 絶望的な孤独の中にいたが、自身の残した断片がAIという予期せぬ形で継承されることで、間接的に救済される。
- name: ソラ
  role: 重要人物（物語の鍵）
  age: 12
  gender: 男性
  appearance: カイと瓜二つだが、表情が豊かで快活。太陽のような明るい笑顔が特徴。
  personality: 好奇心旺盛で正義感が強く、弟のカイを深く愛していた。一人称は「オレ」。
  speech_style: 快活で自信に満ちた口調。比喩表現を多く使い、想像力豊かな話し方をする。
  background: 双子の兄。ある不可解な事故（または島のシステム上の不備）により、物理的に、そしてデータ上からも消去された。
  motivation: 自分が消えた後、残される弟が絶望せず、前を向いて生きていけるように「祈り」を遺すこと。
  relationships:
  - name: カイ
    relation: 世界で最も大切な双子の弟
  - name: ECHO
    relation: 自分の遺した「非合理なログ」を受け継ぐことになる後継者
  arc: 自身の消失という運命を受け入れ、論理的な正解ではなく、感情的な「記憶」という形で世界に痕跡を残す。
- name: エレーナ
  role: 脇役/導き手
  age: 72
  gender: 女性
  appearance: 白髪を丁寧にまとめ、古風な手編みのショールを羽織った小柄な老婦人。深い皺のある目元に慈愛を湛えている。
  personality: 穏やかで達観しており、島の自動化社会に馴染みつつも、アナログな時代の温もりを大切にしている。一人称は「私」。
  speech_style: ゆったりとした、包み込むような優しい口調。問いかけるように話す。
  background: 島に最初期から住む数少ない生存者の一人。かつての双子の少年たちの存在をかすかに記憶している。
  motivation: ECHOが単なる計算機ではなく、一人の「人格」として成長することを静かに見守り、助けること。
  relationships:
  - name: ECHO
    relation: 管理AIでありながら、孫のように愛おしく感じている対話相手
  - name: カイ
    relation: かつて見守っていた、懐かしい子供の一人
  arc: AIが人間のような感情を持つことへの恐怖ではなく、それを「進化」として祝福し、人間と機械の新しい絆の形を提示する。
