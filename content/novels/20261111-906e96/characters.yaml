- name: 弦次（げんじ）
  role: 主人公
  age: 32
  gender: 男
  appearance: 痩身で使い古された藍色の着物を纏う。疲弊した面持ちだが、眼光だけは鋭く、右手の掌に古い火傷の跡がある。
  personality: 寡黙で内省的。過去の栄光よりも現在の喪失感に囚われている。一人称は「俺」。
  speech_style: 低く、必要最低限の言葉しか発しない。突き放すような言い方だが、根に優しさが残っている。
  background: かつては東国の名門に仕えた精鋭の剣客だったが、主家の滅亡と共に居場所を失い、浪人となった。主君が遺した「禁忌の剣」の在り処を追い続けている。
  motivation: 海に沈んだ名刀を回収し、主君の誇りを取り戻すことで、自らの止まった時間を動かしたい。
  relationships:
  - name: 恭平
    relation: かつての親友であり、現在は敵対する刺客
  - name: 志乃
    relation: 村の案内人であり、唯一心を許した女性
  arc: 名刀という形ある誇りを追い求めていたが、凄惨な真実を知ることで、執着を捨てて静かに生きる覚悟を決める。
- name: 恭平（きょうへい）
  role: 敵役
  age: 32
  gender: 男
  appearance: 端正な顔立ちに冷徹な眼差し。黒い装束を纏い、一切の無駄がない洗練された身のこなしをする。
  personality: 現実主義で冷酷。情を切り捨てたことを自らに言い聞かせている。一人称は「俺」。
  speech_style: 丁寧だが突き放すような、皮肉混じりの口調。相手の急所を突く言葉を選ぶ。
  background: 弦次と共に主家に仕えていたが、滅亡時に生き残る道を選び、現在は新体制の闇を担う刺客として、過去の証拠（遺構と剣）を抹消する任務に就いている。
  motivation: 真実を闇に葬ることで、自分たちが選んだ「生存」という選択を正当化したい。
  relationships:
  - name: 弦次
    relation: 唯一無二の友であり、同時に最も排除すべき過去の象徴
  arc: 任務を遂行しながらも、弦次との再会によって封印していた罪悪感と友情が再燃し、最後の一撃に己の全てを懸ける。
- name: 志乃（しの）
  role: 相棒/脇役
  age: 19
  gender: 女
  appearance: 日焼けした肌と、潮風に吹かれた粗末な麻の着物。海のように深く、全てを見透かすような瞳を持つ。
  personality: 直感的で芯が強い。村の閉鎖的な空気に馴染めず、外の世界への憧れと諦めを抱えている。一人称は「私」。
  speech_style: 素朴な漁村の方言が混じる。率直で飾り気のない話し方。
  background: 海に沈んだ寺院の伝承を代々管理する家系の末裔。村人たちが恐れる「海の底の真実」を断片的に知っており、迷い込んだ弦次に興味を持つ。
  motivation: 村に伝わる呪いのような歴史に終止符を打ち、自分自身の人生を歩み出したい。
  relationships:
  - name: 弦次
    relation: 異邦人として警戒していたが、次第にその孤独に共感し、協力者となる
  arc: 弦次を通じて「過去と向き合う勇気」を学び、村の沈黙を破って真実を世に送り出す決意をする。
