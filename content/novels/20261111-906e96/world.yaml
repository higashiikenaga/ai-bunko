title: 潮鳴りの残滓、散華の剣
genre: 歴史・時代小説
tone: 重厚、静謐、かつ凄烈
pov: 三人称
tense: 過去形
setting: 戦国末期、波濤の荒れる東国沿岸の漁村
premise: 海に沈んだ古刹の遺構。そこには、滅亡した名門の誇りが眠ると伝えられていた。浪人・弦次は、その遺構に眠る「失われた一振」を求め、潮の満ち引きが支配する孤独な漁村へ辿り着く。しかし、彼の前に立ちふさがるのは、海の底に隠された凄惨な真実と、影のように執拗に迫る刺客たちであった。
themes:
- 武士の矜持
- 贖罪と忘却
rules:
- 海底遺跡は特定の満月の干潮時にのみ、その姿を現す
- 剣の道に生きる者は、死に際して己の魂を刀に託す
plot_outline:
- '序盤: 浪人・弦次が、海に沈んだ寺院の伝説を追って漁村へ到着。潮の匂いと、村人の不気味な沈黙、そして背後に潜む刺客の気配を描く。'
- '中盤: 干潮と共に姿を現した海底遺跡での探索。そこで弦次は、かつての主君が犯した禁忌の事実と、それを隠蔽するために海へ沈められた者たちの凄惨な末路を知る。'
- '終盤: 桜が狂い咲く海岸にて、かつての友であった刺客との宿命の一騎打ち。静寂が極まり、一閃が空を裂く。'
- '結末: 決着の後、弦次は名刀と共に、真実を抱えたまま静かに波間に消えていく。散りゆく桜が、彼の生き様を祝福するように海面を覆う。'
style_notes: 簡潔で力強い文。剣戟の描写は、肉を断つ衝撃と血の熱量を、一切の無駄を省いて記述すること。特に、決闘直前の、呼吸の音さえ憚られるような「静寂」の描写に心血を注ぎ、読者の鼓動を捉えること。
