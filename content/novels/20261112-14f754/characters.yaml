- name: カイエン・ソーン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 使い古したロングコートに、右目にだけ旧型の光学センサーを埋め込んでいる。常に疲弊した表情で、指先は絶え間なく微震している。
  personality: 冷笑的で虚無主義。だが根底には強い情義を秘めている。一人称は「オレ」。
  speech_style: ぶっきらぼうで短文。ハードボイルドな口調で、皮肉を混ぜて話す。
  background: 元企業治安維持部隊の精鋭だったが、相棒を失った事件を機に除隊。現在は下層スラムで企業の不都合なデータを消去する「クリーナー」として生計を立てている。
  motivation: 死んだはずの相棒からの通信の正体を突き止め、彼女の死の真相を暴くこと。
  relationships:
  - name: エリーナ・ヴァンス
    relation: 元相棒。死別したはずの最愛のパートナー。
  - name: ジュリアン・ヴェイン
    relation: 敵対関係。かつての雇用主であり、現在の仇敵。
  arc: 孤独と絶望に浸っていたが、真実を暴くことで自己犠牲を厭わない意志を取り戻し、都市の偽りの秩序を破壊する。
- name: エリーナ・ヴァンス
  role: 相棒（亡霊）
  age: 27
  gender: 女性
  appearance: ホログラムとして現れる。ノイズで時折輪郭が揺らぎ、20世紀の古いラジオ放送のようなノスタルジックな服装をしている。
  personality: 知的で献身的。断片的な記憶しか残っておらず、時折情緒不安定になる。一人称は「私」。
  speech_style: 穏やかで丁寧。記憶の混濁による「バグ」のような言い間違いや、意味不明な単語の挿入がある。
  background: 天才的なハッカーであり、企業の禁忌プロジェクトに深く関わっていたため、意識をデジタル化され「燃料」として利用されていた。
  motivation: カイエンに警告を送り、自分を含む犠牲者たちの意識を解放すること。
  relationships:
  - name: カイエン・ソーン
    relation: 信頼し合っていたパートナー。彼だけが自分の声を聴くことができる。
  arc: 単なるデータの残骸から、自らの意志でシステムを内部崩壊させる鍵へと変化する。
- name: ジュリアン・ヴェイン
  role: 敵役
  age: 55
  gender: 男性
  appearance: 一点の曇りもない白のスーツを纏い、肌は完全な合成皮膚に置換されているため、毛穴一つない不気味なほど滑らかな外見。
  personality: 極めて合理的で傲慢。人類の進化には少数の犠牲が不可欠だと信じている。一人称は「私」。
  speech_style: 優雅で理知的。相手を精神的に追い詰めるような、静かだが威圧感のある話し方。
  background: ネオ・カサブランカを統治する巨大企業の最高執行責任者。「意識燃料化プロジェクト」の主導者。
  motivation: 都市の永久的なエネルギー源を確保し、完璧な管理社会を完成させること。
  relationships:
  - name: カイエン・ソーン
    relation: 使い捨ての道具として見ていた元部下。
  arc: 絶対的な支配を確信していたが、想定外の「バグ（感情）」によって築き上げた帝国を崩壊させられる。
- name: ジャンク屋のマーゴ
  role: 脇役
  age: 68
  gender: 不詳
  appearance: 油汚れのついたオーバーオールに身を包み、巨大な機械義手を持つ。常にゴーグルを額にかけている。
  personality: 口は悪いが情に厚い。下層スラムの生き残りの知恵を持つ。一人称は「わし」。
  speech_style: 下層街の粗野なスラングを多用する。大声で笑い、大声で怒る。
  background: 元企業の主任技師だったが、権力争いに敗れてスラムに落とされた。現在はジャンク屋を営みながら、地下ネットワークの維持をしている。
  motivation: スラムの住人たちが企業の搾取から解放されること。
  relationships:
  - name: カイエン・ソーン
    relation: 腐れ縁の取引相手であり、息子のような存在。
  arc: 傍観者として生きることを選んでいたが、カイエンの決意に触れ、物理的なバックアップとして彼を支援する。
