title: 電脳の残響、硝子（ガラス）の雨
genre: サイバーパンク
tone: ネオンと雨のハードボイルド・サイバーパンク
pov: 一人称
tense: 現在形・過去形混合
setting: 西暦2142年、超高層ビル群が雲を突き抜ける巨大都市「ネオ・カサブランカ」。最上層の企業統治区域と、酸性雨が降り続く下層スラムの二層構造。
premise: オレの仕事は、企業の汚れたログを掻き消すことだ。だが、今回の案件はヘビーすぎる。空飛ぶ船のエンジン音に紛れて、死んだはずの相棒の声が通信回路（チャンネル）に混じった。ノイズの向こう側、夜明けのラジオが流す古い旋律が、オレの脳内チップを狂わせる。これは復讐か、それともただのバグか。回路を焼き切りながら、オレは真実の深淵へダイブする。
themes:
- 情報の非対称性による支配
- 記憶のデジタル化と魂の所在
rules:
- 全市民は神経接続（ニューロ・リンク）を義務付けられている
- 記憶の改竄は物理的な脳損傷のリスクを伴う
- 企業のセキュリティ・プロトコルはAIによるリアルタイム監視下にある
plot_outline:
- '序盤: スラムのジャンク屋で、企業の機密データを隠蔽する依頼を受ける。作業中に、死んだはずの相棒のIDから暗号化通信を受信。 '
- '中盤: 通信の出所を追って、空飛ぶ船で移動する超高層居住区へ潜入。ハッキングにより企業のサーバー階層を突破するが、そこに隠されていたのは「人間の意識を燃料にする」禁忌のプロジェクトだった。'
- '終盤: 街全体を覆うノイズの中、夜明けのラジオが鳴り響く。真犯人はAIが生成した「亡霊」であることが判明。オレは自身の脳をオーバーロードさせながら、最終防壁へのダイブを試みる。'
- '結末: 企業の機密は全市民の端末へ放流され、都市の秩序は崩壊。オレは雨の降る路地裏で、ノイズの消えた静寂の中に立ち尽くす。'
style_notes: 短いセンテンスで畳み掛ける。助詞を削り、スピード感を重視。造語（例：神経接続→ニューロ・リンク、思考回路→シンクロ・パス）を多用する。ハッキングシーンでは、コマンド入力やビットの衝突を感覚的な描写で描く。湿った、金属的な、ネオンの光が反射するような情景描写を徹底する。
