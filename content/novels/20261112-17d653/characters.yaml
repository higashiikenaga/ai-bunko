- name: 瀬戸 紬 (せと つむぎ)
  role: 主人公
  age: 20
  gender: 女性
  appearance: 緩いウェーブの髪にベージュのカフェエプロン。静かな眼差しと、控えめな佇まい。
  personality: 内向的で繊細。日常の静寂を愛しながらも、心の底で強い孤独と渇望を抱えている。一人称は「私」。
  speech_style: 丁寧で控えめ。言葉少なめに相手の意図を汲み取ろうとする。
  background: 地元の大学に通いながら、夜の喫茶店でアルバイトをしている。波の音と霧に囲まれた町で、停滞した時間の中に生きている。
  motivation: 単調な日常に意味を見出したい。櫂という異分子が現れたことで、彼を繋ぎ止めたいという強い欲求に目覚める。
  relationships:
  - name: 櫂
    relation: 惹かれ合う相手であり、喪失を共有するパートナー
  - name: 静真
    relation: 雇い主であり、精神的な拠り所
  arc: 受動的な孤独に甘んじていた状態から、自らの香りを刻み込もうとするほどの能動的な愛と、その後の切ない受容へと変化する。
- name: 櫂 (かい)
  role: メインヒーロー
  age: 24
  gender: 男性
  appearance: 白のシャツに使い古したコート。サンダルウッドの香りを纏う、どこか儚げで透明感のある美青年。
  personality: 漂泊の精神を持つ。穏やかだが、どこか諦観に満ちている。一人称は「僕」。
  speech_style: 静かで詩的な言い回し。核心を避けるような、曖昧で心地よい話し方。
  background: 幼少期に失われた、地図から抹消された故郷の村の記憶を辿って旅をしている。どこにも居場所がないと感じている。
  motivation: 記憶の中にある「消えた村」の実在を確認し、自分のアイデンティティを完結させること。
  relationships:
  - name: 紬
    relation: 旅の途中で出会った、唯一心を許せる安らぎ
  - name: 千代
    relation: 村の記憶を辿るための導き手
  arc: 定住への淡い期待を抱くが、最終的に自分が永遠に漂い続ける「渡り鳥」であることを受け入れ、旅立つ覚悟を決める。
- name: 静真 (しずま)
  role: 脇役/メンター
  age: 52
  gender: 男性
  appearance: 白髪混じりの短髪に銀縁の眼鏡。常に清潔な白いシャツを着用し、静かにコーヒーを淹れている。
  personality: 冷静沈着で達観している。人生の酸いも甘いも噛み分けた、深い包容力を持つ。一人称は「私」。
  speech_style: 短く、核心を突く。余計なことは言わないが、言葉の端に温かみが宿る。
  background: かつて世界を旅していた経験があり、この町に夜の隠れ家としての喫茶店を開いた。
  motivation: 訪れる人々が、一時の静寂の中で自分自身を取り戻すための空間を維持すること。
  relationships:
  - name: 紬
    relation: 見守るべき教え子のような存在
  - name: 櫂
    relation: かつての自分を重ね合わせる旅人
  arc: 二人の若者の儚い交流を静かに見守り、喪失の後にこそ残る「残り香」の価値を彼らに提示する。
- name: 千代 (ちよ)
  role: 脇役/鍵となる人物
  age: 78
  gender: 女性
  appearance: 小柄で腰が曲がっているが、瞳だけは鋭く澄んでいる。手編みの厚いショールを羽織っている。
  personality: 懐古的で神秘的。町の古い伝承や、忘れ去られた記憶に詳しい。一人称は「私」。
  speech_style: 地方の古風な訛りが混じった、ゆっくりとした語り口。
  background: 「消えた村」の生き残りであり、その歴史の唯一の証人として町にひっそりと暮らしている。
  motivation: 消えゆく村の記憶を、誰か信頼できる者に託し、正しく忘れさせたい。
  relationships:
  - name: 櫂
    relation: 村の記憶を繋ぐための唯一の接点
  - name: 紬
    relation: 若さゆえの切なさを愛おしく思う近所の人
  arc: 過去の記憶にのみ生きていたが、櫂と紬の出会いを通じて、記憶を未来へ繋ぐことの意味を見出す。
