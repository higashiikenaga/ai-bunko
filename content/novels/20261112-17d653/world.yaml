title: 琥珀の夜、霧の村を辿る
genre: 青春恋愛
tone: 憂いを含んだ、艶やかで静謐な空気感
pov: 三人称
tense: 過去形
setting: 潮風が香る、霧の深い海岸沿いの町。深夜の喫茶店。
premise: 深夜の喫茶店で働く大学生の紬は、季節外れの渡り鳥のように現れた青年・櫂と出会う。櫂が追うのは、地図から抹消されたという「消えた村」の、懐かしくも切ない記憶だった。コーヒーの香りと、夜の静寂の中で、二人の孤独が微かな香水と共に溶け合っていく。
themes:
- 喪失の記憶
- 彷徨う魂の帰着点
rules:
- 消えた村は、特定の香りを嗅いだ時にのみ視界を遮る霧と共に現れる概念的な場所である
- 渡り鳥の飛来は、運命的な邂逅の予兆として描かれる
plot_outline:
- '序盤: 深夜の静寂の中、焙煎された豆の香りが漂う店に櫂が現れる。彼の纏うサンダルウッドの香りが、紬の静かな日常を狂わせる。'
- '中盤: 櫂の目的が、失われた故郷の村を探すことだと知る紬。二人は夜の街を彷徨い、言葉を交わす代わりに、視線の交差や指先の微かな震えで互いの渇望を確かめ合う。'
- '終盤: 霧の夜、村の断片に触れた櫂は、自分が永遠にどこにも定住できない「渡り鳥」であることを悟る。紬は彼を繋ぎ止めるため、自らの香りを彼に深く刻み込もうとする。'
- '結末: 季節が巡り、櫂は去る。しかし、紬が淹れるコーヒーの香りと、夜の湿った空気の中に、彼が残した確かな体温が、消えない残り香として溶け込んでいる。'
style_notes: 三人称視点で、セリフは極限まで削ぎ落とし、行間の沈黙や視線の移ろいで感情を語らせる。香水の種類やコーヒーの湯気、夜の湿度、肌の質感、視線の動きを、艶のある情緒的な文体で描写すること。感情を直接的な言葉にせず、感覚的なメタファーを用いて描く。
