- name: エライアス・ソーン
  role: 主人公
  age: 26
  gender: 男性
  appearance: 短髪の黒髪、鋭い眼光。帝国海軍の標準的な制服を端正に着こなしているが、どこか疲弊した様子が見える。
  personality: 真面目で冷静沈着。規律を重んじるが、現場の違和感を無視できない正義感を持つ。一人称は「私」。
  speech_style: 丁寧で軍人らしい規律正しい口調。感情を抑えた話し方。
  background: 帝国海軍士官学校を優秀な成績で卒業し、辺境の偵察艦に配属された。星路の再起動を最初に目撃する一人。
  motivation: 星路の再起動に伴う不自然な信号の正体を突き止め、戦火の中で犠牲を最小限に抑えること。
  relationships:
  - name: ライラ・ヴェイン
    relation: 戦地で出会う、利害が一致した協力者
  - name: ヴァレリウス・クリーク
    relation: 忠誠を誓うべき上官であり、思想的に対立する壁
  arc: 帝国の忠実な兵士から、人類の未来のために帝国に背き、新たな秩序を模索する指導者へ。
- name: ライラ・ヴェイン
  role: 相棒/協力者
  age: 28
  gender: 女性
  appearance: 華やかな社交服を纏う、ミステリアスな雰囲気を持つ美女。常に情報の入った小型端末を携行している。
  personality: 計算高く、常に情報の価値を測っている。しかし、その裏には平和への切実な願いを隠している。一人称は「私」。
  speech_style: 優雅で含みを持たせた、社交的な話し方。相手を煙に巻くのが得意。
  background: 新興の商事連合に所属する外交官兼、情報工作員。交易都市エテルナの裏社会にも精通している。
  motivation: 星路の独占による経済崩壊と全星域の戦争を防ぎ、交易の安定を確保すること。
  relationships:
  - name: エライアス・ソーン
    relation: 戦場での武力と、自身の情報力を結びつける信頼できるパートナー
  arc: 利権を追う冷徹な工作員から、星域の共存を信じてリスクを取る理想主義者へ。
- name: ヴァレリウス・クリーク
  role: 敵役
  age: 55
  gender: 男性
  appearance: 厳格な面持ち、顔に古い戦闘の傷跡がある、圧倒的な威圧感を放つ老将軍。
  personality: 冷酷かつ極めて合理的。帝国の繁栄こそが宇宙の唯一の秩序だと信じて疑わない。一人称は「我」。
  speech_style: 断定的で、命令を下す際に一切の揺らぎがない重厚な口調。
  background: 数々の大規模艦隊戦を勝ち抜いてきた帝国海軍の英雄。現司令部の実力者。
  motivation: 星路の制御権を帝国が完全に独占し、旧来の帝国による全星域の絶対支配を確立すること。
  relationships:
  - name: エライアス・ソーン
    relation: 有望な部下として期待していたが、最終的には排除すべき反逆者
  arc: 秩序の守護者としての誇りを持ちつつ、星路という神のごとき力を巡る執着に呑み込まれていく。
- name: カエレン・“ジャックス”・ジャクソン
  role: 脇役/技術支援
  age: 32
  gender: 男性
  appearance: 油汚れのついた作業服、無精髭、常に小型の解析端末を弄っている、小柄な男。
  personality: 皮肉屋で現実主義。技術に対してのみ異常な情熱と敬意を持つ。一人称は「俺」。
  speech_style: ぶっきらぼうで、技術的な専門用語を多用する、少し乱暴な話し方。
  background: 独立志向の辺境開拓団に所属するメカニック。古代技術の断片を修理して生計を立てている。
  motivation: 星路の真の機能を知り、開拓団が帝国や連合に縛られず自由に行き来できる環境を作ること。
  relationships:
  - name: エライアス・ソーン
    relation: 技術的な解析と航路の維持をサポートする協力者
  arc: 単なる荒くれ者の修理屋から、古代の真実を解明し、新時代の航路を支える技術の先駆者へ。
