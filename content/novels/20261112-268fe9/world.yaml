title: 虚空航路の渡り鳥 ―銀風の艦隊記―
genre: SF
tone: 硬質な軍事色と濃密な政治劇が交錯する、壮大なスペースオペラ
pov: 三人称（艦隊・陣営ごとに視点人物を切り替える群像劇形式）
tense: 過去形
setting: 12の星系からなる『蛇遣い星域』。古代種が遺したワームホール網『星路（スターパス）』を巡り、衰退しつつある帝国、新興の商事連合、独立志向の辺境開拓団が対立している時代。
premise: 数千年の眠りについていた『星路』が突如再起動し、星系間の移動効率が劇的に向上したことで、星域の勢力均衡が崩壊する。軍事的な要衝となる『結節点（ノード）』を巡る激しい艦隊戦が展開される中、外交官たちは不夜の交易都市で密約と裏切りを繰り返す。ある一隻の偵察艦が、星路の正体がかつての知的生命体による『大移動（マイグレーション）』の遺構であるという禁忌の真実に辿り着く。
themes:
- 国家の矜持と個人の忠誠
- 境界線の意味と生存戦略
rules:
- ワープ航法は『結節点（ノード）』経由でしか高速移動できず、ノード間は亜光速航行となるため、戦術的な待ち伏せや補給線の確保が極めて重要である。
- 通信は光速の制約を受けるため、超長距離通信には高価な量子もつれ通信機が必要であり、その使用権限は将官級以上に限定される。
- 軍の階級制度は絶対であり、通信における敬称や報告形式の不備は軍法会議の対象となる厳格な規律が存在する。
plot_outline:
- '序盤: 辺境の第4ノードが再起動し、帝国・連合・開拓団の三勢力が同時に出撃。小規模な小競り合いから始まり、徐々に戦線が拡大していく。主人公である帝国海軍の中尉が、不自然な信号を検知する。'
- '中盤: 全星域の物流と政治が集約される『眠らない街』エテルナにて、三勢力の和平交渉が行われるが、裏では結節点の独占権を巡る暗殺と工作が横行。同時に、前線では大規模な艦隊戦が勃発し、戦術的な包囲網と突破策が激しくぶつかり合う。'
- '終盤: 星路の真の機能が『星系ごと文明を移住させるための航路』であることが判明。これを独占して他勢力を排除しようとする帝国最高司令部に対し、現場の指揮官たちが独自の判断で共闘へと舵を切る。'
- '結末: 激戦の末に星路の制御権を共有する体制を構築。軍事的な利用を制限し、かつての『渡り鳥』のように自由な往来を許容する新時代の星域秩序が形成される。'
style_notes: 艦隊戦では『第一波、V字陣形にて突撃』『第3分隊、右舷45度へ転進』など、具体的かつ専門的な軍事用語と階級に基づいた厳格なやり取りを徹底する。また、星系図を読者に提示するように、惑星間の距離感やノードの位置関係を座標的に描写し、戦略的な空間把握を促す文体とする。
