- name: 佐藤 栞
  role: 主人公
  age: 30
  gender: 女性
  appearance: 都会的ながらも、どこか疲れを感じさせる華奢な体格。黒髪のセミロング。清潔感はあるが、表情が乏しくなりがち。
  personality: 真面目で責任感が強く、完璧主義。自分の弱さを見せるのが苦手。一人称は「私」。
  speech_style: 丁寧で落ち着いているが、父に対してはどこか壁を作るような、少し硬い敬語が混じる。
  background: 東京の広告代理店でバリバリ働いていたが、過労と人間関係のストレスで心身の限界を迎え、逃げるように実家へ帰郷した。
  motivation: 一度壊れてしまった家族との関係をどう整理すべきか、そして「自分自身の生き方」を見つけ直すこと。
  relationships:
  - name: 佐藤 健一
    relation: 父
  - name: 佐藤 美奈子
    relation: 母
  - name: 望月 陽太
    relation: 幼馴染
  arc: 「正解」を求めて自分を追い込む生き方から、不器用なものや欠けているものを受け入れる、しなやかな生き方へと変化する。
- name: 佐藤 健一
  role: 主要人物（父親）
  age: 62
  gender: 男性
  appearance: 無骨で大きな手、白髪混じりの短髪。長年、職人として働いてきたことがわかる、使い込まれた作業着やエプロン姿。
  personality: 極めて寡黙で不器用。感情を言葉にするのが苦手で、つい突き放したような態度をとってしまう。一人称は「俺」。
  speech_style: ぶっきらぼうで短文。言葉数は少ないが、問いかけには必ず答えようとする誠実さが隠れている。
  background: 地元の工務店を営んでいた。娘との確執以来、言葉を交わさぬまま一人で古い実家を守り続けてきた。
  motivation: 言葉にできなかった娘への愛情や、亡き妻への想いを、地下書庫という形で静かに伝え続けること。
  relationships:
  - name: 佐藤 栞
    relation: 娘
  - name: 佐藤 美奈子
    relation: 妻
  arc: 隠し続けてきた「心の内」を記録（書庫）と料理を通じて形にし、娘との対話の扉を静かに開く。
- name: 佐藤 美奈子
  role: 重要人物（亡き母）
  age: 55
  gender: 女性
  appearance: 柔らかな笑顔と、温かみのある眼差し。物語内では、古い写真やレシピノートを通じてその存在が描かれる。
  personality: 明るく、家族の調和を何よりも大切にする太陽のような存在。料理を通じて人を癒やす天才。一人称は「私」。
  speech_style: 包み込むような、穏やかでリズムの良い話し方。
  background: 数年前に病で他界。彼女が遺した料理ノートと、夫が書き溜めた記録が、父娘を再び繋ぐ架け橋となる。
  motivation: （回想・記録を通じて）父と娘が、再び同じ食卓を囲めるようになること。
  relationships:
  - name: 佐藤 健一
    relation: 夫
  - name: 佐藤 栞
    relation: 娘
  arc: 直接的な変化はないが、彼女の遺した「味」と「言葉」が、止まっていた二人の時間を動かす原動力となる。
- name: 望月 陽太
  role: 脇役（幼馴染）
  age: 30
  gender: 男性
  appearance: 日焼けした肌に、親しみやすい笑顔。地元のカフェの店主らしく、ラフで動きやすい服装。
  personality: おおらかで聞き上手。周囲の空気を柔らかくする才能がある。一人称は「僕」。
  speech_style: 飾らない、親しみやすい口調。栞の緊張を解きほぐすような、軽やかな話し方。
  background: 栞が実家に帰ってきたことを知り、さりげなく彼女の精神的なサポートをする地元の友人。
  motivation: 栞が、再びこの街で自分のペースを見つけられるよう、見守りながら手助けすること。
  relationships:
  - name: 佐藤 栞
    relation: 幼馴染
  arc: 栞にとっての「外の世界との繋がり」を維持する存在として、彼女の再出発を静かに後押しする。
