title: 湯気の向こうの記憶書庫
genre: 日常ほのぼの
tone: 静謐で温かく、懐かしさに満ちた空気感
pov: 三人称
tense: 過去形
setting: 現代の地方都市。古い書棚に囲まれた実家とその地下。
premise: 父と絶縁して十年ぶりに帰郷した女性が、家の地下に隠された『家族の歴史を綴る図書室』を見つける物語。不器用な父が密かに書き溜めていた記録と、母のレシピを再現する料理の時間を通じて、止まっていた親子の時間が再び動き出す。
themes:
- 家族の再生
- 記憶の継承
rules:
- 地下図書館には、家族に関わる日記や手紙、家系図のみが蔵書として収められていること
- 料理の味や香りをきっかけに、過去の特定の記憶が呼び覚まされる演出を用いること
plot_outline:
- 序盤：仕事に疲れ、心身ともに限界を迎えた主人公が、疎遠だった父のもとへ帰郷し、ぎこちない共同生活を始める。
- 中盤：台所の隅にある隠し扉から、父が人生をかけて作り上げた『地下図書館』を発見し、そこに記された自分への不器用な愛情と家族の真実を知る。
- 終盤：母が遺した古い料理ノートを使い、父と一緒に食卓を囲むことで、言葉にできなかった謝罪と許しを静かに交わし合う。
- 結末：心に充足感を得た主人公が、夜の駅で『最終列車』に乗り込み、またここへ帰ってくることを誓いながら日常へと戻る。
style_notes: 久我山灯子として、何気ない会話の行間に長い年月の積層を感じさせること。特に料理の工程（野菜を切る音、出汁の香りなど）を丁寧に描写し、そこに家族の思い出を重ね合わせる静かな筆致で綴る。
