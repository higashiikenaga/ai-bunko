- name: 久道 零
  role: 主人公
  age: 34
  gender: 男性
  appearance: 痩身で青白い肌。度の強い眼鏡をかけており、常に眠そうな目の下に深い隈がある。機能性重視の地味なコートを着用。
  personality: 極めて論理的で冷徹な合理主義者。組織の論理よりも個人の真実を優先するため、上層部から疎まれている。一人称は「私」。
  speech_style: 簡潔で淡々とした話し方。相手の矛盾を突く際は、静かに、しかし執拗に問い詰める。
  background: 警視庁捜査一課の元エースだったが、ある事件で政治的な圧力に抗い、事実を報告したことで左遷に近い形で凪之浦へ派遣された。
  motivation: 潮汐と物理的矛盾という「解けるはずのパズル」を解き明かし、純粋な真実を証明すること。
  relationships:
  - name: 花江 空
    relation: 捜査パートナー。直感的な彼女を論理で補完し合う関係。
  - name: 金子 武雄
    relation: 対立関係。組織の論理を押し付ける上司。
  arc: 効率や政治に塗りつぶされた捜査の中で、泥臭く事実にのみ向き合うことで、失っていた正義感を取り戻す。
- name: 花江 空
  role: 相棒
  age: 26
  gender: 女性
  appearance: 日焼けした肌にショートヘア。活動的なアウトドアウェアを好み、常にメモ帳を携帯している。
  personality: 快活で情に厚い。凪之浦の出身で、町の人々とのネットワークが非常に広い。直感に優れた行動派。一人称は「私」。
  speech_style: 快活で砕けた口調。時折、地元の漁師特有の訛りが混じる。
  background: 凪之浦警察署の巡査。幼少期に町で起きた不可解な失踪事件に個人的な関心を持っており、警察官になった。
  motivation: 町に隠された「沈黙の記憶」を暴き、過去の失踪者の真相を突き止めること。
  relationships:
  - name: 久道 零
    relation: パートナー。彼の冷徹さに呆れつつも、その知性と誠実さに深く信頼を寄せている。
  - name: 静馬 一郎
    relation: 顔見知り。古本屋の店主として敬意を払いつつも、警戒している。
  arc: 久道の論理的アプローチを学ぶことで、感情に流されず客観的に事件を見る視点を得る。
- name: 静馬 一郎
  role: 敵役/重要参考人
  age: 58
  gender: 男性
  appearance: 白髪混じりの整った髪に、常にアイロンの効いたカーディガンを着用。古書の香りが染み付いている。
  personality: 物静かで教養が高く、物腰は非常に柔らかい。しかし、町の伝統と秘密を守るためなら嘘を厭わない。一人称は「私」。
  speech_style: 古風で婉曲的な表現を好む。核心に触れようとすると、巧みに話題をそらす。
  background: 古本屋『刻の栞』の店主。代々、凪之浦の歴史と海の下の「遺物」に関する記録を管理してきた一族の末裔。
  motivation: 海の下に眠る遺物が世に出ることで、町の均衡が崩れ、争いが起きることを防ぐこと。
  relationships:
  - name: 久道 零
    relation: 知的な駆け引きを行う相手。彼の洞察力を認めつつも、排除すべき障害と見なしている。
  - name: 花江 空
    relation: 町の娘として可愛がっているが、彼女の探究心には危うさを感じている。
  arc: 完璧な隠蔽工作を企てるが、潮汐という抗えない自然の理と久道の論理によって追い詰められ、過去の罪を告白する。
- name: 金子 武雄
  role: 脇役/妨害者
  age: 52
  gender: 男性
  appearance: 恰幅が良く、高価なスーツを着用。常に最新のスマートフォンをチェックしている。
  personality: 権威主義的で、出世欲が強い。事件の解決よりも、いかに「波風を立てずに処理するか」を優先する。一人称は「私」。
  speech_style: 高圧的で断定的な口調。部下を道具のように扱う。
  background: 警視庁の管理職。海底遺跡の調査に関わる政治的利権を持つ人物と繋がっており、捜査を早期に打ち切るよう圧力をかける。
  motivation: スキャンダルを回避し、上層部への忠誠を示すことでさらなる昇進を果たすこと。
  relationships:
  - name: 久道 零
    relation: 目の上のたんこぶ。彼の正義感を「若気の至り」として軽蔑している。
  arc: 権力で真実を塗りつぶそうとするが、久道が書き上げた「事実にのみ基づく報告書」によって、自身の不正も露呈することになる。
