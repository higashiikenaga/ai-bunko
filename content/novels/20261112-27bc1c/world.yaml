title: 低潮線の境界
genre: 本格ミステリー
tone: 硬質で乾いた、リアリズムに基づいた重厚な雰囲気
pov: 三人称
tense: 過去形
setting: 現代、架空の沿岸部にある漁師町・凪之浦
premise: 04時12分、干潮時の岩礁地帯で遺体が発見される。被害者は海底遺跡の研究者であり、その手には古本屋で購入されたと思われる古い航海図が握られていた。捜査官は、潮汐の周期と不可解な殺害状況の関連性に気づく。組織内の政治的圧力と、海の下に眠る沈黙の記憶が交錯する。
themes:
- 潮汐と時間の不可逆性
- 隠蔽された歴史の代償
rules:
- 犯行は潮汐による物理的条件に依存している
- 捜査は法的手続きと科学的根拠に基づいて進行する
plot_outline:
- '序盤: 04時12分、凪之浦の岩礁で遺体発見。検死による死亡推定時刻の特定。古本屋『刻の栞』での聞き込みと、被害者が所持していた航海図の由来調査。'
- '中盤: 捜査方針を巡る警視庁上層部との軋轢。海底遺跡の調査データから、遺体が発見された場所の特殊性が浮き彫りになる。周辺住民への執拗な聞き込みによる、過去の失踪事件との関連性の発覚。'
- '終盤: 満潮時に発生した第二の事件。潮汐の周期と物理的移動の矛盾。精密な潮位計算に基づいた、不可能犯罪のトリックの解明。'
- '結末: 犯人の動機は、海の下に眠る「ある遺物」の隠蔽。刑事は組織の論理に抗い、事実にのみ基づく報告書を書き上げる。'
style_notes: 三人称による乾いた硬質な文体。会話は短く実務的に。時刻、場所、天候等の事実を正確に記し、捜査の手順や組織内の軋轢をリアリズムに基づいて描く。聞き込みの場面では、対象者の反応や周囲の環境を詳細に記述すること。
