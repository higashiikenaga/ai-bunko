- name: 源次
  role: 主人公
  age: 32
  gender: 男
  appearance: 日に焼けた肌と、大工仕事で鍛えられた逞しい体格。いつも使い古した前掛けを締め、ぶっきらぼうな表情をしているが、目は優しい。
  personality: 口が悪く不器用だが、情に厚い。世話焼きな一面がある。一人称は「俺」。
  speech_style: 江戸っ子らしい威勢の良い口調。「〜じゃねえか」「〜しやがれ」など、ぶっきらぼうな言い回しが多い。
  background: 長屋で一人前の大工として働く。幼い頃に親を亡くし、長屋の人々に育てられたため、住民たちには家族のような信頼を寄せている。
  motivation: 亡くなった老人の遺言を完遂し、預かった渡り鳥を無事に届けたい。
  relationships:
  - name: 善兵衛
    relation: 亡くなった隣人で、反発しつつも慕っていた恩人
  - name: お花
    relation: 幼馴染で、互いに好意を抱きつつも素直になれない関係
  arc: 孤独を強がる生き方から、他者の想いを繋ぐことの尊さを知り、精神的に成熟する。
- name: 善兵衛
  role: 物語の起点（故人）
  age: 75
  gender: 男
  appearance: 小柄で腰が曲がった老人。常に鳥の餌を忍ばせた古びた懐紙を持っており、穏やかな微笑みを絶やさない。
  personality: 風変わりで浮世離れしているが、深い洞察力を持つ。一人称は「わし」。
  speech_style: ゆっくりとした口調で、比喩や詩的な表現を好む。
  background: かつては身分のある家に仕えていたが、ある事情で身分違いの恋に破れ、江戸の隅で鳥を愛でながら静かに暮らしていた。
  motivation: 人生の最後に、唯一の心残りであった想い人に、鳥を通じてメッセージを届けること。
  relationships:
  - name: 源次
    relation: お節介を焼き、信頼して遺言を託した相手
  - name: 静江
    relation: 若き日に深く愛し、生涯忘れられなかった女性
  arc: 死の間際、信頼できる若者に想いを託すことで、長年の後悔に区切りをつける。
- name: お花
  role: 相棒/サポート
  age: 22
  gender: 女
  appearance: 活発な印象の若き女性。色鮮やかなパッチワークの着物を好み、いつも長いポニーテールのような髪型にしている。
  personality: 好奇心旺盛で天真爛漫。長屋のまとめ役であり、誰にでも懐に飛び込む明るさを持つ。一人称は「私」。
  speech_style: 快活でテンポの良い話し方。源次をからかうような茶目っ気がある。
  background: 長屋で八百屋を営む娘。町中の噂話に詳しく、情報収集能力に長けている。
  motivation: 善兵衛さんの切ない過去に興味を持ち、源次を助けて宛先を探し出したい。
  relationships:
  - name: 源次
    relation: 喧嘩ばかりしているが、誰よりも信頼している幼馴染
  - name: 善兵衛
    relation: おじいちゃんのように慕っていた近所の人
  arc: 大人の複雑な愛情や喪失感に触れ、純粋な好奇心から深い共感へと感情が変化する。
- name: 静江
  role: 鍵を握る人物
  age: 68
  gender: 女
  appearance: 気品漂う佇まいの老婦人。控えめな色の着物を纏い、静かな眼差しをしている。
  personality: 穏やかで忍耐強い。孤独を受け入れつつも、心の中に小さな希望を灯し続けている。一人称は「私」。
  speech_style: 丁寧で落ち着いた、品のある言葉遣い。
  background: かつて善兵衛と愛し合ったが、家格の差から結婚できず、別の道を選んで静かに暮らしてきた。
  motivation: 善兵衛が最期まで自分を想ってくれていたことを知り、心からの平穏を得ること。
  relationships:
  - name: 善兵衛
    relation: 人生で唯一、心から愛した男性
  - name: 源次
    relation: 善兵衛の想いを届けてくれた、不思議な縁を持つ青年
  arc: 止まっていた時間が再び動き出し、過去の悲恋を美しい思い出として昇華させる。
