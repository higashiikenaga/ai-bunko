title: 長屋の空と、お節介な渡り鳥
genre: 歴史・時代小説
tone: べらんめえ口調が飛び交う、賑やかで温かい人情劇
pov: 三人称
tense: 過去形
setting: 江戸時代後期、江戸の隅にある貧しいが活気ある長屋
premise: ぶっきらぼうだが情に厚い大工の源次。ある冬の日、長屋の変わり者だった鳥好きの老人が、奇妙な「遺言」を残して世を去る。それは、冬に飛来した渡り鳥を、遠く離れたある人物へ届けてほしいという願いだった。源次は文句を言いながらも、鳥と共に江戸の町を駆け巡り、老人が隠し持っていた切ない過去と向き合うことになる。
themes:
- 不器用な愛
- 隣人への情愛
rules:
- 江戸時代の庶民の風習を忠実に再現する
- 身分制度による制約を描きつつ、人情がそれを超える瞬間を描く
plot_outline:
- '序盤: 冬の寒さが厳しい中、長屋の人々が正月準備に追われ、雑煮の香りが漂う賑やかな日常を描く。鳥好きの老人が急死し、源次にのみ不思議な遺言と一羽の渡り鳥が託される。'
- '中盤: 遺言の宛先を探して江戸の町を奔走する源次。道中、長屋の仲間たちがそれぞれのやり方で手助けし、老人がかつて身分違いの恋に破れ、鳥だけを唯一の手紙代わりにしてきた過去が明らかになる。'
- '終盤: ようやく辿り着いた先で、老人の古い友であり、かつての想い人であった女性と対面。鳥を渡し、老人が最期に伝えたかった言葉が明かされ、周囲の心に深く染み渡る。'
- '結末: 春の気配が漂い始めた頃、長屋で皆が集まり、春の七草粥を囲む。鳥が空へ帰っていく姿を見送りながら、人は一人で生きているのではないことを噛み締める人情の結末。'
style_notes: 藤堂小太郎節を貫く。会話文は「～しやがれ」「～じゃねえか」などのべらんめえ調で軽快に。描写では、冬の雑煮や春の七草など季節の食文化を丁寧に書き込み、長屋の喧騒と人の温かさを対比させて描く。
