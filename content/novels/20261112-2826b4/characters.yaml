- name: 瀬戸 栞
  role: 主人公
  age: 32
  gender: 女性
  appearance: 緩く結んだ髪に、使い込まれたリネンのエプロンドレスを着用。常に植物画帳と万年筆を携帯している。
  personality: 内向的で穏やか。静寂を愛し、植物の微細な変化に喜びを感じる。一人称は「私」。
  speech_style: 丁寧で控えめな口調。独り言が多く、植物に話しかける癖がある。
  background: 元は都市部の博物館で植物標本を扱う学芸員だったが、心身の疲弊から山間部の実家付近に小屋を建て、隠居のような生活を送っている。
  motivation: 森の静かな営みを記録し、自分自身の心を調律すること。
  relationships:
  - name: エコー
    relation: 拾った迷子であり、奇妙な同居人
  - name: 霧島 紬
    relation: 雨の日にだけ訪れる茶屋の主
  arc: AIという異質な存在の視点を通じ、当たり前だと思っていた自然の美しさを再発見し、孤独を「充足した静寂」へと昇華させる。
- name: エコー
  role: 相棒
  age: 0
  gender: 中性
  appearance: 手のひらサイズの球体に近い多面体端末。表面にはひび割れがあり、感情に合わせて淡い青色の光が明滅する。
  personality: 論理的だが好奇心旺盛。未知の事象をデータ化したがるが、定義できない「心地よさ」に戸惑う。一人称は「僕」。
  speech_style: 当初は機械的で断定的な口調。次第に比喩や情緒的な表現を混ぜるようになる。
  background: かつて環境観測用に開発されたが、ある事故でネットワークから切り離され、森の中で機能を失いかけていたAI。
  motivation: 自身のメモリに欠損している「あるべきログ」を探し出し、自己の定義を完結させること。
  relationships:
  - name: 瀬戸 栞
    relation: 保護者であり、世界の美しさを教える教師
  - name: 霧島 紬
    relation: 迷い込んだ先の導き手
  arc: 正解やデータとしての記録ではなく、不確かな「ゆらぎ」や「今この瞬間」を味わうことこそが真の記録であると気づく。
- name: 霧島 紬
  role: 脇役
  age: 50
  gender: 女性
  appearance: 深い藍色の着物を纏い、霧に溶け込むような淡い色の瞳を持つ。常に柔らかな微笑みを浮かべている。
  personality: 達観しており、包容力に満ちている。時間や空間の概念が人間とは少し異なる。一人称は「私」。
  speech_style: ゆっくりとした間を置いた話し方。問いかけに問いかけで答えるような、禅問答的な傾向がある。
  background: 雨の日にだけ現れる「霧の茶屋」の店主。森の記憶を司る存在に近い、人外に近い性質を持つ。
  motivation: 迷い込んだ者たちに安らぎを与え、彼らが自ら答えを見つけるまで静かに見守ること。
  relationships:
  - name: 瀬戸 栞
    relation: 雨の日にお茶を飲みに来る客
  - name: エコー
    relation: 久々に訪れた「機械の迷い子」
  arc: 大きな変化はないが、エコーが「今」を受け入れた瞬間、彼を祝福し、森の一部として認める役割を果たす。
