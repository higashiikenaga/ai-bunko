- name: 蓮 誠一
  role: 主人公
  age: 17
  gender: 男性
  appearance: 黒髪で少し癖毛。鋭いがどこか憂いを含んだ瞳。右手に亡き父の形見である止まった懐中時計を握りしめている。
  personality: 実直、不器用、一本気。一人称は「俺」。
  speech_style: 短く、飾り気のない、真っ直ぐな言葉遣い。
  background: ボクサーだった父を亡くし、その意志を継ぐためにジムに通うが、フェイントが一切使えない「呪い」のような体質に苦悩している。
  motivation: 父の止まった時計の針を動かすこと、そして自身の「真実」を拳で証明すること。
  relationships:
  - name: 九条 凱
    relation: 宿命のライバル
  - name: 佐伯 健造
    relation: 師匠
  arc: 自身の欠点を「呪い」ではなく、誰にも真似できない「武器」として受け入れ、止まっていた時間を自らの拳で動かす。
- name: 九条 凱
  role: 敵役
  age: 17
  gender: 男性
  appearance: 洗練されたモデルのような容姿。無駄のないしなやかな筋肉と、常に余裕を感じさせる微笑。
  personality: 天才肌、計算高い、冷徹。ボクシングを「欺瞞の芸術」と捉えている。一人称は「僕」。
  speech_style: 優雅で、相手を翻弄するような丁寧かつ皮肉めいた話し方。
  background: 幼少期からボクシングの英才教育を受け、フェイントと駆け引きの極致を体現する現役天才ボクサー。
  motivation: 完璧な技術で、予測不能な「不純物（蓮）」を完全に制御し、圧倒すること。
  relationships:
  - name: 蓮 誠一
    relation: 理解不能な異物
  arc: 蓮の「嘘のない一撃」に直面し、技術や計算を超えた、剥き出しの魂がぶつかり合う熱狂を知る。
- name: 佐伯 健造
  role: 脇役
  age: 52
  gender: 男性
  appearance: 頑固そうな顔立ちに深い皺。短髪で、使い込まれたボクシンググローブを常に持ち歩いている。
  personality: 厳格だが情に厚い。言葉は荒いが、誰よりも選手の心を理解している。一人称は「俺」。
  speech_style: 威圧感はあるが、核心を突く重みのある口調。
  background: 蓮の父の旧友であり、蓮が「フェイントを使えない」のは父譲りの真っ直ぐな性質であることを見抜いている。
  motivation: 蓮を全国の頂点へ導き、亡き友の意志を繋ぐこと。
  relationships:
  - name: 蓮 誠一
    relation: 弟子・亡き友の息子
  arc: 蓮が「呪い」を「力」に変える瞬間を導き、師として自らの役割を全うする。
- name: 陽向 湊
  role: 相棒
  age: 17
  gender: 男性
  appearance: 明るい茶髪に快活な表情。小柄だが、瞬発力に優れたスピーディーな体つき。
  personality: 明るく社交的、ムードメーカー。蓮の不器用さを笑い飛ばしながらも、その孤独を理解している。一人称は「僕」。
  speech_style: 軽快で、テンポの良い親しみやすい話し方。
  background: 蓮と同じジムに通う同級生。蓮のストイックな練習に付き合い、スパーリング相手を務める。
  motivation: 蓮と共に全国大会の舞台に立ち、最高の景色を見ること。
  relationships:
  - name: 蓮 誠一
    relation: 親友・スパーリングパートナー
  arc: 蓮の孤独な戦いを支える中で、自分自身のボクシングに対する向き合い方を再確認する。
