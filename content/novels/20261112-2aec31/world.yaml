title: 咆哮のクロノス ―嘘なき拳と壊れた秒針―
genre: スポーツ青春
tone: 熱血・泥臭い・爆発的な臨場感
pov: 三人称（試合中は現在形）
tense: 基本は過去形（試合シーンのみ現在形）
setting: 現代、地方の熱気溢れるボクシングジムから全国大会の舞台へ
premise: ボクシングにおいて「フェイント（嘘）」を一切使えない「呪い」を背負った少年・蓮。彼は亡き父の形見である、止まったままの懐中時計を握りしめ、剥き出しの正攻法だけでリングに立ち続ける。欺瞞とテクニックが支配するボクシング界で、彼は自身の「真実」を拳に乗せ、止まった時間を動かすことができるのか。
themes:
- 真実の証明
- 不器用な誠実さ
rules:
- 主人公は心理的特性により、相手を欺く動き（フェイント）を一切使えない
- 試合シーンでは現在形を用い、読者の鼓動を直接的に揺さぶる
- 技術（欺瞞）と直感（真実）の衝突を物語の絶対的な軸とする
plot_outline:
- '序盤: 嘘をつけない性質ゆえにフェイントを使えず苦戦しながらも、圧倒的な真っ直ぐなパンチで勝ち進む蓮の日常。止まった父の懐中時計への執着。'
- '中盤: 天才ボクサー・凱との対峙。凱の視点を通じ、蓮の「嘘のない動き」がどれほど不気味で、技術を無力化する恐怖に満ちているかを描く。'
- '終盤: 全国大会決勝。凱の完璧なフェイントに翻弄され、意識が遠のく蓮。その瞬間、止まっていた懐中時計の秒針が脳内で鳴り響く。'
- '結末: 嘘を捨てず、ただ「今、ここにある真実」を拳に乗せた一撃が凱のガードを突き破る。リングに沈む敗者の悔恨と、咆哮する勝者の熱狂。'
style_notes: 汗の匂い、肺が焼ける感覚、心音の爆ぜる音を執拗に描写せよ。試合シーンは「打つ！ 避ける！ 抉る！」といった現在形の短い文章を多用し、実況さながらの臨場感で読者の心拍数を引き上げること。負けた側の視点も描き、敗北の重みと熱量を逃さない。
