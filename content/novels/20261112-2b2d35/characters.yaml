- name: 天宮 空 (あまみや そら)
  role: 主人公
  age: 21
  gender: 女性
  appearance: 控えめな服装に度の強い眼鏡。常に小さなメモ帳を携帯している。
  personality: 内向的で観察眼が鋭い。本の世界を現実より信頼している。一人称は「わたし」。
  speech_style: 丁寧だが、自信なさげに語尾を濁らすことが多い。
  background: 大学で文学を専攻する学生。喧騒を嫌い、静寂を求めて「灯り堂」でアルバイトを始めた。
  motivation: 詩集に残された栞の謎を解き、そこに込められた誰かの想いを知りたい。
  relationships:
  - name: 静目 京一
    relation: 雇い主であり、導き手
  - name: 一ノ瀬 蓮
    relation: 調査の過程で出会う、かつての当事者
  arc: 他人の人生に深く踏み込むことを恐れていたが、物語を辿ることで、現実の人間関係を築く勇気を得る。
- name: 静目 京一 (しずめ きょういち)
  role: 相棒・導き手
  age: 58
  gender: 男性
  appearance: 白髪混じりの短髪に使い古したカーディガン。常に古書のインクのような香りがする。
  personality: 飄々としていて掴みどころがないが、本への愛と知識は底なし。一人称は「私」。
  speech_style: 含みを持たせた言い回しが多く、相手に考えさせる問いかけを好む。
  background: 街の変遷をすべて知っているかのような古本屋「灯り堂」の店主。元々は大学教授だったという噂がある。
  motivation: 詩集の持ち主が残した「善意」が、正しい宛先に届くことを見届けたい。
  relationships:
  - name: 天宮 空
    relation: 才能ある観察者として期待している教え子のような存在
  arc: 空の成長を見守ることで、自分自身が閉じ込めていた過去の喪失感に区切りをつける。
- name: 一ノ瀬 蓮 (いちのせ れん)
  role: 重要人物
  age: 35
  gender: 男性
  appearance: 疲れ切った表情をした、仕立ての良いが皺の寄ったスーツ姿の会社員。
  personality: 責任感が強く真面目だが、過去のすれ違いに囚われている。一人称は「僕」。
  speech_style: 淡々としており、感情を抑えた話し方をする。
  background: かつて詩集の持ち主と深い絆があったが、ある誤解から連絡を絶ち、現在は街の喧騒の中で空虚な生活を送っている。
  motivation: 自分に向けられていたはずの、届かなかった言葉を確認したい。
  relationships:
  - name: 天宮 空
    relation: 過去の記憶を呼び覚ましてくれた案内人
  arc: 止まっていた時間が動き出し、後悔を抱えたまま生きていくのではなく、前を向いて歩き出す。
- name: 如月 栞 (きさらぎ しおり)
  role: 物語の鍵となる人物（故人または不在）
  age: 22
  gender: 女性
  appearance: （回想のみ）陽だまりのような笑顔と、真っ直ぐな眼差しを持つ女性。
  personality: 純粋で献身的。言葉にできない想いを、本や物に託して伝える傾向があった。
  speech_style: 詩的な表現を好み、相手を包み込むような優しい口調。
  background: 数年前に街を去った（あるいは亡くなった）、詩集の元の持ち主。街の至る所に「誰かが幸せになるためのヒント」を仕掛けた。
  motivation: 大切な人が孤独にならないよう、間接的に愛と導きを残したかった。
  relationships:
  - name: 一ノ瀬 蓮
    relation: 最も伝えたかった想いを持つ相手
  arc: 物語の終盤、本の細工を通じて、彼女の真意が完結し、精神的に救済される。
