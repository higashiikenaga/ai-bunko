title: 眠らない街の、ページをめくる音
genre: 本格ミステリー
tone: 温かくて軽やかな、少し不思議な雰囲気
pov: 一人称（わたし）
tense: 過去形
setting: 常にネオンが輝き続ける大都市の片隅にある、古びた古本屋「灯り堂」
premise: 眠らない街の喧騒から逃れるように佇む古本屋に、一冊の古い詩集が持ち込まれる。その中には、持ち主の意図が読み取れない不思議な栞がいくつも挟まれていた。わたしは、その栞が指し示す「街の断片」を辿り、かつてそこに込められた善意の行方を追い始める。それは、誰かが誰かに残した、届かなかった手紙のような物語だった。
themes:
- 人の善意の行方
- 記憶の継承
rules:
- 殺人は一切起きない
- 謎の答えは必ず日常の些細な違和感から導き出される
- 物理的な遺失物ではなく、感情や意図の行方を追う
plot_outline:
- '序盤: 古本屋「灯り堂」に届いた謎の詩集。挟まれていた栞には、街の特定の場所を示す古い地図のようなメモが記されていた。わたしは店主の指示で、そのメモの正体を調べることにする。'
- '中盤: 栞のメモを頼りに、眠らない街のカフェや公園を巡るわたし。そこで出会う人々との交流を通じて、栞が単なる「忘れ物」ではなく、ある種の「贈り物」であった可能性に気づき、パズルが組み上がり始める。'
- '終盤: 栞の持ち主と、それを受け取ろうとした人物の間の、美しいけれど切ないすれ違いが判明。本の背表紙に隠された小さな細工が、真実を解き明かす最後の鍵となる。'
- '結末: 誤解が解け、止まっていた時間が静かに動き出す。わたしはまた、新しい本を棚に並べる穏やかな日常へと戻っていく。'
style_notes: 一人称「わたし」による、少しとぼけた軽やかな語り口。読者が置いてけぼりにならないよう、難しい専門用語は避け、五感（古い本の匂い、街の喧騒、コーヒーの湯気）に訴える描写を大切にする。人の善意が誤解されてしまう切なさと、それが解ける瞬間の温かさを丁寧に描くこと。
