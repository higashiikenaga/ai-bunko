- name: リノ
  role: 主人公
  age: 13
  gender: 女性
  appearance: 透き通るように白い肌と、寒さで常に赤くなった指先が特徴。ぶかぶかの白いニットを纏っている。
  personality: 内向的で孤独を好むが、心の中には強い好奇心と切実な憧憬を秘めている。一人称は「私」。
  speech_style: 控えめで静かな口調。時折、独り言のように呟く。
  background: 村の外れで一人、古びた家で暮らす少女。村人からは「氷に呼ばれる子」と距離を置かれていた。
  motivation: 地図を完成させ、この村に一度も訪れたことのない「春」という季節を呼び戻したい。
  relationships:
  - name: シロ
    relation: 信頼し合う旅の相棒
  - name: 冬の神
    relation: 対峙すべき運命の存在
  arc: 孤独に耐えるだけの人生から、自らの意志で誰かを、そして世界を救おうとする強さを獲得する。
- name: シロ
  role: 相棒
  age: 0
  gender: 不明
  appearance: 月光のように輝く銀色の毛並みを持つ狐。瞳は深い瑠璃色で、知性を湛えている。
  personality: 理知的で皮肉屋だが、根は情に厚い。導き手としての誇りを持っている。一人称は「我」。
  speech_style: 古風で尊大な言い回し。相手を試すような問いかけが多い。
  background: 氷の城に仕えていた元守護獣。長い年月を経て、封印を解く（あるいは正しく戻す）資格を持つ人間を待っていた。
  motivation: 冬の神の暴走を防ぎ、この地の歪んだ時間の流れを正すこと。
  relationships:
  - name: リノ
    relation: 導くべき対象であり、唯一心を許した友人
  arc: 冷徹な観測者であったが、リノの純粋さに触れ、共感という温もりを取り戻す。
- name: 冬の神
  role: 敵役
  age: 0
  gender: 不明
  appearance: 半透明の氷で構成された巨大な人型の影。顔はなく、胸の奥に凍りついた心臓のような結晶が光っている。
  personality: 絶対的な孤独と飢餓感に支配されている。温もりを激しく求め、すべてを凍結させて所有しようとする。一人称は「私」。
  speech_style: 反響するような、重なり合う複数の声で語りかける。
  background: 遠い昔、村の先祖によって「永遠の冬」を司る力と共に氷の城へ封印された古き神。
  motivation: 封印を解き、世界を静寂な白い世界へと塗り潰し、自分を孤独から救い出す温もりを得ること。
  relationships:
  - name: リノ
    relation: 自らの孤独を埋めるための鍵として執着する対象
  arc: 破壊的な飢餓感に突き動かされていたが、リノの涙という真の温もりに触れ、静かな眠りへと帰っていく。
- name: ゲンゾウ
  role: 脇役
  age: 72
  gender: 男性
  appearance: 深く刻まれた皺と、片目を覆う古びた眼帯が特徴。厚手の毛皮のコートを着込んでいる。
  personality: 厳格で保守的。村の禁忌を守ることに執念を燃やしている。一人称は「わし」。
  speech_style: ぶっきらぼうで威圧的だが、言葉の端々に隠しきれない悲しみがある。
  background: 村の長であり、氷の城の伝承を継承する者。かつて地図の一部を追い求め、親しい者を失った過去を持つ。
  motivation: リノが禁忌に触れることを阻止し、村に平穏（停滞）を維持させること。
  relationships:
  - name: リノ
    relation: 危うい好奇心を持つ、危惧すべき村の娘
  arc: 過去のトラウマから変化を恐れていたが、リノの勇気を見て、停滞ではなく前進することに価値を見出す。
