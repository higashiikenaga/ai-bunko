title: 凍てつく指先と、雪解けを待つ地図
genre: 怪談・民俗
tone: 幻想的でどこか物悲しい、淡雪のような語り口
pov: 三人称
tense: 現在形を交えた叙情的文体
setting: 年中雪に閉ざされた、地図にも載らない北の果ての村
premise: いま、深い雪の底で、誰にも知られぬ声が響いています。村の端に住む孤独な少女は、ある日、氷に閉ざされた「氷の城」の断片を見つけます。それは、失われた季節を呼び戻すための「秘密の地図」へと繋がる鍵でした。しかし、地図を読み解くたびに、雪の中に潜む「忘れられたものたち」が、少女の温もりを求めて忍び寄ってきます。
themes:
- 忘却と記憶
- 自然への畏怖
- 孤独の救済
rules:
- 氷の城に触れた者は、心の一部が凍りつき、感情を失っていく
- 秘密の地図は、雪の結晶が特定の形を成した時にのみ読み取れる
- 雪の中に住む『白い影』は、言葉を話す人間を温もりで誘惑する
plot_outline:
- '序盤: 雪の村で暮らす少女・リノは、氷の城から流れてきた不思議な氷の破片を拾う。そこには、模様のように見える「秘密の地図」が刻まれていた。'
- '中盤: 地図を頼りに山を登るリノの傍らには、言葉を解する銀色の狐・シロが寄り添う。二人は地図の導きに従い、凍った湖の底にある、失われた祭壇を探し求める。'
- '終盤: 氷の城の正体は、村の先祖たちが封印した「冬の神」の檻であった。地図が完成したとき、神が目覚め、村全体を永遠の凍土に変えようとする。'
- '結末: リノはシロの導きにより、地図の最後の一片を自らの涙で溶かし、神を眠りに戻す。氷の城は消え、春の予感が、ほんの少しだけ雪の中に混じる。'
style_notes: ポム・ド・テールとしての筆致。まるで古い絵本をめくるような、静謐でどこか浮世離れしたリズムを大切にする。残酷な現象を描く際も、決して直接的に表現せず、雪や氷の冷たさに託して、詩的に、美しく、そして少しだけ怖く描写すること。
