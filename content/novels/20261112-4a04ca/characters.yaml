- name: シエル
  role: 主人公
  age: 19
  gender: 中性
  appearance: 透き通るような白い肌に、光を反射して色を変える銀髪。感情の起伏が少ない、硝子のように静謐な瞳を持つ。装飾のない簡素な白の司書服を纏っている。
  personality: 内向的で潔癖。純粋な真実こそが唯一の救いであると信じている。一人称は「私」。
  speech_style: 淡々としており、無駄な形容詞を省いた正確で簡潔な話し方。
  background: 記憶を失った状態で地下図書館に現れ、以来、真実を結晶化させる管理業務に従事している。嘘を吐けば死に至る呪いに適応し、静寂に安らぎを感じていた。
  motivation: 世界で最も純粋で、一点の曇りもない「究極の真実」を蒐集すること。
  relationships:
  - name: ルシアン
    relation: 憧憬と恐怖を抱く訪問者
  - name: メルキオール
    relation: 絶対的な規律を強いる管理者
  arc: 真実こそが正義だと信じていたが、ルシアンとの出会いで「美しき嘘」の価値に目覚め、最終的に呪いを受け入れて自ら結晶となる道を選ぶ。
- name: ルシアン
  role: 相棒/導き手
  age: 不明
  gender: 男性
  appearance: 陽光を凝縮したような金髪と、左右で色の異なる瞳（金と虚無の黒）。色彩豊かな豪奢な衣装を身にまとい、歩くたびにどこからか花の香りが漂う。
  personality: 享楽的で奔放。真実を「退屈な泥」と呼び、嘘を「宝石」と称する。残酷さと慈愛が同居している。一人称は「僕」。
  speech_style: 詩的で婉曲的。相手を翻弄するような、甘く誘惑的な口調。
  background: かつて真実の重みに耐えかねて砕け散った神の記憶の断片。実体を持たないはずだが、嘘を糧に形を維持している。
  motivation: 無機質な地下図書館を鮮やかな嘘で塗り潰し、自分と同じように「砕け散る快楽」を分かち合える相手を探している。
  relationships:
  - name: シエル
    relation: 壊したいほど愛おしい玩具
  - name: メルキオール
    relation: 反目し合う天敵
  arc: シエルに嘘の美しさを教え込み、彼が自らの意思で破滅へと突き進むよう背中を押すことで、自身の孤独を埋めようとする。
- name: メルキオール
  role: 敵役
  age: 外見は50代
  gender: 男性
  appearance: 痩身で長身。常に黒い喪服のようなコートを着用し、口元を銀のマスクで覆っている（不用意な発言による呪いの発動を防ぐため）。
  personality: 冷徹で教条主義的。図書館の秩序を何よりも優先し、人間を単なる「素材」としてしか見ていない。一人称は「私」。
  speech_style: 威圧的で高圧的。断定的な言い切りが多く、慈悲を感じさせない。
  background: 地下図書館の最高責任者。数世代にわたり「魂の剥製」を作り続けてきた、システムの一部のような存在。
  motivation: あらゆる人間の魂を抽出し、完璧な結晶書として書庫を埋め尽くすこと。
  relationships:
  - name: シエル
    relation: 効率的に真実を抽出するための優秀な器
  - name: ルシアン
    relation: 書庫を汚染する不浄な異物
  arc: ルシアンによる撹乱を排除しようとするが、結果的にシエルが「自発的な嘘」という最高品質の結晶に変わる瞬間を演出することになる。
