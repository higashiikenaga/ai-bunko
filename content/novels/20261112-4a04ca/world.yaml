title: 蒼晶の書庫と、舌を刺す真実の棘
genre: ホラー
tone: 耽美で退廃的、静謐な狂気
pov: 一人称
tense: 過去形
setting: 幾千の結晶書が棚を埋め尽くす、深淵の地下図書館
premise: 降り積もる沈黙のなか、私はただ、透き通った真実を蒐集し続けてきた。そこは「嘘をつけない呪い」が支配する、美しくも残酷な地下図書館。ある日、私はその静寂を乱す、あまりにも華美で、あまりにも空虚な「嘘の化身」と出会う。剥き出しの真実が魂を削り、偽りが宝石のように輝くとき、私の心は砕け散る硝子のように、逃れられない破滅へと加速していく。
themes:
- 真実という名の暴力
- 美しき虚飾への渇望
rules:
- 図書館内では、嘘を口にした瞬間に喉から鋭利な水晶の破片が溢れ出し、身体を内側から破壊する
- 書架に並ぶ結晶書は、真実を語りすぎた者の魂が結晶化したものである
plot_outline:
- '序盤: 硝子細工のような静寂に包まれた地下図書館での、孤独な管理業務。嘘を吐けば死に至る呪いの中で、主人公は「純粋な真実」だけを愛し、透明な日々を過ごしていた。'
- '中盤: 呪いを嘲笑うかのように、美しく、毒のように甘美な嘘を纏った訪問者が現れる。その者は、無機質な結晶書を鮮やかな偽りの色彩で染め上げていく。主人公は、その「美しき嘘」に、禁じられた憧憬を抱き始める。'
- '終盤: 図書館の真の役割が、人間の真実を抽出して永遠の結晶へと変える「魂の剥製箱」であることを知る。訪問者の正体は、かつて真実の重みに耐えかねて砕け散った、神の記憶の欠片であった。'
- '結末: 偽りの輝きを求める主人公は、呪いに抗って「嘘」を望む。しかし、嘘を吐こうとした瞬間、喉からは大量の水晶が溢れ出す。自らの内側から砕け散りながら、主人公は最も美しい嘘を吐き、永遠の結晶へと変わる。'
style_notes: 常に比喩として、ガラスの硬質さ、宝石の屈折、花の凋落を用いること。感情の揺らぎを、光の乱反射や色彩の変遷に例えて、装飾的かつ詩的な文体で記述する。
