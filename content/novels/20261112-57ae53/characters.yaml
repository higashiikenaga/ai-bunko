- name: エラ・ラストワース
  role: 主人公
  age: 19
  gender: 女性
  appearance: 油汚れのついた大きなゴーグルを頭に載せ、サイズの合わない厚手の革ジャンを羽織っている。赤褐色の乱れたショートヘア。常に工具ポーチを腰に下げている。
  personality: 皮肉屋で現実主義。生存本能が強く、他人に期待しない冷めた態度を取るが、機械に対する情熱だけは人一倍強い。一人称は「あたし」。
  speech_style: ぶっきらぼうで口が悪いが、機械の話になると早口になり、専門用語を多用する。
  background: 幼い頃に親を亡くし、ジャンク屋の親方に拾われて生き延びた。廃材から使える部品を探し出し、独自の改造を加えた蒸気バイクを相棒としている。
  motivation: 最初は手紙の報酬目的だったが、次第に失われた世界の真実と、自分自身の居場所を探したいという欲求に突き動かされる。
  relationships:
  - name: セブン
    relation: 拾ったドローンであり、旅の道案内兼愚痴聞き役
  - name: カエル
    relation: 追っ手であり、価値観の対極にいる宿敵
  arc: 「自分さえ生き残ればいい」という孤独な生存戦略から、不確かな未来であっても誰かと共に歩む勇気を持つへと成長する。
- name: セブン
  role: 相棒
  age: 0
  gender: 不明
  appearance: 球形の旧世代配達用ドローン。表面は錆びて剥げ落ちており、片方の光学レンズにひびが入っている。小さなアームを一本持っている。
  personality: 極めて礼儀正しく、献身的。プログラムのバグにより、時折人間のような情緒的な反応や、的外れな冗談を言う。
  speech_style: 丁寧語。機械的な合成音声だが、感情が高ぶるとノイズが混じり、声調が乱れる。
  background: 数十年前、ある手紙を届ける途中で砂嵐に巻き込まれ、機能停止していた。エラに回収され、修理されたことで再起動した。
  motivation: 「宛先不明の手紙」を、正当な受取人（あるいはそれに代わる者）へ届けるという最優先指令の完遂。
  relationships:
  - name: エラ・ラストワース
    relation: 所有者であり、唯一の友人
  arc: 単なるプログラムの遂行ではなく、エラとの交流を通じて「意志」を持つようになり、最後には自らの判断で彼女をサポートする。
- name: カエル
  role: 敵役
  age: 32
  gender: 男性
  appearance: 砂漠に不釣り合いな、汚れ一つない純白の軍服に身を包んでいる。右腕は精巧な銀色の機械義手となっており、指先から通信端子が伸びている。
  personality: 冷酷で完璧主義。秩序と効率を至上とし、弱者の生存権よりも文明の再興（管理された支配）を優先する。
  speech_style: 理知的で静か。相手を見下した、余裕のある話し方をする。
  background: 旧時代の技術を独占しようとする武装集団「白亜の歯車」の執行官。永久機関の情報を得て、それを軍事利用するためにエラを追う。
  motivation: 永久機関を奪取し、自分たちが世界の頂点に立つ絶対的な秩序を再構築すること。
  relationships:
  - name: エラ・ラストワース
    relation: 目的物を運ぶ「運搬屋」として利用し、その後排除する対象
  arc: 絶対的な力こそが正義だと信じていたが、エラが選んだ「不完全な希望」に触れ、自らの空虚さに気づかされる。
- name: クララ
  role: 鍵となる人物（故人）
  age: 22
  gender: 女性
  appearance: 手紙の主。物語終盤にホログラム記録として登場。当時の村の衣装を着た、穏やかな微笑みを浮かべる女性。
  personality: 深い慈愛と知性を持ち、絶望的な状況にあっても未来への希望を捨てなかった。楽観主義者でありながら、現実の残酷さも理解していた。
  speech_style: 詩的で柔らかい口調。語りかけるような話し方。
  background: 消えた村の技術者であり、世界の崩壊を止めることができないと悟った際、次世代に希望を託すためのプログラムと手紙を遺した。
  motivation: いつかこの手紙を読んだ者が、過去の過ちを繰り返さず、新しい世界を切り拓くこと。
  relationships:
  - name: エラ・ラストワース
    relation: 時を超えて意志を継がせる相手
  - name: セブン
    relation: 信頼して手紙を託した使い手
  arc: （故人のため変化はないが）彼女の遺した言葉が、エラの絶望を希望へと変える精神的支柱となる。
