title: 錆びた歯車と、祈りの蒸気機関
genre: スチームパンク冒険
tone: 乾いたユーモアと哀愁漂うポストアポカリプス
pov: 一人称（あたし）
tense: 過去形
setting: 大蒸気が枯渇し、巨大な機械仕掛けの遺構が砂漠化した終末世界
premise: 空を覆う厚い雲と砂嵐に閉ざされた世界で、あたしはジャンク屋として日々、残ったガソリンや蒸気の残量に怯えながら生きている。ある日、砂に埋もれた旧時代の配達用蒸気ドローンから、宛先不明の『失われた手紙』を回収したことが運命を狂わせた。その手紙が指し示す先には、地図から『消えた村』と呼ばれ、伝説の永久機関が眠るとされる聖域があった。あたしは、ガラクタと皮肉を詰め込んだ改造蒸気バイクを走らせ、失われた真実を探す旅に出る。
themes:
- 失われた繋がりへの渇望
- 廃墟の中に宿る美しさ
rules:
- 蒸気圧の管理が生命線であり、圧力計の数値が物語の緊張感を決定する
- 高度な機械文明の遺物は『遺物』として扱われ、その稼働には特定の触媒が必要である
- 空は常に砂混じりの重い雲に覆われ、太陽は直接見ることができない
plot_outline:
- '序盤: ジャンク屋のあたしは、砂嵐の中で一台のドローンを拾う。そこには宛先不明だが、読む者の心を揺さぶる切実な『失われた手紙』が入っていた。好奇心と、わずかな報酬への期待から、あたしは地図にない場所への旅を決意する。'
- '中盤: 旅の途中、燃料と蒸気水の残量が限界に達する恐怖と戦いながら、あたしは高度な自律型警備機械の追跡をかわす。手紙の主がかつて住んでいたという『消えた村』の痕跡を辿るうち、世界がなぜ機械の死を迎えたのかという残酷な真実が浮かび上がる。'
- '終盤: 辿り着いた『消えた村』は、巨大な機械の心臓部の上に構築された美しい廃墟だった。そこには手紙の主が遺した、世界を再起動させるための最後のプログラムが眠っていた。あたしは、自分自身の生存本能と、世界を救うという非現実的な選択の間で揺れる。'
- '結末: あたしは、すべてを元通りにするのではなく、ただ『新しい朝』を迎えられるようにシステムを書き換える。蒸気は尽き、あたしのバイクも動かなくなるが、雲の隙間から差し込んだ一筋の光が、錆びた街を黄金色に染め上げるのを眺めながら、あたしは新しい地図を描き始める。'
style_notes: 語り手は『あたし』。口調は荒っぽく、常に「残弾数」や「蒸気圧」「食料の残り」といったリソースの欠乏を意識させる。過酷な状況下でも、錆びた歯車の回転や、廃墟に差し込む光の美しさを皮肉混じりに、かつ情緒的に描写すること。絶望的な世界観の中に、乾いた笑いと一筋の情熱を混ぜ込む。
