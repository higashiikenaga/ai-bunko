- name: アリステア・ソーン
  role: 主人公
  age: 34
  gender: 男性
  appearance: 痩身で青白い顔。度の強い眼鏡をかけ、指先は常にインクで汚れている。仕立ての良いが使い古されたツイードのジャケットを着用。
  personality: 理知的で強迫的なまでの完璧主義者。一人称は「私」。感情を排して事象を記述することに快感を覚える。
  speech_style: 極めて形式的で、学術論文のような硬い口調。断定を避け「～と考えられる」「～の蓋然性が高い」といった表現を多用する。
  background: 王立天文学会に所属する天球測量学者。かつてある観測ミスで同僚を失った過去があり、それ以来「客観的な真実」への執着を強めている。
  motivation: 秘密の地図の解析を通じて、世界の物理法則を完全に定義し、失われた文明の正体を証明すること。
  relationships:
  - name: クララ・ヴァレリウス
    relation: 航海士兼助手。唯一信頼している実務的なパートナー。
  - name: ジュリアン・ヴェイン
    relation: 先代の調査員。地図を通じて対話する、憧憬と恐怖の対象。
  arc: 客観的な観測者であるという自負が、観測される側へと転じることで崩壊し、最終的に認識の彼方へ吸収される。
- name: クララ・ヴァレリウス
  role: 相棒
  age: 26
  gender: 女性
  appearance: 短く切りそろえた栗色の髪。油汚れのついた飛行服を身に纏い、ゴーグルを首にかけている。快活で健康的な肢体。
  personality: 直感的で現実主義。一人称は「私」。理論よりも経験を信じ、危機管理能力に長けている。
  speech_style: ぶっきらぼうだが温かみのある口調。専門用語を嫌い、比喩や日常的な言葉で状況を言い換える傾向がある。
  background: 元空軍の精鋭操縦士。重力異常地帯「空の海」での航行技術に長けており、ソーンの理論を現実の航跡に落とし込む役割を担う。
  motivation: ソーンを無事に地上へ帰還させること。および、空の海に潜む未知の現象への純粋な好奇心。
  relationships:
  - name: アリステア・ソーン
    relation: 雇い主であり友人。彼の危うい精神性を危惧している。
  arc: 理屈では説明できない現象に直面し、次第にソーンが陥っていく「認識の罠」に気づき、彼を繋ぎ止めようと足掻く。
- name: ジュリアン・ヴェイン
  role: 敵役（触媒）
  age: 不明（外見は40代）
  gender: 男性
  appearance: 半透明に近い淡い色彩の衣服を纏った、幽霊のような佇まい。瞳には星雲のような渦巻きが浮かんでいる。
  personality: 厭世的で詩的。一人称は「僕」。現実と虚構の境界を喪失しており、親切さと残酷さが同居している。
  speech_style: 婉曲的で謎めいた話し方。しばしば答えのない問いを投げかけ、相手の認識を揺さぶる。
  background: 数十年前、秘密の地図を最初に発見し、調査の末に「地図の一部」となった先代の調査官。思考の残滓として空に漂っている。
  motivation: 自分に代わって現実を再定義し、この絶望的な観測を完結させてくれる「後継者」を導くこと。
  relationships:
  - name: アリステア・ソーン
    relation: 鏡合わせの存在。彼を誘い込み、自分と同じ境遇へと導こうとする。
  arc: ソーンの意識を完全に浸食し、彼と融合することで、一時的に物理的な形を取り戻そうとする。
