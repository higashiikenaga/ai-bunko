title: 高層気層における非定型事象に関する考証 ―失われた天球測量図の断片と、浮遊型構造物の観測記録―
genre: 伝奇
tone: 学術的、不穏、静謐
pov: 一人称（調査報告形式）
tense: 過去形
setting: 蒸気機関と天文学が高度に発展した架空の19世紀。および、重力異常が常態化している「空の海」と呼ばれる上層大気圏。
premise: 本報告書は、発掘された「秘密の地図」[1]の解析、およびそこに記された「空飛ぶ船」の航跡に関する調査記録である。当該地図は、観測者の認識に応じて地形を動的に変化させる特異な性質を有する。調査が進むにつれ、空を漂う船の正体が、かつて存在した文明の「思考の残滓」であることが示唆される。読者は断片的な報告から、世界が観測によって再構築されているという戦慄すべき真実を組み立てることになる。
themes:
- 認識による現実の変容
- 失われた文明の数学的痕跡
- 観測者の孤独
rules:
- 空の海における重力は、特定の音響周波数に依存して変動する。
- 秘密の地図は、所有者の意識と同期して座標を決定する。
- 空飛ぶ船は、物質的な実体ではなく、高度な数式によって記述された現象である。
plot_outline:
- '序盤: 発掘された「秘密の地図」の物理的・幾何学的特性に関する記述。脚注を用いた専門用語の導入。'
- '中盤: 地図が示す航跡を辿る、未知の「空飛ぶ船」の観測記録。船が残す「音の残響」と、物理法則の崩壊についての報告。'
- '終盤: 地図の真の機能が「現実の再定義」であることの判明。調査官自身の意識が、記録の一部として地図に吸収されていく過程。'
- '結末: 報告書の最終項。記述は意味をなさない数式と、断片的な音節の羅列へと変貌し、突如として終了する。'
style_notes: 学術論文や調査報告書の体裁を徹底すること。感情的な表現を避け、「～と推測される」「～と観測された」といった記述を行う。物語の核心は直接語らず、脚注による補足や、資料の断片、記述の矛盾を通じて、読者に全体像を組み立てさせる実験的な構成とする。
