- name: レイ・アステール
  role: 主人公
  age: 32
  gender: 男性
  appearance: 青白い肌に痩身。常にデータ端末を携帯し、重力の影響でわずかに前傾姿勢で歩く癖がある。
  personality: 内省的で知的好奇心が強い。孤独を好むが、真理に対する誠実さを最優先する。一人称は「私」。
  speech_style: 丁寧だがどこか距離感のある話し方。専門用語を多用する傾向がある。
  background: 銀河連邦物理研究所の若き天才。先代所長の推薦により、人類最後の観測基地へと単身赴任した。
  motivation: 先代が遺した謎を解き明かし、物理学者としての究極の証明を成し遂げること。
  relationships:
  - name: ライラ・ノヴァ
    relation: 信頼し合う唯一の同僚
  - name: アリス・ソーン
    relation: 精神的な師であり、遺志を継ぐべき対象
  - name: ヴァーン指揮官
    relation: 価値観の対立する上司
  arc: 観測者としての受動的な生き方から、自らの命を賭して宇宙の運命を決定づける能動的な選択へと変化する。
- name: ライラ・ノヴァ
  role: 相棒
  age: 28
  gender: 女性
  appearance: 短く切り揃えた赤髪に、オイル汚れのついた作業服。快活な印象を与える大きな瞳。
  personality: 現実主義で行動的。感情表現が豊かで、論理に偏りがちなレイを人間的な視点からサポートする。一人称は「あたし」。
  speech_style: 砕けた口調で、率直に意見をぶつける。比喩表現を好む。
  background: 基地の最高責任エンジニア。極限環境での設備維持という過酷な任務をこなしながら、レイの精神的な支えとなる。
  motivation: 基地の安全を維持し、レイと共に生きて故郷の星系へ帰還すること。
  relationships:
  - name: レイ・アステール
    relation: 危なっかしい天才を放っておけない保護者的感情
  - name: ヴァーン指揮官
    relation: 規律よりも実利を優先するため、しばしば衝突する
  arc: 個人の生存への執着を捨て、レイが導き出した「大義」のために彼を送り出す覚悟を決める。
- name: ヴァーン指揮官
  role: 敵役/障壁
  age: 55
  gender: 男性
  appearance: 厳格な軍服に身を包み、右目に義眼を装着している。彫りの深い険しい顔立ち。
  personality: 冷徹な現実主義者。集団の生存と秩序を最優先し、不確定要素を徹底的に排除しようとする。一人称は「私」。
  speech_style: 断定的で威圧的な口調。命令形が多く、無駄な会話を嫌う。
  background: 元惑星防衛軍の将校。基地の治安維持と運用管理を任されており、禁断の数式がもたらす混乱を恐れている。
  motivation: 基地の秩序を維持し、現在の生存者を一人でも多く安全に維持すること。
  relationships:
  - name: レイ・アステール
    relation: 危険な思想に染まりつつある危うい学者として監視している
  - name: ライラ・ノヴァ
    relation: 能力は認めているが、規律を軽視する態度を快く思っていない
  arc: 絶対的な管理こそが正義だと信じていたが、宇宙の崩壊という抗えない真実に直面し、自身の無力さを悟る。
- name: アリス・ソーン
  role: 導き手（故人）
  age: 70
  gender: 男性
  appearance: ホログラム映像として登場。白髪で深く刻まれた皺があり、慈愛と狂気が同居した眼差しをしている。
  personality: 求道的に真理を追究した物理学者。目的のためには倫理を捨てることも厭わなかった。一人称は「私」。
  speech_style: 詩的で含みのある話し方。問いかけるような口調が多い。
  background: 先代の基地所長。地下図書館を建設し、宇宙の崩壊を防ぐ数式を完成させたが、実行の手前で寿命を迎えた。
  motivation: 自分の死後、この数式を実行できる適格者が現れ、人類の種を存続させること。
  relationships:
  - name: レイ・アステール
    relation: 自分の知能と精神的継承者として選んだ後継者
  arc: （回想・記録の中での変化）純粋な好奇心から始まった研究が、次第に全宇宙を背負う絶望的な使命へと変わっていく過程が描かれる。
