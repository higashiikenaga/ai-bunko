title: 事象の地平線に眠る数式
genre: SF
tone: 重厚で冷徹、しかし圧倒的な宇宙のスケールを感じさせるハードSF
pov: 三人称
tense: 過去形
setting: 西暦3400年台、超巨大ブラックホールの降着円盤近傍に浮かぶ人類最後の観測基地
premise: 重力異常によって時間の進みが極端に遅くなったブラックホール近傍の観測基地で、物理学者レイは先代の遺した遺言と隠された地下図書館を発見する。そこには、宇宙の崩壊を防ぐための禁断の物理演算データが眠っていた。極限の環境下で、彼は数式が示す残酷な宇宙の真実と対峙する。
themes:
- 重力と時間の相対性
- 知識の継承と宇宙の運命
- 知性の限界と希望
rules:
- アインシュタインの一般相対性理論および現代の量子力学の法則を厳密に遵守する。
- 光速を超える移動や通信は不可能であり、時空の歪みによる影響（時間の遅れや重力赤方偏移）は正確に計算される。
plot_outline:
- '序盤: ブラックホール近傍の観測基地に着任したレイが、極端な重力下での日常と、先代所長が遺した「地下図書館」へのアクセス権を引き継ぐ。'
- '中盤: 地下図書館の蔵書から、ブラックホールの特異点を利用した未知の物理演算プロセスと、先代の遺言に記された「宇宙の寿命を強制的に引き延ばす数式」を発見する。'
- '終盤: 数式を実行するためには観測基地自体を降着円盤へ突入させる必要があり、レイは自身の死と引き換えに人類の未来を選ぶかどうかの決断を迫られる。'
- '結末: レイの実行によって全銀河に向けて放たれた最後のデータ（光のパルス）が、遠く離れた星系の人類生存圏へと届く描写で幕を閉じる。'
style_notes: ペンネーム「七海シグマ」。ハードSFとしての科学的な設定（重力、時空、量子力学）を物語の核に据え、専門用語には必ず平易な言葉で補足を入れる。物理法則を決して破らず、ブラックホールの圧倒的なスケールと美しさを描くことで、センス・オブ・ワンダーを追求する。
