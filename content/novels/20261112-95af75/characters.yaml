- name: カイ
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し癖のある黒髪に、感情が漏れ出した際に色が揺らめく瞳。常に首元を隠すストールを巻いている。
  personality: 誠実で内向的。自分の感情が制御不能な音となって溢れ出すことを恐れている。一人称は「僕」。
  speech_style: 控えめでたどたどしい。感情が高ぶると、言葉が自然と歌のような旋律を帯びる。
  background: 生まれつき「嘘をつけない呪い」を持っており、心の内で思ったことが強制的に歌として発せられるため、周囲から浮き、孤独な学生生活を送っていた。
  motivation: ありのままの自分を肯定してくれる場所を見つけたい。
  relationships:
  - name: ルナ
    relation: 惹かれ合う共鳴相手
  - name: レオ
    relation: ライバル兼理解者
  arc: 自分の「呪い」を欠点ではなく、誰かの心に届く唯一無二の「真実の音」であると受け入れる。
- name: ルナ
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 透き通るような銀髪のロングヘア。冷徹に見えるほど整った美貌を持つが、瞳に深い孤独を宿している。
  personality: 完璧主義でストイック。弱さを見せることを嫌い、常に「正解」の音楽を奏でようとする。一人称は「私」。
  speech_style: 丁寧で理知的。感情を排した淡々とした話し方をする。
  background: 音楽学校の天才として称賛されているが、その実態は周囲の期待に応えるための「完璧な模倣」であり、自分自身の音が何なのかを見失っている。
  motivation: 月食の夜にだけ現れるという、偽りのない「真実の音」を奏でること。
  relationships:
  - name: カイ
    relation: 自分の嘘を暴き、真実を教える存在
  - name: レオ
    relation: 音楽的な競争相手
  arc: 完璧であることへの強迫観念を捨て、不協和音さえも愛おしいと思える等身大の自分を取り戻す。
- name: レオ
  role: 相棒/ライバル
  age: 18
  gender: 男性
  appearance: 華やかな金髪に、派手なアクセサリーを身につけた快楽主義的な風貌。常に不敵な笑みを浮かべている。
  personality: 自信家で享楽的。しかし観察眼が鋭く、他人の本質を見抜くことに長けている。一人称は「俺」。
  speech_style: 軽快で芝居がかった口調。相手を挑発するような言い回しを好む。
  background: 都市アリアナの特権階級出身。あらゆる音楽的技法を習得したが、予定調和な世界に退屈していたところ、カイの「制御不能な音」に興味を持つ。
  motivation: 世界を塗り替えるほどの、全く新しい未知の旋律を目撃すること。
  relationships:
  - name: カイ
    relation: 才能への好奇心と友情
  - name: ルナ
    relation: 退屈を埋めてくれる良きライバル
  arc: 単なる観察者から、二人の共鳴を促すための演出家・協力者へと変化する。
