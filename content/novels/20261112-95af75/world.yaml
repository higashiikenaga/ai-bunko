title: 月蝕の旋律、真実の低音
genre: 青春恋愛
tone: 叙情的でリズム感のある、切なくも眩い旋律
pov: 三人称
tense: 過去形
setting: 音楽が魔術的な力を持ち、歌声が空の色を塗り替えることができる「音響都市アリアナ」。
premise: 歌うことで感情を形にする世界で、少年・カイは「嘘をつけない呪い」により、心に秘めた想いをすべて歌として溢れさせてしまう宿命を背負っていた。一方、天才的な旋律を奏でる少女・ルナは、月食の夜にだけ現れる「真実の音」を求めて彷徨っている。二人が共鳴したとき、隠してきた偽りの旋律が剥がれ落ち、月が欠ける瞬間に真実の恋が幕を開ける。
themes:
- 自己開示の痛みと喜び
- 真実と偽りの境界線
rules:
- 感情が高ぶると、その者の言葉や歌が物理的な光や音波となって周囲に漏れ出す。
- 「嘘をつけない呪い」を持つ者は、意図的な嘘をつこうとすると喉が焼け付くような痛みを感じる。
- 月食の間、音楽の力は増幅され、歌い手の魂が直接世界に干渉する。
plot_outline:
- '序盤: 感情が音として漏れてしまう呪いに苦しみ、孤独に歌うカイ。彼は音楽学校の屋上で、月を愛でるように無言で奏でる謎めいた少女ルナと出会う。'
- '中盤: 二人は共に音楽を追求する中で惹かれ合うが、カイの「嘘をつけない」性質が、ルナの抱える「完璧な音楽を奏でなければならない」という強迫観念的な嘘を暴いてしまう。'
- '終盤: 月食の夜、ルナは自分自身の弱さを隠すための旋律を捨て、カイの剥き出しの感情に呼応する。二人の奏でる不協和音は、やがて世界を包む至高の合奏へと変わる。'
- '結末: 月食が明け、世界は以前と同じ色を取り戻すが、二人の間には嘘のない、透明な旋律だけが響き続けている。'
style_notes: 文章は音符が跳ねるようにリズミカルに構成し、擬音語や比喩に音楽用語を多用する。各話の区切りには、その場の情景や登場人物の心情を象徴する「一節の詩（歌詞）」を必ず挿入すること。情景描写は、光と音の色彩が混ざり合うように、流麗かつ鮮やかに綴る。
