- name: カイ・アルトマン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 無造作な黒髪に、常に油汚れのついた作業着。鋭いがどこか寂しげな瞳をしている。
  personality: 合理的で現実主義。他者と深く関わることを避ける孤独な性質。一人称は「俺」。
  speech_style: 簡潔でぶっきらぼうだが、機械に対しては丁寧な口調になる。
  background: 孤児として育ち、海底遺物の回収業者として日銭を稼いで生きている。かつて技術者だった父を亡くしている。
  motivation: ただ生き延びるために遺物を回収することから、リナの想いを届けるために命を懸けることへ変わる。
  relationships:
  - name: リナ
    relation: 出会いを通じて守るべき存在となる少女
  - name: ガルド
    relation: 仕事の依頼主であり、師のような存在
  arc: 他者との関わりを拒絶していた孤独な青年が、リナとの交流を通じて、誰かのために情熱を注ぐ勇気を取り戻す。
- name: リナ・セレスティア
  role: ヒロイン
  age: 15
  gender: 女性
  appearance: 透き通るような白い肌と、潮風に揺れる淡い銀髪。常に古い蒸気式のオルゴールを抱えている。
  personality: 穏やかで思慮深く、言葉を持たない代わりに瞳で感情を伝える。一人称は（声が出ないため設定なし、書き言葉では「私」）。
  speech_style: 発声はできない。手書きのメモや、オルゴールの音色、身振り手振りで意思疎通を図る。
  background: かつて海底文明の研究者だった一族の末裔。病によって声を失い、海辺の廃屋で隠れるように暮らしている。
  motivation: オルゴールに込められた家族の記憶と、伝えられなかった「言葉」を海へ解き放つこと。
  relationships:
  - name: カイ
    relation: 孤独な世界で初めて心を通わせたパートナー
  arc: 自身の喪失感と過去の悲劇に沈む日々から、失われたものを受け入れ、未来へ言葉を託す強さを得る。
- name: ガルド・ヴォーン
  role: 脇役 / メンター
  age: 54
  gender: 男性
  appearance: がっしりとした体格に、使い込まれた革のエプロンを着用。片目に真鍮製の義眼をつけている。
  personality: 豪快で経験豊富。口は悪いが情に厚い。一人称は「俺」。
  speech_style: 怒鳴るような大きな声だが、時折、静かで重みのある助言を与える。
  background: 島の遺物回収ギルドのベテラン。カイの技術を見込み、彼を荒事の世界へ引き込んだ。
  motivation: 島に伝わる古い伝承を守りつつ、新しい世代に技術と知識を継承すること。
  relationships:
  - name: カイ
    relation: 技術を教え込み、見守ってきた弟子のような存在
  arc: 時代の変化と遺跡の消失を悟りながらも、カイたちの歩む道が正しいことを確信して背中を押す。
