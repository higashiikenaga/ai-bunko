title: 凪の底の歯車
genre: ヒューマンドラマ
tone: 静謐で、どこか寂寥感のある温かさ
pov: 三人称近接視点
tense: 過去形
setting: 蒸気機関が生活の隅々に溶け込んだ、海辺の寂れた島国。潮位の変化が激しい断崖の街。
premise: かつて海底に沈んだ文明の遺物、海底遺跡から回収される「失われた技術」を研究する青年・カイは、病で声を失った少女・リナと出会う。二人は、遺物の中に眠る蒸気機関の断片を修理しながら、失われた記憶と向き合っていく。潮が引く時だけ姿を現す遺跡は、死者との対話の場でもあった。絶望の淵で、彼らは小さな光を見つけ出す。
themes:
- 喪失と再生
- 声にならない祈り
- 記憶の継承
rules:
- 海底遺跡の遺物は、特定の蒸気圧を与えないと機能しない
- 潮が満ちる時間帯は、遺跡への立ち入りが物理的に不可能である
- 失ったものは、形を変えて必ずどこかへ漂着する
plot_outline:
- '序盤: 遺物回収業者として孤独に生きるカイが、遺跡の調査中に、海辺の廃屋で静かに暮らすリナと出会う。'
- '中盤: リナが持つ古い蒸気式のオルゴールが、海底遺跡の構造と密接に関わっていることが判明する。二人は遺跡の深部を目指すが、そこにはかつての文明が滅びた理由と、リナの家族の悲しい記憶が眠っていた。'
- '終盤: 巨大な潮汐が訪れ、遺跡が完全に水没しようとする中、カイはリナの「伝えたい言葉」を届けるため、壊れかけた蒸気機関を起動させる決断をする。'
- '結末: 遺跡は沈むが、リナの言葉は音となって海に響く。失ったものは戻らないが、二人の手元には、明日へ進むための小さな温もりが残されている。'
style_notes: 感情を直接的な言葉で説明せず、波の音や蒸気の揺らぎ、光の粒子といった情景描写に託して表現する。病や別れという重い事象を描く際も、過度な悲劇性を避け、読者が静かに寄り添えるような、淡々としながらも慈しみのある筆致を維持する。
