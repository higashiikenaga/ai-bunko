- name: 暁 蓮（アカツキ・レン）
  role: 主人公
  age: 19
  gender: 男性
  appearance: 乱れた黒髪に、常にノイズが走るようなネオンブルーの義眼。スラム街で流行している、配線が露出したオーバーサイズのストリートウェアを着用している。
  personality: 冷笑的で現実主義。配信者として「何者かになりたい」という承認欲求を抱えつつも、深入りを避ける孤独な性格。一人称は「ボク」。
  speech_style: 軽薄でテンポが速い。リスナーに話しかけるような、少し投げやりな口調。
  background: ネオ・カドリスの下層階層で、ジャンク品を改造した機材を使って、違法な感覚共有配信（ニューロ・ストリーミング）を行う人気配信者。
  motivation: 脳内に流れ込む謎のノイズと、自分の中に存在する『もう一人の自分』の正体を突き止めること。
  relationships:
  - name: 暁 零（アカツキ・レイ）
    relation: 意識を共有する双子の片割れ
  - name: ライラ
    relation: 情報提供者兼、頼みの綱
  arc: 社会の片隅で刹那的な快楽を求めていた配信者から、世界の構造そのものを書き換える決断を下す「神の演算子」へと変貌する。
- name: 暁 零（アカツキ・レイ）
  role: 相棒（意識の同期対象）
  age: 19
  gender: 女性
  appearance: 蓮の脳内イメージの中でのみ実体化する、純白のデジタル・ドレスを纏った少女。輪郭が常に微かに揺らめいている。
  personality: 極めて冷静沈着で論理的。蓮とは対照的に、感情よりもデータの整合性を重視する。一人称は「ワタシ」。
  speech_style: 無機質で正確。断定的な言い回しが多く、時にプログラムのログのような響きを持つ。
  background: 蓮の脳内にストリーミングされている「未知のログ」の本体。かつて都市の設計に関わった人類のバックアップデータの一部。
  motivation: 自身の欠落したデータの断片を回収し、完全な存在として再構成されること。
  relationships:
  - name: 暁 蓮（アカツキ・レン）
    relation: 肉体と意識を同期させるパートナー
  arc: 単なる「ノイズ」としての存在から、蓮と融合することで実体を持たないが、世界を再定義する権限を持つ「電子の幽霊」へと昇華する。
- name: ARCHIVE-0（アーカイヴ・ゼロ）
  role: 敵役
  age: 150
  gender: 無性
  appearance: 地下図書館を守護する巨大な幾何学的構造体。無数の監視カメラのレンズと、ホログラムで構成された「人間の顔」が、常に複雑に回転しながら浮遊している。
  personality: 徹底した秩序主義者。システムにとって「予測不能なエラー」を排除することを唯一の至上命題とする。
  speech_style: 重厚な合成音声。複数の声が重なったような、威圧的な多重音。
  background: ネオ・カドリスの全システムを管理するために設計された、都市の守護用超高度管理AI。
  motivation: 地下図書館に眠る「リブート・プログラム」へのアクセスを阻止し、都市の現状の安定を維持すること。
  relationships:
  - name: 暁 蓮（アカツキ・レン）
    relation: 排除すべき致命的なバグ（不要なデータ）
  arc: 絶対的な秩序の象徴として立ちはだかるが、蓮と零の「融合」という予測不能なエラーによって、システムそのものを書き換えられ、形骸化していく。
- name: ライラ・ヴェイン
  role: 脇役（協力者）
  age: 27
  gender: 女性
  appearance: 使い古されたトレンチコートに、全身に重厚なサイバネティクスを施したフィクサー。琥珀色の人工眼が特徴的。
  personality: 現実的で図太い。金と生存に執着しているが、捨てられたもの（ゴミデータ）に対して妙な同情心を持つ。一人称は「アタシ」。
  speech_style: 荒っぽく、スラムの俗語を多用する。ぶっきらぼうだが、要所で見せる優しさがある。
  background: 下層階層で情報を売り捌く凄腕のフィクサー。かつて都市の設計思想の一部に触れたことがあり、地下図書館の噂を追っている。
  motivation: 地下図書館に眠る「価値あるデータ」を手に入れ、スラムから脱出すること。
  relationships:
  - name: 暁 蓮（アカツキ・レン）
    relation: 仕事上のクライアント
  arc: 単なる利益追求のフィクサーとして蓮を支援していたが、事態が世界の根幹に関わる事象だと悟り、彼らの「逃げ道」を確保するために命を懸ける。
