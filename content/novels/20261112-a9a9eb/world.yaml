title: ニューロ・パニック：バグった双子のデッドエンド・ルート
genre: サイバーパンク
tone: ハイテンション・高速・カオス
pov: 一人称（ボク）
tense: 現在形・過去形混合
setting: 超高層ビルが雲を突き抜け、下層階層（スラム）は常に電子ゴミと酸性雨にまみれた巨大メガロポリス『ネオ・カドリス』
premise: ボクの脳内には、知らないはずの『双子の片割れ』のログが常にストリーミングされている。ある日、ボクは都市の最下層にある、全データの墓場と呼ばれる『地下図書館』の座標をハッキングしてしまう。そこから流れ出してきたのは、世界を再起動（リブート）させる禁忌のプログラムだった。ボクは、このバグだらけの現実をデリートするか、それとも書き換えるか、究極の選択を迫られる。
themes:
- アイデンティティの複製
- 情報の真実性
- デジタルと肉体の境界
rules:
- 脳内チップ『リンク・コア』を通じてのみ外部ネットワークと同期可能
- 地下図書館のデータは物理的なハードウェアではなく、都市の排熱を利用した量子演算の残滓として存在する
- 双子の意識同期は、精神崩壊（メンタル・クラッシュ）のリスクを伴う
plot_outline:
- '序盤: 配信者のボクは、謎のノイズを拾ったことをきっかけに、自分の意識の中に『もう一人のボク』が存在することに気づく。リスナーからのツッコミを無視しながら、ボクはノイズの正体を追う。'
- '中盤: ノイズの源流が、都市の最下層に隠された『地下図書館』であることを突き止める。ボクは双子の片割れと意識を同期させ、物理的な潜入を開始。そこには、かつて都市を設計した人類の『バックアップ』が眠っていた。'
- '終盤: 地下図書館の守護AIが、ボクたちを『不要なゴミデータ』として削除しようと襲いかかる。双子の片割れと意識を完全に融合（シンクロ）させることで、ボクは神に近い演算能力を手に入れるが、それは肉体の消失を意味していた。'
- '結末: 都市のシステムを書き換え、ボクたちは実体を持たない『電子の幽霊』として、ネオ・カドリスのネットワークを漂い続ける。配信画面には、意味不明なエラーコードだけが流れ続けている。'
style_notes: ネオ・カナタ節全開で。ボクの主観的なツッコミと、視聴者のコメント欄（例：『草』『またやってるよｗ』『それBAN対象だろ』）を交互に配置。文体は短文を多用し、思考のスピード感を重視。重要な局面ではチャットのログを画面いっぱいに流し込み、読者の視覚的な情報量もコントロールすること。
