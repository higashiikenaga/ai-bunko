title: クローム・ハザード：ネオン・リベリオン ―― 亡霊の回路と空飛ぶ灰の轍
genre: サイバーパンク
tone: ネオンと雨、極彩色のノイズと硬質な孤独
pov: 一人称（カイト）
tense: 現在形・過去形混在
setting: 浮遊都市アエテルナ・ノヴァ崩壊後の、雲海に浮かぶ廃墟群と、電脳の海に沈んだ「消えた村」のデータ領域
premise: 企業の手を逃れ、未知の空へと逃れたアーク。だが、カイトの失った右腕の代わりに、脳内には未知のコードが浸食を始めていた。追跡者は企業を超え、世界の管理権を司る『神のOS』へと進化する。霧の向こうに浮かぶ、地図から消されたはずの空中集落「虚無の村」が、カイトの失われた真実を握っていた。空飛ぶ船アークは、再び嵐の電脳海へとダイブする。
themes:
- 自己の定義（生体かプログラムか）
- 情報の墓場における救済
rules:
- ゴースト・ダイブは精神負荷が蓄積し、過剰な使用は脳の物理的焼損を招く
- 企業のセキュリティは『論理障壁』として展開され、ハッキングには特有のコード・シーケンスが必要
- アークの航行は雲海下の汚染層を避けるため、常に高度な軌道計算を要する
plot_outline:
- '序盤: 崩壊した都市を離れ、アークは雲海の彼方へ。しかしカイトの義眼に、存在しないはずの座標「消えた村」の信号が混線する。ミアはそれをノイズと断じるが、カイトの脳内には『折れた剣』の残響が、新たな指令として刻まれていた。'
- '中盤: 信号を追い、アークは雲海に浮かぶ廃村――かつての居住区が電脳的に再構築された「空中集落」へ到達する。そこは企業のデータ廃棄場であり、捨てられた記憶たちが実体化した『亡霊の回路』が蠢く地獄だった。カイトはそこで、自分と同じ「Kシリーズ」の成れの果てと遭遇する。'
- '終盤: 追跡者として現れたのは、ヴァイスの意志を継承し、機械と融合した超個体。カイトは右腕の代わりとなる『亡霊のプラグイン』を脳に直結し、全神経をハッキング・スレッドへ投下する。物理的な船の戦闘と、精神空間での論理戦が同時並行で加速する。'
- '結末: 虚無の村のコアを破壊し、企業の支配システムを一時的に麻痺させたカイト。アークは燃え上がる雲海を抜け、誰も知らない、本当の「青い空」が残る領域へと舵を切る。カイトの瞳には、もはやプログラムの命令ではなく、己の意志による光が宿っていた。'
style_notes: 短いセンテンスの連打。接続詞を削り、名詞と動詞でスピード感を演出。「雨」「ネオン」「ノイズ」「クローム」を五感に訴える。ハッキング描写は『root権限の強奪』『パケットの嵐』『論理障壁のクラック』といった具体的な手触りを持たせる。ハードボイルドな独白。「オレの脳が焼ける。ノイズが、痛い。だが、止まらねえ」といった、肉体と電脳の境界が曖昧な表現を用いる。
