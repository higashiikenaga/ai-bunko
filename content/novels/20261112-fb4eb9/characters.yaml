- name: 瀬戸 遥希
  role: 主人公
  age: 18
  gender: 男性
  appearance: 鋭い眼差しを持つが、どこか陰がある。右膝にサポーターを常用しており、かつての爆発的な跳躍力を失っている。
  personality: ストイックで責任感が強いが、挫折により自己肯定感が低い。一人称は「俺」。
  speech_style: ぶっきらぼうで口数が少ない。感情を押し殺した淡々とした話し方。
  background: 中学時代に全国を沸かせた天才エースだったが、高校1年時の怪我で正就職を外れ、絶望の中にいた。復帰を試みるも以前の自分に戻れないことに苦しんでいる。
  motivation: もう一度、コートで「誰かに必要とされる自分」を取り戻し、最高の景色を見ること。
  relationships:
  - name: 柊 奏太
    relation: 戦術的なパートナーであり、自分を再定義させてくれた理解者
  - name: 鳴海 陸
    relation: かつては無視していたが、現在は互いの弱さを認め合う戦友
  arc: 「エースでなければ価値がない」という強迫観念を捨て、チームを繋ぐ「楔」としての役割に価値を見出し、精神的な再生を果たす。
- name: 柊 奏太
  role: 相棒/軍師
  age: 17
  gender: 男性
  appearance: 細身で眼鏡をかけている。常にタブレットと作戦ノートを携帯しており、分析に没頭すると周囲が見えなくなる。
  personality: 論理的で冷徹な分析を行うが、内面にはスポーツへの狂信的な情熱を秘めている。一人称は「僕」。
  speech_style: 丁寧語だが、戦術的な欠陥を指摘する際は辛辣で容赦がない。
  background: ハンドボールを愛しているが、身体能力が著しく低く選手としては絶望的だったため、マネージャーとして「勝つための数式」を構築することに執着している。
  motivation: 身体能力という暴力的な才能を、緻密な戦術（知能）で凌駕し、完璧な勝利を証明すること。
  relationships:
  - name: 瀬戸 遥希
    relation: 自分の理論を体現させるための最高の駒であり、唯一信頼するリーダー
  - name: 氷室 零士
    relation: 自身の理想とする「完璧」を体現する存在であり、超えるべき壁
  arc: 人間を「駒」としてしか見ていなかったが、泥臭い努力や感情が戦術を凌駕する瞬間を目の当たりにし、真の信頼に基づいた連帯を学ぶ。
- name: 鳴海 陸
  role: 脇役/成長枠
  age: 17
  gender: 男性
  appearance: がっしりとした体格で、常に汗をかいている。表情豊かで、チームのムードメーカー的な存在。
  personality: 天真爛漫で努力家だが、自分に才能がないことを誰よりも自覚しており、根深い劣等感を抱えている。一人称は「俺」。
  speech_style: 賑やかで勢いがある。語尾に「～っす！」とつける傾向がある。
  background: 中学時代からずっと控え選手。地道な練習だけは誰にも負けないが、決定的な場面で通用する武器を持たず、出番を待ち続けている。
  motivation: 一度でいいから、チームにとって「代えのきかない不可欠な存在」になりたい。
  relationships:
  - name: 瀬戸 遥希
    relation: 憧れの存在であり、同時にその挫折に共感し寄り添いたい相手
  - name: 柊 奏太
    relation: 厳しい要求を突きつけてくるが、自分の価値を見出してくれた恩人
  arc: 「主役にならなければ意味がない」という思い込みを捨て、地味だが重要な「穴を埋める役割」こそが円環を完成させる鍵であると自覚する。
- name: 氷室 零士
  role: 敵役/ライバル
  age: 18
  gender: 男性
  appearance: 端正な顔立ちに冷徹な瞳。無駄のない洗練されたフォームでプレーし、コート上のすべてを支配する圧倒的なオーラを持つ。
  personality: 完璧主義者。妥協を嫌い、強さこそがすべてであると信じている。一人称は「私」。
  speech_style: 静かで威圧感がある。相手の急所を突くような、理知的かつ冷酷な言い回し。
  background: 名門校の主将。幼少期からエリート教育を受け、ハンドボールを一つの「完成された芸術」として追求してきた。
  motivation: 一切の不純物がない、完璧な勝利による頂点の維持。
  relationships:
  - name: 瀬戸 遥希
    relation: かつての才能を惜しみつつも、現状の彼を「壊れた道具」として軽視している
  - name: 柊 奏太
    relation: 自分の思考に近い合理主義者として、密かに興味を持っている
  arc: 完璧な陣形が、不完全な個人の集まりである「円環」に打ち破られることで、強さの定義を再考し、敗北の先にある人間的な成長を知る。
