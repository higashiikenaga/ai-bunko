title: 三度目の春、鉄壁の円環
genre: 群像劇
tone: 躍動感と静謐が入り混じる熱い人間ドラマ
pov: 三人称（選手、ベンチ、観客席の視点を交錯させる）
tense: 過去形
setting: 架空の地方都市、高校ハンドボール部
premise: 怪我で夢を絶たれた元エース、戦術の天才だが身体能力に欠けるマネージャー、そして出番を待ち続ける控え選手たち。バラバラな背景を持つ彼らが、全国大会という過酷な舞台で一つの「円環」を作り上げる物語。コート上の攻防は、ベンチの思惑と観客席の熱狂によって多層的に描かれる。桜が舞い散る季節、彼らは鏡のように自分自身を映し出すライバルと向き合い、真の連帯を見つけ出す。
themes:
- 自己の再定義
- 役割への誇り
- 連帯による昇華
rules:
- 競技はハンドボールをベースとしたチームスポーツ
- 戦術の成否はベンチの指示と控え選手の動きに依存する
- 選手個人の技術以上に、陣形の維持と崩しが勝敗を分ける
plot_outline:
- '序盤: 怪我で挫折したエースの葛藤と、マネージャーによる緻密な戦術構築の始まり。控え選手たちの疎外感。'
- '中盤: チーム内の亀裂。作戦ボードを囲む激しい議論を経て、全員が『自分にしかできない役割』を自覚していくプロセス。'
- '終盤: 全国大会決勝。強豪の完璧な陣形に対し、独自の『楔と円環』のフォーメーションで挑む死闘。'
- '結末: 桜の下での別れと、それぞれの場所で再び動き出す、静かだが力強い再生の物語。'
style_notes: チームスポーツの群像劇として、主役だけでなくベンチの焦燥や観客席の視点も等価に扱う。作戦ボード上の動きを、「中心から外郭へ、放射状に広がる楔が、相手の守備陣の隙間を縫うように……」といった具合に、図解を言葉で描くような精密な文体を用いる。
