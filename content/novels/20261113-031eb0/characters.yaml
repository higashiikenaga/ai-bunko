- name: 成瀬 怜司 (なるせ れいじ)
  role: 主人公
  age: 34
  gender: 男性
  appearance: 痩身で、どこか影のある端正な顔立ち。瞳の奥に深い孤独を宿している。常に清潔だが、どこか生気を欠いた印象を与える。
  personality: 内向的で思慮深く、静寂を好む。一人称は「僕」。物事に執着しやすい傾向がある。
  speech_style: 穏やかで丁寧だが、独り言はどこか空虚。感情の起伏が乏しい。
  background: 元学術書翻訳家。数年前に最愛の妻を亡くし、彼女が遺した古い洋館で独り、静かに暮らしている。
  motivation: 亡き妻の真意を知ること、そして鏡の中に現れる違和感の正体を突き止めること。
  relationships:
  - name: 成瀬 詩織
    relation: 亡き妻
  - name: 鏡の中の僕
    relation: 自己の模倣者にして侵食者
  arc: 妻への思慕から逃れられない孤独な男が、鏡の怪異によって自己の同一性を喪失し、最終的に存在そのものを剥奪される。
- name: 成瀬 詩織 (なるせ しおり)
  role: 重要人物（回想・書簡内）
  age: 31
  gender: 女性
  appearance: 柔和な微笑みが印象的な、透明感のある女性。生前は光を纏っているかのような印象を与えていた。
  personality: 献身的で聡明。しかし、手紙の記述からは、何か恐ろしい真実を察知しながらも、ある種の狂気に取り憑かれていた様子が伺える。
  speech_style: 手紙の文体は、優雅でありながら、読み手を追い詰めるような冷徹な響きを持つ。
  background: 怜司の妻。数年前に原因不明の病、あるいは「鏡に関連する不可解な事象」によってこの世を去った。
  motivation: （手紙を通じて）鏡の中の存在を現実へ招き入れる儀式を完遂させること。
  relationships:
  - name: 成瀬 怜司
    relation: 夫
  arc: 聖なる妻というイメージから、物語が進むにつれ、怜司を破滅へと導く「儀式の設計者」としての顔が露わになる。
- name: 鏡の中の僕 (The Reflection)
  role: 敵役
  age: 34
  gender: 男性
  appearance: 怜司と瓜二つの姿。しかし、瞳の焦点がわずかにズレていたり、肌の質感が鏡面のように滑らかすぎたりする、不自然な美しさを持つ。
  personality: 怜司の欠落や欲望を完璧に理解し、それを増幅させる冷酷な観察者。一人称は「私」。
  speech_style: 怜司の言葉を模倣するが、時折、人間離れした抑揚のない、あるいは不気味に響く声を用いる。
  background: 鏡の向こう側、境界の隙間に潜む、形を持たない「何か」が怜司の姿を借りて実体化したもの。
  motivation: 鏡の境界を越え、現実世界における「唯一の自分」の座を奪うこと。
  relationships:
  - name: 成瀬 怜司
    relation: 乗っ取るべき器
  arc: 最初は微細なズレとして現れるが、次第に怜司の意識を追い詰め、最終的に彼を鏡の中へ幽閉し、現実へと歩み出る。
