title: 硝子の皮膚、空白の書簡
genre: ホラー
tone: 静謐で不穏、認識が揺らぐ心理的恐怖
pov: 一人称
tense: 過去形
setting: 霧に包まれた、無数の鏡が配置された古い洋館
premise: 鏡に囲まれた館で独り、静かな生活を送る主人公は、亡き妻が遺した「失われた手紙」を偶然見つける。そこには、鏡の中に潜む「自分ではない何か」が、少しずつ現実を侵食しているという戦慄の告白が綴られていた。次第に鏡の中の像と現実の動きに致命的なズレが生じ始め、主人公の認識は次第に歪んでいく。果たして、鏡を覗き込んでいるのは、果たしてどちらの「私」なのだろうか。
themes:
- 自己同一性の崩壊
- 罪悪感の具現化
rules:
- 鏡の中の像は、持ち主が強い罪悪感を感じた瞬間にのみ、現実とは異なる微細な挙動を見せる
- 鏡の表面が「皮膚」のような質感に変容した時、鏡像と現実の境界は完全に消失する
plot_outline:
- '序盤: 鏡に囲まれた孤独な生活の描写。冒頭で「鏡は、私を最も深く理解してくれる友だ」という一文を提示。妻の命日に、鏡の裏に隠されていた未投函の手紙を発見する。'
- '中盤: 手紙の内容が現実の違和感と一致し始める。鏡の中の自分が、自分とは異なるタイミングで瞬きをし、不気味な微笑を浮かべるようになる。主人公は自らの正気を疑い、鏡をすべて覆い隠そうとするが、手紙の記述通りに事態は悪化する。'
- '終盤: 手紙の真の目的が、鏡の向こう側に閉じ込められた「真の自分」を救い出すためのものではなく、鏡の中の怪異を現実へ招き入れるための儀式であったことが判明する。鏡の表面が、脈打つ皮膚のように変容していく。'
- '結末: 鏡の中に引きずり込まれる直前、主人公の認識が反転する。冒頭の言葉が「鏡は、私を最も残酷に拒絶する敵だった」へと変質し、鏡の外へ、鏡の中の「何か」が平然とした顔で歩み出していく。'
style_notes: 語り手の主観的な感覚（温度、視線、肌触り）を極めて詳細に、かつ不確かなものとして描く。読者が「今、語り手が何を見ているか」に疑念を抱くよう、視覚情報の提示を意図的に遅らせる。一人称の独白の中に、語り手の認識の歪みをにじませ、結末での冒頭の一文の反転によって、物語全体の意味を劇的に再定義すること。
