- name: 鹿野 葵
  role: 主人公
  age: 22
  gender: 女性
  appearance: 丸い眼鏡にベージュのカーディガン。いつもどこかに小さなメモ帳を挟んでいる。
  personality: 好奇心旺盛で少しおせっかいな性格。聞き上手で、物語を読み解くことに喜びを感じる。一人称：わたし
  speech_style: 丁寧だが、親しくなると年相応の快活な話し方になる。
  background: 大学卒業後、静かな環境を求めて路地裏の古本喫茶「月見堂」でアルバイトを始めた。
  motivation: 老紳士の探し物を手伝い、一通の手紙が持つ真実を明らかにしたい。
  relationships:
  - name: 如月 宗一郎
    relation: 店を訪れる客であり、導く相手
  - name: 紬 花江
    relation: 雇用主であり、人生の先輩
  arc: 他人の人生の断片に触れることで、自分の日常にある小さな幸せに改めて気づく。
- name: 如月 宗一郎
  role: キーパーソン
  age: 75
  gender: 男性
  appearance: 白髪に整えられた口髭。時代が止まったかのような、端正な三つ揃えのスーツを纏っている。
  personality: 穏やかで理知的。礼儀正しいが、心の中に消えない喪失感と後悔を抱えている。一人称：私
  speech_style: 古風で落ち着いた口調。言葉選びが慎重で上品。
  background: 元大学教授。若き日に大切な人と交わした約束と、その象徴である「折れた剣の栞」を長年探し続けている。
  motivation: 失くした栞を取り戻し、過去に断ち切った（と思い込んでいる）縁に決着をつけたい。
  relationships:
  - name: 鹿野 葵
    relation: 自分の過去を紐解いてくれる親切な店員
  - name: 佐藤 雫
    relation: かつての恋人であり、手紙の相手
  arc: 絶望だと思っていた過去の誤解が、実は相手の深い優しさであったことを知り、心の凍てついた時間を溶かす。
- name: 紬 花江
  role: サポーター
  age: 52
  gender: 女性
  appearance: 黒いワンピースに銀色の長いネックレス。物静かな微笑みを絶やさない、ミステリアスな雰囲気の女性。
  personality: 包容力があり、洞察力が非常に鋭い。本と人の縁を結びつけることを信条としている。一人称：私
  speech_style: ゆったりとした心地よい低めの声。比喩を用いた表現を好む。
  background: 古本喫茶「月見堂」の店主。多くの本と、それに付随する記憶の管理人として店を切り盛りしている。
  motivation: 訪れる人々が本を通じて自分自身や大切な人と再会することを願っている。
  relationships:
  - name: 鹿野 葵
    relation: 期待を込めて見守っている教え子のような存在
  - name: 如月 宗一郎
    relation: 静かに見守る常連客
  arc: 大きな変化はないが、葵が成長し、店に新しい温かな記憶が刻まれることを静かに喜ぶ。
- name: 佐藤 雫
  role: 脇役
  age: 72
  gender: 女性
  appearance: 淡い色のストールを巻いた、儚げだが芯の強さを感じさせる老婦人。
  personality: 控えめで思慮深い。自分の感情よりも相手の幸せを優先する自己犠牲的な優しさを持つ。一人称：私
  speech_style: 静かで、囁くように穏やかな話し方。
  background: かつて如月と共に詩を愛読していた。ある理由から、彼に真実を伝えず、手紙を届かせない選択をした。
  motivation: 静かに人生を締めくくりたいと思っていたが、心の奥底では彼との再会を諦めていなかった。
  relationships:
  - name: 如月 宗一郎
    relation: 人生で最も愛し、そして遠ざけた人
  arc: 自分の「優しさ」が結果的に彼を苦しめていたことに気づき、最後に出会うことで本当の意味で救われる。
