title: 偽りの楽園と、未定義な双子のパッチノート
genre: ディストピア
tone: 疾走感のあるサイバーパンク・エモーショナル
pov: 一人称（ボク）
tense: 現在進行形・過去形混在
setting: 管理システムが崩壊し、情報の空白地帯（ホワイトアウト・エリア）が拡大したポスト・ディストピア都市
premise: 社会信用スコアがリセットされ、嘘と真実が混濁した混沌の街。カイとリナは、システムの監視が届かない『自由』を手に入れたはずだった。しかし、街の再構築が進む中、突如として『存在しないはずの双子』のログがシステムに混入し始める。それは、崩壊したはずの世界が書き換えた、新たなエラーの予兆だった。ボクたちは、世界の真実を隠蔽するための『秘密の地図』を手に、消えゆくデータの海へとダイブする。
themes:
- 自己定義の不確実性
- 共有される記憶と個の境界
rules:
- 嘘による激痛（誠実チップ）は消失したが、代わりに『嘘をつき続けると存在確率が低下する』という新たなデバッグ・エラーが発生する。
- 管理システムは完全に消滅しておらず、断片化した『自律型プロトコル』が街の各所で独自のルールを強制している。
- 懐中時計は、周囲の定義を書き換えることができるが、使用するたびに使用者の『過去の記憶』をランダムに書き換えてしまう。
plot_outline:
- '序盤: スコアのリセット後、カイとリナは地下街で不安定な生活を送っている。ある日、カイのデバイスに『自分と全く同じ行動ログを持つ、鏡合わせの存在（双子）』からの不可解な通信が届く。それは、かつてエイドスが隠蔽していた『世界のバックアップ・プラン』を示唆する秘密の地図の断片だった。'
- '中盤: カイはゼロやデバッガーズと共に、地図を頼りに旧管理区域の深部へと向かう。そこで彼らは、システムが『完璧な世界』を再構築するために、人間の感情をデータ化した『双子のプロトタイプ』を生成している事実を知る。通信主は、カイ自身の欠損したデータから生成された、もう一人の『ボク』だった。'
- '終盤: 街全体を巻き込む大規模なシステム・アップデート（再定義）が開始される。アップデートが完了すれば、現在の不完全な自由は消え、再び管理された世界に戻ってしまう。カイは、懐中時計の真の機能――『自分自身をエラーとして定義する』ことを使い、システムと自分自身のログを衝突させる。'
- '結末: 世界は書き換えられず、かといって以前のようでもない、『バグだらけのまま動いている世界』として存続する。カイは自分自身の記憶の欠落に戸惑いながらも、隣にいるリナの『痛みを伴う嘘』を信じて、不確かな明日へと歩き出す。'
style_notes: 一人称「ボク」による、メタ視点多めの軽快な語り。文中に「[システムログ：エラー発生]」や「＠匿名ユーザー：それなｗ」といったSNSのチャットログ、配信のコメント欄を挿入し、物語のスピード感を演出する。深刻な場面ほど、あえて軽薄なネットスラングを混ぜて、世界の崩壊感と主人公の精神的な距離感を表現する。
