- name: 葛城 怜 (かつらぎ れい)
  role: 主人公
  age: 28
  gender: 男性
  appearance: '細身で清潔感のある風貌。眼鏡の奥に鋭い観察眼を宿している。常に論理的な整合性を重んじる。 '
  personality: 冷静沈着、徹底した合理主義者。感情を排して事実のみを追う。一人称は「僕」。
  speech_style: 丁寧だが、無駄がなく、常に結論から話す論理的な口調。
  background: 元数学者でありながら、数値化できない人間の心理的矛盾に直面して探偵業に転身した。数学的思考を推理の基盤とする。
  motivation: 事件の背後にある「論理の不完全さ」を解明し、真実を記述すること。
  relationships:
  - name: 久遠 湊
    relation: 対立する知性を持つ容疑者
  arc: 完璧な論理を信奉していたが、事件を通じて「人間が犯すエラーの必然性」を受け入れていく。
- name: 久遠 湊 (くおん みなと)
  role: 敵役
  age: 32
  gender: 男性
  appearance: 被害者である久遠 零と瓜二つの容姿を持つ。整った顔立ちだが、どこか冷酷で底の知れない瞳をしている。
  personality: 傲慢、知的な支配欲が強い。他者を「計算式」としてしか見ていない。一人称は「私」。
  speech_style: 優雅で理知的。相手の論理的欠陥を指摘する際に、慇懃無礼な態度を取る。
  background: 天才数学者。兄の零と常に知能で競い合っており、兄の死によって完成されるはずだった「完璧な理論」の証明を企てている。
  motivation: 自らの完璧なアリバイを成立させ、兄の死さえも数学的な証明の一部に組み込むこと。
  relationships:
  - name: 久遠 零
    relation: 双子の兄であり、最大のライバル
  - name: 葛城 怜
    relation: 自らの論理を解体しようとする脅威
  arc: 完璧な論理を構築しようとするほど、自らの身体的・物理的な制約（不完全さ）に追い詰められていく。
- name: 久遠 零 (くおん れい)
  role: 被害者
  age: 32
  gender: 男性
  appearance: 久遠 湊と同一人物に見えるが、どこか虚弱で、常に数学的な思考に没入しているような影がある。
  personality: 極端な潔癖症。数学的真理こそが世界の全てだと信じている。一人称は「僕」。
  speech_style: 独善的で、他者の非論理的な言動を切り捨てるような話し方。
  background: 世界的な数学者。湊との不毛な論争を繰り返しながら、この山荘に招かれた。
  motivation: 湊の知性を論理的に屈服させること。
  relationships:
  - name: 久遠 湊
    relation: 双子の弟であり、憎悪と尊敬が入り混じった対象
  arc: 死によって、自身が構築した論理の矛盾を露呈させる象徴となる。
- name: 佐伯 結衣 (さえき ゆい)
  role: 脇役
  age: 26
  gender: 女性
  appearance: 落ち着いた雰囲気を持つ、山荘の管理人。実務的で動きが素早い。
  personality: 現実主義者。数学者たちの抽象的な議論には興味がない。一人称は「私」。
  speech_style: 簡潔で事務的。感情に流されず、事実を淡々と伝える。
  background: 山荘の管理を一手に引き受けている。ラジオ放送の時刻や、別荘内の物理的な状況に関する重要な証言者となる。
  motivation: 平穏な日常を守ること、および事件の早期解決。
  relationships:
  - name: 葛城 怜
    relation: 協力者であり、観察対象
  arc: 数学者たちの閉鎖的な論理の世界に対し、物理的な「時間」と「電波」という現実を突きつける役割を果たす。
