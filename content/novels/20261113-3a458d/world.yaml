title: 矛盾する鏡像の演算 ―不完全な双生児と黎明の周波数―
genre: 本格ミステリー
tone: 冷徹、知的、皮肉屋
pov: 三人称（探偵の思考を括弧書きで挿入）
tense: 過去形
setting: 冬の山岳地帯に隔離された現代的な建築の別荘
premise: 完璧な論理を信奉する数学者たちが集う別荘で、密室殺人が発生する。容疑者は被害者の双子の兄弟であり、彼は「夜明けのラジオ放送」の内容を根拠にした、数学的に完璧なアリバイを提示する。しかし、その論理の美しさこそが、犯人が犯した唯一の計算違いであった。
themes:
- 個の同一性
- 論理の傲慢
rules:
- 密室の構造は物理的に固定されており、外部からの侵入は不可能であること
- 山荘の通信環境は極めて劣悪で、特定の短波ラジオのみが受信可能であること
- 提示されるすべての証拠（時間、音、配置）は読者に開示し、フェアに提示すること
plot_outline:
- '序盤: 知的な競争を好む数学者たちが山荘に集い、被害者である天才数学者とその双子の弟による、互いの知能をなじり合う不毛な論争が描かれる。'
- '中盤: 厳重な密室状態で兄が死亡。弟は、夜明けに流れたラジオ番組の特定の記述と、それを聴いていた第三者の証言を組み合わせ、犯行時刻に別室にいたことを論理的に証明する。'
- '終盤: 探偵がラジオの電波到達時間という物理的制約と、双子が共有する「ある身体的な不完全さ」に注目し、アリバイの論理的破綻を導き出す。'
- '結末: 完璧なアリバイを構築しようとした行為自体が、犯人が「どちらの人間として」振る舞っていたかを証明する決定打となり、冷徹な論理によって真犯人が特定される。'
style_notes: 理詰めで冷ややかな知性派の文体。会話は皮肉と論理の応酬で構成する。探偵の思考プロセスを（ ）で挿入し、読者に手がかりを提示しながら、感情を排した臨床的な記述を徹底すること。
