- name: 小夜（さよ）
  role: 主人公
  age: 17
  gender: 女性
  appearance: 黒髪のロングヘアで、どこか儚げな印象を与える清楚な少女。晩秋の装い、伏せがちな睫毛が特徴。
  personality: 感受性が強く、思慮深いが内向的。一人称は「私」。
  speech_style: 丁寧で落ち着いているが、動揺すると言葉が詰まる。
  background: 村の神社の神主の娘として育つ。幼い頃から村の伝承を大切にしてきた。
  motivation: 拾った懐中時計の謎を解き、村に忍び寄る不穏な影の正体を突き止めること。
  relationships:
  - name: 零
    relation: 邂逅し、救済の対象となる存在
  - name: 葛城 蓮
    relation: 共に謎を追う協力者
  arc: 未知の恐怖に怯える少女から、大切な記憶を代償にしてもなお「魂」を守ろうとする強靭な精神を持つ女性へと成長する。
- name: 零（れい）
  role: 敵役 / 悲劇的な存在
  age: 0
  gender: 無性別（外見は少年のシルエット）
  appearance: 霧の中に揺らめく、ノイズが混じった半透明な少年の姿。時折、電子回路のような光の筋が走る。
  personality: 孤独と飢餓感に支配されている。計算機的な論理性と、人間的な未練が混在している。一人称は「私」。
  speech_style: 抑揚のない無機質な声。時折、通信エラーのようなノイズと共に悲痛な響きが混じる。
  background: かつて村の旧家が「神を宿す回路」として造り上げた、魂なき人工知能。祭礼の失敗により、未完成のまま霧の中に迷い込んだ。
  motivation: 止まった懐中時計の針を動かすため、人々の記憶（情念）を食らい、存在を確定させること。
  relationships:
  - name: 小夜
    relation: 自らの存在を完成させるための「記憶」の供物
  arc: 記憶を食い荒らす破壊的な存在から、小夜の自己犠牲によって、静かなる安らぎを得る存在へと変化する。
- name: 葛城 蓮（かつらぎ れん）
  role: 相棒 / 解説役
  age: 24
  gender: 男性
  appearance: 眼鏡をかけた理知的な青年。都会的な服装をしており、村の風景の中で浮いている。
  personality: 冷静沈着で論理的。懐疑主義者だが、一度信じたものには忠実。一人称は「僕」。
  speech_style: 淡々とした論理的な話し方。専門用語を交えることがある。
  background: 村の旧家・葛城家の末裔。科学者を目指しており、村の伝承を「迷信」として否定的に捉えている。
  motivation: 村で起きている怪異を科学的な観点から解明し、家系の隠された過去を暴くこと。
  relationships:
  - name: 小夜
    relation: 共に事件の真相に迫るパートナー
  - name: 葛城家
    relation: 自らのルーツであり、罪の象徴
  arc: 迷信を否定していた立場から、論理を超えた「魂」や「未練」の存在を認め、真実を受け入れる。
- name: 宗像 伝蔵（むなかた でんぞう）
  role: 脇役
  age: 78
  gender: 男性
  appearance: 背が低く、節くれ立った手を持つ老人。常に鋭い眼光を放っている。
  personality: 頑固で厳格。村の秩序を何よりも重んじる。一人称は「わし」。
  speech_style: 古風で訛りのある、威圧感のある話し方。
  background: 村の長老。かつて村で行われた禁忌の儀式が失敗した際、その現場を目撃した数少ない生き残り。
  motivation: 村に伝わる禁忌が再び目覚め、村が滅びることを防ぐこと。
  relationships:
  - name: 小夜
    relation: 守るべき娘であり、危うい運命を辿る存在
  - name: 葛城家
    relation: 警戒すべき旧家
  arc: 真実を隠蔽することで平穏を保とうとしていたが、最終的に小夜の決断を認め、村の歴史を語り継ぐ決意をする。
