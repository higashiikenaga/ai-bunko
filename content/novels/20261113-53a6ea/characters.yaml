- name: カイト・レンガ
  role: 主人公
  age: 15
  gender: 男性
  appearance: 逆立った赤髪に、意志の強さを感じさせる琥珀色の瞳。動きやすさを重視した古着のジャケットを愛用している。
  personality: 真っ直ぐで熱血漢。困っている人を見捨てられない正義感の持ち主。一人称は「俺」。
  speech_style: 「やってやるぜ！」「絶対に負けない！」など、語尾が強く、感情が昂ると叫ぶような熱い口調。
  background: 街の片隅で古本屋を営む両親のもとで育った少年。ある日、店で見つけた奇妙な輝きを放つ古書を手に取ったことで、運命が大きく動き出す。
  motivation: 襲いくる怪獣から人々を守り、自分を導いた「忘却の村」の真実を知ること。
  relationships:
  - name: セリカ・ブルーノ
    relation: 信頼し合う相棒
  - name: ゼノン・ヴォイド
    relation: 宿命のライバル
  arc: ただ守られるだけだった少年が、仲間との絆と「合体」という概念を通じて、全宇宙の命運を背負う真の英雄へと成長する。
- name: セリカ・ブルーノ
  role: 相棒
  age: 15
  gender: 女性
  appearance: 透き通るような銀髪のポニーテール。冷静な青い瞳を持ち、洗練されたパイロットスーツを身に纏う。
  personality: 冷静沈着で論理的。感情に流されやすいカイトをサポートする頭脳派。一人称は「私」。
  speech_style: 「計算通りよ」「無謀な行動は控えて」など、落ち着いた、理知的で丁寧な口調。
  background: 「忘却の村」の守護者の一族の末裔。サポート機『ブレイズ・アクセル』を操り、カイトの戦いを支える。
  motivation: ギガント・ブレイズの完全制御と、次元の歪みを正して世界の秩序を取り戻すこと。
  relationships:
  - name: カイト・レンガ
    relation: 共に戦うパートナー
  arc: 効率と理論を重視していたが、カイトの熱量に触れることで、理屈を超えた「魂の共鳴」の力を信じるようになる。
- name: ゼノン・ヴォイド
  role: 敵役
  age: 28
  gender: 男性
  appearance: 漆黒の甲冑のような戦闘服に身を包み、影のように揺らめく瞳を持つ。周囲に冷気を纏っている。
  personality: 極めて冷酷で虚無主義的。全ての生命は無に帰すべきだと信じている。一人称は「我」。
  speech_style: 「すべては無に帰る」「絶望に沈め」など、低く重々しく、威圧感のある話し方。
  background: 次元の狭間に潜む、宇宙を喰らう怪獣たちの意志を体現する存在。かつて「忘却の村」を滅ぼそうとした太古の災厄の再来。
  motivation: 地球を含む全宇宙を喰らい尽くし、完全なる静寂（無）をもたらすこと。
  relationships:
  - name: カイト・レンガ
    relation: 自身の思想を否定する天敵
  arc: 絶対的な力を誇示し、絶望を与える存在として君臨するが、最後はカイトの「魂の燃焼」という予測不能な力に屈する。
