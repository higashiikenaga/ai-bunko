title: 超次元合体！ギガント・ブレイズ：失われた村の鋼鉄神
genre: SF
tone: 熱血・特撮風・ダイナミック
pov: 三人称
tense: 過去形
setting: 近未来の地球。および次元の狭間に隠され、地図から抹消された「忘却の村」。
premise: 絶望的な怪獣災害に襲われる世界。少年は古本屋で見つけた謎の古書を手に、消えたはずの伝説の村へと導かれる。そこで目覚めたのは、宇宙を焼き尽くす熱量を宿した超巨大ロボットだった！魂を燃やし、鋼の拳で絶望を打ち砕く熱血戦記が今、幕を開ける！
themes:
- 不屈の闘志
- 継承される意志
rules:
- ロボットの出力は操縦者の「闘志（パッション）」に比例して上昇し、限界突破することで新形態へ進化する。
- 必殺技の発動には、古本屋に眠る「秘伝の技書」に記された特殊コードを脳内に同期させる必要がある。
- 怪獣は次元の裂け目から現れ、物質的な攻撃だけでなく精神的な絶望を糧に巨大化する。
plot_outline:
- '序盤: 主人公が古本屋で古書を拾い、導かれるままに「消えた村」へ到達。そこで眠っていた超巨大ロボット『ギガント・ブレイズ』を起動させ、街を襲う怪獣を真っ向から粉砕する。'
- '中盤: 敵の猛攻により窮地に陥るが、古書に記された「合体」の概念を覚醒させる。サポート機との劇的な合体形態『ハイパー・ブレイズ』を完成させ、次々と現れる怪獣軍団を熱い叫びと共になぎ倒す。'
- '終盤: 地球ごと喰らい尽くそうとする究極の絶望怪獣が降臨。絶体絶命の状況の中、村に眠る全てのエネルギーと操縦者の魂を一つに束ねた究極合体へと至る。'
- '結末: 全宇宙を震わせる超必殺技『ギガント・パッション・ノヴァ』を炸裂させ、怪獣を完全に消滅させる。世界に光を取り戻した主人公は、新たな伝説を刻むため再び地平線へと走り出す。'
style_notes: 擬音を多用し、台詞は叫ぶように記述すること。特に合体シーンや必殺技の演出は「天を衝く」「大地を揺るがす」「銀河さえも震える」など、過剰なまでに大げさな表現を重ねて盛り上げる。
