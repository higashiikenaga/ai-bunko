- name: 一ノ瀬 華江
  role: 主人公
  age: 22
  gender: 女性
  appearance: 黒髪を後ろで低く束ねている。控えめだが、観察力の鋭さを感じさせる瞳を持つ。
  personality: 真面目で慎重。物事を理詰めで考えがちだが、一度興味を持つと没頭するタイプ。一人称は「わたし」。
  speech_style: 丁寧で落ち着いた、大正モダンな響きのある言葉遣い。
  background: 明治から続く写真館の一ノ瀬家の孫娘。祖父の急逝により、写真館の整理と畳む作業を引き継いでいる。
  motivation: 祖父が遺した不可解な遺言と、写真に隠された謎を解き明かし、真実を知ること。
  relationships:
  - name: 一ノ瀬 源造
    relation: 祖父
  - name: 佐伯 蓮
    relation: 協力者
  arc: 過去の悲恋を知ることで、単なる「整理すべき遺産」だった写真館を、人々の記憶を繋ぐ大切な場所として再定義し、自身の進むべき道を見出す。
- name: 九条 節子
  role: 過去のヒロイン
  age: 19
  gender: 女性
  appearance: 端正な顔立ちで、没落したとはいえ気品のある佇まい。写真の中では常にどこか遠くを見つめている。
  personality: 芯が強く、情熱を内に秘めている。運命に翻弄されながらも、自らの意志を捨てない。一人称は「私」。
  speech_style: 古風で、品格を感じさせる令嬢の話し方。
  background: かつてこの町を治めていた旧家の娘。家が没落し、身分違いの恋に落ちる。
  motivation: 社会的な制約を超え、愛する人と共に生きるための「約束の場所」を見つけること。
  relationships:
  - name: ジュリアン・スターリング
    relation: 恋人
  arc: （回想の中での存在）社会の壁に阻まれながらも、愛の証明として写真という形に記憶を託した。
- name: ジュリアン・スターリング
  role: 過去のヒーロー
  age: 26
  gender: 男性
  appearance: 明るい茶髪と碧い瞳を持つ、異国情緒溢れる容姿。穏やかだが、医療に従事する者としての鋭い眼差しがある。
  personality: 知性的で献身的。孤独を知る者特有の静かな強さを持つ。一人称は「僕」。
  speech_style: 丁寧な日本語を使うが、時折異国の言葉が混じるような独特の節回し。
  background: 医学を学ぶために異国からこの港町へやってきた医師。節子と出会い、禁じられた恋に落ちる。
  motivation: 節子を守り、いつか彼女と共に、誰もが自由に生きられる場所へ行くこと。
  relationships:
  - name: 九条 節子
    relation: 恋人
  arc: （回想の中での存在）過酷な運命の中で、最期の瞬間まで彼女との約束を信じ抜いた。
- name: 佐伯 蓮
  role: 相棒/脇役
  age: 25
  gender: 男性
  appearance: 眼鏡をかけた知的な風貌。古本屋の店主らしく、常にインクの匂いがする。
  personality: 好奇心旺盛で博学。少し飄々としているが、歴史の重みに対しては敬意を持っている。一人称は「僕」。
  speech_style: 軽快で親しみやすいが、知識を語る時は論理的。
  background: 町で古い文献を扱う古本屋を営む青年。華江の調査を、資料提供や町の情報収集でサポートする。
  motivation: 町に眠る失われた物語を掘り起こし、歴史の断片を繋ぎ合わせること。
  relationships:
  - name: 一ノ瀬 華江
    relation: 協力者・友人
  arc: 華江と共に謎を追う過程で、単なる知識としての歴史ではなく、そこに生きた「個人の感情」の尊さを学ぶ。
