- name: 星野 カナタ
  role: 主人公
  age: 17
  gender: 女性
  appearance: 透き通るような白い肌と、どこか寂しげな瞳。少し長めの黒髪。制服の着こなしは控えめ。
  personality: 内向的で繊細。過去の家庭環境から自己肯定感が低く、現実逃避の傾向がある。一人称は「わたし」。
  speech_style: 消え入りそうな、おずおずとした丁寧な話し方。
  background: 家庭内の不和によるトラウマを抱え、その痛みを消すために「記憶を売る市場」へ足を踏み入れる。
  motivation: 湊にふさわしい自分になるため、そして現在の苦しみから逃れるため。
  relationships:
  - name: 朝日 湊
    relation: 密かに想いを寄せるクラスメイト
  - name: 汐恩
    relation: 記憶を売買する際の取引相手
  arc: 記憶を売って「痛み」を失うことで「自分」さえも失っていくが、最終的に痛みも含めたすべての記憶を受け入れ、真っ白な未来へ進む決意をする。
- name: 朝日 湊
  role: ヒーロー
  age: 17
  gender: 男性
  appearance: 整った顔立ちだが、どこか浮世離れした落ち着きがある。眼鏡の奥の瞳は理知的で深い。
  personality: 冷静沈着で観察眼が鋭い。感情を表に出すのが苦手だが、内面には強い慈愛を秘めている。一人称は「ぼく」。
  speech_style: 静かで穏やか、論理的だが相手を突き放さない優しさがある。
  background: 地下図書館の管理人の息子。アルバイトとして、売られてきた記憶を「本」として整理・保管している。
  motivation: 記憶という人間の欠片を守ること。そして、ある記憶の持ち主に向けた切実な想いに応えること。
  relationships:
  - name: 星野 カナタ
    relation: 記憶の持ち主であり、心惹かれる少女
  arc: 他者の記憶を傍観する立場から、カナタの喪失を共に体験し、彼女の記憶を取り戻すためにあえて残酷な役を演じるなど、主体的に運命に関わるようになる。
- name: 汐恩
  role: 脇役（ガイド）
  age: 26
  gender: 中性
  appearance: アンティークな装飾品を身に纏った、性別不詳の美貌を持つ人物。瞳の色が常に変化しているように見える。
  personality: ミステリアスで享楽的。市場のルールには忠実だが、時折、人間への深い哀愁を感じさせる。一人称は「私」。
  speech_style: 芝居がかった、優雅で含みのある話し方。
  background: 「記憶を売る市場」で長年活動するベテランの商人。市場の仕組みや代償の重さを熟知している。
  motivation: 市場の均衡を保ち、人々が記憶を売った後にどのような結末を迎えるかを観察すること。
  relationships:
  - name: 星野 カナタ
    relation: 顧客
  arc: 物語の進行を促し、カナタが「忘却」という安易な道を選んだ際に、その代償の残酷さを突きつける役割を果たす。
- name: 佐倉 莉子
  role: 脇役（現実の象徴）
  age: 17
  gender: 女性
  appearance: 明るい茶髪のショートカット。よく笑い、活動的な印象を与えるクラスメイト。
  personality: 明るく直感的。カナタの繊細さを理解しつつも、彼女を「普通の世界」に引き戻そうとする強さを持つ。一人称は「あたし」。
  speech_style: 快活で、流行を取り入れた現代的な女子高生らしい話し方。
  background: カナタの数少ない親友。カナタが最近、どこか上の空であることに違和感を抱いている。
  motivation: 親友であるカナタが、いつもの笑顔を取り戻すこと。
  relationships:
  - name: 星野 カナタ
    relation: 親友
  arc: 物語の超常的な展開とは対照的な「日常」の象徴として存在し、カナタが失いつつある「今この瞬間」の価値を暗に示し続ける。
