title: 「さよなら」を売った日の、淡い空の色
genre: 青春恋愛
tone: 甘くて切ない、内省的で柔らかな雰囲気
pov: 一人称（わたし）
tense: 過去形
setting: 現代の地方都市。街の片隅に、選ばれた人だけが辿り着ける「記憶を売る市場」と、その地下に広がる「地下図書館」が存在する世界。
premise: 辛い記憶を売って楽になろうとした高校生の「わたし」は、記憶の代価として得たお金で、密かに想いを寄せていた少年・湊に近づこうとする。しかし、記憶を売るたびに、わたしは彼への大切な想いまでも少しずつ失っていくことに気づく。記憶の保管場所である地下図書館で働く湊との、すれ違いと再会の物語。
themes:
- 忘却と愛
- 心の欠落と充足
rules:
- 「記憶を売る市場」では、特定の記憶を売ることで金銭や幸運を得られるが、売った記憶は完全に消失し、本人には正体不明の違和感しか残らない。
- 売られた記憶は「地下図書館」の書架に一冊の本として保存され、特権を持つ管理人のみがその内容を閲覧できる。
- 一度売った記憶を買い戻すには、それ以上の価値がある「現在の幸せな記憶」を代償として差し出さなければならない。
plot_outline:
- '序盤: 過去の家庭環境へのトラウマから「記憶を売る市場」に通い始めたわたしが、クラスメイトの湊に恋をする。彼に近づくための勇気や自信を得るため、わたしはさらに自分の記憶を売り、一時的な快楽や自信を買い求める。'
- '中盤: 湊が実は地下図書館の管理人の息子であり、そこでアルバイトをしていることを知る。湊はわたしの売った記憶の本を偶然読み、そこに綴られた純粋で切ない想いに惹かれるが、現実のわたしは記憶を失った分だけ、彼への感情が希薄になっていく。'
- '終盤: わたしは不注意から、湊と一緒に過ごしたかけがえのない時間まで誤って売ってしまう。彼を完全に忘れたわたしに対し、湊は記憶を買い戻させるため、あえて突き放すような態度を取り、わたしの心に「喪失感」という強い感情を呼び起こそうとする。'
- '結末: 自分の心の穴に気づいたわたしは、今の小さな幸せを代償にして、過去の記憶をすべて取り戻す決意をする。すべてを思い出した二人は、過去の記憶に縋るのではなく、真っ白な明日を一緒に塗りつぶしていくことを誓い合い、淡い空の下で結ばれる。'
style_notes: 語尾は「～だったのかな」「～だと思う」など、柔らかく控えめな表現を用いる。モノローグを多用し、胸の締め付けられるような感情の揺れを繊細に描写すること。また、毎話のラストには「明日、彼が笑ってくれたらいいのに」や「わたしが忘れたのは、本当にあの日だけだったんだろうか」といった、次話への期待と切なさを誘う一言を必ず添える。
