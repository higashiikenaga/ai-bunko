- name: エルナ・ルミエ
  role: 主人公
  age: 17
  gender: 女性
  appearance: 銀色の髪と、夜空のように深い紺色の瞳。灯守の重厚な制服を纏い、常に小さなランタンを携えている。
  personality: 真面目で孤独を好むが、内側に強い好奇心と情熱を秘めている。一人称：私。
  speech_style: 丁寧で落ち着いているが、感情が昂ると声が微かに震える。
  background: 眠ることが禁じられた空中都市ルナリスで、街の灯を維持する「灯守」として孤独に暮らしてきた。
  motivation: カイの記憶を取り戻し、彼を地上へ帰すこと。そして、自分自身が何者であるかを知ること。
  relationships:
  - name: カイ・ゼファー
    relation: 恋慕の対象であり、未知の世界への導き手
  arc: 規則に従うだけの受動的な少女から、禁忌を犯してでも大切な人を守ろうとする意志ある女性へと成長する。
- name: カイ・ゼファー
  role: 相棒（ヒーロー）
  age: 17
  gender: 男性
  appearance: 陽光を思わせる明るい茶髪と、星のように輝く瞳。機能的な飛行服を着用している。
  personality: 自由奔放で楽観的だが、記憶を失い続けることへの根源的な恐怖を抱えている。一人称：僕。
  speech_style: 快活で、まるで物語を読み聞かせるような、リズム感のある話し方。
  background: 地上から空飛ぶ船で迷い込んだ少年。地上への帰還のために、自らの大切な記憶を対価として差し出した。
  motivation: 失った記憶を取り戻し、自分の居場所である地上へ帰ること。
  relationships:
  - name: エルナ・ルミエ
    relation: 心を分かち合う大切な存在
  arc: 記憶を失う恐怖に抗い、たとえすべてを失っても守りたい「約束」を見つけ出す。
- name: ヴァレリウス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない漆黒の軍服に身を包み、冷徹で感情の読めない灰色の瞳を持つ。
  personality: 極めて合理的かつ冷酷。都市の秩序と「眠らないこと」を絶対的な正義と信じている。一人称：私。
  speech_style: 威圧的で、一切の無駄を削ぎ落とした断定的な口調。
  background: ルナリスの管理組織の最高責任者。街の崩壊を防ぐため、不穏な思想や異分子を徹底的に排除する。
  motivation: 都市のシステムを維持し、ルナリスを「まどろみ（眠り）」から守り抜くこと。
  relationships:
  - name: エルナ・ルミエ
    relation: 秩序を乱す危険な監視対象
  arc: 絶対的な秩序の象徴として立ちはだかるが、街の崩壊と共に自身の信じる世界の脆さを突きつけられる。
- name: ミーナ
  role: 脇役（導き手）
  age: 68
  gender: 女性
  appearance: 穏やかな皺が刻まれた顔立ちと、すべてを見通すような温かい瞳。使い込まれた灯守のローブを着ている。
  personality: 包容力があり、時に茶目っ気を見せる賢者。一人称：私。
  speech_style: 柔らかく、比喩を用いた詩的な話し方。
  background: エルナの師匠であり、街の歴史を密かに記憶しているベテランの灯守。
  motivation: エルナが自らの意志で運命を切り拓き、新しい時代を見届けること。
  relationships:
  - name: エルナ・ルミエ
    relation: 教え子であり、娘のような存在
  arc: 知識と経験をエルナに託し、古い世界の終わりと新しい世界の始まりを繋ぐ架け橋となる。
