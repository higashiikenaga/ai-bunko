title: まどろみの街と、星を紡ぐ君の指先
genre: 青春恋愛
tone: 甘く切ない、幻想的でノスタルジックな雰囲気
pov: 一人称（わたし）
tense: 過去形（回想形式）
setting: 雲の上に浮かぶ、永遠に夜が明けない不眠の空中都市『ルナリス』
premise: 眠ることが禁じられた街で、街灯の火を灯す仕事をする「わたし」は、ある日、迷い込んだ空飛ぶ船の少年と出会います。彼が語る「地上」という見たこともない場所のお話に、わたしの心は静かに、けれど激しく揺さぶられていきます。けれど、この街で地上を想うことは、心地よいまどろみの中で消えてしまう禁忌でした。
themes:
- 孤独と救済
- 忘却と記憶の価値
rules:
- 街の住人は『夢』を燃料として都市を浮かべているため、深い眠りに落ちることが禁じられている
- 空飛ぶ船は地上と空を繋ぐ唯一の手段だが、入港する者は地上での記憶を一部差し出す必要がある
- 街灯の火が消えた場所から、住人の記憶が少しずつ消えていく
plot_outline:
- '序盤: 眠らない街の灯守として孤独に暮らす「わたし」が、不時着した空飛ぶ船の少年・カイと出会い、彼が持ち込んだ『地上の記憶』に心を奪われる。'
- '中盤: カイとの秘密の交流を通じて、外の世界への憧れと、彼への淡い恋心に気づく。しかし、カイは記憶を差し出したため、次第に自分の正体や目的を忘れ始めてしまう。'
- '終盤: 街のシステムが崩壊し始め、ルナリスが墜落の危機に瀕する。カイを救うには、彼が捨てた記憶を全て取り戻させ、再び空飛ぶ船で地上へ帰してもらうしかない。'
- '結末: 涙ながらに彼を送り出す「わたし」。けれど、彼が最後に紡いだ約束だけが、灯火のようにわたしの心に残り、いつか地上で再会することを信じて歩き出す。'
style_notes: 一人称「わたし」を用い、内面的な葛藤やときめきを繊細に描写する。語尾は「～だったのかな」「～かもしれないね」など、柔らかく、ためらうような口調にする。視覚的な色彩表現（ネオンの青、星の金など）を多用し、読者が情景に没入できるようにし、各話の最後には「でも、あの時の彼の瞳は、何を物語っていたんだろう」といった、次への期待を高める独白を添える。
