- name: ルナ・アイアンサイド
  role: 主人公
  age: 19
  gender: 女性
  appearance: 短く切り揃えられた灰色の髪、煤けた防護服、使い古したガスマスクを常に首にかけている。瞳は錆色に近い琥珀色。
  personality: 現実主義で口が悪く、常に周囲を警戒しているが、捨てられたものや壊れたものに対して捨てきれない情を見せる。一人称は「あたし」。
  speech_style: ぶっきらぼうで、投げやりな口調。「〜だろ」「〜じゃねえよ」といった荒い言葉遣い。
  background: 鉄の墓場で単独の回収屋として食いつないできた。デジタルデータが消滅した世界で、物理的な価値を持つ「紙」と「金属」を巡る過酷な日常を送ってきた。
  motivation: 拾った『桜の種』を咲かせ、この錆びた世界に「無意味で美しいもの」を刻みつけること。
  relationships:
  - name: ビット
    relation: 相棒の旧式ナビロボ
  - name: ゼノス
    relation: 対立する浄水塔の支配者
  arc: 生きるための効率のみを追求する生存者から、たとえ無駄であっても守るべき価値を見出す「賭け人」へと変化する。
- name: ビット
  role: 相棒
  age: 35
  gender: 無性別
  appearance: 小さな球体型の旧式ナビゲーションロボット。カメラレンズが片方欠けており、時折ノイズが走る。
  personality: 論理的で理屈っぽく、常に電池残量や生存確率を計算してはルナに警告する。一人称は「私（ワタシ）」。
  speech_style: 機械的だが、時折ノイズ混じりに感情が漏れる。「〜です」「〜の確率は12%に低下しています」
  background: かつてのデジタルアーカイブ管理用端末。ルナがゴミ山で見つけ、修理して使い続けている。
  motivation: 自身のバッテリー寿命が尽きる前に、地図の目的地へ到達し、自身のメモリにある記録を完了させること。
  relationships:
  - name: ルナ
    relation: 所有者兼パートナー
  arc: 計算可能な「生存」よりも、計算不能な「希望」を優先する非論理的な判断を下せるようになる。
- name: ゼノス・ヴァレンタイン
  role: 敵役
  age: 45
  gender: 男性
  appearance: 汚れ一つない純白の防護服を纏った、痩身で冷徹な印象の男。瞳は凍てつくような青色。
  personality: 極端な合理主義者。限られた資源（水・食料）を「生存に直結しないもの」に割くことを激しく嫌悪する。一人称は「私」。
  speech_style: 丁寧だが、相手を人間扱いしない冷酷な敬語。「〜ですね」「〜は不要です」
  motivation: 浄水塔の資源を管理し、人類の「生存効率」を最大化すること。植物のような非効率な存在を排除すること。
  relationships:
  - name: ルナ
    relation: 秩序を乱す不法侵入者
  arc: ルナの突きつける「無駄な美しさ」を前に、自らが守る秩序がどれほど空虚であるかを突きつけられる。
- name: 古本屋の老婆（名もなき守り手）
  role: 脇役
  age: 75
  gender: 女性
  appearance: 幾重にも重ね着した古い布、分厚い眼鏡。常に古い紙の匂いをさせている。
  personality: 穏やかで達観している。知識を独占せず、物語を語り継ぐことに価値を置く。一人称は「わらわ」。
  speech_style: 古風で、物語を読み聞かせるようなゆったりとした口調。「〜ですなあ」「〜ですよ」
  background: 地下古本屋『紙の死体安置所』の管理人。滅びゆく世界の記録を、紙の形態で守り続けてきた。
  motivation: 知識の断片が、いつか新しい命（あるいは新しい世界）の種になることを信じて待つこと。
  relationships:
  - name: ルナ
    relation: 地図を辿ってきた導かれし者
  arc: 静かな隠遁生活を終え、ルナの旅を完遂させるための最後の「知識（植物育成の書）」を託す。
