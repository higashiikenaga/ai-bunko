title: スクラップ・ガーデンと、紙の死体
genre: SF
tone: 乾いたニヒリズムと、微かな叙情が混ざり合うポストアポカリプス
pov: 一人称（あたし）
tense: 現在形メイン
setting: 電子データが崩壊し、あらゆる金属が急速に酸化する錆の世界『鉄の墓場』。かつての都市は巨大なスクラップの山と化している。
premise: デジタルアーカイブが消滅し、物理的な『紙』が唯一の価値を持つ世界。回収屋のあたしは、ある日、謎のバイオカプセルに入った『桜の種』と、古本屋へ導く断片的な地図を拾う。電池残量30%のボロい探索機を転がし、あたしは絶滅したはずの『ピンク色の絶望』を咲かせるための旅に出る。口の悪いあたしが、人生で一番無駄で贅沢な賭けに出る物語。
themes:
- アナログな記憶の価値
- 滅びの中の美学
rules:
- 【デジタル崩壊】電子データは時間の経過と共に『ノイズ』へと変質し、読み取り不能になる。そのため、紙に書かれた文字が至高の権威を持つ。
- 【高酸化環境】大気中の成分により金属の腐食速度が異常に速く、定期的な注油とメンテナンスを怠ると道具が数日で機能停止する。
- 【バイオ希少性】天然の植物は絶滅しており、街で見かける緑はすべて色褪せたプラスチック製の模造品である。
plot_outline:
- 序盤：電池残量とフィルターの寿命に喘ぐ日常。ゴミ山から『桜の種』と、伝説の地下古本屋『紙の死体安置所』の地図を回収する。
- 中盤：地図を頼りに廃墟を横断。物資を巡る略奪者との皮肉な駆け引きを繰り広げつつ、錆びた鉄骨の隙間に咲く名もなき雑草に心を動かされる。
- 終盤：地下古本屋に到達し、植物育成の古書を発見する。しかし、種を咲かせるには純水が必要であり、それは敵対組織が管理する浄水塔にしかないことを知る。
- 結末：浄水塔を強襲し、最低限の水を手に入れ、スクラップの庭に種を蒔く。数日後、錆色の世界にたった一輪の桜が咲いた瞬間、あたしは最高にくだらない涙を流す。
style_notes: 一人称『あたし』による、突き放したような口調と皮肉な独白。情景描写では『錆の匂い』『オイルの粘り』『紙の乾いた質感』など触覚・嗅覚を重視する。また、「バッテリー残り12%」「予備のボルトがあと3本」といったリソースの切迫感を頻繁に挿入し、サバイバルの緊張感を演出すること。
