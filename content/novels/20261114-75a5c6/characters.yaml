- name: エリオス・ヴァレンティン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 銀髪に深い藍色の瞳。知的な雰囲気を持つ端正な顔立ちで、常に記録用のインクの香りを漂わせている。記録官の簡素なローブを纏う。
  personality: 冷静沈着で理性的だが、一度決めたことは曲げない強靭な意志を持つ。一人称は「僕」。
  speech_style: 丁寧で落ち着いた、論理的な口調。
  background: 聖教会の禁書庫で働く若き記録官。自身の出生に関する断片的な記述を偶然発見したことで、世界の欺瞞に触れてしまう。
  motivation: 消えた「静謐の村」の真相を突き止め、世界の理（ことわり）の正体を知ること。
  relationships:
  - name: リィン
    relation: 運命を共にする守護対象であり、魂の理解者
  - name: ヴァレリウス
    relation: 真実を隠蔽しようとする、世界の秩序の守護者
  arc: 真実をただ書き留めるだけの傍観者から、世界の運命を自らの手で選び取る決断者へと変貌する。
- name: リィン
  role: 相棒（ヒロイン）
  age: 16
  gender: 女性
  appearance: 透き通るような白い肌と、星屑を散りばめたような淡い金髪。存在が希薄で、時折輪郭が光の中に溶け込むように揺らぐ。
  personality: 儚げで物静かだが、内面に消えない怒りと強靭な生への執着を秘めている。一人称は「私」。
  speech_style: 詩を詠むような、穏やかでリズムのある話し方。
  background: 「黒き月食」の夜に消えた村の生き残りであり、現世に留まる「記憶の残滓」。実体を持たない不安定な存在。
  motivation: 失われた村の魂を安らかに眠らせ、自分という存在が「なかったこと」にならないよう刻むこと。
  relationships:
  - name: エリオス
    relation: 唯一自分を「存在」として認識し、繋ぎ止めてくれる者
  arc: 過去の亡霊として彷徨う存在から、自らの意志で結末を受け入れ、静かな夜明けへ向かう一人の人間へと成長する。
- name: 大司教ヴァレリウス
  role: 敵役
  age: 58
  gender: 男性
  appearance: 威厳に満ちた長身。黄金の聖衣を纏い、冷徹な星のような瞳を持つ。周囲を威圧する神々しさを放つ。
  personality: 秩序を絶対視する狂信的な合理主義者。世界の存続のためには少数の犠牲は当然であると信じている。一人称は「私（わたくし）」。
  speech_style: 高圧的で重々しい、説教じみた話し方。
  background: 聖教会の最高指導者。古の叙事詩を法として運用し、世界の均衡を保つために「不都合な真実」を組織的に隠蔽してきた。
  motivation: 「星辰の書」による世界の変質を防ぎ、現在の秩序を永劫に維持すること。
  relationships:
  - name: エリオス
    relation: 秩序を乱し、聖典の欺瞞を暴こうとする危険な異端者
  - name: カエレン
    relation: かつての部下であり、教会の闇を知り失墜した守護者
  arc: 揺るぎない秩序の象徴として君臨するが、エリオスの選択によって、崩れ去る旧世界の象徴となる。
- name: カエレン
  role: 脇役（導き手）
  age: 31
  gender: 男性
  appearance: 傷跡の残る顔立ちと、使い込まれた黒い革鎧。星鉄で作られた欠けた剣を携えている。
  personality: 皮肉屋で現実主義。過去の失敗から自暴自棄な面もあるが、根は義理堅い。一人称は「俺」。
  speech_style: 短く、ぶっきらぼうな口調。
  background: かつて「星辰の書」を守護していた騎士団の生き残り。月食の夜に守護に失敗し、仲間を失った罪悪感から放浪の身となった。
  motivation: 過去の贖罪を果たし、真実を知る若者（エリオス）を最後まで見届けること。
  relationships:
  - name: エリオス
    relation: かつての自分を重ね、導くべき未熟な英雄
  - name: ヴァレリウス
    relation: 教会の欺瞞に加担した、憎むべきかつての主
  arc: 逃避と贖罪の旅から、エリオスの決断を支え、世界の再構築を見守る「盾」としての役割を見出す。
