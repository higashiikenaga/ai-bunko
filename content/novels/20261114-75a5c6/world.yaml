title: 蒼白き月影の聖典 ―忘却の揺り籠と星辰の挽歌―
genre: 異世界ファンタジー
tone: 重厚、荘厳、神話的
pov: 三人称
tense: 過去形
setting: 浮遊島と深き森が交錯する古の大陸「エーテルガルド」。星の運行が運命を左右し、古神の遺した叙事詩が法として機能する世界。
premise: かつて「黒き月食」の夜に忽然と消え去った聖域の村。その消失に秘められた禁忌の真実を追い求める若き記録官エリオスは、古の詩篇に導かれ、世界の理を書き換える力を持つ「星辰の書」を手に取る。月が再び赤く染まる時、失われた村の亡霊たちが現世へ回帰し、現存する全てを塗り潰そうとする。運命に抗う旅路の果てに、彼は世界の残酷な調律を知ることとなる。
themes:
- 喪失と再生
- 運命への抗い
- 歴史の残酷さ
rules:
- 月食の間は霊界と現世の境界が消失し、死者の記憶が実体化して現れる
- 星辰の書に記述を書き加えることで現実を改変できるが、代償として書き換えられた対象に関する全人類の記憶が抹消される
- 地名は全て古神の言語に基づいた意味を持ち、その真名を正しく呼唱することで地形や天候を限定的に操作できる
plot_outline:
- '序盤: 記録官エリオスが禁書庫で、かつて月食と共に消えた「静謐の村」の記述を発見し、自身の出生の謎を解くため旅に出る。'
- '中盤: 旅の途中で、月食の夜に生き残った唯一の「記憶の残滓」である少女リィンと出会い、世界を統べる聖教会の欺瞞と、消えた村に隠された生贄の儀式を暴いていく。'
- '終盤: 予言された大月食の日、消えた村が「空白の領域」として現世に回帰し、現存する都市を飲み込み始める。エリオスは星辰の書を用い、世界の再構築か、あるいは愛する者の抹消かという究極の選択を迫られる。'
- '結末: エリオスは自らの存在という最大の代償を払い、消えた村の魂を安らかに眠らせることで世界の均衡を再構築し、誰にも記憶されない静かな夜明けを世界に贈る。'
style_notes: 格調高い文語体をベースとした重厚な叙述。章の冒頭には作中の伝承や詩の一節を引用し、神話的な奥行きを持たせる。固有名詞はラテン語や古英語の響きを意識して構築し、地の文では情景描写に比喩と荘厳さを凝縮させる。会話文は身分や出自による口調の差異を厳格に描き分け、キャラクターの精神性を反映させる。
