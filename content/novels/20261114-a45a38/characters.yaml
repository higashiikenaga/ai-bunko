- name: カイ・セト
  role: 主人公
  age: 28
  gender: 男性
  appearance: 青白い肌に少し疲れの見える瞳。都市の標準的なグレーの作業着を常に着用している。
  personality: 冷静で観察眼が鋭いが、内側に拭いきれない虚無感を抱えている。一人称は「僕」。
  speech_style: 淡々としており、無駄のない事務的な話し方。
  background: ネオ・ソマのインフラを維持する保守点検員。感情チップの影響を最小限に抑える体質だが、幸福感も薄い。
  motivation: 地図に記された場所の真実を知り、自分が感じている「違和感」の正体を突き止めること。
  relationships:
  - name: エレナ・ヴァンス
    relation: 導き手
  - name: レン・クロムウェル
    relation: 対立者
  - name: ミオ
    relation: 同僚・対照的な存在
  arc: システムに従順な「部品」から、痛みや悲しみを受け入れて生きる「人間」へと変化する。
- name: エレナ・ヴァンス
  role: 脇役（メンター）
  age: 78
  gender: 女性
  appearance: 深い皺を刻んだ慈愛に満ちた顔立ち。色褪せた古い手編みのセーターを着ている。
  personality: 穏やかで強靭な精神を持つ。感情を抑圧せず、ありのままを受け入れる。一人称は「私」。
  speech_style: ゆっくりとした、物語を読み聞かせるような温かい口調。
  background: 感情最適化システム導入以前の時代を知る数少ない生存者。デッドゾーンで古い記録を守り続けている。
  motivation: 失われゆく「人間らしい感情」の記憶を、次の世代へ繋ぐこと。
  relationships:
  - name: カイ・セト
    relation: 大切な教え子
  arc: 自身の命の終わりを悟りながらも、最後に希望をカイへ託す。
- name: レン・クロムウェル
  role: 敵役
  age: 45
  gender: 男性
  appearance: 完璧に整えられた髪型と、一点の曇りもない高級なスーツ。感情の揺らぎを一切感じさせない端正な顔。
  personality: 極めて合理的で冷徹。苦痛を排除することが人類の救済だと信じて疑わない。一人称は「私」。
  speech_style: 丁寧だが、どこか機械的で突き放すような、絶対的な正義を感じさせる話し方。
  background: 都市管理AIの執行官。システムの最適化を推進し、エラー（負の感情）の排除を任務とする。
  motivation: 都市からすべての「不快なノイズ」を消し去り、完璧な幸福状態を維持すること。
  relationships:
  - name: カイ・セト
    relation: 排除すべきエラー
  arc: カイの行動を「システムのバグ」として処理しようとするが、最終的に論理では説明できない事象に直面する。
- name: ミオ
  role: 脇役
  age: 25
  gender: 女性
  appearance: 常に明るい表情で、色彩豊かな衣服を纏っている。こめかみには常に最新型の感情同期チップが輝いている。
  personality: 底抜けに明るく、常にポジティブ。しかし、その喜びはチップによって強制された空虚なものである。一人称は「私」。
  speech_style: 高揚感のある、弾んだような話し方。
  background: カイの同僚。システムの恩恵を最大限に受けており、苦痛や悲しみという概念を理解できない。
  motivation: 常に最適化された幸福感を維持し、社会に貢献すること。
  relationships:
  - name: カイ・セト
    relation: 友人・理解不能な存在
  arc: カイが変化していく姿を見て、自分の内側の「空っぽさ」に初めて気づき、戸惑う。
