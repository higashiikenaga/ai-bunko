title: 不眠都市の雨音と、アナログな座標
genre: ヒューマンドラマ
tone: 静謐で透明感のある、寂しさを孕んだ近未来日常
pov: 三人称近接
tense: 過去形
setting: 感情最適化システムが導入され、24時間眠らない超近代都市「ネオ・ソマ」
premise: 悲しみや孤独をチップで制御し、効率的に『幸福』を享受する世界。都市の保守点検員である主人公は、ある日、デジタル化される前の時代に書かれた『秘密の地図』を拾う。そこには、システムの監視が届かない、人々が本物の涙を流せる『空白の場所』が記されていた。
themes:
- 喪失の肯定
- 便利さと孤独
rules:
- 感情同期（シンク）：チップにより不快な感情が自動的に抑制され、常に穏やかな精神状態に保たれるシステム
- 擬似睡眠：15分の神経リセットで24時間活動可能な身体維持技術
- デッドゾーン：古い地下インフラにより通信が遮断され、同期が強制的に切れる物理的空間
plot_outline:
- 序盤：感情同期に依存し、空虚な幸福感の中で生きる主人公が、遺品整理の最中にアナログな手書きの地図を発見する。
- 中盤：地図を頼りに都市のデッドゾーンを巡り、同期を拒否して『悲しみの記憶』を守りながら生きる老人たちと出会い、痛みがあるからこそ得られる充足感を知る。
- 終盤：都市管理AIがデッドゾーンの完全消去（最適化）を決定。主人公は、不自由で痛みを伴う『人間らしさ』を物理的に残すため、地図に記された最後の聖域を隠そうと奔走する。
- 結末：聖域は消え、街は完璧な幸福を取り戻すが、主人公は心の中にだけ自分だけの地図を書き留め、静かに涙を流す術を身につける。
style_notes: 三人称近接視点。ニューラルリンクや同期率といったガジェットを日常会話に自然に混ぜ込む。清潔で白い都市の描写と、対照的な古びた路地裏の質感の描き分けを重視し、便利さの裏にある小さな寂しさを、静かな筆致で綴る。
