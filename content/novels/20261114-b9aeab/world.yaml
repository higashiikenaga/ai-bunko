title: 黄金の鼓動と、忘却の歯車市場
genre: スチームパンク冒険
tone: 重厚で煤けた、真鍮と熱気に満ちた叙事詩
pov: 三人称
tense: 過去形
setting: 氷の城の崩壊から数年後。熱が戻り、蒸気船が空を覆うようになった浮遊群島と、霧に包まれた巨大交易都市「錆びた月」。
premise: 世界に熱が戻り、新たな命が芽吹き始めた時代。黄金の心臓を持つレオンは、クララや零式と共に、失われた技術の断片を求めて旅を続けていた。しかし、人々の精神を蝕む「記憶の欠落」という奇病が流行し、その原因が、記憶を物理的な歯車へと変換して取引する「記憶を売る市場」にあることが判明する。レオンは、自らの黄金の鼓動が、失われた過去の記録を呼び覚ます鍵であることを知り、霧の都市の深淵へと足を踏み入れる。
themes:
- 記憶と自己の同一性
- 技術の継承と忘却
rules:
- 人工心臓の鼓動は、周囲の蒸気圧や機械の稼働リズムに干渉・共鳴することができる
- 黄金の部品は、周囲の熱エネルギーを吸収して高出力の振動を生む性質を持つ
- 『記憶を売る市場』では、記憶を蒸気駆動の記録媒体（メモリ・ギア）に変換して売買できるが、過剰な売却は魂の摩耗を招く
plot_outline:
- '序盤: 熱の還流によって活気づいた世界。しかし、レオンは自身の黄金の心臓が、時折「見知らぬ誰かの記憶」をノイズとして拾うことに違和感を覚える。調査を進める中で、人々が大切な思い出を金銭と引き換えに売る「記憶を売る市場」の存在を知り、クララがその市場の闇に触れてしまう。'
- '中盤: 祭りの夜、街は歓喜に包まれるが、その裏で記憶を失った「空っぽの市民」が急増していた。レオンは、記憶を抽出する巨大な蒸気機関『忘却の圧搾機』の存在を突き止める。零式は、機械的な論理から「記憶の欠損」を異常事態と判断し、レオンと共に市場の最深部へと潜入する。'
- '終盤: 市場の主である「記憶の蒐集家」は、世界を再び凍結保存するのではなく、全人類の記憶を一つの巨大な計算機（メカニズム）に集約しようとしていた。レオンは、自身の黄金の心臓を『忘却の圧搾機』の制御弁として接続し、蓄積された膨大な記憶の奔流に立ち向かう。'
- '結末: 激しい蒸気の爆発と、高周波の鐘の音と共に、奪われた記憶は人々の元へと還流した。レオンは心臓の負荷により一時的に機能を失うが、零式とクララの献身的な整備により再起動する。失われた記憶は戻ったが、新しい歴史が動き出す予感と共に、一行は再び蒸気艇の煙突を高く掲げて旅立つ。'
style_notes: 蒸気機関のピストン運動、真鍮の歯車の噛み合わせ、ボイラーの圧力計の震えなど、機械の動作を執拗なまでに細密に描写すること。物語の転換点では必ず鐘の音や煙突から噴き出す蒸気の音を強調する。会話は無骨で、職人が工具を扱うような手触りを持たせ、情緒的な言葉よりも機能的で重みのある語彙を選択すること。
