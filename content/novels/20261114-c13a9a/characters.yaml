- name: エリアス・ソーン
  role: 主人公
  age: 42
  gender: 男性
  appearance: 痩身で、常に疲労の色が濃い灰色の瞳。白髪混じりの短髪。極低温用高機能スーツを常に着こなしている。
  personality: 極めて論理的で観察眼に優れるが、一度没頭すると周囲が見えなくなる執着心を持つ。一人称は「私」。
  speech_style: 淡々とした学術的な口調。結論から先に述べ、根拠を論理的に提示する癖がある。
  background: 熱力学の権威として知られる物理学者。過去の宇宙探査事故で家族を失い、情報の不変性（エントロピー増大への抗い）に救いを見出そうとしている。
  motivation: 氷結モノリスが示す「熱力学第二法則の逸脱」のメカニズムを解明し、情報の保存理論を完成させること。
  relationships:
  - name: カエレン・ヴァンス
    relation: 現場指揮官であり、信頼を置く実務パートナー
  - name: アリス・ヴェイン
    relation: 学問的見解が対立するライバル
  arc: 客観的な観測者として異常事態を分析しようとするが、最終的に自身が「解明すべき情報の奔流」の一部へと変質していく。
- name: カエレン・ヴァンス
  role: 相棒
  age: 35
  gender: 女性
  appearance: 逞しい体格と、過酷な環境で鍛えられた引き締まった肢体。短く切り揃えられた黒髪。機能性を重視した重装備のエンジニアリングスーツを着用。
  personality: 現実主義者で、理論よりも生存と機器の稼働を優先する。直感に優れ、チームの精神的支柱。一人称は「私」。
  speech_style: 簡潔で力強い。命令形や断定的な言い回しが多く、現場の緊張感を維持する話し方。
  background: 深宇宙採掘船の熟練エンジニア。数々の極限環境を生き抜いてきたサバイバル術のスペシャリスト。
  motivation: 調査隊全員の安全な帰還と、調査機器の完全な動作維持。
  relationships:
  - name: エリアス・ソーン
    relation: 危うい探究心を持つ学術的対象であり、守るべき友人
  arc: 非科学的な現象に恐怖を感じながらも、物理的な限界を超えた「情報の熱」を目の当たりにし、世界の理の変容を受け入れていく。
- name: アリス・ヴェイン
  role: 敵役（狂信的な観測者）
  age: 50
  gender: 中性
  appearance: 透き通るような白い肌と、虚空を見つめるような虚ろな瞳。軽量なデータ考古学用センサーを全身に纏っている。
  personality: 冷徹で感情の起伏が乏しい。人間を「情報のノイズ」と見なし、文明の記憶の保存を至高の目的とする。一人称は「僕」。
  speech_style: 静かで、詩的ですらある不可解な言い回し。常に遠い未来や過去を見ているような話し方。
  background: 失われた文明の遺物研究における世界的権威。氷の城が「亡霊たちの聖域」であると確信している。
  motivation: 構造物の核へ到達し、情報の奔流に身を投じることで、滅亡した文明の記憶と一体化すること。
  relationships:
  - name: エリアス・ソーン
    relation: 真理への到達方法が異なる対立者
  arc: 調査の過程で、物理的な身体を捨て、情報の断片へと自ら変換されることで、構造物の一部となる。
