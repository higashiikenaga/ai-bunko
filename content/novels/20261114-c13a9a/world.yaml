title: 極低温エントロピー異常に関する調査報告 ―地下氷結モノリスにおける熱力学的パラドックス―
genre: SF
tone: 乾いた学術的文体、硬質で冷徹な観測者。
pov: 第一人称（調査員による記録体）
tense: 過去形
setting: 恒星系ケプラー186fの極地地下、巨大な人工氷結構造物内部。
premise: 未踏の惑星ケプラー186fの地下より、物理法則を逸脱した巨大構造物が発見された。それは「氷の城」と形容されるが、その内部では不可解なほど巨大な蒸気機関が稼働し続けている。本報告書は、熱力学第二法則を無視したそのエネルギー循環の謎を追う調査隊の断片的な観測記録である。構造物の深層に眠る「情報の熱変換」の真実を解明する試みである。
themes:
- 熱力学と情報の相関
- 文明の残留思念
rules:
- 氷結構造物は情報の熱力学的死を防ぐための「冷却装置」として機能する
- 蒸気機関は情報のエントロピーを熱エネルギーとして強制排出することで稼働する
- 観測者の意識（情報量）が構造物の内部状態に直接的な熱的干渉を引き起こす
plot_outline:
- '序盤: 異常な熱源の検知と調査チームの降下。氷の城の入口における、極低温下での異常な蒸気放出の観測記録。'
- '中盤: 階層構造の調査。各層に設置された巨大な蒸気機関の稼働原理の解析。氷が単なるH2Oではなく、高度に圧縮された「凍結データ」であることの判明。'
- '終盤: 城の核（コア）への到達。蒸気機関が「滅亡した文明の記憶」を熱に変換し、情報の崩壊を防いでいる実態の把握。'
- '結末: 調査員の意識が情報の奔流に飲み込まれ、一つの「データ」へと変換される現象の記録。構造物の再起動に伴う、熱力学的均衡の再構築。'
style_notes: 本編は、学術論文、実験ログ、及び破損した通信記録の断片によって構成される。記述は極めて客観的・記述的なトーンを維持しつつ、脚注（注釈）を用いて、読者が直接記述されていない「現場の違和感」や「観測者の心理的変容」を推察できるように設計すること。物語の全体像は、提示される断片的なデータ間の矛盾を読者が自ら接続することで補完させる実験的な構成とする。
