- name: 連次 (Renji)
  role: 主人公
  age: 23
  gender: 男性
  appearance: 青白い肌に、国家術師の黒い外套を纏った痩身の青年。常に疲弊した表情をしているが、瞳には強い知的好奇心が宿っている。
  personality: 冷静で合理的だが、内側に激しい情熱と正義感を秘めている。一人称は「私」。
  speech_style: 丁寧で理知的。専門用語を多用する傾向があるが、親しい相手には少しぶっきらぼうになる。
  background: 国家の演算資源を管理する術師局に所属する若きエリート。効率至上主義の体制に疑問を抱きつつ、職務として辺境の調査任務に就く。
  motivation: 人形の中に宿る「魂」の正体を突き止め、システムの不条理によって消された人々の尊厳を取り戻すこと。
  relationships:
  - name: エララ
    relation: 運命を共にする相棒であり、守るべき対象
  - name: ヴァレリウス
    relation: かつての師であり、思想的に対立する宿敵
  arc: 国家の歯車として生きることをやめ、自らの視力を代償にしてでも「個」の意志を優先させる人間へと成長する。
- name: エララ (Elara)
  role: 相棒
  age: 外見年齢16歳
  gender: 女性型
  appearance: 磁器のような白い肌に、金色の回路線が浮かび上がる自動人形。一部の装甲が剥がれ、内部の歯車と蒸気管が露出している。
  personality: 純粋で好奇心旺盛だが、記憶の欠落により時折ひどく悲観的になる。一人称は「私」。
  speech_style: 感情の起伏が少ない機械的な口調から始まり、物語が進むにつれて人間らしい抑揚を持つようになる。
  background: 「沈黙の村」の住民たちの記憶と意識を演算資源として統合し、保存するために作られた実験的なAI搭載人形。
  motivation: 自分が誰であったのかという記憶の断片を集め、完全な「自我」を持つこと。
  relationships:
  - name: 連次
    relation: 自分に「魂」があることを肯定してくれた唯一の人間
  - name: セリア
    relation: かつての村の記憶を通じて繋がる、血縁に近い親愛なる存在
  arc: 単なるデータの集合体から、他者のために自らを捧げることを選択できる「心」を持った存在へと進化する。
- name: ヴァレリウス (Valerius)
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない軍服に身を包んだ厳格な男。右目に演算補助用の機械義眼を装着しており、常に冷徹な光を放っている。
  personality: 徹底した功利主義者。文明の維持のためには少数の犠牲は不可欠であると信じて疑わない。一人称は「私」。
  speech_style: 威圧的で断定的。相手を論理的に追い詰める話し方を好む。
  background: 国家の「神格演算」システムを構築した最高責任者。かつては連次の師であり、彼に術式の基礎を教えた。
  motivation: 完璧な演算世界を構築し、人類を迷いと不確実性から解放すること。
  relationships:
  - name: 連次
    relation: 期待していた弟子であり、現在はシステムの不純物として排除すべき対象
  - name: エララ
    relation: 回収すべき貴重な演算サンプル
  arc: 不変の理を信じていたが、連次が起こした「理の書き換え」という予測不能な事態に直面し、自身の計算の不完全さを突きつけられる。
- name: セリア (Celia)
  role: 脇役
  age: 27
  gender: 女性
  appearance: 油汚れのついた革の作業着を着た、快活な印象の女性。巨大なレンチを武器として持ち歩いている。
  personality: 情熱的で直情的。弱者を守るためなら手段を選ばない。一人称は「あたし」。
  speech_style: 粗野でべらんめえ調。感情がすぐに声に出るタイプ。
  background: 「沈黙の村」の唯一の生存者であり、現在は地下組織で魔導機関の整備士として活動しながら復讐の機会を窺っている。
  motivation: 村を消し去った国家への復讐と、生き残ったことへの罪悪感からの解放。
  relationships:
  - name: エララ
    relation: 失った家族や友人の面影を重ねる大切な存在
  - name: 連次
    relation: 最初は不信感を抱いていたが、次第に信頼を寄せる戦友
  arc: 憎しみだけを原動力に生きていたが、エララとの交流を通じて、過去を乗り越えて未来へ進む勇気を得る。
