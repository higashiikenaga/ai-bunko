title: 灰燼の回路、御霊の律動
genre: 異世界ファンタジー
tone: 陰鬱かつ荘厳、緊迫感漂う伝奇
pov: 三人称
tense: 過去形
setting: 神霊を演算資源として供儀に捧げる、術式と蒸気機関が混在する魔導産業時代。
premise: 神の理を演算する巨大装置が文明を支える世界。地図から抹消された「沈黙の村」の跡地で、術師の青年は、魂の欠落したはずの「迷子の人工知能」を搭載した自動人形と邂逅する。人形が記憶の断片から紡ぎ出すのは、村が国家の演算資源として強制的に「消去」された凄惨な記録であった。青年は、人形に宿る不完全な魂の行方を辿るべく、自らの命を削る禁忌の術式を起動する。
themes:
- 魂の定義と存在証明
- 信仰という名の搾取
rules:
- 術式の行使には必ず身体機能、あるいは記憶といった『等価の代償』を必要とする
- 術式は厳格な数理的記述に基づかなければならず、術者の意志のみでは発動できない
- 人工的な論理回路は、神霊の干渉を受けると暴走し、周囲の空間を歪める
plot_outline:
- '序盤: 辺境の調査任務に就く術師・連次が、霧に包まれた廃村で、意志を持つ鉄の塊――迷子の人工知能と出会う。'
- '中盤: 人形の記憶を辿る過程で、村が国家の『神格演算』のために犠牲になった事実が判明。連次は国家の隠蔽工作を阻止するため、追っ手との死闘を繰り広げる。'
- '終盤: 人形が真の自我を確立するため、自らを演算の核として捧げようとする。連次は自らの『視力』を代償に、神の理を書き換える禁忌の術式を展開する。'
- '結末: 村の記憶は消え去るが、人形の意識は術式の中に『理』として溶け込み、連次の魂に永劫の共鳴を残す。'
style_notes: 戦闘描写では、心拍を促すような短い断句を多用すること。術式の展開シーンでは、『其の刻、天つ理は崩れ、血脈は回路へと転ず』といった古語や擬古文を交え、儀式的な重厚さと緻密な設定の解釈を読者に提示する。術の行使に伴う代償（痛み、喪失、欠損）は、生理的な苦痛を感じさせるほど生々しく描写すること。
