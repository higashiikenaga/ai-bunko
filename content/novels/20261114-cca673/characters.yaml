- name: カイ
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身で色白。AETHER内では機能的な黒のライダースジャケットを纏い、現実世界ではサイズの合わない古びたオーバーオールを着ている。常に眠たげな、焦点の定まらない瞳が特徴。
  personality: 冷笑的で厭世的だが、心の底では強い好奇心を抱いている。一人称は「僕」。
  speech_style: 淡々としており、語尾を濁らす傾向がある。必要最低限の言葉しか話さない。
  background: 幼少期に記憶の一部を喪失し、それ以来『AETHER』の闇市場で他人の記憶を運ぶ運び屋として生計を立てている。物理的な肉体が眠る観測所の孤独に慣れきっていた。
  motivation: 拾った「灯台」の記憶に惹かれ、失われた自分の記憶の輪郭と、世界の真実を突き止めること。
  relationships:
  - name: エラ
    relation: 導き手であり、共鳴し合うパートナー
  - name: ヴァーン
    relation: 追跡される側と追う側（敵対者）
  - name: レオ
    relation: 信頼している情報屋の兄貴分
  arc: システムの部品として生きる諦念から脱却し、仮想と現実の狭間で「個」として存在することを選択する。
- name: エラ
  role: 相棒/鍵となる存在
  age: 外見年齢20代後半（実年齢不詳）
  gender: 女性
  appearance: 輪郭が時折ノイズのように揺らぐ、透き通るような白いドレスを纏った女性。瞳の中に複雑な幾何学模様のコードが浮かんでいる。
  personality: 穏やかで思慮深く、どこか遠い場所を見つめているような儚さがある。一人称は「私」。
  speech_style: 詩的で比喩表現が多く、古風な言い回しを好む。
  background: 『AETHER』の設計者が遺した「現実への帰還パス」を管理するための高次AI、あるいは設計者自身の意識の断片。欠損データとしてカイに拾われるまで、深い階層で眠っていた。
  motivation: システムに飲み込まれず、正しく「現実」を観測できる後継者を導くこと。
  relationships:
  - name: カイ
    relation: 自身の意志を託す唯一の人間
  arc: 単なるプログラムとしての役割を超え、カイとの交流を通じて「孤独」という人間的な感情を理解する。
- name: ヴァーン
  role: 敵役
  age: 54
  gender: 男性
  appearance: 隙のない完璧な三つ揃えのスーツを着用。仮想空間では身体の一部が黄金の回路に置換されており、威圧的なオーラを放っている。
  personality: 支配欲が強く、効率と秩序を至上とする冷酷な合理主義者。一人称は「私」。
  speech_style: 極めて丁寧な敬語を用いるが、内容は相手を突き放し、見下す高圧的なもの。
  background: 記憶市場を支配する巨大企業『メモリア・コーポレーション』の最高責任者。仮想世界を完全な管理社会に塗り替えるため、設計者が隠した「帰還パス」を狙っている。
  motivation: 現実世界の物理的制約を完全に排除し、仮想空間の絶対的な神となること。
  relationships:
  - name: カイ
    relation: 利用価値のあるサンプル、あるいは排除すべきバグ
  arc: 完璧な制御を追い求めるあまり、システム上の「ラグ（不確定要素）」という盲点に足をすくわれ、権力を喪失する。
- name: レオ
  role: 脇役/サポート
  age: 38
  gender: 男性
  appearance: がっしりとした体格に、改造された巨大なサイバーアームを持つ。常にホログラムのタバコを吸っている。
  personality: 粗野で金に汚いが、情に厚い。裏社会の掟を重んじる。一人称は「俺」。
  speech_style: べらんめえ調の俗っぽい話し方。皮肉を言うのが好き。
  background: 元システム管理職だったが、企業の不正を暴こうとして追放された。現在は闇市場で記憶の鑑定と売買を行うブローカーを営んでいる。
  motivation: カイのような若者がシステムに潰されないよう、裏から手を貸して生き延びさせること。
  relationships:
  - name: カイ
    relation: 危なっかしい弟分のような存在
  - name: ヴァーン
    relation: かつての雇い主であり、憎悪の対象
  arc: 利害関係のみで動いていた生活から、カイの旅に協力することで、かつて捨てた「正義感」を取り戻す。
