title: エコー・オブ・レイテンシー ―記憶の残滓と灯台の観測者―
genre: SF
tone: 静謐な現実と、高彩度で加速する仮想世界の対比
pov: 三人称
tense: 過去形
setting: 西暦2140年。肉体はカプセル内で眠り、意識の大部分が巨大仮想ネットワーク『AETHER』に移行した近未来。物理的な拠点は、荒廃した海岸線に立つ孤立した観測所。
premise: 人々の不要な記憶をデータ化して売買する闇市場「メモリー・エクスチェンジ」が横行する世界。記憶の運び屋である青年カイは、ある日、存在しないはずの「古い灯台」の風景が記録された欠損データを拾う。そのデータには、現実世界の境界を侵食し始める謎のバグが潜んでいた。仮想世界の加速するノイズと、静まり返った現実の孤独の間で、カイは失われた自己の輪郭を探し始める。
themes:
- 現実と仮想の境界線
- 記憶の価値とアイデンティティ
rules:
- 「メモリー・エクスチェンジ」では、感情を伴う記憶ほど高値で取引される。
- 仮想空間『AETHER』において、致命的なエラーが発生すると、プレイヤーの意識の一部がデータとして揮発（デリート）される。
- 現実世界の感覚器官は、仮想空間へのダイブ中、低速なフィードバックとしてのみ機能する。
plot_outline:
- '序盤: 記憶の運び屋として食い繋ぐカイが、市場で「古い灯台」の記憶データを入手する。そのデータに触れた瞬間、システムメッセージ『[WARNING]: 未定義の領域へのアクセスを検知しました』が走り、視界が歪む。'
- '中盤: 灯台の記憶を追ううちに、カイはそれが単なるデータではなく、かつて仮想世界を構築した設計者が残した「現実への帰還パス」であることを知る。仮想空間では高速な追跡者との攻防が繰り広げられ、現実では静かな波音だけが響く孤独な夜が描かれる。'
- '終盤: 記憶の市場を支配する巨大企業が、灯台のデータを回収するためにカイを追い詰める。カイは仮想世界の崩壊（ラグ）を利用し、データの深淵へとダイブする。そこには、現実と仮想が混ざり合う「灯台」の光景が広がっていた。'
- '結末: カイは灯台の記憶を自身の核として統合し、システムから逸脱した「存在しないはずの観測者」となる。彼は現実の肉体に戻ることを選ばず、データの海と現実の境界線上で、誰にも見えない光を灯し続ける。'
style_notes: '仮想空間の描写では、色彩、速度、情報の断片を多用し、短文を重ねてテンポよく、サイバーパンク的な高揚感を演出する。対照的に、現実の場面では、湿度、温度、静寂、緩やかな時間の経過を丁寧に描き、読者に孤独感を与える。作中には、システムによる警告や通知を【SYSTEM:
  ○○】といった形式で挿入し、物語の非現実性を強調すること。'
