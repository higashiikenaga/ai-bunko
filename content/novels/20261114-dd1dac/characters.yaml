- name: 一ノ瀬 花江（いちのせ はなえ）
  role: 主人公
  age: 19
  gender: 女性
  appearance: 栗色のポニーテールに、いつも小麦粉がついたエプロン姿。快活で大きな瞳が特徴。
  personality: 情熱的で前向き。お菓子作りへのこだわりが強く、努力家。一人称は「あたし」。
  speech_style: ハキハキとした元気な話し方。感情が高ぶると早口になる。
  background: 不思議な街にあるパン屋「スウィート・メモリー」の見習い。美味しいパンで人を幸せにすることに心血を注いでいる。
  motivation: 最高の焼き菓子を作り、記憶を失ったルカの時間を動かして思い出を取り戻させたい。
  relationships:
  - name: ルカ
    relation: 記憶を取り戻させてあげたい大切な友人
  - name: 海斗
    relation: 喧嘩ばかりしているが信頼し合っている同僚
  - name: 店主（マダム）
    relation: 師匠であり、街の秘密を握る導き手
  arc: 単に「美味しいものを作る」だけでなく、「誰かの心に届く味」を追求することで、料理が持つ魔法のような力を確信する。
- name: ルカ
  role: メインキャラクター
  age: 17
  gender: 男性
  appearance: 透き通るような白い肌に、淡い銀色の髪。どこか儚げで、時代遅れの古風な衣服を纏っている。
  personality: 内向的で控えめだが、好奇心旺盛。静かに相手の話を聞くタイプ。一人称は「僕」。
  speech_style: 丁寧で控えめな口調。時折、古風な言い回しが混ざることがある。
  background: 地図から消えた「消えた村」の唯一の生き残り。記憶を失い、街を彷徨っていたところを花江に拾われる。
  motivation: 自分が誰であり、どこから来たのかという記憶を取り戻し、止まった時間を動かしたい。
  relationships:
  - name: 一ノ瀬 花江
    relation: 自分に居場所と記憶をくれた恩人
  - name: 海斗
    relation: 賑やかさに戸惑いつつも、心地よさを感じている友人
  arc: 喪失感に囚われていた状態から、花江たちの温かさに触れ、記憶を持つこと以上に「今ここに居ること」の幸せに気づく。
- name: 白金 海斗（しろがね かいと）
  role: 相棒/ムードメーカー
  age: 20
  gender: 男性
  appearance: すらっとした長身に、少し崩した着こなしの店員服。いたずらっぽく笑う口元が特徴。
  personality: お調子者で楽観的。お菓子を作るよりも食べる方が好き。実は気配りに長けている。一人称は「俺」。
  speech_style: 軽快でカジュアルな口調。花江をからかうことが多い。
  background: 「スウィート・メモリー」の助手。街の噂に詳しく、情報屋的な側面を持つ。
  motivation: 店を賑やかにし、花江やルカが笑って過ごせる環境を作ること。
  relationships:
  - name: 一ノ瀬 花江
    relation: 口喧嘩の相手であり、最高のパートナー
  - name: ルカ
    relation: 弟のように可愛がり、外の世界を教える兄貴分
  arc: 適当にこなしていた仕事に対し、ルカの記憶を取り戻そうと奮闘する花江の姿を見て、真摯に物事に向き合う大切さを学ぶ。
- name: マダム・クロエ
  role: 脇役/メンター
  age: 45
  gender: 女性
  appearance: 気品のあるドレスにレースのエプロン。常に穏やかな微笑みを浮かべ、眼鏡の奥の瞳はすべてを見透かしている。
  personality: 穏やかでミステリアス。含みのある言い方をし、若い二人の成長を静かに見守る。一人称は「私」。
  speech_style: ゆったりとした、包容力のある上品な話し方。
  background: パン屋「スウィート・メモリー」の店主。街の不思議なルールと「消えた村」の歴史に精通している。
  motivation: 花江に真の菓子職人としての道を歩ませることと、ルカを正しい場所へ導くこと。
  relationships:
  - name: 一ノ瀬 花江
    relation: 才能ある弟子であり、期待を寄せている後継者
  - name: ルカ
    relation: 導くべき運命を持つ少年
  arc: 物語の舞台装置としての役割が強く、変化よりも、彼女の提示する試練が他キャラクターを成長させる。
