title: あたしと、お菓子と、魔法のパン屋の秘密
genre: 日常ほのぼの
tone: 明るく軽快で、心温まる雰囲気
pov: 一人称（あたし）
tense: 現在形・過去形混在
setting: 現代の日本の片隅にある、地図に載っていないような不思議な街
premise: パン屋「スウィート・メモリー」で働くあたしは、毎日おいしいパンを焼くことに命を懸けてる！でも、この街にはちょっと変わった噂があるんだ。「約束の丘」に行くと、昔あったはずの「消えた村」の記憶を、甘いお菓子と一緒に思い出せるっていう……。ある日、記憶を失った不思議な少年がやってきて、あたしの作る焼き菓子が彼の止まった時間を動かし始める！
themes:
- 記憶と再会
- 日常の中の小さな魔法
- 食べ物の温もり
rules:
- 記憶は特定の甘い味覚を通じて、断片的に蘇る
- 『消えた村』の住人は、街の境界線に溶け込んで共存している
- 魔法はパンの焼き加減や糖度によって微妙に変化する
plot_outline:
- '序盤: パン屋での賑やかな日常。あたしの美味しいパンと、少しお調子者な助手との掛け合い。謎の少年・ルカとの出会い。'
- '中盤: ルカが「消えた村」の住人であることを知る。約束の丘へ向かうため、彼が忘れた記憶を呼び覚ます『記憶のコンフィチュール』を作る修行。'
- '終盤: 約束の丘で、消えた村の景色が幻のように現れる。ルカの記憶が戻ると同時に、村の断片が街の風景と重なり合う。'
- '結末: ルカは村の記憶を持ったまま、パン屋で働き始める。今日もあたしは、美味しいパンと笑い声で街を包む！'
style_notes: 一人称「あたし」による、テンポの速いツッコミ混じりの語り。食べ物の描写（焼き立ての香ばしさ、とろける食感など）は情熱的に、かつ美味しそうに書くこと。各話の終わりに、キャラクターのちょっとした失敗や食いしん坊な一面などの小さな笑いどころを必ず配置する。
