- name: 久我 蓮
  role: 主人公（エリート）
  age: 32
  gender: 男性
  appearance: 隙のないグレーの三ピーススーツに身を包み、冷徹な光を宿した眼鏡をかけている。指先まで手入れされた清潔感のある外見。
  personality: 完璧主義で合理主義。感情を排して最適解を求めるが、内面には埋まらない虚無感を抱えている。一人称：私
  speech_style: 論理的で簡潔。相手に隙を与えない丁寧だが突き放すような口調。
  background: 都市再開発を推進する大手コンサルタント。効率的な都市設計を信奉しているが、自身が設計した街に居場所がないと感じている。
  motivation: 数値化できない「人生の意味」や「心の充足」を無意識に追い求めている。
  relationships:
  - name: 榎本 聖
    relation: 古美術店を訪れる稀な客であり、唯一自分を透視してくる人物として警戒しつつ惹かれている
  arc: 絶対的な効率性を信じていたが、破片を通じて「不完全であることの価値」を受け入れ、心の鎧を脱ぎ捨てる。
- name: 白石 澪
  role: 主人公（表現者）
  age: 24
  gender: 女性
  appearance: 藍色に染めたショートヘア。常に絵具の汚れがついたオーバーサイズの古着を纏い、指先は常に汚れ、落ち着きなく動いている。
  personality: 情熱的だが情緒不安定。繊細な感性を持ち、世界の色彩に過敏に反応する。一人称：あたし
  speech_style: 比喩が多く、独り言のような呟きが混ざる。感情が高ぶると早口になる。
  background: 再開発予定地区の安アパートに住む無名画家。消えゆく街の風景をキャンバスに留めようともがいている。
  motivation: 誰にも忘れられない、自分だけの「絶対的な色」を見つけ、世界に刻み込みたい。
  relationships:
  - name: 空 海人
    relation: 路地裏で偶然出会い、お互いの危うさを本能的に察知している奇妙な共鳴関係
  arc: 承認欲求による表現から、誰かと孤独を分かち合うための表現へと変化し、精神的な安定を得る。
- name: 空 海人
  role: 主人公（学生）
  age: 19
  gender: 男性
  appearance: 深いフードを被り、視線を隠している。痩身で、常に周囲を警戒する動物のような鋭い眼差しを持つ。
  personality: 皮肉屋で人間不信。しかし根は純粋で、捨てられた動物や壊れたものに愛着を持つ。一人称：俺
  speech_style: ぶっきらぼうで、言葉数を極端に少なくする。年上の人間に対しては特に反抗的な口調。
  background: 名門校を中退し、親の期待と過去の過ちから逃れて都市の裂け目に潜伏している逃亡者。
  motivation: 誰にも見つからず、誰にも干渉されない「絶対的な安息地」を探している。
  relationships:
  - name: 榎本 聖
    relation: 店に転がり込んだことで、人生で初めて「否定されずに居場所を与えてくれた」大人として信頼している
  arc: 逃避し続ける人生を止め、自分の欠損した部分を認め、他者と向き合う勇気を持つ。
- name: 榎本 聖
  role: 主人公（店主）
  age: 58
  gender: 男性
  appearance: 丸い眼鏡にリネンのエプロン。穏やかな微笑みを絶やさず、使い込まれた書棚に囲まれて静かに佇んでいる。
  personality: 達観しており、包容力がある。聞き上手で、相手が自ら答えを出すまで静かに待つことができる。一人称：私
  speech_style: ゆっくりとした穏やかな口調。時折、相手の核心を突く哲学的な問いを投げかける。
  background: 元大学教授。ある出来事をきっかけに教職を捨て、都市の片隅で古美術店を営む。剣の破片の元の持ち主を知る人物。
  motivation: 都市から消えゆく記憶と、迷える人々を繋ぎ合わせ、緩やかな救済をもたらすこと。
  relationships:
  - name: 久我 蓮
    relation: 若き日の自分に似た危うさを感じ、導こうとしている
  - name: 白石 澪
    relation: 彼女の感性を高く評価し、静かに見守る後援者のような立場
  - name: 空 海人
    relation: 居場所を失った少年に、知識と静寂という避難所を提供している
  arc: 観測者としての立場から、自らもまた喪失を抱えた一人であるという人間的な側面を露わにし、彼らと共に歩み出す。
