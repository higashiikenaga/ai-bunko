title: 藍の残響、都市の裂け目に
genre: 群像劇
tone: 静謐で、少しずつ熱を帯びていく都会の哀愁
pov: 三人称（視点人物ごとに文体の質感を変える）
tense: 過去形
setting: 現代、再開発の波に洗われる海沿いの都市
premise: 巨大なビル群がそびえる都市は、人々にとっての砂漠であり、誰もが拭えない渇きを抱えて生きている。ある時、古美術商の店から消えた「折れた剣」の破片が、街の異なる場所に落ちていく。それは、孤独なエリート、夢を追う表現者、逃亡中の学生、そして静かな店主の人生を、不可解な糸で結びつけていく。
themes:
- 断絶された繋がり
- 欠落の中に見出す意味
rules:
- 各章の視点人物は、物語の終盤まで互いの存在に気づかない
- 物語の結節点となる場所は、都市の喧騒から隔絶された、まるで砂漠のオアシスのような静寂を持つ喫茶店である
plot_outline:
- '序盤: 四人の異なる視点から、都市の冷たさと彼らが抱える精神的な「欠落」が、それぞれ異なる温度感の文体で描かれる。'
- '中盤: 折れた剣の破片が、それぞれの生活に不穏な、あるいは不思議な変化をもたらす。視点が移るごとに、文章の硬度や色彩感覚が変化し、読者に異なる世界の断片を見せる。'
- '終盤: 破片の行方を追う中で、バラバラだった四人の運命が、雨の降る夜の喫茶店へと収束していく。'
- '結末: 剣が元の形に戻ることはないが、破片を持ったままの彼らが、互いの孤独を認め合うことで、都市の中での新しい生存の形を見出す。'
style_notes: 視点人物の社会的地位や心理状態を文体で表現すること。エリート社員には乾いた硬質な短文を、表現者には色彩豊かな比喩を、学生には淡く儚い透明感のある記述を、店主には重みのある叙情的な筆致を割り当てる。物語が収束するにつれ、異なる文体たちが一つの大きなうねりとして混ざり合う構成を目指す。
