- name: カイ・ルミナス
  role: 主人公
  age: 16
  gender: 男性
  appearance: 飛行ゴーグルを額にかけ、使い込まれた茶色のフライトジャケットを着用。風に跳ねた栗色の髪と、好奇心に満ちた琥珀色の瞳が特徴。
  personality: 楽観的で勇敢。直感で動くタイプ。一人称は「俺」。
  speech_style: 快活で勢いのある口調。時折、操縦士特有の専門用語を混ぜて喋る。
  background: 辺境の廃材置き場で育った孤児。失踪した父から遺された謎の地図と小型飛空艇『スカイ・ラプター号』を大切にしている。
  motivation: 父が追い求めた伝説の浮遊大陸と地下図書館に到達し、父の真意を知ること。
  relationships:
  - name: リナ
    relation: 幼馴染であり、最高の信頼を寄せる相棒
  - name: ヴァルガス将軍
    relation: 執拗に追ってくる宿敵
  arc: ただの憧れで旅に出た少年から、世界の真実を受け入れ、知識を次世代へ繋ごうとする責任感ある操縦士へと成長する。
- name: リナ・クロムウェル
  role: 相棒
  age: 15
  gender: 女性
  appearance: 油汚れのついたオーバーオールを着用。長い金髪を機能的に三つ編みにまとめている。腰のツールポーチには常に巨大なレンチを差している。
  personality: 現実主義で慎重。口は悪いが情に厚い努力家。一人称は「私」。
  speech_style: 論理的でハキハキとした話し方。カイの無鉄砲な行動に鋭いツッコミを入れる。
  background: 廃材置き場で天才的な整備技術を身につけた少女。スカイ・ラプター号の性能を限界まで引き出すチューニングを担う。
  motivation: 未知の古代技術を目の当たりにし、世界最高のエンジニアになること。
  relationships:
  - name: カイ・ルミナス
    relation: 危なっかしいので放っておけないパートナー
  arc: 設計図や理論に固執していたが、カイの直感と情熱に触れ、正解のない冒険を楽しむ心の余裕を身につける。
- name: セレスティア
  role: 案内役/脇役
  age: 20
  gender: 女性
  appearance: 風を孕む白いドレスに、真鍮製の複雑な装飾が施された司書のような衣装を纏う。透き通るような青い瞳と長い銀髪を持つ。
  personality: 穏やかで神秘的。知識への探究心が強く、時に世俗に疎い。一人称は「私」。
  speech_style: 丁寧で静かな口調。比喩表現や詩的な言い回しを好む。
  background: 地下図書館の末裔であり、図書室の封印を解く鍵を握る守護者。長い間、ふさわしい継承者が現れるのを待っていた。
  motivation: 図書館に眠る世界の記憶を正しく継承し、帝国の独占から守ること。
  relationships:
  - name: カイ・ルミナス
    relation: 導くべき運命の操縦士
  arc: 孤独に知識を守り続けるだけの静的な存在から、仲間と共に未来を切り拓く能動的な旅人へと変わる。
- name: ヴァルガス将軍
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない黒い帝国軍制服に身を包み、左目に鋭い赤いモノクルを装着している。冷徹な眼差しと整えられた口髭が威圧感を与える。
  personality: 冷酷非情で完璧主義。力による支配こそが秩序であると信じている。一人称は「私」。
  speech_style: 慇懃無礼で威圧的な話し方。相手を見下した余裕のある口調。
  background: 帝国軍の艦隊を率いる最高司令官。地下図書館の知識を用いて世界の空を完全に統制しようと企んでいる。
  motivation: 地下図書館を独占し、絶対的な権力と不滅の帝国を築くこと。
  relationships:
  - name: カイ・ルミナス
    relation: 計画の邪魔をする、排除すべき小蝿
  arc: 絶対的な力で全てを支配できると信じていたが、カイたちの絆と不屈の精神に敗北し、真の強さの意味を突きつけられる。
