title: 銀翼の航路と風の図書館
genre: スチームパンク冒険
tone: 爽快でダイナミックな冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島が点在する空中世界「スカイ・レギオン」。蒸気機関と風力飛行技術が発展した時代。
premise: 風を操る操縦士の少年カイは、亡き父が遺した「秘密の地図」を手に、伝説の浮遊大陸を探す旅に出る。地図が示す先にあるのは、世界の全てが記録されているという伝説の「地下図書館」。カイは、自慢の小型飛空艇『スカイ・ラプター号』と共に、個性豊かな仲間たちと雲海を駆け抜ける。追跡してくる帝国軍の巨大戦艦を振り切り、彼らは風の向こうにある真実へと到達できるのか。
themes:
- 未知への挑戦
- 仲間との固い絆
- 失われた知識の継承
rules:
- 浮遊島は強力な磁場によって空中に留まっている
- 飛空艇の動力は高純度の蒸気と、風を捕らえる特殊な翼の形状に依存する
- 地下図書館は地表ではなく、巨大な浮遊大陸の内部（空洞）に存在する
plot_outline:
- '序盤: 廃材置き場で暮らすカイが、父の遺品から風の流れを読み解く「秘密の地図」を発見する。帝国軍の追手から逃れるため、整備士の少女リナと共に小型飛空艇で雲海へと飛び立つ。'
- '中盤: 空中都市や嵐の海を越え、地図の謎を解き明かす仲間が集まる。地図が指し示すのは、雲の底に隠された巨大な浮遊大陸。激しい空中戦を繰り広げながら、彼らは大陸の入り口を見つけ出す。'
- '終盤: 大陸内部へと潜り込んだ一行は、忘れ去られた「地下図書館」へと辿り着く。そこで世界の成り立ちと、地図が隠していた真の目的を知るが、図書館を独占しようとする帝国の総攻撃が始まる。'
- '結末: 仲間たちの連携とカイの卓越した操縦術により、帝国の艦隊を突破。図書館の知識を守り抜き、一行は新たな空の旅へと旅立つ。'
style_notes: 空の青さ、風の匂い、蒸気の噴出、そして翼が風を切る音を、躍動感あふれる言葉で描写すること。機械の歯車が噛み合う音や、飛空艇のエンジンが唸る様子を五感に訴えかけるように書き、読者が共に空を飛んでいるような爽快感を与えること。
