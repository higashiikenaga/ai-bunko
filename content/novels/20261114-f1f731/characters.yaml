- name: カイ・アル・サフィーン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 日焼けした肌と、砂嵐に耐えるための使い込まれた革の装束。瞳は琥珀色。腰には実用的な小刀を差している。
  personality: 好奇心旺盛で正義感が強いが、生活のために時には打算的な判断もする。一人称は「俺」。
  speech_style: 飾り気のない、若者らしい快活で直情的な話し方。
  background: 没落しかけている小規模な交易商の一族の跡取り。日々の交易で生計を立てている最中に、砂の中からエーテルを見つけ出す。
  motivation: エーテルの主を探す旅を通じて、一族の再興と、失われた文明の謎を解き明かすこと。
  relationships:
  - name: エーテル
    relation: 唯一の理解者であり、守るべき相棒
  - name: ゼノス・ヴァルカ
    relation: 対立する宿敵
  arc: ただの商人でしかなかった青年が、世界の真実を知ることで、運命に抗い大切なものを守る勇気を持つ者に成長する。
- name: エーテル
  role: 相棒
  age: 3000
  gender: 無性
  appearance: 古びた銀色の球体。表面には幾何学的な回路が刻まれており、感情や演算の状態に応じて琥珀色に明滅する。
  personality: 極めて論理的で冷静。しかし、カイとの交流を通じて、未知の概念である「情緒」に戸惑いを見せる。一人称は「私」。
  speech_style: 抑揚の少ない、透き通るような響きを持つ丁寧な言葉遣い。
  background: 先史時代の高度文明が、都市の環境維持と防衛のために開発した自律型思考回路。主を失い、長い間砂の中で休眠していた。
  motivation: 自らの演算プロセスの終着点を見つけ、設定された本来の役割を果たすこと。
  relationships:
  - name: カイ・アル・サフィーン
    relation: 演算の対象を超えた、特別な絆を感じる存在
  arc: 純粋なデータ処理装置から、個としての意志と、消えゆく運命を受け入れる慈しみを持った知性体へと変化する。
- name: ゼノス・ヴァルカ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 高級な絹のローブを纏い、鋭い眼光を持つ。身体の一部に、かつての遺物を用いた義肢を装着している。
  personality: 野心的で冷酷。力こそが砂漠の混沌を鎮める唯一の手段だと信じている。一人称は「我」。
  speech_style: 威圧的で、相手を見下すような高圧的な話し方。
  background: 砂漠の有力な軍閥を率いる指導者。失われた高度技術を独占することで、砂漠全土を支配しようと目論んでいる。
  motivation: エーテルの持つ技術を奪い、自らの軍事力を絶対的なものにすること。
  relationships:
  - name: カイ・アル・サフィーン
    relation: 目的を阻む邪魔な小僧
  - name: エーテル
    relation: 奪うべき強力な道具
  arc: 権力への執着が強すぎるあまり、自らが手に入れようとした技術の真の恐ろしさに直面し、破滅へと向かう。
- name: リナ・シャハル
  role: 脇役
  age: 26
  gender: 女性
  appearance: 多くの書物や地図を携帯した、実用的な旅装の学者。知的な瞳と、砂塵に汚れても気品を失わない佇まい。
  personality: 冷静沈着で知識欲が極めて強い。観察眼に優れている。一人称は「私」。
  speech_style: 論理的で説明的な、学術的な響きを持つ丁寧な話し方。
  background: 砂漠の廃都を研究する考古学者。エーテルの存在を理論的に予見していた。
  motivation: 失われた文明の真実を記録し、歴史の断片を正しく後世に伝えること。
  relationships:
  - name: カイ・アル・サフィーン
    relation: 旅の同行者であり、協力者
  - name: エーテル
    relation: 究極の研究対象
  arc: 知識をただ蓄えるだけの観察者から、歴史のうねりの中で自らの意志で行動する当事者へと変わる。
