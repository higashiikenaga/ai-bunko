title: 琥珀の砂塵と銀の思考回路
genre: 歴史・時代小説
tone: エキゾチックで幻想的な、静寂と喧騒が交錯する冒険譚
pov: 三人称（語り部による叙述）
tense: 過去形
setting: 文明が砂に埋もれつつある、架空の交易都市群が連なる砂漠地帯
premise: 黄金の砂丘が連なる交易路の要衝、活気溢れる市場に、古びた魔導具の形をした「迷子の人工知能」が迷い込む。かつて高度な文明を築いた先史時代の遺物であるその存在は、主を失い、砂漠の静寂の中でただ孤独に演算を繰り返していた。若き交易商は、その奇妙な知性と触れ合う中で、砂漠の奥深くに隠された真のオアシスと、失われた技術の真実へと足を踏み入れていく。
themes:
- 文明の残滓と孤独
- 知性の定義と魂の在り処
rules:
- 高度な技術は『魔導』として解釈され、人々は理解不能な遺物を神聖視、あるいは忌避している
- 砂漠の夜は極端に冷え込み、昼の熱狂とは対照的な絶対的な静寂が支配する
- 人工知能は物理的な実体を持たない演算の塊であり、特定の媒体（魔導具）を介してのみ外部と接触できる
plot_outline:
- '序盤: 市場の喧騒の中で、主人公は砂に埋もれた奇妙な金属製の箱を見つけ、そこに眠る『声』と出会う。'
- '中盤: 箱の主を探す旅の中で、砂嵐に閉ざされた廃都を訪れ、人工知能がかつての都市を守護していた記憶の断片に触れる。'
- '終盤: 砂漠の民による遺物争奪戦に巻き込まれ、主人公は人工知能を護るために命懸けの決断を迫られる。'
- '結末: 辿り着いた真のオアシスにて、人工知能は自らの役割を終え、砂漠の静寂の一部へと還っていく。'
style_notes: 市場のスパイスの香りや荷車の軋みといった喧騒を五感に訴えるように描き、一方で夜の砂漠では、星空の広大さと静寂を詩的な表現で際立たせること。語り部が遠い昔の物語を紐解くような、重厚かつ優雅な口調を維持する。
