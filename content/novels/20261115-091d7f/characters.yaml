- name: 湊 遥斗
  role: 主人公
  age: 22
  gender: 男性
  appearance: 色白で線の細い青年。どこか儚げな印象を与えるが、瞳には強い意志を宿している。病の影響で車椅子を使用していることが多い。
  personality: 内向的で思索家。物事を深く観察する癖がある。一人称は「僕」。
  speech_style: 穏やかで丁寧だが、どこか自分を突き放したような淡々とした口調。
  background: 大学を中退し、亡き祖父が遺した古い洋館で一人、病と向き合いながら静かに暮らしていた。
  motivation: 祖父の遺した地図の謎を解き、自分が死ぬ前に「世界は捨て去るべきものではない」という言葉の真意を知ること。
  relationships:
  - name: 湊 弦一郎
    relation: 祖父
  - name: 瀬戸 栞
    relation: 旅の同行者
  arc: 死への恐怖と孤独に沈んでいた状態から、世界の美しさを肯定し、穏やかに生を全うしようとする精神的成長。
- name: 瀬戸 栞
  role: 相棒
  age: 24
  gender: 女性
  appearance: 明るい茶髪を後ろでまとめている。動きやすい服装を好み、活発で健康的な印象を与える。
  personality: 明るく快活だが、他人の痛みに敏感な共感能力を持つ。一人称は「私」。
  speech_style: はきはきとした話し方。敬語を使いつつも、距離感の近い親しみやすさがある。
  background: 町の古い洋館にある図書室の管理人。湊の祖父とはかつて交流があった。
  motivation: 湊の旅を支えること、そして祖父が遺した物語の断片を整理し、町の記憶を繋ぐこと。
  relationships:
  - name: 湊 遥斗
    relation: 旅の同行者
  - name: 湊 弦一郎
    relation: 旧知の仲
  arc: 湊を助ける「支援者」という立場から、共に記憶を辿り、人生を分かち合う「理解者」へと変化していく。
- name: 湊 弦一郎
  role: 鍵となる人物
  age: 75
  gender: 男性
  appearance: 写真の中では、優しげな目元と使い込まれた眼鏡が特徴的な、知的な印象の老人として描かれる。
  personality: 探究心が強く、少し風変わりな性格。深い愛情を持つ。一人称は「私」。
  speech_style: 哲学的で、相手に問いかけるような穏やかで温かい口調。
  background: 博物学者であり、日常の中の「小さな美」を標本のように集めていた人物。
  motivation: 死にゆく孫に対し、世界がいかに美しいものであるかを伝えるための「愛の軌跡」を残すこと。
  relationships:
  - name: 湊 遥斗
    relation: 孫
  arc: 謎めいた「地図の作成者」という不在の存在から、湊の心を救う「導き手」としての存在感へ。
- name: 梶 亮介
  role: 脇役
  age: 35
  gender: 男性
  appearance: 日焼けした肌と、仕事で使い込んだ無骨な手。寂れた町の風景に溶け込む漁師。
  personality: 無愛想でぶっきらぼう。過去の喪失から心を閉ざしている。一人称は「俺」。
  speech_style: 短く、投げやりな、方言混じりのぶっきらぼうな話し方。
  background: 数年前に大切な人を亡くし、町の変化や自身の喪失感に抗うように静かに暮らしている。
  motivation: 湊の旅を傍観しつつも、彼の生き様を通して、自身の止まった時間を動かすきっかけを得ること。
  relationships:
  - name: 湊 遥斗
    relation: 旅の途中で出会う町の人
  arc: 湊の「死を受け入れる強さ」に触れ、過去の悲しみを「大切な記憶」として抱えて生きていく決意をする。
