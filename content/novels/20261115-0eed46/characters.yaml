- name: 葛城 律
  role: 主人公
  age: 34
  gender: 男性
  appearance: 細身で理知的な顔立ち。常にモノクル（片眼鏡）を弄っており、鋭い眼光を持つ。
  personality: 極めて論理的で冷静沈着。感情的な揺らぎを嫌うが、真実に対しては執着に近い情熱を持つ。一人称は「私」。
  speech_style: 丁寧だがどこか突き放したような、冷淡で理屈っぽい敬語。
  background: 元数学教授。数理的な論理の破綻を嫌い、難解な事件を解くために探偵業を営んでいる。
  motivation: 現象の背後に潜む「非論理的なトリック」を、数学的な証明のように解明すること。
  relationships:
  - name: 伊吹 結衣
    relation: 助手兼、観察対象
  arc: 完璧な論理の限界と、事件に隠された人間的な悲劇に触れることで、冷徹な観察者から一人の人間としての感情を取り戻していく。
- name: 伊吹 結衣
  role: 相棒
  age: 24
  gender: 女性
  appearance: 快活な印象を与えるショートカット。大きな鞄を常に持ち歩き、メモ帳を片手に動き回る。
  personality: 直感的で共感力が高い。恐怖を感じやすいが、人々の感情の機微を察知する能力に長けている。一人称は「私」。
  speech_style: 明るくハキハキとしているが、緊張すると語尾が震える。
  background: 民俗学を専攻する大学生。葛城の助手として、現場の「空気感」や「伝承」の調査を担当している。
  motivation: 恐怖に打ち勝ち、事件の真相を知ることで、混乱に陥った人々を救いたいと願う。
  relationships:
  - name: 葛城 律
    relation: 師であり、信頼する相棒
  arc: 単なる恐怖に怯える傍観者から、葛城の論理を支えるための「人間的な証拠」を見出す観察者へと成長する。
- name: 九条 蓮司
  role: 敵役
  age: 45
  gender: 男性
  appearance: 高級な仕立てのスーツを完璧に着こなす、威厳のある紳士。瞳の奥に底知れない暗さを湛えている。
  personality: 支配的で計算高く、常に優位に立とうとする。余裕を崩さないが、追い詰められると攻撃的になる。一人称は「僕」。
  speech_style: 低く穏やかなトーン。相手を値踏みするような、慇懃無礼な話し方。
  background: 黄昏館の旧所有者の親族であり、莫大な遺産を相続する立場にある実業家。
  motivation: 自身の過去の罪や、遺産相続における不都合な真実を隠蔽し、完璧な状況を維持すること。
  relationships:
  - name: 葛城 律
    relation: 論理によって自身の欺瞞を暴こうとする天敵
  arc: 完璧に構築した虚飾の仮面が、葛城の論理によって一枚ずつ剥がされ、最終的に醜い本性を露呈させる。
- name: 霧島 零
  role: 脇役
  age: 28
  gender: 性別不詳
  appearance: 陶器のように白い肌と、感情の読み取れない無機質な瞳を持つ。性別を感じさせない中性的な容姿。
  personality: 極めて寡黙で、まるで機械のような反応を示す。他者との関わりを避ける傾向がある。一人称は「自分」。
  speech_style: 抑揚がほとんどなく、必要最小限の言葉しか発しない。
  background: 亡くなった天才科学者の弟子であったとされる人物。オートマトン（人形）の管理を任されていた。
  motivation: 遺された「人工知能」が持つ最後のデータと、それに付随する真実を守ること。
  relationships:
  - name: オートマトン
    relation: 守るべき、唯一の理解者
  arc: 真実を隠蔽し続けてきた静かな沈黙を破り、人形が遺した悲劇的なメッセージを伝える役割を担う。
