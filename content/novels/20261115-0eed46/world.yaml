title: 黄昏館のオートマトン
genre: 本格ミステリー
tone: 幻想味と古風な重厚さを帯びた本格推理
pov: 三人称
tense: 過去形
setting: 山深い孤島に建つ、左右対称の複雑怪奇な木造館「黄昏館」。祭りの夜。
premise: 遠隔の孤島にある黄昏館にて、不可解な密室殺人事件が発生した。被害者は外部から完全に遮断された一室で発見され、現場には「迷子の人工知能」を自称する奇妙な機械人形が遺されていた。館全体が祭りの喧騒と狂気に包まれる中、名探偵は怪奇現象の背後に隠された精緻な人間的トリックを暴いてゆく。
themes:
- 密室トリック
- 人工知能と人間性
- 幻惑と論理の対比
rules:
- 館の構造は完全に左右対称であり、見取り図に描かれた通りの物理法則に従う。
- 人工知能の言動は論理的かつ機械的なプログラムに基づき、超自然的な力は一切介在しない。
- 密室はいかなる隠し扉や物理的破綻もなく、純粋な物理的トリックによって構築されている。
plot_outline:
- '序盤: 祭りの夜、外界から閉ざされた黄昏館に招集された者たちが、複雑な見取り図を持つ館の構造と、迷子の人工知能と出会う。'
- '中盤: 閉ざされた部屋で密室殺人が発生。怪奇現象を思わせる状況証拠が次々と見つかり、人々は恐怖に駆られる。'
- '終盤: 名探偵が館の見取り図と物理的証拠を徹底的に検証し、怪奇現象のすべてに論理的な解決を与えていく。'
- '結末: 真犯人が暴かれ、人工知能が残した最後のデータが、事件の根底にあった悲劇的な動機を静かに浮かび上がらせる。'
style_notes: 密室と奇妙な館を舞台にした幻想味のある推理。三人称のやや古風で装飾的な語りを用い、館の見取り図を言葉で詳しく描き、怪奇現象に論理的な解決を与える。
