- name: アルヴァス・クロムウェル
  role: 主人公
  age: 32
  gender: 男性
  appearance: 鋭い眼光と無精髭、使い古された黒い騎士の外套を纏っている。左頬に古い傷跡がある。
  personality: 不器用で冷徹に見えるが、内面は極めて情熱的で義理堅い。一人称は「俺」。
  speech_style: 短く、ぶっきらぼう。言葉数は少ないが、一言一言に重みがある。
  background: かつてアステリア騎士団の団長として秩序を守っていたが、妹の記憶を奪われたことで地位を追われ、没落した。
  motivation: 妹の記憶を取り戻し、記憶を搾取して成り立つ都市のシステムそのものを破壊すること。
  relationships:
  - name: エレナ・ヴァレンティヌス
    relation: 思想の異なる宿命の対決相手
  - name: リア・クロムウェル
    relation: 守るべき対象であり、行動の原動力となる妹
  arc: 復讐のために剣を振るう「破壊者」から、痛みを伴う真実を受け入れ、人々が歩む未来を拓く「開拓者」へと変化する。
- name: エレナ・ヴァレンティヌス
  role: ヒロイン/対立者
  age: 20
  gender: 女性
  appearance: 透き通るような銀髪と、すべてを見透かすような神秘的な青い瞳。純白の聖衣を纏っている。
  personality: 慈愛に満ちているが、人類の存続という大義のためには個人の犠牲を厭わない冷徹な合理性を持つ。一人称は「私」。
  speech_style: 丁寧で穏やかだが、決して揺らぐことのない確信に満ちた口調。
  background: 「真実の鏡」の守護者である聖女。鏡に蓄積される膨大な記憶の重圧を一身に背負い続けてきた。
  motivation: 記憶の集積（方舟）を守り抜き、人類が絶滅の淵に立たされることを防ぐこと。
  relationships:
  - name: アルヴァス・クロムウェル
    relation: 世界の秩序を脅かす者であり、理解し合えない孤独な魂
  arc: 世界の理を守る「装置」としての役割から、個人の痛みと真実を愛する「人間」へと変化する。
- name: リア・クロムウェル
  role: 脇役/物語の動機
  age: 14
  gender: 女性
  appearance: 儚げで、光を失いかけた瞳を持つ少女。どこか浮世離れした透明感がある。
  personality: 穏やかで献身的。自分が「空殻」になりつつあることを自覚しており、兄を案じている。一人称は「私」。
  speech_style: 消え入りそうな、静かで優しい話し方。
  background: アルヴァスの妹。貴族による記憶搾取の犠牲となり、自我が失われつつある下層民の象徴。
  motivation: 兄にこれ以上悲しい思いをさせたくない、ただ「自分」のままでいたいという切なる願い。
  relationships:
  - name: アルヴァス・クロムウェル
    relation: 最愛の兄
  arc: 自我を失いゆく「空殻」の状態から、世界の変革を経て、痛みと共に生きる「人間」としての生を取り戻す。
- name: ヴァレリウス・ド・ラ・マリエ
  role: 敵役
  age: 45
  gender: 男性
  appearance: 贅を尽くした金糸の刺繍が施された貴族服。常に余裕を感じさせる不敵な笑みを浮かべている。
  personality: 傲慢かつ残忍。他者の記憶を単なるエネルギー資源としてしか見ておらず、徹底した選民思想を持つ。一人称は「私」。
  speech_style: 優雅で洗練されているが、相手を格下として扱う侮蔑が隠しきれていない。
  background: アステリア上層部を支配する有力貴族。他者の記憶を摂取することで、数百年もの間、若さと権力を維持してきた。
  motivation: 現在の階級社会を維持し、自らの永遠の若さと絶対的な権力を守り抜くこと。
  relationships:
  - name: アルヴァス・クロムウェル
    relation: かつての部下であり、秩序を乱す忌むべき反逆者
  arc: 絶対的な権力者としての地位を誇示していたが、システムの崩壊とともに、自らが搾取していたものの残酷な報いを受ける。
