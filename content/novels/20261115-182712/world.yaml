title: 氷華の戴冠、忘却の庭
genre: 異世界ファンタジー
tone: 格調高く、静謐ながらも情熱を秘めた悲劇的雰囲気
pov: 三人称（章ごとに視点人物を切り替える群像劇形式）
tense: 過去形
setting: 記憶を結晶化し、通貨や魔力として消費する浮遊都市「アステリア」。上層の貴族は他者の記憶を奪い永遠の若さと知恵を享受し、下層民は自己を喪失し「空殻」となって消えていく階級社会。
premise: 記憶を奪い合う残酷な調和の上に成り立つ都市で、かつて騎士団長であった男は、奪われた民の記憶を取り戻すため、世界の根幹たる「真実の鏡」の破壊を誓う。一方、鏡の守護者である聖女は、記憶の集積こそが人類を滅亡から救う唯一の方舟であると信じていた。正義と正義が衝突する夜、奪われた人生の断片が降り積もる中で、彼らは人間としての矜持を問われることになる。
themes:
- 記憶とアイデンティティ
- 個の尊厳と全体の幸福
rules:
- 記憶結晶：人間の経験や感情を抽出した物質。消費することで一時的な能力向上や知識の獲得が可能だが、提供者はその記憶を永久に失う。
- 空殻（うつから）：記憶を奪われすぎた人間が至る末路。自我を失い、本能のみで動く人形のような存在となる。
- 真実の鏡：都市の最深部に鎮座し、抽出された全ての記憶を管理・貯蔵する巨大な魔導装置。この鏡が停止すれば、記憶は所有者に還元されるが、同時に都市を浮遊させる動力も失われる。
plot_outline:
- 序盤：没落した騎士アルヴァスが、記憶を失い瀕死となった妹を救うため、禁忌とされる下層街のレジスタンスに身を投じる。同時に、聖域で鏡を管理する聖女エレナが、鏡の中に蓄積された数多の絶望と、それを維持する都市の歪みに気づき始める。
- 中盤：アルヴァスは鏡への道を切り拓くため、かつての戦友や敵対する貴族たちと激突する。各章で視点を切り替え、秩序を守ろうとする者、復讐に燃える者、愛に殉じる者の異なる「正義」が交錯し、物語は破滅的な加速を見せる。
- 終盤：千年に一度の「星降る祭りの夜」、鏡の封印が最も弱まる瞬間にアルヴァスは最深部へ到達する。そこでエレナと対峙し、記憶を返すことがもたらす「残酷な真実（過去の罪）」と、忘却による「偽りの平和」のどちらを選択すべきか、激しい論争と剣戟を繰り広げる。
- 結末：アルヴァスは鏡を砕く。都市はゆっくりと地上へ降下し、人々は失った記憶と共に、耐え難い悲しみと愛しさを取り戻す。特権を失い、混乱に陥った街の中で、彼らは初めて「人間」として互いの手を取り合い、新たな生を歩み始める。
style_notes: 語彙は古風で重厚なものを選択し、人物の内心描写には「矜持」「宿痾」「爛漫」などの硬質な表現を用いる。会話文は身分制度を反映させ、騎士は厳格な敬語を、貴族は傲慢ながらも洗練された言い回しを徹底させる。地の文は情景描写に時間をかけ、静謐な絶望感と高潔な精神性を対比させて描くこと。
