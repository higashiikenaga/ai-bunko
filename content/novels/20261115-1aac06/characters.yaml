- name: カイル・ヴォルグ
  role: 主人公
  age: 27
  gender: 男性
  appearance: 無造作な黒髪に鋭い眼光、全身に戦いでついた傷跡がある。錆びついた巨大な大剣を背負っている。
  personality: 寡黙で現実主義。生存を最優先するが、一度決めたことは曲げない義理堅さを持つ。一人称は「俺」。
  speech_style: ぶっきらぼうで短い言葉遣い。無駄なことは喋らない。
  background: 灰銀世界の荒野で星の欠片を狩り、食いつなぐ流れ者の傭兵。過去の戦いで多くの仲間を失っている。
  motivation: ルナを守り抜き、彼女が「道具」ではなく「人間」として生きられる場所を見つけること。
  relationships:
  - name: ルナ
    relation: 守るべき対象であり、唯一の心の拠り所
  arc: 孤独な生存主義者から、誰かのために己の全てを賭けることができる、自己犠牲を伴う強さを持つ男へと変化する。
- name: ルナ
  role: 相棒
  age: 14
  gender: 女性
  appearance: 透き通るような銀髪と、星図が刻まれた神秘的な青い瞳を持つ。小柄で儚げな印象を与える。
  personality: 純粋で好奇心旺盛。過酷な環境でも他者を信じようとする強さを持つ。一人称は「わたし」。
  speech_style: 丁寧だが、どこか幼さが残る。感情が動くと言葉が溢れる。
  background: 身体に世界を再構築する「星図」を刻まれた、生きた鍵となる少女。帝国の研究対象として扱われていた。
  motivation: カイルと共に歩むこと。そして、自分を「星の欠片」としてではなく、一人の人間として見てくれる世界を願うこと。
  relationships:
  - name: カイル・ヴォルグ
    relation: 命を預け、心を通わせるパートナー
  arc: 守られるだけの受動的な存在から、自らの運命を受け入れ、世界に奇跡（桜）を咲かせる能動的な存在へと変化する。
- name: ゼノス・ヴァレンティン
  role: 敵役
  age: 42
  gender: 男性
  appearance: 帝国の最高騎士団長。白銀の鎧に身を包み、威厳に満ちた冷徹な美貌を持つ。
  personality: 合理的かつ冷酷。秩序こそが世界の救済であると信じて疑わない。一人称は「私」。
  speech_style: 高圧的で、相手を値踏みするような理知的で静かな話し方。
  background: 帝国の秩序維持を絶対の使命とする騎士。星の欠片を利用した新世界の構築を目論む皇帝の忠実な執行官。
  motivation: 星図を回収し、皇帝の計画を完遂させることで、混沌とした灰銀世界に絶対的な秩序をもたらすこと。
  relationships:
  - name: 皇帝
    relation: 絶対的な主君
  - name: カイル・ヴォルグ
    relation: 秩序を乱す排除すべき不純物
  arc: 揺るぎない「秩序」の信奉者として登場するが、カイルたちの「不合理な絆」によって、自身の信念が揺らぎ、破滅へと向かう。
