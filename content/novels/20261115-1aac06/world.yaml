title: 星を屠る鋼
genre: 異世界ファンタジー
tone: 硬派・ストイック・速度感
pov: 一人称 (俺)
tense: 過去形
setting: 砕け散った星の欠片が資源となる、鉄と氷の荒野「灰銀世界」
premise: 星の欠片を狩る傭兵の俺は、身体に「星図」を刻まれた少女を拾う。彼女を狙う帝国の騎士団を、錆びた大剣一本で蹴散らす。これは、世界を書き換える力よりも、目の前の泥臭い絆を選んだ男の記録だ。
themes:
- 不器用な献身
- 運命への反逆
rules:
- 星鋼の武器はあらゆる物質を断つが、使用するたびに使い手の記憶を削り取る
- 星図を持つ者は、世界の法則を書き換える『原星』への座標を導き出せる
plot_outline:
- '序盤: 廃都での狩り中に、生きた星図である少女・ルナと出会い、彼女を奪還しに来た帝国の先遣隊を殲滅する。'
- '中盤: 記憶を失いながらもルナを守り、帝国の包囲網を突破して禁忌の聖域へと向かう。'
- '終盤: 世界を再構築しようとする皇帝と対峙。静寂の中、ルナが奇跡的に咲かせた幻の桜の下で、最後の一撃を放つ。'
- '結末: 原星を破壊してルナを普通の少女に戻し、俺は自分の名前さえ忘れたが、隣に笑う彼女のことだけは覚えている。'
style_notes: 短文を畳みかける。擬音を排除し、「斬る」「砕く」「穿つ」等の動詞で打撃感を出す。戦闘直前には必ず意識的な静寂の描写を挿入する。一人称「俺」による無骨な語り口を徹底する。
