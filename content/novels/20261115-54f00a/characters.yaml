- name: エリス・ルミナール
  role: 主人公
  age: 19
  gender: 女性
  appearance: 深い藍色の潜水服に、音を増幅させる特殊なヘッドギアを装着している。好奇心に満ちた琥珀色の瞳が特徴。
  personality: 楽観的で行動的。未知の音への探求心が強く、常識に囚われない自由な精神を持つ。一人称は「私」。
  speech_style: 快活で弾むような話し方。音楽的な比喩を多用する。
  background: 忘却の海で遺物を回収し生計を立てる潜水奏者。幼い頃に聞いた「失われた旋律」の断片を追い求め、深海へと潜り続けている。
  motivation: 世界の底に眠る「真実の旋律」を見つけ出し、世界に新たな響きを取り戻すこと。
  relationships:
  - name: アラリック
    relation: 対立しながらも互いの才能を認め合う共鳴者
  - name: カエル
    relation: 導き手であり、守るべき記憶を持つパートナー
  arc: 単なる好奇心による探索から、世界の運命を背負う覚悟を持つ「調律者」へと成長する。
- name: アラリック・ヴァン・クロムウェル
  role: 相棒/ライバル
  age: 32
  gender: 男性
  appearance: 純白の指揮官礼装に身を包み、銀色の長い髪を一つに束ねている。冷徹さを湛えた鋭い眼差し。
  personality: 完璧主義で規律を重んじる。秩序こそが平和を維持する唯一の手段だと信じているが、内面には激しい情熱を秘めている。一人称は「私」。
  speech_style: 理知的で断定的な口調。相手に隙を与えない威圧感がある。
  background: 旋律都市の最高指揮者。音楽による絶対的な統治を行い、不協和音（混沌）を排除することで都市の安定を守ってきた。
  motivation: 崩壊し始めた天空都市の秩序を再構築し、静寂の災厄から市民を救うこと。
  relationships:
  - name: エリス
    relation: 秩序を乱す不協和音だと思っていたが、次第に彼女の奔放な旋律に惹かれていく
  - name: カエル
    relation: かつての文明が犯した過ちの象徴として忌避しつつ、敬意を抱く
  arc: 完璧な秩序への執着を捨て、不完全な調和（不協和音の受容）こそが真の強さであることに気づく。
- name: カエル
  role: 相棒/導き手
  age: 不明（外見は25歳前後）
  gender: 男性
  appearance: ボロボロに裂けた黒い甲冑を纏い、音を吸収する「折れた剣」を携えている。半透明の身体に深い藍色の光が脈打っている。
  personality: 寡黙でストイック。深い喪失感を抱えているが、根は優しく献身的。一人称は「俺」。
  speech_style: 必要最低限の言葉しか話さない。静かで低い声音。
  background: 失われた文明の守護騎士であり、かつて世界を無音にしようとした災厄に敗れ、魂だけが剣に縛り付けられた亡霊。
  motivation: 自分の剣を再び奏でさせ、過去の過ちを清算して安らかな眠りにつくこと。
  relationships:
  - name: エリス
    relation: 自分の剣に息を吹き込んだ救い主であり、守るべき後継者
  - name: アラリック
    relation: かつての統治者たちと同じ傲慢さを抱える彼に、警鐘を鳴らす存在
  arc: 絶望的な静寂に囚われていた状態から、エリスとの合奏を通じて「生」への希望と再生の意味を取り戻す。
