title: 深藍の残響、欠けた刃の調べ
genre: 群像劇
tone: 抒情的でリズム感のある、幻想的な物語
pov: 三人称
tense: 過去形
setting: 音の響きが万物の理を司る世界。天空に浮かぶ「旋律都市」と、失われた文明の記憶が旋律となって堆積する「忘却の海」からなる二層構造の世界。
premise: 「音」が物理的な力を持ち、世界の秩序を保っている時代。海底遺跡に眠る古の旋律を探し求める潜水奏者、秩序を維持しようとする天空の指揮者、そして沈黙を纏う折れた剣を携えた戦士。異なる旋律を抱く三人が、世界を無音へと帰そうとする「静寂の災厄」を前に、運命的な合奏へと導かれていく。
themes:
- 調和と混沌
- 喪失からの再生
rules:
- 旋律の具現化：特定の音の周波数が物質の形態や性質を変化させる。
- 忘却の海：海底遺跡には過去の音が波となって蓄積されており、深く潜るほど音の密度が増し、現実の物理法則が歪む。
- 欠損の補完：折れた剣は、適切な旋律（音）を流し込むことによってのみ、実体を持った刃として機能する。
plot_outline:
- '序盤: 潜水奏者のエリスが、海底遺跡の深淵で奇妙な残響を放つ「折れた剣」を回収する。同時に、天空都市では音楽による統治が崩壊し始める。'
- '中盤: 剣の音色を追うエリス、秩序を求める指揮者、そして剣の持ち主である亡霊の戦士。三人の視点が交差。海底遺跡が、かつての文明が奏でた「巨大な楽譜」であることが判明する。'
- '終盤: 世界を無音へと塗りつぶす「虚無の不協和音」が襲来。エリスは剣に、失われた伝説の旋律を吹き込むことで、剣を「音の奔流」へと変え、災厄に立ち向かう。'
- '結末: 三人の奏でる合奏が世界を再構築する。世界は救われるが、音と物質の境界は曖昧になり、音楽がより直接的に世界を変える新たな時代が幕を開ける。'
style_notes: 文章そのものが楽曲のように流れるよう、短文と長文を交互に配置し、読者の呼吸をコントロールするリズムを刻むこと。感情の高まりに合わせて、言葉の拍動（テンポ）を加速させ、静寂を表現する際は空白を意識した緩やかな記述を行う。各話の重要な転換点には、その場の情景や心情を象徴する四行程度の歌詞を、インデントを下げて挿入すること。
