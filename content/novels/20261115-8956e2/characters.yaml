- name: 凪砂 累
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で顔色が悪く、どこか現実感のない虚ろな瞳を持つ。常に清潔だが、どこか枯れた印象を与える服装。
  personality: 内向的で執着心が強く、過去の記憶に対して強い不安を抱いている。一人称は「私」。
  speech_style: 自分に言い聞かせるような、小さく震える話し方。
  background: ある日突然、記憶の断片と共に窓のない部屋で目覚める。自分がなぜここにいるのか、何を忘れたのかを知るために屋敷を彷徨う。
  motivation: 屋敷からの脱出と、自分自身に関する失われた記憶の奪還。
  relationships:
  - name: 凪砂 朔
    relation: 自分が切り捨てた、忌むべき「もう一人の自分
  - name: 鏡 零
    relation: 導いてくれる存在であり、同時に不気味な監視者
  arc: 逃避的な探索者から、逃れられない真実を受け入れ、鏡の世界へと沈降していく存在へと変貌する。
- name: 鏡 零
  role: 導き手／謎の存在
  age: 不明（外見は20代後半）
  gender: 男性
  appearance: 左右対称の完璧な美貌を持つ。瞳の中に銀色の砂が混じっており、常に微かな微笑を浮かべている。
  personality: 慇懃無礼で、人間的な感情が欠落している。常に冷静沈着。一人称は「私」。
  speech_style: 丁寧な敬語を用いるが、言葉の端々に相手を突き放すような冷酷さが混じる。
  background: 屋敷の鏡の中に住まう、あるいは屋敷そのものの意志を代行する存在。地図を与え、累を深層へと誘う。
  motivation: 屋敷の秩序を維持し、迷い込んだ者が「鏡の住人」へと変質する過程を観察すること。
  relationships:
  - name: 凪砂 累
    relation: 観察対象および、次の役割を継承する候補
  arc: 物語を通じて変化せず、狂った世界のルールを体現し続ける。
- name: 凪砂 朔
  role: 敵役／真実の姿
  age: 24
  gender: 男性
  appearance: 累と瓜二つの容貌だが、瞳は濁った砂漠の色をしており、不敵で攻撃的な笑みを浮かべている。
  personality: 傲慢で残酷。累が隠蔽してきた罪悪感や衝動の象徴。一人称は「俺」。
  speech_style: 累の弱点を的確に突き、精神的に追い詰めるような、挑発的で荒々しい口調。
  background: 累が「自分自身」を殺した（あるいは忘却した）際に、砂漠へと捨て去られた負の側面。
  motivation: 累から「現実」という居場所を奪い取り、自身が本来の主として君臨すること。
  relationships:
  - name: 凪砂 累
    relation: 奪い合うべき同一存在であり、排除すべき偽物
  arc: 物語の終盤、オアシスの主として現れ、累のアイデンティティを崩壊させる。
- name: 灰原 律
  role: 脇役／犠牲者
  age: 30
  gender: 男性
  appearance: 全身が微かに白い砂を被ったような質感で、目元が砂で覆われている。実体があるのか不明瞭。
  personality: 絶望に沈み、思考が停止している。一人称は「僕」。
  speech_style: 意味をなさない呟きや、断片的な警告を繰り返す。
  background: かつて累と同じように屋敷に迷い込み、自分を見失った末に砂となってしまった先人。
  motivation: 誰かに自分の存在を気づいてほしいという、無意識の叫び。
  relationships:
  - name: 凪砂 累
    relation: これから辿るであろう末路を示す鏡像
  arc: 累に屋敷の恐怖を予感させる、舞台装置としての役割を果たす。
