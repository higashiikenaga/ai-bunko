title: 逆さまの秒針が刻む、砂の柩
genre: ホラー
tone: 幻想的で不条理な、美しき悪夢
pov: 一人称
tense: 現在形と過去形が混濁する形式
setting: 無限に増殖する屋敷と、その深層に広がる白い砂漠
premise: 鏡の中にだけ存在する『秘密の地図』に従い、私は出口のない屋敷を彷徨う。扉を開けるたびに風景はねじれ、やがて辿り着いたのは、記憶の残滓が砂となって降り積もる絶望の砂漠だった。そこで見つけた唯一のオアシスは、私を甘く誘い、同時に残酷な真実を突きつける。
themes:
- 自己喪失
- 永劫回帰
rules:
- 鏡を通り抜けると、『内側』と『外側』の定義が反転する
- 時計の針が逆回転し始めたとき、空間の接続（扉の行き先）が不規則に書き換わる
- 砂漠の砂の一粒一粒は、誰かが忘却した記憶の破片である
plot_outline:
- '序盤: 目覚めると、窓のない部屋にいた。壁の鏡の中に描かれた『秘密の地図』に導かれ、私は未知の扉を開け続ける。'
- '中盤: 扉の先に広がるのは、重力を失った廊下や、時間が止まった部屋。鏡に映る自分の顔が少しずつ他人へと変わっていくことに気づく。'
- '終盤: 屋敷の最果てで、白銀の砂漠へと辿り着く。そこにあるオアシスで、私はかつて自分が殺した（あるいは忘れ去った）『自分自身』と再会する。'
- '結末: 逆さまの秒針が正午を指したとき、私は鏡の中へと完全に吸い込まれる。現実に戻ったと思った瞬間、目の前には再び、あの窓のない部屋の扉があった。'
style_notes: 迷宮 アリス特有の、夢と現実が融解する文体。論理的な飛躍を美しく描き、鏡・時計・扉のモチーフを執拗に反復させる。語り手の正気が緩やかに崩壊していく過程を、倒置法や矛盾した比喩を用いて表現すること。
