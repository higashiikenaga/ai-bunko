- name: エルン・ヴィレム
  role: 主人公
  age: 24
  gender: 男性
  appearance: 少し癖のある茶髪に、旅慣れた手つきで古い万年筆を扱う。いつも使い込まれた革の旅鞄と、厚手のコートを身に纏っている。
  personality: 穏やかで観察眼が鋭い。物事の美しさを見つけるのが得意。一人称は「僕」。
  speech_style: 丁寧で落ち着いた口調。相手の話を最後までじっくり聞く。
  background: かつては都市の図書館で司書として働いていたが、世界の広さを知るために旅に出た。現在は「世界の美味しいものと習慣」を記録する旅人。
  motivation: 特別な目的はないが、目の前の景色と味を記録し、自分なりの世界を形にすること。
  relationships:
  - name: リネット
    relation: 旅の同行者であり、食事の相談相手
  - name: 車掌のマクシミリアン
    relation: 列車の安全を守る信頼できる知人
  arc: ただ景色を眺めるだけの傍観者から、人々の想いや「約束」の重みを受け止め、自らも誰かの物語の一部になることを受け入れる。
- name: リネット・フローラ
  role: 相棒
  age: 21
  gender: 女性
  appearance: 明るい金色の髪をサイドポニーに結っている。スパイスの香りがするエプロンを常に着用している。
  personality: 好奇心旺盛で快活。食べることと作ることをこよなく愛する。一人称は「私」。
  speech_style: 語尾が明るく、感情が豊か。美味しいものを見つけるとつい声が大きくなる。
  background: 各地のスパイスや食材を求めて旅をする調香師兼料理人。エルンの旅に「味」という彩りを添えるために同行している。
  motivation: 世界中の未知の食材を見つけ、それを最高の形で誰かに食べてもらうこと。
  relationships:
  - name: エルン・ヴィレム
    relation: 旅の記録を味覚で支えるパートナー
  arc: 自分自身の料理が誰かの記憶に残る喜びを知り、旅の記録を単なる「味」から「思い出」へと昇華させるきっかけを作る。
- name: マクシミリアン・クロムウェル
  role: 脇役
  age: 58
  gender: 男性
  appearance: 整えられた白い髭と、真鍮のボタンが並ぶ誇り高い制服。常に懐中時計を手にしている。
  personality: 規律を重んじるが、実は非常に情に厚い。一人称は「私」。
  speech_style: 威厳のある、しかし温かみを感じさせる老紳士の話し方。
  background: 大陸を走る蒸気列車のベテラン車掌。列車の運行だけでなく、乗客たちの小さな悩みを聞く「聞き役」としても知られている。
  motivation: 列車を安全に目的地へ届け、乗客たちがそれぞれの「約束」を果たせるよう見守ること。
  relationships:
  - name: エルン・ヴィレム
    relation: 旅の安全を見守る保護者的存在
  arc: 「約束の丘」へ向かう特別な列車の運行を通じて、自身がかつて交わした古い約束の断片を思い出し、旅人たちに希望を託す。
