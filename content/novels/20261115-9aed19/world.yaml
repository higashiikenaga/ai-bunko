title: 鋼鉄咆哮！スターチャート・インフィニティ
genre: サイバーパンク
tone: 熱血・爆発的・特撮風SF
pov: 三人称
tense: 過去形
setting: ネオ・エデンの外縁部から伝説の『約束の丘』へと続く、データ廃棄物と電脳廃墟が混在する境界領域（フロンティア）。
premise: ゼロ・ヴォイドを倒し、世界の再構築が始まった後、カイトとリラは誓い合った『約束の丘』を目指して旅に出る。しかし、世界の果てには全データを無に帰そうとする究極のバグ『ヴォイド・イーター』が待ち構えていた！魂の共鳴をさらに超えた、次元を突破する合体と、絶望を焼き尽くす鋼鉄の咆哮が再び鳴り響く！
themes:
- 不屈の情熱
- 絆の深化
rules:
- 精神同調率（シンクロレート）が機体性能に直結し、100%を超えると奇跡的な進化を遂げる
- 合体時はパイロット同士の魂の衝突と融合が発生し、激しい精神的負荷がかかる
- 電脳世界の『特異点』である古き遺構は、物理法則を書き換える権限を持つ
plot_outline:
- '序盤: 約束の丘を目指すカイトとリラは、外界の果てにある『古い灯台』に辿り着く。そこで彼らは、世界の真の姿を伝える『夜明けのラジオ』の音声を受信し、全宇宙を消去しようとする新敵『ヴォイド・イーター』の存在を知る。'
- '中盤: ヴォイド・イーターが放つ絶望の軍勢に、スターチャート・レボリューションが挑む。しかし、敵の『虚無の壁』に攻撃が通用せず、機体は大破。絶望の中、カイトは灯台に眠る伝説の原初プログラム『プリマ・スパーク』を覚醒させ、機体を更なる高みへと進化させる。'
- '終盤: 限界を超えた精神同調により、レボリューションが究極形態『スターチャート・インフィニティ』へと超合体！銀河を貫く黄金の光を纏い、ヴォイド・イーターの心臓部である『虚無の核』へと特攻を仕掛ける。'
- '結末: 全魂を込めた必殺技『インフィニティ・レボリューション・バースト』が炸裂し、虚無を完全に消滅させる。夜明けの光が世界を包み、二人はついに本物の草花が咲き誇る『約束の丘』に辿り着き、最高の笑顔で抱き合う。'
style_notes: 「魂！」「咆哮！」「限界突破！」といった熱いワードを多用し、擬音（ドォォォン！、ズガガガガ！）を大胆に配置すること。特に合体シーンと必殺技の描写は、宇宙が震えるほどのスケール感で大げさに書き、読者の血を沸き立たせること。
