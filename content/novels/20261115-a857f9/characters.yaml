- name: ルナ
  role: 主人公
  age: 17
  gender: 女性
  appearance: 赤錆色のボロボロなオーバーコートを羽織り、顔に煤と油汚れがついている。首元に使い古された防塵ゴーグルを下げている。
  personality: 現実主義で皮肉屋だが、内面には強い好奇心と孤独を抱えている。一人称は「あたし」。
  speech_style: ぶっきらぼうで口が悪い。生存本能に基づいた直感的な話し方をする。
  background: アイアン・ヘイヴンの最底辺でガラクタを拾って暮らす孤児。親の記憶はなく、日々の食事と防錆剤の確保だけを生きがいにしていた。
  motivation: 鏡に映る「青い空」への憧れと、手紙の主が誰なのかという謎を解き明かすこと。
  relationships:
  - name: カイト
    relation: 共闘関係にある相棒
  - name: アルバス
    relation: 排除されるべき不純物として追われる敵
  arc: 偽りの楽園への逃避を望んでいたが、泥臭い現実とそこに在る絆の価値に気づき、自分の足で歩くことを決意する。
- name: カイト
  role: 相棒
  age: 23
  gender: 男性
  appearance: 痩身で神経質そうな顔つき。右腕が錆びついた機械義手になっており、頻繁にオイルを差して調整している。
  personality: 慎重で理屈っぽいが、情に厚い。ルナの突拍子もない行動に振り回されつつも、彼女を放っておけない。一人称は「俺」。
  speech_style: 丁寧だが、呆れたときには皮肉が混じる。専門用語を多用する傾向がある。
  background: 元『純白の評議会』の下級技術員。評議会の非道な人体実験に耐えかねて脱走し、スラムに潜伏していた。
  motivation: ルナを危険から守ることと、かつて自分が関わった技術的な過ちを正すこと。
  relationships:
  - name: ルナ
    relation: 信頼し合っているパートナー
  - name: アルバス
    relation: かつての主であり、憎悪の対象
  arc: 過去の罪悪感に縛られていたが、ルナと共に生きることで、壊れた世界でも前を向く勇気を得る。
- name: アルバス
  role: 敵役
  age: 48
  gender: 男性
  appearance: 汚れひとつない純白の軍服に身を包み、顔の上半分を白い磁器の仮面で覆っている。常に白い手袋を着用している。
  personality: 極度の潔癖症。不純物や錆びついたものを「世界の汚れ」として激しく嫌悪する冷酷な完璧主義者。一人称は「私」。
  speech_style: 穏やかで優雅だが、言葉の端々に相手を見下す傲慢さが滲み出ている。
  background: 街を統治する『純白の評議会』の最高指導者。世界をリセットし、選ばれた「純粋な人間」だけの楽園を再構築することを目論んでいる。
  motivation: 鏡（起動装置）を回収し、錆びついた現実を完全に消去して理想郷を再現すること。
  relationships:
  - name: ルナ
    relation: 排除すべき不浄なゴミ
  - name: カイト
    relation: 使い捨ての道具だった裏切り者
  arc: 完璧な世界こそが正義だと信じていたが、最後にはルナが選んだ「不完全な現実」の強さに敗北し、絶望する。
- name: ミラ
  role: 脇役
  age: 32
  gender: 女性
  appearance: 錆びた金属片を宝石のように体に飾り付け、派手な原色のペイントを全身に施したエキセントリックな外見。
  personality: 享楽的で気分屋。絶望的な状況を面白がる傾向があるが、生存術に長けている。一人称は「私」。
  speech_style: 歌うような独特のリズムで話し、相手をからかうような口調。
  background: 街のあらゆる噂に通じている情報屋。かつては評議会の記録保管庫に潜り込んでいた潜入のスペシャリスト。
  motivation: 退屈な日常を壊してくれる「面白い出来事」を追い求めること。
  relationships:
  - name: ルナ
    relation: お気に入りの遊び相手/妹分
  - name: カイト
    relation: 堅物すぎてつまらない男
  arc: 傍観者として物語を眺めていたが、ルナの覚悟に触れ、初めて誰かのためにリスクを冒して行動する。
