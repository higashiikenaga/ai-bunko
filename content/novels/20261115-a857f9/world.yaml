title: ガラクタの聖域と、嘘つきな鏡
genre: ディストピア
tone: 乾いた皮肉と寂寥感、ポストアポカリプス
pov: 一人称（あたし）
tense: 現在形
setting: 全てが酸化し、赤錆の霧に覆われた廃都「アイアン・ヘイヴン」
premise: 錆びた街でガラクタを拾って食いつなぐあたしは、ある日「過去の景色を映す鏡」と「宛先不明の手紙」を拾う。鏡に映る青い空に期待したところで、現実は腹が減るし弾薬は少ない。それでも、鏡の中の「約束の地」を求めるあたしの前に、街を支配する潔癖な権力者が牙を剥く。
themes:
- 喪失と再生
- 不完全な美しさ
rules:
- 錆の霧：金属を急速に腐食させる大気。専用の『防錆剤』を塗布しなければ、あらゆる機械は数日で崩壊する
- 鏡の特性：特定の手紙の内容に反応し、かつての世界の断片を映像として投影する機能を持つ
plot_outline:
- 序盤：廃墟の地下室で、防錆剤の残量に絶望しながら、不思議な鏡と古い手紙を発見する。
- 中盤：手紙の記述を頼りに鏡の『同期地点』を巡るが、その行動が街を統治し、不純物を排除しようとする『純白の評議会』に目をつけられ、追われる身となる。
- 終盤：鏡が指し示した場所が、実は世界をリセットするための起動装置であると判明。鏡の中の偽りの楽園を再現するか、錆びついた現実で泥を啜り続けるか、究極の選択を迫られる。
- 結末：あたしは鏡を叩き割り、目の前の泥臭い仲間たちと生きることを選ぶ。手元に残ったのは、割れたガラス片と、幸運にも見つけた賞味期限切れの缶詰だけ。
style_notes: 一人称「あたし」による毒のある独白体。バッテリー残量や弾薬数、防錆剤のミリリットル数など、生存に直結するリソースを執拗に描写する。廃墟に咲く雑草や錆びた鉄の匂いなど、退廃的な情景を乾いたユーモアと共に描くこと。
