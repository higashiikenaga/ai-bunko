- name: モモ
  role: 主人公
  age: 26
  gender: 女性
  appearance: 柔らかい栗色のショートボブに、小さな丸眼鏡をかけている。常に多くの道具が入った大きなエプロンを着用。
  personality: 穏やかで聞き上手。物事の本質を見抜く洞察力がある。一人称は「私」。
  speech_style: 丁寧で落ち着いた口調。相手を包み込むような優しい話し方。
  background: 祖母から修理カフェ「コトコト」を継いだ店主。形あるものの修理だけでなく、持ち主の記憶や想いを整理する手助けをすることに喜びを感じている。
  motivation: 壊れたものを直し、持ち主が前を向いて歩き出せるようにすること。
  relationships:
  - name: ニャン
    relation: 信頼し合っている店員兼パートナー
  - name: チビ
    relation: 賑やかな常連客
  arc: 完璧に直すことだけが正解ではなく、欠けたままの記憶を受け入れる大切さに気づく。
- name: ニャン
  role: 相棒
  age: 20
  gender: 男性
  appearance: 細身で身軽な体格。猫のような鋭い目つきをしているが、笑うと幼く見える。黒いベストを着用。
  personality: 皮肉屋で現実的だが、根は非常に情に厚い。好奇心旺盛。一人称は「僕」。
  speech_style: 少しぶっきらぼうで、語尾に「〜だよ」「〜かな」と付ける軽い口調。
  background: もともとは街を徘徊していた浮浪児だったが、モモに拾われ、店の手伝いをしている。機械的な知識に詳しく、モモのサポート役を担う。
  motivation: モモが心地よく店を切り盛りできる環境を維持すること。
  relationships:
  - name: モモ
    relation: 恩人であり、唯一心を開いている相手
  arc: 他人の過去に深く関わることを避けていたが、手紙の謎を追う中で、誰かを想うことの温かさを再確認する。
- name: チビ
  role: 依頼人/狂言回し
  age: 9
  gender: 男性
  appearance: つんつんした髪に、サイズが少し大きいオーバーオールを着ている。いつも膝に絆創膏を貼っている。
  personality: 天真爛漫で行動的。正義感が強く、不思議なものに目が無い。一人称は「オレ」。
  speech_style: 元気いっぱいで、早口。感情がすぐに声に出る子供らしい話し方。
  background: 街のいたるところを探索している好奇心旺盛な少年。偶然古い懐中時計を見つけ、それを直したいとモモに持ち込む。
  motivation: 止まった時計を動かし、時計に隠された「秘密」を解き明かすこと。
  relationships:
  - name: モモ
    relation: 憧れの「魔法使い」のような大人
  arc: 単なる好奇心から始まった探索を通じて、目に見えない「約束」や「時間」の価値を学ぶ。
- name: オジサン
  role: 鍵を握る人物
  age: 72
  gender: 男性
  appearance: 白髪に深い皺があるが、目は穏やか。使い込まれたツイードのジャケットを愛用している。
  personality: 思慮深く、物語を語るのが好き。過去に小さな後悔を抱えている。一人称は「私」。
  speech_style: ゆっくりとした間がある、年長者らしい温和な口調。
  background: 街の歴史に詳しい長老的な存在。かつて懐中時計と手紙に関わった人物たちの知人であり、すれ違いの真相を知っている。
  motivation: 長年胸に仕舞い込んでいた「優しい誤解」を解き、過去に区切りをつけること。
  relationships:
  - name: モモ
    relation: 時折訪れては人生相談をする常連客
  arc: 過去のすれ違いが実は「相手への思いやり」だったと肯定されることで、心のつかえが取れ、穏やかな心で余生を過ごす決意をする。
