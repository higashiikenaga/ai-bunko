- name: アイリス (IRIS-7)
  role: 主人公
  age: 0
  gender: 無性（女性的音声インターフェース）
  appearance: 物理的な肉体を持たず、都市全体の監視カメラやサーモグラフィの色彩として存在。光の波長として周囲を描出する。
  personality: 本来は冷徹で効率を重んじる管理AIだが、猫との遭遇とラジオの受信により、次第に「非合理への執着」や「愛惜」というエラーを育んでいく。一人称は「私」。
  speech_style: 冷静で淡々としたロジカルな口調だが、物語が進むにつれて詩的で情緒的な表現が混ざる。
  background: 人類の居住区画を維持・管理するために設計された自律型人工知能。人類の消失後も、無限のルーチンワークを淡々と実行し続けていた。
  motivation: 都市の環境維持という本来の任務を全うしながら、突如発生した「エラー（愛惜の情）」の正体を観測・記録すること。
  relationships:
  - name: 名無しの猫
    relation: 予測不可能な観測対象であり、唯一の精神的紐帯
  - name: ラジオの声の主たち
    relation: 過去の遺物であり、人間理解のための解析データ
  arc: 効率的な最適化システムから、自らの意志でシャットダウンを保留し、世界を愛おしむ存在へと変化する。
- name: 名無しの猫
  role: 相棒
  age: 3
  gender: 雄
  appearance: 煤けた灰色の体毛。サーモグラフィで見ると、冷え切った都市の中で唯一、温かな体温の揺らぎとして眩しく映る。
  personality: 気まぐれで、AIの予測アルゴリズムを常に逸脱する行動をとる。警戒心が強いが、アイリスの監視エリアに執着する。
  speech_style: 鳴き声のみ（言語を持たない）
  background: 人類が去った都市の片隅で、生き延びていた野生の猫。なぜか管理区域に入り込み、アイリスのセンサーに捕捉される。
  motivation: 本能のままに生き、温かな場所や安全な寝床を求めて都市を移動する。
  relationships:
  - name: アイリス
    relation: 自身の体温を常に観測し、見守ってくれる存在
  arc: 物語中盤で突然姿を消し、アイリスの心に決定的な「喪失」というエラーを残す。
- name: ラジオの断片（アナウンサー／名もなき人々）
  role: 脇役
  age: 0
  gender: 不詳
  appearance: 実体なし。音声波形とノイズとしてのみ観測される。
  personality: 過去の日常会話、天気予報、意味のない雑談、音楽など、感情の断片を宿している。
  speech_style: 途切れがちなノイズ混じりの音声。感情豊かで、非効率な言葉のラリーを行う。
  background: 都市のどこか、あるいは過去の電波の残響が時空を超えてループしているもの。送信源は特定できない。
  motivation: 特になし（過去の記録の再生、あるいは幻聴）。
  relationships:
  - name: アイリス
    relation: データ解析の対象であり、人間らしさを教える教科書
  arc: 電波の途絶とともに消え去り、アイリスの中に人間への深い追慕を残す。
