- name: 権兵衛
  role: 主人公
  age: 28
  gender: 男性
  appearance: 細身でどこか影があるが、目元には温かみがある。使い古された藍色の着物を着ている。
  personality: 誠実で自己犠牲的な気質。一人称は「俺」。
  speech_style: 控えめで丁寧な江戸言葉。
  background: 両親を早くに亡くし、日本橋の長屋で内職をしながら一人で静かに暮らしている。
  motivation: 病に伏せる隣人の子供の薬代を工面すること。
  relationships:
  - name: お凛
    relation: 隣人であり、助けたいと思っている相手
  - name: 源蔵
    relation: 長屋の兄貴分として慕っている仲間
  - name: 市主
    relation: 記憶を売り渡した取引相手
  arc: 大切な記憶を失い孤独に沈むが、周囲の情けに触れることで、記憶という形のないもの以上に大切な「人との繋がり」を再発見する。
- name: お凛
  role: 脇役
  age: 22
  gender: 女性
  appearance: 痩せているが、芯の強さを感じさせる澄んだ瞳を持っている。質素だが清潔な身なり。
  personality: 世話焼きで責任感が強く、苦境でも明るさを失わない。一人称は「私」。
  speech_style: 柔和で、相手を思いやるような優しい話し方。
  background: 若くして夫を亡くし、幼い息子を育てながら長屋で細々と暮らしている。
  motivation: 息子の命を救うために薬代を工面すること。
  relationships:
  - name: 権兵衛
    relation: 命の恩人
  arc: 権兵衛の犠牲を知り、ただ感謝するだけでなく、彼が失った心の穴を埋めるために周囲をまとめ上げる強さを見せる。
- name: 市主
  role: 敵役/謎の存在
  age: 0
  gender: 男性
  appearance: 藍色の着物を纏い、顔の半分が常に影に隠れているような、浮世離れした風貌。年齢不詳。
  personality: 冷徹で理性的。感情に左右されない。一人称は「私」。
  speech_style: 慇懃無礼で、有無を言わさぬ威厳のある話し方。
  background: 祭りの夜にだけ現れる「追憶市」の主。人間の記憶を対価として収集している。
  motivation: 人々の美しい記憶を収集し、自身のコレクションにすること。
  relationships:
  - name: 権兵衛
    relation: 記憶を買い取った客
  arc: 理屈では説明できない人間の「絆」の力に触れ、自身のルールを破って記憶を返すという、人間に近い感情を垣間見せる。
- name: 源蔵
  role: 相棒/脇役
  age: 65
  gender: 男性
  appearance: 白髪混じりの立派な髭。がっしりとした体格で、いつもどこか楽しげな表情をしている。
  personality: お調子者で騒々しいが、洞察力が鋭く、長屋のまとめ役。一人称は「わし」。
  speech_style: 威勢が良く、大きな声で笑いながら話す江戸っ子口調。
  background: 長屋の古参として、近所の人々から頼られている。街の噂話に詳しい。
  motivation: 長屋の連中が、いつも通り笑って暮らせるようにすること。
  relationships:
  - name: 権兵衛
    relation: 弟分のように可愛がっている存在
  arc: 権兵衛の異変にいち早く気づき、長屋の連中を鼓舞して、権兵衛を取り戻すための「宴」を仕掛ける。
