title: 江戸追憶の宵市
genre: 歴史・時代小説
tone: 賑やかで人情味溢れる、軽妙な江戸情緒
pov: 三人称
tense: 過去形
setting: 江戸時代中期・日本橋の長屋とその界隈
premise: 祭りの夜にだけひっそりと現れる、記憶を買い取る不思議な露店「追憶市」。貧しいが心豊かな長屋の男・権兵衛は、病に伏せる隣人のために、亡き母との大切な思い出を売ってしまう。失った記憶の穴を埋めたのは、長屋の連中がもたらす騒々しくも温かい情けだった。
themes:
- 記憶の価値
- 隣人愛
- 喪失と再生
rules:
- 記憶の売買は祭りの夜の『追憶市』でしか行えない
- 売った記憶は完全に忘却し、買い戻すには金銭ではなく『誰かを想う強い心』が必要となる
- 記憶は小さな硝子玉として取引される
plot_outline:
- '序盤: 秋の夜長、日本橋の長屋で秋刀魚を焼きながら、権兵衛たちが賑やかに言い合う日常と、祭りの準備に沸く街の様子が描かれる。'
- '中盤: 祭りの夜、権兵衛は偶然「追憶市」に辿り着く。隣人の子供の薬代に窮した彼は、唯一の心の拠り所であった母との記憶を売り、金を手に入れる。'
- '終盤: 金で救われた子供と喜ぶ長屋の人々。しかし権兵衛は、心にぽっかりと空いた穴に耐えられず、自分が何を失ったのかさえ分からぬまま深い孤独に陥る。'
- '結末: 祭りの最後、長屋の連中が権兵衛を囲んで宴を開き、彼が忘れた母の面影を、周囲が語りかけることで思い出させる。その強い絆が「追憶市」の主を動かし、記憶が返ってくる。最後は栗ご飯を囲んで笑い合う人情話で締める。'
style_notes: 江戸っ子のべらんめえ口調を多用し、会話劇を中心にテンポ良く展開させる。秋の味覚（秋刀魚、栗ご飯）や祭りの喧騒を五感に訴える描写で書き込み、最後は鼻をすするような人間味のある結末にすること。
