- name: 神崎 蓮 (かんざき れん)
  role: 主人公
  age: 18
  gender: 男性
  appearance: 痩身ながら鋼のように引き締まった前腕と指先を持つ。常に不安げに揺れる瞳をしているが、登攀中のみ鋭い集中力を見せる。
  personality: 内向的で繊細。かつての自信を喪失し、トラウマに苛まれている。一人称は「僕」。
  speech_style: 控えめで自信なげな口調。感情が高ぶると言葉数が少なくなる。
  background: 幼少期から「神童」と称されたクライマーだったが、未踏峰への挑戦中に装備が損壊する事故に遭い、相棒を失い自分も岩壁への恐怖症を抱えるようになった。
  motivation: 亡き師が遺した「秘密の地図」にある壁を登り切り、失った自信と自分自身の証明を取り戻すこと。
  relationships:
  - name: ジュリアン・ソーン
    relation: 技術面で対極に位置する宿敵
  - name: 佐倉 舞
    relation: 精神的な支えとなるナビゲーター
  - name: 久我 剛
    relation: 精神的支柱であり、超えるべき壁である師匠
  arc: 恐怖に支配された「折れた心」の状態から、敗北を経て、合理性を超えた「登攀への狂気」を取り戻し、真の自由を獲得する。
- name: ジュリアン・ソーン
  role: 敵役
  age: 20
  gender: 男性
  appearance: 彫刻のように整った容姿。最新のバイオメトリクス・スーツを完璧に着こなし、無駄のない動作を行う。
  personality: 完璧主義者で傲慢。クライミングを「物理演算と最適解の導出」と考えている。一人称は「私」。
  speech_style: 論理的で冷徹。相手の弱点を的確に突く皮肉屋な話し方。
  background: 世界ランキング1位。最新鋭の装備と科学的なトレーニングにより、誰にも寄せ付けない圧倒的な記録を塗り替え続けている。
  motivation: 完璧な登攀による世界制覇。しかし、内心では自分の計算を破壊してくれる「本物の怪物」を待ち望んでいる。
  relationships:
  - name: 神崎 蓮
    relation: 計算外の挙動を見せる不気味なライバル
  arc: 蓮の持つ「泥臭い執念」と「狂気」に触れ、効率や記録だけでは到達できない「垂直の世界」の真理に気づかされる。
- name: 佐倉 舞 (さくら まい)
  role: 相棒
  age: 17
  gender: 女性
  appearance: 快活な短髪に、オーバーサイズのアウトドアウェア。常にホログラムディスプレイの端末を携帯している。
  personality: 天真爛漫で行動的。データ分析に長けており、戦略的なサポートを得意とする。一人称は「あたし」。
  speech_style: ハキハキとした口調。専門用語を混ぜながらも、蓮を鼓舞する明るい話し方。
  background: 次世代のギア開発者の娘。蓮の全盛期の登攀映像に心酔しており、彼を再び岩壁に戻すために強引に接触した。
  motivation: 蓮と共に、誰も見たことがない「伝説の垂直壁」の頂上の景色をデータとして記録し、世界に公開すること。
  relationships:
  - name: 神崎 蓮
    relation: 才能を信じて疑わない最高のパートナー
  arc: 単なるデータ主義のサポーターから、蓮の命懸けの挑戦に共鳴し、リスクを共有して共に歩む真の相棒へと成長する。
- name: 久我 剛 (くが ごう)
  role: 脇役（故人）
  age: 55
  gender: 男性
  appearance: 深く刻まれた皺と、岩のように硬い手のひら。日に焼けた肌に白い歯が印象的な豪快な風貌。
  personality: ストイックかつ情熱的。道具に頼らず、岩との対話を重視する古風なクライマー。
  background: かつて世界を震撼させた伝説の登山家。蓮に基礎を叩き込んだ師であり、未踏の壁を追い求めた末に山中で没した。
  motivation: 次世代に「記録ではない、魂を震わせる登攀」を継承させること。
  relationships:
  - name: 神崎 蓮
    relation: 唯一無二の弟子
  arc: 回想や遺した日記・地図を通じて、蓮が絶望から脱却するための道標として機能する。
