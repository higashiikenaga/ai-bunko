title: 垂直の咆哮 ―破砕の壁と秘匿の航路―
genre: スポーツ青春
tone: 熱狂的、泥臭い、心拍数を跳ね上げるライブ感
pov: 三人称（クライミングの核心部では現在形へ移行）
tense: 叙述は過去形、勝負の瞬間は現在形
setting: 近未来の極限クライミング・ワールドツアー、および未踏の峻険な岩壁
premise: かつて「神童」と呼ばれた少年は、事故で愛用のクライミングツールを「折れた剣」のごとく失い、岩壁を恐れるようになっていた。しかし、亡き師が遺した「秘密の地図」が、公式記録にない未踏の垂直壁の存在を示唆する。酸素が薄く、筋肉が悲鳴を上げる極限の登攀の中で、彼は再び指先に力を込める。
themes:
- 限界の突破
- 喪失からの再生
- 意志の継承
rules:
- 競技はルートの難易度と登攀速度を競う
- 一度の墜落が致命傷となる極限環境
- 未踏ルートの制覇は公式な伝説として刻まれる
plot_outline:
- '序盤: 挫折した主人公が、師の遺品である地図と折れた道具を見つけ、再び岩壁に向き合い始める。'
- '中盤: 世界大会での激突。完璧な技術を持つ宿敵に敗北を喫する。ここで宿敵の視点を通じ、敗北の重みと、主人公が放つ「狂気」を克明に描く。'
- '終盤: 地図が指し示す未踏の壁へ。装備の破損、酸素欠乏。肉体が限界を迎える中、現在形の文体で猛烈な登攀を描写する。'
- '結末: 頂上での孤独な咆哮。彼は「折れた剣」を握り直し、自らの足跡で新たな地図を刻む。'
style_notes: 汗の滴る音、指先の摩擦、肺が焼けるような熱さを執拗に描写する。勝負の描写では「――跳ぶ！ 掴む！ 筋肉が爆ぜる！」といった現在形の短文を多用し、実況さながらのスピード感を演出すること。敗者視点では、静謐な絶望と、勝者の背中を追う慟哭を重厚に描くこと。
