title: 銀鏡の残響と、崩落する月食
genre: 異世界ファンタジー
tone: 幻想的で不条理、退廃的な美しさを伴う独白体
pov: 一人称
tense: 現在形と過去形が混濁した叙述
setting: 前作で時を動かした後、緩やかに風化し続ける「残響の世界」。記憶が通貨として流通し、物理的な形を失った街並みが鏡のように重なり合う空間。
premise: 世界の心臓となった私は、絶え間ない鼓動で万物を風化させ、記憶を消費し続けている。ある日、記憶を売る市場に、私自身の「人間だった頃の欠片」が商品として並んでいるのを見つける。私は自分という矛盾を回収するため、鏡の扉を潜り、すべてを無に帰す月食の夜へと向かう。もはや私が誰であるかさえ、時計の針が逆さまに回るたびに書き換えられていく。
themes:
- 自己喪失と再構築
- 記憶の等価交換
- 滅びの美学
rules:
- 記憶は物理的な結晶となり、市場で取引される。記憶を失った者は透明な影となり、世界の風景に溶け込む。
- 鏡は単なる反射板ではなく、別の時間軸にある『可能性の自分』と対話するための扉である。
- 月食の間だけ、世界の心臓（主人公）の鼓動が停止し、風化が止まって死者が一時的に実体を取り戻す。
plot_outline:
- '序盤: 世界の心臓として意識を拡散させていた主人公（エリアン）が、記憶を売る市場で、かつての自分の「名前」と「痛み」が売られていることに気づく。それを買い戻そうとする過程で、自分の意識が分裂し、人間としての個体（分身）が具現化する。'
- '中盤: 分身となった自分と共に、風化した地下図書館や時計塔の跡を巡る。そこでは、前作のライラやセラフィナの残滓が、断片的な記憶を繋ぎ合わせて「偽物の日常」を演じていた。彼らとの再会を通じて、世界を動かす鼓動が、実は世界をゆっくりと塗り潰す消しゴムであったことを悟る。'
- '終盤: 秩序の守護者ヴァレリウスの残影が、完全なる静止を取り戻すために「月食」を人為的に引き起こそうとする。月食が完成すれば、時間は止まるが、今存在するすべての記憶（＝世界の構成要素）が消滅する。主人公は、心臓としての自分と、人間としての自分のどちらを犠牲にするかの選択を迫られる。'
- '結末: 主人公は自らを鏡へと変貌させ、月食の光を反射させることで、世界を『止まった静止』でも『滅びゆく進行』でもない、『永遠に繰り返される美しい夢』へと書き換える。私は鏡の中へ消え、世界は誰が誰であったかも分からないまま、心地よい残響の中で眠りにつく。'
style_notes: 論理的な飛躍を厭わず、感情を色彩や音に変換して描写すること。時計の秒針が心臓の鼓動と同期し、扉を開けるたびに視点や世界の色が変わるような、ねじれた感覚を演出する。文末に余韻を残し、読者が現実と夢の境界を見失うような幻想文学的アプローチを徹底する。
