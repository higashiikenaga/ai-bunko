- name: アデライン・フォン・ローゼンベルク
  role: 主人公
  age: 18
  gender: 女性
  appearance: 透き通るような白い肌と、深いサファイア色の瞳。常に完璧に整えられた金髪と、流行の最先端を行く豪華なシルクのドレスを纏っている。
  personality: 規律正しく聡明だが、内面には抑圧された情熱と孤独を抱えている。一人称は「私（わたくし）」。
  speech_style: 優雅で丁寧な貴族言葉。感情が高ぶるとわずかに声が震える。
  background: 帝国屈指の名門公爵家の令嬢。政略結婚によって帝国の権力構造を安定させるための「駒」として育てられてきた。
  motivation: 与えられた運命に従うだけの存在ではなく、一人の人間として愛し、選ぶ自由を手に入れること。
  relationships:
  - name: ジュリアン・ル・クレール
    relation: 運命の恋人
  - name: カシウス・ド・ヴァルデマール
    relation: 婚約者であり、抑圧の象徴
  - name: クラリス
    relation: 親友であり、唯一の本音を話せる相手
  arc: 完璧な「社交界の偶像」から、自らの意思で地位を捨て、愛と真実のために戦う「一人の女性」へと成長する。
- name: ジュリアン・ル・クレール
  role: 主人公/相棒
  age: 21
  gender: 男性
  appearance: 少し癖のある黒髪に、知性を感じさせる鋭いが穏やかな灰色の瞳。書庫の埃に馴染むような、質素だが清潔感のある装い。
  personality: 冷静沈着で博識。時に傲岸不遜な態度を見せるが、根は優しく、真実を求める情熱に溢れている。一人称は「僕」。
  speech_style: 理知的で落ち着いた話し方。皮肉を交えることもあるが、アデラインに対しては敬意を払う。
  background: 地下図書館の司書として身分を隠して暮らしているが、その正体は帝国によって抹殺されたはずの旧王家の血を引く生き残り。
  motivation: 帝国の隠蔽された歴史の真実を明らかにし、血統に縛られない自由な世界を見ること。
  relationships:
  - name: アデライン・フォン・ローゼンベルク
    relation: 愛する女性
  arc: 過去の血統から逃げ続けてきた「隠遁者」から、自らの出自を受け入れ、未来を切り拓く「導き手」へと変化する。
- name: カシウス・ド・ヴァルデマール
  role: 敵役
  age: 24
  gender: 男性
  appearance: 彫刻のように整った容貌。輝くようなプラチナブロンドと、全てを見透かすような冷徹な碧眼。常に隙のない軍服や礼服を着用している。
  personality: 冷酷で合理的。秩序こそが帝国の正義であると信じて疑わない支配者層の人間。一人称は「私（わたし）」。
  speech_style: 威圧的で、有無を言わせぬ絶対的な命令口調。
  background: 現帝国の有力貴族の嫡男であり、アデラインの婚約者。帝国の秩序を乱す「不確定要素」を徹底的に排除しようとする。
  motivation: 帝国の既存の権力構造を維持し、旧王家の残党による混乱を未然に防ぐこと。
  relationships:
  - name: アデライン・フォン・ローゼンベルク
    relation: 所有物としての婚約者
  - name: ジュリアン・ル・クレール
    relation: 排除すべき敵対者
  arc: 揺るぎない秩序の守護者として君臨していたが、個人の感情と歴史の真実という予測不能な力によって、その権威を崩されていく。
- name: クラリス
  role: 脇役
  age: 18
  gender: 女性
  appearance: 明るい栗色の髪をリボンで結び、常に表情豊か。華やかだが、どこか親しみやすい装い。
  personality: 快活で好奇心旺盛。社交界の噂話に詳しいが、根は義理堅く、アデラインを心から大切に思っている。一人称は「私」。
  speech_style: テンポが速く、明るく社交的な話し方。
  background: アデラインの幼馴染で、中堅貴族の娘。社交界の華として振る舞いながらも、窮地のアデラインを精神的に支える。
  motivation: 親友であるアデラインが、形式的な幸福ではなく、心からの幸せを掴むこと。
  relationships:
  - name: アデライン・フォン・ローゼンベルク
    relation: 親友
  arc: 単なる「社交界の傍観者」から、アデラインの決断を支え、密かに協力する「共犯者」へと変化する。
