title: 碧き鳥のワルツ ―帝国禁忌の地下書庫―
genre: 青春恋愛
tone: 華麗で装飾的、耽美的な宮廷ロマン
pov: 三人称
tense: 過去形
setting: 19世紀風の架空の帝国。豪華絢爛な宮廷文化が花開く一方、厳格な身分制度に縛られた社交界。
premise: 政略結婚を目前に控えた公爵令嬢アデラインは、宮廷の最深部に隠された「地下図書館」に迷い込み、身分を隠した青年司書ジュリアンと出会う。煌びやかな舞踏会の喧騒と、静謐な書庫の闇。相反する二つの世界で、二人は禁じられた恋に落ちる。しかし、年に一度、国を横切る渡り鳥の飛来と共に、帝国の根幹を揺るがす残酷な血統の秘密が暴かれようとしていた。
themes:
- 自由への渇望
- 身分を超えた純愛
rules:
- 宮廷の礼法は絶対であり、一度でも作法を誤れば社交界から永久に追放される。
- 地下図書館は特定の月の満ち欠けの夜にしか入り口が現れない。
- 渡り鳥の飛来パターンは、帝国の正統な後継者を指し示す神託として信じられている。
plot_outline:
- '序盤: 社交界へのデビューを飾るアデライン。豪華なシルクのドレスに身を包み完璧な令嬢を演じるが、心は孤独だった。ある夜、彼女は偶然、古びた扉の先にある禁忌の地下図書館に足を踏み入れ、そこで傲岸不遜ながらも知的な青年ジュリアンと出会う。'
- '中盤: 二人は書庫で密かに言葉を交わし、本を通じて互いの価値観を共有し、深く惹かれ合う。一方で、宮廷ではアデラインの婚約者が決定し、豪華な仮面舞踏会が催される。ドレスのレースや宝石の輝きに彩られた舞踏会の裏で、ジュリアンは帝国が隠蔽してきた歴史的真実をアデラインに告げる。'
- '終盤: 渡り鳥が空を埋め尽くす季節。ジュリアンが実は没落した旧王家の血を引く正当なる継承者であることが判明し、宮廷の権力争いに巻き込まれる。アデラインは彼を守るため、自らの地位と名誉を捨てて、社交界の頂点である皇帝の晩餐会で大胆な賭けに出る。'
- '結末: 陰謀を打ち破り、ジュリアンは形式上の王位を捨てて自由な学者としての道を、アデラインは伝統という籠から脱して彼と共に生きる道を選ぶ。二人は碧い鳥が舞う空の下、誰にも縛られない真の愛を誓い合う。'
style_notes: シャンデリアの光やドレスの刺繍、香水の薫りなど、五感を刺激する豪華な描写を多用すること。感情表現は直接的ではなく、比喩や情景描写に託して優雅に描き、貴族的な気品ある語り口を徹底する。
