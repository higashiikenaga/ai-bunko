- name: 乾 怜二
  role: 主人公
  age: 42
  gender: 男性
  appearance: 常に煙草の煙を燻らせている、無精髭を生やした疲れ切った目。使い古されたトレンチコートが特徴。
  personality: 冷笑的で厭世的だが、心の奥底には捨てきれない正義感を持つ。一人称は「俺」。
  speech_style: 低く、ぶっきらぼうな口調。必要最低限のことしか話さない。
  background: 元刑事。数年前の未解決事件をきっかけに組織を去り、現在は雨の降り止まない港町で私立探偵を営んでいる。
  motivation: 依頼された事件の真相を突き止め、自身の過去の清算を図ること。
  relationships:
  - name: 九条 栞
    relation: 依頼人
  - name: 佐伯 誠
    relation: かつての同僚
  arc: 冷淡な傍観者として事件に接していたが、真実の残酷さに触れることで、再び人間としての痛みと向き合うようになる。
- name: 九条 栞
  role: 依頼人
  age: 28
  gender: 女性
  appearance: 儚げな印象を与える、黒髪の長い女性。雨に濡れても乱れない、どこか浮世離れした品格を持つ。
  personality: 静かで落ち着いているが、瞳の奥に深い悲哀を湛えている。一人称は「私」。
  speech_style: 丁寧で淑やかな言葉遣い。しかし、時折刺すような鋭さを見せる。
  background: 没落した旧家の末裔。手にした折れた剣は、一族に伝わるものだが、その歴史には忌まわしい秘密がある。
  motivation: 折れた剣に隠された一族の因縁と、密室殺人の謎を解き明かすこと。
  relationships:
  - name: 乾 怜二
    relation: 依頼人
  arc: 謎を追う過程で、自らの出自が招いた悲劇的な真実を知り、それを背負って生きていく決意をする。
- name: 橘 宗一郎
  role: 敵役
  age: 65
  gender: 男性
  appearance: 隙のない身なりをした、威圧的なオーラを放つ骨董品店の店主。眼鏡の奥の瞳は冷徹。
  personality: 完璧主義者であり、自らの美学に固執する。倫理よりも「美しさ」を優先する。一人称は「私」。
  speech_style: 慇懃無礼で、論理的かつ理路整然とした話し方。
  background: 港町の有力な骨董商。数十年前、街の勢力図を塗り替えたある事件の当事者である。
  motivation: 過去の罪を「美しい伝説」へと昇華させ、自らの地位と美学を守り抜くこと。
  relationships:
  - name: 乾 怜二
    relation: 対立者
  arc: 完璧に構築したはずの「美しい誤魔化し」が論理によって暴かれ、醜い真実を露呈させて崩壊する。
- name: 佐伯 誠
  role: 脇役
  age: 45
  gender: 男性
  appearance: 地味なスーツに身を包んだ、どこにでもいる疲れ果てた刑事。乾とは対照的に清潔感はあるが、活気はない。
  personality: 現実主義者で、法と秩序を重んじる。乾のやり方を危惧している。一人称は「僕」。
  speech_style: 事務的だが、乾に対しては旧知の仲ゆえの遠慮が感じられる。
  background: 乾の元同僚で、現在は港署の刑事。乾が去った後の組織の歪みを知っている。
  motivation: 事件を迅速に解決し、街の平穏を維持すること。
  relationships:
  - name: 乾 怜二
    relation: 元同僚
  arc: 乾が暴こうとする「不都合な真実」と、警察官としての職務の間で激しい葛藤を経験する。
