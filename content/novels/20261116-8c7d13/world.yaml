title: 散りゆく刃の追憶
genre: 本格ミステリー
tone: ハードボイルド、乾いた哀愁
pov: 一人称
tense: 過去形
setting: 現代、雨の降り止まない港町
premise: 「……この剣、どこへ持っていけばいいのかしら」 降りしきる雨の中、事務所を訪れた女はそう呟いた。彼女の手には、無残に折れた古剣と、季節外れの桜の花びらが握られている。密室となった骨董品店での殺人事件。現場に残された桜と、折れた剣。その不条理な組み合わせが、眠っていた街の闇を呼び覚ます。私は煙草の煙越しに、その不吉な真実を追うことになる。
themes:
- 過去の罪と償い
- 美しき虚飾の崩壊
rules:
- 超常現象は一切排除し、物理的なトリックのみで解決する
- すべての謎は論理的な推論によって解明されること
- 犯人は必ず人間であること
plot_outline:
- '序盤: 降りしきる雨の夜、事務所を訪れた女から、折れた剣と密室殺人の謎について依頼を受ける。'
- '中盤: 現場に残された桜の不自然さと、古剣にまつわる歴史的背景を調査。容疑者たちの間に隠された、数十年前に遡る因縁が浮かび上がる。'
- '終盤: 密室のトリックを解明。夜の埠頭で、犯人が仕掛けた「美しき誤魔化し」を論理的に打ち砕く。'
- '結末: 事件は解決するが、救いはなく、ただ冷たい雨が街を洗い流していく。私は再び煙草に火をつける。'
style_notes: 一人称「私」によるハードボイルドな文体。比喩は短く、乾いたものを用いる（例：「雨は、街の汚れを洗い流すのではなく、ただ薄めているだけだ」）。物語は必ず依頼人との会話から開始すること。各話には必ず雨、あるいは夜の情景を組み込み、煙草の煙と湿った空気感を演出する。
