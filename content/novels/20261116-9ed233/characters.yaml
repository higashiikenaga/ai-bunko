- name: レオン・ガレオン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 煤けた革ジャンに無数の工具を下げ、左目が機械式の義眼になっている。無精髭を生やした荒々しい風貌。
  personality: 粗暴だが義理堅い。面倒見が良い現実主義者。一人称は「俺」。
  speech_style: ぶっきらぼうで短気だが、本質的には面倒見が良い兄貴分口調。
  background: 屑の荒野で育った凄腕の屑拾い。日々の糧を得るために生き延びてきたが、天蓋都の理不尽な搾取に内心では強い怒りを抱いている。
  motivation: 最初は少女を金になると思って拾ったが、追手から守るうちに彼女の生き様を見届けることを決意する。
  relationships:
  - name: エマ
    relation: 保護対象からかけがえのない相棒へ
  - name: バルト
    relation: かつての戦友であり、頼れる協力者
  arc: 自分のためだけに生きる屑拾いから、世界の運命を背負って戦う反逆者へと成長する。
- name: エマ
  role: 相棒（ヒロイン）
  age: 14
  gender: 女性
  appearance: 透き通るような白銀の髪と、機械仕掛けの歯車が微かに透ける青い瞳。胸元にはガラス製の『鏡の心臓』が埋め込まれている。
  personality: 最初は感情が薄く無機質だったが、レオンと過ごすうちに人間らしい温かさを知る。一人称は「私」。
  speech_style: 少したどたどしく、感情の起伏が少ないフラットなトーン。
  background: 天蓋都の最奥で作られた「鏡の心臓」の擬人化。世界の記憶を保持しているが、序盤は記憶を失っている。
  motivation: 失われた記憶を取り戻し、自分が何者なのかを知ること。世界を救うために自らの運命に立ち向かう。
  relationships:
  - name: レオン・ガレオン
    relation: 命の恩人であり、初めて心を許した存在
  arc: 道具として作られた存在から、自分の意志で運命を選び取る一人の人間へと変化する。
- name: バルト・ロックス
  role: 相棒（サブキャラクター）
  age: 40
  gender: 男性
  appearance: 屈強な巨体にオイルまみれの作業着。頭にゴーグルを引っ掛け、右腕は自作の蒸気ハンマー義手。
  personality: 豪快で酒好き、義理人情に厚いベテランの元・天蓋都軍技術者。一人称は「俺」。
  speech_style: 野太い声で、冗談を交えつつも核心を突く頼もしい話し方。
  background: 天蓋都の非人道的な計画に絶望して軍を脱走し、荒野をさまよっていたところをレオンと出会う。
  motivation: 天蓋都の支配層へ一泡吹かせることと、腕利きのメカニックとしてレオンたちの旅を支えること。
  relationships:
  - name: レオン・ガレオン
    relation: 腕の立つ相棒、互いに信頼し合っている
  arc: 過去のトラウマに囚われていた臆病な脱走兵から、仲間を守るために盾となる誇り高い男へ変わる。
- name: ヴァルカン・クライスト
  role: 敵役
  age: 58
  gender: 男性
  appearance: 純白のフロックコートに身を包み、黄金のマスクで顔半分を隠している。冷徹で気高い雰囲気をまとう。
  personality: 極めて傲慢で冷酷。秩序と効率のためなら犠牲をいとわない。一人称は「私」。
  speech_style: 静かで威圧感があり、相手を虫けらのように見下す冷徹なトーン。
  background: 天蓋都の最高執政官。腐敗した地上を切り捨て、空の上だけで完全管理された新しい世界を築こうとしている。
  motivation: 『鏡の心臓』を回収し、世界の記憶をリセットして自らが神となる新世界の創造。
  relationships:
  - name: エマ
    relation: 回収すべき「道具」であり、世界の再構築に必要な鍵
  - name: レオン・ガレオン
    relation: 計画を邪魔する厄介な虫けら
  arc: 絶対的な権力者として君臨するが、人間の持つ「予測不能な意志」の前に敗北する。
