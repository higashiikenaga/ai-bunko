title: 蒸気と血の轍
genre: スチームパンク冒険
tone: 硬派で乾いたアクション、無骨な男の独白
pov: 一人称（俺）
tense: 過去形
setting: 廃材が地平線まで続く「屑の荒野」と、空に浮かぶ階級社会の都市「天蓋都」。
premise: 屑拾いで生きていた俺は、ある日「鏡の心臓」を持つ少女を拾った。それは都市の全エネルギーを制御する禁忌の蒸気機関だった。俺は彼女を連れ、空の特権階級が企む世界再編を止めるため、錆びた大地から天へと突き進む。
themes:
- 喪失と再生
- 運命への抗い
rules:
- 蒸気圧が通貨であり権力の象徴。圧力が低い者は地上の底辺に住まわされる
- 鏡の心臓は所有者の記憶を燃料に変換し、無限の蒸気圧を生成する
- 天蓋都へ至る唯一の経路は、巨大な蒸気昇降機『昇天の塔』のみである
plot_outline:
- '序盤: 屑拾いの日常の中、俺は記憶を失った少女と、彼女の胸に埋め込まれた『鏡の心臓』を発見し、天蓋都の追手から彼女を救い出す。'
- '中盤: 旅の途中で信頼できる脱走兵や技術者を仲間に加え、鏡の心臓が世界の記憶を書き換える装置であることを知る。少女の記憶が戻るたび、彼女は人間ではなく、心臓の擬人化であることに気づく。'
- '終盤: 昇天の塔を強襲し、天蓋都の支配者が企む『地上の全消去と世界の再構築』を阻止するため、最上階の心臓制御室へ殴り込む。'
- '結末: 激戦の末に支配者を排除し、俺は少女（心臓）と共に装置を破壊。特権階級の権力を崩壊させ、地上と空が等しく煙に覆われた新しい時代へ歩き出す。'
style_notes: 短文でたたみかける。擬音を完全に排除し、動作を強い動詞で描写する（例：『ドカンと鳴った』ではなく『爆ぜた』）。戦闘直前には必ずタバコを吸う、空を仰ぐなどの静かな場面を挿入し、静と動の対比を強調する。
