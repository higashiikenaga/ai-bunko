- name: カイ・エインズワース
  role: 主人公
  age: 19
  gender: 男性
  appearance: 無造作な茶髪に、蒸気汚れのついたつばの広い帽子。機能性を重視した革製の飛行服を纏っている。
  personality: 好奇心旺盛だが、どこか孤独を愛する内向的な一面もある。一人称は「僕」。
  speech_style: 丁寧だが少し距離感のある、穏やかな話し方。
  background: 砂漠の辺境で蒸気船の操縦士として働きながら、広い世界への憧れと、自分自身の居場所を探している。
  motivation: 拾った手紙の持ち主の足跡を辿り、世界の果てにある「時間軸の継ぎ目」の真実を知ること。
  relationships:
  - name: リノア・ヴァレンタイン
    relation: 航海を支える頼れる相棒
  - name: 手紙の差出人
    relation: 謎に包まれた旅の導き手
  arc: 受動的に手紙を追うだけの旅人から、自らの意志で未来へ何かを繋ごうとする意志ある航海士へと成長する。
- name: リノア・ヴァレンタイン
  role: 相棒
  age: 22
  gender: 女性
  appearance: ゴーグルを額にかけ、多数の工具をベルトに下げたメカニック。活発な印象を与えるショートヘア。
  personality: 現実主義で世話焼き。技術への情熱が強く、困難な状況でも明るく振る舞う。一人称は「私」。
  speech_style: ハキハキとした、リズムの良い快活な話し方。
  background: かつて雲上の観測所で整備士として働いていたが、ある理由で職を辞し、現在はフリーの技術者として活動している。
  motivation: カイの航海を技術面でサポートし、自身がかつて失った「未知の動力源」の噂を確かめること。
  relationships:
  - name: カイ・エインズワース
    relation: 船の操縦士兼、守るべき旅の仲間
  arc: 合理性のみを重視していた価値観が、カイと共に旅をする中で、目に見えない感情や繋がりの重要性を理解するように変わっていく。
- name: アーサー・グレイ
  role: 脇役（導き手）
  age: 65
  gender: 男性
  appearance: 白髪の蓄えがあり、古びた外套を着た老人。常に懐中時計を大切そうに持っている。
  personality: 博識でミステリアス。時折、未来や過去を予言するかのような含みを持たせた発言をする。一人称は「私」。
  speech_style: ゆったりとした、教え諭すような落ち着いた口調。
  background: 各地の郷土料理や風習に精通した放浪の歴史学者。手紙の謎に深く関わっている節がある。
  motivation: 自分が記録してきた歴史が、正しく次の世代へ受け継がれることを見届けること。
  relationships:
  - name: カイ・エインズワース
    relation: 旅のヒントを与える師のような存在
  arc: 物語の鍵を握る存在として、カイが「継ぎ目」に到達するための精神的な導きを与える。
