title: 黄銅の砂時計と、迷い子の航跡
genre: スチームパンク冒険
tone: 旅と出会いを描く穏やかな冒険譚。風景描写が豊か。
pov: 一人称「僕」
tense: 過去形
setting: 巨大な歯車と蒸気機関が駆動する黄銅色の荒野が広がる世界
premise: 蒸気船を駆る僕はある日、広大な砂漠のオアシスで一通の失われた手紙を拾う。それは十年前の過去から届いた、見知らぬ誰かの切実な旅の始まりの告白だった。消えかけたインクの導きに従い、僕はこの世界の果てにあるという「時間軸の継ぎ目」を目指して新たな航海へと舵を切る。各地の珍しい郷土料理や風習に触れながら、汽笛を響かせて進む穏やかな冒険の旅が始まる。
themes:
- 過去と現在を繋ぐ手紙
- 旅先での温かな一期一会
rules:
- 蒸気機関は鉱石「エテルニウム」の燃焼熱で駆動する
- 手紙は時間の歪みによって稀に時空を超えて漂着する
- オアシスの水は独自のろ過機構を持つスチームプラントで浄化されている
plot_outline:
- '序盤: 砂漠のオアシス都市「ザフラ」に立ち寄った僕が、古びた給水塔の陰で差出人不明の古い手紙を発見する'
- '中盤: 手紙に記された特有の消印を手がかりに、蒸気船で隣国の峡谷集落や雲上の観測所を巡り、手紙の持ち主の足跡を追う'
- '終盤: 旅の途中で出会った人々から教わった郷土料理や風習に心を温められながら、ついに時空の歪む「継ぎ目」の領域に到達する'
- '結末: すべての謎が解き明かされた後、僕は新たな手紙を次の旅人のために未来のオアシスへ残し、再び次の目的地へ向けて汽笛を鳴らす'
style_notes: 一人称「僕」による旅日記のような語り口。風の匂いや蒸気の温もり、土地ごとの料理の湯気など、五感に訴えかける豊かな風景描写を徹底する。
