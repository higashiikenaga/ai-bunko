- name: カイエン・レン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 痩身だが引き締まった体躯。磁気嵐による微細な火傷の痕が腕に残っている。使い込まれた回収用防護服を着用している。
  personality: 現実主義者で、過酷な環境に慣れた冷静さを持つ。一人称は「俺」。
  speech_style: 無駄のない、短く実務的な話し方。
  background: アイギス・ステーションの最下層区画出身。幼い頃からエネルギー回収作業に従事し、極限状態での生存術を身につけている。
  motivation: 「折れた剣」が示す危機から、ステーションとそこに住む人々を守ること。
  relationships:
  - name: エレーナ・ソラリ
    relation: 技術的な協力者であり、信頼を寄せているパートナー
  - name: ヴァレリウス局長
    relation: 対立する管理体制の象徴
  arc: 単なる生存のための労働者から、都市の運命を左右する決断を下す主体的なリーダーへと成長する。
- name: エレーナ・ソラリ
  role: 相棒
  age: 25
  gender: 女性
  appearance: 知的な瞳を持つ。常にホログラフィック・インターフェースを操作しており、磁気干渉を防ぐ特殊な眼鏡をかけている。
  personality: 論理的で好奇心が強く、やや皮肉屋。一人称は「私」。
  speech_style: 早口で専門用語を多用する、理知的な話し方。
  background: ステーション中央研究所の元研究員。データの改ざんを察知し、現在は地下の解析屋として活動している。
  motivation: 古代探査機のデータが持つ真実を解明し、物理法則の矛盾を証明すること。
  relationships:
  - name: カイエン・レン
    relation: 現場作業のパートナーであり、唯一の理解者
  arc: 情報の真実を追う学究的な立場から、崩壊する現実の中で行動を共にする戦友へと変わる。
- name: ヴァレリウス局長
  role: 敵役
  age: 56
  gender: 男性
  appearance: 高級な磁気遮蔽スーツに身を包んだ、隙のない身なり。冷徹な眼差し。
  personality: 徹底した功利主義者。秩序とエネルギー供給量を最優先する。一人称は「私（わたくし）」。
  speech_style: 慇懃無礼で、相手を威圧するような丁寧な敬語。
  background: アイギス・ステーションのエネルギー管理局のトップ。都市の存続よりも、管理体制の維持と経済的安定を重視している。
  motivation: 中性子星の異常事態を隠蔽し、パニックによる都市の崩壊と権力の喪失を防ぐこと。
  relationships:
  - name: カイエン・レン
    relation: 秩序を乱す不都合な存在
  arc: 絶対的な管理者の立場から、自らが守ろうとした秩序が物理法則によって瓦解していく無力感を味わう。
- name: ガンス
  role: 脇役
  age: 68
  gender: 男性
  appearance: 深く刻まれた皺と、磁気嵐の影響で変色した皮膚。片腕は旧式の義手。
  personality: 達観しており、どこか浮世離れしている。一人称は「わし」。
  speech_style: ゆったりとした、リズム感のある老人らしい話し方。
  background: ステーション建設当初からの生き残り。磁気嵐の「音」を聴くことができるという奇妙な勘を持つ。
  motivation: 新しい時代の「リズム」が訪れることを見届けること。
  relationships:
  - name: カイエン・レン
    relation: かつての自分を重ねる若者
  arc: 過去の遺物として静観する立場から、次世代へ知識を託す導き手となる。
