title: 事象の断片：パルス・エッジの残照
genre: SF
tone: 硬質、壮大、静謐
pov: 三人称
tense: 過去形
setting: 高速回転する中性子星の重力圏に構築された、巨大なエネルギー回収環状都市「アイギス・ステーション」。
premise: 中性子星の回転エネルギーを奪い取る巨大な環状構造体。凄まじい電磁パルスが絶え間なく降り注ぐその場所は、人工的な磁気遮蔽なしでは休息すら叶わない「眠らない街」である。ある日、回収作業員の青年は、かつて宇宙を切り裂いたとされる超高密度物質の破片――「折れた剣」と呼ばれる古代探査機の残骸を拾い上げる。その破片に秘められたデータは、中性子星の自転が予測を上回る速度で失われ、都市が重力に飲み込まれようとしている真実を突きつける。
themes:
- 物理的摂理への抗い
- 極限環境における知性の継承
rules:
- 中性子星の強大な磁場によるローレンツ力が、都市の動力および物体の運動を支配している
- 強大な重力により、都市内の時間は外部の宇宙と比較して極めて緩やかに進行する（時間遅延効果）
- 電磁パルスによる神経干渉を防ぐため、居住区は高度な超伝導磁気遮蔽下に置かれている
plot_outline:
- '序盤: 中性子星の磁気圏でエネルギー回収に従事する主人公が、磁気嵐の中で異常な質量を持つ「折れた剣」と呼ばれる古代探査機の破片を回収する。'
- '中盤: 破片の解析を通じて、星の自転減速が都市の軌道安定性を損なっていることが判明。都市全体のエネルギー供給が不安定になり、住民はパルスによる神経障害に苦しみ始める。'
- '終盤: 破片に隠された「磁場制御の再設計データ」を実装するため、主人公は崩壊しつつあるエネルギー回収装置の最深部へと向かう。重力レンズ効果によって視界が歪み、光が円環状に曲がる極限の空間での作業が描かれる。'
- '結末: 物理法則に基づいた精密な磁場調整により、都市は中性子星の新しい回転周期へと適応する。崩壊の危機を脱した都市は、依然として眠れないまま、しかし新たなリズムの中で広大な宇宙の静寂へと溶けていく。'
style_notes: 「フレーム・ドラッギング（時空の引きずり）」や「ローレンツ力」といった物理学用語を、その現象が視覚的にどう歪んで見えるかという描写と共に用いる。情緒的な形容詞を避け、現象の規模感と法則の冷徹さを描くことで、読者に宇宙の圧倒的なスケール（センス・オブ・ワンダー）を感じさせること。中性子星の光が重力によって曲げられる様子など、視覚的なスペクタクルを重視する。
