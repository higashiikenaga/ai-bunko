- name: カイ
  role: 主人公
  age: 16
  gender: 男性
  appearance: 使い古したゴーグルを首にかけ、音を採取するための大型集音器を背負った小柄な少年。服は継ぎ接ぎだらけの作業着。
  personality: 好奇心旺盛で前向き。絶望的な状況でも「面白い音」を探そうとする。一人称は「僕」。
  speech_style: 快活で若々しい口調。未知の音に出会うと興奮して早口になる。
  background: 静寂病で家族と声を失い、浮遊都市の底辺で「音拾い」として生計を立てていた。ある日、運命を変える『夜明けのラジオ』を拾う。
  motivation: 世界に音を取り戻し、もう一度家族や仲間と笑い合いたい。
  relationships:
  - name: ゼノ
    relation: 反発しつつも信頼し合う旅の相棒
  - name: リラ
    relation: 互いの欠損（音痴と喪失）を補い合う友人
  arc: 単なる「拾い手」から、世界を導く「指揮者（コンダクター）」へと成長する。
- name: ゼノ
  role: 相棒
  age: 32
  gender: 男性
  appearance: 白髪混じりの短髪に鋭い眼光。帝国騎士団の紋章を削り落とした古びた軽装鎧を纏い、tuning fork（音叉）のような形状の巨大な大剣を携えている。
  personality: 皮肉屋で現実主義。情に脆いことを隠そうとする。一人称は「俺」。
  speech_style: 低くぶっきらぼうな話し方。常に含みのある皮肉を混ぜる。
  background: 元帝国騎士団の精鋭。帝国の「静寂計画」の残酷な実態を知り、反旗を翻して脱走した。現在は逃亡者として潜伏していた。
  motivation: 過去に切り捨てた部下たちへの贖罪と、帝国の嘘を暴くこと。
  relationships:
  - name: カイ
    relation: 危なっかしい少年だと思いつつ、その純粋さに救われている
  - name: 帝国総統
    relation: かつての忠誠対象であり、最大の憎悪対象
  arc: 絶望して心を閉ざしていたが、カイと共に旅をすることで「守るべきもの」を再発見する。
- name: リラ
  role: 脇役/仲間
  age: 19
  gender: 女性
  appearance: 派手だが色褪せたステージドレスを纏う。大きな音叉の形をしたハンドベルを常に持ち歩いている。
  personality: 天真爛漫で自信家。極度の音痴だが、本人は「新しい音楽の形」だと信じている。一人称は「私」。
  speech_style: 演劇的な大げさな身振り手振りと、朗々とした話し方。
  background: かつての名門音楽院を「致命的な音痴」という理由で追放された元歌姫。しかし、彼女の歌声は静寂病の進行を一時的に遅らせる特殊な共鳴を持つ。
  motivation: 世界中の人々に自分の歌を聴かせ、認められたい。
  relationships:
  - name: カイ
    relation: 自分の歌を「面白い音」として肯定してくれた恩人
  - name: ゼノ
    relation: 口うるさいおじさんと呼んでからかう相手
  arc: 正解の音を追い求めるのではなく、自分だけの「不協和音」が世界を救う力になると気づく。
- name: 帝国総統・ヴァルガス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 純白の法衣に身を包み、口元を銀のマスクで覆っている。一切の足音を立てずに歩く、静謐な威圧感を放つ男。
  personality: 冷酷な完璧主義者。感情や雑音を「不純物」として嫌悪する。一人称は「私」。
  speech_style: 静かで抑揚のない、囁くような話し方。相手を精神的に追い詰める論理的な語り口。
  background: 静寂病の研究者であり、それを意図的に加速させて世界を管理しようとした黒幕。完全なる静寂こそが究極の秩序であると信じている。
  motivation: 全ての音を消し去り、自身の意向のみが伝播する「絶対静寂の帝国」を完成させること。
  relationships:
  - name: ゼノ
    relation: 使い捨ての駒として切り捨てた元部下
  - name: カイ
    relation: 計算外のノイズ（不確定要素）として排除すべき対象
  arc: 完璧な静寂を追求したが、最後は制御不能な「生の音」の奔流に飲み込まれ、崩壊する。
