title: 絶響のデッドライン・ランナー
genre: 異世界ファンタジー
tone: 疾走感のあるハイテンション・エンタメ
pov: 三人称
tense: 過去形
setting: 音が魔力となる浮遊都市群。世界から音が消えていく「静寂病」が蔓延し、文明が崩壊しつつある時代。
premise: 世界から音が消え、魔法を失いつつある時代。音を回収して売る「音拾い」の少年・カイは、ある日、正体不明の放送を流す『夜明けのラジオ』を手に入れる。ラジオが告げたのは、世界を再起動させ、静寂を止める唯一の手段『最終列車』の運行スケジュールだった。カイは皮肉屋の元騎士と共に、静寂を強いる帝国を振り切り、世界の終端へと疾走する。
themes:
- 喪失と再生
- 共鳴する絆
rules:
- 音の大きさや複雑さがそのまま魔力として出力される。無音の状態では一切の魔法が使えない。
- 静寂病にかかると、徐々に自分の出す音が消え、最終的に存在自体が世界から消滅する。
- 『最終列車』に乗るには、世界各地に散らばる「原初の旋律」を揃えた特製チケットが必要である。
plot_outline:
- '序盤: 音拾いのカイが『夜明けのラジオ』を拾い、帝国の追手から逃走。ラジオの導きで、物語の相棒となる皮肉屋の元騎士・ゼノと出会い、列車へのチケット集めの旅を開始する。'
- '中盤: 音痴な歌姫や爆破狂の整備士など、はみ出し者の仲間が集結。各地の「音の遺跡」で帝国の精鋭部隊と激突しながら、世界から音が消された真の理由と帝国の陰謀を暴く。'
- '終盤: 最終列車の駅である「世界の果て」へ到達するが、そこには完全なる静寂による支配を目論む帝国総統が待ち構えていた。仲間たちの音を一つに合わせた最大共鳴による決戦が展開される。'
- '結末: 最終列車が起動し、世界に音が奔流のように戻る。静寂病は完治し、人々は再び自らの声を獲得。カイたちは新しい時代の「音」を探しに、再び旅に出る。'
style_notes: 短文の積み重ねでスピード感を演出する。会話劇を中心に物語を転がし、アクションシーンは視覚的な動きを優先して畳み掛ける。擬音に頼らず、キャラクターの挙動と状況説明で衝撃を表現。各話のラストに必ず「絶体絶命」または「衝撃の事実」を配置し、強い引きを作る。
