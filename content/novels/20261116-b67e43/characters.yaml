- name: 佐伯 湊 (さえき みなと)
  role: 主人公
  age: 27
  gender: 男性
  appearance: 痩身で肌の色が白く、どこか疲弊した表情。眼鏡をかけている。常に少し神経質そうに見える。
  personality: 内向的で慎重、観察眼が鋭いが、孤独を恐れる傾向がある。一人称は「僕」。
  speech_style: 丁寧だが、困惑や恐怖が混じると言葉が途切れがちになる。独り言が多い。
  background: 都会の出版社で校正者として働いていたが、過労により休職中。亡くなった叔父から湿地帯の屋敷を相続した。
  motivation: 屋敷での奇妙な現象の正体を突き止め、平穏な日常を取り戻したい。
  relationships:
  - name: 佐伯 鏡子
    relation: 鏡の中に潜む「自分」
  arc: 合理的な思考を持つ青年が、理解を超えた現象によって精神を摩耗させ、最終的に存在そのものを奪われる。
- name: 佐伯 鏡子 (さえき きょうこ)
  role: 敵役
  age: 27
  gender: 女性（外見上は湊の鏡像だが、性質は別物）
  appearance: 湊の鏡像。しかし、瞳の奥に濁った湿り気があり、時折、現実の湊が知らない不気味な微笑を浮かべる。
  personality: 冷酷で執着心が強く、獲物をじわじわと追い詰める愉悦を知っている。一人称は「私」。
  speech_style: 現実の湊の言葉をなぞるように話すが、時折、鳥の鳴き声に似た湿った声が混じる。
  background: 鏡の「遅れ」から生まれた、現実の世界へ這い出そうとする異形の存在。
  motivation: 鏡の向こう側から現実の「場所」を奪い、自由になること。
  relationships:
  - name: 佐伯 湊
    relation: 入れ替わりを狙う対象
  arc: 鏡の中の「影」から、現実を支配する「主体」へと完全に反転する。
- name: 内藤 慎一 (ないとう しんいち)
  role: 脇役
  age: 62
  gender: 男性
  appearance: 日焼けした肌と深い皺。長靴と作業着が似合う、がっしりとした体格の地元の猟師。
  personality: 現実主義で無愛想だが、土地の伝承には敬意を払っている。一人称は「俺」。
  speech_style: ぶっきらぼうで、結論を急ぐ話し方。警告をする時は非常に重々しい。
  background: 屋敷の周辺の湿地帯を管理している老人。かつてその屋敷に住んでいた一族の「不吉な習慣」を知っている。
  motivation: 新参者の湊が、土地の禁忌を犯さないよう監視し、警告すること。
  relationships:
  - name: 佐伯 湊
    relation: 近隣住民・警告者
  arc: 湊の異変に気づきながらも、抗えない自然の摂理（呪い）を前に、ただ無力に立ち尽くす。
