title: 湿った羽音と、反転する静寂
genre: ホラー
tone: 湿度が高く、じわじわと精神を侵食する不穏な空気感
pov: 一人称
tense: 過去形
setting: 現代、地方の湿地帯に囲まれた古い木造の一軒家
premise: 親族から継承した古い屋敷に引っ越した主人公は、毎年秋になると訪れる渡り鳥の異様な鳴き声に耳を塞ぐ。家の中にある古びた鏡は、現実よりも数秒遅れて世界を映し出しており、その「遅れ」の中に、本来そこにいないはずの何かが混じり始める。次第に鏡の中の自分と現実の自分の境界が曖昧になり、家の中には濡れた羽毛と泥のような匂いが充満していく。
themes:
- 境界の喪失
- 逃れられない血縁の記憶
rules:
- 鏡の中の世界は現実からわずかに遅延して動いているが、ある地点から鏡の中の存在が独自の意思で動き出す
- 渡り鳥が飛来する期間だけ、鏡と現実の境界が薄くなり、相互に干渉することが可能になる
- 鏡の中の自分と視線を合わせ続けた者は、徐々に肉体の輪郭を失い、鏡の側へと引き込まれる
plot_outline:
- '序盤: 主人公が屋敷に転居。家中に染み付いた古い雨のような匂いと、不自然に遅れて動く廊下の鏡に違和感を抱き始める。'
- '中盤: 渡り鳥の飛来と共に、鏡の中の自分の挙動が現実と乖離し始める。鏡の中の自分が、現実ではしていない「微笑」を浮かべたり、耳元で囁くような音が聞こえたりする。'
- '終盤: 鏡の中から濡れた手が伸び、主人公の日常を侵食し始める。鏡の中の自分は、外の世界に出るために主人公の「場所」を奪おうと画策し、家中の鏡が共鳴して鳴き声を上げ始める。'
- '結末: 主人公は鏡の中に引きずり込まれ、鏡の外に「自分」として振る舞う何かが残される。鏡の向こう側で、泥にまみれた羽を広げた鳥たちと共に、永遠に反転した静寂の中に閉じ込められる。'
style_notes: 泥の匂い、濡れた羽の感触、耳障りな鳥の鳴き声など、五感を刺激する描写を重ねること。断定的な表現を避け、「〜だったのかもしれない」「〜のような気がした」という揺らぎを持たせ、読者に正解を提示せずに不安を増幅させる。
