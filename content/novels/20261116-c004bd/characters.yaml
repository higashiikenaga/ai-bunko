- name: 月読 朔（つくよみ さく）
  role: 主人公
  age: 18
  gender: 男性
  appearance: 涼やかな目元を持つ、どこか儚げな美青年。藍色の着物を端正に着こなしている。
  personality: 冷静沈着で理性的。物静かな性格だが、内には強い使命感を秘めている。一人称は「僕」。
  speech_style: 丁寧で落ち着いた敬語。言葉選びが非常に美しく、淀みがない。
  background: 言の葉の古書店の店主。双子の妹と共に、言葉に宿る力を管理する一族の末裔として育てられた。
  motivation: 古書に記された言霊の暴走を食い止め、世界の理を維持すること。
  relationships:
  - name: 月読 望（つくよみ のぞみ）
    relation: 双子の妹
  - name: 謎の旅人
    relation: 事件のきっかけを与える人物
  arc: 秩序を守るためにのみ生きてきたが、最終的に「自ら消えること」で世界を救うという、自己犠牲を超えた愛と責任を受け入れる。
- name: 月読 望（つくよみ のぞみ）
  role: 主人公
  age: 18
  gender: 女性
  appearance: 朔に似た面影を持つが、瞳には生命力のある輝きがある。緋色の装束を好む。
  personality: 直感的で情熱的。共感能力が高く、言葉の「響き」や「感情」を大切にする。一人称は「私」。
  speech_style: 明るく快活だが、真剣な時には芯の通った強い口調になる。
  background: 朔と共に古書店を営む。朔が「理」を司るなら、彼女は言葉の「情」を司る役割を持つ。
  motivation: 失われゆく神々の記憶や、人々の心の叫びを、言葉として繋ぎ止めること。
  relationships:
  - name: 月読 朔
    relation: 双子の兄
  arc: 知識としての言葉ではなく、命を賭して紡ぐ言葉の重みを知り、運命を受け入れていく。
- name: 灰原 蓮（はいばら れん）
  role: 敵役
  age: 25
  gender: 男性
  appearance: 旅の装束に身を包んだ、底知れぬ瞳を持つ男。常に薄笑いを浮かべている。
  personality: 享楽的で冷酷。既存の秩序を破壊することに悦びを感じる。一人称は「俺」。
  speech_style: 軽薄で人を食ったような話し方。相手を揺さぶるような言い回しを好む。
  background: 「忘却の契約」を破棄しようとする禁忌の言霊を持ち込んだ謎の旅人。神々の不在を呪う者。
  motivation: 神と人が交わした約束を壊し、世界を混沌とした神代の混沌へと回帰させること。
  relationships:
  - name: 月読 朔
    relation: 因縁の対峙者
  arc: 世界の理を破壊しようとするが、双子が示す「言葉による再生」の力に、一瞬の困惑を見せる。
- name: 千代（ちよ）
  role: 脇役
  age: 70
  gender: 女性
  appearance: 古びた和服を纏った、物静かな老婆。古書店の常連。
  personality: 慈愛に満ちているが、どこかこの世の者ではないような浮世離れした雰囲気を持つ。一人称は「わらわ」。
  speech_style: 古風でゆったりとした、説法のような話し方。
  background: かつて都で神の声を聴いたとされる巫女の末裔。双子の出生の秘密を薄々勘付いている。
  motivation: 双子が正しい道を選べるよう、遠くから見守り、導きを与えること。
  relationships:
  - name: 月読 朔
    relation: 守護者的存在
  - name: 月読 望
    relation: 守護者的存在
  arc: 物語の鍵となる「神との約束」の断片を双子に伝える、導き手としての役割を全うする。
