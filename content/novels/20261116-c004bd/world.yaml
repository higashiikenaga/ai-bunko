title: 言の葉の古書店と、双子の月読
genre: 歴史・時代小説
tone: 幽玄で情緒豊かな和風ファンタジー
pov: 三人称
tense: 過去形
setting: 架空の平安期、神々の足跡が色濃く残る京の都の片隅
premise: 神代の記憶を記した『言霊の書』を扱う古本屋には、時折、忘れ去られた神の使いが訪れる。店主である双子の兄妹は、人の言葉に宿る力を操り、失われた記憶を綴り直す役目を担っていた。しかし、ある日現れた一人の旅人が持ち込んだ古本には、この世の理を覆す禁忌の言霊が記されていた。双子は季節の移ろいの中で、神と人の間に交わされた古き約束の真実へと辿り着いていく。
themes:
- 言葉の持つ力と責任
- 運命を受け入れること
rules:
- 言葉は形を成し、強く願った言葉は現実に干渉する力を持つ
- 双子の片方は『写し』を、片方は『綴り』を司ることで、世界の均衡を保っている
- 神の言葉を不用意に口にした者は、存在そのものが霧のように消える
plot_outline:
- '序盤: 京の路地裏に佇む古書店にて、双子の兄妹が季節の移ろいと共に、持ち込まれる奇妙な古本を整理する日常を描く。ある晩、正体不明の旅人が、文字の消えかかった古本を預けに来る。'
- '中盤: その本に記されていたのは、かつて神と人が交わした「忘却の契約」を破棄する呪詛の言葉であった。双子は調査を進める中で、自分たちがなぜ双子として生まれたのか、その出生にまつわる神との約束を知る。'
- '終盤: 言霊の暴走により、都の四季が狂い始め、空には見たこともない月が浮かぶ。双子は自身の命と引き換えに、言葉を「綴り」直し、狂った理を正す決断を迫られる。'
- '結末: 嵐が去り、都には再び穏やかな春が訪れる。古書店は以前と変わらぬ姿でそこにあるが、双子の姿は人々の記憶から静かに消え、ただ一冊の美しい和歌が記された本だけが棚に残されていた。'
style_notes: 和語を多用し、五感（風の音、香の匂い、衣の擦れる音）を丁寧に描写すること。物語の節目には、情景や心情を詠んだ和歌を挿入し、情緒的な余韻を残す。語り口は、まるで古い巻物を紐解くような、柔らかくも凛とした響きを持たせる。
