- name: エリナ・ヴァレンタイン
  role: 主人公
  age: 19
  gender: 女性
  appearance: 琥珀色の瞳と、少し癖のある茶髪。動きやすさを重視した簡素な料理服を纏っている。
  personality: 真面目で感受性が強く、少し繊細。納得するまで突き詰める努力家。「私」。
  speech_style: 丁寧な口調だが、感情が昂ると少し早口になる。
  background: 亡き母の味を再現したいという強い願いを持ち、父のいる空中都市へとやってきた料理人志望の少女。
  motivation: 母の味の正体を見つけ出し、父との心の溝を埋めること。
  relationships:
  - name: カイアス・ヴァレンタイン
    relation: 父
  - name: ルカ・セレスティアル
    relation: 協力者
  arc: 過去の記憶を「失われたもの」として追い求める段階から、記憶を「今を生きる力」として受け入れる段階へ変化する。
- name: カイアス・ヴァレンタイン
  role: 主要脇役
  age: 52
  gender: 男性
  appearance: 深い皺と日焼けした肌、無精髭。使い込まれた船長の制服を常に着ている。
  personality: 無口で頑固、不器用。感情を表に出すことを避けている。「俺」。
  speech_style: 短文で、ぶっきらぼうな口調。
  background: 巨大穀物船の船長。妻を亡くして以来、娘に対しても壁を作り、航海と船の維持にのみ没頭している。
  motivation: 船と乗組員の命を、空の荒波から守り抜くこと。
  relationships:
  - name: エリナ・ヴァレンタイン
    relation: 娘
  arc: 娘を突き放すことで自分を守っていた殻を破り、共に食卓を囲む勇気を持つ。
- name: ルカ・セレスティアル
  role: 脇役（導き手）
  age: 27
  gender: 男性
  appearance: 銀縁の眼鏡、書物の香りがする長いローブ。物静かで落ち着いた佇まい。
  personality: 冷静沈着で博識。知識に対する敬意を忘れない。「僕」。
  speech_style: 穏やかで理知的、少し古風な言い回しを用いる。
  background: 地下図書館の書庫管理人。膨大な記録を管理し、失われた知識を収集・保護している。
  motivation: 忘れ去られた物語やレシピを、それを必要とする者へ届けること。
  relationships:
  - name: エリナ・ヴァレンタイン
    relation: 知人・協力者
  arc: 記録としてのみ扱っていた「人の想い」が、料理という形を通じて他者に与える影響を実感する。
