title: 琥珀色の記憶と、空を往く食卓
genre: ヒューマンドラマ
tone: 静謐で温かく、懐かしさに満ちた雰囲気
pov: 三人称
tense: 過去形
setting: 浮遊島が点在する空中都市、およびその地下に広がる広大な書庫
premise: 空を飛ぶ巨大な穀物船を操る老船長と、亡き母の味を忘れてしまった娘の物語。娘は、ある日偶然見つけた「地下図書館」の片隅で、失われたレシピが綴られた古い書物と出会う。それは、かつて家族が分かち合った、今はもう再現できないはずの料理の記憶だった。空飛ぶ船の揺れと、地下の静寂の中で、二人は失われた時間を食卓へと呼び戻していく。
themes:
- 家族の絆の再生
- 記憶と食の繋がり
rules:
- 地下図書館には、世界中の人々の「忘れられた記憶」が本として収蔵されている
- 空飛ぶ船は、特定の香りを頼りに航路を決定する
plot_outline:
- '序盤: 亡き母を追って空中都市へやってきた料理人志望の娘が、父との距離感に悩みながら、孤独な船乗り生活を送る父の傍らで暮らす日々。'
- '中盤: 都市の底に眠る「地下図書館」で、母がかつて愛読していた日記と、そこにある隠されたレシピを見つける。それは、空飛ぶ船の航海中にしか作れなかった特別なスープの作り方だった。'
- '終盤: 父が航海中に病に倒れ、船が霧の中で迷う。娘は母のレシピを頼りに、船の乗組員たちに温かな料理を振る舞い、その香りで父を呼び戻す。'
- '結末: 料理を通じて父と語り合い、母の不在を認めつつも、新しい家族の形として共に食卓を囲む決意をする。空には今日も、穏やかな風と共に船が流れていく。'
style_notes: 三人称視点で、静かで温かなトーンを維持する。台詞は多くなりすぎず、日常の何気ない会話の中に、長い年月を経て積み重なった家族の重みを感じさせること。特に料理の調理過程や味の描写においては、その食材や調理法が家族のどのような思い出と結びついているかを丁寧に綴り、食卓を物語の象徴とする。
