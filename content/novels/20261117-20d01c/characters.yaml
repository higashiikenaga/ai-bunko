- name: 紬（つむぎ）
  role: 主人公
  age: 28
  gender: 女性
  appearance: 落ち着いた茶色の髪を後ろで緩く結んでいる。清潔感のある麻のエプロンを愛用し、指先には細かな針仕事の跡がある。穏やかな目元が特徴。
  personality: 穏やかで聞き上手。物事の表面だけでなく、その裏にある背景を大切にする。一人称は「私」。
  speech_style: 丁寧でゆったりとした口調。「～ですね」「～でしょうか」といった、相手を包み込むような話し方。
  background: 都会での慌ただしい生活に疲れ、亡くなった祖父が遺した岬の灯台と小さな繕い物屋を継いだ。静かな海辺での暮らしに安らぎを感じている。
  motivation: 持ち主の記憶がこもった品を丁寧に直し、訪れる人々の心を解きほぐすこと。
  relationships:
  - name: 蓮
    relation: 修繕の依頼人
  - name: 佐藤さん
    relation: 近所の理解者
  arc: 繕い物を通じて他者の深い悲しみや願いに触れることで、自分自身の生き方や、受け継いだ灯台の役割を再確認していく。
- name: 蓮（れん）
  role: 旅人 / 依頼人
  age: 32
  gender: 男性
  appearance: 少しやつれた表情をした、どこか影のある青年。使い込まれたバックパックを背負い、季節外れの薄いコートを着ている。
  personality: 内向的で言葉を選ぶタイプ。過去の出来事に囚われているが、誠実な人柄。一人称は「僕」。
  speech_style: 物静かで控えめ。「……すみません」「少し、お願いしたいことがあって」といった、ためらいを含んだ話し方。
  background: かつて家族と共に過ごした大切な記憶を、一枚の古い布に託している。その布がボロボロになったことで、自分の中の繋がりも失われつつあると感じている。
  motivation: 色あせた布を修繕してもらうことで、止まってしまった自分の時間と向き合うこと。
  relationships:
  - name: 紬
    relation: 修繕師
  arc: 布の修繕を通じて、過去を「失われたもの」として嘆くのではなく、「共に歩む思い出」として受け入れる強さを得る。
- name: 佐藤さん（さとうさん）
  role: 脇役
  age: 72
  gender: 女性
  appearance: 小柄で背中が少し丸まっているが、足取りは軽い。いつも明るい色のスカーフを巻いており、表情が豊か。
  personality: おせっかいだが非常に温かい、町の情報通。紬の良き相談相手。一人称は「あたし」。
  speech_style: 威勢が良く、親しみやすい。「紬ちゃん、今日もいい香りね！」「あらあら、大変だわ」といった、明るい口調。
  background: 岬の町に長く住む元漁師の妻。紬が灯台に移り住んできた時から、食事を差し入れたり世間話をしたりと見守っている。
  motivation: 紬がこの岬で孤独にならず、町の人々と共に穏やかに暮らしていくことを見守ること。
  relationships:
  - name: 紬
    relation: 近所の世話焼き
  arc: 物語の安定した日常を象徴する存在として、紬と蓮の心の変化を温かく見守る役割を果たす。
