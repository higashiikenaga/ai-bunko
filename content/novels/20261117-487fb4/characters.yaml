- name: カイト・レイ
  role: 主人公
  age: 24
  gender: 男性
  appearance: 酸性雨に濡れた黒いトレンチコートを着込み、右こめかみに古い規格の神経接続ポート露出している。常に気だるげで、目の下に深いクマがある。
  personality: 冷め切った現実主義者だが、根底には捨てきれない義理堅さがある。一人称は「俺」。
  speech_style: ボソボソと呟くように、短く冷淡な口調で話す。「〜だろ」「知らねぇよ」が口癖。
  background: 非合法なデータの物理輸送を請け負う「運び屋」。過去のトラブルで自身の脳内チップも旧式化しており、最新のトレンドには背を向けて生きている。
  motivation: 高額な報酬と依頼の完遂、そして亡き旧友の残した因縁に決着をつけるため。
  relationships:
  - name: ナナ
    relation: バディ・情報屋
  - name: ヴォイド
    relation: 敵対者・元同僚
  arc: 「音のない世界」へ放逐される代償と引き換えに、都市全体を救う英雄となり、自身の死すらも都市伝説としてネットに飲み込まれていく。
- name: ナナ・シノノメ
  role: 相棒
  age: 20
  gender: 女性
  appearance: 鮮やかなネオンピンクのショートヘアに、顔の半分を覆うデジタルゴーグルを装着している。電脳街のストリートファッションに身を包む。
  personality: 好奇心旺盛でハッキングの腕は超一流だが、やや危なっかしい面がある。一人称は「あたし」。
  speech_style: テンポが早く、ネットスラングを多用する。「マジかよ」「チョーやばくない？」といったフランクな口調。
  background: 九龍電脳街の裏社会で生きる天才ネットランナー。カイトの過去を知る数少ない理解者。
  motivation: カイトのサポートをしつつ、ネットの深層に眠る巨大な秘密と自身の存在証明を暴くこと。
  relationships:
  - name: カイト・レイ
    relation: 相棒・信頼する運び屋
  arc: カイトの消失後、彼の遺志と最後の「伝説」をネットの海へ語り継ぐ語り部となる。
- name: ヴォイド / 黒瀬 零
  role: 敵役
  age: 28
  gender: 男性
  appearance: 白を基調としたハイエンドなサイバーウェアに身を包み、表情の読めない美しい義眼を持つ。常に完璧に整えられた身なりをしている。
  personality: 狂気的なまでのカリスマ性と、冷徹な理性を併せ持つ。人類の意識統合を企む。一人称は「私」。
  speech_style: 尊大かつ詩的で、どこか宗教的な含みを持たせた静かな口調。「耳を澄ませば、救済が聞こえる」が口癖。
  background: かつて巨大テック企業の天才開発者だったが、ネットワークの深層で「意識の集合体」と接触し、人間の個性を全否定する思想にとりつかれた。
  motivation: 「死の周波数」の同時配信によって、九龍電脳街の全市民の脳をハックし、一つの巨大な意識へ統合すること。
  relationships:
  - name: カイト・レイ
    relation: かつての同僚・阻止すべき障壁
  arc: 計画の最終段階でカイトに阻止され、自身の野望と共にネットワークの深層へと霧散する。
