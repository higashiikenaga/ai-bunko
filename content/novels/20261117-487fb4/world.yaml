title: 拡散する死のノイズ ―断末魔のパルス―
genre: サイバーパンク
tone: 加速する恐怖、デジタルな不気味さ、焦燥感
pov: 三人称近接視点
tense: 現在進行形・過去形混合
setting: ネオンと酸性雨に濡れた超巨大都市「九龍電脳街（クーロン・サイバーシティ）」。全市民が脳内チップでネットワークに常時接続されている近未来。
premise: ネット上の限定コミュニティで囁かれる「特定の周波数を聞くと、脳内のチップが暴走して死ぬ」という都市伝説。しかし、その噂がバズるたびに、実際にチップが焼き切れる死者が急増していく。運び屋の青年・カイトは、死の間際に送信された不可解な音声ログを回収する依頼を受ける。それは、祭りの夜の喧騒に紛れて配信される、世界をバグらせる「死の音」の正体だった。
themes:
- 情報の拡散と実体化
- デジタルと霊性の境界
rules:
- 噂（データ）の流通量と、怪異の物理的破壊力は正比例する
- 脳内チップは、特定の高周波パルスに脆弱である
- ネット上の書き込みは、その瞬間に現実に影響を与える『呪詛』として機能する
plot_outline:
- '序盤: 深夜の電脳街。カイトは、バズり中の怪談『死の周波数』の被害者から、破損したメモリーチップを回収する。SNSのタイムラインには、死に際の断末魔を模したようなノイズ動画が溢れ、恐怖は爆発的に拡散していく。'
- '中盤: 噂が広がれば広がるほど、街のサイネージや個人のデバイスから、正体不明のノイズが漏れ出す。カイトは、そのノイズが「祭りの夜」の祝祭音に偽装して配信される計画を察知する。情報収集の過程で、スマホの画面越しに「自分を見ている」怪異の視線を感じる。'
- '終盤: 祭りの夜、街中の巨大ホログラムとスピーカーが、全世界へ向けて「最凶のノイズ」を同時配信しようとする。カイトは、夜明けのラジオから流れるはずの静寂を取り戻すため、ネットワークの深層へとダイブする。'
- '結末: ノイズの正体は、かつてネットワークに消えた意識の集合体だった。カイトはノイズを物理的に遮断するが、代償として自身の脳内チップも破壊され、彼は「音のない世界」へと放逐される。しかし、彼の死すらも新たな『都市伝説』としてネットにアップロードされていく。'
style_notes: 短文を多用し、スピード感を重視。スマホの通知音やSNSの書き込み（「まじで死ぬ」「これ、ヤバいって」「……誰か見てる」等）を視覚的に挿入し、読者が画面越しに恐怖を感じる演出を行う。怪異の描写は直接的ではなく、デジタルノイズやバグ、通信エラーの表現を用いて間接的に表現すること。
