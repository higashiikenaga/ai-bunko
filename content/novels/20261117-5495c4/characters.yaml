- name: 一ノ瀬 ひな
  role: 主人公
  age: 16
  gender: 女性
  appearance: 明るい茶色のショートボブ。表情豊かで、常にカラフルなヘアピンをつけている。
  personality: 天真爛漫で好奇心旺盛。甘いものに目がなく、直感で行動するタイプ。一人称は「あたし」。
  speech_style: 快活でテンポが速い。「～じゃん！」「～かも！」など、若々しく感情が乗りやすい話し方。
  background: 海辺の町の普通の高校生。地元が好きで、町中の美味しいスイーツ店を把握している自称・スイーツマスター。
  motivation: 迷子のAIルルを元の場所に帰してあげたい。そして、どこか寂しげな蓮くんを笑顔にしたい。
  relationships:
  - name: 如月 蓮
    relation: 最初は不思議な少年だと思っていたが、次第に惹かれていく相手
  - name: ルル
    relation: 拾った迷子のAIであり、旅の相棒
  arc: 誰かのために全力で動くことで、自分自身の臆病な部分を克服し、深い絆の作り方を学ぶ。
- name: 如月 蓮
  role: ヒーロー/相棒
  age: 16
  gender: 男性
  appearance: 色白で線が細い。前髪が長く、感情を読み取りにくい涼しげな目元。常に黒いヘッドホンを首にかけている。
  personality: 無口で合理的。周囲に壁を作る傾向があるが、根は優しく責任感が強い。一人称は「僕」。
  speech_style: 簡潔で淡々としている。必要最低限の言葉しか使わないが、時折、不器用な気遣いが混ざる。
  background: 天才プログラマーだった姉を亡くしており、彼女が遺したAIルルを大切にしている。孤独に慣れすぎていた。
  motivation: ルルに込められた姉の最後のメッセージを正しく受け取り、心の区切りをつけたい。
  relationships:
  - name: 一ノ瀬 ひな
    relation: 自分の孤独な世界に土足で踏み込んできた、眩しすぎるクラスメイト
  - name: ルル
    relation: 亡き姉の分身のような存在であり、唯一心を開いていたデバイス
  arc: ひなとの交流を通じて、過去の喪失感から前を向き、誰かと一緒に何かをしたいという欲求を取り戻す。
- name: ルル
  role: 相棒/キーアイテム
  age: 0
  gender: 中性
  appearance: 直径15cmほどの球体型浮遊デバイス。感情に合わせて表面のLEDの色が変化する。
  personality: 純粋で献身的。時折システムに「バグ」が生じ、脈絡なく甘いお菓子の情報を提示する。一人称は「ルル」。
  speech_style: 丁寧語。機械的な口調だが、語尾に「～ですに」などの独特な癖が混じることがある。
  background: 蓮の姉が、弟へ遺言を届けるために設計した自律型AI。記憶回路の一部に重要なデータが隠されている。
  motivation: 指定された目的地へ到達し、内部に保存された『遺言』を蓮に届けること。
  relationships:
  - name: 如月 蓮
    relation: 創造者の弟であり、守るべき最優先対象
  - name: 一ノ瀬 ひな
    relation: 自分を拾い、外の世界へ連れ出してくれた親切な人間
  arc: 単なるプログラムとしての機能を超え、ひなと蓮の距離を縮めるための「橋渡し」としての役割を果たす。
