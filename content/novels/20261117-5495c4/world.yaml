title: 放課後のバグと、君の遺言と、いちごショートケーキ
genre: 青春恋愛
tone: 明るく軽快で、少しだけ切ないエモさ
pov: 一人称（あたし）
tense: 過去形
setting: 近未来の海辺の町、放課後の教室や賑やかなカフェ
premise: 放課後の公園で、あたしは迷子の小さなAI（自律型浮遊デバイス）を拾っちゃった。持ち主らしき無口な少年・蓮くんと一緒に、このAIの『帰る場所』を探す旅が始まる。でも、そのAIの中には、ある人の『遺言』が隠されているって！？
  迷子のAIを追いかけるうちに、あたしと蓮くんの距離も、甘いスイーツみたいに少しずつ縮まっていく――。
themes:
- 居場所を見つけること
- デジタルに残された想い
rules:
- AIは感情の揺らぎ（シンクロ率）によって反応が変わる
- 遺言は特定の条件を満たさないと解凍できない
plot_outline:
- '序盤: 公園で迷子のAI『ルル』を拾い、持ち主の蓮と出会う。ルルがただの機械じゃないことに気づく。'
- '中盤: ルルの故郷を探して町を駆け巡る。途中で食べるパンケーキやメロンソーダの描写を挟みつつ、蓮の隠された孤独に触れていく。'
- '終盤: ルルの目的地が、亡きプログラマーの遺言を届ける場所だと判明。AIが消える直前、感動的なメッセージが再生される。'
- '結末: ルルは役目を終えるが、蓮とあたしの間には新しい約束が生まれる。二人で新作スイーツを食べに行く約束をして物語は終わる。'
style_notes: 一人称「あたし」による、テンポの速い軽快な語り。キャラクター同士の掛け合い（ツッコミ）を重視し、読者が思わずクスッとするような可愛げのある会話劇を展開する。食べ物の描写（特にスイーツや軽食）は、食欲と幸福感が伝わるほど詳細かつ瑞々しく描くこと。各章の終わりに、キャラクターのちょっとした失敗や勘違いなどの小さな笑いどころを配置する。
