- name: 瀬戸 蓮 (せと れん)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 鋭い眼差しだが、どこか影のある表情。以前より細身になったが、体幹は引き締まっている。
  personality: 内向的でストイック。挫折からくる焦燥感を抱えている。一人称は「俺」。
  speech_style: 言葉数は少なく、淡々としているが、芯の強さを感じさせる。
  background: かつては名門校のエース候補だったが、膝の怪我でバスケを断念。再起をかけて弱小校へ編入する。
  motivation: かつての親友と交わした約束を果たし、バスケを通じて自分の存在を証明すること。
  relationships:
  - name: 神崎 拓海
    relation: かつての親友であり、現在の最大のライバル
  - name: 佐伯 健斗
    relation: 弱小校バスケ部のキャプテンであり、理解者
  arc: 挫折による自己否定から、仲間と共に戦う喜びを知り、再びコートに立つ勇気を取り戻す。
- name: 神崎 拓海 (かんざき たくみ)
  role: 敵役 / ライバル
  age: 17
  gender: 男性
  appearance: 圧倒的な体格と、コート上で周囲を威圧するオーラを持つ。常に自信に満ちた笑みを浮かべている。
  personality: 傲慢に見えるほど自信家だが、努力を怠らない天才肌。一人称は「俺」。
  speech_style: 自信に溢れ、相手を挑発するような軽快な口調。
  background: 瀬戸の元親友。現在は全国レベルの強豪校のエースとして、瀬戸がかつていた場所に立っている。
  motivation: 瀬戸との「約束の丘」での誓いを、自分なりの形で超え続けること。
  relationships:
  - name: 瀬戸 蓮
    relation: かつての親友であり、唯一心を揺さぶるライバル
  arc: 瀬戸の再起を目の当たりにし、単なる勝利ではなく「対等な戦い」を求めるようになる。
- name: 佐伯 健斗 (さえき けんと)
  role: 相棒 / 脇役
  age: 17
  gender: 男性
  appearance: 小柄だが筋肉質。常に汗をかいており、チームを鼓舞する明るい表情。
  personality: 熱血でポジティブ。どんな逆境も楽しもうとする。一人称は「俺」。
  speech_style: 声が大きく、語尾が跳ねるような元気な話し方。
  background: 弱小校バスケ部のキャプテン。技術はないが、チームの結束力を高める天才。
  motivation: 県大会出場という、部員全員の夢を叶えること。
  relationships:
  - name: 瀬戸 蓮
    relation: 衝突しながらも、次第に信頼を寄せるチームメイト
  arc: 瀬戸という個人の才能に頼るのではなく、チームとしての「呼吸」を確立させるリーダーへと成長する。
- name: 高木 結衣 (たかぎ ゆい)
  role: 脇役
  age: 17
  gender: 女性
  appearance: 眼鏡をかけた知的な印象。常にノートやタブレットを持ち歩いている。
  personality: 冷静沈着で分析好き。感情に流されず、客観的な視点を持つ。一人称は「私」。
  speech_style: 丁寧だが、的確に核心を突く論理的な話し方。
  background: バスケ部のマネージャー。データ分析を駆使して、弱小チームの戦術を支える。
  motivation: チームの戦術的な弱点を克服し、勝利に貢献すること。
  relationships:
  - name: 瀬戸 蓮
    relation: 彼のプレーをデータで支え、精神的な変化を観察する存在
  arc: 数値化できない「熱量」や「呼吸」の重要性を理解し、データの枠を超えたサポートを行うようになる。
