title: 逆転の呼吸 ―約束の丘から、最終列車へ―
genre: スポーツ青春
tone: 熱く、泥臭く、心臓の鼓動が聞こえるような臨場感
pov: 一人称（俺）
tense: 過去形
setting: 現代、地方の公立高校、激戦区のバスケットボール部
premise: 怪我でバスケを諦めかけた「俺」が、かつての親友と交わした「約束の丘」での誓いを胸に、弱小チームで再びコートに立つ。地獄のような基礎練習、肺が焼けるような激しい試合。すべてを懸けた最後のトーナメントが、俺たちの青春の終わりを告げる。掴み取るのは栄光か、それとも「最終列車」のように過ぎ去る後悔か。
themes:
- 挫折からの再起
- 積み重ねの証明
rules:
- バスケットボールの公式ルールに基づき、身体的なリアリティを追求する
- 試合描写は、選手の視覚、聴覚、そして呼吸の乱れを主軸とする
plot_outline:
- '序盤: 怪我による挫折と、再起のための孤独な自主練。弱小校への編入と、チームメイトとの衝突。'
- '中盤: 徹底的な基礎練習によるチームの底上げ。ライバルとの再会と「約束の丘」の回想。予選突破。'
- '終盤: 県大会決勝。極限の疲労の中での、呼吸さえも武器にする死闘。劇的な逆転劇。'
- '結末: 勝利の後の静寂。最終列車のホームで、仲間と語らう新しい景色。'
style_notes: 一人称『俺』。試合は、心臓の音、汗の匂い、肺の焼ける感覚を、短い文で叩きつけるように書け。練習の泥臭さは、筋肉の痛みを感じるほど丁寧に描き込め。その積み重ねが、試合での一撃の爆発力を生む。実況のようなテンポで、観客の熱気とコートの熱狂を叩き込め！
