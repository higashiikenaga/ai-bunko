- name: 神楽坂 誠一郎
  role: 主人公
  age: 38
  gender: 男性
  appearance: 鋭い眼差しと整った顔立ち。常に仕立ての良い三つ揃えのスーツを着用し、懐中時計を愛用している。
  personality: 冷静沈着で極めて論理的。感情に流されず、真実のみを追求する。一人称は「私」。
  speech_style: 理路整然とした、無駄のない丁寧な敬語。
  background: 元官吏の法務官。現在は私立探偵として、不可解な事件の解決を請け負っている。
  motivation: 不可能犯罪の背後にある、物理的な矛盾と人間の論理を解明すること。
  relationships:
  - name: 浅葱 律
    relation: 同行者であり、記録係
  arc: 冷徹な観察者として事件に接するが、犯人の動機に触れることで、人間の業に対する複雑な感情を抱くようになる。
- name: 浅葱 律
  role: 相棒/語り手
  age: 26
  gender: 男性
  appearance: 眼鏡をかけた知的な風貌。線の細い、穏やかで清潔感のある青年。
  personality: 感受性が豊かで観察眼に優れるが、臆病で慎重な性格。一人称は「私」。
  speech_style: 標準的で丁寧な、教養を感じさせる話し方。
  background: 文学青年。神楽坂の助手として、事件の経過を記録する役割を担っている。
  motivation: 神楽坂の推理を間近で見守り、その驚異的な論理を言葉として残すこと。
  relationships:
  - name: 神楽坂 誠一郎
    relation: 師であり、信頼する友人
  arc: 事件の凄惨さと人間の醜悪さを目の当たりにし、単なる傍観者から、真実の重みを知る大人へと成長する。
- name: 橘 冴子
  role: 敵役/容疑者
  age: 29
  gender: 女性
  appearance: 流麗な着物姿が美しい、どこか影のある端麗な女性。常に感情を読み取らせない無表情を保っている。
  personality: 冷静沈着で計算高い。一族の誇りを重んじるが、内面に激しい情念を秘めている。一人称は「わたくし」。
  speech_style: 極めて優雅で、格式高い、よそよそしい言葉遣い。
  background: 没落しかけている橘家の令嬢。被害者である宗助の姪にあたる。
  motivation: 一族の秘密を守り、自らの地位と権利を確固たるものにすること。
  relationships:
  - name: 橘 宗助
    relation: 叔父（被害者）
  arc: 高潔な令嬢としての仮面を維持しようとするが、追い詰められるにつれ、隠していた残酷な本性が露わになる。
- name: 葛城 健三
  role: 脇役/容疑者
  age: 45
  gender: 男性
  appearance: 日焼けした肌と、がっしりとした体格。無骨な作業着を好む、荒々しい印象の男。
  personality: 短気で疑り深く、直情的な性格。権威を嫌う。一人称は「俺」。
  speech_style: 荒っぽいが、どこか理知的な響きが混じる、粗野な口調。
  background: 島に土地を持つ地主であり、橘家とは長年、土地の利権を巡って確執がある。
  motivation: 橘家から不当に奪われた土地と権利を取り戻すこと。
  relationships:
  - name: 橘 宗助
    relation: 長年の敵対関係にある人物
  arc: 事件の容疑者として疑われるが、真相が明らかになる過程で、自身の復讐心の空虚さを知る。
