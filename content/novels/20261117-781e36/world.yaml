title: 緋桜の密室
genre: 本格ミステリー
tone: 静謐で知的、古典的な格調高い文体
pov: 一人称（探偵を観察する友人・助手役）
tense: 過去形
setting: 昭和初期、断崖に囲まれた孤島の古い屋敷と廃灯台
premise: 絶壁に咲く稀少な「緋桜」が見頃を迎える頃、島に招かれた客の一人が、完全に密室となった廃灯台の頂上で死んでいるのが発見される。遺体の傍らには、季節外れの「枯れた桜の花びら」が散っていた。名探偵・神楽坂は、現場に残された些細な違和感から、不可能犯罪の裏に隠された残酷な論理を導き出す。
themes:
- 喪失と贖罪
- 論理の勝利
rules:
- 犯行時刻の間、灯台への唯一の階段は第三者によって監視されており、出入りは不可能であった。
- 灯台の扉は内側から強固な閂（かんぬき）がかけられており、外部からの操作は不可能である。
- 提示されるすべての物証（花びらの状態、潮の満ち引き、時計の狂い）が、解決のための唯一の根拠となる。
plot_outline:
- '序盤: 語り手である「私」と探偵の神楽坂が、旧友の遺産相続に集まるため、緋桜が咲き誇る絶壁の島を訪れる。不穏な空気の中、嵐によって島が外界から遮断される。'
- '中盤: 灯台の頂上で、密室状態の遺体が発見される。容疑者は島にいた5人の親族。神楽坂は現場に落ちていた「枯れた花びら」と、灯台のレンズに付着した奇妙な跡に注目し、聞き込みを行う。'
- '終盤: 神楽坂が全員を集め、灯台の構造と桜の開花特性、そして物理的な死角を利用したトリックを論理的に解明し、犯人を指し示す。'
- '結末: 犯人が動機を告白し、事件の全貌が明らかになる。散りゆく桜の中で、神楽坂は静かに事件の終焉を確信し、島を後にする。'
style_notes: 叙述は丁寧かつ重厚に行い、読者に手がかりを等しく提示して論理的な飛躍を排した演繹法による解決を描く。ワトソン役の視点から、探偵の超然とした態度と鋭い洞察力を対比させ、知的な快感を提供することに徹する。
