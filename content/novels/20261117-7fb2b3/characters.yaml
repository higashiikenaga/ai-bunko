- name: 黍凪 蓮司
  role: 主人公
  age: 24
  gender: 男性
  appearance: 煤けた作業着、無骨だが手入れの行き届いた指先、深い茶色の瞳。常にどこか疲れを帯びているが、眼光だけは澄んでいる。
  personality: 穏やかで忍耐強い。目の前の生活を慈しむ現実主義者。一人称は「僕」。
  speech_style: 丁寧だが、芯の強さを感じさせる静かな話し方。
  background: 港町の靴直し職人。開国による混乱の中で家族を失い、戦火を避けて静かな日常を求めて生きている。
  motivation: 戦火の中で拾った壊れた懐中時計の持ち主を探し出し、失われた大切な時間（記憶）を取り戻すこと。
  relationships:
  - name: 不知火 海斗
    relation: 幼馴染であり、現在は立場が異なる旧友
  arc: 時代の荒波から逃げていた傍観者から、大切な記憶と人々の明日を守るために立ち上がる当事者へと変化する。
- name: 不知火 海斗
  role: 主人公/対照的な存在
  age: 32
  gender: 男性
  appearance: 漆黒の海軍将校服、鋭い眼光、左頬に古い傷跡。鍛え上げられた体躯を持つ。
  personality: 冷静沈着で合理的。国家の存亡を最優先する。一人称は「私」。
  speech_style: 規律正しく、威厳のある軍人口調。
  background: 新政府海軍の提督。蒸気機関による軍備近代化を推進する急進派の旗手。
  motivation: 列強の侵攻を防ぐため、鋼鉄の楔（近代兵器）をもって国を守り抜くこと。
  relationships:
  - name: 黍凪 蓮司
    relation: かつての親友
  - name: 西園寺 彩芽
    relation: かつての戦友であり、現在は反乱軍の指導者
  arc: 国家の理想と個人の情愛の間で葛藤し、真に守るべきものは「形ある国」か「人々の心」かを問い直す。
- name: 西園寺 彩芽
  role: 敵役/悲劇的象徴
  age: 28
  gender: 女性
  appearance: 伝統的な絹の着物に、近代的な軍用ナイフを帯びている。凛とした美しさを持つ。
  personality: 誇り高く、情熱的。古い秩序と美学を絶対視する。一人称は「我」。
  speech_style: 古風で高潔な、貴族的な話し方。
  background: 旧体制の貴族の末裔。新政府による急速な近代化が国の魂を汚すと信じ、反乱軍を率いる。
  motivation: 蒸気の黒煙に汚される前の、伝統ある美しい「ニホン」を取り戻すこと。
  relationships:
  - name: 不知火 海斗
    relation: かつての戦友であり、信念を違えた宿敵
  arc: 変わらぬ価値観に固執して破滅へと突き進むが、最期には時代の流れを静かに受け入れ、散っていく。
- name: エレナ・ロッシ
  role: 脇役/媒介者
  age: 22
  gender: 女性
  appearance: 西洋風の航海服、頭にゴーグルを乗せている。明るい金髪と好奇心に満ちた瞳。
  personality: 好奇心旺盛で実利主義。新しい技術を愛する。一人称は「私」。
  speech_style: 直截的で、少し早口な、文化の混ざった話し方。
  background: 列強の商船に同乗している技師の娘。世界が激変する様子を記録するために「ニホン」へやってきた。
  motivation: 異なる文化と技術が衝突し、混ざり合う瞬間に立ち会い、その記録を後世に残すこと。
  relationships:
  - name: 黍凪 蓮司
    relation: 港町で出会った、技術を理解しようとする友人
  arc: 外部の観察者として関わっていたが、紛争の痛みを目の当たりにし、技術が持つ責任を自覚する。
