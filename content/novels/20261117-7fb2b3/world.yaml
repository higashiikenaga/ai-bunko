title: 群青の潮騒と、鋼鉄の楔
genre: 群像劇
tone: 大いなる時代のうねりと名もなき人々の営みを叙情的に描く歴史群像劇
pov: 三人称（章ごとに視点人物が交代）
tense: 過去形
setting: 蒸気機関と帆船が混ざり合う架空の島国「ニホン」の激動の近代移行期
premise: 鎖国を解いた島国に黒煙を上げる列強の魔の手が迫る中、時代の潮流に翻弄される人々が交錯する。海軍提督から街の靴直し職人まで、それぞれの正義と生活を守るための戦いが始まった。分断された世界をつなぐのは、失われた時間を取り戻そうとする個人の記憶と小さな誓いである。
themes:
- 時代の転換点における個人の選択
- 市井の人々のレジスタンス
- 近代化の代償
rules:
- 魔法や超能力は存在せず、技術は19世紀末相当の蒸気・機械文明に限定する
- 歴史の大局は変えられないが、個々の運命の選択は悲喜こもごもの結末を生む
plot_outline:
- '序盤: 開国を迫る外洋船団の到来により、王都の貴族から港町の漁師までがざわめき始める。それぞれの日常が揺らぎ出す。'
- '中盤: 新政府による徴兵と旧体制の反乱が勃発し、内戦の炎が国土を焼き尽くす。ある靴職人は戦火の中で壊れた懐中時計を拾う。'
- '終盤: 最後の決戦の地「約束の丘」へ向けて、立場を変えた旧友や家族たちがそれぞれの理由で集結する。'
- '結末: 戦争は終結し、新たな時代が幕を開ける。生き残った人々は痛みを抱えながらも、それぞれの明日へ歩き出す。'
style_notes: 大河内蒼の文体。大きな歴史のうねりを俯瞰しつつ、貴族や軍人だけでなく、名もなき庶民の日常のディテールと切実な視点を必ず挿入する。感情を過剰に煽らず、淡々とした筆致の中に熱量を込める。
