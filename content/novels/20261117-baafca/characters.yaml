- name: 湊 誠一郎（みなと せいいちろう）
  role: 主人公
  age: 22
  gender: 男性
  appearance: 都会的な丸眼鏡に、古びた外套を羽織っている。痩身で、都会での生活による疲労が色濃い隈がある。
  personality: 理性的で懐疑的。情に厚いが、村の閉鎖的な空気感に強い拒絶感を抱いている。一人称は「僕」。
  speech_style: 標準語。丁寧だが、核心を突く際は鋭く、問い詰めるような話し方になる。
  background: 鴉鳴村の出身だが、数年前に学問を修めるため上京した。実家の不幸と妹の異変を知らせる手紙を受け、村に帰郷する。
  motivation: 失踪した妹の行方を突き止め、村の不可解な慣習の正体を暴くこと。
  relationships:
  - name: 湊 栞
    relation: 最愛の妹。彼女を守るために奔走する。
  - name: 鴉鳴 権三郎
    relation: 村の権力者であり、価値観が対立する敵対関係。
  arc: 都会的な理性で事態を解決しようとするが、人智を超えた怪異に直面し、絶望の中で生き残る唯一の人間となる。
- name: 湊 栞（みなと しおり）
  role: 物語の鍵を握る犠牲者
  age: 16
  gender: 女性
  appearance: 透き通るように白い肌と、どこか遠くを見ているような虚ろな瞳。白いリボンを髪に結んでいる。
  personality: 内向的で感受性が強く、鳥の鳴き声や機械の振動に共鳴しやすい。一人称は「私」。
  speech_style: 囁くような静かな口調。時折、自分ではない誰かが喋っているような乖離した言い回しをする。
  background: 兄とは対照的に村に残り、幼い頃から「鉄の肺」の調整に携わる神職の助手として育てられた。
  motivation: 村の平穏を維持したいという義務感と、ここではないどこかへ飛び去りたいという渇望の板挟みになっている。
  relationships:
  - name: 湊 誠一郎
    relation: 慕っていた兄。彼にだけは真実を伝えたかった。
  - name: 鴉鳴 権三郎
    relation: 絶対的な庇護者であり、同時に自分を部品として扱う支配者。
  arc: 純真な少女から、蒸気機関に魂を吸い込まれ、異形の神の依代へと変貌していく。
- name: 鴉鳴 権三郎（あめい ごんざぶろう）
  role: 敵役
  age: 68
  gender: 男性
  appearance: 深く刻まれた皺と、油に汚れた祭祀装束を纏っている。常に蒸気の匂いが染み付いた皮膚を持っている。
  personality: 狂信的で支配欲が強い。村の存続のためなら個人の犠牲は当然だと信じて疑わない。一人称は「我」。
  speech_style: ねっとりとした不気味な村の方言。相手を威圧し、懐に誘い込むような話し方。
  background: 代々「鉄の肺」を管理する鴉鳴家の当主。蒸気機関の仕組みと、鳥の魂を燃料にする禁忌の儀式を完全に把握している。
  motivation: 渡り鳥が途絶えたことで機能不全に陥った祭祀装置を、新たな生贄（人間）を用いて再起動させること。
  relationships:
  - name: 湊 誠一郎
    relation: 村の秩序を乱す不純物として排除、あるいは利用しようとする対象。
  - name: 湊 栞
    relation: 最高の『部品』として育て上げた作品。
  arc: 神への盲信により村を救おうとするが、最終的に制御不能となった機械と神に飲み込まれ、無惨な最期を遂げる。
- name: 葛葉 佳代（くずは かよ）
  role: 相棒/案内人
  age: 21
  gender: 女性
  appearance: 日焼けした肌に、使い込まれた作業着のような着物を着ている。鋭い眼光と、しなやかな肢体を持つ。
  personality: 現実的で皮肉屋。村の因習を嫌悪しているが、生き抜くために表面上は従っている。一人称は「あたし」。
  speech_style: ぶっきらぼうで口が悪いが、要所で湊を気遣うぶっきらぼうな優しさがある。
  background: かつて祭祀から追放された家系の末裔。村の中で「汚れた血」として疎外されており、地下の構造に詳しい。
  motivation: 村の呪縛から逃れること。湊という外部の人間を利用して、この地を脱出したいと考えている。
  relationships:
  - name: 湊 誠一郎
    relation: 唯一信頼できそうなよそ者。協力関係にある。
  - name: 鴉鳴 権三郎
    relation: 憎悪の対象であり、同時に絶対的な恐怖を感じる存在。
  arc: 諦めの中で生きていたが、湊の必死な姿に感化され、自らの意志で禁忌の扉を開く勇気を持つ。
