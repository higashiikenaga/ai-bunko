title: 鉄肺の村と、渡りぬる鳥の葬列
genre: 怪談・民俗
tone: 静謐な絶望、湿り気を帯びた畏怖
pov: 三人称
tense: 過去形
setting: 大正末期、霧深い山間の閉鎖的な集落「鴉鳴村（あめいむら）」
premise: 山奥の村、鴉鳴村には「鉄の肺」と呼ばれる巨大な蒸気駆動の祭祀装置があった。季節ごとに渡り鳥が飛来する際、村人は蒸気を噴き上げる祭礼を行い、神の息吹を模倣することで平穏を保ってきた。しかし、ある年、渡り鳥が途絶えたことで、村の禁忌が音を立てて崩れ始める。帰郷した青年は、蒸気の煙の向こうに、鳥でも人間でもない「何か」が蠢く様を目撃することになる。
themes:
- 因習による共同体の腐敗
- 自然への盲目的な畏怖
rules:
- 祭礼の蒸気が途切れた瞬間、村の境界線は消失し、霧の中の『神』が侵入する
- 渡り鳥の羽が落ちた場所には、決して触れてはならない
- 村の者は、蒸気の音を『神の鼓動』として聞き入れ、抗ってはならない
plot_outline:
- '序盤: 帰郷した青年・湊は、村を包む異様な静けさと、常に響く蒸気機関の重低音に違和感を覚える。村人たちは「鳥が来ぬのは神の怒りじゃ」と、不気味な方言で語り合い、よそ者である湊を疎外する。'
- '中盤: 湊の妹が失踪。調査を進めるうちに、村の地下に巨大な蒸気駆動の祭祀場があり、それが『渡り鳥の魂』を燃料として動いていることを知る。村の繁栄は、鳥の命を搾取することで成り立っていたのだ。'
- '終盤: 蒸気機関が故障し、煙が黒く濁り始める。霧の中から、羽をもぎ取られたような異形の神が姿を現す。村人たちは救済の名の下に、湊を新たな『生贄の羽』として捧げようと追い詰める。'
- '結末: 儀式は破綻し、村は深い霧の中に飲み込まれる。生き残った湊は、渡り鳥の鳴き声ではない、蒸気の軋むような咆哮が響く荒野を、ただ一人彷徨い続ける。'
style_notes: 湿った土の匂い、錆びた鉄の味、そして絶え間なく続く蒸気の噴出音を、五感に訴えかけるように描写せよ。会話には重苦しい方言を混ぜ、よそ者である主人公への心理的な隔絶を強調すること。逃げ場のない閉塞感を、静かな筆致で構築せよ。
