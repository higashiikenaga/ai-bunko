- name: アレイス・クロムウェル
  role: 主人公
  age: 24
  gender: 男性
  appearance: 煤けたブラウンのロングコートを纏い、使い古したゴーグルを首にかけている。左頬に古い傷跡があり、手先は常にオイルと汚れで黒ずんでいる。
  personality: 皮肉屋で現実主義だが、根は情に厚い。一人称は「俺」。
  speech_style: ぶっきらぼうで投げやりな口調だが、重要な局面では冷静で理知的。
  background: 元帝国軍の技術兵だったが、軍の非道な人体実験に嫌気がさして脱走。現在は辺境の廃墟を巡り、古代の遺物を売って日銭を稼ぐ「遺物回収士」として生きている。
  motivation: 当初は金目的だったが、シオンとの出会いを通じて、彼女を道具として扱う帝国への復讐と、世界の再生を願うようになる。
  relationships:
  - name: シオン
    relation: 保護対象であり、唯一心を許せる相棒
  - name: ヴァレリウス
    relation: かつての軍上官であり、憎悪する宿敵
  arc: 孤独に生きることを信条としていたが、シオンを守ることで「誰かのために戦う」という生きがいを取り戻し、自己犠牲をも厭わない英雄へと成長する。
- name: シオン
  role: 相棒
  age: 14
  gender: 女性
  appearance: 透き通るような銀色の髪と、深い瑠璃色の瞳を持つ。四肢の関節部分に精密な機械の継ぎ目があり、胸の中央には桜の花びらのような紋章が刻まれた「機械の心臓」が脈動している。
  personality: 純真で好奇心旺盛。感情表現が不器用だが、深い慈愛を持つ。一人称は「私」。
  speech_style: 丁寧で静かな口調。時折、古い時代の詩のような古風な言い回しが混ざる。
  background: 霊花の森の記憶と、帝国の禁忌技術が融合して生まれた人造の生命体。世界の記憶を保存するための「器」として設計された。
  motivation: 自分が何のために生まれたのかを知ることと、自分を救い出してくれたアレイスと共に、本当の「空」を見ること。
  relationships:
  - name: アレイス・クロムウェル
    relation: 世界で初めて自分を人間として扱ってくれた恩人
  - name: ヴァレリウス
    relation: 自分を「最高傑作の部品」としか見ていない創造主的な存在
  arc: ただの「器」としての運命を受け入れようとするが、アレイスとの旅を通じて個としての意志を持ち、「世界を救うための犠牲」ではなく「共に生きる未来」を選択しようとする。
- name: ヴァレリウス・フォン・ゼノス
  role: 敵役
  age: 52
  gender: 男性
  appearance: 純白の軍服に身を包み、右目にモノクルを着用している。右腕は鈍い光を放つ真鍮製の義手となっており、指先から魔力回路を操作できる。
  personality: 冷酷非情な功利主義者。文明の発展のためには少数の犠牲は必然であると信じている。一人称は「私」。
  speech_style: 慇懃無礼で理路整然とした話し方。相手を見下した余裕のある態度を崩さない。
  background: 帝国科学省の最高責任者であり、「万能蒸気機関」の開発主導者。霊花の森を枯らし、そのエネルギーを都市に還元することで、永遠の繁栄を築こうとしている。
  motivation: 魔力という不安定な自然エネルギーを完全に制御し、人間が神をも超える「完全なる機械文明」を完成させること。
  relationships:
  - name: アレイス・クロムウェル
    relation: かつての部下であり、自分の理想を拒絶した不完全な裏切り者
  - name: シオン
    relation: 万能蒸気機関を完成させるために不可欠な「最後の部品」
  arc: 絶対的な合理性で世界を支配しようとするが、シオンが示した「非合理な情愛」に計算を乱され、最終的に自らが構築した機械の論理に飲み込まれて破滅する。
- name: エレナ・ローゼ
  role: 脇役
  age: 28
  gender: 女性
  appearance: 燃えるような赤い短髪に、実戦的なタクティカルギアを着用。背中には巨大な魔導ライフルを背負っている。
  personality: 勝ち気で情熱的。正義感が強く、弱きを助ける騎士道精神を持つ。一人称は「私」。
  speech_style: ハキハキとした快活な口調。年上の相手にも物怖じせず、率直な意見をぶつける。
  background: 帝国の貴族出身だったが、故郷の森が産業発展で破壊されたことに絶望し、家名を捨てて反帝国組織「落花の騎士団」のリーダーとなった。
  motivation: 帝国の暴走を止め、失われた霊花の森を再生させ、自然と人間が共存できる世界を取り戻すこと。
  relationships:
  - name: アレイス・クロムウェル
    relation: 反目し合いながらも信頼し合う共闘関係
  - name: シオン
    relation: 絶望的な世界に現れた唯一の希望の象徴
  arc: 復讐心に突き動かされて戦っていたが、アレイスとシオンの絆に触れることで、憎しみではなく「次世代に何を残すか」という前向きな信念を持って戦うようになる。
