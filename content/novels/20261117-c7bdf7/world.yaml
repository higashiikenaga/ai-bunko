title: 灰白の歯車と、千年の落花 ―黎明の蒸気機関が奏でる挽歌―
genre: 異世界ファンタジー
tone: 重厚かつ叙情的、神話的な風格
pov: 三人称
tense: 過去形
setting: 魔導の黄昏を迎え、巨大な蒸気都市を擁する「エーテルガルド聖帝国」。かつて世界の理を司ったとされる「霊花の森」は、帝国の産業発展に伴う煤煙と、魔力の強奪によって、今や滅びの淵にある。
premise: 神々の遺産である「霊花の桜」が散りゆく時、世界から魔力は失われる。帝国は、失われゆく魔力を補うべく、禁忌の蒸気機関による人工的なエネルギー循環を構築していた。遺物回収士のアレイスは、機械の心臓を持つ少女シオンと出会い、帝国の繁栄が世界の魂を削り取る「挽歌」であることを知る。鋼鉄の咆哮と、散りゆく桜の祈りが交錯する、文明と自然の終焉を巡る叙事詩。
themes:
- 文明の進歩と魂の代償
- 滅びゆく神話への追悼
rules:
- 魔力は「霊花の桜」の開花と落花の周期に依存する
- 蒸気機関の動力源は、桜の落花が結晶化した「霊砂（エーテル・サンド）」の燃焼である
- 霊砂の過剰な消費は、世界の記憶と精霊の存在を物理的に抹消する
plot_outline:
- '序盤: 遺物回収士のアレイスが、廃墟となった霊花の森で、自律駆動する銀色の桜の種子と、機械の心臓を持つ少女シオンを発見する。'
- '中盤: シオンが帝国の「万能蒸気機関」の核として狙われていることを知り、アレイスは彼女を連れて逃亡する。道中、帝国の発展が世界の記憶を食い潰している真実を突き止め、抵抗組織と共に帝都への進軍を決意する。'
- '終盤: 帝都の心臓部、巨大な歯車が回転する「大聖堂機巧城」での決戦。蒸気と魔力が激突し、空からは血の色をした桜が降り注ぐ。アレイスはシオンの命と、世界の存続を天秤にかける究極の選択を迫られる。'
- '結末: 帝国の機械文明は崩壊し、世界は再び緩やかな魔力の循環へと回帰する。失われた記憶は戻らないが、人々は煤煙の消えた新しい空の下、新たな歴史を刻み始める。'
style_notes: 地の文は格調高く、神話の叙事詩を彷彿とさせる重厚な文体を用いること。地名や固有名詞には古語の響きを混ぜ、歴史の深淵を感じさせる。物語の転換点には「古の詩篇」や「伝承の断片」を引用し、世界観の奥行きを補完する。キャラクターの口調は、その階級、教育、出自による差異を厳密に描き分けること。
