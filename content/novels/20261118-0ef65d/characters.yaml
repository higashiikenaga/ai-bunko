- name: 清助
  role: 主人公
  age: 22
  gender: 男性
  appearance: 旅人のような簡素な着物姿。手には古びた星図と小さな行灯を持っている。穏やかで澄んだ瞳が特徴。
  personality: 穏やかで観察眼が鋭い。他人の痛みに寄り添う優しさを持つ。一人称は「俺」。
  speech_style: 物腰柔らかく、丁寧だが飾り気のない江戸言葉。
  background: 夜の市場に現れる謎の行商人。星図を頼りに、人々の記憶の在り処を辿っている。
  motivation: 売り物にならない「宝物」のような記憶を見つけ出し、人々が前を向けるよう導くこと。
  relationships:
  - name: お菊
    relation: 相棒のような存在
  arc: 記憶を淡々と扱う観察者から、人々の感情に深く共鳴し、共に生きる術を伝える導き手へ。
- name: お菊
  role: 相棒
  age: 18
  gender: 女性
  appearance: 紅葉の柄が鮮やかな着物を纏った、活発な少女。常に季節の菓子が入った籠を抱えている。
  personality: 明るく天真爛漫。少しいたずら好きで、市場の賑わいを象徴する存在。一人称は「あたし」。
  speech_style: テンポが良く、威勢のいい江戸っ子口調。
  background: 『記憶を売る市場』の常連であり、清助の案内役として市場の隅々を熟知している。
  motivation: 市場に笑顔を絶やさず、清助が新しい記憶の種を見つける手助けをすること。
  relationships:
  - name: 清助
    relation: 相棒
  arc: 賑やかな日常の裏にある、人々の深い悲しみや孤独を理解し、精神的に成長していく。
- name: お登勢
  role: 脇役
  age: 72
  gender: 女性
  appearance: 白髪を丁寧にまとめ、使い古されたが清潔な着物を着ている。寂しげだが凛とした佇まい。
  personality: 控えめだが芯が強く、思慮深い。一人称は「わたくし」。
  speech_style: 上品で落ち着いた、静かな語り口。
  background: 亡き夫との思い出に縛られ、その苦しみから逃れるために記憶を売ろうとしている未亡人。
  motivation: 夫との食卓の記憶を売り払い、喪失の痛みから解放されること。
  relationships:
  - name: 清助
    relation: 記憶の相談相手
  arc: 記憶を「消すべき痛み」ではなく「共に生きる温もり」として受け入れ、晴れやかな笑顔を取り戻す。
- name: 辰吉
  role: 脇役
  age: 45
  gender: 男性
  appearance: 恰幅の良い体格。高級そうな商人の装い。常に帳簿を手放さない。
  personality: 現実主義者で、感情よりも利益を重んじる。少し皮肉屋。一人称は「俺」。
  speech_style: 事務的で、効率を重視した早口な話し方。
  background: 市場で「技術」や「知識」といった実用的な記憶を扱う、腕利きの商人。
  motivation: 市場での取引を円滑に進め、より価値の高い記憶を仕入れること。
  relationships:
  - name: 清助
    relation: 価値観の異なるライバル
  arc: 効率だけでは測れない「心の価値」を、清助の関わりを通して垣間見ていく。
