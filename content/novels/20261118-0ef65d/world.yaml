title: 江戸八百八町・記憶の露店と星図の行商人
genre: 日常ほのぼの
tone: 粋で人情味あふれる、温かみのある江戸情緒
pov: 三人称
tense: 過去形
setting: 架空の江戸、季節は秋の深まりゆく頃
premise: 江戸の片隅、夜の帳が下りる頃にだけ現れる『記憶を売る市場』。そこでは、忘れ去りたい悲しみや、失くしたはずの温かな思い出が、一文銭で取引されている。星図を片手に歩く若き行商人の清助は、季節の味覚を楽しみながら、人々の心に寄り添い、売り物にならない『宝物』を見つけ出していく。これは、粋な江戸っ子たちが織りなす、記憶と人情の物語。
themes:
- 失うことの美しさ
- 思い出の価値
rules:
- 記憶の市場は、新月の夜、特定の路地の奥にのみ現れる
- 記憶を売ると、その経験そのものが消えるが、代わりに金銭や別の記憶が得られる
- 星図は、市場へ辿り着くための道標として機能する
plot_outline:
- '序盤: 秋風が身に染みる季節、行商人の清助が、懐かしき焼き芋の香りに誘われつつ、星図を頼りに『記憶の市場』へ辿り着く場面から始まる。'
- '中盤: 市場では、悲しい記憶を売り払おうとする老人や、昔の恋の記憶を買い戻そうとする若者が行き交う。清助は、ある老婆が『亡き夫との食卓の記憶』を売ろうとしていることに気づく。'
- '終盤: 清助は老婆に、記憶を売るのではなく、その記憶と共に生きる粋なやり方を提案する。老婆が大切にしていたのは、記憶そのものではなく、共に味わった秋の味覚の温もりだった。'
- '結末: 市場は夜明けと共に消えるが、老婆の顔には晴れやかな笑みが戻る。清助はまた次の星図を広げ、人情の香る江戸の街へと消えていく。'
style_notes: 江戸の市井の空気感を大切にし、長屋の喧騒や季節の食べ物（焼き芋、松茸、秋刀魚など）を五感に訴えるように描写する。会話文は「てやんでえ」「べらんめえ」といった軽快な江戸っ子口調を使いつつ、物語の本質はあくまでも温かな人情に置くこと。
