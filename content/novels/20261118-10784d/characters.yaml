- name: カイ・レン・アズマ
  role: 主人公
  age: 24
  gender: 男性
  appearance: 無造作な黒髪に、常に油汚れのついた作業用ジャンパーを羽織っている。少し猫背で、手先は器用だがどこか寂しげな瞳をしている。
  personality: 内向的で物静か。効率重視の都市生活に馴染めず、古い機械の「声」を聞くことに安らぎを感じる。一人称は「僕」。
  speech_style: 丁寧だが、感情の起伏が少ない淡々とした話し方。技術的な用語を混ぜることがある。
  background: 都市の廃棄物処理区画で、通信機器の修理工として働いている。高度に自動化された社会において、修理という「手仕事」を唯一の繋がりとしている。
  motivation: ラジオから流れてきた未知の歌と、その向こう側にいる「誰か」の正体を知りたい。
  relationships:
  - name: エライザ
    relation: 通信を通じて交流する謎の老電波技師
  - name: ユニット-7
    relation: 移動に使用する旧式の自動走行車（擬人化的な相棒）
  arc: 効率と機能性のみを重んじる無機質な生活から、不便さの中にある「情緒」や「記憶」の価値を認め、自らの意志で未知の世界へ踏み出す勇気を得る。
- name: エライザ・ハルデン
  role: 重要脇役（声の主）
  age: 78
  gender: 女性
  appearance: ノイズ混じりの音声のみの登場。かつては穏やかな微笑みを浮かべていたであろう、知性と慈愛を感じさせる声質。
  personality: 博識で、過ぎ去った時代（21世紀以前）の文化を愛している。少し頑固だが、非常に温厚。一人称は「私」。
  speech_style: 落ち着いた、語りかけるような老婦人の話し方。時折、古い歌の一節を口ずさむ。
  background: 静止区域にある古い村の電波塔を守り続けている最後の電波技師。村の歴史と記憶を、電波という形で世界に繋ぎ止めようとしている。
  motivation: 消えゆく村の存在と、そこに宿る人々の記憶が、完全に忘却されるのを防ぐこと。
  relationships:
  - name: カイ・レン・アズマ
    relation: ラジオを通じて繋がり、彼を未知の地へ導く導き手
  arc: 孤独な守護者としての役割を、カイという新しい世代に託すことで、自分の役割が「維持」から「継承」へと変わることを受け入れる。
- name: ユニット-7
  role: 相棒
  age: 35
  gender: なし（無機物）
  appearance: 塗装が剥げ、あちこちに継ぎ接ぎの修理跡がある、20世紀末のデザインを彷彿とさせる古い自動走行車。
  personality: 論理的だが、カイのメンテナンスによって、時折人間のような「癖」を見せる。一人称は「システム」。
  speech_style: 電子音と合成音声による、簡潔で無機質な報告スタイル。
  background: かつての物流網で使用されていた旧式の車両。廃棄予定だったが、カイの手によって再起動され、彼と共に静止区域へと向かう。
  motivation: カイの目的地への到達と、自身の機能維持。
  relationships:
  - name: カイ・レン・アズマ
    relation: 所有者であり、メンテナンスを行うパートナー
  arc: 単なる「移動手段」という定義を超え、カイの冒険における唯一の理解者としての存在感を強めていく。
