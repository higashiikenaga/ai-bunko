title: 琥珀色の周波数と、記憶の再起動
genre: 日常ほのぼの
tone: 穏やかで切実、どこかノスタルジックな近未来
pov: 三人称近接
tense: 過去形
setting: 高度な自動化が進み、人口のほとんどが都市型居住区に集約された22世紀中盤。かつての居住区は、通信インフラの維持管理のみが行われる『静止区域』となっている。
premise: 都市の片隅で、壊れた通信機器を修理して暮らす青年・カイは、ある夜、ノイズ混じりのラジオ放送を聴く。それは、地図から消えたはずの古い村から流れてくる、夜明け前の放送だった。彼はその声の主を探すため、技術ですら埋められなかった空白の地へと、古い自動走行車を走らせる。
themes:
- 技術の進歩と置き去りにされた記憶
- 繋がることの温かさと孤独
rules:
- 全人類は脳内チップによる常時接続が標準だが、一部の『未接続者』や旧式デバイスには干渉できない周波数がある
- 『消えた村』は、都市計画の合理化によって地図上の座標から削除され、物理的な居住権も失われた存在である
plot_outline:
- '序盤: メンテナンス用ドローンの羽音と、合成食料の味に慣れきったカイの単調な日常。夜明けのラジオから、かつて存在したはずの村の歌が聞こえてくる。'
- '中盤: 声の主である老いた電波技師との通信を試みるカイ。便利すぎる都市では、誰にも気づかれない小さなノイズが、かつての風景を想起させる。'
- '終盤: 記録上は消滅しているはずの村へ、カイは古い車両を駆って向かう。そこは、最新技術が届かない、不便で、しかし色彩豊かな場所だった。'
- '結末: 村の電波塔を修理し、声が世界に届く。それは世界を変えるものではないが、忘却に抗う小さな灯火となる。'
style_notes: 高度なホログラムや自動制御などの技術を、呼吸するように自然に描写する。便利さゆえに失われた『手触り』や、完璧な同期の中にある『ズレ』が生む寂寥感を、静かな筆致で描くこと。
