title: 不眠の都市と、綴じられた記憶の断片
genre: 本格ミステリー
tone: 重厚で理知的な古典的推理調
pov: 一人称（ワトソン役の朝比奈）
tense: 過去形
setting: 前作の事件後、物理的廃墟を飲み込むように発展した超近代都市「新・層位市」の不夜城地区。
premise: 前作の「情報の物質化」の残滓が、都市の構造に深く根を張っていた。ある密室で、被害者が「本のように折り畳まれた」状態で発見される。九条は、街に隠された「秘密の地図」が、物理的な空間ではなく、情報の層（レイヤー）を繋ぐ索引であることを突き止める。
themes:
- 物質と情報の境界
- 記録される記憶と忘却される真実
rules:
- 特定の条件下で、物体を『情報』として扱い、空間的に折り畳む（レイヤー化する）ことが可能
- 物理的なインクや血などの『アナログな不純物』は、情報の書き換えやレイヤー移動の影響を受けない
- 秘密の地図は、現実世界の座標ではなく、情報のインデックス（索引）として機能する
plot_outline:
- 序盤：不眠の街の最高級ホテルで、物理的に不可能な『折り畳まれた遺体』が見つかる。現場には不可解な座標が記された『秘密の地図』が残されており、九条と朝比奈が調査に乗り出す。
- 中盤：被害者がかつての『旧・層位図書館』の生存者であったことが判明。街の至る所に、前作の情報の物質化現象が『バグ』のように現れており、それを利用して密室を作り出すトリックが示唆される。
- 終盤：九条は、ホテルの建築構造そのものが、巨大な一冊の本の形式（ページ構成）になっていることに気づく。犯人は地図を用いて『ページを捲る』ように空間を跳躍し、密室を構築していた。
- 結末：しかし、犯人が唯一計算に入れなかったのは、被害者が最期に流した『血』というアナログな物質が、レイヤーを跨いで物理的に付着していたこと。九条はその血痕の軌跡から、論理的に犯人を追い詰める。
style_notes: 「私」の視点から九条の超然とした態度と鋭い観察力を描写する。比喩表現に書物や図書館の用語を多用し、知的で静謐な空気感を醸成すること。手がかり（血痕の位置、地図の座標、建物の構造）を丁寧に提示し、最後は純粋な論理的推論のみで解決へ導く。
