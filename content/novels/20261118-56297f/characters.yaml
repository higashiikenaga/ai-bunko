- name: エリアン・ノア
  role: 主人公
  age: 24
  gender: 男性
  appearance: 銀色の髪に灰色の瞳。細身で、常に指先が記憶の結晶の粉で微かに光っている。藍色の彫刻師用コートを纏っている。
  personality: 静謐で厭世的。過去の喪失感から、他者との深い関わりを避けている。一人称は「僕」。
  speech_style: 丁寧だが抑揚が少なく、どこか諦念を含んだ淡々とした口調。
  background: かつて愛した女性の記憶を宝石に加工することに失敗し、彼女を失った過去を持つ天才的な記憶彫刻師。
  motivation: リィルの記憶を拾い集める中で、自身の止まってしまった時間を動かす鍵を見つけること。
  relationships:
  - name: リィル
    relation: 記憶を失った少女であり、かつての愛の面影を投影してしまう対象
  arc: 過去への執着を捨て、愛する者のために自己を捧げるという、真の「生」を選択する。
- name: リィル
  role: 相棒
  age: 15
  gender: 女性
  appearance: 透き通るような銀髪と、色を失った琥珀色の瞳。存在自体が陽炎のように微かに揺らめいている。
  personality: 純粋で無垢。世界の美しさに驚きを感じるが、時折、深い虚無感を漂わせる。一人称は「わたし」。
  speech_style: 穏やかで、風のささやきのように柔らかく、少し浮世離れした話し方。
  background: 空飛ぶ船「碧空の方舟」に突如として現れた、記憶を持たない少女。彼女の記憶は「渡り鳥」となって世界に散っている。
  motivation: 自分が何者であるのか、なぜ自分自身が透明な存在なのかを知ること。
  relationships:
  - name: エリアン・ノア
    relation: 自分を導き、断片的な自分を繋ぎ止めてくれる大切な存在
  arc: 自らの記憶が「誰かを救うための犠牲」であった事実を受け入れ、消滅を覚悟した上で愛を知る。
- name: ゼノス
  role: 敵役
  age: 42
  gender: 男性
  appearance: 鋭い眼光を持つ黒髪の男。金糸で刺繍された重厚な管理官の制服を身に纏っている。
  personality: 冷徹な合理主義者。記憶を「管理・利用すべき資源」と定義し、感情を排除することに陶酔している。一人称は「私」。
  speech_style: 威圧的で論理的。相手の感情的な動揺を冷笑するような、高圧的な口調。
  background: 浮遊都市「瑠璃の檻」の秩序を司る管理官。記憶の結晶化を統制し、希少な記憶を独占しようとしている。
  motivation: リィルの記憶（渡り鳥）を捕獲し、都市の安定のための動力源として結晶化すること。
  relationships:
  - name: エリアン・ノア
    relation: 秩序を乱し、記憶を「魂」として扱う不届きな技術者
  arc: 効率と管理の果てに、人間から感情を奪うことがいかに空虚な世界を作るかという皮肉に直面する。
