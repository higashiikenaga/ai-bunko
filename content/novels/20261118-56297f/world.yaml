title: 天上の玻璃に刻む、鳥たちの記憶
genre: 伝奇
tone: 耽美、静謐、退廃的
pov: 一人称
tense: 過去形
setting: 記憶が結晶化して降り積もる、雲上の浮遊都市「瑠璃の檻」
premise: 記憶を宝石に加工する「記憶彫刻師」の僕のもとに、空飛ぶ船に乗って記憶を失った少女が現れる。彼女の欠落した記憶は、透き通った渡り鳥となって世界の果てへと散らばっていた。僕たちは透明な絶望と、壊れやすい美しさを抱えて、空の彼方へ記憶を拾い集める旅に出る。
themes:
- 喪失と再生
- 永遠なる不完全さ
rules:
- 強い感情を伴う記憶は死後または離別時に結晶化し、宝石となる
- 記憶の重さが軽い者ほど空高く飛ぶことができ、重すぎる者は地上へと墜落する
- 一度砕かれた記憶の結晶は二度と元に戻らず、永遠に消失する
plot_outline:
- '序盤: 記憶彫刻師である僕が、空飛ぶ船「碧空の方舟」に乗って現れた、記憶の空白を持つ少女と出会い、彼女の記憶の破片を探す契約を結ぶ。'
- '中盤: 彼女の記憶を模した「渡り鳥」を追いかけ、幻想的な浮遊島を巡る。旅の中で、僕自身がかつて愛し、そして失った者の面影を彼女に見出し、危うい共依存関係に陥る。'
- '終盤: 全ての記憶を集めたとき、彼女がかつて僕を救うために自らの記憶を砕いて散らしたことが判明する。記憶を取り戻すことは、彼女が消滅する運命を受け入れることと同義だった。'
- '結末: 僕は彼女を救うため、自身の心臓に刻まれた唯一の記憶の宝石を砕き、彼女に捧げる。二人は個としての形を失い、透明な光の粒子となって、永遠に壊れない記憶として空に溶け合う。'
style_notes: 硝子シオンとしての文体。一人称で、宝石や花、ガラスの比喩を多用し、装飾的な形容詞を重ねる。静寂と孤独を愛し、壊れゆく瞬間の美しさを詩的に描写すること。
