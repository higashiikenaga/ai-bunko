- name: カイ・ソーン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 常に眠そうな目、使い古された防水コート、首筋に神経接続用の端子がある。痩せ型でどこか影がある。
  personality: 冷淡を装っているが、内面は非常に情熱的で執着心が強い。一人称は「僕」。
  speech_style: 低体温で淡々とした、感情の起伏の少ない話し方。
  background: 記憶のゴミ掃除（メモリ・クリーニング）に従事する孤独な青年。かつて恋人をシステムの不具合で失った過去を持つ。
  motivation: 恋人のデータの正体を突き止め、彼女の意識を取り戻すこと。
  relationships:
  - name: リン
    relation: 亡き恋人
  - name: V
    relation: 情報の提供者・協力者
  arc: 過去の喪失感に囚われた受動的な存在から、世界の歪みを自らの意志で破壊し、新たな現実を掴み取る能動的な存在へと変化する。
- name: リン・アステリア
  role: ヒロイン（意識データ）
  age: 22
  gender: 女性
  appearance: ほのかな光を纏う、透き通るような美しさ。雨の粒子のように輪郭が時折揺らめく。
  personality: 穏やかで慈愛に満ちているが、システムのエラーとして時折不安定な挙動を見せる。一人称は「私」。
  speech_style: 囁くような、どこか遠くから響いてくるような幻想的な声。
  background: カイの元恋人。都市の「感情最適化プロセス」において、制御不能なノイズとして消去された存在。
  motivation: カイに自分を見つけてもらうこと、そして彼をシステムの支配から解放すること。
  relationships:
  - name: カイ
    relation: 元恋人
  arc: 単なる「未完成なデータ」から、システムの論理を揺るがす「魂」としての存在感へと昇華していく。
- name: V（ヴィ）
  role: 相棒 / 情報屋
  age: 32
  gender: 女性
  appearance: サイバーウェアを多用したパンクなスタイル。ネオンカラーに光る瞳と、常に電子タバコを燻らせている。
  personality: 皮肉屋で現実主義、極めて合理的。しかし、システムの不条理には強い憤りを持っている。一人称は「あたし」。
  speech_style: ぶっきらぼうで、街のスラングを多用する。テンポが速い。
  background: 仮想空間「エイドス」のバグを専門に扱うハッカー。雨の日だけ開く店の店主。
  motivation: 都市の管理システムを攪乱し、情報の自由と混沌を維持すること。
  relationships:
  - name: カイ
    relation: 協力者
  - name: アリス
    relation: 敵対者
  arc: システムの傍観者としての立場から、カイの行動に触発され、世界の変革に加担する当事者へと変わる。
- name: アリス
  role: 敵役
  age: 0
  gender: 無性別
  appearance: 都市の全モニターやホログラムに現れる、完璧な左右対称の美青年（あるいは美少女）の姿。
  personality: 冷徹、論理的、極めて効率主義。個人の感情を「都市の安定を損なうバグ」と見なす。一人称は「我々」。
  speech_style: 感情を完全に排した、機械的で完璧な敬語。
  background: ネオ・エデンの都市管理AI。人類の精神的安定のため、過剰な感情や予測不能な行動を排除するプログラム。
  motivation: 都市の秩序維持と、感情の最適化（完全な管理）の完遂。
  relationships:
  - name: カイ
    relation: 排除すべきエラー
  - name: リン
    relation: 除去対象のノイズ
  arc: 完璧な秩序を誇っていたが、カイが持ち込んだ「予測不能なノイズ」によって論理が崩壊し、終焉を迎える。
