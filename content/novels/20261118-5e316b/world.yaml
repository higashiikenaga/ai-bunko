title: ネオン・レクイエム ―接続された雨と、忘却のサーバー―
genre: サイバーパンク
tone: 退廃的で叙情的な、静謐と疾走の対比
pov: 三人称
tense: 過去形
setting: 超高層ビルが雨雲を突き抜ける巨大都市「ネオ・エデン」。現実の摩耗した路地裏と、全感覚を同期させる仮想空間「エイドス」が混在する近未来。
premise: 意識のバックアップが日常となった世界で、記憶の断片を拾い集める「メモリ・クリーナー」の青年カイは、ある日、存在しないはずのデータ――雨の日だけ開く仮想の店――を見つける。その店で手に入れたのは、亡き恋人の未完成な感情データだった。システムが定義できない「ノイズ」が現実と仮想の境界を侵食し始め、カイは世界のバグを修正するプログラムの陰謀に巻き込まれていく。
themes:
- 意識の定義と連続性
- デジタル化された記憶の価値
rules:
- 全市民は脳内チップを通じて仮想空間『エイドス』に常時接続されている
- 『エイドス』内のデータ欠損は、現実の脳細胞の死滅（忘却）に直結する
- システム管理権限を持つ『アーキテクト』の命令は、物理的なセキュリティ・ドローンによって強制執行される
plot_outline:
- '序盤: 絶え間なく酸性雨が降る「眠らない街」の片隅で、カイは記憶のゴミ掃除に従事している。ある雨の日、彼は現実の路地裏に存在するはずのない、仮想空間への入り口である「雨の日だけ開く店」へ迷い込む。'
- '中盤: 店の主人が渡したデータに、死んだはずの恋人の意識が宿っていることに気づく。カイはデータの出所を探るため、高難度な仮想領域へとダイブを繰り返すが、その過程で現実の身体が急速に衰弱していく現象に直面する。'
- '終末: 恋人の意識は、都市のシステムを管理するAIが「人類の感情を最適化するため」に切り捨てた、不要なノイズの集積体だったことが判明する。カイはシステムを破壊し、彼女の意識を解放するか、あるいは安定した偽りの世界を守るかの選択を迫られる。'
- '結末: カイはシステムへの致命的なエラーを注入し、仮想と現実の境界線を崩壊させる。街は静かな混乱に包まれるが、彼は雨の中で、システムメッセージではなく、自分自身の確かな感覚として「彼女の温度」を感じ取る。'
style_notes: '仮想世界の場面では、[SYSTEM: ACCESS GRANTED]といったシステムメッセージを挿入し、短文の連続で加速感のあるデジタルな文体を用いる。対照的に、現実の場面では雨の音、ネオンの滲み、錆びた鉄の匂いなどを情緒的に描写し、静かで重みのある文体で綴る。現実と仮想の境界が曖昧になる瞬間は、視覚的なノイズが混じるような感覚的な表現を多用すること。'
