title: クロームの月蝕：ゼロ・ダイブ
genre: サイバーパンク
tone: ネオンと雨、硬質な電子音と孤独
pov: 一人称（オレ）
tense: 現在形中心の過去形
setting: 209X年、超巨大企業『アイギス・テック』が支配する雨の垂直都市・ネオ・エデン
premise: ネオンの海に沈む、ゴミ溜めのスラム。オレはデータの残骸を漁る掃除屋だ。ある夜、暗号化された『月蝕』の断片を手に入れる。それは、かつてこの街の最果てに立っていた『古い灯台』の座標と、失われた全人類の記憶への鍵だった。企業が隠蔽する、剥き出しの真実へオレはダイブする。
themes:
- 記憶のデジタル化と喪失
- 権力への叛逆
rules:
- 意識の外部サーバー同期（ダイブ）は神経系への過負荷を伴う
- ネオン・コードによる階層化社会（上位層は電脳空間、下層は物理的泥濘）
- 月食の際、広域通信網にノイズが混入し、ハッキングの成功率が跳ね上がる
plot_outline:
- '序盤: スラムの路地裏で、廃棄された記憶チップを回収するオレ。ノイズ混じりのデータの中に、月蝕のタイミングで起動する座標を見つける。'
- '中盤: 座標の先は、企業の監視網を逃れた廃墟の海岸。そこに存在する、物理的な『古い灯台』へ向かうため、オレは企業追手との電脳戦と物理的な銃撃戦を潜り抜ける。'
- '終盤: 月食が街を覆う。灯台の頂上、古い発信機を介してオレは全人類の意識が接続される『プロトコル・ルナ』へのアクセスを開始する。企業の防壁を、バイナリの暴力で粉砕する。'
- '結末: 真実が溢れ出す。街のネオンは消え、本当の夜が訪れる。オレは、雨の中で消えゆく意識の端を掴んでいた。'
style_notes: 短いセンテンスの連続。体言止めを多用し、スピード感を出す。ハッキングシーンでは「デフラグ」「パケット・スナイプ」「コア・バイパス」等の造語と具体的な手順を混ぜ、硬質な手触りを与える。スラング混じりのハードボイルドな独白。「ネオンと雨」を色彩の基準とする。
