- name: 瀬戸 ハル
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの黒髪、どこか虚脱感のある瞳、使い古されたパーカーを愛用している。
  personality: 内向的で物静か。喪失感を抱え、現実に対して希薄な感覚を持っている。「僕」
  speech_style: 控えめで、言葉を選ぶような落ち着いた話し方。
  background: 幼い頃の事故で大切な記憶の一部を失っており、その空白を埋められないまま孤独に過ごしてきた。
  motivation: ソラを守り抜き、自分が何を失ったのかという真実を知ること。
  relationships:
  - name: ソラ
    relation: 仮想世界での相棒であり、かつての幼馴染
  arc: 孤独な受容から、失った記憶さえも自分の一部として抱えて生きる決意へと変化する。
- name: ソラ
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 透き通るような銀髪、瞳の中に星屑のようなデジタルノイズが走る、儚げな少女。
  personality: 明るく好奇心旺盛だが、時折消え入りそうな危うさを見せる。「私」
  speech_style: 丁寧だが、どこか浮世離れした、古風で詩的な言い回し。
  background: ハルの幼馴染のバックアップデータ。廃棄サーバー内で断片化し、人格が再構成されたAI。
  motivation: ハルとの約束を果たすため、消滅する前に「星図」を完成させて約束の丘へ行くこと。
  relationships:
  - name: 瀬戸 ハル
    relation: 大切な記憶の持ち主であり、愛する人
  arc: 不完全なデータから、自らの意志を持って消滅を受け入れる「一人の少女」へと成長する。
- name: 蓮見 レン
  role: 敵役
  age: 26
  gender: 男性
  appearance: 隙のないスーツ姿、冷徹な眼鏡、常にホログラム端末を操作している。
  personality: 極めて合理主義的で冷淡。システムの維持と効率を最優先する。「私」
  speech_style: 事務的で、一切の感情を排した淡々とした話し方。
  background: 都市の記憶管理局に所属する監査官。旧世代サーバーの完全消去任務を遂行している。
  motivation: サーバー内のバグ（ソラ）を完全に排除し、都市のデータ整合性を保つこと。
  relationships:
  - name: 瀬戸 ハル
    relation: システムの運用を妨げるイレギュラーな存在
  arc: 効率の追求者として立ち塞がるが、ハルとの衝突を通じて「記憶の価値」という非合理な概念に直面する。
- name: カイト
  role: 脇役
  age: 17
  gender: 男性
  appearance: 短髪で活動的な印象、常に最新のガジェットを身につけている。
  personality: 社交的で技術に明るい、ハルの数少ない理解者。「俺」
  speech_style: 砕けた、現代的な若者の話し方。
  background: ハルのクラスメイトで、ハブ技術に詳しいギーク。ハルが古いVRに没頭していることを知る。
  motivation: ハルが仮想世界で見ているものを知り、彼を現実の世界へ繋ぎ止めること。
  relationships:
  - name: 瀬戸 ハル
    relation: 親友
  arc: ハルの異常な没頭を冷やかしつつも、彼が直面する真実の重さに気づき、現実側からの支援者となる。
