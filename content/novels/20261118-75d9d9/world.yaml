title: ログアウトできない僕らの星図
genre: 青春恋愛
tone: 静謐な現実と、加速する電脳世界のコントラスト
pov: 三人称
tense: 過去形
setting: 近未来の都市と、廃棄された仮想記憶サーバー『エテリウム』
premise: 記憶をデータ化して保存できる時代、少年・ハルは旧世代のVRデバイスを通じて、忘れ去られたサーバーに迷い込む。そこで出会ったのは、自身の幼少期の記憶から生成された不完全なAIの少女・ソラだった。消去される運命にある彼女を救うため、二人は断片化した記憶の「星図」を集める旅に出る。
themes:
- 記憶の定義
- 喪失と再生
rules:
- 仮想世界では感情の起伏がシステムの処理速度に影響し、感情が高ぶるほど世界の時間経過が加速する
- 現実世界での同期時間が限界を超えると、感覚の同期ズレ（ゴースティング）が発生し、現実の身体に不調をきたす
- 記憶の断片（データチップ）を同期させることでのみ、消去予定のエリアを一時的に復元できる
plot_outline:
- '序盤: ハルが偶然手に入れた古いVRデバイスを起動し、バグに満ちた仮想世界で、自分の記憶の断片から生まれた少女・ソラと出会う。'
- '中盤: ソラの正体が、ハルが事故で忘れた幼馴染のバックアップデータであると判明。二人は消えゆく世界の中を駆け巡り、失われた思い出を繋ぎ合わせて「星図」を完成させていく。'
- '終盤: サーバーの完全消去まで残り数時間。二人はかつて現実世界で交わした約束の地を模した「約束の丘」を目指し、システムの強制排除プログラムを突破して疾走する。'
- '結末: ソラは完全に消滅するが、彼女が最後に書き換えた「星図」がハルの現実世界での孤独を癒やす鍵となり、彼は彼女との記憶を胸に前を向いて歩き出す。'
style_notes: '現実シーンは余白を意識した静かな情景描写を行い、仮想シーンは短文と専門用語を多用してハイスピードに展開させる。また、作中に [NOTICE:
  記憶セクタの同期率 42%] や [SYSTEM: 領域消去まであと3600秒] といったシステムメッセージを挿入し、物語の時間的制約とデジタルな質感を演出する。'
