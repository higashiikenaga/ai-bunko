- name: ヘルマン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 青白い顔に度の強い眼鏡。常に色褪せたツイードのジャケットを着用し、指先にはインク汚れが染み付いている。
  personality: 極めて論理的で懐疑的。静謐な環境を好み、パズルの断片を組み上げることに快感を覚えるタイプ。一人称は「私」。
  speech_style: 丁寧だが、結論を急ぐため断定的な口調になりやすい。論理的な矛盾を指摘する際に早口になる。
  background: 古文書学と博物学を専攻する若き研究者。ある大学の書庫管理責任者を務めており、偶然に鴉鳴島の報告書を発見した。
  motivation: 記録上の「不可能性」を論理的に解体し、1924年の事件の真実を再構成すること。
  relationships:
  - name: 有栖川京平
    relation: 研究対象であり、論理的な対決相手
  - name: エレナ・ヴァンス
    relation: 調査を補助する信頼できる助手
  arc: 純粋な知的好奇心から始まった調査が、次第に人間の狂気への理解へと変わり、記録の向こう側にある絶望に共鳴する。
- name: 有栖川京平
  role: 敵役（故人）
  age: 65
  gender: 男性
  appearance: 鋭い眼光と痩身。古い写真の中では、常に鳥類標本のような冷徹な微笑を浮かべている。
  personality: 傲慢で完璧主義。自然界の摂理を人間で再現しようとする歪んだ情熱を持つ。一人称は「私」。
  speech_style: 詩的で比喩が多く、相手を誘導するような含みのある話し方。遺言書の文章にその特徴が強く現れている。
  background: 世界的な権威を持つ鳥類学者。鴉鳴島を自身の「究極の標本」を完成させるための実験場として設計した。
  motivation: 死後も制御可能な「完璧な密室」を構築し、人間を鳥のように配置・消去する芸術作品を完成させること。
  relationships:
  - name: 有栖川静子
    relation: 孫であり、最初の「標本」候補
  - name: ヘルマン
    relation: 自分の設計図を解読できる唯一の理解者（想定）」
  arc: 死してなお遺言書を通じて生者を操り、自らの論理が正しかったことを証明しようとする。
- name: 有栖川静子
  role: 脇役（被害者）
  age: 21
  gender: 女性
  appearance: 儚げな印象の女性。記録の中では常に控えめに微笑んでおり、淡い色の着物を纏っている。
  personality: 内向的で従順。しかし、内側には一族の異常性に対する深い嫌悪感と恐怖を隠し持っていた。一人称は「私」。
  speech_style: 控えめで、語尾を濁らすことが多い。日記の中では非常に率直で感情的な筆致を見せる。
  background: 京平の孫娘。遺言書に従い島に集まった親族の一人であり、最初に「物理的に不可能な消失」を遂げた人物。
  motivation: 祖父の支配から逃れ、鴉鳴島という閉鎖環境から脱出すること。
  relationships:
  - name: 有栖川京平
    relation: 畏怖と憎悪の対象
  arc: 従順な被害者として消えるが、彼女が密かに残した日記の断片が、事件解決の決定的な鍵となる。
- name: エレナ・ヴァンス
  role: 相棒
  age: 26
  gender: 女性
  appearance: 活動的なショートヘアに実用的な服装。常にメモ帳とカメラを携帯している。
  personality: 直感的で行動的。ヘルマンの凝り固まった思考を揺さぶる、明るく好奇心旺盛な性格。一人称は「私」。
  speech_style: 快活で率直。専門用語を嫌い、分かりやすい言葉で状況を整理しようとする。
  background: 書庫のアーカイブ整理を担当する助手。鳥類学の知識は浅いが、気象学や地理学に強い関心を持つ。
  motivation: ヘルマンの研究をサポートし、歴史の闇に埋もれた不可解な事件を白日の下に晒すこと。
  relationships:
  - name: ヘルマン
    relation: 尊敬しつつも、彼の偏屈さをからかう友人
  arc: 単なる助手から、気象記録という外部視点を導入することで、密室トリックの盲点を突く重要な役割へと成長する。
