title: 鳥類学的遺言書に関する考察：1924年鴉鳴島失踪事件の再構成
genre: 本格ミステリー
tone: 乾いた学術的報告書、分析的、断片的
pov: 記録者（学者ヘルマン）による客観的視点
tense: 過去形
setting: 1924年、日本の離島「鴉鳴島（あくなるじま）」およびその記録を保管する書庫
premise: ある高名な鳥類学者が残した遺言書は、不可解な「渡り鳥の飛来スケジュール」と「座標」のみで構成されていた。遺言に従い島に集まった親族たちが、鳥の飛来に合わせて一人ずつ、物理的に不可能な密室状態で消えていく。記録者は残された断片的な日記と検視報告書から、この「鳥の地図」に隠された殺人の論理を解き明かす。
themes:
- 論理と狂気の境界
- 血縁という呪縛
rules:
- 物語は小説形式ではなく、報告書、書簡、注釈、検視記録などの「資料」の集積として提示される
- トリックの根拠はすべて、作中に提示される鳥類の生態学的特性と島の地形図に基づかなければならない
- 犯人は遺言書の記述を「実行計画書」として利用している
plot_outline:
- '序盤: 学者ヘルマンが、蔵書の中から1924年の未解決事件に関する「報告書」を発見する。遺言書の内容と、島に集まった親族たちの人間関係が資料として提示される。'
- '中盤: 第一の犠牲者が、外から鍵のかかった部屋から消える。同時に、特定の渡り鳥が島に到達。資料（日記や手紙）から、被害者が遺言書の指示通りに移動していたことが判明する。'
- '終盤: 鳥の飛来パターンが、実は島全体を巨大な「密室」に見せかけるための時間差トリックであったことが、気象記録と鳥の行動圏の分析から導き出される。'
- '結末: 最後の資料である「未公開の追記」により、遺言書を書いた本人と犯人の同一性、および彼が求めた究極の「標本」の正体が明かされ、事件の全貌が再構成される。'
style_notes: 論文形式を徹底する。感情的な描写を避け、「～と考えられる」「～と推察される」といった記述を用いる。また、文章の途中に[注1]などの脚注を挿入し、そこに対象物の詳細な定義や、矛盾する証言などの補足情報を書き込むことで、読者に情報の取捨選択をさせる構成とする。
