- name: エルナ・ルミナス
  role: 主人公
  age: 16
  gender: 女性
  appearance: 淡い銀色の髪を三つ編みにし、額に大きな真鍮製のゴーグルをかけている。油汚れのついたオーバーオールを着用し、常に古びた楽譜を抱えている。
  personality: 内気で控えめだが、音楽と機械への情熱は人一倍強い。心優しい完璧主義者。一人称は「私」。
  speech_style: 丁寧で少しおどおどしているが、調律の話になると早口になり熱が入る。
  background: 辺境の廃船街で独学で調律師の技術を学んだ少女。古本屋で偶然手に入れた禁忌の楽譜に導かれ、世界の調和を取り戻す運命に巻き込まれる。
  motivation: 失われた古代の旋律を完成させ、世界から「沈黙の霧」を消し去ること。
  relationships:
  - name: カイト
    relation: 命の恩人であり、信頼し合う航海パートナー
  - name: ヴァレリウス
    relation: 音楽を支配しようとする宿敵
  arc: 自分の歌声に自信がなかった少女が、旅を通じて「世界を奏でる」覚悟を決め、真の調律師へと成長する。
- name: カイト・ヴァン・クロムウェル
  role: 相棒
  age: 24
  gender: 男性
  appearance: 日に焼けた肌に、不敵な笑みを浮かべた青年。使い古された茶色の飛行ジャケットを羽織り、首元に銀色の懐中時計を下げている。
  personality: 自由奔放で楽観的だが、操船技術と判断力は超一流。情に厚く、弱者を放っておけない。一人称は「俺」。
  speech_style: ぶっきらぼうで砕けた話し方。相手をからかうような口調だが、根は誠実。
  background: 元帝国軍の精鋭パイロットだったが、音楽を兵器として扱う軍のやり方に反発し、愛船アルカディア号と共に脱走した。
  motivation: 誰にも縛られず、雲海の果てにあると言われる「伝説の楽園」に到達すること。
  relationships:
  - name: エルナ
    relation: 守るべき対象から、対等なパートナーへ
  - name: ライラ
    relation: 口喧嘩の絶えない信頼厚いメカニック
  arc: 自由だけを求めて逃げていた青年が、エルナとの旅を通じて「誰かのために戦う」という責任感と勇気を取り戻す。
- name: ライラ・ギアハート
  role: 脇役
  age: 19
  gender: 女性
  appearance: 燃えるような赤髪のショートカット。小柄だが筋肉質で、背中には巨大なレンチを背負っている。常に顔に煤がついている。
  personality: 快活で豪快。機械を愛して止まない天才エンジニア。直感的で行動が先走るタイプ。一人称は「あたし」。
  speech_style: ハキハキとした少年のような口調。語尾に「ぜ」をつけることが多い。
  background: 沈黙の霧によって故郷の街を失い、機械の駆動音だけが生きる希望となった。カイトに才能を見出され、アルカディア号の整備士となった。
  motivation: 世界最高の蒸気機関を構築し、霧を切り裂いて飛べる最強の船を作り上げること。
  relationships:
  - name: カイト
    relation: 喧嘩ばかりしているが、背中を預けられる親友
  - name: エルナ
    relation: 妹のように可愛がり、音楽的才能に感銘を受けている
  arc: 機械的な効率だけを信じていたが、エルナの歌がもたらす「心」の共鳴を知り、技術の真の目的を悟る。
- name: ヴァレリウス・ノイズマン
  role: 敵役
  age: 35
  gender: 男性
  appearance: 隙のない白い軍服に身を包み、冷徹な光を放つ片眼鏡（モノクル）を着用。青白い肌と細長い指が特徴的。
  personality: 冷酷非情な合理主義者。不協和音を嫌い、完璧な静寂こそが世界の正解だと信じている。一人称は「私」。
  speech_style: 極めて丁寧で理知的だが、言葉の端々に相手を見下す傲慢さが滲み出ている。
  background: 帝国軍の音響兵器開発局長。かつて音楽による救済を信じていたが、ある事件をきっかけに「音は制御されるべき暴力である」という信念に至った。
  motivation: 銀奏の心臓を手に入れ、世界からあらゆる雑音を消し去る「完全なる静寂」を実現すること。
  relationships:
  - name: カイト
    relation: 裏切り者として憎みつつも、その操船技術だけは認めている
  - name: エルナ
    relation: 自分の理論を覆す「不確定要素」として排除・利用しようとしている
  arc: 絶対的な支配を追求したが、最後にはエルナの奏でる純粋な旋律に、自分がかつて捨てたはずの音楽への愛を思い出させられ、崩壊する。
