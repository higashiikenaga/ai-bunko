title: 銀奏のプロメテウス ―錆びた旋律と雲海の航路―
genre: スチームパンク冒険
tone: 叙情的でリズミカルな、蒸気と音色が混ざり合う幻想的な雰囲気
pov: 三人称
tense: 過去形
setting: 巨大な浮遊大陸が点在し、蒸気機関の駆動音と奏でられる音楽がエネルギー源となる世界「奏鳴界（そうめいかい）」
premise: 空飛ぶ船『アルカディア号』の船長は、音を失った機械を修復する「調律師」の少女と出会う。彼女の手には、失われた古代の旋律が記された古本屋の古い楽譜が握られていた。二人は、世界を静寂へと突き落とす「沈黙の霧」の謎を解くため、雲海を駆ける旅に出る。歯車が噛み合い、歌声が空を震わせるとき、世界の運命が再び奏でられ始める。
themes:
- 音と命の共鳴
- 失われた記憶の再生
- 技術と芸術の融合
rules:
- 音楽の旋律が蒸気機関の効率を左右し、美しい旋律は船の速度や高度を増す
- 『沈黙の霧』に触れた機械や生命は、一切の振動を失い石化する
- 古本屋に置かれた古い楽譜には、特定の蒸気機関を起動させる「鍵」が記されている
plot_outline:
- '序盤: 雲海の辺境で、旋律を失い動かなくなった廃船を修理していた少女・エルナは、空飛ぶ船の船長・カイトに救われる。彼女が持つ古本屋で見つけた一冊の楽譜が、伝説の動力源「銀奏の心臓」への道標であることを知る。'
- '中盤: アルカディア号は、楽譜の旋律を頼りに、雲の海に沈んだ空中都市を目指して航海を続ける。旅の途中で、音楽を兵器として利用しようとする帝国軍の追撃を受けるが、エルナの奏でる歌が船の蒸気を活性化させ、奇跡的な回避を見せる。'
- '終盤: 目的地である空中都市の最深部で、世界の旋律を止める「沈黙の霧」の正体が、暴走した古代の音響兵器であることを突き止める。エルナは命を削るような高音の歌を奏で、カイトは船の全蒸気を解放して、兵器の中枢へと突入する。'
- '結末: 歌と蒸気の共鳴が兵器を浄化し、世界に再び豊かな音が戻る。アルカディア号は新たな楽譜を求めて、果てしない雲海の彼方へと、リズムに乗って帆を上げる。'
style_notes: 文章は音楽のように韻律を重視し、加速する場面では短文を重ねてテンポを上げる。各話の冒頭または転換点には、その場面の情景や心情を象徴する「詩」を挿入すること。例：『歯車が回る、溜息が混じる。銀の煙は、空の涙。』といった、叙情的なフレーズを織り交ぜる。
