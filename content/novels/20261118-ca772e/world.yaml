title: ゼロ地点のオーバータイム：リバース・エッジ
genre: スポーツ青春
tone: 熱い試合描写、汗と呼吸が聞こえる臨場感
pov: 一人称（俺）
tense: 現在形
setting: 現代、街のストリートコートおよび廃校寸前の地下図書館
premise: 一ノ瀬との激闘を制した相馬たちは、さらなる高みを目指して全国の猛者が集うストリートの頂点『記憶を売る市場』へと足を踏み入れる。そこで出会った謎の古本屋に眠る新たな古い戦術論と、自らの身体に刻んだ反復練習の果てに、相馬は再び計算を超えた領域へと挑む。泥臭い技術と熱い呼吸が交錯する、新たな3x3バスケの死闘が幕を開ける。
themes:
- 反復練習の果てにある進化
- 予測不能な熱量の証明
rules:
- 3x3バスケットボールの公式ルールおよびストリートの独自ルールに準拠する
- 前作で描かれた「計算された正解を崩す不純物の動き」の設定を引き継ぐ
- 魔法や超能力は一切登場せず、徹底的なフィジカルと戦術のぶつかり合いを描く
plot_outline:
- '序盤: 一ノ瀬との勝利の余韻冷めぬ中、相馬と久我は次なるステージである『記憶を売る市場』の噂耳にする。その一角にある古本屋で、新たな戦術のヒントを得た相馬は、さらなる過酷な反復練習を開始する。'
- '中盤: 全国から集結した規格外のライバルたちが相馬たちの前に立ちはだかる。有沢のデータ分析をあざ笑うかのような圧倒的な個の力に対し、相馬の身体は限界を超えた反復の精度で対抗しようとする。'
- '終盤: 迎えた市場のメインコートでの決戦。相手の完璧な守備網の前に相馬たちの攻撃は完全に封じられ、コート上には息詰まる静寂と絶望が広がる。'
- '結末: 絶望の淵で、相馬は地下図書館と古本屋で培ったすべての記憶と反復の熱を爆発させる。計算を超えた一投が再びリングを捉え、仲間たちと共に新たな頂点へと駆け上がる。'
style_notes: 一人称「俺」を使用し、試合中は実況のような圧倒的なテンポ感で描写する。足音、心臓の鼓動、汗の匂い、筋肉のきしみなど、五感を刺激する臨場感を徹底して文章に込める。
