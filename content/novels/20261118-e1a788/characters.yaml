- name: 佐倉 湊 (さくら みなと)
  role: 主人公
  age: 17
  gender: 男性
  appearance: どこにでもいそうな、少し猫背で冴えない高校二年生。常にスマートフォンを片手に持ち、画面の光に照らされた隈のある瞳が特徴。
  personality: 内向的で自己肯定感が低い。承認欲求と、それが満たされない虚無感の板挟みになっている。一人称は「ボク」。
  speech_style: 独り言のような、自信なさげで緩い話し方。配信では少しだけ饒舌になる。
  background: 地方都市の高校に通う。SNSでの「いいね」や「フォロワー数」を、自分の存在価値の指標として依存してしまっている。
  motivation: ルナという謎の存在との交流を通じて、自分が本当に求めている「誰かとの繋がり」を見つけること。
  relationships:
  - name: ルナ
    relation: 深夜の配信で出会った謎の美少女（オンライン上の交流相手）
  arc: 画面越しの虚構の評価に依存する状態から、不器用でも現実の世界で自分の足で立つ勇気を持つようになる。
- name: 'ルナ (本名: 結城 瑠奈 / ゆうき るな)'
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: SNSのアイコンは月をモチーフにした幻想的なイラスト。現実は、透き通るような肌と、どこか現実離れした静かな美しさを持つ少女。
  personality: ミステリアスで、時に残酷なほど鋭い洞察力を持つ。自由奔放だが、孤独を抱えている。一人称は「私」。
  speech_style: 詩的で、相手の核心を突くような、少し浮世離れした言葉選びをする。
  background: 地元の祭りにまつわる伝承を好む、少し変わった感性の少女。現実の世界に馴染めず、夜の静寂に居場所を求めている。
  motivation: 湊という「自分と同じ孤独を知る人間」を、画面の外の現実へと連れ出すこと。
  relationships:
  - name: 佐倉 湊
    relation: 配信を通じて心を通わせる、唯一の理解者
  arc: 「幽霊」のような存在として隠れて生きるのではなく、一人の人間として現実の世界に足跡を残そうとする。
- name: 高城 蓮 (たかぎ れん)
  role: 相棒/脇役
  age: 17
  gender: 男性
  appearance: 明るい髪色で、常にスポーツウェアやカジュアルな服装をしている。活発で、周囲を明るくする雰囲気を持つ。
  personality: 社交的で直感的。湊の幼馴染。面倒見が良いが、時としてデリカシーに欠ける。
  speech_style: ハキハキとした、距離感の近いフランクな話し方。
  background: 部活動に励む、いわゆる「陽キャ」の高校生。湊の孤独に気づきつつも、踏み込みすぎない距離で見守っている。
  motivation: 湊がSNSの闇に沈みすぎないよう、彼を現実の活動（部活や遊び）に引き戻すこと。
  relationships:
  - name: 佐倉 湊
    relation: 幼馴染であり、現実世界との唯一の接点
  arc: 湊の変化を間近で見守り、彼が「バズらない日常」の価値に気づくプロセスを支える。
