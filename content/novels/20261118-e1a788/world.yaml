title: バズらない僕らの、月蝕エスケープ・ルート
genre: 青春恋愛
tone: 軽快・スピード感・エモーショナル
pov: 一人称（ボク）
tense: 現在形と過去形の混在
setting: 現代、地方都市の高校、深夜のSNS空間
premise: フォロワー数ゼロ、承認欲求の死骸を抱えたボクは、深夜の配信中に謎の美少女『ルナ』と出会う。彼女は『祭りの夜、月が隠れる瞬間にだけ現れる幽霊』だと嘯き、ボクを現実逃避の旅へと誘う。SNSの通知音と、消えゆく月食の影。画面越しの嘘か、それとも現実の奇跡か。ボクたちは、世界がバズる前に、自分たちだけの正解を見つける。
themes:
- 承認欲求と自己肯定
- デジタルの繋がりと身体的な距離感
rules:
- ルナは月食の時間帯にしか特定のハッシュタグで投稿できない
- 現実の人間関係はSNSの通知に依存している
- 祭りの夜の喧騒は、彼女の存在を隠すためのノイズとして機能する
plot_outline:
- '序盤: 承認欲求に飢えたボクが、深夜の独り言配信中に謎のユーザー『ルナ』からリプライをもらう。彼女の言葉は鋭く、ボクの虚無感を正確に突いてくる。'
- '中盤: ルナとのチャットが日常の一部となり、ボクは彼女の正体を追う。彼女が予告した『祭りの夜』に向けて、ボクは画面の中ではなく、現実の街へと走り出す。'
- '終盤: 月食が始まる。祭りの喧騒の中、ボクはスマホの画面越しではなく、肉眼で彼女を探す。月が欠けていくカウントダウンと共に、ルナの正体が明かされる。'
- '結末: 月食が終わり、世界が再び明るくなる。ルナは消えてしまったが、ボクのスマホには、彼女が最後に残した『現実で会おう』という、バズらない、けれど最高に熱い一文が残っていた。'
style_notes: 一人称『ボク』によるメタ発言多めの語り。文章の合間に『【コメント欄】』や『【SNS投稿】』のセクションを挿入し、物語の進行を加速させる。句読点を少なめにし、チャット形式の短いフレーズを多用する。情緒的なシーンでは一転して、歌詞のような叙情的な一文を挟むこと。
