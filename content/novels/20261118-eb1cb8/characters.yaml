- name: エリス・ヴォーン
  role: 主人公
  age: 28
  gender: 女性
  appearance: 無機質なグレーの制服に身を包み、常に生体モニターが点滅するチョーカーをつけている。感情が乏しいため、瞳には光がなく、銀色の髪をタイトに束ねている。
  personality: かつては忠実な記録官だったが、知的好奇心と内面の微かな違和感を抑えきれなくなる。一人称は「私」。
  speech_style: 淡々と事実を述べるような、抑揚のない敬語。
  background: セクター09の管理システムに組み込まれ、死者のデータ抹消作業を淡々とこなしてきたエリート市民。
  motivation: 遺言に残された「砂漠のオアシス」の真実を突き止め、管理外の世界を確認すること。
  relationships:
  - name: カイン・グレイス
    relation: 彼女を追う冷酷な管理官
  arc: 感情を否定された世界で、小さな言葉や植物の命に触れることで人間性を取り戻し、最期にはシステムに抗う記憶を刻む。
- name: カイン・グレイス
  role: 敵役
  age: 35
  gender: 男性
  appearance: シワ一つない黒の治安維持官制服。鋭い眼光を隠さない金属製のグラスをかけている。
  personality: 秩序と効率を絶対の正義と信じ、少しの逸脱も許さない冷徹な男。一人称は「私」または「統制官」。
  speech_style: 威圧的かつ理路整然とした、冷たい口調。
  background: 共鳴管理システムの維持を最優先任務とするエリート治安維持官。エリスの異変を察知し、執拗に追跡する。
  motivation: セクター09の秩序を守るため、逸脱者であるエリスを拘束し、隠蔽された情報を完全に抹消すること。
  relationships:
  - name: エリス・ヴォーン
    relation: 追跡対象であり、かつての同僚
  arc: 最後までシステムの忠実な番犬としてエリスを追い詰めるが、彼女の最期の行動にある種の狂気と人間の強さを垣間見る。
- name: ルカ・アッシュ
  role: 相棒
  age: 22
  gender: 男性
  appearance: ボロボロの作業着の下に手製の隠しポケットを持ち、日焼けした肌と警戒心の強い野生動物のような目をしている。
  personality: 表向きは従順を装うが、内面では自由と音楽を愛する反逆児。一人称は「僕」または「オレ」。
  speech_style: 早口で、やや荒っぽいが人懐っこい口調。
  background: 地下都市の最底辺で生まれ育ち、旧時代の音楽や紙の断片を密かに共有する抵抗グループの一員。
  motivation: 管理システムから逃れ、地表にあるという伝説のオアシスへ辿り着くこと。
  relationships:
  - name: エリス・ヴォーン
    relation: 偶然出会い、共に地表を目指す共犯者
  arc: エリスに外の世界の手がかりを与え、彼女と共に管理社会の壁に風穴を開けようと奮闘する。
