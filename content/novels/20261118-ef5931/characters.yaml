- name: 佐伯 透
  role: 主人公
  age: 22
  gender: 男性
  appearance: 都会的な服装に身を包んでいるが、目の下に隈があり疲弊した表情。祖父の形見である古びた銀の懐中時計を常に持っている。
  personality: 合理的で懐疑的。論理的に説明できないことを嫌う。一人称は「俺」。
  speech_style: 標準語。皮肉屋な一面があり、村の因習に対して冷ややかな口調で接する。
  background: 大学卒業後、祖父の死をきっかけに15年ぶりに夜凪村へ帰郷。幼少期の記憶に断片的な空白がある。
  motivation: 祖父の死の真相を突き止め、この奇妙な村から早く立ち去ること。
  relationships:
  - name: 権蔵
    relation: 反発しつつも、村の情報を得るために頼らざるを得ない関係
  - name: 瀬戸 紗夜
    relation: 記憶の中の幼馴染。再会してからも拭えない違和感を抱いている
  arc: 迷信を否定する合理主義者から、逃れられない血縁の宿命と狂気に直面し、最終的に人間としての自我を喪失して神の依代へと変貌する。
- name: 権蔵
  role: 敵役/案内役
  age: 78
  gender: 男性
  appearance: 深く刻まれた皺と、濁りながらも鋭い眼光を持つ。常に村の伝統的な装束を纏い、手には使い古された数珠を握っている。
  personality: 冷酷で保守的。村の存続のためなら個人の犠牲を厭わない。一人称は「わし」。
  speech_style: 重々しい地方方言。断定的な言い回しが多く、相手を威圧する話し方。
  background: 夜凪村の長老であり、代々「眠らぬ神」への供物を管理し、儀式を主宰してきた責任者。
  motivation: 儀式を完遂させ、村にさらなる繁栄と平穏をもたらすこと。
  relationships:
  - name: 佐伯 透
    relation: 村を維持するための『最高の供物』として、適切に絶望へ導くべき対象
  arc: 透に警告を与えるふりをして、彼が自らの意志で禁忌を破り、列車に乗り込むよう心理的に追い詰めていく。
- name: 瀬戸 紗夜
  role: 相棒/導き手
  age: 21
  gender: 女性
  appearance: 透と同じ年頃だが、肌は不自然なほど白く、瞳に生気がない。白いワンピースを纏い、霧のように儚い佇まいをしている。
  personality: 物静かで厭世的。生者と死者の境界にいるような浮遊感を持つ。一人称は「私」。
  speech_style: 囁くような静かな話し方。比喩的な表現が多く、答えを明言しない。
  background: 透の幼馴染。数年前に村で「失踪」したとされているが、実際には不完全な供物となり、異界の街を彷徨う存在となった。
  motivation: 透に警告を発して救いたいという微かな願いと、彼を自分と同じ孤独な世界へ引き込みたいという矛盾した欲求。
  relationships:
  - name: 佐伯 透
    relation: かつての親友であり、唯一の心の拠り所
  - name: 権蔵
    relation: 自分を捨てた村のシステムへの静かな憎しみ
  arc: 透に異界の真実を伝え、彼が絶望し変貌する過程を隣で見守ることで、自らも完全に人間としての未練を断ち切る。
