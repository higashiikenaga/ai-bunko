title: 夜凪の供物 ―終着駅の眠らぬ神―
genre: 怪談・民俗
tone: 静謐で逃げ場のない土着的な恐怖
pov: 三人称
tense: 過去形
setting: 昭和後期、山間の閉ざされた海辺の町「夜凪村」
premise: 夜凪村には、一年に一度、深夜の最終列車が駅に止まる時だけ訪れる「眠らない街」の幻影があるという。村の者たちはその夜、決して外に出てはならず、灯りを消して静かに過ごすことを儀式として守り続けてきた。しかし、都会から帰郷した青年・透は、その禁忌を破り、深夜に到着した存在しないはずの最終列車へと足を踏み入れてしまう。そこは、村の因習が形を変えて蠢く、底なしの異界であった。
themes:
- 血縁による呪縛
- 信仰の変質
- 境界線
rules:
- 最終列車の時刻は、村の神事である『凪の儀』が終わる瞬間と同期する
- 夜凪村の住人は、夜間に『眠らない街』の住人と目を合わせてはならない
- 駅のホームに降り立った者は、村の古い掟に従って『供物』として捧げられる運命にある
plot_outline:
- '序盤: 祖父の死をきっかけに夜凪村へ戻った透は、村の異常な閉鎖性と、夜になると街全体が不自然な静寂に包まれることに違和感を覚える。村の長老から『夜の列車に気をつけろ』と警告を受けるが、透はそれを迷信だと切り捨てる。'
- '中盤: 深夜、透は幻聴に誘われるように駅へと向かい、霧の向こうから現れた最終列車に乗り込んでしまう。車内は、かつて村で行方不明になった者たちの姿で満たされており、列車は止まることなく、眠ることのない異界の街を走り続ける。'
- '終盤: 列車が辿り着いたのは、村の地下に眠る巨大な祠の概念が具現化した場所だった。透は、村の繁栄が『夜の街』から訪れる客を供物として差し出すことで維持されてきたという、恐るべき真実を知る。村の大人たちは、透を救うためではなく、儀式を完遂させるために彼を追い詰めていく。'
- '結末: 逃げ場のない駅のホームで、透は村の古い神の依代として、永遠に眠ることのない街の住人へと変貌していく。翌朝、村はいつも通り穏やかな朝を迎えるが、透の姿はどこにもなかった。'
style_notes: 湿り気を帯びた、重苦しい文体を用いる。方言は過度な誇張を避け、生活に根付いた自然な響きとして配置する。祭りの囃子や潮騒の音を、不吉な予兆として象徴的に描写し、読者の生理的な不安を煽るような、静かで逃げ場のない恐怖を追求すること。
