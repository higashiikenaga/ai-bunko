- name: 真壁 弦之丞
  role: 主人公
  age: 32
  gender: 男
  appearance: 痩身だが引き締まった体躯。使い古された藍色の着物を纏い、鋭い眼光を持つ。廃刀令後も隠し持った一振りの打刀が唯一の拠り所。
  personality: 寡黙でストイック。義理堅く、時代の流れに絶望しながらも捨てきれない矜持を持つ。一人称は「俺」。
  speech_style: 簡潔でぶっきらぼうな江戸言葉。感情をあまり表に出さない。
  background: かつて新政府軍と対立した藩の精鋭剣客。戦火の中で盟友の九条と「いつか全てが終われば、約束の丘で再会しよう」と誓い合ったが、敗北し居場所を失った。
  motivation: 九条との約束を果たすこと。そして、変わり果てた盟友と向き合い、武士としての終止符を打つこと。
  relationships:
  - name: 九条 慎之介
    relation: かつての盟友であり、現在は宿敵
  - name: お琴
    relation: 恩義を感じている保護者的な存在
  arc: 時代の犠牲者として孤独に沈んでいたが、死地へ向かう決意をすることで、自らの人生の意味を取り戻す。
- name: 九条 慎之介
  role: 敵役
  age: 33
  gender: 男
  appearance: 仕立ての良いフロックコートに身を包み、金縁の眼鏡をかけた知的な風貌。手には懐中時計を携えている。
  personality: 冷徹な合理主義者。新時代への適応を至上とし、旧時代の価値観を切り捨てる。一人称は「私」。
  speech_style: 丁寧で理路整然とした口調。相手を突き放すような冷ややかな響きがある。
  background: 真壁と共に剣を学んだ親友。しかし、時代の転換をいち早く察知し、新政府に転向。鉄道事業の推進責任者として、近代化の象徴である列車を走らせる。
  motivation: 日本の近代化を完遂させること。そのためには、かつての自分や真壁のような「古い殻」を完全に破壊しなければならないと考えている。
  relationships:
  - name: 真壁 弦之丞
    relation: 唯一、自分を対等に理解し得ると信じている旧友
  arc: 合理性の仮面で隠していた、過去への未練と真壁への情愛が、最後の決闘によって剥き出しになる。
- name: お琴
  role: 相棒/脇役
  age: 21
  gender: 女
  appearance: 活動的な格好をした若い女性。着物に洋傘を合わせるなど、文明開化の影響を受けた服装。快活な笑顔が特徴。
  personality: 好奇心旺盛で情に厚い。古き良きものと新しいものの調和を信じている。一人称は「私」。
  speech_style: 快活で親しみやすい口調。時折、年上の真壁に対して遠慮のない物言いをする。
  background: 真壁に居候先の屋敷を提供している元藩士の娘。鉄道という未知の乗り物に憧れを抱いており、真壁の孤独を誰よりも案じている。
  motivation: 真壁に生きていてほしいと願うこと。彼が過去に囚われず、新しい時代に居場所を見つけることを望んでいる。
  relationships:
  - name: 真壁 弦之丞
    relation: 兄のような、あるいは憧れの対象のような存在
  arc: 真壁の覚悟に触れ、ただ守られる側から、彼を精神的に支え送り出す強さを得る。
- name: ハリスン大佐
  role: 脇役/障害
  age: 45
  gender: 男
  appearance: 恰幅の良い体格に英国軍の正装。手入れされた口髭を蓄え、最新式の拳銃を誇らしげに携帯している。
  personality: 傲慢で自信家。東洋の剣術を「原始的な踊り」と見下しており、近代兵器の圧倒的優位を証明することに執着している。
  speech_style: 尊大な態度。翻訳を介した不自然な日本語、あるいは英語を交えた話し方。
  background: 鉄道敷設の技術指導に就いている英国軍人。九条の権限を借りて、列車の警備体制を構築し、近代兵器の実験場として利用しようとしている。
  motivation: 真壁のような「最後の侍」を最新兵器で屈服させ、文明の勝利を誇示すること。
  relationships:
  - name: 九条 慎之介
    relation: ビジネスパートナーだが、内心では利用し合っている関係
  arc: 自身の信じる「科学的絶対優位」が、真壁の極めた剣の一撃によって打ち砕かれる絶望を味わう。
