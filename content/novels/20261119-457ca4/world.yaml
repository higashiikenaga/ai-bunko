title: 約束の丘、最終列車の果てに
genre: 歴史・時代小説
tone: 重厚、凄絶、静謐
pov: 三人称
tense: 過去形
setting: 明治初期、文明開化の波が押し寄せる帝都近郊
premise: 文明開化の咆哮が、武士の時代の終焉を告げていた。元剣客・真壁は、かつての盟友が新政府の要職として、時代の象徴である「最終列車」に乗り込んだことを知る。真壁には、かつて戦火の中で交わした「約束の丘で必ず再会する」という誓いがあった。蒸気の熱気と鋼の響きが交錯する中、真壁は一振りの刀を手に、宿命の決闘へと突き進む。
themes:
- 武士道の終焉
- 時代の変遷と個の矜持
rules:
- 剣術は魂の顕現であり、抜刀は死の覚悟を意味する
- 近代的な鉄路は、古き時代の秩序を物理的・精神的に破壊する象徴として描く
plot_outline:
- '序盤: 廃刀令により居場所を失った真壁の孤独な日常。刺客との小競り合いを通じ、彼の剣の凄まじさが描かれる。'
- '中盤: 盟友が鉄道事業の推進者となり、伝統的な価値観を破壊している事実を知る。真壁は復讐ではなく、誓いを果たすために動き出す。'
- '終盤: 夜の闇を走る最終列車に乗り込み、揺れる車両の中で近代兵器を操る刺客たちを斬り伏せていく。'
- '結末: 列車の終着駅、月明かりに照らされた約束の丘にて、真壁と盟友の命を懸けた一騎打ちが始まる。'
style_notes: 簡潔で力強い文体。剣戟の描写は、一撃の重みや肉を断つ感覚を重視する。立ち合いの直前、風の止み、草の匂い、呼吸の音といった「静」の描写を徹底的に重ねることで、爆発的な「動」への緊張感を演出すること。
