title: 銀粒子の大河：熱の遺産と忘却の市場
genre: 群像劇
tone: 壮大、哀愁、変革の予感
pov: 三人称（章ごとに視点人物を変更）
tense: 過去形
setting: '魔法が物理エネルギー（銀色の粒子）へと変質し、蒸気機関による産業革命が加速した新時代。都市ルミナリスとその周辺。 '
premise: 魔法の終焉と引き換えに手に入れた「銀色の粒子」は、文明を熱で潤す一方で、人々の大切な記憶をも糧としていた。蒸気機関の隆盛の陰で、人々は失った記憶を買い戻すため「記憶を売る市場」へと奔走する。かつての英雄アリステア、エレナ、サイラスの足跡を辿りながら、名もなき庶民や新世代の技術者たちが、技術の進歩と引き換えに失われゆく人間性の在り方を巡って衝突する。熱に満ちた新世界は、果たして真の救済をもたらすのか、それとも新たな空虚へと向かうのか。
themes:
- 技術革新と人間性の喪失
- 記憶の価値とアイデンティティ
- 継承される意志
rules:
- 銀色の粒子は、物理的な熱エネルギーとして変換可能だが、その変換効率を高めるには抽出元の『記憶』の純度が必要である。
- 記憶を失った者は、感情の起伏が乏しくなり、社会的な『空洞化』と呼ばれる精神的退廃に陥る。
- 地下図書館は、旧時代の魔法理論と、新時代の物理法則を照合するための唯一の聖域として存在する。
- 蒸気機関は銀色の粒子を燃料とするが、過剰な消費は周囲の『記憶の密度』を希薄化させる。
plot_outline:
- '序盤: 蒸気文明が花開くルミナリス。記憶を売買する露店が街の影を支配し、市場で記憶を失い続ける貧困層の視点から、世界の歪みが描かれる。かつて世界を救ったエレナの技術を継承しようとする若き技師が、粒子の暴走による記憶消失事件に遭遇する。'
- '中盤: 記憶の市場を管理する巨大資本と、地下図書館を守護するサイラスの残党との対立。アリステアの意志を継ごうとする者たちが、粒子の正体が『人類の精神の結晶』であることを突き止める。視点は貴族から、市場の片隅で生きる名もなき物売りの子供へと移り、文明の光と影が交錯する。'
- '終盤: 粒子を過剰に消費した結果、都市の周囲に『記憶の空白地帯』が拡大。実体を持たない『忘却の嵐』がルミナリスを襲う。エレナの設計した巨大蒸気炉を用い、失われた記憶を熱としてではなく、再び『情報の秩序』として再構築しようとする壮絶な闘いが始まる。'
- '結末: 記憶を完全に消費することなく、技術と共存する新たなエネルギー循環の法則が確立される。英雄たちの名は歴史の表舞台からは消えるが、名もなき人々が手放さなかった小さな記憶の断片が、新時代の礎となっていく様子を俯瞰的に描き、物語は幕を閉じる。'
style_notes: 大河群像劇としての重厚さを保つため、一人称の主観に寄りすぎず、常に時代のうねりを感じさせる俯瞰的な描写を心がける。高潔な志を持つ者、野心に燃える者、そしてただ日々の糧を求める名もなき庶民の視点を等価に扱い、対比させる。情景描写においては、蒸気の煤煙と銀色の粒子の輝き、氷の冷たさと熱の熱量を五感に訴える言葉で描き分ける。
