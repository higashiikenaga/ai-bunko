- name: カイ・ルミナス
  role: 主人公
  age: 16
  gender: 男性
  appearance: 額に使い古したゴーグルを乗せ、油汚れのついたオーバーオールを着用。好奇心に満ちた琥珀色の瞳が特徴。
  personality: 前向きで凝り性。機械いじりをこよなく愛する職人気質。一人称は「俺」。
  speech_style: 直情的で快活。機械の話になると早口になり、専門用語が混ざる。
  background: 浮遊島の辺境で廃材回収屋を営む整備士。幼い頃に失踪した父が遺した「動く星図」を大切に保管していた。
  motivation: 父が追い求めた『最終列車』を見つけ、父が何を見たのかという真実を知ること。
  relationships:
  - name: リナ
    relation: 信頼し合う旅の相棒であり、最高のパイロット
  - name: アリスター
    relation: 知識面で頼りにしている導き手
  - name: ヴァレリウス将軍
    relation: 信念の対立する宿敵
  arc: 孤独な回収屋から、仲間と共に未知の航路を切り拓くリーダーへと成長する。
- name: リナ・スカイウォーカー
  role: 相棒
  age: 17
  gender: 女性
  appearance: 風になびく短い銀髪に、赤い飛行ジャケットを羽織っている。身軽な身のこなしと鋭い眼差しを持つ。
  personality: 自由奔放で大胆不敵。束縛を嫌い、常に刺激を求める。一人称は「私」。
  speech_style: 自信たっぷりで勝ち気。ぶっきらぼうだが、時折年相応の少女らしい一面を見せる。
  background: 元・帝国騎士団の試験飛行士だったが、規律に嫌気がさして脱走。現在はフリーのスカイ・サーファーとして活動している。
  motivation: 世界の果てにあると言われる『究極の景色』をこの目で見ることで、真の自由を得ること。
  relationships:
  - name: カイ
    relation: 最初は呆れていたが、彼の純粋さと技術力に惹かれ、深い信頼を寄せる
  - name: アリスター
    relation: 口うるさいお兄さん的な存在として扱い、よくからかっている
  arc: 個人の自由だけを追い求めていたが、仲間と共に目的地へ向かう「共有された目的」の尊さに気づく。
- name: アリスター・クロムウェル
  role: 脇役/ガイド
  age: 24
  gender: 男性
  appearance: 片目にモノクルをかけ、長いフロックコートを纏った痩身の青年。常に古書や手帳を携帯している。
  personality: 冷静沈着で分析的。皮肉屋だが根は情に厚い。一人称は「私」。
  speech_style: 丁寧で理知的。説明口調になりやすく、論理的な正しさを重視する。
  background: 帝国の歴史学者だったが、禁忌とされる『最終列車』の研究を行ったために追放された。星図の解読方法に精通している。
  motivation: 歴史の空白となっている『最終列車』の実証を行い、学術的な名誉を回復すること。
  relationships:
  - name: カイ
    relation: 彼の持つ星図に学術的価値を見出し、旅の案内役を自任する
  - name: リナ
    relation: 奔放な振る舞いに頭を悩ませつつも、その操縦技術を高く評価している
  arc: 文献の中の真実だけを信じていたが、自らの足で世界を巡ることで、理論を超えた直感と絆を信じられるようになる。
- name: ヴァレリウス将軍
  role: 敵役
  age: 45
  gender: 男性
  appearance: 隙のない黒い軍服に身を包み、冷徹な眼差しを持つ。右頬に古い飛行戦の傷跡がある。
  personality: 傲慢で支配欲が強い。秩序こそが世界を救うと信じ、効率と力を最優先する。一人称は「私」。
  speech_style: 威圧的で断定的。相手を格下として扱う冷酷な口調。
  background: 空の秩序を守る騎士団の最高責任者。世界の運行を制御する『最終列車』を軍事利用し、全浮遊島を統治する計画を立てている。
  motivation: 最終列車を手に入れ、混沌とした空の世界に絶対的な秩序（支配）をもたらすこと。
  relationships:
  - name: カイ
    relation: 星図を持つ不都合な存在として排除しようとするが、次第にその才能を危惧する
  - name: リナ
    relation: 裏切り者として憎んでおり、屈服させて連れ戻そうとする
  arc: 絶対的な力による統治を信じていたが、予測不能な少年たちの情熱と連携に敗れ、世界の真の姿を突きつけられる。
