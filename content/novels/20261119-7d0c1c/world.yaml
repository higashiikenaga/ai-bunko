title: 蒼穹のステラ・レイル ―風を刻む銀翼と星図の航跡―
genre: スチームパンク冒険
tone: 爽快で躍動感あふれる冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島が点在する空中世界「アエロ・スカイ」。蒸気機関と風力発電が高度に発達した文明。
premise: 空を駆ける小型飛空艇の整備士少年カイは、亡き父が遺した古びた「星図」を手に、伝説の「最終列車」を探す旅に出る。それは雲海の果て、世界の境界を走ると言われる、全ての願いを叶える蒸気機関車だった。仲間と共に空の嵐を突き抜け、カイは失われた星々の記憶と、世界の真実へと加速していく。
themes:
- 空への憧憬
- 絆と継承
- 未知への挑戦
rules:
- 空の航路は風の流れ（気流）によって決まり、高度によって酸素濃度が激変する
- 浮遊島を繋ぐのは、軌道上を走る磁気浮上式の蒸気列車のみである
- 星図は特殊な天体観測用レンズを通してのみ、実際の航路を映し出す
plot_outline:
- '序盤: 廃材回収屋のカイが、父の遺品である動く星図を見つける。そこには伝説の『最終列車』へと続く未知の航路が記されていた。スカイ・サーファーの少女リナと出会い、二人は愛機『スカイ・ウィング号』で旅立つ。'
- '中盤: 雲海に潜む海賊や、空の秩序を守る騎士団の追撃をかわしながら、各地の浮遊島を巡る。仲間が増えるたび、星図はより鮮明な光を放ち、目的地が『空の最果て』であることを示していく。'
- '終盤: 巨大な嵐の目の中で、ついに銀色の煙を引く『最終列車』を発見する。それは物質ではなく、星々の運行を制御する巨大な動力機関だった。列車を奪おうとする帝国に対し、カイたちは飛空艇の全出力を解放して挑む。'
- '結末: 激闘の末、カイたちは列車の真の目的が『新しい星図』を刻むことだと知る。空は再び開かれ、彼らは新たな航路を切り拓くために、果てしない青へと飛び立っていく。'
style_notes: 風が機体を叩く音、蒸気が噴き出す轟音、歯車が噛み合う金属音を細かく描写し、読者がその場にいるような臨場感を与える。空の青さや雲の質感、翼が風を切る爽快感を、勢いのある短い文章と躍動的な語彙で表現すること。
