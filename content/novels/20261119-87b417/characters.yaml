- name: レオン・ヴォックス
  role: 主人公
  age: 22
  gender: 男性
  appearance: 左目が義眼の痩身の青年。下層の酸性雨でボロボロになったフード付きのコートを羽織り、指先には神経接続用の端子が露出している。
  personality: シニカルだが生存本能が強い。皮肉屋でめったに他人を信用しない。一人称は「オレ」。
  speech_style: ぶっきらぼうで短気。専門用語を混ぜた毒舌が多い。「ちっ、またシステムがごねやがった」
  background: ネオ・エデン下層のスラム育ち。生きるためにハッキング技術を叩き込み、企業から細々とデータを盗んで日銭を稼いでいる。
  motivation: 偶然手に入れた「最終列車」の設計図を元手に一山当てること、そして追っ手から逃げ延びること。
  relationships:
  - name: クロエ・ジン
    relation: レジスタンスの協力者。データ解読の相棒
  - name: ザビエル・クロス
    relation: 執拗に追ってくるアトラスの執行官
  arc: 最初は単なる金儲けと逃亡のつもりだったが、世界の真実に触れ、自らの意志で肉体を捨てて自由な「ゼロ地点」へダイブする決断を下す。
- name: クロエ・ジン
  role: 相棒
  age: 25
  gender: 女性
  appearance: 煤けた作業着を着ており、機械油とタバコの匂いがする。腕には旧時代の歯車を模したタトゥーがある。
  personality: 情に厚く豪胆。骨董品のような旧式機械を愛するロマンチスト。一人称は「あたし」。
  speech_style: 男勝りでサバサバしている。「おい、感傷に浸ってる暇はないぜ、鉄の塊が来るぞ」
  background: アトラス上層の技術者だったが、旧時代の機械文明に魅せられ、組織を裏切って下層のレジスタンスに加わった。
  motivation: 「最終列車」を完成させ、アトラスの支配から人間性を解放すること。
  relationships:
  - name: レオン・ヴォックス
    relation: データ強奪に巻き込んだハッカー。頼もしいが危なっかしい相棒
  arc: 失われた機械技術の復元を通じて、人間が機械に支配されない未来のための礎となる。
- name: ザビエル・クロス
  role: 敵役
  age: 40
  gender: 男性
  appearance: 鉄の無機質なマスクで顔の下半分を隠した長身の男。アトラスの漆黒の制服を完璧に着こなしている。
  personality: 冷酷非情で秩序を重んじる。感情を見せず、効率と任務遂行のみを正義とする。一人称は「私」。
  speech_style: 抑制された静かなトーン。「貴様の行動はすべて予測の範囲内だ。おとなしく引き渡せ」
  background: アトラスの最高執行官。ネオ・エデンの秩序を乱す異端者や反逆者を容赦なく排除してきたエリート。
  motivation: 流出した「最終列車」の設計図を回収し、企業の極秘プロジェクトを完璧に完遂させること。
  relationships:
  - name: レオン・ヴォックス
    relation: 追跡対象の逃亡者
  arc: レオンたちの執拗な逃亡劇の前にシステムの一部として敗北し、管理社会の絶対性が揺らぐ瞬間を目の当たりにする。
