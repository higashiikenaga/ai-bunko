title: 鋼鉄の胎動：蒸気駆動の亡霊たち
genre: サイバーパンク
tone: ネオンに濡れたハードボイルド、高速な疾走感
pov: 一人称（オレ）
tense: 現在形と過去形の混濁
setting: 2114年、超巨大企業「アトラス」が支配する垂直都市ネオ・エデン。上層の無菌区画と、下層の酸性雨が降り注ぐスラムの対比。
premise: ネオンの光が目に刺さる。オレは路地裏でジャンクを漁るハッカーだ。ある夜、旧時代の「蒸気機関」を組み込んだ、動くはずのない「最終列車」の設計図をハッキングで奪い取る。それは、全人類の意識をアップロードする極秘プロジェクトの鍵だった。追っ手はアトラスの執行官。オレは雨に紛れ、鉄の塊が唸る終着点へと走り出す。
themes:
- 技術の遺物と進化の代償
- 支配層の欺瞞と路地裏の生存戦略
rules:
- 意識のデータ化（ダイブ）には高負荷な神経接続が必要
- 下層部では蒸気圧を利用した旧式デバイスが生命線となっている
- アトラスのセキュリティ・プログラムは物理的な実体を持つドローンとして展開する
plot_outline:
- '序盤: ネオ・エデンの湿った路地裏。オレは偶然、企業から流出した『蒸気駆動型・超高速列車』の暗号化データを抜き取る。直後、アトラスの追っ手による強制排除が始まる。'
- '中盤: 逃亡中、オレは旧時代の技術を愛するレジスタンスと合流。設計図の正体が、肉体を捨ててデジタル世界へ逃避するための『最終列車』であることを知る。ハッキングのコードが脳を焼く。情報の奔流の中で、オレは真実に触れる。'
- '終盤: 廃線となった旧区画。蒸気を吹き上げながら、物理的な重圧を伴って動き出す『最終列車』。オレはアトラスの電脳防壁を突破するため、命を削るオーバークロックを敢行する。'
- '結末: 列車の終着駅は、物理的な場所ではなく、意識の果てにある空白。オレは、ネオンの光も雨も届かない、真に自由な『ゼロ地点』へとダイブする。'
style_notes: 短いセンテンスを多用。ネオンの色彩、雨の冷たさ、金属の臭いを強調する。ハッキング描写は、論理ゲートの突破やパケットの衝突など、具体的で硬質な擬音や造語を混ぜてスピード感を出す。独白は『オレ』を用い、皮肉めいたハードボイルドな口調で。
