title: 【悲報】推しが消えたので、遺言に従って初恋を完遂させる件について
genre: 青春恋愛
tone: 軽快、メタ的、ネットスラング混じりの疾走感
pov: 一人称（ボク）
tense: 現在形（独白形式）
setting: 現代日本、SNSや動画配信が生活の中心となっている高校
premise: 学校一のカリスマ配信者・凪（ナギ）が突如全アカウントを消して失踪した。そんなボクの元に届いたのは、彼女が遺した「デジタル遺言」という名のクソゲーみたいなクエスト。条件をすべてクリアすれば彼女に会えるというルールに従い、ボクはネット上の大騒動に振り回されながら、彼女が指定した「約束の丘」を目指すことになる。
themes:
- デジタルとリアルの境界線
- 不器用な自己開示
rules:
- 凪のデジタル遺言は、特定の条件（指定の場所への訪問やSNSへの投稿）を満たさないと次のメッセージが解禁されない仕組みになっている
- 作中のSNS（架空のプラットフォーム）の反応が、主人公の行動を制限したり加速させたりするトリガーとなる
- 「約束の丘」は、凪がデジタルデバイスを一切禁止していた唯一の物理的な聖域である
plot_outline:
- '序盤: 人気配信者の凪が失踪し、クラスの地味な存在であるボクにだけ「デジタル遺言」が届く。困惑しつつも、密かに抱いていた恋心からクエストを開始し、SNSで「凪の行方を知る謎の人物」としてバズり始める。'
- '中盤: クエストを進めるたび、凪が「完璧な配信者」として振る舞うことに限界を感じていた本音が断片的に明かされる。ボクは彼女の孤独に共感し、ネット上の喧騒から彼女を守りたいと願うようになる。'
- '終盤: 最終クエストである「約束の丘」へ向かう道中で、凪の失踪にまつわる衝撃の事実（大人の事情による強制的な活動休止）が判明。ボクは大勢のフォロワーたちが丘に集結するという絶望的な状況に直面する。'
- '結末: 喧騒をかき分けて、ついに生身の凪と再会。デジタルな繋がりを全て捨てた彼女と、泥臭い「対面」の恋を始める。ラストは二人の秘密のオフ会（デート）の報告ツイートで締めくくる。'
style_notes: 地の文に「(というか無理だろ)」「(ここでメタ的に言うと)」などのセルフツッコミを多用する。章の合間に【タイムライン】という形式で、作中のユーザーたちのリプライや、伏線となる投稿、配信のチャットログを挿入し、物語の状況を多角的に描写する。
