- name: 琥珀 栞（こはく しおり）
  role: 主人公
  age: 22
  gender: 女性
  appearance: 丸眼鏡に古本屋の店員エプロンを着用。常に古い紙と紅茶の香りを纏っている。控えめだが鋭い観察眼を持つ瞳。
  personality: 冷静で思慮深く、聞き上手。本のように静かな時間を愛する。一人称は「わたし」。
  speech_style: 丁寧で穏やかな口調。相手の言葉を否定せず、問いかけるように導く話し方。
  background: 路地裏の古本屋「琥珀堂」の店番兼、地下にある記憶市場の管理人。記憶の断片を整理し、適切な持ち主へ繋ぐ役割を担っている。
  motivation: 記憶の欠落に苦しむ人々を救い、物語としての人生を完結させる手助けをすること。
  relationships:
  - name: アルヴィン
    relation: 依頼人であり、記憶のパズルを解く相棒のような存在
  - name: エラ
    relation: 記憶の買い手であり、導くべき相手
  arc: 他者の記憶を整理するだけの傍観者から、自ら介入して二人の縁を繋ぐ「物語の編集者」へと変化する。
- name: アルヴィン・クレイ
  role: 主人公（依頼人）
  age: 24
  gender: 男性
  appearance: 少し乱れた茶髪に、使い込まれた時計職人のコートを羽織っている。どこか心に穴が開いたような、心細げな表情。
  personality: 誠実で純粋。責任感が強く、誰かのために自分を犠牲にする傾向がある。一人称は「僕」。
  speech_style: 少し自信なげで、言葉を詰まらせることが多い。丁寧だが、切実さが滲み出る話し方。
  background: 街の時計店で修行中の青年。ある目的のために「大切な記憶」を売ったが、その代償として「何を売ったか」という記憶まで失ってしまった。
  motivation: 失った記憶の正体を突き止め、自分が誰を愛し、何を届けたかったのかを思い出すこと。
  relationships:
  - name: 琥珀 栞
    relation: 唯一信頼して相談できる導き手
  - name: エラ
    relation: かつて深く愛し、今は記憶を失ってしまった大切な人
  arc: 喪失感に苛まれる日々から脱し、不完全な記憶であっても、新しく思い出を積み重ねる勇気を得る。
- name: エラ・ローレンス
  role: キーパーソン
  age: 23
  gender: 女性
  appearance: 深い紺色のドレスを纏い、白磁のような肌を持つ。常に小さな蒸気仕掛けのオルゴールを持ち歩いている。
  personality: 気高く、一見すると冷徹に見えるが、内面はひどく脆い。深い愛情ゆえに拒絶を選ぶ。一人称は「私」。
  speech_style: 理知的で格式高い話し方。感情を抑え、突き放すような言い方をすることがある。
  background: 街の有力者の娘。アルヴィンが売った「記憶」を買い取った人物。彼が自分への想いという「重荷」から解放されることを願い、その記憶を封印し続けていた。
  motivation: アルヴィンに過去の痛みを思い出させず、彼が自由に生きられるようにすること。
  relationships:
  - name: アルヴィン
    relation: 忘れられた恋人であり、守りたい相手
  - name: 琥珀 栞
    relation: 自分の頑なな心を解きほぐしてくれる理解者
  arc: 「相手のため」という独りよがりな善意を捨て、不格好でも共に記憶を共有して歩む道を選ぶ。
- name: モルガナ
  role: 脇役（情報提供者）
  age: 不詳（40代に見える）
  gender: 女性
  appearance: シルクハットにモノクルを着用。紫色の煙を吐き出すパイプを愛用している。派手でエキゾチックな装い。
  personality: 皮肉屋で享楽的。人間の矛盾や感情の揺れを見ることを最高の娯楽としている。一人称は「私」。
  speech_style: 演劇的な大げさな口調。相手を煙に巻くような比喩表現を多用する。
  background: 記憶市場の元運営責任者であり、現在は「記憶の鑑定士」として独立。琥珀堂の地下市場に特権的な出入り権を持つ。
  motivation: アルヴィンとエラの関係がどう転ぶかという「人間ドラマ」を特等席で観劇すること。
  relationships:
  - name: 琥珀 栞
    relation: 生意気だが有能な後輩のような存在
  arc: 物語の進行を促すトリックスターとして振る舞うが、最終的に二人の純粋な想いに触れ、わずかに心情が和らぐ。
