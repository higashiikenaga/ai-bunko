title: 琥珀色の記憶と、蒸気仕掛けの栞
genre: 本格ミステリー
tone: 温もりがあり、軽やかで心地よい日常の謎
pov: 一人称（わたし）
tense: 過去形
setting: 蒸気機関が生活の基盤となっている、霧深い港町。路地裏にある古本屋「琥珀堂」。
premise: わたしが店番をしている古本屋の地下には、人々が不要になった記憶を売り買いする「秘密の市場」がある。ある日、一人の青年が「大切な何かを売ってしまったが、それが何だったか思い出せない」と店を訪れる。本に挟まった不思議な栞と、街の蒸気時計の狂いから、彼は何を失い、誰に届けたのか。記憶の断片をパズルのように繋ぎ合わせる、やさしい物語。
themes:
- 記憶の価値
- すれ違いの解消
rules:
- 記憶を売ると、その出来事に関する感情は残るが、具体的な情景は消える
- 記憶の取引は、合意した本に専用の栞を挟むことで行われる
- 蒸気機関の圧力調整が記憶抽出機の精度に影響するため、天候や時間帯で記憶の鮮明度が変わる
plot_outline:
- '序盤: 記憶をなくした青年が「琥珀堂」を訪れ、わたしに相談を持ちかける。彼の手には、記憶市場で使われる不思議な蒸気仕掛けの栞だけが残っていた。'
- '中盤: 栞に刻まれた暗号のような数字を頼りに、わたしは街の古本屋や喫茶店を巡る。その過程で、青年がかつて誰かを深く想っていたこと、そしてある「善意」で記憶を売ったことが判明する。'
- '終盤: 記憶を買い取った人物が、実は青年の大切な人であったことが分かる。しかし、買い取った側もまた、ある誤解からその記憶を大切に封印していた。'
- '結末: わたしが間に入り、二人の誤解をほどく。記憶は完全には戻らないが、新しい思い出を刻み始める二人の姿を見送り、わたしはまた静かに本を整理する。'
style_notes: 軽やかで少しとぼけた口調。「〜かしら」「〜ですね」といった柔らかい語尾を用い、日常の些細な描写（紅茶の香りや本の紙質）を丁寧に書き込む。殺伐とした展開を避け、読後感が温かくなるように構成する。
