- name: 瀬戸 凪沙（せと なぎさ）
  role: 主人公
  age: 20
  gender: 女性
  appearance: 少し長めの黒髪、都会的な洗練された雰囲気は残っているが、どこか疲れが見える瞳。水色のカーディガンを愛用している。
  personality: 内向的で思慮深い。周囲に気を使いすぎてしまう性質。一人称は「私」。
  speech_style: 控えめで丁寧な話し方。少し自信なさげな語尾になることがある。
  background: 都会の広告代理店で働いていたが、過密なスケジュールと人間関係に疲れ果て、逃げるようにこの海辺の街へ移住してきた。
  motivation: 何かに追われる感覚から解放され、自分らしくいられる場所を見つけること。
  relationships:
  - name: ピップ
    relation: 不思議な店主であり、人生の導き手
  arc: 都会のスピード感に怯えていた状態から、雨や静寂といった「停滞する時間」の豊かさを認め、自分のペースで歩む勇気を持つ。
- name: ピップ
  role: 相棒
  age: 0
  gender: 中性的
  appearance: 透き通るような銀色の長い耳を持つウサギ。小さなベストと丸眼鏡を着用しており、上品な佇まい。
  personality: 穏やかでミステリアス。博識で、訪れる人の心を静かに見守る。一人称は「僕」。
  speech_style: ゆったりとしたテンポで、どこか詩的で温かみのある言葉選びをする。
  background: 雨の日にしか現れない喫茶店の店主。人々の記憶にある「懐かしい香り」を瓶に詰めて届ける不思議な力を持つ。
  motivation: 訪れる人々に、忘れかけていた心の温もりを思い出させること。
  relationships:
  - name: 瀬戸 凪沙
    relation: 店の手伝いをする大切なパートナー
  arc: ただ客を癒やす存在から、凪沙と共に街の停滞（晴れ続き）に立ち向かい、共に喜びを分かち合う存在へと変わる。
- name: 源三（げんぞう）
  role: 脇役
  age: 72
  gender: 男性
  appearance: 深く刻まれた皺と、日焼けした肌。使い込まれた漁師の帽子を被っている。頑固そうな見た目だが、目は優しい。
  personality: 寡黙でぶっきらぼうだが、実は情に厚い。一人称は「俺」。
  speech_style: 短く、断定的な話し方。しかし、言葉の端々に街への愛着が滲む。
  background: 代々この街で灯台の管理に携わってきた老人。街の歴史と、雨がもたらす恵みを知り尽くしている。
  motivation: 静かに、しかし確実に続いてきたこの街の営みと、灯台の光を守ること。
  relationships:
  - name: ピップ
    relation: 雨の日に訪れる大切な常連客
  - name: 瀬戸 凪沙
    relation: 街にやってきた新しい住人として見守る対象
  arc: 晴れが続いて街が活力を失う中、自らの経験を凪沙に伝えることで、再び雨を呼び寄せるための精神的な支えとなる。
