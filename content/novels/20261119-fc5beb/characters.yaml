- name: カイル・レンド
  role: 主人公
  age: 27
  gender: 男性
  appearance: 煤けた灰色の作業服、鋭いが疲れ切った瞳、細身だが引き締まった体格
  personality: 冷静沈着で現実主義だが、心の奥底に消えない正義感を秘めている。一人称：俺
  speech_style: 無駄を削ぎ落とした短文で、感情を抑えた硬い口調
  background: 下層区画の記憶回収官。都市のシステムに疑問を持ちつつも、日々の任務を淡々とこなしてきた
  motivation: 「失われた手紙」に記された真実を突き止め、都市の欺瞞を暴くこと
  relationships:
  - name: エラ
    relation: 幼馴染であり、最も大切な親友
  arc: システムの歯車として生きる男から、自らのアイデンティティを捧げて真実を叫ぶ殉教者へ
- name: エラ・メイ
  role: 相棒（犠牲者）
  age: 26
  gender: 女性
  appearance: 暗い下層区画でも際立つ明るい瞳、柔らかな髪、清潔感のある衣服
  personality: 楽観的で慈愛に満ち、絶望的な状況でも希望を見出そうとする強さを持つ。一人称：私
  speech_style: 穏やかで、相手を包み込むような優しい口調
  background: 下層区画の技術者。カイルの精神的な支えであり、都市の仕組みを技術的に理解している
  motivation: 人々が自分たちの記憶（心）を取り戻せる世界を作ること
  relationships:
  - name: カイル
    relation: 親友であり、唯一無二の理解者
  arc: カイルの生存のために存在（記憶）を捧げることで、物語の悲劇性とカイルの決断の重みを決定づける
- name: ヴァレリウス・ヴォーン
  role: 敵役
  age: 54
  gender: 男性
  appearance: 汚れ一つない純白の礼服、人工的な黄金色の瞳、威圧的な長身
  personality: 極めて合理的かつ冷酷。都市の秩序こそが人類の生存における至高の善であると信じている。一人称：私
  speech_style: 丁寧だが高圧的。相手を見下すような、慇懃無礼な敬語
  background: 管理局の最高幹部。都市のエネルギー循環システムを維持・管理する責任者
  motivation: 都市「アイギス」の繁栄と、偽りの平和（秩序）の永続
  relationships:
  - name: カイル
    relation: 秩序を乱し、システムの根幹を脅かす排除すべき異分子
  arc: 揺るぎない権威として立ちふさがるが、カイルの自己犠牲によって築き上げたシステムの崩壊を目の当たりにする
- name: リナ
  role: 脇役
  age: 19
  gender: 女性
  appearance: 大きなフード付きの外套、顔の半分を隠すマスク、小柄で素早い動き
  personality: 狡猾で生存本能が強く、他者を容易には信用しない。一人称：あたい
  speech_style: 下層区画特有の、荒っぽくスラング混じりの話し方
  background: 廃棄区画でゴミ（記憶の残滓）を漁り、情報を売って生きるスカベンジャー
  motivation: 飢えを凌ぎ、この腐った街で一日でも長く生き延びること
  relationships:
  - name: カイル
    relation: 情報の取引相手であり、一時的な協力者
  arc: カイルの破滅的な行動を間近で見、「ただ生き延びる」ことと「真実を知る」ことの差に葛藤する
