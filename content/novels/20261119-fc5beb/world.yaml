title: 灰の聖域と、断罪の祝祭
genre: ディストピア
tone: 冷徹で残酷、かつ静謐な絶望感
pov: 三人称
tense: 過去形
setting: 永遠に煤煙が立ち込める階層都市「アイギス」。上層部は人工的な光に満たされ、下層部は廃棄された記憶の澱が沈む暗黒に支配されている。
premise: 記憶は、都市を動かす唯一の燃料である。回収官のカイルは、管理局が抹消したはずの「失われた手紙」を廃棄区画で見つけ出す。その手紙には、都市の繁栄が人々の最も幸福な記憶を搾取することで成り立っているという、呪われた真実が記されていた。祭りの夜、真実を告げるために、カイルは自らの存在そのものを代償として差し出す決断を迫られる。
themes:
- 記憶の価値とアイデンティティ
- 真実への代償
rules:
- 記憶は物理的な結晶として抽出・取引が可能であり、抽出された記憶は二度と再生できない。
- 「忘却の祭」の夜、選別された大量の記憶は都市の動力源として完全に焼却・消費される。
- 管理局の記録にない「過去の断片」を保持することは、社会的な死を意味する。
plot_outline:
- '序盤: 記憶回収官カイルは、任務中に廃棄区画で、誰にも読まれずに捨てられた「失われた手紙」を拾う。それは、都市の設計者が残した、偽りの平和を告発する遺言だった。'
- '中盤: 手紙の真相を追うカイルは、都市の光が「幸福な記憶」ではなく、人々の「最も痛切な絶望」を燃料にしている矛盾に辿り着く。追跡者から逃れるため、彼は親友の記憶を燃料として使い、その存在を永遠に失うことで生き延びる。'
- '終盤: 祭りの夜。カイルは都市の中枢へ潜入し、手紙の真実を全市民の脳内に直接流し込むための通信機を手にする。しかし、その起動には、カイル自身の「全記憶」を燃料として捧げる必要があることが判明する。'
- '結末: カイルは己のアイデンティティをすべて燃やし尽くし、真実を叫ぶ。偽りの光は消滅し、人々は絶望と共に目覚める。カイルは、自分が誰であったかも忘れた空虚な器となり、灰の降る街に独り立ち尽くす。'
style_notes: 感情を削ぎ落とした、硬質で冷たい地の文。台詞は短く、鋭利な刃のように配置すること。光と影、色彩と無彩色の対比を強調し、救済が必ず「何かを永遠に失うこと」と引き換えであることを徹底して描く。
