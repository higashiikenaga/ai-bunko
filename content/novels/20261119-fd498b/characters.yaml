- name: 佐藤 陽菜
  role: 主人公
  age: 17
  gender: 女性
  appearance: 明るい茶髪のショートボブ。食べることが大好きで、いつも少しだけ頬がふっくらしている。制服は着崩していることが多い。
  personality: ポジティブで食いしん坊。困っている人を放っておけない世話焼きな性格。一人称は「あたし」。
  speech_style: 元気でハキハキとした、少しぶっきらぼうながらも温かみのある口調。
  background: ごく普通の女子高生。食べ歩きが生きがいで、ある日校舎裏で迷い込んだ「記憶売買市場」でハルと出会う。
  motivation: 記憶を失ったハルに「美味しい思い出」を上書きして、彼を元の自分に戻し、笑顔にすること。
  relationships:
  - name: 結城 ハル
    relation: 放っておけない相手であり、次第に恋心を抱く対象
  - name: エニシ
    relation: ハルを狙う不穏な存在として警戒している相手
  arc: ただ食べることが好きな少女から、誰かのために大切なものを差し出す強さを持つ少女へと成長する。
- name: 結城 ハル
  role: 相棒
  age: 17
  gender: 男性
  appearance: 誰もが振り返るような超絶イケメン。しかし、記憶を失っているため、どこか虚ろで掴みどころのない瞳をしている。
  personality: 非常に穏やかで、極度の天然。記憶を失ったことで、日常生活の動作すら危ういポンコツな一面がある。一人称は「僕」。
  speech_style: おっとりとした、ゆったりとしたテンポの話し方。
  background: 由緒ある家の出身だが、家宝の「折れた剣」を直したい一心で、初恋の記憶を含む大切な思い出を次々と市場へ売り払ってしまった。
  motivation: 家宝を直すこと（当初）→ 陽菜と一緒に過ごす「今」の感覚を大切にすること（終盤）。
  relationships:
  - name: 佐藤 陽菜
    relation: 自分を導いてくれる、最も大切な存在
  arc: 過去の記憶に縛られ、それを取り戻そうとする空虚な状態から、新しい記憶と感情を積み重ねて生きていく決意をする。
- name: エニシ
  role: 敵役
  age: 25
  gender: 男性
  appearance: 漆黒のスーツを纏った、端正で冷ややかな美青年。常に薄笑いを浮かべており、瞳の奥が読めない。
  personality: 極めて合理的で冷徹。記憶を単なる「価値ある通貨」としてしか見ておらず、感情を軽視している。一人称は「私」。
  speech_style: 丁寧で洗練されているが、相手を突き放すような慇懃無礼な物言い。
  background: 記憶売買市場の管理者。市場の秩序を保ちつつ、高値で売れる「輝かしい記憶」を常に探している。
  motivation: ハルの持つ「人生で最も輝かしい記憶」を市場へ回収し、市場の価値を高めること。
  relationships:
  - name: 結城 ハル
    relation: 最高値で買い叩くべき「商品」
  - name: 佐藤 陽菜
    relation: 計画を乱す、理解不能なノイズ
  arc: 物語を通して変化することはないが、主人公たちの「感情による選択」を突きつける壁として立ちふさがる。
