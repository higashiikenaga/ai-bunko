title: 思い出を売ってパンケーキ！〜記憶市場の案内人と、忘れっぽすぎる君〜
genre: 青春恋愛
tone: 明るく賑やかで、コメディタッチな青春ラブコメ
pov: 一人称（主人公「あたし」）
tense: 現在形
setting: 現代の地方都市、放課後の校舎裏にだけ現れる不思議な「記憶売買市場」
premise: 食べることが生きがいの女子高生・あたしは、ある日ひょんなことから「記憶を売ってお金や願いを叶える市場」に迷い込む。そこで出会ったのは、家宝の「折れた剣」を直すために、初恋の記憶を全部売ってしまった超絶天然なイケメン君。記憶を失くしてポンコツ化した彼に呆れつつも、あたしは彼に「美味しい思い出」を上書きして、もう一度恋に落とそうと奮闘する。
themes:
- 記憶とアイデンティティ
- 食欲と愛欲の等価交換
rules:
- 記憶は「感情の強さ」に応じて通貨（メモリーチップ）に変換される
- 売った記憶は完全に忘れるが、強い未練があるものは「漠然とした欠落感」として心に残る
- 他人の記憶を移植しても、本人の体験として定着させるには『共通の五感体験（特に食事）』を共にする必要がある
plot_outline:
- '序盤: 食べ歩き中に校舎裏の怪しい市場に迷い込んだあたしが、記憶を売り払ってひどくボケっとしている少年・ハルと出会い、彼の案内役を押し付けられる。'
- '中盤: ハルが「折れた剣」という家宝を直したい一心で、大切な記憶を次々と売っていたことを知り、あたしが彼に美味しいものを食べさせて新しい記憶を刻む「思い出上書き作戦」を開始する。'
- '終盤: 市場の管理者がハルの「人生で最も輝かしい記憶」を最高値で買い叩こうと罠を仕掛ける。あたしは彼を救うため、自分の「一番大好きな食べ物の記憶」を代償に差し出して彼を連れ戻そうとする。'
- '結末: 記憶は完全には戻らなかったが、あたしと一緒に食べたパンケーキの味が、彼の中に新しい「好き」という感情を芽生えさせる。折れた剣は直らなかったが、「折れていても大切」だと思える心を取り戻し、二人は正式に付き合い始める。'
style_notes: 一人称「あたし」による軽快なツッコミ漫才のような語り。スイーツやB級グルメの描写に徹底的にこだわり、読者の食欲を刺激する。毎話必ず、キャラクターの絶妙なドジや勘違いによる笑いどころを挿入し、テンポ重視の会話劇で物語を展開させる。
