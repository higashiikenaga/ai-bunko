- name: 凪野 遥 (なぎの はるか)
  role: 主人公
  age: 28
  gender: 女性
  appearance: 落ち着いた茶髪を後ろで一つに結んでいる。機能的なリネンシャツとカーゴパンツを愛用。常に使い込まれたスケッチブックと万年筆を持ち歩いている。瞳は観察者のように静かで鋭い。
  personality: 内向的で思慮深く、静寂を愛する。植物の微細な変化に喜びを感じるタイプ。一人称は「私」。
  speech_style: 穏やかで丁寧。余計な形容詞を削ぎ落とした、簡潔で落ち着いた話し方。
  background: 元植物学研究者。都会の過剰な情報とスピードに疲れ、自ら志願して標高二千メートルの観測小屋での単独生活を選んだ。
  motivation: 植物の生命の営みを、偏見なく正確に記録し続けること。
  relationships:
  - name: リナ
    relation: 不思議な訪問者であり、静かな日常を分かち合う友人
  - name: カエル
    relation: 賑やかな来訪者であり、観察対象としての興味を惹かれる少年
  arc: 孤独を「静寂」として完結させていたが、リナたちとの交流を通じて、生命が繋がり、循環していくことの温かさと、それを記録する意義を再発見する。
- name: リナ
  role: 相棒
  age: 25
  gender: 女性
  appearance: 透き通るような白い肌と、植物の葉のような深い緑色の瞳。植物の繊維で織られた、風にたなびく軽やかな衣を纏っている。どこか浮世離れした美しさを持つ。
  personality: 包容力があり、すべてを肯定するような穏やかな精神の持ち主。好奇心旺盛だが、決して急がない。一人称は「私」。
  speech_style: 歌うようなリズム感があり、古風で詩的な言い回しを好む。相手を尊重する優しい口調。
  background: 地図から消えた「記憶の村」の守り手。空飛ぶ舟を操り、滅びゆくものや失われゆく種子の記憶を、新しい土地へと運ぶ役割を担っている。
  motivation: 村の記憶と種子を絶やさず、森のどこかへ繋いでいくこと。
  relationships:
  - name: 凪野 遥
    relation: 物語を記録してくれる信頼できる観測者
  - name: カエル
    relation: 教え子であり、共に種子を運ぶ仲間
  arc: 淡々と役割をこなす「運び手」であった彼女が、遥との交流を通じて、種子が芽吹く瞬間の「生命の歓喜」という感情を深く理解していく。
- name: カエル
  role: 脇役
  age: 12
  gender: 男性
  appearance: 大きな瞳と、健康的な小麦色の肌。動きやすい短い装束。腰には種子を入れるための小さな革袋をいくつもぶら下げている。常に目が輝いている。
  personality: 天真爛漫で活発。未知のものに対して非常に積極的。一人称は「僕」。
  speech_style: 元気よく、質問攻めにするような話し方。語尾が跳ねるような明るい口調。
  background: リナに弟子入りしたばかりの、村の次世代の運び手。空飛ぶ舟の操縦を修行中。
  motivation: 早く立派な運び手になり、村の素晴らしい歌や種子を世界中に届けること。
  relationships:
  - name: リナ
    relation: 師匠であり、憧れの存在
  - name: 凪野 遥
    relation: 静かすぎるけれど、時々面白いことを教えてくれるお姉さん
  arc: ただ種子を運ぶだけの作業として捉えていた修行が、遥の観察記録を通じて「命の物語を繋ぐ」という尊い行為であることに気づき、成長していく。
