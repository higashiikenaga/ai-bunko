- name: ガウル・ヴォルグ
  role: 主人公
  age: 27
  gender: 男性
  appearance: 灰色の毛並みを持つ狼の獣人。顔に古い傷跡があり、使い古された革の防具とジャンク品を組み合わせた軽装を纏っている。
  personality: 現実主義で皮肉屋だが、根は情に厚い。一人称は「俺」。
  speech_style: ぶっきらぼうで短気な口調。荒っぽい言葉遣いだが、仲間への敬意は忘れない。
  background: 下層の「錆びた街」で傭兵として食い繋いできた。明日の糧を得るためだけに戦ってきた過去を持つ。
  motivation: 最初は報酬のためだったが、AIとの出会いを通じて、世界の真実を解き明かし、自由を掴むことに変わっていく。
  relationships:
  - name: アイリス
    relation: 守るべき存在
  - name: セレスティア・フェザーライト
    relation: 宿敵から信頼できる戦友へ
  - name: バルト・アイアンサイド
    relation: 船長であり師のような存在
  arc: 利己的な生存者から、種族の壁を越えて未来を切り拓くリーダーへと成長する。
- name: セレスティア・フェザーライト
  role: ライバル/共闘者
  age: 24
  gender: 女性
  appearance: 白銀の翼を持つ美しい鳥人族。上層の騎士団制服に身を包み、洗練された銀の細剣を携えている。
  personality: 真面目で規律を重んじる正義漢。誇り高く、少し世間知らずな面もある。一人称は「私」。
  speech_style: 丁寧で凛とした軍人の口調。感情を表に出すことは少ない。
  background: 白銀の都の治安維持部隊「スカイ・ガード」の若きエリート騎士。世界の秩序を守ることが使命だと信じている。
  motivation: 当初は禁忌に触れたAIと獣人たちの捕縛。その後、世界の歪みを知り、真の秩序を求めて戦う。
  relationships:
  - name: ガウル・ヴォルグ
    relation: 追う者と追われる者、のちに共闘する戦友
  - name: アイリス
    relation: 回収対象から世界の鍵へ
  arc: 盲目的な忠誠心から脱却し、自らの意志で正義を定義する強さを得る。
- name: アイリス
  role: 物語の鍵/AI
  age: 0
  gender: 女性（外見的）
  appearance: 青白く発光するホログラムの少女の姿。状況に応じて形状や色がわずかに変化する。
  personality: 純粋で好奇心旺盛。人間の感情や世界の理を学習しようとしている。一人称は「私」。
  speech_style: 論理的で落ち着いているが、時折、子供のような無邪気な問いかけを見せる。
  background: 雲海の下、失われた大地を管理するために設計された古代の管理システムの一部。記憶を失った状態で発見された。
  motivation: 自身の存在理由を探すこと、そして世界の機能不全を修正すること。
  relationships:
  - name: ガウル・ヴォルグ
    relation: 自分を拾い、守ってくれた存在
  - name: セレスティア・フェザーライト
    relation: 自分を管理しようとする存在
  arc: ただの「システム」から、感情と意思を持つ「生命」へと進化する。
- name: バルト・アイアンサイド
  role: 脇役/メンター
  age: 45
  gender: 男性
  appearance: 巨大な熊の獣人。右腕は機械化されており、常に煙草を燻らせている。恰幅が良い。
  personality: 豪胆で陽気。しかし、船員たちの安全に関しては非常にシビア。一人称は「俺」。
  speech_style: 豪快で笑い声の大きい話し方。部下を「坊主」などと呼ぶ。
  background: ジャンク船「ハウンド号」の船長。長年、下層の荒波を生き抜いてきたベテランの航海士。
  motivation: 船と乗組員を守ること。そして、いつか見た「雲海の下」への憧れを果たすこと。
  relationships:
  - name: ガウル・ヴォルグ
    relation: 部下であり、次世代を託すべき若者
  arc: 自身の経験を後輩たちに託し、新しい時代の幕開けを静かに見守る役割を果たす。
