title: 灰色の咆哮：雲海を駆ける獣たちの挽歌
genre: 群像劇
tone: 重厚で泥臭く、種族間の葛藤と絆を描く骨太なトーン
pov: 三人称（章ごとに視点人物を交代）
tense: 過去形
setting: 浮遊島々で構成された階層世界。上層の特権階級が住まう「白銀の都」と、産業廃棄物が降り積もる下層の「錆びた街」に分かれている。
premise: 異なる種族が肩を寄せ合うジャンク船「ハウンド号」に、ある日、記憶を失った迷子の人工知能（AI）が転がり込む。AIが持つ「雲海の下、失われた大地へ降りる地図」を巡り、上層の鳥人族と下層の獣人たちが衝突し、やがて共闘することになる。種族の壁を越え、世界の真実を追い求める者たちの魂の記録。
themes:
- 種族間の差別と融和
- 運命への抗い
rules:
- 獣人は種族ごとに身体能力と社会的地位が厳格に分けられている（鳥人＞哺乳類＞爬虫類）
- 空飛ぶ船の動力源は、古代文明の遺物である「エーテル結晶」のみで駆動する
- AIは物理的な身体を持たず、機械や生物の神経系に寄生・転送することで意識を維持する
plot_outline:
- '序盤: 下層の傭兵である狼のガウルが、ジャンク船の船員たちと共に、正体不明のAIを搭載した通信機を拾い、意図せずして上層の禁忌に触れる。'
- '中盤: AIの導きで雲海の下を目指すが、上層の治安維持部隊である猛禽類たちに追われる。逃避行の中で、追う側である鳥人の騎士と、追われる側の獣人たちの間に奇妙な信頼関係が芽生える。'
- '終盤: AIが実は世界を維持する管理システムの一部であり、現在の残酷な階級社会がAIの機能不全によるバグから生じた歪みであることが判明する。'
- '結末: 激戦の末にAIを正しく再起動させ、浮遊島の階級構造を物理的に解体。獣人たちが対等に生きるための、未知なる大地への航路を切り拓く。'
style_notes: 獣特有の嗅覚（錆びた血の匂い、湿った毛皮の香り、エーテル結晶の ozone のような刺激臭）や聴覚（エンジンの不規則な唸り、羽ばたきの風圧）を詳細に描写し、肉体的な実在感を強調する。
