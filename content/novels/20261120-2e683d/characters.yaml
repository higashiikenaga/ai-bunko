- name: 芹沢 海斗
  role: 主人公
  age: 26
  gender: 男性
  appearance: 痩身ながら引き締まったランナー体型。鋭い眼差しをしているが、疲労と絶望でどこか影がある。常に最新のスマートウォッチを着用している。
  personality: 完璧主義でストイック。数値こそが唯一の真実だと信じている。一人称は「僕」。
  speech_style: 論理的で簡潔。感情を排し、タイムや心拍数などの数値を用いて状況を説明する傾向がある。
  background: 元エリートランナー。ある時期から目標とする3分15秒のペースを更新できなくなり、精神的に追い詰められて逃げるようにこの町へやってきた。
  motivation: 失われた「速さ」を取り戻すこと。あるいは、走る意味を再定義すること。
  relationships:
  - name: 一ノ瀬 雫
    relation: 静かな理解者であり、価値観を揺さぶる存在
  - name: 遠馬 蓮
    relation: かつてのライバルであり、対極に位置する走法を持つ友人
  arc: 数値への強迫観念から解放され、自らの身体感覚と生命の律動を肯定できるようになる。
- name: 一ノ瀬 雫
  role: 相棒/導き手
  age: 32
  gender: 女性
  appearance: 素朴なリネンの服を纏い、潮風に吹かれた柔らかい表情。灯台近くで小さな古書店兼カフェを営んでいる。
  personality: 穏やかで包容力がある。効率や速度よりも、その瞬間の「心地よさ」を重視する。一人称は「私」。
  speech_style: ゆっくりとした口調。比喩表現が多く、相手の心に寄り添う問いかけをする。
  background: 都会での生活に疲れ、数年前にこの町に移住してきた。海辺の静寂と、移ろう自然の美しさを愛している。
  motivation: 海斗が「数字」という檻から抜け出し、自分自身の呼吸を取り戻すのを静かに見守ること。
  relationships:
  - name: 芹沢 海斗
    relation: 都会から来た迷えるランナーへの共感と慈しみ
  - name: 海歩 源蔵
    relation: 町の名士としての敬意を払う関係
  arc: 海斗の再生を通じて、彼女自身が過去に諦めた「何か」への情熱を小さく再燃させる。
- name: 遠馬 蓮
  role: 対比的な存在/ライバル
  age: 26
  gender: 男性
  appearance: 快活な笑顔と健康的で逞しい体格。機能性よりもデザイン重視のカジュアルなウェアを好む。
  personality: 直感的で楽観的。走ることを「遊び」として捉えている。一人称は「俺」。
  speech_style: 快活で遠慮がない。専門用語を避け、「気持ちいい」などの感覚的な言葉を多用する。
  background: 大学時代、海斗と共に練習していたライバル。ある時、記録を追うことに限界を感じ、「楽しむ走り」へと転向し、精神的な充足を得た。
  motivation: 海斗に再び「走る喜び」を思い出させ、共に海岸線を駆け抜けること。
  relationships:
  - name: 芹沢 海斗
    relation: 切磋琢磨した戦友であり、現在は心配している親友
  arc: 海斗の葛藤に直面することで、自分自身の「楽しさ」という逃げ道の中にある弱さにも気づき、共に成長する。
- name: 海歩 源蔵
  role: 脇役/精神的支柱
  age: 75
  gender: 男性
  appearance: 深く刻まれた皺と日に焼けた肌。古い灯台守のコートを羽織っている。海のように深い眼光を持つ。
  personality: 寡黙で厳格だが、本質を突く洞察力を持つ。一人称は「わし」。
  speech_style: ぶっきらぼうな地方の訛りがある。短い言葉で哲学的な真理を語る。
  background: この町の元灯台守。視覚に頼らずに海の状態を察知する技術を持っており、町の歴史と自然のサイクルを熟知している。
  motivation: 灯台という象徴を通じて、迷える若者に「道しるべ」を示すこと。
  relationships:
  - name: 芹沢 海斗
    relation: 不器用な若者への厳しくも温かい視線
  - name: 一ノ瀬 雫
    relation: 互いの静寂を尊重し合う知人
  arc: 海斗が暗闇の中で走り抜ける姿を見て、かつて自分が灯台で守り抜いた「光」の意味を再確認する。
