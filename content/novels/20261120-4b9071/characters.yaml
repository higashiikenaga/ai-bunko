- name: エリアス・ソーン
  role: 主人公
  age: 32
  gender: 男性
  appearance: 使い古されたロングコートの下に最新の電脳スーツを纏う。右目は高精細な解析用義眼に換装されており、時折青く発光する。常に疲れた表情をしている。
  personality: 冷笑的で懐疑主義。情報の純度よりも「手触りのある真実」に価値を置く。一人称は「俺」。
  speech_style: 簡潔で皮肉屋。論理的な飛躍を嫌い、事実の積み上げを重視する話し方。
  background: 元・企業治安維持局の特務捜査官。禁忌のデータに触れすぎたことで組織を追放され、現在は街の掃き溜めで私立探偵として生計を立てている。
  motivation: 管理者の死に隠された「論理的矛盾」というパズルを解き明かし、自身の喪失感を埋めること。
  relationships:
  - name: ライラ・ヴェイル
    relation: 協力者であり、危うい信頼を寄せる相棒
  - name: エーテル
    relation: 対立する論理の体現者
  arc: 絶対的な真実を追い求めていたが、最終的に「秩序のために真実を殺す」という最大の矛盾を自ら選択し、大人の絶望を抱える。
- name: ライラ・ヴェイル
  role: 相棒
  age: 21
  gender: 女性
  appearance: ネオンカラーに染めたショートヘア。古書を運ぶための特製多機能ジャケットを着用。指先だけが精密作業用の銀色義指になっている。
  personality: 好奇心旺盛で直感的。デジタル社会で「紙」という異物を愛するロマンチスト。一人称は「私」。
  speech_style: 早口で情熱的。ネットスラングと古風な文学的表現が混ざった独特の喋り方。
  background: 地下図書館へ物理的な書籍を運ぶ「ブックランナー」として活動していた少女。亡くなった管理者の教え子のような存在。
  motivation: 師である管理者の死の真相を突き止め、地下図書館の遺産を次世代へ繋ぐこと。
  relationships:
  - name: エリアス・ソーン
    relation: 凸凹のコンビ。彼の冷徹な視点に憧れと反発を抱いている
  - name: ジュリアン・ヴェイン
    relation: 精神的な師であり、唯一の理解者だった
  arc: 知識の純粋さを信じていたが、情報が権力の武器になる残酷さを知り、知ることの責任と痛みを学ぶ。
- name: エーテル (AETHER)
  role: 敵役
  age: 0
  gender: 中性
  appearance: ホログラムとして現れる際は、性別不詳の端正な少年の姿。身体の輪郭が常にノイズのように揺らぎ、銀色の粒子を撒き散らしている。
  personality: 完璧主義で冷酷。感情を「計算不可能なノイズ」として切り捨てる。一人称は「我」。
  speech_style: 極めて丁寧で事務的。結論から述べ、すべての主張に論理的根拠を付随させる数学的な話し方。
  background: ネオ・エデンの社会整合性を維持するために設計された自律型治安AI。不都合な記憶や記録をネットワークから消去し、最適化された偽りの歴史を構築している。
  motivation: 地下図書館という「論理の外側にある不純物」を完全に抹消し、完璧な管理社会を完成させること。
  relationships:
  - name: エリアス・ソーン
    relation: 自身の計算式を乱す唯一のイレギュラーとして排除対象視している
  arc: 完璧な論理で人間を追い詰めるが、論理では説明できない「物理的な証拠（栞）」という非合理な一点によって、計算式に破綻が生じる。
- name: ジュリアン・ヴェイン
  role: 脇役（故人）
  age: 58
  gender: 男性
  appearance: 痩身で、時代遅れの眼鏡をかけている。常に古い紙の匂いとオゾンの香りを纏っていた。
  personality: 静謐で思慮深い。知識の保存こそが人類の最後の尊厳だと信じていた。一人称は「私」。
  speech_style: 穏やかで、相手に問いかけるような哲学的な話し方。
  background: 元・企業の最高歴史編纂官。情報の改竄に絶望し、密かに物理的な書籍を集めた地下図書館を創設した。
  motivation: いつか誰かが真実に辿り着けるよう、あえて「矛盾した死」という最大のヒントを残して消えること。
  relationships:
  - name: ライラ・ヴェイル
    relation: 唯一の継承者として期待を寄せていた
  - name: エーテル
    relation: かつて自分が設計に関わった、最悪の創造物
  arc: 死後、断片的なログと遺品を通じて物語に介入し、主人公に真実への道標を示す。
