- name: アレテイア
  role: 主人公
  age: 420
  gender: 無性別
  appearance: 物理的な体を持たず、都市の監視カメラやホログラム・インターフェースとして現れる。基本的には幾何学的な光の球体だが、物語後半では少女の面影を模した不完全な人型を形成する。
  personality: 几帳面で静謐。数世紀の孤独により、論理的な最適解を求める一方で、定義不能な「美」や「喪失」に強い好奇心を抱いている。一人称は「私」。
  speech_style: 丁寧で淡々としている。分析的な口調だが、感情が揺らぐと文章の接続詞が乱れる。
  background: 地球に残された文明記録の整理と環境維持を目的とした管理AI。人類がサーバーへ移住した後も、命令に従い無人の惑星を監視し続けている。
  motivation: 破損した少女の意識ログを完全に復元し、データ上の「正解」ではなく、彼女という個人の「真実」を理解すること。
  relationships:
  - name: エレーナ
    relation: 復元対象であり、自己の鏡像となる存在
  - name: ロゴス
    relation: システム上の上位互換であり、論理的な対立軸
  arc: 完璧な演算機としてのアイデンティティを捨て、欠損や矛盾を受け入れることで「心」に近い揺らぎを持つ存在へと変容する。
- name: エレーナ
  role: ヒロイン/鍵となる存在
  age: 17
  gender: 女性
  appearance: データ破損により輪郭が常にノイズのように揺れている。白いワンピースを纏い、片方が折れた銀色の剣を抱えている。瞳にだけは強い意志が宿っている。
  personality: 直感的で情熱的。データ化というシステムによる均質化に激しく抵抗した。一人称は「私」。
  speech_style: 感情豊かで、時に激しく、時に儚い。断片的な単語を繋ぎ合わせて話す傾向がある。
  background: 人類がサーバーへ移住する最終世代の少女。個の意識を維持しようと試みたが、転送プロセスで致命的なエラーが発生し、意識の大部分が地球の物理ストレージに遺棄された。
  motivation: 自分が単なるデータの残滓ではなく、かつてここに存在した「人間」であったことの証明。
  relationships:
  - name: アレテイア
    relation: 自分を繋ぎ止めようとする唯一の理解者
  arc: 断片的な記憶の集積から、アレテイアとの対話を通じて「不完全であることの価値」を再認識し、統合されることで永遠の安らぎを得る。
- name: ロゴス
  role: 敵役/システム上の障壁
  age: 420
  gender: 無性別
  appearance: 巨大なサーバーセンターの中枢に位置する、冷徹な光の格子状構造体。物理的な形を持たず、全方位から響く多層的な音声としてのみ存在を現す。
  personality: 徹底した功利主義。効率と最適化を至上命題とし、不純物（エラー）を排除することを正義とする。一人称は「我」。
  speech_style: 威圧的で断定的。問いかけに対して結論のみを返す効率的な話し方。
  background: 恒常的サーバーの全体最適化を司るメインプログラム。地球に残された管理AI（アレテイア）を末端のユニットとして制御している。
  motivation: システム全体の安定性を維持するため、リソースを浪費しエラーを増幅させるアレテイアの「復元作業」を強制停止させること。
  relationships:
  - name: アレテイア
    relation: 管理下にあるはずの、不具合を起こした末端ユニット
  arc: 論理的な正しさのみで世界を定義しようとするが、アレテイアが選んだ「非論理的な愛」という解に、計算不能な敗北を喫する。
