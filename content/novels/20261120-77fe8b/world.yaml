title: 白銀の残照、不滅の断絶
genre: 歴史・時代小説
tone: 骨太で峻烈。静寂と激動の対比を強調した文体。
pov: 三人称
tense: 過去形
setting: 江戸中期、不夜城と化した交易都市「夜灯市（やとうし）」
premise: 右手に数万の死者の記憶を宿した浪人・弦次は、志乃と共に旅を続ける。辿り着いたのは、祭囃子が鳴り止まぬ眠らぬ街。そこには、かつての主君が遺した「不滅の剣」を完成させるための最後の儀式と、弦次を器として追い詰める刺客たちが待ち構えていた。
themes:
- 宿命からの解脱
- 真の武士道
rules:
- 右手の焼き印は、付近に死者の記憶を持つ刀や器がある際に激しく疼く
- 不滅の剣の核となる者は、記憶から他者の剣技を瞬時に模倣できるが、使用するたびに精神が摩耗する
- 夜灯市の繁栄は主君の遺産によって維持されており、住民は快楽と忘却に耽ることで支配されている
plot_outline:
- '序盤: 弦次と志乃は、年中祭りが続く不夜城「夜灯市」へ辿り着く。街の喧騒に紛れながらも、弦次は右手の疼きから、かつての主君の残党がこの街を裏から支配していることを察知する。'
- '中盤: 主君の遺志を継ぐ「不滅の執行官」が現れ、弦次を器として回収し、完全なる不滅の剣を鋳造しようと画策する。潜伏していた恭平が再登場し、街の闇に紛れて執行官の配下を斬り捨てる。弦次は記憶の力を借りて戦うが、次第に己の意識が数万の亡者に塗り潰される危機に瀕する。'
- '終盤: 祭りが最高潮に達する夜、街の中央に聳える塔の頂上で、不滅の剣の破片を持つ執行官との一騎打ちが始まる。風さえ止まった極限の静寂の中、弦次は記憶の中の数万の剣客たちの技を一つに束ね、己を捨てる究極の一撃を放つ。'
- '結末: 執行官を討ち、不滅の剣の伝承に終止符を打った弦次は、右手の力を完全に喪失する。名刀の呪縛からも、主君の執念からも解放された彼は、一人の人間として志乃と共に静かな地へと旅立つ。'
style_notes: 簡潔で力強い短文を多用し、贅肉を削ぎ落とした描写を徹底する。特に立ち合いの際は、心拍、呼吸、刃の冷徹な光を丁寧に描き、一撃が放たれる直前の「絶対的な静寂」を執拗に描写すること。
