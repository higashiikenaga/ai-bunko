- name: ルナ・エトワール
  role: 主人公
  age: 16
  gender: 女性
  appearance: 透き通るような銀髪と、星屑を散りばめたような深い青の瞳。祖父の形見であるアンティークな銀の鏡を常に身に付けている。
  personality: 真面目で責任感が強く、どこか孤独を抱えた少女。一人称は「私」。
  speech_style: 丁寧で落ち着いているが、決意を語る時は芯の強さを感じさせる。
  background: 星の魔法を操る名家の末裔。祖父の急逝により、失われた星座を復元するという重責を一人で背負い込んでいる。
  motivation: 祖父の遺言に従い、失われた星座を鏡の中に再構築すること。
  relationships:
  - name: カイル・ヴォイド
    relation: 孤独を分かち合い、共に運命を歩むパートナー
  arc: 完璧主義で孤独だった少女が、カイルとの交流を通じて「欠落」を受け入れ、新しい光を創造する意志を持つ者へと成長する。
- name: カイル・ヴォイド
  role: 相棒
  age: 17
  gender: 男性
  appearance: 夜の闇を溶かし込んだような黒髪。魔法の素養はないが、鏡の向こう側の真実を映し出す、深く静かな瞳を持つ。
  personality: 冷静で現実主義だが、内面には深い優しさと情熱を隠している。一人称は「僕」。
  speech_style: 簡潔で飾り気のない話し方。時に鋭く本質を突く。
  background: 魔法学園に通うものの、魔法が全く使えないため「無能」として疎外されてきた過去を持つ。
  motivation: 鏡の瞳を通じて、自分自身の存在意義を見出すこと。
  relationships:
  - name: ルナ・エトワール
    relation: 魔法を持たない自分を肯定してくれる、かけがえのない存在
  arc: 無力感に苛まれていた少年が、ルナを支えることで、自分の瞳こそが新しい星を紡ぐ鍵であることを自覚する。
- name: セレスティナ・ノックス
  role: 敵役
  age: 24
  gender: 女性
  appearance: 厳格な美しさを持つ、白銀の法衣を纏った女性。星の輝きを制御するための「沈黙の杖」を携えている。
  personality: 合理的で冷徹。世界の秩序と安定のためには犠牲も厭わない。一人称は「私」。
  speech_style: 威厳に満ち、感情の起伏が乏しい事務的な口調。
  background: 魔法学園の評議会幹部。世界の均衡を保つため、過剰な星の光を消去する任務を遂行してきた。
  motivation: 星の暴走を防ぎ、既存の魔法体系と世界の秩序を維持すること。
  relationships:
  - name: ルナ・エトワール
    relation: 世界の均衡を乱す脅威
  arc: ルナの「新しい光の創造」に触れ、自分が守ってきた秩序が実は世界の「停滞」であったことに直面する。
- name: エラ・ルミエール
  role: 脇役
  age: 65
  gender: 女性
  appearance: 穏やかな微笑みを絶やさない、年配の魔法学園の司書。常に古い星図を広げている。
  personality: 博識で包容力があり、常に一歩引いて物事を見守る。一人称は「私」。
  speech_style: 優しく、諭すような温かみのある話し方。
  background: かつてルナの祖父と共に星の探求を行っていた学者。ルナの旅を知識面から影で支える。
  motivation: ルナが祖父の遺言の真意に辿り着けるよう、導くこと。
  relationships:
  - name: ルナ・エトワール
    relation: 亡き友の孫であり、次世代の希望として見守る対象
  arc: 過去の知識をルナに伝えることで、古い時代の終わりと新しい時代の始まりを繋ぐ架け橋となる。
