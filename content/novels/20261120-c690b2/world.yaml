title: 群青のプリズム、銀河を綴る鏡の祈り
genre: 青春恋愛
tone: 幻想的で透明感のある、星降る夜の物語
pov: 三人称
tense: 過去形
setting: 星座の瞬きが魔法の源となる、星降る湖のほとりに佇む魔法学園の街
premise: 星の瞬きを魔法の言葉へと変換する少女、ルナ。彼女は、亡き祖父から託された『星図の遺言』を手に、失われた星座を鏡の中に再構築する旅に出ます。魔法の素養を持たないが、鏡の向こう側の真実を見通す瞳を持つ少年、カイル。二人が夜空の欠片を集めるうちに、鏡に映る星々の光は、彼らの孤独な心を優しく溶かしていきます。
themes:
- 失われた記憶の再生
- 運命に抗う愛
- 光と影の共鳴
rules:
- 魔法は特定の星座の配置と、それに対応する星語の詠唱によって発動する。
- 鏡は現実と星空の境界を映し出す聖遺物であり、特定の条件下で星の光を物質化できる。
- 遺言は、死者の強い思念が魔法的な力として残された現象である。
plot_outline:
- '序盤: ルナが祖父の遺言に従い、鏡を用いて失われた星座を呼び戻す旅を始める。そこで、星の魔法が使えないはずの少年カイルと出会い、彼の不思議な瞳に惹かれていく。'
- '中盤: 二人は各地の星降る聖域を巡り、魔法の触媒となる「銀の欠片」を集める。鏡を通じて、二人は互いの孤独な過去を分かち合い、星の光が二人を繋ぐ絆となる。'
- '終盤: 星座の復元が近づくにつれ、世界の秩序を維持するために星を消し続けてきた隠された真実が明らかになる。ルナは、祖父の遺言が「世界の破壊」ではなく「新しい光の創造」であったことを悟る。'
- '結末: 魔法の代償としてルナの記憶が星へと還っていく中、カイルは鏡に映る彼女の姿を永遠に刻むために、新しい星座を詠唱する。夜明け前の群青色の空の下、二人の想いは新しい星となって輝き続ける。'
style_notes: 魔法の詠唱には、音の響きと色彩のイメージを重ね合わせた詩的な表現を用いる。星空の描写においては、単なる暗闇ではなく、瑠璃色や菫色のグラデーション、銀色の砂を撒いたような輝きなど、光と色彩の細やかな変化を捉える。おとぎ話のような、ゆったりとした、慈しむような語り口を徹底する。
