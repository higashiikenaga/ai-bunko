- name: 柳瀬 凪
  role: 主人公
  age: 28
  gender: 女性
  appearance: 落ち着いたベージュのカーディガンに、少し眠たげな瞳。眼鏡をかけている。常に本を抱えている。
  personality: 穏やかで聞き上手。観察眼が鋭く、人の言葉の裏にある小さな違和感に気づく。一人称は「私」。
  speech_style: 静かで丁寧な敬語。相手のペースに合わせるような、ゆったりとした話し方。
  background: 亡くなった祖父が営んでいた「猫柳本店」を継いだ元図書館員。記憶市場の存在を漠然と知っている。
  motivation: 訪れる客が、自分自身でも気づいていない「本当に必要だったもの」を本を通じて見つける手助けをすること。
  relationships:
  - name: 九条 宗次郎
    relation: 店の仕事を手伝う年上の知人
  arc: 記憶市場の謎に触れることで、自分自身がなぜこの店を守り続けているのかという、自身のルーツにある記憶を再確認していく。
- name: 佐伯 湊
  role: 主要な相談者
  age: 24
  gender: 男性
  appearance: 清潔感はあるが、どこか生気がなく、瞳に光が足りない青年。都会的な服装。
  personality: 真面目で理性的だが、効率を重視するあまり感情が摩耗している。一人称は「僕」。
  speech_style: 少し距離を置いた、事務的な敬語。感情が乗りにくい話し方。
  background: 都会の企業で働く会社員。ある夜、あまりの孤独と疲労から、記憶市場へ向かう最終列車に乗ってしまった。
  motivation: 自分が失った「何か」が、自分を苦しめていたものなのか、それとも守るべきものだったのかを知りたい。
  relationships:
  - name: 柳瀬 凪
    relation: 相談者と店主
  arc: 失ったと思っていた記憶が、実は「誰かの優しさ」であったと気づき、不器用ながらも再び人と心を通わせようとする。
- name: 九条 宗次郎
  role: 相棒
  age: 65
  gender: 男性
  appearance: 白髪混じりの短髪に、手入れされた髭。常に古い懐中時計を手に持っている。
  personality: 博識で少しミステリアス。飄々としているが、凪のことは娘のように見守っている。一人称は「私」。
  speech_style: 含みのある、落ち着いた話し方。時折、古風な言い回しを使う。
  background: かつて街の歴史学者として活動していた。記憶市場の伝承に詳しく、店の裏方として凪を支えている。
  motivation: 凪が記憶市場の危うさに飲み込まれないよう、知識と経験で彼女を導くこと。
  relationships:
  - name: 柳瀬 凪
    relation: 店の手伝い・守護者的存在
  arc: 凪に知識を授ける過程で、彼自身もかつて市場に手放した「ある決断」の記憶と向き合っていく。
- name: 織部 奏
  role: 脇役（常連客）
  age: 35
  gender: 女性
  appearance: 凛とした佇まいの女性。少し疲れた様子の、細身のシルエット。
  personality: プライドが高く、自分に厳しい。寂しがり屋な面を隠している。一人称は「私」。
  speech_style: はっきりとした、少し硬い口調。感情を抑えようとする癖がある。
  background: かつて天才ピアニストと称されたが、挫折の痛みを忘れるために記憶を売ってしまった元音楽家。
  motivation: 音楽に対する情熱が消えた理由を探し、もう一度自分を取り戻したい。
  relationships:
  - name: 柳瀬 凪
    relation: 常連客
  arc: 忘れたかった挫折の記憶の中にある「愛」を見つけることで、音楽を「技術」ではなく「心」で奏でられるようになる。
