- name: アラリック・フォン・ジークフリート
  role: 主人公（帝国側）
  age: 42
  gender: 男性
  appearance: 鋭い眼光と銀髪、数々の戦場を潜り抜けたことを示す顔の細かな傷。常に隙のない帝国軍将校の正装を纏っている。
  personality: 冷静沈着で規律を重んじる武人。一人称は「私」。冷徹に見えるが、部下の命を軽視しない信念を持つ。
  speech_style: 簡潔で命令口調。感情を排した軍事的な語り口。
  background: 没落しつつある帝国の名門貴族出身。帝国の再興こそが秩序を取り戻す唯一の道だと信じ、残存艦隊の指揮を執る。
  motivation: 帝国の知的遺産を守り抜き、文明の火を絶やさないこと。
  relationships:
  - name: ライラ・ソラリス
    relation: 宿敵であり、戦いの中で価値観をぶつけ合う相手
  - name: ヴァレリウス・ド・マール
    relation: 上官であり、その政治的野心に疑念を抱いている
  arc: 帝国への盲目的な忠誠心から、真の「遺産」の正体を知ることで、国家ではなく「人類の存続」のために戦う決意へと変化する。
- name: ライラ・ソラリス
  role: 主人公（反乱軍側）
  age: 28
  gender: 女性
  appearance: 短く切り揃えられた黒髪。使い込まれたパイロットスーツを纏い、瞳には強い意志の光を宿している。
  personality: 情熱的で直感に優れる。一人称は「あたし」。既存の権威を嫌い、自由と平等を求めるカリスマ的な性格。
  speech_style: 語気が強く、感情が乗りやすい。戦場では迅速かつ的確な指示を出す。
  background: 帝国の過酷な統治によって家族を失った平民出身。反乱同盟軍の先遣艦隊を率いる若きエースパイロット。
  motivation: 帝国の残滓を完全に抹殺し、新たな時代の夜明けを迎えること。
  relationships:
  - name: アラリック・フォン・ジークフリート
    relation: 打破すべき旧時代の象徴
  - name: カエレン・ヴォス
    relation: 戦場を通じて奇妙な信頼関係を築く協力者
  arc: 帝国を「絶対悪」と断じる単純な正義感から、真実を知ることで、破壊の先にある「共存」という困難な課題を見出す。
- name: カエレン・ヴォス
  role: 主人公（第三勢力・観測者）
  age: 35
  gender: 男性
  appearance: 常に眠たげな瞳をした、どこにでもいるような風貌。機能性を重視した整備士風の作業服を着ている。
  personality: 現実主義者で、政治的な争いには無関心を装う。一人称は「僕」。冷静に状況を分析する観察眼を持つ。
  speech_style: 控えめで、ぼそぼそとした話し方。しかし、技術的な議論では饒舌になる。
  background: 超高速輸送艦「最終列車」の航法士兼エンジニア。政治的背景を持たず、ただ任務を遂行するプロフェッショナル。
  motivation: 輸送艦の安全な航行と、積載されている「遺産」の物理的な保護。
  relationships:
  - name: アラリック・フォン・ジークフリート
    relation: 護衛対象の指揮官
  - name: ライラ・ソラリス
    relation: 排除すべき敵だが、生存のために協力せざるを得ない相手
  arc: 政治の駒として生きることを拒んでいたが、戦いの果てに、真実を次世代へ繋ぐための「鍵」としての役割を引き受ける。
- name: ヴァレリウス・ド・マール
  role: 敵役
  age: 55
  gender: 男性
  appearance: 痩身で、威圧感を放つほどに整った顔立ち。豪華な装飾が施された黒い儀礼服を纏う。
  personality: 極めて計算高く、冷酷。一人称は「我」。目的のためには手段を選ばず、人々を道具としてしか見ない。
  speech_style: 優雅だが、言葉の端々に有無を言わせぬ威圧感が含まれる。
  background: 帝国政府の枢密院高官。帝国の崩壊を予見し、遺産を利用して自らが新たな支配者となるための策謀を巡らせている。
  motivation: 「最終列車」の遺産を手に入れ、自らの手で新たな絶対帝国を樹立すること。
  relationships:
  - name: アラリック・フォン・ジークフリート
    relation: 使い勝手の良い「盾」として利用している部下
  arc: 権力への執着が、文明の終焉を示す「絶滅記録」という真実に直面した際、狂気と絶望へと変貌していく。
