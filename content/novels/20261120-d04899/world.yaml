title: 虚空の断層と氷晶の要塞
genre: 群像劇
tone: 硬質な軍事・政治劇
pov: 三人称（艦艇・陣営ごとの視点切り替え）
tense: 過去形
setting: 崩壊しつつある星間帝国「ジークフリート」の辺境宙域・オフィウクス星系
premise: 帝国の崩壊に伴い、最後の統治権と知的遺産を乗せた超高速輸送艦、通称「最終列車」が、極寒の惑星に築かれた絶望の要塞「氷の城」へと向かう。これを阻止し帝国の種を絶とうとする反乱同盟軍と、帝国の再興を賭けて護衛に就く残存艦隊による熾烈な艦隊戦が展開される。政治的策謀と軍事的合理性が交錯する中、それぞれの信念を背負った指揮官たちが虚空で激突する。
themes:
- 忠誠と裏切り
- 文明の継承と断絶
rules:
- 超光速通信は量子中継局を介さなければ距離に応じた時間遅延が発生する。
- 艦隊の指揮権は厳格な階級制度に基づき、命令の不履行は即座に軍法会議の対象となる。
- 氷の城が位置する惑星は絶対零度に近い環境であり、特殊な熱核装甲を備えた艦艇・施設のみが活動可能。
plot_outline:
- '序盤: 帝都陥落。最後の遺産を運ぶ「最終列車」の出航と、それを追撃する反乱同盟軍の先遣艦隊による局地的衝突。'
- '中盤: 複雑な小惑星帯でのゲリラ戦と、同盟軍内部での権力争い。氷の城への唯一の進入路である「重力断層」の突破権を巡る情報戦。'
- '終盤: 氷の城を舞台にした全軍投入の総力戦。多方向からの艦隊包囲網に対し、帝国側は禁忌の加速航法を用いて要塞へと突入する。'
- '結末: 城に到達した者が目にしたのは、権力の象徴ではなく、かつての文明が遺した「種としての絶滅記録」だった。戦いの中で奇妙な共闘関係を築いた両陣営の生き残りが、新たな共存の道を模索する。'
style_notes: 階級呼称（提督、艦長、少尉等）を正確に使い分け、通信ログ形式の台詞挿入を多用する。星系図に基づいた座標指定や、艦隊陣形（楔形、円環形など）の具体的描写に拘り、空間的な位置関係を明確にする。
