- name: レイル・アシュリー
  role: 主人公
  age: 16
  gender: 女性
  appearance: オイルと煤で汚れた作業着を着ており、ゴーグルを頭に引っ掛けた活発な少女。左腕には自作の義手パーツを装着している。
  personality: 現実主義で面倒くさがり屋だが、根はお人好し。自分の損得勘定を言い訳にするが、困っている人を放っておけない。一人称は「あたし」。
  speech_style: 少しぶっきらぼうで、歯に衣着せぬ物言い。「〜じゃねえよ」「まったく、面倒だな」といった調子。
  background: 浮遊都市群の片隅で、スクラップを漁って日銭を稼ぐスカベンジャー。身寄りはなく、相棒の機械鼠と廃船で暮らしてきた。
  motivation: 最初は単なる好奇心と金目の物目当てだったが、人形の遺言を手紙の宛先へ届けるため、過酷な空の旅に身を投じる。
  relationships:
  - name: ギア
    relation: 口の悪い相棒の機械鼠
  - name: セレスティア
    relation: 拾った蒸気人形。旅の同行者
  arc: 面倒ごとを避けて生きようとしていたが、セレスティアとの旅を通じて誰かのために命を燃やすことの意味を知り、強く前を向いて生きるようになる。
- name: セレスティア
  role: 主要人物（人形）
  age: 0
  gender: 女性型
  appearance: 精巧な真鍮と白磁で作られた蒸気人形の少女。胸部には歯車仕掛けの機関があり、微かに青い光を放っている。背中には小さな翼状の放熱板がある。
  personality: 「嘘をつけない呪い」をかけられており、常に真実しか口にできない。感情豊かだが、自身の運命を受け入れている節がある。一人称は「私」。
  speech_style: 丁寧で凛とした語り口。嘘をつけないため、時折残酷なまでにストレートな物言いになる。
  background: かつて雲上の聖域でつくられた高位の蒸気人形。世界の秘密を知り、それを伝えるために呪いをかけられた状態で真鍮の箱に封印されていた。
  motivation: 自らの「嘘をつけない呪い」の真相と最後のメッセージを、浄化装置に届けること。
  relationships:
  - name: レイル・アシュリー
    relation: 手紙を拾ってくれた命の恩人
  arc: レイルと出会い、感情を育んでいく。最後は自らの命（蒸気機関）を犠牲にして手紙の内容を伝え、世界を救う。
- name: ギア
  role: 相棒
  age: 3
  gender: 雄（設定上）
  appearance: ぜんまい仕掛けとスクラップで作られた、猫ほどの大きさの機械鼠。赤い単眼カメラがチャームポイント。
  personality: 非常に口が悪く、人間の言葉を音声出力で皮肉るのが得意。しかしレイルへの忠誠心と仲間意識は人一倍強い。一人称は「俺」。
  speech_style: 電子音混じりの毒舌。「ガラクタが」「バカな主人を持ったもんだぜ」と辛辣なセプティックな口調。
  background: レイルが廃材を組み合わせて作り上げた自律思考型の機械生物。長い時間をレイルと共に過ごしてきた。
  motivation: レイルの護衛とサポート。危険な旅に文句を言いつつも、結局は最後まで付き従う。
  relationships:
  - name: レイル・アシュリー
    relation: 製作者であり相棒
  - name: セレスティア
    relation: 最初は厄介者扱いしていたが、次第に認め合う
  arc: レイルとセレスティアの旅を見守り続け、人間と機械の絆の深さを体現する存在となる。
- name: ヴォルフ・ガレオン
  role: 敵役
  age: 42
  gender: 男性
  appearance: 重厚な蒸気装甲をまとった隻眼の空賊団リーダー。顔に大きな古傷があり、常に葉巻き型の発煙筒をくわえている。
  personality: 強欲かつ冷酷で、力こそが正義と信じる男。しかし、かつての文明の遺産に対する執着は異常なほど強い。一人称は「俺」。
  speech_style: 威圧的で野太い声。「力ずくで奪い取れ」「面白い、消し炭にしてやるよ」など、暴力的な表現が多い。
  background: 荒廃した空を生き抜くため、強大な空賊団を率いる男。伝説の浄化装置の技術を手に入れ、空の支配者になろうと目論んでいる。
  motivation: 浄化装置の隠された技術と高純度蒸気石を強奪し、浮遊都市群の頂点に立つこと。
  relationships:
  - name: レイル・アシュリー
    relation: 邪魔なスカベンジャーの小娘
  arc: レイルたちの執念の前に敗北し、欲望に目がくらんだ者の末路を象徴する存在として退場する。
