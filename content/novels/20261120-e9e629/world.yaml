title: 錆びた歯車と、嘘の吐けない乙女の遺言
genre: スチームパンク冒険
tone: 荒廃した乾いた世界、皮肉混じりの哀愁
pov: 一人称（あたし）
tense: 過去形
setting: 巨大な蒸気機関が止まり、砂嵐と錆が支配する終末的な浮遊都市群
premise: 空飛ぶ巨大な廃船を住処にするスカベンジャーのあたしは、ある日、錆びついた真鍮の箱の中に閉じ込められた「失われた手紙」を見つける。その手紙の主は、言葉にできない真実を伝えるために「嘘をつけない呪い」をかけられた蒸気人形の少女だった。手紙が指し示すのは、雲の向こう側に眠るという伝説の浄化装置。あたしは、口の悪い相棒の機械鼠を連れて、錆びた空を切り裂く旅に出る。
themes:
- 真実の重み
- 機械の中の魂
- 滅びゆく世界での絆
rules:
- 蒸気圧が生命維持の鍵であり、圧力が下がると思考能力や運動能力が著しく低下する
- 『嘘をつけない呪い』を受けた者は、発声の際に蒸気を噴き出し、物理的な負荷がかかる
- 古い技術（オーバーテクノロジー）は、高度な蒸気制御技術がなければ起動すらできない
plot_outline:
- '序盤: 砂嵐の夜、廃船のゴミ溜めで、呪われた人形と、内容の読めない手紙を拾う。あたしは面倒ごとを避けたかったが、人形が吐き出した最初の言葉が、あまりに切実な真実だったため、渋々旅を決意する。'
- '中盤: 燃料（高純度蒸気石）の残量を気にしながら、空賊やスクラップ回収業者から逃げつつ、手紙の送り主がいたはずの『雲上の聖域』を目指す。旅の中で、人形がなぜ呪われたのか、その悲劇的な歴史を知る。'
- '終盤: 目的地である浄化装置の心臓部に到達するが、そこは既に狂った自律機械に支配されていた。人形が手紙を届けるためには、自らの蒸気機関を装置の起動に捧げなければならないことが判明する。'
- '結末: 人形は嘘をつかずに、最期の願い（手紙の内容）を装置に刻み込む。世界に微かな水と緑が戻り始める中、あたしは空っぽになった人形の真鍮の身体を抱え、また次の錆びた空へと漕ぎ出す。'
style_notes: 乾いた砂の匂いや、錆びた鉄の味が伝わるような描写を徹底すること。常に『燃料残量』や『弾薬数』、あるいは『道具の摩耗具合』を語り手の意識に介在させ、常に生存の危機を感じさせる。皮肉なユーモアを挟みつつも、廃墟の中に光る夕日や、油にまみれた指先に宿る一瞬の美しさを、あたしの歪んだ感性で鋭く描写する。
