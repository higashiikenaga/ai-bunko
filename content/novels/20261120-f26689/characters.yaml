- name: エリアン・ソーン
  role: 主人公
  age: 24
  gender: 男性
  appearance: 痩身で色白。記録官のグレーの制服を隙なく着こなし、感情を読ませない淡々とした眼差しを持つ。
  personality: 内向的で観察眼に優れる。規律を遵守してきたが、根底に強い知的好奇心を秘めている。一人称は「僕」。
  speech_style: 極めて正確で簡潔。形容詞を極力排除し、客観的な事実のみを述べる話し方。
  background: エコー・シティで生まれ育った純粋な市民。幼少期から言語管理への適応が高く、優秀な記録官としてシステムに重用されていた。
  motivation: 拾った手紙に記された「矛盾」の正体を突き止め、論理では説明できない感情の定義を知ること。
  relationships:
  - name: ライラ・ヴァンス
    relation: 監視対象であり、対立する上司
  - name: サイラス
    relation: 禁忌の知識を授けてくれる協力者
  arc: システムの歯車として「正解」だけを記録していた青年が、不完全で矛盾した「人間性」を受け入れ、沈黙の中に真実を持つ表現者へと成長する。
- name: ライラ・ヴァンス
  role: 敵役
  age: 32
  gender: 女性
  appearance: 鋭い眼光と完璧に整えられた夜会巻きの髪。隙のない黒い正装に身を包み、威圧感を放っている。
  personality: 冷徹で効率主義。主観や感情を「ノイズ」として嫌悪し、都市の秩序こそが至高の正義だと信じている。一人称は「私」。
  speech_style: 断定的で命令口調。システム用語を多用し、相手の論理的欠陥を即座に指摘する。
  background: 言語矯正局の高官。過去に感情による紛争で家族を失った経験から、徹底した情報統制による平和に心酔している。
  motivation: 都市からあらゆる「不純物（矛盾）」を排除し、完全なる論理社会を完結させること。
  relationships:
  - name: エリアン・ソーン
    relation: 有能な部下だと思っていたが、不純物に染まった裏切り者として認識する
  arc: 完璧な正義を執行している自負があったが、エリアンの揺るぎない「沈黙」に直面し、自分の中にある消しきれない空白に気づき始める。
- name: サイラス
  role: 相棒/協力者
  age: 45
  gender: 男性
  appearance: 猫背で、サイズの合わない古着を重ね着している。片方の目がナノマシンのエラーにより濁っている。
  personality: 皮肉屋で飄々としているが、情に厚い。システムの隙間を生き抜く術に長けている。一人称は「俺」。
  speech_style: 断片的で比喩的な表現を好む。監視を避けるため、わざと意味をぼかした話し方をする。
  background: かつては言語学者だったが、主観的な研究を行ったため「不純物」として処理されかけた。処理に失敗し、社会の底辺で潜伏生活を送っている。
  motivation: 自分が失った「言葉の自由」を、次世代であるエリアンに継承させること。
  relationships:
  - name: エリアン・ソーン
    relation: 導き手であり、唯一の理解者
  arc: 絶望の中で静観していたが、エリアンの純粋な探究心に触れ、再び人間としての誇りを取り戻し、彼を逃がすために自らを犠牲にする。
- name: ジュリアン・アリス
  role: キーマン（故人）
  age: 62
  gender: 男性
  appearance: （回想や記録の中）疲れ切った表情に深い皺があり、常にインクで汚れた指先をしていた。
  personality: 理想主義的な科学者。論理の限界を悟り、人間が持つ「矛盾」こそが進化の鍵であると信じていた。一人称は「私」。
  speech_style: 詩的で情熱的。論理的な正解よりも、心の揺らぎを重視した言葉選びをする。
  background: エコー・シティの基幹システムおよびナノマシンを設計した中心人物の一人。完成後にシステムの残酷さに気づき、密かに抵抗の種を蒔いた。
  motivation: いつか現れる「記録者」に、システムが消去した感情の記憶を伝えること。
  relationships:
  - name: エリアン・ソーン
    relation: 時を超えて手紙を通じて対話する精神的な師
  arc: システムへの絶望から始まり、最期に「愛」という論理不能な言葉を遺すことで、完璧な世界に致命的な亀裂を入れる。
