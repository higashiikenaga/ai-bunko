title: 真実の沈黙：声なき街の記録者
genre: ディストピア
tone: 静謐かつ冷徹。硬質で無機質な空気感。
pov: 三人称客観
tense: 過去形
setting: 高度な情報統制下に置かれた閉鎖都市「エコー・シティ」。居住者の発言はすべてAIによって監視・検証され、事実と異なる発言は即座に「不純物」として処理される社会。
premise: 全市民が「嘘をつけない」よう脳内にナノマシンを埋め込まれた都市。ここでは言葉は常に正確でなければならず、虚偽は社会的な死を意味する。記録官の青年は、ある日、廃棄物の中から宛名のない一通の「失われた手紙」を発見する。その手紙には、論理的に説明のつかない、矛盾に満ちた感情の記述が綴られていた。彼は、完璧な真実で塗り固められた世界に潜む、致命的な「空白」を追跡し始める。
themes:
- 真実と事実の乖離
- 言語による支配と自由
rules:
- 脳内のナノマシンが発話内容を検閲し、事実と異なる情報は発声そのものが物理的に阻害される。
- 感情を伴う比喩表現や、客観的事実に基づかない主観的な主張は「エラー」とみなされる。
- 記録官は、都市の矛盾を修正するために、歴史の整合性を保つ義務を負う。
plot_outline:
- '序盤: 記録官の主人公は、都市の平穏な日常と、厳格な言語管理のルールを淡々と描写する。ある清掃作業中に、ナノマシンの検閲をすり抜けた古びた紙片（手紙）を見つける。そこには『愛している』という、論理的には不確定な言葉が書かれていた。'
- '中盤: 主人公は手紙の主を探る過程で、都市の基幹システムが「個人の主観」を排除するために、過去の感情的な記録を組織的に抹消している事実を突き止める。手紙は、かつてシステムに従順だった科学者が、最期に遺した「真実ではないが、嘘でもない」言葉の断片であった。'
- '終盤: 記録官は、手紙の送り主がかつてシステムを設計した人物の一人であることを知る。システムはエラーを修正するため、主人公に手紙の破棄と記憶の消去を命じる。主人公は、手紙に記された「矛盾」こそが人間性の証明であると判断し、記録官としての職務を放棄する。'
- '結末: 都市の監視網は機能し続けるが、主人公はシステムが検閲できない「沈黙」の中に、失われた感情の記録を隠し持つ。彼は、言葉にできない真実を抱えたまま、灰色の街を静かに歩み続ける。'
style_notes: 感情を直接的な形容詞で説明せず、対象物の質感や光の加減、音の消失といった物理的な描写を通じて、人物の心理的変容を暗示すること。伏線となる小道具（手紙、特定のインクの匂い、ナノマシンの駆動音など）は、物語の要所で論理的に再登場させる。文章は簡潔な短文を基本とし、過剰な修飾を排して情報の正確性を優先する。
