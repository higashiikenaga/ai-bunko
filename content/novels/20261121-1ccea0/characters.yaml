- name: 浅霧 凪
  role: 主人公
  age: 26
  gender: 女性
  appearance: 都会での生活でやつれた、目の下に深い隈がある痩身の女性。どこか浮世離れした儚さがある。
  personality: 厭世的で内向的。現実逃避願望が強く、自分自身をどこか他人事のように感じている。「私」
  speech_style: 抑揚の少ない、静かで淡々とした話し方。
  background: 東京の広告代理店でデザイナーとして働いていたが、過労と不眠症により精神的に限界を迎え、退職した。
  motivation: 祖父の死をきっかけに、静かな故郷で心身を休めること。
  relationships:
  - name: 浅霧 源三
    relation: 祖父（故人）
  arc: 休息を求めて帰郷したはずが、逃れられない呪縛の中で「永遠の覚醒」という地獄へ叩き落とされる。
- name: 宗像 徳次郎
  role: 敵役
  age: 68
  gender: 男性
  appearance: 常に真っ直ぐな視線を向ける、肌の硬い老人。村の祭事用の装束を纏い、威圧感を放つ。
  personality: 狂信的だが、論理的で冷酷。村の存続こそが絶対の正義だと信じて疑わない。「儂」
  speech_style: 威圧的で、古風な村の言葉遣い。
  background: 村の長であり、不眠祭の儀式を司る総責任者。村の伝統を守ることを人生のすべてとしている。
  motivation: 儀式を完遂し、神の怒りを鎮めて村の安寧と繁栄を保つこと。
  relationships:
  - name: 浅霧 凪
    relation: 儀式の生贄（依代）
  arc: 伝統を守るという大義名分のもと、凪を容赦なく儀式の祭壇へと追い詰める執行者として君臨する。
- name: 瀬戸 結衣
  role: 脇役
  age: 25
  gender: 女性
  appearance: 常に周囲を怯えた目で見渡し、落ち着きがない。村の伝統的な服を纏っているが、着こなしが乱れている。
  personality: 臆病で同情心が強いが、村の掟や集団心理に抗えない弱さを持つ。「私」
  speech_style: 早口で、言葉に詰まることが多い。
  background: 凪の幼馴染。村に残って生活しているが、村の異常性と神への恐怖を人知れず抱え続けている。
  motivation: 凪に真実を伝え、逃がしてあげたいと願うが、結局は村の圧力に屈してしまう。
  relationships:
  - name: 浅霧 凪
    relation: 幼馴染
  arc: 凪を救いたいという願いを持ちながらも、村の狂気に抗えず、ただ絶望的な結末を傍観するだけの存在となる。
- name: 泥濘の神
  role: 敵役
  age: 不明
  gender: 不明
  appearance: 泥のように不定形で、無数の瞳が蠢く異形の塊。影のように実体がない。
  personality: 感情や倫理観を持たず、ただ底知れぬ飢えと「約束」への執着のみを持つ存在。
  speech_style: 脳内に直接響く、重低音の重なり合った不気味な声。
  background: 「約束の丘」に根を下ろす、古来より村の信仰と恐怖の対象となっている超自然的存在。
  motivation: 捧げられる意識と肉体、そして「眠り」を喰らうこと。
  relationships:
  - name: 浅霧 凪
    relation: 喰らうべき対象/依代
  arc: 凪の精神を侵食し、約束を果たすことで、彼女を完全な「神の部品」へと作り替える。
