title: 泥濘の約束と、不眠の神
genre: ホラー
tone: 静謐で閉鎖的な、土着的な恐怖感
pov: 三人称
tense: 過去形
setting: 現代、山深い僻地に位置する「神隠し」の伝承が残る村
premise: 都市の「眠らない街」で心身を擦り切らした主人公が、祖父の葬儀で故郷の村に戻る。そこでは三日三晩、誰一人として眠ってはならないという禁忌の祭りが執り行われていた。うたた寝をした主人公は、村の外れにある「約束の丘」に潜む、底知れぬ飢えを持つ神の標的にされてしまう。
themes:
- 因習への服従
- 逃れられない血縁の呪縛
rules:
- 祭りの期間中、睡眠は死と同義であり、眠った者は『丘の神』に魂を半分奪われる
- 約束の丘に登った者は、神との契約（約束）を結ばされ、一生眠れなくなるか、あるいは永遠に眠り続けるかの選択を迫られる
- 村の方言で語られる禁忌は、物理的な強制力を持って侵入者を縛る
plot_outline:
- '序盤: 主人公が都会の喧騒（眠らない街）を逃れ、故郷の村へ戻る。葬儀の最中、村全体が異様な緊張感に包まれていることに気づき、三日間眠ってはならない『不眠祭』の禁忌を告げられる。'
- '中盤: 疲労の極致にある主人公が、つい深い眠りに落ちてしまう。夢の中で『約束の丘』に導かれ、泥のような異形の神と遭遇し、不気味な約束を交わされる。目覚めると、周囲の村人たちが自分を『神の依代』として扱い始める。'
- '終盤: 村の真の目的が、外から来た血縁者に眠りを捧げることで村全体の安寧を得る「身代わり」の儀式であったことが判明する。逃げ出そうとするが、村の道はすべて丘へと繋がっており、逃げ場がないことに気づく。'
- '結末: 主人公は丘の上で、かつて同じ運命を辿った祖父の成れ果てと再会する。絶望の中で、彼女は自ら眠りに落ちることで神との約束を果たし、肉体は泥に還り、意識だけが永遠に眠らない地獄へと囚われる。'
style_notes: 三人称客観視点を基本としつつ、湿り気のある情景描写を多用する。会話文には東北地方をモデルにした緩い方言を混ぜ、村社会の閉鎖性と排他性を強調する。叫び声よりも、静かな囁きや足音などの聴覚的な恐怖を重視して描く。
