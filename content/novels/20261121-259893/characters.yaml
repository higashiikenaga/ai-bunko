- name: レオン・ヴォックス
  role: 主人公
  age: 26
  gender: 男性
  appearance: 左目が義眼で冷却液のチューブが露出している。黒ずんだトレンチコートと、雨粒を弾くカーボン製のインナー。
  personality: 皮肉屋でどこか自暴自棄だが、筋は通す。一人称は「オレ」。
  speech_style: 短くぶっきらぼう。スラングを多用する。
  background: ネオ・エデンの最底辺で、企業の廃棄データやジャンクを漁って日銭を稼ぐ「掃除屋（スイーパー）。元はアイギス社の末端プログラマー。
  motivation: 『月蝕』の断片に隠された真実を暴き、企業に奪われた過去を取り戻すこと。
  relationships:
  - name: シアン
    relation: 裏社会での情報屋・取引相手
  - name: ヴィクター・クロス
    relation: 追ってくる因縁の宿敵
  arc: 単なる金稼ぎのデータ漁りから、世界全体の運命を背負うハッカーへと覚醒する。
- name: シアン / 鈴音（リンイン）
  role: 相棒
  age: 22
  gender: 女性
  appearance: ピンクと紫のネオンカラーのツインテール、全身にホログラムのタトゥー。古いミリタリージャケットを羽織っている。
  personality: 勝気でちゃっかりしているが、義理堅い。一人称は「あたし」。
  speech_style: テンポが良く、軽口を叩くが、ハッキング中は冷徹に敬語混じりになる。
  background: スラムの裏通りで非合法の違法回線（アンダーネット）を売買する情報屋。レオンの過去をうっすらと知っている。
  motivation: 退屈なスラムの生活を抜け出し、レオンのダイブに同行して一攫千金とスリルを味わうこと。
  relationships:
  - name: レオン・ヴォックス
    relation: 相棒・腐れ縁
  arc: 危険な賭けを通じて、レオンの孤独な戦いを支えるかけがえのない存在へと変わる。
- name: ヴィクター・クロス
  role: 敵役
  age: 41
  gender: 男性
  appearance: 隙のない高価な仕立てのスーツに、顔の半分を覆うアイギス社製の無機質な制圧マスク。
  personality: 冷酷無比、効率主義。感情を一切表に出さない。一人称は「私」。
  speech_style: 常に静かで抑揚のない、威圧的なトーン。
  background: 超巨大企業『アイギス・テック』のセキュリティ部隊『エクスキュート』の最高司令官。街の機密を徹底的に隠蔽する男。
  motivation: 『月蝕』と『プロトコル・ルナ』の存在を抹消し、企業の支配体制を永遠に守ること。
  relationships:
  - name: レオン・ヴォックス
    relation: 排除すべき危険なバグ（元社員）
  arc: 絶対的な秩序の番人としてレオンを追い詰めるが、最後は人間の意志のデータの波に呑まれていく。
