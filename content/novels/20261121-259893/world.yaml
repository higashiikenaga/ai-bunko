title: クロームの残響：アビス・ダイブ
genre: サイバーパンク
tone: ネオンと雨のハードボイルド・ノワール
pov: 一人称（オレ）
tense: 現在形・過去形混在
setting: アイギス社の支配が瓦解し、データの奔流が物理現象として街を浸食し始めたネオ・エデン。空中を漂う廃船と、情報の濁流が渦巻く最下層のスラム。
premise: アイギス社の支配が終わり、世界は「自由」という名のカオスに放り出された。空に開いた亀裂から溢れ出した情報の奔流は、現実と電脳の境界を曖昧にし、街は常にデジタルな雨に濡れている。オレはシアンと共に、壊れた世界の断片を拾い集める掃除屋として生きている。だが、空飛ぶ巨大な廃船『アーク』が、失われたはずの『古い灯台』の座標を指して降下してきた時、オレの神経（ニューラル）は再び、禁断の深淵へとダイブすることを強制される。
themes:
- 自由の代償
- 記憶の定義
- 情報の荒野における生存
rules:
- 情報の奔流（データ・ストリーム）は物理的な干渉力を持つ。接触すれば神経系が焼き切れる。
- 『Project LUNA』の残滓を持つ者は、デジタル世界への強制ダイブ能力を持つが、肉体への負荷が極めて高い。
- 管理社会の崩壊後、企業は小規模な軍事民営化組織（PMC）へと変貌し、スラムの資源を奪い合っている。
plot_outline:
- '序盤: アイギス崩壊後の混沌としたネオ・エデン。オレはシアンとスラムで細々とデータの残骸を漁っている。ある日、空を覆う雲を割って、かつての巨大企業が所有していた空飛ぶ船『アーク』が、制御を失った状態で街へ接近する。その船が放つ信号は、前作で消滅したはずの『古い灯台』の再起動を告げていた。'
- '中盤: オレたちは『アーク』の奪還と、その中にあるとされる『全人類のバックアップ』を巡り、新興PMCの追撃を受ける。ハッキングによる防衛網の突破、路地裏での銃撃戦。ダイブの最中、オレは『情報の奔流』の深層に、かつての自分自身が残した「バックドア」を発見する。それは、現実を再構築するためのコードだった。'
- '終盤: 舞台は、海上に浮かぶ再起動した『古い灯台』へ。そこは現実と電脳が完全に融解した特異点だった。オレは『アーク』の制御権を奪い、灯台のサーバーへと強引にダイブする。そこには、崩壊した世界を「修復」しようとする、かつてのシステム・プログラムの意志が待ち構えていた。'
- '結末: オレはシステムによる強制的な世界の再管理（リセット）を拒絶する。コードの嵐の中で、オレは『個』の存在を維持したまま、奔流をコントロールする新しいプロトコルを書き込む。世界は救われない。だが、管理されないまま、濁ったまま、オレたちはこのカオスな夜を生き続けることを選ぶ。'
style_notes: 短いセンテンス。断続的なリズム。スラングを混ぜたハードボイルドな独白。ハッキング描写は「プロトコルを叩き、パケットを捩じ込み、暗号の壁を焼き切る」といった具体的で感覚的な手順で描く。ネオンの光と、絶え間ない雨、電子ノイズの質感を重視する。
