- name: セレスティナ・ルナ・ルナリア
  role: 主人公（光）
  age: 18
  gender: 女性
  appearance: 月光を思わせる輝く銀髪と、深いサファイア色の瞳。常に完璧な宮廷礼装を纏い、気品に満ちた佇まいを見せる。
  personality: 責任感が強く、慈愛に満ちているように見えるが、内面には孤独と、完璧な皇女を演じ続けることへの疲弊を抱えている。一人称は「私」。
  speech_style: 優雅で理知的、誰に対しても礼儀正しいが、どこか壁を感じさせる話し方。
  background: ルナリア帝国の第一皇女。次期皇帝として期待され、戴冠式を控えている。双子の妹の存在を隠し続けてきた。
  motivation: 帝国の繁栄を維持し、自分自身の運命を受け入れつつ、妹の安全を確保すること。
  relationships:
  - name: セレーナ・ルナ・ルナリア
    relation: 双子の妹。唯一無二の絆であり、守るべき存在。
  - name: ユリアン・フォン・ヴァレンシュタイン
    relation: 幼少期からの信頼を寄せる騎士。
  arc: 完璧な「象徴」としての役割と、一人の「人間」としての願いの間で葛藤し、最終的に自らの意志で運命を掴み取る。
- name: セレーナ・ルナ・ルナリア
  role: 主人公（影）
  age: 18
  gender: 女性
  appearance: セレスティナと瓜二つの容貌だが、瞳の色がわずかに暗い。影に溶け込むような黒いレースのドレスや、質素な装いを好む。
  personality: 冷静沈着で生存本能が強く、現実主義。皮肉屋だが、姉に対しては複雑な愛憎を抱いている。一人称は「あたし」。
  speech_style: ぶっきらぼうで、時に刺のある鋭い言葉を使う。宮廷の人間には見せない剥き出しの感情を持つ。
  background: 帝国の忌み子として、存在を抹消され、宮廷の地下や裏社会で生きながらえる双子の妹。
  motivation: 姉の影として生き延びること、そして自分自身の存在を誰かに認めてもらうこと。
  relationships:
  - name: セレスティナ・ルナ・ルナリア
    relation: 双子の姉。光と影として対照的な運命を歩む対象。
  - name: ユリアン・フォン・ヴァレンシュタイン
    relation: 唯一、心から信頼し、寄り添える存在。
  arc: 隠れ続ける「影」としての諦念を捨て、大月食の夜に自らの真実を白日の下に晒す決断を下す。
- name: ユリアン・フォン・ヴァレンシュタイン
  role: 相棒
  age: 24
  gender: 男性
  appearance: 鋭い眼光と、戦いでついた浅い傷が残る左頬。鍛え上げられた体躯を持ち、古びているが手入れの行き届いた剣を携えている。
  personality: 寡黙で忠実。不器用なまでに真っ直ぐな性格。一人称は「俺」。
  speech_style: 簡潔で飾り気のない、実直な口調。
  background: かつては帝国騎士団の若きエリートだったが、政争に巻き込まれ家系ごと没落。現在はセレーナを密かに護る影の守護者。
  motivation: セレーナを守り抜き、彼女が光の下でも影の下でも生きられる世界を作ること。
  relationships:
  - name: セレーナ・ルナ・ルナリア
    relation: 命を賭して守るべき対象であり、愛する女性。
  - name: セレスティナ・ルナ・ルナリア
    relation: 守るべき対象の姉であり、敬意を払うべき皇女。
  arc: 過去の敗北による喪失感から脱却し、運命の渦中で大切なものを守るために、自らの剣を振るう。
- name: ヴィクトール・ド・グランモー
  role: 敵役
  age: 32
  gender: 男性
  appearance: 完璧な貴族の装い。常に不敵な微笑を浮かべ、指には巨大な深紅の宝石を嵌めている。端正な顔立ちだが、瞳に冷徹な光を宿す。
  personality: 野心的で極めて計算高い策士。目的のためには手段を選ばず、人心を操ることに長けている。一人称は「私」。
  speech_style: 甘美で流暢、相手を酔わせるような、しかし油断ならない話し方。
  background: 有力な伯爵家を継ぐ野心家。双子の存在という「帝国の脆さ」を利用して、大月食の混乱に乗じた政変を企てる。
  motivation: 旧態依然とした帝政を破壊し、自らが新たな秩序の頂点に立つこと。
  relationships:
  - name: セレスティナ・ルナ・ルナリア
    relation: 自らの野望を成し遂げるための、操り人形として狙う対象。
  - name: セレーナ・ルナ・ルナリア
    relation: 計画を狂わせる不確定要素であり、排除すべき脅威。
  arc: 盤面を支配していると確信していたが、双子の絆という予測不能な変数によって、自らが築いた罠に落ちていく。
