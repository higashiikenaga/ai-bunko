title: 月蝕の帷、双影の舞踏会
genre: 群像劇
tone: 華麗、耽美、陰謀に満ちたロマン
pov: 三人称
tense: 過去形
setting: 架空の帝政国家「ルナリア帝国」。18世紀のヨーロッパを彷彿とさせる、月と宝石を崇拝する華やかな宮廷社会。
premise: 月がその姿を隠す「大月食」の刻、帝国の繁栄は終わりを告げるのか、あるいは新たな伝説が始まるのか。煌びやかな宝石とレースに彩られた宮廷を舞台に、表舞台に立つ第一皇女と、影に潜み生きながらえる双子の妹、そして彼女たちを巡る騎士と野心的な貴族たちの運命が交錯する。舞踏会の華麗な旋律の裏で、愛と裏切り、そして血塗られた政争が静かに、しかし猛烈に渦巻いていく。
themes:
- 光と影の共生
- 運命の代替可能性
- 美しき裏切り
rules:
- 双子の共鳴：双子の片方が深い精神的衝撃を受けると、もう片方も物理的な徴候を呈する。
- 月蝕の顕現：大月食の間、宮廷の結界が弱まり、隠蔽された真実や魔力が視覚化される。
plot_outline:
- '序盤: 豪華絢爛な社交界の描写。第一皇女の戴冠式を控えた祝祭の始まりとともに、影で生きる双子の妹と、彼女を密かに護る没落騎士の孤独な誓いが描かれる。'
- '中盤: 舞踏会でのドレスの裾に隠された毒、扇に託された密書。双子の存在を巡る疑惑が宮廷を揺るがし、権力争いが加速する中で、愛する者同士が敵対する構図が浮き彫りになる。'
- '終盤: 運命の大月食の夜。仮面舞踏会が血と陰謀の戦場へと変貌する。双子の入れ替わりを利用したクーデターが勃発し、月が欠ける瞬間にすべての真実が暴かれる。'
- '結末: 月が再び輝きを取り戻す頃、生き残った者たちが手にしたのは栄光か、それとも喪失か。光の中に立つ者と、影に溶ける者の、美しくも残酷な結末。'
style_notes: サテンの光沢、宝石の煌めき、重厚なドレスの刺繍、そして香水の芳香を、過剰なまでに美しい修辞を用いて描写すること。感情の機微は、風景や衣装の装飾の変化に託して、優雅かつ劇的に綴る。読者がその場にいるかのような、五感を刺激する装飾的な文体を維持せよ。
