- name: カイ
  role: 主人公
  age: 17
  gender: 男性
  appearance: 痩身だが引き締まった肢体。感情がダイレクトに表情や指先に現れるため、常に落ち着きがないように見える。瞳は深い海のような青色。
  personality: 純粋で真っ直ぐ。自分の「呪い」を疎んでいたため内向的だが、波に乗っている時だけは誰よりも大胆。一人称は「俺」。
  speech_style: ぶっきらぼうだが、嘘をつけないため言葉に裏表がなく、時折核心を突きすぎる。
  background: 海上都市の最下層「錆びた街」出身。身体的反応が意図を露呈させる特異体質（呪い）のせいで、対戦相手に手の内を読まれ、才能がありながらも負け続けてきた。
  motivation: 誰にも読ませない、自分だけの「正解のライン」を深淵の波の中に見つけ出すこと。
  relationships:
  - name: レン
    relation: 最大のライバル。圧倒的な完成度に憧れと恐怖を抱いている。
  - name: ミア
    relation: 唯一の理解者であり、ボードのメンテナンスを任せている相棒。
  arc: 自分の呪いを「弱点」ではなく、波と完全に同期するための「超感覚」として受け入れ、唯一無二のスタイルを確立する。
- name: レン・カンザキ
  role: 敵役/ライバル
  age: 18
  gender: 男性
  appearance: 銀髪に冷徹な眼差し。最新鋭の最高級ギアに身を包み、指先まで完璧に管理された美意識を持つ。
  personality: 完璧主義者で傲慢。効率と計算を至上とし、感情によるブレを嫌う。一人称は「僕」。
  speech_style: 丁寧な口調だが、相手を見下すような冷ややかな言い回しが多い。
  background: 海上都市の支配層出身。幼少期から英才教育を受け、アビス・サーフィンの理論的頂点を極めた天才。カイの「嘘をつけない」性質を、未熟な動物の反応だと切り捨てている。
  motivation: 計算し尽くされた完璧なライディングで、海という不確定要素を完全に支配すること。
  relationships:
  - name: カイ
    relation: 最初は「ノイズ」として軽視していたが、次第にその狂気的な同期率に脅威を感じ始める。
  arc: 計算を超えたカイの情熱に触れ、効率だけでは到達できない「波の真理」があることを知り、真の競い合いに目覚める。
- name: ミア
  role: 相棒/メカニック
  age: 21
  gender: 女性
  appearance: オイルで汚れたオーバーオール姿。頭に大きなゴーグルを乗せ、常に工具を携帯している。快活な笑顔が特徴。
  personality: 天真爛漫で好奇心旺盛な天才エンジニア。理論よりも直感と「音」で機械を調整する。一人称は「あたし」。
  speech_style: 早口で賑やか。専門用語を混ぜながら、カイを鼓舞するような明るい話し方。
  background: 元プロサーファーだったが、怪我で引退。その後、伝説のサーファーが遺した古いボードの修復に没頭し、その潜在能力を引き出せるカイに賭けることにした。
  motivation: 自分が到達できなかった「深淵の波」の頂点を、カイのライディングを通じて見ること。
  relationships:
  - name: カイ
    relation: 才能を見出した弟子のような存在であり、精神的な支柱。
  arc: カイの成長を通じて、失っていた海への情熱を再燃させ、エンジニアとしてボードに「魂」を宿らせる術を習得する。
- name: ソラ
  role: 脇役/メンター
  age: 35
  gender: 男性
  appearance: 日焼けした肌に深い傷跡を持つ、枯れた雰囲気の男。常に古びたシャツを着て、海辺で静かに時間を過ごしている。
  personality: 達観しており、飄々としている。言葉少なだが、本質を突く助言を与える。一人称は「私」。
  speech_style: 穏やかでゆっくりとした話し方。比喩表現を多用する。
  background: かつて「深淵の波」に挑み、生き残った唯一の伝説的サーファー。現在は正体を隠して隠居しているが、カイが持つ古いボードの元の持ち主の弟子だった。
  motivation: 次世代の者が、自分たちが成し得なかった「波との完全な調和」に到達することを見守る。
  relationships:
  - name: カイ
    relation: 呪いを武器に変えるためのヒントを与える、精神的な導き手。
  arc: カイの挑戦を通じて、過去の挫折や喪失感を乗り越え、次世代にバトンを繋いだことに安らぎを得る。
