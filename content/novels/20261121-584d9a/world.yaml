title: 鉄錆の鼓動：アビス・サーフィン
genre: スポーツ青春
tone: 熱量溢れる、肉体的で泥臭い躍動感
pov: 三人称
tense: 基本は過去形、試合展開時は現在形
setting: 近未来の海上都市。海面下数千メートルに沈んだ『海底遺跡』の周囲に発生する、超高圧の熱水噴出孔から生まれる「激流波」を舞台とする。
premise: 海底遺跡から湧き上がる猛烈な熱水の噴出を、特殊なボードで乗りこなすエクストリーム・スポーツ『アビス・サーフィン』。主人公のカイは、感情や意図が身体の動きにダイレクトに現れてしまう『嘘をつけない呪い』を抱え、技術を隠せず、常にライバルに手の内を読まれてきた。しかし、死の淵にある海底遺跡の最深部、未知の波に挑む中で、彼は呪いさえも武器に変える独自のスタイルを見出していく。極限の波と、命を削る熱情が交錯する。
themes:
- 宿命との対峙
- 剥き出しの真実
rules:
- アビス・サーフィンは、海底遺跡周辺の熱水噴出孔が発生させる特殊な重力波を利用する競技である
- プレイヤーは超高圧環境に耐えるための強化外骨格スーツを着用しなければならない
- 『嘘をつけない呪い』とは、極限状態において身体が思考よりも先に真実の動き（癖や恐怖）を露呈してしまう特性を指す
plot_outline:
- '序盤: 海上都市の貧民街で、呪いゆえに技術を隠しきれず敗北を繰り返すカイが、伝説のサーファーの遺した古いボードを手に入れる。'
- '中盤: 激化するプロリーグの予選。カイは『嘘をつけない呪い』を逆手に取り、身体の全反応を波の予測に同期させる狂気的なスタイルを確立。しかし、決勝直前に最大のライバルに完敗し、絶望の中で敗者の視点（ライバルの持つ圧倒的な強さへの恐怖と敬意）を描く。'
- '終盤: 伝説の『海底遺跡・深淵の波』を攻略する世界大会。カイは呪いを受け入れ、魂の叫びをボードに乗せて、誰も到達したことのない波の頂点へと駆け上がる。'
- '結末: 荒れ狂う波を乗り越えたカイ。そこには、偽りのない自分自身の鼓動と、新たな世界の景色が広がっていた。'
style_notes: 汗の匂い、波の砕ける音、肺が焼けるような呼吸を、短文の連続と現在形を用いて叩きつけるように描写する。心拍数が上がるような疾走感を重視。敗北シーンでは、勝者の栄光ではなく、敗北した者の喉の奥に詰まった悔しさや、突き刺さるような痛みを克明に描くこと。
