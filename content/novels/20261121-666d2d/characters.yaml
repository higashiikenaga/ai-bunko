- name: 久我 蓮
  role: 主人公（探偵役）
  age: 32
  gender: 男性
  appearance: 痩身で神経質な印象。銀縁の眼鏡をかけ、常に精密な測定用定規を携帯している。
  personality: 徹底した合理主義者。感情を排し、物理法則と数学的整合性のみを信じる。一人称は「私」。
  speech_style: 断定的で理路整然としている。相手の矛盾を突く際は静かに、しかし鋭く問い詰める。
  background: 元物理学教授。ある事件をきっかけにアカデミアを離れ、現在は「不可解な物理現象」を解明するコンサルタントとして活動している。
  motivation: 完璧に構築された「密室」というパズルを論理的に解体し、真実を導き出すこと。
  relationships:
  - name: 佐伯 真夜
    relation: 知的なライバルであり、論理の方向性が異なる対立相手
  - name: 成瀬 空
    relation: 観察対象として扱いながらも、その純粋さに僅かな興味を持つ
  arc: 冷徹な論理のみを武器にしていたが、犯人の「狂気的な知的好奇心」に触れ、論理の限界と人間性の不条理を再認識する。
- name: 佐伯 真夜
  role: 敵役（犯人）
  age: 29
  gender: 女性
  appearance: 切れ長の目に冷ややかな眼差し。常に髪をタイトにまとめ、隙のない白衣を纏っている。
  personality: 冷酷な完璧主義者。学問的探求のためなら倫理さえも切り捨てる。一人称は「私」。
  speech_style: 効率を重視した簡潔な話し方。感情の起伏が乏しく、淡々と事実を述べる。
  background: 流体力学と鳥類学を専門とする天才研究者。犠牲者である学者の理論に欠陥があると考え、それを証明するための「実験」を計画した。
  motivation: 自身の構築した殺害理論（物理的な密室構築）が現実的に可能であることを証明すること。
  relationships:
  - name: 久我 蓮
    relation: 自分の完璧な理論を崩しうる唯一の知的脅威
  - name: 篠崎 健二
    relation: 尊敬していたが、同時に理論的な限界に達したと考えていた元師
  arc: 完璧な犯罪を完遂し、久我に正解を導き出させることで自らの理論を完成させようとするが、最後には久我に「論理の飛躍」を切り捨てられ、絶望する。
- name: 成瀬 空
  role: 脇役（狂言回し）
  age: 24
  gender: 男性
  appearance: おどおどした雰囲気を持つ青年。サイズの合わない大きめのカーディガンを着用している。
  personality: 誠実で心優しいが、気が弱い。学問への情熱は強い。一人称は「僕」。
  speech_style: 語尾が伸びやすく、自信なさげな口調。専門的な話題になると早口になる。
  background: 犠牲者の篠崎教授に師事していた若手研究者。教授の死に深く絶望し、真相を突き止めたいと願っている。
  motivation: 師匠が遺した研究の正当性を証明し、死の真相を明らかにすること。
  relationships:
  - name: 篠崎 健二
    relation: 心から尊敬していた恩師
  - name: 久我 蓮
    relation: 恐ろしさを感じつつも、唯一頼れる解決者
  arc: 精神的な動揺で疑われ、追い詰められるが、久我の推理を通じて師の真意と、学問の残酷な側面を知り、自立した研究者として歩み出す決意をする。
- name: 谷口 剛郎
  role: 脇役（証言者）
  age: 62
  gender: 男性
  appearance: 日焼けした深い皺のある顔。太い指と、潮風に晒された無骨な外見。
  personality: ぶっきらぼうだが情に厚い。島の自然と灯台の構造に誰よりも詳しい。一人称は「俺」。
  speech_style: 粗野な口調で、離島特有の訛りが混じる。
  background: 元船乗りで、現在は離島の灯台管理員。長年、島に訪れる研究者たちをサポートしてきた。
  motivation: 静かな島に持ち込まれた惨劇を早く終わらせ、元の平穏を取り戻すこと。
  relationships:
  - name: 篠崎 健二
    relation: 気難しい男だと思いながらも、その情熱を認めていた友人
  - name: 久我 蓮
    relation: 理屈っぽい若者として快く思っていないが、能力は認めている
  arc: 外部からの人間（研究者たち）への不信感を募らせるが、事件解決を通じて、彼らが抱える孤独な闘いへの理解を示す。
