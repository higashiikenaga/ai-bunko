title: 渡り鳥の不在証明
genre: 本格ミステリー
tone: 冷徹、論理的、静謐な緊張感
pov: 三人称（探偵の思考を括弧書きで挿入）
tense: 過去形
setting: 現代、隔絶された離島の古い灯台
premise: 絶滅したはずの渡り鳥の研究に没頭する学者が、密室状態の灯台内で遺体となって発見される。現場に残されたのは、あり得ないはずの未知の羽毛と、規則正しく刻まれた機械的な灯台の回転音のみであった。孤立した島に集められた数人の研究者たちは、互いに疑念の目を向け合い、真実は潮の満ち引きと共に沈んでいく。論理の刃を研ぎ澄ます探偵は、物理的な矛盾と、自然界の秩序の綻びから、完璧に見えた密室の幾何学を解き明かしていく。
themes:
- 科学的真実と主観的欺瞞
- 閉鎖空間における論理の限界
rules:
- 密室は物理的に外部からの侵入が不可能な構造である
- 現場に残された羽毛は、その死の状況を説明する唯一の物理的手がかりである
- 全てのトリックは、灯台の回転機構と気象条件に基づいた物理法則に従う
plot_outline:
- '序盤: 嵐の予兆が漂う離島。古い灯台の管理者が、施錠された書斎の中で学者の遺体を発見する。窓は内側から閉ざされ、唯一の遺留品は、生物学的に存在し得ない渡り鳥の羽毛であった。'
- '中盤: 容疑者となる研究者たちの間で、学者の研究成果を巡る対立が露呈する。探偵は、灯台の回転周期、窓の隙間を抜ける風の音、そして羽毛が「どの方向から落ちたか」という微細な物理的矛盾に注目し、犯行のプロセスを逆算していく。'
- '終盤: 密室は「人の侵入」ではなく、「外部からの力学的な操作」によって成立していたことが論理的に証明される。犯人は、灯台の回転灯が描く光の軌跡と気圧差を利用した、極めて数学的な殺害手法を用いていた。'
- '結末: 犯人の動機は、学問的な名誉欲ではなく、自身の仮説を証明するための冷酷な実験であったことが判明する。探偵は、その犯人の「論理の飛躍」を皮肉と共に切り捨て、事件を終結させる。'
style_notes: 理詰めで冷ややかな知性派の文体。会話は感情的な衝突ではなく、皮肉と論理の応酬とする。探偵の思考は「（……非合理的だ。この現象が成立するためには、少なくとも一つの変数が欠落している）」のように括弧書きで挿入する。読者が推理できるよう、羽毛の向き、灯台の回転速度、風向きなどの物理的情報を、叙述トリックに頼らず明確に提示すること。
