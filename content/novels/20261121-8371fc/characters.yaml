- name: 浅倉 遥
  role: 主人公
  age: 27
  gender: 男性
  appearance: 痩身で青白い顔立ち。度の強い眼鏡をかけており、常にメモ帳を携帯している。地味なベージュのコートを好む。
  personality: 内向的で執着心が強く、論理的に物事を考えようとする。一人称は「僕」。
  speech_style: 丁寧だが、どこか距離感のある淡々とした話し方。
  background: 地方都市で図書館司書として働く青年。幼少期の記憶が断片的であることに漠然とした不安を抱えていた。
  motivation: 失踪した友人・佐伯の行方を追い、古書店の正体を突き止めること。
  relationships:
  - name: 佐伯 慎二
    relation: 失踪した大学時代の友人
  - name: 店主
    relation: 記憶の取引を行う謎の人物
  arc: 知的好奇心と友人を想う気持ちで店を訪れるが、最終的に自らのアイデンティティが他人の記憶の継ぎ接ぎであったことを知り、自己崩壊に至る。
- name: 佐伯 慎二
  role: 物語の導入役（失踪者）
  age: 31
  gender: 男性
  appearance: 快活な印象の青年だったが、失踪直前の日記には精神的な疲弊が滲んでいた。
  personality: 社交的で情に厚い。しかし、ある種の強い罪悪感に苛まれていた。
  speech_style: 口調は軽く、冗談を交えて本心を隠す傾向がある。
  background: かつて重大な過失を犯し、その記憶を消すために月食の夜に古書店を訪れた。
  motivation: 自らの人生を汚した「最悪の記憶」を完全に抹消すること。
  relationships:
  - name: 浅倉 遥
    relation: 唯一信頼していた友人
  arc: 記憶を返却して忘却を得たが、空いた心の隙間に他人の絶望が流れ込み、精神的に破滅して行方不明となる。
- name: 店主
  role: 案内人兼観測者
  age: 40
  gender: 不詳
  appearance: 年齢不詳。古風な三つ揃いのスーツを纏い、常に薄笑いを浮かべている。瞳の色が月食のように不規則に変化する。
  personality: 慇懃無礼で冷徹。人間を記憶の器として観察することに快楽を覚えている。一人称は「私」。
  speech_style: 極めて丁寧な敬語だが、相手の急所を突くような残酷な言い回しを好む。
  background: 月食の夜にのみ現れる古書店の主。記憶を本として管理し、世界の均衡（あるいは混沌）を維持している。
  motivation: 興味深い「記憶の混濁」を鑑賞し、新たな記憶のコレクションを集めること。
  relationships:
  - name: 浅倉 遥
    relation: 最高の素材となる客
  arc: 物語を通じて変化せず、淡々と客を破滅へ導く絶対的な装置として機能する。
- name: 桐生 冴子
  role: 脇役（記憶の犠牲者）
  age: 45
  gender: 女性
  appearance: やつれた表情に深い隈がある。常に何かに怯えたように周囲を気にしている。
  personality: 神経質で不安定。かつては聡明な女性だったが、現在は混乱状態にある。一人称は「私」。
  speech_style: 断続的で、話の途中で主語が入れ替わることがある（記憶の混濁）。
  background: 他人の幸福な記憶を誤って読み込んでしまい、自分の惨めな現実と、偽りの幸福な記憶の乖離に耐えられなくなった。
  motivation: 自分が本当は誰であったのか、元の記憶を取り戻したい。
  relationships:
  - name: 浅倉 遥
    relation: 情報を与える証言者
  arc: 遥に警告を発することで自らの悲劇を伝えようとするが、最終的には記憶の濁流に飲み込まれ、完全に自己を喪失する。
