title: 名もなき古書店の聞き書き
genre: 怪談・民俗
tone: 淡々とした聞き書き風
pov: 一人称（語り手としての「私」）
tense: 過去形
setting: 地方都市の路地裏、月食の時期にのみ現れる古本屋
premise: ある古本屋には、売買ではなく「記憶の返却」を目的とした棚があるという。人々は自らの人生から切り離したい記憶を本に綴り、そこに預けることで忘却を得る。しかし、月食の夜に誤ってその本を開いた者は、他人の絶望を自分の記憶として上書きされてしまう。
themes:
- 記憶の忘却
- 罪の転嫁
rules:
- 店は月食の前後数日のみ、特定の路地裏に不規則に現れる
- 預けられた本は、持ち主がその記憶を完全に忘れたときにのみ「空白の頁」へと変化する
- 空白でない頁を他人が読むと、そこに記された記憶が読者の意識に混濁して流れ込む
- 一度混濁した記憶は、二度と元の持ち主に戻すことはできず、読者の人格の一部となる
plot_outline:
- '序盤: 語り手が、失踪した知人が残した日記から、ある不思議な古本屋の噂を知る。周辺住民から、かつてその店を訪れた人々が「自分ではない誰かの記憶」に悩まされていたという断片的な証言を集める。'
- '中盤: 異なる人物たちの体験談が提示される。愛する人を殺した記憶を預けた男、あるいは他人の幸福な記憶を読み込んでしまった女など、記憶の混濁によって人生を狂わされた人々の末路が淡々と語られる。'
- '終盤: 月食の夜、語り手自身がその店に辿り着く。棚に並ぶ一冊の古書に惹かれ、頁をめくると、そこには語り手がこれまで「自分のもの」だと信じていた幼少期の記憶が、全く別の視点から詳述されていた。'
- '結末: 店は月食の終わりと共に消え、語り手は路地裏に取り残される。自分が誰であるかという確信が揺らぎ、頭の中で誰のものかも分からない複数の人生が喧嘩し始めたところで、物語は静かに閉じられる。'
style_notes: 「～だそうだ」「～という話だ」という伝聞形式を徹底し、客観的な報告書のような距離感を保つ。情景描写を最小限に抑え、短いエピソードを積み重ねることで不気味さを演出する。結末において正解を提示せず、読者に正体不明の不安を残す構成とする。
