- name: カイ
  role: 主人公
  age: 24
  gender: 男性
  appearance: 油汚れのついた作業着を纏い、指先には硬いタコがある。無造作な黒髪と、どこか遠くを見ているような伏せ目がちな瞳。
  personality: 内向的で思慮深い。効率を重視する都市において、物に宿る微かな違和感を大切にする。一人称は「僕」。
  speech_style: 低めのトーンで、必要最低限のことしか話さない簡潔な話し方。
  background: 都市の最下層で、放棄されつつある旧式の蒸気配管の保守点検を行う技術者。
  motivation: 完璧に管理された世界の中で、自分だけが感じる「確かな手触り」の正体を知ること。
  relationships:
  - name: エナ
    relation: 孤独を分かち合い、共に世界のノイズを刻むパートナー
  arc: 諦念の中で静かに生きる技術者から、不完全な世界の温もりを守るために声を上げる人間へと変化する。
- name: エナ
  role: 相棒
  age: 22
  gender: 女性
  appearance: 都市の色彩に馴染まない、意志の強さを感じさせる瞳。古い布で作られた、身体を包み込むような装い。
  personality: 情熱的で直感的。論理よりも感覚を信じ、未知の体験に対して臆さない。一人称は「私」。
  speech_style: 抑揚が豊かで、言葉のひとつひとつに温度を感じさせる話し方。
  background: 上層階の管理された生活に限界を感じ、物理的な「熱」を求めて下層階へと降りてきた女性。
  motivation: 壊れた古いオルゴールを修理し、失われた「音」と「熱」を体感すること。
  relationships:
  - name: カイ
    relation: 共に不自由な温かさを探求する理解者
  arc: 単なる好奇心による逃避から、不自由さや痛みを引き受けて共に生きる覚悟を決める。
- name: ゼノ
  role: 敵役
  age: 35
  gender: 男性
  appearance: 塵一つない銀色の制服。左右対称の整った顔立ちと、感情を一切読み取らせない冷徹な眼差し。
  personality: 極端な合理主義者。秩序と最適化こそが人類の幸福であると信じて疑わない。一人称は「私」。
  speech_style: 完璧な文法に基づいた、機械的で淀みのない、威圧感のある敬語。
  background: 都市管理AIの意図を物理的に執行する、最適化局の執行官。
  motivation: 都市から「非効率なノイズ（蒸気、旧式設備、不規則な感情）」を完全に排除すること。
  relationships:
  - name: カイ
    relation: 排除すべきエラーの発生源
  arc: 計算通りの完璧な管理を目指すが、人間の予測不能な熱量によって計画が瓦解していく過程を経験する。
