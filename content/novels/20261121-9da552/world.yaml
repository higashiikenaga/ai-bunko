title: 熱を運ぶノイズ
genre: SF
tone: 静謐で温度感のある、淡々とした近未来の日常
pov: 三人称近接
tense: 過去形
setting: 全自動最適化都市『アエテルナ』。ホログラムの空が昼夜を制御し、住民はナノマシンで睡眠時間を管理されているため、文字通り眠らない街となっている。
premise: あらゆる不便が解消され、感情さえも最適化された都市で、主人公のカイは旧時代の遺物である「蒸気配管」の保守点検を行う低層階の技術者だった。ある日、彼はデジタルな温もりに飽き足らず、物理的な「熱」を求める女性・エナと出会う。効率の果てに切り捨てられた「不自由な温かさ」を巡り、二人は都市の静寂の中に小さなノイズを刻み始める。
themes:
- 効率と不自由
- 触覚的な孤独
- 忘れられた身体性
rules:
- 都市の住民は、生体リズム調整システムにより、個々の最適タイミングで短時間の仮眠をとるが、街全体の機能は24時間停止しない。
- 物理的な接触や摩擦を伴う機械は『不衛生で非効率』として禁忌視され、ほとんどが磁気浮上か光学的伝達に置き換わっている。
- 下層階にのみ、都市の排熱を利用した旧式の蒸気機関設備が残存している。
plot_outline:
- '序盤: 最適化された生活に馴染みつつも、どこか空虚さを抱えるカイの日常を描く。彼は仕事で蒸気配管の錆を落とし、鈍い金属音を聞くことに密かな安らぎを感じている。'
- '中盤: 禁忌であるはずの物理的な『熱』を求めて下層階に現れたエナと出会う。彼女はかつての蒸気機関で動いていた古いオルゴールを直したいと願い、二人は密かに修理を始める。'
- '終盤: 都市管理AIが下層階の非効率な設備を完全に排除し、完全な電磁化を決定する。カイとエナは、自分たちが感じていた『心地よい不自由さ』を守るため、最後の一掻きの蒸気を上げて街にノイズを響かせる。'
- '結末: 設備は撤去されるが、二人の間にはデジタルでは代替できない、肌の温もりと共有した記憶が残る。完璧な静寂よりも、不完全な雑音と共に生きることを選ぶ二人の後姿で幕を閉じる。'
style_notes: 高度な技術（ナノマシン、ホログラム空）を生活の一部として淡々と描写し、対比として蒸気の白さや金属の錆びた匂いなどの五感を強調する。便利さによって失われた『待つ時間』や『手のひらの熱』にフォーカスし、切なさを帯びた筆致で綴る。
