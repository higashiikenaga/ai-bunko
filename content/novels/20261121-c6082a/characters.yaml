- name: 浅倉 怜
  role: 主人公
  age: 27
  gender: 男性
  appearance: 青白い肌に、ひどく痩せた指先。喪失感に塗りつぶされた虚ろな瞳を持つ。常に古びた手帳を持ち歩いている。
  personality: 内向的で執着心が強く、一度決めたことは突き詰める傾向にある。一人称は「私」。
  speech_style: 静かで抑揚の少ない話し方。独白が多く、自問自答する癖がある。
  background: 数年前に最愛の恋人を亡くしたが、ある時から相手の名前や具体的な顔などの記憶が欠落し始めたことに絶望し、記憶の断片を求めて彷徨っていた。
  motivation: 消えゆく恋人の記憶を完全に取り戻し、心の空白を埋めること。
  relationships:
  - name: 瑠璃
    relation: 亡き恋人。記憶の核となる存在
  - name: 司書
    relation: 地下図書館の案内人であり、運命を弄ぶ誘惑者
  arc: 愛への渇望から記憶を追い求めるが、次第に肉体と精神を結晶に浸食され、最後には自らが記憶の標本（結晶）となることで永遠の静寂に辿り着く。
- name: 瑠璃
  role: 鍵となる人物（記憶の中の存在）
  age: 22
  gender: 女性
  appearance: 瑠璃色の瞳と、透き通るような白い肌。風に揺れる薄いドレスを纏い、常にどこか遠くを見つめている。
  personality: 献身的で慈愛に満ちているが、どこか諦観したような悲しみを湛えている。
  speech_style: 囁くような、儚げで優しい口調。
  background: かつてこの村に迷い込み、地下図書館の秘密に触れて結晶化した。彼女の魂は砕かれ、数多くの「書物」として図書館に散らばっている。
  motivation: 怜に自分を思い出してほしいという願いと、同時に彼にはこの残酷な美しさに囚われてほしくないという矛盾した想い。
  relationships:
  - name: 浅倉 怜
    relation: かつての恋人。自分を追い求めてくれた唯一の人
  arc: 断片的な記憶として怜に接触し、彼を導くと同時に、彼が自分と同じ結晶の運命を辿ることを加速させてしまう。
- name: 司書
  role: 敵役/案内人
  age: 不詳（外見は30代後半）
  gender: 男性
  appearance: 隙のない黒い燕尾服を纏う。指先から手の甲にかけて、皮膚が硬いダイヤモンドのような結晶に置き換わっている。
  personality: 慇懃無礼で冷酷。美的な価値観を至上とし、生きた人間を「未完成の書物」として見ている。一人称は「私」。
  speech_style: 極めて丁寧な敬語を用いるが、言葉の端々に相手を蔑むような響きが含まれる。
  background: かつて村を救おうとした賢者だったが、禁忌の術により自身が図書館の管理者に変貌した。孤独の中で、図書館を彩る新たな「美」を収集し続けている。
  motivation: 完璧な美を持つ結晶のコレクションを増やすこと。特に、強い情念を持つ魂を結晶化させることに執着している。
  relationships:
  - name: 浅倉 怜
    relation: 最高の素材となる獲物
  - name: 瑠璃
    relation: 過去に収集した、最も美しいコレクションの一つ
  arc: 怜の絶望と愛着を巧みに利用して彼を精神的に追い詰め、最終的に彼を完璧な瑠璃色の結晶へと変貌させ、自らのコレクションに加える。
