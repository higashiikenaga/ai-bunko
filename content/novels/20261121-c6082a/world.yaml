title: 薄氷の記憶、瑠璃色の葬送
genre: ホラー
tone: 耽美で静謐な絶望
pov: 一人称
tense: 過去形
setting: 霧に包まれ、地図から抹消された「消えた村」と、その深淵に広がる結晶の「地下図書館」
premise: 私は、かつて愛した人の、名前すらも忘れてしまった記憶の断片を追い求めていた。辿り着いたのは、深い霧の帳に隠された、地図には存在しないはずの村。その地下には、人の魂が宝石のように結晶化した、美しくも残酷な「地下図書館」が広がっていた。書物を紐解くたび、私の身体は硝子へと変貌し、世界は美しき色彩を失っていく。
themes:
- 記憶の結晶化
- 自己の崩壊
- 美への殉教
rules:
- 地下図書館に並ぶ書物は、すべて人間の記憶が結晶化したものである
- 書物を読み解くという行為は、その記憶の持ち主の魂を摩滅させ、読者の身体を硝子化させる
- 司書は、美しい結晶を増やすために、生者を村へと誘い込む
plot_outline:
- '序盤: 亡き恋人の面影を追い、霧深い山奥で地図にない村を発見する。村の不自然な静寂に魅了され、地下へと続く階段を見つける。'
- '中盤: 地下図書館の、宝石のように煌めく書架に心を奪われる。一冊の結晶に触れた瞬間、恋人の最期の記憶が流れ込み、同時に自分の身体の一部が硝子のように透き通り、冷たく硬くなっていくことに気づく。'
- '終盤: 司書の正体が、かつて村を救おうとして結晶化した孤独な存在であることを知る。司書は、主人公に「永遠の美」として、自身の結晶になることを選ぶよう囁く。'
- '結末: 抵抗する術もなく、主人公は自らの命を砕き、一冊の美しい瑠璃色の結晶となる。村は再び霧の中に消え、図書館には新たな輝きが一つ増えるだけだった。'
style_notes: 硝子、宝石、花、月光、氷晶などの比喩を多用し、壊れやすく脆い美しさを強調する。一人称の語りは装飾的で詩的に、死や変容を、色彩豊かな耽美な言葉で描写する。
