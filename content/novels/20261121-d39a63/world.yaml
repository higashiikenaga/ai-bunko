title: 潮騒長屋と、古塔に眠る海神の唄
genre: 歴史・時代小説
tone: 人情味あふれる、賑やかで温かい江戸情緒
pov: 三人称
tense: 過去形
setting: 江戸時代中期、波打ち際に広がる賑やかな港町「浪待町（なみまち）」
premise: 潮風が香る浪待町の長屋で、万屋（よろずや）を営む威勢のいい若者・伝次郎は、嵐のあとに海岸へ流れ着いた奇妙な青い石を拾う。それは、古くから海の下に沈んでいると伝わる「海底の都」の破片だった。石が放つ不思議な光に導かれ、伝次郎は断崖に立つ古びた灯台――今は使われず、風化が進む「古塔」の秘密に辿り着く。海に眠る古の記憶と、長屋の住人たちの熱い絆が交差する物語。
themes:
- 失われたものへの郷愁
- 人と人の絆と再生
rules:
- 海底遺跡は、満潮時には決して見えない伝説の場所である
- 古塔の灯は、特定の天体配置の夜にのみ、海底の遺跡を照らし出す仕掛けになっている
plot_outline:
- '序盤: 浪待町の長屋の賑やかな日常。季節の味、春のサザエのつぼ煮。伝次郎が不思議な石を拾い、町の長老から「海底の都」の伝説を聞かされる。'
- '中盤: 石を狙う怪しげな浪人が現れる。伝次郎は、石が古塔の仕組みと関係していると気づき、断崖の灯台へと向かう。そこで、かつて海底に沈んだ文明が灯台と連動していたことを知る。'
- '終盤: 大嵐が町を襲い、灯台の機能が失われる。漁師たちが帰れない危機の中、伝次郎は石の力と古塔の仕掛けを使い、命がけで光を灯そうと奮闘する。'
- '結末: 無事に漁師たちが戻り、町には安堵の宴が広がる。海底の遺跡は再び静かに眠りにつくが、伝次郎の心には、町の人々と分かち合った温かな灯火が残る。'
style_notes: 江戸の市井の喧騒、べらんめえ口調の威勢のいい会話、季節の食べ物の描写を細かく入れること。三人称で、長屋の住人たちの顔ぶれが目に浮かぶように生き生きと描く。最後は、みんなで飯を食って笑い合うような、人情味あふれる温かい結末で締める。
