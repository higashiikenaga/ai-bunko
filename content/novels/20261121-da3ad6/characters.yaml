- name: エリアン・ソーン
  role: 主人公
  age: 20
  gender: 男性
  appearance: 少し癖のある茶髪に、地図製作者用の多機能ゴーグルを額に載せている。指先には常にインクの汚れがあり、革製の記録用鞄を愛用している。
  personality: 内向的だが知的好奇心が旺盛。静かな憧れを抱くロマンチスト。一人称は「僕」。
  speech_style: 丁寧で少し理屈っぽい。思索にふける際、独り言が増える傾向がある。
  background: 辺境の図書館街で育ち、失われた地図を完成させることを夢見ていた。記録することに執着している。
  motivation: 伝説の都市と「永遠の桜」をこの目で見、そのすべてを正確な航海日誌として書き留めること。
  relationships:
  - name: ケーレン
    relation: 幼馴染であり、飛行艇の相棒
  arc: 「記録するだけの傍観者」から、世界の記憶に直接触れ、自らも物語の一部となる「冒険者」へと成長する。
- name: ケーレン・ヴェイン
  role: 相棒
  age: 21
  gender: 女性
  appearance: 日焼けした肌に、油汚れのついた作業着。ショートカットの赤髪。腰には大型のスパナやエーテル工具を多数提げている。
  personality: 明るく快活で、非常に現実主義。トラブルに対しても動じない度胸がある。一人称は「あたし」。
  speech_style: はきはきとした口調。技術的な用語を混ぜつつ、エリアンの理屈っぽさを軽快に突っ込む。
  background: 廃棄船の修理工として育ち、独学でエーテル機関の知識を身につけた天才整備士。
  motivation: エリアンの夢を支え、自分たちの愛機である飛行艇を世界の果てまで安全に飛ばし続けること。
  relationships:
  - name: エリアン
    relation: 信頼し合うパートナー
  arc: 生存や効率だけを重視する生活から、目に見えない「美しさ」や「奇跡」を信じる心のゆとりを持つようになる。
- name: サイラス・スターリング
  role: 敵役
  age: 35
  gender: 男性
  appearance: 洗練された黒い軍服風の外套を纏い、鋭い眼光を持つ。高級なエーテル結晶で作られたステッキを携えている。
  personality: 冷徹で野心的。目的のためには手段を選ばない合理主義者。一人称は「私」。
  speech_style: 高圧的で優雅。相手を見下すような、計算高く落ち着いた話し方。
  background: 巨大な探査企業「スターリング・コンソーシアム」の代表。失われた技術の独占を目論んでいる。
  motivation: 「永遠の桜」が持つ無限のエーテルエネルギーを回収し、世界のエネルギー覇権を握ること。
  relationships:
  - name: エリアン
    relation: 目的を阻む邪魔な小童
  arc: 欲望のみを追求するが、桜の持つ圧倒的な「記憶」の重みに触れた際、一瞬の畏怖を感じる。
- name: ライラ
  role: 脇役
  age: 不明（外見は20代後半）
  gender: 女性
  appearance: 透き通るような白い肌と、雲海のような淡い青色のドレス。瞳はエーテル結晶のように不思議な光を放つ。
  personality: 穏やかで神秘的。どこか浮世離れした、慈愛に満ちた雰囲気を持つ。一人称は「私」。
  speech_style: 詩的で、問いかけるような静かな話し方。比喩表現を多用する。
  background: 雲海の下、水球に守られた都市の守護者、あるいはその都市の記憶そのものの化身。
  motivation: 桜の記憶が正しく「記録」され、次の時代へと語り継がれるよう、エリアンを導くこと。
  relationships:
  - name: エリアン
    relation: 運命の導き手
  arc: エリアンが真実を目撃したことで、自らの役割を終え、歴史の断片として日記の中に溶け込んでいく。
