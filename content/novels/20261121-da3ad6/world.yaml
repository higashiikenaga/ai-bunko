title: 碧風の航海日誌と、雲下に眠る花びら
genre: スチームパンク冒険
tone: 穏やかでノスタルジックな旅情
pov: 一人称（僕）
tense: 過去形
setting: 浮遊島が点在し、地上は深い雲海に覆われた世界。蒸気機関とエーテル結晶が文明を支えている。
premise: 地図製作者の「僕」は、小さな蒸気飛行艇で世界を巡り、忘れ去られた土地の記録を綴っている。ある日、雲海の下に沈んだとされる伝説の都市と、そこに咲くという「永遠の桜」の断片的な情報を手に入れる。好奇心と静かな憧れに突き動かされ、僕は未知なる深海へと向かう旅に出る。
themes:
- 出会いと別れ
- 失われた記憶の継承
rules:
- 雲海の下は高圧で酸素が薄いため、専用の潜航機能を持つ蒸気艇でなければ進入できない
- エーテル結晶の純度によって蒸気機関の出力と飛行高度が決まる
- 各浮遊島は独自の文化と気候を持ち、島の間を移動するには複雑な気流読みが必要
plot_outline:
- '序盤: 辺境の港町で古びた航海図を入手した僕が、相棒の整備士と共に雲海への潜航準備を整え、旅立つ。'
- '中盤: 様々な浮遊島を訪れ、その土地特有の料理や風習を日記に記しながら、海底遺跡へ至る鍵となる「共鳴石」を集める。'
- '終盤: 激しい嵐を乗り越え、ついに雲海の底にある海底遺跡に到達。そこには水球に守られた静謐な空間と、時を止めた桜の巨木が眠っていた。'
- '結末: 桜が一度だけ花開く瞬間を目撃し、世界がかつて一つだった記憶に触れる。僕はその光景を日記に書き留め、また新しい地を目指して空へ舞い上がる。'
style_notes: 旅日記のような独白形式。蒸気の白さ、真鍮の光沢、風の匂いなど、五感に訴える豊かな風景描写を重視する。各話の導入または結びで、訪れた土地の珍しい食事や、不思議な伝統行事についての記述を必ず挿入すること。
