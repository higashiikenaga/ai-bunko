- name: ' Sumeragi Kaito (皇 凱斗)'
  role: 主人公
  age: 34
  gender: 男性
  appearance: 痩身で青白い顔。度の強い眼鏡をかけ、常に疲弊した表情をしている。服装は実用的なフィールドジャケットだが、常に古書やメモ帳を携帯している。
  personality: 強迫的なまでの探究心を持つ理論派。一人称は「私」。論理的に説明できない事象への恐怖を、解析という手段で塗り潰そうとする傾向がある。
  speech_style: 丁寧だが、専門用語を多用し、早口で畳みかける傾向がある。
  background: 海洋地質学と位相幾何学を専攻した研究員。過去に海域調査で同僚を失ったトラウマがあり、その真相を突き止めるために「沈降村落」の調査に執着している。
  motivation: 失踪した同僚の行方を確認し、この世の境界における位相異常を数学的に証明すること。
  relationships:
  - name: Saejima Mio
    relation: 共同調査員であり、唯一の信頼を置く技術的パートナー
  - name: Arthur Thorne
    relation: 航海日誌を通じて対話する、時代を超えた精神的導き手にして警告者
  arc: 客観的な観測者として振る舞っていたが、徐々に村の構造に精神を侵食され、最終的に観測対象そのもの（住民）へと同化していく。
- name: Saejima Mio (冴島 澪)
  role: 相棒
  age: 28
  gender: 女性
  appearance: ショートカットで快活な印象。深海探査機のオペレーションウェアを着用し、首元に常に防水の通信機を下げている。
  personality: 現実主義的で直感的。一人称は「私」。空想に走りがちな皇を地に足のついた視点からサポートするが、好奇心は彼に劣らない。
  speech_style: 簡潔で口語的。時折、皮肉めいた冗談を混ぜる。
  background: 深海探査機の操縦に特化したエンジニア。企業の派遣として皇のチームに加入したが、次第に調査の異常性に気づき、恐怖を抱き始める。
  motivation: 任務を完遂し、安全に帰還すること。同時に、皇が精神的に崩壊していくのを食い止めること。
  relationships:
  - name: Sumeragi Kaito
    relation: 危うい精神性を持つ彼を危惧しつつも、その知性に敬意を抱いている
  arc: 合理的思考で逃げ切ろうとするが、物理的に不可能な映像や音声を突きつけられ、世界の不確かさを認めることになる。
- name: Arthur Thorne (アーサー・ソーン)
  role: 狂言回し/過去の犠牲者
  age: 45
  gender: 男性
  appearance: 19世紀末の英国海軍士官の服装。日誌内のスケッチでは、次第に瞳孔が消失し、皮膚に鱗のような紋様が描かれている。
  personality: 理知的で冒険心に溢れていたが、村の真実に触れて絶望に染まっている。一人称は「私（I）」。
  speech_style: 格調高く、古風な文体。日誌の後半になるにつれ、文法が崩壊し、意味不明な反復表現が増えていく。
  background: 1890年代に未確認海域を調査していた英国の航海士。浮上した村落に足を踏み入れ、そのまま消息を絶った。
  motivation: 後世にこの場所の危険性を伝え、誰もここへ来てはならないと警告すること。
  relationships:
  - name: Sumeragi Kaito
    relation: 日誌を通じて、現代の調査者に自身の辿った破滅への道をなぞらせる
  arc: 人間としての理性を喪失し、深海生命体の感覚器の一部として機能する「住民」へと変質した記録が綴られている。
