- name: 秋月 奏太 (あきづき そうた)
  role: 主人公
  age: 21
  gender: 男性
  appearance: 知的でどこか儚げな雰囲気を持つ青年。大正時代の学生服を纏い、眼鏡の奥に思索的な瞳を持つ。
  personality: 真面目で探究心が強く、やや内向的。一人称は「僕」。
  speech_style: 丁寧で理性的だが、感情が高ぶると言葉が熱を帯びる。
  background: 東北の旧家に生まれた大学生。祖父が遺した古い家系図と不可解な星図をきっかけに、失われた村へと迷い込む。
  motivation: 星図の謎を解き明かし、里に囚われた魂たちの救済方法を見出すこと。
  relationships:
  - name: 白銀 (しろがね)
    relation: 里の守護者であり、心を通わせる異形
  - name: 秋月 宗次郎
    relation: 星図を遺した祖父
  arc: 知識欲に基づいた探究者から、他者の悲しみを受け入れ、自らの手で決断を下す「導き手」へと成長する。
- name: 白銀 (しろがね)
  role: 相棒 / ヒロイン的役割
  age: 外見は10代後半（実年齢は不明）
  gender: 女性
  appearance: 透き通るような白い肌と、白銀の髪を持つ美しい女性。耳や尾に狐の面影を残す。
  personality: 慈愛に満ちているが、百年の孤独ゆえにどこか浮世離れしている。一人称は「私」。
  speech_style: 古風で静かな物言い。相手を包み込むような穏やかな口調。
  background: かつて村を守るために禁忌の契約を結び、人としての命を捨てて白狐の妖怪となった村の守護者。
  motivation: 里の者たちが永遠にこの静止した時間の中で安らぎ続けること。あるいは、いつか訪れる解放。
  relationships:
  - name: 秋月 奏太
    relation: 境界を越えてやってきた、運命を運ぶ者
  arc: 永遠の停滞を受け入れていた心が、奏太との出会いによって、再び「終わり（死と解放）」を望むようになる。
- name: 葛城 慎之助 (かつらぎ しんのすけ)
  role: 敵役 / 障壁
  age: 45
  gender: 男性
  appearance: 厳格な風貌の村長。かつての村の有力者。影が濃く、人間離れした威圧感を放つ。
  personality: 執念深く、生存本能が極めて強い。里の存続を第一とし、変化を拒む。一人称は「私（わたくし）」。
  speech_style: 威圧的で、命令を下すような重々しい話し方。
  background: 百年前の災厄の際、村を滅亡から救うために「時の停止」を主導した者。妖怪化した住民たちを支配している。
  motivation: 里の存在を隠し通し、現世の理から逃れ続けて、村の形態を永遠に維持すること。
  relationships:
  - name: 白銀
    relation: 管理対象の守護者
  - name: 秋月 奏太
    relation: 秩序を乱す侵入者
  arc: 里の存続を信じて疑わなかったが、奏太の儀式によって里が消滅することへの恐怖と、それが真の救済であるという残酷な真実に直面する。
- name: ハナ
  role: 脇役 / 導き手
  age: 外見は7歳前後
  gender: 女性
  appearance: 着物に袴姿の少女。瞳が星のように輝いているが、足跡が地面についていない。
  personality: 無邪気で天真爛漫。しかし時折、すべてを見通しているような大人びた表情を見せる。一人称は「ハナ」。
  speech_style: 幼い子供のような、屈託のない話し方。
  background: 村の子供たちの魂が形を成した存在。里の境界が揺らいでいることを察知している。
  motivation: 奏太に星図の真の意味を気づかせ、里の者たちが「星」へ帰る手助けをすること。
  relationships:
  - name: 秋月 奏太
    relation: 不思議な案内人
  - name: 白銀
    relation: 憧れの対象であり、守るべき存在
  arc: 物語の狂言回しとして、奏太が真実に辿り着くためのヒントを散りばめ、儀式の成立を促す。
