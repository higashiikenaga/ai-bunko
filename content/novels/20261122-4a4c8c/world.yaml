title: 霜夜の星巡り：忘却の里の挽歌
genre: 伝奇
tone: 幽玄にして寂寥感のある、美しくも切ない雰囲気
pov: 三人称
tense: 過去形
setting: 大正時代初期、東北の深い山間部
premise: 古びた家系図と共に遺されていたのは、天ではなく地上の地形を記した不可解な『星図』であった。冬至の夜、その図が指し示す空白の地に足を踏み入れた青年は、百年前にある日忽然と消え去ったはずの村に迷い込む。そこで彼は、人への思慕ゆえに妖怪となり、時の止まった村を守り続ける悲しき異形たちと出会う。
themes:
- 記憶と忘却
- 種を超えた情愛
rules:
- 消えた村は『隠り世』に属しており、冬至の夜にのみ現世との境界が薄くなる
- 星図は観測者の心の欠落に呼応して、隠れた道筋を浮かび上がらせる
- 村に長く留まった人間は、徐々に記憶を失い、里の風景の一部（妖怪）へと同化していく
plot_outline:
- '序盤: 青年・秋月が蔵から奇妙な星図を発見し、地元の伝承にある『一夜にして消えた村』の存在に気づく。冬至の夜、星図の導きにより、雪深い山中で境界を越え、失われたはずの村へと辿り着く。'
- '中盤: 村の住民たちが、かつての姿を留めつつも人間ではない異形（妖怪）に変貌していることを知る。彼らは村を襲った災厄から人々を守るため、ある禁忌の契約を結び、自ら時間を止めた隠れ里となった過去を明かす。'
- '終盤: 村の守護者である白狐の妖怪と心を通わせる秋月だったが、村に留まり続けることで次第に現世の記憶を失い始める。彼は星図の真の目的が、里の魂たちを星へと還し、永い眠りにつかせるための導標であることに気づく。'
- '結末: 冬至の終わりの刻限、秋月は星図を用いて里の魂たちに道を示し、彼らを天へと還す儀式を完遂させる。村は再び消え、秋月は一人雪原に降り立つが、その胸には消えない哀しみと、美しき記憶が刻まれていた。'
style_notes: 和の情緒を重んじ、『泡沫』『幽玄』『寂寥』などの語彙を多用する。妖怪の造形は恐ろしさよりも、どこか儚く、気品ある描写に徹する。冬の冷徹な空気感と、それに対比させる灯火の温かさを対比的に描き、静謐な文体を維持すること。
