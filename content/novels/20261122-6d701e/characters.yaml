- name: カイ・エルムウッド
  role: 主人公
  age: 27
  gender: 男性
  appearance: 常に眠たげな目の青年。インク汚れのついた白いシャツに、使い古された茶色のコートを羽織っている。指先が常にわずかに震えている。
  personality: 冷笑的で個人主義を装っているが、本質的に情に厚い。一人称は「私」。
  speech_style: 丁寧だが、どこか突き放したような淡々とした口調。
  background: 元は記録局の若き研究員だったが、ある禁忌に触れたことで追放され、現在は街の辺境で「忘れられた記憶」を買い取る古本屋を営んでいる。
  motivation: 当初は平穏な生活の維持。後に、ルナリスという少女の存在理由を突き止め、彼女に居場所を与えること。
  relationships:
  - name: ルナリス
    relation: 保護対象であり、唯一の理解者
  - name: オーガスティン・ヴォルフ
    relation: かつての師であり、憎悪の対象
  arc: 記憶を買い取るだけの傍観者から、自らのアイデンティティを代償にして世界を書き換える当事者へと変化する。
- name: ルナリス
  role: 相棒/鍵となる人物
  age: 16
  gender: 女性
  appearance: 透き通るような白い肌と、光を吸い込むような深い銀色の髪。感情が乏しいが、瞳だけは強い好奇心を宿している。
  personality: 純粋無垢で、常識に疎い。しかし時折、残酷なまでに本質を突く発言をする。一人称は「私」。
  speech_style: 抑揚が少なく、幼い子供のような素朴な話し方。
  background: 記録局によって存在ごと完全に消去されたはずの少女。ある日、空白の禁書と共にカイの店に現れた。
  motivation: 自分が誰であったのか、なぜ消されたのかという「名付け」を求めること。
  relationships:
  - name: カイ・エルムウッド
    relation: 世界で唯一自分を認識し、居場所をくれた恩人
  arc: 空っぽの器だった状態から、カイから受け取った記憶と経験を通じて「人間」としての心を取り戻し、最後には彼を記録する者となる。
- name: オーガスティン・ヴォルフ
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のない軍服に身を包み、片目に精緻な機械仕掛けのモノクルを装着している。冷徹な氷のような青い瞳が特徴。
  personality: 極端な功利主義者。個人の記憶よりも、種としての調和と効率を優先する。一人称は「私」。
  speech_style: 威圧的で論理的。相手を突き放すような高圧的な物言い。
  background: 記録局の最高責任者。巨大蒸気機関の運用責任者であり、市民の絶望を燃料に「苦痛のないユートピア」を作ろうとしている。
  motivation: 全市民の記憶を統合・管理し、争いも悲しみもない完璧な管理社会を構築すること。
  relationships:
  - name: カイ・エルムウッド
    relation: かつての弟子であり、自分の思想に反旗を翻した裏切り者
  arc: 完璧な秩序こそが正義だと信じて疑わないが、禁書による「不完全な記憶」の奔流に直面し、人間性の本質を突きつけられて崩壊する。
- name: シオン
  role: 脇役/ライバル
  age: 23
  gender: 女性
  appearance: 黒い革製の戦闘装束を纏い、巨大な機械式大鎌（記憶を切り裂く装置）を携えている。鋭い三白眼の美女。
  personality: 好戦的で直情的。しかし、内心では喪失感に苛まれている。一人称は「あたし」。
  speech_style: ぶっきらぼうで粗野な口調。語尾に強い強調を置く。
  background: 記録局の執行官。強力な異能を得る代償として、家族や恋人などの「大切な記憶」をすべて局に差し出した。
  motivation: 任務を完璧に遂行することで、局から失った記憶を買い戻すこと。
  relationships:
  - name: カイ・エルムウッド
    relation: 追跡対象であり、記憶の価値を説く彼に次第に惹かれる
  - name: オーガスティン・ヴォルフ
    relation: 絶対的な忠誠を誓っていた主君
  arc: 記憶を捨てて強くなった自分への空虚感に気づき、最終的には記憶を取り戻すために記録局を裏切る。
