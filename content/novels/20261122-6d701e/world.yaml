title: 蝕刻の蒸気書庫
genre: 伝奇
tone: 重厚かつ冷徹。古風な呪術的表現と機械的な硬質さが同居する雰囲気
pov: 三人称
tense: 過去形
setting: 蒸気機関が極限まで発達し、精神エネルギーを燃料とする閉鎖都市「灰殻市」。街の地下には、都市の不都合な記憶を「本」として封印する巨大な書庫が広がっている。
premise: 記憶を代償に異能を振るう術師たちが跋扈する街で、主人公は「忘れられた記憶」を買い取る古本屋を営んでいた。ある日、彼は自身の存在ごと消去されたはずの少女と、何も書き込まれていない「空白の禁書」に出会う。都市を維持する巨大蒸気機関の正体が、市民の絶望を燃料とする記憶抹消装置であると知った彼は、禁書の頁を埋めるための残酷な戦いに身を投じる。
themes:
- 忘却と救済
- 記憶の等価交換
rules:
- 術の発動には、術者の記憶の一部を永久に消去するという『代償』が必要である。
- 術の規模が大きいほど、家族の顔や自身の名前など、根源的な記憶を失う。
- 蒸気機関から排出される『霊気蒸気』がなければ、術式の回路を構成できず発動不能となる。
plot_outline:
- '序盤: 記憶の古本屋を営む主人公が、記憶を完全に失った少女と、あらゆる記憶を上書きできる『空白の禁書』を拾い、街の権力層である『記録局』に追われる。'
- '中盤: 記録局の真の目的が、巨大蒸気機関を用いて都市全体の記憶を一度に書き換え、完璧なユートピアを構築することだと判明。主人公は禁書に記された古の術式を再現し、対抗手段を模索する。'
- '終盤: 記憶の代償を支払い続けた主人公が、自身のアイデンティティを喪失しつつも、少女の記憶を復元するために記録局の心臓部である『大蒸気書庫』へ乗り込む。'
- '結末: 巨大機関を破壊し、封印されていた街の全記憶を解放する。代償として主人公は世界から忘れられるが、記憶を取り戻した少女だけが彼を新しい物語として記録し直す。'
style_notes: 緊迫した戦闘シーンでは「撃ち抜く」「砕く」など短文を重ねて速度感を出す。術式発動時は「汝、此の記憶を贄とし、業火を喚べ」のように古語や命令形を交えた荘厳な記述を用いる。蒸気の排気音と古書の紙の擦れる音を対比させて描写する。
