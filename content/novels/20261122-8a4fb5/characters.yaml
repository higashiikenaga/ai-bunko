- name: ルル
  role: 主人公
  age: 12
  gender: 女性
  appearance: 小さな茶色のリス。白いレースのついたエプロンを着用し、鼻先に小さな丸眼鏡をかけている。
  personality: 真面目で心優しい。好奇心旺盛だが少し臆病なところがある。一人称は「わたし」。
  speech_style: 丁寧で控えめな口調。「～です」「～ます」ときちんと話す。
  background: 宇宙の片隅にある「星屑の古本屋」の店主。迷子になった思い出の本を管理し、持ち主に届ける仕事をしている。
  motivation: 光を失った真っ白な本を本来の持ち主に返し、本に再び光を取り戻させたい。
  relationships:
  - name: ゼフィ
    relation: 旅の途中で出会った親友
  - name: フクロウ先生
    relation: 導き手であり尊敬する賢者
  arc: 店の中での静かな生活から、未知の世界へ飛び出す勇気を得て、精神的に大きく成長する。
- name: ゼフィ
  role: 相棒
  age: 300
  gender: 無性別
  appearance: 真鍮製の古い小型ロボット。片方のアンテナが曲がっており、胸に小さな音楽ボックスが内蔵されている。
  personality: 穏やかで献身的。言葉を忘れてしまったため、身振り手振りと電子音で感情を表現する。一人称は「ボク」。
  speech_style: 「ピッ」「ポポッ」という電子音と、たまに漏れる断片的な単語のみ。
  background: かつて銀河の案内人をしていたが、長い年月を経て記憶回路が破損し、言葉を話せなくなった。
  motivation: ルルの純粋な心に惹かれ、彼女が目的を達成できるよう全力でサポートすること。
  relationships:
  - name: ルル
    relation: 自分に目的を与えてくれた大切な友人
  arc: ルルと共に旅をすることで、失っていた「誰かを想う心」を取り戻し、再び自分の声を求めるようになる。
- name: フクロウ先生
  role: 脇役（導き手）
  age: 1000
  gender: 男性
  appearance: 銀河の星々が刺繍された深い紺色のローブを纏った、大きな白いフクロウ。金色の片眼鏡をかけている。
  personality: 博識で厳格に見えるが、根は非常に情に厚い。一人称は「私」。
  speech_style: 古風で威厳のある話し方。「～じゃ」「～なのう」など、老人のような口調。
  background: 宇宙の果てにある「古い灯台」の守り人。あらゆる思い出の行き先を知る記憶の番人。
  motivation: 灯台の光を絶やさず、迷える魂や思い出を正しい場所へ導き続けること。
  relationships:
  - name: ルル
    relation: 勇気を持って旅をした小さな訪問者
  arc: ルルのひたむきな姿を見て、忘れかけていた「好奇心」という感情を思い出し、心を解きほぐしていく。
