title: 星屑の古本屋と、銀河の灯台さん
genre: SF
tone: 優しく、温かい、絵本のような雰囲気
pov: 三人称
tense: 過去形
setting: 星の砂がふわふわと舞う宇宙の片隅。空中に浮かぶ不思議な本屋と、遠くに見える古い灯台。
premise: 星の砂が舞う宇宙の片隅に、「星屑の古本屋」という不思議な場所があります。そこには、誰かの大切な思い出が、一冊の本になって眠っているのです。店主の小さなリス、ルルは、迷子になった思い出を届ける大切なお仕事をしています。ある日、光を失ってしまった真っ白な本が届き、ルルはそれを持ち主に返すため、宇宙の果てにある「古い灯台」を目指して旅に出ることにしました。
themes:
- 思い出の価値
- 未知の世界へ踏み出す勇気
rules:
- 思い出の本は、持ち主の心の温かさでページが綴られる
- 宇宙を旅するには、星の砂を燃料にする必要がある
- 古い灯台の光は、迷える心を見守る道しるべとなる
plot_outline:
- '序盤: リスのルルが古本屋で穏やかに暮らす日常。光を失った真っ白な本を受け取り、それを届けるために、宇宙の果てにある古い灯台へ向かう決意をします。'
- '中盤: お星さまのバスに乗って旅をするルル。途中で出会う、言葉を忘れてしまったロボットや、歌を歌う星のクジラたち。みんなと助け合いながら、少しずつ灯台へと近づいていきます。'
- '終盤: ついに古い灯台に到着し、守り人のフクロウ先生と出会います。真っ白な本の正体が「誰かが忘れてしまった、はじめての勇気」であることを知り、ルルは灯台の光を使って思い出を呼び覚まします。'
- '結末: 本はまばゆい光を放ち、持ち主の元へ帰っていきました。ルルはまた、新しい思い出が届くのを静かに待ちながら、古本屋の窓をきれいに拭くのでした。'
style_notes: 難しい言葉は使わず、お子様に読み聞かせをするような、優しく「です・ます」調の文体で書きます。擬人化された動物たちが主役となり、物語の最後には、心がぽかぽかするような小さな教訓をそっと添えるようにします。
