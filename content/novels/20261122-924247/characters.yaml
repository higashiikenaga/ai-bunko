- name: レオ・ヴァルト
  role: 主人公
  age: 15
  gender: 男性
  appearance: 動きやすさを重視した煤けた革の作業着。好奇心に満ちた大きな瞳と、少し跳ねた茶髪が特徴。常に腰に工具袋を下げている。
  personality: 直感的で前向き、やや無鉄砲な性格。困っている人を見捨てられないお人好し。一人称は「僕」。
  speech_style: 明るく元気で、感情が言葉に乗りやすい。少しぶっきらぼうな少年らしい口調。
  background: 浮遊島の下層部で、日々廃材を拾って暮らす回収屋の少年。特別な教育は受けていないが、機械の構造を理解する天才的なセンスを持つ。
  motivation: 空から降ってきた剣の謎を解き明かし、いつか見た「伝説の桜の雲海」を自分の目で確かめること。
  relationships:
  - name: ミーナ・シルフィード
    relation: 運命を共にする相棒
  - name: ガストン
    relation: 師匠のような存在
  arc: ただの廃材回収屋から、仲間を守り、世界の運命を舵取りする真の「船長」へと成長する。
- name: ミーナ・シルフィード
  role: 相棒
  age: 14
  gender: 女性
  appearance: 風に溶け込むような淡い水色の長い髪。風読みの儀式用具である銀の杖を携え、軽やかな旅装に身を包んでいる。
  personality: 冷静沈着で思慮深いが、内面には強い情熱を秘めている。神秘的な雰囲気を持つ。一人称は「私」。
  speech_style: 丁寧で落ち着いた話し方。風の動きを感じ取る際、時折詩的な表現を用いる。
  background: 風の流れを読み、天候を予測する「風読み」の家系に生まれた少女。世界の風が滞り始めていることをいち早く察知していた。
  motivation: 止まりかけた世界の風を再び循環させ、空の生態系を再生させること。
  relationships:
  - name: レオ・ヴァルト
    relation: 信頼するパートナー
  arc: 運命に導かれるだけの存在から、自らの意志で風の行方を選択する強さを獲得する。
- name: ガストン・アイアンサイド
  role: 脇役
  age: 52
  gender: 男性
  appearance: 大柄でがっしりとした体格。油汚れのついたエプロンとモノクル（片眼鏡）がトレードマーク。常に工具を手にしている。
  personality: 頑固で職人気質。機械を単なる道具ではなく「命ある相棒」として扱う。一人称は「俺」。
  speech_style: 低く響く、威厳のある口調。機械の不調に対しては厳しく、手入れの際には愛を込めて語りかける。
  background: かつて伝説の飛空艇に関わっていたとされる、引退した熟練の魔導機工士。レオの才能を見抜き、彼を導く。
  motivation: 愛機（飛空艇）を最高の状態で桜の雲海へと送り出し、かつての夢を完遂すること。
  relationships:
  - name: レオ・ヴァルト
    relation: 弟子であり、次世代の希望
  arc: 過去の失敗に対する後悔を乗り越え、新しい世代に技術と夢を託す喜びを知る。
- name: ヴァイン・スカイウォーカー
  role: 敵役
  age: 27
  gender: 男性
  appearance: 漆黒の外套を羽織った、鋭い眼光を持つ美男子。洗練されたデザインの大型空賊船を操る。
  personality: 野心的で冷酷。力こそが秩序だと信じているが、武人としての美学も持ち合わせている。一人称は「俺」。
  speech_style: 余裕を感じさせる、皮肉めいた話し方。相手を挑発するような高圧的な態度をとる。
  background: 空の潮流を支配し、富と権力を手に入れることを目的とする空賊団の首領。伝説の剣の力を利用しようと目論む。
  motivation: 伝説の飛空艇と剣を手に入れ、世界の風を独占して新たな秩序を作ること。
  relationships:
  - name: レオ・ヴァルト
    relation: 超えるべき壁であり、宿敵
  arc: 力による支配の限界を知り、嵐の中でレオたちの純粋な意志に触れることで、己の進むべき道を再考する。
