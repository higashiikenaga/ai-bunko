title: 蒼穹の翼と、桜舞う風の航路
genre: 異世界ファンタジー
tone: 爽快感あふれる、躍動的な冒険活劇
pov: 三人称
tense: 過去形
setting: 浮遊島々が空に漂う群島世界「エテリオ」。巨大な風の潮流が文明の動脈となり、人々は風を操る魔導機工を用いた飛空艇で島々を渡り歩いている時代。
premise: 廃材回収屋の少年レオは、空から降ってきた不思議な「折れた剣」を拾い、それが伝説の飛空艇を起動させる鍵であることを知る。未知なる風に導かれ、レオは仲間と共に、世界を再生させるという伝説の「桜の雲海」を目指して雲の海へと飛び出す。機械の鼓動と風の歌が、彼らを輝かしい冒険へと駆り立てる。
themes:
- 空への憧憬
- 仲間との絆
- 失われた技術の継承
rules:
- 全ての移動は、高度によって異なる性質を持つ『風の潮流（ストリーム）』に依存する
- 魔法エネルギーと機械機構を融合させた『魔導機工』が技術の根幹である
- 伝説の飛空艇を操るには、特定の意匠を持つ『鍵』が必要となる
plot_outline:
- '序盤: 廃材回収中のレオが、空から落ちてきた折れた剣を拾う。その剣を機体の心臓部に差し込んだ瞬間、眠っていた小型飛空艇が目覚め、彼は空へと舞い上がる。そこで一人の風読みの少女と出会い、一行の旅が始まる。'
- '中盤: 伝説の桜が舞う場所を目指す一行は、空賊の襲撃や、風が止まった「静寂の領域」といった困難に直面する。仲間と共に飛空艇の整備に明け暮れ、機械の軋みと風の抵抗を乗り越えながら、絆を深めていく。'
- '終盤: ついに辿り着いた天空の聖域。そこには世界中の風を司る巨大な桜の樹があったが、未知の嵐によって崩壊の危機に瀕していた。レオたちは折れた剣の真の力を解放し、飛空艇を限界まで加速させる。'
- '結末: 激しい風と桜の花びらの中、レオたちの勇気が世界に新たな風を呼び戻す。空一面に舞い散る桜の景色を背に、飛空艇はさらなる未知の空へと、力強く進み続ける。'
style_notes: 風を切る音、エンジンの力強い唸り、金属が噛み合う感触を、まるで目の前で起きているかのように躍動感たっぷりに描写すること。三人称ながら、キャラクターの熱い感情が風に乗って伝わってくるような、明るく勢いのある文体を維持する。
