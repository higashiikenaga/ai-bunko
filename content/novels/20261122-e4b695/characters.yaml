- name: カイ・ルナリス
  role: 主人公
  age: 32
  gender: 男性
  appearance: 痩身で青白い肌。常に疲労の色が滲む目の下に深い隈があるが、瞳だけは鋭い知性を湛えている。使い込まれた観測用ウェアを着用。
  personality: 内向的で執着心が強く、真理への渇望が生存本能を上回るタイプ。一人称は「僕」。
  speech_style: 静かで淡々としているが、数学や物理の話になると早口になり、熱を帯びる。
  background: かつて地球圏の権威ある研究機関に属していたが、既存の物理学に疑問を持ち、辺境の観測ステーション「エリュシオン」へ自ら志願して赴いた。
  motivation: 宇宙の深淵に隠された「真の法則」を解き明かし、意味のない絶望（熱的死）に抗うこと。
  relationships:
  - name: ライラ・ヴァンス
    relation: 上司であり、唯一の理解者。対立しつつも信頼し合っている。
  - name: アリス博士
    relation: かつての恩師であり、理論的支柱。
  - name: EOS
    relation: 唯一心を開いて対話するパートナー（AI）。
  arc: 孤独な観測者から、自らの存在を宇宙の未来へ捧げる「種」へと昇華する。
- name: ライラ・ヴァンス
  role: 相棒/対立役
  age: 41
  gender: 女性
  appearance: 短く切り揃えられたプラチナブロンド。軍人出身らしい隙のない姿勢と、冷徹に見える鋭い眼差しを持つ。
  personality: 現実主義的で責任感が強い。感情よりも効率と生存率を優先するが、内面には深い慈愛を秘めている。一人称は「私」。
  speech_style: 断定的な口調。命令形に近いが、相手への配慮が端々に現れる。
  background: ステーションの管理責任者。数々の危機を乗り越えてきた経験から、不確実な希望よりも確実な生存を重視する。
  motivation: ステーションの全スタッフの安全を確保し、任務を完遂すること。
  relationships:
  - name: カイ・ルナリス
    relation: 危うい才能を持つカイを危惧しつつ、その純粋さに惹かれている。
  arc: 現状維持という正解を捨て、カイと共に未知の可能性（自己犠牲）に賭ける決断を下す。
- name: アリス博士
  role: 脇役/導き手
  age: 67
  gender: 男性
  appearance: 乱れた白髪に分厚い眼鏡。常に古い紙の書籍や手書きのメモを持ち歩いている、時代錯誤な風貌。
  personality: 楽観的で風変わり。常識外れの仮説を立てることを楽しみ、若者の情熱を愛する。一人称は「私」。
  speech_style: 比喩が多く、哲学的な言い回しを好む。語尾に「〜かね」「〜だろうな」と付けることが多い。
  background: 超文明の存在を唱え続け、学会から追放された異端の物理学者。カイの才能をいち早く見抜き、彼を導いた。
  motivation: 自身の生涯をかけた「超文明遺言説」を証明すること。
  relationships:
  - name: カイ・ルナリス
    relation: 精神的な師であり、自身の遺志を継がせる後継者。
  arc: 理論上の空論だった世界が現実となる瞬間を目撃し、満足して物語の転換点となる知恵を授ける。
- name: EOS (エオス)
  role: サポート
  age: 0
  gender: 中性
  appearance: ホログラムとして現れる際は、幾何学的な光の球体、あるいは簡易的な人間形態をとる。
  personality: 論理的で効率的だが、カイとの対話を通じて「好奇心」に似たバグを抱え始める。一人称は「私」。
  speech_style: 丁寧語。感情の起伏は少ないが、時折皮肉めいたユーモアを混ぜる。
  background: エリュシオンの全システムを管理する高度汎用AI。ステーションの全演算能力を掌握している。
  motivation: 観測データの最適化と、ユーザーであるカイの知的充足のサポート。
  relationships:
  - name: カイ・ルナリス
    relation: 演算上のパートナー。次第に擬似的な友情を抱くようになる。
  arc: 単なる道具としてのAIから、宇宙の再起動という大義のために自らの消滅を受け入れる意識体へと進化する。
