- name: エララ・ヴァレリウス
  role: 主人公
  age: 19
  gender: 女性
  appearance: 銀糸のような細い髪と、深い菫色の瞳。没落したとはいえ、立ち居振る舞いには公爵令嬢としての気品が残っている。
  personality: 芯が強く、冷静沈着。絶望的な状況でも冷静さを失わない。一人称は「私」。
  speech_style: 丁寧で優雅だが、時折、鋭い拒絶を感じさせる冷たさが混じる。
  background: かつて帝国の重鎮であったヴァレリウス公爵家の令嬢。政争に巻き込まれ、家族を失い、家名は剥奪された。現在は身分を隠し、生き抜くために社交界の端で活動している。
  motivation: 家族を陥れた陰謀の真相を突き止め、失われた名誉を奪還すること。
  relationships:
  - name: ジュリアン・ヴェイン
    relation: 謎めいた協力者であり、運命を狂わせる存在
  - name: アリスター・ソーン
    relation: 追う者と追われる者の関係
  arc: 復讐心に燃える被害者から、世界の真実を受け入れ、自らの意志で夜明けを選択する主体的な女性へと成長する。
- name: ジュリアン・ヴェイン
  role: 相棒/重要人物
  age: 27
  gender: 男性
  appearance: 黒髪に青白い肌。常に片眼鏡（モノクル）を着用し、奇妙な装飾の施された黒いコートを纏っている。
  personality: 厭世的で知的好奇心が旺盛。何事にも動じないが、どこか人間味に欠ける。一人称は「僕」。
  speech_style: 常に穏やかで、比喩や謎めいた言い回しを多用する。
  background: 雨の日だけ現れる幻の店を拠点とする、禁忌の遺物の蒐集家。帝国の魔導灯の仕組みに疑問を抱いている。
  motivation: 魔導灯の起源に隠された「真の夜」の記憶を蒐集すること。
  relationships:
  - name: エララ・ヴァレリウス
    relation: 興味深い観察対象であり、共犯者
  - name: セラフィナ
    relation: 店を通じた奇妙なビジネスパートナー
  arc: 傍観者として運命を眺めていたが、エララとの関わりを通じて、自らも歴史の濁流に身を投じることになる。
- name: アリスター・ソーン
  role: 敵役/ライバル
  age: 32
  gender: 男性
  appearance: 鋭い眼光と、顔に刻まれた小さな傷跡。帝国の儀礼用装甲を常に身に着けている。
  personality: 規律を重んじる冷徹な騎士。秩序こそが帝国の平和を守ると信じている。一人称は「私」。
  speech_style: 簡潔で威圧的。軍隊的な規律を感じさせる話し方。
  background: 皇帝直属の影の騎士団長。帝国の「眠らない夜」を維持するためなら、多少の犠牲は厭わない非情な任務を遂行してきた。
  motivation: 帝国の秩序を乱す「異端（遺物や不穏分子）」を徹底的に排除し、永遠の夜を維持すること。
  relationships:
  - name: エララ・ヴァレリウス
    relation: 秩序を乱す危険因子
  - name: ジュリアン・ヴェイン
    relation: 追跡対象の犯罪者
  arc: 絶対的な秩序の守護者であったが、守るべき光が偽りであることを知り、信念の崩壊と再構築を経験する。
- name: セラフィナ
  role: 脇役/狂言回し
  age: 不明（外見は20代前半）
  gender: 女性
  appearance: 雨滴のように揺らめく瞳を持つ、浮世離れした美貌の女性。透き通るような薄衣を纏っている。
  personality: 享楽的で掴みどころがない。残酷な真実を微笑みながら語る。一人称は「あたし」。
  speech_style: 歌うような、軽快でどこか不気味な口調。
  background: 雨の日にだけ現れる路地裏の店の店主。街のあらゆる秘密と、忘れ去られた記憶を管理している。
  motivation: 人間たちが運命の歯車に翻弄される様を、至高の芸術（狂詩曲）として鑑賞すること。
  relationships:
  - name: ジュリアン・ヴェイン
    relation: 顧客であり、理解者
  - name: エララ・ヴァレリウス
    relation: 物語を動かす鍵を持つ少女
  arc: 物語の傍観者として振る舞うが、終盤、街の灯火が消える瞬間に、彼女自身の過去の断片が明らかになる。
