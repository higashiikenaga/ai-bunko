title: 雨滴の狂詩曲（ラプソディ）と、黄金の永劫夜
genre: 群像劇
tone: 優雅で装飾的、華やかさと不穏な陰謀が交錯する
pov: 三人称
tense: 過去形
setting: 魔導灯が夜を拒み続ける大帝国アステリア。不眠の美学が支配する「眠らない街」と、雨の日にのみ現れる幻影の路地裏。
premise: 煌びやかなドレスと宝石が彩る、夜を忘れた「眠らない街」アステリア。そこでは、絶え間ない祝祭の裏で、王座を巡る血塗られた陰謀が静かに進行していた。没落した公爵令嬢、謎めいた蒐集家、そして王宮の影で暗躍する騎士たち。雨の日だけ開く幻の店で手にした「ある記憶」が、彼らの運命を狂わせていく。嵐の仮面舞踏会が、すべての仮面を剥ぎ取る。
themes:
- 運命の交差
- 虚飾と真実
- 喪失と再生
rules:
- 街の灯りは魔導灯によって維持され、決して消えることは許されない。
- 雨の日は次元の境界が揺らぎ、特定の路地裏にのみ「雨の日だけ開く店」が実体化する。
- 貴族の階級は、その者が纏う宝石の輝きと衣装の細工によって視覚的に判別される。
plot_outline:
- '序盤: 眠らない街の華やかな社交界の描写。没落令嬢が王宮の舞踏会へ潜入し、運命的な出会いを果たす。'
- '中盤: 街を揺るがす政変の予兆。雨の日にだけ開く店で、登場人物たちがそれぞれの秘密に関わる禁忌の遺物を手にする。'
- '終盤: 嵐の夜、最大規模の仮面舞踏会が開催される。仮面の下に隠された裏切り者たちが、王位継承の儀式を阻止すべく動き出す。'
- '結末: 舞踏会は混乱の中で幕を閉じ、街を覆っていた魔導の灯火が一時的に消える。静寂の中で、生き残った者たちが新たな夜明けを予感する。'
style_notes: 西洋の宮廷文化を彷彿とさせる、装飾的で流麗な文体を用いる。シルクの質感、宝石の屈折、舞踏会の熱気、そして雨の滴の冷たさを、五感を刺激する豊かな比喩を用いて描写すること。陰謀の緊張感と、情熱的な恋の駆け引きを優雅な語り口で織りなす。
