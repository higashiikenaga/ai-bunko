- name: 湊 凱
  role: 主人公
  age: 22
  gender: 男性
  appearance: 鋭いがどこか虚ろな瞳。かつての天才を感じさせる高いポテンシャルを持つが、現在は痩せこけている。
  personality: 挫折により冷笑的で無気力になっているが、根底には熱い魂を隠している。一人称は「俺」。
  speech_style: 短く、ぶっきらぼう。必要最低限のことしか話さない。
  background: かつて「神童」と呼ばれた天才ボクサー。怪我と精神的な挫折により引退し、故郷の港町で隠遁生活を送っていた。
  motivation: 亡き恩師との約束を果たし、失った自分自身の誇りを取り戻すこと。
  relationships:
  - name: 龍崎 厳
    relation: 恩師・亡き師匠
  - name: 氷室 零
    relation: 宿命のライバル
  - name: 佐伯 凪
    relation: 再起を支える理解者
  arc: 逃避と停滞から、己の弱さを認めた上での真の再起、そして頂点への挑戦へと変化する。
- name: 氷室 零
  role: 敵役
  age: 21
  gender: 男性
  appearance: 無駄のない彫刻のような肉体。端正で冷徹な顔立ち。常に隙のない佇まい。
  personality: 極めて合理的で完璧主義。感情を排除し、ボクシングを「計算」として捉える。一人称は「僕」。
  speech_style: 丁寧だが、相手を突き放すような冷淡で理知的な話し方。
  background: 弱点を一切持たない「精密機械」と称される現役の天才ボクサー。理論に基づいた完璧な技術を持つ。
  motivation: ボクシングにおける「完璧」の証明。そして、湊が持つ「予測不能な力」への執着。
  relationships:
  - name: 湊 凱
    relation: 鏡のようなライバル
  arc: 完璧な理論の壁が、湊の剥き出しの魂によって崩されていく過程で、初めて「闘争の本能」に直面する。
- name: 佐伯 凪
  role: 相棒
  age: 20
  gender: 女性
  appearance: ショートカットで快活な印象。動きやすいスポーツウェアを好む。
  personality: 真っ直ぐで情熱的。他人の挫折に対しても、否定せず寄り添う強さを持つ。一人称は「私」。
  speech_style: 明るくハキハキとしており、迷いがない。
  background: 港町の小さなジムを継ぐために修行中の、ボクシングに全てを捧げる少女。
  motivation: ジムを守り、再び湊のような才能を世に送り出すこと。
  relationships:
  - name: 湊 凱
    relation: 再起を支えるパートナー
  arc: 湊を支える中で、単なる情熱だけでなく、ボクシングの厳しさと向き合う精神的な成長を遂げる。
- name: 龍崎 厳
  role: 脇役
  age: 55
  gender: 男性
  appearance: 深く刻まれた皺と、使い古されたボクシンググローブ。温かい笑顔。
  personality: 情に厚く、厳格だが深い慈愛を持つ。一人称は「俺」。
  speech_style: 豪快で、威厳のある言葉選び。
  background: 湊を育て上げた伝説的なトレーナー。湊の挫折と共に世を去った。
  motivation: 湊が「拳ひとつで未来を切り拓く強さ」を手に入れること。
  relationships:
  - name: 湊 凱
    relation: 教え子
  arc: 回想シーンを通じて、主人公の精神的な支柱として、迷いが生じるたびに導きを与える。
