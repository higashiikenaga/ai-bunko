title: 鉄の残響
genre: スポーツ青春
tone: 硬派で熱く、重厚な雰囲気
pov: 一人称（俺）
tense: 過去形
setting: 現代、潮風の吹き荒れる寂れた港町と、熱狂に包まれた格闘技ジム
premise: 挫折した天才ボクサーの俺は、港町の片隅で死んだような日々を送っていた。約束の丘で亡き恩師と交わした「必ず頂点へ立つ」という誓いだけが、俺を再びリングへと引き戻す。対峙するのは、己の弱さを鏡のように冷徹に映し出す強敵。拳ひとつで、失った誇りと未来を掴み取るための戦いが始まる。
themes:
- 再生
- 約束の重み
rules:
- 試合はボクシングのルールに則るが、精神的な削り合いが勝敗を分ける
- 約束の丘は、主人公の精神的な起点であり、物語の到達点となる場所である
plot_outline:
- '序盤: 港町での停滞。恩師との思い出、約束の丘での誓い。再起への決意。'
- '中盤: 格闘技界への復帰。鏡のように精密な技術を持つライバルとの遭遇。仲間との出会いと衝突。'
- '終盤: 全国大会決勝戦。極限の静寂の中で己の弱さと向き合い、魂を込めた一撃を放つ。'
- '結末: 勝利。そして、再び約束の丘に立ち、空を見上げる。'
style_notes: 短文をたたみかけ、リズムを作る。擬音語（ドカン、バキッ等）を一切使わず、肉体の衝撃や動きをすべて動詞で表現する。戦闘シーンの直前には、必ず呼吸、風、光の描写など、研ぎ澄まされた静かな場面を挿入すること。一人称は「俺」を用い、無骨だが熱い語り口とする。
