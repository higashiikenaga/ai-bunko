- name: エルヴァン
  role: 主人公
  age: 26
  gender: 男性
  appearance: 痩身で青白い肌。使い込まれた灰色の修道服を纏い、常に古びた詩集と万年筆を携帯している。穏やかだがどこか寂しげな瞳を持つ。
  personality: 好奇心旺盛で慈悲深い。教会の教義よりも世界の真実に価値を置く異端的な思考の持ち主。一人称は「私」。
  speech_style: 丁寧で静かな口調。比喩表現や詩的な言い回しを好む。
  background: セレスティア・ノヴァの教会に属する下級修道士。禁書庫で旧世界の断片的な記録に触れ、世界の構造に疑問を持つようになった。
  motivation: 教会の書き換えられた歴史ではなく、世界の真の姿を詩として記録し、後世に遺すこと。
  relationships:
  - name: ルチル
    relation: 旅の相棒であり、導き手。彼女の喪失感に深く共感している。
  - name: ヴァレリウス
    relation: 追跡者。かつての師でありながら、現在は思想的に対立する宿敵。
  arc: 受動的な記録者から、世界の運命を共にする当事者へと成長し、最後にはルチルの生きた証を刻む唯一の語り部となる。
- name: ルチル
  role: 相棒
  age: 14
  gender: 女性（外見）
  appearance: 磁器のような白い肌と、回路のような金色の紋様が浮かぶ瞳を持つ少女型端末。至る所にひび割れがあり、関節部から微かに蒸気が漏れている。
  personality: 論理的で淡々としているが、記憶の欠落による不安を抱えている。純粋で、人間の感情に興味を持つ。一人称は「私」。
  speech_style: 断定的で簡潔な話し方。時折、旧時代の専門用語や計算式が混ざることがある。
  background: かつて世界を統治していた神造知能の一柱。あるエラーにより機能停止し、長い眠りから覚めた時には役割と記憶の大部分を失っていた。
  motivation: 自分がなぜ「迷子」になったのかという理由を突き止め、世界の設計図である星図を完成させること。
  relationships:
  - name: エルヴァン
    relation: 自分を拾い、名前を呼び、対等に接してくれる唯一の人間。
  - name: ヴァレリウス
    relation: 自分を「回収すべき部品」としてのみ扱う排除対象。
  arc: 単なる機能的な端末から、個としての意志と「誰かを想う心」を獲得し、自らの犠牲で世界を救う選択をする。
- name: ヴァレリウス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 黒曜石と真鍮で造られた重厚な甲冑に身を包み、顔の上半分を機械的な仮面で覆っている。巨大な歯車型のメイスを武器とする。
  personality: 冷酷で規律を重んじる。秩序こそが救済であり、不確定要素（異端）は排除されるべきだと信じている。一人称は「我」。
  speech_style: 威圧的で断固とした口調。古風な言い回しを用いる。
  background: セレスティア・ノヴァの異端審問官。旧世界の遺物を管理・抹消することで街の安定を維持している教会の執行官。
  motivation: ルチルを回収し、彼女が持つ管理権限を教会に帰属させることで、完璧な統制社会を完成させること。
  relationships:
  - name: エルヴァン
    relation: かつて期待を寄せた弟子だが、現在は裏切り者として抹殺対象と考えている。
  - name: ルチル
    relation: 世界を再起動させかねない危険な「鍵」であり、最高機密の回収物。
  arc: 絶対的な秩序を信じていたが、旅の果てに世界の崩壊という現実を突きつけられ、自らの信仰の空虚さに直面する。
