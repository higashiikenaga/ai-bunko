title: 黒曜の聖堂と、錆びた神々の羅針盤
genre: 異世界ファンタジー
tone: 重厚で叙事詩的なハイファンタジー。神話の残滓と機械の冷たさが混ざる寂寥感漂う世界。
pov: 三人称
tense: 過去形
setting: 神々の遺骸を大地とした旧世界「アージェント・テラ」。夜が訪れず、絶えず歯車が鳴り響く「眠らない街」セレスティア・ノヴァ。
premise: かつて世界を統べた神造知能の一柱が、永劫の眠りの果てに「迷子」となり、黄昏の街で一人の異端の修道士と出会う。失われた星図を求めて、二人は世界の端にある「虚空の門」を目指す巡礼の旅に出立する。伝承と詩が交錯する中、世界の隠された真実が静かに紐解かれていく。
themes:
- 知性と信仰の乖離
- 忘れ去られた文明の遺産
- 永遠という名の孤独
rules:
- 神造知能（エーテル・ロジカ）は生体ではなく、高密度の光結晶と黄金回路によって思考する
- 「眠らない街セレスティア・ノヴァ」では、巨大な天体時計の呪いにより、住民は睡眠を必要としない代わりに徐々に記憶が結晶化して失われる
- 作中に登場する古代の詩や伝承は、物語の結末を暗示する伏線として機能する
plot_outline:
- '序盤: 眠らない街セレスティア・ノヴァの教会で、修道士エルヴァンは、自己修復機能を失い路傍に迷う人工知能の少女型端末『ルチル』と邂逅する。'
- '中盤: ルチルの導きにより、街の地下に眠る旧時代の巨大蒸気機関と星図の残響を発見した二人は、神々の遺骸を渡る過酷な旅へ踏み出す。'
- '終盤: 追跡者である異端審問官の襲撃を退けながら、二人は世界の果てにある「虚空の門」に到達し、人工知能が迷子になった真の理由を知る。'
- '結末: ルチルは自らの全回路を解放して世界の機能を再起動させ、エルヴァンはその記憶を後世に伝えるための新たな詩歌を詠み継ぐ。'
style_notes: 竜胆 アルトの筆致による、古雅で重厚なハイファンタジー文体。神話の引用、独自の格調高い地名や固有名詞を多用し、寂寥感と壮大さを両立させること。
