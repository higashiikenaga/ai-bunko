- name: 海斗
  role: 主人公
  age: 68
  gender: 男性
  appearance: 深く刻まれた皺と、長年の油汚れが染み付いた作業着。使い込まれたレンチを常に持ち歩いている。
  personality: 無口で職人気質。感情を表に出すのが苦手だが、内面には深い慈愛を秘めている。一人称は「俺」。
  speech_style: 低く落ち着いた声。「……ああ」「やれやれ」といった、短くぶっきらぼうな言い回し。
  background: かつては蒸気機関の設計士だったが、現在は街の片隅で旧式のレールバイクを修理しながら孤独に暮らしている。
  motivation: 手紙の持ち主である女性に、失われた想いを届けることで、彼女の最期を穏やかなものにすること。
  relationships:
  - name: 静
    relation: 手紙の宛先であり、旅の同行者
  - name: レオ
    relation: 弟子
  arc: 他者の人生に深く関わることを避けてきた隠居生活から、人の想いを繋ぐことの尊さを知り、再び社会との繋がりを感じる。
- name: 静
  role: ヒロイン
  age: 65
  gender: 女性
  appearance: 病の影響で透き通るように白い肌と、細い手足。かつては美しかった面影を瞳に残している。
  personality: 頑固で孤独を好む。父に捨てられたという思い込みから、他人に心を開かない。一人称は「私」。
  speech_style: 丁寧だが、どこか壁を作るような、冷ややかで突き放した口調。
  background: 幼い頃に郵便配達員だった父を事故で亡くし、父が自分を置いていったのだという誤解を抱えたまま生きてきた。
  motivation: 静かな、誰にも邪魔されない最期を迎えること。
  relationships:
  - name: 海斗
    relation: 旅の導き手
  - name: 辰夫
    relation: 亡き父
  arc: 父への憎しみと喪失感を、手紙を通じて「愛されていた記憶」へと昇華させ、心の平安を得る。
- name: 辰夫
  role: 鍵となる人物
  age: 35
  gender: 男性
  appearance: （回想・手紙の中）活気に満ちた笑顔、清潔な郵便配達員の制服、使い古された革の鞄。
  personality: 情に厚く、街の誰に対しても明るく接する、太陽のような人物。一人称は「僕」。
  speech_style: 明るく、弾むような、安心感を与える話し方。
  background: かつてこの街の郵便配達員として働いていた。事故により命を落とし、娘への想いを手紙に託したまま、その配達は途絶えていた。
  motivation: 手紙に綴った通り、娘の幸せを心から願うこと。
  relationships:
  - name: 静
    relation: 愛する娘
  arc: 物語の時空を超えた存在として、静の止まった時間を動かす役割を果たす。
- name: レオ
  role: 脇役
  age: 17
  gender: 男性
  appearance: 煤けた顔に好奇心旺盛な瞳。海斗の作業着を少し小さくしたような格好をしている。
  personality: 真っ直ぐで、少しお節介。新しいもの好きだが、どこか古き良きものを大切にする心を持つ。一人称は「僕」。
  speech_style: 「海斗さん！」「それ、どうやるんですか？」と、元気で勢いのある話し方。
  background: 街の孤児で、技術を学べる場所を求めて海斗の元へやってきた見習い整備士。
  motivation: 海斗に認められることと、この街の蒸気技術を継承すること。
  relationships:
  - name: 海斗
    relation: 師匠
  arc: 海斗の旅を通じて、単なる機械の修理だけでなく、人の想いを扱うことの大切さを学ぶ。
