- name: 湊 誠司
  role: 主人公
  age: 24
  gender: 男性
  appearance: 細身で肌の色が白く、どこか虚ろな印象を与える青年。古本屋の整理作業で常に指先がインクで汚れている。
  personality: 内向的で物静か。好奇心が強く、一度興味を持ったことには周囲が見えなくなるほどの執着を見せる。一人称は「僕」。
  speech_style: 丁寧だが、どこか他人との間に壁を作るような、抑揚の少ない話し方。
  background: 都内の小さな古本屋で店員として働く。幼い頃から古い文献や民俗学的な伝承に惹かれる傾向があった。
  motivation: 古書に記された謎を解き明かし、自分が感じている「世界の違和感」の正体を知ること。
  relationships:
  - name: 凪沙 結衣
    relation: 偶然出会う協力者
  - name: 殯 宗一
    relation: 警戒すべき村の権威
  arc: 知識欲に突き動かされた観察者から、逃れられない怪異の犠牲者へと変貌していく。
- name: 凪沙 結衣
  role: 相棒（協力者）
  age: 22
  gender: 女性
  appearance: 活動的な服装に身を包み、知的な瞳を持つ。登山道具を携えている。
  personality: 現実主義で冷静沈着。未知の現象に対しても恐怖より先に分析を試みる。一人称は「私」。
  speech_style: はっきりとした口調で、論理的な言葉選びをする。
  background: 民俗学を専攻する大学生。廃村になりつつある集落の調査のために殯村を訪れていた。
  motivation: 村に伝わる伝承を学術的に記録し、村の消滅を防ぐための手がかりを見つけること。
  relationships:
  - name: 湊 誠司
    relation: 共に村の異常に立ち向かう者
  arc: 論理で説明できない恐怖に直面し、理性を失いかけるほどの絶望を味わう。
- name: 殯 宗一
  role: 敵役
  age: 78
  gender: 男性
  appearance: 深く刻まれた皺と、白濁した瞳を持つ老人。常に黒い作務衣を纏っている。
  personality: 冷酷で、村の伝統と禁忌を何よりも優先する。個人の命に対して一切の慈悲を持たない。一人称は「儂」。
  speech_style: 古めかしく、重々しい。相手を威圧するような独特の間を持つ。
  background: 殯村の長老であり、鏡を用いた儀式『鏡開き』の継承者。村の異形な秩序を守ることに生涯を捧げている。
  motivation: 鏡の中に澱む「何か」を鎮め、村の平穏（停滞）を維持するための供物を得ること。
  relationships:
  - name: 湊 誠司
    relation: 儀式のための適合者（獲物）
  arc: 一貫して村の守護者として振る舞い、湊を破滅へと導く装置として機能する。
- name: 鏡の中の女
  role: 敵役（怪異）
  age: 不明
  gender: 女性
  appearance: 鏡の中にのみ存在する、湊の知る誰かに似た姿をした女。顔が時折、水面に落ちたインクのように歪む。
  personality: 底知れない執念深さと、静かな捕食者の性質を持つ。言葉を持たず、視線と鏡の反射のみで意思を示す。
  speech_style: 発声はせず、耳の奥に直接響くような、水の泡が弾けるような音として伝わる。
  background: 村の歴史の中で、鏡に閉じ込められた怨念や「澱み」が形を成した存在。
  motivation: 鏡の境界を壊し、現実世界を自分たちの住む「澱みの世界」へと変貌させること。
  relationships:
  - name: 湊 誠司
    relation: 鏡の向こう側へ引きずり込む対象
  arc: 鏡の中の影から、現実を浸食し、最終的に湊の存在そのものを奪い去る。
