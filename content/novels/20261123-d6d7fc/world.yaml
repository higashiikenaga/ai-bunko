title: 殯の鏡、澱みの村
genre: 伝奇
tone: 静謐で重苦しい、土着信仰による逃げ場のない恐怖
pov: 三人称
tense: 過去形
setting: 現代、地図から抹消された山間の集落「殯村（もがりむら）」
premise: 古本屋の整理中に、不気味な文言が記された古書を手にした青年・湊は、その記述に導かれるように廃村寸前の殯村へと足を踏み入れる。村では、生者と死者の境界を分かつ「鏡」を用いた奇妙な儀式が、古くからの禁忌として守られていた。しかし、鏡に映るはずのない「何か」が村の深淵から這い出し、訪れた者を静かに、確実に侵食していく。
themes:
- 血縁と因習
- 境界線の消失
- 記憶の腐敗
rules:
- 鏡に映る姿は、本人の魂の純度に従って変容する
- 村の結界は、祭事の際に捧げられる『鏡の破片』によって維持されている
- 禁忌（鏡を覗き込むこと）を犯した者は、影を失い、村の『澱み』へと同化する
plot_outline:
- '序盤: 古本屋で偶然見つけた、村の禁忌を記した古書をきっかけに、湊は不思議な引力に引かれるように殯村へ向かう。村人たちの視線は冷ややかで、どこか生気がない。'
- '中盤: 村の祭礼『鏡開き』の準備が始まる中、湊は村の古い蔵で見つけた大きな鏡に、自分ではない「誰か」の姿が映っているのを見てしまう。村の長老は、それは「澱みの神」の訪れだと言い放つ。'
- '終盤: 鏡を媒介として、村の過去の惨劇と現在の境界が崩れ始める。湊の背後から、鏡の中の存在が現実へと這い出し、村全体が鏡の迷宮へと変貌していく。'
- '結末: 湊は鏡の中に閉じ込められ、村の新たな「澱み」の一部となる。鏡の向こう側で、彼は自分がかつて人間であったことさえ、遠い霧の向こうの記憶のように感じていた。'
style_notes: 湿り気を帯びた、重く沈殿するような文体。方言は過剰にせず、独特の抑揚を持たせて会話に組み込む。自然描写には死の予感や腐敗のニュアンスを込め、視覚的な恐怖よりも、肌にまとわりつくような心理的な圧迫感を重視する。
