- name: エリオ・サリバン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 常に微かなノイズが混じるような、どこか焦点の定まらない瞳。手入れの行き届かない、少し長い髪。使い古されたデータ修復用のデバイスを腰に下げている。
  personality: 内向的で物静か。効率性を重視する社会の中で、言葉にできない「欠落感」を常に抱えている。一人称は「僕」。
  speech_style: 丁寧だが、どこか自信なさげで独り言のような話し方。
  background: 小惑星帯の居住区で、古びたデータの修復を請け負うフリーランスの技術者。高度に自動化された世界に馴染めず、データの断片を繋ぎ合わせる作業に没頭している。
  motivation: 拾った『夕暮れの記憶』の持ち主を探し、その記憶が示す星図の正体を知ること。
  relationships:
  - name: リナ・ヴァンス
    relation: 情報の仲介役であり、唯一の友人
  - name: アーサー・ペンハリン
    relation: 追うべき記憶の持ち主
  arc: 効率と便利さこそが正義だと信じていた無機質な生活から、不完全で、迷い、傷つくことの価値を認め、自らの意思で世界に「ノイズ」を刻む人間へと成長する。
- name: リナ・ヴァンス
  role: 相棒
  age: 24
  gender: 女性
  appearance: 色彩豊かなネオンカラーのアクセサリーを身につけた、都会的な外見。常に最新型の通信端末を操作している。
  personality: 現実主義で社交的。追憶市場の動向に詳しく、情報の価値を冷静に見極める。一人称は「私」。
  speech_style: 早口で、常に情報のアップデートを確認しているような、リズム感のある話し方。
  background: 追憶市場で情報の仲介（ブローカー）を営む。エリオの技術を高く評価しており、彼が危険なデータに手を出さないよう、時に警告し、時に手助けする。
  motivation: エリオが拾った記憶が、市場に大きな波紋を呼ぶことを見越し、その価値を最大化させること（当初）。
  relationships:
  - name: エリオ・サリバン
    relation: 信頼する技術者であり、友人
  arc: 単なる情報の売買による利益追求から、エリオと共に「失われた感情」の重みに気づき、効率主義的な社会への疑問を抱き始める。
- name: アーサー・ペンハリン
  role: 脇役（鍵となる人物）
  age: 82
  gender: 男性
  appearance: 深い皺が刻まれた顔。ナノマシンの管理を拒否しているため、肌には人間らしい質感と、わずかな衰えがある。古い紙の星図を愛でるような、穏やかな佇まい。
  personality: 哲学的で慈愛に満ちている。効率化が進む世界を嘆くのではなく、それを受け入れた上で「余白」の重要性を説く。一人称は「私」。
  speech_style: ゆったりとした、間を大切にする、古風で詩的な話し方。
  background: かつて銀河の航路を設計していた伝説的な星図編纂者。便利すぎる世界によって、人類が「目的地に辿り着くまでの過程」を失ったことを危惧し、あえて迷いを生む星図を隠し続けてきた。
  motivation: 自らの編んだ星図が、誰かの心に「空白を埋めるための旅」を促すきっかけになること。
  relationships:
  - name: エリオ・サリバン
    relation: 記憶の継承者となる青年
  arc: 物語の終盤で、自らの隠した遺産がエリオによって正しく（売るのではなく、放流するという形で）扱われるのを見届け、静かにその役割を終える。
