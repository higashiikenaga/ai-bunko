title: 銀河の塵と、忘れられた星図の残響
genre: SF
tone: 静謐で、少しの寂寥感を伴う近未来SF
pov: 三人称近接視点
tense: 過去形
setting: 超軽量素材による都市構造物が浮遊する、高度に自動化された小惑星帯の居住区。人々はナノマシンによって健康を管理され、生活の不自由さはほぼ消滅している。
premise: 記憶の断片をデータ化して売買する『追憶市場』が、人々の感情の色彩を希薄にさせていた時代。古びた星図の修復士である青年は、ある日、誰のものでもないはずの『美しい夕暮れの記憶』を、市場の隅で拾う。その記憶を辿るうちに、彼は失われたはずの古い星図が、かつて人類が持っていた「不便で愛おしい時間」を記録していることに気づく。便利すぎる世界で削ぎ落とされた、心の空白を埋めるための旅が始まる。
themes:
- 技術の進歩と喪失される感情
- 記憶の価値と自己の同一性
rules:
- 記憶は神経接続デバイスを通じてデジタル化され、売買が可能である
- 市場での記憶売買は合法だが、過度な売却は人格の摩耗を招く
- 星図は単なる航路図ではなく、特定の場所での情緒的な体験を紐付けるインデックスとして機能している
plot_outline:
- '序盤: 記憶の修復士として暮らす主人公が、市場でノイズ混じりの「夕暮れの記憶」を手に取る。その記憶の中に、現代の星図には存在しない古い天体の位置を見つける。'
- '中盤: 記憶の持ち主を求めて、自動化された都市の裏側にある、データの廃棄場や古い通信施設を巡る。最新のデバイスでは再現できない「手触りのある感覚」に触れるたび、彼は自分の中の寂しさを自覚していく。'
- '終盤: 記憶の持ち主が、かつて星図を編んでいた老科学者であることを知る。彼は、便利さを追求するあまり人々が捨て去った「迷うことの豊かさ」を星図に封じ込めていた。'
- '結末: 主人公は、その星図を市場に売るのではなく、ネットワークの隅に「誰もが迷い込めるノイズ」として放流する。完璧な効率性の中に、小さな綻びのような美しさが戻る。'
style_notes: 高度な技術が日常に溶け込み、空気のように当たり前になっている描写を徹底する。ホログラムの揺らぎや、合成食糧の味、ナノマシンの静かな駆動音など、五感に訴えるディテールを盛り込む。便利さによって解決されたはずの「孤独」や、効率化の過程で捨てられた「無駄な時間」の美しさを、淡々と、しかし情緒的に描くこと。
