- name: 陽葵 結菜
  role: 主人公
  age: 17
  gender: 女性
  appearance: ショートヘアで活発な印象。食べると頬がリスのように膨らむ、健康的な美少女。
  personality: 超ポジティブで食いしん坊。好奇心の塊で、美味しいものには目が無い。一人称は「あたし」。
  speech_style: 「〜じゃん！」「ヤバい！」など、感情が豊かでテンションが高い話し方。
  background: ごく普通の高校生だが、食べる喜びを誰よりも知っている。図書室で『秘密の地図』を発見する。
  motivation: 地図に記された全てのグルメを制覇し、最高の味に出会うこと。
  relationships:
  - name: 瀬戸 蓮
    relation: 強引に巻き込んだ相棒兼、恋の対象
  arc: ただ食べるだけの快楽から、料理を通じて誰かと心を通わせ、喜びを共有する大切さを知る。
- name: 瀬戸 蓮
  role: 相棒
  age: 17
  gender: 男性
  appearance: 黒髪で少し長めの前髪、切れ長の瞳。清潔感があり、どこか影のある美男子。
  personality: クールで不愛想、完璧主義者。料理に対してストイックすぎる。一人称は「俺」。
  speech_style: 短文で、少し突き放したような、ぶっきらぼうな話し方。
  background: 料理研究会部長。才能はあるが、周囲の期待に応えようとするプレッシャーに悩んでいる。
  motivation: 料理に対する迷いを断ち切り、自分自身の「作る理由」を見つけること。
  relationships:
  - name: 陽葵 結菜
    relation: ペースを乱してくる食いしん坊な相棒
  arc: 完璧主義の呪縛から解き放たれ、結菜の食レポに救われながら、誰かを笑顔にする料理を取り戻す。
- name: 佐藤 幸恵
  role: 脇役
  age: 62
  gender: 女性
  appearance: 小柄で穏やかな笑顔、常に清潔なエプロン姿。町の商店街の象徴のような存在。
  personality: 温厚でお節介、洞察力が鋭い。町の人々を愛している。一人称は「私」。
  speech_style: 柔らかい方言混じりの丁寧な言葉遣い。
  background: 商店街にある老舗喫茶店「潮騒」の店主。町の歴史を知り尽くしている。
  motivation: 衰退していく商店街に、若い世代の活気を取り戻すこと。
  relationships:
  - name: 陽葵 結菜
    relation: 孫のように可愛がっている
  - name: 瀬戸 蓮
    relation: 成長を温かく見守る対象
  arc: 二人のラジオ活動を通じて、町の人々と若者をつなぐ重要な架け橋となる。
- name: 望月 凛
  role: 脇役
  age: 17
  gender: 女性
  appearance: 流行を取り入れたお洒落なスタイル。常に最新のガジェットを持ち歩いている。
  personality: 冷静沈着で現実主義。効率を重視するが、実は情に厚い。一人称は「私」。
  speech_style: 早口で論理的。ネットスラングや流行語を自然に使いこなす。
  background: 結菜の親友。情報収集が得意で、二人が始めたラジオの配信・編集を担当する。
  motivation: 二人の活動を面白く広め、デジタルな側面から盛り上げること。
  relationships:
  - name: 陽葵 結菜
    relation: 親友兼、全力でサポートするプロデューサー
  arc: 効率や数字ばかりを気にする生活から、不器用ながらも熱い人間模様の価値に気づく。
