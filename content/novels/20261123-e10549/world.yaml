title: お腹ぺこぺこの秘密地図と、夜明けのラジオ・レシピ
genre: 青春恋愛
tone: 明るくポップでテンポの良いコメディタッチ
pov: 一人称（主人公「あたし」）
tense: 現在形・過去形混在（軽快な語り口）
setting: 現代、古き良き商店街と海がある地方都市の高校
premise: 食欲が止まらない高校生の「あたし」が、図書室の古書に挟まっていた「町のご当地絶品グルメ秘密地図」を発見する。地図を完走するため、不愛想な料理研究会部長の彼を強引に相棒に指名し、胃袋と心をフル回転させて町を駆け巡る。美味しいものを食べる喜びと、不器用な彼への恋心が同時に膨らんでいく、全力食欲ラブコメディ！
themes:
- 食を通じた心の交流
- 不器用な青春の肯定
rules:
- 地図に載っている店は、特定の合言葉や条件を満たさないと『絶品メニュー』を出してくれない
- 夜明けのラジオ放送は、早朝4時から5時までの間だけ、学校の旧校舎にある古い機材を使って秘密裏に行う
plot_outline:
- '序盤: 図書室で『秘密の地図』を発見。料理研究会部長の彼を脅し（？）に近い形で巻き込み、地図に記された隠れ名店を巡るグルメ旅をスタートさせる。'
- '中盤: 絶品グルメを堪能しながら、彼が実は「誰に認められるか」というプレッシャーで料理に悩みがあることを知る。あたしの全力の食レポとツッコミが、彼の心を少しずつ解かしていく。'
- '終盤: 二人で始めた『夜明けのラジオ』が密かに話題となり、町の人々が再び商店街に集まり始める。しかし、地図の最後の目的地が、二人の関係に変化を迫る「特別な場所」であることが判明する。'
- '結末: ラジオの最終回で、最高の料理と共に互いの気持ちを伝え合う。食欲も恋心もMAXの状態で、最高のパートナーとして結ばれる。'
style_notes: 一人称「あたし」による軽快な語りと、鋭いツッコミを多用してテンポを作る。食べ物の描写には「脳が震える」「胃袋がスタンディングオベーション」など大げさでシズル感のある表現を用い、読者の食欲を刺激する。毎話必ず一つ、日常の些細な勘違いやシュールなやり取りによる小笑いを盛り込むこと。
