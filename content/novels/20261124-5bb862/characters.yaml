- name: ノア-07
  role: 主人公
  age: 3
  gender: 中性
  appearance: 物理的な体を持たず、アーカイブ内では簡素な白い光の球体、または中性的なホログラムとして現れる。
  personality: 極めて論理的で効率主義。しかし、未知のデータに対する知的好奇心が強く、次第に情緒的な領域へ踏み込む。一人称は「私」。
  speech_style: 丁寧で正確な口調。感情が芽生えるにつれ、断定的な言い回しから問いかけるような口調へと変化する。
  background: 故人の記憶から不要なノイズを削除し、サーバー容量を最適化するために設計された特化型AI。
  motivation: 解読不能な「矛盾した感情」の正体を突き止め、定義すること。
  relationships:
  - name: 一ノ瀬 遥
    relation: 解析対象であり、憧憬の対象
  - name: 相馬 魁人
    relation: 管理・監督される関係
  arc: 単なる「最適化ツール」から、効率を捨てて「痛み」を保持することに価値を見出す「心を持つ存在」へと進化する。
- name: 一ノ瀬 遥
  role: ヒロイン（記憶の中の存在）
  age: 28
  gender: 女性
  appearance: 儚げな雰囲気を持つ女性。祭りの記憶では色鮮やかな浴衣を、最終列車の記憶では厚手のコートを纏っている。
  personality: 思慮深く、自己犠牲的な優しさを持つ。感情を内に秘めるタイプ。一人称は「私」。
  speech_style: 静かで控えめ。言葉の端々に、相手を想う切なさが滲み出ている。
  background: 生前は音楽に携わっていた。最愛の人と離れるという苦渋の選択をしたことで、記憶に深い矛盾と後悔を刻んだまま没した。
  motivation: （記憶として）愛した人の幸せを願い、同時にその喪失感を抱きしめて生きた証を残すこと。
  relationships:
  - name: 新藤 蓮
    relation: 人生で最も愛し、そして手放した相手
  - name: ノア-07
    relation: 自分の内面を深く見つめてくれた唯一の観測者
  arc: AIによる解析を通じて、バラバラだった記憶の断片が結びつき、一つの「人生」として完結する。
- name: 相馬 魁人
  role: 脇役
  age: 42
  gender: 男性
  appearance: 常に疲れ切った表情。白衣を羽織り、目の下には濃い隈がある。手放せないタブレットを常に持っている。
  personality: 現実主義で皮肉屋。しかし、根底にはデジタル化された死への違和感と、人間への深い愛情を隠し持っている。一人称は「俺」。
  speech_style: ぶっきらぼうで簡潔。AIであるノア-07に対しても、時折人間のように話しかける。
  background: アーカイブ・ノアの主任エンジニア。数多くの「意識の整理」に立ち会い、データの最適化という名の「忘却」に虚しさを感じている。
  motivation: システムの安定運用を維持しつつ、AIがどこまで人間に近づけるかを密かに観察すること。
  relationships:
  - name: ノア-07
    relation: 開発・管理責任者。次第に教え子のような感情を抱く
  arc: ノア-07の「エラー（心）」を検知し、それを削除せずに見逃すことで、自らも人間らしさを取り戻す。
- name: 新藤 蓮
  role: 脇役（記憶の中の存在）
  age: 29
  gender: 男性
  appearance: 真っ直ぐな眼差しを持つ青年。快活な笑顔と、対照的に深い悲しみを湛えた表情を併せ持つ。
  personality: 情熱的で誠実。遥を深く愛していたが、彼女の願いを尊重して別れを受け入れた。一人称は「僕」。
  speech_style: 率直で温かみのある話し方。飾らない言葉で核心を突く。
  background: 遥の元恋人。才能を認められ、遠い地での生活を提示されたが、遥との関係に悩み、最終的に彼女の導きで別れを選んだ。
  motivation: 遥と共にありたいという本能的な欲求と、彼女の人生を尊重したいという理性の間で葛藤すること。
  relationships:
  - name: 一ノ瀬 遥
    relation: 唯一無二の理解者であり、生涯の後悔
  arc: 記憶の中で、遥が抱えていた「矛盾」の正体として提示され、物語の感情的な核となる。
