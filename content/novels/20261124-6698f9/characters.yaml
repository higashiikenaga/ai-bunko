- name: 瀬戸 悠真 (せと ゆうま)
  role: 主人公
  age: 17
  gender: 男性
  appearance: 少し長めの黒髪で、どこか虚脱感を漂わせた瞳。バスケ部時代のような引き締まった体つきをしているが、今はどこか猫背気味。
  personality: 内向的で冷笑的。かつての情熱を失い、周囲との関わりを避けている。一人称は「俺」。
  speech_style: 低く落ち着いたトーン。必要最低限のことしか話さない、突き放すような言い方。
  background: かつては県内でも注目されるバスケットボール部のエースだったが、試合中の不慮の事故（あるいは人間関係のトラブル）を機に、コートを去り無気力な日々を送っている。
  motivation: 止まってしまった自分の時間を、再び動かすこと。
  relationships:
  - name: 白石 凪沙
    relation: 転校生であり、停滞した日常を壊す存在
  - name: 佐伯 健太
    relation: バスケ部の部友であり、現在の自分を突き放す存在
  arc: 挫折による自己防衛から、再び自分の弱さを認め、情熱を取り戻してコートに立つ勇気を持つ。
- name: 白石 凪沙 (しらいし なぎさ)
  role: ヒロイン
  age: 16
  gender: 女性
  appearance: 明るい茶髪のショートカット。瞳が澄んでおり、感情がすぐに顔に出る。常に活動的な印象。
  personality: 天真爛漫で真っ直ぐ。しかし、感情が言葉として強制的に溢れ出してしまう「嘘をつけない体質」に悩み、時に不器用な振る舞いを見せる。一人称は「私」。
  speech_style: 明るく、はつらつとしている。思ったことがすぐ口に出るため、時に無遠慮に聞こえることもある。
  background: 都会から海沿いの町へ転校してきた少女。自身の「嘘をつけない」性質を呪いのように感じており、本音を隠して生きることに疲れ、自分をさらけ出せる場所を探している。
  motivation: 悠真を再びバスケに連れ戻し、自分自身も本当の居場所を見つけること。
  relationships:
  - name: 瀬戸 悠真
    relation: 放っておけない存在、本当の気持ちを話したい相手
  arc: 自身の「呪い」を隠すべき欠点ではなく、自分らしくあるための強みとして受け入れていく。
- name: 佐伯 健太 (さえき けんた)
  role: ライバル/脇役
  age: 17
  gender: 男性
  appearance: 短髪で快活な印象。バスケ部の現主将。ガッシリとした体格で、常に全力でプレーしている。
  personality: 熱血漢で正義感が強い。悠真の才能を誰よりも認めていたからこそ、彼が逃げたことに憤りを感じている。一人称は「俺」。
  speech_style: 直球で、感情がストレートに伝わる熱い話し方。
  background: 悠真が去った後のバスケ部を支えてきた。悠真への複雑な感情（尊敬と怒り）を抱えながら、チームを勝利に導こうと奮闘している。
  motivation: バスケ部を県大会へ導くこと、そして悠真に再び向き合わせること。
  relationships:
  - name: 瀬戸 悠真
    relation: かつての相棒であり、現在は対立する立場
  arc: 悠真に対する怒りや執着を整理し、一人の選手として彼と対等に向き合えるようになる。
