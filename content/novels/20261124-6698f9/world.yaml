title: 空の境界線、僕らのシュートライン
genre: スポーツ青春
tone: 瑞々しく、熱っぽく、どこか切ない日常系
pov: 一人称（俺）
tense: 過去形
setting: 現代、地方の海沿いにある公立高校。放課後の部室やバスケットコートが主な舞台。
premise: バスケ部のエースだった俺は、ある事件をきっかけにコートを離れ、今はただ流れる時間をやり過ごしている。そんな俺の前に現れたのは、嘘をつけない体質という『呪い』を抱えた、天真爛漫で不器用な転校生だった。彼女の存在が、止まっていた俺の時計を無理やり動かし始める。放課後の夕暮れ、約束の丘で見つけたのは、失ったはずの情熱と、言葉にできなかった本当の気持ちだった。
themes:
- 再生と挫折
- 嘘と真実の境界線
rules:
- 主人公は過去の試合でのミスにより、バスケに対して強い自己嫌悪を抱いている
- ヒロインは感情が高ぶると、反射的に口から本音が漏れてしまう特性を持つ
plot_outline:
- '序盤: バスケ部を辞めて無気力に過ごす俺の日常。SNSの通知を無視しながら、放課後の教室でぼんやりと過ごす日々。そこに、嘘をつけない呪いを持つ転校生の少女が現れ、俺を強引にバスケ部へ引き戻そうとする。'
- '中盤: 彼女の不器用な言葉に振り回されながらも、少しずつバスケに向き合い始める俺。部活動でのリアルな衝突や、放課後の練習後のコンビニでの会話。二人が『約束の丘』で、将来の夢を語り合う。 '
- '終盤: 大切な試合を前に、彼女の『呪い』が原因でトラブルが起きる。俺は自分の弱さと向き合い、彼女を守るためにコートに立つ決意をする。 '
- '結末: 試合の結果以上に、俺たちが何を得たかが描かれる。夕暮れの丘で、嘘のない言葉で互いの気持ちを伝える。新しい季節が始まる。'
style_notes: 一ノ瀬楓としての文体を徹底。独白は「〜だった」「〜だと思う」といった等身大の高校生の語り口。部活動の汗の匂いや、教室の窓から差し込む西日の質感、SNSのタイムラインの流れるようなスピード感をリアルに描写する。各話の締めには必ず、放課後の静かな、あるいは騒がしい空気感を置くこと。
