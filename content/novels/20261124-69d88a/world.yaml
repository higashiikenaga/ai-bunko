title: さびれた鍵くんと、お星さまの忘れもの便り
genre: 異世界ファンタジー
tone: 優しく、温かみのある児童文学風
pov: 三人称
tense: 過去形
setting: 忘れられた物たちが心を持って暮らす「お忘れもの王国」
premise: ある日、さびた小さな鍵くんが、自分を大切にしてくれた女の子からの「最後のお願い」が書かれた手紙を見つけます。鍵くんは、自分をもう一度届けるために、不思議な仲間たちと一緒に旅に出ることにしました。砂漠を越え、心を込めて手紙を届ける、小さくて大きな冒険のお話です。
themes:
- 思いやり
- さよならの大切さ
rules:
- 人間が忘れ、心から惜しまれた物は、別の世界で命を持つ
- 心のこもった言葉は、暗い道を照らす光になる
- 砂漠のオアシスで涙を流すと、忘れていた大切な記憶が戻る
plot_outline:
- '序盤: お忘れもの王国でひっそりと暮らしていた鍵くんが、持ち主の女の子が遺した「遺言」のような手紙を見つけ、彼女のもとへ届ける旅に出る。'
- '中盤: 道中で、おっちょこちょいな郵便配達員のリスさんと出会い、励まし合いながら、一面の白い砂が広がる「しおさい砂漠」を旅する。'
- '終盤: 砂漠の真ん中にある「記憶のオアシス」に辿り着き、そこで手紙に込められた本当の願いが、自分を忘れてもいいから誰かを幸せにしてほしいということだと知る。'
- '結末: 鍵くんは女の子の心に寄り添う不思議な光となり、彼女に新しい勇気を届けます。鍵くんは王国に戻り、今度は新しくやってきた迷子たちの案内役として幸せに暮らします。'
style_notes: 難しい言葉を避け、ひらがなを多めに使ったやわらかい表現にする。擬人化されたキャラクターたちが、お互いを尊重し合う様子を丁寧に描く。読者に語りかけるような「〜ですね」という口調を混ぜ、毎話、小さなお礼や優しさについての教訓をさりげなく盛り込む。
