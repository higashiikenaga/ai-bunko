title: 星辰の追想聖典 ―紺碧の航路と再会の福音―
genre: 異世界ファンタジー
tone: 荘厳にして哀愁漂う、神話的ハイファンタジー
pov: 三人称
tense: 過去形
setting: 前作の『白紙の審判』を経て、断片化した浮遊島と混沌とした海へと変貌した世界「エーテルガルド」。理（ロゴス）が失われ、記憶と想像力が現実を規定する不安定な時代。
premise: 世界から記憶を消し、リィンを人間とした記録官エリオス。彼を忘れた世界で生きるリィンはある日、古の遺物である『夜明けのラジオ』から、存在しないはずの少年の声を受信する。それは世界の記述から漏れ出したエリオスの「残響」であった。彼を再びこの世界に綴り直すため、リィンは空飛ぶ船に乗り、星の欠片が降り注ぐ紺碧の空へと旅立つ。
themes:
- 喪失と再定義
- 記憶の継承
- 運命への抗い
rules:
- 世界は『正典』を失ったため、強い意志や記憶を持つ者の主観によって局所的に現実が書き換わる『主観的再構築』が起こる。
- 消滅した存在は『注釈の虚無』に蓄積されており、特定の周波数や共鳴を用いることでのみ、一時的に現世へ干渉できる。
- 空飛ぶ船は、星辰の書の断片を動力源としており、航路を決定するには目的地に関する詳細な『記述（記憶）』が必要となる。
plot_outline:
- '序盤: 人間として平穏に暮らすリィンとカエレン。しかし、世界各地で記述の崩壊による『空白化現象』が発生し始める。リィンは偶然手に入れた遺物『夜明けのラジオ』から、かつての自分を救ったエリオスの切なげな声を聴き、彼が『注釈の虚無』で孤独に存在していることを知る。'
- '中盤: エリオスの存在を確定させ、世界を安定させるため、リィンたちは星辰の書の断片を回収する旅に出る。古の空飛ぶ船『アステリア号』を操り、記憶の嵐が吹き荒れる紺碧の海域を突破。旅の途中で、失われたはずの聖教会の生き残りや、自らを新たな神と称する記述の簒奪者たちとの衝突を経て、リィンはエリオスと共に過ごしたはずの「空白の記憶」を取り戻していく。'
- '終盤: すべての断片が集まる場所『終焉の書庫』にて、リィンはエリオスの魂の核と再会する。しかし、彼を現世に完全に戻すには、リィンが得た「人間としての生」という確定した記述を代償に捧げ、再び二人で「不完全な記述（エラー）」に戻る必要があるという残酷な選択を迫られる。'
- '結末: リィンは自らの存在を賭して、エリオスと共に「誰もが誰かを記憶し、書き換えられる世界」という新たな理を世界に刻み込む。エリオスは不完全ながらもリィンの隣に実体化し、二人は空飛ぶ船で、まだ見ぬ新しい世界の記述を書き留めるための旅へ再び出発する。'
style_notes: 重厚な格調高さを維持し、地の文では『星辰の導きに、嘆きの詩を添えて』のような作中詩や、古の伝承を引用する形式を多用する。地名（例：瑠璃色の断崖、静寂の揺籃海）には幻想的な色彩を盛り込み、会話文ではリィンの成長した芯の強さと、エリオスの知的ながらも脆い口調を対比させる。全体として、喪失感から希望へと向かう叙事詩的なリズムを重視する。
