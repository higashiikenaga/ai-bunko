- name: エリアス・ソーン
  role: 主人公/記録者
  age: 36
  gender: 男性
  appearance: 痩身で青白い肌。常に記録用端末を携帯し、度数の強い眼鏡をかけている。環境適応スーツをだらしなく着こなしている。
  personality: 冷徹なまでに客観的で、事象の記録にのみ執着する。一人称は「私」。
  speech_style: 論文のような硬い口調。感情の起伏が少なく、断定的な言い回しを好む。
  background: 銀河記録局の主任アーカイブ官。過去に数多くの「文明崩壊跡地」の調査に従事し、感情を排して事実のみを記述する訓練を受けている。
  motivation: 未知の空間位相崩壊プロセスの完全な記録と、学術的な解明。
  relationships:
  - name: サラ・ヴァンス
    relation: 現場指揮官としての信頼と、価値観の相違による衝突
  - name: ジュリアン・ケイル
    relation: 知的好奇心を共有する協力者だが、その狂気には警戒している
  arc: 徹底した「観察者」として振る舞っていたが、次第に記録対象である現象に惹かれ、最終的に自らも記録の一部（被験者）となることを受け入れる。
- name: サラ・ヴァンス
  role: 相棒/現場指揮官
  age: 42
  gender: 女性
  appearance: 短く刈り込んだ髪に、頬に古い傷跡がある。機能性を重視した重装甲の探査スーツを着用し、常に警戒心に満ちた眼差しをしている。
  personality: 現実主義で責任感が強い。チームの生存を最優先する。一人称は「私」。
  speech_style: 簡潔で指示的な軍隊調。無駄な議論を嫌う。
  background: 極限環境救助隊の元隊長。数々の遭難事故を解決してきた実績を持つが、物理法則が通用しない事象に対して強い拒絶反応を持つ。
  motivation: 調査団全員を無事に帰還させることと、消失した住民の生存可能性の確認。
  relationships:
  - name: エリアス・ソーン
    relation: 彼の不気味なほどの冷静さに苛立ちを感じつつも、分析能力を頼りにしている
  arc: 合理的な生存戦略が通用しない「氷の城」の異常性に追い詰められ、絶望の中で人間としての個の尊厳を最後まで守ろうと抗う。
- name: ジュリアン・ケイル
  role: 専門家/狂信的側面を持つ脇役
  age: 51
  gender: 男性
  appearance: 乱れた白髪に、興奮すると瞳孔が開く特異な眼。常に最新の波形解析デバイスを弄っている。
  personality: 知的好奇心が倫理観を上回るエキセントリックな人物。一人称は「僕」。
  speech_style: 早口で饒舌。専門用語を多用し、相手が理解しているかを気にせず話し続ける。
  background: 空間位相物理学の権威だったが、意識の統合に関する過激な理論を提唱し、学界から追放された過去を持つ。
  motivation: 自らの理論を証明することと、「個」から解放された高次元の意識体への到達。
  relationships:
  - name: エリアス・ソーン
    relation: 自分の理論を正確に記述してくれる最高の書記として重用している
  arc: 理論上の仮説が現実のものとなった歓喜に浸り、自ら進んで「氷の城」の統合プロセスに身を投じる。
