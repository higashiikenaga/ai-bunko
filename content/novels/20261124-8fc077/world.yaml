title: 北方氷原における集落消失事案の観測記録
genre: SF
tone: 冷徹かつ客観的な学術調査報告書の体裁
pov: 客観的記録者（第一人称・複数を想定した「当調査団」）
tense: 現在形・過去形混交の学術的記述
setting: 西暦3422年、永久凍土に覆われた惑星アウストラリス第4惑星の極圏
premise: 本記録は、居住民240名が突如として痕跡なく消失した「消えた村」跡地より回収された音声断片および残留物資を解析したものである。現地には物理法則を無視した巨大な結晶構造物、通称「氷の城」が出現しており、住民の消失と当該構造物の形成には直接的な相関関係が認められる。本稿では、回収された数少ないデータに基づき、空間位相の崩壊プロセスを再構築する試みを行う。
themes:
- 環境改変型文明の遺産
- 記録媒体に残された人類の残響
- 物理現象としての存在の消失
rules:
- 「氷の城」内部の空間は外部の300倍の体積を持ち、時間経過が地表の1/10に減速する。
- 消えた村の住民は死亡したのではなく、局所的な重力異常により高次元データへと変換された。
- 本報告書内の脚注は、調査員個人の主観的恐怖や錯乱の兆候を客観的事実として記録する。
plot_outline:
- '序盤: 調査団が住民不在の「消えた村」に到着し、異常な低温と生活痕の急激な風化を確認する（※脚注1：観測機器の異常動作に関する報告）。'
- '中盤: 村の中心部に突如としてそびえ立つ「氷の城」の内部への潜行調査と、壁面に刻まれた異常な光学的波形の分析を行う。'
- '終盤: 波形データのデコードにより、消えた村の住民たちが城内において「一つの意識体」へと統合されていく過程の音声ログが発見される。'
- '結末: 調査団の観測機器が限界を迎え、記録者自身もまた「氷の城」の反射面に呑み込まれていく瞬間をデータとして残し、本報告は途切れる。'
style_notes: 架空の学術書・調査報告書の体裁を徹底し、無機質な文体の中に微細な恐怖と異常性を織り込む。随所に「※注」を用いた補足情報を挿入し、断片的な事実から読者に全体の戦慄を推測させる。
