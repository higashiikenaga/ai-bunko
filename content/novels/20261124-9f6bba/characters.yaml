- name: カイル・ヴァン・クロムウェル
  role: 主人公
  age: 24
  gender: 男性
  appearance: 油汚れの付いた整備士服、額に跳ね上げたゴーグル、胸部に真鍮製の人工肺が露出している。
  personality: 現実主義で口数は少ないが、身内への情は極めて厚い。一人称は「俺」。
  speech_style: ぶっきらぼうだが、機械の調子を語る時だけは熱を帯びる。
  background: 下層スラムでジャンクパーツの修理をして食いつなぐ整備士。幼い頃から黒煙に晒され、自らも人工肺を装着している。
  motivation: 肺を病むリナを救うため、そして一度も見たことのない「星空」を見るため。
  relationships:
  - name: リナ・エリス
    relation: 幼馴染であり、命を懸けて救いたい存在
  - name: ジャックス
    relation: 目的のために手を組んだ、不器用な相棒
  arc: ただ生き延びるための技術者から、世界の理を壊して未来を創る革命家へと成長する。
- name: リナ・エリス
  role: 脇役
  age: 20
  gender: 女性
  appearance: 病で青白く、細身の体躯。瞳だけは星のように澄んでいる。
  personality: 穏やかで、絶望的な状況でもユーモアを忘れない。一人称は「私」。
  speech_style: 少し息苦しそうだが、優しく語りかけるような話し方。
  background: かつて知識層が住んでいた階層の末裔。黒煙による肺疾患により余命が短い。
  motivation: カイルが「空」を諦めないように見守ること。
  relationships:
  - name: カイル
    relation: 唯一の家族であり、心の拠り所
  arc: 守られるだけの対象から、主人公の精神的な指針（希望）としての役割を果たす。
- name: ジャックス・“アイアン”・レド
  role: 相棒
  age: 32
  gender: 男性
  appearance: 筋骨隆々とした大柄な体格。右腕が巨大な蒸気駆動の義手になっている。
  personality: 享楽的で強欲、だが一度交わした約束は死んでも守る義理堅さを持つ。一人称は「俺様」。
  speech_style: 威勢が良く、下品なスラングを多用する。
  background: 中層階層の治安維持部隊を追放された元傭兵。現在はスラムの運び屋として活動中。
  motivation: 頂上にあるとされる「黄金の都市」の略奪品と、退屈な日々からの脱却。
  relationships:
  - name: カイル
    relation: 最初は金目的だったが、次第に信頼を寄せる仲間
  arc: 利己的な略奪者から、誰かのために拳を振るう真の戦友へと変化する。
- name: 高位執行官 アルカード・ヴァイン
  role: 敵役
  age: 52
  gender: 男性
  appearance: 汚れ一つない純白の軍服。黄金の装飾が施された、精密な機械化義肢を全身に纏う。
  personality: 冷酷な秩序至上主義者。世界の均衡を維持することを至高の善と信じている。一人称は「私」。
  speech_style: 慇懃無礼で、相手を格下と見なした論理的な話し方。
  background: 雲上の頂に住まう支配層の代表。黒煙システムを管理する「灯台」の守護者。
  motivation: 階層構造を維持し、下層の混沌が上層に及ぶことを阻止すること。
  relationships:
  - name: カイル
    relation: 世界の安定を脅かす、排除すべき不純物
  arc: 絶対的な秩序の体現者として、主人公の掲げる「自由」という混沌と衝突する。
