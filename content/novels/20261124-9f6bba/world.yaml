title: 真鍮の肺と、断絶の頂
genre: スチームパンク冒険
tone: 硬派、無骨、加速するアクション
pov: 一人称（俺）
tense: 過去形
setting: 絶え間ない黒煙に覆われ、巨大な蒸気支柱の上に都市が築かれた階層世界。
premise: 空を忘れた世界で、底辺の整備士「俺」は一枚の古びた星図を拾う。それは、煙の海を越えた頂にある「古い灯台」へと続く道標だった。肺を病む仲間を救うため、俺は禁忌の昇降機に乗り込み、雲上の楽園を標榜する支配層に牙をむく。
themes:
- 連帯
- 生存への渇望
rules:
- 酸素は通貨として取引される
- 蒸気圧の変動が都市の階級を決定する
- 黒煙に触れ続けた生物は『錆びた獣』へと変異する
plot_outline:
- '序盤: スラムの整備士である俺が、偶然手に入れた星図の価値に気づき、追手から逃れるためならず者たちと手を組む。'
- '中盤: 巨大な歯車塔を登りながら、各階層を支配する暴君たちを排除し、頂上へと突き進む。'
- '終盤: 雲上の頂に到達し、世界を監視し続けていた古い灯台の正体と、黒煙を維持する残酷なシステムを突き止める。'
- '結末: 俺は自らの機械肺を過負荷させ、灯台の封印を破る。世界に本物の星空を取り戻し、仲間と共に地上の再生を誓う。'
style_notes: 短文をたたみかける。擬音を一切排除し、「砕く」「抉る」「弾く」などの強い動詞のみで戦闘を記述する。戦闘開始直前には必ず、静寂（呼吸を整える、煙草を捨てる等）の描写を挿入して緊張感を最大化させる。
