- name: 霧島 蒼
  role: 主人公
  age: 24
  gender: 男性
  appearance: 無精髭を生やし、常に寝不足で淀んだ目をしている。黒いコートのポケットにいつも手を突っ込んでいる。
  personality: 諦めがよく、周囲の異変に対してどこか他人事のように冷めている。一人称は「俺」。
  speech_style: ボソボソとした低いトーンで、短い文で話す。
  background: この街に流れ着き、目的もなく日々をやり過ごしていた青年。過去の記憶の輪郭が曖昧になりつつある。
  motivation: 日常の違和感の正体を突き止めたいような、このまま全てを忘れてしまいたいような曖昧な感情を抱えている。
  relationships:
  - name: 名前のない猫
    relation: 拾った飼い主であり、世界の変質に引きずり込まれる案内人
  - name: 白石 沙耶
    relation: 耳鳴りの原因について探り合う数少ない知人
  arc: 猫の足音と共に自身の記憶と名前を少しずつ剥ぎ取られ、最終的には街の不可欠な一部へと変貌してしまう。
- name: 白石 沙耶
  role: 脇役
  age: 26
  gender: 女性
  appearance: 几帳面に整えられた服装だが、目の下に濃いクマがあり、常に古いノートを持ち歩いている。
  personality: 神経質で探究心が強いが、精神的に追い詰められている。一人称は「私」。
  speech_style: 早口で、時々現実離れした不安をまくし立てるように喋る。
  background: 街の異変にいち早く気づき、独自の調査を続けている元図書館司書。
  motivation: 街から「眠り」と記憶が失われる理由を解明し、元の日常を取り戻すこと。
  relationships:
  - name: 霧島 蒼
    relation: 街の異変を共有する唯一の理解者
  arc: 調査を進めるうちに「湿った呼吸音」に侵食され、中盤以降は街の住民たちと同様に瞳の焦点を失っていく。
- name: 名前のない猫
  role: 相棒 / 敵役
  age: 不明
  gender: 不明
  appearance: 琥珀色の目を持ち、毛並みは濡れたように黒く光るが、光の加減で輪郭がぼやけて見える。
  personality: 気まぐれで執着がなく、ただ淡々と街を歩き続ける。鳴き声はほとんどあげず、喉の鳴る音だけが響く。
  speech_style: 言語を話さず、ただ足音と喉を鳴らす音で意思を示す。
  background: いつからか路地裏に存在していた、街の境界線を書き換える「管理者」のような存在。
  motivation: 街のすべての記憶と名前を喰らい尽くし、世界を完全に静寂へと閉ざすこと。
  relationships:
  - name: 霧島 蒼
    relation: 自らの足音を響かせるための共鳴者
  arc: 物語を通じて街の境界を広げ続け、最後には主人公の存在そのものを飲み込んで霧の中へ消える。
