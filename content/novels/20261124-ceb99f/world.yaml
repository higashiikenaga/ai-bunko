title: 琥珀の微睡と、名前のない猫の足音
genre: 伝奇
tone: 湿り気を帯びた静かな狂気、じわじわと浸食する不安感
pov: 三人称近接
tense: 過去形
setting: 現代、常に薄霧に包まれ、街灯の明かりが不自然に揺らめく閉鎖的な地方都市
premise: 街灯が消えることのない「眠らない街」では、住民たちは微かな耳鳴りと、どこからともなく漂う腐敗した果実のような匂いに苛まれている。主人公は、路地裏で見つけた「名前のない猫」を拾ったことで、日常の裂け目に潜む「音のない声」を聴き始める。猫が通るたびに、街の境界線が少しずつ、確実に書き換えられていくことに彼は気づかない。
themes:
- 境界の喪失
- 記憶の風化
- 認識の不確かさ
rules:
- 街の灯りは、住民の意識を繋ぎ止めるための楔である
- 名前を奪われた存在は、物理的な質量を失い、影の中に溶け込む
- 特定の周波数の音は、現実の壁を薄くする
plot_outline:
- '序盤: 街の奇妙な静寂と、常に続く湿った夜の描写。主人公が名前のない猫と出会い、その猫が歩く場所から、街の風景が微妙に変質していく違和感に気づく。'
- '中盤: 街の人々が徐々に「眠り」を忘れ、瞳の焦点が合わなくなっていく。猫の足音と共に、壁の向こうから聞こえるはずのない「湿った呼吸音」が日常に混じり始める。'
- '終盤: 猫の正体が、街の記憶を喰らう「境界の管理者」であることが示唆される。街の灯りが一つ、また一つと、音もなく消え始める。'
- '結末: 主人公は、自分がかつて持っていたはずの名前すら思い出せなくなる。ただ、名前のない猫の喉を鳴らす音だけが、永遠に続く霧の中に響き続ける。'
style_notes: 五感、特に湿った空気の重みや、耳の奥を撫でるような微かな音、鼻腔に付着する饐えた匂いの描写を徹底する。感情を直接的な言葉で説明せず、風景の歪みや物音の変調を通じて、読者の皮膚感覚に不穏さを植え付ける。
