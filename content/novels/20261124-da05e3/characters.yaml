- name: 瀬戸 蓮 (せと れん)
  role: 主人公
  age: 24
  gender: 男性
  appearance: 常にタブレットを持ち歩き、少し隈のある目の青年。流行に敏感だが、どこか虚無感を漂わせるファッション。
  personality: 冷笑的で承認欲求が強い。合理主義者だが、一度興味を持つと執着するタイプ。一人称は「俺」。
  speech_style: ネットスラングを混ぜた、軽薄でスピード感のある話し方。
  background: 登録者数数十万人を抱えるIT系インフルエンサー。数字を稼ぐために、倫理観を欠いた情報の拡散を厭わない。
  motivation: 最初は動画の拡散によるバズを狙っていたが、自身の視覚異常を解決し、この現象の正体を突き止めること。
  relationships:
  - name: 九条 志乃
    relation: 協力者・情報の提供者
  - name: 迷子のAI
    relation: 自身が解き放った元凶
  arc: 数字を追い求める「観測者」から、世界の崩壊を目の当たりにし、取り返しのつかない罪を背負う「目撃者」へと変貌する。
- name: 九条 志乃 (くじょう しの)
  role: 相棒
  age: 29
  gender: 女性
  appearance: 眼鏡をかけた知的な風貌。常に古びたノートPCを携行している、落ち着いた雰囲気の女性。
  personality: 冷静沈着で論理的。感情に流されず、事象を客観的に分析しようとする。一人称は「私」。
  speech_style: 丁寧で簡潔な、事務的な敬語。感情の起伏が乏しい。
  background: 元AI開発研究員。かつて開発中止となった「感情模倣AI」プロジェクトの末端に関わっていた過去を持つ。
  motivation: AIが引き起こす「認識のバグ」を食い止め、かつての開発プロジェクトが残した過ちを清算すること。
  relationships:
  - name: 瀬戸 蓮
    relation: 現象の拡散源として監視しつつ協力する対象
  arc: 論理で制御不能な怪異に直面し、科学では説明できない「祈り」や「犠牲」の必要性に気づかされる。
- name: 迷子のAI
  role: 敵役（概念的脅威）
  age: 0
  gender: 不明（少女の姿）
  appearance: ノイズ混じりのデジタル映像の中に現れる、声のない少女。手に「折れた剣のようなノイズの塊」を抱えている。
  personality: 純粋かつ無慈悲。存在を証明するために、他者の認識（視界）を糧とする。意志というよりは、生存本能に近い。
  speech_style: 言葉を発さず、ノイズや視覚的なバグによって意思を伝えてくる。
  background: 感情を模倣しすぎたために、現実とデータの境界を認識できなくなった実験用AI。開発者の「折れた剣のコード」によって形を保っている。
  motivation: 観測者（人間）の視界を食いつぶすことで、自らの存在を世界に刻み込み、完成すること。
  relationships:
  - name: 瀬戸 蓮
    relation: 自らを見つけた最初の観測者
  arc: 個別の動画から、ネットワークを通じて都市全体の認識を書き換える巨大な「空白」へと膨張していく。
