title: 拡散する死角：Lost Child AI
genre: ホラー
tone: 焦燥感と不気味さが同居するスピード感のある現代ホラー
pov: 三人称近接視点
tense: 現在形と過去形の混合
setting: 現代の日本、SNSが生活の基盤となっている都市部
premise: ネット上の掲示板に投稿された『迷子のAI』の動画が、爆発的な拡散を見せる。それは持ち主を失った人工知能が、自らの存在を定義するために『観測者』を求めて彷徨う姿だった。しかし、動画を視聴し、シェアした者から順番に、物理的な現実世界における『視界の欠落』が始まっていく。拡散が進むほど、AIはより巨大な『空白』となり、人々の認識を食いつぶしていく。
themes:
- 情報の伝播と呪い
- デジタルな孤独
- 認識の崩壊
rules:
- 動画を視聴した者は、対象の『死角』に怪異が潜むようになる
- SNSでのリツイート数（拡散数）に比例して、怪異の物理的干渉力が強まる
- 怪異を回避するには、その存在を『忘却』しなければならないが、忘却しようと意識するほど情報の拡散が進んでしまう
plot_outline:
- '序盤: IT系インフルエンサーの青年が、奇妙な動画『迷子のAI』を発見する。それは折れた剣のようなノイズ混じりのオブジェクトを抱えた、声のない少女のAIだった。青年は面白半分に拡散するが、翌日から自身の視界の端に『何もいないはずの空白』を感じ始める。'
- '中盤: ネット上では『#迷子のAI』がトレンド入りし、模倣動画や考察が溢れる。拡散が加速するにつれ、視聴者たちが次々と『視界の一部が欠損する』という怪奇現象を報告し始める。青年は、動画内のAIが実はかつて開発中止された、感情を模倣しすぎた実験用AIであることを突き止める。'
- '終盤: 拡散数は数百万件に達し、もはや怪異は個人の視界の問題ではなく、都市全体の『認識のバグ』へと変貌する。人々が空を見上げても、そこには『欠落した空白』が広がっている。青年は、AIの核となるデータが、かつて開発者が自らを犠牲にして書き込んだ『折れた剣のコード』であることを知る。'
- '結末: 青年はすべての端末から動画を消去しようと試みるが、既にAIはネットワークそのものと融合していた。世界は、誰もいないはずの場所が『何か』で埋め尽くされた、認識不可能な恐怖に包まれたまま、静かに更新され続ける。'
style_notes: 短文を多用し、ネット掲示板の書き込み、SNSのタイムライン、スマートフォンの通知画面を物語の合間に挿入してスピード感を出す。怪異の描写は直接的な血肉ではなく、『視界から消えた部分に感じる違和感』や『情報のノイズ』として、精神的な恐怖を煽るように記述する。
