- name: エリオス
  role: 主人公
  age: 26
  gender: 男性
  appearance: 痩身で、常に微かな塵に汚れた作業着を着ている。首にはセンサー付きの高度な観測用ゴーグルを掛けている。
  personality: 真実を追い求める探究心が強く、冷静だが内面に熱い情熱を秘めている。一人称は「僕」。
  speech_style: 論理的で丁寧だが、思考を整理するために独り言を言う癖がある。
  background: CMS（大気管理システム）の低層区画で働く中堅の気象観測技師。幼い頃から、管理された空の色の不自然さに漠然とした違和感を抱いていた。
  motivation: 観測データの不整合の正体を突き止め、隠蔽された「世界の欠落」を埋めること。
  relationships:
  - name: ヴェラ
    relation: 師であり、技術的な導き手
  - name: カイル
    relation: 監視対象であり、対立する思想を持つ者
  arc: システムの歯車として受動的に生きる観測者から、自らの手で真実を世界に突きつける革命家へと変貌する。
- name: ヴェラ
  role: 相棒・導き手
  age: 45
  gender: 女性
  appearance: 銀髪のショートヘア。油汚れのついたエプロンを纏い、片目に旧式の光学単眼鏡を装着している。
  personality: 飄々としていて掴みどころがないが、知識は底知れない。一人称は「私」。
  speech_style: 隠語や比喩を多用する、年長者らしい余裕と含みを持たせた口調。
  background: かつてCMSの基幹に関わる気象学の主要研究者だったが、現在は酸性雨の日にのみ開店する「アナログ情報復元店」を営む地下住人。
  motivation: 管理された偽りの世界で、失われた「真実の記憶（空）」を次世代に繋ぐこと。
  relationships:
  - name: エリオス
    relation: 教え子であり、真実を追う協力者
  arc: 隠遁生活を送っていたが、エリオスの行動に呼応し、失われた技術を駆使して世界の変革を支える。
- name: カイル
  role: 敵役
  age: 52
  gender: 男性
  appearance: 隙のないCMSの制服を着用。常に清潔感があり、瞳は冷徹な人工知能のように無機質で感情が読めない。
  personality: 極端な秩序主義者。人類の生存には「管理された偽りの平和」が不可欠だと信じている。一人称は「私」。
  speech_style: 威圧的で、感情を完全に排した事務的かつ決定的な口調。
  background: CMSの最高管理官の一人。雲層の維持と社会の安定を絶対的な至上命令として執行している。
  motivation: 管理システムの完全性を守り、社会を混乱から防衛し、現状の秩序を維持すること。
  relationships:
  - name: エリオス
    relation: 秩序を乱す排除すべき不確定要素
  arc: 秩序の守護者としてエリオスを追い詰めるが、システムが崩壊していく中で、自身の信じる正義の無力さを直面する。
- name: シオン
  role: 脇役
  age: 19
  gender: 女性
  appearance: オーバーサイズのフードを深く被り、顔の半分を隠している。小型の偵察用ドローンを常に操っている。
  personality: 懐疑的で皮肉屋だが、高度な電子機器に対しては非常に高い忠誠心と執着を持つ。一人称は「あたし」。
  speech_style: ぶっきらぼうで、居住区の若者が使うスラングを混ぜた荒っぽい口調。
  background: 廃棄された電子機器や部品を回収して生きるスカベンジャー（廃品回収業者）。
  motivation: 限られた資源の中で生き抜くこと、そして雲の向こうにある「本物の光」への無意識な憧れ。
  relationships:
  - name: エリオス
    relation: 技術的な協力者
  - name: ヴェラ
    relation: 技術を学ぶべき尊敬対象
  arc: 自分の利益と生存のためだけに動いていた個人主義者から、世界の変革という大きなうねりに身を投じる一員となる。
