title: 飽和雲圏の測位者：灰色の天球と信号の残滓
genre: ディストピア
tone: 硬派、冷徹、緻密な技術描写
pov: 三人称
tense: 過去形
setting: 地表が厚い化学雲層に覆われ、高度な大気管理システム（CMS）によって気象と資源が完全に統制された近未来の居住区。
premise: 人類は、管理された人工的な気象条件下でのみ生存を許されている。気象観測技師のエリオスは、観測データの不整合から、現行のデジタルマップには存在しないはずの「古い灯台」が発する微弱なパルス信号を検知する。それは、管理システムが隠蔽し続けてきた「真の空」の座標を示していた。雨の日にのみ開店する闇の修理店を辿り、エリオスは大気の組成に刻み込まれた禁忌の記録を解読し始める。
themes:
- 情報の統制と真実の在り方
- 技術による環境支配の倫理的代償
rules:
- 大気管理システム(CMS)による気象および資源配分の絶対的権限
- 管理外の周波数通信は『大気ノイズ』として自動的に検知・相殺される
- 降水に含まれる特殊な微粒子は、極めて低速ながら情報の記録媒体として機能し得る
plot_outline:
- '序盤: CMSの保守に従事するエリオスが、高度なノイズキャンセリング機能を潜り抜けてくる、旧式の光学信号を検知する。その信号源は、雲層の底に沈んだはずの古い灯台だった。'
- '中盤: 信号を解析するための特殊な機材を求めて、エリオスは酸性雨が降る時のみ開店する「アナログ情報復元店」を訪れる。そこで、雨滴に刻まれた微細なデータ構造を読み取る技術「降水データ抽出法(RDE)」について学ぶ。'
- '終盤: 灯台の正体が、雲層の外にある「真の太陽」を観測するための旧式観測装置であることを突き止める。管理システムが、社会の安定を維持するために太陽光を意図的に遮断している事実を暴く。'
- '結末: エリオスは自身の観測機器を過負荷状態で改造し、全世界の気象端末を通じて、雲の隙間に見える「真実の空」の映像を空に投影する。管理体制は崩壊の危機に瀕するが、人類は初めて灰色の空ではない、本物の光を目撃する。'
style_notes: 緻密な科学的考証に基づいた描写を徹底すること。例えば、大気中の化学組成、センサーの受光感度、通信プロトコルの変調方式などを具体的に記述する。専門用語（例：降水データ抽出法、飽和雲圏、パルス変調）は、キャラクターの作業や会話を通じて、その機能が読者に伝わるよう自然に導入すること。
