- name: 凪瀬 湊
  role: 主人公
  age: 26
  gender: 男性
  appearance: どこか影のある、細身の青年。常に少し疲れたような目つきをしており、実家の古い灯台守の制服を纏っている。
  personality: 内向的で思慮深い。過去の喪失感から逃れられず、静かな執着心を抱いている。一人称は「僕」。
  speech_style: 控えめで丁寧だが、どこか他人との間に壁を作ったような、淡々とした話し方。
  background: 数年前に恋人を海で亡くした後、都会へ逃げるように出ていたが、父の死を機に故郷の凪浦に戻り、灯台の管理を引き継ぐことになった。
  motivation: 父の遺した地図を頼りに、塩の砂漠のオアシスで亡き恋人と再会すること。
  relationships:
  - name: 瀬戸 詠美
    relation: 亡き恋人
  - name: 凪瀬 耕造
    relation: 亡き父
  - name: 潮崎 栞
    relation: 幼馴染
  arc: 死者への執着という「停滞」から、喪失を受け入れ、生者の世界で灯火を守るという「再生」へと変化する。
- name: 瀬戸 詠美
  role: 誘惑者（幻影）
  age: 25
  gender: 女性
  appearance: 透き通るような白い肌と、波間に揺れるような長い黒髪。生前と変わらぬ、穏やかで美しい姿。
  personality: 慈愛に満ち、すべてを許容してくれるような包容力を持つ。しかし、その本質は現世への未練を吸い上げる砂漠の化身。一人称は「私」。
  speech_style: 耳元で囁くような、潮騒のように優しく、抗いがたい心地よい声。
  background: 数年前に凪浦の海で事故に遭い、命を落とした湊の恋人。砂漠のオアシスでは、死者の記憶を具現化した存在として現れる。
  motivation: 湊をオアシスに留め、永遠の静寂（死）へと引き込むこと。
  relationships:
  - name: 凪瀬 湊
    relation: かつての恋人
  arc: 湊の救済として現れるが、最終的には彼が生きるために打ち破るべき「甘い幻」として機能する。
- name: 凪瀬 耕造
  role: 導き手（故人）
  age: 58
  gender: 男性
  appearance: 写真や手記の中で見る、深く刻まれた皺と、海を見つめる鋭い眼光を持つ頑固そうな老人。
  personality: 厳格で、村の禁忌を重んじる保守的な人物。息子を愛しながらも、あえて突き放すような態度を取っていた。一人称は「俺」。
  speech_style: 短文で、命令形に近い、力強く重みのある口調。
  background: 長年凪浦の灯台を守ってきた前任者。砂漠の真実を知り、息子が踏み込まぬよう警告を残していた。
  motivation: 息子が砂漠の誘惑に負けず、生者の世界で灯火を灯し続けるよう導くこと。
  relationships:
  - name: 凪瀬 湊
    relation: 息子
  arc: 物語の序盤では「謎」として存在するが、中盤以降は手記を通じて湊の「良心」と「警告」として機能する。
- name: 潮崎 栞
  role: 脇役（現実の象徴）
  age: 26
  gender: 女性
  appearance: 日焼けした肌と、活動的な漁師の服装。瞳は意志が強く、生命力に溢れている。
  personality: 現実主義者で、真っ直ぐな性格。湊の危うさを心配しており、彼を現世に繋ぎ止めようとする。一人称は「私」。
  speech_style: ハキハキとした、飾りのない、力強い話し方。
  background: 凪浦の漁師の家系に生まれ、村の伝承や潮の動きに精通している。湊とは幼馴染で、彼が戻ってきたことを喜んでいる。
  motivation: 湊が過去に囚われすぎず、村の一員として再び歩み出すことを見守ること。
  relationships:
  - name: 凪瀬 湊
    relation: 幼馴染
  arc: 湊が砂漠へ向かうことを止められない中で、彼が戻ってくる場所（生者の世界）としての役割を果たす。
