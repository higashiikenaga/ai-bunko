title: 凪の砂海と、潮騒の弔い鐘
genre: 怪談・民俗
tone: 静謐で湿り気を帯びた、寂寥感のある文体
pov: 三人称
tense: 過去形
setting: 現代。数十年に一度、潮が極端に引き、海底に白い塩の砂漠が現れる離島の漁村「凪浦」。
premise: 海が嘘のように消え、白銀の塩の砂漠が姿を現す不思議な村があった。そこには、死者が集うという幻のオアシスが現れるという古い伝承が残っていた。青年は亡き父の遺した「秘密の地図」を手に、潮が引いた刹那の空白に、失った最愛の人を呼び戻そうとする。
themes:
- 喪失と受容
- 生者と死者の境界線
rules:
- 大干潮の際、海底に出現する『砂漠のオアシス』に入った者は、過去の幸福な記憶に囚われ、現実に戻る意欲を失う。
- 灯台の光が届かない死角においてのみオアシスは維持され、強い光に照らされると幻は消え、現実に引き戻される。
- 秘密の地図は、潮の満ち引きと星の位置を計算し、オアシスの出現地点を特定するための古文書である。
plot_outline:
- '序盤: 父の死後、故郷の凪浦に戻った主人公が、古びた灯台の管理を任される。蔵の奥から、海底の特異点を示す奇妙な『秘密の地図』と、父の書き残した警告の手記を見つける。'
- '中盤: 数十年ぶりに訪れた最大の大干潮により、海が完全に消え去り、辺りは一面の塩の砂漠へと変わる。主人公は地図を頼りに、死者が集うという『砂漠のオアシス』を目指して、潮の匂いだけが残る白い大地を歩き出す。'
- '終盤: オアシスで再会した亡き家族と、心地よい停滞感の中で永遠を過ごそうとする。しかし、遠くから聞こえる弔い鐘の音と、灯台守として灯すべき火の責任に気づき、自ら光を掲げて幻を打ち破る。'
- '結末: 潮が満ち、白い砂漠は再び深い青に飲み込まれる。主人公は喪失という痛みこそが生きている証であることを受け入れ、静かに灯台の火を灯し続ける日々へと戻る。'
style_notes: 潮の香りと波の音を文章の端々に散りばめ、読者が海辺に立っているかのような感覚を与える。長い一文と短い一文を交互に使い、潮の満ち引きのような緩急のあるリズムで綴ること。
