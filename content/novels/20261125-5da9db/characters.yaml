- name: エリアン
  role: 主人公
  age: 19
  gender: 男性
  appearance: 透き通るような白い肌と、砂漠の色に溶け込みそうな淡い灰色の瞳。線の細い、壊れそうな少年。
  personality: 内向的で極めて繊細。ライラとの境界線が曖昧で、自分という存在に確信が持てない。一人称は「僕」。
  speech_style: 静かで、相手の呼吸に合わせるような、震えるほど穏やかな話し方。
  background: 砂の街の片隅で、ライラと二人きりで育った。互いの体温だけを世界のすべてとして生きてきた。
  motivation: ライラとの間に感じる、正体のわからない「欠落」の正体を突き止め、二人の絆を確かめること。
  relationships:
  - name: ライラ
    relation: 双子の片割れ、魂の半分
  - name: サイラス
    relation: 旅の導き手
  arc: 共依存的な「二人で一つ」の状態から、痛みとともに「個」としての孤独を受け入れ、自立した人間へと成長する。
- name: ライラ
  role: 相棒
  age: 19
  gender: 女性
  appearance: エリアンと対をなす美貌。瞳は深みのある瑠璃色で、砂漠の中で唯一色彩を感じさせる存在。
  personality: 献身的で慈愛に満ちているが、どこか現実感に欠ける。エリアンの存在なしには自己を定義できない。一人称は「私」。
  speech_style: 詩的で、どこか遠くの空を見つめているような、浮世離れした響き。
  background: エリアンと共に生きてきたが、実は「瑠璃のオアシス」という幻想を維持するための、生贄に近い役割を背負わされている。
  motivation: エリアンの幸福を守ること。彼が自分を必要とし続けること。
  relationships:
  - name: エリアン
    relation: 双子の片割れ、生存の理由
  arc: 自分を犠牲にして二人を繋ぎ止める「幻想の装置」であることを拒絶し、一人の人間としてエリアンと決別する道を選ぶ。
- name: サイラス
  role: 脇役
  age: 55
  gender: 男性
  appearance: 深く刻まれた皺と、日焼けした強靭な肌。使い古された旅装束を纏った、枯れ木のような老人。
  personality: 厭世的で皮肉屋だが、根底には深い慈悲を隠している。一人称は「俺」。
  speech_style: ぶっきらぼうで、核心を突くような、砂を噛むような乾いた話し方。
  background: かつて「瑠璃のオアシス」を目指したが、その残酷な真実を知り、絶望して街に戻ってきた元放浪者。
  motivation: 双子が自分と同じ「美しい破滅」を繰り返さないよう、真実を伝え、彼らの選択を見守ること。
  relationships:
  - name: エリアン
    relation: かつての自分を重ねる対象
  - name: ライラ
    relation: 守るべき、あるいは放すべき命
  arc: 過去の失敗に対する贖罪を、若者たちの「個としての再生」を静かに見届けることで果たす。
- name: ノラ
  role: 敵役
  age: 28
  gender: 女性
  appearance: 砂漠の熱を遮断するかのような、冷ややかな美しさを持つ街の管理者。宝石のような装飾を身に纏う。
  personality: 秩序と停滞を愛する。変化を「崩壊」と捉え、徹底して排除しようとする。一人称は「私」。
  speech_style: 感情の起伏が全くない、儀式的で冷徹な敬語。
  background: 街の均衡（黄昏の停滞）を維持するために、双子の「欠落」を隠蔽し、彼らを管理下に置こうとする。
  motivation: 砂の街の静寂を永久に保ち、誰もが変化に苦しまなくて済む「停滞した楽園」を守ること。
  relationships:
  - name: エリアン
    relation: 秩序を乱す異分子
  arc: 変化を拒む絶対的な壁として立ちはだかるが、最後には個の輝きによって、その停滞の理を打ち砕かれる。
