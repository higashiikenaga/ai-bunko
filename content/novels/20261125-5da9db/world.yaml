title: 破片の聖域、あるいは砂漠に咲く瑠璃の滴
genre: ヒューマンドラマ
tone: 耽美、繊細、哀切
pov: 一人称
tense: 過去形
setting: 陽炎が立ち上り、色彩が砂に溶け落ちたような、黄昏に閉ざされた辺境の砂の街
premise: 鏡合わせの双子として生まれ、魂の半分を分かち合った二人。乾いた砂がすべてを覆い尽くす絶望的な街で、彼らは互いの体温だけを、生命を繋ぎ止める唯一のオアシスとして信じていた。しかし、美しき均衡は、ある「欠落」の発見によって、硝子細工のように音を立てて崩れ始める。失われることの美しさと、それでもなお愛し合おうとする、痛切な魂の軌跡を描く。
themes:
- 自己の境界線
- 欠落の美学
- 共依存と救済
rules:
- 双子は、互いの痛みや感覚を微かに共有する『共鳴』の性質を持つ
- この街では、美しすぎるものや純粋なものは、砂に飲み込まれる運命にある
plot_outline:
- '序盤: 砂の街で静かに、しかし確実に崩壊しつつある双子の日常。主人公は、片割れとの間に感じる、言葉にできない違和感と、美しすぎる孤独を描く。'
- '中盤: 街の境界にある、伝説の「瑠璃のオアシス」への旅。それは、かつて二人が共有していた、色彩に満ちた記憶の断片であった。'
- '終盤: オアシスの正体が、己の犠牲によってのみ維持される幻想であったことが判明する。双子の絆は、維持するか、あるいは決別して個へと砕け散るかの選択を迫られる。'
- '結末: 砕け散った破片のなかで、彼らは初めて、自分自身として光を反射し始める。砂漠に沈む夕陽の下、美しくも儚い、個としての再生。'
style_notes: 「透明な痛みを伴う、静謐な美しさ」を基調とする。比喩表現には、プリズム、薄氷、百合の白、あるいは砕けたダイヤモンドといった、硬質さと脆さを併せ持つ語彙を多用し、感情の揺らぎを視覚的に描写すること。読者の肌に、熱い砂の感触と、冷たい涙の感触が同時に伝わるような、触覚的な叙情性を追求する。
