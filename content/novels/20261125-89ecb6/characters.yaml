- name: エルナ
  role: 主人公
  age: 16
  gender: 女性
  appearance: 潮風にさらされた淡い色の髪と、深い悲しみを湛えた灰色の瞳。古ぼけた旅の外套を羽織っている。
  personality: 内向的だが芯が強く、一度決めたことは曲げない。一人称は「私」。
  speech_style: 丁寧だが、どこか他人との距離を置いた静かな話し方。
  background: 数年前、満潮の日に幼い弟を海にさらわれた。以来、弟の行方を追い、各地の伝承を辿ってこの町に辿り着いた。
  motivation: 名前を失い、海に消えた弟を連れ戻すこと。
  relationships:
  - name: 名前のない猫
    relation: 導き手であり、危うい共犯者
  - name: 弟（影）
    relation: 唯一の肉親であり、執着の対象
  arc: 喪失への執着から脱却し、「忘却」を「思い出」として受け入れることで精神的に自立する。
- name: 名前のない猫
  role: 相棒・導き手
  age: 不詳
  gender: 不明
  appearance: 夜の闇に溶け込むような漆黒の毛並みと、吸い込まれるように深く鮮やかな青い瞳を持つ猫。
  personality: 皮肉屋で超然としているが、好奇心旺盛。一人称は「私」。
  speech_style: 古風で哲学的な言い回しを好み、相手を試すような問いかけが多い。
  background: 灯台に宿る精霊、あるいは「記憶を喰らう獣」。海から流れ着く名もなき記憶を管理し、灯台の光を維持している。
  motivation: 灯台の秩序を保つこと。同時に、エルナという強い意志を持つ人間に興味を抱いている。
  relationships:
  - name: エルナ
    relation: 珍しい客であり、観測対象
  arc: 冷徹な管理者の立場から、エルナの決断を通じて「名前に宿る想い」という不合理な価値を認めるようになる。
- name: 弟の影
  role: 敵役・悲劇の象徴
  age: 10（失踪時）
  gender: 男性
  appearance: 輪郭が常に揺らめく半透明の黒いシルエット。顔は判然としないが、時折、泣いているような形に歪む。
  personality: 孤独への強い恐怖と、姉への切ない依存心に支配されている。一人称は「ぼく」。
  speech_style: 断片的で掠れた声。エコーがかかったように何度も同じ言葉を繰り返す。
  background: 海に飲み込まれ、名前と記憶を奪われた「忘れられたもの」の一人。灯台の光に惹かれ、境界線で彷徨っている。
  motivation: エルナに自分の名前を思い出させ、再び人間として存在すること。
  relationships:
  - name: エルナ
    relation: 唯一の希望であり、縋り付く対象
  arc: 姉への執着による醜い形からの解放。名前を猫に預けることで、静かな眠り（忘却）へと移行する。
- name: 灯台守の老人
  role: 脇役
  age: 72
  gender: 男性
  appearance: 塩漬けにされたような深い皺が刻まれた顔。常に古いランタンを持ち歩き、濡れたウールのコートを着ている。
  personality: ぶっきらぼうだが、町の掟を重んじる。一人称は「わし」。
  speech_style: 海辺の訛りが強く、ぶっきらぼうに突き放すような言い方をする。
  background: 代々この町の灯台を守ってきた一族の末裔。海から流れ着く「記憶」の危険性を誰よりも知っている。
  motivation: 町の人々が「忘れられたもの」に惑わされないよう、境界線を守ること。
  relationships:
  - name: エルナ
    relation: 危なっかしい迷い子
  - name: 名前のない猫
    relation: 不気味な同居人
  arc: エルナの覚悟を目の当たりにし、次世代へ「記憶の継承」を託すことを決める。
