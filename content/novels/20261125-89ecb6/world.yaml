title: 潮騒の灯台と、名前を忘れた獣
genre: 怪談・民俗
tone: 幻想的で、静かな恐怖が混じる童話調
pov: 三人称
tense: 過去形
setting: 霧の深い、断崖絶壁に建つ古い灯台のある海岸の町
premise: 潮が満ちるたび、海からは「忘れられたもの」が流れ着く不思議な町。少女は、行方不明になった弟の面影を求めて、岬の果てにある古い灯台へと迷い込みます。そこで彼女が出会ったのは、名前を持たない、瞳の青い一匹の猫でした。猫の導きに従い、少女は灯台が照らし出す「光と影の境界」に潜む、恐ろしくも美しい真実に触れていくことになります。
themes:
- 記憶と忘却
- 喪失の受容
rules:
- 灯台の光は船ではなく、海に沈んだ『名前』を照らし出すものである
- 名前を失った者は、霧の中で影だけの存在となり、やがて波の音に溶けて消える
- 猫は、失われた名前を食べて、その魂が怪物にならないよう守る役割を持つ
plot_outline:
- '序盤: 霧に包まれた町に、少女・エルナが訪れる。彼女は古い灯台に住む、名前のない猫と出会い、灯台が海から『記憶』を拾い上げていることを知る。'
- '中盤: エルナは、弟が「名前のない影」になってしまったことを悟る。灯台の光が照らす夜の海には、名前を失い彷徨う者たちの不気味な影が蠢いていた。'
- '終盤: 灯台の最上階で、エルナは弟の影と対峙する。影は弟の記憶を求めて彼女に縋るが、猫は静かにその名前を飲み込もうとする。'
- '結末: エルナは、弟を「思い出」として心に刻む代わりに、猫にその名前を預ける決断をする。灯台の光は静かに消え、少女は新しい名前を持って、霧の晴れた町を去っていく。'
style_notes: 「むかしむかし」ではなく、いま目の前で起きている出来事のように、優しく、しかしどこか冷ややかな言葉選びを用いる。死や恐怖を、残酷な言葉ではなく「霧」や「波」といった自然現象に喩えて描く。猫の動作を、物語の予兆として細やかに描写すること。
