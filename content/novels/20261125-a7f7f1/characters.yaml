- name: 蓮見 零
  role: 主人公
  age: 38
  gender: 男性
  appearance: 常に煙草を燻らせ、使い古されたトレンチコートを羽織っている。無精髭と深い隈が特徴的な、疲れ切った表情の男。
  personality: 冷笑的で厭世的。デジタル化された世界に馴染めず、肉体的な手触りを重んじる。一人称は「俺」。
  speech_style: 低く、ぶっきらぼうな口調。必要最低限のことしか話さない。
  background: かつては巨大企業のセキュリティ部門に所属していたが、意識のデータ化に伴う「個の消失」を目の当たりにし、退職。現在は下層街で探偵を営んでいる。
  motivation: 依頼を完遂すること。そして、電子の海に消えた「確かな真実」を掴み取ること。
  relationships:
  - name: 凪沙 雫
    relation: 依頼人
  - name: カイト
    relation: 情報屋・協力者
  arc: 街の腐敗に無関心を貫いていたが、真実を追う過程で、システムそのものと対峙する決断を迫られる。
- name: 凪沙 雫
  role: 依頼人
  age: 26
  gender: 女性
  appearance: 色あせたドレスを纏い、どこか浮世離れした儚い美しさを持つ。瞳には深い喪失感が宿っている。
  personality: 静かで意志が強く、悲しみの中に芯の強さを秘めている。一人称は「私」。
  speech_style: 丁寧だが、どこか距離感のある静かな話し方。
  background: 亡き恋人が遺したアナログの手紙を唯一の手がかりとして、蓮見の元を訪れる。デジタル化が進む中で、あえて物理的な記憶を守ろうとしている。
  motivation: 恋人の真意を知り、彼が最後に遺した選択（遺言）を遂行すること。
  relationships:
  - name: 蓮見 零
    relation: 探偵
  - name: ハルト
    relation: 亡き恋人
  arc: 過去の悲しみに囚われた被害者から、自らの意志で未来（あるいは破滅）を選択する主体的な人間へと変化する。
- name: ヴァイス・クロム
  role: 敵役
  age: 50
  gender: 男性
  appearance: 完璧に整えられた銀髪と、高価なサイバネティクス義眼。汚れ一つない白いスーツを纏う、非人間的な清潔感。
  personality: 極めて合理的で冷徹。人間を「最適化されるべきデータ」と見なす。一人称は「私」。
  speech_style: 優雅で理知的、しかし相手を観察対象としてしか見ていない、突き放したような響き。
  background: 意識のクラウド化を管理する巨大企業「エリュシオン」の最高執行責任者。システムの安定こそが人類の救済だと信じている。
  motivation: デジタル上の完璧な秩序を維持し、不確定要素である「肉体的な記憶」や「ウイルス」を排除すること。
  relationships:
  - name: 蓮見 零
    relation: 排除すべきノイズ
  arc: 揺るぎない秩序の象徴として、主人公たちが持ち込む「不確定な真実」を徹底的に抑圧しようとする。
- name: カイト
  role: 脇役
  age: 21
  gender: 男性
  appearance: ネオンカラーの髪に、全身に多数のインターフェース端子を持つ。常に浮遊するホログラムに囲まれている。
  personality: 好奇心旺盛で軽薄に見えるが、技術への情熱は本物。一人称は「ボク」。
  speech_style: 早口で、専門用語やスラングを多用する情報屋らしい喋り方。
  background: 下層街の違法ダイブ店を営む天才的なハッカー。蓮見とは古い付き合いであり、彼の良き理解者。
  motivation: 未知のデータへの接触と、それによって得られる報酬。
  relationships:
  - name: 蓮見 零
    relation: 旧知の仲
  arc: 単なるデータのやり取りを超えた、生身の人間が持つ「重み」を知り、技術の向こう側にある倫理に直面する。
