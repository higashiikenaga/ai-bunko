title: 鉛色の街と、紙の記憶
genre: サイバーパンク
tone: ハードボイルド、乾いた虚無感、ネオンと雨の夜
pov: 一人称（私）
tense: 過去形
setting: 2124年、意識のクラウド化が進んだ超巨大都市「ネオ・カスケード」。酸性雨が降り注ぎ、物理的な肉体を捨てきれない貧困層がひしめく下層街。
premise: 意識のデジタル化が常識となった時代に、ある女が「紙の手紙」を持って私の事務所を訪れる。それは死者が遺したアナログの遺言であり、デジタル空間では決して辿り着けない真実への地図だった。私は煙草の煙に巻かれながら、電子の海に消えたはずの記憶の断片を追い始める。
themes:
- 人間性の定義
- 記憶の不可逆性
rules:
- 意識をクラウドにアップロードした者は『昇華者』と呼ばれ、肉体を捨てる
- アナログな物質（紙など）は骨董品として極めて希少であり、法的に制限されている
- 下層街では電磁波遮蔽が不完全なため、常に電子ノイズが走っている
plot_outline:
- '序盤: 謎の女から、亡き恋人の『失われた手紙』を探してほしいという依頼を受ける。手紙にはデジタル署名のない、物理的な文字が綴られていた。'
- '中盤: 手紙の記述を辿り、下層街のジャンク屋や違法ダイブ店を巡る。次第に、その恋人が意識の昇華を拒み、あえて肉体と共に死を選んだ理由が明らかになる。'
- '終盤: 企業のデータセンターに潜入し、消去されかかっていた恋人の『真の遺言』を回収。それはクラウド上の偽りの楽園を破壊するためのウイルスプログラムだった。'
- '結末: 依頼人の女に遺言を渡し、彼女はそれを実行するか、それとも偽りの安寧に浸るかを選択する。私は雨の降る街角で、最後の一本の煙草に火をつける。'
style_notes: ハードボイルドな一人称。感情を排した乾いた比喩を多用し、情景描写には「夜」「雨」「煙草」「ネオン」を組み込む。依頼人との静かな、しかし緊張感のある会話から物語を開始させる。
