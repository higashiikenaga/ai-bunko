- name: 海崎 蓮
  role: 主人公
  age: 16
  gender: 男性
  appearance: 日に焼けた肌に、少し影のある黒髪。左首筋に小さな古いアザがある。常に父の形見である秒針の取れた懐中時計をポケットに忍ばせている。
  personality: 普段は無口で物静か。内に強い執着心を秘めた頑固な性格。一人称は「俺」。
  speech_style: ボソボソと短く話すが、意志表示の時はハッキリとした口調になる。「……動かすんだ、あの時を」が口癖。
  background: 海底遺跡の調査中に事故で父を亡くし、それ以来止まった時間の中で生きているように心を閉ざしていた。
  motivation: 父が消息を絶った海底遺跡の最深部で水中レースの最速記録を出し、過去の呪縛から解放されること。
  relationships:
  - name: 潮見 ナギ
    relation: 相棒・指導者
  - name: 海崎 宗一
    relation: 亡き父親
  arc: ナギとの出会いや過酷なレースを通じて、止まっていた心臓と懐中時計のリズムを取り戻し、未来へ向けて泳ぎ出す。
- name: 潮見 ナギ
  role: 相棒
  age: 16
  gender: 女性
  appearance: 透き通るような白肌に、海を映したような深い青色のショートヘア。鍛え上げられたしなやかな筋肉を持つ。
  personality: 誇り高く、妥協を許さない孤高の天才少女。負けず嫌いで口より先に行動するタイプ。一人称は「私（わたし）」。
  speech_style: 勝気で歯に衣着せぬ物言い。「遅い。呼吸の音が乱れてるわよ」など、相手を鼓舞する鋭い口調。
  background: 潮凪島のダイビング一族の末裔でありながら、過去の因縁から孤立していた。海底迷宮の構造を誰よりも熟知している。
  motivation: 廃れた島と水中レースをもう一度蘇らせ、自身のダイビングの天才性を証明すること。
  relationships:
  - name: 海崎 蓮
    relation: バディ・レースの相棒
  arc: 他者を拒絶していたが、蓮とバディを組むことで仲間を信頼する喜びを知り、共に深淵の限界へ挑むようになる。
- name: 御堂 迅
  role: 敵役
  age: 17
  gender: 男性
  appearance: 鋭い三白眼に、完璧に手入れされた最新のダイビングスーツ。常に余裕のある笑みを浮かべている。
  personality: 合理的かつ冷徹。勝利のためには手段を選ばないが、強者に対するリスペクトは忘れない。一人称は「僕」または「俺」。
  speech_style: 知的で皮肉屋なトーン。「せいぜい溺れないようにあがくんだね」と相手を挑発する。
  background: 本土の巨大資本のバックアップを受けるエリートダイバー。潮凪島の海底遺跡の独占を狙っている。
  motivation: 圧倒的な資金力と最新技術で水中レースのタイトルを総ナメにし、遺跡の利権を手に入れること。
  relationships:
  - name: 海崎 蓮
    relation: ライバル
  arc: 効率と最新機材を過信していたが、蓮とナギの命を削るような純粋な情熱とスピードの前に敗北し、価値観を揺るがされる。
- name: 海崎 宗一
  role: 脇役
  age: 42
  gender: 男性
  appearance: 日焼けして深いシワの刻まれた顔に、温和で人懐っこい笑顔。頑丈な手をしている。（故人回想での登場）
  personality: 海を愛し、ロマンを追い求める冒険家気質。誰からも慕われる優しい父親。一人称は「私」または「パパ」。
  speech_style: 包み込むような穏やかな声。「時間は止まらねぇよ、蓮。いつだって僕らが動かすんだ」が遺した言葉。
  background: かつて潮凪島の海底遺跡を発見した海洋学者。最深部の調査中、謎の事故により消息を絶った。
  motivation: 海底遺跡の真の姿を解き明かし、息子に海の素晴らしさを伝えること。
  relationships:
  - name: 海崎 蓮
    relation: 息子
  arc: 直接的な変化はないが、その死と遺した言葉が、蓮の心の中で永遠の羅針盤として機能し続ける。
