title: 蒼穹のブロークン・クロック
genre: スポーツ青春
tone: 疾走感、熱量、そして切なさが同居する文体
pov: 三人称
tense: 過去形
setting: 現代、海底遺跡が眠る離島・潮凪島
premise: かつて海底遺跡の発見で熱狂した島、潮凪島。少年・レンは、亡き父の形見である「壊れた懐中時計」を握りしめ、止まった時間の中で生きていた。ある日、彼は廃校となったダイビング部の跡地で、海底の迷宮を最速で駆け抜ける「水中レース」の存在を知る。命を削る無酸素のスピード。レンは、止まった時計の針を動かすため、青い深淵へとダイブする。
themes:
- 喪失と再生
- 限界への挑戦
rules:
- 水中レースは、潜水装置を使わない素潜りによるスピード競技である
- 海底遺跡の複雑な地形と水流を読み解く直感と、極限状態での呼吸制御が必須となる
plot_outline:
- '序盤: 孤独なレンが、父の遺した懐中時計と、海底遺跡での伝説のレースの記録に出会う。'
- '中盤: 孤高の天才少女・ナギと出会い、ダイビング部を再建。水底の迷宮を舞台にした過酷な特訓を開始する。'
- '終盤: 復活した水中レースの舞台は、父が消息を絶った海底遺跡の最深部。レンは極限の無酸素状態の中、迷宮の罠を突破していく。'
- '結末: 壊れた時計のリズムを指針に、レンは最速の記録を更新。過去の呪縛を振り切り、新たな未来へと泳ぎ出す。'
style_notes: テンポ重視。アクションシーンでは短文を畳みかけ、擬音に頼らず筋肉の躍動や水の抵抗、視覚的な変化で速度を表現する。会話劇でキャラクターの熱量を伝え、各話の末尾には必ず次が気になる引きを入れる。
