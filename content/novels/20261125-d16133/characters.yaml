- name: 佐伯 春子 (さえき はるこ)
  role: 主人公
  age: 75
  gender: 女性
  appearance: 白髪を丁寧にまとめ、穏やかだがどこか遠くを見つめるような寂しげな瞳を持つ老婦人。常に清潔なエプロンを身につけている。
  personality: 控えめで思慮深い。感情を露わにすることは少ないが、内面には激しい情熱を秘めている。一人称は「わたし」。
  speech_style: 丁寧で静かな語り口。言葉を選びながら、ゆっくりと話す。
  background: 海辺の町で静かに暮らしてきた。かつては空飛ぶ船に憧れる活発な少女だったが、ある夜を境に、心の一部の時間を止めてしまった。
  motivation: 古い写真と書きかけの手紙をきっかけに、蓋をしていた過去の記憶と向き合い、止まっていた自分自身の時間を再び動かすこと。
  relationships:
  - name: 蓮
    relation: かつての恋人
  - name: 美紀
    relation: 娘
  arc: 喪失感と後悔に縛られていた過去を、美しい記憶として受け入れ、穏やかな安らぎの中で未来を見つめることができるようになる。
- name: 瀬戸 蓮 (せと れん)
  role: 過去の重要人物
  age: 18
  gender: 男性
  appearance: 夏の陽光のような明るい笑顔と、意志の強さを感じさせる澄んだ瞳。少し癖のある黒髪。空飛ぶ船の乗組員のような、機能的だが清潔感のある服を着ている。
  personality: 自由奔放で冒険心にあふれ、周囲を惹きつけるカリスマ性がある。一人称は「僕」。
  speech_style: 明るく、どこか夢見がちな響きを持つ。相手の目を見て真っ直ぐに話す。
  background: 町の造船所で働きながら、巨大な空飛ぶ船に乗って未知の世界へ旅立つことを夢見ていた青年。
  motivation: 空の向こうにある新しい世界を見ること。そして、春子との約束を守ること。
  relationships:
  - name: 佐伯 春子
    relation: 幼馴染であり、大切な人
  arc: （回想の中での存在）謎の失踪者という悲劇的な影から、春子の心に消えない光を灯し続ける「約束の象徴」へと昇華される。
- name: 高木 源三 (たかぎ げんぞう)
  role: 脇役
  age: 80
  gender: 男性
  appearance: 背が低く、日焼けした肌と深い皺が刻まれた顔を持つ。長年郵便配達員を務めていた名残で、常に使い込まれた古い鞄を大切に持っている。
  personality: 寡黙で無骨だが、深い慈愛に満ちた眼差しを持つ。町の歴史を知る賢者的な存在。一人称は「私」。
  speech_style: ぶっきらぼうだが、相手を思いやる温かい方言混じりの話し方。
  background: かつて町の郵便配達員として、祭りの夜に起きた「届かなかった手紙」の真実を、罪悪感と共に抱え続けてきた老人。
  motivation: 春子が真実を知り、長年の心の澱（おり）を洗い流せるよう、静かに見守り、きっかけを与えること。
  relationships:
  - name: 佐伯 春子
    relation: 近所の知人
  - name: 瀬戸 蓮
    relation: かつての配達先
  arc: 隠し続けてきた秘密を明かすことで、自分自身の過去の重荷を下ろし、春子の心の救済を助ける。
- name: 佐伯 美紀 (さえき みき)
  role: 脇役
  age: 45
  gender: 女性
  appearance: 都会的な、仕事のできる落ち着いた女性。眼鏡をかけ、機能的でモダンな服装をしている。
  personality: 現実主義的で効率を重視するが、根は優しく、母に対して深い愛情を持っている。一人称は「私」。
  speech_style: 明快で論理的。現代的な、少し早口な話し方。
  background: 実家の片付けのために町へ戻ってきた春子の娘。母の「止まった時間」の存在に、最初は気づいていない。
  motivation: 母の生活環境を整え、穏やかな老後を送らせること。
  relationships:
  - name: 佐伯 春子
    relation: 母
  arc: 合理主義的な視点から、母が抱えていた「言葉にならない感情」の深さに触れ、一人の人間としての母を理解し、敬意を持つようになる。
