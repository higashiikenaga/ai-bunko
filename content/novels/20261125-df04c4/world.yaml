title: 忘却の墓標と、真鍮の月食譜
genre: 本格ミステリー
tone: 静謐で重厚、論理的かつ詩的なミステリー
pov: 一人称（ワトソン役の助手による観察記）
tense: 過去形
setting: 前作の崩壊を経て、情報の再構築が始まった都市の「上層階級居住区」と、蒸気機関が駆動する旧式な動力区画。
premise: 都市の真の名が「忘却の墓標」であると判明したあの日から、世界は不完全な再生を繰り返していた。ある夜、月食によって情報のレイヤーが一時的に遮断された隙を突き、動力区画の蒸気機関室で「物理的に存在しないはずの遺体」が発見される。それは前作で失われたはずの人物の、記憶の断片を組み合わせたような異形であった。九条蓮は、この不可能な死が、都市の再構築プロセスに隠された新たな「誤植」であることを直感する。
themes:
- 再構築された記憶の真正性
- 機械的な秩序と、血の通った矛盾
rules:
- 都市の再構築が進んでいるが、物理的な質量を持つものは依然として「情報の整合性」に依存する。
- 月食の発生中は、情報のレイヤー（階層）間の干渉が極端に低下し、物理現象と情報現象の境界が曖昧になる。
- 蒸気機関を用いた旧式の機械装置は、デジタルな情報制御の影響を受けにくいため、情報の書き換えを防ぐ「防壁」として機能する。
plot_outline:
- '序盤: 月食の夜、蒸気機関が唸りを上げる動力区画で、不可解な死体が発見される。遺体は、かつて存在した人物の「記述」が物理的に組み合わさったような、継ぎ接ぎの姿をしていた。九条は、現場に残された蒸気の温度変化と、月食による情報の減衰が一致することを見抜く。'
- '中盤: 事件を追う中で、九条たちは「真鍮の心臓」と呼ばれる、蒸気と情報を融合させた禁忌の装置の存在に辿り着く。神崎紫音は秩序維持のため調査を拒むが、九条は現場の「蒸気の残り香」と「消されたはずの記録」の矛盾から、犯人が情報の書き換えではなく、情報の『物理的な強制結合』を行っていると断定する。'
- '終盤: 犯人が、月食を利用して都市の設計図を「蒸気による物理的刻印」へと書き換えようとしていることが判明する。九条は、犯人が残した微細な「真鍮の削り屑」と、現場の蒸気機関の稼働記録を突き合わせ、論理的な矛盾を指摘。完璧なはずの「物理的な物語」が、たった一つの熱力学的な誤差によって崩壊していく様を、読者へと提示する。'
- '結末: 犯人の正体は、都市の再構築に失敗し、自らを蒸気機関の一部として定義せざるを得なかったかつての技術者であった。九条は、彼が望んだ「永遠の記録」ではなく、移ろいゆく「不完全な現実」こそが、人間が生きるための唯一の頁であることを告げる。月食が明け、都市は再び静かな情報の奔流へと戻っていく。'
style_notes: 神楽坂 探としての文体を徹底する。語り手は常に九条の鋭い観察眼の傍らに立ち、彼がどのようにして微かな違和感（血痕、温度、匂い、機械の音）から論理を組み立てるかを記述する。読者に対し、決して「超常現象」で解決させず、提示された物理的事実と論理的な推論のみを用いて犯人を追い詰める、公正かつ挑戦的な記述を心がける。
