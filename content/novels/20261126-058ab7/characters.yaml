- name: 八木 陽太（ハチ）
  role: 主人公
  age: 27
  gender: 男性
  appearance: 柔らかい茶色の髪に丸眼鏡。いつも清潔感のあるベージュのエプロンを身に着けている。
  personality: 穏やかで聞き上手。調和を重んじる性格。一人称は「僕」。
  speech_style: 丁寧で控えめな口調。「〜ですね」「〜だと思います」と相手を肯定する話し方。
  background: 祖父から商店街の喫茶店『日和』を継いだ店主。街の人々のささやかな日常を眺めることが好き。
  motivation: 店を訪れる人々が、心地よい時間を過ごして店を後にすること。
  relationships:
  - name: 鉄造
    relation: 常連客であり、近所のおじいちゃんのような存在
  - name: 凛
    relation: 最近常連になった、少し危うい雰囲気を持つ大学生
  arc: 他人の顔色を伺う「優しい嘘」に逃げていたが、真実を口にすることの勇気と、それでも許される安心感を知る。
- name: 佐々木 鉄造（テツ）
  role: 相棒
  age: 68
  gender: 男性
  appearance: 日焼けした肌に深い皺。使い込まれたハンチング帽がトレードマーク。
  personality: 頑固で口は悪いが、情に厚い。街の歴史に詳しい。一人称は「俺」。
  speech_style: ぶっきらぼうでぶっきらぼうな口調。「〜じゃねえか」「ふん、勝手にしろ」など。
  background: 元時計職人。今は引退し、毎日決まった時間に『日和』で濃いコーヒーを飲むのが日課。
  motivation: 変わりゆく商店街の風景を、できるだけ静かに見守ること。
  relationships:
  - name: 八木 陽太
    relation: 口うるさく指導しながらも、店主としての成長を期待している
  - name: 凛
    relation: 反抗的な態度に呆れつつも、放っておけない孫のような感覚
  arc: 過去に自分がついた「守るための嘘」が、今の街の誰かの支えになっていたことを知り、人生を肯定する。
- name: 瀬戸 凛（リン）
  role: 主人公
  age: 20
  gender: 女性
  appearance: ボブカットに大きめのパーカー。常にスケッチブックを持ち歩いている。
  personality: 内向的で皮肉屋だが、好奇心旺盛。孤独を好むふりをしている。一人称は「私」。
  speech_style: 早口で、感情が高ぶると言葉が詰まる。「……別に」「どうでもいいです」と壁を作る話し方。
  background: 美大に通う学生。人間関係に疲れ、静かなこの街に惹かれてアパートを借りて住み始めた。
  motivation: 誰にも邪魔されず、自分の本当の居場所（描きたい風景）を見つけること。
  relationships:
  - name: 八木 陽太
    relation: 唯一、気を許して本音を漏らせる相手
  - name: 佐々木 鉄造
    relation: 価値観が合わないが、不思議と心地よい距離感を感じている
  arc: 嘘をつけない状況を通じて、自分の孤独を正しく言葉にできるようになり、周囲との繋がりを受け入れる。
- name: 名もなき黒猫
  role: 導き手
  age: 0
  gender: 不明
  appearance: つややかな黒い毛並みに、首にだけ古びた銀色の鈴がついた首輪をしている。
  personality: 気まぐれでマイペース。人の心を見透かしているような不思議な眼差しを持つ。
  speech_style: 喋らない（鳴き声と仕草のみ）。
  background: 商店街を自由に歩き回る野良猫。ある日、古い写真と手紙を咥えて『日和』に現れる。
  motivation: 忘れられた記憶や想いを、然るべき人のもとへ届けること。
  relationships:
  - name: 八木 陽太
    relation: おやつをくれる都合の良い人間
  arc: 人々が真実に向き合うきっかけを作り、街に調和が戻ったところで再び自由な旅に出る。
