title: 真昼の雨と、銀の鈴の音
genre: 群像劇
tone: 穏やかで、どこか懐かしい日常ミステリー
pov: 三人称（あだ名による呼称）
tense: 過去形
setting: 現代、坂道の多い古い商店街にある『喫茶・日和（ひより）』周辺
premise: 商店街の片隅にある喫茶店を舞台に、不思議な現象に巻き込まれた人々が交差する。ある日、店に居合わせた人々が「嘘をつけない呪い」にかけられたかのように、隠していた小さな秘密を口にし始める。名前のない猫が運んできた一枚の古い写真が、街に隠された優しい誤解を解き明かしていく。誰も傷つかない解決を目指す、日常の小さなしあわせの物語。
themes:
- 言葉の誠実さ
- 他者への理解
rules:
- 呪いは悪意ある嘘を封じるが、優しい隠し事までは奪わない
- 謎の解決には、直接的な対立ではなく観察と対話が必要である
plot_outline:
- '序盤: 喫茶店『日和』に集まる、ハチ、テツ、リンといった常連客たちが、突然嘘をつけなくなる不思議な現象に気づく。'
- '中盤: 街の広場で見つかった『名前のない猫』が、誰かが落としたはずの、名前が書かれていない古い手紙を咥えて現れる。各自が自分の『小さな嘘』と向き合いながら、手紙の持ち主を探す。'
- '終盤: 手紙の主が、かつてこの街で誰かを守るために優しい嘘をついていたことが、ハチたちの些細な観察眼によって判明する。'
- '結末: 呪いが解け、街には再び嘘と真実が混ざり合う日常が戻る。猫はまた、誰かの足元で丸くなっている。'
style_notes: 三人称視点で、登場人物は「ハチ」「テツ」のようにあだ名で呼び合う。会話のテンポを重視し、事件の解決は犯人探しのような攻撃的なものではなく、お互いの心の機微を読み解くような、温かく優しい筆致で描く。
