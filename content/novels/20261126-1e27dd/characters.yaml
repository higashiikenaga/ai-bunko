- name: 紬 陽葵
  role: 主人公
  age: 28
  gender: 女性
  appearance: 柔らかい質感のカーディガンを好み、常に清潔感のあるエプロンを着用している。穏やかで聞き上手そうな瞳をしている。
  personality: 思慮深く、静かな時間を愛する。持ち主のいない遺物に物語を感じ取る感受性が強い。一人称は「私」。
  speech_style: 丁寧で落ち着いた敬語。相手のペースに合わせた、ゆったりとした話し方。
  background: 祖父から古本屋『ことこと』を継いだ。本に挟まった栞やメモを「誰かの記憶の断片」として大切に扱う習慣がある。
  motivation: 本に遺された「小さな記憶」を整理し、それが本来あるべき場所へ届く手助けをしたい。
  relationships:
  - name: 佐伯 誠一
    relation: 日記の持ち主であり、物語のきっかけを与える老人
  - name: 江藤 佳代
    relation: かつての想い人であり、調査の対象となる女性
  arc: ただ本に付随する記憶を整理する「観察者」から、人の縁を繋ぎ直す「媒介者」へと成長する。
- name: 佐伯 誠一
  role: 鍵となる人物
  age: 82
  gender: 男性
  appearance: 背は少し丸まっているが、背筋を伸ばして座る癖がある。深く刻まれた皺が、これまでの人生の重みを感じさせる。
  personality: 口数は少ないが、誠実で不器用。過去の出来事をずっと心に抱え続けている。一人称は「自分」。
  speech_style: 少し古風な言い回し。言葉を選ぶように、ゆっくりと一言ずつ話す。
  background: かつて「消えた村」に住んでいた。若い頃、ある女性を守るためについた「不器用な嘘」が、現在の孤独の遠因となっている。
  motivation: 長年、胸に仕舞い込んできた「届かなかった言葉」を、せめて形だけでも整理したい。
  relationships:
  - name: 紬 陽葵
    relation: 自分の記憶を紐解いてくれる店主
  - name: 江藤 佳代
    relation: かつての想い人、そして誤解の対象となった女性
  arc: 長年の後悔と向き合い、嘘ではなく真実の優しさを伝えることで、心の重荷を下ろしていく。
- name: 江藤 佳代
  role: 脇役/物語の核心
  age: 79
  gender: 女性
  appearance: 上品な着物やスカーフを好む。穏やかな微笑みを絶やさず、周囲を和ませるオーラがある。
  personality: 聡明で、物事の本質を見抜く優しさを持つ。一人称は「私」。
  speech_style: 明るく、響きの良い丁寧な話し方。相手を否定しない包容力のある口調。
  background: 地域の古老として慕われている。かつて村の祭りの夜、佐伯が言った言葉を「優しい誤解」として受け止めていた。
  motivation: 過去の出来事を、悲劇ではなく、懐かしい思い出として昇華させること。
  relationships:
  - name: 佐伯 誠一
    relation: かつての想い人
  - name: 紬 陽葵
    relation: 若くして本を大切にする、信頼できる店主
  arc: すれ違ったままの記憶を、陽葵の手によって「美しい再会」へと変え、過去を肯定する。
- name: 蓮見 湊
  role: 相棒/情報提供者
  age: 24
  gender: 男性
  appearance: 軽装でカメラを常に持ち歩いている。少し癖のある髪型で、活動的な印象を与える。
  personality: 好奇心旺盛でフットワークが軽い。陽葵の静かな世界に、適度な活気をもたらす。一人称は「僕」。
  speech_style: 明るく快活。敬語ではあるが、少し親しみやすさを込めたフレンドリーな話し方。
  background: 地元の風景を撮っているフリーランスのカメラマン。古本屋『ことこと』の常連であり、町の噂話に詳しい。
  motivation: 町の隠れた魅力や、人々の表情の裏にある物語を見つけること。
  relationships:
  - name: 紬 陽葵
    relation: 尊敬する店主であり、協力者
  arc: 単に「美しい瞬間」を撮るだけでなく、その背後にある「人の想い」の重要性に気づく。
