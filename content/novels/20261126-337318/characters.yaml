- name: カイ・レン
  role: 主人公
  age: 16
  gender: 男性
  appearance: 鋭い目つきだがどこか寂しげな瞳。風に煽られやすい、細身だが引き締まった体躯。スカイ・ボール用の軽量なウェアを着用。
  personality: 真面目で一本気。嘘をつけない自分に強い劣等感を抱いている。一人称は「僕」。
  speech_style: 丁寧で落ち着いているが、感情が昂ると言葉がストレートに、熱を帯びる。
  background: 元エリートアカデミーの候補生。戦術的なブラフを強要される競技スタイルに馴染めず、除籍された過去を持つ。
  motivation: 「嘘をつかなくても、真っ直ぐな意志だけで頂点に立てる」ことを証明すること。
  relationships:
  - name: ゼノ・ヴァルガス
    relation: 監督であり、初めて自分を認めてくれた師。
  - name: アルト・フォン・エデルシュタイン
    relation: かつての同級生であり、現在の最大の壁となる宿敵。
  arc: 「嘘をつけない欠点」を、仲間との「剥き出しの信頼」へと転換させ、自己肯定感を取り戻す。
- name: ゼノ・ヴァルガス
  role: 監督
  age: 38
  gender: 男性
  appearance: 無精髭にボロボロの飛行ジャケット。片目に古いゴーグルをかけている。常に飄々とした態度。
  personality: 型破りで予測不能。周囲からは「はみ出し者の集まり」と揶揄されるが、本質を見抜く鋭い眼光を持つ。一人称は「俺」。
  speech_style: 冗談めかした言い回しが多いが、勝負の局面では重みのある言葉を放つ。
  background: かつては伝説的なスカイ・ボール選手だったが、ある事件をきっかけに競技界を去り、現在は浮遊島の片隅で弱小チームを率いている。
  motivation: 既存のシステムに囚われない、新しいスカイ・ボールの在り方を示すこと。
  relationships:
  - name: カイ・レン
    relation: 才能を見出し、チームの核として導く教え子。
  arc: 過去の挫折を乗り越え、再び空の熱狂を信じる強さをレンたちから受け取る。
- name: アルト・フォン・エデルシュタイン
  role: 敵役
  age: 17
  gender: 男性
  appearance: 完璧に整えられた銀髪。最高級の特注制服を纏い、常に冷静沈着な表情を崩さないエリート然とした容姿。
  personality: 冷徹で計算高い。勝利のためなら完璧な心理戦（ブラフ）を駆使する。一人称は「僕」。
  speech_style: 優雅で上品だが、相手を格下として扱うような、隙のない話し方。
  background: 王立スカイ・アカデミーの絶対的エース。次世代の頂点として、徹底した戦術教育を受けて育った。
  motivation: スカイ・ボールにおける「完璧な秩序と勝利」の体現。
  relationships:
  - name: カイ・レン
    relation: 理解不能な動きをする、排除すべき異分子。
  arc: レンたちの「予測不能な真実の連携」に直面し、自身の完璧な計算が崩れる恐怖と戦う。
- name: ミア・スカイウォーカー
  role: 相棒/チームメイト
  age: 16
  gender: 女性
  appearance: 短く切り揃えられた赤髪。動きやすさを重視したメカニック風のウェア。常に工具やグローブを身につけている。
  personality: 直感的で情熱的。嘘嫌いのレンに最も早く共感し、ムードメーカーとなる。一人称は「あたし」。
  speech_style: ハキハキとしていて、語尾が強く、元気な話し方。
  background: 浮遊島の整備士の娘。卓越した機体操作技術を持つが、型にハマらないプレイスタイルゆえに正規チームから外されている。
  motivation: 自分の技術を、誰にも縛られずに空の限界まで試すこと。
  relationships:
  - name: カイ・レン
    relation: 共に戦い、互いの技術を信じ合う戦友。
  - name: ゼノ・ヴァルガス
    relation: 居場所を与えてくれた恩人。
  arc: 個人の技術を誇示する段階から、レンのパスを最大限に活かすための「チームとしての動き」を習得する。
