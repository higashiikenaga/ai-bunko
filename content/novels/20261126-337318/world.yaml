title: 烈風のストライク・ルート
genre: スポーツ青春
tone: 熱血・疾走感・泥臭い
pov: 三人称
tense: 基本過去形（試合中は現在形）
setting: 浮遊島と空飛ぶ船が交通手段である近未来の空界
premise: 空飛ぶ船をピッチにする超高速球技「スカイ・ボール」に情熱を燃やす少年レン。彼は「嘘をつけない呪い」により、戦略的なブラフやフェイントが不可欠なこの競技で、チームメイトから信頼を得られず挫折していた。しかし、居場所のないはみ出し者たちが集まる弱小チームと出会い、彼は「真実」こそが最強の武器になることを証明しようとする。
themes:
- 誠実さと信頼
- 劣等感の克服
rules:
- スカイ・ボールは時速100km以上で飛行する船の上で展開される激しい球技である
- 「嘘をつけない呪い」にかかった者は、意図的に嘘をつこうとすると激しい呼吸困難に陥り、身体が拒絶反応を起こす
- 試合の勝敗は、相手船のゴール地点にボールを叩き込んだ回数で決まる
plot_outline:
- '序盤: 嘘をつけないため「策を練れない奴」と疎まれ、ベンチ外に甘んじていたレンが、型破りな監督率いる底辺チームに勧誘される。'
- '中盤: 個性の強すぎるメンバーとの衝突と結束。強豪校の巧妙なブラフに翻弄され、完敗を喫する。敗者の絶望と悔しさを深く描き、そこから「嘘に頼らない、剥き出しの信頼」による連携を模索し始める。'
- '終盤: 全日本学生選手権決勝。絶対王者であるエリート校を相手に、嘘のない真っ直ぐなパス回しと、心拍数を限界まで上げた猛攻を仕掛ける。'
- '結末: 劇的な逆転勝利。呪いは消えないが、レンは「嘘をつかなくていい強さ」を手に入れ、仲間と共に空の頂点へと駆け上がる。'
style_notes: 試合描写は現在形で、心拍数や汗の飛沫、荒い息づかいを強調した実況風の文体とする。短文を畳み掛け、読者の鼓動を高める。必ず一度は敗者の視点を描き、勝利の残酷さと価値を際立たせる。
