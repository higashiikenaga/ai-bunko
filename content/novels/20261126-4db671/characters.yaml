- name: 冴木 蓮
  role: 主人公（真犯人）
  age: 26
  gender: 男性
  appearance: 細身で控えめな佇まい。知的な印象を与える眼鏡をかけており、常に穏やかな微笑を浮かべている。
  personality: 冷静沈着で観察眼に優れた青年。外面は謙虚で善良だが、内面は極めて冷酷で支配欲が強い。一人称は「僕」。
  speech_style: 丁寧で物腰柔らかい敬語。相手を立てながら、さりげなく誘導する話し方。
  background: 資産家である祖父の孫。親族の中で最も目立たず、周囲から「おとなしい良い子」として信頼されていた。
  motivation: 遺言書を破棄し、全ての遺産を独占すること。また、自分を軽んじていた親族たちが疑心暗鬼に陥り、自滅する様を特等席で鑑賞すること。
  relationships:
  - name: 九条 結衣
    relation: 知的な駆け引きを繰り広げるライバル
  - name: 冴木 剛志
    relation: 利用価値のある愚かな親族
  - name: 冴木 栞
    relation: 庇護者を装って操る対象
  arc: 完璧な傍観者を演じ切ろうとするが、月蝕の夜に提示された客観的事実により、積み上げた嘘が崩壊し、正体を暴かれる。
- name: 九条 結衣
  role: 敵役（探偵役）
  age: 32
  gender: 女性
  appearance: 鋭い眼差しと理知的な顔立ち。隙のないビジネススーツを纏い、髪をタイトにまとめている。
  personality: 論理至上主義で妥協を許さない性格。人の善意を信じず、行動と証拠のみを信じる。一人称は「私」。
  speech_style: 簡潔で断定的。相手の矛盾を突く鋭い問いかけが多い。
  background: 祖父が信頼していた有能な弁護士。遺言書の管理を任されていたため、消失事件の責任を問われる立場にある。
  motivation: 消失した遺言書を回収し、法的な手続きを完遂させること。邸宅内に潜む「不自然な違和感」の正体を突き止めること。
  relationships:
  - name: 冴木 蓮
    relation: 不自然に善良すぎる彼に強い警戒心を抱いている
  - name: 冴木 剛志
    relation: 軽蔑すべき欲深い親族
  arc: 蓮の巧妙なミスリードに翻弄されるが、最終的に彼が提示した「完璧な情景描写」の論理的矛盾を突き、真実に到達する。
- name: 冴木 剛志
  role: 脇役（容疑者）
  age: 48
  gender: 男性
  appearance: 恰幅が良く、高価だがサイズが合っていないスーツを着ている。常に顔が赤らんでいる。
  personality: 強欲で短気。権威に弱く、自分の利益のためなら平気で嘘をつく。一人称は「俺」。
  speech_style: 粗野で声が大きく、相手を威圧するような口調。
  background: 資産家の長男。事業に失敗し多額の借金を抱えており、遺産による救済を唯一の希望としている。
  motivation: 何としても遺言書の内容を自分に有利なものに書き換えるか、あるいは破棄して法定相続分を確保すること。
  relationships:
  - name: 冴木 蓮
    relation: 便利に使える親戚だと思って甘く見ている
  - name: 九条 結衣
    relation: 自分の思い通りにならないため、敵視している
  arc: 蓮に誘導されて犯人仕立てにされ、パニックに陥って自暴自棄な行動に出ることで、物語の混乱を加速させる。
- name: 冴木 栞
  role: 脇役（目撃者）
  age: 22
  gender: 女性
  appearance: 儚げで色白。長い黒髪を垂らし、どこか現実離れした浮遊感のある雰囲気。
  personality: 内向的で臆病だが、直感力が鋭い。周囲の空気に敏感で、違和感を察知しやすい。一人称は「私」。
  speech_style: おどおどとしていて、語尾が消え入るように消える話し方。
  background: 親族の娘。幼少期から孤独で、家族の中で居場所がなく、祖父にだけは懐いていた。
  motivation: 争いを避け、平穏にこの邸宅を去ること。信じられる誰かを見つけること。
  relationships:
  - name: 冴木 蓮
    relation: 唯一優しく接してくれる兄のような存在として信頼している
  - name: 冴木 剛志
    relation: 恐怖の対象
  arc: 蓮への盲信から、彼にとって都合の悪い「些細な目撃証言」を口にする。それが結果として蓮の完璧なアリバイを崩す決定打となる。
