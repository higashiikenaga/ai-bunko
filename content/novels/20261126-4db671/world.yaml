title: 赤銅の月蝕と、空白の遺言
genre: 本格ミステリー
tone: 閉鎖的で不穏な心理サスペンス
pov: 一人称
tense: 過去形
setting: 現代、人里離れた山中に佇む古い洋館
premise: 莫大な遺産を遺した資産家の死後、親族たちが集まった閉鎖的な洋館で、不可解な「遺言書消失事件」が発生する。語り手である私は、親族たちの間に渦巻く疑念を冷静に観察する「善良な傍観者」として振る舞う。しかし、月蝕が空を赤く染め、世界が闇に包まれる時、私が信じていた景色は音を立てて崩れ始める。
themes:
- 記憶の捏造
- 自己欺瞞
rules:
- 月蝕の進行が物語の緊張感とタイムリミットとして機能する
- 語り手の主観的な描写には、彼の精神的歪みに由来する微かな色彩の違和感が混入している
- 事件の解決は、語り手の認識の欠落を埋めることによってのみ成立する
plot_outline:
- '序盤: 祖父の死と、遺言書を巡る親族間の対立。語り手は、親族たちの醜い欲望を淡々と記述する。冒頭、『あの夜、月は完璧に円い、慈愛に満ちた形をしていた』という、何の変哲もない情景描写が提示される。'
- '中盤: 密室状態の書斎から遺言書が消える。月蝕が近づくにつれ、邸宅内の空気は重苦しくなり、語り手は『正体不明の犯人』の影を追う。親族たちが疑心暗鬼に陥り、自滅していく過程が描かれる。'
- '終盤: 月蝕が最大に達し、世界が赤銅色に染まる中、語り手はついに『犯人』を追い詰める。しかし、追い詰めた相手の証言と、語り手がこれまで見てきた光景が、物理的・論理的に致命的な矛盾を見せ始める。'
- '結末: 語り手こそが、遺言書を破棄し、祖父を殺害した真犯人であったことが判明する。冒頭の『完璧に円い月』は、彼が自身の罪を覆い隠そうとした、欠落のない『完璧な嘘』、あるいは月蝕によって失われた『真実の欠落』を暗示していたことが明かされる。'
style_notes: 語り手の信頼性を、読者が気づかない程度の微細な違和感（色の描写の矛盾や、存在しないはずの音など）によって段階的に剥奪していく。文体は、美しく冷徹な一人称を用いる。結末において、物語の冒頭に置いた何気ない一文の意味を、物語の文脈を反転させることで全く別の意味へと変容させる。
