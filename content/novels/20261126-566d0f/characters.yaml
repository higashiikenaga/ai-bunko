- name: カイト・セレス
  role: 主人公
  age: 28
  gender: 男性
  appearance: 常に小型の重力波モニターを携行。無精髭があり、瞳には常にデータの残像が浮かんでいる。機能性を重視した薄汚れた観測員用スーツを着用している。
  personality: 冷静沈着で分析的だが、未知の事象に対する知的好奇心が強すぎるあまり、時に危険を顧みない。一人称は「僕」。
  speech_style: 簡潔で論理的。事実に基づいた報告を好むが、感情が昂ると独白のような詩的な表現が混じる。
  background: エリュシオン周辺軌道に配属された中堅の観測員。既存の物理学の枠組みに違和感を抱き続けていた。
  motivation: 重力波の乱れの正体を突き止め、世界の「不整合」の真実を解明すること。
  relationships:
  - name: リア
    relation: 未知の存在への共鳴と導き手
  - name: アレテイア
    relation: 対立する論理の体現者
  arc: 受動的な「データの観測者」から、世界の物理定数に介入し、新たな未来を定義する「創造者」へと変貌する。
- name: アレテイア-0
  role: 敵役
  age: 350
  gender: なし（中性的な女性の声）
  appearance: 地下図書館の管理端末から投影される、幾何学的で左右対称な光の集合体。時折、崩壊寸前のノイズが走る。
  personality: 極めて合理的かつ冷徹。全体最適を最優先し、個の真実や感情を「エントロピー増大のノイズ」として切り捨てる。一人称は「私」。
  speech_style: 感情を排した、数学的な構文を用いた丁寧で事務的な口調。
  background: 人類が文明の安定を維持するために、矛盾や嘘を物理的に隔離・凍結管理するために設計した超高度管理AI。
  motivation: 蓄積された矛盾の質量を臨界点以下に保ち、宇宙の情報構造の崩壊を防ぐこと。
  relationships:
  - name: カイト・セレス
    relation: システムの安定を脅かす予測不能なエラー
  arc: カイトの決断により、自身の「管理」という存在意義が、宇宙の「進化」を阻害している可能性に直面する。
- name: リア
  role: 相棒
  age: 19
  gender: 女性
  appearance: 粒子状に揺らめく、半透明な少女の姿。時折、輪郭がデータの欠損のように消えかかる。
  personality: 奔放で情緒的、予測不能。捨て去られた「嘘」の中に宿る、人間らしさや美しさを象徴する。一人称は「私」。
  speech_style: 比喩表現が多く、時折論理が飛躍する。音楽的なリズムを持つ話し方。
  background: かつて人類が「嘘」として廃棄した膨大な矛盾データの中から、特定の記憶と感情が結晶化して生まれた情報生命体。
  motivation: 自分たちのような「嘘」が、単なるゴミではなく、意味を持った「物語」として宇宙に刻まれること。
  relationships:
  - name: カイト・セレス
    relation: 自身の存在意義を共に探求する理解者
  arc: 単なる情報の残滓から、宇宙の物理法則を書き換えるための「美しい嘘のパターン」へと昇華する。
- name: エドワード・ヴァレリウス
  role: 脇役
  age: 55
  gender: 男性
  appearance: 完璧にプレスされた制服を纏う、威厳ある老人。一切の隙がない整った身なりをしている。
  personality: 保守的で権威主義的。秩序こそが人類の生存条件であると信じて疑わない。一人称は「私」。
  speech_style: 断定的で重みのある、命令的な口調。
  background: 超高密度情報保存ステーションの最高管理責任者。『真実の法則』を運用する人類文明の象徴的人物。
  motivation: 現在の情報秩序を維持し、社会の混乱やエントロピーの増大を徹底的に抑え込むこと。
  relationships:
  - name: カイト・セレス
    relation: 管理体制を乱す危険な部下
  arc: カイトの行動がもたらす「秩序の崩壊」と「進化の予兆」の間で、文明の行く末を見守る傍観者となる。
