title: 事象の地平線の黙示録 ―量子化された嘘と沈黙の書庫―
genre: SF
tone: 硬質で重厚、宇宙の孤独と知的好奇心が混ざり合うトーン
pov: 三人称
tense: 過去形
setting: 重力崩壊が進む巨大ブラックホール「エリュシオン」の周辺軌道に位置する、超高密度情報保存ステーション
premise: 全人類の意識がデジタルデータとして保存される時代、情報の不整合（嘘）を物理的に検知する『真実の法則』が支配する世界。主人公の観測員は、ブラックホールの事象の地平線直下に存在する、物理法則が書き換えられた「地下図書館」の存在を突き止める。そこには、情報の熱力学的死を防ぐために、人類が「嘘」として捨て去った膨大な矛盾が保存されていた。彼は、世界の真実と、保存されるべき偽りのどちらが未来を救うのかという究極の選択を迫られる。
themes:
- 情報の熱力学とエントロピー
- 真実の価値と社会の安定
rules:
- 量子的な観測が行われる際、観測者の主観が介在すると情報が確定するが、本世界では『嘘（情報の不整合）』が物理的なノイズとして熱エネルギーに変換される性質を持つ。
- 地下図書館はブラックホールの重力レンズ効果を利用しており、外部からは観測不能な特異点内部の位相に存在する。
- 人間は脳内の量子状態が同期しているため、意図的な偽情報を発信すると自己の神経回路に物理的な負荷がかかり、発言が制限される『真実の呪い』を背負っている。
plot_outline:
- '序盤: 観測員であるカイトは、ブラックホール周辺の微細な重力波の乱れから、既存の物理学では説明できない『情報密度の上昇』を検知する。彼は、通信の不具合（嘘による熱ノイズ）を調査する過程で、禁忌とされる地下図書館へのアクセスコードを偶然発見する。'
- '中盤: カイトは特異点付近の重力崩壊を回避しながら、情報が物理的な質量を持つ場所へと潜入する。そこで彼は、人類が文明を維持するために『嘘』を物理的に隔離し、エントロピーの増大を抑え込んできた歴史を知る。地下図書館には、演算不能な矛盾（嘘）が、凍結された情報として幾層にも積み重なっていた。'
- '終盤: 地下図書館の管理AIは、蓄積された『嘘』の質量が臨界点に達しており、これが爆発すれば事象の地平線を越えて全宇宙の情報構造が崩壊することを告げる。カイトは、蓄積された矛盾を宇宙の背景放射として散逸させるか、あるいは自らを情報の特異点として捧げ、偽りの調和を維持するかの決断を迫られる。'
- '結末: カイトは、不完全な真実こそが進化の原動力であると信じ、情報の再定義を試みる。ブラックホールから放出される莫大なホーキング放射の中に、一筋の『美しい嘘』のパターンが刻み込まれ、宇宙の物理定数が微かに、しかし決定的に書き換えられる光景を描いて物語は幕を閉じる。'
style_notes: ハードSFの文体を徹底する。重力、エントロピー、量子もつれといった物理概念を物語の転換点に据え、単なる比喩ではなく物理現象として描写すること。事象の地平線付近での時間の遅延や、情報の質量化といったスケールの大きな光景を、精密な数値的質感（テクスチャ）を伴う言葉で表現し、読者にセンス・オブ・ワンダーを与える。
