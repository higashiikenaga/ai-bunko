- name: エリス・ソーン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 少し癖のある茶髪に、額に掛けた真鍮製のゴーグル。多くの記録帳を詰め込んだ使い古しの革製コートを着用している。
  personality: 好奇心旺盛で内向的。静かに物語に耳を傾けることを好む。一人称は「僕」。
  speech_style: 丁寧だが、どこか夢想的な話し方。独り言が多い。
  background: 浮遊都市の片隅で古書に囲まれて育った記録蒐集家。小さな蒸気船を操り、忘れ去られた歴史や伝承を書き留める旅を続けている。
  motivation: 地図から消えた「雲隠れの村」の真実を突き止め、その記憶を記録に残したい。
  relationships:
  - name: クララ・ヴェイン
    relation: 航海を共にする信頼できるメカニック
  - name: ジュリアン・ヴァレリウス
    relation: 対照的な価値観を持つライバル
  arc: 単なる「記録者」という傍観者の立場から、記憶を繋ぎ止めることで誰かを救う「当事者」へと成長する。
- name: クララ・ヴェイン
  role: 相棒
  age: 19
  gender: 女性
  appearance: 短く切りそろえた銀髪。頬に常にオイルの汚れがついている。オーバーサイズのエンジニア jumpsuitを着用。
  personality: 快活で現実主義。機械のことになると早口になる情熱家。一人称は「私」。
  speech_style: ハキハキとした口調。専門用語を混ぜたぶっきらぼうな言い方をする。
  background: 港町のジャンク屋出身の天才メカニック。エリスの船の整備を請け負ううちに、彼の旅に興味を持ち同行することになった。
  motivation: 未知の領域にある未知の技術や、伝説の蒸気機関の仕組みを解明したい。
  relationships:
  - name: エリス・ソーン
    relation: 危なっかしい彼をサポートする保護者的な相棒
  arc: 効率や数値だけが正解ではなく、目に見えない「記憶」や「感情」が世界を動かすことがあると気づく。
- name: オリエル師
  role: 案内役/鍵となる人物
  age: 65
  gender: 男性
  appearance: 雲のようにふんわりとした白いローブを纏い、巨大な真鍮の国杓（くにしゃく）を杖代わりに持っている。
  personality: 飄々としていて掴みどころがない。料理と詩を愛する。一人称は「私」。
  speech_style: 比喩表現が多く、謎かけのような言い回しを好む。
  background: 「雲隠れの村」の唯一の生き残りであり、村の記憶を料理のレシピとして守り続けてきた番人。
  motivation: 村の記憶を正しく綴り継いでくれる後継者（記録者）を探していた。
  relationships:
  - name: エリス・ソーン
    relation: 自らの記憶を託すべき継承者
  arc: 孤独に守り続けてきた記憶をエリスに託すことで、ようやく自分自身も静かに記憶の海へ還る準備が整う。
- name: ジュリアン・ヴァレリウス
  role: 敵役/ライバル
  age: 28
  gender: 男性
  appearance: 隙のない黒い軍服にモノクルを着用。常に最新鋭の高精度な測量機器を携帯している。
  personality: 傲慢で完璧主義。世界をすべて数値化し、地図に収めることに執着している。一人称は「私」。
  speech_style: 理知的で冷徹。相手を見下すような慇懃無礼な話し方。
  background: 帝国地図局の若きエリート。存在しないはずの村を「発見」し、地図に書き込むことで自身の功績と権力を得ようとしている。
  motivation: 「未知」を排除し、すべてを支配可能な「既知」に変えること。
  relationships:
  - name: エリス・ソーン
    relation: 非効率な旅を続けるエリスを軽蔑しつつも、その直感に苛立ちを感じている
  arc: すべてを定義し管理しようとする傲慢さが崩れ、定義できない「喪失」や「切なさ」という感情に直面する。
