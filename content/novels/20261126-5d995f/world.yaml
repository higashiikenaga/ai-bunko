title: 真鍮の風と、記憶を綴る地図
genre: スチームパンク冒険
tone: 穏やかで詩的、旅情あふれるノスタルジー
pov: 一人称（僕）
tense: 過去形
setting: 蒸気機関と浮遊島が共存する、雲海に覆われた世界。空飛ぶ蒸気船が主要な移動手段となっている。
premise: 僕は小さな蒸気船で各地を巡り、失われた物語を蒐集する旅人だ。ある日、地図から忽然と消えたはずの「雲隠れの村」の記録が、古い古本屋の片隅で見つかる。その本には、村の住人が愛した料理のレシピと、風に溶けたはずの記憶が記されていた。僕はその謎を解くため、真鍮の羅針盤を手に、雲の切れ間に隠された真実を探す旅に出る。
themes:
- 忘却と記憶
- 旅による自己発見
- 失われたものへの敬意
rules:
- 蒸気機関は高度な圧力制御を必要とし、空の安定に不可欠である
- 地図に記されない場所は、雲の性質によって物理的に観測不能になる
- 古い書籍には、その土地の精霊や文化が魔力（蒸気）となって宿ることがある
plot_outline:
- '序盤: 浮遊都市の古本屋で、地図にない村の断片を見つけ、旅の目的を定める。初めて訪れる港町で、熱い蒸気スープを啜りながら準備を進める。'
- '中盤: 雲海の嵐を抜け、伝説の「消えた村」へと近づく。各地の風習や、空飛ぶ魚を使った料理に触れながら、村の消失にまつわる不可解な現象に直面する。'
- '終盤: 村が消えたのは、物理的な移動ではなく「人々の記憶」から零れ落ちたためだと知る。真鍮の羅針盤を使い、記憶の層を突き抜けて村の核心部へ到達する。'
- '結末: 村の住人と再会し、彼らが守り続けてきた文化を記録する。僕は再び、次の物語を求めて雲海へと船を出す。'
style_notes: 灯守ルカとしての筆致を徹底する。風景描写には、真鍮の光沢や蒸気の匂い、雲の質感など五感を刺激する表現を用いる。一人称「僕」による、旅日記のような穏やかで情緒的な語り口。各章の冒頭や要所で、訪れた土地の独特な料理や、その土地ならではの温かな風習を丁寧に描写し、読者が共に旅をしている感覚を与えること。
