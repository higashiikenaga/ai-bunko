- name: カイ・ゼノン
  role: 主人公
  age: 21
  gender: 男性
  appearance: 痩身で機敏な体躯。フード付きの黒いテックウェアを纏い、右目にだけデータ解析用のサイバーアイを埋め込んでいる。
  personality: 皮肉屋で懐疑的だが、内側には強い自由への渇望を秘めている。一人称は「オレ」。
  speech_style: ぶっきらぼうで、ネットワーク用語やスラングを混ぜた話し方をする。
  background: 元はシンタックスの末端技術職だったが、ある禁忌に触れて追放され、現在はスラムでデータランナーとして食い繋いでいる。
  motivation: 管理社会の底から脱出し、伝説に語られる「約束の丘」へ到達すること。
  relationships:
  - name: ルナ・ヴェスパー
    relation: 信頼し合うビジネスパートナー兼相棒
  - name: ヴァレリウス
    relation: 執拗に追ってくる宿敵
  arc: 孤独な生存本能のみで生きていたが、旅を通じて他者との絆と、絶望的な状況下での希望を信じるようになる。
- name: ルナ・ヴェスパー
  role: 相棒
  age: 24
  gender: 女性
  appearance: 油汚れのついたオーバーオールに特大のゴーグルを装着。短く切り揃えた赤髪が特徴。
  personality: 快活で現実主義的。機械いじりをこよなく愛するエンジニア。一人称は「私」。
  speech_style: ハキハキとした快調な口調。感情が高ぶると早口になる。
  background: スラムの廃棄物集積所で旧時代のガラクタを修理して売るジャンク屋。カイの装備のメンテナンスを担当している。
  motivation: 本でしか見たことのない「本物の空」をこの目で確認すること。
  relationships:
  - name: カイ・ゼノン
    relation: 最高の腕を持つハッカーであり、唯一心を許した友人
  arc: 現状維持の生活に妥協していたが、カイの行動に触発され、自らの足で境界線を越える勇気を持つ。
- name: ディレクター・ヴァレリウス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 汚れひとつない純白のスーツを着用。身体の半分以上を高性能な義体化しており、表情の変化が乏しい。
  personality: 完璧主義で冷酷。人間を効率的なデータの一部としてしか見ていない。一人称は「私」。
  speech_style: 極めて丁寧で論理的な敬語。相手を精神的に追い詰める静かな口調。
  background: メガコープ「シンタックス」の治安維持局局長。都市の秩序を乱す「ノイズ」を排除することに快感を覚えている。
  motivation: 奪われたフライトコードを回収し、都市の完全なる管理体制を維持すること。
  relationships:
  - name: カイ・ゼノン
    relation: 計算外の動きをする不快なイレギュラー
  arc: 完璧な論理と管理を信奉していたが、カイの「非合理的で情熱的な意志」に敗北し、自身の空虚さに気づく。
- name: 老人ギル
  role: 脇役
  age: 72
  gender: 男性
  appearance: ボロボロのコートを羽織った小柄な老人。首筋に旧式の神経接続ポートがいくつも並んでいる。
  personality: 気まぐれで謎めいているが、深い知識を持つ。一人称は「わし」。
  speech_style: ゆっくりとした、古風で含みのある話し方。
  background: かつてシンタックスのネットワーク基盤を設計した伝説のアーキテクト。現在は記憶を一部失い、スラムの片隅で隠居している。
  motivation: 自分が作り上げてしまった「檻」から、誰か一人が脱出することを願っている。
  relationships:
  - name: カイ・ゼノン
    relation: 自分の意志を継ぐ可能性を持つ後継者
  arc: 過去の罪悪感に囚われていたが、カイにフライトコードの真の意味を伝えることで、精神的な救済を得る。
