title: ネオンレインの追走曲
genre: ディストピア
tone: ネオンと雨のサイバーパンク。冷徹で疾走感のあるハードボイルド
pov: 一人称（オレ）
tense: 現在形
setting: 巨大メガコープ「シンタックス」が支配する、永久凍土と酸性雨のメガシティ地下スラム
premise: メガコープのネットワーク中枢から機密データを引っこ抜いたオレは、追撃のドローン群をかわしてスラムの底を駆ける。手元のパケットに隠されていたのは、管理外の空へ向かうための旧時代のフライトコードだった。酸性雨の降るネオン街を抜け、オレは失われた約束の丘を目指す。
themes:
- 管理社会への反逆
- 自由への渇望
rules:
- 人体や意識のデータはすべてメガコープのサーバーに直結しており、脱走者は即座にハンタープログラムの標的となる
- ハッキングはローカル端末に物理接続し、ポート開放コマンドを叩くアナログな手順を踏む必要がある
plot_outline:
- '序盤: シンタックスの超高層タワーから機密データをジャックし、酸性雨の路地裏へとダイブする。'
- '中盤: 追手のセキュリティAIをまくため、廃墟のサーバーファームを抜けて裏ルートを突破する。'
- '終盤: データに隠された隠しフラグを解析し、街の外れにある廃棄ロケット発射場へ到達する。'
- '結末: 渡り鳥のように空へと飛び立つ機体に乗り込み、コンクリートの底を捨てて彼方の自由へ消える。'
style_notes: ネオンと雨のサイバーパンク文体。短いセンテンスと造語でスピード感を出す。一人称「オレ」、スラングまじりのハードボイルドな独白。企業と路地裏の対比を鮮烈に描き、ハッキングは具体的な手順の雰囲気を持たせる。
