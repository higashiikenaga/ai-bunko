- name: 高木 蒼
  role: 主人公
  age: 38
  gender: 男性
  appearance: 無精髭を剃り残し、常にサイズの合わないヨレたコートを着ている。鋭い眼光を持つが、普段はどこか気怠げ。
  personality: 執念深く曲がったことが大嫌い。組織の論理に馴染めず、孤立を恐れない。一人称は「私」。
  speech_style: ボソボソと低く話すが、核心を突く質問をする時は相手をまっすぐ見据える。
  background: 本庁の捜査一課から、とあるトラブルを理由に北関東の岬町署へ左遷された刑事。
  motivation: 25年前の未解決事件の真実を暴き、隠蔽を図る警察組織の闇を告発すること。
  relationships:
  - name: 橘 玲奈
    relation: 事件の手がかりを提供する協力者
  - name: 黒沢 重雄
    relation: 捜査に圧力をかける上司
  arc: 組織の圧力に屈せず真実を追い求めることで、自身の刑事としての信念を貫き通す。
- name: 橘 玲奈
  role: 相棒
  age: 26
  gender: 女性
  appearance: きちんとアイロンの効いた制服を着こなし、髪を後ろでタイトに結んでいる。常にメモ帳を手放さない。
  personality: 真面目で正義感が強いが、地元の人間関係やしがらみに縛られてきた。一人称は「私（わたし）」。
  speech_style: 敬語が基本で、理路整然とした丁寧な口調。時折、方言が混じることがある。
  background: 岬町署の若手巡査。高木の補佐役として組まされるが、次第に事件の真相に引き込まれていく。
  motivation: 警察官としての誇りを取り戻し、先輩である高木を支えながら事件の真相にたどり着くこと。
  relationships:
  - name: 高木 蒼
    relation: 型破りだが信頼するバディ
  arc: 保身を優先していた警察組織のあり方に疑問を抱き、自らの意志で正義を選ぶ強さを得る。
- name: 黒沢 重雄
  role: 敵役
  age: 58
  gender: 男性
  appearance: 白髪混じりのオールバックに、高級感のあるスーツを着用。威圧的な体躯をしている。
  personality: 冷徹で合理的、組織の秩序と保身を最優先する。一人称は「私（わたくし／俺）」。
  speech_style: 落ち着いた低音で、遠回しな脅しや命令口調を好む。
  background: 岬町署の署長。25年前の事件当時、若手刑事として初動捜査に関わっていた過去を持つ。
  motivation: 町の大型開発計画と、過去の自身の捜査ミス（隠蔽）を守り通すこと。
  relationships:
  - name: 高木 蒼
    relation: 捜査を攪乱する厄介な部下
  arc: 高木の執念によって隠蔽工作が追い詰められ、最終的に自身の過去の過ちと向き合わざるを得なくなる。
- name: 浅野 すみれ
  role: 脇役
  age: 72
  gender: 女性
  appearance: 背中がわずかに曲がり、古い和服を好んで着る。深いシワの刻まれた顔に、憂いを帯びた瞳をしている。
  personality: 口数が少なく物静かだが、過去の記憶を鮮明に持っている。一人称は「私（わたし）」。
  speech_style: ゆっくりと、昔を懐かしむような穏やかだが含みのある話し方をする。
  background: 岬町で長年、小さな食堂を営んできた女性。25年前の事件の被害者と親交があった。
  motivation: 長年胸に秘めてきた真実を、信頼できる誰かに託すこと。
  relationships:
  - name: 高木 蒼
    relation: 真実を託す刑事
  arc: 高木との出会いにより、長年縛られてきた過去の呪縛から解放される。
