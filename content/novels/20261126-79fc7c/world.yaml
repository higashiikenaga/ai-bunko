title: 凪の境界線
genre: 本格ミステリー
tone: 硬質でリアリズムを重視した、乾いた雰囲気
pov: 三人称
tense: 過去形
setting: 現代、北関東の沿岸部に位置する岬町
premise: 廃墟となった古い灯台の修復工事中、一通の未投函の手紙が発見される。それは25年前、自殺として処理された女性の死の真実を記した、失われた遺言だった。大規模開発を控える町と、捜査の拡大を阻む警察組織。転属してきた刑事・高木は、組織の圧力に抗いながら、検視記録の矛盾と地道な聞き込みを通じて、隠蔽された事件の全貌に迫る。
themes:
- 組織の論理と個人の正義
- 忘却された真実の再構築
rules:
- 警察内部の指揮命令系統と政治的介入が捜査の阻害要因となる
- 物理的な証拠（検視結果、遺留品）と時刻の整合性が解決の鍵となる
- 聞き込みによる情報の断片化と、それらを繋ぎ合わせる論理的プロセスを重視する
plot_outline:
- '序盤: 岬町の古い灯台の修復現場で、25年前の未投函の手紙が発見される。高木刑事は現場検証を行い、当時の検視報告書と現在の地形・構造の間に僅かな矛盾を見出す。'
- '中盤: 高木は地元の住民や当時の関係者への聞き込みを開始するが、地元警察の幹部から捜査の進め方に介入を受ける。手紙の差出人と被害者の関係を追う中で、事件当夜の天候と、灯台の運用記録の食い違いが浮き彫りになる。'
- '終盤: 手紙に記された手がかりと、灯台の特異な構造、そして最新の再検視結果を突き合わせ、高木は犯人が物理的な証拠を誤認させるために仕掛けた、極めて論理的なトリックを解明する。'
- '結末: 真犯人が特定されるが、組織の隠蔽工作を暴いた代償として、高木は警察内部での地位を失う。しかし、彼は真実を記録した報告書を静かに受理させる。'
style_notes: 時刻、天候、場所、気温を可能な限り正確に記述すること。会話は無駄を削ぎ落とした実務的なものとし、感情的な修辞を避ける。捜査のプロセス（聞き込みの作法、鑑識の作業手順、組織内の会議の空気感）を詳細かつ淡々と描くことで、リアリズムを担保する。
