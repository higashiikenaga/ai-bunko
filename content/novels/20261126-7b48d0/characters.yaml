- name: カイ・ルミナス
  role: 主人公
  age: 17
  gender: 男性
  appearance: 油汚れのついたオーバーオールに、額に大きなゴーグルを装着した少年。手先が器用で、常に工具を携帯している。
  personality: 謙虚で心優しいが、機械のことになると情熱的で頑固。自信なさげに見えて、芯は強い。一人称は「僕」。
  speech_style: 丁寧だが、専門的な機械の話になると早口になり、熱っぽく語る。
  background: 独創的な改造を好むため、保守的な整備士ギルドでは「落ちこぼれ」扱いされていたが、実際には時代の先を行く天才的な設計能力を持つ。
  motivation: 自分の技術が世界に必要であることを証明し、伝説の天空村の謎を解き明かしたい。
  relationships:
  - name: ルナ
    relation: 幼馴染であり、最高の信頼を寄せる操縦士
  - name: シルヴァス
    relation: 航海術を教わる師のような存在
  arc: 自分の才能を否定していた状態から、仲間との旅を通じて「誰かのために技術を使う喜び」を知り、真の天才整備士へと成長する。
- name: ルナ・スカイウォーカー
  role: 相棒
  age: 17
  gender: 女性
  appearance: 快活なショートカットの金髪に、赤い飛行ジャケットを羽織った少女。常に自信に満ちた笑みを浮かべている。
  personality: 直感的で破天荒。リスクを恐れず突き進む行動派で、チームのムードメーカー。一人称は「あたし」。
  speech_style: ハキハキとしていて、語尾に「～だよ！」「～じゃん！」と付ける快活な話し方。
  background: 飛空艇操縦の天才的なセンスを持つが、あまりに危険な飛行を好むため、どの運送会社からも雇ってもらえないフリーランスの操縦士。
  motivation: 世界で一番速い飛行を体験することと、カイの夢を叶えること。
  relationships:
  - name: カイ・ルミナス
    relation: 幼馴染。彼の才能を誰よりも信じている
  - name: シルヴァス
    relation: 喧嘩ばかりしているが、内心ではその腕前を認めている
  arc: 単なるスリル追求から、大切な仲間や場所を守るための「責任ある操縦」へと意識が変化する。
- name: シルヴァス・クロムウェル
  role: 相棒/メンター
  age: 45
  gender: 男性
  appearance: 頬に古い傷跡がある、厳格な面持ちの男性。仕立ての良いが使い込まれた元軍服を着用している。
  personality: 現実主義で気難しいが、情に厚い。規律を重んじ、若者の無鉄砲さに呆れつつも世話を焼く。一人称は「私」。
  speech_style: 低く落ち着いたトーンで、簡潔に要点だけを伝える軍隊式の話し方。
  background: 元帝国軍の精鋭航海士だったが、軍の非道なやり方に疑問を抱いて脱走し、正体を隠して流れ者となっていた。
  motivation: 過去に犯した過ちを償い、真に空を愛する若者たちを導くこと。
  relationships:
  - name: カイ・ルミナス
    relation: 未熟だが可能性を秘めた弟子のような存在
  - name: ルナ・スカイウォーカー
    relation: 手に負えない問題児として扱っている
  arc: 閉ざしていた心を再び開き、軍への憎しみではなく、空の自由を守るという希望を持つようになる。
- name: ヴァレリウス将軍
  role: 敵役
  age: 52
  gender: 男性
  appearance: 金色の装飾が施された豪華な軍服に身を包み、片目にモノクルを着用した冷徹な眼差しの男。
  personality: 傲慢で支配欲が強く、効率と秩序を絶対視する。弱者を切り捨てることに躊躇がない。一人称は「私」。
  speech_style: 慇懃無礼で、相手を見下した優雅な言い回しを好む。
  background: 帝国軍の最高司令官。天空村に眠る古代の動力源を手に入れ、空のすべてを支配する絶対的な帝国を築こうとしている。
  motivation: 伝説の秘宝を手にし、自らの権力を不動のものにすること。
  relationships:
  - name: シルヴァス・クロムウェル
    relation: 裏切り者として憎み、同時にその能力を惜しんでいる
  - name: カイ・ルミナス
    relation: 計画を邪魔する、取るに足らない羽虫のような存在
  arc: 完璧な計画と圧倒的な力でねじ伏せようとするが、最後は予想外の「絆」と「機転」によって敗北し、権力の虚しさを知る。
