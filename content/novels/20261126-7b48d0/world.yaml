title: 嵐を裂く黄金の翼 ―スカイ・ハイ・アドベンチャー―
genre: スチームパンク冒険
tone: 爽快感溢れる、明るくエネルギッシュな活劇
pov: 三人称
tense: 過去形
setting: 浮遊島と巨大な気流（ギャル）が支配する空の世界。蒸気機関と翼が文明の基盤となっており、人々は飛空艇で島々を往来している。
premise: 落ちこぼれの天才整備士カイは、ある日空から降ってきた「名前のない猫」と、古ぼけた謎の航海図を手にする。それは、数百年前に忽然と姿を消した伝説の「天空村」へ至る唯一の道しるべだった。信頼できる仲間と共に、自作の小型飛空艇『ストーム・チェイサー号』で、未知なる気流の果てを目指す大冒険が幕を開ける！
themes:
- 自由への渇望
- 仲間との強い絆
rules:
- 飛空艇の動力は『エーテル蒸気』であり、燃料の純度とボイラーの圧力が航行速度を決定する
- 空には『大気流（ギャル）』という高速道路のような気流が存在し、これに乗らなければ長距離移動は不可能
- 名前のない猫は、人間には見えない『気流の道』を察知し、尻尾で方向を示す能力を持つ
plot_outline:
- '序盤: 整備士カイが名前のない猫と航海図を拾い、幼馴染の破天荒な操縦士ルナと共に、スクラップから組み上げた飛空艇で旅立つ。'
- '中盤: 旅の途中で気難しい元軍人の航海士を仲間に加え、村の秘宝を狙う帝国軍の追撃を、アクロバティックな空中機動で振り切りながら、消えた村の正体に迫る。'
- '終盤: ついに到達した『消えた村』が、巨大な永久嵐の核に閉じ込められていたことを知り、村を解放するために帝国軍の巨大旗艦と嵐の中での最終決戦に挑む。'
- '結末: 仲間たちの連携とカイの機転で嵐を突破し、村に再び太陽の光を取り戻す。カイたちはさらなる未知の空を目指し、黄金の翼を広げて旅を続ける。'
style_notes: 「ガシャン！」「ビューン！」といった擬音を効果的に使い、風を切る疾走感や機械が激しく駆動する音を鮮明に描写する。台詞はテンポ良く、絶望的な状況でも笑い飛ばして突き進む、勢いのある明るい語り口を徹底する。
