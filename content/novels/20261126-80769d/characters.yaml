- name: 佐久間 誠
  role: 主人公
  age: 58
  gender: 男性
  appearance: 疲れ切った眼差しに深い刻まれた眉間の皺。使い込まれた革の手帳を常に持ち歩き、地味なベージュのトレンチコートを愛用している。
  personality: 誠実で執念深い。効率よりも真実を重んじ、妥協を許さない。一人称は「私」。
  speech_style: 丁寧だが、核心を突くときは静かに厳しい口調になる。相手の言葉の矛盾を逃さない。
  background: 本庁捜査一課で辣腕を振るったが、組織の不条理な決定に抗ったことで疎まれ、定年直前に左遷に近い形で地方署へ異動となった。
  motivation: 20年前の失踪事件を解決し、置き去りにされた少女の尊厳と、警察官としての自らの矜持を取り戻すこと。
  relationships:
  - name: 雨宮 栞
    relation: 記憶の断片を共有する協力者
  - name: 藤原 剛志
    relation: 対立する上司・過去の隠蔽に関与した疑いのある人物
  arc: 組織の歯車として諦めていた人生の最後に、個人の尊厳を守るための孤独な戦いを通じ、真の意味での「正義」を見出す。
- name: 雨宮 栞
  role: 鍵を握る協力者
  age: 42
  gender: 女性
  appearance: 淡い色のリネンワンピースを纏い、度の強い眼鏡をかけている。静かな佇まいで、常に古書の香りを漂わせている。
  personality: 内向的で思慮深い。本と鳥を愛し、静寂を好む。一人称は「私」。
  speech_style: 物静かで、比喩的な表現を多用する。相手の心情を察するような間を置いて話す。
  background: 町の外れで「雨の日だけ開く古本屋」を営む。失踪した少女とは幼馴染であり、彼女が密かに付けていた渡り鳥の観察日記を託されていた。
  motivation: 少女が遺した「声なきメッセージ」を、正当な形で家族や世界に届けること。
  relationships:
  - name: 佐久間 誠
    relation: 不器用ながらも真摯に耳を傾けてくれる信頼できる捜査官
  arc: 長年抱えていた「あの時何もできなかった」という罪悪感から解放され、少女の意思を未来へ繋ぐ役割を全うする。
- name: 藤原 剛志
  role: 敵役
  age: 61
  gender: 男性
  appearance: 恰幅が良く、常に隙のない高級なスーツ姿。威圧的な笑みを浮かべ、権威を感じさせる佇まい。
  personality: 徹底した実利主義。町の秩序と警察組織の体面を最優先し、不都合な真実は切り捨てる。一人称は「私」。
  speech_style: 慇懃無礼。相手を諭すような高圧的な話し方で、論点をすり替えるのが巧い。
  background: 20年前の失踪事件の捜査責任者であり、現在は署のトップ。効率的な処理という名目で証言を握り潰し、町との共犯関係を築いた。
  motivation: 過去の過ちを完全に隠蔽し、誰にも邪魔されずに平穏な退職を迎えること。
  relationships:
  - name: 佐久間 誠
    relation: 自分の築いた平穏を脅かす、目の上のたんこぶ
  arc: 完璧にコントロールしていたはずの過去が、佐久間の執念と雨の日の記憶によって暴かれ、逃れられない社会的・精神的な追い詰められ方を経験する。
- name: 浅井 瑞希
  role: 脇役/感情的導線
  age: 31
  gender: 女性
  appearance: 都会的な服装だが、どこか心ここにあらずといった寂しげな表情。妹の面影を持つ澄んだ瞳をしている。
  personality: 繊細で傷つきやすい。答えを求めながらも、真実を知ることを同時に恐れている。一人称は「私」。
  speech_style: 途切れ途切れで、感情が昂ると早口になる。問いかけるような話し方をする。
  background: 失踪した少女の姉。事件後、町の人々の冷たい視線に耐えかねて上京したが、佐久間の連絡を受けて数年ぶりに故郷に戻ってきた。
  motivation: 妹が最後に何を想い、どこで誰に救われていたのかを知り、心の区切りをつけること。
  relationships:
  - name: 佐久間 誠
    relation: 絶望の中で唯一信じられる、妹の声を届けてくれる存在
  arc: 絶望的な喪失感と孤独の中にいたが、日記を通じて妹の深い愛情と意思を受け取り、前を向いて生きる勇気を得る。
