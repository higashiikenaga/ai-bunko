title: 鈍色の海と、雨の日の記憶
genre: ヒューマンドラマ
tone: 乾いた硬質さと静謐な哀愁
pov: 三人称
tense: 過去形
setting: 現代、北海道の沿岸にある寂れた漁師町
premise: 定年を間近に控えた捜査一課の警部補・佐久間は、20年前の未解決失踪事件の再調査を命じられる。町の外れにある「雨の日だけ開く古本屋」の店主が、当時の記憶を断片的に保持していることが判明。組織の効率主義と軋轢の中で、佐久間は地道な聞き込みと記録の照合を繰り返し、失踪した少女が遺した「声なきメッセージ」を追い求める。
themes:
- 償いと救済
- 組織の不全と個人の正義
rules:
- 古本屋『雨読堂』は気象庁の観測で降水があった日にのみ開店する
- 警察内部の報告書は形式を重視し、個人の直感や情緒的な記述は排除される
- 物語内の時刻と場所は常に具体的に明記し、捜査のタイムラインを厳格に管理する
plot_outline:
- '序盤: 佐久間が本庁から左遷に近い形で地方署へ異動し、放置されていた少女失踪事件のファイルを開く。当時の捜査漏れを洗い出すため、町全体の地図に聞き込み状況をマッピングし始める。'
- '中盤: 雨の日にのみ営業する古本屋の店主から、当時の少女が渡り鳥の観察記録をつけていたことを知る。同僚や上司は「時間の無駄」と冷淡な態度を示すが、佐久間は住民一人ひとりの証言を突き合わせ、当時の捜査員による意図的な隠蔽の可能性に辿り着く。'
- '終盤: 渡り鳥が南下する時期に合わせ、かつての目撃証言に矛盾があることを突き止める。雨の日の聞き込みの中で、少女を匿っていた人物の正体と、町全体が共有していた残酷な沈黙が暴かれる。'
- '結末: 物理的な解決（逮捕や発見）ではなく、遺された日記を通じて少女の意思を家族に届ける。佐久間は形式上の報告書と共に、組織の過ちを記した私的な記録を遺して退職する。'
style_notes: 警察小説のリアリズムを徹底する。会話文は「はい」「いいえ」など実務的な短文を基本とし、情緒的な独白を排する。場面転換ごとに【14:22 〇〇町交差点】のように時刻と場所を明記。聞き込みシーンでは、相手の視線や手の動き、室内の匂いなど、客観的な観察描写に徹すること。
