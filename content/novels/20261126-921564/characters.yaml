- name: 雨宮コハル
  role: 主人公
  age: 17
  gender: 女性
  appearance: ポニーテールに元気いっぱいの笑顔。常に小麦粉かソースの汚れがついたエプロンを着用している。
  personality: 超ポジティブで猪突猛進。美味しいものへの情熱が凄まじい。一人称は「あたし」。
  speech_style: 語尾に「！」が多く、早口でまくしたてる傾向がある。明るく快活な口調。
  background: 幼い頃から蒸気食堂「パフ・パフ号」で育った。砂漠の旅人を笑顔にする料理人になることが夢。
  motivation: 世界中の旅人が「また食べたい」と思う、最高の砂漠料理を完成させること。
  relationships:
  - name: レン
    relation: 救助した居候。反発しつつも惹かれ合う恋仲
  - name: ゴロー
    relation: 育ての親であり、食堂の店主
  arc: 料理への情熱だけでなく、大切な人を守りたいという強い意志に目覚め、精神的に成長する。
- name: レン
  role: 相棒/ヒーロー
  age: 19
  gender: 男性
  appearance: 無造作な黒髪に鋭い眼差し。油汚れのついたつなぎを腰で結び、首に古いゴーグルをかけている。
  personality: 冷静沈着で口数が少ない。不器用だが根は優しい。一人称は「俺」。
  speech_style: 簡潔でぶっきらぼうな話し方。核心を突く鋭い指摘が多い。
  background: 元は移動都市の精鋭整備士だったが、ある目的を持って単身砂漠へ。故障で立ち往生していたところをコハルに強引に救われる。
  motivation: 砂漠の深部に眠るとされる「失われた蒸気機関の設計図」を探し出し、亡き父の汚名をそそぐこと。
  relationships:
  - name: 雨宮コハル
    relation: 自分を救い出し、心を溶かしてくれた特別な女の子
  - name: ゴロー
    relation: 技術的な信頼を寄せる年上の理解者
  arc: 孤独に目的を追う生き方から、仲間と共に歩む喜びを知り、心を開いていく。
- name: ゴロー
  role: 脇役/メンター
  age: 52
  gender: 男性
  appearance: 恰幅の良い体型に立派な髭。アロハシャツにベストを羽織り、常にパイプをくゆらせている。
  personality: おおらかで食いしん坊。人生経験豊富で、若者の恋をニヤニヤしながら見守る。一人称は「わし」。
  speech_style: ゆったりとした、包容力のある話し方。「～じゃな」などの古風な口調。
  background: 元・大砂海最強の航海士。今は隠居して「パフ・パフ号」を経営し、コハルを娘のように育てている。
  motivation: パフ・パフ号を砂漠で一番愛される店にし、コハルを一人前の料理人にすること。
  relationships:
  - name: 雨宮コハル
    relation: 大切に育てた娘のような存在
  - name: レン
    relation: 店と船を任せられる信頼できる若き技術者
  arc: 次世代にパフ・パフ号の精神を継承し、自分自身の新しい旅への好奇心を取り戻す。
- name: ミア・フォン・ローゼンタール
  role: ライバル
  age: 17
  gender: 女性
  appearance: 縦ロールの金髪にフリルたっぷりのドレス。最新鋭の蒸気デバイスを身に纏っている。
  personality: プライドが高く完璧主義。お嬢様気質だが、実は努力家。一人称は「わたくし」。
  speech_style: 丁寧だが高圧的なお嬢様口調。感情が高ぶると早口になる。
  background: 最大規模の移動都市の総督の娘。美食を追求しており、砂漠の素朴な料理をバカにしていたが、コハルの味に衝撃を受ける。
  motivation: 砂漠の伝説の食材を探し出し、世界最高のフルコースを完成させること。
  relationships:
  - name: 雨宮コハル
    relation: 料理のライバルであり、初めて認めた友人
  arc: 形式的な完璧さよりも、心を込めることの大切さに気づき、素直な自分を表現できるようになる。
