title: スチーム・パフ・ロマンス ―砂漠の真ん中で、君と熱いお茶を淹れたい―
genre: 青春恋愛
tone: 明るく軽快、ちょっぴり甘酸っぱい
pov: 一人称（あたし）
tense: 過去形
setting: 蒸気機関による移動都市が巡回する、広大な乾燥地帯「大砂海」
premise: 砂漠を走る蒸気移動食堂の店員・コハルは、美味しいものを作ることに全力投球な女の子！ある日、故障して立ち往生した謎の整備士・レンを、あたしの店に（強引に！）救助することに。砂漠の真ん中、見たこともないようなオアシスのそばで、スチームの音とパンの香りに包まれながら、二人の「熱すぎる」恋が動き出す！
themes:
- 居場所を見つけること
- 困難を楽しむ心の強さ
rules:
- 蒸気機関が文明の主軸であり、水と石炭が最も貴重な資源である
- オアシスは蒸気機関の熱を利用して作られた、人工的な緑豊かな特区を指す
- 移動都市は決まったルートを巡回しており、ルートを外れると遭難の危険がある
plot_outline:
- '序盤: 蒸気食堂「パフ・パフ号」で働くコハルの賑やかな日常。故障中の整備士レンを、偶然見つけたオアシス近くで救助し、居候させることに。'
- '中盤: レンとの共同生活がスタート。レンの修理技術とコハルの料理が噛み合い、店は繁盛！そんな中、レンが砂漠の深部へ向かっていた秘密が判明する。'
- '終盤: 移動都市のルート変更により、パフ・パフ号が未踏の砂漠へ。蒸気機関の故障で絶体絶命のピンチ！コハルの作る「元気が出る料理」とレンの技術が、奇跡を起こす。'
- '結末: 危機を乗り越え、新しい航路へ。レンはコハルの隣で、コハルは最高の料理人として、砂漠の地平線を目指して走り続ける。'
style_notes: 一人称「あたし」による、テンポ重視の軽快な語り。会話劇ではキャラクターの可愛げを引き出すため、ツッコミを多めに入れる。特に、スチーム・アップルパイやスパイス香るスープなど、食べ物の描写には徹底的にこだわり、読者の五感を刺激すること。毎話、キャラクターのちょっとした失敗や、食べ物にまつわる小さな笑いどころを必ず挿入する。
