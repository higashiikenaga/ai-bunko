- name: 赤城 勘助
  role: 主人公
  age: 22
  gender: 男性
  appearance: 日に焼けた肌に鋭い目元。動きやすいように常に股引と手ぬぐいを身につけている。足腰が強い。
  personality: 義理人厚く、曲がったことが大嫌いな江戸っ子。好奇心旺盛だが、少しお調子者の一面も。一人称は「俺」。
  speech_style: 威勢が良く、江戸弁混じりのハキハキとした口調。「〜でい！」「おせっかい上等よ！」が口癖。
  background: 神田の長屋で育った腕っぷしのいい若者。日雇いの手伝いなどで生計を立てている。
  motivation: 偶然見つけた星図の謎を解き、長屋の平和と隠された知識を守り抜くこと。
  relationships:
  - name: 源翁
    relation: 頼りにしている長屋の隠居・師匠
  - name: お糸
    relation: 幼馴染でいつも喧嘩する間柄
  arc: 単なる好奇心から星図を手にするが、知恵の重みを知り、ただの喧嘩っ早い若者から町を守る精神的な支柱へと成長する。
- name: 源翁
  role: 相棒・老学者
  age: 68
  gender: 男性
  appearance: 白髪混じりの髭を蓄え、いつも少しすり切れた着物を着ている。老眼鏡を愛用している。
  personality: 温和で博学、少し変わり者。古い伝承や天体に目がない。一人称は「わし」。
  speech_style: 落ち着いた物腰の老け込みのない口調。難しい専門知識を分かりやすく例えて話す。
  background: 元は幕府の天文方に出入りしていたが、ある理由で役職を辞し、今は神田の長屋で隠居生活を送る。
  motivation: 失われた天文学の知恵が正しく継承され、悪人の手に渡るのを阻止すること。
  relationships:
  - name: 赤城 勘助
    relation: 見込みのある若者・相棒
  arc: 過去の挫折から世を捨てかけていたが、勘助の行動力に動かされ、再び未来へ知恵を繋ぐ情熱を取り戻す。
- name: お糸
  role: 脇役・長屋の仲間
  age: 20
  gender: 女性
  appearance: 艶やかな黒髪をきれいに結い上げ、秋の味覚を扱う仕事ゆえにいつも活発で健康的な美しさがある。
  personality: 気風が良くてしっかり者。勘助の無茶な行動に呆れつつも、一番の理解者。一人称は「あたし」。
  speech_style: サバサバとした江戸言葉。「勘助、また変なことに首突っ込んで！」と叱るのが定番。
  background: 長屋の近くで栗や芋など秋の味覚を扱う商店を手伝いながら、住民たちの胃袋と情報を支えている。
  motivation: 騒動に巻き込まれる勘助を心配し、長屋の仲間たちをまとめて危機を乗り切ること。
  relationships:
  - name: 赤城 勘助
    relation: 幼馴染・幼馴染以上の想いを秘める
  arc: 見守る立場から、長屋の団結を促す中心人物の一人としてトラブルに立ち向かう強さを身につける。
- name: 黒川 善兵衛
  role: 敵役
  age: 45
  gender: 男性
  appearance: 上質な羽織をまとい、肥満体型で常に打算的な笑みを浮かべている。金の装飾品を好む。
  personality: 強欲で冷酷。利益のためなら手段を選ばない。一人称は「私（わたくし）」または「俺」。
  speech_style: 表向きは丁寧だが、裏では威圧的で冷徹な物言い。「世の中、力と金がすべてだ」が持論。
  background: 江戸の裏社会と繋がる悪徳商人。地下図書館に眠る古い技術や富を独占し、権勢を振るおうと企む。
  motivation: 地下図書館のありかを示す星図を奪い、江戸の経済と知識を我が物にすること。
  relationships:
  - name: 赤城 勘助
    relation: 邪魔立てする忌々しい若者
  arc: 自らの野望に固執し、金と力で全てを支配しようとするが、長屋の団結力の前に野望を打ち砕かれる。
