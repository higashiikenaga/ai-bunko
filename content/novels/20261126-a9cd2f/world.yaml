title: 星図と隠れ書庫 ―長屋の勘助、江戸の底を駆ける―
genre: 歴史・時代小説
tone: 江戸の粋と活気、そして温かな人情が漂う情緒ある雰囲気
pov: 三人称
tense: 過去形
setting: 江戸時代後期、神田界隈の賑やかな長屋
premise: 江戸の長屋で暮らす威勢のいい若者・勘助は、掃除中に古びた一巻の「星図」を拾う。その図が導く先は、江戸の底に眠ると噂される、禁じられた知識の集積地「地下図書館」であった。星の動きを読み解く鍵を巡り、勘助は知識を独占せんとする悪徳商人の陰謀に立ち向かうことになる。秋の味覚が香る長屋の仲間たちと共に、失われた星の記憶を探る人情物語。
themes:
- 知恵の継承と守護
- 長屋の絆と共同体の連帯
rules:
- 地下図書館への入り口は、特定の星図と夜空の配置が完全に一致した瞬間にのみ、隠し扉として現れる
- 長屋の住人は、互いの困りごとを分かち合い、外敵から身内を守るという暗黙の掟がある
plot_outline:
- '序盤: 秋の夜長、栗ご飯の香りが漂う長屋。勘助が蔵の片隅から、妙に光を放つ古い星図を見つけ、それが単なる絵ではないことに気づく。'
- '中盤: 星図を狙う怪しげな集団が長屋に現れ、騒動が起きる。勘助は、長屋の隠居である老学者と共に、図が示す地下の入り口を求めて江戸の町を駆け巡る。'
- '終盤: 秋祭りの夜、星図と天体が重なった瞬間、長屋の井戸の下に隠された壮大な地下図書館の扉が開く。そこには失われた天文の知恵が眠っていた。'
- '結末: 知識を悪用しようとする者たちを、長屋の住人たちの団結力で撃退。勘助たちは、地下の知恵を人々の暮らしを豊かにする「知恵」として密かに守ることを誓い、賑やかな秋祭りの宴で物語は幕を閉じる。'
style_notes: べらんめえ口調の軽快な会話を多用し、江戸の町並みや長屋の喧騒を生き生きと描く。松茸や栗、焼き芋といった季節の食べ物を丁寧に描写して季節感を出し、最後は人情味溢れる温かい結末に導くこと。
