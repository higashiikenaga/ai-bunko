- name: エリュシオン
  role: 主人公
  age: 21
  gender: 男性
  appearance: 青白い肌に、夜を溶かしたような黒髪。没落した学者の末裔らしく、擦り切れた古い学者服を纏っている。瞳には深い知的好奇心と絶望が同居している。
  personality: 内向的で思慮深い。正義感よりも真理への渇望が強い。一人称は「僕」。
  speech_style: 丁寧だが、どこか距離感のある静かな口調。独り言が多く、分析的な話し方をする。
  background: かつて聖都ルナリスの最高学府で「音響考古学」を専攻していたが、禁忌に触れた父が失踪し、家名は汚され、学籍を剥奪された。
  motivation: 父が追い求めた「創世の旋律」の真実を突き止め、静寂に侵食される世界から脱却すること。
  relationships:
  - name: リラ
    relation: 運命を共にする旅の相棒であり、守りたい対象
  - name: 枢機卿ヴァレリウス
    relation: 思想的に対立する宿敵
  arc: 知識のみを信じていた孤独な青年が、リラとの出会いを通じて他者への愛と自己犠牲の意味を知り、自らの声を代償に世界を救う覚悟を決める。
- name: リラ
  role: 相棒
  age: 外見は16歳前後（実年齢不明）
  gender: 女性
  appearance: 透き通るような銀髪のロングヘア。瞳は星空のような深い群青色。地下図書館の古びたカーテンを纏ったような、儚げな装いをしている。
  personality: 天真爛漫で好奇心旺盛だが、時折、数千年の時を経たような達観した表情を見せる。一人称は「私」。
  speech_style: 幼い口調。比喩表現が多く、詩的な言い回しを好む。
  background: 「忘却の書庫」の守護者として目覚めたが、自身の名前以外の記憶をすべて失っている。彼女自身が「失われた詠唱」を記録する生きた器である。
  motivation: 失った記憶を取り戻し、自分が何のためにこの書庫にいたのかという存在意義を見つけること。
  relationships:
  - name: エリュシオン
    relation: 外の世界を教えてくれる導き手であり、唯一信頼する人間
  arc: 空っぽの器だった自分が、エリュシオンと共に旅をすることで「感情」という名の音を手に入れ、一人の人間として生きる意志を持つ。
- name: 枢機卿ヴァレリウス
  role: 敵役
  age: 55
  gender: 男性
  appearance: 純白と黄金で飾られた豪華な法衣を纏う。常に目の上を薄い絹の布で覆っており、視覚を捨てて聴覚のみに特化した異様な風貌。
  personality: 冷酷で完璧主義。静寂こそが究極の救済であり、争いのない世界を実現する唯一の手段だと信じている。一人称は「私」。
  speech_style: 威厳に満ちた、低く響く心地よい声。相手を精神的に追い詰めるような、静かな圧迫感がある。
  background: 聖都ルナリスの宗教的・政治的権力者。かつて音による悲劇を経験し、「音がある限り人間は苦しみ、争う」という結論に達した。
  motivation: 世界からすべての音を奪い去る「完全なる静寂」を完成させ、永遠の統治を確立すること。
  relationships:
  - name: エリュシオン
    relation: 自らの計画を乱す、排除すべき不純物
  arc: 絶対的な静寂による秩序こそが正義だと信じて疑わなかったが、エリュシオンが呼び覚ました人々の「記憶のノイズ」に、自らが封印していた過去の罪と痛みを突きつけられ崩壊する。
- name: ゼノ
  role: 脇役
  age: 42
  gender: 男性
  appearance: 不揃いな歯と、常にニヤついた口元。継ぎ接ぎだらけのコートに、ありとあらゆるガジェットを吊り下げている。片目は義眼で、機械的に回転する。
  personality: 皮肉屋で打算的。金と珍しい骨董品に目がないが、根は情に厚い。一人称は「俺」。
  speech_style: 砕けた口調。早口で、相手を食ったような喋り方をする。
  background: 聖都の最下層で古物商を営む闇商。禁忌の品である「夜明けのラジオ」をエリュシオンに譲った張本人であり、都市の隠し通路に精通している。
  motivation: 世界がどう転ぼうと構わないが、退屈な日常を壊してくれる「面白い事件」を特等席で眺めていたい。
  relationships:
  - name: エリュシオン
    relation: 都合の良い協力者であり、危なっかしい後輩のような存在
  arc: 単なる傍観者として振る舞っていたが、エリュシオンとリラの絆に触れ、最後には自らの店と財産を投げ打って彼らの脱出をサポートする。
