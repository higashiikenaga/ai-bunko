title: 銀明のレクイエム ―七つの失われた詠唱と忘却の書庫―
genre: 伝奇
tone: 格調高く、神話的で重厚な筆致
pov: 三人称
tense: 過去形
setting: 聖都ルナリス。天上の聖域から底知れぬ深淵までが層を成す、垂直構造の巨大都市。
premise: 世界を統べるのは、かつて神々が奏でたという「創世の旋律」の残滓である。音を失い、静寂という名の病に侵食されゆく世界で、禁忌の受信機「夜明けのラジオ」を拾った青年は、地底に眠る「忘却の書庫」へと導かれる。失われた七つの詠唱を揃え、凍てついた世界に再び夜明けを呼び戻すための、絶望と再生の旅路。
themes:
- 記憶の継承
- 静寂と調和
rules:
- 音は物理的な権能を持つ。特定の周波数は物質を分解し、別の周波数は生命を活性化させる。
- 「静寂の病」に侵された者は、次第に記憶と感情を失い、最終的に透明な塩の結晶となって崩壊する。
- 地下図書館（忘却の書庫）に記された音符を正しく奏でる者は、世界の理（ロゴス）を一時的に書き換えることができる。
plot_outline:
- '序盤: 没落した学者の青年エリュシオンが、古物商から奇妙な受信機（夜明けのラジオ）を譲り受ける。そこから流れる正体不明の歌声に導かれ、彼は都市の最下層、禁足地である地下図書館へと足を踏み入れる。'
- '中盤: 書庫の守護者である記憶喪失の少女と出会い、世界を救う唯一の手がかりである「七つの失われた詠唱」の断片を探す旅に出る。各層に潜む静寂の魔物や、音を独占しようとする聖都の枢機卿との激しい抗争が繰り広げられる。'
- '終盤: 枢機卿が「完全なる静寂」による永遠の統治を目論み、世界から全ての音を奪い去る儀式を敢行する。エリュシオンたちはラジオを増幅器として使い、地下図書館に眠る全記録を街中に放送し、人々の記憶を呼び覚ます。'
- '結末: 七つの詠唱が完成し、空に銀色の夜明けが訪れる。代償としてエリュシオンは自身の声を失うが、世界は再び色彩と音を取り戻し、人々は塩の結晶から解放されて再生する。'
style_notes: 擬古文的な表現を交えた格調高い地の文を徹底する。物語の節目に、作中に登場する架空の叙事詩や古の伝承を引用し、世界の奥行きを演出する。地名や固有名詞にはラテン語的な響きを持たせ、会話文は身分や役割に応じた厳格な口調の描き分けを行う。
