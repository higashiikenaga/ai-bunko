- name: 榊原 弦一郎
  role: 主人公
  age: 38
  gender: 男性
  appearance: 鋭い眼光と、手入れはされているが古びた巡察官の外套を纏う。常に懐中時計を持ち歩いている。
  personality: ストイックで潔癖。正義感に突き動かされるが、組織への不信感から冷笑的な態度を取る。一人称は「私」。
  speech_style: 理知的で端的な口調。感情を抑えた話し方だが、核心を突くときは激しさを帯びる。
  background: 元・中央政府の精鋭巡察官。上層部の汚職を告発しようとして逆に罠に嵌められ、名誉と職を剥奪されて雨凪の街へ流れ着いた。
  motivation: 街で起きる失踪事件を解決し、失った誇りを取り戻すこと。そして、自分を陥れた陰謀の真相を突き止めること。
  relationships:
  - name: 澪
    relation: 疑念から信頼へ変わる協力関係
  - name: 櫂
    relation: 価値観は異なるが、目的を共にする奇妙な共闘関係
  - name: 鷹司 宗厳
    relation: かつての敬意が憎悪へと変わった宿敵
  arc: 形式的な正義や名誉への執着を捨て、個としての矜持に基づいた真の正義を見出す。
- name: 澪
  role: 主人公
  age: 24
  gender: 女性
  appearance: 淡い青色の着物に、常に雨を弾く不思議な和傘を差している。どこか浮世離れした儚げな雰囲気を持つ。
  personality: 穏やかで慈愛に満ちているが、時折、底知れない深海のような冷徹さと神秘性を覗かせる。一人称は「私」。
  speech_style: 柔らかく、古風で詩的な言い回しを好む。相手の心を見透かすような問いかけが多い。
  background: 雨の日にのみ店を開く薬種商。実は海底遺跡の記憶を継承する一族の末裔であり、遺物が地上に流出することを防ぐ監視者の役割を担っている。
  motivation: 海底遺跡から現れた禁忌の遺物を再び深淵へ戻し、世界の均衡と街の平穏を守ること。
  relationships:
  - name: 榊原 弦一郎
    relation: 彼の不器用な誠実さに惹かれ、導き手となる
  - name: 櫂
    relation: 海への憧憬と喪失感を共有する理解者
  arc: 運命に翻弄される傍観者から、自らの意思で未来を選択し、遺物を封印する決断を下す主体へと変化する。
- name: 櫂
  role: 主人公
  age: 27
  gender: 男性
  appearance: 日焼けした肌に筋骨逞しい体格。革製の潜水服を身に纏い、頬に深い切り傷がある。
  personality: 直情的で粗野だが、情に厚く嘘がつけない。未知のものに対する好奇心が極めて強い。一人称は「俺」。
  speech_style: ぶっきらぼうで口調は荒いが、海や遺跡の話になると早口で熱っぽく語る。
  background: フリーランスの潜水士。かつて遺跡探索中に相棒を失っており、その死の真相と、深海に眠る古代文明の真実を追い求めている。
  motivation: 深海の最深部へ到達し、失った相棒の形見（あるいは魂）を見つけ出し、古代の謎を解き明かすこと。
  relationships:
  - name: 榊原 弦一郎
    relation: 最初は反発し合うが、次第に背中を預けられる相棒となる
  - name: 澪
    relation: 彼女が持つ「海への知識」に心酔している
  arc: 過去の喪失感という呪縛から解き放たれ、「今、目の前にある命」を守るために潜る勇気を得る。
- name: 鷹司 宗厳
  role: 敵役
  age: 45
  gender: 男性
  appearance: 完璧に仕立てられた西洋式の軍服に、金縁の片眼鏡（モノクル）を着用。隙のない身だしなみ。
  personality: 冷酷な合理主義者。国家の発展のためには個人の犠牲は厭わないという強い信念を持つ。一人称は「私」。
  speech_style: 極めて丁寧だが、相手を見下した傲慢さが滲み出る威圧的な話し方。
  background: 近代化を推し進める軍部の高官。海底遺跡の遺物が持つ強大なエネルギーを軍事転用し、国家の絶対的な覇権を確立しようと画策している。
  motivation: 遺物の力を掌握し、旧時代の遺物を踏み台にして「完璧な新時代」を築き上げること。
  relationships:
  - name: 榊原 弦一郎
    relation: 排除すべき過去の遺物であり、同時にその能力を惜しむライバル
  - name: 澪
    relation: 利用価値のある「鍵」として執拗に追い詰める
  arc: 絶対的な支配を信じて疑わなかったが、抗えない大自然と古代の理（ことわり）の前に、自らの傲慢さを突きつけられ没落する。
