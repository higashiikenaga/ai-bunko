title: 溟海沈殿の刻 ―雨の街に溶ける、古の残照―
genre: 歴史・時代小説
tone: 重厚かつ静謐な叙事詩
pov: 三人称（群像劇）
tense: 過去形
setting: 架空の沿岸諸国、文明開化の荒波が押し寄せる海辺の街「雨凪（あまなぎ）」
premise: 潮の満ち引きが運命を左右する海辺の街に、かつて沈んだ古代文明の遺跡が眠っている。名誉を剥奪された元巡察官、雨の日にのみ現れる薬種商、そして深海に真実を求める潜水士。三つの異なる正義が、海底遺跡から現れた禁忌の遺物によって交錯する。降りしきる雨と、底知れぬ海の深淵が、人々の矜持を容赦なく試していく。
themes:
- 伝統と革新の相克
- 個の正義と公の秩序
- 喪失の受容と再生
rules:
- 海底遺跡は特定の気象条件と潮汐が重なった際、のみその全貌を現す
- 雨の日にのみ開く店は、現世と常世の境界が薄れる聖域として機能する
- 遺跡の遺物は、持ち主の心の深淵にある執着を増幅させる性質を持つ
plot_outline:
- '序盤: 没落した元巡察官が、海辺の街で起きる不可解な失踪事件を追う。同時に、雨の日にのみ店を開く謎めいた女の存在と、深海に未知の文明の影を見る潜水士の視点が、それぞれ異なる動機を持って描かれる。'
- '中盤: 海底遺跡から発掘された遺物が、国家の近代化政策における軍事利用の対象となる。巡察官、薬種商、潜水士の三人が、雨の店を舞台として密かに邂逅し、国家の陰謀と遺跡の真実へと近づいていく。'
- '終盤: 激しい嵐が街を襲い、海底遺跡が海面近くまで浮上する。遺跡を管理しようとする国家の軍隊と、遺跡の平穏を守ろうとする者たちの間で、荒れ狂う海を背景とした激しい衝突が巻き起こる。'
- '結末: 遺跡は再び深淵へと沈み、争いの火種は海へと消える。しかし、それぞれの目的を完遂、あるいは喪失した三人は、傷跡を抱えながらも、自身の矜持に従い、新たな生の一歩を踏み出す。'
style_notes: 格調高い語彙を用い、情景描写には湿度と重厚さを。登場人物の心理描写においては、言葉の端々にその者の生き様と矜持が滲み出るよう、硬質な文体で綴ること。会話文は、身分差や教養の差を反映させ、時代に即した端正な言葉遣いを徹底し、群像劇としての深みを持たせる。
