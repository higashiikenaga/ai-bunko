- name: 湊 奏汰
  role: 主人公
  age: 24
  gender: 男性
  appearance: 色白で線の細い青年。整えられた黒髪に眼鏡をかけ、常に落ち着いた色合いの司書服を纏っている。どこか現実感の薄い佇まい。
  personality: 冷静沈着で、他者の感情に深く踏み込まないよう自律している。しかし内面には繊細な感受性を隠している。一人称は「僕」。
  speech_style: 丁寧で静かな口調。言葉選びが慎重で、無駄な装飾を嫌う。
  background: 過去に大切な存在を失った喪失感を抱えており、死者の記憶を扱うこの地下図書館に身を置くことで、生と死の境界線に安らぎを見出している。
  motivation: 遺された記憶を正しく整理し、誰にも邪魔されない形で保管し続けること。
  relationships:
  - name: 凪 遥
    relation: 記憶を託す相手であり、かつて愛した人
  - name: 影山 宗一郎
    relation: 職場の先輩であり、精神的な導き手
  arc: 記憶を単なる「記録」として扱う客観的な観察者から、痛みさえも愛おしむ「当事者」へと変化する。
- name: 凪 遥
  role: ヒロイン
  age: 22
  gender: 女性
  appearance: 透き通るような肌と、どこか遠くを見つめるような瞳を持つ。儚げだが、凛とした強さを感じさせる佇まい。淡い色の衣服を好む。
  personality: 穏やかで慈愛に満ちている。自身の消えゆく運命を静かに、かつ勇敢に受け入れようとしている。一人称は「私」。
  speech_style: 柔らかく、感覚的な言葉（温かさ、匂い、光など）を多用する詩的な話し方。
  background: 記憶が少しずつ失われていく特殊な病を患っており、自分が「自分」でなくなる恐怖と戦いながら、最期の記録を残そうとしている。
  motivation: 自分が愛したこと、愛されたという「確かな感覚」だけは、形を変えてでも残すこと。
  relationships:
  - name: 湊 奏汰
    relation: 記憶を整理してくれる相手であり、かつて愛した人
  arc: 忘れることへの恐怖を乗り越え、記憶が消えても「心に灯る温もり」があれば生きていけるという確信を得る。
- name: 影山 宗一郎
  role: 脇役
  age: 65
  gender: 男性
  appearance: 白髪混じりの髪に深く刻まれた皺。使い込まれたベストを着用。穏やかな表情だが、眼光には鋭さがある。
  personality: 哲学的で浮世離れしている。図書館のルールには厳格だが、若者の成長には温かい眼差しを向ける。一人称は「私」。
  speech_style: ゆったりとしたリズムで、教訓めいた言い回しを好む。
  background: 長年この地下図書館を守り続けてきたベテラン司書。図書館が持つ「記憶の重み」と、それが生者に与える影響を熟知している。
  motivation: 図書館が単なる死者の記録保管庫ではなく、生者が明日へ進むための場所であり続けること。
  relationships:
  - name: 湊 奏汰
    relation: 後輩であり、自身の後を継ぐ可能性を持つ存在
  arc: 湊が感情の渦に飲み込まれそうになる際、図書館の真の意味を伝えることで、彼の精神的な自立を促す役割を果たす。
