title: 午前零時の記憶保管所
genre: ヒューマンドラマ
tone: 静謐で哀切、どこか温かい
pov: 三人称近接視点
tense: 過去形
setting: 現代、都市の片隅にある地下鉄の終着駅付近
premise: 街の喧騒から切り離された地下鉄の終着駅のさらに深層には、忘れ去られた記憶が本として収蔵される「地下図書館」が存在する。そこでは、大切な人を亡くした人々が、その人の断片的な記憶を辿るために訪れる。主人公の青年は、その図書館の司書として、遺された言葉を整理し続ける日々を送っていた。ある日、彼は「明日、自分を忘れてしまう」と告げる女性から、一冊の真っ白な本を預かることになる。
themes:
- 喪失と受容
- 記憶の価値
- 生きていくためのさよなら
rules:
- 地下図書館の蔵書は、持ち主がこの世を去る直前に最も強く願った記憶のみが結晶化して生成される
- 記憶を読み取ることは、その人物の感情を追体験することを意味し、精神的な消耗を伴う
- 地下図書館は、最終列車が走り終えた後の静寂の中でしか辿り着けない
plot_outline:
- '序盤: 司書の青年・湊は、地下図書館で静かに日々を過ごしている。彼は、亡くなった人々の記憶を「本」として整える作業を通じて、死者との距離感を学んでいた。'
- '中盤: 記憶喪失の病を抱える女性・凪が現れる。彼女は、自分自身の記憶が消えゆく前に、大切な誰かとの「確かな感覚」を本に残してほしいと願う。湊は彼女の断片的な記憶を辿り、彼女がかつて愛した人が、実は自分自身であったという事実に直面する。'
- '終盤: 凪の病状は進行し、彼女は最終列車が来る時間に向けて、最後の記憶の整理を始める。湊は彼女の願いを叶えるため、彼女が忘れてしまう「痛み」さえも、美しい記憶として綴ろうと葛藤する。'
- '結末: 凪は静かに記憶を失い、日常へと戻っていく。彼女は湊のことを覚えていないが、ふとした瞬間に感じる温もりを糧に、新しい一日を歩み出す。湊は、彼女が残した小さな希望の欠片を、図書館の新しい一冊として大切に保管する。'
style_notes: 過剰な感情描写を避け、雨の匂いや古い紙の質感、夜の静寂といった情景描写を通じて、登場人物の心の揺らぎを表現する。悲劇を強調するのではなく、失うことの不可避さと、それでも残る微かな光を、淡々と、しかし慈しむように綴る。
