- name: 海野 凪（うみの なぎ）
  role: 主人公
  age: 24
  gender: 女性
  appearance: ショートカットの明るい茶髪、動きやすいオーバーオールに、アンティークなペンダントを身につけている。常に好奇心に満ちた瞳をしている。
  personality: 好奇心旺盛で天真爛漫。お宝を見つけると目が輝くタイプ。一人称は「あたし」。
  speech_style: 明るく快活。語尾に「〜だよ！」「〜かな？」など、弾むようなリズムがある。
  background: 海辺の街で、祖父から受け継いだ小さなアンティークショップを営んでいる。古いものに宿る物語を愛している。
  motivation: 街の隠れたお宝や、不思議なアイテムを見つけて世界を広げること。
  relationships:
  - name: レリーフ（喋るレリーフ）
    relation: 騒がしい相棒（？）
  - name: 氷城のマスター
    relation: カフェの店主であり、不思議な体験の導き手
  arc: 自分の好奇心に振り回されるだけでなく、他人の悩みや記憶に寄り添う優しさに気づき、精神的な豊かさを知る。
- name: レリーフ（海底遺跡のレリーフ）
  role: 相棒
  age: 不明（数千年前から存在）
  gender: 不明
  appearance: 深海から引き揚げられた、美しい彫刻が施された石板。時折、紋様が淡く光る。
  personality: おしゃべりで少し自慢屋。歴史に詳しく、知識をひけらかしたがる。一人称は「我（われ）」。
  speech_style: 古風で尊大な口調。「〜である」「〜ではないか」など、時代がかった話し方。
  background: 海底遺跡に眠っていたが、凪が仕入れたことで目覚め、現代の世界に戸惑いつつも楽しんでいる。
  motivation: 自分の正体や、かつて所属していた文明の物語を誰かに知ってもらうこと。
  relationships:
  - name: 海野 凪
    relation: 拾い主であり、賑やかな相棒
  arc: ただ知識を披露する存在から、凪の日常に欠かせない、理解ある話し相手へと変化していく。
- name: 氷城のマスター（霜月 零 / しもつき れい）
  role: 脇役
  age: 32
  gender: 男性
  appearance: 透き通るような白い肌と、銀色に近いプラチナブロンドの髪。常に清潔感のある白いエプロンを着用している。どこか浮世離れした美しさを持つ。
  personality: 冷静沈着でミステリアス。感情の起伏が少ないように見えるが、作るスイーツには深い情愛が込められている。一人称は「僕」。
  speech_style: 丁寧で落ち着いた敬語。静かなトーンで話す。
  background: 街の端にある『氷の城』のようなカフェの店主。不思議な魔法のスイーツを作る技術を持っている。
  motivation: 訪れる客の「凍りついた記憶」を、スイーツの力で温かく溶かすこと。
  relationships:
  - name: 海野 凪
    relation: カフェの常連客であり、興味深い観察対象
  arc: 凪との交流を通じて、完璧にコントロールしていた自分の感情（孤独感など）を少しずつ解きほぐしていく。
