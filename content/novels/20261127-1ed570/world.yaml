title: おしゃべりダイバーと、秘密の冷凍スイーツ店
genre: 日常ほのぼの
tone: 明るく軽快、ときどき甘い
pov: 一人称（あたし）
tense: 現在形と過去形の混合
setting: 海沿いの観光地にある、不思議なアンティークショップと、その裏手にある不思議な氷の城のようなカフェ
premise: 海辺の街でアンティークショップを営むあたしは、珍しい骨董品を見つけるのが生きがい！ある日、深海で見つかったという『海底遺跡のレリーフ』を仕入れることになったんだけど、それがきっかけで、街の端にある不思議な『氷の城』みたいなカフェに通うことになるの。そこは、見た目はキンキンに冷えてるのに、出されるスイーツは心まで温まる魔法の味がするんだから！美味しいものと、ちょっと不思議な探しものに囲まれた、賑やかで美味しい毎日が始まります！
themes:
- 日常の中の小さな魔法
- 美味しいものを通じた交流
rules:
- 氷の城のカフェでは、客が持ち込んだ思い出の品を『味』として再現したスイーツが出される
- 海底遺跡の遺物は、時々おしゃべりをして持ち主を困らせることがある
plot_outline:
- '序盤: 海辺の街でアンティークショップを営むあたしが、海底遺跡から引き揚げられたという不思議なレリーフを仕入れ、それと一緒に店を訪れた常連客と出会う。'
- '中盤: レリーフが喋りだして騒動になるけれど、それをきっかけに、街の伝説にある『氷の城』のようなカフェの存在を知り、そこへ通うようになる。'
- '終盤: カフェのマスターが作る、凍えるほど美しいけれど、食べた瞬間に涙が出るほど温かい『記憶のシャーベット』に、あたしの悩みも溶かされていく。'
- '結末: 特別な事件が解決するわけじゃないけれど、あたしは今日も美味しいスイーツを頬張りながら、新しい『お宝』を探して街を駆け回る！'
style_notes: 一人称は「あたし」。テンポよく、キャラクター同士の掛け合いをメインにする。食べ物の描写は、食感や温度、香りが伝わるように全力で書くこと。読者が「あー、食べたい！」と思うような、美味しそうな描写を毎話必ず入れる。ツッコミを多めに入れ、重くなりすぎないように明るい空気感を維持する。
