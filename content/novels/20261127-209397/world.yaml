title: 灯台の光と、遠い日の銀塩
genre: 歴史・時代小説
tone: 昭和の商店街のような懐かしさと哀愁のある文体
pov: 一人称「わたし」
tense: 過去形
setting: 昭和の中頃、寂れた港町にある「一ノ瀬写真館」および周辺の丘陵地帯
premise: 祖父・源造が遺した写真館を継いだわたしは、境界の向こうへと消えた恋人たちの後日譚と、新たな手紙を見つける。古本屋の佐伯と共に、今度は町に隠されたもう一つの「約束の丘」を目指し、過去の記憶と現在を繋ぐ旅へ踏み出す。古い写真とセピア色の思い出が、失われた時間の中に新たな光を灯す。
themes:
- 記憶の継承
- 失われた時間と再生
- 人と人との繋がり
rules:
- 前作『路地裏の現像所と、名前のない旅人』の登場人物と設定（一ノ瀬華江、佐伯蓮、一ノ瀬源造、九条節子、ジュリアン等）をそのまま引き継ぐ。
- 境界の世界やガラス乾板に関する超常的現象は、あくまで人の記憶や情念の比喩、および祖父が遺した技術的・幻想的な装置の産物として描く。
- 昭和の寂れた港町の情景（潮の香り、古びた商店街、現像液の匂い）を丁寧に描写する。
plot_outline:
- '序盤: 境界の世界から現実に戻ったわたし（華江）は、一ノ瀬写真館の日常を取り戻していたが、棚の奥から祖父が遺した新たな封筒を発見する。そこには「約束の丘」と記された未現像のフイルムと、一羽の渡り鳥の羽が挟まれていた。'
- '中盤: 佐伯と共に、手紙に記された「約束の丘」の手がかりを求めて港町の裏山を登る。道中、かつて祖父が撮影した町の住民たちの古い写真を通じ、この町に隠された知られざる過去と人々の営みの哀愁に触れていく。'
- '終盤: 丘の上にある古い測量小屋にたどり着いた二人は、そこでかつての恋人たちが残した最後のメッセージと、祖父が彼らに託した未来の記録を見出す。突如吹いた潮風が、過去と現在の記憶を鮮やかに呼び覚ます。'
- '結末: すべての真実を受け入れたわたしは、写真館に戻り、訪れる人々の記憶を優しく焼き付ける日常へ戻る。セピア色の写真の中に、確かな未来への希望が写し出されていた。'
style_notes: 一人称「わたし」の回想形式。昭和の商店街のようにどこか懐かしく、少し寂れた空気が漂う哀愁のある文体。古い写真や手紙、現像液の匂いといった小道具を繊細に描写し、読者の郷愁を誘うこと。
