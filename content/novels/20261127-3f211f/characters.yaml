- name: カイ・レン・セリグ
  role: 主人公
  age: 19
  gender: 男性
  appearance: 細身だが作業着に身を包んだ体つきは引き締まっている。常に油汚れのついた手袋を着用。真面目そうな瞳。
  personality: 慎重で努力家。技術への探究心が強い。一人称は「僕」。
  speech_style: 丁寧だが、技術的な議論になると熱が入るやや早口な話し方。
  background: 下層区の貧しい家庭出身。街のインフラを支える職人になることを夢見て、整備士見習いとして採用された。
  motivation: 未熟な自分を克服し、街の生命線を守れる一人の職人として認められること。
  relationships:
  - name: ガルド・ヴォルク
    relation: 師匠・指導役
  - name: エリン・ノヴァク
    relation: 同僚・良き理解者
  arc: 技術への戸惑いや不安を抱える新米から、極限状態の現場で自らの判断と技術で命を救う、誇り高き整備士へと成長する。
- name: ガルド・ヴォルク
  role: 相棒（師匠役）
  age: 52
  gender: 男性
  appearance: 頑強な体格。顔には過去の配管破裂による古い火傷の痕がある。使い込まれた工具ベルトを常に巻いている。
  personality: 無骨で口は悪いが、技術に対しては誰よりも誠実で情熱的。一人称は「俺」。
  speech_style: 短く、断定的な命令口調。専門用語を多用する。
  background: アイシクルの熱導管整備一筋30年のベテラン。かつて「氷の城」の整備にも携わっていた伝説的な職人。
  motivation: 次世代の職人に、単なる修理ではなく「熱を繋ぐ誇り」を伝えること。
  relationships:
  - name: カイ・レン・セリグ
    relation: 弟子
  arc: 頑固なベテランとしてカイに厳しく接するが、カイの成長と新たな感性に触れ、自身の技術の継承に確信を持つ。
- name: エリン・ノヴァク
  role: 脇役
  age: 21
  gender: 女性
  appearance: 動きやすい作業服をスマートに着こなす。ショートカットの髪。冷静な眼差し。
  personality: 冷静沈着で分析能力が高い。理論派だが、現場の直感も大切にする。一人称は「私」。
  speech_style: 論理的で落ち着いた話し方。報告や状況説明が的確。
  background: 中央管理局の技術部門出身だが、現場のリアルを知るために整備士に転向した。
  motivation: データと現場の乖離を埋め、都市のインフラを最適化すること。
  relationships:
  - name: カイ・レン・セリグ
    relation: 同期・戦友
  arc: 理論至上主義的な側面から、現場の不条理や「声なき住民」の存在を認め、共に泥にまみれて働く仲間としての絆を深める。
- name: エリアス
  role: 脇役（氷の城の住人）
  age: 75
  gender: 男性
  appearance: 非常に痩せ細っているが、眼光だけは鋭い。厚手の古い毛布を常に纏っている。
  personality: 静かで、諦観に近い落ち着きを持っている。一人称は「私」。
  speech_style: 穏やかで、どこか遠くを見ているようなゆったりとした話し方。
  background: 「氷の城」に最後まで残り続けた、かつての管理官の末裔。忘れ去られた地区で極限の生活を送っている。
  motivation: 凍てつく世界で、ただ静かに最期を迎えること（当初の目的）。
  relationships:
  - name: カイ・レン・セリグ
    relation: 救済者
  arc: 都市から見捨てられたという絶望の中で、整備士たちがもたらした「熱」を通じて、再び世界との繋がりを感じる。
