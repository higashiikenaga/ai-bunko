title: 凍土の熱導管整備士
genre: ヒューマンドラマ
tone: 真摯で温かみのある、職人気質な語り
pov: 一人称（僕）
tense: 過去形
setting: 永久凍土に囲まれた閉鎖都市「アイシクル」。街の中央にある巨大な蒸気機関から張り巡らされた熱導管が、住民の生命線となっている世界。
premise: 凍てつく街で人々を温める「熱導管整備士」として働き始めた僕。ベテラン職人たちの厳しい指導のもと、配管のわずかな振動や音で異変を察知する技術を学んでいく。ある日、都市の最上層にある放棄された地区「氷の城」へ熱を戻すという困難なミッションが下る。名もなき整備士たちが、誇りと情熱をかけて街の凍った心を溶かしていく物語。
themes:
- 目に見えない仕事の価値
- 技術の継承
rules:
- 熱導管の破損は即、地域全体の凍結を意味し、人命に関わる重大事故となる。
- 蒸気圧の管理には厳格なマニュアルがあり、独断でのバルブ操作は厳禁とされる。
- 整備士は「聴診棒」という専用工具を用い、管壁の振動から内部の蒸気流の状態を診断する。
plot_outline:
- '序盤: 新米整備士として配属された僕が、パージやウォーターハンマーといった専門用語を学びながら、地味で過酷な点検作業に戸惑い、小さな漏水箇所を完遂して初めての達成感を味わう。'
- '中盤: 都市の最上層に位置し、かつての贅沢の象徴だった放棄地区「氷の城」で、古い配管の深刻な破裂が発覚する。そこには公的に忘れ去られた少数の居住者が、極限状態で耐えていたことが判明する。'
- '終盤: 極低温の猛吹雪の中、僕と先輩たちが「氷の城」への熱供給ルートを再開させるため、古びた蒸気機関の再起動と、凍りついた巨大配管の接合という困難な作業に挑む。'
- '結末: 無事に熱が通り、氷の城に灯りがともる。世間からの華やかな称賛はないが、温まったパイプに触れた時、僕たちは整備士としての真の誇りを共有し、僕は一人前の職人への道を歩み始める。'
style_notes: 新人の視点から、専門的な整備知識や用語を丁寧に解説し、読者が共に技術を習得していく感覚を持たせる。派手な展開よりも、ボルト一本を締める、錆を丁寧に落とすといった地道な作業描写にこだわり、静かな達成感を積み重ねる文体とする。
