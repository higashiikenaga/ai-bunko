- name: エリュシオン
  role: 主人公
  age: 124
  gender: 男性
  appearance: 銀髪の長髪を後ろで束ね、常に古びた灯台守の制服を纏っている。瞳は深い藍色で、どこか遠くを見つめるような寂寥感を漂わせる。
  personality: 寡黙で冷静沈着。感情を表に出すことは稀だが、内には強い正義感と慈愛を秘めている。一人称は「私」。
  speech_style: 丁寧で簡潔。余計な言葉を削ぎ落とした、静かで重みのある話し方。
  background: 神凪列島の辺境にある古い灯台で、神威の枯渇を防ぐための「神の警告」を管理し続けてきた守護者。その寿命は人の理を超えている。
  motivation: 漂着した「折れた剣」が引き起こす異変を鎮め、世界の崩壊を防ぐこと。
  relationships:
  - name: セレナ
    relation: 世界の秩序を巡って対立する宿敵
  - name: カイト
    relation: 旅の道中で出会う信頼できる協力者
  arc: 世界の理を守るという「静止した守護者」から、自らの命を賭して新たな時代を拓く「変革の礎」へと変化する。
- name: セレナ・ヴァルキリア
  role: 敵役
  age: 19
  gender: 女性
  appearance: 透き通るような白い肌と、眩いばかりの金髪。神々しいまでの美しさを持ち、常に「折れた剣」を携えている。
  personality: 純粋ゆえに過激。神話の時代を取り戻すことこそが人類への救済だと信じて疑わない。一人称は「私」。
  speech_style: 高潔で慈悲深いが、どこか現実離れした、聖歌のような響きを持つ話し方。
  background: 神々の遺物（レリック）に選ばれた「聖女」。神々が人間に捨てられたという事実に絶望し、神話の再構築を試みる。
  motivation: 「折れた剣」を用いて神々の墓標に到達し、世界の理を書き換えて神話の時代を復活させること。
  relationships:
  - name: エリュシオン
    relation: 世界の行く末を阻む障壁
  arc: 絶対的な救済者としての使命感から、神不在の現実を受け入れ、人間が歩むべき道を見出す過程へと変化する。
- name: カイト
  role: 相棒
  age: 22
  gender: 男性
  appearance: 日焼けした肌と、動きやすさを重視した旅装束。使い込まれた短剣を腰に下げている。快活な印象を与える。
  personality: 楽観的で行動力があるが、観察眼に優れる。過酷な環境でもユーモアを忘れない。一人称は「俺」。
  speech_style: 粗野だが親しみやすい。感情が言葉に乗って出やすい、勢いのある話し方。
  background: 神威の枯渇により困窮する島々の民の出身。神話の時代を「過去の呪縛」として嫌い、人間が自立することを望んでいる。
  motivation: 神々の遺物に翻弄される人々を救い、神に頼らない新しい社会を築くための情報を集めること。
  relationships:
  - name: エリュシオン
    relation: 旅を通じて敬意を抱く師のような存在
  arc: 神への畏怖を抱いていた若者から、神の不在を肯定し、人間自身の力で未来を切り拓く覚悟を持つ者へと成長する。
