title: 断罪の焔と虚空の灯火 ―忘却せし神座の残響―
genre: 伝奇
tone: 荘厳、重厚、悲劇的、神秘的
pov: 三人称
tense: 過去形
setting: 神威が枯渇し、神話の時代の残滓が霧のように漂う黄昏の島国・神凪列島（かんなぎれっとう）
premise: かつて神々が地上を統べた時代、その理を封印するために打ち棄てられた「折れた剣」が、再び血の呼び声に応えて鳴動を始める。古き灯台を守り続ける寡黙な守護者エリュシオンは、剣が放つ呪詛の波動を辿り、神々の墓標へと足を踏み入れる。そこには、失われた神話の断片と、世界の理を書き換えようとする異形の意志が潜んでいた。人間が神の遺物（レリック）を手にしたとき、秩序は崩壊し、新たな神話が綴られようとしている。
themes:
- 神話の終焉と再生
- 遺物（レリック）に宿る宿命
- 忘却されるべき歴史の受容
rules:
- 神の遺物（レリック）は持ち主の精神を侵食し、強大な力を与える代わりに、その者の存在理由（アイデンティティ）を削り取る。
- 世界の境界線は「神威（しんい）」の残量に依存しており、神威が薄れた場所では物理法則が歪み、伝承上の怪異が実体化する。
- 「折れた剣」は完全な形に戻ることはなく、その欠落こそが世界の欠陥を補完する鍵となる。
plot_outline:
- '序盤: 霧深い断崖に立つ古い灯台で、エリュシオンは「神の警告」を告げる灯火を管理していた。ある夜、海中から呪われた「折れた剣」が漂着し、島に異変が起きる。エリュシオンは剣に宿る意志に導かれ、調査を開始する。'
- '中盤: 剣の主を自称する若き聖女が現れ、世界を再構築するために神々の遺物を集めていることが判明する。エリュシオンは彼女を止めるべく旅に出るが、道中で世界の理が崩壊しつつある真実――神々が去ったのではなく、人間に捨てられたのだという伝承の裏側に触れる。'
- '終盤: 聖女が神々の墓標である「虚空の祭壇」に到達し、折れた剣を用いて世界の理を書き換えようとする。エリュシオンは、自らの存在を対価として灯台の光（神威の楔）を解き放ち、暴走する神威を鎮めるべく戦いに挑む。'
- '結末: 世界は書き換えられることなく、しかし神話の時代とは決定的に異なる、神の不在を受け入れた「人間の時代」へと移行する。エリュシオンの姿は消え、古い灯台にはただ、かつての英雄を讃える詩だけが風に運ばれる。'
style_notes: 格調高い文体を用い、歴史の重みを感じさせる描写を徹底する。地の文では「かつて、星々が地を這っていた時代に……」といった伝承の引用や、詩的な比喩を多用すること。地名や術式には、古語や造語を用いた重厚な響きを持たせる。会話劇においては、キャラクターの出自や哲学が反映されるよう、敬語の使い分けや語尾の質感に細心の注意を払う。
