- name: 伝次郎（でんじろう）
  role: 主人公
  age: 19
  gender: 男性
  appearance: 日焼けした肌と快活な瞳を持つ、引き締まった体格の青年。動きやすい着流しと、万屋の仕事用の襷（たすき）を身につけている。
  personality: 情に厚く、考えるより先に体が動く熱血漢。困っている人を見捨てられない。一人称は「俺」。
  speech_style: 威勢がよく、語尾が跳ねるような江戸っ子口調。
  background: 浪待町の長屋で、両親を亡くした後に万屋（よろずや）を営みながら逞しく生きている。
  motivation: 拾った石の謎を解き明かすこと、そして大嵐から町の人々と漁師たちを守ること。
  relationships:
  - name: お花
    relation: 幼馴染であり、密かに想いを寄せている
  - name: 左近
    relation: 石を狙う宿敵
  arc: ただの賑やかな日常を愛する青年から、伝説の力を受け入れ、人々の命を背負って決断を下す勇者へと成長する。
- name: 静馬 左近（しずま さこん）
  role: 敵役
  age: 32
  gender: 男性
  appearance: 鋭い眼光と、痩身ながらも鍛え上げられた体つき。高級だが使い古された着流しを纏い、腰には一振りの鋭い刀を差している。
  personality: 冷静沈着で、目的のためには手段を選ばない冷徹な野心家。一人称は「拙者」。
  speech_style: 丁寧だが、相手を威圧するような冷ややかな口調。
  background: かつて権力者に仕えていたが、古代の遺物による力を求めて放浪する、落ちぶれた元武士。
  motivation: 青い石と古塔の仕組みを利用して、失われた海底文明の力を手に入れ、再び天下に名を轟かせること。
  relationships:
  - name: 伝次郎
    relation: 石を手にした邪魔者
  arc: 伝次郎の純粋な正義感と、自然（嵐）の圧倒的な力の前に、自らの野望の虚しさを知る。
- name: お花（おはな）
  role: 相棒/ヒロイン
  age: 18
  gender: 女性
  appearance: 穏やかで優しい顔立ち。髪を後ろでさっぱりとまとめ、清潔感のある素朴な着物姿。手先が器用。
  personality: 聡明で観察眼が鋭く、騒がしい伝次郎を冷静に支えるしっかり者。一人称は「私」。
  speech_style: 柔らかく、落ち着いた聞き取りやすい話し方。
  background: 長屋の隣家に住む、近所の子供たちからも慕われる世話焼きな娘。
  motivation: 伝次郎の安全を願い、困難に直面する町の人々を精神的に支えること。
  relationships:
  - name: 伝次郎
    relation: 幼馴染で、一番の理解者
  - name: 源蔵
    relation: 尊敬する長老
  arc: ただ守られる存在から、伝次郎が迷った時に真実を見抜く助言を与え、共に困難に立ち向かうパートナーへと変化する。
- name: 源蔵（げんぞう）
  role: 脇役/助言者
  age: 68
  gender: 男性
  appearance: 深く刻まれた皺と、海風に晒されたような逞しい顔を持つ老人。白髪混じりの髭を蓄えている。
  personality: 飄々としていて掴みどころがないが、時折、底知れない知性を覗かせる。一人称は「わし」。
  speech_style: 独特の間があり、昔話を聞かせるような、ゆったりとした古風な語り口。
  background: 浪待町の長老であり、かつては荒波を渡り歩いた老練な漁師。海底の都の伝説を唯一知る人物。
  motivation: 伝説が再び動き出したことを察し、それが町に災いをもたらさぬよう、正しく導くこと。
  relationships:
  - name: 伝次郎
    relation: 成長を見守る孫のような存在
  arc: 伝説の語り部としての役割を果たし、伝次郎が古塔の真実に辿り着くための鍵となる知識を授ける。
