title: 潮騒長屋と、刻を止めた懐中時計の調べ
genre: 歴史・時代小説
tone: 人情味溢れる、活気ある江戸の市井の情緒
pov: 三人称
tense: 過去形
setting: 江戸・浪待町、潮風の香る長屋と海辺の町
premise: 海神との絆を右腕の紋章に宿し、平穏を取り戻した伝次郎だったが、町に奇妙な騒動が持ち込まれる。持ち込まれたのは、針の止まった「壊れた懐中時計」――それは持ち主の嘘を暴き、真実を強制させる「嘘をつけない呪い」の品であった。時計の針が動き出す時、長屋の住人たちの隠された過去と、海神の力が再び交錯する。人々の絆と、季節の味覚が彩る、新たな波乱の物語。
themes:
- 隠し事と真実の重み
- 人と人との信じ合う心
rules:
- 伝次郎の右腕の紋章は、海神の気配や潮の満ち引きに呼応して光る
- 懐中時計が動く間、持ち主は如何なる嘘もつけず、心の内が言葉として溢れ出す
- 海神の力は伝次郎の意志によって制御されるが、使いすぎると体力を激しく消耗する
plot_outline:
- '序盤: 季節は初夏。浪待町では鮎の塩焼きが振る舞われ、長屋は活気付いていた。ある日、万屋の伝次郎のもとに、身元不明の男が「動かなくなった懐中時計」を預けに来る。その時計が持ち主の嘘を暴く呪いの品だと判明し、町には疑心暗鬼の風が吹き始める。'
- '中盤: 時計の影響で、長屋の住人たちが抱える小さな秘密が次々と白日の下に晒され、人間関係に亀裂が入る。そんな中、時計の針が不自然に逆回転を始め、海神の紋章が激しく脈動する。時計の呪いは、単なる嘘の露呈ではなく、海底の都の記憶を現実へと引きずり出す装置であったことが判明する。'
- '終盤: 時計に封じられていた「嘘（偽りの記憶）」が実体化し、町を飲み込もうとする。伝次郎は、自身の紋章の力と、長屋の仲間たちの「嘘偽りのない絆」を武器に、時計の針を止めるべく決死の戦いに挑む。激しい嵐の中、伝次郎は海神の唄を再び紡ぎ、時計の呪いを解き放つ。'
- '結末: 騒動が収まり、時計はただの壊れた品へと戻る。疑い合った仲間たちも、互いの本音を知ることでより深い絆で結ばれる。夕暮れ時、長屋では打ち水とともに、夏を待ちわびる冷やし豆腐の宴が催され、伝次郎は仲間たちの笑い声を聞きながら、穏やかな潮風を感じる。'
style_notes: 藤堂小太郎の筆致を再現。べらんめえ口調の威勢のいい会話文を多用し、長屋の喧騒を躍動的に描くこと。季節の行事や食べ物（鮎、冷やし豆腐など）の描写を細やかに挿入し、五感を刺激する表現を心がける。物語の結末は、理屈ではなく、人々の情愛によって解決する人情ものとして締めくくる。
