title: 藍の残響、再構築される夜の輪郭
genre: 群像劇
tone: 静謐、叙情的、微かな焦燥感と再生の予感
pov: 三人称（視点ごとに文体の温度・質感を変える）
tense: 過去形
setting: 前作から数年後、都市の再開発が一段落し、微かな「記憶の歪み」が街の至る所に定着し始めた現代の都市
premise: 都市の裂け目を経て、不完全さを受け入れた人々。しかし、街には新たな「空白」が生まれていた。古本屋の片隅で拾われた「名前のない猫」の姿と、記憶を綴る古い紙片が、かつて破片を共有した久我、澪、海人の運命を再び静かに揺り動かす。再開発の影で、忘れ去られたはずの感情が「形」を持って現れ始め、彼らは再び、個人の記憶と都市の記憶が交差する地点へと導かれていく。
themes:
- 忘却と継承
- 欠落の再定義
- 個の記憶と都市の集合無意識
rules:
- 都市の再開発が進むほど、排除された記憶は『影』ではなく、より形を成した『現象』として街に定着する
- かつて共鳴した銀色の破片（記憶の断片）を持つ者は、他者の記憶の残滓を視覚的に感知できる
- 『名前のない猫』は、街に漂う行き場のない感情の結節点として現れる
plot_outline:
- '序盤: 安定した日常を送る久我、澪、海人。しかし、街には原因不明の「記憶の混濁」が起き始めていた。古本屋を営む青年・湊は、そこで「名前のない猫」を拾い、その猫が街の消えかけた記憶を運んでいることに気づく。'
- '中盤: 湊が扱う古本の中に、前作の登場人物たちの「失われたはずの記憶」が記されたページが混入していることが判明。久我、澪、海人は、それぞれが抱える新たな違和感から、湊の古本屋へと集い、再び繋がる。彼らの周囲では、街の景色が時折、過去の断片へと書き換わる現象が頻発する。'
- '終盤: 都市の再開発が完成に近づくにつれ、蓄積された「排除された記憶」が巨大な情報の奔流となって、街全体を飲み込もうとする。それは『影』のような攻撃的なものではなく、街の色彩や音を塗り替えてしまう静かな浸食だった。湊、久我、澪、海人は、猫が導く「記憶の澱」の中心部へと向かう。'
- '結末: 彼らは新たな「欠落」を拒絶するのではなく、それも含めて現在の自分たちの輪郭であると定義し直す。奔流は収まり、街は以前よりも少しだけ、過去の痛みを優しく抱えた質感へと変貌する。湊の古本屋には、新しい記憶を携えた猫が、静かに座っている。'
style_notes: 視点人物が変わるごとに、文体の硬度や色彩感を調整すること。エリートの久我の視点では硬質で論理的な乾いた文体、画家の澪では色彩の氾濫を感じさせる感性的で湿り気のある文体、少年の海人では断片的で透明感のある文体、古本屋の湊では埃っぽく温かみのある文体を用いる。異なる物語の断片が、最後に一つの大きな情景へと収束するように構成する。
