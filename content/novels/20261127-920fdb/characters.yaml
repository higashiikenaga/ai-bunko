- name: 蓮見 奏汰
  role: 主人公
  age: 17
  gender: 男性
  appearance: 鋭い眼差しと整った顔立ちだが、どこか虚無感を漂わせている。常に将棋の本や詰将棋のノートを携えている。
  personality: 冷静沈着で極めて合理的。感情の動きを論理で処理しようとする傾向がある。一人称は「僕」。
  speech_style: 無駄を削ぎ落とした、簡潔で淡々とした話し方。
  background: 幼少期から詰め将棋の天才として知られ、周囲との思考速度の差から、他者との関わりに疎くなってきた孤高の少年。
  motivation: 完璧な解答を導き出すこと、そして自分の思考を真に理解してくれる存在を見つけること。
  relationships:
  - name: 氷室 葵
    relation: ライバルであり、唯一対等に思考を交わせる相手
  arc: 論理のみを信じていた世界が、不確実な「感情」という一手を受け入れ、他者と繋がる喜びを知る。
- name: 氷室 葵
  role: ヒロイン/ライバル
  age: 17
  gender: 女性
  appearance: 艶やかな黒髪ロングのクールビューティー。感情を表に出さない端正な容姿で、周囲からは「氷の城」と称される。
  personality: 聡明で落ち着いているが、盤上では驚くほど情熱的。内側に強い意志を秘めている。一人称は「私」。
  speech_style: 丁寧で落ち着いた口調だが、勝負の局面では強い意志が滲み出る。
  background: 無敗を誇る実力者。言葉で自分の感情を伝えるのが苦手なため、無意識に指し手に想いを込めてしまう癖がある。
  motivation: 将棋を通じて、言葉にできない自身の真実を相手に伝えること。
  relationships:
  - name: 蓮見 奏汰
    relation: 魂の共鳴を感じる唯一の理解者
  arc: 鉄壁の防御で心を閉ざしていた少女が、自らの感情を「一手」として曝け出す勇気を得る。
- name: 桐生 誠一
  role: 敵役/ライバル
  age: 18
  gender: 男性
  appearance: 背が高く、威圧感のある体格。常に隙のない制服の着こなしをしている。
  personality: 支配的で伝統主義的。勝利こそが全てであり、相手を屈服させることに執着する。一人称は「俺」。
  speech_style: 自信に満ち溢れ、相手を威圧するような力強い話し方。
  background: 高校将棋界の絶対的王者。旧来の「勝負は相手を叩き潰すもの」という価値観を体現する存在。
  motivation: 自らの絶対的な地位を維持し、次世代の新しい将棋の在り方を否定すること。
  relationships:
  - name: 蓮見 奏汰
    relation: 自身の価値観を脅かす、新世代の異端児
  arc: 勝敗を超えた繋がりを見せる主人公たちの姿に、自身の将棋観の限界を突きつけられる。
- name: 佐藤 陽太
  role: 脇役/友人
  age: 17
  gender: 男性
  appearance: 明るい表情、眼鏡、少し癖のある髪。常にどこか楽しげな雰囲気。
  personality: 明るく社交的。天才たちに囲まれながらも、等身大の高校生として部活を楽しむムードメーカー。一人称は「俺」。
  speech_style: 砕けた、親しみやすい話し方。
  background: 将棋部の一般部員。才能は平凡だが、天才たちの孤独や緊張を和らげる「日常」の象徴。
  motivation: 部員全員が楽しく活動し、部室を最高の場所にすること。
  relationships:
  - name: 蓮見 奏汰
    relation: 部室の隣に座る、少し掴みどころのない友人
  arc: 天才たちの極限状態の間に「日常」という橋を架け、彼らが人間らしい感情を取り戻すのを支える。
