title: 終局のシルエット
genre: 青春恋愛
tone: 頭脳戦の緊迫感と純愛が交錯するシリアスな青春
pov: 三人称近接
tense: 過去形
setting: 現代の私立高校、放課後の将棋部室および冷え切った自習室
premise: 高校生詰め将棋選手権の頂点を目指す孤高の天才・蓮見は、校内で唯一自分の思考速度についてこられる少女・葵と出会う。無敗を誇る二人は、公式戦の決勝で激突する運命を背負いながらも、互いの手筋に隠された秘めた恋心に気づいていく。盤上の冷徹な読み合いと、胸を焦がす熱情のギャップが、二人の関係を劇的な終局へと導く。
themes:
- 頭脳競技と恋愛の融合
- 一手一手に込められた感情の読み合い
- ライバルから恋人への変貌
rules:
- 将棋の対局描写は現実のルールに準拠し、専門用語は文脈から意味が推測できるように配置する
- 登場人物の思考は内面描写を通じて深く掘り下げる
- 鏡や氷の城といったモチーフは、心理描写や特定の対局シーンのメタファーとして自然に組み込む
plot_outline:
- '序盤: 孤高の天才として知られる蓮見が、校内の部室で葵と静かな詰将棋の勝負を繰り広げる。お互いの実力を認め合いながらも、どこか牽制し合う緊張感が描かれる。'
- '中盤: 二人はペアを組んで高校生混合戦に出場する。他者を寄せ付けない圧倒的な連係プレイを見せる中、葵が指した奇妙な一手が、蓮見の心を激しく揺さぶる。その手には、言葉にできない恋の告白が隠されていた。'
- '終盤: 迎えた個人戦の決勝戦。大舞台の静寂の中、まるで「氷の城」のように冷たく堅固な陣形を築く葵に対し、蓮見は自らのプライドと恋心を賭けた捨て身の攻めを敢行する。'
- '結末: 勝負の決着と同時に、二人は「鏡」のように映し合っていた互いの本当の気持ちを確認し合う。勝敗を超えたところで、新たな青春の始まりを迎える。'
style_notes: 三人称近接をとり、将棋などの頭脳競技における緊迫感を徹底して描く。一手一挙手投足に込められた意味を主人公の深い内面と言葉で丁寧に解説し、盤上の局面と恋の駆け引きをシンクロさせる。
