- name: 凪野 しおり
  role: 主人公
  age: 22
  gender: 女性
  appearance: 透き通った瞳と、いつも清潔なエプロン姿。穏やかで落ち着いた雰囲気を持つ。
  personality: 穏やかで聞き上手。少し内向的で、自分の感情を後回しにする癖がある。一人称は「わたし」。
  speech_style: 丁寧で、相手を包み込むような優しい口調。
  background: 霧の街に佇む「記憶の貸し出し店」の店番として、人々の思い出を管理しながら静かに暮らしている。
  motivation: 訪れる人々の心の欠片に寄り添い、彼らが前を向けるようサポートすること。
  relationships:
  - name: 水科 ハル
    relation: 店を訪れた青年・運命的な繋がりを持つ相手
  arc: 他人の記憶を守るだけの受動的な存在から、自分の幸せのために一歩踏み出す能動的な存在へ。
- name: 水科 ハル
  role: 主人公
  age: 24
  gender: 男性
  appearance: 少し癖のある柔らかな髪。どこか寂しげな瞳。古びた壊れた懐中時計を常に大切に持ち歩いている。
  personality: 真面目で不器用。失った記憶に対して強い焦燥感を抱いている。一人称は「僕」。
  speech_style: 控えめだが、誠実さが伝わる落ち着いた話し方。
  background: ある日、自分自身が最も幸せだった瞬間の記憶を失った状態で、導かれるようにこの店へ辿り着く。
  motivation: 失った「一番幸せな記憶」を見つけ出し、止まった時間を動かすこと。
  relationships:
  - name: 凪野 しおり
    relation: 店番の女性・共に記憶を辿るパートナー
  arc: 過去の欠片を追い求める執着から、現在の繋がりを大切にする決意へと変化する。
- name: 源五郎
  role: 脇役
  age: 75
  gender: 男性
  appearance: 白い髭を蓄えた、温厚な風貌の老人。使い込まれたティーカップを愛用している。
  personality: 飄々としていて掴みどころがないが、時折鋭い洞察力を見せる。一人称は「わし」。
  speech_style: 独特の間があり、ゆったりとした、どこか懐かしい老人口調。
  background: 元・店主であり、しおりに店の管理方法や記憶の扱い方を教えた師匠のような存在。
  motivation: 店の伝統を守り、次世代が新しい思い出を紡ぐプロセスを見守ること。
  relationships:
  - name: 凪野 しおり
    relation: 教え子
  arc: 物語の終盤、ハルの過去と現在の結びつきを解き明かす重要な鍵を提示する。
- name: エルナ
  role: 脇役
  age: 35
  gender: 女性
  appearance: 霧のように幻想的な雰囲気を持つ美女。常に銀の香水の香りが漂っている。
  personality: ミステリアスで優雅。すべてを見透かしているような、慈愛に満ちた微笑みを浮かべる。一人称は「私」。
  speech_style: 詩的で、少し浮世離れした、耳に残るような美しい言い回し。
  background: 記憶の店に頻繁に現れる謎の常連客。記憶の貸し出しを頻繁に利用する。
  motivation: 店を訪れる人々の物語が、どのような結末を迎えるかを見届けること。
  relationships:
  - name: 凪野 しおり
    relation: 常連客
  arc: ハルの記憶の断片に関する情報を、しおりに間接的に伝える役割を果たす。
