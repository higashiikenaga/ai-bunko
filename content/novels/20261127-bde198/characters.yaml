- name: エルム
  role: 主人公
  age: 17
  gender: 女性
  appearance: 油に汚れたオーバーサイズのコートを羽織り、額には常に使い古されたゴーグルを乗せている。小柄だが、ジャンク漁りで鍛えられたしなやかな肢体を持つ。
  personality: 現実主義で皮肉屋だが、心の底では未知の世界への強い憧れを抱いている。一人称は「あたし」。
  speech_style: ぶっきらぼうで投げやりな口調。感情が高ぶると早口になる。
  background: 親に捨てられ、鉄の墓場で独り生き抜いてきた孤児のジャンク屋。生きるための最低限の物資確保にのみ執着していた。
  motivation: チップに刻まれた「本物の星」をこの目で見ることで、自分の人生に意味があったと証明したい。
  relationships:
  - name: ゼロ
    relation: 拾い上げた相棒であり、唯一の信頼を寄せる相手
  - name: バルガス
    relation: 追跡してくる宿敵
  arc: 生存のためだけに物を漁っていた状態から、自分のすべてを捧げてでも「美しさ」を追い求める利他的な精神へと変化する。
- name: ゼロ
  role: 相棒
  age: 120
  gender: 不明（男性的な声）
  appearance: 旧時代の案内用アンドロイド。外装の半分が剥落し、内部のフレームと配線が露出している。片方の光学センサーが赤く点滅している。
  personality: 極めて論理的で懐疑的。絶望的な状況を確率論で語るが、時折人間のような情愛を見せる。
  speech_style: 淡々とした機械的な口調。「〜と推測されます」「効率的ではありません」が口癖。
  background: 観測基地の残骸でスリープ状態にあったところをエルムに再起動された。記憶回路の一部が破損しており、断片的な過去の知識を持つ。
  motivation: 創造主である人類への義務感と、自分を直してくれたエルムへの好奇心。
  relationships:
  - name: エルム
    relation: 所有者であり、守るべき対象
  arc: 論理的な正解（生存）よりも、非合理的な希望（星を見る）を選択するエルムに影響され、心に近い感情を学習していく。
- name: バルガス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 継ぎ接ぎだらけの重装甲を身に纏い、右腕を巨大な工業用プレス機に改造した大男。顔には酸性雨による深い火傷跡がある。
  personality: 弱肉強食を信奉する残酷な支配者。力こそが唯一の正義だと信じている。
  speech_style: 威圧的で粗野。相手を見下した笑い方をすることが多い。
  background: 略奪者集団のリーダー。かつては警備兵だったが、組織に見捨てられたことで世界を憎み、力による支配に執着するようになった。
  motivation: 星図チップを奪い、伝説の軌道エレベーターを独占することで、この地獄のような地上で絶対的な神になろうとしている。
  relationships:
  - name: エルム
    relation: 獲物であり、忌々しいほどの純粋さを持つ小娘
  arc: 力で全てを奪おうとするが、最後にはエルムが選んだ「何も持たずに消える」という結末に、理解不能な敗北感を味わう。
