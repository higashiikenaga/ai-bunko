title: 錆びた星図と、腐った空の果て
genre: ディストピア
tone: 乾いた皮肉と、廃墟に差す一筋の光
pov: 一人称（あたし）
tense: 過去形
setting: 高度な文明が自己崩壊し、恒常的な砂嵐と酸性雨に覆われた終末後の地球。残骸だけが巨大な山を成す鉄の墓場。
premise: 空が煤けて星すら見えない時代、あたしはジャンク屋として日々、ガラクタの山から生きるための部品を漁っている。ある日、廃墟の底で『折れた剣』を模した奇妙なアンテナと、古びた『星図』が刻まれた電子チップを見つける。それは、かつて人類が星へ逃げようとした、愚かで美しい計画の遺物だった。あたしはこのガラクタを、空の向こう側へ繋ぐために、命と物資を削りながら旅に出る。
themes:
- 失われた文明の残滓
- 絶望の中の生存本能
- 天文学的なロマンと現実の泥濘
rules:
- 水と燃料は通貨に代わる絶対的な価値を持つ
- 空の高さ（高度）によって、使える技術と酸素濃度が制限される
- かつての自動防衛システムが、今も『侵入者』を排除するために徘徊している
plot_outline:
- '序盤: 砂嵐が吹き荒れる廃墟で、あたしは食料残量を気にしながらジャンク漁りをする。偶然見つけた『折れた剣』型のアンテナと『星図』チップが、ある高地へのルートを示していることを知る。'
- '中盤: 乏しい燃料と弾薬をやりくりしながら、機械化された警備兵や略奪者との死闘を繰り広げる。道中、星図が示す座標が、かつての観測基地であることを突き止める。'
- '終盤: 酸素濃度が薄くなる高地へ到達。アンテナを設置し、チップのデータを読み解くと、星図は脱出用の軌道エレベーターの起動シーケンスだったことが判明する。'
- '結末: 起動の代償として、あたしが持つ最後の一滴の燃料と、大切な道具をすべて使い果たす。空が割れ、一瞬だけ本物の星が見えた刹那、あたしは錆びた大地で静かに笑う。'
style_notes: 「あいにく、あたしの予備バッテリーは残り5％だ。命を救うより先に、このライトが消える方が先かもしれない」といった、物資の枯渇や道具の限界を強調する乾いたユーモアを用いる。荒廃した景色の中にも、錆びた鉄の赤や、汚れた硝子の輝きといった、微かな美しさを情景描写に組み込むこと。口調は荒っぽいが、孤独な旅路の寂しさが滲み出るように書く。
