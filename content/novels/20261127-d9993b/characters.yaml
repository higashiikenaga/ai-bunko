- name: レイ・アルスノヴァ
  role: 主人公
  age: 24
  gender: 男性
  appearance: 灰色の実用的なローブをまとい、常に革製の観測手帳と真鍮の六分儀を手放さない。酷使による目の下のクマと、天体の光を凝視しすぎたためのわずかな視覚障害がある。
  personality: 知的好奇心が異常に強く、冷徹な理性と狂気的なまでの真実への執着を併せ持つ。一人称は「私」。
  speech_style: 論理的かつ慎重だが、研究の話になると早口になり、専門用語や仮説が止まらなくなる。
  background: 辺境の観測所に左遷された若き博物学者。前任者の遺した禁忌の星図を発見したことで、世界の真理に足を踏み入れてしまう。
  motivation: 「蒼白の天蓋」の星々の正体と、この世界の正確な構造を分類・証明すること。
  relationships:
  - name: ルリエ・フォン・ローゼン
    relation: 共同研究者であり、疑念を抱きつつも同行する理解者
  arc: 世界の絶望的な真実を知り、個としての生を捨ててでも、世界の観測記録を後世（あるいは外の世界）に残すことへ自己を捧げる。
- name: ルリエ・フォン・ローゼン
  role: 相棒
  age: 27
  gender: 女性
  appearance: 機能美を重視した旅装束に、星図を読み解くための特製の度付き単眼鏡をかけている。髪は短く切り揃えられている。
  personality: 現実主義で懐疑的だが、根底には失踪した兄への強い思慕がある。一人称は「私（わたし）」。
  speech_style: 歯に衣着せぬ物言いが多く、レイの暴走しがちな仮説を冷静なツッコミで引き戻す。
  background: 伝統ある天文学会の異端派。公式の星図の矛盾に疑問を持ち、独自に調査を進めていたところでレイと出会う。
  motivation: 行方不明になった兄が残した研究の足跡を追い、星々の軌道の秘密を解き明かすこと。
  relationships:
  - name: レイ・アルスノヴァ
    relation: 危険な狂気を感じつつも、共に真実を追う相棒
  arc: 世界の真実が巨大な捕食者の体内であると知絶望するが、レイの意志を受け継ぎ、生き残りとしての役割を模索する。
- name: バルド・ガレオン
  role: 脇役
  age: 42
  gender: 男性
  appearance: 筋骨隆々とした体躯に歴戦の傷跡。浮遊島間の移動に使用する蒸気船の操縦士であり、全身に航海用の防護具をまとっている。
  personality: 無愛想で現実的、金銭と安全第一主義。しかし、いざという時の判断力と胆力は抜群。一人称は「俺」。
  speech_style: 荒っぽく短い言葉で話すが、どこかユーモアや諦念を含んだ皮肉屋。
  background: 長く辺境の空域を飛んできた熟練の操縦士。星々の異常な挙動の変化に、誰よりも早く肌感覚で気づいていた。
  motivation: 高額な報酬と、自身の船と乗組員を無事に安全圏へ連れ帰ること。
  relationships:
  - name: レイ・アルスノヴァ
    relation: 「変なことばかり考える学者だが、腕は確かだ」と信頼している
  arc: 最初は雇い主と用心棒の関係だったが、世界の崩壊の危機に際し、命を賭してレイたちの脱出をサポートする。
