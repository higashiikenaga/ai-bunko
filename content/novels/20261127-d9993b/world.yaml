title: 擬態する星座の分類学的考察 ―辺境領域における座標喪失の記録―
genre: 異世界ファンタジー
tone: 乾いた学術的・分析的な報告書形式
pov: 三人称（記録者の視点）
tense: 過去形（事後報告的な記述）
setting: 「蒼白の天蓋」と呼ばれる、巨大な有機的空洞に浮遊する諸島群。空に浮かぶ星々は光る天体ではなく、天蓋に寄生する未知の感覚器官である。
premise: ある若き博物学者が、禁書に指定されていた「星図」と、それに付随する「秘密の地図」を発見する。調査の結果、彼らは自分たちの住む世界が巨大な生物の消化器官内部であるという戦慄すべき仮説に到達した。星々が座標を変えて「獲物」を追い詰める法則を解明したとき、世界の真の姿が露わになる。
themes:
- 認識論的恐怖
- 生存と真実の等価交換
rules:
- 星（感覚器官）に長時間注視した者は、精神が同期し、肉体が結晶化する「星蝕」を起こす。
- この世界では固定された北極星が存在せず、座標は天蓋の脈動に合わせて変動する。
- 秘密の地図に記された「盲点（ブラインドスポット）」にのみ、天蓋の監視を逃れて移動することが可能である。
plot_outline:
- '序盤: 忘れ去られた観測所で、主人公が前任者の遺した不完全な調査報告書と、既存の天文学を否定する不可解な星図を発見する。'
- '中盤: 星図の指示に従い、地図に記された「盲点」を巡る旅を開始。同行する学者たちと、星々が意思を持って移動し、特定の個体を「選別」している事実に気づく。'
- '終盤: 秘密の地図の終着点である「天蓋の眼」へと到達。自分たちが信じていた世界の構造が、巨大な捕食者の内部であるという生物学的真実を突き止める。'
- '結末: 主人公は世界を脱出する唯一の手がかりを得るが、それは自身の記憶と存在を「記録」として世界に還元し、誰にも知られない座標へと消えることを意味していた。'
style_notes: 架空の論文形式を採用。地の文は「～と考えられる」「～であると推察される」といった客観的な記述に徹し、物語の核心部分は「資料A」「証言録」などの断片的な引用として挿入する。また、本文中に【注釈1：〇〇参照】といった形式の脚注を多用し、読者が資料をパズルのように組み合わせて物語を理解させる構成とする。
