- name: カイ・レン
  role: 主人公
  age: 22
  gender: 男性
  appearance: 清潔感はあるが、どこか焦点の定まらない虚ろな瞳。首筋に知識同期用の端子がある。
  personality: 内省的で繊細。効率至上主義の社会に馴染もうと努めるが、常に心の空虚さを感じている。一人称は「僕」。
  speech_style: 丁寧だが、どこか自信なさげで落ち着いた話し方。
  background: 都市のデータ管理部門に所属する若手職員。同期によって得られる膨大な知識を処理するだけの、受動的な日常を送っている。
  motivation: 同期生活では得られない、自分の感覚に根ざした「手応えのある実感」を見つけること。
  relationships:
  - name: エリアス・ヴォーン
    relation: 師であり、価値観を教える存在
  arc: 情報の受動的な消費者から、自らの速度で言葉を咀嚼し、思考する自立した個人へと成長する。
- name: エリアス・ヴォーン
  role: 相棒/導き手
  age: 68
  gender: 男性
  appearance: 深く刻まれた皺、油とインクの匂いが染み付いた作業着。使い古された眼鏡をかけている。
  personality: 偏屈で口が悪いが、本と紙の質感に対しては異常なまでの敬意を持つ。一人称は「私」。
  speech_style: ゆっくりとした、重みのある言葉選び。比喩表現が多い。
  background: かつては都市の知識体系を構築する一員だったが、現在は地下図書館の維持管理を独力で行っている。
  motivation: 物理的な本という「情報の結晶」が、効率の波に飲み込まれて消えるのを防ぎ、その価値を繋ぐこと。
  relationships:
  - name: カイ・レン
    relation: 教え子であり、次世代の継承者
  arc: 孤独な守護者としての役割を終え、自分の意志を継ぐ者を見出すことで、静かな充足を得る。
- name: セラフィナ・クロム
  role: 敵役
  age: 30
  gender: 女性
  appearance: 一切の乱れがない白磁のような肌とスーツ。無機質で完璧な美しさを持つ。
  personality: 徹底した合理主義者。悪意ではなく、都市の最適化という「善意」に基づいて行動する。一人称は「私」。
  speech_style: 淀みのない、論理的で明快な話し方。感情の起伏が乏しい。
  background: 都市再開発計画の執行責任者。地下区画の完全封鎖と、非効率な旧設備の撤去を指揮している。
  motivation: 都市全体の同期効率を最大化し、リソースの無駄をゼロにすること。
  relationships:
  - name: カイ・レン
    relation: 管理対象の市民、および理解不能なイレギュラー
  arc: 効率化の先に「正解」があると考えていたが、カイの変容を通じて、計算不能な人間の精神の深淵に直面する。
- name: レン・カイト
  role: 脇役
  age: 22
  gender: 男性
  appearance: 常に明るく、瞳には同期情報による光が絶えず明滅している。
  personality: 社交的で快活。情報の更新速度に快感を覚える、同期社会の典型的な市民。一人称は「俺」。
  speech_style: 早口で、情報の断片を繋ぎ合わせたような現代的な話し方。
  background: カイの同期職員であり、最も親しい友人。情報の同期速度を競うことに喜びを感じている。
  motivation: より高度な知識同期、より速い思考処理能力の獲得。
  relationships:
  - name: カイ・レン
    relation: 親友
  arc: カイの変容を「同期の不具合」として理解できず距離を置くが、結末ではカイが持つ「静かな強さ」に漠然とした畏怖を抱く。
