title: 白磁の街と、地下の呼吸
genre: ヒューマンドラマ
tone: 静謐で淡い、近未来のノスタルジー
pov: 三人称近接
tense: 過去形
setting: 全市民が知識を脳に直接同期（シンク）する近未来都市。その最下層にひっそりと残された、物理的な本を保管する地下図書館。
premise: 効率的な同期生活に倦んでいた青年が、偶然にも物理的な本が残る地下図書館に迷い込む。そこでは、旧時代の蒸気機関で湿度を管理し、紙の匂いを守り続ける孤独な司書がいた。効率を捨てて「時間をかけて読む」という贅沢を知った彼は、同期では得られない心の空白を埋めていく。
themes:
- 効率と贅沢の境界
- 不便さがもたらす人間らしさ
rules:
- 知識の同期（シンク）により、学習というプロセスがほぼ消滅している。
- 物理的な本は法的に禁止ではないが、衛生と効率の観点から社会的に忌避されている。
- 地下図書館の空調システムは、現代の電磁制御ではなく、古い蒸気機関による物理的な温湿度管理に依存しているため、独特の熱気と音が漂っている。
plot_outline:
- '序盤: 同期生活による「正解しかない日常」に違和感を抱く主人公が、都市のメンテナンス経路を散策中に、忘れ去られた地下図書館に辿り着き、偏屈な司書と出会う。'
- '中盤: 同期では得られない「読む」という身体的な体験を通じて、言葉を咀嚼する喜びを知る。司書と共に、蒸気機関の錆びたバルブを調整しながら、ゆっくりと流れる時間の中に安らぎを見出す。'
- '終盤: 都市の再開発計画により、地下図書館がある区画の完全封鎖と、唯一の動力源である蒸気機関の停止が決定する。'
- '結末: 図書館は失われるが、主人公は「自分の速度で思考すること」という、同期社会では得られない武器を手にする。司書から譲り受けた一冊の本を胸に、白磁の街で静かに、けれど自立して生き始める。'
style_notes: 近未来のガジェットを日常の風景として淡々と描写し、それと対比させる形で、紙の質感や蒸気の熱、インクの匂いなどの身体的な感覚を丁寧に書き込む。便利さへの絶望ではなく、便利さの裏側にある小さな寂しさを肯定する筆致を徹底する。
