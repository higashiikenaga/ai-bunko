- name: 瀬戸 透
  role: 主人公
  age: 17
  gender: 男性
  appearance: 色素の薄い瞳と、どこか儚げな印象を与える細身の少年。常に雨傘を持ち歩いている。
  personality: 誠実すぎるがゆえに孤独。自分の言葉が誰かを傷つけることを恐れている。一人称は「僕」。
  speech_style: 飾りのない率直な話し方。社交辞令や嘘が一切つかず、結論から先に述べる傾向がある。
  background: 生まれ持った、あるいはある出来事をきっかけに「嘘をつけない」という呪いのような特性を持つ。その純粋さが周囲に敬遠され、学校では透明人間のような存在として生きている。
  motivation: ありのままの自分を受け入れてくれる居場所を探すこと。そして、消えゆく運命にある凪を救うこと。
  relationships:
  - name: 星凪
    relation: 魂の理解者であり、恋い慕う相手
  - name: 司馬 律
    relation: 不思議な喫茶店の店主であり、人生の導き手
  arc: 真実を語ることが「呪い」ではなく、誰かを救うための「武器」であることを知り、運命に抗う強さを得る。
- name: 星凪
  role: ヒロイン
  age: 17
  gender: 女性
  appearance: 夜空のような深い黒髪に、星を散りばめたような瞳を持つ。白いエプロンを身に纏っている。
  personality: 穏やかで慈愛に満ちているが、どこか諦念を抱えた寂しげな雰囲気を持つ。一人称は「私」。
  speech_style: 静かで詩的な口調。星や宇宙に例えた比喩表現を多用する。
  background: 雨の日だけ現れる喫茶店『プラヴィオ』で働く少女。正体は「星の記憶」を整理し、天界へ返す役割を担う存在であり、特定の天体現象が訪れるとこの世界から消滅する運命にある。
  motivation: 消滅するまでの短い時間の中で、誰よりも純粋な真実を語る透との絆を深めること。
  relationships:
  - name: 瀬戸 透
    relation: 自分の存在を真に肯定してくれた唯一の人間
  - name: 司馬 律
    relation: 雇い主であり、運命を共有する管理責任者
  arc: 消えゆく運命を受け入れていたが、透の「真実の言葉」によって、この世界に留まりたいという強い生への欲求を抱く。
- name: 司馬 律
  role: 導き手
  age: 32
  gender: 男性
  appearance: 銀縁眼鏡をかけ、三つ揃えのスーツを完璧に着こなす知的な風貌。常に冷徹な微笑を浮かべている。
  personality: 理知的で皮肉屋だが、根底には深い人間愛を持つ。一人称は「私」。
  speech_style: 慇懃無礼で丁寧な口調。相手の核心を突くような問いかけを好む。
  background: 喫茶店『プラヴィオ』の店主。人間界と星の世界の境界線を管理しており、凪の運命についても熟知している。透の特性に興味を持ち、彼を店に招き入れる。
  motivation: 停滞した運命に、透という「不確定要素（真実）」がどのような変化をもたらすかを観察すること。
  relationships:
  - name: 星凪
    relation: 保護者であり、厳しい管理責任者
  - name: 瀬戸 透
    relation: 運命を揺さぶる可能性を秘めた興味深い客
  arc: 冷徹な観察者として振る舞っていたが、透と凪の純粋な想いに触れ、密かに二人の時間を延ばすための手助けを始める。
