title: 雨滴の銀河と、真実を綴る旋律
genre: 青春恋愛
tone: 静謐で詩的、どこか切ない夜の空気感
pov: 三人称
tense: 過去形
setting: 雨の多い海辺の町、放課後の静かな喫茶店
premise: 嘘をつけない呪いを受けた少年・透は、そのあまりに純粋すぎる言葉ゆえに、他者との間に透明な壁を感じて生きてきた。ある雨の日、彼は路地裏で「雨の日だけ開く」不思議な喫茶店を見つけ、そこで働く孤独な少女・凪と出会う。言葉を偽ることのできない彼と、星の瞬きのように儚い彼女。降り続く雨の中で、二人は剥き出しの真実を交わしながら、互いの欠落を埋めていく。
themes:
- 言葉の純粋さ
- 孤独の共有と救済
rules:
- 主人公の透は、思考した真実をそのまま口にせずにはいられない呪いを受けている
- 喫茶店『プラヴィオ』は、雨が降っている間だけ、特定の座標に現れる
- 登場人物の感情の昂ぶりは、必ず天体現象や星座の動きに比喩される
plot_outline:
- '序盤: 嘘をつけない苦悩から周囲と距離を置く透が、激しい夕立の中で喫茶店『プラヴィオ』に迷い込み、凪と出会う。春の夜、オリオン座が天頂を過ぎる頃。'
- '中盤: 雨の日ごとに通い詰める中で、透は凪が「星の記憶」を整理する役割を担っていることを知る。二人は星座の神話に自分たちの境遇を重ね、静かな会話を重ねる。カシオペア座が導くような、揺るぎない信頼が芽生える。'
- '終盤: 凪の存在自体が、特定の天体現象が過ぎ去ると共に消滅してしまう運命であることが判明する。透は呪いである「真実」を武器に、彼女をこの世界に繋ぎ止めるための、嘘のない、けれど最も美しい言葉を探し出す。'
- '結末: 止まない雨の中、透は魂を削るような真実の愛を告げる。それは流星群のように一瞬の輝きではなく、夜空に刻まれた恒星のように、二人の時間を永遠に照らし始める。'
style_notes: 星の名前や天体現象を、登場人物の心情や季節感を描写するための比喩として多用すること。夜空の静寂、星々の瞬き、天体の運行を、静かな会話劇の中に織り込むような、ロマンチックで透明感のある文体を維持する。
