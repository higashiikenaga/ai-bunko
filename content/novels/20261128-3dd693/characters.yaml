- name: カイ・ヴァン・エクリプス
  role: 主人公
  age: 15
  gender: 男性
  appearance: 無造作な茶髪に飛行用ゴーグル。使い古された革の飛行服を纏っている。
  personality: 好奇心旺盛で直感的。困難に直面しても折れない明るさを持つ。一人称は「僕」。
  speech_style: 元気で勢いのある口調。「～だよ！」「～じゃないか！」
  background: 浮遊島のスクラップ拾いで暮らす孤児。亡き父は伝説の飛行士だった。
  motivation: 父の遺した懐中時計の謎を解き、世界の真実を知ること。
  relationships:
  - name: リナ
    relation: 信頼する相棒
  - name: ヴォルガ
    relation: 宿敵
  arc: 受動的なスクラップ拾いから、風を読み世界を導く真の飛行士へと成長する。
- name: リナ・メイフィールド
  role: 相棒
  age: 16
  gender: 女性
  appearance: 銀色のショートヘア。油汚れのついた作業着と多機能工具ベルトが特徴。
  personality: 冷静沈着で現実主義。機械に対する情熱は誰にも負けない。一人称は「私」。
  speech_style: 理知的で少しぶっきらぼう。「～ね」「～でしょ」
  background: 浮遊島のジャンク屋の娘。機械の構造を直感的に把握する天才的な技術を持つ。
  motivation: 最高の飛空艇を作り上げること、そしてカイの旅を支えること。
  relationships:
  - name: カイ
    relation: 大切なパートナー
  arc: 他人に心を開かない孤独な職人から、仲間と共に空を駆ける喜びを知る少女へ。
- name: ヴォルガ・レギウス
  role: 敵役
  age: 45
  gender: 男性
  appearance: 威圧的な体格。黒い帝国軍の制服を着用。右目に機械化されたモノクル。
  personality: 冷酷かつ規律を重んじる。力による秩序こそが世界を救うと信じている。一人称は「私」。
  speech_style: 威厳のある命令口調。「～せよ」「～に過ぎない」
  background: 帝国空軍の最高司令官。世界の風を制御し、絶対的な支配を望んでいる。
  motivation: 天空の心臓を軍事利用し、世界を帝国の管理下に置くこと。
  relationships:
  - name: カイ
    relation: 排除すべきイレギュラー
  arc: 自然の摂理を力でねじ伏せようとして、空の真の力に敗北する。
- name: サイラス・グレイス
  role: 脇役
  age: 62
  gender: 男性
  appearance: 白髪混じりの長い髭。使い込まれた航海士の外套を纏っている。
  personality: 飄々としていて掴みどころがない。博識で穏やかな隠者。一人称は「わし」。
  speech_style: 古風で謎めいた言い回し。「～かのう」「～じゃ」
  background: かつて伝説の飛行士の一員だったとされる、謎多き老人。
  motivation: 世界の風が再び正しく流れる瞬間を見届けること。
  relationships:
  - name: カイ
    relation: 導き手
  - name: リナ
    relation: 才能を認める対象
  arc: 過去の悔恨を乗り越え、次世代に空の希望を託すことで精神的な救済を得る。
