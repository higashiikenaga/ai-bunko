title: スカイ・ルーツ ―風の旋律と壊れた時計の航跡―
genre: スチームパンク冒険
tone: 爽快でエネルギッシュ、雲を突き抜けるような疾走感
pov: 三人称
tense: 過去形
setting: 浮遊大陸群が点在する空中世界。巨大な蒸気機関と飛行技術が発達した時代。
premise: 空賊の少年カイは、亡き父の遺品である『壊れた懐中時計』を手に、空の果てを目指す。時計の針が止まった理由は、世界の風を操る伝説の翼を探す鍵だった。旅の途中で出会ったメカニックの少女と共に、超高性能飛空艇『アズール・ウィング号』を駆って、雲海の向こう側に隠された真実へと突き進む。
themes:
- 空への憧憬
- 失われた記憶の再生
- 仲間との絆
rules:
- 高度が上がるほど空気密度が下がるため、高度維持には蒸気噴射による翼の制御が不可欠である
- 特定の気象条件下でのみ、空間の裂け目から『雨の日だけ開く店』のような異界への入り口が現れる
plot_outline:
- '序盤: 浮遊島でスクラップ拾いをするカイが、父の懐中時計が不思議な振動を起こすのを目撃する。同時に、謎の追跡者から逃れるため、相棒の少女と共にボロい飛空艇で空へと飛び立つ。'
- '中盤: 激しい嵐の中、偶然にも『雨の日だけ開く店』に迷い込み、懐中時計の修理に必要な「星屑の歯車」を手に入れる。仲間が増えるたび、飛空艇はより強固な絆で結ばれ、改造されていく。'
- '終盤: 懐中時計が示す座標は、世界の中心にある『天空の心臓』だった。帝国軍の巨大戦艦による包囲網を、カイたちは風を読み、翼を操る華麗な飛行技術で突破していく。'
- '結末: 心臓に辿り着いた一行は、世界に新たな風を吹き込む。壊れた時計が再び時を刻み始め、彼らは未知なる青空へと、さらなる冒険を求めて高度を上げていく。'
style_notes: 機械の駆動音、蒸気の噴出、そして吹き抜ける風の感触を五感に響く言葉で描写すること。空の青さや雲の白さを、躍動感のある色彩豊かな表現で綴り、読者が共に風に乗っているような爽快感を与えること。
