- name: 瀬戸 栞
  role: 主人公
  age: 17
  gender: 女性
  appearance: 清楚で控えめな印象。肩にかかる程度の長さの黒髪と、少し伏せがちな瞳が特徴。
  personality: 内向的で感受性が強く、物事を深く考えるタイプ。周囲に馴染もうと努めているが、心のどこかで孤独を感じている。一人称：私
  speech_style: 丁寧で穏やか。言葉を選んで話す癖がある。
  background: ごく普通の高校二年生。放課後は図書館で本を読むことを日課としており、静かな時間を好む。
  motivation: ノートの相手と心を通わせ、自分自身の本当の気持ちを誰かに知ってほしい。
  relationships:
  - name: 湊 凪斗
    relation: 秘密の文通相手 / 片思いの相手
  - name: 海野 陽葵
    relation: 友人
  arc: 自分の感情を隠して生きる受動的な姿勢から、大切な人に言葉を届けるために一歩踏み出す積極的な姿勢へと変化する。
- name: 湊 凪斗
  role: 相棒（メインヒーロー）
  age: 17
  gender: 男性
  appearance: 少し長めの前髪で、どこか影のある瞳。痩せ型で、制服の着こなしも少し無頓着。
  personality: 無口で冷淡に見られがちだが、実際は非常に繊細で、豊かな想像力と詩的な感性を持つ。一人称：僕
  speech_style: 学校では一言二言の短い言葉。ノートの中では、情緒的で率直な言葉を用いる。
  background: 家庭の事情で転校が決まっており、周囲との関わりを避けて自分の世界（地図）に閉じこもっている。
  motivation: 自分の存在が消えてしまう前に、自分の見た世界を誰かに共有したい。
  relationships:
  - name: 瀬戸 栞
    relation: 秘密の文通相手 / 唯一の理解者
  arc: 孤独を抱え込み、世界から隔絶されていると感じていた状態から、誰かと繋がることで未来へ進む勇気を得る。
- name: 海野 陽葵
  role: 脇役
  age: 17
  gender: 女性
  appearance: 明るい茶髪のショートカット。いつも笑顔で、流行を取り入れた快活な服装をしている。
  personality: 社交的で明るいクラスのムードメーカー。直感力が鋭く、栞のわずかな変化に気づく。一人称：私
  speech_style: はきはきとした、活気のある話し方。語尾が明るい。
  background: 栞のクラスメイトで数少ない友人。栞が一人でいることを心配し、もっと外の世界を楽しんでほしいと願っている。
  motivation: 大切な友人である栞が、自分らしく笑える場所を見つけること。
  relationships:
  - name: 瀬戸 栞
    relation: 友人
  arc: 栞の秘密に踏み込みすぎず、しかし彼女が自分自身の力で踏み出すのを優しく見守る理解者となる。
- name: 蔵本 賢二
  role: 脇役
  age: 58
  gender: 男性
  appearance: 白髪混じりの短髪、使い込まれた眼鏡。常に古い本の匂いがする、穏やかな佇まい。
  personality: 温厚で思慮深く、生徒たちの変化を静かに見守っている。一人称：私
  speech_style: ゆったりとしていて、落ち着いたトーン。包容力を感じさせる。
  background: 街外れの古い図書館を長年守り続けている司書。ノートが二人の出会いの場となった場所の管理者。
  motivation: 図書館が、迷える若者たちの心の拠り所であり続けること。
  relationships:
  - name: 瀬戸 栞
    relation: 見守る立場の人
  arc: 物語の舞台としての図書館の象徴として、二人の物語が紡がれるプロセスを静かに肯定する役割を果たす。
