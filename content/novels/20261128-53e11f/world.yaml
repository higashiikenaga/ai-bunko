title: 淡い恋色、秘密のページ
genre: 青春恋愛
tone: 甘くて切ない、内省的な雰囲気
pov: 一人称（わたし）
tense: 過去形
setting: 現代、海が見える静かな地方都市の高校と、街外れの古びた図書館
premise: 図書館の隅で、誰が書いたかわからない「町中の秘密の場所」を記した手書きの地図を拾ったわたし。そこに書き込まれた寂しげな言葉に惹かれ、こっそり返事を書き込み始めると、それはクラスで孤立している少年・湊くんとの秘密のやり取りに変わっていく。言葉だけで繋がった二人は、地図に記された場所を巡るうちに、互いの孤独と淡い恋心に気づき始める。
themes:
- 孤独と共鳴
- 言葉にできない想い
rules:
- 地図のやり取りは、図書館の特定の棚にある一冊のノートを通じてのみ行う
- お互いの正体を明かすのは、地図の最後の目的地に辿り着いたときにするという暗黙のルールを設ける
plot_outline:
- '序盤: 図書館で「秘密の地図」が描かれたノートを拾い、正体不明の相手と文通を始める。相手がクラスメイトの湊くんだと気づくが、あえて正体を隠して、ノートの中だけで本当の自分をさらけ出す。'
- '中盤: 地図に記された「放課後の屋上」や「夕暮れの海岸」など、二人だけの思い出の場所を巡る。現実では目も合わせられない関係だが、ノートの中では誰よりも近い距離になり、次第に恋心が芽生える。'
- '終盤: 湊くんが家庭の事情で遠くへ転校することが判明する。同時に、ノートの最後に記されていた目的地が「月食が見える丘」であり、その日が転校の前日であることが明かされる。'
- '結末: 月食の夜、暗がりの丘の上でようやく正体を明かし、不器用な告白を交わす。離れ離れになっても、この「秘密」という絆を胸に、それぞれの場所で前を向いて歩き出すことを誓い合う。'
style_notes: 一人称「わたし」で綴り、心の声を多めに配置する。「〜かな」「〜みたい」といった柔らかい語尾を使い、切なさと甘さが同居する情緒的な文体にする。毎話のラストには、「ねえ、明日はどんな言葉が書いてあるのかな」といった、読者が次を読みたくなる期待感のある一言を必ず添えること。
