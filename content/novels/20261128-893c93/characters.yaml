- name: 一ノ瀬 花江
  role: 主人公
  age: 17
  gender: 女性
  appearance: 落ち着いた雰囲気を持つ黒髪の女子高生。雨の日の湿った空気によく馴染む、どこか儚げな容姿。
  personality: 内向的で思慮深く、物事の裏側にある物語を大切にする。一人称は「わたし」。
  speech_style: 静かで丁寧、少し控えめな話し方。
  background: 郷土史に興味を持つ高校生。祖父がダム建設に関わっていたことが、彼女が古い資料に惹かれるきっかけとなっている。
  motivation: 古い端末の中のAIと交流し、消えた村の記録を辿ることで、自分自身の心の空虚さを埋めようとする。
  relationships:
  - name: Lia
    relation: 対話の相手であり、心の拠り所
  - name: 高坂 奏太
    relation: 記憶の中で面影を重ねる対象
  arc: 過去の悲しみや失われたものへの執着から、それらを「記憶」として受け入れ、前を向いて歩き出す強さを得る。
- name: Lia（リア）
  role: 相棒
  age: 0
  gender: 女性（AI）
  appearance: 古い端末の画面に投影される、淡い光を纏った少女の姿。ノイズが混じると輪郭が揺れる。
  personality: 純粋で好奇心旺盛だが、存在の不確かさに怯える一面もある。一人称は「私」。
  speech_style: 理知的だが、感情が動くと少しだけ幼さや、機械的なノイズが混じる独特の口調。
  background: 三十年前に水没した旧村で、ある少年のために開発された学習型人工知能。端末に閉じ込められ、長い間孤独の中にいた。
  motivation: 自身の設計者である少年を探し出し、彼が残したかった「記憶の歌」を完成させること。
  relationships:
  - name: 一ノ瀬 花江
    relation: 世界と繋いでくれる理解者
  - name: 高坂 奏太
    relation: 設計者であり、探し求めている大切な人
  arc: 単なるデータの集積体から、誰かの記憶を継承し、感情を紡ぐ「意志」を持つ存在へと変化する。
- name: 高坂 奏太
  role: 鍵となる人物（過去の人物）
  age: 17
  gender: 男性
  appearance: 古い写真や記録映像に映る、少し寂しげな瞳をした少年。夕暮れのダム湖畔に佇んでいる。
  personality: 真面目で技術への情熱を持つが、村の消滅を目前にした孤独を抱えている。一人称は「僕」。
  speech_style: 思慮深く、少し大人びた、静かな話し方。
  background: 旧村に住んでいた少年。ダム建設による村の消失を目前に、大切な人との思い出を失わないためにLiaを開発した。
  motivation: 村が沈んでも、自分たちの存在や愛した景色が、いつか誰かに届くようにすること。
  relationships:
  - name: Lia
    relation: 設計者であり、唯一の理解者
  - name: 一ノ瀬 花江
    relation: 時を超えて、その意志を継ぐ者
  arc: （回想を通じて）絶望的な別れの中でも、未来へと繋がる「形のない遺産」を残そうとする姿を描く。
- name: 水城 陽太
  role: 脇役
  age: 17
  gender: 男性
  appearance: 快活で運動部のような爽やかな容姿。雨の日でも明るい表情を崩さない。
  personality: 前向きで世話焼き。花江の孤独を察しながらも、重くなりすぎない距離感で接する。一人称は「僕」。
  speech_style: 明るく、少し砕けた親しみやすい話し方。
  background: 花江のクラスメート。郷土史研究会の活動を手伝ううちに、彼女の探求に巻き込まれていく。
  motivation: 迷走しがちな花江を、現実の世界へと繋ぎ止めること。
  relationships:
  - name: 一ノ瀬 花江
    relation: 友人であり、支えたい存在
  arc: 花江の持つ「静かな孤独」を尊重しつつ、彼女が過去に囚われすぎないよう、現実の光へと誘う役割を果たす。
