- name: カイ・ヴィルヘルム
  role: 主人公
  age: 17
  gender: 男性
  appearance: 無造作な茶髪に、常に油汚れのついた整備用ゴーグルを頭に乗せている。小柄だが引き締まった体格。
  personality: 好奇心旺盛で真っ直ぐな性格。機械に対しては異常なまでの愛情と執着を持つ。一人称は「僕」。
  speech_style: 基本的には丁寧だが、機械の構造や修理の話になると早口で熱を帯びる。
  background: 辺境の浮遊島で、古い部品を集めては機械を直して暮らす孤児の整備士。伝説の飛空艇『アズール』と共鳴する資質を持つ。
  motivation: 灯台の光の正体を突き止め、機械の力で世界の崩壊を食い止めること。
  relationships:
  - name: リナ・エステラ
    relation: 航海を共にするパートナー
  - name: ゼファー・ヴォルガード
    relation: 頼れる兄貴分であり操縦の師
  arc: ただの修理屋から、世界の重力を司る真実を背負い、仲間を導くリーダーへと成長する。
- name: リナ・エステラ
  role: 相棒
  age: 16
  gender: 女性
  appearance: 風にたなびく長い銀髪と、澄んだ碧眼。航海士の白い制服を身に纏っている。
  personality: 冷静沈着で直感に優れた航海術士。感情を表に出すのは苦手だが、内面は情熱的。一人称は「私」。
  speech_style: 理知的で簡潔。風の動きを読み上げる際は、どこか詩的な響きを持つ。
  background: 風の力を操る「航海術士」の血を引く家系の末裔。家系が守り続けてきた「失われた航路」の知識を持つ。
  motivation: 家系の使命を果たし、風の力で世界に新たな航路を示すこと。
  relationships:
  - name: カイ・ヴィルヘルム
    relation: 信頼を寄せる相棒
  - name: ゼファー・ヴォルガード
    relation: 仕事仲間
  arc: 家系の宿命に縛られた少女から、自らの意志で未知の空へ進む航海士へと脱皮する。
- name: ゼファー・ヴォルガード
  role: 脇役/操縦士
  age: 29
  gender: 男性
  appearance: 鋭い眼光と顔に刻まれた古い傷跡。使い込まれた黒い飛行服を着用している。
  personality: 寡黙で現実主義。一見冷たそうに見えるが、仲間を守るためには命を懸ける熱い一面を持つ。一人称は「俺」。
  speech_style: 短く、ぶっきらぼうな命令口調。だが、言葉の端々に優しさが滲む。
  background: かつて空軍のエース操縦士だったが、ある任務の失敗で軍を離れ、今は空賊を追う放浪の操縦士。
  motivation: 過去の罪を償い、真に自由な空を自分の手で飛ばすこと。
  relationships:
  - name: カイ・ヴィルヘルム
    relation: 教え子のような存在
  - name: リナ・エステラ
    relation: 共に戦う戦友
  arc: 過去の失敗による自己嫌悪を乗り越え、再び空への希望を取り戻す。
- name: ヴァルガス・レオン
  role: 敵役
  age: 38
  gender: 男性
  appearance: 隙のない黒い軍服に身を包んだ、威厳のある男。片腕が高度な機械義肢になっている。
  personality: 冷酷で徹底した効率主義者。秩序こそが世界の救済だと信じている。一人称は「私」。
  speech_style: 常に優雅で落ち着いているが、相手を威圧するような冷たい響きがある。
  background: 中央政府の特務機関の長。崩壊する世界を再建するため、灯台の力を利用して全人類を管理下に置こうとしている。
  motivation: 灯台を独占し、重力制御装置を用いて絶対的な秩序を構築すること。
  relationships:
  - name: カイ・ヴィルヘルム
    relation: 秩序を乱す邪魔者
  arc: 絶対的な支配を望む独裁者として、自由を求める一行の最大の障壁となる。
