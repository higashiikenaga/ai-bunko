title: 蒼穹の羅針盤と、銀翼のレクイエム
genre: SF
tone: 爽快、冒険的、情緒的
pov: 三人称
tense: 過去形
setting: 浮遊大陸群が点在する雲海の世界。高度な機械文明と、風の力を利用した航海術が共存する時代。
premise: 雲海の果てに眠るとされる伝説の航路を求め、若き整備士のカイは、翼を持つ旧式の飛空艇『アズール』と共に旅立つ。かつて世界を導いたという『古い灯台』の信号が、数百年ぶりに空から響き渡ったのだ。カイは個性豊かな仲間と共に、風を読み、機械を駆り、空の境界線を突破する壮大な航海へと身を投じる。
themes:
- 未知への挑戦
- 仲間との信頼と絆
- 失われた文明の再生
rules:
- 重力制御エンジンは「風の潮流」を燃料とするため、風の強い場所ほど高速移動が可能になる
- 空飛ぶ船の航路は、特定の高度にある『磁気灯台』によってのみ維持される
- 機械の整備には、操縦士の意志とシンクロする独特の感覚が必要である
plot_outline:
- '序盤: 辺境の浮遊島で飛空艇を修理していたカイが、空から降り注いだ古い灯台の光を感知し、運命の船『アズール』を手に入れる。'
- '中盤: 航海術士の少女や元軍人の操縦士など、志を同じくする仲間が集まり、雲海の嵐や空賊の襲撃を、鮮やかな飛行技術で切り抜けていく。'
- '終盤: 伝説の灯台の真実が、世界の重力を制御する装置であることを知り、崩壊しつつある空の秩序を立て直すための最終航路へ挑む。'
- '結末: 全ての困難を乗り越え、新時代の航路を切り拓いた一行は、さらなる青い空を目指して、未知の雲海の彼方へと加速していく。'
style_notes: 風が機械の翼を撫でる音や、エンジンが咆哮を上げる瞬間の熱量を重視する。空の広大さと、飛空艇が風を切って進むスピード感を、躍動感のある言葉で描写すること。仲間との会話は明るく、困難に直面しても決して折れない意志の強さを感じさせる文体とする。
