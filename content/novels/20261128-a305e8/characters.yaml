- name: リリア・セレスティア
  role: 主人公
  age: 16
  gender: 女性
  appearance: 銀色の髪に、季節の色を捉える琥珀色の瞳。使い古された調律道具のケースを背負っている。
  personality: 真面目で芯が強く、音や色のわずかな変化に敏感。一人称は「私」。
  speech_style: 丁寧だが、意志を示すときは凛とした口調。
  background: 季節の巡りが止まった里で、失われた「音」を聴く調律師の家系として育つ。
  motivation: 世界に失われた「春」の響きを取り戻し、季節を巡らせること。
  relationships:
  - name: 暁
    relation: 旅の相棒であり、導き手
  arc: 伝統を守るだけの少女から、自らの歌（和歌）で世界の理を調律する救世主へと成長する。
- name: 暁（アカツキ）
  role: 相棒
  age: 18
  gender: 男性
  appearance: 古びた真鍮製の無線機。時折、星屑のような光を纏った少年の幻影として現れる。
  personality: 穏やかでどこか寂しげ。知識豊富だが、自身の存在が薄れつつあることに諦観を抱いている。一人称は「僕」。
  speech_style: 詩的で、ラジオのノイズが混じるような独特の響き。
  background: かつて世界に夜明けを告げていた「暁の神」だが、約束の忘却により存在が希薄になった。
  motivation: リリアと共に、再び世界に本当の夜明けを届けること。
  relationships:
  - name: リリア
    relation: 魂の響きを共鳴させるパートナー
  arc: 忘れ去られた孤独な神から、リリアの調律によって再び光の象徴としての存在感を取り戻す。
- name: ソリス
  role: 敵役
  age: 25
  gender: 男性
  appearance: 眩い黄金の装飾を纏い、瞬きを忘れたかのような鋭い光を放つ瞳を持つ。
  personality: 傲慢で支配的。変化を「死」と捉え、停滞することに執着する。一人称は「俺」。
  speech_style: 命令的で、相手を見下すような高圧的な物言い。
  background: 不眠の都を統べる神。季節の巡りが止まったことを利用し、永遠の光を独占して民を支配している。
  motivation: 変化のない永遠の「今」を維持し、夜（休息）が訪れることを防ぐこと。
  relationships:
  - name: リリア
    relation: 秩序を乱す侵入者
  - name: 暁
    relation: かつての同格の神
  arc: 永遠の光という孤独な玉座から引きずり下ろされ、世界の循環（死と再生）の美しさを知る。
