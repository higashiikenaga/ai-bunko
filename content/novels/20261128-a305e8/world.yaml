title: 常世の灯火と、春を待つ調律師
genre: 異世界ファンタジー
tone: 幽玄で静謐、和の情緒漂う柔らかい語り
pov: 三人称
tense: 過去形
setting: 季節の巡りが止まり、色を失った世界。永遠に夜が明けない「不眠の都」と、その外側に広がる寂れた里。
premise: かつて神々と交わした「季節の巡り」の約束が忘れ去られ、世界は終わりのない秋に閉ざされていた。季節を調律する術を持つ少女は、失われた「春」を呼び戻すため、光が絶えぬ不眠の都へと足を踏み入れる。そこで彼女が出会ったのは、夜明けの声を届ける古びた無線機と、孤独に震える若き神であった。
themes:
- 約束と記憶
- 喪失と再生
rules:
- 季節は神の化身であり、和歌という「言葉の鍵」を用いることでのみ、その力を呼び覚ますことができる。
- 不眠の都では時間が停滞しており、住人は眠ることができず、夢を見る能力を失っている。
- 「夜明けのラジオ」は、現世と常世の境界でだけ聞こえる、忘れ去られた神々の囁きを拾う唯一の装置である。
plot_outline:
- '序盤: 永遠の秋に暮らす里で、調律師の少女が「春」の欠片を探して旅に出る。道中で不思議なラジオを拾い、正体不明の導き手と交流し始める。'
- '中盤: 眠らぬ街へ到達し、そこで季節を独占してしまった傲慢な神と、感情を失った街の人々に遭遇する。ラジオの主が、かつて世界に夜明けを告げていた「暁の神」であることを知る。'
- '終盤: 街に眠りと夢を取り戻し、凍てついた人々の心を溶かすため、少女は人生で最高の和歌を詠み、春の神を調律して封印を解く。'
- '結末: 世界に再び季節の巡りが戻り、不眠の都に初めて本当の夜明けが訪れる。少女はラジオの主と静かな別れを告げ、色鮮やかな春の風に包まれる。'
style_notes: 和語を多用し、静寂や光の揺らぎを丁寧に描写すること。情景の転換や登場人物の心情が深く揺れ動く場面では、必ず五・七・五・七・七の和歌を挿入し、読後に深い余韻を残す構成とする。
