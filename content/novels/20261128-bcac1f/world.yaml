title: 猫柳本店の、やさしい忘れもの相談所 ―届かなかった手紙と記憶の栞―
genre: 日常ほのぼの
tone: 軽やかで温かみのある、日常の謎解き
pov: 一人称（わたし）
tense: 現在形および過去形（語り口調に合わせて）
setting: 路地裏の古本屋兼喫茶店「猫柳本店」と、その周辺の街並み
premise: 「記憶市場」の案内人となったわたしのもとに、宛先のない一通の手紙が届きます。それは、誰かが記憶と一緒に預けてしまった「伝えられなかった想い」でした。本と記憶を紐解きながら、バラバラになった人々の縁を、優しく繋ぎ直していきます。
themes:
- 言葉にできなかった善意
- 許しと再生
rules:
- 記憶市場に預けた記憶は、特定の『鍵』となる品物や本を通じてのみ想起できる
- 案内人は記憶を無理に引き出すのではなく、本人が自ら気づくためのヒントを提示する
- 記憶市場に流れた想いは、時に実体を持って店に届くことがある
plot_outline:
- 序盤：案内人としての日常に慣れてきたわたしのもとに、差出人不明の『失われた手紙』が届く。そこには、誰かを許したいが、その理由を忘れてしまったという切ない願いが綴られていた。
- 中盤：手紙の主を探すなかで、折れた玩具の剣を大切に持つ青年が現れる。彼は幼い頃の親友との喧嘩の記憶を市場に売っていたが、折れた剣だけが心に刺さったままだった。
- 終盤：本屋に集まる人々との対話と、店にある古い物語本をヒントに、手紙の主と青年の記憶が交差する。二人がかつて交わした『騎士の約束』と、互いを想うがゆえに選んだ嘘が明らかになる。
- 結末：誤解がほどけ、失われていた善意が心に戻る。折れた剣は直らないけれど、それを抱えたまま生きていける強さを得た人々を、わたしは温かい紅茶と一緒に見送る。
style_notes: 語り口は軽やかで、少しおっとりとした雰囲気。「〜ですけれど」「〜かもしれません」といった柔らかい表現を用い、日常の些細な幸せを丁寧に描写する。
