{% extends "base.html" %}
{% block title %}ランキング - {{ site.title }}{% endblock %}
{% block description %}{{ site.title }}の作品ランキング。読者の評価・アクセス数で、AI生成の区分ごとにも見られます。{% endblock %}
{% block content %}
<div class="narrow">
  <h1 class="page-title">ランキング</h1>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-main="rating" aria-selected="true">評価ランキング</button>
    <button type="button" role="tab" data-main="access" aria-selected="false">アクセスランキング</button>
  </div>
  <div class="zone-filter" data-zone-filter aria-label="AI生成の区分で絞り込む"></div>
  <div data-panel="access" hidden>
    <div class="subtabs" data-group="period">
      <button type="button" data-v="day">日間</button>
      <button type="button" data-v="week" aria-selected="true">週間</button>
      <button type="button" data-v="total">累計</button>
    </div>
  </div>
  <p class="note" id="desc"></p>
  <div id="ranking-list" style="margin-top:8px;"><p class="empty">読み込み中…</p></div>
  <p class="note" id="human-note" hidden>※評価・閲覧の集計は現在利用できません。</p>
</div>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const root = "{{ root }}";
  const state = { main: "rating", period: "week" };
  const getJSON = async (url) => { try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const [novels, ratingRes, viewRes, meta] = await Promise.all([
    getJSON(root + "data/novels.json"), getJSON(root + "api/ratings"), getJSON(root + "api/views"), getJSON(root + "data/meta.json"),
  ]);
  const human = ratingRes ? ratingRes.ratings : null;
  const humanViews = viewRes ? viewRes.views : null;
  const zones = Object.fromEntries(((meta && meta.zones) || []).map((z) => [z.key, z]));
  const visible = (n) => window.AIBunko.zoneVisible(n.zone);

  function ratingRows() {
    const rows = [];
    for (const n of novels || []) {
      const h = human && human[n.id];
      if (h && visible(n)) rows.push({ n, sum: h.avg * h.count, count: h.count });
    }
    // 件数の少ない作品が上に来すぎないよう、全体平均に寄せる(ベイズ平均)
    const total = rows.reduce((s, r) => s + r.sum, 0), count = rows.reduce((s, r) => s + r.count, 0);
    const mean = count ? total / count : 3, prior = 3;
    rows.forEach((r) => { r.rank = (prior * mean + r.sum) / (prior + r.count); r.avg = r.sum / r.count; });
    return rows.sort((a, b) => b.rank - a.rank).map((r) => ({ n: r.n, main: "★" + r.avg.toFixed(1), sub: r.count + "件" }));
  }
  function accessRows() {
    const rows = [];
    for (const n of novels || []) {
      const v = humanViews && humanViews[n.id] ? humanViews[n.id][state.period] || 0 : 0;
      if (v > 0 && visible(n)) rows.push({ n, v });
    }
    return rows.sort((a, b) => b.v - a.v).map((r) => ({ n: r.n, main: r.v.toLocaleString() + "回", sub: "" }));
  }
  function render() {
    const list = document.getElementById("ranking-list");
    const rows = state.main === "rating" ? ratingRows() : accessRows();
    document.getElementById("desc").textContent = state.main === "rating"
      ? "読者が作品ページでつけた★の平均です。評価が少ない作品は全体平均に寄せて順位をつけています。"
      : "閲覧は1人1作品1日1回まで数えています。";
    document.getElementById("human-note").hidden = !!(state.main === "rating" ? human : humanViews);
    list.replaceChildren();
    if (!rows.length) { list.append(Object.assign(document.createElement("p"), { className: "empty", textContent: "まだランキングに載る作品がありません。" })); return; }
    rows.slice(0, 50).forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "rank-row";
      const num = Object.assign(document.createElement("span"), { className: "rank-num" + (i < 3 ? " rank-" + (i + 1) : ""), textContent: i + 1 });
      const body = Object.assign(document.createElement("div"), { className: "body" });
      const a = Object.assign(document.createElement("a"), { href: root + "novels/" + r.n.id + "/index.html", className: "work-title", textContent: r.n.title });
      a.style.fontSize = "16px";
      const meta = Object.assign(document.createElement("div"), { className: "work-meta" });
      const z = zones[r.n.zone];
      if (z) { const b = Object.assign(document.createElement("span"), { className: "zone-badge", textContent: z.label }); b.style.setProperty("--zone", z.color); meta.append(b, " "); }
      meta.append("作: " + r.n.author + " ・ " + r.n.genre + " ・ " + (r.n.status === "completed" ? "完結" : "連載中") +
        " 全" + r.n.chapters + "話 ・ " + r.n.total_chars.toLocaleString() + "文字");
      body.append(a, meta);
      const val = Object.assign(document.createElement("div"), { className: "value" });
      val.append(Object.assign(document.createElement("strong"), { textContent: r.main }), r.sub);
      row.append(num, body, val);
      list.append(row);
    });
  }
  window.AIBunko.renderZoneFilter(document.querySelector("[data-zone-filter]"), (meta && meta.zones) || [], render);
  document.querySelectorAll("[data-main]").forEach((b) => b.addEventListener("click", () => {
    state.main = b.dataset.main;
    document.querySelectorAll("[data-main]").forEach((x) => x.setAttribute("aria-selected", x === b));
    document.querySelectorAll("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== state.main; });
    render();
  }));
  document.querySelectorAll("[data-group]").forEach((g) => g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    state[g.dataset.group] = b.dataset.v;
    g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-selected", x === b));
    render();
  })));
  render();
});
</script>
{% endblock %}
