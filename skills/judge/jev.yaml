# typesafe/jev(Cloudflare Workers AI)用の採点ルール。
# Jev は文章を書かず、state(採点する章)に対して各 score の質問に答え、criteria の何段目かを確率つきで返す。
# criteria は 0 から数えて10段(0〜9)。サイトでは +1 して1〜10点として、ほかの審査モデルと同じ目盛りで扱う。
# 目盛りの基準: 6(=criteria の5段目)が「商業ウェブ小説の平均的な1話」。
instructions_common: >-
  これは日本語のウェブ小説の1話です。state の「本文」だけを根拠に評価し、書いたモデルや作家を推測しない。
  「ここまでの流れ」は一貫性の判断にだけ使う。欠点がはっきりあれば遠慮なく低い段にする。
questions:
  structure:
    instructions: 文章構造力。1話の中の起承転結、場面転換、段落の組み立て、話の終わりの引きの強さ。
    criteria:
      - "1: 話として成立していない。場面がつながらず、何が起きたか分からない"
      - "2: 出来事の羅列で、山も区切りもない。途中で唐突に終わる"
      - "3: 流れはあるが、冗長か急ぎすぎで、場面の切り替えが混乱している"
      - "4: 一応の起点と終わりはあるが、展開が平板で引きが弱い"
      - "5: 起点・展開・終わりがそろうが、配分に偏りがあり印象が薄い"
      - "6: 平均的なウェブ小説の1話。区切りがはっきりし、次を読む理由が一応ある"
      - "7: 場面配分がよく、緩急があり、終わりの引きが効いている"
      - "8: 構成が引き締まり、伏線や見せ場の置き方がうまい"
      - "9: 無駄な場面がなく、1話として完成度が高い。強く次を読みたくなる"
      - "10: 商業作品の傑作回に並ぶ構成。構造そのものが物語の魅力になっている"
  japanese:
    instructions: 日本語力。文法・語彙・表記の正確さ、不自然な言い回しや翻訳調の少なさ、同じ語尾や表現の繰り返しの少なさ、文のリズム。
    criteria:
      - "1: 日本語として読めない箇所が多い。文字化け・別言語の混入・文の崩壊"
      - "2: 文法の誤りや意味の通らない文が頻繁にある"
      - "3: 誤りは少ないが、翻訳調・不自然な語の選び方が目立つ"
      - "4: 読めるが、同じ語尾・言い回しの反復や過剰な修飾が気になる"
      - "5: おおむね自然だが、単調で平凡な文章"
      - "6: 平均的なウェブ小説の文章。自然で読みやすい"
      - "7: 語彙が適切で、地の文と会話文のリズムがよい"
      - "8: 表現が的確で印象に残る文がある。文体に個性がある"
      - "9: 洗練された日本語。一文一文に無駄がなく、文体が作品世界を支えている"
      - "10: プロの文章家として最上級。そのまま出版できる"
  character:
    instructions: 人物描写。人物の言動の一貫性、口調の書き分け、感情や動機の説得力。
    criteria:
      - "1: 人物の区別がつかない、または言動が支離滅裂"
      - "2: 人物が記号的で、感情も動機も見えない"
      - "3: 役割は分かるが、口調が書き分けられておらず平板"
      - "4: 人物に個性はあるが、感情の動きが説明的で説得力が弱い"
      - "5: 人物は成立しているが、ありきたりで印象が薄い"
      - "6: 平均的なウェブ小説の人物描写。誰が誰か分かり、行動に理由がある"
      - "7: 口調と態度で人物が立ち、感情の動きに納得できる"
      - "8: 人物に奥行きがあり、関係性の変化が魅力的に描かれている"
      - "9: 人物が生きているように感じられ、強く感情移入できる"
      - "10: 忘れられない人物造形。商業作品の名キャラクターに並ぶ"
  originality:
    instructions: 独創性。設定・展開・表現の新しさ。ありがちな型にとどまっていないか。
    criteria:
      - "1: 既存作品のなぞりに近く、独自の要素がない"
      - "2: 使い古された展開と表現だけでできている"
      - "3: 定番の型どおりで、意外性がほとんどない"
      - "4: 小さな工夫はあるが、全体としてはありがち"
      - "5: 定番の型に、少しだけ独自の味付けがある"
      - "6: 平均的なウェブ小説。型を使いつつ、この作品らしさが一応ある"
      - "7: 設定か展開に、はっきりした新しさがある"
      - "8: 予想を裏切る展開や、独自の視点・表現が光る"
      - "9: 強く記憶に残る独創的なアイデアが、物語の中心で生きている"
      - "10: ジャンルの型を更新するほど新しい"
  consistency:
    instructions: 一貫性。「ここまでの流れ」やあらすじとの矛盾、1話の中での設定・人物・時系列の矛盾がないか。
    criteria:
      - "1: 前の話や設定と根本的に矛盾し、別の話になっている"
      - "2: 重大な矛盾(死んだ人物の再登場、設定の反転など)が複数ある"
      - "3: 目立つ矛盾がある(名前・関係・場所の取り違えなど)"
      - "4: 小さな矛盾や説明のない飛躍がいくつかある"
      - "5: 大きな矛盾はないが、つながりがやや不自然"
      - "6: 平均的なウェブ小説。前の流れと自然につながっている"
      - "7: 設定と人物が安定し、前の話の出来事を踏まえている"
      - "8: 前の話の要素を活かし、世界のルールが一貫している"
      - "9: 細部まで矛盾がなく、積み重ねが効果を上げている"
      - "10: 完璧な一貫性。過去の細部が見事に回収されている"
