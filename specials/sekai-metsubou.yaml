parts:
  - part: 1
    title: 世界滅亡と魔法と科学的な恋
    premise: >-
      政略結婚で結ばれた王子アートラーと、銀髪碧眼の令嬢ルナ。優雅な王妃として彼に寄り添うルナは、本当に彼を愛していた。
      しかし王国では、古代遺構にまつわる不可解な事件が起き始める。すべての糸の先にいたのは、記憶を失ったルナ自身だった。
    ending: 「愛しているからこそ、許すことができない」
    chapters:
      - 政略結婚の日。王都の大聖堂で、アートラーは初めて間近にルナと向き合う。儀礼どおりの誓いの中、ルナは誓いの言葉を一語だけ変える(「あなたの世界を、わたくしが守ります」)。祝宴の片隅でセレスティアが二人を見つめている。
      - 新婚の日々。ルナは外交の場で才を見せ、隣国の大使を言葉ひとつで味方につける。完璧な王妃ぶりの裏で、夜ごと彼女は「思い出せない夢」にうなされる。アートラーは彼女の手の冷たさが気になり始める。
      - 王都地下の魔導遺構で、調査中の学者が相次いで倒れる事件。アートラーが視察に行くと、なぜかルナが遺構の構造に詳しい。本人も「なぜ知っているのか分からない」と戸惑う(伏線)。
      - ルナとアートラーが夜の庭園で初めて本音を話す。ルナは「あなたを誰にも渡したくない」と冗談めかして言い、アートラーはその言葉の重さに惹かれながらも少しだけ怖くなる。
      - 宮廷魔導学者ヴィクトル・ケインが登場。魔導科学の研究会でルナと視線を交わす二人に、アートラーは説明のつかない違和感を覚える。セレスティアはヴィクトルの研究資金の流れを調べ始める。
      - 王国北部で魔素の枯渇が起き、村の井戸と灯りが止まる。アートラーとルナは視察に赴き、ルナは村人の子どもに優しく魔法の灯をともす。その優しさは本物だと、アートラーは確信する。
      - セレスティアがアートラーに、遺構事件の資料を差し出す。「殿下の奥方に、近づきすぎないでください」。幼なじみの忠告に、アートラーは初めて彼女の想いの深さに気づくが、言葉にできない。
      - ルナの誕生日の夜会。二人が踊る最中、遺構の方角で空が白く光る。ルナは激しい頭痛に倒れ、うわごとで「まだ早い」とつぶやく。アートラーはその言葉を聞いてしまう。
      - ヴィクトルがひそかにルナを訪ね、封じられた記憶の鍵となる古い手記を渡す。ルナは読むことを拒むが、手記の筆跡は自分のものだった。
      - 【中盤の転換】ルナの記憶が戻る。自分が「黄昏計画」——白の天蓋で世界を白紙に戻す計画——の首謀者であり、結婚前に自ら記憶を封じたことを知る。彼女が最初に思ったのは、世界のことではなくアートラーのことだった。
      - 記憶を取り戻したルナは、何事もなかったように王妃として振る舞う。けれど、アートラーへの愛情はかえって激しくなる。「あなたを苦しめるこの世界なんて、なくなればいい」。彼女の歪んだ愛の論理が初めて言葉になる。
      - セレスティアとアートラーが遺構の最深部で、計画の全容と首謀者の名を見つける。アートラーは妻の名を前に立ち尽くす。セレスティアは彼の手を握り、「逃げないでください」と言う。
      - 対決。白の天蓋の起動を目前に、アートラーはルナと向き合う。ルナは本心を隠さない。「愛しているから、壊すのです」。アートラーは彼女を憎みきれず、それでも止めると告げる。
      - 天蓋は止められ、ルナとヴィクトルは捕らえられる。裁きの場で、ルナは自己弁護をせず、ただアートラーへの愛だけは偽りでなかったと言う。国王エドガーは王として極刑を宣告する。
      - 【第1部 結末】処刑の前夜、牢の格子越しに最後の会話。二人は手を取り合うが、アートラーは許すとは言わない。「愛しているからこそ、許すことができない」。夜明け、鐘の音と白い光。直接の場面は描かず、残された者の沈黙と余韻で締める。
  - part: 2
    title: Rebirth
    premise: >-
      処刑から三年。石の眠りから目覚めたルナは、かつての彼女ではなかった。自分が奪おうとした人々の生と痛みを見続けた彼女の前に、
      新しい人生を歩み始めたアートラーと、彼を守ろうとするセレスティアが現れる。悪人が改心すれば、すべて許されるのか。
    ending: ルナ自身が、自分の意思でアートラーを自由にする
    chapters:
      - 処刑から三年。ファーバー家の古い霊廟で、ルナは石の眠りから目覚める。呪い「贖いの眠り」の中で見続けた、自分が奪おうとした人々の生活と痛みの記憶が、胸に残っている。鏡の中の自分を、彼女はまだ許せない。
      - 名を伏せ「ルーナ」としてファーバー家の縁者を装い、王都の外れで暮らし始める。市場で見かける人々一人ひとりの顔が、眠りの中で見た顔と重なる。王太子アートラーとセレスティアの婚約の噂を耳にする。
      - 王立施療院で、ルナは身分を隠して魔素治療の手伝いをする。そこへ視察に来たアートラーと再会する。アートラーは死んだはずの妻を前に言葉を失い、ルナは「人違いです」と微笑んで去ろうとする。
      - アートラーはルナを追い、夜の川辺で向き合う。ルナは生きている理由を語り、かつてのように彼を求めない。「あなたの人生に、もう入り込みません」。その言葉が、かえってアートラーの心を揺らす。
      - セレスティアがルナの正体に気づく。二人だけの対面。セレスティアは「あなたは過去の罪を持つ人です。殿下に近づかないで」と告げる。ルナは反発しながらも、その言葉の正しさを否定できない。
      - アートラーはセレスティアとの婚約を守りながら、ルナへの感情を消せない。王宮の書庫で、かつてルナが好んだ魔導書を手に取ってしまう自分に気づく。セレスティアはそれを見て、何も言わない。
      - 王国で魔導機関の事故が起き、施療院に負傷者が運び込まれる。ルナは黄昏計画で得た知識を、初めて人を救うために使う。助けた少女の母親が、ルナの素性を知らずに礼を言う。ルナは「感謝される資格はない」と一人泣く。
      - ルナの生存が貴族たちに露見し、「処刑された大罪人を裁き直せ」という声が上がる。セレスティアは正しい手続きとして、ルナを王都から追放する案を議会に出す。正しさと私情の境目を、彼女自身も見失い始める。
      - 議会の前夜、アートラーはルナのもとへ行く。二人は昔のように手を取りかけるが、ルナは自分から手を離す。「わたくしが欲しかったのは、あなたの人生ではなく、あなたでした。だから、あなたの人生は返します」。
      - 【第2部 結末】ルナは議会の裁きを待たず、自らの意思で王国を去る。港の桟橋でアートラーに見送られ、タイン共和国行きの船に乗る。それは敗北ではなく、彼女が初めて選んだ「相手を自由にする愛」。アートラーはセレスティアの待つ王宮へ戻る。
  - part: 3
    title: Epilogue
    premise: >-
      数年後。タイン共和国の港町で、28歳のルナは娘ルリを育てながら、交易と医療で町を支えていた。
      一方、アートラーと結ばれたセレスティアは、子に恵まれない焦りを抱えていた。ファーバー家の次期当主として王国へ戻ったルナが差し出したのは、世界を救う技術だった。
    ending: 三人それぞれが、自分の選択の結果を背負って生きていく
    chapters:
      - タイン共和国の港町エルム。28歳のルナは商会をまとめ、娘ルリと暮らしている。朝市の喧騒、潮の匂い、帳簿と診療所。「元・世界滅亡計画の黒幕」だった女は、町では「銀の商会長」と呼ばれている。
      - ルリはタインの疫病で家族を失い、ルナに引き取られた子。夜、ルリに「お母さまの昔のお話」をせがまれ、ルナは言葉を選びながら「悪いことをした王妃の話」を語る。家族としての絆を丁寧に描く。
      - ルナは医師ミナ・ホルストや技術者たちを町に招き、診療所と工房を開いている。魔素医学と工学を組み合わせた治療の現場。ルナは「償い」ではなく「今ここにいる人のため」に働くようになった自分に気づく。
      - 一方ハルバード王国。王となったアートラーと王妃セレスティア。セレスティアは子に恵まれず、宮廷の視線と後継者問題に追い詰められていく。アートラーの気遣いさえ、彼女には「正しくない自分」を責める声に聞こえる。
      - ファーバー家当主が病に倒れ、次期当主としてルナに王国へ戻るよう手紙が届く。ルナはルリの手を握り、戻ることを決める。かつて世界を壊そうとした国へ、今度は何を持ち帰るのか。
      - ルナは交易使節団を率いて王国へ戻る。王宮での再会。アートラーとセレスティアを前に、ルナは臣下の礼をとる。三人の間に流れる年月の重さ。ルリは王宮の庭で無邪気に走り回る。
      - 使節団の医師ミナが、セレスティアの不調が「魔素循環症」という治療可能な病であると見抜く。ルナの差し出した治療を、セレスティアは「あなたの施しは受けない」と拒む。
      - アートラーの説得で、セレスティアは治療を受け入れる。回復の兆しが見えても、セレスティアの心は晴れない。「私が正しかったはずなのに、なぜ救うのはあの人なの」。彼女の執着が静かに育っていく。
      - ルナの使節団は、タインの進んだ魔導科学(魔素灯の送電網、船の魔導機関、医学)を王国に提供する。かつて世界を壊そうとした女が、世界を救う側に立つ皮肉と重さ。貴族たちの評価も割れる。
      - アートラーとルナが、技術交流の式典のあとに二人きりで話す。昔の感情が一瞬よみがえるが、ルナは穏やかに線を引く。「あなたがいなくても、わたくしは誰かを守って生きていけます」。アートラーは初めて、その言葉を祝福として受け取る。
      - セレスティアは二人の会話を遠くから見てしまう。彼女は「正しさ」の名の下に、ルナを排除する理由を探し始める。側近に、ファーバー家の過去の記録を洗わせる。
      - 【暗殺未遂】王宮の晩餐会で、セレスティアはルナの杯に毒を仕込ませる。気づいたミナとルリのひと言で計画は失敗する。残酷な描写はせず、杯が床に落ちる音と、凍りついた広間の沈黙で描く。
      - セレスティアは罪を認める。「私は正しい愛を選んだはずでした」。国外追放が決まる。ルナは彼女を罰せよとは言わない。「もう誰かを消すことで、自分の居場所を守る必要はないのです」。セレスティアの転落を、悪人の末路ではなく悲劇として描く。
      - 追放の日。ルナとセレスティアが最後に言葉を交わす。互いの「愛」の答えがどう違ったのかを、二人はようやく理解する。アートラーはセレスティアを見送り、自分が二人の女性の人生を決めようとしていたことに気づく。
      - 【第3部・シリーズ結末】ルナはファーバー家の当主として王国とタインを結び、ルリとともに港へ帰る。アートラーは王として一人で立つ。「誰かに愛されること」と「誰かの人生を所有すること」は違うと知った三人が、それぞれの選択を背負って生きていく。海と灯りの情景で静かに締める。
