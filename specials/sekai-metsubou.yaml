# 特別企画「AI×運営の考えた設定」
# 運営が設定と全話の構成表を用意し、本文はAI文庫のAIが1話ずつ書く。
# 第1部が完結すると第2部、第2部が完結すると第3部が自動で始まる(ainovel/special.py)。
id: sekai-metsubou
series_title: 世界滅亡と魔法と科学的な恋
label: AI×運営の考えた設定
author: Faber Works@AI文庫公式
chapter_chars: 3500
# 特別企画は、前の話から最低これだけ時間をあけて1話ずつ更新する
min_hours_between: 1.5

# 全話に共通する執筆方針(毎話のプロンプトに入る)
policy: |
  - 全年齢向け。露骨な性的描写は書かない。恋愛は会話・視線・距離感・手を取る・抱擁・別れで表す。
  - 残虐な場面は直接描かず、結果・心理・余韻で表す。流血や拷問の細部は書かない。
  - 原作(架空の美少女ゲーム三部作)のダークな雰囲気は残す。軽いコメディにしない。
  - 政治・魔法・科学・恋愛を同じ世界の中で自然に混ぜる。設定を地の文でまとめて説明しない。
  - ルナを「ツンデレ」「ヤンデレ」「悪役令嬢」の型にしない。悪いことをした事実ははっきり書き、彼女の感情そのものは否定しない。
  - セレスティアも単純な善人・悪人にしない。二人は「愛すること」に異なる答えを持つ人物として描く。
  - アートラーは軽薄にしない。その時々で本当に相手を想っているが、自分の気持ちを理解するのに時間がかかる人物。
  - 作品全体の問い: 愛とは、相手を自分のものにすることではなく、相手が自分の意思で生きることを認めることなのか。

world:
  genre: 特別企画
  tone: 気品と陰りのある王宮ロマンス。静かな心理描写と、政治・魔導科学の緊張感
  pov: 三人称。主にアートラーの視点、ときにルナ・セレスティアの視点に寄る
  tense: 過去形
  setting: >-
    魔法と科学が共存する架空世界。大陸西方のハルバード王国は古い魔法の伝統を持つが、魔法と科学の融合(魔導科学)は発展途上。
    海の向こうの島国タイン共和国は商業・航海・医療・工学が進み、分野によっては王国より先を行く。
    王国には、滅びた古代文明が遺した魔導遺構が点在している。
  rules:
    - 魔法は「魔素」を体内で編む技術。貴族ほど魔素が強い傾向がある。科学と組み合わせた魔導機関は研究途上で、暴走の危険がある
    - 王都地下には古代文明の遺構「白の天蓋(しろのてんがい)」が眠る。起動すると大陸中の人々を魔素ごと眠りに沈め、世界を「白紙に戻す」と伝わる
    - ルナの人類滅亡計画は「白の天蓋」を起動する計画(黄昏計画)。協力者は宮廷魔導学者ヴィクトル・ケイン
    - ルナは結婚前、自分の手で計画の記憶を封じる魔法をかけた(罪の意識なくアートラーを愛するため)。計画自体は時限式で進み続けていた
    - 処刑の瞬間、「白の天蓋」の残滓がルナに呪い「贖いの眠り」をかける。彼女は石の眠りの中で、自分が奪おうとした人々の生と痛みを長い年月をかけて見続け、三年後に目覚める
    - 蘇ったルナは法の上ではすでに死者。名を伏せ、ファーバー家の縁者「ルーナ」として生きる
    - 王国では王族・貴族の結婚は政治であり、家同士の同盟と外交を意味する
    - タイン共和国は身分より契約と実績を重んじる。女性の商会長や医師も多い
  premise: >-
    政略結婚で結ばれた王子アートラーと、銀髪碧眼の貴族令嬢ルナ。優雅な王妃として彼に寄り添うルナは、本当に彼を愛していた。
    ——ただひとつ、彼女自身も忘れていたことがある。世界を滅ぼす計画の首謀者が、ほかならぬ自分だったこと。
    魔法と科学、王侯貴族の政治、そして二人の女性の対照的な「愛」をめぐる、全三部の物語。
  themes:
    - 愛することと、相手の人生を所有することの違い
    - 罪と贖罪。過去の罪を背負った人間に、やり直す権利はあるのか
    - 正しさと執着
    - 家族としての絆
    - 魔法と科学、国と国の交流
  style_notes: 抑制の効いた気品ある文体。感情は仕草・沈黙・視線で語らせる。王宮の儀礼や外交の言葉づかいに重みを持たせる。

